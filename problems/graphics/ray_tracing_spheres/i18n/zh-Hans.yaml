source_hash: f1078e5d3894
title: 球体的光线追踪
summary: 一个小型 Whitted 风格光线追踪器，每个像素的光线是 $(H\cdot W, 3)$ 张量中的一行。所有光线用二次求根公式同时与所有球体求交，得到一张（光线 $\times$ 球体）表，其 argmin 就是可见表面。包括 Lambert 和 Blinn–Phong 着色、由第二批阴影光线产生的硬阴影、镜面反弹以及棋盘格地面，光源或相机绕场景旋转。
notes: 像素颜色为 $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$，其中 $m$ 是表面的镜面反射比例；反射颜色来自对这批反射光线再次追踪，这就是 Whitted（1980）的递归思想。着色模型是 Phong（1975）的模型，加上 Blinn（1977）的半程向量 $\hat{\mathbf h}$。由于 $\hat{\mathbf d}$ 是单位长度，二次方程的首项系数为 1，因此只需要 $b$ 和 $q$。次级光线从离表面极小距离 $\varepsilon$ 处出发，否则舍入误差会使它们击中自己所在的球体（阴影痤疮）。试试零次反弹以查看无反射的场景、较高的光泽度以得到小而锐利的高光，或者较宽的视场。真正的渲染器会加入软阴影、折射和每像素多次采样（路径追踪），但批量的“光线对所有物体”求交表保持不变。
meanings:
- 穿过像素 $p$ 的光线的起点和单位方向；$d$ 是相机基下的屏幕点 $(x, y, 1)$，即对基索引的 einsum
- 球体 $s$ 的球心和半径
- 重复的 $i$ ⇒ 求和：每条光线在一次调用中与每个球体求交
- 二次方程较近的根；$b^2 < q$（光线未命中）或交点在后方时为 $\infty$
- 可见表面；地平面 $y = 0$ 是额外的一列，$t = -o_y/d_y$
- 漫反射与镜面反射因子，背面截断为 0
- 射向光源的阴影光线：到达光源前未击中任何球体则为 1，否则为 0
- 重复的 $j$ ⇒ 求和：镜面反射方向，即下一批光线
labels:
  orbit: 环绕对象
  bounces: 镜面反弹次数
  shininess: Blinn–Phong 指数 $\alpha$
  fov: 视场
  width: 图像宽度
  height: 图像高度
  frames: 每圈帧数
