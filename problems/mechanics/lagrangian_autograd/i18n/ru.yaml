source_hash: bd0f5adb6f78
title: Лагранжиан и autograd
summary: 'Задайте только лагранжиан $L = T - V$, и torch.autograd сам выведет уравнения Эйлера–Лагранжа: гессиан $\partial^2L/\partial\dot q_i\partial\dot q_j$ — это матрица масс, а одно решение линейной системы даёт $\ddot q$. Пример — пружинный (упругий) маятник.'
notes: 'Ни одно уравнение пружинного маятника не написано вручную: измените лагранжиан, и динамика изменится вслед за ним. Здесь $H = \operatorname{diag}(m, mr^2)$ зависит от $r$, а $C$ содержит кориолисоподобную связь $2mr\dot\theta$. При значении по умолчанию $k \approx 3mg/\ell_0$ частота пружины примерно вдвое больше частоты качаний (резонанс 2:1), поэтому энергия перетекает между продольными и маятниковыми колебаниями. Тот же код работает для любого числа координат; цена — несколько дополнительных обратных проходов на шаг.'
meanings:
- 'обобщённые координаты $(r, \theta)$: длина пружины и угол'
- обобщённые скорости
- единственная физика, заданная вручную
- первые производные; $p_i = \partial L/\partial\dot q_i$ — канонический импульс
- строка $i$ матрицы масс и смешанных вторых производных
- повторяющийся $k$ ⇒ суммирование
- уравнения Эйлера–Лагранжа, решённые относительно ускорений
- функция энергии, тоже через autograd; сохраняется
labels:
  m: Масса $m$
  k: Жёсткость пружины $k$
  rest_length: Длина в покое $\ell_0$
  r0: Начальная длина $r_0$
  theta0: Начальный угол $\theta_0$
  t_max: Время моделирования
