source_hash: adf3aca0e79d
title: '양성자 치료: 브래그 봉우리'
summary: 베테–블로흐 저지능 $-dE/dz \propto 1/\beta^2$을 여러 양성자 에너지의 배치 전체에 대해 RK4로 한꺼번에 적분합니다. 선량은 각 양성자가 멈추기 직전에 몰려 쌓이고(브래그 봉우리), 에너지 층들의 가중합은 종양 전체에 고른 선량을 주면서 그 뒤에는 거의 아무것도 남기지 않습니다.
notes: '물에 대한 상수: $K = 0.307$ MeV cm²/mol, $Z/A = 0.555$, $I \approx 75$ eV, $\rho = 1$ g/cm³. 껍질 보정과 밀도 보정은 무시합니다. 적분한 비정(150 MeV → 약 15.8 cm)은 NIST PSTAR와 약 1% 이내로 일치하며, $p \approx 1.75$인 브래그–클리먼 규칙 $R = \alpha E^p$에 잘 맞습니다. 비정 흩어짐($R$의 $\sigma \approx 1.2\,\%$)과 빔 에너지 퍼짐이 봉우리를 둥글게 만듭니다. 핵반응은 1차 입자가 1%/cm씩 손실되는 것으로만 모형화했으므로 봉우리 대 입사 선량비가 실제 빔보다 높습니다. 같은 종양 선량으로 정규화한 메가볼트 X선 빔(빌드업 후 $e^{-\mu z}$)은 입사부에 더 많은 선량을 주고 종양 너머로도 계속 나아가지만, 양성자는 멈춥니다. 모든 수치는 근삿값이며 교육용일 뿐, 임상이나 치료 계획에 쓰면 안 됩니다.'
meanings:
- 모든 깊이 단계에서 빔 $b$의 운동 에너지(RK4, 모든 빔을 함께)
- 베테–블로흐 $-dE/dz$(MeV/cm), 배치에 대해 원소별 계산
- '순수 선량: 깊이 구간 $k$에서 cm당 잃는 에너지'
- 가우스형 비정 흩어짐 + 에너지 퍼짐, 행 정규화
- '반복된 $k$ ⇒ 합: 흐려진 브래그 곡선'
- '반복된 $k$ ⇒ 합: $K$개 에너지 층으로 만든 확장 브래그 봉우리(SOBP)'
- 고른 표적 선량을 위한 비음수 최소제곱(사영 경사법)
labels:
  e_min: 최저 빔 에너지
  e_max: 최고 빔 에너지
  n_energies: 스윕의 빔 수
  target_start: 종양 시작 깊이
  target_end: 종양 끝 깊이
  n_layers: SOBP 에너지 층 수
  energy_spread: 빔 에너지 퍼짐 $\sigma_E/E$
  i_ev: 평균 들뜸 에너지 $I$
