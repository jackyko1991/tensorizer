source_hash: 85a6136cffba
title: 층상 매질에서의 스넬 법칙
summary: 광선 다발이 굴절률이 서로 다른 세 층을 지납니다. 벡터 형태의 스넬 법칙이 einsum 하나로 모든 광선을 한꺼번에 굴절시키고, 전반사가 일어나는 곳에서는 거울 반사로 바꿉니다.
notes: 광선은 속력 $c/n$으로 진행하므로 광선 끝을 잇는 점선은 파면입니다. 밀한 층에서는 뒤처집니다. 기본값에서 맨 아래 층은 공기($n = 1$)이며, 그 경계면에서 임계각 $\arcsin(n_3/n_2)$보다 가파른 광선은 전반사되어 다시 위로 향합니다. 두 굴절률을 같게 하면 경계면이 사라집니다.
meanings:
- 광선 $r$의 단위 방향, 성분 $i \in \{x, y\}$
- 입사 광선 쪽을 향하는 단위 면 법선
- 각 광선이 닿는 경계면에서의 굴절률 비 $n_1/n_2$
- '반복된 $j$ ⇒ 합: 각 광선의 $\cos\theta_i$'
- 굴절된 방향(여전히 단위 벡터)
- 거울 반사 방향, $1 - \eta^2(1 - c^2) < 0$ (전반사)인 곳에서 사용
labels:
  n1: 위층 굴절률 $n_1$
  n2: 가운데 층 굴절률 $n_2$
  n3: 아래층 굴절률 $n_3$
  n_rays: 광선 다발의 광선 수
  max_angle: 가장 넓은 광선 각
  t_max: 시뮬레이션 시간
