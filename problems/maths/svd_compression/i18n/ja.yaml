source_hash: 7d50d95577a3
title: SVD による画像圧縮
summary: 特異値分解は画像を、強いものから順に並んだランク 1 の層 $\sigma_r\,\mathbf u_r\mathbf v_r^T$ の和として書く。$k$ 層だけを残したものが最良のランク $k$ 近似であり、その誤差は捨てた特異値のエネルギーにちょうど等しい。カラー画像は三つの行列で、一回のバッチ呼び出しで分解される。
notes: $H\times W$ 画像の $k$ 層を保存するには $HW$ 個ではなく $k(H + W + 1)$ 個の数が必要なので、圧縮率は $HW / k(H + W + 1)$ である。エッカート–ヤングの定理によれば、フロベニウスノルムで $A$ により近いランク $k$ 行列は存在せず、誤差は残さなかった特異値の二乗和である。ターミナルはこれを、いくつかの $k$ について実際に再構成した画像と照合する。シーンの滑らかな部分（空のグラデーション）は最初の数層で捉えられるが、鋭いエッジ、斜め線、文字には多くの層が必要である。だから特異値は最初は急速に、その後はゆっくり減衰し、JPEG は代わりに局所的なコサイン変換を使う。最初の層はおおよそ平均的な明るさのプロファイルであり、後の層は符号を交互に変えて（赤と青）細部を加える。画像は手続き的に描くので、何もダウンロードしない。より大きな画像や、より高い最大ランクを試してみよう。
meanings:
- matplotlib で描いたシーンのチャネル $c$、行 $i$、列 $j$、値は $[0, 1]$
- $c$ の繰り返し ⇒ 和：重み $(0.299, 0.587, 0.114)$ による輝度
- チャネルごとに一つの SVD、先頭の添字 $c$ についてバッチ化；$R = \min(H, W)$
- $r \le k$ の繰り返し ⇒ 和：最初の $k$ 個のランク 1 の層
- 繰り返しの添字なし：灰色画像の外積の層一つ
- すべての $k$ についてのエッカート–ヤング誤差を一度に、画像を再構成せずに
- ピーク信号対雑音比（dB）、平均二乗誤差は捨てた $\sigma$ から
labels:
  size: 画像サイズ（ピクセル）
  k_max: 表示する最大ランク $k$
  frames: アニメーションのフレーム数
