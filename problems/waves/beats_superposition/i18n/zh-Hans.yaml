source_hash: 2765022e4b7f
title: 拍与群速度
summary: 把两个（或多个）频率相近的正弦波相加。所有波存放在一个以波 $s$、时间 $n$ 和位置 $j$ 为指标的张量中；对 $s$ 的一次 einsum 将它们叠加。在固定点上可以听到频率为 $|f_1 - f_2|$ 的拍；在空间中，载波波峰以相速度移动，而包络以群速度移动。
notes: 对两个波，$\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$：慢变包络内是平均频率的快速载波。响度 $|{\rm envelope}|$ 每秒达到峰值 $|f_1 - f_2|$ 次，即拍频。对色散关系 $\omega = c_0 k_0 (k/k_0)^p$，群速度是相速度的 $p$ 倍：弦上的声波两者相等（$p = 1$），深水波为一半（$p = \tfrac12$），毛细波为一倍半（$p = \tfrac32$）。红点随波峰以 $v_p$ 运动，绿点随包络峰以 $v_g$ 运动。多于两个波时，拍变成孤立的波群。
meanings:
- 波 $s$ 的角频率和波数，由色散关系 $\omega \propto k^p$ 联系
- 计算波的位置和时刻
- 通过广播得到每个波在每个时刻和位置的相位
- 重复的 $s$ ⇒ 求和：叠加
- 包络：相量之和的长度
labels:
  f1: 频率 $f_1$
  f2: 频率 $f_2$
  n_waves: 波数（频率分布在 f1 到 f2 之间）
  dispersion: 色散指数 $p$ = 1、½、3/2
  t_max: 模拟时长
