source_hash: 045c5b4ab526
title: 4-운동량과 2체 붕괴
summary: 움직이는 입자가 둘로 붕괴합니다. 정지 좌표계에서 생성물은 일정한 운동량 $p^*$로 서로 반대 방향으로 날아갑니다. 로렌츠 부스트 $\Lambda^\mu{}_\nu$(einsum 하나)가 모든 붕괴 각을 한꺼번에 실험실 좌표계로 옮기며, 그곳에서 운동량은 앞쪽으로 쏠립니다. 민코프스키 계량 $\eta_{\mu\nu}$는 생성물의 4-운동량을 다시 어미 입자의 질량으로 바꿉니다. 새로운 입자를 발견하는 데 쓰이는 불변 질량 기법입니다.
notes: '정지 좌표계의 운동량은 반지름 $p^*$인 구 위에 놓입니다. 부스트는 이를 어미 입자의 운동량만큼 앞으로 이동한 타원(그려진 곡선)으로 늘이므로, 빠른 어미 입자는 두 생성물을 좁은 전방 원뿔 속으로 던집니다. 에너지와 실험실 각은 $\theta^*$에 따라 변하지만, 각 생성물의 $p_\mu p^\mu = m^2$과 $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$은 변하지 않습니다. 두 운동량을 측정하는 검출기는 언제나 $M$을 재구성할 수 있습니다. $\pi^0 \to \gamma\gamma$에서 광자는 질량이 없고($p_\mu p^\mu = 0$) 최소 열림각은 $2\arcsin(1/\gamma)$입니다. 세 붕괴 모두 실제 붕괴입니다: $K^0_S \to \pi^+\pi^-$, $\pi^0 \to \gamma\gamma$, $\Lambda \to p\,\pi^-$. 운동학만 모형화합니다. 붕괴 각은 무작위 표본 대신 고르게 훑으며, 스핀과 편극은 무시합니다.'
meanings:
- diag(1, −1, −1, −1), $c = 1$인 단위계
- 정지 좌표계에서 B개의 붕괴 각 $\theta^*$에 대한 딸 입자 4-운동량
- 어미 입자 속도 $\boldsymbol\beta = \mathbf P/E$에 대한 $\gamma$, $\gamma\beta_i$, $\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$
- '반복된 $\nu$ ⇒ 합: 모든 붕괴를 한 번에 부스트'
- '민코프스키 내적: 모든 좌표계에서 같음'
- 모든 붕괴 각에 대해 재구성한 어미 입자 질량
labels:
  decay: 붕괴
  p_parent: 어미 입자 운동량 $|\mathbf P|$
