notes: >
  Status: speculative; constrained, not ruled out. Step 3 of the Projection Hypothesis (the author's own speculative
  idea, see the series description; not established physics), for postulate P5: quantum effects need some $d_Q$
  and gravity some $d_G$ dimensions, estimated, never set by hand. Step 1 (cosmology/projection_postulate) found
  that the projection race needs exactly one hidden complex dimension per outcome; step 2
  (cosmology/projection_one_particle) sliced one worldline; step 4 (cosmology/projection_singularity_fold) treats
  singularities as folds of the projection. No $n$ is assumed: the map scans $n = 0$ to $n_{max}$ and $R$ from the
  Planck length to 1 m. Known physics first. (a) Quantum side: the race reproduces the Born rule with $d + K$
  dimensions for $K$ outcomes, and $N$ entangled two-level systems need a Hilbert space of dimension $2^N$; standard
  quantum mechanics uses the same space, and its dimensions are not directions in space. If they were read as
  spatial directions, $N$ qubits would need $2^{N+1} - 3$ extra real dimensions (5 for a Bell pair), a number that
  would change every time particles become entangled, which no fixed spatial manifold does. (b) Gravity side: in
  $3 + n$ space dimensions Gauss's law gives a pull $G_D M/r^{n+2}$ (checked by autograd fluxes through $S^{n+2}$ for
  $n = 0..6$). If the $n$ dimensions are circles of radius $R$, the image sum turns this into Newton's
  $G_4 M/r^2$ with $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ beyond $R$ (checked for $n = 1, 2, 3$). Just outside, the first
  Kaluza–Klein graviton level gives a Yukawa term with $\alpha = 8n/3$ ($16/3$ for a 2-torus, as in the PDG review)
  and $\lambda = R$. The ADD relation of Arkani-Hamed, Dimopoulos and Dvali (1998), in the convention
  $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$ used by the PDG and the LHC experiments, reproduces the PDG numbers: $R = 30$ μm,
  $n = 2$ gives $M_D = 4.0$ TeV, and $M_D = 1$ TeV needs $10^{12}$ m, 0.5 mm, ..., 0.1 MeV$^{-1}$ for $n = 1..6$. Bounds
  (data/gravity_bounds.csv, cited numbers; the torsion and LHC rows are those bundled in
  cosmology/hierarchy_extra_dimensions, cited again). Eöt-Wash torsion balances exclude $|\alpha| = 1$ above
  56 μm (Kapner et al., PRL 98, 021101, 2007) and above 38.6 μm (Lee et al., PRL 124, 101101, 2020); since
  $\alpha\geq 1$ for every $n$, $R > 38.6$ μm is excluded for all $n\geq 1$ (conservative: the measured curve keeps
  falling at larger $\lambda$). For $n = 2$, Tan et al. (PRL 116, 131101, 2016) give $R < 30$ μm. The ATLAS monojet
  search (PRD 103, 112006, 2021, CC-BY 4.0) gives $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV for $n = 2..6$. SN1987A
  cooling gives $M_D > 27$ (2.4) TeV for $n = 2$ (3) (Hanhart et al., PLB 509, 1, 2001), and neutron-star heating by
  trapped KK gravitons gives $M_D > 1700$ (76) TeV (Hannestad and Raffelt, PRD 67, 125008, 2003), both as quoted in
  the PDG 2024 review. Each bound becomes a boolean mask on the $(n, R)$ grid, and toy points are checked against
  hand-worked answers. Result: $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, neutron stars),
  $2.6\times10^{-12}$ m ($n = 3$), and LHC radii for $n = 4..6$ ($5\times10^{-13}$ to $2.5\times10^{-15}$ m). For
  $n\geq 7$ only the torsion bound is bundled; the LHC limits weaken slowly with $n$ and, extrapolated (not done
  here), would push $R$ towards $1/M_D\sim 10^{-20}$ m. ADD with $M_D = 1$ TeV, the original solution of the
  hierarchy problem, is excluded for $n = 1..6$. The budget: minimum $n = 0$, because gravity needs no extra spatial
  dimension and quantum hidden dimensions need not be spatial; maximum none, because the data allow any $n$ if
  $R < R_{max}(n)$. Which reading the hypothesis takes: the Hilbert-space reading for P1 and P2 (hidden dimensions
  are state-space dimensions, so $D_Q\geq 2^N$ is no constraint on space), and the geometric reading for P4 and P5
  (embedding dimensions; if gravity can move into them they must be compact and below $R_{max}(n)$, otherwise they
  are coordinates of the embedding, not places one can go). Verdict: constrained, not ruled out, and no new
  prediction: the hypothesis would only become testable if it fixed $n$ and $R$ near these bounds.
