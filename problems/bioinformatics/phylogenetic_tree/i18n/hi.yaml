title: DNA दूरियों से जातिवृत्तीय वृक्ष
summary: DNA अनुक्रम एक छिपे यादृच्छिक वृक्ष के नीचे विकसित होते हैं, हर शाखा जूक्स–कैंटर संक्रमण आव्यूह के साथ एक आव्यूह गुणनफल है। केवल पत्तियों से हम one-hot अक्षरों पर एक einsum से अंतर गिनते हैं, उन्हें छिपे बहु-प्रतिस्थापनों के लिए संशोधित करते हैं, और UPGMA तथा नेबर जॉइनिंग (neighbour joining) से वृक्ष को फिर से बनाते हैं। अधिक स्थलों के उपयोग के साथ दोनों वृक्षों को देखें, जिन्हें रॉबिन्सन–फ़ाउल्ड्स दूरी से वास्तविकता के सापेक्ष अंक दिए जाते हैं।
notes: वास्तविक वृक्ष एक यादृच्छिक संलयी (coalescent) वृक्ष है; शिथिल घड़ी (relaxed clock) के साथ हर शाखा को अपनी दर भी मिलती है, इसलिए पत्तियाँ मूल से अलग-अलग दूरी पर होती हैं। भिन्न स्थलों का कच्चा अंश $p$, $3/4$ पर संतृप्त होता है और लंबे पथों को कम आँकता है (विकर्ण के नीचे धूसर बिंदु); जूक्स–कैंटर $d$ अनभिनत है (विकर्ण पर नीले बिंदु) पर अधिक रवयुक्त, और उसका रव $1/\sqrt L$ की तरह घटता है। UPGMA मानता है कि सभी पत्तियाँ मूल से समान दूरी पर हैं, इसलिए शिथिल घड़ी पर यह दो छोटी शाखाओं को जोड़ सकता है जो पड़ोसी नहीं हैं (लाल शाखाएँ), चाहे यह कितने भी स्थल देखे। नेबर जॉइनिंग को केवल यह चाहिए कि दूरियाँ वृक्ष के अनुदिश जुड़ें, और यह वास्तविक अमूलित आकार की ओर अभिसरित होता है; इसे इसके सबसे लंबे पथ के मध्य बिंदु पर मूलित करके दिखाया गया है, क्योंकि केवल दूरियाँ मूल का पता नहीं लगा सकतीं। कठोर घड़ी पर स्विच करें और UPGMA भी संगत हो जाता है।
meanings:
- लंबाई $t$ (प्रति स्थल अपेक्षित प्रतिस्थापन) की शाखा के बाद अक्षर $\alpha$ के $\beta$ बन जाने की प्रायिकता
- 'दोहराया गया $\alpha$ ⇒ योग: हर स्थल पर संतति की अक्षर प्रायिकताएँ; व्युत्क्रम CDF से नमूना'
- प्रेक्षित पत्ती अनुक्रम, A, C, G, T पर one-hot
- 'दोहराए गए $l, \alpha$ ⇒ योग: उन स्थलों का अंश जहाँ $i$ और $j$ भिन्न हैं'
- 'संशोधित दूरी $-\tfrac34\ln(1 - \tfrac43 p)$: एक स्थल पर बार-बार के प्रहारों से छिपे प्रतिस्थापनों को गिनती है'
- नेबर जॉइनिंग सबसे छोटे $Q$ वाले युग्म को जोड़ता है, सबसे छोटे $d$ वाले को नहीं; $r_i = d_{ik}\mathbf 1_k$
- वास्तविक पथ लंबाइयाँ; $M_{iv} = 1$ जब शाखा $v$ पत्ती $i$ और मूल के बीच हो, $b_v$ उसकी लंबाई
- पत्ती द्विविभाजनों (प्रति आंतरिक शाखा एक) की संख्या जो दोनों वृक्षों में से केवल एक में मौजूद हैं
labels:
  n_taxa: टैक्सा $n$
  n_sites: स्थल $L$
  tree_depth: मूल-से-पत्ती गहराई (प्रति स्थल प्रतिस्थापन)
  clock: आणविक घड़ी
