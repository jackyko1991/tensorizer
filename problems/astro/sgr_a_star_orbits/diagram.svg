<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="The star S2 on a highly eccentric ellipse around Sgr A* at one focus; telescopes measure its position on the sky and its line-of-sight velocity, and the distance R0 links angle to size">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- orbit: a = 70, b = 33, focus at c = 62 from the centre -->
    <ellipse cx="90" cy="80" rx="70" ry="33" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="20" y1="80" x2="160" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="52" y="96" font-style="italic">a</text>
    <!-- Sgr A* at the focus -->
    <circle cx="152" cy="80" r="5" fill="#111827"/>
    <text x="136" y="104" font-size="13">Sgr A*</text>
    <!-- S2 and its velocity -->
    <circle cx="60" cy="50" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="44" y="36" font-style="italic">S2</text>
    <line x1="68" y1="49" x2="100" y2="48" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="96" y="40" font-style="italic" fill="#b91c1c">v</text>
    <!-- pericentre -->
    <path d="M156,70 A12,12 0 0 1 156,90" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="164" y="74" font-size="12" fill="#b45309">Δφ</text>
    <!-- line of sight to Earth -->
    <line x1="200" y1="40" x2="200" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="200" y1="120" x2="200" y2="148" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="206" y="100" font-size="13" font-style="italic">R</text><text x="216" y="104" font-size="10" font-style="italic">0</text>
    <text x="166" y="156" font-size="12">Earth</text>
  </g>
</svg>
