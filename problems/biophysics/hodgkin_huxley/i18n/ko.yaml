source_hash: 9c0f102b3159
title: 호지킨–헉슬리 활동 전위
summary: '1952년의 오징어 거대 축삭 모형: 전압에 따라 열리고 닫히는 게이트 $m$, $h$, $n$을 가진 나트륨 및 칼륨 채널이 막 축전기를 방전시킨다. 서로 다른 전류 계단으로 자극되는 41개의 축삭을 하나의 $(4, B)$ 텐서로 함께 적분하여 스파이크 문턱값과 전류에 따른 발화율을 구한다.'
notes: '호지킨과 헉슬리(1963년 노벨상)는 전압 고정법으로 오징어 거대 축삭의 나트륨 및 칼륨 전류를 측정하고 세 개의 게이트로 맞추었다. 나트륨 전류는 $m^3$를 통해 빠르게 켜지고 불활성화 게이트 $h$를 통해 더 천천히 꺼지며, 칼륨 전류는 $n^4$를 통해 늦게 열린다. 스파이크는 이들 사이의 경주이다. 작은 탈분극이 $m$을 열면 유입되는 $\mathrm{Na}^+$가 막을 더 탈분극시키고(양성 되먹임) $V$는 $E_{Na}$를 향해 치솟는다. 이어서 $h$가 닫히고 $n$이 열리면 $V$는 다시 떨어지며 심지어 휴지 전위 아래로 내려간다(과분극). 지속적인 전류 계단에서 모형은 세 가지 영역을 보인다. 약 2.3 µA/cm² 이하에서는 막이 수동적으로 충전될 뿐이다. 그 값과 약 6.3 µA/cm² 사이에서는 스파이크를 한 번 발화한 뒤 안정되는데, 불활성화와 칼륨 전류가 막을 새로운 휴지 상태에 붙잡아 두기 때문이다. 그 위에서는 반복 발화하며, 발화율은 0에서 시작하지 않고 약 50 Hz로 뛰어오른다. 오징어 축삭은 휴지 상태가 호프 분기(Hopf bifurcation)에서 안정성을 잃는 II형(공명자) 뉴런으로, 임의로 느리게 발화할 수 있는 I형 뉴런과 다르다. 이후 f–I 곡선은 완만하게 상승하여 10 µA/cm²에서 약 68 Hz에 이른다. 속도 함수에는 제거 가능한 특이점이 있어 $0.1(V+40)/(1 - e^{-(V+40)/10})$는 $V = -40$ mV에서 유한하므로, 코드는 이를 안전한 극한값을 갖는 $x/(1 - e^{-x})$로 계산한다. 원래 실험은 6.3 °C에서 수행되었다. 축삭을 데우면 모든 게이트가 $\phi = 3^{(T - 6.3)/10}$배 빨라져 스파이크가 좁아지고 발화가 빨라지며, 약 30 °C 이상에서는 축삭이 아예 발화하지 못한다. 단순화: 공간 고정된 막 조각(축삭을 따라 전파 없음)과 결정론적 채널.'
meanings:
- 축삭 $b$의 자극 전류, 10 ms에 켜지는 계단 (µA/cm²)
- 각 축삭의 막 전위와 게이트 $g = (m, h, n)$
- 각 게이트의 열림 및 닫힘 속도 (1/ms), 고전적인 오징어 축삭 맞춤식
- 채널 $k$ = Na, K, 누설의 열린 비율
- 최대 전도도 (120, 36, 0.3 mS/cm²)와 역전 전위 (50, −77, −54.4 mV)
- 전체 이온 전류; 반복된 $k$ ⇒ 채널에 대해 합산
- '온도 인자 ($Q_{10} = 3$): 모든 게이트가 10 °C마다 3배 빨라진다'
- 스파이크 간 간격으로부터 구한 정상 발화율 (Hz)
labels:
  I_max: 최대 자극 $I_{max}$
  t_end: 시뮬레이션 시간
  temp: 온도 $T$
