title: Змейка, в которую играют CNN и смесь экспертных контроллеров
summary: 'Игровой агент из двух частей: небольшая CNN, которая смотрит на поле, и управляющая сеть, выбирающая ход, — здесь это смесь экспертов, маршрутизатор которой направляет каждую игру к одной из $K$ небольших экспертных сетей. Игра — «Змейка» на сетке $10 \times 10$, целиком записанная в виде тензоров, так что батч игр продвигается за один шаг. Контроллеры обучаются, подражая планирующему учителю (поиск в ширину и заливка, тоже тензорные операции). Сравниваются четыре контроллера с одинаковым бюджетом весов: плотная смесь, маршрутизатор Switch с top-1, обученный в плотном режиме маршрутизатор, используемый как top-1, и один обычный MLP; затем маршрутизация сопоставляется с состоянием игры, чтобы увидеть, для чего, если вообще для чего-то, используется каждый эксперт. Все четыре съедают около 20 единиц еды за игру, тогда как случайная политика съедает 0.2, — это две трети результата учителя; при таком размере обычный MLP справляется не хуже любой смеси.'
notes: 'Идея. Jacky Ka Long Ko предложил игрового агента, состоящего из CNN для восприятия и управляющей сети с маршрутизацией по смеси экспертов, и прежде всего попросил тензорную часть маршрутизации. Эта задача строит небольшой такой агент для «Змейки» — обычной клеточной игры, написанной здесь с нуля (собственная пиксельная графика, без готовых ресурсов). Игра. $B$ игр на поле $N \times N$ ($N = 10$) — это один набор тензоров. Поле хранит возраст каждой клетки тела (число ходов, через которое она снова освободится: у головы возраст = длине, у хвоста 1), поэтому один ход каждой игры — это горстка тензорных операций: голова переходит в $\mathbf x + \Delta_{d''}$ с новым направлением $d'' = (d + a - 1) \bmod 4$ для относительного действия $a$ (влево, прямо, вправо); стена или клетка с возрастом $> 1$ завершает игру (клетка хвоста освобождается, поэтому она свободна); без еды каждый возраст уменьшается на 1, с едой змейка сохраняет хвост и вырастает на единицу; новая еда появляется в пустой
  клетке с наибольшим из $N^2$ равномерных чисел с заданным зерном, поэтому она никогда не попадает на тело. Игра также заканчивается после $N^2$ ходов без еды или когда змейка заполняет всё поле. Тесты: столкновение со стеной и с собой, свободная клетка хвоста, рост на единицу, еда никогда не на теле, возрасты всегда ровно $\ell, \ell - 1, \dots, 1$, и батчевый шаг совпадает с обычным циклом Python по играм при тех же случайных числах. Агент. Восприятие — это CNN (свёртка 3×3 с 8 каналами, свёртка 3×3 с шагом 2 и 16 каналами, линейный слой до $F = 64$ признаков; 84 472 веса) на виде, центрированном на голове и повёрнутом так, что направление движения смотрит вверх, с четырьмя плоскостями: стена, тело, возраст/длина (какие клетки освободятся первыми) и еда. В этой системе координат три относительных хода — всегда одни и те же три соседа центра (тест проверяет, что ход смертелен ровно тогда, когда этот сосед — стена или клетка тела, которая останется). Управление — смесь из $K = 4$ экспертов,
  каждый из которых — MLP $64 \to 32 \to 3$, выдающий логиты действий, за softmax-маршрутизатором $p = \mathrm{softmax}(W^G \mathbf h + b^G)$: 8976 весов. Маршрутизируемый слой — тот же, что в moe_dag_pipeline, и импортируется оттуда: тензор диспетчеризации помещает каждую игру в буфер её эксперта (накопленные ранги, как в GShard и Switch), все эксперты выполняются в одном батчевом einsum, а einsum объединения возвращает логиты обратно. Точные проверки: при фиксированном one-hot маршрутизаторе слой совпадает с запуском эксперта каждой игры по отдельности (до $10^{-6}$), равномерный плотный маршрутизатор даёт среднее экспертов, строки маршрутизатора в сумме дают 1, и функция потерь балансировки нагрузки на известных случаях (1 при балансе, $K$ при коллапсе, 1.1 на примере, посчитанном вручную). Четыре контроллера с одинаковым бюджетом: (a) плотная смесь $z = \sum_k p_k f_k$ (каждый эксперт на каждой игре); (b) Switch top-1: работает только наиболее вероятный эксперт, и его логиты масштабируются
  на $p_k$; (c) модель из (a), обученная в плотном режиме и запущенная с маршрутизацией top-1 без дополнительного обучения; (d) один MLP $64 \to 132 \to 3$ (8979 весов, столько же, сколько у смеси). (a) и (b) обе добавляют функцию потерь балансировки нагрузки Switch с $\alpha = 0.01$. У каждого варианта два зерна; зерно $s$ стартует с одних и тех же весов CNN и экспертов во всех вариантах, и все шесть обучаемых моделей разделяют одну ось моделей (групповая свёртка CNN), каждая со своими мини-батчами. Учитель и обучение. Учитель — планировщик, написанный на тех же тензорах: поиск в ширину как многократная релаксация по свободным клеткам ($\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$) и, в том же цикле, заливка, помечающая каждую свободную область наименьшим индексом её клетки. Он никогда не делает смертельный ход, предпочитает ход, свободная область которого может вместить змейку, затем кратчайший путь к еде, затем бо́льшую область; в тесте его поле
  расстояний совпадает с учебным BFS на очереди. Обучение — клонирование поведения (Pomerleau 1989): перекрёстная энтропия на ходах учителя, по 54 040 состояниям из 192 игр учителя, 600 шагов AdamW по 128 состояний на модель, с одним раундом DAgger (Ross et al. 2011) после 360 шагов: ученики играют по 48 игр, учитель размечает 38 267 состояний, в которые они попадают, и обучение продолжается на обоих наборах. Дообучение с подкреплением не проводится; глубокое Q-обучение (Mnih et al. 2015) — классический способ научиться таким играм только по награде, что на CPU заняло бы гораздо больше времени. Результаты (запуск по умолчанию, 128 оценочных игр, общих для всех политик: одинаковые старты и одинаковый поток еды, не более 300 ходов). Съеденная еда за игру, среднее по играм, с двумя зёрнами: случайная 0.16 (погибает через 15 ходов); (a) плотная 20.7 (20.9, 20.4); (b) Switch 20.4 (21.1, 19.6); (c) плотная→top-1 18.1 (18.4, 17.8); (d) монолитная 21.7 (21.8, 21.6); учитель 31.0 (в среднем выживает
  287 из 300 ходов против 147–179 у учеников). Ученики совпадают с учителем на 95–96 % обучающих состояний, но набирают на треть меньше: мелкие ошибки накапливаются за игру — обычная слабость клонирования поведения. Медленный тест проверяет, что обученная политика с явным отрывом превосходит случайную. Маршрутизация, показанная даже там, где это не специализация. Плотные маршрутизаторы используют всех четырёх экспертов (нагрузки 0.16–0.38). Лучше всего они отслеживают сам ход: взаимная информация между выбранным экспертом и ходом контроллера составляет 0.51 и 0.56 бита (2 бита — максимум при четырёх экспертах); в зерне 1 один эксперт берёт почти все повороты влево и вправо и почти все состояния без свободной клетки впереди, а остальные три делят ходы прямо. Свободные клетки впереди несут 0.20–0.28 бита, расстояние до еды 0.08–0.12, а длина тела 0.02–0.13 (сдвиг от коротких змеек к длинным только в зерне 1). Таким образом, эксперты делятся по тому, что делать (повернуть или продолжать движение),
  а не по стратегии вроде погони за едой против избегания хвоста; поскольку выход эксперта определяет ход, такое разделение отчасти заложено в конструкцию. Маршрутизаторы Switch сколлапсировали, несмотря на функцию потерь балансировки: зерно 1 отправляет 85 % состояний одному эксперту и 15 % второму, зерно 2 — 73 % и 26 %, по два эксперта не используются в каждом; трудность нарушения симметрии, замеченная в moe_dag_pipeline, проявляется здесь как коллапс. В счёте это ничего не стоит, потому что один эксперт с общей CNN (в которой большая часть весов) уже играет так же хорошо, как четыре. Запуск обученного в плотном режиме маршрутизатора как top-1 (c) сохраняет плотную маршрутизацию (0.60 и 0.67 бита с ходом), но теряет 2.6 единицы еды за игру: плотная модель смешивает своих экспертов и не вполне разделима. Что выполняется, а что нет. Точно: батчевая игра совпадает с эталонным циклом, маршрутизируемый слой с фиксированным маршрутизатором совпадает с вызовами эксперта по играм, а плотная смесь
  с равномерным маршрутизатором равна среднему экспертов. Измерено на одном размере поля с двумя зёрнами: подражание доводит каждый контроллер примерно до двух третей результата учителя, и ни одна смесь не превосходит обычный MLP с тем же числом весов (MLP впереди примерно на 1 единицу еды за игру в обоих зёрнах — небольшой разрыв при двух зёрнах). Смеси экспертов окупаются, когда множество экспертов содержит гораздо больше весов, чем может использовать один вход; контроллер из четырёх экспертов за CNN, которая выполняет основную работу, демонстрирует маршрутизацию, а не её преимущество. Связанные работы. Адаптивные смеси локальных экспертов (Jacobs, Jordan, Nowlan и Hinton 1991) ввели гейт, назначающий каждый пример одному из нескольких конкурирующих экспертов; разреженно-гейтированный слой MoE (Shazeer et al. 2017) и Switch Transformer (Fedus et al. 2021, маршрутизация top-1 и используемая здесь функция потерь балансировки нагрузки) масштабировали этот подход. Глубокие Q-сети (Mnih et
  al. 2015) научились играм Atari по пикселям с помощью CNN и одной лишь награды; ALVINN (Pomerleau 1989) управлял автомобилем, подражая водителю-человеку, — это истоки клонирования поведения, а DAgger (Ross, Gordon и Bagnell 2011) исправляет накопление ошибок, размечая состояния, которые посещает сам обучаемый. Устройство и ограничения. По умолчанию CPU: около 80 с на учителя, обучение и оценку на загруженной 6-ядерной машине (6.6 с игры учителя, 6.0 с DAgger, 53 с обучение, 16 с оценка) плюс около 30 с на GIF; GPU (pixi run -e cuda) ускоряет CNN, но не множество мелких поисков учителя. GIF показывает (c), маршрутизатор которого использует всех экспертов и запускает ровно одного на игру; routing.png показывает все три маршрутизируемых варианта, routing.csv и scores.csv содержат числа.'
meanings:
- 'поле игры $b$: 0 = пусто, иначе число ходов, через которое эта клетка тела снова освободится (голова = длина $\ell_b$, хвост = 1)'
- все $B$ игр делают ход одновременно; $d'_b = (d_b + a_b - 1) \bmod 4$ для относительного действия $a_b$ (влево, прямо, вправо); стена или клетка с возрастом $> 1$ завершает игру (клетка хвоста, возраст 1, освобождается)
- 'после поедания — пустая клетка с наибольшим из равномерных чисел с заданным зерном $u_{brc}$: никогда не на теле'
- 'что видит CNN: стена, тело, возраст/длина и еда, с центром на голове и направлением движения вверх, так что три хода — всегда одни и те же три соседа'
- признаки CNN; ось моделей $m$ (вариант × зерно) становится группами одной групповой свёртки на слой
- 'маршрутизатор: softmax по $K$ экспертам, строки в сумме дают 1'
- игра $b$ в слот $s$ эксперта $k$ (её ранг среди игр, направленных туда), импортировано из moe_dag_pipeline
- 'все эксперты в одном батчевом произведении, каждый на своём буфере игр: три логита действий'
- 'объединение; плотный режим: $z = p_{mbk} y_{mkba}$, каждый эксперт на каждой игре'
- 'балансировка нагрузки Switch, $K \sum_k f_k P_k$: 1 при балансе, $K$ при коллапсе'
- 'учитель: никакого смертельного хода, затем ход, свободная область которого (заливка) вмещает змейку, затем кратчайший путь к еде (поиск в ширину как многократная тензорная релаксация)'
labels:
  grid: Размер поля $N$ (клетки)
  seeds: Зёрен на вариант
  experts: Эксперты $K$
  steps: Шаги обучения
  balance_weight: Вес балансировки нагрузки $\alpha$
  dagger: Раунд DAgger (1 = вкл.)
  eval_games: Оценочные игры
