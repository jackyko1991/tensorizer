<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two-body decay in flight: a parent of mass M and momentum P decays into two particles with momenta p1 and p2 in the lab">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- flight direction -->
    <line x1="14" y1="84" x2="226" y2="84" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- parent in flight -->
    <circle cx="34" cy="84" r="11" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="27" y="89" font-size="12" fill="#ffffff" font-style="italic">M</text>
    <line x1="48" y1="84" x2="94" y2="84" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="64" y="74" font-style="italic" fill="#b91c1c">P</text>
    <!-- decay vertex -->
    <circle cx="110" cy="84" r="4" fill="#374151"/>
    <!-- daughters -->
    <line x1="110" y1="84" x2="200" y2="34" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="206" cy="31" r="6" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="150" y="44" font-style="italic" fill="#b91c1c">p</text><text x="158" y="48" font-size="10" fill="#b91c1c">1</text>
    <line x1="110" y1="84" x2="190" y2="124" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="196" cy="127" r="6" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="140" y="126" font-style="italic" fill="#b91c1c">p</text><text x="148" y="130" font-size="10" fill="#b91c1c">2</text>
    <!-- opening angle -->
    <path d="M150,84 A40,40 0 0 0 145,64.6" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="156" y="76" font-style="italic" fill="#b45309">θ</text>
  </g>
</svg>
