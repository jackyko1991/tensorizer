source_hash: b944848791a5
title: Выравнивание последовательностей как волновой фронт тензорных обновлений
summary: Глобальное (Нидлман–Вунш) и локальное (Смит–Уотерман) выравнивание последовательностей ДНК динамическим программированием. Каждой ячейке таблицы нужны только её левый, верхний и диагональный соседи, поэтому вся антидиагональ $i + j = d$ заполняется одним тензорным обновлением, сразу для пакета пар последовательностей. Смотрите, как волновой фронт проходит по таблице, а затем обратный проход считывает оптимальное выравнивание.
notes: 'Глобальное выравнивание заставляет выровнять обе последовательности от начала до конца; локальное добавляет вариант 0, так что плохой участок просто отбрасывается, и выдаётся лучший по оценке фрагмент где угодно (здесь — мотив, вставленный в случайный фон). Обратный проход идёт назад от конечной ячейки, на каждом шаге выясняя, какой из трёх вариантов дал сохранённое значение, и переключается между таблицами $H$, $E$, $F$ внутри пропуска. Стоимость по-прежнему $O(nm)$ ячеек, но лишь $n + m - 1$ последовательных шагов: именно на таком антидиагональном параллелизме работают выравниватели на GPU и SIMD. Попробуйте повысить частоту мутаций или задать $g_o > g_e$, чтобы предпочесть несколько длинных пропусков многим коротким. Для белков вместо $W$ используется матрица $20\times20$, например BLOSUM62; больше ничего не меняется.'
meanings:
- буква $i$ первой и $j$ второй последовательности пары $b$, one-hot по A, C, G, T
- 'оценка за выравнивание буквы $\alpha$ с $\beta$: совпадение на диагонали, несовпадение вне её'
- 'повторяющиеся $\alpha, \beta$ ⇒ суммирование: оценка каждого возможного сочетания букв'
- пропуск из $k$ букв стоит $g_o + (k-1)\,g_e$ (аффинный); $g_o = g_e$ — линейный штраф
- все ячейки на антидиагонали $d$; они зависят только от диагоналей $d-1$ и $d-2$
- 'одно тензорное обновление на диагональ: лучшая оценка, заканчивающаяся совпадением, пропуском в $a$, пропуском в $c$'
- глобальная оценка в углу, локальная — в лучшей ячейке; заполнение за пределами каждой длины игнорируется
labels:
  mode: Выравнивание (глобальное = Нидлман–Вунш, локальное = Смит–Уотерман)
  length: Длина последовательности $L$
  n_pairs: Пар в пакете $B$
  mutation: Частота мутаций на сайт
  match: Оценка совпадения
  mismatch: Оценка несовпадения
  gap_open: Открытие пропуска $g_o$
  gap_extend: Продление пропуска $g_e$
