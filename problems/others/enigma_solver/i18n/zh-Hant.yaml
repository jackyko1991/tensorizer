source_hash: 9231afd9bb4a
title: 以置換張量破解恩尼格瑪密碼機
summary: 不是物理，只是好玩：3 轉子 Enigma I 的每次按鍵都是八個 $26\times26$ 置換矩陣的乘積，每個轉子依其位置以循環平移做共軛。用秘密的轉子順序與起始位置加密一段英文訊息，然後對每種轉子順序，把全部 $26^3 = 17\,576$ 個起始位置作為一個批次張量同時解密，保留字母統計最像英文的文本，藉此破解。
notes: 反射器 $U$ 是沒有固定點的對稱置換，因此 $E = Q^{-1}UQ$（其中 $Q = R_3R_2R_1S$）也是：$E^2 = I$（相同設定即可解密）且 $E_{ii} = 0$（沒有字母會被加密成自己，這是破譯者所利用的弱點）。每次按鍵前右轉子前進一格；當它位於缺口處時也會帶動中轉子，而當中轉子位於自己的缺口處時，它會與左轉子一起前進（雙步進異常）。測試向量：轉子 I-II-III、反射器 B、環設定 AAA、起始 AAA，會把 AAAAA 變成 BDZGO。歷史：Marian Rejewski 於 1932 年以置換群論破解恩尼格瑪，而圖靈與 Welchman 的炸彈機（bombe，1940）則利用明文片段（crib，即猜測的明文，例如天氣報告）而非統計來搜尋轉子順序與位置。這裡純統計的攻擊，以重合指數為解密結果排序，是 James Gillogly 於 1995 年（Cryptologia）發表的方法，他在後續階段也還原了環設定與插線。簡化：環設定為 AAA 且攻擊者已知，插線板為空，因此金鑰空間只有 $60 \times 26^3 \approx 10^6$ 種設定，正確的設定明顯突出。真正戰時使用 10 條線的插線板會增加約 $1.5 \times 10^{14}$ 種選擇，在轉子兩側交換 26 個字母中的 20 個，並把字母統計打亂到正確的轉子設定幾乎勝不過錯誤的；Gillogly 的攻擊此時需要對插線做爬山搜尋，而訊息很短時便會失敗。試著減少字母數（約 60 到 100）或改用另一種分數，看看統計何時變得不可靠；只搜尋轉子 I–III 時，找不到使用 IV 或 V 的金鑰。
meanings:
- 字母是一個 one-hot 向量 $e_x$，或僅是其索引 $x \in \{0, \dots, 25\}$（A = 0）
- 轉子 I–V 的歷史接線：當接點 $b$ 接到接點 $a$ 時 $W_{ab} = 1$
- 循環平移 $x \to x + o$；$o_k$ = 按鍵 $t$ 時轉子 $k$ 的窗口字母 − 環設定
- 重複的 $a, b$ ⇒ 求和：轉動後的轉子；以索引表示為 $x \to (w[(x + o) \bmod 26] - o) \bmod 26$
- 一次按鍵：插線板 $S$、從右 $R^{(1)}$ 到左 $R^{(3)}$ 的轉子、反射器 $U$ 再折返；$(R^{-1})_{ab} = R_{ba}$
- 轉子在全部 26 個偏移下的查找表，因此 $R\,e_x$ 變成 F[o, x]，可同時處理數百萬個字母
- 以每個起始位置 $b$ 解密的密文（$B = 26^3$）；由於 $E^2 = I$，解密 = 加密
- 字母 $k$ 在候選 $b$ 中出現的次數
- 重複的 $k$ ⇒ 求和：兩個字母相同的機率，英文約 0.066，隨機文本為 $1/26 \approx 0.038$
- 另一種分數：平均英文單字母對數概似 $c_{bk}\log p_k / N$
labels:
  message: 明文
  rotor_order: 秘密轉子順序（左-中-右）
  start_left: 左轉子的秘密起始位置
  start_middle: 中轉子的秘密起始位置
  start_right: 右轉子的秘密起始位置
  n_letters: 用於評分的字母數 $N$
  score: 分數：重合指數或單字母對數概似
  search_rotors: 搜尋的轉子（60 或 6 種順序）
