title: Филогенетические деревья по расстояниям между ДНК
summary: Последовательности ДНК эволюционируют вдоль скрытого случайного дерева, каждая ветвь — одно матричное произведение с матрицей переходов Джукса–Кантора. По одним листьям мы подсчитываем различия одним einsum по one-hot буквам, корректируем их на скрытые множественные замены и восстанавливаем дерево методами UPGMA и присоединения соседей. Наблюдайте за обоими деревьями по мере увеличения числа сайтов, сравнивая с истиной по расстоянию Робинсона–Фулдса.
notes: Истинное дерево — случайное коалесцентное дерево; при нестрогих часах каждая ветвь также получает собственную скорость, поэтому листья находятся на разных расстояниях от корня. Сырая доля различающихся сайтов $p$ насыщается на $3/4$ и недооценивает длинные пути (серые точки ниже диагонали); расстояние Джукса–Кантора $d$ несмещённое (синие точки на диагонали), но более шумное, и его шум убывает как $1/\sqrt L$. UPGMA предполагает, что все листья одинаково удалены от корня, поэтому при нестрогих часах она может объединить две короткие ветви, которые не являются соседями (красные ветви), сколько бы сайтов она ни видела. Методу присоединения соседей нужно лишь, чтобы расстояния складывались вдоль дерева, и он сходится к истинной некорневой форме; он изображён с корнем в середине самого длинного пути, поскольку одни расстояния не позволяют определить корень. Переключитесь на строгие часы — и UPGMA тоже становится состоятельной.
meanings:
- вероятность того, что буква $\alpha$ стала $\beta$ после ветви длины $t$ (ожидаемое число замен на сайт)
- 'повторяющийся $\alpha$ ⇒ суммирование: вероятности букв потомка в каждом сайте; сэмплирование через обратную функцию распределения'
- наблюдаемые последовательности листьев, one-hot по A, C, G, T
- 'повторяющиеся $l, \alpha$ ⇒ суммирование: доля сайтов, где $i$ и $j$ различаются'
- 'скорректированное расстояние $-\tfrac34\ln(1 - \tfrac43 p)$: учитывает замены, скрытые повторными попаданиями в один сайт'
- присоединение соседей объединяет пару с наименьшим $Q$, а не с наименьшим $d$; $r_i = d_{ik}\mathbf 1_k$
- истинные длины путей; $M_{iv} = 1$, когда ветвь $v$ лежит между листом $i$ и корнем, $b_v$ — её длина
- число бипартиций листьев (по одной на внутреннюю ветвь), присутствующих только в одном из двух деревьев
