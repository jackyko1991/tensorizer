source_hash: d29dc3e384c1
title: 'मृत तारों को फिर से प्रज्वलित करना: भूरे बौने, नोवा, एक्स-रे विस्फोट और ब्लैक होल'
summary: जब किसी तारकीय अवशेष को नई गैस मिलती है तो क्या होता है? लगभग $0.075\,M_\odot$ से आगे धकेला गया भूरा बौना हाइड्रोजन जला सकता है और तारा बन सकता है; श्वेत बौना अपनी अभिवृद्ध हाइड्रोजन परत को क्लासिकल नोवा के रूप में प्रज्वलित करता है; न्यूट्रॉन तारा हर कुछ घंटों में अपने अभिवृद्ध H/He को टाइप I एक्स-रे विस्फोट के रूप में भड़काता है; ब्लैक होल की कोई सतह नहीं होती, इसलिए कुछ भी प्रज्वलित नहीं होता और वह केवल चमकता है, एडिंगटन (Eddington) सीमा तक। एक ही बैच्ड टेंसर मॉडल (लेन–एम्डेन (Lane–Emden) पॉलीट्रोप, एक अपभ्रष्ट अवस्था समीकरण और autograd के साथ एक-ज़ोन परत प्रज्वलन) हर अवशेष और हर द्रव्यमान के लिए क्रांतिक अभिवृद्ध द्रव्यमान एक साथ देता है।
notes: 'सटीक परिणाम: लेन–एम्डेन (Lane–Emden) स्थिरांक, चंद्रशेखर (Chandrasekhar) द्रव्यमान ($\mu_e = 2$ के लिए $1.456\,M_\odot$), एडिंगटन (Eddington) ज्योति ($1.26\times10^{38}$ erg/s प्रति $M_\odot$) और ISCO दक्षता ($5.7\%$ से $42\%$)। बाकी सब परिमाण-कोटि का मॉडल है: (1) भूरे बौने: सिकुड़ता हुआ $n = 3/2$ पॉलीट्रोप जो अधिकतम तापमान कभी पाता है, $T_{\max} \propto M^{4/3}$, उसकी तुलना $3\times10^5$ K (अरबों वर्षों में धीमा ड्यूटेरियम दहन) और $3\times10^6$ K (हाइड्रोजन) से की जाती है; मॉडल लगभग $14\,M_J$ और $0.074\,M_\odot$ देता है, जो विकास-मॉडलों की सीमाओं लगभग $13\,M_J$ (Spiegel et al. 2011) और $0.07$–$0.08\,M_\odot$ (Burrows et al. 2001) के करीब है। यह एक आवश्यक शर्त है: सीमा से आगे धकेले गए पुराने, ठंडे भूरे बौने को प्रज्वलित होने से पहले अभिवृद्धि (संपीडन) द्वारा गर्म भी होना होगा। (2) नोवा: प्रज्वलन द्रव्यमान $10^{-7}$ से $10^{-3}\,M_\odot$, भारी श्वेत बौनों और तेज़ अभिवृद्धि के लिए छोटे, जैसा कि Yaron et al. (2005) के नोवा ग्रिड में है, पर केवल कुछ गुना के कारक तक (चालन, मिश्रण और स्क्रीनिंग
  छोड़ दिए गए हैं)। नोवा संभवतः कम से कम उतना बाहर फेंकते हैं जितना अभिवृद्ध हुआ, इसलिए यह विवादित है कि क्या कोई श्वेत बौना $M_{\rm Ch}$ तक बढ़कर टाइप Ia सुपरनोवा के रूप में फट सकता है (एकल-अपभ्रष्ट चैनल)। (3) एक्स-रे विस्फोट: प्रज्वलन स्तंभ लगभग $10^8$ g/cm² और पुनरावृत्ति समय कुछ घंटे, जैसा देखा गया है (Galloway और Keek 2021); प्रति ग्राम गुरुत्वीय ऊर्जा नाभिकीय ऊर्जा की लगभग 40 गुना है ($\alpha$)। वही अभिवृद्धि जो विस्फोटों को शुरू करती है, न्यूट्रॉन तारे के घूर्णन को तेज़ करती है: लगभग $0.04\,M_\odot$ एक पुराने पल्सर को मिलीसेकंड पल्सर में बदल देता है। (4) ब्लैक होल: कोई सतह नहीं, कोई चमक नहीं।'
meanings:
- 'प्रति प्रविष्टि एक अभिवृद्धि करता अवशेष: श्वेत बौने (द्रव्यमान $\times$ दर) और न्यूट्रॉन तारे (ईंधन $\times$ दर)'
- अभिवृद्ध परत की स्तंभ गहराई, g/cm²; दाब $P = g y$
- आदर्श आयन + आंशिक रूप से अपभ्रष्ट इलेक्ट्रॉनों को बैच्ड द्विभाजन से उलटना
- आधार का विकिरणी तापमान, नियत-बिंदु पुनरावृत्ति ($\kappa$, $\rho$ $T$ पर निर्भर हैं)
- 'पतली-परत अस्थिरता: तापन $T$ के साथ शीतलन से तेज़ बढ़ता है ⇒ अनियंत्रित प्रज्वलन'
- 'क्रांतिक अभिवृद्ध द्रव्यमान: नोवा या एक्स-रे विस्फोट'
- हर त्रिज्या से होकर सिकुड़ता $n = 3/2$ पॉलीट्रोप; $r$ पर अधिकतम ⇒ भूरे बौने की सीमाएँ
- '$n = 1, 3/2, 3$ के लिए एक साथ लेन–एम्डेन: $\omega_3$, $\rho_c/\bar\rho$, $P_c$ स्थिरांक'
- 'ब्लैक होल: केवल अभिवृद्धि का प्रकाश, $\eta = 1 - E_{\rm ISCO}$'
