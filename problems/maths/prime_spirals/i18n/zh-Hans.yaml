source_hash: 1f16a1cee568
title: 素数螺旋与哈代–李特尔伍德猜想
summary: 把素数筛进一个布尔张量，再画在乌拉姆螺旋与萨克斯螺旋上，素数会聚集在一条条线上。每条线都是一个二次式，例如欧拉的 $k^2 + k + 41$，而哈代–李特尔伍德猜想预测它含有多少素数。接着用同一个筛法检验他们对孪生素数与哥德巴赫问题的预测，以及克拉梅尔的素数间隙随机模型。这些都是猜想：程序以数值方式检验它们，并没有证明它们。
notes: 乌拉姆（1963）把整数写在正方形螺旋上，注意到素数沿着对角线排列；萨克斯螺旋（1994）把 $n$ 放在半径 $\sqrt n$、角度 $2\pi\sqrt n$ 处，呈现的则是曲线。乌拉姆螺旋的每条对角射线都承载一个二次式 $4k^2 + bk + c$ 的值；在从 41 开始的螺旋上，主对角线就是欧拉的 $k^2 + k + 41$，它在 $k = 0, \dots, 39$ 时都是素数（已证明：Rabinowitsch 证明了 $k^2 + k + p$ 对所有 $k < p - 1$ 都是素数，当且仅当 $\mathbb Q(\sqrt{1 - 4p})$ 的类数为一，所以 $p \in \{2, 3, 5, 11, 17, 41\}$，这个列表由 Heegner 与 Stark 完成）。有些射线很稠密、有些却是空的，原因在于剩余：当判别式对许多小素数都是非剩余时，$f$ 对这些素数取模就没有根。哈代与李特尔伍德（1923）把这个想法写成猜想 F，而 Bateman–Horn 猜想（1962）将它重述为 $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$。右上方面板一次在数百个二次式上检验它：随着 $K$ 增大，测得的常数趋近预测的 $C(f)$（对角线）。目前甚至还不知道有任何一个二次式能取到无穷多个素数值：对 $n^2 + 1$ 而言，这就是朗道第四问题（1912），至今仍未解决。对欧拉的多项式，哈代与李特尔伍德引用的是对奇素数的乘积 $3.3197732$；Bateman–Horn 常数包含来自 $p = 2$ 的因子 2（这些值总是奇数），所以它是 $6.6395$。常数为 $C_2 = 0.6601618\ldots$ 的孪生素数猜想，以及带有奇异级数的哥德巴赫猜想，是同一个想法分别用于 $p$ 与 $p + 2$、以及 $p$ 与 $N - p$。筛法重现了已知的计数 $\pi_2(10^6) = 8169$ 与 $\pi_2(10^7) = 58980$，而哥德巴赫彗星会塌缩到预测上：彗星的各条带就是奇异级数（绿色：$3 \mid N$）。这两个猜想都仍未解决。哥德巴赫猜想已对所有不超过 $4 \cdot 10^{18}$ 的偶数验证（Oliveira e Silva、Herzog 与 Pardi，2014）；张益唐（2014）以及
  Polymath 与 Maynard 的工作证明了存在无穷多个不超过 246 的素数间隙，而陈景润（1973）证明了每个充分大的偶数都是一个素数加上至多两个素数的乘积。克拉梅尔模型（1936）把每个 $n$ 视为以概率 $1/\ln n$ 为素数；它预测间隙呈指数分布、平均值为 $\ln p$，与我们观察到的相近，最大间隙约为 $\ln^2 p$，但它对孪生素数个数的预测恰好差了因子 $2C_2 \approx 1.32$（虚线），因为它忽略了被 2、3、5、… 整除的情况。Maier（1985）证明它在其他方面也会失效，而 Granville 提出最大间隙可达 $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$。
meanings:
- 埃拉托斯特尼筛法：每个素数 $p \le \sqrt{n_\text{max}}$ 做一次跨步切片
- 一次求出每个数在乌拉姆螺旋上的位置，依据它所在的环 $k = \lceil(\sqrt m - 1)/2\rceil$ 以及它到角落 $(2k+1)^2$ 的距离
- 萨克斯螺旋：平方数 $k^2$ 落在正 $x$ 轴上
- $F$ 个二次式 $4k^2 + bk + c$（乌拉姆螺旋的对角射线）在每个 $k$ 的值
- 在筛中查每个值；累加和计数每条射线上的素数
- 由欧拉判别法 $(D/p) \equiv D^{(p-1)/2}$（其中 $D = b^2 - 4ac$）求 $f_i$ 模 $p$ 的根；对 $p < 50$ 则直接尝试
- 重复的 $p$ ⇒ 求和：欧拉乘积写成对素数 $p < 10^5$ 的对数和
- 重复的 $m$ ⇒ 求和：哥德巴赫计数写成自卷积，用 FFT 计算
- 满足 $p \le x$ 的孪生素数对 $(p, p+2)$
- 归一化的间隙，与克拉梅尔随机模型的 $e^{-s}$ 定律比较
