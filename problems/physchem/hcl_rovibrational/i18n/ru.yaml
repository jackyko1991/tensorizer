source_hash: dda111a1c11f
title: Колебательно-вращательный спектр HCl
summary: 'Инфракрасная полоса HCl — гребёнка линий: молекула колеблется (ангармонический осциллятор) и вращается (ротатор, растягивающийся при вращении), и каждая линия — переход $v = 0 \to 1$ с $\Delta J = \pm 1$. P- и R-ветви обоих изотопов хлора получаются как одна пакетная сетка $(I, J)$ с больцмановскими интенсивностями для линейного нагрева; затем подгонка комбинационных разностей методом наименьших квадратов восстанавливает $B_e$, $\alpha_e$ и $\nu_0$ по линиям.'
notes: 'Константы — приближённые литературные значения для H³⁵Cl: $\omega_e \approx 2991$, $\omega_ex_e \approx 52.8$, $B_e \approx 10.59$, $\alpha_e \approx 0.31$ и $D_e \approx 5\times10^{-4}$ cm⁻¹. На начале полосы $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹ линии нет, потому что у $\Sigma$-состояния, как у HCl, нет ветви $\Delta J = 0$ (Q): промежуток между R(0) и P(1) около $4B$. Поскольку $B_1 < B_0$ (колеблющаяся связь в среднем длиннее), линии R сгущаются к большим $J$, а линии P расходятся. Каждая линия — дублет: H³⁷Cl лежит примерно на 2 cm⁻¹ ниже с третью интенсивности (природная распространённость 76 : 24); сдвиг растёт с $|\nu - \nu_0|$, потому что каждая константа масштабируется степенью приведённой массы. По мере нагрева газа больцмановский множитель $(2J+1)e^{-hcF(J)/kT}$ сдвигает свой максимум к большим $J$, и две ветви расходятся (каждый кадр нормирован на свою самую сильную линию). Комбинационные разности — приём спектроскопистов для разделения двух состояний:
  R(J−1) и P(J+1) заканчиваются на одном и том же верхнем уровне, поэтому их разность зависит только от $v = 0$; R(J) и P(J) начинаются с одного и того же нижнего уровня, поэтому их разность зависит только от $v = 1$. Подгонка прямой $\Delta_2F/(4J+2)$ в зависимости от $J^2 + J + 1$ даёт $B_v$ (свободный член) и $D$ (наклон), затем $\alpha_e = B_0 - B_1$ и $B_e = B_0 + \alpha_e/2$. Добавьте шум измерений, чтобы увидеть, насколько хорошо выдерживают константы. Эквивалентная глубина потенциала Морзе равна $\omega_e^2/4\omega_ex_e$. Упрощения: нет поправок интенсивности Германа–Уоллиса, одна лоренцева ширина для всех линий, поглощение не взвешено на $\tilde\nu$.'
meanings:
- приближённые константы H³⁵Cl, пересчитанные для H³⁷Cl с $\rho = \sqrt{\mu_{35}/\mu_{37}}$
- вращательные термы уровня $v$; индекс не суммируется, внешние произведения
- все линии обоих изотопологов в одной сетке; $J$ — нижний уровень
- больцмановская заселённость уровня $J$ при каждой температуре нагрева
- распространённость × заселённость × множитель Хёнля–Лондона; P(0) получает ровно ноль
- 'повторяющийся $\ell$ ⇒ суммирование по всем линиям: уширенный спектр'
- $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$ для нижнего ($s=0$) и верхнего ($s=1$) состояния
- 'повторяющийся $n$ ⇒ суммирование: $B_v$ и $D$ методом наименьших квадратов для каждого изотополога и состояния'
labels:
  T: Конечная температура $T$
  J_max: Наибольший нижний уровень $J_{max}$
  fwhm: Ширина линии (FWHM)
  noise: Шум на измеренных линиях
