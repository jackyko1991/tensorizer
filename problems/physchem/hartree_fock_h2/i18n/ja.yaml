source_hash: de68545f1f70
title: 最小 STO-3G 基底による $\mathrm{H_2}$ のハートリー–フォック法
summary: Szabo と Ostlund の教科書的な自己無撞着場計算を、テンソルで書く。各水素は三つのガウス関数からなる 1s 関数を一つもつ（STO-3G）。重なり、運動エネルギー、核引力、二電子積分は閉じた式をもち、フォック行列は密度と $(\mu\nu|\lambda\sigma)$ テンソルの縮約であり、ローターン方程式 $FC = SC\varepsilon$ は結合長のバッチ全体について eigh で一度に解く。$R = 1.4$ bohr で $E = -1.1167$ hartree を与え、スキャンで結合長を求め、制限ハートリー–フォック法が結合を切れない理由を示す。
notes: 原子単位：長さは bohr（$a_0 = 0.529$ Å）、エネルギーは hartree（$E_h = 27.21$ eV）。基底は Szabo and Ostlund, Modern Quantum Chemistry（1982；Dover 版 1996）第 3 章と同じく、スレーター指数 $\zeta_{\mathrm H} = 1.24$ と $\zeta_{\mathrm{He}} = 2.0925$ の STO-3G である。基底関数が二つなのですべての行列は $2\times2$ であり、各数値を本と照合できる：$S_{12} = 0.6593$、$T_{11} = 0.7600$、$R = 1.4$ bohr で $E = -1.1167$ hartree、$\mathrm{HeH^+}$ では $R = 1.4632$ bohr で $-2.8607$ hartree。SCF は $P = 0$（コアハミルトニアン）から始める。$\mathrm{H_2}$ では対称性により軌道 $\psi_{1,2} \propto \phi_A \pm \phi_B$ が決まり、すぐに収束するが、$\mathrm{HeH^+}$ では電荷がヘリウムへ流れるため十数回の反復が必要である。各結合長はバッチの一要素なので、SCF は曲線全体について一つのループで走る。制限ハートリー–フォック法は二つの電子を同じ空間軌道 $\psi_1$ に入れる。大きな $R$ ではその状態は半分が $\mathrm{H + H}$、半分がイオン的な $\mathrm{H^+ + H^-}$ なので、曲線は $2E_{\mathrm H}$ よりはるかに上へ上がる。破線は同じ基底での完全配置間相互作用（$|1^2\rangle$、$|1^12^1\rangle$、$|2^2\rangle$ の $3\times3$ 一重項行列）である：$|2^2\rangle$ を混ぜ込み、正しく解離し、平衡での RHF との差（約 $-0.02$ hartree）が相関エネルギーである。最小基底は厳密な $\mathrm{H_2}$ エネルギー（$R = 1.4$ bohr で $-1.1745$ hartree）からは程遠い。より大きな基底には p 関数や d 関数と、一般的なガウス積分の漸化式が必要である。$\mathrm{HeH^+}$
  を試してみよう：そこでは両方の電子がヘリウム上に行き着くので、RHF の曲線は正しい極限 $\mathrm{He + H^+}$ に到達する。
meanings:
- 関数あたり三つのガウス指数 $\alpha_p\zeta^2$ と、原始関数の規格化 $(2\alpha/\pi)^{3/4}$ を組み込んだ縮約係数
- バッチ内の各結合長 $R_b$ に対する二つの原子核（と基底の中心）
- 二つのガウス関数の積は $P = (\alpha A + \beta B)/(\alpha + \beta)$ を中心とする一つのガウス関数になる
- $p, q$ の繰り返し ⇒ 和：原始関数についての縮約；$T$、$V$ も同様
- ボイズ関数 $F_0(t) = \tfrac12\sqrt{\pi/t}\,\mathrm{erf}\sqrt t$ を用いた $-\sum_c Z_c\,\tfrac{2\pi}{\alpha+\beta}\,e^{-\dots}F_0\big((\alpha+\beta)|P - C|^2\big)$
- ブラとケットの対テンソルを互いにブロードキャストし、一つの einsum で $p, q, r, t$ について和
- 対称（レーヴディン）直交化：$X^{\mathsf T}SX = 1$
- クーロン行列 $J$；$\lambda, \sigma$ の繰り返し ⇒ 和
- 交換行列 $K$：同じテンソルを添字を入れ替えて読む
- SCF 反復ごとに一回のバッチ eigh；$C = XC^{\prime}$
- マリケン電子数：ちょうど 2
- ポテンシャル曲線、結合長ごとに一要素
labels:
  molecule: 分子
  R_min: 最短の結合長 $R$
  R_max: 最長の結合長 $R$
  n_bond_lengths: バッチ内の結合長の数
