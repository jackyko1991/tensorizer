source_hash: 698c7a054398
title: डॉप्लर प्रभाव और मैक शंकु
summary: चाल $v_s$ से चलता स्रोत प्रति आवर्तकाल एक वृत्ताकार तरंगाग्र उत्सर्जित करता है। हर तरंगाग्र एक टेंसर (उत्सर्जन समय, उत्सर्जन बिंदु) की एक पंक्ति है, इसलिए किसी भी समय उसकी त्रिज्या एक घटाव है। तरंगाग्र आगे सघन और पीछे विरल होते हैं; ध्वनि की चाल से ऊपर वे एक मैक शंकु में ढेर हो जाते हैं।
notes: 'सुनी गई आवृत्ति बस प्रति सेकंड पहुँचने वाले तरंगाग्रों की संख्या है: स्रोत के आगे तरंगाग्र पास-पास उत्सर्जित हुए थे, इसलिए $f'' = f\,c/(c - v_s)$; पीछे, $f'' = f\,c/(c + v_s)$। श्रोता गति की रेखा पर रखे गए हैं जहाँ ये सूत्र सटीक हैं। $v_s > c$ (मैक संख्या $M = v_s/c > 1$) के लिए स्रोत अपनी ही ध्वनि से आगे निकल जाता है: सभी तरंगाग्र दो सीधी रेखाओं को छूते हैं, जो अर्ध-कोण $\mu$ वाला मैक शंकु है, जहाँ $\sin\mu = 1/M$। तब आगे वाला श्रोता शंकु के गुज़रने तक कुछ नहीं सुनता, और तरंगाग्र उलटे क्रम में पहुँचते हैं। ध्वनि की चाल $c = 340$ m/s; केवल स्रोत चलता है, हवा स्थिर है।'
meanings:
- हर आवर्तकाल $1/f$ में एक तरंगाग्र
- तरंगाग्र $e$ उत्सर्जित करते समय स्रोत कहाँ था
- समय $t$ पर हर तरंगाग्र की त्रिज्या (अभी उत्सर्जित न हुआ हो तो शून्य)
- स्रोत के आगे और पीछे के श्रोता
- 'दोहराया गया $i$ ⇒ योग: हर उत्सर्जन बिंदु से हर श्रोता तक दूरी का वर्ग'
- तरंगाग्र $e$ श्रोता $o$ तक कब पहुँचता है
labels:
  mach: मैक संख्या $v_s/c$
  f: स्रोत आवृत्ति $f$ (दिखाए गए तरंगाग्र)
  t_max: सिमुलेशन समय
