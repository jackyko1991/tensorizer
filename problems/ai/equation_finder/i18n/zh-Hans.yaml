title: 方程发现器：写出数据背后控制方程的张量 AI
summary: 给它场数据，它会以 LaTeX 返回定律。候选项库（$1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$）通过有限差分、Savitzky–Golay 滤波器或弱形式构建，再由序贯阈值岭回归（PDE-FIND）保留少数能解释 $\partial_t u$ 的项。它从模拟数据中恢复 Lorenz 系统、热方程、黏性 Burgers 方程，以及由 Yee FDTD 仿真得到的 Maxwell 方程组（$c$ 的误差为 0.2 %，弱形式为 0.03 %），并找出隐藏在项库中的 $\nabla\cdot\mathbf B = 0$；噪声研究则显示每种导数估计方法在何处失效。
notes: 构想。这是 Jacky Ka Long Ko 的“自动物理方程发现器”：一个小型张量 AI，观察场数据并以 LaTeX 写出控制它的方程（SINDy / PDE-FIND 方法）。它延续 MNIST 上的算子搜索，那次的结论是“手写数字没有控制方程”；这里的数据来自定律，所以有东西可找。架构分为三个模块：(1) 去噪平滑器，(2) einsum / 有限差分导数引擎，(3) 稀疏算子回归。这里 (2) 和 (3) 已完成，(1) 是 Savitzky–Golay 平滑器（不需要神经网络）。方法。每个候选项都是场的单项式的导数 $D^\alpha(\prod_g u_g^{p_g})$：Lorenz 系统用最高 3 次的 20 个单项式，一维方程用 13 项 $D^d(u^p)$（$p, d \le 3$），Maxwell 用 17 项（场本身、其 $x$ 和 $y$ 导数、其拉普拉斯算子、几个乘积）。构建线性系统 $\partial_t u = \Theta\xi$ 有三种方式：中心有限差分（fd）；Savitzky–Golay（sg：先在 7 个样本上做三次平滑，再在 9 个样本上做四次导数拟合），两者都是逐轴的一维卷积；以及弱形式（weak SINDy，Messenger and Bortz 2021），将方程对凸包函数 $(1-s^2)^{10}$ 积分，并通过分部积分把所有导数移到凸包函数上，每轴一次张量缩并。接着在单位范数的列上运行 STRidge（Rudy et al. 2017）：岭回归、把小于 $\tau$ 的系数全部置零、重新拟合、重复；对 3 种岭强度扫描 41 个阈值，保留的模型是验证误差在最佳值 5 %（+ $10^{-3}$）以内、且项数最少者。较大的岭强度对 Maxwell 很重要：由于 $\nabla\cdot\mathbf B = 0$，列 $\partial_x B_x$ 与 $\partial_y B_y$ 几乎反向，岭太弱时回归会在 $E_z$ 方程中加入 $2200\,\nabla\cdot\mathbf B$。系数用最小二乘法在保留的项上重新拟合，± 由对行的 bootstrap 求得；这个 ± 仅是统计误差，不包含导数估计的偏差，因此往往远小于真实误差。另一种回归是 operator_search_mnist 的
  DARTS 式松弛：$\xi = \sigma(\alpha/T)\,w$ 加上门控惩罚，温度从 1 退火到 0.01。数据全部在此模拟：8 条 Lorenz 轨迹（RK4）；10 cm 周期性细杆上的热方程，用 Fourier 模态求精确解（$D$ = 0.2 cm²/s）；$2\pi$ m 上的黏性 Burgers 方程，用 Cole–Hopf 变换求精确解（$\nu$ = 0.1 m²/s）；周期性 6.4 cm 盒中的 Maxwell 方程，由 Yee FDTD 仿真（TM 模式，0.5 mm 网格，Courant 数 0.5），并像实际测量一样采样（所有场插值到相同的点和时间）。噪声：高斯噪声，为各场标准差的 0、0.1、1 和 5 %。结果。测试检查：核与弱形式在微积分上应精确之处确实精确；数据符合其定律（热核、Cole–Hopf、Yee 将 $\nabla\cdot\mathbf B = 0$ 保持在舍入误差内，并使能量守恒在 0.2 % 以内）；STRidge 能精确恢复植入的稀疏向量；每个目标都能从干净数据恢复；写出的 LaTeX 经解析器读回后能重现拟合的模型。随附的运行结果（干净数据、有限差分）：Lorenz $\sigma$ = 9.9987、$\rho$ = 27.989、$\beta$ = 2.6662；热方程 $D$ = 0.20023 cm²/s；Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$；Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$，$c$ = 29.92 cm/ns（真值 29.98），以及系数 0.996 的 $\partial_t \mathbf B = -\nabla\times\mathbf E$。弱形式准确得多（精确数据上误差为 $10^{-8}$；Maxwell 上为 0.03 %，这是 Yee 格式本身的数值色散，而非发现器的误差）。Maxwell 项库的最小奇异向量为 $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$，其奇异值比下一个小 220 倍：数据揭示 $\nabla\cdot\mathbf B = 0$ 是一条隐含定律。噪声（是否找到正确的项？）：有限差分在热方程和
  Burgers 上从 0.1 % 噪声起失败，在 Lorenz 上从 1 % 起失败，只有 Maxwell 能撑过 5 %（系数误差 25 %）；Savitzky–Golay 在所有情况都撑过 0.1 %，只有 Maxwell 撑过 5 %；弱形式在热方程、Burgers 和 Maxwell 上于所有噪声水平都找到正确的项（5 % 噪声下系数误差分别为 7 %、6 % 和 0.1 %），Lorenz 则到 1 % 为止（5 % 时会在 $\dot y$ 中加入两个极小的虚假项）。退火门控在 Burgers 和 Maxwell 上与弱形式 STRidge 一致，但在所有噪声水平、所有尝试过的惩罚（$10^{-6}$ 到 $10^{-3}$）下都漏掉 Lorenz $\dot y$ 的 $-y$ 项：$25.5\,x - 0.95\,xz$ 吸收了它，这是松弛法无法离开的局部极小值；它们在热方程 5 % 噪声时也会失败。用从第一个快照找到的方程重新模拟，可将热方程和 Burgers 数据重现到 $3\times 10^{-4}$，Maxwell 到 3 %；Lorenz 在 5 个时间单位后偏差 3 %，因为混沌会放大 0.01 % 的系数误差。results/noise_study.csv 和 results/equations.tex 保存了所有数值和方程；每个目标各有一个 GIF（以 Maxwell 为主），另有 results/summary.png。结论。发现器能从干净、采样充分的数据中恢复已知的方程形式，使用弱形式时还能容忍现实程度的噪声；最先失效的是导数估计，而非回归。它只能找到项库中有的项，需要测量到正确的变量，而且发现的方程只是假说：没有独立验证，它不会发现新的物理（或生理）。它也不是大语言模型的替代品；这是不同的任务（把定律拟合到数据上，而非生成文本）。相关工作。SINDy（Brunton, Proctor and Kutz 2016）、PDE-FIND 和 STRidge（Rudy et al. 2017）、weak SINDy（Messenger and Bortz 2021）；基于遗传编程的符号回归（Schmidt and Lipson 2009）和 AI Feynman（Udrescu and Tegmark 2020）；Yee 格式（Yee
  1966）。动手试试。减少 bootstrap 重采样次数以加快运行，增加门控步数看松弛法能否逃出 Lorenz 的局部极小值（到 4000 步仍未逃出），或使用更粗的 Yee 网格。
meanings:
- 项库：第 $k$ 列是每个内部网格点 $n$ 上的候选项 $D^\alpha(\prod_g u_g^{p_g})$，例如 $u u_x = \tfrac12\partial_x(u^2)$、$\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$
- 导数引擎：沿单一轴的一维卷积；中心差分，或先做三次平滑后的 Savitzky–Golay（在 $2m+1$ 个样本上的 $p$ 次最小二乘多项式）
- 弱形式：对 $x$ 和 $t$ 求和；导数作用在平滑的凸包函数 $\phi(s) = (1-s^2)^{10}$ 上，从不作用在含噪声的数据上
- 对每个方程 $f$ 在其保留的项上一次批量求解岭回归；STRidge 将 $|\hat\xi_k| < \tau$ 置零并重新拟合
- 阈值扫描：保留验证误差在最佳值 5 %（+ $10^{-3}$）以内、且项数最少的模型
- DARTS 式的替代方法：$\xi = \sigma(\alpha/T)\, w$ 加上门控惩罚，温度从 1 退火到 0.01
- bootstrap：将 $B$ 次行重采样表示为多项分布权重，所有拟合在一次批量求解中完成
- 写出的 LaTeX 经解析器读回：在打印精度内重现拟合的模型
labels:
  bootstrap: 用于估计各系数 ± 的 bootstrap 重采样次数
  gate_steps: 退火门控搜索的 Adam 步数
  maxwell_grid: Maxwell 模拟的 Yee 网格（$n \times n$ 个 0.5 mm 网格）
