title: न्यूनतम STO-3G आधार में $\mathrm{H_2}$ के लिए हार्ट्री–फ़ॉक
summary: Szabo और Ostlund की पाठ्यपुस्तक वाली स्व-संगत क्षेत्र (SCF) गणना, टेंसरों के साथ लिखी गई। हर हाइड्रोजन पर तीन गाउसीयों से बना एक 1s फलन है (STO-3G); अतिव्यापन, गतिज, नाभिकीय-आकर्षण और द्वि-इलेक्ट्रॉन समाकलों के बंद रूप हैं, फ़ॉक आव्यूह $(\mu\nu|\lambda\sigma)$ टेंसर के साथ घनत्व का संकुचन है, और रूथान समीकरण $FC = SC\varepsilon$ बंध लंबाइयों के पूरे बैच के लिए एक साथ eigh से हल किए जाते हैं। $R = 1.4$ bohr पर यह $E = -1.1167$ hartree देता है; स्कैन बंध लंबाई खोजता है और दिखाता है कि प्रतिबंधित हार्ट्री–फ़ॉक बंध को क्यों नहीं तोड़ सकता।
notes: 'परमाणु इकाइयाँ: लंबाइयाँ bohr में ($a_0 = 0.529$ Å) और ऊर्जाएँ hartree में ($E_h = 27.21$ eV)। आधार STO-3G है, स्लेटर घातांक $\zeta_{\mathrm H} = 1.24$ और $\zeta_{\mathrm{He}} = 2.0925$ के साथ, जैसे Szabo और Ostlund, Modern Quantum Chemistry (1982; Dover संस्करण 1996), अध्याय 3 में; दो आधार फलनों के साथ हर आव्यूह $2\times2$ है, इसलिए आप हर संख्या को पुस्तक से जाँच सकते हैं: $S_{12} = 0.6593$, $T_{11} = 0.7600$, $R = 1.4$ bohr पर $E = -1.1167$ hartree, और $R = 1.4632$ bohr पर $\mathrm{HeH^+}$ के लिए $-2.8607$ hartree। SCF $P = 0$ (कोर हैमिल्टनी) से शुरू होता है; $\mathrm{H_2}$ के लिए सममिति कक्षकों $\psi_{1,2} \propto \phi_A \pm \phi_B$ को तय कर देती है और यह तुरंत अभिसरित होता है, जबकि $\mathrm{HeH^+}$ को दर्जन भर पास चाहिए क्योंकि आवेश हीलियम पर प्रवाहित होता है। हर बंध लंबाई एक बैच प्रविष्टि है, इसलिए SCF पूरे वक्र के लिए एक लूप में चलता है। प्रतिबंधित हार्ट्री–फ़ॉक दोनों इलेक्ट्रॉनों को एक ही स्थानिक कक्षक $\psi_1$ में रखता है; बड़े $R$ पर वह अवस्था आधी $\mathrm{H + H}$ और आधी
  आयनिक $\mathrm{H^+ + H^-}$ है, इसलिए वक्र $2E_{\mathrm H}$ से बहुत ऊपर उठता है। धराशायी वक्र उसी आधार में पूर्ण विन्यास अन्योन्यक्रिया (full CI) है ($|1^2\rangle$, $|1^12^1\rangle$, $|2^2\rangle$ का $3\times3$ एकक आव्यूह): यह $|2^2\rangle$ को मिलाता है, सही ढंग से वियोजित होता है, और साम्य पर RHF से इसका अंतर (लगभग $-0.02$ hartree) सहसंबंध ऊर्जा है। न्यूनतम आधार सटीक $\mathrm{H_2}$ ऊर्जा, $R = 1.4$ bohr पर $-1.1745$ hartree, से बहुत दूर है; बड़े आधारों को p और d फलन तथा सामान्य गाउसीय समाकल पुनरावृत्ति संबंध चाहिए। $\mathrm{HeH^+}$ आज़माएँ: वहाँ RHF वक्र सही सीमा, $\mathrm{He + H^+}$, तक पहुँचता है, क्योंकि दोनों इलेक्ट्रॉन हीलियम पर पहुँच जाते हैं।'
meanings:
- प्रति फलन तीन गाउसीय घातांक, $\alpha_p\zeta^2$, और संकुचन गुणांक जिनमें आद्य प्रसामान्यीकरण $(2\alpha/\pi)^{3/4}$ समाहित है
- बैच में हर बंध लंबाई $R_b$ के लिए दो नाभिक (और आधार केंद्र)
- दो गाउसीय गुणा होकर $P = (\alpha A + \beta B)/(\alpha + \beta)$ पर एक गाउसीय बनते हैं
- 'दोहराए गए $p, q$ ⇒ योग: आद्यों पर संकुचन; $T$, $V$ के लिए भी वही'
- $-\sum_c Z_c\,\tfrac{2\pi}{\alpha+\beta}\,e^{-\dots}F_0\big((\alpha+\beta)|P - C|^2\big)$, बॉयज़ फलन $F_0(t) = \tfrac12\sqrt{\pi/t}\,\mathrm{erf}\sqrt t$ के साथ
- ब्रा और केट युग्म टेंसर एक-दूसरे के विरुद्ध ब्रॉडकास्ट, फिर $p, q, r, t$ पर एक einsum में योग
- 'सममित (लोव्डिन) लांबिकीकरण: $X^{\mathsf T}SX = 1$'
- कूलॉम आव्यूह $J$; दोहराए गए $\lambda, \sigma$ ⇒ योग
- 'विनिमय आव्यूह $K$: वही टेंसर सूचकांकों को अदला-बदली करके पढ़ा गया'
- प्रति SCF पास एक बैच eigh; $C = XC^{\prime}$
- 'मुलिकेन इलेक्ट्रॉन गणना: ठीक 2'
- विभव वक्र, प्रति बंध लंबाई एक प्रविष्टि
