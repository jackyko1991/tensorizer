source_hash: 65c4646e64b8
title: 速率方程与阿伦尼乌斯图
summary: 反应有多快？温度升高时又快多少？零级、一级和二级速率方程在一个 $(O, T)$ 张量中同时对六个温度积分，$k(T) = A\,e^{-E_a/RT}$。随后，一个带噪声的合成实验揭示出其反应级数（$[A]$、$\ln[A]$ 和 $1/[A]$ 中哪个图是直线？）及活化能（对 $\ln k$ 与 $1/T$ 做最小二乘直线拟合）。
notes: 每个速率方程都有一个积分形式，在合适的变量下变成直线：$[A] = [A]_0 - kt$（零级）、$\ln[A] = \ln[A]_0 - kt$（一级）和 $1/[A] = 1/[A]_0 + kt$（二级）。所以化学家把三种图都画出来，保留最直的那个（$R^2$ 最接近 1）；其斜率为 $\mp k$。第二种检验利用半衰期：由于 $t_{1/2} \propto [A]_0^{1-n}$，从 $[A]_0/2$ 到 $[A]_0/4$ 的时间是第一个半衰期的 $2^{n-1}$ 倍（更短、相等或两倍长），由此得到 $n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$。在几个温度下重复实验得到 $k(T)$，$\ln k$ 对 $1/T$ 的阿伦尼乌斯图是一条斜率为 $-E_a/R$ 的直线。取 $E_a = 75$ kJ/mol 时，从 290 K 升温到 300 K 大约使反应加快 2.8 倍；“每升高 10 K 快一倍”的老经验法则对应于室温附近 $E_a \approx 50$ kJ/mol。每次实验都跟踪到 90 % 的 A 反应完为止，因此低温实验比高温实验持续得久得多（见图例）；左图使用每次实验时间的比例，使六条曲线都能放在同一坐标轴上，这不会改变哪个图是直线。数据是合成的（虚构的反应，固定随机种子的高斯噪声）。取 $\ln$ 或 $1/x$ 会放大后期稀释点的噪声（$\sigma/[A]$ 和 $\sigma/[A]^2$），因此每个点按 $(dg/d[A])^{-2}$ 加权，即按 $1$、$[A]^2$ 或 $[A]^4$，低于 $[A]_0$ 的 2 % 的点被剔除。试试更大的噪声，看 $R^2$ 检验变得不那么有决定性，或更窄的温度范围，看 $E_a$ 的误差增大。
meanings:
- $T_{min}$ 与 $T_{max}$ 之间的六个温度（K）
- 反应级数 $0, 1, 2$，并排积分
- 阿伦尼乌斯速率常数，单位 $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$
- 每次实验的速率；不对任何指标求和，$k_t$ 在各级数上广播
- 每次实验跟踪到 90 % 转化率，使用各自的时钟 $t = \tau\,t_{end}$
- RK4 轨迹，在测试中与精确积分式比较
- 三种对 $t$ 的图；只有正确的级数给出直线
- 直线拟合的设计矩阵
- 正规方程矩阵；对 $s$（样本）求和；权重 $w_s = (dg/d[A])^{-2}$，$w_s = 0$ 剔除低于 $[A]_0$ 的 2 % 的点
- 截距和斜率，对每种图和每个温度同时求得
- 阿伦尼乌斯直线：斜率 $-E_a/R$，截距 $\ln A$
labels:
  Ea: 活化能 $E_a$
  log10_A: 指前因子 $\log_{10} A$
  order: 被测反应的级数
  T_min: 最低温度 $T_{min}$
  T_max: 最高温度 $T_{max}$
  noise: 测量噪声 $\sigma$
