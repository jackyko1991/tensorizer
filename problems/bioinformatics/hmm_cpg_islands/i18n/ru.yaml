source_hash: 5165c35a9a08
title: Поиск CpG-островков скрытой марковской моделью
summary: 'Последовательность ДНК незаметно переключается между обычным фоном и GC-богатыми CpG-островками. Двухсостоянийная скрытая марковская модель находит их: алгоритм прямого–обратного хода даёт вероятность нахождения в островке в каждой позиции, Витерби — единственную лучшую сегментацию, а Баум–Велш обучает модель только по последовательностям. Каждый шаг вдоль последовательности — пакетное матричное произведение по состояниям, выполняемое в логарифмическом пространстве. Смотрите, как апостериорная вероятность фиксируется на заданных островках.'
notes: 'Данные синтетические: в каждую последовательность в случайных местах вставлены островки длиной 100–300 букв с повышенным содержанием C и G. Одна буква почти ничего не говорит о состоянии, но цепь $A$ делает состояния устойчивыми, поэтому прямой и обратный проходы объединяют свидетельства целых участков. Баум–Велш — это алгоритм ожидания–максимизации: вычислить $\gamma$ и $\xi$ при текущей модели, затем положить $E_{k\alpha}$ равными ожидаемым частотам букв в каждом состоянии, а $A_{ij}$ — ожидаемым частотам переключений; правдоподобие никогда не убывает. Начав с грубого предположения, он приходит близко к истинной модели (зелёная линия). Реальные CpG-островки обогащены динуклеотидом CG, а не просто C и G; Durbin et al. моделируют это 8 состояниями (A+, C+, G+, T+, A−, …), переходы между которыми — динуклеотидные частоты. Понизьте GC-состав островков, чтобы усложнить задачу.'
meanings:
- буква в позиции $t$ последовательности $b$, one-hot по A, C, G, T
- начальные вероятности, вероятности переходов и испускания; состояние 0 — фон, состояние 1 — островок
- 'повторяющийся $\alpha$ ⇒ суммирование: насколько вероятно, что каждое состояние испустит увиденную букву'
- повторяющийся $i$ ⇒ суммирование; хранится как $\log\alpha$ с вынесенным наибольшим элементом (log-sum-exp), чтобы не было потери значимости
- 'повторяющийся $j$ ⇒ суммирование: вероятность оставшейся части последовательности при состоянии $i$'
- апостериорная вероятность $P(z_t = k \mid x)$; $\gamma_{bt1}$ — синяя кривая
- 'Витерби: та же рекурсия с max вместо суммы плюс обратные указатели для лучшего пути'
- 'повторяющиеся $b, t$ ⇒ суммирование: ожидаемое число переключений $i \to j$; Баум–Велш полагает $A_{ij} \propto \xi_{ij}$'
labels:
  n_seq: Последовательности $B$
  length: Длина $T$
  n_islands: Островков на последовательность
  gc_island: GC-состав островков
  iterations: Итерации Баума–Велша
