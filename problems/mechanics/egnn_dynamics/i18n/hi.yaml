title: कण गतिकी के लिए E(n)-समचर ग्राफ़ न्यूरल नेटवर्क
summary: एक छोटा E(n)-समचर (equivariant) ग्राफ़ न्यूरल नेटवर्क (EGNN) आवेशित कणों के एक 3D तंत्र को समय में आगे बढ़ाना सीखता है। इसके संदेश केवल दूरियों $|\mathbf x_i - \mathbf x_j|^2$ पर निर्भर करते हैं और इसके निर्देशांक अद्यतन $\mathbf x_i - \mathbf x_j$ की दिशा में होते हैं, इसलिए इनपुट को घुमाने से भविष्यवाणी ठीक उतनी ही घूमती है; उसी डेटा पर एक सादे MLP को यह सीखना पड़ता है, और वह नहीं सीखता।
notes: 'वास्तविक तंत्र: आवेश $c_i = \pm 1$ वाले $N$ इकाई-द्रव्यमान कण, मृदुकृत कूलॉम बल और हर युग्म के बीच कमज़ोर स्प्रिंग $k_s$ (ताकि बादल साथ बना रहे), $\Delta t / 10$ के चरण पर RK4 से समाकलित। दोनों नेटवर्क कुछ यादृच्छिक तंत्रों से वही युग्म ($t$ पर अवस्था, $t + \Delta t$ पर अवस्था) देखते हैं और माध्य वर्ग त्रुटि पर Adam से प्रशिक्षित होते हैं; अलग रखे गए तंत्र परीक्षण त्रुटि देते हैं। EGNN (Satorras, Hoogeboom & Welling, "E(n) Equivariant Graph Neural Networks", ICML 2021) हर युग्म के लिए केवल निश्चर इनपुट (नोड लक्षण, $d_{ij} = |\mathbf x_i - \mathbf x_j|^2$ और आवेश गुणनफल) से एक संदेश $m_{ij}$ बनाता है, फिर हर कण को सीखे गए अदिश भारों के साथ दिशाओं $\mathbf x_i - \mathbf x_j$ के अनुदिश खिसकाता है। ध्यान दें कि यह ठीक वास्तविक बल नियम का रूप है, $\ddot{\mathbf x}_i = \sum_j w_{ij}(\mathbf x_i - \mathbf x_j)$: सममिति डेटा से सीखी जाने के बजाय वास्तुकला में ही निर्मित है। जाँच एक परीक्षण इनपुट को यादृच्छिक $R$ और $\mathbf s$ से घुमाती और खिसकाती है: EGNN के लिए $f(R\mathbf x + \mathbf
  s) = Rf(\mathbf x) + \mathbf s$ float32 पूर्णांकन-त्रुटि (लगभग $10^{-6}$) तक सत्य है, जबकि MLP के लिए, जो चपटे निर्देशांक देखता है, असंगति स्वयं भविष्यवाणी के क्रम की है। कम प्रशिक्षण तंत्रों के साथ EGNN कहीं कम भारों से कम परीक्षण त्रुटि तक पहुँचता है। रोलआउट में हर मॉडल को उसकी अपनी भविष्यवाणियाँ दी जाती हैं; दोनों में त्रुटियाँ बढ़ती जाती हैं, क्योंकि आवेशित तंत्र अव्यवस्थित (chaotic) है, पर EGNN अधिक देर तक निकट रहता है। सरलीकरण: चौड़ाई 32 की तीन परतें, $\tau = \Delta t / L$ के साथ EGNN का वेग संस्करण (हमारा चुनाव), पूर्ण-बैच प्रशिक्षण और स्थिर बीज। यही समचर संदेश-प्रेषण विचार NequIP (Batzner et al., Nature Communications 2022) जैसे मशीन-सीखे अंतरपरमाणुक विभवों और 3D अणु उत्पन्न करने वाले समचर विसरण मॉडलों (Hoogeboom et al., ICML 2022) का आधार है। कम प्रशिक्षण तंत्र आज़माएँ: दोनों नेटवर्कों के बीच का अंतर बढ़ता है।'
meanings:
- तंत्र $b$ में कण $i$ की स्थिति और वेग, कार्तीय घटक $a$
- ब्रॉडकास्टिंग से सभी युग्म पृथक्करण
- 'दोहराया गया $a$ ⇒ योग: वर्ग दूरियाँ, MLP का एकमात्र ज्यामितीय इनपुट (घूर्णन-निश्चर)'
- 'वास्तविक बल: दोहराया गया $j$ ⇒ साझेदारों पर योग (कूलॉम और स्प्रिंग)'
- हर युग्म पर संदेश, $H = 32$ लक्षण
- 'निर्देशांक अद्यतन: दोहराया गया $j$ ⇒ योग; केवल $\mathbf x_i - \mathbf x_j$ से बना सदिश, इसलिए यह इनपुट के साथ घूमता है'
- 'एक निश्चर अदिश गुणा एक सदिश: अब भी समचर'
- समचरता जाँच के लिए प्रयुक्त यादृच्छिक घूर्णन
