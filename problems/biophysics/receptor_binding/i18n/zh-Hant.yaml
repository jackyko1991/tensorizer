source_hash: 9b626f6fbe35
title: 受體–配體結合（$k_{\mathrm{on}}$、$k_{\mathrm{off}}$）
summary: 免疫受體（T 細胞受體或抗體）與其目標結合得多緊、多久？以結合速率 $k_{on}$ 與解離速率 $k_{off}$ 的質量作用動力學，在單一 $(B, C)$ 張量中同時求解多種受體變體與整組配體濃度滴定，並以 SPR 式感測圖搭配結合等溫線呈現。
notes: 結合需要一個游離受體與一個游離配體相遇，所以速率為 $k_{on} R L$；解離則由每個複合物各自發生，速率為 $k_{off} C$。平衡時兩者相等，結合分率為 $\theta = L/(L + K_D)$，其中 $K_D = k_{off}/k_{on}$：當 $L = K_D$ 時一半的受體被占據（每條等溫線上的刻記）。從空的受體開始，趨近過程為指數形式 $C(t) = C_{eq}(1 - e^{-k_{obs} t})$，其中 $k_{obs} = k_{on} L + k_{off}$，SPR（表面電漿共振）儀器正是以此量測 $k_{on}$；緩衝液沖洗後，複合物以 $e^{-k_{off} t}$ 衰減，半衰期 $t_{1/2} = \ln 2 / k_{off}$，即停留時間。各變體涵蓋真實範圍：T 細胞受體與胜肽–MHC 結合較弱（$K_D \sim 1$–$10\,\mu$M，停留時間為數秒），抗體則結合緊密（$K_D \sim 0.1$ nM，停留時間為數小時）。看看等溫線上的點：低濃度時 $k_{obs} \approx k_{off}$ 很小，因此開始沖洗時抗體尚未達到平衡。為何 $k_{off}$ 對 T 細胞如此重要？在動力學校對（kinetic proofreading）的圖像中，結合的 TCR 必須先通過數個訊號傳遞步驟（磷酸化）才能活化細胞，而若配體先脫離，一切便歸零重來。存活時間比這些步驟更長的複合物遠更可能發出訊號，因此 T 細胞讀取的是停留時間 $1/k_{off}$，而不只是占據率，進而能分辨外來胜肽與親和力僅略有差異的自身胜肽。簡化：每個受體只有一個結合位（無親合力效應或再結合）、溶液均勻混合且無質傳限制；開啟配體耗竭時，每個複合物會從封閉體積中移除一個配體，平衡則遵循二次方程式的解，而非 $L/(L + K_D)$。
meanings:
- 受體變體 $b$ 的速率常數（弱／中／高親和力 TCR、抗體）
- 滴定的配體濃度 $c$（nM）；最後一個用於感測圖
- 各變體與各濃度下的游離受體與複合物
- 游離配體：$L_c$，或考慮耗竭時為 $L_c - C_{bc}$
- 不對任何指標求和：$k_b$ 廣播到每個濃度 $c$
- RK4 的右端項；$R$ 與 $C$ 以 $\mp J$ 變化，故 $R + C = R_T$
- 解離常數：使一半受體被結合的配體濃度
- 平衡占據率（虛線等溫線）
labels:
  log10_L: 感測圖配體 $\log_{10}(L/\mu\mathrm{M})$
  t_assoc: 結合時間
  t_dissoc: 解離時間
  depletion: 配體耗竭
  R_T: 受體濃度 $R_T$
