title: 搜索自相似爆破剖面
summary: 如今追捕奇点的方法：写出 $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$，把偏微分方程化为剖面 $U$ 的方程，其中指数 $\lambda$ 未知，再用高斯–牛顿法把一批候选剖面（每个试探值 $\lambda$ 一个）作为一个张量来训练。对无黏伯格斯方程，残差漏斗只在精确值 $\lambda = 1/(2i+2)$ 处塌陷，学到的剖面与经典的 $y = -U - U^{2i+3}$ 吻合。同样的搜索用于非局部的科尔多瓦–科尔多瓦–丰特洛斯方程，找到其稳定指数 $\lambda \approx 1.18$。
notes: 本题是 fluids/navier_stokes_blowup 的姊妹篇，后者展示 1983 年的图景：让泰勒–格林涡向前演化，看着涡量增长，直到网格跟不上。现代方法跳过时间演化：它假定奇点是自相似的，直接搜索剖面。把 $u = \tau^\lambda U(y)$ 代入 $u_t + uu_x = 0$ 得到 $-\lambda U + ((1+\lambda)y + U)U' = 0$。把它当作关于 $y(U)$ 的线性常微分方程求解，得到 $y = -U - C\,U^{1+1/\lambda}$，只有当 $1 + 1/\lambda$ 为奇数时才光滑。因此 $\lambda = 1/(2i+2)$，精确剖面为 $y = -U - U^{2i+3}$（以 $U'(0) = -1$ 和 $U(-2) = 1$ 归一化）。这些是经典结果（Eggers & Fontelos, Singularities, 2015）。$\lambda = 1/2$ 是稳定的、一般的爆破；$1/4, 1/6, \dots$ 需要精细调节的初值。这里在固定 $\lambda$ 下同时训练 61 个候选剖面。最佳残差随 $\lambda$ 的变化（漏斗）在 $\lambda = 1/2$ 处降到舍入误差（$\sim10^{-15}$），在 $1/4$ 处降到 $\sim10^{-11}$。两者之间残差大得多（在 $\lambda = 0.37$ 处大 $\sim10^{7}$ 倍），因为那里只存在含非光滑项 $|y|^{1+1/\lambda}$ 的剖面。施加 $U'''(0) = 0$ 会去掉 $1/2$ 处的漏斗，搜索随即找到 $1/4$。再加上 $U^{(5)}(0) = 0$ 本应选出 $1/6$，但在此分辨率下 $1/6$ 附近的漏斗太平，无法定位：竞争剖面只在 $y^{7}$ 阶上有差别，浅的极小值落在 $\lambda \approx 0.19$。残差无法区分稳定与不稳定：那是时间演化的性质，这里的不稳定剖面只能通过额外约束得到。剖面是一个谱展开，带有研究中使用的归纳偏置——紧化坐标和输出整形；研究论文使用带同样偏置的物理信息神经网络（PINN）。高斯–牛顿法是 Wang et al. (2025) 使用的优化器。对 $\lambda$ 的梯度步会卡在每个漏斗的尖底，因此用批量的黄金分割搜索确定
  $\lambda$。CCF 方程 $\theta_t - (H\theta)\theta_x = 0$（表面准地转方程的一维模型；$H$ 是希尔伯特变换）以涡量形式 $\omega = \theta_x = \Omega(y)/\tau$ 求解。$\Omega$ 用 $\operatorname{Im}(1-iy)^{-s}$、$s = j/(1+\lambda) + m$ 展开，其希尔伯特变换是精确的。默认运行得到 $\lambda \approx 1.18$（残差 $\sim10^{-4}$）；用更大的基做更长的运行会稳定在 $1.1808$（残差 $2\times10^{-6}$）。这与 Eggers & Fontelos (Nonlinearity, 2020) 的基态指数 $\approx 1.18$ 一致。Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) 用 PINN 找到第一个不稳定 CCF 剖面 $\lambda_1 \approx 0.6057$。Wang et al. (2025, arXiv 2509.14185) 找到第二个 $\lambda_2 \approx 0.4713$，残差达到 $10^{-13}$ 左右，接近双精度。他们还为多孔介质方程和布西内斯克方程找到新的不稳定族，这些是数值候选。不稳定剖面有陡峭的梯度，这个一分钟的 CPU 搜索无法分辨，只显示稳定漏斗。现状：伯格斯剖面是精确的定理。CCF 的爆破由 Córdoba, Córdoba & Fontelos (Annals, 2005) 证明。神经搜索找到的剖面在计算机辅助证明把它们变成定理之前都是数值候选，Chen & Hou (2022) 就对带边界的轴对称欧拉方程的侯–罗情形做到了这一点。三维不可压缩纳维–斯托克斯千禧年问题仍未解决，这里的内容与之没有直接关系。试试更粗的 $\lambda$ 网格或更少的高斯–牛顿步，看漏斗变模糊。
meanings:
- 这一批：每个候选剖面一个试探指数，全部同时训练
- 紧化坐标 $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$：在 $y = 0$ 处 $r = 1$，当 $|y| \to \infty$ 时 $r \to 0$
- 奇对称、$U'(0) = -1$ 和远场 $U \sim y^{\lambda/(1+\lambda)}$ 已内置；$P$ 是关于 $r$ 的切比雪夫级数
- 配点处的剖面方程残差，加上 $U(2) = -1$ 和光滑性约束
- $R$ 是 $c$ 的二次式，所以雅可比矩阵是精确的（测试中与 autograd 核对）
- 对批中每个成员做莱文伯格–马夸特（阻尼高斯–牛顿）步，一次批量求解完成
- $U = -y + c_3y^3 + c_5y^5 + \dots$ 的泰勒系数；令其为零会去掉 $\lambda = 1/2$ 和 $1/4$ 处的漏斗
- CCF 基的精确希尔伯特变换：$(1-iy)^{-s}$ 在上半平面解析
- 确定每个漏斗的底；每个试探值 $\lambda$ 都重新训练剖面
labels:
  n_lambda: 批大小：试探指数 $\lambda$
  gn_steps: 每个剖面的高斯–牛顿步数
  ccf_lambda0: CCF 初始指数 $\lambda_0$
