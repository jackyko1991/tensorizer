title: 물탱크 배수 (토리첼리)
summary: 물은 토리첼리 속력 $\sqrt{2gh}$로 구멍을 빠져나가므로, 수위는 처음에 빠르게, 나중에는 천천히 내려갑니다. 구멍 크기가 서로 다른 탱크들을 배치 텐서 하나로 함께 적분하고 정확한 해 $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$와 비교합니다.
notes: 토리첼리 법칙은 자유 수면($A \gg a$이므로 정지)과 분출 물줄기 사이에 베르누이 법칙을 적용하면 나옵니다. 둘 다 대기압입니다. 실제 구멍에서는 물줄기가 구멍 넓이의 약 60 %로 수축하므로(축류, vena contracta) 실제 탱크는 더 천천히 비워집니다. $a$에 유량 계수 $C_d \approx 0.6$을 곱하면 됩니다. 구멍 지름을 두 배로 하면 배수 시간은 4분의 1이 되고, 처음 높이를 두 배로 하면 배수 시간은 $\sqrt2$배가 될 뿐입니다. 떨어지는 물줄기는 가속되면서 가늘어집니다. 이것도 연속 방정식입니다.
meanings:
- 시간에 따른 탱크 $b$의 수위
- 탱크 $b$의 구멍 넓이 — 배치 지표
- 모든 탱크의 단면적
- 토리첼리 유출 속력
- RK4로 적분하는 우변
- '반복 지표 없음 ⇒ 외적: 모든 시각과 모든 구멍의 조합'
