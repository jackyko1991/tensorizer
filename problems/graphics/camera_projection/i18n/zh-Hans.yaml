source_hash: 0fd4a04dbd76
title: 针孔相机
summary: 三维场景如何变成二维图像：模型、视图和投影 $4\times4$ 矩阵作用于齐次坐标，再经过透视除法和视口变换得到像素。相机环绕时，线框物体的所有顶点用一次 einsum 同时投影。比较透视投影与正交投影以及推拉变焦，观察平行线在消失点交汇，并把同一台相机写成 $K[R\,|\,\mathbf t]$。
notes: 第 4 个坐标让相机变成线性的：平移变成矩阵的一列，而需要除以深度的透视变成一个把深度复制到 $\tilde x_4$ 的矩阵，最后再做一次除法。$w = 0$ 的点表示方向；它们的像就是消失点，所有水平方向都消失在地平线上，当相机向下看时地平线位于图像中心之上。正交相机的 $\tilde x_4 = 1$，所以没有消失点，远处物体也不会缩小，就像工程制图和许多策略游戏那样。推拉变焦（“眩晕效应”）在移动相机的同时改变视场，使 $d\,\tan(\text{fov}/2)$ 保持不变：物体大小不变，而其后的地面被拉伸。视觉库使用 $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$，$z$ 朝前；图形 API 使用 $P V M$，$z$ 朝后；两者只差翻转 $y$ 轴和 $z$ 轴，终端会检查它们给出相同的像素。
meanings:
- 齐次坐标 $(x, y, z, 1)$ 中的顶点 $v$；边是索引对 $(E, 2)$
- 物体 → 世界：缩放、绕 $y$ 旋转，再平移（第 4 列）
- 世界 → 相机：各行是相机坐标轴，平移为 $-R\,\mathbf e$
- 相机 → 裁剪空间；最后一行把 $-z$ 复制到 $\tilde x_4$（正交：$\tilde x_4 = 1$）
- 重复的 $j, k, l$ ⇒ 求和：每个顶点在一次调用中经过全部三个矩阵
- 除以 $\tilde x_4$ 的透视除法，然后是视口变换；图像行号向下递增
- 焦距 $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$ 和主点；世界 → 相机的刚体运动
- 无穷远点 $(\hat{\mathbf d}, 0)$ 不受平移影响：所有沿 $\hat{\mathbf d}$ 的直线都在此交汇
labels:
  shape: 物体
  yaw: 物体旋转（模型矩阵）
  fov: 视场
  distance: 相机距离
  height_cam: 相机高度
  width: 图像宽度
  height: 图像高度
  frames: 每圈帧数
