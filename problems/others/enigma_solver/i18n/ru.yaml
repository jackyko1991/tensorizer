source_hash: 9231afd9bb4a
title: Взлом «Энигмы» с помощью тензоров перестановок
summary: 'Не физика, а просто для развлечения: каждое нажатие клавиши трёхроторной Enigma I — это произведение восьми матриц перестановок $26\times26$, где каждый ротор сопряжён циклическим сдвигом, соответствующим его положению. Зашифруйте английское сообщение с секретным порядком роторов и начальным положением, а затем взломайте его, расшифровав сразу со всеми $26^3 = 17\,576$ начальными положениями как одним пакетным тензором для каждого порядка роторов и оставив текст, чья буквенная статистика больше всего похожа на английскую.'
notes: 'Рефлектор $U$ — симметричная перестановка без неподвижных точек, поэтому $E = Q^{-1}UQ$ с $Q = R_3R_2R_1S$ тоже такова: $E^2 = I$ (та же настройка расшифровывает) и $E_{ii} = 0$ (ни одна буква никогда не шифруется сама в себя — слабость, которой пользовались криптоаналитики). Перед каждым нажатием клавиши правый ротор делает шаг; когда он стоит на своей выемке, он также толкает средний ротор, а когда средний ротор стоит на своей выемке, он шагает вместе с левым ротором (аномалия двойного шага). Тестовый вектор: роторы I-II-III, рефлектор B, кольца AAA, старт AAA превращает AAAAA в BDZGO. История: Мариан Реевский взломал «Энигму» в 1932 году с помощью теории групп перестановок, а «бомба» Тьюринга и Уэлчмана (1940) перебирала порядки и положения роторов, используя криб — угаданный открытый текст, например прогнозы погоды, — а не статистику. Чисто статистическая атака, использованная здесь, — ранжирование расшифровок по индексу совпадений — та, которую Джеймс Гиллогли опубликовал в
  1995 году (Cryptologia); на последующих этапах она восстанавливала также настройки колец и штекеры. Упрощения: настройки колец — AAA и известны атакующему, а коммутационная панель пуста, так что пространство ключей составляет лишь $60 \times 26^3 \approx 10^6$ настроек, и правильная явно выделяется. Настоящая коммутационная панель военного времени с 10 кабелями добавляет около $1.5 \times 10^{14}$ вариантов, переставляет 20 из 26 букв с обеих сторон роторов и настолько перемешивает буквенную статистику, что правильная настройка роторов едва опережает неправильные; атаке Гиллогли тогда нужен поиск восхождением по штекерам, а на коротких сообщениях она терпит неудачу. Попробуйте меньше букв (около 60–100) или другую оценку, чтобы увидеть, когда статистика перестаёт быть надёжной; поиск только по роторам I–III не может найти ключ, использующий IV или V.'
meanings:
- буква — это вектор one-hot $e_x$ или просто её индекс $x \in \{0, \dots, 25\}$ (A = 0)
- 'историческая коммутация роторов I–V: $W_{ab} = 1$, когда контакт $b$ соединён с контактом $a$'
- циклический сдвиг $x \to x + o$; $o_k$ = буква в окошке − настройка кольца ротора $k$ при нажатии клавиши $t$
- 'повторяющиеся $a, b$ ⇒ суммирование: повёрнутый ротор; в индексах $x \to (w[(x + o) \bmod 26] - o) \bmod 26$'
- 'одно нажатие клавиши: коммутационная панель $S$, роторы справа $R^{(1)}$ налево $R^{(3)}$, рефлектор $U$ и обратно; $(R^{-1})_{ab} = R_{ba}$'
- ротор при всех 26 смещениях как таблица поиска, так что $R\,e_x$ превращается в F[o, x] сразу для миллионов букв
- шифротекст, расшифрованный с каждым начальным положением $b$ ($B = 26^3$); расшифрование = шифрование, поскольку $E^2 = I$
- сколько раз буква $k$ встречается в кандидате $b$
- 'повторяющийся $k$ ⇒ суммирование: вероятность совпадения двух букв, около 0.066 для английского и $1/26 \approx 0.038$ для случайного текста'
- 'альтернативная оценка: среднее логарифмическое правдоподобие по униграммам английского $c_{bk}\log p_k / N$'
labels:
  message: Открытый текст
  rotor_order: Секретный порядок роторов (левый-средний-правый)
  start_left: Секретное начальное положение левого ротора
  start_middle: Секретное начальное положение среднего ротора
  start_right: Секретное начальное положение правого ротора
  n_letters: Число букв $N$ для оценки
  score: 'Оценка: индекс совпадений или логарифмическое правдоподобие по униграммам'
  search_rotors: Перебираемые роторы (60 или 6 порядков)
