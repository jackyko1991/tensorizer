title: 'त्रि-पिंड अराजकता: पाइथागोरियन समस्या'
summary: 'बुराउ की समस्या: द्रव्यमान 3, 4 और 5 एक 3-4-5 त्रिभुज के शीर्षों पर विराम से शुरू होते हैं और तब तक अराजक ढंग से नाचते हैं जब तक कि एक बाहर न फेंक दिया जाए। $\delta = 10^{-6}$ दूर से शुरू हुआ एक जुड़वाँ रन उसी टेंसर में समाकलित किया जाता है (रन सूचकांक $k$); दोनों के बीच की दूरी चरघातांकी रूप से बढ़ती है, $|\Delta| \propto e^{\lambda t}$, और उनकी नियति अलग हो जाती है।'
notes: 'कठिन हिस्सा निकट मुठभेड़ें हैं: दो पिंड लगभग $0.01$ की दूरी पर एक-दूसरे के पास से गुज़रते हैं, जहाँ बल सामान्य से $10^4$ गुना अधिक होता है। स्थिर चरण वहाँ या तो विफल हो जाएगा या बाकी हर जगह रेंगेगा, इसलिए सॉल्वर अनुकूली Dormand–Prince 5(4) विधि का उपयोग करता है: हर चरण 5वीं और 4थी कोटि के उत्तर की तुलना करता है, और dt निकट गुज़रने पर अपने-आप छोटा होता है और बाद में फिर बढ़ता है। कोई सॉफ्टनिंग नहीं है, इसलिए यह $G = 1$ के साथ सटीक न्यूटनीय गुरुत्व है। दोनों रन एक ही चरण साझा करते हैं, ताकि उनकी तुलना समान समयों पर हो। चूँकि गति अराजक है, सहनशीलता मायने रखती है: डिफ़ॉल्ट $10^{-11}$ के साथ संदर्भ रन क्लासिक परिणाम (Szebehely और Peters, 1967) दोहराता है: सबसे हल्का पिंड ($m = 3$) लगभग $t \approx 60$ पर बाहर फेंका जाता है, जबकि द्रव्यमान 4 और 5 एक कसे हुए द्वि-तंत्र के रूप में विपरीत दिशा में चले जाते हैं। केवल $\delta$ से खिसकाया गया जुड़वाँ $t \approx 45$ तक पूरी तरह अलग हो चुका होता है और एक अलग इतिहास जीता है। $|\Delta|$ का वक्र उछल-कूद वाला है: हर निकट मुठभेड़ पर वह शिखर बनाता है,
  क्योंकि जुड़वाँ तेज़ गति से एक पल पहले या बाद में गुज़रता है, और वृद्धि झटकों में होती है। फ़िट किया गया $\lambda$ $t = 0$ से तब तक की औसत प्रवृत्ति है जब तक $|\Delta|$ हमेशा के लिए $0.1$ से ऊपर न रहे। ढीली सहनशीलता आज़माएँ: तब संदर्भ रन की नियति ही बदल जाती है, जो याद दिलाता है कि संख्यात्मक त्रुटि भी एक विक्षोभ है।'
meanings:
- रन $k$ ($k = 0$ संदर्भ, $k = 1$ जुड़वाँ) में पिंड $a$ की स्थिति, समतल घटक $i$
- द्रव्यमान 3, 4, 5
- $a$ से $b$ तक का अंतर, ब्रॉडकास्टिंग से दोनों रन के सभी जोड़े
- 'दोहराया $j$ ⇒ योग: हर जोड़े की दूरी का वर्ग'
- 'दोहराया $b$ ⇒ योग: पिंड $a$ पर कुल खिंचाव; $k$ पर योग नहीं, रन स्वतंत्र रहते हैं'
- अनुकूली Dormand–Prince चरण के 7 चरण-ढलान; उनका 5वीं घटा 4थी कोटि संयोजन त्रुटि का अनुमान है
- स्थितियों और वेगों में जुड़वाँ और संदर्भ के बीच की दूरी
- 'रन के स्थायी रूप से अलग होने तक $t$ के सापेक्ष $\ln|\Delta|$ की ढलान: ल्यापुनोव घातांक'
labels:
  t_max: सिमुलेशन समय
  log10_delta: जुड़वाँ का विस्थापन $\log_{10}\delta$
  log10_tol: त्रुटि सहनशीलता $\log_{10}\mathrm{tol}$
