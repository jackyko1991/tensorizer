source_hash: e6424f8df209
title: 機器學習加速的 CFD
summary: 在比真解粗 16 倍的網格上，普通的有限體積求解器會抹平黏性 Burgers 方程的激波。一個小型 CNN 學習對面通量的修正，訓練方式是對展開的粗網格模擬做反向傳播。在從未見過的初始條件上，學得的求解器在相同的粗解析度下，對細網格解的貼近程度高出數倍，同時精確守恆 $\int u\,dx$。
notes: 單位：計算域為 $[0, 2\pi)$，週期性。真解是在 512 格上的同一有限體積格式，以 Heun 時間步進並細分子步以保持穩定。訓練使用 32 個隨機平滑波，測試使用另一個種子的 8 個波，運行時間比訓練資料長 50%（$t = 3$）。每個 Adam 步驟中，學得的求解器從隨機時刻的真實粗狀態出發，運行 $S$ 步，並因偏離平均後的真解而受懲罰。梯度回傳穿過每個時間步，所以網路學到的修正在餵入自身輸出時仍保持良好。兩個設計選擇使它保持誠實：$\delta F$ 以通量形式加入，所以 $\sum_i u_i$ 守恆至捨入誤差；最後一層初始化為零，所以訓練從普通求解器開始。此想法依循 Bar-Sinai、Hoyer、Hickey & Brenner（PNAS, 2019），他們正是為這類方程學習資料驅動的離散化，以及 Kochkov、Smith、Alieva、Wang、Brenner & Hoyer（PNAS, 2021）。後者在二維 Navier–Stokes 求解器中學習內插係數，報告在相同精度下網格可粗 8–10 倍，速度約快 40–80 倍。這個玩具展示的是機制，而非那些加速效果。學得的修正在遠離其訓練資料的輸入上可能失效。試試訓練較少步數、較短的展開，或網路未曾訓練過的黏度。
meanings:
- 軌跡 $b$ 在粗網格格 $i$ 中的格平均（週期性）
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$，$\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$；$u_{i+1}$ 即 roll(u, -1)
- 從一格流出的量流入下一格 ⇒ $\sum_i u_i$ 守恆
- 重複的 $k$ ⇒ 求和：5 格模板，週期性填補
- 由三層卷積學得的通量修正（初始為零）
- 細網格解對每個粗網格格中 $f = N_f/N_c$ 個細格取平均
- 對求解器全部 $S$ 個展開時間步做 autograd
labels:
  nu: 黏度 $\nu$
  n_coarse: 粗網格格數 $N_c$
  train_iters: 訓練步數
  unroll: 展開步數 $S$
