title: Inflation à roulement lent et le plan (n_s, r)
summary: 'Cinq potentiels d''inflaton ($m^2\phi^2$, $\lambda\phi^4$, Starobinsky $R^2$, inflation naturelle, un hilltop quartique) roulent dans un seul tenseur en lot à travers les équations de Friedmann et de Klein–Gordon, le nombre d''e-folds $N = \ln a$ servant d''horloge. Les paramètres de roulement lent $\epsilon$, $\eta$ et les prédictions $n_s$ et $r$ à $N_* = 50$–$60$ sont vérifiés par rapport au fond exact et confrontés à Planck 2018 et BICEP/Keck 2021 : $m^2\phi^2$ et $\lambda\phi^4$ sont défavorisés, Starobinsky se situe à l''intérieur. L''inflation est l''explication privilégiée des conditions initiales, mais elle n''est pas confirmée : les modes B primordiaux n''ont pas été détectés.'
notes: 'Unités : masse de Planck réduite $M_\mathrm{pl} = 1$. En écrivant les équations avec $N = \ln a$ comme temps, $\psi = d\phi/dN$ et $\epsilon_H = \psi^2/2$, on obtient $d\psi/dN = -(3-\epsilon_H)(\psi + V''/V)$ et $H^2 = V/(3-\epsilon_H)$ ; seul $V''/V$ compte donc, et chaque potentiel est tracé avec une hauteur de 1 (l''amplitude $A_s = 2.1\times10^{-9}$ fixe ensuite l''échelle d''énergie, affichée sous la forme $V_*^{1/4}$, environ $10^{16}$ GeV pour la plupart des modèles). Chaque champ démarre environ 68 e-folds avant sa fin, en un point donné par le décompte de roulement lent des manuels, sur la vitesse de roulement lent $\psi = -V''/V$ ; le test lance $m^2\phi^2$ avec des vitesses très différentes et les retrouve toutes sur la même courbe en quelques e-folds : le roulement lent est un attracteur. L''inflation se termine là où $\epsilon_H = 1$. Les prédictions sont calculées deux fois : à partir du potentiel au premier ordre ($n_s = 1 - 6\epsilon_V + 2\eta_V$, $r = 16\epsilon_V$,
  les croix ×) et à partir des paramètres de flot de Hubble $\epsilon_{1,2,3}$ du fond numérique au second ordre (Stewart et Lyth 1993 ; Schwarz, Terrero-Escalante et García 2001 ; les points) ; elles diffèrent à $O(\epsilon^2)$, quelques $10^{-4}$ sur $n_s$. Une résolution complète mode par mode de Mukhanov–Sasaki n''est pas effectuée ici. Résultats à $N_* = 55$ : $m^2\phi^2$ donne $n_s \approx 1 - 2/N_*$, $r \approx 8/N_* \approx 0.14$ ; $\lambda\phi^4$ donne $r \approx 0.29$ et un $n_s$ trop rouge ; Starobinsky donne $n_s \approx 0.965$, $r \approx 12/N_*^2 \approx 0.004$ ; l''inflation naturelle ($f = 7$) donne $r \approx 0.08$, au-dessus de la limite ; le hilltop quartique ($\mu = 15$) tombe à l''intérieur. La région observationnelle est tracée comme une boîte (Planck 2018 $n_s = 0.9649 \pm 0.0042$ à 68 %, TT,TE,EE+lowE+lensing ; BICEP/Keck 2021 $r_{0.05} < 0.036$ à 95 %), et non comme les contours bidimensionnels publiés, légèrement inclinés et dépendants de la combinaison de données.
  Bilan honnête : l''inflation explique la platitude, le problème de l''horizon et les fluctuations presque invariantes d''échelle, gaussiennes et adiabatiques, et $n_s < 1$ a été prédit avant d''être mesuré ; mais il existe des idées concurrentes (modèles à rebond et ekpyrotiques), l''inflaton n''a pas été identifié, et la preuve décisive, la polarisation primordiale en modes B due aux ondes gravitationnelles, n''a pas été détectée (l''annonce de BICEP2 en 2014 s''est révélée être due à la poussière galactique). Essayez $N_*$ entre 50 et 60 (cela dépend de la façon dont l''Univers s''est réchauffé), ou changez $f$ et $\mu$ : à $N_* = 55$, l''inflation naturelle n''atteint jamais la boîte, car diminuer $f$ fait baisser $r$ mais rend $n_s$ trop rouge ($f = 5$ : $n_s \approx 0.950$, $r \approx 0.04$).'
meanings:
- 'ligne one-hot : le champ $b$ utilise le potentiel $p$'
- les cinq formes de potentiel évaluées sur chaque champ
- '$p$ répété ⇒ sommé : le potentiel propre à chaque champ'
- champ et $d\phi/dN$, avancés ensemble par RK4 en e-folds
- 'la seule chose dont le fond a besoin : la hauteur de $V$ disparaît'
- $V'$ et $V''$ par autograd
- là où $\epsilon_H$ franchit 1, c'est-à-dire où $\ddot a$ change de signe
- paramètres de flot de Hubble $N_*$ e-folds avant la fin, en un seul gather
- prédictions au second ordre à partir du fond exact
labels:
  N_star: E-folds pivot avant la fin $N_*$
  f: Échelle de l'inflation naturelle $f$
  mu: Largeur du hilltop $\mu$
