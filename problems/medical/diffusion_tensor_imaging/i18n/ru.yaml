source_hash: 27367fbd090e
title: 'Диффузионно-тензорная томография: картирование нервных волокон'
summary: Вода диффундирует вдоль аксонов быстрее, чем поперёк, поэтому у каждого вокселя есть тензор диффузии $D_{ij}$. Сигнал Стейскала–Таннера $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$ — это один einsum по вокселям и направлениям градиента; пакетная подгонка логарифмов сигнала методом наименьших квадратов восстанавливает $D_{ij}$, его спектральное разложение даёт среднюю диффузионную способность, фракционную анизотропию и направление волокна, а следование этому направлению методом RK2 прослеживает нервные пучки (трактография).
notes: 'Коэффициенты диффузии даны в $10^{-3}\,\mathrm{mm^2/s}$, а $b$ — в $\mathrm{s/mm^2}$: примерно $\lambda_\parallel = 1.7$, $\lambda_\perp = 0.3$ в пучке (FA ≈ 0.8), 3.0 для свободной воды (ЦСЖ) и 0.8 для серого вещества. Это приближённые учебные значения, не для клинического применения. Шум райсовский (модуль комплексного сигнала), поэтому зашумлённые подгонки завышают FA в изотропных областях. Там, где пересекаются два пучка, один тензор может представить лишь их среднее — плоский (планарный) тензор с меньшей FA, и тракт, входящий в него, может остановиться или ошибочно свернуть в другой пучок: классическое ограничение ДТТ, которое устраняют многоволоконные модели. Каждый эллипс показывает форму подогнанного тензора в плоскости. Линии тока начинаются в затравочных точках и следуют главному собственному вектору билинейно интерполированного тензорного поля по правилу средней точки (RK2), пока FA не упадёт ниже 0.2. Попробуйте больше шума, меньше направлений градиента или меньшее $b$.'
meanings:
- единичные направления диффузионного градиента, распределённые по полусфере
- 'истинный тензор диффузии каждого вокселя: пучки $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$, изотропные ЦСЖ и серое вещество'
- 'повторяющиеся $i, j$ ⇒ суммирование: диффузионно-взвешенный сигнал каждого вокселя для каждого направления'
- строки $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$, так что $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$
- подгонка шести независимых компонент тензора методом наименьших квадратов, сразу для всех вокселей
- собственные значения и собственные векторы; собственный вектор наибольшего собственного значения направлен вдоль волокна
- средняя диффузионная способность (след/3) и фракционная анизотропия (0 — изотропно, 1 — одно направление)
labels:
  b: Диффузионное взвешивание $b$
  n_dirs: Направления градиента
  noise: Уровень шума $\sigma/S_0$
  size: Вокселей на сторону
