  mode_b: 'बाएँ गतिमान मोड का मोड $\tilde n$ (खुली: दूसरा मोड)'
  n_points: स्ट्रिंग के साथ बिंदु $\sigma$
  n_levels: दिखाए गए द्रव्यमान स्तर
  R_max: स्वीप में सबसे बड़ी वृत्त त्रिज्या $R/\sqrt{\alpha'}$
