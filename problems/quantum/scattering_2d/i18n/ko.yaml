source_hash: 0456b6169f6d
title: 2차원 파동묶음 산란
summary: 2차원 시간 의존 슈뢰딩거 방정식을 $(N, N)$ 격자 위에서 분할 단계 푸리에 방법으로 풉니다. 가우스 파동묶음이 두 슬릿이 있는 벽(또는 원판 모양 장애물)에 부딪힙니다. torch.fft.fft2가 퍼텐셜이 대각인 $x$ 공간과 운동 에너지가 대각인 $k$ 공간 사이를 오갑니다. 장벽 뒤의 검출 스크린은 시간 적분한 확률을 기록합니다. 입자 하나의 파동 함수로 만들어지는 간섭무늬입니다.
notes: 단위 $\hbar = m = 1$, 파동묶음 에너지 $E \approx k_0^2/2$. 마스크 $M$이 없으면 모든 인자가 순수한 위상이므로 각 단계는 정확히 유니터리이고 노름은 1로 유지됩니다. 마스크는 가장자리에 도달한 확률을 의도적으로 제거하므로(그렇지 않으면 주기적인 FFT 격자가 반대편으로 되돌려 보냄), 출력되는 노름은 나중에 줄어듭니다. 간격 $d$인 두 슬릿에 대해, 거리 $D$의 스크린 위 무늬 간격은 $\lambda = 2\pi/k_0$일 때 약 $\lambda D/d$입니다(스크린이 원거리장에 있지 않으므로 근사일 뿐입니다). 원판을 고르면 그 뒤 축 위에 밝은 푸아송 점이 있는 그림자가 보입니다. 이미지 색은 프레임마다 정규화한 제곱근 척도를 써서 약한 산란파도 보이게 하며, 장벽은 회색으로 그립니다.
meanings:
- 주기적인 2차원 격자 위의 파동 함수 (첫 번째 지표 $x$, 두 번째 $y$)
- '장벽: $x \approx 0$에 있는 두 구멍이 난 높은 벽, 또는 원판'
- 반 단계 퍼텐셜 연산자, $x$ 공간에서 대각
- 한 단계 운동 연산자, $k$ 공간에서 대각
- '$x$와 $y$ 모두 합: 각 축을 따른 1차원 푸리에 변환'
- 가장자리 근처의 매끄러운 감쇠, 파동이 되감기지 않고 빠져나가도록
- 검출선 $x = x_\text{screen}$ 위에서 시간 적분한 확률
labels:
  barrier: 장벽
  k0: 파동묶음 운동량 $k_0$
  slit_sep: 슬릿 간격 $d$ (원판 지름)
  slit_width: 슬릿 너비 $w$
  n_grid: 축당 격자점 수
