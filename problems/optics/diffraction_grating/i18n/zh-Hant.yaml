source_hash: e3a181f70abb
title: 以相量和描述繞射光柵
summary: $N$ 條狹縫的遠場是 $N$ 個複數相量之和，每條狹縫一個，各自延遲額外路程 $d\sin\theta$。使用複數張量，整個圖樣就是一次 einsum。當 $N$ 從 2 增加到 20，主極大位置不變但變得更尖銳，且其間出現 $N-2$ 個微弱的次極大。
notes: 右側面板在某一角度把 $N$ 個相量首尾相接畫出。在主極大處（$d\sin\theta = m\lambda$），它們全指向同一方向，相加長度為 $N$。偏離極大時，相量鏈逐漸捲曲，在 $N\phi = 2\pi$ 時閉合成多邊形：這是第一個零點，其角度按 $1/N$ 縮小。強度以中央峰歸一化為 1；虛線標示 $d\sin\theta = m\lambda$。只有單狹縫包絡依賴於狹縫寬度 $a$。
meanings:
- 狹縫編號；狹縫 $n$ 距狹縫 0 為 $nd$
- 觀察方向，以細網格取樣
- 在角度 $t$ 處看到的狹縫 $n$ 的相位因子
- 重複的 $n$ ⇒ 求和：把所有狹縫的波相加
- 單狹縫繞射包絡 $\operatorname{sinc}^2(a\sin\theta/\lambda)$
- 強度 = 複振幅大小的平方
- 同一個和的手算結果（等比級數），$\phi = kd\sin\theta$
labels:
  wavelength: 波長 $\lambda$
  d: 狹縫間距 $d$
  a: 狹縫寬度 $a$
  n_max: 最大狹縫數 $N$
