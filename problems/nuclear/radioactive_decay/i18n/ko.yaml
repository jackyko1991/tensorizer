source_hash: 8bd75af0e44c
title: 방사성 붕괴
summary: 각 원자핵은 초당 같은 확률 $\lambda$로 무작위로 붕괴합니다. 원자핵 격자 전체를 불리언 텐서 하나로 시뮬레이션하면(원자핵마다, 시간 단계마다 동전 던지기 한 번) 매끄러운 지수 법칙 $N(t) = N_0 e^{-\lambda t}$와 반감기 $T_{1/2} = \ln 2/\lambda$가 재현됩니다.
notes: 지수 법칙은 평균에 대한 진술입니다. $N_0$개의 원자핵이 있을 때 시간 $t$ 후의 개수는 평균 $N_0 e^{-\lambda t}$, 표준편차 $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$인 이항 분포를 따르므로, 작은 격자는 곡선 주위에서 눈에 띄게 흔들리고 큰 격자는 곡선을 잘 따라갑니다. 반감기가 한 번 지날 때마다 처음에 몇 개였든 남은 원자핵의 약 절반이 사라집니다. 간격 $\Delta t$는 $T_{1/2}$보다 작기만 하면 됩니다. 단계당 정확한 확률 $1 - e^{-\lambda\Delta t}$를 쓰면 어떤 간격에서도 평균이 정확합니다. 난수 시드를 고정해 그림이 재현되도록 했습니다.
meanings:
- 붕괴 상수 $\ln 2 / T_{1/2}$
- 원자핵 $n$이 붕괴하지 않은 동안 True; 격자는 $n$을 그리는 방법일 뿐
- 원자핵마다, 단계마다 균일 난수 하나
- 한 단계 $\Delta t$ 안에 붕괴할 확률
- 붕괴한 원자핵은 붕괴한 채로 남음
- '모든 원자핵에 대한 합: 개수 $N(t)$'
labels:
  n_side: 격자 한 변 (변² 개의 원자핵)
  half_life: 반감기 $T_{1/2}$
  t_max: 시뮬레이션 시간
  dt: 시간 간격 $\Delta t$
