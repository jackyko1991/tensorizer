title: 줄 연결점에서의 펄스
summary: 선밀도가 서로 다른 두 줄을 이어 묶습니다. 왼쪽에서 온 펄스는 매듭에서 반사 펄스와 투과 펄스로 나뉘며, 그 진폭은 임피던스 $Z = \sqrt{T\mu}$로 정해집니다. 2계 도함수는 스텐실 $(1, -2, 1)$을 쓴 1차원 합성곱입니다.
notes: '매듭은 끊어지지 않으므로 $u$가 연속이고, 질량이 없으므로 양쪽의 가로 방향 힘 $T u_x$가 평형을 이룹니다. 이 두 조건이 $R$와 $\mathcal T$를 줍니다. 오른쪽 줄이 더 무거우면($Z_2 > Z_1$) 고정단처럼 펄스가 뒤집혀 반사되고, 더 가벼우면 자유단처럼 바로 선 채 반사됩니다. 투과 펄스는 언제나 바로 서 있고 $c_2 = \sqrt{T/\mu_2}$로 움직이므로 $c_2/c_1$배만큼 압축되거나 늘어납니다. 펄스가 나르는 에너지는 $Z\,A^2$에 비례하므로 선속 균형 $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$이 성립합니다. 단위: $T = 1$, $\mu_1 = 1$, 줄은 $-1$에서 $1$까지. 회색 점선은 예측된 진폭을 표시합니다. 더 빠른 줄을 지켜보세요. 그 펄스는 먼 벽에 닿아 되돌아옵니다.'
meanings:
- 격자점 $i$에서의 변위; 먼 양 끝은 고정
- '단위 길이당 질량: 왼쪽 $\mu_1$, 오른쪽 $\mu_2$, 매듭에서는 평균'
- '반복된 $j$ ⇒ 합: 스텐실이 줄을 따라 미끄러짐'
- 줄 $k$의 파동 임피던스
- 매듭에서 $u$와 힘 $T\,u_x$의 연속성으로 구한 진폭비
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$, 보존량
labels:
  mu_ratio: 선밀도 비 $\mu_2/\mu_1$
  width: 펄스 폭
  t_max: 시뮬레이션 시간
  n_points: 격자점 수
