source_hash: 107eff242684
title: El 17-gono de Gauss con regla y compás
summary: 'En 1796, un mes antes de cumplir 19 años, Gauss descubrió que el 17-gono regular puede trazarse con regla y compás: el primer polígono construible nuevo desde los griegos. Las raíces 17-ésimas de la unidad, agrupadas en periodos de Gauss, resuelven una cadena de ecuaciones cuadráticas. Esa cadena escribe $\cos(2\pi/17)$ solo con raíces cuadradas. La construcción de Richmond de 1893 dibuja después el polígono paso a paso, con intersecciones de rectas y circunferencias escritas como operaciones tensoriales. Una cuadrícula muestra qué $n$-gonos son construibles (teorema de Gauss–Wantzel). Todo aquí es matemática clásica demostrada.'
notes: 'Gauss encontró el 17-gono el 30 de marzo de 1796, poco antes de cumplir 19 años, y se dice que eso le hizo elegir las matemáticas en lugar de la filología. Publicó la teoría en la última sección de las Disquisitiones Arithmeticae (1801). La idea: las 16 raíces no triviales $\zeta^k$ se permutan cíclicamente mediante $k \mapsto 3k \bmod 17$, porque 3 es una raíz primitiva. Sumando una raíz de cada dos en este orden cíclico se obtienen dos periodos de 8 términos con $\eta_0 + \eta_1 = -1$ y $\eta_0\eta_1 = -4$, así que $\eta_{0,1} = (-1 \pm \sqrt{17})/2$. Partiendo de nuevo por la mitad se obtienen periodos de 4, 2 y 1 términos. Cada par es el par de raíces de una ecuación cuadrática cuyos coeficientes son periodos del nivel superior, porque los subgrupos tienen orden $16 \to 8 \to 4 \to 2 \to 1$, todos potencias de 2. Los periodos de 2 términos son $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$, así que cuatro raíces cuadradas dan la fórmula de Gauss. El programa comprueba cada relación
  cuadrática con coeficientes enteros exactos, reconstruye cada periodo solo con raíces cuadradas y compara la fórmula cerrada con `torch.cos` (y con sympy a 60 cifras si está instalado). Cualquier raíz primitiva (3, 5, 6, 7, 10, 11, 12, 14) da el mismo árbol en otro orden. Una raíz cuadrada es una operación con regla y compás, así que el polígono es construible. H. W. Richmond (1893) dio una receta corta sobre la circunferencia unidad. Se toma $OJ = OB/4$ sobre el radio vertical. Se pone $E$ sobre el diámetro con $\angle OJE = \tfrac14\angle OJP_0$ (dos bisecciones de ángulo), y $F$ con $\angle EJF = 45°$. La circunferencia de diámetro $FP_0$ corta $OB$ en $K$. La circunferencia de centro $E$ que pasa por $K$ corta el diámetro en $N_3 = \cos(6\pi/17)$ y $N_5 = \cos(10\pi/17)$, y las perpendiculares allí dan $P_3$ y $P_5$. Aquí cada paso traza de verdad una recta por dos puntos o una circunferencia con centro en un punto que pasa por otro. Cada punto nuevo es una intersección recta–recta,
  recta–circunferencia o circunferencia–circunferencia, y los vértices restantes se llevan con circunferencias: de centro $P_k$ por $P_{k-1}$, y de centro $P_0$ por $P_k$ para la imagen especular. Los 55 pasos colocan los 17 vértices a unos $10^{-15}$ de $e^{2\pi i k/17}$ en float64; cambie a float32 para ver crecer el redondeo hasta unos $10^{-6}$. Gauss afirmó que el $n$-gono es construible cuando $n = 2^k p_1 \cdots p_r$ con primos de Fermat distintos $p_i = 2^{2^j} + 1$. Wantzel (1837) demostró que ningún otro $n$ sirve, lo que también resolvió la trisección del ángulo y la duplicación del cubo. Esto equivale a que la función de Euler $\varphi(n)$ sea una potencia de 2, y la cuadrícula comprueba ambos criterios hasta $n$. Los únicos primos de Fermat conocidos son 3, 5, 17, 257 y 65537. Richelot publicó el 257-gono en 1832, y J. G. Hermes dedicó unos diez años al 65537-gono, terminado en 1894 y guardado en Gotinga. Según se cuenta, Gauss pidió un 17-gono en su lápida; el cantero se habría
  negado porque parecería un círculo. El monumento a Gauss en Brunswick lleva en su lugar una estrella de 17 puntas.'
meanings:
- las raíces 17-ésimas de la unidad, los vértices del 17-gono en el plano complejo
- 'los exponentes en el orden de las potencias de una raíz primitiva, $g = 3$: 1, 3, 9, 10, 13, …'
- 'qué posiciones del orden cíclico forman el periodo $i$ en el nivel $m$: una de cada $2^m$'
- '$j$ repetido ⇒ sumado: todos los periodos de Gauss de los cinco niveles (longitudes 16, 8, 4, 2, 1) de una vez'
- el producto de dos periodos hermanos es una suma de $\zeta^{a+b}$; contar los exponentes da enteros constantes sobre los periodos del nivel padre
- '$k$ repetido ⇒ sumado: el término constante de cada ecuación cuadrática a partir del nivel superior'
- 'una raíz cuadrada por nivel: $16 \to 8 \to 4 \to 2 \to 1$; el nivel 3 contiene $2\cos(2\pi k/17)$'
- 'los tres movimientos de regla y compás como fórmulas tensoriales: un sistema $2\times 2$ con productos vectoriales, una cuadrática en $t$ y el eje radical de dos circunferencias'
- la función de Euler con una criba; construible exactamente cuando $\varphi(n)$ es potencia de 2, comprobado como $x \,\&\, (x-1) = 0$
- 'la parte impar debe dividir $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$: un producto de primos de Fermat distintos'
labels:
  generator: Raíz primitiva $g$ para el orden cíclico
  precision: Precisión de la construcción
  n_max: Cuadrícula de construibilidad hasta $n$
