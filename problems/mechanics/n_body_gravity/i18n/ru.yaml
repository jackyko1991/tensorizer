source_hash: 840ee0536fe3
title: Задача N тел в 3D
summary: Ньютоновское тяготение между $N$ телами. Все попарные разности положений $r_{abi}$ строятся сразу через broadcasting, один einsum суммирует притяжение всех тел $b$ к каждому телу $a$, а метод Верле в скоростной форме продвигает всю систему.
notes: Длина сглаживания $\varepsilon$ сохраняет силу конечной при очень тесном сближении двух тел; при $\varepsilon = 0$ это точное ньютоновское тяготение. Единицы выбраны так, что $G = 1$. Скоростной метод Верле симплектический, поэтому ошибка энергии остаётся малой и ограниченной, а не дрейфует. «Восьмёрка» — знаменитая периодическая орбита трёх тел, найденная Муром (1993) и Шенсине и Монтгомери (2000).
meanings:
- положение тела $a$, компонента $i \in \{x, y, z\}$
- масса тела $b$
- вектор от $a$ к $b$, все пары через broadcasting
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния для каждой пары'
- 'повторяющийся $b$ ⇒ суммирование: полное притяжение тела $a$'
- кинетическая + попарная потенциальная энергия, сохраняется
labels:
  scenario: Начальные условия
  t_max: Время моделирования
  dt: Шаг по времени
  softening: Сглаживание $\varepsilon$
