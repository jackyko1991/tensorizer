source_hash: 7f418c1e4166
title: 理想気体の4つの過程
summary: 同じ状態から出発した同じ気体を、教科書にある4つの経路——等温、定圧、定積、断熱——に沿って変化させる。4つの経路はすべて $(V, p)$ サンプルの1つの (process, points, 2) テンソルであり、仕事は torch.trapezoid による各曲線の下の面積で、熱力学第1法則がそれを熱に変換する。
notes: 初期状態：1 mol、300 K、10 リットル。等温、定圧、断熱の経路は同じ最終体積まで膨張する。定積の経路は $V$ を一定に保ち、圧力が同じ比だけ増えるまで気体を加熱する。定積線上では $dV = 0$ なので、torch.trapezoid はそこでの仕事として厳密に0を返す。等温線上では $\Delta U = 0$ なので $Q = W$ である。断熱線上では $Q = 0$ なので、気体は内部エネルギーで仕事をまかない冷える。右の棒は torch.cumulative_trapezoid で計算した累積値である。
meanings:
- 過程 $c$（等温、定圧、定積、断熱）に沿ったサンプル $k$
- 理想気体の状態方程式、テンソル全体に要素ごとに作用
- 繰り返される $k$ ⇒ 和をとる：各経路で気体がする仕事
- 内部エネルギーは温度だけに依存する
- 熱力学第1法則：気体に加えられた熱
labels:
  ratio: 膨張比 $V_2/V_1$
  T0: 初期温度
  n: 物質量
  gas: 気体
