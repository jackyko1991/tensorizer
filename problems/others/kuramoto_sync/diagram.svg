<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Kuramoto model: oscillators as dots on a unit circle with phases theta, each turning at its own frequency omega, pulled towards the mean field r e^(i psi)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- unit circle and axes -->
    <circle cx="110" cy="82" r="60" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="40" y1="82" x2="180" y2="82" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="110" y1="14" x2="110" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- phase angle of one oscillator -->
    <line x1="110" y1="82" x2="152.4" y2="39.6" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M132,82 A22,22 0 0 0 125.6,66.4" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="136" y="76" font-style="italic" fill="#b45309">θ</text>
    <!-- oscillators: a cluster near the mean field and a few drifting ones -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.2">
      <circle cx="152.4" cy="39.6" r="5"/><circle cx="140" cy="30" r="5"/><circle cx="163" cy="52" r="5"/>
      <circle cx="126" cy="24.2" r="5"/><circle cx="168.5" cy="67" r="5"/>
    </g>
    <g fill="#93c5fd" stroke="#1e40af" stroke-width="1.2">
      <circle cx="52" cy="98" r="5"/><circle cx="80" cy="134" r="5"/><circle cx="60" cy="49" r="5"/>
    </g>
    <!-- own frequency of a drifting oscillator -->
    <path d="M44,112 A68,68 0 0 0 64,142" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="30" y="140" font-style="italic">ω</text>
    <!-- mean field -->
    <line x1="110" y1="82" x2="140" y2="48" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="186" y="40" font-style="italic" fill="#b91c1c">r e</text>
    <text x="207" y="32" font-size="10" font-style="italic" fill="#b91c1c">iψ</text>
    <line x1="184" y1="44" x2="146" y2="54" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
</svg>
