title: Демон Максвелла, двигатель Силарда и принцип Ландауэра
summary: 'Демон смотрит, в какой половине ящика находится броуновская частица, и сдвигает перегородку так, чтобы частица её толкала, извлекая работу из одного теплового резервуара. Пакеты передемпфированных ланжевеновских двигателей выставляют счёт: работа не больше $kT\,I \le kT\ln 2$ на бит, где $I$ — взаимная информация зашумлённого измерения, стирание бита стоит не меньше $kT\ln 2$ (Ландауэр), а равенство Сагавы–Уэды $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$ восстанавливает второе начало, как только учтена информация. При обратном проигрывании логарифм отношения вероятностей траекторий — это произведённая энтропия.'
notes: 'Единицы: $kT = 1$, подвижность $1$ (значит, $D = 1$), половина ширины ящика $a = 1$, время в $a^2/D$. Максвелл (1867) вообразил существо, которое сортирует молекулы и побеждает второе начало; Силард (1929) свёл его к одной частице и одному биту, стоящему не больше $kT\ln 2$ работы. Ландауэр (1961) и Беннетт (1982) разрешили парадокс: демон рано или поздно должен стереть свою память, что стоит не меньше $kT\ln 2$ на бит, так что цикл в целом подчиняется второму началу. Сагава и Уэда (2010) сделали это количественным для обратной связи с ошибками: $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$, следовательно $\langle W_{ext}\rangle \le kT\langle I\rangle - \langle\Delta F\rangle$. Это доказанные теоремы для такой стохастической динамики, а моделирование проверяет их численно. Модель: стенки — жёсткие пружины $\kappa u^2/2$ ($\kappa = 500\,kT/a^2$), поэтому свободные энергии вычисляются численно из $Z$, а не берутся из значений для жёстких стенок. Перегородка непроницаема, так что каждая
  частица сохраняет свою сторону $s$. Шаги Ланжевена исправлены по Метрополису (MALA), поэтому распределение Больцмана, Яржинский, Сагава–Уэда и Крукс выполняются точно с точностью до шума выборки. Стирание начинается с ящика с перегородкой и заканчивается поршнем посередине, что делает $\Delta F = kT\ln 2$ точным даже для мягких стенок. Учётная книга считает работу перемещения перегородки. Извлечение перегородки в конце возвращает её небольшую энергию пружины. Реальные данные, только как цитируемые числа (без воспроизведения рисунков): Bérut et al., Nature 483, 187 (2012) и подробная версия в J. Stat. Mech. P06015 (2015) стирали бит, хранившийся в кварцевой бусине размером $2\,\mu$м в оптической двойной яме. Среднее тепло убывало с длительностью цикла $\tau$ как $\langle Q\rangle = kT\ln 2 + B/\tau$ с $B = 8.15\,kT\cdot$с, а подгонка с двумя параметрами дала асимптоту $A = 0.72\,kT$ ($\pm 0.15\,kT$), близкую к $kT\ln 2 \approx 0.693\,kT$. Смоделированное стирание даёт тот же закон $1/\tau$
  в своих единицах. Обращение времени: последняя часть фильма проигрывает стирание назад. Для каждой траектории логарифм отношения её прямой вероятности к вероятности обращённой траектории при обращённом протоколе равен $\beta(W - \Delta F)$, произведённой энтропии (Crooks 1999). Её среднее положительно, и $\langle e^{-\sigma}\rangle = 1$. Попробуйте: большую частоту ошибок $\varepsilon$ (меньше информации, меньше работы; $\varepsilon = 0.5$ не даёт ничего) или более короткое $\tau$ (больше диссипации).'
meanings:
- мягкие стенки ящика в $0$ и $2a$ плюс перегородка в $p$, ощущаемая со стороны $s=\pm1$, где находится частица
- каждый двигатель стартует из равновесия $e^{-V/kT}/Z$ с перегородкой посередине
- показание демона, ошибочное с вероятностью $\varepsilon$
- 'обратная связь: перегородка сдвигается до $2a(1-\varepsilon)$ на стороне, в которую верит демон'
- предложение Эйлера–Маруямы для всех двигателей сразу, принимаемое по Метрополису–Гастингсу, чтобы $e^{-V/kT}$ было точно стационарным
- работа над частицей при движении стенки при фиксированном $x$
- $\ln 2(1-\varepsilon)$, если демон прав, $\ln 2\varepsilon$, если нет; среднее равно $I$
- 'формула трапеций на сетке для пакета положений перегородки: $\Delta F = -kT\ln Z_1/Z_0$'
- $\ln P_F[x]/P_R[\tilde x]$ из вероятностей переходов каждого шага плюс граничные члены
labels:
  eps: Частота ошибок измерения демона $\varepsilon$
  tau: Время обратной связи $\tau$ (сдвиг перегородки, $a^2/D$)
  tau_erase: Самое медленное время стирания ($a^2/D$)
  n_engines: Двигателей на частоту ошибок
  seed: Случайное зерно
