source_hash: a1a35d304051
title: ハーディ–ワインベルグとライト–フィッシャーの遺伝的浮動
summary: 任意交配はハーディ–ワインベルグの遺伝子型頻度 $p^2, 2pq, q^2$ を与え、各世代で $2N$ 個の遺伝子コピーをランダムに抽出することで対立遺伝子頻度が浮動する。何千もの集団を、二項分布の抽出からなる一つの（反復, 世代）テンソルとして同時に進化させ、必要に応じて選択 $s$ を加え、ヘテロ接合度については $(1-1/2N)^t$ と、固定については $1/2N$ および木村の公式と比較する。
notes: ハーディ–ワインベルグの法則によれば、一回の任意交配で対立遺伝子頻度 $p$ は、親の遺伝子型が何であっても遺伝子型頻度 $p^2, 2pq, q^2$ になる。点は二つのランダムな配偶子から作った $N$ 個体で、これらの曲線の周りにばらつく。対立遺伝子頻度が変わらないのは無限集団の場合だけである。$2N$ 個のコピーでは各世代は前世代からの二項標本なので、$p$ は 0（対立遺伝子の消失）か 1（対立遺伝子の固定）に達するまでランダムウォークを行う。ランダムに選んだ二つのコピーが同じ親コピーをもつ確率は $1/2N$ なので、期待ヘテロ接合度 $2pq$ は世代ごとに因子 $1 - 1/2N$ で縮む。小さな集団ほど浮動は速い。新しい中立突然変異は $2N$ 個のうちの 1 コピーとして始まる。最終的には $2N$ 個のコピーの一つがすべての祖先になるので、その固定確率は $1/2N$ である。選択がある場合は木村の拡散近似の結果が当てはまる：$4Ns \gg 1$ の有利な対立遺伝子が固定される確率は $2s$ に近く、それでも確実からは程遠い。また、わずかに有害な対立遺伝子も $|4Ns| \lesssim 1$ なら浮動によって固定されうる。ここで $N$ は理想化された集団サイズ（一定、任意交配、突然変異や移住なし）である。実際の集団はより小さい有効集団サイズ $N_e$ で記述される。
meanings:
- 世代 $t$ における反復集団 $r$ の対立遺伝子 A の頻度
- 選択後：A のコピーは $1+s$ 倍の頻度で受け継がれる
- 次世代の $2N$ 個のコピー中の A の数：集団ごとに一回の抽出を、すべて同時に
- 任意交配の下での遺伝子型頻度 AA、Aa、aa
- それぞれ二つのランダムな配偶子からなる $N$ 個体を遺伝子型ごとに数えたもの（点）
- $r$ について和：平均 $2pq$ を $H_0(1-1/2N)^t$ と比較
- 各 $s$ について、単一の新しいコピー（$p_0 = 1/2N$）が固定された集団の割合
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$。$s = 0$ のとき $p_0 = 1/2N$ に等しい
labels:
  N: 集団サイズ $N$（二倍体）
  p0: 初期頻度 $p_0$
  s: 選択係数 $s$
  generations: 世代数 $G$
  replicates: 集団数 $R$
  fix_replicates: $s$ ごとの集団数（固定）
  seed: 乱数シード
