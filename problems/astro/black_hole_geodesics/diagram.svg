<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Black hole geodesics: a black hole with horizon r_s, the photon sphere at 3M and the ISCO at 6M, a precessing orbit and a particle falling straight in">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- precessing orbit: the same ellipse (focus on the hole) drawn twice, turned by 40° -->
    <ellipse cx="130" cy="80" rx="50" ry="40" fill="none" stroke="#93c5fd" stroke-width="1.8"/>
    <ellipse cx="130" cy="80" rx="50" ry="40" fill="none" stroke="#93c5fd" stroke-width="1.8" transform="rotate(-40 100 80)"/>
    <!-- ISCO (6M) and photon sphere (3M) -->
    <circle cx="100" cy="80" r="18" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="100" cy="80" r="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- black hole: horizon r_s = 2M -->
    <circle cx="100" cy="80" r="6.5" fill="#111827"/>
    <text x="88" y="120" font-size="13" fill="#6b7280">6M</text>
    <line x1="66" y1="132" x2="94" y2="86" stroke="#374151" stroke-width="1"/>
    <text x="54" y="148" font-style="italic">r<tspan font-size="10" dy="3">s</tspan></text>
    <!-- orbiting particle -->
    <circle cx="180" cy="80" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="188" y="98" font-style="italic">u<tspan font-size="10" dy="-6">μ</tspan></text>
    <!-- radial plunge -->
    <circle cx="24" cy="20" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="30" y1="26" x2="84" y2="66" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="56" font-style="italic" fill="#b91c1c">τ</text>
  </g>
</svg>
