source_hash: 7dfc00ae0203
title: 数字风洞：STL 飞机周围的三维格子玻尔兹曼方法
summary: 一个仿照 OpenLB 库风格的小型三维风洞：把模型飞机的 STL 文件读入三角形张量，在所有格点上一次性用射线投射完成体素化，按攻角倾斜后放进 D3Q19 格子玻尔兹曼流动中，采用 TRT 或 MRT 碰撞、可选的 Smagorinsky LES 以及物体上的反弹（bounce-back）。阻力和升力由动量交换得到；流线（批量 RK4）和示踪粒子展示流动。一个球的算例把求解器与 OpenLB 本身的预先计算结果对比，并显示残差。
notes: 格子单位：格点间距和时间步长为 1，来流 $U = 0.08$（马赫数 0.14），粘度 $\nu = UL/\mathrm{Re}$，其中 $L$ 为以格点计的物体长度，$\tau = 3\nu + \tfrac12$。飞机在 $80\times 36\times 26$ 的格子中飞行，$L = 32$（机身长度；翼展 28 个格点），可选的 NACA 0012 机翼用 $72\times 24\times 24$（弦长 20）。两个 STL 文件都是为本问题生成的（见 data/SOURCES.md）：一架敦实的模型飞机（回转体机身、后掠 NACA 0018 主翼、水平和垂直尾翼），各部件在连接处重叠，所以体素化统计的是环绕数（带符号的穿越次数），而不是简单的射线奇偶性；以及一个横跨整个周期宽度的机翼，即无限翼展（把 $C_L$ 与 $2\pi\alpha$ 比较）。系数采用俯视投影面积。边界：垂直于来流方向周期（飞机阵列），体素化物体上用半程反弹；solve.simulate 还提供移动地面和自由滑移顶面。没有入口和出口，而是让最后 16 个格点作为 fringe 区，在流动于 $x = 0$ 重新进入之前把它拉回来流状态；速度在 300 步内升高（早期 $C_D$ 的鼓包是加速空气所需的压力梯度），动画从这之后开始。TRT 使用“魔法”参数 $\Lambda = 3/16$，MRT 使用 d'Humières 等 (2002) 的 D3Q19 松弛率，Smagorinsky 常数 $C_s = 0.17$。在默认的 Re = 1000（$\tau \approx 0.508$）下，纯 TRT 在这个粗网格上会发散，LES 让它保持稳定：试试关掉 LES。8° 时的结果：飞机 $C_D \approx 0.39$，$C_L \approx 0.12$；机翼 $C_L \approx 0.31$，对照 $2\pi\alpha = 0.88$。升力偏小，是因为机翼只有 1–3 个格子厚、Re 处于层流，而且上下的周期镜像像一摞双翼机：这些只是方法的演示，不是预测。验证（物体 sphere_openlb）：Re = 20 的球（$D = 10$，$80\times 40\times 40$，BGK，平衡入口）与在同一格子上离线运行一次的 OpenLB 1.7（data/openlb_reference_*.csv）比较：$C_D$
  3.360 对 3.378（−0.5 %）；中截面 $u_x$：相对 L2 0.8 %，L∞ 1.1 %，最大 $|\Delta u|/U$ 1.3 %。剩余差异来自边界格式（OpenLB 使用插值速度和压力边界，并持续被声波激荡，$C_D$ 波动 ±5 %）以及全程与半程反弹的区别；碰撞算子（BGK）和分辨率相同。两者都高于 Schiller–Naumann 值 2.61，因为这个球并不自由：OpenLB 在 $160\times 60\times 60$ 的盒子里给出 3.04，按相同比例取 $D = 20$ 给出 3.21。OpenLB 只作为预先计算的参考；这里没有使用它的任何（GPL）代码。验证在同一次运行中紧接飞机之后实时计算（参数 validate，默认开启；2000 步），并显示在残差面板中。
meanings:
- 分布函数：格点 $(x, y, z)$ 处以格子速度 $i$ 运动的流体
- D3Q19 速度（静止、6 个面、12 条棱）、权重和相反方向
- STL 三角形：三角形 $t$、顶点 $v$、坐标 $a$
- 沿 $+x$ 的射线的带符号穿越次数（环绕数）为正即为内部；所有射线 × 所有三角形，然后 searchsorted
- 重复的 $a$ ⇒ 求和：沿每个格子方向的速度
- 重复的 $i$ ⇒ 求和：动量密度
- MRT：非平衡矩，各自以自己的速率 $s_k$ 松弛
- 非平衡动量通量；其大小决定 Smagorinsky 涡粘度 $\nu_t$
- 迁移：把每个分布函数移动一个链接
- 分布函数从流体格点朝物体离开处为 1（反弹即掩码交换）
- 动量交换：作用在物体上的力，对其边界链接求和
labels:
  body: 物体（data/ 中的 STL；sphere_openlb = OpenLB 验证算例）
  re: 雷诺数 $UL/\nu$（物体长度 $L$）
  collision: 碰撞算子
  les: Smagorinsky LES
  pitch: 攻角（飞机和机翼）
  steps: 格子时间步数
  validate: 同时运行 OpenLB 球体验证（残差面板）
