source_hash: 157106563a38
title: 慢滚暴胀与 (n_s, r) 平面
summary: 五种暴胀子势（$m^2\phi^2$、$\lambda\phi^4$、Starobinsky $R^2$、自然暴胀、四次山顶模型）在单个批量张量中按弗里德曼方程与克莱因–戈尔登方程演化，以 e 倍数 $N = \ln a$ 作为时钟。慢滚参数 $\epsilon$、$\eta$ 以及在 $N_* = 50$–$60$ 处的预言 $n_s$ 与 $r$ 用精确背景解检验，并与 Planck 2018 及 BICEP/Keck 2021 对照：$m^2\phi^2$ 与 $\lambda\phi^4$ 不受青睐，Starobinsky 则落在允许区域内。暴胀是初始条件的主流解释，但尚未得到证实：原初 B 模式尚未被探测到。
notes: 单位：约化普朗克质量 $M_\mathrm{pl} = 1$。以 $N = \ln a$ 为时间改写方程，令 $\psi = d\phi/dN$、$\epsilon_H = \psi^2/2$，可得 $d\psi/dN = -(3-\epsilon_H)(\psi + V'/V)$ 与 $H^2 = V/(3-\epsilon_H)$，因此只有 $V'/V$ 起作用，每个势都以高度 1 绘出（振幅 $A_s = 2.1\times10^{-9}$ 随后确定能标，以 $V_*^{1/4}$ 列出，多数模型约为 $10^{16}$ GeV）。每个场都从其结束前约 68 个 e 倍数处出发，起点由教科书的慢滚计数给出，初速取慢滚速度 $\psi = -V'/V$；测试让 $m^2\phi^2$ 以截然不同的初速出发，发现它们都在几个 e 倍数内落到同一条曲线上：慢滚是吸引子。暴胀在 $\epsilon_H = 1$ 处结束。预言值计算两次：由势的一阶结果（$n_s = 1 - 6\epsilon_V + 2\eta_V$、$r = 16\epsilon_V$，即 × 标记），以及由数值背景的哈勃流参数 $\epsilon_{1,2,3}$ 的二阶结果（Stewart and Lyth 1993；Schwarz, Terrero-Escalante and García 2001；即圆点）；两者相差 $O(\epsilon^2)$，约几个 $10^{-4}$（就 $n_s$ 而言）。这里没有逐模求解完整的 Mukhanov–Sasaki 方程。$N_* = 55$ 时的结果：$m^2\phi^2$ 给出 $n_s \approx 1 - 2/N_*$、$r \approx 8/N_* \approx 0.14$；$\lambda\phi^4$ 给出 $r \approx 0.29$，且 $n_s$ 过红；Starobinsky 给出 $n_s \approx 0.965$、$r \approx 12/N_*^2 \approx 0.004$；自然暴胀（$f = 7$）给出 $r \approx 0.08$，超出上限；四次山顶模型（$\mu = 15$）落在区域内。观测区域以方框表示（Planck 2018 $n_s = 0.9649 \pm 0.0042$，68
  %，TT,TE,EE+lowE+lensing；BICEP/Keck 2021 $r_{0.05} < 0.036$，95 %），而非已发表的二维等高线，后者略微倾斜且取决于数据组合。诚实的现状：暴胀解释了平坦性、视界问题，以及近乎尺度不变、高斯、绝热的扰动，而且 $n_s < 1$ 在被测量之前就已被预言；但也存在竞争理论（反弹与火劫模型），暴胀子尚未被确认，而确凿证据——由引力波产生的原初 B 模式偏振——尚未被探测到（BICEP2 在 2014 年的宣称最终证实是银河系尘埃）。试着把 $N_*$ 设在 50 到 60 之间（取决于宇宙如何再加热），或改变 $f$ 与 $\mu$：在 $N_* = 55$ 时自然暴胀永远进不了方框，因为降低 $f$ 虽使 $r$ 下降，却让 $n_s$ 过红（$f = 5$：$n_s \approx 0.950$、$r \approx 0.04$）。
meanings:
- one-hot 行：场 $b$ 使用势 $p$
- 在每个场上计算的五种势形状
- 重复的 $p$ ⇒ 求和：每个场各自的势
- 场与 $d\phi/dN$，以 e 倍数为步长用 RK4 一同推进
- 背景唯一需要的量：$V$ 的高度被消去
- 用自动微分求 $V'$ 与 $V''$
- $\epsilon_H$ 向上穿过 1 之处，即 $\ddot a$ 变号
- 结束前 $N_*$ 个 e 倍数处的哈勃流参数，用一次 gather 取得
- 由精确背景得到的二阶预言
labels:
  N_star: 结束前的枢轴 e 倍数 $N_*$
  f: 自然暴胀尺度 $f$
  mu: 山顶宽度 $\mu$
