source_hash: 5165c35a9a08
title: 用隐马尔可夫模型寻找 CpG 岛
summary: DNA 序列在普通背景与富含 GC 的 CpG 岛之间不可见地切换。一个双状态隐马尔可夫模型能找出它们：前向–后向算法给出每个位置处于岛内的概率，Viterbi 算法给出唯一的最佳分段，Baum–Welch 算法仅凭序列学习模型。沿序列的每一步都是对状态的批量矩阵乘积，并在对数空间中进行。看后验概率如何锁定植入的岛。
notes: 数据是合成的：每条序列在随机位置植入了长 100–300 个字母的岛，岛内 C 和 G 更多。单个字母几乎不能说明状态，但马尔可夫链 $A$ 使状态得以持续，因此前向与后向过程汇集了整段区域的证据。Baum–Welch 是期望最大化：在当前模型下计算 $\gamma$ 和 $\xi$，然后把 $E_{k\alpha}$ 设为各状态中字母的期望频率，把 $A_{ij}$ 设为期望的切换频率；似然从不下降。从一个模糊的猜测出发，它最终接近真实模型（绿线）。真实的 CpG 岛富含的是二核苷酸 CG，而不仅仅是 C 和 G；Durbin et al. 用 8 个状态（A+、C+、G+、T+、A−、…）建模，其转移即二核苷酸频率。降低岛的 GC 含量可使问题更难。
meanings:
- 序列 $b$ 第 $t$ 个位置的字母，对 A、C、G、T 独热编码
- 初始、转移与发射概率；状态 0 为背景，状态 1 为岛
- 重复的 $\alpha$ ⇒ 求和：各状态发射所见字母的可能性
- 重复的 $i$ ⇒ 求和；以 $\log\alpha$ 存储并提出最大项（log-sum-exp），以免下溢
- 重复的 $j$ ⇒ 求和：给定状态 $i$ 时序列其余部分的概率
- 后验 $P(z_t = k \mid x)$；$\gamma_{bt1}$ 为蓝色曲线
- Viterbi：同样的递推，以 max 代替求和，并记录回溯指针以得到最佳路径
- 重复的 $b, t$ ⇒ 求和：$i \to j$ 切换的期望次数；Baum–Welch 令 $A_{ij} \propto \xi_{ij}$
labels:
  n_seq: 序列数 $B$
  length: 长度 $T$
  n_islands: 每条序列植入的岛数
  gc_island: 岛的 GC 含量
  iterations: Baum–Welch 迭代次数
