source_hash: 4c18d665b55e
title: なぜ反物質より物質が多いのか？
summary: 宇宙には光子 1 個あたり約 $6\times 10^{-10}$ 個のバリオンがあり、反物質はほとんどありません。サハロフの三条件は、どんな説明にも何が必要かを示します。有力候補のレプトジェネシスでは、重いマヨラナニュートリノが反レプトンよりわずかに多くレプトンへ崩壊し（CP 非対称性 $\varepsilon$）、逆崩壊がその一部を洗い流し（強さ $K$）、スファレロンがレプトンをバリオンに変えます。数千の $(\varepsilon, K)$ モデルのボルツマン方程式を一つのバッチ ODE として解き、観測値 $\eta_B$ と比べます。未解決問題です。
notes: 観測：CMB からバリオン光子比は $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$（Planck 2018、$\Omega_bh^2 = 0.0224$）で、ビッグバン元素合成と一致し、反物質銀河の兆候はありません。対称な宇宙から出発すると、非対称性には（1）バリオン数の破れ、（2）C と CP の破れ、（3）熱平衡からのずれが必要であることをサハロフ（1967）が示しました。テストは（2）と（3）を直接確かめます：$\varepsilon = 0$、あるいは重いニュートリノを平衡に保つと、結果は厳密にゼロです。（1）は標準模型のスファレロン過程で、約 130 GeV 以上で $B - L$ を $B = \tfrac{28}{79}(B - L)$ に変換します。クォークの CP の破れ（CKM 位相）は小さすぎ、電弱転移はクロスオーバーなので、標準模型だけでは失敗します：新しい物理が必要です。レプトジェネシス（福来と柳田 1986）はシーソー機構の重い右巻きニュートリノを使い、この機構は軽いニュートリノがなぜこれほど軽いかも説明します。このトイモデルは最も軽い $N_1$ の崩壊と逆崩壊だけを残し（$\Delta L = 2$ 散乱、フレーバー効果、熱補正はなし）、Buchmüller、Di Bari、Plümacher（2005）の規格化を使います。弱いウォッシュアウト（$K \ll 1$）で熱的な初期条件なら非対称性はすべて残り（$\kappa_f \to 1$、確認済み）、強いウォッシュアウト（$K \gg 1$）では大半が失われる代わりに初期条件を忘れ（二つの初期条件が合流）、ソルバーは彼らの解析的フィットと約 10% 以内で一致します。$K = \tilde m_1/m_*$、$m_* \approx 1.08\times10^{-3}$ eV とすると、振動実験で見えるニュートリノ質量（$\approx 0.009$–$0.05$ eV）は $K \approx 10$–$50$ を指し、そこでは $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$ が必要です。すると Davidson–Ibarra の上限 $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$
  から $M_1 \gtrsim 10^{10}$ GeV が要求されます。現状：未解決。レプトジェネシスは魅力的で既知のすべてと矛盾しませんが、確認されていません：重いニュートリノは加速器のはるか先にあります。間接的な手がかりはニュートリノレス二重ベータ崩壊（マヨラナ性）とニュートリノ振動における CP の破れ（T2K、NOvA、次は DUNE とハイパーカミオカンデ）で、電弱バリオジェネシスなど他の機構も代替案として残っています。このページはトイ方程式を数値的に探るもので、非対称性が実際にこうして生じたとは主張しません。
meanings:
- $z = M/T$、対数間隔：宇宙が冷えるにつれて時計が進む
- CP 非対称性を第 1 軸、崩壊パラメータを第 2 軸に並べ、すべて $(E, K)$ にブロードキャスト
- $\tfrac38 z^2K_2(z)$：相対論的な間は光子あたり $3/4$、その後 $e^{-z}$
- ステップ中点でのハッブル時間あたりの崩壊と逆崩壊
- $N_N - N_N^{eq}$：平衡からのずれ（サハロフ条件 3）
- 線形 ODE の厳密な 1 ステップ因子：$K = 1000$ でも安定
- 全モデルの $B - L$ 非対称性を、1 ステップ 1 回のテンソル更新で進める
- スファレロンは $B - L$ の $28/79$ をバリオンとして残し、光子は $f = 2387/86$ 倍に増える
- 効率：弱いウォッシュアウトで $1$、強いウォッシュアウトで $\approx 1/(K z_B)$
labels:
  log_eps: 表示するモデル：$\log_{10}\varepsilon$
  log_K: 表示するモデル：$\log_{10}K$
  initial: 重いニュートリノの初期存在量
  n_eps: $\varepsilon$ の格子点数
  n_K: $K$ の格子点数
  steps: $z$ の積分ステップ数
  z_max: 最終の $z = M/T$
