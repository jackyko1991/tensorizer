source_hash: 27367fbd090e
title: 拡散テンソル画像：神経線維をマッピングする
summary: 水は軸索を横切るより軸索に沿って速く拡散するので、各ボクセルは拡散テンソル $D_{ij}$ をもつ。Stejskal–Tanner の信号 $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$ はボクセルと勾配方向についての1つの einsum である。対数信号のバッチ最小二乗フィットで $D_{ij}$ を復元し、その固有値分解から平均拡散係数、異方性比率、線維方向が得られ、その方向を RK2 でたどると神経束が描ける（トラクトグラフィー）。
notes: 拡散係数の単位は $10^{-3}\,\mathrm{mm^2/s}$、$b$ は $\mathrm{s/mm^2}$：神経束ではおよそ $\lambda_\parallel = 1.7$、$\lambda_\perp = 0.3$（FA ≈ 0.8）、自由水（CSF）は 3.0、灰白質は 0.8。これらは教育用の近似値であり、臨床には使用できない。ノイズはライス分布（複素信号の大きさ）に従うので、ノイズの多いフィットは等方的な領域で FA を過大評価する。2つの神経束が交差する場所では、1つのテンソルはそれらの平均、すなわち FA の低い平たい（平面状の）テンソルしか表せず、そこに入った線維追跡は止まったり、誤ってもう一方の束へ曲がったりする：これはマルチファイバーモデルが対処する DTI の典型的な限界である。各楕円はフィットしたテンソルの面内の形を示す。流線はシードから出発し、双線形補間したテンソル場の主固有ベクトルを中点法（RK2）でたどり、FA が 0.2 を下回ると止まる。ノイズを増やしたり、勾配方向を減らしたり、$b$ を小さくしたりしてみよう。
meanings:
- 半球上に分布させた単位拡散勾配方向
- 各ボクセルの真の拡散テンソル：神経束は $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$、CSF と灰白質は等方的
- 繰り返される $i, j$ ⇒ 和をとる：各ボクセル・各方向の拡散強調信号
- $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$ となるような行 $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$
- テンソルの6つの独立成分の最小二乗フィット、全ボクセルを一度に
- 固有値と固有ベクトル。最大固有値の固有ベクトルが線維に沿った方向を向く
- 平均拡散係数（トレース/3）と異方性比率（0 は等方的、1 は単一方向）
labels:
  b: 拡散強調度 $b$
  n_dirs: 勾配方向の数
  noise: ノイズレベル $\sigma/S_0$
  size: 1辺のボクセル数
