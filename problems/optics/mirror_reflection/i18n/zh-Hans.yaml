source_hash: d32c883229aa
title: 平面镜与曲面镜的反射
summary: 反射定律写成一个矢量公式：把光线方向中沿表面法线的分量反向。灯发出的光线在平面镜上反射；平行光线在凹面镜上反射，会聚到焦点 $F = R/2$ 附近。
notes: 公式只翻转 $\mathbf d$ 沿 $\mathbf n$ 的分量，所以入射角自动等于反射角。虚线把反射光线延长到平面镜后方：它们都交于灯的虚像。对于凹面镜，只有靠近光轴的光线（傍轴光线）通过 $F = R/2$；离轴较远的光线在更靠近镜面处与光轴相交（球差）。
meanings:
- 入射光线 $r$ 的单位方向，分量 $i \in \{x, y\}$
- 光线 $r$ 入射点处镜面的单位法向量
- 重复的 $j$ ⇒ 求和：每条光线一个点积（${}= -\cos\theta_i$）
- 反射方向，仍为单位矢量
- 曲面镜的法线指向其球心 $c$
labels:
  radius: 镜面曲率半径 $R$
  n_rays: 每面镜子的光线数
  aperture: 最高光线（占 $R$ 的比例）
