source_hash: 1470d7e1b6a9
title: बिंदु आवेशों का विद्युत क्षेत्र
summary: ग्रिड पर कूलॉम का नियम और अध्यारोपण (superposition)। Broadcasting एक ही बार में हर आवेश से हर ग्रिड बिंदु तक का पृथक्करण सदिश बना देता है, और आवेश सूचकांक पर एक einsum सबके क्षेत्रों को जोड़ देता है। एक आवेश वृत्त पर घूमता है और क्षेत्र रेखाएँ उसके साथ चलती हैं।
notes: मात्रक जिनमें $k = 1$। आवेश 3D में बिंदु आवेश हैं, इसलिए हर क्षेत्र $1/r^2$ की तरह घटता है; हम केवल उस तल को देखते हैं जिसमें वे हैं। तीर धनात्मक आवेशों (लाल) से दूर और ऋणात्मक आवेशों (नीला) की ओर इंगित करते हैं; दो समान चिह्न वाले आवेशों के बीच एक उदासीन बिंदु (neutral point) बनता है जहाँ क्षेत्र शून्य होता है।
meanings:
- ग्रिड बिंदु $g$, घटक $i \in \{x, y\}$
- आवेश $q$ की स्थिति
- हर आवेश का मान
- 'broadcasting: हर आवेश से हर ग्रिड बिंदु तक का सदिश'
- 'दोहराया गया $j$ ⇒ योग: दूरियाँ'
- 'दोहराया गया $q$ ⇒ योग: सभी आवेशों का अध्यारोपण'
labels:
  q_fixed: स्थिर आवेश
  q_moving: गतिशील आवेश
  n_grid: प्रति भुजा तीर
