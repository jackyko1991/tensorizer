source_hash: cf2636b6ae13
title: 'Физически информированная нейронная сеть (PINN): затухающий осциллятор'
summary: Небольшая нейронная сеть $\hat x(t; w)$ изучает движение груза на пружине с затуханием всего по десяти зашумлённым измерениям в первых 40 % интервала. Если добавить уравнение движения $m\ddot x + \mu\dot x + kx = 0$ в функцию потерь и вычислять его с помощью автоматического дифференцирования в точках коллокации, сеть экстраполирует там, где обычная сеть терпит неудачу, а в режиме обратной задачи она ещё и находит неизвестное затухание $\mu$.
notes: 'Обычная нейронная сеть — гибкий инструмент подгонки кривых: обученная только на измерениях, она может пройти через них, но за последней точкой данных ничто не говорит ей, что делать, и её прогноз (штриховая линия) уплывает. Физически информированная нейронная сеть (PINN) добавляет второе слагаемое функции потерь — средний квадрат невязки $r_c = m\hat x'''' + \mu\hat x'' + k\hat x$ в точках коллокации $t_c$, покрывающих весь интервал, в том числе там, где данных нет. Производные — это точные производные сети по её входу, вычисленные через torch.autograd.grad с create_graph=True, чтобы потери можно было обратно распространить через них к весам. Требование $r_c \to 0$ заставляет $\hat x$ всюду быть решением уравнения движения; данные и начальные условия $x(0) = 1$, $\dot x(0) = 0$ затем выбирают единственное подходящее решение, поэтому сеть правильно экстраполирует. Физика работает как регуляризатор, заменяющий недостающие данные. В обратной задаче затухание $\mu$ неизвестно: оно становится
  обучаемым параметром, и оптимизатор находит значение, при котором данные и физика согласуются (посмотрите, как оно проскакивает и затем устанавливается). Точное решение: $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$, где $\delta = \mu/2m$ и $\omega = \sqrt{k/m - \delta^2}$. Практические замечания: невязка порядка $k$, умноженного на ошибку, поэтому вес $\lambda \approx 10^{-4}$ уравновешивает её с членом данных (при слишком большом весе сеть застревает на тривиальном решении $\hat x = 0$, у которого невязка тоже равна нулю); более высокие частоты (большее $k$) требуют больше итераций, потому что сеть сначала выучивает низкие частоты. Прямая задача решается здесь только для иллюстрации метода: решатель ОДУ был бы гораздо быстрее. PINN окупаются в обратных задачах, при скудных и зашумлённых данных и для УЧП в областях сложной формы. Упрощения: фиксированная масса $m = 1$, фиксированное зерно генератора и Adam с косинусно убывающей скоростью обучения (без доводки
  L-BFGS).'
meanings:
- 'один батч входных времён: точки коллокации, моменты измерений и $t = 0$'
- 'обучаемые веса $w$ слоя $l$: размеры $1 \to 32 \to 32 \to 32 \to 1$'
- повторяющийся $j$ ⇒ сумма по нейронам предыдущего слоя
- скрытые активации; гладкая функция активации, чтобы у $\hat x$ были вторые производные
- даёт $\dot{\hat x}$; повторный вызов для неё даёт $\ddot{\hat x}$ (точные производные сети, без конечных разностей)
- 'невязка ОДУ в точках коллокации: ноль там, где $\hat x$ подчиняется физике'
- расхождение с данными, среднее $r_c^2$ и начальное условие $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- 'обратная задача: затухание — ещё один обучаемый параметр, который Adam обновляет вместе с весами'
labels:
  mode: 'Режим: обучать $\mu$ (обратная задача) или знать (прямая)'
  k: Жёсткость пружины $k$
  mu: Истинное затухание $\mu$
  mu_guess: Начальное приближение для $\mu$ (обратная задача)
  n_data: Число измерений
  data_fraction: Доля интервала, покрытая измерениями
  noise: Шум измерений
  n_colloc: Точки коллокации $t_c$
  log10_lambda: Вес физики $\log_{10}\lambda$
  n_iter: Итерации обучения
  lr: Скорость обучения Adam
  compare: Обучить также сеть без физики
