source_hash: a8220b6707c1
title: Hopfield 網絡：經典與現代的聯想記憶
summary: 一種能從損壞或被遮住一半的版本補全圖像的記憶。經典 Hopfield 網絡把二元圖樣存入 Hebb 權重 $W_{ij}$，並沿能量向下滑；它最多只能存約 $0.138\,N$ 個隨機圖樣，相關的圖樣則少得多。Ramsauer 等人（2020）的現代連續 Hopfield 網絡保留圖樣本身，並以 $\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$ 更新，這正是 transformer 的注意力機制：它一步就能取回卡通臉孔，而經典網絡卻會把它們混在一起。
notes: 這些臉孔並非任何人的圖像：每一張都由程式根據幾個隨機數畫出（頭形、眼睛、眼鏡、眉毛、鼻子、嘴巴彎度、頭髮、耳朵），因此沒有使用任何受版權保護的角色或照片。每個查詢會遮住臉孔下方 40 % 的部分，並翻轉其餘像素的 5 %。對隨機圖樣，經典網絡的極限 $\alpha_c \approx 0.138$ 是 Amit、Gutfreund 與 Sompolinsky（1985）以自旋玻璃的方法計算出來的，而一步更新的位元錯誤率遵循高斯串擾定律 $\Phi(-1/\sqrt\alpha)$（兩者都在測試中驗證）。臉孔之間高度相關（它們共用輪廓和大片空白紙面），因此經典網絡在遠低於 $0.138$ 的負載下就已經會混淆它們：它會落入多張臉孔的混合態。現代網絡的能量含有一個 log-sum-exp 項；Ramsauer 等人證明它在每次更新時都會下降、通常一次更新就足夠，而且對分離良好的圖樣，容量隨 $N$ 指數增長。它的更新正是以儲存的圖樣作為鍵和值的 transformer 注意力。把 $\beta$ 調小，就會看到幾張臉孔的亞穩態平均，而不是單一臉孔。這個構想取自該論文附帶的部落格文章，只是以程式生成的臉孔取代了其中的卡通圖片。
meanings:
- 圖樣 $\mu$：程式繪製的卡通臉孔，墨水為 $+1$，紙面為 $-1$，$N = 32 \times 32$ 像素
- Hebb 規則，重複的 $\mu$ ⇒ 求和；每個儲存臉孔數對應一個網絡 $f$，對角線設為 0
- 重複的 $j$ ⇒ 求和：每個網絡與查詢中神經元 $i$ 所受的場；$s_i$ 取其符號
- 能量；在每次只更新一個神經元時永不上升
- 重複的 $n$ ⇒ 求和：查詢與每個儲存圖樣的相似度，由 $\beta$ 銳化
- 重複的 $\mu$ ⇒ 求和：新狀態是各圖樣的加權平均，$\beta$ 很大時只剩一個圖樣
- 回憶品質：臉孔被完全還原時為 1
labels:
  n_faces: 最多儲存的臉孔數 $P$
  beta: 逆溫度 $\beta$
  mask: 每張臉孔被遮住的比例
  noise: 翻轉的像素
  sweeps: 經典更新掃描次數
  n_random: 容量曲線的神經元數 $N$
