source_hash: 160447300c99
title: MRI：T1 与 T2 弛豫及图像对比度
summary: 射频脉冲之后，每种组织的磁化矢量以时间常数 $T_1$ 沿磁场方向恢复，其横向分量则以 $T_2$ 衰减。把自旋回波信号写成一个以（组织、$TR$、$TE$）为指标的张量，再与卡通大脑的组织标签图缩并，就能看出 $TR$ 与 $TE$ 的选择如何让图像成为 T1、PD 或 T2 加权。
notes: 短 $TR$ 加短 $TE$ 得到 T1 加权：脂肪与白质明亮，脑脊液（CSF）暗，因为它的长 $T_1$ 还来不及恢复。长 $TR$ 配短 $TE$ 去除了 $T_1$ 因子，留下质子密度（PD）加权。长 $TR$ 加长 $TE$ 得到 T2 加权：$T_2$ 极长的 CSF 成为最亮的组织。这个简单公式忽略了重聚焦脉冲对 $M_z$ 的影响，并假设 $TR \gg TE$。每张图像都按自身最亮的像素调整窗宽，就像扫描仪的显示一样。组织参数是 1.5 T 下的粗略教科书数值，仅供教学，不可用于临床。试着调整短、长 $TR$/$TE$，观察灰质与白质的对比如何翻转。
meanings:
- $S = 5$ 种组织的弛豫时间与质子密度（1.5 T 下的近似值）
- 纵向恢复，在组织 $s$ 与时间 $t$ 上广播
- 每种组织的横向衰减
- 每种组织、重复时间 $TR_a$ 与回波时间 $TE_b$ 的自旋回波信号（没有指标被求和）
- one-hot 标签图：哪种组织占据像素 $(x, y)$
- 重复的 $s$ ⇒ 求和：每组 $(TR, TE)$ 对应的图像
- $M_0(1 - 2e^{-t/T_1})$ 过零点的反转时间，用来抑制脂肪（STIR）或 CSF（FLAIR）
labels:
  tr_short: 短重复时间 $TR$
  tr_long: 长重复时间 $TR$
  te_short: 短回波时间 $TE$
  te_long: 长回波时间 $TE$
  size: 体模大小
  n_frames: 动画帧数
