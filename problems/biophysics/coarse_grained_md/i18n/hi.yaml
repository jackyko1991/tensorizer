title: 'स्थूल-कणिक (coarse-grained) प्रोटीन वलन: लैंजेविन गतिकी के साथ Gō मॉडल'
summary: एक छोटा हेलिक्स-हेयरपिन प्रोटीन मनकों की एक श्रृंखला के रूप में, प्रति अमीनो अम्ल एक मनका, जो आबंधों और आबंध कोणों से जुड़े रहते हैं और आकर्षक मूल संपर्कों (native contacts) से स्थिर होते हैं (Gō मॉडल)। बल कुल ऊर्जा का autograd प्रवणता है, और ऊर्जा युग्मीय-दूरी टेंसरों के रूप में लिखी गई है। लैंजेविन गतिकी तापमानों और प्रतिकृतियों (replicas) के पूरे बैच को एक साथ चलाती है, आधी वलित अवस्था से और आधी अवलित अवस्था से शुरू होती हैं; मूल संपर्कों का अंश $Q(t)$ वलन और अवलन दिखाता है, और तापमान के विरुद्ध उसका औसत गलन वक्र है।
notes: 'Gō मॉडल उत्तर से बनाया जाता है: मूल संरचना में मौजूद हर अन्योन्यक्रिया आकर्षक होती है और बाकी सब केवल प्रतिकर्षित करता है, इसलिए ऊर्जा परिदृश्य मूल वलन की ओर एक चिकना कीप (funnel) होता है। यह एक व्यंग्यचित्र है, पर उपयोगी: छोटे प्रोटीन सचमुच ऐसे वलित होते हैं मानो उनका परिदृश्य न्यूनतम रूप से कुंठित (minimally frustrated) हो, और Gō मॉडल उनमें से कई की वलन दरें, संक्रमण अवस्थाएँ और सहकारी गलन पुनः उत्पन्न करते हैं। इकाइयाँ घटित (reduced) हैं: ऊर्जा $\varepsilon$ (एक संपर्क) में, तापमान $\varepsilon/k_B$ में, समय $\tau$ में। आधी प्रतिकृतियाँ वलित और आधी सीधी छड़ के रूप में शुरू होती हैं; जहाँ ठोस और धराशायी वक्र मेल खाते हैं वहाँ रन संतुलन में पहुँच गए हैं, जहाँ नहीं (कम $T$ पर) वहाँ अवलित श्रृंखलाएँ गलत वलित अवस्थाओं में गतिकीय रूप से फँसी हैं और उन्हें बहुत लंबे रन या प्रतिकृति विनिमय (replica exchange) की आवश्यकता होगी। गलन वक्र चौड़ा है क्योंकि प्रोटीन बहुत छोटा है; सैकड़ों संपर्कों वाले वास्तविक प्रोटीन तीव्रता से पिघलते हैं। द्वितल (dihedral) पद के बिना ऊर्जा केवल दूरियों पर
  निर्भर करती है, इसलिए मूल वलन के दर्पण प्रतिबिंब की ऊर्जा और $Q$ ठीक वही होते हैं; वास्तविक Gō मॉडल हस्तता (handedness) तय करने के लिए द्वितल विभव जोड़ते हैं। घर्षण (यह गतिकी बदलता है पर संतुलन वक्र नहीं) या तापमानों की संख्या बदलकर देखें।'
meanings:
- तंत्र $s$ का मनका $i$; $S = B\cdot R$ तापमान × प्रतिकृतियाँ
- युग्म $p = (i_p, j_p)$ की मूल दूरी, $j - i \ge 3$; मूल वलन में 8 Å से निकट हो तो $n_p = 1$
- हर तंत्र की सभी युग्म दूरियाँ एक टेंसर में, $a$ पर योग
- आबंध + कोण + 12–10 मूल कूप ($r^0_p$ पर न्यूनतम $-\varepsilon$) + गैर-मूल युग्मों का प्रतिकर्षण
- स्वचालित अवकलन से बल; $s$ पर योग ठीक है क्योंकि तंत्र परस्पर क्रिया नहीं करते
- हर तंत्र को अपना ऊष्मा-कुंड मिलता है
- किक, ड्रिफ्ट, घर्षण + रव $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$, ड्रिफ्ट, किक
- 'बने हुए मूल संपर्कों का अंश: वलित के लिए 1, अवलित श्रृंखला के लिए लगभग 0.4 (स्थानीय संपर्क बनते रहते हैं)'
- रन के दूसरे आधे भाग पर समय औसत; जहाँ यह ½ को पार करता है वहाँ $T_m$
