source_hash: b7086dad7034
title: घर्षण सहित आनत तल पर गुटका
summary: गुटके पर गुरुत्व, अभिलंब बल और घर्षण, जिन्हें einsum प्रक्षेपों द्वारा हर ढलान के ढाल और अभिलंब एकक सदिशों के अनुदिश वियोजित किया जाता है। आनति कोणों का एक बैच स्थैतिक घर्षण की देहली $\tan\theta = \mu_s$ दिखाता है।
notes: 'स्थैतिक घर्षण उतना ही होता है जितनी ज़रूरत हो, अधिकतम $\mu_s N$ तक, इसलिए विराम से छोड़ा गया गुटका तब तक स्थिर रहता है जब तक $\tan\theta \le \mu_s$। फिसलना शुरू होते ही गतिज घर्षण $\mu_k N$ (जहाँ $\mu_k \le \mu_s$) लागू होता है और त्वरण स्थिर रहता है, इसलिए दूरी $\tfrac12 at^2$ की तरह बढ़ती है जब तक गुटका तली तक न पहुँच जाए। गुटके को बिंदु माना गया है: न पलटना, न लुढ़कना।'
meanings:
- ढलान $b$ पर नीचे की ओर एकक सदिश, $(\cos\theta, -\sin\theta)$
- ढलान $b$ का एकक अभिलंब, $(\sin\theta, \cos\theta)$
- गुरुत्व सदिश $(0, -g)$
- 'दोहराया गया सूचकांक ⇒ योग: ढलान में धँसने वाला गुरुत्व का घटक'
- प्रति इकाई द्रव्यमान अभिलंब बल, गुरुत्व के ढलान-भीतर वाले भाग को निरस्त करता है
- यदि गुटके को रोक सके तो स्थैतिक घर्षण, अन्यथा गतिज $\mu_k N$
- 'ढलान के अनुदिश त्वरण: $g(\sin\theta - \mu_k\cos\theta)$ या 0'
