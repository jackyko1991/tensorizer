title: 由 CNN 与混合专家控制器操控的贪吃蛇
summary: 一个由两部分组成的游戏智能体：一个观察棋盘的小型 CNN，以及一个选择动作的控制网络——这里是混合专家模型，其路由器把每局游戏发送到 $K$ 个小型专家网络之一。游戏是 $10 \times 10$ 网格上的贪吃蛇，完全用张量写成，使一批游戏能在一步之内同时推进。控制器通过模仿一个规划式教师（广度优先搜索与泛洪填充，同样是张量运算）来学习。比较了四个权重预算相同的控制器：稠密混合、Switch top-1 路由器、以稠密方式训练但以 top-1 使用的路由器，以及一个普通 MLP；随后将路由与游戏状态对照测量，看看每个专家究竟负责什么（如果有的话）。四者每局都吃到约 20 个食物，而随机策略仅吃到 0.2 个，相当于教师得分的三分之二；在这个规模下，普通 MLP 的表现不逊于任何混合模型。
notes: 构想。Jacky Ka Long Ko 提议一个游戏智能体：用 CNN 负责感知，用带混合专家路由的控制网络负责控制，并特别要求张量路由的部分。本问题以贪吃蛇构建一个小型版本；贪吃蛇是一款通用的网格游戏，在此从零写成（自绘像素外观，不使用任何素材）。游戏。在 $N \times N$ 棋盘（$N = 10$）上的 $B$ 局游戏构成同一组张量。棋盘存储每个蛇身格的年龄（距离该格再次空出所需的步数：蛇头的年龄 = 长度，蛇尾为 1），因此所有游戏的一步只需少数几个张量运算：对于相对动作 $a$（左转、直行、右转），蛇头以新方向 $d' = (d + a - 1) \bmod 4$ 移到 $\mathbf x + \Delta_{d'}$；撞墙或撞上年龄 $> 1$ 的格子即结束游戏（蛇尾格正要离开，所以是空的）；没吃到食物时所有年龄减 1，吃到食物时蛇保留蛇尾并增长一格；新食物放在 $N^2$ 个带种子的均匀随机数中数值最大的空格，因此绝不会落在蛇身上。游戏也会在连续 $N^2$ 步未吃到食物，或蛇填满棋盘时结束。测试：撞墙与撞到自身、空出的蛇尾格、增长一格、食物绝不在蛇身上、年龄始终恰为 $\ell, \ell - 1, \dots, 1$，以及在相同随机数下批量步进与逐局的普通 Python 循环结果相同。智能体。感知部分是一个 CNN（8 通道的 3×3 卷积、16 通道且步长为 2 的 3×3 卷积、一个输出 $F = 64$ 个特征的线性层；共 84 472 个权重），输入是以蛇头为中心、前进方向朝上的视野，含四个平面：墙、蛇身、年龄/长度（哪些格子最先空出）与食物。在此坐标系中，三个相对动作始终对应中心的同样三个邻格（有测试检查：某动作致命，当且仅当该邻格是墙或不会空出的蛇身格）。控制部分是 $K = 4$ 个专家的混合，每个专家是输出动作 logits 的 MLP $64 \to 32 \to 3$，前接 softmax 路由器 $p = \mathrm{softmax}(W^G \mathbf h + b^G)$：共 8976 个权重。路由层即 moe_dag_pipeline 中的那一层，直接从中导入：一个分派张量把每局游戏放入其专家的缓冲区（按累积排名，如 GShard 与 Switch），所有专家在一次批量 einsum 中运行，再用一个合并
  einsum 把 logits 送回。精确检查：使用固定 one-hot 路由器时，该层等同于对每局游戏单独运行其专家（误差在 $10^{-6}$ 以内）；均匀的稠密路由器给出各专家的平均；路由器的每行之和为 1；以及负载均衡损失在已知情形下的值（均衡时为 1，坍缩时为 $K$，一个手算例子为 1.1）。四个控制器，相同预算：(a) 稠密混合 $z = \sum_k p_k f_k$（每个专家处理每局游戏）；(b) Switch top-1，只运行概率最高的专家，并将其 logits 乘以 $p_k$；(c) 将 (a) 的稠密训练模型改用 top-1 路由运行，不再额外训练；(d) 一个 MLP $64 \to 132 \to 3$（8979 个权重，与混合模型相同）。(a) 与 (b) 都加入 $\alpha = 0.01$ 的 Switch 负载均衡损失。每个变体有两个种子；种子 $s$ 在每个变体中都从相同的 CNN 与专家权重开始，全部六个训练模型共用一个模型轴（CNN 的分组卷积），各自使用自己的小批量。教师与训练。教师是用相同张量写成的规划器：通过在空格上反复松弛实现的广度优先搜索（$\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$），并在同一循环中进行泛洪填充，以每个空区域中最小的格子索引作为其标记。它从不走致命的一步，优先选择其空区域容得下蛇的动作，其次是通往食物的最短路径，再次是较大的区域；测试中其距离场与教科书式基于队列的 BFS 相同。训练采用行为克隆（Pomerleau 1989）：对教师的动作计算交叉熵，数据为 192 局教师游戏中的 54 040 个状态，每个模型 600 步 AdamW、每步 128 个状态，并在 360 步后进行一轮 DAgger（Ross et al. 2011）：每个学生各玩 48 局，教师为它们到达的 38 267 个状态打标签，然后在两者上继续训练。未进行强化学习微调；深度 Q 学习（Mnih et al. 2015）是仅凭奖励学会此类游戏的经典方法，但在 CPU 上会耗时多得多。结果（默认运行，所有策略共用 128 局评估游戏：相同的初始状态与相同的食物序列，最多 300 步）。每局吃到的食物，对各局取平均，括号内为两个种子：随机
  0.16（15 步后死亡）；(a) 稠密 20.7（20.9, 20.4）；(b) Switch 20.4（21.1, 19.6）；(c) 稠密→top-1 18.1（18.4, 17.8）；(d) 单一模型 21.7（21.8, 21.6）；教师 31.0（平均在 300 步中存活 287 步，学生则为 147–179 步）。学生在 95–96 % 的训练状态上与教师一致，得分却少了三分之一：小错误在一局中不断累积，这是行为克隆的常见弱点。一个慢速测试检查训练后的策略以明显差距胜过随机策略。路由——即使并非专门化也照样展示。稠密路由器使用全部四个专家（负载 0.16–0.38）。它们最能追踪的是动作本身：被路由的专家与控制器动作之间的互信息为 0.51 与 0.56 bit（四个专家时最多为 2 bit）；在种子 1 中，一个专家几乎包揽所有左转与右转，以及几乎所有前方没有空格的状态，而其余三个专家分担直行动作。前方空格数携带 0.20–0.28 bit，与食物的距离 0.08–0.12，蛇身长度 0.02–0.13（仅种子 1 有从短蛇到长蛇的漂移）。因此专家是按“要做什么”（转弯或继续前进）分工，而不是按某种策略，例如追逐食物与避开蛇尾；由于专家的输出决定动作，这种分工部分是结构上内置的。Switch 路由器尽管有均衡损失仍然坍缩：种子 1 把 85 % 的状态发送给一个专家、15 % 发送给第二个，种子 2 则为 73 % 与 26 %，各有两个专家未被使用；在 moe_dag_pipeline 中看到的对称性破缺困难，在这里表现为坍缩。这对得分毫无损失，因为一个专家搭配共享的 CNN（它持有大部分权重）已经玩得和四个专家一样好。以 top-1 运行稠密训练的路由器 (c) 保留了稠密路由（与动作的互信息为 0.60 与 0.67 bit），但每局少吃 2.6 个食物：稠密模型混合了各专家，并非完全可分离。哪些成立，哪些不成立。精确成立：批量游戏与参考循环相同，固定路由器下的路由层等同于逐局调用专家，均匀路由器下的稠密混合即为专家平均。在单一棋盘尺寸与两个种子上测量：模仿使每个控制器都达到教师约三分之二的水平，且没有任何混合模型胜过权重相同的普通 MLP（MLP 在两个种子中都领先约每局 1 个食物，就两个种子而言差距不大）。混合专家要在众多专家合计持有的权重远多于单个输入所能使用时才有回报；在一个承担大部分工作的
  CNN 之后接上四专家控制器，展示的是路由本身，而非其优势。相关工作。局部专家的自适应混合（Jacobs、Jordan、Nowlan 与 Hinton 1991）引入了一个门控，将每个样本分派给若干相互竞争的专家之一；稀疏门控 MoE 层（Shazeer et al. 2017）与 Switch Transformer（Fedus et al. 2021，即此处所用的 top-1 路由与负载均衡损失）将其扩展到大规模。深度 Q 网络（Mnih et al. 2015）用 CNN 仅凭奖励从像素学会 Atari 游戏；ALVINN（Pomerleau 1989）通过模仿人类驾驶员来操控车辆，是行为克隆的起源；DAgger（Ross、Gordon 与 Bagnell 2011）则通过标注学习者自身访问的状态来修正其累积误差。设备与限制。默认使用 CPU：在一台繁忙的 6 核机器上，教师、训练与评估约需 80 s（教师游戏 6.6 s、DAgger 6.0 s、训练 53 s、评估 16 s），GIF 另需约 30 s；GPU（pixi run -e cuda）能加速 CNN，但无法加速教师的大量小型搜索。GIF 展示 (c)，其路由器使用所有专家，且每局恰好运行一个；routing.png 展示全部三个路由变体，routing.csv 与 scores.csv 保存数据。
meanings:
- 游戏 $b$ 的棋盘：0 = 空格，否则为该蛇身格再次空出前所需的步数（蛇头 = 长度 $\ell_b$，蛇尾 = 1）
- 全部 $B$ 局游戏同时移动；对于相对动作 $a_b$（左转、直行、右转），$d'_b = (d_b + a_b - 1) \bmod 4$；撞墙或撞上年龄 $> 1$ 的格子即结束游戏（年龄为 1 的蛇尾格正要离开）
- 吃到食物后，选取带种子均匀随机数 $u_{brc}$ 中数值最大的空格：绝不在蛇身上
- CNN 看到的内容：墙、蛇身、年龄/长度与食物，以蛇头为中心、前进方向朝上，因此三个动作始终对应同样三个邻格
- CNN 特征；模型轴 $m$（变体 × 种子）成为每层一个分组卷积中的各组
- 路由器：对 $K$ 个专家做 softmax，每行之和为 1
- 将游戏 $b$ 分派到专家 $k$ 的槽位 $s$（即它在被路由到该专家的游戏中的排名），从 moe_dag_pipeline 导入
- 所有专家在一次批量乘积中计算，各自处理自己的游戏缓冲区：三个动作 logits
- 合并；稠密时：$z = p_{mbk} y_{mkba}$，每个专家处理每局游戏
- Switch 负载均衡，$K \sum_k f_k P_k$：均衡时为 1，坍缩时为 $K$
- 教师：不走致命的一步，其次选择其空区域（泛洪填充）容得下蛇的动作，再次是通往食物的最短路径（通过反复张量松弛实现的广度优先搜索）
labels:
  grid: 棋盘尺寸 $N$（格）
  seeds: 每个变体的种子数
  experts: 专家数 $K$
  steps: 训练步数
  balance_weight: 负载均衡权重 $\alpha$
  dagger: DAgger 轮次（1 = 开启）
  eval_games: 评估游戏局数
