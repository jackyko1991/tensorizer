title: The Kakeya conjecture
category: maths
level: advanced
order: 8
tags: [fields:2026, status:partial]  # Hong Wang, Kakeya in three dimensions
summary: >
  A needle can be turned through every direction inside a set of arbitrarily small area. This problem builds such a set
  (Perron's tree of $2^k$ thin triangles, shifted sideways) and measures its area exactly, row by row. It then covers
  unions of $\delta$-tubes in $\mathbb R^2$, $\mathbb R^3$ and $\mathbb R^4$ with $\delta$-cubes to estimate their
  dimension. The Kakeya conjecture says such sets still have full dimension $n$. That is proven for $n = 2$ and,
  since 2025, $n = 3$; for $n \ge 4$ the only proofs so far are unverified, AI-generated claims.
animated: true
vector_form: '|T_1 \cup \dots \cup T_N| \le \big(\alpha^{2k} + 2(1-\alpha)\big)\,|T| \xrightarrow[k\to\infty]{} 0,\qquad \dim_M K = \lim_{\delta\to0}\frac{\log N_\delta(K)}{\log(1/\delta)} \overset{?}{=} n \;\text{ for every Kakeya set } K\subset\mathbb R^n'
index_form: '\ell_{yi} = b_i(1 - y) + s_i,\quad r_{yi} = \ell_{yi} + w_0(1-y),\qquad |\textstyle\bigcup T| = \frac1Y\sum_y \sum_i \big(r_{y(i)} - \max(\ell_{y(i)}, \max_{j<i} r_{y(j)})\big)_+,\qquad N_\delta = \#\big\{\lfloor (c_{j} + t\,u_{j})/\delta \rfloor\big\}'
