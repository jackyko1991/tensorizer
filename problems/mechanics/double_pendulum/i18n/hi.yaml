source_hash: 75e6d7e3dc93
title: द्वि-लोलक और अव्यवस्था (chaos)
summary: द्वि-लोलक के लाग्रांजी समीकरण $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$ के रूप में। हर RK4 चरण $2\times 2$ द्रव्यमान-आव्यूह टेंसर बनाता है और torch.linalg.solve बुलाता है; दो लगभग समान प्रारंभिक अवस्थाएँ धीरे-धीरे अलग हो जाती हैं, जो अव्यवस्था को दर्शाता है।
notes: बैच में दो लोलक हैं जिनके $\theta_2$ में $\delta$ का अंतर है। उनका अंतर लगभग चरघातांकी रूप से बढ़ता है जब तक गतियाँ पूरी तरह असंबंधित न हो जाएँ, जबकि हर लोलक की ऊर्जा उच्च सटीकता से स्थिर रहती है (float64 + छोटे चरण वाला RK4)। छोटे दोलनों के लिए निकाय की दो प्रसामान्य विधाएँ होती हैं; समान द्रव्यमान और लंबाई पर $\omega^2 = (2 \mp \sqrt2)\,g/L$। छड़ें द्रव्यमानहीन हैं और धुरी घर्षणरहित।
meanings:
- लोलक $b$ के कोण $(\theta_1, \theta_2)$, नीचे की ऊर्ध्वाधर दिशा से
- कोणीय वेग
- विन्यास पर निर्भर द्रव्यमान आव्यूह, अविकर्ण पद $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 'व्यापकीकृत बल: अपकेंद्री युग्मन + गुरुत्व'
- पूरे बैच के लिए एक कॉल में $M\ddot q = f$ हल करें
- '$i$ और $j$ का योग: गतिज ऊर्जा का दोगुना'
labels:
  theta1: प्रारंभिक $\theta_1$
  theta2: प्रारंभिक $\theta_2$
  delta: $\theta_2$ में विक्षोभ $\delta$
  m1: ऊपरी द्रव्यमान $m_1$
  m2: निचला द्रव्यमान $m_2$
  L1: ऊपरी छड़ $L_1$
  L2: निचली छड़ $L_2$
  t_max: सिमुलेशन समय
