source_hash: b693da8b6e0e
title: 상대론적 하전 입자
summary: '공변 형태로 쓴 로렌츠 힘 $dU^\mu/d\tau = (q/m)\,F^\mu{}_\nu U^\nu$: 장 텐서의 두 번째 지표를 민코프스키 계량으로 내리고 einsum 하나로 4-속도와 축약합니다. 고유 시간으로 적분하면 빠른 입자가 뉴턴 역학의 예측보다 느리게 원운동하고, 일정한 전기장이 입자를 광속에 점점 가깝게 밀지만 결코 넘지는 못함을 볼 수 있습니다.'
notes: '$c = 1$인 단위계. 방정식을 각 입자의 고유 시간 $\tau$로 RK4 적분한 뒤, 애니메이션을 위해 실험실 시간 $t = X^0$으로 다시 표본화합니다. 사이클로트론: 자기력은 일을 하지 않으므로 $\gamma$는 일정하지만, 궤도는 뉴턴 역학의 원보다 $\gamma$배 크고 $\gamma$배 느립니다($\omega = qB/(\gamma m)$). 가속: 균일한 $E$에서 정지 상태로 출발하면 쌍곡선 운동 $x = (\sqrt{1 + (at)^2} - 1)/a$ ($a = qE/m$)을 하므로 $v \to 1$이며, 뉴턴의 $\tfrac12 at^2$라면 $t = 2/a$ 이후 빛을 앞지르게 됩니다.'
meanings:
- 입자 $p$의 4-위치 $(t, x, y, z)$와 4-속도 $\gamma(1, \mathbf v)$
- 민코프스키 계량 $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$
- $F^{0i} = -E_i$, $F^{ij} = -\varepsilon_{ijk}B_k$
- '반복된 $\alpha$ ⇒ 합: 두 번째 지표를 내림'
- '반복된 $\nu$ ⇒ 합: 모든 입자에 작용하는 4-힘'
- $U$의 민코프스키 길이, 1로 유지되어야 함
labels:
  config: 시나리오
  strength: 장의 세기($B$ 또는 $E$)
  v_max: 최대 초기 속력(사이클로트론)
  n_particles: 입자 수
  t_max: 실험실 시간
