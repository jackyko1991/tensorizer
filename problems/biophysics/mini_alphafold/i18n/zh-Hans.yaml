source_hash: 92d9eb39c4ac
title: 迷你 AlphaFold：从距离图到三维折叠
summary: 结构预测器两个部分的玩具版本，并非 AlphaFold 本身。预测的距离分布图（distogram，成对 Cα 距离及其分箱不确定度）可选择用一个自注意力模块清理，然后“结构模块”通过对多个起点批量的应力（stress）做梯度下降，以及经典多维尺度分析（MDS），找出与之吻合的三维坐标 $x_{ia}$。结果用 Kabsch SVD 与目标叠合，并用 RMSD 和类 TM 分数评分。
notes: 这只是精神上的 AlphaFold。真正的 AlphaFold 2 读取氨基酸序列以及相关蛋白的多序列比对（MSA），其中协同进化的位置暗示哪些残基彼此接触；其 Evoformer（48 个在 MSA 和残基对上做注意力、并带三角更新的模块）构建成对关系图；其结构模块则为每个残基放置完整的主链坐标系（不变点注意力）和侧链，并经过数次循环精修。它用蛋白质数据库（PDB）中约 170,000 个结构训练，并输出置信度（pLDDT）。这里的“网络”是假的：距离分布图是真实距离加上随距离增大的噪声（$\sigma_{ij} \propto d_{ij}$），而超出最后一个分箱的残基对只知道“很远”。注意力模块只在这一张图上训练几百步，因此是记忆而非预测；它展示了在残基对上做注意力的样子，而且由于其读出把每个残基放在 6 维空间中的一点，它无法拟合独立的噪声，因此会把噪声平滑掉。结构模块则是货真价实的距离几何。距离无法区分结构与其镜像：MDS 和梯度下降会返回任一对映体，因此用 Cα 赝二面角的符号选出正确的手性（由 L-氨基酸构成的右手 α 螺旋约为 $+50^\circ$），并打印两个 RMSD。由于有些起点会卡在两段螺旋手性相反的状态，因此同时折叠多个随机起点；应力最低者胜出。试着提高噪声直到折叠崩溃，或关闭精修。
meanings:
- 残基 $i$ 的 Cα 位置，坐标轴 $a$；目标是由螺旋几何构建的合成螺旋–转角–螺旋
- 残基 $i, j$ 落在距离分箱 $k$ 的概率（64 个分箱，2–22 Å）；代替训练好的网络
- 期望距离，对 $k$ 求和；方差的倒数给出置信权重 $w_{ij}$
- 注意力 logits：残基 $i$ 提问，残基 $j$ 回答；对 $e$ 求和
- 每个残基收集其他残基的加权混合，对 $j$ 求和；$b_{ij}$ 是来自 $\hat d_{ij}$ 的成对偏置
- $B$ 个起点批量的模型距离，对 $a$ 求和
- 加权失配，“远”的残基对只被推开，键固定在 3.8 Å；用 Adam 通过自动微分最小化
- 双中心化的平方距离 = Gram 矩阵 $x_{ia}x_{ja}$；其前 3 个特征向量给出初始猜测
- 两个中心化结构的协方差，对 $i$ 求和；其 SVD 给出最佳的真旋转
- 叠合后的误差；类 TM 分数 $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$，1 = 完全相同
labels:
  helix_length: 每段螺旋的残基数
  noise: 距离分布图噪声（10 Å 处的 σ）
  refine: 注意力精修
  starts: 随机起点数 $B$
  steps: 梯度步数
