source_hash: 27367fbd090e
title: 擴散張量成像：描繪神經纖維
summary: 水沿著軸突擴散得比橫越軸突更快，所以每個體素都有一個擴散張量 $D_{ij}$。Stejskal–Tanner 訊號 $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$ 是對體素與梯度方向的一次 einsum；對對數訊號做批次最小平方擬合即可還原 $D_{ij}$，其特徵分解給出平均擴散率、分數非等向性與纖維方向，再用 RK2 沿該方向前進就能描出神經束（纖維束追蹤）。
notes: 擴散率單位為 $10^{-3}\,\mathrm{mm^2/s}$，$b$ 的單位為 $\mathrm{s/mm^2}$：神經束中大約 $\lambda_\parallel = 1.7$、$\lambda_\perp = 0.3$（FA ≈ 0.8），自由水（CSF）為 3.0，灰質為 0.8。這些是供教學用的近似值，不可用於臨床。雜訊是萊斯（Rician）分布（複數訊號的幅值），因此有雜訊的擬合會高估等向區域的 FA。兩束纖維交叉處，單一張量只能表示兩者的平均——一個 FA 較低的扁平（盤狀）張量——進入其中的纖維束可能停止，或錯轉進另一束：這是 DTI 的經典限制，多纖維模型正是為此而生。每個橢圓顯示擬合張量在平面內的形狀。流線從種子點出發，以中點法（RK2）沿雙線性內插張量場的主特徵向量前進，直到 FA 低於 0.2。試試更多雜訊、更少梯度方向或更小的 $b$。
meanings:
- 分布在半球上的單位擴散梯度方向
- 每個體素的真實擴散張量：神經束為 $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$，CSF 與灰質為等向
- 重複的 $i, j$ ⇒ 求和：每個體素在每個方向的擴散加權訊號
- 各列為 $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$，使得 $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$
- 張量六個獨立分量的最小平方擬合，所有體素一次完成
- 特徵值與特徵向量；最大特徵值對應的特徵向量指向纖維方向
- 平均擴散率（跡/3）與分數非等向性（0 為等向，1 為單一方向）
labels:
  b: 擴散加權 $b$
  n_dirs: 梯度方向數
  noise: 雜訊水準 $\sigma/S_0$
  size: 每邊體素數
