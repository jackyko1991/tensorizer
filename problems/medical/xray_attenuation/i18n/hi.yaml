title: X-किरण क्षीणन और छवि कंट्रास्ट
summary: X-किरणें शरीर से गुज़रते हुए चरघातांकी रूप से क्षीण होती हैं, $I = I_0\,e^{-\int\mu\,dl}$। फेफड़े, कोमल ऊतक, हड्डी और आयोडीन कंट्रास्ट से बने छाती फ़ैंटम को एक einsum से किरण-दर-किरण प्रक्षेपित किया जाता है, जो दिखाता है कि कम ऊर्जा पर हड्डी क्यों उभरती है और वास्तविक ट्यूब स्पेक्ट्रम गहराई के साथ कैसे कठोर होता जाता है।
notes: 'लॉग समष्टि में प्रक्षेप योगात्मक है: $-\ln(I/I_0)$ पदार्थों पर $\mu\,L$ का योग है, इसलिए एकवर्णी छवि पदार्थ-लंबाइयों का एक रैखिक प्रतिचित्रण है। एक समांगी पट्टिका हर अर्ध-मान परत $\ln 2/\mu$ पर पुंज को आधा कर देती है। प्रकाश-विद्युत अवशोषण लगभग $Z^3/E^3$ की तरह बढ़ता है, इसलिए हड्डी का कंट्रास्ट 30–50 keV पर अधिक होता है और उच्च ऊर्जा पर फीका पड़ जाता है; आयोडीन का अवशोषण 33 keV पर उसके K-किनारे के ऊपर अचानक बढ़ता है, इसीलिए उसे कंट्रास्ट एजेंट के रूप में प्रयोग किया जाता है। वास्तविक ट्यूब एक स्पेक्ट्रम उत्सर्जित करती है: मृदु फ़ोटॉन पहले अवशोषित होते हैं, माध्य ऊर्जा बढ़ती है और प्रभावी $\mu$ गहराई के साथ घटता है (बीम हार्डनिंग)। सरलीकरण: सीधी समांतर किरणें, कोई प्रकीर्णन नहीं, कोई संसूचक अनुक्रिया नहीं, पूर्णांकित $\mu$ मानों वाली आठ सारणीबद्ध ऊर्जाएँ। सभी संख्याएँ अनुमानित हैं और केवल शिक्षा के लिए, नैदानिक उपयोग के लिए नहीं।'
meanings:
- 'वन-हॉट फ़ैंटम: जहाँ पिक्सेल $(y, x)$ पदार्थ $m$ है वहाँ 1'
- पिक्सेल पंक्ति $y$ के भीतर किरण की पथ-लंबाई
- 'दोहराया गया $y$ ⇒ योग: किरण $x$ द्वारा पार किए गए पदार्थ $m$ की लंबाई'
- ऊर्जा $E_e$ पर पदार्थ $m$ का रैखिक क्षीणन गुणांक (1/cm)
- 'दोहराया गया $m$ ⇒ योग: हर ऊर्जा और किरण के लिए रेखा-समाकल $\int \mu\, dl$'
- ट्यूब स्पेक्ट्रम (क्रेमर्स नियम, ऐलुमिनियम फ़िल्टर), $\sum_e S_e = 1$
- 'दोहराया गया $e$ ⇒ योग: बहुवर्णी पुंज का पारगमित अंश'
