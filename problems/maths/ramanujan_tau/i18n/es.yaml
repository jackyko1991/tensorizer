source_hash: 242e43034f00
title: La $\tau(n)$ de Ramanujan y la ley de Sato–Tate
summary: Desarrolla la forma modular discriminante $\Delta(q) = q\prod_n (1-q^n)^{24}$ como serie de potencias tensorial para obtener la $\tau(n)$ de Ramanujan, exactamente hasta $n \sim 10^5$–$10^6$ mediante residuos módulo un lote de primos. Comprueba que $\tau$ es multiplicativa y obedece la recurrencia de Hecke, que $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, que $|\tau(p)| \le 2p^{11/2}$ (teorema de Deligne, 1974), y observa cómo los valores normalizados $\tau(p)/2p^{11/2}$ rellenan el semicírculo de Sato–Tate (un teorema para $\Delta$ desde 2011). El programa comprueba estos teoremas numéricamente.
notes: 'Ramanujan (1916) estudió los coeficientes $\tau(n)$ de $\Delta(q) = q\prod(1-q^n)^{24}$, la única forma cuspidal normalizada de peso 12, y conjeturó tres cosas: $\tau$ es multiplicativa, satisface $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$, y $|\tau(p)| \le 2p^{11/2}$. Mordell demostró las dos primeras en 1917, un caso temprano de lo que llegaría a ser la teoría de Hecke. La cota es la conjetura de Ramanujan para $\Delta$ (Ramanujan–Petersson en general): Deligne la demostró en 1974 como consecuencia de su prueba de las conjeturas de Weil, así que es un teorema. Ramanujan también demostró la congruencia $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, que proviene de que $691$ divide al numerador del número de Bernoulli $B_{12}$. Escribiendo $\tau(p) = 2p^{11/2}\cos\theta_p$, la conjetura de Sato–Tate afirma que los ángulos $\theta_p$ siguen la distribución $\frac{2}{\pi}\sin^2\theta\,d\theta$, es decir, $x_p = \cos\theta_p$ sigue el semicírculo $\frac{2}{\pi}\sqrt{1-x^2}$,
  con momentos $1/4$, $1/8$, $5/64$ (números de Catalan divididos por potencias de 4). Para $\Delta$ la demostraron Barnet-Lamb, Geraghty, Harris y Taylor (2011). El histograma converge lentamente, como una muestra de extracciones independientes. La conjetura de Lehmer, según la cual $\tau(n)$ nunca es cero, sigue abierta; se ha verificado mucho más allá de este rango, y el programa tampoco encuentra ningún cero. Cálculo numérico: $\tau(n)$ crece como $n^{11/2}$, así que una FFT en float64 de toda la serie tiene un error absoluto de unas $10^{-16}$ veces el mayor coeficiente, lo que ahoga a $\tau(2) = -24$ (un test lo muestra). En su lugar, la serie se calcula exactamente módulo una decena de primos a la vez, una fila del tensor para cada uno, y se reconstruye con el teorema chino del resto. Curiosidad: Ramanujan se dio cuenta de que… («Ramanujan noticed that…») $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$; de que $1729 = 1^3 + 12^3 = 9^3 + 10^3$; y, solo en un sentido regularizado, de que
  $1 + 2 + 3 + \dots$ «$= -1/12$»: la serie diverge, y $-1/12$ es el valor $\zeta(-1)$ de la función zeta prolongada analíticamente.'
meanings:
- 'identidad de Jacobi $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$: solo $O(\sqrt N)$ coeficientes no nulos'
- '$j$ repetido ⇒ sumado: un producto de series truncadas como una matriz de Toeplitz por un vector, exacto en int64 para $N$ pequeño'
- tres elevaciones al cuadrado dan la potencia 24
- los mismos productos por FFT para $M$ módulos primos a la vez, redondeados a residuos exactos (cada $m^2 N \le 2^{42}$)
- teorema chino del resto con dígitos balanceados, para que los valores negativos salgan negativos
- todos los pares coprimos $1 < m < n$ con $mn \le 600$ a la vez
- cada par de divisores $(d, j)$ con $dj \le N$ suma $d^{11}$ a $n = dj$
- valores normalizados en los primos, en $[-1, 1]$ por el teorema de Deligne
labels:
  n_max: Primos y $\tau(n)$ hasta $N$
