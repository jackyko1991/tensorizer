source_hash: 28a44bb1dca2
title: '궁수자리 A*(Sgr A*)의 질량 재기: 별 S2의 궤도'
summary: '별 S2는 16년마다 우리은하 중심을 돌며, 보이지 않는 질량에 120 AU 이내로 접근합니다. 케플러 방정식을 벡터화된 뉴턴 반복으로 푸는 케플러 궤도를 25년간의 실제 위치 및 시선 속도 데이터에 피팅합니다. autograd 야코비안을 사용하는 레벤버그–마쿼트 방법을 64개의 무작위 시작점에서 동시에 실행하여, $R_0 \approx 8.3$ kpc 거리에 있는 약 $4.3\times 10^6\,M_\odot$의 블랙홀을 복원합니다. 이어서 피팅 결과는 나중에 GRAVITY가 검출한 두 가지 상대론적 효과를 예측합니다: 근점에서 약 200 km/s의 적색편이와 궤도당 $12''$의 세차입니다.'
notes: '1990년대 초부터 라인하르트 겐첼(MPE, ESO 망원경)과 앤드리아 게즈(UCLA, Keck)가 이끄는 두 연구팀이 은하 중심 1각초 안의 별들을 추적해 왔습니다. S2는 짧은 궤도를 가진 별 가운데 가장 밝습니다. 16년 주기의 타원 궤도는 블랙홀 외에는 아무것도 들어갈 수 없을 만큼 작은 부피 안에 갇힌 질량을 결정합니다. 위치는 궤도의 각크기와 주기를, 시선 속도(스펙트럼선의 도플러 이동)는 km 단위의 실제 크기를 알려 줍니다. 둘을 합치면 거리 $R_0$와, 케플러 제3법칙을 통해 질량을 얻습니다. 모델의 모수는 8개입니다: 궤도 요소 6개와 $M$, $R_0$(주기는 $P^2 = 4\pi^2(aR_0)^3/GM$에서 정해집니다). 피팅은 autograd로 구한 야코비안을 쓰는 레벤버그–마쿼트 방법으로, 여러 무작위 시작 궤도에서 동시에 실행합니다. 그중 상당수가 국소 최솟값에 빠지므로 시작점의 배치가 필요하며, 가장 좋은 $\chi^2$를 남깁니다. 케플러 방정식은 분리된(detached) 텐서에서 뉴턴 반복으로 푼 뒤 마지막으로 한 번 그래디언트가 흐르는 단계를 거치므로, autograd는 정확한 음함수 미분을 얻습니다. 기본값에서의 결과: $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ kpc, $P \approx 16.03$ 년, $e \approx 0.884$, 데이터 334개에 대해 $\chi^2 \approx 336$. 발표값: 별 17개로부터 $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$, $8.32 \pm 0.07 \pm 0.14$ kpc(Gillessen et al. 2017). 이어서 피팅은 모델에 포함되지 않은 두 가지 상대론적 효과를 예측합니다. 근점(120 AU, 7700 km/s, $c$의 2.6 %)에서는 중력 적색편이와 횡 도플러 이동이 합쳐 약 200 km/s를 더합니다. GRAVITY는
  2018년 5월 근점 통과 후 이 일반상대론 값의 $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$배를 측정했습니다(GRAVITY Collaboration 2018). 궤도는 또한 한 바퀴마다 $6\pi GM/(c^2a(1-e^2)) \approx 12''$만큼 세차하며, 일반상대론 값의 $f_{SP} = 1.10 \pm 0.19$배로 측정되었습니다(GRAVITY Collaboration 2020). 이것들은 인용한 검출 결과이며 이 데이터로 계산한 것이 아닙니다: 2016년 표는 2018년 근점 이전에 끝납니다. 단순화: 순수 케플러 궤도이며, 뢰머 지연(궤도를 가로지르는 빛의 이동 시간, 약 8일), 상대론적 항, 기준 좌표계의 표류는 모두 없습니다(논문은 좌표계 모수 5개를 추가로 피팅합니다). 데이터: Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), VizieR/CDS 카탈로그 J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030)의 S2 데이터 표 5, CDS 이용 조건에 따라 출처를 밝혀 사용. 수상: 2008년 쇼 상 천문학 부문(겐첼), 2012년 크라포르드상 천문학 부문(겐첼, 게즈), 2020년 노벨 물리학상(절반은 겐첼과 게즈에게, 우리 은하 중심의 초대질량 밀집 천체 발견 공로).'
meanings:
- '시작점마다 궤도 하나: $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- 뉴턴 반복으로 구한 이심 근점 이각, 모든 궤도와 관측 시점에 대해 한꺼번에
- 궤도면 → (북, 동, 시선 방향), einsum으로 구성
- '$j$에 대해 합산: AU 단위의 S2 위치; $R_0$로 나누면 하늘 위의 mas(밀리각초)'
- 'km/s 단위의 시선 속도: 바로 이것이 $R_0$를 결정합니다'
- RA 145개, Dec 145개, 속도 44개에 대한 (모델 − 데이터)/$\sigma$
- 순방향 모드 autograd, 8개 모수 방향에 대해 vmap 적용
- 모든 시작점에 대해 동시에 수행하는 레벤버그–마쿼트 한 단계
- '$6\pi GM/(c^2a(1-e^2))$: 슈바르츠실트 세차, S2의 경우 $\approx 12''$'
