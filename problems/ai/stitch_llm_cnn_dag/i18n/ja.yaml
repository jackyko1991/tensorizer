title: 別々に学習し、DAG テンソルでつなぐ：CNN と小さな LM
summary: 小さな CNN が MNIST の数字を、小さな文字レベル GPT が「three+two=five.」のような文を、それぞれ独立に学習します。次に 1 本の DAG エッジが両者を結びます。コネクタが CNN の特徴をソフトトークンに変換して最初の単語と置き換えるので、LM は「[3 の画像]+two=」に「five」と答えます。学習プロセス全体もそれ自体がテンソル DAG であり（レベルごとのルール、max-plus のクリティカルパス、シードをまとめてルールごとに 1 回のバッチ呼び出し）、同じ計算量（積和演算の回数）で同じネットワークを結合タスクだけでエンドツーエンドに学習した場合と比較します。つなぎのエッジは固定ルーターをもつ混合エキスパート（MoE）層としても書かれ、学習型ルーターがそれを担えるかも検証します。
notes: アイデア。ネットワークは別々に学習し、DAG テンソルで接続し、その後全体を最適化することができ、そのプロセス全体もまた DAG テンソルで制御できる。このアイデアは Jacky Ka Long Ko によるものである。本問題ではこれを小さな CNN と小さな文字レベル LM で検証し、あえてゼロから結合学習する視覚言語モデルとはせず、まさにその非 DAG の代替案と比較する。何が新しく、何が新しくないか。別々に事前学習された画像エンコーダ、事前学習済み LM、小さな学習可能コネクタからマルチモーダルモデルを構成するのは、LLaVA（Liu et al. 2023、LM のトークン空間への線形または MLP 射影）や BLIP-2（Li et al. 2023、凍結した画像エンコーダと凍結した LLM の間に Q-Former を置く）の作り方である。Frozen（Tsimpoukelli et al. 2021）は本問題と同様に、画像をソフトプレフィックスとして凍結した LM に入力する。またモデルスティッチング（Lenc and Vedaldi, CVPR 2015, arXiv 2014; Bansal et al. 2021）は、学習済みの 2 つのネットワークを小さな学習可能層でつなぐ。本問題が加えるのはオーケストレーションである。モデルグラフと学習プロセスの両方を Circle of Willis ワークフロー問題のテンソル DAG エンジン（ルールグラフ、Kronecker ジョブグラフ、ブール値のレベル、max-plus のクリティカルパス）で実行し、DAG で構築したモデルをモノリスと比較する。タスクとモデル。CNN（5×5 畳み込み 2 層、重み 8474 個）は 3000 枚の MNIST 画像から 10 個の数字を学習する。2 層の GPT（d = 32、4 ヘッド、重み 27 543 個、chain_of_thought 由来のモデル軸付き einsum アテンション）は、op を mod 10 の +、−、× とする 300 個の文「a op b = r.」を学習する。数字は英単語で書かれる（「three+two=five.」、最初の単語は 5 文字のスロットに右寄せ）。結合タスクでは a の MNIST テスト画像とテキスト「+two=」が与えられ、オペランドの単語はテキストに含まれない。DAG
  エッジはコネクタ（重み 3808 個）である。CNN の 10 個の数字確率 $q$ とスロットベクトル $S_t$ から $K = 5$ 個のソフトトークン $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$ を作り、LM 入力のオペランドスロットと置き換える。（代わりに CNN の最後から 2 番目の層の特徴を入力すると、試行では学習がはるかに遅かった。コネクタ 100 ステップ後の結合正解率は約 0.25 で、前者の約 0.6 に及ばない。）正解率は、正しいプレフィックスを与えたとき答えの文字とピリオドがすべて LM の第 1 候補となるテスト例の割合であり、これはまさに貪欲デコードが出力するものである。DAG としての学習プロセス。data/training.smk にルールが列挙されている。エンジンはこれを Circle of Willis のパーサで解析してレベルごとに実行し、各ルールは積み重ねたモデル軸（シード × 結合データセットサイズ $n$）上のモデル全体に対する「1 回」のバッチ呼び出しとなる。レベル 0 は train_cnn ∥ train_lm ∥ train_monolith、レベル 1 は train_connector（CNN と LM は凍結し、$I \otimes \mathbb 1$ ブロックでシードから (シード, $n$) へブロードキャスト）、レベル 2 は global_finetune（すべてのパラメータを、エッジを通してエンドツーエンドに、100 分の 1 の学習率で）∥ 2 つの学習型ルーター、レベル 3 は evaluate。2 シード・4 サイズでは、8 ルール、45 ジョブ、84 ジョブエッジで、$A$ は冪零である。テストでは、レベルが正しいこと、循環が拒否されること、1 つのスタックで学習した 2 つのシードがそれぞれ単独で学習した場合と同じ損失を与えること（Adam は要素ごと、クリッピングはモデルごと）、そしてあるモデルの損失が他のモデルに送る勾配がゼロであることを確認する。ベースライン。モノリスは同じ CNN + コネクタ + LM（重み 39 825 個）を乱数で初期化し、結合例のみでエンドツーエンドに学習したものである。その予算はモデルあたりの積和演算回数で揃えてある。DAG
  パイプラインの CNN 150、LM 600、コネクタ 150、ファインチューニング 80 ステップ（バッチ 32）は結合学習 682 ステップに相当し、モノリスにはそれだけのステップが与えられる（各事前学習はモデルごとに全量を計上する。ただし DAG では 1 つの事前学習済み CNN と LM が 4 つの $n$ の値すべてに使われる）。結果（2 シード、テスト画像 1000 枚、チャンスレベル 0.1、CPU）。マルチスレッドの浮動小数点リダクションにより実行を繰り返すと数ポイント異なるため、以下の数値は 4 回の完全な実行におけるシード平均の範囲である。同梱の実行の正確な数値は results/stages.csv にある。単独では CNN はテスト数字の 0.89 を読み取り、LM はテキストプロンプトの 0.97 から 0.99 を完成させる。CNN の数字をテキストとして書き LM に与えると 0.88 から 0.89 となり、これがこのパイプラインの上限である。結合例 $n$ = 100、300、1000、3000 に対する結合正解率は、未学習のコネクタ約 0.16、コネクタ段階後 0.41–0.47、0.58–0.63、0.60–0.69、0.64–0.68、全体ファインチューニング後 0.41–0.47、0.63–0.67、0.68–0.75、0.71–0.75、モノリス 0.14、0.13–0.15、0.16–0.17、0.23。DAG で構築したモデルはすべての実行のすべての $n$ で勝り、結合データが少ないほど差が大きく、ファインチューニングは $n$ = 300 以降で 0.03 から 0.08 上乗せする（$n$ = 100 では平均して変化なし）。理由は単純である。DAG は単一モダリティのデータ（ラベル付き数字 3000 個とすべての文）を再利用するのに対し、モノリスは $n$ 個の答えの単語だけから数字と算術を見つけ出さなければならず、しかも × はしばしばオペランドを隠してしまう（何 × 0 も 0）。ステップ数やデータを増やせばモノリスは改善するだろう（予算の終わりでも損失はまだ下がっている）。これは小予算での比較であり、法則ではない。DAG エッジ = MoE ディスパッチ。同じ入力層を混合エキスパートとして書く。エキスパート
  img（CNN + コネクタ）とエキスパート txt（LM のトークン埋め込み）、位置 × エキスパート上のルーター $G$ があり、各エキスパートは自分にディスパッチされた位置上でバッチ実行され、結合は $X^0 = G_{mntx}Y^x_{mntc}$ である。$G$ をデータ型（画像スロットか文字か。データを見る前から分かっており、ワークフローがワイルドカードでルールを選ぶのと同じ）による one-hot とすると、MoE の出力は DAG 配線の出力と 1e-6 の精度で一致し、すべての勾配も一致する（テスト済み）。正確な関係は次のとおり。DAG エッジとは、データ型で決まる固定ルーターをもつ MoE ディスパッチであり、MoE とは、エッジがトークンごとに学習型ルーターで選ばれる DAG である。ルーターはそのルーティングを学習できるか。エキスパートを凍結し、Switch の負荷分散損失（$\alpha$ = 0.01）を用いて、各位置の特徴（7×7 にプーリングした画像と one-hot id）に対する線形ルーターを学習した。Switch top-1（選ばれたエキスパートだけを実行し $p$ 倍する）は信頼できない。モデルと実行にわたり、ルーティング正解率は 0 から 0.92、タスク正解率は 0 から約 0.46 の範囲であった。選ばれなかったエキスパートには勾配が流れないため初期の誤った選択が決して修正されず、さらに分散損失は 50/50 の分割へ引っ張るが、真の分割は 5/17 だからである。密な混合（$G = p$、両方のエキスパートを全位置で実行）として学習し、その後 top-1 で使うと、ルーターはすべてのモデル・すべての実行でモダリティのルーティングを回復し（位置の 0.97 から 0.99）、タスク正解率は約 0.35 から 0.65 に達する。$p < 1$ が出力をスケールするため、固定ルーターよりわずかに低い。正しいエッジがデータ型から分かるなら、それを固定するのが正確でもあり安価でもある。時間。6 コアのデスクトップ CPU では、マシンが空いているときデフォルトの実行の学習は約 66 s で終わり（他の重いジョブと共有している場合は 2 から 4 分かかることもある）、さらに GIF の作成に約 15 s かかる。空いていたときの実行では、モノリスが
  35 s、LM が 12 s、コネクタが 4.5 s、ファインチューニングが 4 s であった。ルールごとに 1 ワーカーとすると、max-plus のクリティカルパスはモノリス、続いて evaluate（39 s）である。DAG システム自身のチェーン LM → コネクタ → ファインチューニング → evaluate は約 24 s かかる。torch が GPU を認識すればコードは GPU を使う。このプロジェクトの環境の torch は CPU ビルドなので、同梱の数値はすべて CPU によるものである。データ。MNIST（Y. LeCun, C. Cortes, C. J. C. Burges）、ライセンス CC BY-SA 3.0。訓練画像 3000 枚とテスト画像 1000 枚のバランスの取れたサブセットを同梱している（data/mnist_subset.npz、0.7 MB。出典、チェックサム、処理内容は data/SOURCES.md に記載）。文はコードで生成する。試してみよう。LM のステップ数を減らす（LM の正解率がすべての上限になる）、$\alpha$ を大きくする（Switch ルーターがさらに崩壊する）、ファインチューニングをなくす（0 ステップ）、あるいはシードを 1 つにして、シード間でどれだけ結果が異なるかを見る。
meanings:
- ルール $s$ はルール $r$ が書き出したものを読む。学習プロセスは data/training.smk を Circle of Willis 問題のパーサで解析したもの
- ワイルドカード seed と $n$ 上のジョブグラフ。$n$ をもたないルールはすべての $n$ にブロードキャストし（$I \otimes \mathbb 1$）、evaluate はすべてを集める（$\mathbb 1^\top$）
- 各ルールのレベル。train_cnn、train_lm、モノリスは 0、コネクタは 1、ファインチューニングとルーターは 2、evaluate は 3
- 計測したルール所要時間から求めた max-plus の終了時刻。$\max t$ がクリティカルパス
- 各画像に対する CNN の 10 個の数字確率。モデル軸 $m$ は層ごとに 1 回のグループ畳み込みのグループになる
- DAG エッジ：数字確率とスロットベクトル $S_t$ → 位置 $t$ の LM 入力ベクトル。$K = 5$ 個のソフトトークンが隠された最初の単語と置き換わる
- ルーター：データ型（画像スロットか文字か）による one-hot、または位置の特徴に対する学習型 Switch top-1 softmax
- 繰り返される $x$ ⇒ 和をとる：MoE 層の結合。各エキスパート $Y^x$ はディスパッチされたグループ上でのみ計算される
- 小さな GPT の次文字ロジット（chain_of_thought 由来のモデル軸付き einsum アテンション）
- プレフィックス以降のテキストに対するモデルごとの損失（nats）。$M$ 個の損失を合計すると、各モデルが自分自身の勾配を得る
labels:
  seeds: シード（独立な反復）
  steps_cnn: CNN 事前学習ステップ数
  steps_lm: LM 事前学習ステップ数
  steps_con: コネクタのステップ数（CNN と LM は凍結）
  steps_ft: 全体ファインチューニングのステップ数
  steps_router: 学習型ルーターのステップ数（ルーターごと）
  lr_ft: ファインチューニングの学習率
  alpha: 負荷分散の重み $\alpha$
