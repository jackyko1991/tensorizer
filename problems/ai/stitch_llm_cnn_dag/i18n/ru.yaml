source_hash: 9a93d668845a
title: 'Обучить по отдельности, сшить DAG-тензором: CNN и крошечная LM'
summary: 'Небольшая CNN учится распознавать цифры MNIST, а крошечная посимвольная GPT учит предложения вида "three+two=five.", каждая сама по себе. Затем их соединяет одно ребро DAG: коннектор превращает признаки CNN в мягкие токены, которые заменяют первое слово, так что LM отвечает на "[изображение тройки]+two=" словом "five". Весь процесс обучения сам является тензорным DAG (правила по уровням, критический путь в алгебре max-plus, один пакетный вызов на правило по всем сидам), и его сравнивают с той же сетью, обученной сквозным образом только на совместной задаче при том же объёме вычислений (умножений-сложений). Сшивающее ребро также записано как слой смеси экспертов (MoE) с фиксированным маршрутизатором, и проверяется обучаемый маршрутизатор.'
notes: 'Идея. Сети можно обучать по отдельности, затем соединять через DAG-тензор, затем оптимизировать глобально, и весь этот процесс сам может управляться DAG-тензором. Идея принадлежит Jacky Ka Long Ko; эта задача проверяет её на небольшой CNN и крошечной посимвольной LM, намеренно не как модель «зрение–язык», обучаемую совместно с нуля, и сравнивает её именно с этой не-DAG альтернативой. Что ново, а что нет. Построение мультимодальной модели из отдельно предобученного кодировщика изображений, предобученной LM и небольшого обучаемого коннектора — это то, как устроены LLaVA (Liu et al. 2023, линейная или MLP-проекция в пространство токенов LM) и BLIP-2 (Li et al. 2023, Q-Former между замороженным кодировщиком изображений и замороженной LLM); Frozen (Tsimpoukelli et al. 2021) подаёт изображение в замороженную LM как мягкий префикс, как и здесь; а сшивание моделей (Lenc и Vedaldi, CVPR 2015, arXiv 2014; Bansal et al. 2021) соединяет две обученные сети небольшим обучаемым слоем. Эта задача
  добавляет оркестровку: и граф модели, и процесс обучения выполняются тензорным DAG-движком из задачи о рабочем процессе для виллизиева круга (граф правил, кронекеровский граф заданий, булевы уровни, критический путь max-plus), и построенная через DAG модель сравнивается с монолитом. Задача и модели. CNN (две свёртки 5×5, 8474 веса) учит десять цифр по 3000 изображениям MNIST. Двухслойная GPT (d = 32, четыре головы, 27 543 веса, einsum-внимание с осью моделей из chain_of_thought) учит 300 предложений "a op b = r." с op из +, −, × по модулю 10, где цифры записаны словами ("three+two=five.", первое слово выровнено вправо в 5-буквенном слоте). Совместная задача даёт тестовое изображение MNIST цифры a и текст "+two="; слова-операнда в тексте нет. Ребро DAG — это коннектор (3808 весов): из десяти вероятностей цифр CNN $q$ и вектора слота $S_t$ он строит $K = 5$ мягких токенов $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$, которые заменяют слот операнда на входе LM. (Подача вместо этого предпоследних
  признаков CNN в пробах обучалась гораздо медленнее: около 0.25 совместной точности после 100 шагов коннектора против примерно 0.6.) Точность — это доля тестовых примеров, в которых все буквы ответа и точка являются наиболее вероятным выбором LM при истинном префиксе, что в точности совпадает с тем, что пишет жадное декодирование. Процесс обучения как DAG. В data/training.smk перечислены правила; движок разбирает его парсером из задачи о виллизиевом круге и выполняет уровень за уровнем, каждое правило — ОДНИМ пакетным вызовом по его моделям на сложенной оси моделей (сид × размер совместного набора $n$): уровень 0 train_cnn ∥ train_lm ∥ train_monolith; уровень 1 train_connector (CNN и LM заморожены, транслируются с сида на (сид, $n$) блоком $I \otimes \mathbb 1$); уровень 2 global_finetune (всё целиком, сквозь ребро, со скоростью обучения в 100 раз меньше) ∥ два обучаемых маршрутизатора; уровень 3 evaluate. При 2 сидах и 4 размерах: 8 правил, 45 заданий, 84 ребра заданий, $A$ нильпотентна.
  Тесты проверяют уровни, отказ от цикла, то, что два сида, обученные в одном стеке, дают те же потери, что и каждый, обученный отдельно (Adam поэлементен, отсечение градиента — по моделям), и что потеря одной модели посылает нулевой градиент остальным. Базовая линия. Монолит — это та же CNN + коннектор + LM (39 825 весов), случайно инициализированная и обученная сквозным образом только на совместных примерах. Её бюджет уравнен по числу умножений-сложений на модель: 150 шагов CNN, 600 шагов LM, 150 шагов коннектора и 80 шагов дообучения конвейера DAG (батч 32) стоят столько же, сколько 682 совместных шага, которые и получает монолит (каждое предобучение засчитывается полностью для каждой модели, хотя в DAG одна предобученная CNN и LM обслуживают все четыре значения $n$). Результаты (2 сида, 1000 тестовых изображений, случайный уровень 0.1, CPU). Многопоточные редукции чисел с плавающей точкой приводят к тому, что повторные прогоны различаются на несколько пунктов, поэтому ниже приведён диапазон
  среднего по сидам за четыре полных прогона; точные числа прилагаемого прогона — в results/stages.csv. По отдельности CNN читает 0.89 тестовых цифр, а LM завершает от 0.97 до 0.99 текстовых подсказок; если записать цифру CNN текстом и дать её LM, получается от 0.88 до 0.89 — потолок этого конвейера. Совместная точность для $n$ = 100, 300, 1000, 3000 совместных примеров: необученный коннектор около 0.16; после этапа коннектора 0.41–0.47, 0.58–0.63, 0.60–0.69, 0.64–0.68; после глобального дообучения 0.41–0.47, 0.63–0.67, 0.68–0.75, 0.71–0.75; монолит 0.14, 0.13–0.15, 0.16–0.17, 0.23. Построенная через DAG модель выигрывает при каждом $n$ в каждом прогоне, сильнее всего там, где совместных данных мало, а дообучение добавляет от 0.03 до 0.08 начиная с $n$ = 300 (при $n$ = 100 в среднем ничего не меняет). Причина проста: DAG повторно использует одномодальные данные (3000 размеченных цифр и все предложения), тогда как монолит должен открыть и цифры, и арифметику лишь по $n$ словам-ответам, а
  × часто скрывает операнд (что угодно × 0 = 0). При большем числе шагов или данных монолит улучшился бы (его потеря к концу бюджета ещё падает): это сравнение при малом бюджете, а не закон. Ребро DAG = диспетчеризация MoE. Тот же входной слой записан как смесь экспертов: эксперт img (CNN + коннектор) и эксперт txt (эмбеддинг токенов LM), маршрутизатор $G$ по позициям × экспертам, каждый эксперт выполняется пакетно на направленных ему позициях, и объединение $X^0 = G_{mntx}Y^x_{mntc}$. Если $G$ — one-hot по типу данных (слот изображения или буква, известный до того, как увидены какие-либо данные, подобно тому как рабочий процесс выбирает правило по шаблону), выход MoE совпадает с выходом DAG-соединения до 1e-6, как и все градиенты (проверено). Точное соотношение: ребро DAG — это диспетчеризация MoE с фиксированным маршрутизатором, определяемым типом данных; MoE — это DAG, рёбра которого выбираются для каждого токена обучаемым маршрутизатором. Может ли маршрутизатор выучить такую маршрутизацию?
  Линейный маршрутизатор на признаках каждой позиции (усреднённое изображение 7×7 и one-hot идентификатор) обучался при замороженных экспертах с балансирующей потерей Switch ($\alpha$ = 0.01). Switch top-1 (выполняется только выбранный эксперт, масштабированный на $p$) ненадёжен: его точность маршрутизации колебалась от 0 до 0.92 по моделям и прогонам, а точность на задаче — от 0 примерно до 0.46, потому что невыбранный эксперт не получает градиента, так что неверный ранний выбор никогда не исправляется, а балансирующая потеря тянет к разделению 50/50, тогда как истинное разделение — 5/17. Обученный как плотная смесь ($G = p$, оба эксперта везде) и затем используемый как top-1, маршрутизатор восстанавливает маршрутизацию по модальности во всех моделях и прогонах (0.97–0.99 позиций) и достигает точности на задаче примерно 0.35–0.65, немного ниже фиксированного маршрутизатора, потому что $p < 1$ масштабирует выходы. Когда правильное ребро известно из типа данных, его фиксация и точна, и дешевле.
  Время. На 6-ядерном настольном CPU прогон по умолчанию обучается примерно за 66 с, когда машина не загружена (до 2–4 минут, если она разделяется с другими тяжёлыми задачами), плюс около 15 с на GIF: в прогоне без нагрузки монолит занял 35 с, LM 12 с, коннектор 4.5 с и дообучение 4 с. При одном исполнителе на правило критический путь max-plus — это монолит, затем evaluate (39 с); собственная цепочка системы DAG LM → коннектор → дообучение → evaluate занимает около 24 с. Код выбирает GPU, если torch его видит; в окружении этого проекта стоит CPU-сборка torch, поэтому все прилагаемые числа получены на CPU. Данные. MNIST (Y. LeCun, C. Cortes, C. J. C. Burges), лицензия CC BY-SA 3.0: прилагается сбалансированное подмножество из 3000 обучающих и 1000 тестовых изображений (data/mnist_subset.npz, 0.7 MB; в data/SOURCES.md указаны источник, контрольные суммы и обработка). Предложения генерируются в коде. Попробуйте. Меньше шагов LM (точность LM ограничивает всё), больший $\alpha$ (маршрутизатор
  Switch схлопывается сильнее), без дообучения (0 шагов) или один сид, чтобы увидеть, насколько расходятся сиды.'
meanings:
- правило $s$ читает то, что пишет правило $r$; процесс обучения, разобранный из data/training.smk парсером задачи о виллизиевом круге
- 'граф заданий по шаблонам seed и $n$: правило без $n$ транслируется на каждое $n$ ($I \otimes \mathbb 1$), evaluate собирает всё ($\mathbb 1^\top$)'
- 'уровень каждого правила: train_cnn, train_lm и монолит на 0, коннектор на 1, дообучение и маршрутизатор на 2, evaluate на 3'
- времена завершения max-plus по измеренным длительностям правил; $\max t$ — критический путь
- десять вероятностей цифр CNN для каждого изображения; ось моделей $m$ становится группами одной групповой свёртки на слой
- 'ребро DAG: вероятности цифр плюс вектор слота $S_t$ → входной вектор LM в позиции $t$; $K = 5$ мягких токенов заменяют скрытое первое слово'
- 'маршрутизатор: one-hot по типу данных (слот изображения или буква) или обучаемый softmax Switch top-1 по признакам позиции'
- 'повторяющийся $x$ ⇒ суммирование: объединение слоя MoE; каждый эксперт $Y^x$ вычисляется только на направленной ему группе'
- логиты следующей буквы крошечной GPT (einsum-внимание с осью моделей, из chain_of_thought)
- потеря каждой модели на тексте после префикса (наты); сумма $M$ потерь даёт каждой модели её собственный градиент
labels:
  seeds: Сиды (независимые повторы)
  steps_cnn: Шаги предобучения CNN
  steps_lm: Шаги предобучения LM
  steps_con: Шаги коннектора (CNN и LM заморожены)
  steps_ft: Шаги глобального дообучения
  steps_router: Шаги обучаемого маршрутизатора (каждого)
  lr_ft: Скорость обучения при дообучении
  alpha: Вес балансировки нагрузки $\alpha$
