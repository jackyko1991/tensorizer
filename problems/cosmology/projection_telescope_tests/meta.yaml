title: 'Telescope tests of the projection: gravitational waves, black-hole shadows and supernovae'
category: cosmology
level: advanced
order: 18
tags: [series:projection-hypothesis:6, role:observation, speculative]
summary: >
  A speculative hypothesis, not established physics, confronted with open astronomical data. If gravity sees
  more than $3+1$ dimensions, gravitational waves weaken faster than $1/d$; if curved spacetime is the shadow of a
  folded projection, a fold outside the photon sphere would enlarge a black hole's shadow. GW170817 with its host
  galaxy's distance gives $D = 4.00^{+0.07}_{-0.25}$, the EHT shadows of M87* and Sgr A* allow a fold only within
  about $2.3$ Schwarzschild radii, and Pantheon+ supernovae cannot tell a leaking (DGP) universe from $\Lambda$CDM.
  Everything agrees with general relativity in $3+1$: any extra dimensions must be ones gravity does not feel at
  these scales.
animated: true
vector_form: 'h \propto d^{-(D-2)/2},\qquad d_{GW} = d_*\Big(\frac{d_{EM}}{d_*}\Big)^{\frac{D-2}{2}},\qquad d_{GW} = d_{EM}\Big[1 + \Big(\frac{d_{EM}}{R_c}\Big)^{\frac{n(D-4)}{2}}\Big]^{1/n},\qquad p(D) \propto \int \mathcal L\big(d_{GW}(d, D)\big)\,\mathcal N(d;\, d_{EM}, \sigma)\,dd,\qquad b_c = \min_r \frac{r}{\sqrt{f(r)}} = \sqrt{27}\,\frac{GM}{c^2},\qquad b_{edge} = \max\Big(b_c,\ \frac{r_f}{\sqrt{1 - r_s/r_f}}\Big),\qquad E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^{\alpha}'
index_form: '\mathcal L(x) = \frac{\sum_i w_i\,K_h(x - d_i)}{\sum_i w_i},\quad w_i = d_i^{-2},\qquad p_a = \frac{\sum_j \mathcal L\big(d_{GW}(d_j, D_a)\big)\,g_j\,\Delta d}{\sum_{a} (\cdots)\,\Delta D},\qquad \frac{d^2u_{fb}}{d\varphi^2} = -u_{fb} + \tfrac32\,u_{fb}^2,\qquad \delta = \frac{\theta_{sh}}{2\sqrt{27}\,\theta_g} - 1,\qquad \chi^2 = \sum_i w_i r_i^2 - \frac{(\sum_i w_i r_i)^2}{\sum_i w_i}'
