source_hash: f24d1ad2823c
title: 二維 Ising 模型
summary: 由 $\pm 1$ 自旋構成、傾向與鄰居同向排列的晶格。每個格點的鄰居和是一次以十字形核進行的 conv2d，棋盤式 Metropolis 更新則並行翻轉半個晶格。低於臨界溫度時磁區成長，直到磁體有序；高於臨界溫度時自旋保持無序。
notes: 單位：$J = k_B = 1$，因此 $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$。批次中並排運行三個晶格：所選的 $T$、$T_c$ 與 $T = 3.5$。全部從隨機自旋（無限高溫）開始並突然冷卻。同時更新所有格點是錯的——鄰居會根據過時的值翻轉——但棋盤上同一顏色的格點只與另一顏色相鄰，所以每一半都可以並行更新。驟冷到低 $T$ 時可能長時間卡在兩個條紋狀磁區中，這是週期性晶格上動力學的真實特徵。在有限晶格上，高於 $T_c$ 時 $\lvert m\rvert$ 並不恰為零，而在 $T_c$ 附近它劇烈起伏（臨界減慢）。$E/N$ 從 $-2$（完全有序）到 0。
meanings:
- 第 $i$ 列、第 $j$ 行的自旋 $\pm 1$——對應一批 $B$ 個溫度（1 是 conv2d 的通道）
- 選出四個最近鄰的卷積核
- 重複的 $k, l$ ⇒ 求和：鄰居和，週期性邊界
- 單獨翻轉每個自旋的能量代價
- 重複的 $i, j$ ⇒ 求和：鍵能的兩倍（每條鍵從兩端各算一次）
- 每個晶格一個溫度，沿格點廣播
labels:
  T: 溫度 $T$
  L: 晶格大小 $L$
  n_sweeps: 蒙地卡羅掃描次數
