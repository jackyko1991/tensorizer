source_hash: 71b446fca9cd
title: Почему цепочка рассуждений помогает трансформеру
summary: 'Чётность $n$ битов — это накапливаемый XOR, по своей природе последовательная задача. Одинаковые крошечные трансформеры (внимание на einsum, написанное вручную; все модели сложены вдоль одной оси моделей и обучаются за один запуск) учат её в двух форматах: ответ сразу, "$b_1 \dots b_n = p$", или сначала запись промежуточных чётностей, "$b_1 \dots b_n : s_1 \dots s_n = p$". При тех же весах и том же числе шагов модели с черновиком правильно отвечают на 98–100% тестовых строк при значениях от $n = 4$ до $10$, тогда как прямые модели подгоняют только $n = 4$, а дальше остаются на уровне случайного угадывания или ниже; внимание показывает двухтокенное правило $s_k = s_{k-1} \oplus b_k$. Это игрушечная модель механизма, а не того, как рассуждают большие языковые модели.'
notes: 'Статус: показанный эффект установлен. Чётность — хрестоматийный трудный случай для трансформера фиксированной глубины, который должен ответить сразу. Li, Liu, Zhou и Ma (ICLR 2024, arXiv 2402.12875) доказывают, что трансформеры постоянной глубины без промежуточных шагов ограничены неглубокими параллельными схемами (типа $\mathrm{TC}^0$, при их допущениях о точности), тогда как $T$ шагов цепочки рассуждений позволяют им моделировать последовательную схему размера $T$. Nye et al. (2021, arXiv 2112.00114) обучали трансформеры писать «черновик» (scratchpad) с промежуточными результатами и наблюдали, как те решают многошаговые задачи, такие как сложение длинных чисел и трассировка программ; Wei et al. (2022, arXiv 2201.11903) дали название chain-of-thought prompting (подсказки с цепочкой рассуждений) для больших языковых моделей. Метод: строка из $n$ битов записывается либо напрямую, "$b_1 \dots b_n = p$", либо вместе с промежуточными чётностями, "$b_1 \dots b_n : s_1 \dots s_n = p$".
  Каждая модель — один и тот же 2-слойный декодер с $d = 64$ и 4 головами (код `tiny_transformer`, в каждый einsum которого добавлена ось моделей $m$), обученный AdamW одинаковое число шагов на одном и том же батче строк; CoT-модели читают примерно вдвое больше токенов на строку и обучаются на своих промежуточных токенах — это и есть та дополнительная помощь, которую даёт черновик. Все модели ($n$ × формат × сид), а также модели для обобщения по длине обучаются за один запуск: их веса сложены вдоль первой оси, а обрезка градиента выполняется для каждой модели отдельно, так что они никогда не влияют друг на друга (это проверяет тест). Данные: при $n \ge 8$ четверть из $2^n$ строк (не более 1024) откладывается и никогда не используется в обучении; при $n = 4$ и $6$ строк слишком мало, чтобы что-то отложить, поэтому эти точности (отмечены звёздочкой на графике) измеряют подгонку, а не обобщение. При тестировании CoT-модель сама жадно пишет свой черновик, токен за токеном, и оценивается только
  её окончательный ответ. Вывод: в запуске по умолчанию (2 сида, числа выводятся в терминал) (a) CoT-модели правильно отвечают на долю от 0.98 до 1.00 тестовых строк при $n = 4, 6, 8, 10$; прямые модели подгоняют 16 строк при $n = 4$ (1.00), но получают 0.53, 0.27 и 0.53 при $n = 6, 8, 10$. Правдоподобное объяснение результата ниже случайного при $n = 8$ (здесь не проверялось): отложенная строка отличается от соседних обучающих строк одним битом и потому имеет противоположную чётность, а модель, интерполирующая между соседями, на ней ошибается. (b) Обобщение по длине не удаётся ни тем, ни другим: модели, обученные на $1 \le n \le 8$, получают от 0.46 до 0.51 при $n = 12$ и $16$, потому что позиции дальше 19 никогда не обучались и, при используемой здесь раскладке CoT, бит $b_k$ стоит на $n + 1$ позиций раньше ячейки, которой он нужен, а это смещение меняется с $n$; CoT-модели со смешанной длиной осваивают $n = 4$ (1.00), но даже не $n = 8$ (0.56) в пределах бюджета шагов. (c) Если стереть
  черновик после $k$ шагов, ответ падает до уровня случайного угадывания при любом $k < n$: ответ копируется из последней ячейки, так что всё вычисление находится в записанных токенах. (d) В CoT-модели при $n = 8$ на каждом шаге $k$ какая-то голова отдаёт от 0.5 до 0.8 внимания запроса, пишущего $s_k$, токену $b_k$, против 0.08 при равномерном внимании (одна голова в среднем по шагам даёт 0.48; головы делят шаги между собой). Другой вход правила, $s_{k-1}$, — это сам токен запроса, и он попадает на выход через остаточный поток, так что выученное правило локально: два токена на шаг. Оговорки: это игрушечная модель, показывающая механизм, а не то, как рассуждают большие языковые модели. Она ничего не говорит о том, соответствуют ли записанные шаги большой модели вычислению, которое на самом деле порождает её ответ; это открытый исследовательский вопрос. Результаты различаются между сидами и зависят от бюджета шагов, поэтому на графике показан каждый сид. Попробуйте больше шагов, $n$ до 16
  или один слой.'
meanings:
- 'промежуточная чётность каждого префикса: цели черновика, и $p = s_n$'
- строки в прямом или CoT-формате как идентификаторы токенов $0, 1, :, =, \_$; дополнены пустыми токенами, чтобы все модели с одним $n$ использовали один тензор
- эмбеддинг токена плюс обучаемый позиционный эмбеддинг, у каждой модели $m$ свои таблицы
- повторяющийся $c$ ⇒ суммирование; по индексу модели $m$ суммирования нет, поэтому $M$ независимых трансформеров работают в одном произведении
- 'каузальное внимание: каждая строка — распределение вероятностей по позициям $j \le i$'
- 'какие следующие токены обучаются: только $p$ (прямой формат) или $s_1 \dots s_n$, "=" и $p$ (CoT)'
- среднее $-\log p$ по обучаемым токенам модели $m$ (наты); минимизируется их сумма, и каждое слагаемое действует только на свои веса
- при тестировании модель сама пишет свой черновик, по одному токену за прямой проход, и затем отвечает
