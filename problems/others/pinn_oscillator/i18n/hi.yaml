source_hash: cf2636b6ae13
title: 'भौतिकी-सूचित न्यूरल नेटवर्क (PINN): अवमंदित दोलक'
summary: एक छोटा न्यूरल नेटवर्क $\hat x(t; w)$ अंतराल के पहले 40% में लिए गए केवल दस शोरयुक्त मापों से स्प्रिंग पर लगे अवमंदित द्रव्यमान की गति सीखता है। गति के समीकरण $m\ddot x + \mu\dot x + kx = 0$ को लॉस में जोड़ने और उसे कोलोकेशन बिंदुओं पर स्वचालित अवकलन से मापने पर नेटवर्क वहाँ भी एक्सट्रापोलेट कर पाता है जहाँ साधारण नेटवर्क विफल होता है, और व्युत्क्रम मोड में यह अज्ञात अवमंदन $\mu$ का भी अनुमान लगाता है।
notes: 'साधारण न्यूरल नेटवर्क एक लचीला वक्र-फ़िटर है: केवल मापों पर प्रशिक्षित होने पर यह उनसे होकर गुज़र सकता है, पर अंतिम डेटा बिंदु के आगे इसे कुछ नहीं बताता कि क्या करना है, इसलिए इसका अनुमान (डैश रेखा) भटक जाता है। भौतिकी-सूचित न्यूरल नेटवर्क (PINN) लॉस में दूसरा पद जोड़ता है: कोलोकेशन बिंदुओं $t_c$ पर अवशेष (residual) $r_c = m\hat x'''' + \mu\hat x'' + k\hat x$ का माध्य वर्ग, जो पूरे अंतराल को ढकते हैं, उन जगहों को भी जहाँ कोई डेटा नहीं है। अवकलज नेटवर्क के अपने इनपुट के सापेक्ष सटीक अवकलज हैं, जिन्हें torch.autograd.grad से create_graph=True के साथ निकाला जाता है ताकि लॉस उनके रास्ते भारों तक बैकप्रोपेगेट हो सके। $r_c \to 0$ की ओर धकेलने से $\hat x$ को हर जगह गति के समीकरण का हल होना पड़ता है; फिर डेटा और प्रारंभिक शर्तें $x(0) = 1$, $\dot x(0) = 0$ उनमें से मेल खाने वाला एकमात्र हल चुन लेती हैं, इसलिए नेटवर्क सही एक्सट्रापोलेट करता है। भौतिकी एक रेगुलराइज़र की तरह काम करती है जो गायब डेटा की कमी पूरी करती है। व्युत्क्रम समस्या में अवमंदन $\mu$ अज्ञात है: यह एक प्रशिक्षण-योग्य पैरामीटर
  बन जाता है और ऑप्टिमाइज़र वह मान ढूँढता है जिस पर डेटा और भौतिकी सहमत हों (देखिए कैसे यह पहले आगे निकल जाता है और फिर स्थिर होता है)। सटीक हल $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$ है, जहाँ $\delta = \mu/2m$ और $\omega = \sqrt{k/m - \delta^2}$। व्यावहारिक बातें: अवशेष त्रुटि का लगभग $k$ गुना होता है, इसलिए भार $\lambda \approx 10^{-4}$ इसे डेटा पद के साथ संतुलित करता है (बहुत बड़ा होने पर नेटवर्क तुच्छ हल $\hat x = 0$ पर अटक जाता है, जिसका अवशेष भी शून्य है); ऊँची आवृत्तियों (बड़े $k$) के लिए अधिक पुनरावृत्तियाँ चाहिए, क्योंकि नेटवर्क पहले निम्न आवृत्तियाँ सीखता है। यहाँ अग्र समस्या केवल विधि दिखाने के लिए हल की गई है: एक ODE सॉल्वर कहीं तेज़ होगा। PINN व्युत्क्रम समस्याओं, विरल और शोरयुक्त डेटा, और जटिल आकार के क्षेत्रों पर PDE के लिए लाभदायक हैं। सरलीकरण: स्थिर द्रव्यमान $m = 1$, स्थिर सीड, और कोसाइन से घटती लर्निंग रेट वाला Adam (L-BFGS परिष्करण नहीं)।'
meanings:
- 'इनपुट समयों का एक बैच: कोलोकेशन बिंदु, माप के समय और $t = 0$'
- 'परत $l$ के प्रशिक्षण-योग्य भार $w$: आकार $1 \to 32 \to 32 \to 32 \to 1$'
- दोहराया गया $j$ ⇒ पिछली परत के न्यूरॉनों पर योग
- छिपी सक्रियताएँ; एक चिकना सक्रियण फलन ताकि $\hat x$ के द्वितीय अवकलज हों
- $\dot{\hat x}$ देता है; उस पर दोबारा बुलाने से $\ddot{\hat x}$ मिलता है (नेटवर्क के सटीक अवकलज, परिमित अंतर नहीं)
- 'कोलोकेशन बिंदुओं पर ODE अवशेष: जहाँ $\hat x$ भौतिकी का पालन करता है वहाँ शून्य'
- डेटा से विचलन, $r_c^2$ का माध्य, और प्रारंभिक शर्त $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- 'व्युत्क्रम मोड: अवमंदन एक और प्रशिक्षण-योग्य पैरामीटर है, जिसे Adam भारों के साथ अद्यतन करता है'
labels:
  mode: 'मोड: $\mu$ सीखें (व्युत्क्रम) या ज्ञात (अग्र)'
  k: स्प्रिंग स्थिरांक $k$
  mu: वास्तविक अवमंदन $\mu$
  mu_guess: $\mu$ का प्रारंभिक अनुमान (व्युत्क्रम मोड)
  n_data: मापों की संख्या
  data_fraction: अंतराल का वह भाग जिसे माप ढकते हैं
  noise: माप का शोर
  n_colloc: कोलोकेशन बिंदु $t_c$
  log10_lambda: भौतिकी भार $\log_{10}\lambda$
  n_iter: प्रशिक्षण पुनरावृत्तियाँ
  lr: Adam लर्निंग रेट
  compare: भौतिकी के बिना एक नेटवर्क भी प्रशिक्षित करें
