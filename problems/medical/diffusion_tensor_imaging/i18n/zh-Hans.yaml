source_hash: 27367fbd090e
title: 扩散张量成像：描绘神经纤维
summary: 水沿轴突扩散得比横穿轴突更快，所以每个体素都有一个扩散张量 $D_{ij}$。Stejskal–Tanner 信号 $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$ 是对体素与梯度方向的一次 einsum；对对数信号做批量最小二乘拟合即可还原 $D_{ij}$，其特征分解给出平均扩散率、各向异性分数与纤维方向，再用 RK2 沿该方向前进就能描出神经束（纤维束追踪）。
notes: 扩散率单位为 $10^{-3}\,\mathrm{mm^2/s}$，$b$ 的单位为 $\mathrm{s/mm^2}$：神经束中大约 $\lambda_\parallel = 1.7$、$\lambda_\perp = 0.3$（FA ≈ 0.8），自由水（CSF）为 3.0，灰质为 0.8。这些是供教学用的近似值，不可用于临床。噪声服从莱斯（Rician）分布（复数信号的幅值），因此含噪拟合会高估各向同性区域的 FA。两束纤维交叉处，单个张量只能表示两者的平均——一个 FA 较低的扁平（盘状）张量——进入其中的纤维束可能停止，或错误地转进另一束：这是 DTI 的经典局限，多纤维模型正是为此而生。每个椭圆显示拟合张量在平面内的形状。流线从种子点出发，以中点法（RK2）沿双线性插值张量场的主特征向量前进，直到 FA 低于 0.2。试试更多噪声、更少梯度方向或更小的 $b$。
meanings:
- 分布在半球上的单位扩散梯度方向
- 每个体素的真实扩散张量：神经束为 $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$，CSF 与灰质为各向同性
- 重复的 $i, j$ ⇒ 求和：每个体素在每个方向上的扩散加权信号
- 各行为 $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$，使得 $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$
- 张量六个独立分量的最小二乘拟合，所有体素一次完成
- 特征值与特征向量；最大特征值对应的特征向量指向纤维方向
- 平均扩散率（迹/3）与各向异性分数（0 为各向同性，1 为单一方向）
labels:
  b: 扩散加权 $b$
  n_dirs: 梯度方向数
  noise: 噪声水平 $\sigma/S_0$
  size: 每边体素数
