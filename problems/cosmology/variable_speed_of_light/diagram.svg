<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Conformal diagram of the horizon problem: our past light cone reaches two opposite points of the last-scattering surface whose own past light cones do not overlap unless light was faster early on">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- big bang -->
    <line x1="10" y1="146" x2="230" y2="146" stroke="#374151" stroke-width="2"/>
    <!-- large early cones (VSL / inflation) -->
    <path d="M40,96 L-10,146 L90,146 z" fill="#93c5fd" fill-opacity="0.5"/>
    <path d="M200,96 L150,146 L250,146 z" fill="#93c5fd" fill-opacity="0.5"/>
    <!-- small standard cones -->
    <path d="M40,96 L28,108 L52,108 z" fill="#9ca3af"/>
    <path d="M200,96 L188,108 L212,108 z" fill="#9ca3af"/>
    <line x1="10" y1="108" x2="230" y2="108" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- last scattering surface and our past light cone -->
    <line x1="10" y1="96" x2="230" y2="96" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M40,96 L120,16 L200,96" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="40" cy="96" r="5" fill="#dc2626"/>
    <circle cx="200" cy="96" r="5" fill="#dc2626"/>
    <circle cx="120" cy="16" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="130" y="20" font-size="12">us</text>
    <text x="206" y="88" font-size="12" fill="#b91c1c">CMB</text>
    <text x="104" y="140" font-style="italic" fill="#1e40af">c ≫ c</text>
    <text x="146" y="144" font-size="10" fill="#1e40af">0</text>
    <text x="14" y="32" font-style="italic">η</text>
    <text x="212" y="32" font-style="italic">χ</text>
  </g>
</svg>
