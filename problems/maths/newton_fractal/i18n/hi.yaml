source_hash: aac1f92f727e
title: न्यूटन फ़्रैक्टल
summary: न्यूटन विधि $z \leftarrow z - p(z)/p'(z)$ सम्मिश्र समतल के हर पिक्सेल पर एक साथ, एक सम्मिश्र टेंसर के रूप में चलाई जाती है। हर पिक्सेल को उस मूल के अनुसार रंगने से जिस तक वह पहुँचता है, आकर्षण द्रोणियाँ (basins of attraction) बनती हैं, जिनकी सीमाएँ फ़्रैक्टल हैं, जबकि मूल के निकट त्रुटि हर चरण में वर्गित होती है।
notes: 'एक सरल मूल $r$ के परितः $p$ का प्रसार $e_{k+1} \approx \frac{p''''(r)}{2p''(r)}\,e_k^2$ देता है: सही अंकों की संख्या हर चरण में दोगुनी होती है, जिसे दायाँ पैनल लघुगणकीय पैमाने पर एक परवलय के रूप में दिखाता है ($z^3 - 1$ के लिए स्थिरांक ठीक 1 है)। मूलों से दूर न्यूटन विधि अव्यवस्थित (chaotic) है। एक क्रांतिक बिंदु के निकट, जहाँ $p''(z) = 0$, $z$ में छोटा-सा कदम अगली पुनरावृत्ति को समतल में कहीं भी भेज देता है, इसलिए पूरे चित्र की प्रतियाँ हर पैमाने पर दिखती हैं। तीन या अधिक मूलों वाले बहुपद की द्रोणियाँ एक ही सीमा साझा करती हैं, न्यूटन प्रतिचित्रण का जूलिया समुच्चय: एक द्रोणी का हर सीमा बिंदु सभी द्रोणियों का सीमा बिंदु है (Wada गुण)। टर्मिनल गिनता है कि कितने सीमा पिक्सेलों के $3\times3$ पड़ोस में हर रंग है, पूर्ण दृश्य में और ज़ूम करने के बाद। यह हिस्सा हर पैमाने पर लगभग समान रहता है। $z^3 - 2z + 2$ आज़माएँ, जहाँ 0 के पास के आरंभ बिंदु आकर्षक चक्र $0 \to 1 \to 0$ में गिरते हैं और कभी किसी मूल तक नहीं पहुँचते (धूसर क्षेत्र)। पूरा ग्रिड एक ही सम्मिश्र टेंसर है, इसलिए एक einsum हर
  पिक्सेल को अद्यतन करता है।'
meanings:
- 'प्रति पिक्सेल $p = (h, w)$ एक आरंभ बिंदु: $z = x_w + i\,y_h$'
- अचर पद से ऊपर की ओर बहुपद गुणांक, जैसे $z^3 - 1 \to (-1, 0, 0, 1)$
- हर पिक्सेल की घातें $1, z, z^2, \dots$, संचयी गुणनफल से बनी
- 'दोहराया गया $k$ ⇒ योग: हर पिक्सेल पर $p(z)$'
- '$p''(z)$ के गुणांक: अवकलन घातों को नीचे खिसकाता है'
- मूल, सहचर आव्यूह (companion matrix) के आइगेनमानों के रूप में
- हर पिक्सेल की हर मूल से दूरी; $j$ पर न्यूनतम द्रोणी लेबल देता है
- 'दोहरी परिशुद्धता में एक आरंभ बिंदु: अनुपात $|p''''(r)/2p''(r)|$ की ओर जाता है'
labels:
  polynomial: बहुपद $p(z)$
  pixels: प्रति भुजा पिक्सेल
  extent: दृश्य की अर्ध-चौड़ाई
  iterations: न्यूटन चरण
  zoom: ज़ूम गुणक
  tol: अभिसरण सहनसीमा $|z - r|$
