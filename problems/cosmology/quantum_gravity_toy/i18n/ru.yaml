source_hash: c4f16483f7b8
title: 'Квантовая космология: петлевой отскок'
summary: 'Игрушечная модель квантовой гравитации: петлевая квантовая космология (LQC) плоской Вселенной, заполненной безмассовым скалярным полем. Замена связности $b$ на голономию $\sin(\lambda b)/\lambda$ петли планковской площади превращает уравнение Фридмана в $H^2 = \frac{8\pi G}{3}\rho(1-\rho/\rho_c)$. Метод RK4 для пакета вселенных показывает, что Большой взрыв заменяется отскоком при $\rho = \rho_c \approx 0.41\,\rho_\mathrm{P}$, тогда как волновой пакет Уилера–ДеВитта (Wheeler–DeWitt) той же модели следует классическому коллапсу в сингулярность. Квантовая гравитация — открытая исследовательская проблема; это лишь один упрощённый подход.'
notes: 'Планковские единицы $G = \hbar = c = 1$; параметр Барберо–Иммирци $\gamma = 0.2375$. Какой подход: эффективные уравнения петлевой квантовой космологии с улучшенной ($\bar\mu$) динамикой (Ashtekar, Pawlowski и Singh 2006; Taveras 2008) для пространственно плоской Вселенной FRW с безмассовым скалярным полем, которое также служит часами. Статус: общепринятой теории квантовой гравитации не существует. LQC — квантование с редукцией по симметрии, вдохновлённое петлевой квантовой гравитацией; её связь с полной LQG не установлена, а эффективные уравнения — приближение, согласующееся с численной эволюцией резко локализованных квантовых состояний в этой модели. Ни одно наблюдение отскок не проверяло. Показанное точно для модели: связь сохраняется, эффективное уравнение Фридмана выполняется, плотность отскока $\rho_c$ одинакова для любого $p_\varphi$, а объём следует закону $V(t) = \sqrt{V_B^2 + 12\pi G p_\varphi^2 t^2}$. Вдали от $\rho_c$ (или при $\lambda \to 0$) возвращается классическая
  общая теория относительности: $H^2 = 8\pi G\rho/3$, и объём линейно падает до $V = 0$ за конечное время (красный пунктир: сингулярность). Серая полоса — точное решение Уилера–ДеВитта той же модели (квантованной без петель, $x = \ln V$): это свободный волновой пакет, скользящий вдоль классической линии сжатия к $V \to 0$, как обнаружили APS. Более светлые кривые соответствуют меньшим петлям ($\lambda/2$, $\lambda/4$): отскок происходит позже, при большей плотности. Кадры расположены плотнее вблизи отскока.'
meanings:
- объём, связность и скалярное поле каждой вселенной $b$ в пакете, на поверхности связи $C = 0$
- 'размер петли: $\lambda^2 = 4\sqrt3\pi\gamma\,\ell_P^2$ — щель площади в LQG; меньше $\lambda$ ⇒ больше $\rho_c$'
- уравнения Гамильтона для эффективной связи, для всех вселенных сразу
- траектория RK4 по собственному времени
- гамильтонова связь, должна оставаться $0$ (её дрейф в RK4 выводится в терминал)
- '$3/(8\pi G\gamma^2\lambda^2)$: плотность отскока'
- 'повторяющийся $k$ ⇒ суммирование: пакет Уилера–ДеВитта на сетке часов $\varphi_p$ и $x = \ln V$'
labels:
  p_phi: Импульс скалярного поля $p_\varphi$ ($\hbar$)
  gap_scale: Размер петли $\lambda$ относительно щели площади LQG
  log10_rho_start: Начальная плотность $\log_{10}(\rho/\rho_c)$
  dt: Шаг по времени RK4 $\Delta t$
  spread: Ширина пакета Уилера–ДеВитта $\Delta k/k_0$
