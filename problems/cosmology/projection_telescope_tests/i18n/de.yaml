source_hash: c17ad8b19789
title: 'Teleskoptests der Projektion: Gravitationswellen, Schatten Schwarzer Löcher und Supernovae'
summary: 'Eine spekulative Hypothese, keine etablierte Physik, konfrontiert mit offenen astronomischen Daten. Wenn die Gravitation mehr als $3+1$ Dimensionen sieht, werden Gravitationswellen schneller schwächer als $1/d$; wenn die gekrümmte Raumzeit der Schatten einer gefalteten Projektion ist, würde eine Faltung außerhalb der Photonensphäre den Schatten eines Schwarzen Lochs vergrößern. GW170817 mit der Entfernung seiner Wirtsgalaxie ergibt $D = 4.00^{+0.07}_{-0.25}$, die EHT-Schatten von M87* und Sgr A* erlauben eine Faltung nur innerhalb von etwa $2.3$ Schwarzschild-Radien, und die Pantheon+-Supernovae können ein leckendes (DGP-)Universum nicht von $\Lambda$CDM unterscheiden. Alles stimmt mit der allgemeinen Relativitätstheorie in $3+1$ überein: Etwaige zusätzliche Dimensionen müssen solche sein, die die Gravitation auf diesen Skalen nicht spürt.'
notes: 'Status: spekulativ. Dies ist die eigene Hypothese des Autors (siehe die Beschreibung der Reihe), keine etablierte Physik. Schritt 6 der Projektionshypothese, der Beobachtungsschritt. Schritt 1 (cosmology/projection_postulate) stellte die Postulate auf und fand, dass die Bornsche Regel nur in dem Fall überlebt, der von der Standard-Quantenmechanik nicht zu unterscheiden ist; die Schritte 2 bis 5 (projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test) arbeiten P3, P5, P4 und P1-P2 aus. Dieser Schritt passt die offenen Parameter von P4 (Geometrie als Projektion, die sich falten kann) und P5 (die Gravitation braucht ein gewisses $d_G$, angepasst, nicht angenommen) an offene Daten an und zeigt das Urteil, wie auch immer es ausfällt. Zuerst die bekannte Physik. In der allgemeinen Relativitätstheorie in $3+1$ Dimensionen fällt die Amplitude (Strain) einer Gravitationswelle wie $1/d$ ab; in $D$ Raumzeitdimensionen verteilt sich ihre Energie
  über eine $(D-2)$-Sphäre und $h\propto d^{-(D-2)/2}$. Ein Detektor, der $1/d$ annimmt, folgert $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$ ($d_* = 1$ Mpc, wie bei Pardo, Fishbach, Holz und Spergel 2018) oder, falls das Lecken erst jenseits einer Abschirmskala $R_c$ einsetzt, $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ (ihre abgeschirmte Form, sinnvoll für $D > 4$). Die Vorhersage der Hypothese: Wenn sich die Gravitation auf großen Entfernungen in zusätzliche Dimensionen ausbreitet, gilt $d_{GW} > d_{EM}$ und $D > 4$. Der Test (a): GW170817, eine Neutronensternverschmelzung mit einem optischen Gegenstück in NGC 4993. Daten: 8078 Posterior-Stichproben der GW-Leuchtkraftentfernung aus der GWTC-1-Veröffentlichung (data/gw170817_distance.csv; LIGO Scientific und Virgo Collaborations, Prior mit niedrigem Spin, Himmelsposition frei; GWOSC, Lizenz CC BY 4.0; Abbott et al. 2019, PRX 9, 031040). Der Prior der Analyse ist $\propto d^2$, daher wird jede Stichprobe mit $d^{-2}$ gewichtet, und eine
  Kerndichteschätzung liefert die Likelihood von $d_{GW}$ (der veröffentlichte Wert ist $40^{+8}_{-14}$ Mpc, Abbott et al. 2017). EM-Entfernungen (data/em_distances.csv, zitierte Werte): Flächenhelligkeitsfluktuationen $40.7\pm1.4\pm1.9$ Mpc (Cantiello et al. 2018, ApJL 854, L31, der Standardwert) und die von Pardo et al. verwendeten Hubble-Fluss-Entfernungen, $v_H = 3017\pm250$ km/s geteilt durch $H_0 = 73.24\pm1.74$ (SH0ES) oder $67.74\pm0.46$ km/s/Mpc (Planck). Ergebnis: $D = 4.00^{+0.07}_{-0.25}$ (68 %, SBF; die Autograd-Anpassung ergibt $4.00\pm0.11$), $3.98^{+0.09}_{-0.24}$ (SH0ES) und $3.94^{+0.08}_{-0.24}$ (Planck). Pardo et al. fanden $4.02^{+0.07}_{-0.10}$ (SH0ES) und $3.98^{+0.07}_{-0.09}$ (Planck); ihr unterer Fehler ist kleiner, weil sie die Himmelsposition auf die des Gegenstücks festlegten und den LVC-Posterior für $H_0$ verwendeten, während die hier beigefügten Stichproben eine freie Himmelsposition haben, sodass die Entfernungs-Inklinations-Entartung einen längeren Ausläufer
  zu kleinen Entfernungen hinterlässt. Für abgeschirmtes Lecken schließt $-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ ein $R_c$ unterhalb einiger hundert Mpc für $D = 5$, $n = 1$ aus und unterhalb von etwa 50-80 Mpc für $n = 2$ bis 5; allmähliche Übergänge ($n(D-4)/2$ klein) sind bis zum Rand des Gitters bei $10^4$ Mpc ausgeschlossen. Pardo et al. geben $R_c\gtrsim 20$ Mpc für jede Steilheit an, aus einem Posterior statt aus einem Likelihood-Verhältnis. Urteil (a): Die Gravitation verhält sich wie $D = 4.0$ auf etwa $\pm0.1$ genau bis 40 Mpc; alle zusätzlichen Dimensionen, die die Gravitation sieht, sind kompakt oder jenseits dieser Entfernungen abgeschirmt. Der Test (b): Schatten Schwarzer Löcher. In Schwarzschild liegt die Photonensphäre bei $r = 3GM/c^2$ und der Schattenradius ist $b_c = \sqrt{27}\,GM/c^2$; hier wird er sowohl als $\min_r r/\sqrt{f}$ als auch durch Raytracing von $u'''' = -u + \tfrac32 u^2$ für eine Reihe von Stoßparametern berechnet. Der Spin verkleinert den flächenäquivalenten
  Radius des Schattens um höchstens 7 % (Bardeens Kurve; $2(1+\sqrt2)\,GM/c^2$ für ein extremales Loch, vom Pol aus gesehen). Die Faltung, eine hier präzisierte Modellierungsentscheidung des Autors: P4 besagt, dass eine Singularität dort ist, wo sich die Projektion faltet; angenommen, die projizierte Geometrie ist Schwarzschild bis hinunter zu einer Faltung beim Radius $r_f$, und Licht, das die Faltung erreicht, kehrt nie zurück. Eine Faltung innerhalb der Photonensphäre ($r_f\leq 1.5\,r_s$) lässt den Schatten unverändert; eine außerhalb macht den Strahl, der sie streift, zum Schattenrand, $b = r_f/\sqrt{1 - r_s/r_f}$, also $\delta = b/b_c - 1 > 0$. Daten (data/eht_shadows.csv, zitierte Werte): M87*-Ring $42\pm3$ $\mu$as und $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as (EHT 2019, Paper I und VI), gegenüber $3.64\pm0.22$ $\mu$as aus der Sterndynamik (Gebhardt et al. 2011, $6.6\pm0.4\times10^9\,M_\odot$ bei 17.9 Mpc), also $\delta = +0.04\pm0.13$ (hier berechnet, kein veröffentlichter Wert); Sgr A*-Ring
  $51.8\pm2.3$ $\mu$as (EHT 2022, Paper I) und $\delta = -0.04^{+0.09}_{-0.10}$ (Keck-Prior) und $-0.08\pm0.09$ (VLTI-Prior) aus Paper VI, Tabelle 2. Nimmt man $\delta + 2\sigma$ und lässt den Spin bis zu 7 % verbergen, kann eine Faltung den Schatten um höchstens 0.37 (M87*), 0.21 (Keck) und 0.17 (VLTI) vergrößern, also $r_f\leq 2.86$, $2.40$ und $2.28\,r_s$. Urteil (b): Die Schatten passen zu Schwarzschild/Kerr; eine Faltung außerhalb von etwa $2.3\,r_s$ ist ausgeschlossen, aber eine Faltung innerhalb der Photonensphäre, wo P4 sie natürlicherweise ansiedeln würde (am Horizont oder an der zentralen Singularität), ist auf Schattenbildern unsichtbar. Der Test (c, optional): Supernovae. In einer DGP-Branwelt leckt die Gravitation jenseits von $r_c$ in eine fünfte Dimension, und die Expansion gehorcht $H^2 - H/r_c\propto\rho$; der Index $\alpha$ von Dvali und Turner interpoliert ($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$ ist $\Lambda$CDM, $\alpha = 1$ DGP). Daten: die Pantheon+-Tabelle
  von cosmology/cosmological_constant_fit, kopiert nach data/pantheon_plus.csv (1466 Supernovae, $z > 0.01$, diagonale Fehler; Scolnic et al. 2022, Brout et al. 2022; die Pantheon+-Datendateien tragen keine angegebene Lizenz, die Artikel stehen unter CC BY 4.0). Ergebnis (gleichverteilte Priors, $-1\leq\alpha\leq 1.8$): $\alpha = 0.44\pm0.71$; $\chi^2 = 639.5$ für $\Lambda$CDM und $638.9$ für DGP (beide deutlich unter der Anzahl der Supernovae, weil die diagonalen Fehler die Diagonale der Kovarianz enthalten). Urteil (c): Supernovae allein können ein leckendes Universum nicht von $\Lambda$CDM unterscheiden; erst die Kombination mit dem CMB und den baryonischen akustischen Oszillationen schließt den selbstbeschleunigenden DGP-Zweig aus (z. B. Fang et al. 2008, Phys. Rev. D 78, 103509), der hier nicht neu angepasst wird. Gesamturteil für P4 und P5: Jeder Test ist mit der allgemeinen Relativitätstheorie in $3+1$ Dimensionen vereinbar. Die Hypothese überlebt nur, wenn die Dimensionen jenseits
  von $3+1$ solche sind, die die Gravitation auf diesen Skalen nicht spürt (kompakt, abgeschirmt oder nur im Quantensektor der Schritte 1 und 5 vorhanden), und wenn jede Faltung innerhalb der Photonensphäre liegt. Das ist eine Einschränkung, keine Bestätigung: Bisher hat die Reihe keine Vorhersage gefunden, die von der Standardphysik abweicht und mit den Daten übereinstimmt.'
meanings:
- 8078 Entfernungsstichproben von GW170817 (GWTC-1); $w_i = d_i^{-2}$ hebt den im Volumen gleichverteilten Prior heraus
- 'wiederholtes $i$ (Stichproben) ⇒ summiert: Kerndichte von $d_{GW}$, eine normierte Likelihood'
- Entfernung, die ein Detektor folgert, wenn sich die Gravitation in $D_a$ Dimensionen ausbreitet, für jede EM-Entfernung $d_j$
- Posterior von $D$, die EM-Entfernung marginalisiert ($j$ summiert, Trapezregel)
- 'Autograd-Anpassung: Newton-Schritte auf $\log p(D)$, Fehler aus der zweiten Ableitung (Laplace)'
- Photonenbahnen $u = r_s/r$ für $B$ Stoßparameter und $F$ Faltungsradien gleichzeitig (RK4 in $\varphi$)
- relatives Schattenwachstum durch eine Faltung bei $r_f$ (null innerhalb der Photonensphäre)
- Kerr-Schattenverkleinerung (Bardeen-Kurve, flächenäquivalenter Radius) für Spins $a$ und Inklinationen
- Supernova-$\chi^2$ für jeden Leckindex $\alpha_a$ und $\Omega_{m}$, der Offset ($H_0$, $M$) entfernt; $i$ summiert
labels:
  em_distance: Elektromagnetische Entfernung zu NGC 4993, die für das Urteil verwendet wird
  D_screen: Dimension $D$ jenseits der Abschirmskala (abgeschirmtes Lecken)
  n_screen: Steilheit $n$ des Abschirmübergangs
  inc_max_sgra: Größte Inklination von Sgr A* für das Spinband
