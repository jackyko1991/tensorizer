source_hash: 786f22a93dbf
title: 光電效應與光量子
summary: 愛因斯坦 1905 年的光量子論文：頻率為 $\nu$ 的光以能量 $h\nu$ 的能量包到達，一個能量包釋放一個電子，其動能為 $K = h\nu - \phi - \varepsilon$。一批「光子 × 頻率 × 強度」顯示出閾值 $\nu_0 = \phi/h$、與強度無關的截止電壓 $eV_s = h\nu - \phi$，以及毫無時間延遲——全都與古典波動圖像相違。以直線擬合 Millikan 1916 年的鈉測量數據，便重新得到普朗克常數。
notes: 這是愛因斯坦 1905 年四篇「奇蹟年」論文之一：光量子與光電效應（本題；1921 年諾貝爾獎，「特別是因為他發現了光電效應定律」）、布朗運動（熱力學：隨機漫步與擴散），以及含 $E = mc^2$ 的狹義相對論（天文：愛因斯坦 1905：運動物體與 $E = mc^2$）。波動圖像在三方面失敗：它預言任何頻率都會發射電子、動能隨強度增加，以及弱光需延遲數分鐘（一個原子從 $S = 10$ mW/m² 收集 $\phi$）——而實驗顯示有明確的閾值、$V_s$ 與強度無關，且沒有可測得的延遲（低於 3 ns，Lawrence 與 Beams 1928）。更亮的光只代表更多光子，所以電流增加，但 $V_s$ 不變。紅色方塊是 Millikan 1916 年對真空中切出的鈉表面所量得的截止電壓（R. A. Millikan, Phys. Rev. 7, 355 (1916)，四條汞譜線，依羅斯基勒大學一份習題集中所列的論文數值謄錄於 data/millikan_1916_sodium.csv；1916 年出版，屬公有領域）。Millikan 原本想推翻愛因斯坦的方程式，結果卻證實了它；他的斜率給出的 $h$ 與今日精確值 $6.62607015\times10^{-34}$ J s 相差約 0.3 % 以內。截距約 1.8 eV，並非潔淨鈉的功函數（2.3 eV）：它包含儀器的接觸電位，而且表面很可能受到污染（D. Lloyd, Am. J. Phys. 2015）。模擬的金屬是理想化的（深度均勻分布的平坦能帶，不考慮角度與溫度）：直線 $eV_s = h\nu - \phi$ 是精確的，電流曲線的形狀只是示意。
meanings:
- 光的頻率，單位 $10^{14}$ Hz
- 吸收光子 $n$ 的電子所在深度，在 $[0, 3]$ eV 上均勻分布（$i$：強度）
- 一次廣播：所有頻率與強度的每個光子同時計算；$K \le 0$ ⇒ 不發射
- 能爬過減速電壓 $V$ 的電子：光電流
- 截止電壓：最快的電子；對每個強度 $i$ 都相同
- 通過 Millikan 數據點的直線：斜率 $a = h/e$，截距 $b = -\phi/e$
- 波動圖像：在輻照度 $S$ 下，以一個原子的面積 $A$ 吸收足夠 $\phi$ 所需的時間
labels:
  phi: 功函數 $\phi$
  irradiance: 輻照度 $S$（用於波動圖像的延遲）
  n_photons: 強度為 1 時每次曝光的光子數
