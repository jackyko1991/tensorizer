source_hash: d9c269ec5e13
title: 'Уравнение Шрёдингера: шаги по времени методом Кранка–Николсон'
summary: Нестационарное уравнение Шрёдингера $i\,\partial_t\psi = H\psi$ интегрируется на сетке неявной схемой Кранка–Николсон $(I + \tfrac{i\Delta t}{2}H)\,\psi^{n+1} = (I - \tfrac{i\Delta t}{2}H)\,\psi^n$. Левая матрица один раз раскладывается в LU, и каждый шаг — это дешёвый torch.linalg.lu_solve сразу для трёх волновых пакетов (столбцы $\psi_{xb}$). Шаг точно унитарен, поэтому норма остаётся равной 1, а явный метод Эйлера с тем же $\Delta t$ взрывается.
notes: 'Единицы $\hbar = m = 1$. Почему это работает: $U = (I + \tfrac{i\Delta t}{2}H)^{-1}(I - \tfrac{i\Delta t}{2}H)$ — преобразование Кэли эрмитовой матрицы $H$. На собственном векторе с энергией $E$ оно умножает на $(1 - iE\Delta t/2)/(1 + iE\Delta t/2)$ — число с модулем ровно 1, поэтому $U$ унитарна при любом $\Delta t$: ни роста, ни затухания, а поскольку $U$ — функция от $H$, сохраняется и $\langle H\rangle$. Её фаза $2\arctan(E\Delta t/2)$ совпадает с точной $E\Delta t$ с точностью до $\mathcal O(E^3\Delta t^3)$ за шаг, так что схема второго порядка, а будучи неявной, она устойчива при любом $\Delta t$ (большие шаги лишь менее точны, но никогда не неустойчивы). Явный метод Эйлера, напротив, умножает на $1 - iE\Delta t$ с модулем $\sqrt{1 + E^2\Delta t^2} > 1$; жёсткие сеточные моды с $E \sim 2/dx^2$ взрываются за несколько десятков шагов (красная кривая). У трёх пакетов разные амплитуды; более жёсткая пружина $g\,x^4$ заставляет большой пакет колебаться быстрее, а поскольку его
  уровни энергии уже не эквидистантны, он дефазируется — расплывается и теряет форму, — тогда как малый пакет почти не чувствует ангармонизма. Попробуйте $g = 0$: все три колеблются вместе с периодом $2\pi$ и никогда не расплываются (когерентные состояния). Сравните с методом split-step FFT в задаче Квантовое туннелирование — другой унитарной схемой второго порядка.'
meanings:
- 'ангармоническая яма $\tfrac12x^2 + g\,x^4$: период колебаний зависит от амплитуды'
- кинетическая часть $-\tfrac12\,D2$ плюс $V$ на диагонали; стенки на краях ящика
- по одному гауссову пакету на столбец $b$, отпущенному из покоя в $x_{0,b}$
- $I \pm \tfrac{i\Delta t}{2}H$, строятся один раз перед циклом
- разложить один раз ($\mathcal O(N^3)$); затем каждый шаг стоит лишь $\mathcal O(N^2)$
- 'повторяющийся $y$ ⇒ суммирование: правая часть, затем два треугольных решения для всех столбцов'
- 'явный метод Эйлера для сравнения: каждая собственная компонента растёт в $\sqrt{1 + E^2\Delta t^2}$ раз за шаг'
- 'повторяющиеся $x, y$ ⇒ суммирование: энергия каждого пакета, сохраняется точно'
labels:
  g: Сила квартичного члена $g$
  x0: Наибольшее начальное положение $x_0$
  t_max: Время моделирования
  dt: Шаг по времени $\Delta t$
  n_grid: Точек сетки
