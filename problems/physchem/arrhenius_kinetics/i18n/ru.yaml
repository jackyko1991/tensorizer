source_hash: 65c4646e64b8
title: Кинетические уравнения и график Аррениуса
summary: Насколько быстро идёт реакция и насколько быстрее, когда теплее? Кинетические уравнения нулевого, первого и второго порядка интегрируются сразу для шести температур в одном тензоре $(O, T)$, с $k(T) = A\,e^{-E_a/RT}$. Затем зашумлённый синтетический эксперимент раскрывает свой порядок (какой из графиков $[A]$, $\ln[A]$ или $1/[A]$ прямой?) и энергию активации (прямая методом наименьших квадратов через $\ln k$ в зависимости от $1/T$).
notes: 'У каждого кинетического уравнения есть интегральная форма, которая становится прямой в правильной переменной: $[A] = [A]_0 - kt$ (нулевой порядок), $\ln[A] = \ln[A]_0 - kt$ (первый) и $1/[A] = 1/[A]_0 + kt$ (второй). Поэтому химик строит все три графика и оставляет самый прямой ($R^2$ ближе всего к 1); его наклон равен $\mp k$. Второй тест использует периоды полупревращения: поскольку $t_{1/2} \propto [A]_0^{1-n}$, время от $[A]_0/2$ до $[A]_0/4$ в $2^{n-1}$ раз больше первого периода полупревращения (короче, равно или вдвое дольше), что даёт $n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$. Повторение опыта при нескольких температурах даёт $k(T)$, а график Аррениуса $\ln k$ от $1/T$ — прямая с наклоном $-E_a/R$. При $E_a = 75$ kJ/mol нагрев с 290 K до 300 K ускоряет реакцию примерно в 2.8 раза; старое эмпирическое правило «вдвое быстрее на каждые 10 K» соответствует $E_a \approx 50$ kJ/mol около комнатной температуры. Каждый опыт отслеживается до превращения 90 % A, поэтому холодные
  опыты длятся гораздо дольше горячих (см. легенду); левый график использует долю времени каждого опыта, чтобы все шесть поместились на одной оси, что не меняет того, какой график прямой. Данные синтетические (выдуманная реакция, гауссов шум с фиксированным зерном). Взятие $\ln$ или $1/x$ усиливает шум поздних, разбавленных точек ($\sigma/[A]$ и $\sigma/[A]^2$), поэтому каждая точка взвешивается с весом $(dg/d[A])^{-2}$, т. е. $1$, $[A]^2$ или $[A]^4$, а точки ниже 2 % от $[A]_0$ отбрасываются. Попробуйте больший шум, чтобы увидеть, как тест по $R^2$ становится менее решающим, или более узкий диапазон температур, чтобы увидеть, как растёт ошибка $E_a$.'
meanings:
- шесть температур между $T_{min}$ и $T_{max}$ (K)
- порядки реакции $0, 1, 2$, интегрируемые бок о бок
- константа скорости Аррениуса, в $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$
- скорость каждого опыта; индекс не суммируется, $k_t$ транслируется (broadcast) на все порядки
- каждый опыт отслеживается до 90 % превращения, по своим часам $t = \tau\,t_{end}$
- траектория RK4, сверяемая в тестах с точными интегральными законами
- три графика от $t$; прямую даёт только правильный порядок
- матрица плана для подгонки прямой
- матрица нормальных уравнений; суммирование по $s$ (выборкам); веса $w_s = (dg/d[A])^{-2}$, а $w_s = 0$ отбрасывает точки ниже 2 % от $[A]_0$
- свободный член и наклон, для всех графиков и температур сразу
- 'прямая Аррениуса: наклон $-E_a/R$, свободный член $\ln A$'
labels:
  Ea: Энергия активации $E_a$
  log10_A: Предэкспоненциальный множитель $\log_{10} A$
  order: Порядок измеряемой реакции
  T_min: Наименьшая температура $T_{min}$
  T_max: Наибольшая температура $T_{max}$
  noise: Шум измерений $\sigma$
