source_hash: c92568d7c613
title: '해밀턴 역학: 위상 공간과 심플렉틱 적분'
summary: 진자의 해밀토니안 $H(q, p)$를 한 번만 적으면 torch.autograd가 해밀턴 방정식 $\dot z_a = J_{ab}\,\partial H/\partial z_b$를 내놓습니다. 부채꼴로 펼쳐진 궤도 전체와 리우빌 덩어리(blob)가 하나의 텐서로 함께 움직이며, 심플렉틱 leapfrog를 여러 주기에 걸쳐 명시적 오일러법 및 RK4와 겨루게 합니다.
notes: 분리선(separatrix) $H = mgL$, 즉 $p = \pm 2mL\sqrt{gL}\cos(q/2)$는 칭동(닫힌 고리)과 회전(오른쪽으로 나갔다가 왼쪽으로 다시 들어오는 물결선)을 나눕니다. 그 근처에서는 주기가 한없이 길어지므로 덩어리의 안쪽 가장자리가 바깥쪽 가장자리를 앞지릅니다. 덩어리는 가는 나선으로 늘어나지만 넓이는 그대로입니다(리우빌 정리). leapfrog는 2차 정확도에 불과하지만, 근처의 '그림자' 해밀토니안을 정확히 보존하기 때문에 에너지 오차가 영원히 유계로 남습니다. RK4는 한 단계당 훨씬 정확하지만 오차가 꾸준히 커지고, 명시적 오일러법은 한 단계마다 위상 공간 넓이를 약 $1 + \omega^2\Delta t^2$배로 늘리므로 에너지가 폭발합니다. 더 큰 $\Delta t$를 쓰거나, 덩어리가 강체처럼 회전하기만 하는 조화 진동계를 시도해 보세요.
meanings:
- '위상 공간 점 $b$: 각 $q$와 각운동량 $p$. 모든 궤도 점과 덩어리 점이 각각 한 행'
- 해밀토니안. 손으로 입력하는 유일한 물리
- 합의 기울기를 구하면 서로 독립인 각 점이 자기 기울기를 얻음
- '심플렉틱 행렬 $[[0, I], [-I, 0]]$: 기울기를 90° 돌림'
- '반복된 $c$ ⇒ 합: 모든 점에 대한 해밀턴 방정식을 한꺼번에'
- '킥–드리프트–킥(슈퇴르머–베를레): 각 부분 단계가 층밀림(shear)이므로 넓이가 정확히 보존됨'
- '비교용 명시적 오일러법: 매 단계 위상 공간을 늘림'
- 덩어리 다각형의 넓이. 리우빌 정리에 따르면 일정하게 유지됨
labels:
  system: 계
  m: 질량 $m$
  length: 길이 $L$
  amplitude: 시험 궤도 진폭 $q_0$
  n_orbits: 위상 초상의 궤도 수
  dt: 시간 간격 $\Delta t$
  t_max: 시뮬레이션 시간
