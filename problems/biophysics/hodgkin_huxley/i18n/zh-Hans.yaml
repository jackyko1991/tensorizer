source_hash: 9c0f102b3159
title: Hodgkin–Huxley 动作电位
summary: 1952 年的枪乌贼巨轴突模型：一个膜电容由钠通道和钾通道放电，其门控变量 $m$、$h$、$n$ 随电压开启和关闭。四十一根轴突各由不同的阶跃电流驱动，在同一个 $(4, B)$ 张量中一起积分，以求出放电阈值以及放电频率随电流的变化。
notes: Hodgkin 和 Huxley（1963 年诺贝尔奖）用电压钳测量了枪乌贼巨轴突的钠电流和钾电流，并用三种门控来拟合。钠电流经 $m^3$ 快速开启，再经失活门 $h$ 较慢地关闭；钾电流则经 $n^4$ 较晚开启。一个锋电位就是二者的赛跑：小幅去极化打开 $m$，流入的 $\mathrm{Na}^+$ 使膜进一步去极化（正反馈），$V$ 冲向 $E_{Na}$；随后 $h$ 关闭、$n$ 打开，$V$ 回落甚至超射到静息电位以下。在持续的阶跃电流下，模型表现出三种状态。低于约 2.3 µA/cm² 时，膜只被动充电。介于该值与约 6.3 µA/cm² 之间时，它发放一个锋电位后便稳定下来，因为失活和钾电流把它维持在新的静息态。高于该值则重复放电，而且频率并非从零开始，而是跳到约 50 Hz：枪乌贼轴突是 II 型（共振型）神经元，其静息态通过 Hopf 分岔失稳，不同于可以任意缓慢放电的 I 型神经元。此后 f–I 曲线缓慢上升，在 10 µA/cm² 时约为 68 Hz。速率函数有可去奇点，$0.1(V+40)/(1 - e^{-(V+40)/10})$ 在 $V = -40$ mV 处是有限的，因此代码通过 $x/(1 - e^{-x})$ 并取安全极限来计算。原始实验在 6.3 °C 下进行；升温会使每个门控加速 $\phi = 3^{(T - 6.3)/10}$ 倍，使锋电位变窄、放电变快，直到约 30 °C 以上轴突完全无法放电。简化：空间钳制的膜片（不沿轴突传导）以及确定性的通道。
meanings:
- 轴突 $b$ 的刺激电流，在 10 ms 时开启的阶跃（µA/cm²）
- 每根轴突的膜电位和门控变量 $g = (m, h, n)$
- 各门控的开启和关闭速率（1/ms），即经典的枪乌贼轴突拟合
- 通道 $k$ = Na、K、漏电流的开放比例
- 最大电导（120、36、0.3 mS/cm²）和反转电位（50、−77、−54.4 mV）
- 总离子电流；重复的 $k$ ⇒ 对各通道求和
- 温度因子（$Q_{10} = 3$）：温度每升高 10 °C，每个门控加速 3 倍
- 由锋电位间隔得到的稳定放电频率（Hz）
labels:
  I_max: 最大刺激 $I_{max}$
  t_end: 模拟时间
  temp: 温度 $T$
