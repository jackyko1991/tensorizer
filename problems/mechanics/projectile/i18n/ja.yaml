source_hash: bb811720bfea
title: 空気抵抗のある放物運動
summary: 速度の2乗に比例する空気抵抗を受けるボールに対するニュートンの運動方程式。複数の打ち出し角を1つのバッチ化したテンソルに積み重ねて一度に解くので、1回の einsum ですべての軌道を扱える。
notes: バッチ添字 $b$ は物理ではない：PyTorch が $B$ 個の物体を一度に解けるようにするテンソルの工夫である。抵抗を0にすると、45° で最大到達距離となる教科書どおりの放物線に戻る。
meanings:
- ボール $b$ の位置、成分 $i \in \{x, z\}$
- ボール $b$ の速度
- 重力ベクトル $(0, -9.81)$
- 繰り返される $j$ ⇒ 和をとる：各ボールの速さの2乗
- 常微分方程式の右辺
labels:
  v0: 初速
  drag: 抵抗 $c/m$
  n_angles: 打ち出し角の数
  t_max: シミュレーション時間
