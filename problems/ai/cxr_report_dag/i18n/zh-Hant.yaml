source_hash: 433f576ee66b
title: 以 DAG 張量從胸部 X 光生成報告：拼接一個 CNN 與一個微型語言模型
summary: 這是一個教學玩具，不是臨床報告生成。一個小型 CNN 從 410 張 NIH 胸部 X 光片學習六種病灶，一個微型字元級 GPT 則從寫出的標籤標頭學習樣板報告（"enlarged heart. pleural effusion. no pneumothorax."），兩者各自獨立訓練。一條 DAG 邊把它們接起來：連接器把 CNN 的病灶機率轉成一個軟標頭，讓語言模型只憑影像就能寫出報告。訓練流程本身也是一個張量 DAG（規則分層、max-plus 關鍵路徑、每條規則對所有種子只做一次批次呼叫），並與以相同計算量端到端訓練的同一網路比較，之後再以 251 段真實文字（圖說加上引用該張 X 光片的句子）微調，這些文字來自開放授權（CC BY）的 PubMed Central 文章。第二階段的結果很弱，在配對這麼少的情況下這是意料之中，本頁也如實說明。
notes: 這是什麼。這是一個教學玩具，不是臨床報告生成：模型很小，影像只有 64×64，只有幾百個帶雜訊的標籤，也沒有真正的放射科報告。這裡的任何內容都不代表臨床準確度。這個構想（分別訓練的網路透過 DAG 張量連接、進行全域最佳化，整個流程本身也由 DAG 張量控制）出自 Jacky Ka Long Ko；本問題把本系列上一個問題中 CNN + 微型語言模型的拼接方法，移植到胸部 X 光片以及讀起來像（非常簡短的）報告的文字上。為什麼沒有真實報告。公開可得的報告資料集中，沒有一個符合這裡採用的授權規則（開放、可再散布、允許商業使用）：IU X-ray / OpenI（Demner-Fushman et al. 2016）是 CC BY-NC-ND；MIMIC-CXR（Johnson et al. 2019）、VinDr-CXR 和 BRAX 需要在資料使用協議下取得認證存取；CheXpert 和 PadChest 僅限研究使用。因此第一階段使用由程式根據 NIH 標籤組合產生的樣板報告，這使它變成以文字表達的多標籤分類；第二階段則使用 CC BY 的 PubMed Central 文章中的圖說加上引用該圖的句子：這些是為病例報告而寫的簡短、異質的文字，常常指向箭頭和子圖。哪些是新的，哪些不是。從胸部 X 光生成報告是一個活躍的領域（Jing et al. 2018，R2Gen by Chen et al. 2020）；以一個小型可學習的連接器把預訓練影像編碼器接到語言模型上，正是 LLaVA（Liu et al. 2023）和 BLIP-2（Li et al. 2023）的構建方式。本問題增加的是編排：模型圖和訓練流程都由 Circle of Willis 工作流程問題的張量 DAG 引擎執行（規則圖從 data/training.smk 解析而來、Kronecker 作業圖、布林分層、max-plus 關鍵路徑），每條規則都是對所有種子的一次批次呼叫，並且把以 DAG 構建的模型與相同計算量的單體模型比較。資料。NIH ChestX-ray14（Wang et al. 2017，NIH Clinical Center；使用不受限制，需註明出處）：549 張正面 PA 影像，每位病人一張，包含六種病灶（心臟擴大、積液、浸潤、肺塌陷、氣胸、腫塊或結節）或無病灶，每張影像最多兩種；410
  張用於訓練，139 張用於測試。這些標籤是用 NLP 從報告中擷取的，帶有雜訊（約 10 % 或更多是錯的）。PMC：來自 316 篇開放取用文章的 316 張胸部 X 光圖，每一張都是 CC BY（以文章本身 XML 中的授權核對；規則：CC BY、CC BY-SA 或 CC0，拒絕 NC、ND、其他或缺失）。候選來自 ROCOv2 的中繼資料（Rückert et al. 2024），僅作為 PMCID 的索引使用；沒有附帶任何 ROCOv2 的內容。在檢查的 2114 篇文章中，1575 篇被接受，539 篇因授權被拒（全部是 CC BY-NC）。第二階段的文字是圖說，後接同一篇文章中引用該圖的句子（316 篇中有 315 篇至少有一句），只取完整句子，最多 360 個字元，即微型語言模型的上下文長度：中位數 35 個詞（IQR 26–45），而單獨圖說只有 12 個（8–18）。每張圖和每段文字都在 data/ATTRIBUTION.csv 中註明出處；data/SOURCES.md 列出來源、條款、數量、校驗和與處理方式。模型與訓練 DAG。CNN：三層分組卷積，41 014 個權重，六個 sigmoid 輸出（多標籤，正例依其稀有程度加權）。語言模型：一個兩層的字元 GPT（d = 32，四個頭，40 108 個權重），在所有樣板上訓練，標籤標頭以六個字母寫在前面（"ce----"，接著是 "enlarged heart. pleural effusion."）。連接器（2848 個權重）：由六個機率 $q$ 和一個槽向量 $S_t$ 產生 $K = 6$ 個軟 token，取代標頭。分層：0 train_cnn ∥ train_lm ∥ train_monolith；1 train_connector（CNN 與語言模型凍結）；2 global_finetune ∥ train_router；3 caption_finetune（以 PMC 文字訓練連接器 + 語言模型，CNN 凍結）；4 evaluate。測試檢查分層與關鍵路徑、作業圖是冪零的、同一堆疊中的兩個種子訓練結果與各自單獨訓練完全相同（至 float32 捨入誤差）、一個模型的損失不會把梯度傳給其他模型、連接器階段只改變連接器，以及使用固定路由器的 MoE 層與 DAG 接線在 1e-6
  以內相等，梯度亦然。報告以貪婪方式生成（使用鍵/值快取，並與一般前向傳遞對照測試），再以關鍵字解析回標籤，並處理否定（"no pneumothorax."）。第一階段結果（2 個種子，139 張測試影像，取種子平均；results/stages.csv 有全部數字）。單獨的 CNN：平均 AUROC 0.62（隨機為 0.5），在閾值 0.5 下 micro F1 為 0.31（按訓練盛行率隨機猜測：0.16）。把它的標籤寫成標頭交給單獨的語言模型：micro F1 0.32，因此語言模型能忠實地轉述（0.90 的輸出是格式正確的樣板，即使是它從未見過的標籤組合也一樣）。拼接後的模型：連接器階段後 micro F1 為 0.22，全域微調後為 0.20（不同執行與種子間為 0.15 到 0.25），每份報告都是格式正確的樣板，0.26 到 0.27 與真實標籤的樣板完全一致。單體模型，即同一網路在 410 組影像–報告配對上以相同乘加次數（405 個聯合步）端到端訓練，對每張影像都寫出 "clear lungs." 或 "normal chest."：micro F1 為 0，完全一致率 0.27（正常影像所佔比例）。所以 DAG 流程明顯勝過單體模型，因為它重用了 CNN 的標籤監督和全部樣板文字，但它並沒有勝過單獨的 CNN：樣板報告只能重新表達分類器已知的內容，而以似然訓練的拼接模型會寫出機率最高的報告，在影像模稜兩可時偏向「正常」，而 CNN 依稀有度加權的閾值偏向召回率，這正是 $F_1$ 所獎勵的。微調的影響不大。DAG 邊 = MoE 分派。把輸入層視為專家混合（影像專家 = CNN + 連接器，文字專家 = token 嵌入），以依資料類型的 one-hot $G$，就能完全得到 DAG 接線的輸出（已測試）。一個線性路由器在專家凍結下以稠密混合方式訓練，然後以 top-1 使用（先路由，再執行所選的專家），它把每個位置都送到其模態對應的專家（兩個種子的路由準確率皆為 1.00），因此其報告和分數與固定路由器相同。第二階段結果（65 張保留的 PMC 圖）：很弱，正如預期。在 251 段文字上訓練 150 步後，模型寫出 "chest x-ray showing"，接著就是一堆亂碼字母：BLEU-1 0.05，ROUGE-L 0.06，病灶關鍵字召回率
  0，保留集交叉熵每字母 2.32 nats。給它另一張圖的影像也毫無變化（2.32 nats，分數相同）：影像根本沒被使用。一個總是回傳同一段固定訓練文字的盲基準分數反而更高（BLEU-1 0.17，ROUGE-L 0.22）。一個 40 000 個權重的字元語言模型，無法在一分鐘 CPU 時間內從約 70 000 個字元學會這種語言；用較早版本的首子句圖說（中位數 6 個詞）時 ROUGE-L 約為 0.28，但那些文字幾乎稱不上句子。DAG 機制運作正常；對第二階段來說資料實在太少。時間。在一台 6 核心桌上型 CPU 上，機器閒置時訓練約需 85 s，另加約 30 s 產生 GIF；當其他繁重工作同時佔用機器時，測得的時間會增加到兩至三倍（GIF 與 timings.csv 中顯示的執行就是在這種負載下進行的，所以其秒數較大），其中圖說階段受影響最大。每條規則一個工作者時，max-plus 關鍵路徑是 CNN → 連接器 → 微調 → 圖說 → 評估。當 torch 偵測到 GPU 時程式會選用它（pixi run -e cuda）；預設環境使用 CPU 版的 torch，所以所有附帶的數字都來自 CPU。試試看。更多圖說步數（第二階段改善得很慢）、不做全域微調（0 步）、更少的 CNN 步數（CNN 是一切的上限），或只用一個種子，看看種子之間的差異有多大。
meanings:
- 規則 $s$ 讀取規則 $r$ 所寫的內容；訓練流程以 Circle of Willis 問題的解析器從 data/training.smk 解析而來
- 每條規則的層級：CNN、語言模型和單體模型在 0，連接器在 1，微調和路由器在 2，圖說在 3，評估在 4
- 由實測的規則耗時算出的 max-plus 完成時間；$\max t$ 就是關鍵路徑
- CNN 對每張影像的六個病灶機率（sigmoid，多標籤）；模型軸 $m$ 變成每層一個分組卷積的各個組
- DAG 邊：病灶機率加上一個槽向量 $S_t$ → 一個語言模型輸入向量；$K = 6$ 個軟 token 取代寫出的標籤標頭
- 路由器：依資料類型（標頭槽或字母）的 one-hot，或對位置特徵學習的 softmax（以稠密方式訓練，以 top-1 使用）
- 重複的 $x$ ⇒ 求和：MoE 層的合併；每個專家 $Y^x$ 只在分派給它的組上計算
- 微型 GPT 的下一字母 logits（帶模型軸的 einsum 注意力，取自 chain_of_thought）
- 標頭之後報告字母上的每模型損失（nats）；把 $M$ 個損失相加，讓每個模型得到各自的梯度
- 重複的 $n$ ⇒ 求和：從每份生成報告解析回的標籤之真陽性；micro $F_1$ 在 $f$ 上把它們合併
labels:
  seeds: 種子數（獨立重複）
  steps_cnn: CNN 預訓練步數
  steps_lm: 語言模型預訓練步數（樣板報告）
  steps_con: 連接器步數（CNN 與語言模型凍結）
  steps_ft: 全域微調步數
  steps_router: 可學習路由器步數
  steps_cap: 圖說微調步數（第二階段）
  lr_ft: 微調學習率
  lr_cap: 圖說學習率
