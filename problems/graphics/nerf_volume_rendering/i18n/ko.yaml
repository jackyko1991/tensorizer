source_hash: 09cd4df32aa9
title: 'NeRF: 신경 방사장의 볼륨 렌더링'
summary: 작은 MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$가 공간의 모든 점에 밀도와 색을 부여한다. 픽셀은 그 광선을 따라 모인 빛이다. 층화 표본 $t_s$를 뽑은 뒤 구적법 $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$, 투과율 $T_s = e^{-\sum_{s'<s}\sigma_{s'}\delta_{s'}}$을 광선 × 표본에 대해 배치로 계산한다. 합성 장면의 사진만으로 학습해 제외한 시점과 깊이 맵을 렌더링하며, 위치 인코딩이 없는 두 번째 네트워크는 일반 MLP의 스펙트럼 편향을 보여 준다.
notes: '학습 데이터는 빨간 구, 체크무늬 정육면체, 주황색 공을 램버트 음영을 넣은 해석적 광선 투사기로 만든 사진 $V$장이다. 네트워크는 기하를 전혀 보지 못하고, 픽셀 색과 각 픽셀의 광선만 본다. Adam의 각 단계는 모든 학습 픽셀에서 광선을 무작위로 한 배치 뽑아 구적법으로 렌더링하고 참 색과 비교한다. $w_{rs}$, $T_{rs}$와 색은 $\sigma$와 $\mathbf c$의 매끄러운 함수이므로, 자동 미분이 사진 오차를 네트워크로 되돌려 보낸다. 여러 시점의 광선이 표면에 대해 일치하는 곳에서 밀도가 자란다. 깊이 맵 $\sum_s w_s t_s$와 표시된 광선을 따른 가중치 분포가 이를 보여 준다. 가중치가 참 표면에서 하나의 봉우리로 모인다. 위치 인코딩이 핵심 기법이다. $(x, y, z)$를 그대로 받는 일반 MLP는 저주파를 먼저 배우고 날카로운 가장자리와 미세한 질감은 아주 느리게 맞춘다(스펙트럼 편향). 대신 $\sin(2^k\pi x), \cos(2^k\pi x)$를 넣어 주면 고주파 구성 요소를 갖게 된다. 같은 단계 수에서 인코딩한 네트워크(파랑)는 윤곽이 더 선명하고, 깊이 오차가 절반 정도이며, 학습 시점의 PSNR이 더 높다. 반면 일반 네트워크(빨강)는 흐릿하게 남는다. 제외한 시점에서는 이득이 더 작다. 작은 시점이 몇 개뿐이라 미세한 디테일이 약하게만 제약되고, 두 네트워크 모두 아직 수렴과는 거리가 멀다(실제 NeRF는 몇 시간 동안 학습한다). Mildenhall et al. (ECCV 2020)과 비교한 단순화: 시선 방향 입력 없음(장면이 램버트 면이라 색이 보는 각도에 의존하지 않는다), 계층적 샘플링을 쓰는 coarse + fine 쌍 대신 네트워크 하나, 아주 작은 MLP(8 × 256 대신 3 × 64), $40\times 40$ 이미지, 그리고 수십만 단계 대신 수백 단계. $L = 2$나 $L = 10$, 더 적은 표본 수 $S$(거친 구적법으로 인한 띠 무늬), 더 많은 단계(체크무늬는
  인코딩이 있을 때만 나타난다), 또는 더 적은 시점(기하가 모호해져 학습 시점은 여전히 맞지만 제외한 시점은 나빠진다)을 시도해 보자.'
meanings:
- 각 카메라의 $P$개 픽셀 각각을 지나는 광선의 원점과 단위 방향
- '$[t_n, t_f]$를 $S$개의 같은 구간으로 나누고 구간마다 무작위 깊이 하나: 매 단계 새로 뽑으므로 네트워크가 광선 전체를 봄'
- '표본점: 광선 $r$와 표본 $s$에 대한 브로드캐스팅'
- $2^k\pi x_i$의 $\sin$과 $\cos$, $k = 0 \dots L-1$; 합은 없고 외적
- 모든 표본에 한꺼번에 적용하는 MLP 층 하나, $g$에 대해 합; 층 사이에 ReLU
- 밀도 $\ge 0$, 색은 $(0, 1)$ 범위
- 광선을 따른 각 구간의 길이
- '투과율: $s'' < s$에 대한 광학 두께 $\tau = \sigma\delta$의 배타적 누적합'
- 픽셀에 도달한 빛이 구간 $s$에서 방출되었을 확률; $\sum_s w_{rs} \le 1$
- 픽셀 색, $s$에 대해 합; 남은 투과율이 흰 배경을 보여 줌
- '기대 깊이: 같은 가중치로 깊이 맵을 공짜로 얻음'
labels:
  n_freq: 인코딩 주파수 수 $L$
  width: 은닉층 너비 $H$
  n_samples: 광선당 표본 수 $S$
  steps: Adam 단계 수(네트워크마다)
  batch: 단계당 광선 수
  lr: Adam 학습률
  n_views: 학습 시점 수 $V$
  resolution: 이미지 크기(픽셀)
