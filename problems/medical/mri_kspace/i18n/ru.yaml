source_hash: 3ad16fadfd42
title: 'k-пространство МРТ: изображение с помощью градиентов и преобразования Фурье'
summary: 'Градиенты магнитного поля дают каждому пикселю собственную фазу прецессии, поэтому катушка регистрирует преобразование Фурье изображения: $s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$, где $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$. Записанное как einsum с матрицей кодирования, оно совпадает с БПФ. Заполнение k-пространства строка за строкой и обратное преобразование показывают, как изображение становится резче; пропуск строк складывает его (алиасинг), а сохранение только центра размывает его с осцилляциями Гиббса.'
notes: 'Каждая вторая строка ($R = 2$) вдвое уменьшает поле зрения: изображение с нулевым заполнением равно в точности $\tfrac12[\rho(p) + \rho(p + N/2)]$ — копии, сдвинутой на $\mathrm{FOV}/2$ и заворачивающейся по краям. Сохранение только центральных строк оставляет постоянную составляющую, так что полная интенсивность сохраняется, но теряются края: изображение размывается и «звенит» (эффект Гиббса). Регуляризованная реконструкция решает небольшую задачу наименьших квадратов для каждого столбца изображения со штрафом за сигнал вне маски головы, оценённой по центральным строкам; она немного уменьшает ошибку случайной схемы, но не может устранить регулярный алиасинг, когда обе сложенные копии попадают внутрь головы. Реальные томографы добавляют несколько катушек (параллельная визуализация) или априорную разреженность (compressed sensing). Фантом — классическая голова Шеппа–Логана; только для иллюстрации, не для клинического применения.'
meanings:
- 'изображение протонной плотности: строка пикселей $p$ (направление фазового кодирования), столбец $r$ (считывание)'
- положение в k-пространстве как текущий интеграл градиента, $\tfrac{\gamma}{2\pi}\int G\,dt$; шаг $\Delta k = 1/\mathrm{FOV}$
- фаза $e^{-2\pi i\,up/N}$ пикселя $p$ на строке k-пространства $u$; двумерная матрица $E_{kx}$ факторизуется как $E_{up}E_{vr}$
- 'повторяющиеся $p, r$ ⇒ суммирование: измеренный сигнал k-пространства, идентичный fft2(rho)'
- 'маска выборки: 1 на полученных строках фазового кодирования'
- реконструкция с нулевым заполнением
- метод наименьших квадратов Тихонова для каждого столбца изображения $r$ со штрафом за сигнал вне головы
labels:
  size: Размер изображения $N$
  R: Коэффициент пропуска $R$ (каждая $R$-я строка)
  lowpass: Сохраняемая центральная доля k-пространства
  random_frac: Сохраняемая случайная доля строк
  lam: Вес Тихонова $\lambda$
  n_frames: Кадры заполнения
