source_hash: c17ad8b19789
title: 投影的望远镜检验：引力波、黑洞阴影与超新星
summary: 一个推测性的假说，而非既定物理，在此以公开天文数据加以检验。若引力所见的维度多于 $3+1$，引力波的衰减会比 $1/d$ 更快；若弯曲时空是折叠投影的影子，则位于光子球之外的折叠会使黑洞阴影变大。GW170817 加上其宿主星系的距离给出 $D = 4.00^{+0.07}_{-0.25}$，M87* 与 Sgr A* 的 EHT 阴影只允许折叠位于约 $2.3$ 个史瓦西半径以内，而 Pantheon+ 超新星无法区分泄漏（DGP）宇宙与 $\Lambda$CDM。一切都与 $3+1$ 维的广义相对论一致：任何额外维度都必须是引力在这些尺度上感受不到的。
notes: 状态：推测性。这是作者本人的假说（见系列说明），并非既定物理。投影假说的第 6 步，即观测步骤。第 1 步（cosmology/projection_postulate）陈述了公设，并发现玻恩规则只有在与标准量子力学无法区分的情况下才得以保留；第 2 至 5 步（projection_one_particle、projection_dimension_budget、projection_singularity_fold、projection_bell_test）分别处理 P3、P5、P4 与 P1-P2。本步骤将 P4（几何是可以折叠的投影）与 P5（引力需要某个 $d_G$，由拟合得出而非假定）的开放参数拟合到公开数据，并呈现结论，无论结果偏向哪一方。先讲已知物理。在 $3+1$ 维的广义相对论中，引力波的应变按 $1/d$ 衰减；在 $D$ 维时空中，其能量散布于 $(D-2)$ 维球面上，且 $h\propto d^{-(D-2)/2}$。假定 $1/d$ 的探测器会推得 $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$（$d_* = 1$ Mpc，同 Pardo、Fishbach、Holz 与 Spergel 2018），或者若泄漏只在屏蔽尺度 $R_c$ 之外才开始，则推得 $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$（他们的屏蔽形式，仅对 $D > 4$ 有意义）。假说的预测：若引力在大距离上扩散到额外维度，则 $d_{GW} > d_{EM}$ 且 $D > 4$。检验 (a)：GW170817，一次在 NGC 4993 中具有光学对应体的中子星并合。数据：GWTC-1 发布中 GW 光度距离的 8078 个后验样本（data/gw170817_distance.csv；LIGO Scientific 与 Virgo 合作组，低自旋先验，天空位置自由；GWOSC，许可 CC BY 4.0；Abbott et al. 2019, PRX 9, 031040）。分析所用的先验 $\propto d^2$，因此每个样本以 $d^{-2}$ 加权，再以核密度估计得出 $d_{GW}$ 的似然（已发表值为 $40^{+8}_{-14}$ Mpc，Abbott et al.
  2017）。电磁距离（data/em_distances.csv，引用数值）：面亮度起伏 $40.7\pm1.4\pm1.9$ Mpc（Cantiello et al. 2018, ApJL 854, L31，默认值），以及 Pardo 等人所用的哈勃流距离，即 $v_H = 3017\pm250$ km/s 除以 $H_0 = 73.24\pm1.74$（SH0ES）或 $67.74\pm0.46$ km/s/Mpc（Planck）。结果：$D = 4.00^{+0.07}_{-0.25}$（68%，SBF；autograd 拟合给出 $4.00\pm0.11$）、$3.98^{+0.09}_{-0.24}$（SH0ES）与 $3.94^{+0.08}_{-0.24}$（Planck）。Pardo 等人得到 $4.02^{+0.07}_{-0.10}$（SH0ES）与 $3.98^{+0.07}_{-0.09}$（Planck）；他们的下侧误差较小，因为他们将天空位置固定在对应体上，并使用 LVC 的 $H_0$ 后验，而此处附带的样本天空位置是自由的，因此距离与倾角的简并在小距离一侧留下较长的尾部。对屏蔽泄漏而言，$-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ 在 $D = 5$、$n = 1$ 时排除了低于数百 Mpc 的 $R_c$，在 $n = 2$ 至 5 时则排除低于约 50-80 Mpc 者；渐进的过渡（$n(D-4)/2$ 很小）直到网格边缘 $10^4$ Mpc 都被排除。Pardo 等人给出对任何陡度皆有 $R_c\gtrsim 20$ Mpc，依据的是后验而非似然比。结论 (a)：直到 40 Mpc，引力的表现如同 $D = 4.0$，精度约 $\pm0.1$；引力所感受到的任何额外维度，在这些距离上都是紧致的或被屏蔽的。检验 (b)：黑洞阴影。在史瓦西时空中，光子球位于 $r = 3GM/c^2$，阴影半径为 $b_c = \sqrt{27}\,GM/c^2$；此处同时以 $\min_r r/\sqrt{f}$ 计算，并对一批碰撞参数以光线追踪 $u'' = -u + \tfrac32 u^2$ 求得。自旋最多使阴影的等面积半径缩小 7%（Bardeen 曲线；从极轴方向观看极端黑洞时为 $2(1+\sqrt2)\,GM/c^2$）。折叠是作者的建模选择，在此加以精确化：P4
  说奇点是投影折叠之处；假设投影后的几何直到半径 $r_f$ 处的折叠都是史瓦西几何，而到达折叠的光永不返回。位于光子球内的折叠（$r_f\leq 1.5\,r_s$）不改变阴影；位于光子球外的折叠则使阴影边缘成为擦过它的那条光线，$b = r_f/\sqrt{1 - r_s/r_f}$，因此 $\delta = b/b_c - 1 > 0$。数据（data/eht_shadows.csv，引用数值）：M87* 光环 $42\pm3$ $\mu$as 与 $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as（EHT 2019，Papers I 与 VI），对照恒星动力学给出的 $3.64\pm0.22$ $\mu$as（Gebhardt et al. 2011，$6.6\pm0.4\times10^9\,M_\odot$，距离 17.9 Mpc），因此 $\delta = +0.04\pm0.13$（此处计算，非已发表值）；Sgr A* 光环 $51.8\pm2.3$ $\mu$as（EHT 2022，Paper I），以及取自 Paper VI 表 2 的 $\delta = -0.04^{+0.09}_{-0.10}$（Keck 先验）与 $-0.08\pm0.09$（VLTI 先验）。取 $\delta + 2\sigma$ 并允许自旋掩盖最多 7%，折叠最多可使阴影增大 0.37（M87*）、0.21（Keck）与 0.17（VLTI），因此 $r_f\leq 2.86$、$2.40$ 与 $2.28\,r_s$。结论 (b)：阴影与史瓦西/克尔相符；位于约 $2.3\,r_s$ 之外的折叠被排除，但位于光子球内的折叠（P4 自然会把它放在那里：视界或中心奇点）在阴影图像中是看不见的。检验 (c，选做)：超新星。在 DGP 膜世界中，引力在 $r_c$ 之外泄漏到第五维，膨胀遵循 $H^2 - H/r_c\propto\rho$；Dvali 与 Turner 的指数 $\alpha$ 在两者间插值（$E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$，$\alpha = 0$ 为 $\Lambda$CDM，$\alpha = 1$ 为 DGP）。数据：cosmology/cosmological_constant_fit
  的 Pantheon+ 表，复制为 data/pantheon_plus.csv（1466 颗超新星，$z > 0.01$，对角误差；Scolnic et al. 2022、Brout et al. 2022；Pantheon+ 数据文件未注明许可，论文为 CC BY 4.0）。结果（均匀先验，$-1\leq\alpha\leq 1.8$）：$\alpha = 0.44\pm0.71$；$\Lambda$CDM 的 $\chi^2 = 639.5$，DGP 为 $638.9$（两者都远低于超新星数量，因为对角误差包含了协方差的对角项）。结论 (c)：仅凭超新星无法区分泄漏的宇宙与 $\Lambda$CDM；真正排除自加速 DGP 分支的是与 CMB 及重子声学振荡的联合分析（例如 Fang et al. 2008, Phys. Rev. D 78, 103509），此处不重新拟合。P4 与 P5 的总体结论：每一项检验都与 $3+1$ 维的广义相对论一致。只有当 $3+1$ 之外的维度是引力在这些尺度上感受不到的（紧致、被屏蔽，或只存在于第 1 与第 5 步的量子部分），且任何折叠都位于光子球内时，假说才得以存活。这是一项约束，而非支持：到目前为止，本系列尚未找到一个既不同于标准物理、又与数据相符的预测。
meanings:
- 8078 个 GW170817 距离样本（GWTC-1）；$w_i = d_i^{-2}$ 除去体积均匀先验
- 重复的 $i$（样本）⇒ 求和：$d_{GW}$ 的核密度，即归一化的似然
- 当引力扩散到 $D_a$ 维时，探测器对每个电磁距离 $d_j$ 推得的距离
- $D$ 的后验，对电磁距离边缘化（对 $j$ 求和，梯形法）
- autograd 拟合：对 $\log p(D)$ 做牛顿步，误差取自二阶导数（拉普拉斯近似）
- 同时对 $B$ 个碰撞参数与 $F$ 个折叠半径计算光子轨道 $u = r_s/r$（对 $\varphi$ 做 RK4）
- 位于 $r_f$ 的折叠造成的阴影相对增大（在光子球内为零）
- 不同自旋 $a$ 与倾角下的克尔阴影缩小（Bardeen 曲线，等面积半径）
- 对每个泄漏指数 $\alpha_a$ 与 $\Omega_{m}$ 的超新星 $\chi^2$，已除去偏移量（$H_0$、$M$）；对 $i$ 求和
labels:
  em_distance: 用于结论的 NGC 4993 电磁距离
  D_screen: 屏蔽尺度之外的维度 $D$（屏蔽泄漏）
  n_screen: 屏蔽过渡的陡度 $n$
  inc_max_sgra: 自旋区间中 Sgr A* 的最大倾角
