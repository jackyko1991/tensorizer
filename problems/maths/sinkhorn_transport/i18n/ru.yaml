title: Оптимальный транспорт методом Синкхорна
summary: Как переместить кучу песка в форме кольца в две горки, а затем в спираль, затратив наименьшие общие усилия? Оптимальный транспорт находит план $P_{ij}$, который переносит массу из $x_i$ в $y_j$ со стоимостью $|x_i - y_j|^2$; его минимум — квадрат расстояния Вассерштейна $W_2^2$. Добавление небольшой энтропии $\varepsilon$ делает задачу решаемой чередующимися обновлениями Синкхорна, записанными здесь в логарифмической области с logsumexp сразу для целого пакета значений $\varepsilon$; при $\varepsilon \to 0$ стоимость опускается до точного оптимума, найденного венгерским алгоритмом.
notes: 'Монж поставил задачу в 1781 году, а Канторович в 1942 году ослабил её до планов $P$. Кутури (2013) показал, что энтропийная версия решается матричным масштабированием Синкхорна — по несколько матричных произведений на итерацию, — и это сделало оптимальный транспорт практичным в машинном обучении. Малые $\varepsilon$ требуют осторожности: код работает с потенциалами $f, g$ и logsumexp вместо $e^{-C/\varepsilon}$ (которое уходит в машинный ноль) и постепенно уменьшает $\varepsilon$ от 1 до целевого значения ($\varepsilon$-масштабирование). Стоимость $\langle P_\varepsilon, C\rangle$ убывает до точного $W_2^2$, вычисленного венгерским алгоритмом (медленный точный эталон, проверенный полным перебором всех перестановок), тогда как двойственное значение $\mathrm{OT}_\varepsilon$ содержит энтропийное смещение, которое устраняет дивергенция Синкхорна Фейди и др. (2019). Тесты также проверяют две формулы в замкнутом виде: в одномерном случае оптимальный план сопоставляет отсортированные точки
  (квантильные функции), а между гауссовыми распределениями $W_2^2 = |m_1 - m_2|^2 + \operatorname{tr}(S_1 + S_2 - 2(S_1^{1/2} S_2 S_1^{1/2})^{1/2})$ (метрика Буреса), с использованием теоремы Бренье о том, что градиент выпуклой функции является оптимальным отображением. Все фигуры генерируются кодом; изображения не используются.'
meanings:
- синтетические облака точек, сгенерированные по формулам и случайным числам; каждая точка имеет массу $a_i = 1/N$
- квадрат расстояния, повторяющийся $k$ ⇒ суммирование
- пакет значений силы регуляризации, решаемых одновременно
- обновление Синкхорна в логарифмической области, сумма по $j$ как logsumexp; не переполняется даже при крошечных $\varepsilon$
- 'то же по $i$: после этого суммы по столбцам $P$ в точности равны $b$'
- 'транспортный план: размытый при больших $\varepsilon$, почти перестановка при малых $\varepsilon$'
- 'барицентрическое отображение: куда уходит масса $x_i$; точки движутся по прямым $(1-t)\,x + t\,T(x)$ (интерполяция Маккэнна)'
- $\mathrm{OT}_\varepsilon(\mu,\nu) - \tfrac12\mathrm{OT}_\varepsilon(\mu,\mu) - \tfrac12\mathrm{OT}_\varepsilon(\nu,\nu)$, равна нулю при $\mu = \nu$
labels:
  n_points: Точек в фигуре $N$
  eps_min: Наименьшая регуляризация $\varepsilon$
  n_eps: Значений $\varepsilon$ в пакете
  n_iter: Итераций Синкхорна
