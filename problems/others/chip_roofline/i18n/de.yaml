source_hash: 3c8cc50504ae
title: Das Roofline deines Chips messen
summary: Wie schnell ist die Maschine, auf der das hier läuft? Miss die Zeit für eine große Speicherkopie, um die Bandbreite $\beta$ zu erhalten, und für ein $n\times n$-Matrixprodukt $C_{ij} = A_{ik}B_{kj}$ in FP64, FP32, TF32, BF16 und FP16, um die Rate $\pi$ jeder Genauigkeit zu erhalten; das Roofline $P(I) = \min(\pi, \beta I)$ zeigt dann, welche Kernel dein Chip mit voller Geschwindigkeit ausführt und welche auf den Speicher warten. Programmiertechniken ▸ Beschleuniger-Chipsätze stellt dein Ergebnis neben die Datenblätter anderer Chips.
notes: 'Datenblätter nennen Spitzenwerte; eine Messung zeigt, was PyTorch auf deiner Maschine tatsächlich erreicht, bei einem großen Matrixprodukt meist 50–90% des Spitzenwerts. GPU-Arbeit läuft asynchron, deshalb wartet jede Zeitmessung, bis das Gerät fertig ist (synchronize), und nimmt nach einem Aufwärmen den Median mehrerer Läufe. Auf NVIDIA-GPUs wird das FP32-Produkt zweimal gemessen: einmal in echtem FP32 und einmal mit TF32-Tensor-Cores (torch.set_float32_matmul_precision("high")), der Einstellung, die stillschweigend Mantissenbits gegen Geschwindigkeit tauscht. Apples GPU-Backend (MPS) hat kein float64, daher wird FP64 dort übersprungen; Consumer-GPUs rechnen FP64 nur mit einem kleinen Bruchteil ihrer FP32-Rate, was für die Physik wichtig ist. Probiere eine größere Matrix: Die Rate steigt, bis das Produkt rechengebunden ist, während die Speicherkopie bei der Bandbreite bleibt.'
meanings:
- Speicherbandbreite aus einer großen Kopie (Lesen + Schreiben), GB/s
- erreichte Matrixprodukt-Rate in Genauigkeit $p$, TFLOP/s
- 'wiederholtes $k$ ⇒ summiert: $n^3$ Multiplikationen mit Addition'
- 'FLOP pro bewegtem Byte: $2n/(3b)$ bei Elementen mit $b$ Byte'
- das Maximum, das ein Kernel der Intensität $I$ erreichen kann
labels:
  matrix_size: Matrixgröße $n$
  copy_mb: Kopiergröße
  repeats: Gemessene Wiederholungen
