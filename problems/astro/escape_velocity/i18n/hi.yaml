title: पलायन वेग
summary: 'रॉकेटों का एक बैच पलायन चाल $v_\mathrm{esc} = \sqrt{2GM/R}$ के आसपास की चालों से एक ग्रह से छोड़ा जाता है। ऊर्जा का चिह्न प्रत्येक रॉकेट का भाग्य तय करता है: बद्ध रॉकेट ($E < 0$) वापस गिरते हैं, अबद्ध ($E \ge 0$) कभी नहीं लौटते।'
notes: 'मात्रक: ग्रह की त्रिज्या $R = 1$ और $GM = 1$, अतः $v_\mathrm{esc} = \sqrt 2$ (पृथ्वी के लिए 11.2 km/s)। रॉकेट इंजन बंद करके चलते हैं, वायु नहीं है और ग्रह घूर्णन नहीं करता। $v_\mathrm{esc}$ से ठीक नीचे उच्चतम बिंदु $1/(1 - v^2/v_\mathrm{esc}^2)$ की तरह तेज़ी से बढ़ता है और यात्रा लंबी होती जाती है। ठीक $v_\mathrm{esc}$ पर रॉकेट हमेशा धीमा होता रहता है पर कभी रुकता नहीं। प्रक्षेपण को झुकाकर देखें कि पलायन चाल दिशा पर निर्भर नहीं करती (जब तक पथ ग्रह से न टकराए): केवल ऊर्जा मायने रखती है। अदृश्य तारे: ग्रह को तब तक संपीडित करें जब तक $v_\mathrm{esc}$ प्रकाश की चाल $c$ तक न पहुँचे, तो $R = 2GM/c^2$ मिलता है। मिशेल (1783) और लाप्लास ने तर्क दिया कि ऐसा तारा अदृश्य होगा। सामान्य आपेक्षिकता ब्लैक होल के क्षितिज के लिए ठीक यही त्रिज्या देती है (श्वार्ज़शिल्ड त्रिज्या, सूर्य के लिए 3 km), यद्यपि इसके पीछे का न्यूटनीय तर्क असली कहानी नहीं है।'
meanings:
- ग्रह के केंद्र से रॉकेट $b$ की स्थिति
- रॉकेट $b$ का वेग
- 'दोहराया गया $j$ ⇒ योग: दूरी का वर्ग $r_b^2$'
- ग्रह का गुरुत्व
- 'प्रति इकाई द्रव्यमान ऊर्जा: ऋणात्मक ⇒ बद्ध'
- वह चाल जिसके लिए सतह पर $E = 0$
- '$2GM/c^2$: वह त्रिज्या जिस पर $v_\mathrm{esc} = c$'
- $R/(1 - v^2/v_\mathrm{esc}^2)$, ऊर्ध्वाधर प्रक्षेपण का उच्चतम बिंदु
