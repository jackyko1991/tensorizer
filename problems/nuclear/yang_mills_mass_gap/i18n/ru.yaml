title: Теория Янга–Миллса на решётке и щель масс
summary: 'Задача тысячелетия Института Клэя требует построить строгую квантовую теорию Янга–Миллса в четырёх измерениях со щелью масс $\Delta > 0$; задача открыта. Решёточная калибровочная теория Вильсона (Wilson) делает вопрос вычислимым: звенья $U_\mu(x) \in SU(2)$ (или $U(1)$), хранящиеся как единичные кватернионы, обновляются алгоритмом Метрополиса (Metropolis) сразу для целого пакета констант связи $\beta$. Петли Вильсона показывают закон площади, характерный для конфайнмента, плакет совпадает с точным двумерным отношением функций Бесселя и рядом сильной связи, а коррелятор глюбола даёт решёточную оценку массы.'
notes: 'Статус: открыта. Задача Клэя (официальное описание Джаффе и Виттена) требует построить квантовую теорию Янга–Миллса на $\mathbb R^4$ для любой компактной простой калибровочной группы, удовлетворяющую аксиомам вроде аксиом Вайтмана или Остервальдера–Шрадера, и доказать, что её спектр имеет щель $\Delta > 0$ над вакуумом. Решёточные расчёты для $SU(3)$ вне разумных сомнений дают легчайший глюбол около $1.7$ ГэВ и конфайнмент (линейный потенциал, измеренное натяжение струны), но численные данные при конечном шаге решётки — не доказательство. Эта страница работает в той же постановке в игрушечном масштабе. В 2D теория точно решаема: все плакеты независимы, $\langle\frac12\mathrm{Tr}P\rangle = I_1(\beta)/I_0(\beta)$ для $U(1)$ и $I_2(\beta)/I_1(\beta)$ для $SU(2)$, и $W(R,T) = u^{RT}$ точно (тест). При сильной связи (малое $\beta$) разложение по характерам даёт те же главные значения в любой размерности и закон площади с натяжением струны $\sigma = -\ln u$: там конфайнмент доказан (Остервальдер–Зайлер,
  1978), а также для трёхмерной компактной $U(1)$ при любом $\beta$ (Гёпферт–Мак, 1982). Трудная часть — непрерывное продолжение к слабой связи $\beta \to \infty$ в 4D, где шаг решётки стремится к нулю; асимптотическая свобода (Гросс, Вильчек и Политцер, Нобелевская премия 2004) говорит, что именно там лежит континуальный предел. Отношения Кройца $\chi(R,R)$ оценивают $\sigma$ по отношениям петель так, чтобы периметровые члены сокращались. Оператор глюбола — сумма пространственных плакетов на временном срезе; его связный коррелятор убывает как $e^{-m\Delta}$, а при сильной связи наименьшая поверхность, соединяющая два плакета, — трубка из $4\Delta$ граней, что даёт $a\,m \approx -4\ln u$. При больших $\beta$ масса в решёточных единицах падает, и требуются большие решётки, сглаживание (smearing) и гораздо больше проходов; у 4D $U(1)$ есть деконфайнментный переход около $\beta \approx 1.01$ и нет щели масс выше него, поэтому задача и сформулирована для неабелевых групп. Метрополис с шагом
  $\propto 1/\sqrt{\beta}$ удерживает долю принятия около половины; ошибки оцениваются по 20 бинам метода складного ножа (jackknife).'
meanings:
- по одному единичному кватерниону на звено для каждой константы связи $\beta_b$ в пакете; $U(1)$ — подгруппа $(\cos\theta, 0, 0, \sin\theta)$
- групповой закон; по повторяющимся $i, j$ ⇒ суммирование (векторное произведение)
- 'сосед на периодической решётке: все плакеты всех узлов сразу'
- наименьшая петля Вильсона; $\frac12\mathrm{Tr}(ab) = a_0b_0 - a_kb_k$
- 'сумма $2(D-1)$ скоб (staples): часть $S$, содержащая $U_\mu(x)$, равна $-\beta\frac12\mathrm{Tr}(U_\mu A_\mu)$'
- Метрополис сразу на всех звеньях одного направления и одной чётности шахматного разбиения (у них нет общих скоб)
- произведения цепочек звеньев вокруг прямоугольников $R\times T$, усреднённые по узлам, плоскостям и ориентациям
- '$I_1/I_0$ для $U(1)$, $I_2/I_1$ для $SU(2)$: точное $\langle\frac12\mathrm{Tr}P\rangle$ в 2D, главный порядок при любом $D$'
- $\ln C(\Delta)/C(\Delta+1)$ оператора пространственных плакетов, с ошибками по методу складного ножа
labels:
  group: Калибровочная группа
  dim: Размерность $D$
  size: Размер решётки $L$ (узлов на сторону)
  beta: Константа связи $\beta$ для петель и глюбола
  sweeps: Проходы Монте-Карло
