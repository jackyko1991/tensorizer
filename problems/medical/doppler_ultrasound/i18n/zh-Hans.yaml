source_hash: 2cd1c41299f8
title: 多普勒超声：测量血流
summary: 超声探头聆听红细胞的回波。每个运动的红细胞都会使回波频率偏移 $f_D = 2 f_0 v \cos\theta / c$，搏动动脉中的数百个红细胞作为一批相量（phasor）同时模拟。短时傅里叶变换（STFT）把它们叠加的回波变成扫描仪上显示的多普勒频谱图：整个心动周期中血流速度的分布。
notes: 因子 2 的来源是频移发生了两次：运动的红细胞先接收到频移后的波，再在运动中把它重新发射出去。只有沿声束方向的速度分量才起作用，所以在 $\theta = 90°$ 时完全没有频移；扫描仪需要操作者输入角度，再计算 $v = f_D c / (2 f_0 \cos\theta)$，角度超过约 60° 时结果会非常不确定。使用默认值（$f_0 = 5$ MHz、$\theta = 60°$、峰值 1 m/s）时，收缩期频移约为 3.2 kHz，正好在可听范围内，这也是多普勒仪器会把信号播放成声音的原因。层流的速度剖面是抛物线形：靠近管壁的红细胞几乎不动，中心线上的最快。由于截面上相等的面积含有相等数目的红细胞，0 到 $v_{\max}$ 之间的每个速度出现的机会都相同，频谱是一条平坦的带（“填满”的频窗），平均频率恰好是最大值的一半。湍流或狭窄处的血流则会使频谱展宽。脉冲多普勒每个脉冲只采样一次回波，因此根据奈奎斯特定理，它只能测量 $|f_D| < \mathrm{PRF}/2$：降低 PRF（或提高流速），收缩期峰值就会绕到负频率一侧（混叠，aliasing）。实际的扫描仪测量高速射流需要高 PRF，但探测深部血管需要低 PRF，因为每个脉冲都必须在下一个发射前返回。简化：取样容积覆盖整条血管、声束均匀、IQ 信号直接在基带模拟，且没有壁滤波器或组织杂波。所有数值均为近似值，仅供教学使用，不可用于临床。
meanings:
- 两次心跳中的中心线速度：收缩期峰值、短暂逆流、缓慢的舒张期血流
- 随机红细胞：在血管中的半径、回波相位与强度
- 抛物线（层流）剖面乘以波形：外积，没有指标被求和
- 每个红细胞在每个脉冲时的多普勒频移 $2 f_0 v \cos\theta / c$
- 重复的 $n$ ⇒ 求和：接收到的回波，每个脉冲一个复数（IQ）样本，间隔 $\Delta t = 1/\mathrm{PRF}$
- 频谱图：时间窗 $k$ 中频率 $f$ 的功率
- 脉冲多普勒只能看到折回 $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$ 内的 $f$
labels:
  f0: 发射频率 $f_0$
  theta: 声束与血流夹角 $\theta$
  v_peak: 收缩期峰值速度
  prf: 脉冲重复频率 PRF
  heart_rate: 心率
  n_scatterers: 模拟的红细胞数
