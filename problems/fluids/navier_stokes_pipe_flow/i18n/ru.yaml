title: Течение Навье–Стокса в трубе
summary: 'Полные уравнения Навье–Стокса для несжимаемой жидкости, применённые к воде в круглой трубе, которую внезапно начинает толкать градиент давления. Для осевого течения нелинейное слагаемое точно обращается в нуль, остаётся радиальное уравнение диффузии: импульс распространяется от стенки с условием прилипания, и профиль за несколько $R^2/\nu$ вырастает в параболу Хагена–Пуазейля.'
notes: 'Это одно из редких точных решений уравнений Навье–Стокса: поскольку течение параллельное, $(\mathbf u\cdot\nabla)\mathbf u = 0$ и остаются только градиент давления и вязкость. Стационарное течение Хагена–Пуазейля имеет $u_z = G(R^2 - r^2)/4\mu$, расход $Q = \pi G R^4/8\mu$ (знаменитый закон $R^4$) и касательное напряжение на стенке $\tau_w = GR/2$ — баланс сил $G\,\pi R^2 = \tau_w\,2\pi R$ на единицу длины. Разгон приближается к нему как $e^{-\lambda_1^2\nu t/R^2}$ с $\lambda_1 = 2.405$ (первый нуль $J_0$), так что к $t \approx 0.6\,R^2/\nu$ профиль отличается от параболы лишь на несколько процентов. Вначале ядро движется как поршень, и торможение ощущает только жидкость у стенки — следите за линиями красителя. Решение ламинарное; при числах Рейнольдса выше примерно 2000 реальное течение в трубе становится турбулентным.'
meanings:
- только $u_z \ne 0$ и $\partial_z u_z = 0$, поэтому конвективное слагаемое точно равно нулю
- 'уравнение непрерывности выполняется автоматически: $u_z$ не меняется вдоль трубы'
- радиальные точки от оси ($i = 0$) до стенки ($i = N$)
- осевая скорость $u_z(r_i)$; на стенке $u_N = 0$ (прилипание)
- $\tfrac1r\partial_r(r\partial_r\,\cdot)$ в виде матрицы, с пределом $r \to 0$ $2\partial_r^2$ на оси
- 'повторяющийся $j$ ⇒ суммирование: вязкое слагаемое $\nu\nabla^2 u_z$'
- движущий градиент давления в Па/м
- объёмный расход; стационарное значение $\pi G R^4/8\mu$
- сила трения на единицу площади стенки; стационарное значение $GR/2$
labels:
  G: Градиент давления $G$
  R: Радиус трубы $R$
  nu: Кинематическая вязкость $\nu$
  t_max: Время моделирования в единицах $R^2/\nu$
