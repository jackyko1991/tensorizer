source_hash: 9e147d6c0987
title: «Ось зла» на микроволновом небе
summary: 'Два крупнейших узора на настоящей карте WMAP реликтового излучения, квадруполь ($\ell = 2$) и октуполь ($\ell = 3$), похоже, направлены в одну сторону. Их коэффициенты $a_{\ell m}$ получаются одной подгонкой методом наименьших квадратов; ось каждого мультиполя — главный собственный вектор $3\times 3$-матрицы дисперсии момента импульса $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$, а пакет из $10^5$ изотропных случайных небес превращает угол между осями в $p$-значение. Реальная, но спорная аномалия: случайность, остатки переднего фона или новая физика.'
notes: 'В статистически изотропной Вселенной (стандартное предсказание инфляции) ориентации разных мультиполей независимы, поэтому угол между осями квадруполя и октуполя должен быть случайным: $|\cos|$ равномерно распределён на $[0, 1]$. Тегмарк, де Оливейра-Коста и Гамильтон (2003) и де Оливейра-Коста и др. (2004) обнаружили на первых картах WMAP, что обе оси указывают на $(l, b) \approx (-110^\circ, 60^\circ)$; Лэнд и Магейжу (2005) назвали это «осью зла»; Копи, Хутерер, Шварц и Старкман исследовали её с помощью мультипольных векторов и нашли дальнейшие связи с эклиптикой. На прилагаемой карте ILC WMAP за 9 лет оси получаются в $(l, b) \approx (240^\circ, 60^\circ)$ и $(238^\circ, 63^\circ)$, всего в $3^\circ$ друг от друга, и лучше выровнены менее 2 из 1000 изотропных небес ($p \approx 0.0015$; для этой статистики точно $p = 1 - |\cos|$, что подтверждает Монте-Карло). Правая панель проверяет моделирование: доля случайных небес, выровненных не хуже $x$, идёт по прямой $P = x$. Статус:
  выравнивание в данных реально (статьи Planck 2013, 2015 и 2018 об изотропии видят его на всех своих картах), но его значимость спорна. Статистика выбрана после того, как узор был замечен (апостериори, эффект «поиска в другом месте»: среди множества возможных аномалий некоторые будут выглядеть редкими); низкая мощность квадруполя, остаточный галактический передний фон в ILC, кинематический доплеровский квадруполь (здесь не вычтен) и выбор карты меняют $p$ в несколько раз. Общепринятого физического объяснения нет; предлагались нетривиальная топология, анизотропное расширение или локальные передние фоны, а большинство космологов считают это статистической флуктуацией. Эта страница приводит $p$ для одной статистики и не заявляет об обнаружении. Данные: карта ILC WMAP за 9 лет (Bennett et al. 2013, ApJS 208, 20), файл wmap_ilc_9yr_v5.fits из архива LAMBDA NASA (lambda.gsfc.nasa.gov; данные NASA, общественное достояние), здесь огрублённая с HEALPix $N_\mathrm{side} = 512$ до 16 (столбцы glon_deg,
  glat_deg, T_uK). Её можно заменить любой картой в том же CSV-формате lon/lat/T (например, картой Planck). Подгонка использует все мультиполи до $\ell_\mathrm{fit}$ по всему небу без маски; изотропные небеса строятся из единичных гауссовых вещественных коэффициентов (мощность $C_\ell$ в оси сокращается).'
meanings:
- направление пикселя, температура и телесный угол из любого CSV lon/lat/T
- вещественные гармоники в каждом пикселе; $a$ пробегает все $(\ell, m)$
- 'взвешенные наименьшие квадраты: все мультиполи сразу, без наложения между ними'
- комплексные коэффициенты с $a_{\ell,-m} = (-1)^m a^*_{\ell m}$
- матрицы спина $\ell$, $[L_x, L_y] = iL_z$, $L_iL_i = \ell(\ell+1)$
- 'суммирование по $m, n, k$: $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$ в системе с $z \parallel \hat n$'
- 'пакетный eigh: ось, вокруг которой мультиполь наиболее плоский'
- 'суммирование по $i$: выравнивание двух осей в небе $s$ (у осей нет направления)'
- $p$-значение Монте-Карло против изотропных гауссовых небес
labels:
  n_skies: Изотропные случайные небеса $K$
  lmax_fit: Мультиполи, подгоняемые вместе, $\ell_\mathrm{fit}$
  seed: Случайное зерно
