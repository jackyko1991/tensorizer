source_hash: a25b37200a6c
title: HP 격자 단백질 접힘
summary: '여전히 접히는 가장 단순한 단백질 모형: 정사각 격자 위에 놓인 소수성(H) 및 극성(P) 잔기의 사슬로, 사슬 이웃이 아닌 잔기 사이의 H–H 접촉 하나마다 에너지가 1씩 낮아진다. 20잔기 벤치마크의 여러 복제본이 온도를 낮추는 동안 당기기 이동(pull move)과 크랭크축 이동을 사용한 메트로폴리스 몬테카를로로 동시에 접히며, 접촉 지도는 $(R, N, N)$ 모양의 쌍 거리 텐서 하나에서 얻어진다.'
notes: '단백질이 접히는 주된 이유는 소수성 곁사슬이 조밀한 핵 안에서 물로부터 숨기 때문이다. HP 모형(Dill, 1985)은 이것만 남긴다. H–H 접촉은 $-\varepsilon$의 값을 가지고 그 밖에는 아무것도 계산하지 않으며, 사슬은 격자 위의 자기 회피 보행이다. 그럼에도 최저 에너지를 찾는 문제는 NP-난해이고, 형태의 수는 $2.64^N$처럼 증가한다. 기본 서열 HPHPPHHPHPPHPHHPPHPH는 Unger와 Moult(1993)의 고전적인 20잔기 벤치마크로 바닥 상태는 $E = -9$이다. 나머지 서열의 알려진 최솟값은 $-9$, $-8$, $-14$이다. 매 단계마다 각 복제본은 잔기 하나를 골라 당기기 이동(Lesh, Mitzenmacher, Whitesides, 2003: 잔기가 빈 모서리로 뛰어가 사슬이 다시 연결될 때까지 사슬을 따라 이웃들을 끌고 간다. 양 끝에서는 마지막 잔기를 회전시키며, 가장 단순한 경우에는 모서리 뒤집기가 된다)이나 크랭크축 이동(U자 모양의 쌍이 뒤집힌다)을 시도한다. 결합을 끊거나 두 잔기를 한 자리에 놓는 제안은 기각되고, 그렇지 않으면 메트로폴리스 규칙이 결정한다. 높은 온도에서는 사슬이 자유롭게 탐색하고, 천천히 냉각하면 H 핵과 표면의 P 잔기를 가진 조밀한 접힘으로 자리 잡는다. 에너지 $E$는 수락된 각 이동의 $\Delta E$로 갱신되며, 테스트에서 전체 재계산과 대조된다. 당기기 이동은 정확히 대칭적인 제안이 아니므로, 이 계산은 정확한 열적 표본 추출기라기보다는 최적화기이다. 36잔기 서열을 시도해 보라. 더 많은 단계나 복제본이 필요하며, 바닥 상태에 도달한 복제본의 비율은 그 에너지 지형이 얼마나 울퉁불퉁한지 보여 준다.'
meanings:
- 복제본 $r$에서 잔기 $i$의 격자 좌표 $k$; 모든 복제본은 곧은 막대로 시작한다
- H는 1, P는 0
- '반복된 $k$ ⇒ 합산: 배치 그람 행렬; 제곱 노름과 함께 $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$를 준다'
- 사슬 이웃이 아닌 격자 이웃
- '반복된 $i$와 $j$ ⇒ 합산: H–H 접촉, 각각 두 번 세어지므로 $\tfrac12$'
- 길이 1인 결합과 한 자리에 두 잔기 금지, 위반 시 이동 기각
- '담금질 일정: $T$가 단계마다 기하급수적으로 감소한다'
- '메트로폴리스 규칙: 내리막은 항상, 오르막은 확률 $e^{-\Delta E/T}$로'
labels:
  sequence: 서열
  replicas: 복제본 $R$
  steps: 몬테카를로 단계
  T_start: 시작 온도 $T_0$ ($\varepsilon/k_B$ 단위)
  T_end: 끝 온도 $T_1$
