<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two black holes spiralling together emit a chirp: a wave whose frequency and amplitude rise until merger, recorded by two L-shaped LIGO detectors about 7 ms apart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- inspiral orbit -->
    <path d="M40,46 m-26,0 a26,18 0 1,0 52,0 a22,15 0 1,0 -44,0 a16,11 0 1,0 32,0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="26" cy="46" r="7" fill="#374151" stroke="#111827" stroke-width="1.5"/>
    <circle cx="56" cy="46" r="6" fill="#374151" stroke="#111827" stroke-width="1.5"/>
    <text x="22" y="20" font-style="italic">m₁, m₂</text>
    <!-- chirp waveform -->
    <path d="M10,112 C16,104 22,104 28,112 S40,120 46,112 S56,102 61,112 S69,124 73,112 S79,98 82,112 S87,128 90,112 S94,94 96,112 S99,132 101,112 S103,92 105,112 S107,126 109,112 S112,104 114,112 S118,116 122,112 L132,112" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="12" y="146" font-style="italic">h(t)</text>
    <line x1="60" y1="140" x2="120" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="156" font-size="13" fill="#b91c1c" font-style="italic">f ↑</text>
    <!-- two detectors -->
    <g stroke="#374151" stroke-width="2" fill="none">
      <path d="M170,52 L170,22 M170,52 L200,52"/>
      <path d="M170,128 L170,98 M170,128 L200,128"/>
    </g>
    <rect x="164" y="46" width="12" height="12" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="164" y="122" width="12" height="12" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="204" y="44" font-size="13">H1</text>
    <text x="204" y="120" font-size="13">L1</text>
    <line x1="215" y1="58" x2="215" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="178" y="84" font-size="13" fill="#b45309">7 ms</text>
    <line x1="132" y1="90" x2="158" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="132" y1="100" x2="158" y2="122" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
