source_hash: 9e147d6c0987
title: 마이크로파 하늘의 '악의 축'
summary: '실제 WMAP 우주 마이크로파 배경 지도에서 가장 큰 두 무늬인 사중극($\ell = 2$)과 팔중극($\ell = 3$)이 같은 방향을 가리키는 것처럼 보입니다. 계수 $a_{\ell m}$은 한 번의 최소제곱 피팅으로 얻고, 각 다중극의 축은 $3\times 3$ 각운동량 분산 $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$의 최대 고유벡터이며, $10^5$개의 등방 무작위 하늘을 한꺼번에 만들어 두 축 사이의 각을 $p$값으로 바꿉니다. 실재하지만 논란이 있는 이상 현상입니다: 우연, 전경 잔여물, 또는 새로운 물리.'
notes: '통계적으로 등방인 우주(인플레이션의 표준 예측)에서는 서로 다른 다중극의 방향이 독립이므로, 사중극과 팔중극 축 사이의 각은 무작위여야 합니다: $|\cos|$가 $[0, 1]$에서 균일. Tegmark, de Oliveira-Costa, Hamilton(2003)과 de Oliveira-Costa 등(2004)은 초기 WMAP 지도에서 두 축이 모두 $(l, b) \approx (-110^\circ, 60^\circ)$를 가리킨다는 것을 발견했고, Land와 Magueijo(2005)가 이를 ''악의 축''이라 불렀습니다. Copi, Huterer, Schwarz, Starkman은 다중극 벡터로 이를 연구해 황도와의 추가적인 연관도 찾았습니다. 함께 제공된 WMAP 9년 ILC 지도에서 두 축은 $(l, b) \approx (240^\circ, 60^\circ)$와 $(238^\circ, 63^\circ)$로, 겨우 $3^\circ$ 떨어져 있으며, 이보다 더 잘 정렬된 등방 하늘은 1000개 중 2개 미만입니다($p \approx 0.0015$; 이 통계량에서는 정확히 $p = 1 - |\cos|$이며 몬테카를로가 이를 확인합니다). 오른쪽 패널은 시뮬레이션을 검증합니다: $x$ 이상으로 정렬된 무작위 하늘의 비율이 직선 $P = x$를 따릅니다. 현황: 이 정렬은 데이터에 실재합니다(Planck 2013, 2015, 2018 등방성 논문이 모든 지도에서 확인). 그러나 그 유의성은 논란 중입니다. 통계량은 무늬를 알아챈 뒤에 선택되었고(사후 선택, look-elsewhere 효과: 가능한 수많은 이상 가운데 일부는 드물어 보이기 마련), 낮은 사중극 파워, ILC에 남은 은하 전경, 운동학적 도플러 사중극(여기서는 제거하지 않음), 지도 선택에 따라 $p$가 몇 배씩 달라집니다. 받아들여진 물리적 설명은 없으며, 비자명한 위상, 비등방 팽창, 국소 전경 등이 제안되었지만 대부분의 우주론자는 통계적 요동으로 봅니다. 이 페이지는 한 가지 통계량에
  대한 $p$를 보고할 뿐 검출을 주장하지 않습니다. 데이터: WMAP 9년 ILC 지도(Bennett et al. 2013, ApJS 208, 20), NASA LAMBDA 아카이브의 wmap_ilc_9yr_v5.fits(lambda.gsfc.nasa.gov; NASA 데이터, 퍼블릭 도메인)를 여기서 HEALPix $N_\mathrm{side} = 512$에서 16으로 낮춘 것(열 glon_deg, glat_deg, T_uK). 같은 lon/lat/T CSV 형식이면 어떤 지도(예: Planck 지도)로도 바꿀 수 있습니다. 피팅은 마스크 없이 전천에서 $\ell_\mathrm{fit}$까지의 모든 다중극을 사용하며, 등방 하늘은 분산 1인 가우스 실수 계수로 만듭니다(파워 $C_\ell$은 축에서 상쇄됨).'
meanings:
- 픽셀 방향, 온도, 입체각. 임의의 lon/lat/T CSV에서 읽음
- 각 픽셀에서의 실수 구면조화함수; $a$는 모든 $(\ell, m)$를 지남
- '가중 최소제곱: 모든 다중극을 한 번에, 서로 간 에일리어싱 없이'
- 복소 계수, $a_{\ell,-m} = (-1)^m a^*_{\ell m}$
- 스핀 $\ell$ 행렬, $[L_x, L_y] = iL_z$, $L_iL_i = \ell(\ell+1)$
- '$m, n, k$에 대해 합: $z \parallel \hat n$인 좌표계에서 $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$'
- '배치 eigh: 다중극이 가장 평면적인 축'
- '$i$에 대해 합: 하늘 $s$에서 두 축의 정렬도(축에는 방향이 없음)'
- 등방 가우스 하늘에 대한 몬테카를로 $p$값
labels:
  n_skies: 등방 무작위 하늘 수 $K$
  lmax_fit: 함께 피팅하는 다중극 $\ell_\mathrm{fit}$
  seed: 난수 시드
