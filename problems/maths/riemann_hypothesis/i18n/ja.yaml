title: 数千個の零点で見るリーマン予想
summary: テンソル形式の Riemann–Siegel 公式で臨界線上の $\zeta$ の非自明な零点を数千個求め、その個数を Riemann–von Mangoldt の法則 $N(T) = \theta(T)/\pi + 1 + S(T)$ および Gram の法則と比べ、間隔とペア相関をランダムなエルミート（GUE）行列と比較し、零点から素数冪の階段関数 $\psi(x)$ を再構成する。予想そのもの、すなわちすべての非自明な零点の実部が $\frac12$ であるということは、いまだ未解決である。
notes: このページは問題「リーマンのゼータ関数と素数」（maths/zeta_primes）を補うものである。そちらでは Euler–Maclaurin で $\zeta$ を一から構成し、最初の零点を求め、$\pi(x)$ を再構成している。基礎についてはまずそちらを読んでほしい。ここでは、より高速な Riemann–Siegel 公式とその補正項 $C_0, C_1, C_2$（$\Psi$ の導関数は Chebyshev 級数から求める）を用いて 25 万個の高さで $Z(t)$ を評価し、$T$ 以下の臨界線上の零点をすべて求める。$t \ge 100$ では高精度計算（mpmath）との差は $10^{-5}$ 未満である。$t = 1000$ 以下では 649 個、5000 以下では 4520 個の符号変化が見つかり、これはちょうどそれらの高さまでの帯状領域内の零点の総数（mpmath で独立に計算）に等しいので、それらはすべて臨界線上にある。計数関数は $\theta(T)/\pi + 1$ に従い、平均すると 0 になる小さなゆらぎ $S(t)$ を伴う。Gram の法則はほとんどの Gram 点で成り立ち、最初に破れるのは $g_{126} \approx 282.45$ である。平均間隔 1 に規格化（unfolding）すると、零点どうしは大きなランダムエルミート行列（GUE）の固有値とまったく同じように反発し合う：Montgomery（1973）はペア相関 $1 - (\sin \pi u / \pi u)^2$ を予想し、リーマン予想を仮定したうえで、Fourier 台が $(-1, 1)$ に含まれるテスト関数についてそれを証明した。Odlyzko の $10^{20}$ 番目の零点付近での計算はそれを見事に裏づけている。ここでの低い高さでも一致はすでに良好である。明示公式（von Mangoldt 1895、証明済み）は零点を素数に変換する：各ペア $\frac12 \pm i\gamma$ が波 $x^{1/2}\cos(\gamma\ln x)$ を加え、数千個の零点があれば $\psi(x)$ はくっきりした階段になる。リーマン予想、すなわちすべての非自明な零点の実部が $\frac12$ であるということは、クレイ数学研究所のミレニアム懸賞問題の一つであり、未解決である。高さ
  $3\times10^{12}$ までのすべての零点について検証されている（Platt と Trudgian 2021）。帯状領域に示した証明済みの結果：$\operatorname{Re} s = 1$ 上に零点はない（Hadamard、de la Vallée Poussin 1896、素数定理と同値）こと、および零点のない領域 $\sigma > 1 - 1/(5.558691\ln t)$（Mossinghoff と Trudgian 2015）であり、関数等式によって鏡映されている。主張されているが確立されていないもの：報道によれば（我々は原稿を確認していない）、OpenAI は 2026 年 10 月、AI が生成した原稿を集めた公開リポジトリ openai/math において、$\zeta$ およびすべての Dirichlet $L$ 関数が半平面 $\operatorname{Re} s > 7/8$ に零点をもたないという主張を公表し、$\operatorname{Re} s > 11/12$ についての関連する議論も添えた。これらのプレプリントは査読を受けておらず、独立に検証されてもいない。もし正しければ、固定幅の零点のない帯は大きな進展となるが、それでも $\frac12$ の線からはまだ遠い。どんな計算もこの予想を証明することはできない：有限の探索で見つかるのは線上の零点か、反例だけである。
meanings:
- 繰り返された $n$ ⇒ 和：250 000 個の高さの主和を一度に、$n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$ でマスク
- $\Psi$ は整関数だが、商は $p = \frac14, \frac34$ で $0/0$ になる。Chebyshev フィットでこれを取り除く
- Riemann–Siegel の補正項：Chebyshev 級数は項別に微分できる、$c'_{k-1} = c'_{k+1} + 2k\,c_k$
- 刻み幅 0.02 の格子上で $Z$ の符号変化を探し、すべての区間に対して同時に 32 回の二分法
- 零点の個数からその滑らかな部分を引いたもの。小さいままで平均は 0
- Newton 法ですべての Gram 点を一度に。Gram の法則は $(-1)^n Z(g_n) > 0$ を主張する
- 規格化した零点 $x = \theta(\gamma)/\pi + 1$ と、後続の $J = 10$ 個の近傍との差（ペア相関用）
- すべての零点のすべての $x$ での寄与を零点について累積：高さ $T$ ごとに 1 行
labels:
  t_max: 高さ $T$
  x_max: 明示公式を $x$ まで
