source_hash: 9a93d668845a
title: '따로 학습하고 DAG 텐서로 잇기: CNN과 작은 LM'
summary: 작은 CNN은 MNIST 숫자를, 작은 문자 단위 GPT는 "three+two=five." 같은 문장을 각자 따로 학습합니다. 그다음 DAG 간선 하나가 둘을 잇습니다. 커넥터가 CNN의 특징을 첫 단어를 대신하는 소프트 토큰으로 바꾸어, LM이 "[3의 이미지]+two="에 "five"라고 답하게 합니다. 학습 과정 전체도 그 자체로 텐서 DAG이며(레벨별 규칙, max-plus 임계 경로, 규칙마다 시드 전체에 대한 배치 호출 한 번), 같은 연산량(곱셈-덧셈)으로 결합 과제만으로 종단 간 학습한 동일한 네트워크와 비교합니다. 잇는 간선은 고정 라우터를 가진 전문가 혼합(MoE) 층으로도 표현되며, 학습되는 라우터도 시험합니다.
notes: '아이디어. 네트워크를 따로 학습한 뒤 DAG 텐서로 연결하고, 이어서 전역적으로 최적화할 수 있으며, 이 과정 전체 역시 DAG 텐서로 제어할 수 있습니다. 이 아이디어는 Jacky Ka Long Ko의 것입니다. 이 문제는 이를 작은 CNN과 작은 문자 단위 LM에서 시험하며, 처음부터 공동 학습하는 시각-언어 모델로 만들지 않은 것은 의도적이고, 바로 그 비-DAG 대안과 비교합니다. 새로운 것과 아닌 것. 따로 사전학습된 이미지 인코더, 사전학습된 LM, 작은 학습 가능한 커넥터로 멀티모달 모델을 만드는 것은 LLaVA(Liu et al. 2023, LM 토큰 공간으로의 선형 또는 MLP 사영)와 BLIP-2(Li et al. 2023, 고정된 이미지 인코더와 고정된 LLM 사이의 Q-Former)의 구성 방식입니다. Frozen(Tsimpoukelli et al. 2021)은 여기서처럼 이미지를 소프트 접두어로 고정된 LM에 넣습니다. 모델 스티칭(Lenc와 Vedaldi, CVPR 2015, arXiv 2014; Bansal et al. 2021)은 학습된 두 네트워크를 작은 학습 가능한 층으로 잇습니다. 이 문제가 더하는 것은 오케스트레이션입니다. 모델 그래프와 학습 과정 모두 윌리스 고리 워크플로 문제의 텐서 DAG 엔진(규칙 그래프, 크로네커 작업 그래프, 불리언 레벨, max-plus 임계 경로)으로 실행되며, DAG로 구성한 모델을 모놀리스와 비교합니다. 과제와 모델. CNN(5×5 합성곱 두 개, 가중치 8474개)은 MNIST 이미지 3000장으로 열 개의 숫자를 학습합니다. 2층 GPT(d = 32, 헤드 네 개, 가중치 27 543개, chain_of_thought의 모델 축을 가진 einsum 어텐션)는 op가 +, −, × (mod 10)인 300개의 문장 "a op b = r."을 학습하며, 숫자는 단어로 씁니다("three+two=five.", 첫 단어는 5글자 슬롯에 오른쪽 정렬). 결합 과제는 숫자 a의 MNIST
  테스트 이미지와 텍스트 "+two="를 줍니다. 피연산자 단어는 텍스트에 없습니다. DAG 간선은 커넥터(가중치 3808개)입니다. CNN의 열 개 숫자 확률 $q$와 슬롯 벡터 $S_t$로부터 $K = 5$개의 소프트 토큰 $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$를 만들어 LM 입력의 피연산자 슬롯을 대체합니다. (대신 CNN의 끝에서 두 번째 특징을 넣으면 시험에서 훨씬 느리게 학습되었습니다. 커넥터 100단계 후 결합 정확도가 약 0.6 대비 약 0.25.) 정확도는 참 접두어가 주어졌을 때 답의 글자들과 마침표가 모두 LM의 최상위 선택인 테스트 예제의 비율이며, 이는 정확히 탐욕적 디코딩이 쓰는 결과입니다. DAG로서의 학습 과정. data/training.smk에 규칙이 나열되어 있습니다. 엔진은 윌리스 고리 파서로 이를 파싱하고 레벨별로 실행하며, 각 규칙은 쌓인 모델 축(시드 × 결합 세트 크기 $n$) 위의 모델들에 대한 단 한 번의 배치 호출입니다. 레벨 0 train_cnn ∥ train_lm ∥ train_monolith; 레벨 1 train_connector(CNN과 LM은 고정, $I \otimes \mathbb 1$ 블록으로 시드에서 (시드, $n$)으로 브로드캐스트); 레벨 2 global_finetune(전부, 간선을 통한 종단 간 학습, 100배 작은 학습률) ∥ 학습되는 라우터 두 개; 레벨 3 evaluate. 시드 2개와 크기 4개일 때 규칙 8개, 작업 45개, 작업 간선 84개이며 $A$는 멱영입니다. 테스트는 레벨, 순환이 거부되는지, 한 스택에서 학습한 두 시드가 각각 따로 학습했을 때와 같은 손실을 내는지(Adam은 원소별, 클리핑은 모델별), 그리고 한 모델의 손실이 다른 모델에 0의 기울기를 보내는지를 확인합니다. 기준선. 모놀리스는 동일한 CNN + 커넥터 + LM(가중치 39 825개)으로, 무작위 초기화 후 결합 예제만으로 종단 간 학습합니다. 예산은 모델당 곱셈-덧셈
  수로 맞춥니다. DAG 파이프라인의 CNN 150, LM 600, 커넥터 150, 미세조정 80단계(배치 32)는 결합 학습 682단계와 비용이 같으며, 모놀리스는 이만큼을 받습니다(각 사전학습을 모델마다 전부 계산하지만, DAG에서는 사전학습된 CNN과 LM 하나가 $n$의 네 값 모두에 쓰입니다). 결과(시드 2개, 테스트 이미지 1000장, 우연 수준 0.1, CPU). 멀티스레드 부동소수점 리덕션 때문에 반복 실행 간에 몇 포인트씩 차이가 나므로, 아래 수치는 전체 실행 네 번에 걸친 시드 평균의 범위입니다. 동봉된 실행의 정확한 수치는 results/stages.csv에 있습니다. 단독으로 CNN은 테스트 숫자의 0.89를 읽고 LM은 텍스트 프롬프트의 0.97~0.99를 완성합니다. CNN의 숫자를 텍스트로 써서 LM에 주면 0.88~0.89로, 이 파이프라인의 상한입니다. 결합 예제 $n$ = 100, 300, 1000, 3000에 대한 결합 정확도: 학습 전 커넥터 약 0.16; 커넥터 단계 후 0.41–0.47, 0.58–0.63, 0.60–0.69, 0.64–0.68; 전역 미세조정 후 0.41–0.47, 0.63–0.67, 0.68–0.75, 0.71–0.75; 모놀리스 0.14, 0.13–0.15, 0.16–0.17, 0.23. DAG로 구성한 모델이 모든 실행의 모든 $n$에서 이기며, 결합 데이터가 부족할수록 차이가 크고, 미세조정은 $n$ = 300부터 0.03~0.08을 더합니다($n$ = 100에서는 평균적으로 변화가 없습니다). 이유는 분명합니다. DAG는 단일 모달 데이터(레이블된 숫자 3000개와 모든 문장)를 재사용하지만, 모놀리스는 $n$개의 답 단어만으로 숫자와 산술을 발견해야 하며, ×는 종종 피연산자를 가립니다(무엇이든 × 0 = 0). 단계나 데이터가 더 많으면 모놀리스도 나아질 것입니다(예산이 끝날 때도 손실이 여전히 감소 중): 이것은 작은 예산에서의 비교이지 법칙이 아닙니다. DAG 간선 = MoE 디스패치.
  같은 입력 층을 전문가 혼합으로 씁니다. 전문가 img(CNN + 커넥터)와 전문가 txt(LM의 토큰 임베딩), 위치 × 전문가에 대한 라우터 $G$, 각 전문가는 자신에게 배정된 위치에서 배치로 실행되고, 결합은 $X^0 = G_{mntx}Y^x_{mntc}$입니다. $G$가 데이터 유형(이미지 슬롯 또는 글자, 워크플로가 와일드카드로 규칙을 고르듯 어떤 데이터를 보기 전에 알려짐)에 따른 원-핫이면 MoE 출력은 DAG 배선 출력과 1e-6까지 같고, 모든 기울기도 마찬가지입니다(테스트됨). 정확한 관계: DAG 간선은 데이터 유형으로 정해지는 고정 라우터를 가진 MoE 디스패치이고, MoE는 학습된 라우터가 토큰마다 간선을 고르는 DAG입니다. 라우터가 그 라우팅을 학습할 수 있을까? 각 위치의 특징(7×7 풀링된 이미지와 원-핫 id)에 대한 선형 라우터를 전문가를 고정한 채 Switch 부하 균형 손실($\alpha$ = 0.01)로 학습했습니다. Switch top-1(선택된 전문가만 실행, $p$로 스케일)은 신뢰할 수 없습니다. 라우팅 정확도는 모델과 실행에 따라 0에서 0.92까지, 과제 정확도는 0에서 약 0.46까지 다양했습니다. 선택되지 않은 전문가는 기울기를 받지 못해 초기의 잘못된 선택이 결코 수정되지 않고, 균형 손실은 50/50 분할로 끌어당기지만 실제 분할은 5/17이기 때문입니다. 밀집 혼합($G = p$, 두 전문가를 모든 곳에)으로 학습한 뒤 top-1로 사용하면, 라우터는 모든 모델과 실행에서 모달리티 라우팅을 복원하고(위치의 0.97~0.99) 과제 정확도 약 0.35~0.65에 도달하는데, $p < 1$이 출력을 스케일하므로 고정 라우터보다 약간 낮습니다. 올바른 간선을 데이터 유형으로 알 수 있다면, 이를 고정하는 것이 정확하면서도 더 저렴합니다. 시간. 6코어 데스크톱 CPU에서 기본 실행은 기기가 한가할 때 약 66 s 만에 학습되며(다른 무거운 작업과 공유할 때는 최대 2~4분), GIF에 약 15 s가 더 듭니다.
  한가한 실행에서 모놀리스는 35 s, LM 12 s, 커넥터 4.5 s, 미세조정 4 s가 걸렸습니다. 규칙당 작업자 하나일 때 max-plus 임계 경로는 모놀리스, 그다음 evaluate(39 s)이며, DAG 시스템 자체의 사슬 LM → 커넥터 → 미세조정 → evaluate는 약 24 s 걸립니다. 코드는 torch가 GPU를 인식하면 GPU를 선택합니다. 이 프로젝트 환경에는 CPU용 torch 빌드가 있으므로 동봉된 모든 수치는 CPU에서 얻은 것입니다. 데이터. MNIST(Y. LeCun, C. Cortes, C. J. C. Burges), 라이선스 CC BY-SA 3.0: 학습 이미지 3000장과 테스트 이미지 1000장의 균형 잡힌 부분집합이 동봉되어 있습니다(data/mnist_subset.npz, 0.7 MB; data/SOURCES.md에 출처, 체크섬, 처리 과정이 있습니다). 문장은 코드에서 생성됩니다. 해 보기. LM 단계를 줄이기(LM의 정확도가 모든 것의 상한), $\alpha$를 키우기(Switch 라우터가 더 많이 붕괴), 미세조정 없음(0단계), 또는 시드 하나로 시드 간 차이가 얼마나 되는지 보기.'
meanings:
- 규칙 $s$는 규칙 $r$이 쓰는 것을 읽음; 윌리스 고리 문제의 파서로 data/training.smk에서 파싱한 학습 과정
- '와일드카드 seed와 $n$에 대한 작업 그래프: $n$이 없는 규칙은 모든 $n$으로 브로드캐스트되고($I \otimes \mathbb 1$), evaluate는 전부를 모음($\mathbb 1^\top$)'
- '각 규칙의 레벨: train_cnn, train_lm, 모놀리스는 0, 커넥터는 1, 미세조정과 라우터는 2, evaluate는 3'
- 측정된 규칙 소요 시간으로 구한 max-plus 완료 시각; $\max t$가 임계 경로
- 각 이미지에 대한 CNN의 열 개 숫자 확률; 모델 축 $m$은 층마다 그룹 합성곱 하나의 그룹이 됨
- 'DAG 간선: 숫자 확률과 슬롯 벡터 $S_t$ → 위치 $t$의 LM 입력 벡터; $K = 5$개의 소프트 토큰이 숨겨진 첫 단어를 대체'
- '라우터: 데이터 유형(이미지 슬롯 또는 글자)에 따른 원-핫, 또는 위치 특징에 대한 학습된 Switch top-1 소프트맥스'
- '반복된 $x$ ⇒ 합산: MoE 층의 결합; 각 전문가 $Y^x$는 자신에게 배정된 그룹에서만 계산됨'
- 작은 GPT의 다음 글자 로짓(chain_of_thought의 모델 축을 가진 einsum 어텐션)
- 접두어 이후 텍스트에 대한 모델별 손실(nats); $M$개의 손실을 합하면 각 모델이 자기 기울기를 받음
labels:
  seeds: 시드(독립 반복)
  steps_cnn: CNN 사전학습 단계 수
  steps_lm: LM 사전학습 단계 수
  steps_con: 커넥터 단계 수(CNN과 LM 고정)
  steps_ft: 전역 미세조정 단계 수
  steps_router: 학습되는 라우터 단계 수(라우터별)
  lr_ft: 미세조정 학습률
  alpha: 부하 균형 가중치 $\alpha$
