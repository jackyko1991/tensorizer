title: डोरी पर अप्रगामी तरंगें
summary: 'दोनों सिरे बँधी डोरी पर 1D तरंग समीकरण। द्वितीय अवकलज एक आव्यूह (परिमित-अंतर स्टेंसिल $D_{ij}$) बन जाता है, इसलिए एक einsum कई डोरियों के हर बिंदु को एक साथ आगे बढ़ाता है: पहले कुछ गुणावृत्ति (harmonics) और एक खींचकर छोड़ी गई डोरी।'
notes: 'पंक्तियाँ 1 से $n$ एक अकेली गुणावृत्ति $\sin(n\pi x/L)$ की आकृति में शुरू होती हैं और बस अपनी जगह $f_n = nc/2L$ पर "साँस" लेती हैं: यही अप्रगामी तरंग है। खींची गई डोरी (त्रिभुज) कई गुणावृत्तियों का योग है, इसलिए उसका मोड़ दो टुकड़ों में बँटता है जो सिरों तक दौड़ते हैं, उलटते हैं और लौट आते हैं। एक मूल आवर्तकाल $2L/c$ के बाद हर आकृति वापस शुरुआत पर होती है। समय चरण कूरां शर्त $c\,\Delta t \le \Delta x$ का पालन करता है; ऊर्जा $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$ (प्रति इकाई द्रव्यमान घनत्व) स्थिर रहती है क्योंकि डोरी को कुछ भी अवमंदित नहीं करता।'
meanings:
- आंतरिक ग्रिड बिंदु $i$ पर डोरी $b$ का विस्थापन (दोनों बँधे सिरे छोड़ दिए गए हैं)
- 'द्वितीय-अवकलज आव्यूह: विकर्ण पर $-2$, उसके बगल में $1$'
- 'दोहराया गया $j$ ⇒ योग: हर डोरी के लिए $\partial_x^2 u$'
- समय में केंद्रीय अंतर (leap-frog)
- '$D$ के आइगेनमान $\omega_n^2 = -c^2\lambda_n$ देते हैं: गुणावृत्तियाँ'
labels:
  n_harmonics: दिखाई गई गुणावृत्तियाँ
