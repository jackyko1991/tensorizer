source_hash: 176bf5bc914e
title: 分子图神经网络（消息传递）
summary: 分子是一张图，而消息传递神经网络就是对其邻接矩阵做的几次 einsum：每个原子反复对邻居的状态求和，$s_{mic} = A_{mij}h_{mjc}$，分子的预测值则是对原子的求和。训练它预测随机共轭烃的休克尔 π 电子能量后，无论原子如何编号它都给出相同的答案，而且对比训练集中任何分子都大的分子仍然有效，而直接作用于邻接矩阵的普通 MLP 则会失败。
notes: 数据有意采用合成数据，以便确切知道正确答案。每个“分子”都是一个随机的省略氢原子的碳骨架（每个碳最多三个邻居的树，再闭合出一些五元环和六元环）：只是图论意义上的玩具模型，而不是精选的真实化合物集合。其标签是休克尔 π 电子能量：取 $H = \alpha + \beta A$，每个碳一个 π 电子，填充 $A$ 本征值 $\lambda_k$ 最高的轨道，$E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$，网络仅凭图学习 $y = \sum_k o_k\lambda_k$。它从未见过本征值。这里的张量要点是：图神经网络只需要一种新运算，即对邻接矩阵的 einsum $A_{mij}h_{mjc}$，它一次性对每个分子中每个原子的邻居状态求和。所有权重每次只作用于一个原子，原子之间只通过 $A$ 和最终求和组合，因此模型在构造上就具有置换不变性，同一组权重适用于任意大小的分子。控制台显示了这两个性质：重新编号原子使 GNN 输出变化约 $10^{-6}$（float32 舍入），而 MLP 输出变化整个 $|\beta|$ 单位；在含 11–16 个碳、比训练集中任何分子都大的分子上，MLP 在其输入的额外行中从未见过任何东西，因而失败，而 GNN 的误差几乎不增加。与“数键”基线 $aN + bN_{bonds} + c$ 比较：π 能量几乎是可加的（每个碳约 $1.2|\beta|$），GNN 真正的任务是支化、环和奇数电子带来的修正，在这方面它大约把误差减半。四轮消息只能传播四个键，因此依赖整个共轭体系的效应（芳香性、4n 元环）只能近似地学到。这是 Gilmer et al.（ICML 2017）提出的消息传递神经网络（MPNN）框架，他们指出许多早期的分子图网络都符合这一模式，并在 QM9 分子的 DFT 性质上训练了它们。这一家族的模型（SchNet、DimeNet，以及同样利用三维几何的等变网络如 NequIP 或 MACE）如今被广泛用于预测分子性质和拟合原子间势，但它们的好坏取决于训练数据，遇到与训练数据不同的化学体系时可能失效。试试 1 层（只有最近邻）、更少的训练分子或更窄的网络。
meanings:
- 分子 $m$ 碳骨架的邻接矩阵，用零填充到 $N = 16$ 个原子
- 原子特征：碳邻居数（1、2 或 3）的独热编码
- 目标：$A$ 的占据休克尔本征值（eigvalsh），以 $|\beta|$ 为单位的 π 能量
- 对 $f$ 求和：把每个原子嵌入 $C$ 个通道
- 重复的 $j$ ⇒ 对原子 $i$ 的邻居求和：消息
- 对 $c$ 求和：每个分子的每个原子使用同一组权重
- 学到的每原子能量（分子上的颜色）
- 对真实原子的 $i$ 求和：尺寸广延且与原子顺序无关
- 重新编号原子：GNN 输出在浮点精度内保持不变
- 基线：作用于 256 个展平邻接元素的固定尺寸网络
labels:
  n_train: 训练分子数
  epochs: 训练轮数
  width: 通道数 $C$
  layers: 消息传递层数 $L$
  lr: Adam 学习率
