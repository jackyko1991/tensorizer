source_hash: 7c33ee10a4e7
title: 超构透镜的逆向设计
summary: 由亚波长超构原子组成的平面超表面在光上施加相位 $\varphi(x)$。光用角谱法（一次 FFT）传播，自动微分配合 Adam 从平坦的初始状态出发调节每个超构原子，把尽可能多的功率推进焦斑。结果与解析的双曲透镜比较，而同时为两个波长设计（一个批次）则展示了色散上的权衡。
notes: 解析超构透镜使从透镜到焦点的每条路径同相，$\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$，并折叠到 $[0, 2\pi)$ 内，因为超构原子最多只能把光延迟一个波长（这类可见光超构透镜由 Khorasaninejad et al., Science 2016 演示）。这里不给优化器任何公式：它从平坦表面出发，用基于 FFT 的传播算子计算焦斑功率 $\eta$，并通过一次反向传播得到对所有超构原子相位的梯度，这与光子学逆向设计中伴随法给出的信息相同。对单一波长和单一焦点，最佳相位接近双曲相位，优化器会重新发现它（在 $\eta$ 上可能略好，因为焦斑有有限宽度，而标量传播算子并不完全等同于光线图像）。有趣的情形是两个波长：在这个玩具模型中，每个超构原子增加一个折叠到一个波长内的固定光程，因此在 $\lambda_1 \neq \lambda_0$ 时相位按 $\lambda_0/\lambda_1$ 缩放，折叠处不再对齐。于是双曲透镜把红光聚焦在不同的距离上（衍射色差）。在设计模式 'dual' 下，两个波长共享损失，优化器找到一个折中：在 $\lambda_1$ 更好，在 $\lambda_0$ 更差。简化：标量一维光、薄元件相位掩模（每个超构原子都是理想移相器，相邻之间无耦合）、完全透射、玩具色散模型以及周期性边界。真实的逆向设计需要为超构原子求解麦克斯韦方程组；Tseng et al.（"Neural nano-optics", Nature Communications 2021）端到端训练了整个超表面相机的可微模型，Li et al. 综述了逆向设计的超表面（ACS Photonics 2022）。平面透镜能同时聚焦多大带宽存在基本极限（Presutti & Monticone, Optica 2020）。
meanings:
- 2048 个网格点（$\Delta x = 0.05$ μm）及其 FFT 波数
- 设计变量：每个超构原子的相位延迟，以 $\lambda_0$ 处的波长数计，每个 0.25 μm 原子一个值
- 波长 $\lambda_l$ 处的相位；$l$ 是由两个波长组成的批次
- 复数：对倏逝分量 $|k_x| > k$ 为虚数（衰减）
- 重复的 $x$ ⇒ 求和，由 FFT 以 $O(X\log X)$ 完成
- 通过广播传递函数，同时得到每个波长和每个距离处的场
- 重复的 $x$ ⇒ 求和：焦斑 $|x| < \lambda_l f / D$ 内的功率
- 通过 FFT 的自动微分：免费得到伴随法
labels:
  design: 为两个波长设计（dual）或仅为 $\lambda_0$
  wavelength: 设计波长 $\lambda_0$
  wavelength2: 第二波长 $\lambda_1$
  focal_length: 焦距 $f$
  diameter: 透镜直径 $D$
  n_iter: Adam 迭代次数
  lr: Adam 学习率（每步波长数）
