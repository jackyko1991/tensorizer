title: एक छोटा प्रोटीन भाषा मॉडल संपर्क सीखता है
summary: einsum ध्यान वाला दो-परत ट्रांसफ़ॉर्मर, $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$, केवल जालक तह पर रोपे गए युग्मनों वाले पॉट्स मॉडल के अनुक्रमों के छिपाए (masked) अक्षर भरने के लिए प्रशिक्षित होता है। कोई उसे संरचना नहीं बताता, फिर भी उसके सममित, APC-संशोधित ध्यान मानचित्र रोपित संपर्कों की ओर इशारा करते हैं, जो प्रोटीन भाषा मॉडलों के संपर्क हेड के पीछे का विचार है।
notes: 'ध्यान संपर्क क्यों खोजता है? पॉट्स मॉडल में स्थल $i$ का अक्षर, बाकी सब दिए होने पर, केवल उससे युग्मित स्थलों (उसके मार्कोव कंबल) पर निर्भर करता है, इसलिए छिपाए गए अक्षर का अनुमान लगाने का सबसे अच्छा तरीका उसके संपर्क साझेदारों को देखना है, और ध्यान ठीक यही करना सीखता है। Rao et al., "Transformer protein language models are unsupervised structure learners" (ICLR 2021), ने दिखाया कि लाखों प्राकृतिक अनुक्रमों पर प्रशिक्षित बड़े प्रोटीन भाषा मॉडलों के ध्यान मानचित्र संपर्कों को कूटबद्ध करते हैं, जिन्हें कुछ प्रोटीनों पर फ़िट किए गए APC-संशोधित, सममित मानचित्रों पर लॉजिस्टिक समाश्रयण से पढ़ा जाता है। बाद के मॉडल जैसे ESM-2 (2022–2023) ने ऐसे निरूपणों से 3D संरचना की भविष्यवाणी तक कदम बढ़ाया। यहाँ पढ़ना पूरी तरह बिना पर्यवेक्षण के है (हेडों पर सादा औसत), परिवार कृत्रिम है, और परीक्षण हानि की तुलना दो संदर्भ-मुक्त आधार रेखाओं से की जाती है: यूनिग्राम (एक अक्षर वितरण) और प्रति-स्थल प्रोफ़ाइल। प्रोफ़ाइल को पीछे छोड़ने का अर्थ है कि मॉडल संदर्भ, यानी युग्मनों, का उपयोग करता है। सर्पिलाकार
  तह संपर्कों को प्रति-विकर्णों पर रखती है, β-शीट की लड़ियों की तरह; यादृच्छिक युग्म केवल लगभग 5 % बार सही होते। APC उन स्थितियों की पृष्ठभूमि हटाता है जिन पर सभी ध्यान देते हैं। कमज़ोर युग्मन, कम अनुक्रम या एक ही हेड आज़माएँ।'
meanings:
- यादृच्छिक युग्मन खंड केवल उन अवशेषों के बीच जो जालक तह में एक-दूसरे को छूते हैं; गिब्स सैंपलिंग इन्हें एक अनुक्रम परिवार में बदल देती है
- अक्षर $s_{ni}$ का टोकन और स्थिति एम्बेडिंग (छिपाए गए अक्षर [MASK] टोकन का उपयोग करते हैं)
- 'दोहराया गया $c$ ⇒ योग: हर हेड की क्वेरी (कुंजियाँ और मान भी इसी तरह)'
- दोहराया गया $k$ ⇒ योग; हर पंक्ति ध्यान दी गई स्थितियों $j$ पर एक प्रायिकता वितरण है
- 'दोहराया गया $j$, फिर $h, k$ ⇒ योग: हर स्थिति दूसरों से क्या इकट्ठा करती है'
- 15 % छिपाई गई स्थितियों पर वास्तविक अक्षर की क्रॉस-एन्ट्रॉपी, Adam से न्यूनतम की गई
- परीक्षण अनुक्रमों पर औसत ध्यान, प्रति हेड सममित और APC-संशोधित, फिर परतों $l$ और हेडों $h$ पर औसत
