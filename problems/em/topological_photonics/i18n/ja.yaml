source_hash: b20a6dde0710
title: Haldane 格子上のトポロジカルフォトニクス
summary: 複素数の次近接結合をもつ結合光共振器のハニカム配列、すなわちフォトニック Haldane モデル。$k$ グリッド全体での $2\times 2$ ブロッホハミルトニアンから、Fukui–Hatsugai–Suzuki のリンク法（リンク変数に対する einsum）でチャーン数を求める。ジグザグリボンはギャップを横切るエッジ状態を示し、有限のフレークの端に入射した光は切り欠きの周りを一方向に流れるが、自明な格子では先へ進めない。
notes: 単位：結合 $t_1 = 1$、共振器の間隔は 1。$E$ は裸の共振周波数からの離調であり、導波路アレイでは時間 $t$ が伝播距離になる。位相は $\phi = \pi/2$ に固定する。格子は $\lvert M\rvert < 3\sqrt3\,t_2\lvert\sin\phi\rvert$ のときトポロジカルで $C = \pm1$ をもつ。比較用の格子はその 2 倍の質量を用い、$C = 0$ である。Fukui–Hatsugai–Suzuki 法（J. Phys. Soc. Jpn., 2005）は粗いグリッドでも正確な整数を与える。するとバルク–エッジ対応により $\lvert C\rvert$ 本の一方向エッジチャネルが保証される。入射光は下端に隣接するスポットで、バルクギャップ内の周波数にフィルターしてある。後ろ向きに進む状態が存在せず散乱先がないため、光は切り欠きを回り込む。自明な格子では同じ光が単にバルクに広がる。このモデルは Haldane によるもの（PRL, 1988）である。Haldane & Raghu（PRL, 2008）がそのフォトニック版を提案し、Wang, Chong, Joannopoulos & Soljačić（Nature, 2009）は磁気光学フォトニック結晶で一方向のマイクロ波エッジ状態を観測した。Rechtsman et al.（Nature, 2013）はらせん導波路から Floquet 版を作製した。続いてトポロジカル絶縁体レーザー（Bandres et al., Science, 2018）が登場し、Ozawa et al.（Rev. Mod. Phys., 2019）がこの分野をレビューしている。磁場を必要としないバレーホールフォトニック結晶を含むより最近の研究は、この考え方をオンチップの通信波長帯やテラヘルツ導波路へと広げている。$M$ を臨界値より大きくしてみよう：$C$ は 0 に落ち、エッジ状態はバンドから離れ、光はもう切り欠きを回り込めない。
meanings:
- フレークの共振器 $i$ における複素場振幅
- 結合 $t_1$、$t_2 e^{-i\nu_{ij}\phi}$ と離調 $\pm M$ に乱れを加えたもの
- $k\cdot\delta_n$ はグリッド上の各 $k$ について座標 $i$ に対する einsum。$\delta_n$、$b_n$ はボンドベクトル
- $\mu$ の繰り返し ⇒ 和：各 $k$ でのブロッホハミルトニアン
- 下側バンドの固有ベクトル（その位相は任意）
- $a$ の繰り返し ⇒ 和：隣接する $k$ 点間のリンク変数
- 四つのリンクからなるループの位相：ベリー磁束、ゲージ不変
- $a, b, c$ の繰り返し ⇒ 和：連続体のベリー曲率、導関数は autograd による
- 格子ごとに一回の eigh から得る $e^{-iHt}\psi_0$（トポロジカルと自明）
labels:
  t2: 次近接結合 $t_2$
  mass: 副格子離調 $M$
  disorder: ランダム離調の強さ $W$
  defect_radius: 切り欠きの半径 $R$
