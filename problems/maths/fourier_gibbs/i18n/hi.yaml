title: फ़ूरिये श्रेणी और गिब्स परिघटना
summary: ज्याओं से बनी एक वर्ग तरंग, एक आरादंती (sawtooth) और एक त्रिकोणीय तरंग। गुणांक एक einsum हैं (एक संख्यात्मक समाकल, $4/(\pi n)$ और ऐसे सूत्रों से जाँचा गया) और हर आंशिक योग आधार आव्यूह के पहले $N$ स्तंभों के साथ एक आव्यूह गुणनफल $S_N = B\,c$ है। देखें कि लहरें छलाँगों में कैसे सिमटती हैं जबकि अतिलंघन (overshoot) छलाँग के लगभग 9% पर बना रहता है।
notes: 'सटीक गुणांक हैं: विषम $n$ के लिए $b_n = 4/(\pi n)$ (वर्ग), $2(-1)^{n+1}/(\pi n)$ (आरादंती) और विषम $n$ के लिए $\pm 8/(\pi^2 n^2)$ (त्रिकोण); संख्यात्मक समाकल इनसे लगभग $10^{-6}$ तक मेल खाते हैं। छलाँग के पास आंशिक योग अतिलंघन करते हैं। $N$ बढ़ने पर उभार छलाँग की ओर खिसकता है (इसकी चौड़ाई $1/N$ की तरह घटती है) पर इसकी ऊँचाई शून्य की ओर नहीं, बल्कि छलाँग के $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$ गुना की ओर जाती है: $-1$ से $1$ तक की वर्ग तरंग के लिए शिखर $1.179$ के पास बना रहता है। यही गिब्स परिघटना है। श्रेणी फिर भी माध्य में अभिसरित होती है: पार्सेवल से $\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$, इसलिए वर्गित $L^2$ त्रुटि छूटे हुए $b_n^2$ का योग है। $1/n$ की तरह घटते गुणांक (एक छलाँग) $\propto 1/N$ त्रुटि देते हैं; त्रिकोण में केवल एक मोड़ (kink) है, इसके गुणांक $1/n^2$ की तरह और त्रुटि $1/N^3$ की तरह घटती है। अधिक चिकने फलन तेज़ी से अभिसरित होते हैं। संख्यात्मक गुणांकों को भटकते देखने के लिए मोटा ग्रिड (छोटा $X$) आज़माएँ।'
meanings:
- '$(-\pi, \pi)$ पर $X$ समान कोशिकाओं के मध्यबिंदु और उनकी चौड़ाई $h$: समाकलन भार'
- $x_j$ पर प्रतिचयित तरंग $w$ (वर्ग, आरादंती, त्रिकोण)
- 'आधार आव्यूह: स्तंभ $n$ ग्रिड पर $\sin(n x)$ है'
- 'दोहराया गया $j$ ⇒ योग: ग्रिड पर भारित योग के रूप में समाकल $b_n$'
- 'दोहराया गया $n$ ⇒ योग: $N$ हार्मोनिकों वाला आंशिक योग, एक आव्यूह गुणनफल'
- $d = F - S$ के साथ वर्गित $L^2$ त्रुटि; दोहराया गया $j$ ⇒ योग
labels:
  n_max: हार्मोनिकों की सबसे बड़ी संख्या $N$
  n_x: ग्रिड बिंदु $X$
