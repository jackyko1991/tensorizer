title: Игра «Жизнь» Конвея как свёртка
summary: 'Не физика, просто для удовольствия: сетка из живых и мёртвых клеток, где каждая клетка смотрит на восемь своих соседей. Их подсчёт — это свёртка $3\times3$, записанная как один einsum по развёрнутым фрагментам, а правило рождения/выживания — это сравнение тензоров, поэтому все клетки нескольких полей обновляются одновременно. Наблюдайте за глайдерами, глайдерным ружьём и случайными «супами».'
notes: Трёх чисел (рождение при 3, выживание при 2 или 3) достаточно для глайдеров, которые смещаются по диагонали на одну клетку каждые 4 поколения, осцилляторов вроде пульсара (период 3) и глайдерного ружья Госпера, которое выпускает новый глайдер каждые 30 поколений, так что его население растёт на 5 за период. $R$-пентамино всего из 5 клеток продолжает меняться 1103 поколения на неограниченной сетке; на конечном поле край обрывает этот процесс раньше. Случайные супы выгорают, оставляя устойчивые фигуры, мигалки и улетающие глайдеры; серые кривые показывают, насколько похож этот спад от супа к супу. Тот же приём «развернуть и einsum» используется для вычисления слоя свёрточной нейронной сети.
meanings:
- 'клетка $(i, j)$ поля $b$: 1 — живая, 0 — мёртвая'
- 'единицы вокруг клетки и 0 в центре: клетка не является собственным соседом'
- фрагмент $3\times3$ вокруг каждой клетки $p$, уложенный в столбец; клетки за пределами поля считаются мёртвыми
- 'повторяющийся $k$ ⇒ суммирование: живые соседи каждой клетки, то же, что свёртка с $K$'
- 'B3/S23: рождение ровно при 3 соседях, выживание при 2 или 3, иначе смерть'
- население каждого поля в каждом поколении
