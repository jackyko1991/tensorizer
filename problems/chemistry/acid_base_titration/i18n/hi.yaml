title: अम्ल–क्षार अनुमापन वक्र
summary: सोडियम हाइड्रॉक्साइड को बूँद-बूँद करके एक प्रबल अम्ल, एक दुर्बल अम्ल और फ़ॉस्फ़ोरिक अम्ल में मिलाया जाता है। हर क्षेत्र के लिए पाठ्यपुस्तक के अलग-अलग शॉर्टकट के बजाय, एक ही आवेश संतुलन को द्विभाजन (bisection) द्वारा $[\mathrm{H^+}]$ के लिए हल किया जाता है, हर अम्ल और हर आयतन के लिए एक साथ, एक $(A, N)$ टेंसर में। वक्रों से तुल्यता बिंदु ($d\mathrm{pH}/dV$ के शिखर), बफ़र क्षेत्र और स्पीशीज़ अंश $\alpha_j(\mathrm{pH})$ मिलते हैं।
notes: 'आवेश संतुलन वक्र पर हर जगह लागू होता है, इसलिए यह शुरुआत, बफ़र क्षेत्र, तुल्यता बिंदु और क्षार की अधिकता के अलग-अलग नुस्ख़ों की जगह ले लेता है। हर पद pH का एकदिष्ट (monotonic) फलन है, जिससे द्विभाजन सुरक्षित है: यह हमेशा अंतराल को आधा करता है और मूल को चूक नहीं सकता। प्रबल अम्ल (pKa $\approx -6$ के रूप में मॉडल किया गया) तीखी छलाँग देता है और तुल्यता पर pH 7 होता है, जहाँ केवल $\mathrm{Na^+}$, $\mathrm{Cl^-}$ और जल बचते हैं। दुर्बल अम्ल ऊँचे pH से शुरू होता है, बफ़र क्षेत्र में धीरे-धीरे चढ़ता है और उसका तुल्यता बिंदु 7 से ऊपर होता है, क्योंकि उसका संयुग्मी क्षार $\mathrm{A^-}$ स्वयं एक दुर्बल क्षार है। तुल्यता के आधे रास्ते पर $[\mathrm{HA}] = [\mathrm{A^-}]$, इसलिए हेंडरसन–हैसलबाख, $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$, देता है $\mathrm{pH} = \mathrm{p}K_a$: pKa मान अनुमापन से ही मापे जाते हैं। फ़ॉस्फ़ोरिक अम्ल (pKa ≈ 2.15, 7.20 और 12.35, 25 °C पर अनुमानित मान) दो छलाँगें दिखाता है; तीसरा प्रोटॉन इतना दुर्बल अम्लीय है कि 0.1 M NaOH उसे दृश्य रूप
  से नहीं खींच पाता, और उसकी छलाँग क्षार की अधिकता में खो जाती है। स्पीशीज़ पैनल इसका कारण दिखाता है: हर $\alpha_j$ दो pKa मानों के बीच शिखर पर होता है, और दो पड़ोसी ठीक $\mathrm{pH} = \mathrm{p}K$ पर बराबर होते हैं। सरलीकरण: सक्रियताओं के बजाय सांद्रताएँ, 25 °C, हवा से कोई CO₂ नहीं।'
meanings:
- अम्ल $a$, प्रोटॉन $i$; अनुपस्थित प्रोटॉन $+\infty$ ($K = 0$) से भरे गए
- 'संचयी स्थिरांक: pKa मानों का $-$ संचयी योग, $\beta_{a0} = 1$'
- $V_0$ अम्ल को $V_n$ क्षार के साथ मिलाने के बाद अम्ल और सोडियम
- स्पीशीज़ अंश; हर में $k$ पर योग softmax प्रसामान्यीकरण है
- 'दोहराया गया $j$ ⇒ योग: प्रति अम्ल अणु मुक्त प्रोटॉन $\bar n$'
- $\mathrm{pH} = -\log_{10}h$ पर द्विभाजन, सभी अम्ल और आयतन एक टेंसर में
- ढलान; इसके शिखर (max-pool से ज्ञात) तुल्यता बिंदु हैं
labels:
  c_acid: अम्ल सांद्रता $c_a$
  V0: अम्ल आयतन $V_0$
  c_base: NaOH सांद्रता $c_b$
  V_max: NaOH का अधिकतम आयतन
  pKa_weak: दुर्बल अम्ल का pKa (एसिटिक ≈ 4.76)
