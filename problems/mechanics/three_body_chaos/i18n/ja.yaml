source_hash: d014ac5184c9
title: 三体問題のカオス：ピタゴラス問題
summary: ブラウの問題：質量 3、4、5 の物体が 3-4-5 の三角形の頂点に静止した状態から出発し、ひとつが弾き出されるまでカオス的に踊ります。$\delta = 10^{-6}$ だけずらして始めた双子の計算を同じテンソル（実行インデックス $k$）で積分すると、両者の距離は指数関数的に増大し、$|\Delta| \propto e^{\lambda t}$、やがて運命が分かれます。
notes: 難しいのは近接遭遇です。2 つの物体が約 $0.01$ の距離ですれ違い、そこでは力が普段の $10^4$ 倍になります。固定ステップではそこで破綻するか、他の場所で極端に遅くなるため、ソルバーは適応型の Dormand–Prince 5(4) 法を使います。各ステップで 5 次と 4 次の答えを比べ、近接通過の付近では dt が自動的に小さくなり、その後また大きくなります。ソフトニングは使わないので、$G = 1$ の厳密なニュートン重力です。2 つの計算は同じステップを共有するので、同じ時刻で比較できます。運動がカオス的なので許容誤差が重要です。既定値 $10^{-11}$ では、参照計算は古典的な結果（Szebehely と Peters, 1967）を再現します：最も軽い物体（$m = 3$）が $t \approx 60$ ごろに放出され、質量 4 と 5 は密な連星として反対方向へ去ります。わずか $\delta$ ずらした双子は $t \approx 45$ までに完全に離れ、別の歴史をたどります。$|\Delta|$ の曲線はぎざぎざです。近接遭遇のたびに、双子がほんの少し早くまたは遅く高速で通過するためスパイクが現れ、増加は段階的です。フィットした $\lambda$ は、$t = 0$ から $|\Delta|$ が $0.1$ を超えたまま戻らなくなるまでの平均的な傾向です。許容誤差を緩めてみてください。参照計算そのものの運命が変わり、数値誤差もまた摂動であることがわかります。
meanings:
- 実行 $k$（$k = 0$ 参照、$k = 1$ 双子）における物体 $a$ の位置、平面成分 $i$
- 質量 3、4、5
- $a$ から $b$ への変位。両方の実行の全ペアをブロードキャストで
- $j$ の繰り返し ⇒ 和：各ペアの距離の 2 乗
- $b$ の繰り返し ⇒ 和：物体 $a$ が受ける引力の合計。$k$ については和をとらず、各実行は独立
- 適応 Dormand–Prince ステップの 7 つの段の傾き。5 次と 4 次の組み合わせの差が誤差の推定値
- 双子と参照の位置と速度における距離
- 実行が完全に分かれるまでの $\ln|\Delta|$ 対 $t$ の傾き：リャプノフ指数
labels:
  t_max: シミュレーション時間
  log10_delta: 双子のずれ $\log_{10}\delta$
  log10_tol: 許容誤差 $\log_{10}\mathrm{tol}$
