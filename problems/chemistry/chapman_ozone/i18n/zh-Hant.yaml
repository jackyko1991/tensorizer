source_hash: 909629a494c2
title: Chapman 機制與臭氧層
summary: 由陽光驅動的 O、O₂ 與 O₃ 之間的四個反應造就了臭氧層。寫成反應網路 $\dot c = S\,r(c)$，搭配 $3\times4$ 的化學計量矩陣，這個剛性系統以後向 Euler 法加上 Newton 迭代，在所有高度同時積分，從日出一直到數百年後：O 與 O₃ 在數秒內互相轉換，奇氧需要數天到數百年才會穩定，而穩態在約 30 km 處達到峰值。
notes: Sydney Chapman（1930）以四個反應解釋了臭氧層。波長短於 242 nm 的紫外光使 $\mathrm{O_2}$ 分解（1）；每個 O 原子很快就藉由第三體 $\mathrm M$ 帶走能量而與 $\mathrm{O_2}$ 結合（2）；臭氧吸收紫外光與可見光後又分解（3），這正是它保護地面的方式，但這並不會消滅「奇氧」$\mathrm O_x = \mathrm O + \mathrm{O_3}$；只有 $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$（4）才會。反應（2）與（3）在毫秒到分鐘內使 O 與 $\mathrm{O_3}$ 循環，而（1）與（4）在平流層上部需數天、在低處需數十年以上才決定總量：這是時間尺度相差 $10^{14}$ 的剛性系統，顯式步進需要數十億步，而後向 Euler 法（對任何 $\Delta t$ 都穩定）只需在 $\log t$ 上均勻分布的 300 步。$S$ 的每一行都守恆氧原子，而後向 Euler 法能精確保持這類線性不變量。平衡兩對反應得到 $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$：往下走時，空氣（以及 $[\mathrm{O_2}]^{3/2}$）呈指數變濃，而分解 $\mathrm{O_2}$ 的光被耗盡，乘積在斜向 $\mathrm{O_2}$ 光學深度約為 3 處達到峰值。速率常數 $k_2$、$k_4$ 取自 JPL 評估值（近似值）；光解速率對每種分子只用單一有效波段與示意性參數，代替對太陽光譜的積分，且太陽始終照耀。在約 18 km 以下，奇氧壽命甚至超過最長的模擬時間，因此這些高度永遠不會穩定；在真實大氣中，風會把臭氧帶到那裡。僅有 Chapman 化學會給出過多的臭氧（此處峰值約 $8\times10^{12}$ cm$^{-3}$，15 km 以上約 380 DU，而觀測值約為 20–25 km 處的 $5\times10^{12}$ cm$^{-3}$ 與 300 DU）。缺少的匯是催化循環 $\mathrm X + \mathrm{O_3} \to \mathrm{XO} + \mathrm{O_2}$、$\mathrm{XO}
  + \mathrm O \to \mathrm X + \mathrm{O_2}$，每個催化劑可重複進行反應（4）許多次：NOₓ（Crutzen，1970），以及來自 CFC 的氯（Molina 與 Rowland，1974），這正是臭氧洞與《蒙特婁議定書》背後的化學（1995 年諾貝爾獎）。
meanings:
- 高度 $a$ 處 $\mathrm O$、$\mathrm{O_2}$、$\mathrm{O_3}$ 的數密度，單位 cm$^{-3}$
- 反應 $r$ 淨生成的物種 $s$ 分子數；第 1 行對 $\mathrm{O_2} \to 2\,\mathrm O$ 為 $(2, -1, 0)$
- 重複的 $s$ ⇒ 求和：每個反應生成的氧原子，全為零
- 四個反應的質量作用速率
- 重複的 $r$ ⇒ 求和：$dc/dt$
- 網路的 Jacobian，對重複的 $r$ 求和
- 後向 Euler 步的一次 Newton 更新，每個高度解一個 $3\times3$ 系統
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$ 與 $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$（JPL，近似值）
- 經上方 $\mathrm{O_2}$ 與 $\mathrm{O_3}$ 柱衰減的光解速率（示意性單波段模型）
- 由 $[\mathrm O]$ 的二次方程式得到的精確 Chapman 穩態
labels:
  sza: 太陽天頂角
  log10_t_end: 模擬時長 $\log_{10}(t/\mathrm{s})$
