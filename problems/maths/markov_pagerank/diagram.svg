<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A small directed graph of five web pages with links between them; a surfer on one page follows a link with probability d or teleports to a random page with probability 1 minus d; one page is dangling with no outgoing links">
  <defs>
    <marker id="link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- links -->
    <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#link)">
      <line x1="52" y1="48" x2="98" y2="36"/>
      <line x1="112" y1="44" x2="98" y2="94"/>
      <line x1="84" y1="104" x2="50" y2="64"/>
      <line x1="124" y1="34" x2="168" y2="54"/>
      <line x1="102" y1="108" x2="160" y2="120"/>
      <line x1="170" y1="68" x2="104" y2="100"/>
    </g>
    <!-- pages -->
    <circle cx="40" cy="52" r="12" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="112" cy="32" r="12" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="94" cy="106" r="12" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="180" cy="60" r="12" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="174" cy="124" r="12" fill="#93c5fd" stroke="#dc2626" stroke-width="2"/>
    <text x="190" y="150" font-size="11" fill="#b91c1c">dangling</text>
    <!-- surfer on page at (112, 32) -->
    <circle cx="112" cy="32" r="4" fill="#f59e0b"/>
    <text x="140" y="34" font-style="italic" fill="#b45309">d</text>
    <!-- teleport -->
    <path d="M126,24 C170,0 220,10 214,40" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="198" y="64" font-size="13" fill="#b91c1c">1 − <tspan font-style="italic">d</tspan></text>
    <text x="12" y="140" font-size="13"><tspan font-style="italic">G</tspan> = <tspan font-style="italic">d S</tspan> + (1 − <tspan font-style="italic">d</tspan>)/<tspan font-style="italic">N</tspan></text>
  </g>
</svg>
