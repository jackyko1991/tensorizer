<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A Turing machine: a tape of cells holding 0s and 1s, a head pointing at one cell, and a state box showing the current state q and the rule table delta that gives the symbol to write, the move left or right and the next state">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- tape: 9 cells of 24 px from x = 12, y = 104 to 128, fading off both ends -->
    <line x1="4" y1="104" x2="236" y2="104" stroke="#374151" stroke-width="2"/>
    <line x1="4" y1="128" x2="236" y2="128" stroke="#374151" stroke-width="2"/>
    <g stroke="#374151" stroke-width="1.5">
      <line x1="12" y1="104" x2="12" y2="128"/><line x1="36" y1="104" x2="36" y2="128"/>
      <line x1="60" y1="104" x2="60" y2="128"/><line x1="84" y1="104" x2="84" y2="128"/>
      <line x1="108" y1="104" x2="108" y2="128"/><line x1="132" y1="104" x2="132" y2="128"/>
      <line x1="156" y1="104" x2="156" y2="128"/><line x1="180" y1="104" x2="180" y2="128"/>
      <line x1="204" y1="104" x2="204" y2="128"/><line x1="228" y1="104" x2="228" y2="128"/>
    </g>
    <!-- cells holding 1 -->
    <g fill="#93c5fd" stroke="#1e40af" stroke-width="1">
      <rect x="61" y="105" width="22" height="22"/>
      <rect x="85" y="105" width="22" height="22"/>
      <rect x="133" y="105" width="22" height="22"/>
    </g>
    <rect x="109" y="105" width="22" height="22" fill="#fef3c7"/>
    <g font-size="13" text-anchor="middle">
      <text x="24" y="121" fill="#9ca3af">0</text><text x="48" y="121" fill="#9ca3af">0</text>
      <text x="72" y="121">1</text><text x="96" y="121">1</text><text x="120" y="121">0</text>
      <text x="144" y="121">1</text><text x="168" y="121" fill="#9ca3af">0</text>
      <text x="192" y="121" fill="#9ca3af">0</text><text x="216" y="121" fill="#9ca3af">0</text>
    </g>
    <text x="10" y="148" font-size="12" fill="#374151">tape <tspan font-style="italic">T</tspan></text>
    <!-- head: triangle pointing at the cell it reads -->
    <path d="M110,84 L130,84 L120,101 z" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="134" y="96" font-style="italic">h</text>
    <!-- state box -->
    <rect x="96" y="18" width="48" height="40" rx="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-style="italic">q</text>
    <line x1="120" y1="58" x2="120" y2="84" stroke="#374151" stroke-width="2"/>
    <!-- rule and moves -->
    <text x="152" y="34" font-size="13"><tspan font-style="italic">δ</tspan>(<tspan font-style="italic">q</tspan>, <tspan font-style="italic">r</tspan>)</text>
    <text x="152" y="52" font-size="12" fill="#374151">→ (<tspan font-style="italic">w</tspan>, <tspan font-style="italic">m</tspan>, <tspan font-style="italic">q′</tspan>)</text>
    <line x1="104" y1="140" x2="80" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="136" y1="140" x2="160" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="114" y="146" font-size="12" fill="#b91c1c">±1</text>
    <text x="88" y="36" font-size="12" fill="#374151" text-anchor="end">state</text>
    <text x="88" y="52" font-size="11" fill="#6b7280" text-anchor="end">halt: <tspan font-style="italic">H</tspan></text>
  </g>
</svg>
