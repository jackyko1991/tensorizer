source_hash: 96c00309dd36
title: '동맥류 CFD: OpenFOAM + VMTK 작업 흐름을 텐서로 다시 만들기'
summary: 공개(CC0) TOF-MRA 영상에서 분할한 실제 두개내 동맥류를 지나는 박동성 혈류를 표준 연구 작업 흐름(VMTK 중심선과 유동 연장, OpenFOAM 방식의 비압축성 솔버, 그다음 벽면 전단응력, TAWSS, OSI)에 따라 계산하며, 모든 단계를 텐서 연산으로 씁니다. 솔버는 Poiseuille 유동, Womersley 유동, 그리고 원관과 같은 동맥류 격자에서의 OpenFOAM 계산으로, 중심선은 VMTK로 검증합니다. 교육용일 뿐 임상용이 아닙니다.
notes: '작업 흐름. 전형적인 동맥류 연구는 내강을 분할하고 VMTK(Antiga 외 2008)로 다듬은 뒤 OpenFOAM(Weller 외 1998)으로 유동을 풀고 벽면 전단응력을 후처리합니다. 여기서는 모든 단계를 우리가 직접 텐서로 작성했으며, 두 GPL 프로젝트 어디에서도 코드를 복사하지 않았습니다. VMTK 단계와 그 대체: vmtksurfacesmoothing, vmtksurfaceremeshing, vmtkflowextensions(-adaptivelength 1 -extensionratio 5)는 STL 파일을 만들기 위해 오프라인에서 한 번만 실행했습니다. vmtkcenterlines -seedselector profileidlist(Voronoi 다이어그램, $|\nabla T| = 1/R$에 대한 fast marching, 최급강하 역추적)는 solve.centrelines가 됩니다: 내접 반지름 $R$은 각 복셀의 벽면 거리이고, 아이코날 방정식은 26-이웃 그래프에서 min-plus 스윕을 반복해 풉니다(fast marching의 텐서 친화적 대체이며, 그래프가 이미 중축에 있는 Voronoi 다이어그램이 아니라 내강 전체이므로 속도는 $R^2$). 모든 출구에서 선행 노드를 동시에 거슬러 올라갑니다. OpenFOAM의 icoFoam/pimpleFoam과 우리 코드: lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh'']; phi → u; fvc::div(phi) → divergence; fvm::laplacian(p)와 그 PCG 풀이 → pressure_matrix와 pcg; PISO 압력 보정 → project(스텝마다 한 번의 Chorin 투영); fvm::laplacian(nu, U) → face_laplacian; div(phi,U) → 준라그랑주 advect; 함수 객체 wallShearStress → wss_at. 격자: STL의 정육면체 복셀을 쓰고, 벽에서는
  가상 경계의 고스트 값을 씁니다. 형상: 기본값은 Lausanne TOF-MRA Aneurysm Cohort(Di Noto 외 2022; OpenNeuro ds003949, CC0)의 피험자 074의 동맥류입니다. 표지된 동맥류 주변 28 mm를 잘라 임계값으로 분할하고 marching cubes로 격자를 만든 뒤 매끄럽게 하고 연장했습니다(data/SOURCES.md); 입구 하나, 출구 셋. 선택지 "synthetic"은 우리가 만든 분지부 동맥류(CC0)입니다. 확인한 다른 데이터셋: AneuriskWeb(CC BY-NC)과 AneuX(CC BY-NC 4.0)는 비상업용이고, IntrA와 AnXplore는 라이선스를 밝히지 않으며, Vascular Model Repository는 자체 연구 라이선스를 쓰고, 킬의 팬텀 STL(CC BY 4.0)은 매우 가는 가지를 가진 벽 껍질입니다. 유입: 해석적 내경동맥 유사 파형(평균 4.58 ml/s, 최대/평균 1.66, Ford 외 2005, 주기 1 s)을 Murray 법칙으로 입구 반지름에 맞춰 조정하고 Womersley 분포로 줍니다; 출구 압력은 0. 혈액: 뉴턴 유체, $\nu = 3.5\times10^{-6}$ m²/s, $\rho = 1060$ kg/m³; 강체 벽. 잔차(기본 실행): 원관 대 OpenFOAM v1912 pimpleFoam, 축 속도 L2 1.2 %, 위상 −10 mrad, WSS L2 2.5 %; 원관 대 Womersley 정확해, L2 0.4 %; 중심선 대 VMTK 1.5.0, 평균 거리 0.20 mm(0.5 복셀), 최대 0.5 mm, 반지름 차이 평균 0.12 mm; 동맥류 대 polyMesh로 내보낸 우리 복셀 격자(같은 유입과 출구)에서의 pimpleFoam, 단면 |u| L2 35 %, 수축기 최대 WSS L2 38 %, TAWSS L2 32 %. 마지막 차이는 큽니다: 시간 간격을 4분의 1로 줄여도 같았으므로, 원인은 서로 다른 벽 처리(매끄러운 면 위의 우리 고스트
  값 대 OpenFOAM의 계단형 면), 출구 위치, 그리고 두 코드 모두 수렴하지 않은 거친 격자에서의 이류 기법입니다. 동맥류 결과는 정성적으로 읽으십시오. 압력 0 출구는 가장 작은 가지에 유량을 너무 많이 보내고 비현실적인 압력 강하를 줍니다. 출력: GIF 외에 results/aneurysm.pvd는 벽(WSS, TAWSS, OSI), 유선, 추적 입자의 ParaView 시계열입니다. 주의: 임계값 분할에 기반한 거친 교육용 시뮬레이션이며 임상용이 아닙니다. 낭 안의 낮은 WSS와 높은 OSI는 문헌에서 동맥류의 성장 및 파열과 연관되지만, 증거는 상충하며 논쟁 중입니다(Meng 외 2014). OpenFOAM과 VMTK 참조는 오프라인에서 한 번 만들었으며, 이 문제나 테스트가 실행하지 않습니다.'
meanings:
- 각 복셀 면의 소유 셀과 이웃 셀(OpenFOAM의 owner/neighbour 목록과 같음)
- 면 법선 방향 속도(OpenFOAM의 플럭스 $\phi_f = u_f h^2$)
- '면에 대한 두 번의 index_add 호출: fvc::div(phi)'
- 면에서 조립한 $-\nabla^2$(fvm::laplacian); 벽과 입구는 Neumann, 출구는 $p = 0$
- 켤레 기울기법, Jacobi와 성긴 집합체 보정
- 같은 방향의 이웃 여섯 개; 고스트 값으로 벽에서 정확히 $u = 0$
- '준라그랑주: 각 면을 유동을 따라 거슬러 추적하고 보간(grid_sample)'
- $Q(t)$의 조화 성분별 Womersley 분포, 복소 인수의 Bessel 함수 $J_0, J_1$
- 벽에서 $u = 0$를 지나고 안쪽 법선을 따라 $h$, $2h$의 표본을 지나는 포물선
- 기록한 주기에 대한 평균, tau의 모양은 (T, V, 3)
- 벽면 거리 = 최대 내접구의 반지름
- 삼선형 보간한 속도장을 따라 입구에서 시작하는 RK4 유선을 일괄 계산
- 26-이웃 복셀 그래프에서 아이코날 방정식의 min-plus(Bellman–Ford) 스윕
labels:
  geometry: '형상: 실제(로잔 TOF-MRA, CC0) 또는 합성'
  voxel: 복셀 크기 $h$
  cycles: 계산할 심장 주기 수(마지막 주기를 기록)
  dt_ms: 시간 간격 $\Delta t$
  frames: 주기당 애니메이션 프레임 수
