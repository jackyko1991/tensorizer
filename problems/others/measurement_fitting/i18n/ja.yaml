source_hash: 2ae828bc3a14
title: テンソルで実験データをフィッティングする
summary: 減衰振動子の（合成された）実験室測定データを、各点の誤差棒 $\sigma_i$ とともに最尤法でフィットします。測定モデルは明示的な誤差項 $\varepsilon_i$ を持ち、その広がりには未知の余分なばらつき $s$ が含まれます。autograd が $-2\ln L$ を最小化し、ヤコビ行列とヘッセ行列がパラメータの不確かさを与え、線形の部分問題は最小二乗法を一度の lstsq で解けることを示します。
notes: 測定値がモデルと完全に一致することはありません：$x_i = f(t_i;\theta) + \varepsilon_i$。統計が扱うのはこの誤差項 $\varepsilon_i$ です。示された誤差棒がすべてなら $\varepsilon_i \sim N(0, \sigma_i^2)$ であり、尤度の最大化は $\chi^2 = \sum_i ((x_i - f_i)/\sigma_i)^2$ の最小化（重み付き最小二乗法）と同じです。実際の実験では、誤差棒が示すよりもばらつきが大きいことがよくあります（振動、モデル化されていないドリフト）。そこでここでは広がりを $\sigma_{tot,i}^2 = \sigma_i^2 + s^2$ とし、未知の余分なばらつき（ジッター）$s$ を5つの物理パラメータと一緒にフィットします。 $-2\ln L$ の中の $\ln 2\pi\sigma_{tot,i}^2$ の項は、巨大な $s$ ですべてを説明してしまうことを防ぎます。measurements.csv のデータは合成で、 0.5–1 mm の誤差棒に加えて $s = 0.8$ mm で生成されています。$\chi^2$ だけのフィットは $\chi^2/\mathrm{dof} \approx 2.5$ に終わり、誤差の過小評価を示します。一方 $s$ をフィットすると、規格化残差 $r_i = (x_i - f_i)/\sigma_{tot,i}$ は $N(0,1)$ に従い、$\chi^2/\mathrm{dof} \approx 1$ となります。 autograd は Adam（アニメーションの反復）と L-BFGS（最後の仕上げ）に $-2\ln L$ の勾配を与えます。不確かさは最小点での $-2\ln L$ の曲率から得られます：ヤコビ行列 $J_{ip} = \partial r_i/\partial\theta_p$ を使った $C = (J^TJ)^{-1}$、または $s$ を含める場合は完全なヘッセ行列による $C = 2H^{-1}$ です。線形と非線形の最小二乗法：$\gamma$ と $\omega$ を固定すると、モデルは $(A\cos\varphi, A\sin\varphi, c)$ について線形なので、最良値は一度の
  lstsq で求まります（反復なし、解は一意）。初期推定はこうして $\omega_0, \gamma_0$ から作られます。 $\gamma$ と $\omega$ は非線形に入るので反復探索が必要で、局所最小に捕まることがあります。悪い $\omega_0$（間違った周波数に固定されることがある）、大きな学習率、あるいはジッターをオフにして試してみてください。簡略化：独立なガウス誤差、$t$ には誤差なし、共分散は局所的な曲率のみから求める。
meanings:
- 点 $i$ の時刻、測定位置、示された誤差棒。measurements.csv から読み込む
- $(A, \gamma, \omega, \varphi, c, \ln s)$。$\ln s$ をフィットすることでジッター $s$ を正に保つ
- 各測定時刻での減衰振動子モデル
- 誤差項 $\varepsilon_i$ の広がり：誤差棒と余分なばらつきを二乗和で足し合わせる
- 繰り返された $i$ ⇒ 和をとる。$s = 0$ なら $\chi^2$ に定数を足したもの
- 各規格化残差が各パラメータでどう変わるか
- ガウス–ニュートン共分散 $C$：不確かさ $\sqrt{C_{pp}}$（$i$ について和）
- $\ln s$ を含む共分散。$-2\ln L$ のヘッセ行列から
- $\gamma, \omega$ を固定するとモデルは $\beta = (A\cos\varphi, A\sin\varphi, c)$ について線形
labels:
  omega0: 初期推定 $\omega_0$
  gamma0: 初期推定 $\gamma_0$
  lr: Adam の学習率
  iterations: Adam の反復回数
  jitter: 余分なばらつき $s$ をフィットする
