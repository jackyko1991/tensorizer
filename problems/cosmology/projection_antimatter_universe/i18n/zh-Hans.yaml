title: 反物质可能在哪里？反物质宇宙的判据
summary: 这是一个推测性假说，并非已确立的物理。第 2 步发现，一条穿过每个时间切片的世界线给出等量的物质与反物质，而我们看到约 $10^{80}$ 个重子且没有反物质。出路是一条在全局上平衡的世界线，反物质位于遥远之处或在一个镜像宇宙中。本步骤列出这样的反物质宇宙必须满足的条件，并用数据逐一检验每个判据。宇宙线中没有反原子核，星系团也没有湮灭伽马射线。区域至少必须与视界一样大，约 16 Gpc。一条随机世界线的可能性低得惊人。剩下的是 Boyle、Finn 与 Turok 的 CPT 对称宇宙，其预言（最轻的中微子无质量、$r = 0$）迄今与数据相符，但也可能失败。
notes: 状态：推测性。这是作者本人的假说（见系列说明），并非已确立的物理。投影假说的第 7 步，是公设 P3（所有粒子都是同一个物体的投影）的一个理论步骤。第 1 步（cosmology/projection_postulate）陈述了公设。第 2 步（cosmology/projection_one_particle）排除了 P3 的最简单形式：一条闭合世界线穿过每个时间切片时，向前（物质）与向后（反物质）的次数一样多，一条开放世界线最多增加一个净粒子，而宇宙中约有 $9\times10^{79}$ 个重子且没有反物质。第 3 到 6 步（projection_dimension_budget、projection_singularity_fold、projection_bell_test、projection_telescope_tests）检验了 P5、P4 与 P1-P2。本步骤采取第 2 步的出路。世界线在全局上是平衡的，而反物质位于我们的视界之外或在一个反宇宙中。问题在于，这样的反物质宇宙必须满足什么条件才能与公设相符，以及它是否满足。先讲已知的物理。Sakharov 条件（1967）以重子数破坏、C 与 CP 破坏以及偏离平衡来解释物质的过剩。它们预言一个处处由物质构成的宇宙，其 $\eta = n_B/n_\gamma = 6.1\times10^{-10}$（Planck 2018，$\Omega_b h^2 = 0.0224$）。另一种可能，即物质与反物质区域彼此分隔的对称宇宙，自 1960 年代起就有人研究（Alfvén 与 Klein、Omnès）。Steigman（ARA&A 14, 339, 1976）综述了相关检验，而 Cohen、De Rújula 与 Glashow（ApJ 495, 539, 1998）为可见宇宙内存在区域的情形下了定论。所有数据都来自 data/antimatter_criteria.csv，其中收录了引用的数字及其来源。世界线所在空间的维数 $D$ 是一个参数。只有它的时间坐标会进入计算，因此没有任何结果取决于 $D$。判据 1：附近没有混入反物质。BESS-Polar 在约 4800 万个氦原子核中没有发现反氦。95% 上限为：假设类似氦的能谱时，反氦/氦 $< 6.9\times10^{-8}$；不作此假设时为
  $1.0\times10^{-7}$（Abe et al., PRL 108, 131301, 2012）。AMS-02 没有发表任何反原子核的探测结果。伽马射线：在星系团的热气体中，比例为 $f$ 的反质子以速率 $f\,n_p^2\langle\sigma v\rangle$ 湮灭，其中 $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s（一个数量级上的选择）。在这里采用的 π 介子衰变能谱中，每次湮灭给出 2.1 个 100 MeV 以上的光子。对后发座星系团（beta 模型，$n_0 = 3.4\times10^{-3}$ cm$^{-3}$，$r_c = 291$ kpc，$\beta = 0.75$）与 Fermi-LAT 上限 $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$（Ackermann et al., ApJ 819, 149, 2016），这给出 $f < 9\times10^{-8}$。满足：任何反物质都必须位于星系团之外，且超出宇宙线所能到达的范围，而宇宙线被局限在数十 Mpc 之内。判据 2：我们的视界内没有区域。如果共动尺寸为 $d$ 的物质与反物质区域相互接触，那么复合之后在它们的壁上发生湮灭是无法避免的。这里的模型是 Cohen、De Rújula 与 Glashow 论证的简化版本。对边长为 $d$ 的立方体，单位体积的壁面积为 $3/d$（在 $n$ 维中为 $n/d$，已检验），而重子以气体声速的 $\kappa$ 倍流入壁中。气体温度在 $z\approx150$ 之前跟随 CMB 温度，之后绝热冷却。每次湮灭经由中性 π 介子衰变给出 3 个光子。光子红移到今天，$dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$，而这个积分已对照一个解析式作检验。湮灭从复合（$z_{max} = 1000$）一直计算到 $z = 20$。与 CDG 一样，较晚的时期被略去，因为它们取决于结构形成；把它们包括进来只会提高通量。通量恰好 $\propto 1/d$（已检验）。它与 COMPTEL 背景作比较，即 0.8 到 30 MeV 的 $dJ/dE =
  6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$（Kappadath et al. 1996），以及 Fermi-LAT 各向同性背景（100 MeV 以上为 $7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$，谱指数 2.32，截断 279 GeV；Ackermann et al., ApJ 799, 86, 2015）。来自 $z\sim20$-$300$ 的光子到达时能量为 1 到 10 MeV，在这个范围由 COMPTEL 设定上限。结果：预言超出数据的倍数，对 $d = 100$ Mpc 为 160 倍，对 1 Gpc 为 16 倍，对 10 Gpc 为 1.6 倍。最小区域尺寸为 $d_{min}\approx16$ Gpc（在 8.5 MeV，$\kappa = 1$），大于可观测宇宙 14.3 Gpc 的半径。CDG 得到了相同的结论：物质区域必须几乎就是整个可见宇宙。这是一个玩具模型，而 $d_{min}$ 随 $\kappa$ 缩放。CDG 论证湮灭加热会加快流入，这会使界限更强。受约束：任何反物质都必须位于我们的视界之外，那里没有望远镜能检验它。判据 3：微调。假设反物质在同一切片上位于视界之外，而且没有任何东西安排它的分布。那么一条平衡的随机世界线在 $M$ 次穿越中给予我们这一区域的净电荷约为 $\sqrt M$ 的量级。净电荷的方差等于 $M$；当 $T$ 次穿越的总和平衡时则为 $M(T-M)/(T-1)$（两者都已检验）。出现大幅过剩的概率服从 Cramér 速率函数，$\log_{10}P\approx -M\,\mathrm{KL}/\ln10$，并已对照精确的二项分布尾部作检验。今天我们看到 $N_B\approx9\times10^{79}$ 个重子且没有反物质，因此每次穿越都必须同号：$P = 2^{-N_B}$，$\log_{10}P\approx-2.7\times10^{79}$。若改为理解成早期宇宙中约 $1.5\times10^{89}$ 对粒子（每个光子一对）之中 $9\times10^{79}$ 的过剩，则为 $\log_{10}P\approx-1.2\times10^{70}$。没有机制的话，平衡的世界线就会失败。这个机制必须是一个使我们这一区域中所有穿越的符号相互关联的边界条件：一种对称性，而不是一次涨落。判据
  4：CPT 对称宇宙。Boyle、Finn 与 Turok（PRL 121, 251301, 2018）提出，大爆炸之后的宇宙是大爆炸之前一个宇宙的 CPT 镜像，因此这一对宇宙作为整体并不破坏 CPT。以下是作者将 P3 与此模型对齐的方式。一条穿过 $t = 0$ 的世界线在我们这一侧是物质。镜像中的观察者具有相反的时间箭头，因此他们把同一段看作反物质。第 2 步证明的附加条件依然适用：在任何完整的切片上，一条连续的世界线都有 $|Q|\leq1$，所以单靠镜像并无帮助。如果世界线缠绕穿过大爆炸并穿过未来边界，且共形时间的两端被粘合在一起，这种对齐就行得通。这是超出已发表模型的一个额外假设，也就是第 2 步的扩展 C 换了一个位置出现。一个缠绕 $w$ 次的圈在我们这一侧的每个切片上读数为 $+w$，在每个镜像切片上（以镜像自身的箭头读取）读数为 $-w$。总和为零（已检验）。过剩现在是一个拓扑整数，而不是一次涨落，尽管 $w\approx10^{80}$ 仍然是人为放入的。此模型已发表的预言（取自 Boyle、Finn 与 Turok 的摘要），用引用的数字检验：(a) 最轻的中微子无质量。用 NuFIT 6.0 的质量平方差（$\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$，$\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ 正序，$\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ 反序），这固定了 $\Sigma m_\nu = 0.0588$ eV（正常质量顺序）或 $0.0989$ eV（反转质量顺序），以及 $m_\beta = 0.009$ 或 $0.049$ eV。KATRIN 将 $m_\beta$ 限制在 0.8 eV 以下（Nature Physics 18, 160, 2022）与 0.45 eV 以下（Science 388, 180, 2025），远高于这两个值。Planck 2018 给出 $\Sigma m_\nu < 0.12$ eV，两者都允许。DESI 2024（$< 0.072$ eV）与 DESI DR2（$< 0.064$ eV，$\Lambda$CDM）排除了反序情形，而允许正序情形。DESI DR2
  也指出与振荡给出的下限之间存在张力，而最轻中微子无质量正是张力最小的情形。(b) 暗物质是质量为 $4.8\times10^8$ GeV 的稳定右手中微子。这远超任何对撞机的能及范围，也不给出直接探测信号，因此目前无法检验。(c) 没有原初引力波，所以 $r = 0$。BICEP/Keck 给出 $r < 0.036$（95%，PRL 127, 151301, 2021），两者一致。真正的检验是 $\sigma(r)\sim10^{-3}$：这是 CMB-S4 的目标（该项目已于 2025 年 7 月终止），现在则由 LiteBIRD 与 Simons Observatory 承担。判定表。(1) 附近没有混入：必要；满足。单单一个反氦原子核，或来自星系团的湮灭伽马射线，就会证伪它。(2) 视界内没有区域：必要；受约束（$d\gtrsim16$ Gpc）。MeV 背景的过剩或来自较近壁面的 CMB 畸变会证伪它；在视界之外则无法检验。(3) 没有微调：必要；对随机世界线而言失败（$\log_{10}P\sim-10^{70}$ 至 $-10^{79}$），只有一个机制能消除这个问题。(4a) 最轻中微子无质量：受约束，迄今一致。测量到大于零的最轻质量就会证伪它，例如在正序下 $\Sigma m_\nu$ 明显高于 0.0588 eV。(4b) 重右手中微子暗物质：目前无法检验。若暗物质被确认为其他东西，就会证伪它。(4c) $r = 0$：一致。$r\gg10^{-3}$ 的原初 B 模式会证伪它。总结：扩展后的 P3 只能以一种形式存活：一条跨越 CPT 镜像宇宙而平衡、缠绕穿过大爆炸的世界线。以这种形式，它继承了可证伪的预言。非零的最轻中微子质量，或 $r\gg0$ 的原初 B 模式，都会证伪 CPT 镜像对齐。先前的步骤要么重现了标准物理，要么遇到的是假说能够吸收的数据。这是本系列中第一个带有可能失败之检验的步骤。
meanings:
- 重复的 $z$ ⇒ 求和：对每个区域尺寸 $d$ 与光子能量 $E$，今天的弥漫伽马射线强度
- 壁上每共动 cm$^3$ 每秒的湮灭次数：单位体积的壁面积 $3/d$ 乘以流入量 $n_b v$
- 一次湮灭在发射能量处每 MeV 的光子数；重复的 $j$（π 介子能量）⇒ 求和
- COMPTEL 与 Fermi-LAT 背景所允许的最小区域尺寸（通量恰好 $\propto 1/d$）
- 由 Fermi-LAT 通量上限得到的后发座星系团气体中最大的反质子比例
- 符号随机的 $M$ 次穿越的净电荷；其方差为 $M$
- 一条随机世界线在 $M$ 次穿越中给予我们这一区域净电荷 $Q$ 的概率（Cramér 速率函数）
- 我们的切片及其 CPT 映像上的净电荷，各自以自身的时间箭头读取；重复的 $s$（线段）⇒ 求和
- 由最轻质量 $m_l$ 与 NuFIT 质量平方差得到的中微子质量之和
labels:
  dims: 世界线所在空间的维数 $D$（开放）
  speed_factor: 流入壁中的速度 $\kappa$，以气体声速为单位
  z_max: 壁上湮灭开始时的红移 $z_{max}$（复合）
  winding: 世界线穿过大爆炸的缠绕数 $w$
