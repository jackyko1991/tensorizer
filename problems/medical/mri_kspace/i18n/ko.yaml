source_hash: 3ad16fadfd42
title: 'MRI k-공간: 경사 자기장과 푸리에 변환으로 영상 만들기'
summary: '자기장 경사는 각 픽셀에 고유한 세차 위상을 부여하므로, 코일은 영상의 푸리에 변환을 기록합니다: $s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$, 여기서 $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$. 부호화 행렬 einsum으로 쓰면 FFT와 같습니다. k-공간을 한 줄씩 채우고 역변환하면 영상이 선명해지는 것을 볼 수 있고, 줄을 건너뛰면 영상이 겹쳐 접히며(앨리어싱), 중심만 남기면 깁스 링잉과 함께 흐려집니다.'
notes: 한 줄 건너 하나씩($R = 2$) 얻으면 시야가 절반이 됩니다. 0으로 채운 영상은 정확히 $\tfrac12[\rho(p) + \rho(p + N/2)]$로, $\mathrm{FOV}/2$만큼 이동해 감겨 들어온 사본이 겹칩니다. 중심 줄만 남기면 DC 성분이 남아 전체 세기는 보존되지만 가장자리 정보를 잃어 영상이 흐려지고 링잉이 생깁니다(깁스). 정규화 재구성은 영상의 각 열마다, 중심 줄로부터 추정한 머리 마스크 바깥의 신호에 벌점을 주는 작은 최소제곱 문제를 풉니다. 무작위 방식의 오차는 조금 줄여 주지만, 접힌 두 사본이 모두 머리 안에 떨어지는 규칙적인 앨리어싱은 되돌리지 못합니다. 실제 스캐너는 여러 코일(병렬 영상)이나 희소성 사전 정보(압축 센싱)를 추가합니다. 팬텀은 고전적인 셰프–로건 머리이며, 설명용일 뿐 임상용이 아닙니다.
meanings:
- '양성자 밀도 영상: 픽셀 행 $p$(위상 부호화 방향), 열 $r$(판독 방향)'
- 경사의 누적 적분 $\tfrac{\gamma}{2\pi}\int G\,dt$로서의 k-공간 위치. 간격 $\Delta k = 1/\mathrm{FOV}$
- k-공간 줄 $u$에서 픽셀 $p$의 위상 $e^{-2\pi i\,up/N}$. 2차원 행렬 $E_{kx}$는 $E_{up}E_{vr}$로 인수분해됨
- '반복된 $p, r$ ⇒ 합: 측정된 k-공간 신호, fft2(rho)와 동일'
- '샘플링 마스크: 획득한 위상 부호화 줄에서 1'
- 0 채움 재구성
- 영상 열 $r$마다 티호노프 최소제곱, 머리 바깥 신호에 벌점
labels:
  size: 영상 크기 $N$
  R: 건너뛰기 인자 $R$($R$번째 줄마다)
  lowpass: 남기는 k-공간 중심 비율
  random_frac: 무작위로 남기는 줄 비율
  lam: 티호노프 가중치 $\lambda$
  n_frames: 채우기 프레임 수
