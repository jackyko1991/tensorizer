title: गोलों का किरण अनुरेखण
summary: एक छोटा Whitted-शैली किरण अनुरेखक (ray tracer) जिसमें हर पिक्सेल की किरण एक $(H\cdot W, 3)$ टेंसर की एक पंक्ति है। सभी किरणों को सभी गोलों के विरुद्ध द्विघात सूत्र से एक साथ परखा जाता है, जिससे एक (किरणें $\times$ गोले) तालिका मिलती है जिसका argmin दृश्य सतह है। लैम्बर्ट और ब्लिन–फ़ोंग छायांकन, छाया किरणों के दूसरे बैच से तीक्ष्ण छायाएँ, दर्पण परावर्तन और चेक वाला फ़र्श, जबकि प्रकाश या कैमरा दृश्य की परिक्रमा करता है।
notes: पिक्सेल का रंग $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$ है, जहाँ $m$ सतह का दर्पण अंश है; परावर्तित रंग परावर्तित किरणों के बैच को फिर से अनुरेखित करने से आता है, जो Whitted (1980) का पुनरावर्ती विचार है। छायांकन मॉडल Phong (1975) का है, Blinn (1977) के अर्ध सदिश $\hat{\mathbf h}$ के साथ। चूँकि $\hat{\mathbf d}$ इकाई लंबाई का है, द्विघात का अग्रणी गुणांक 1 है, इसलिए केवल $b$ और $q$ चाहिए। द्वितीयक किरणें सतह से थोड़ी दूरी $\varepsilon$ पर शुरू होती हैं, अन्यथा पूर्णांकन उन्हें अपने ही गोले से टकरा देता है (shadow acne)। परावर्तनों के बिना दृश्य देखने के लिए शून्य उछाल, छोटे तीक्ष्ण चमकीले धब्बों के लिए ऊँची चमक, या चौड़ा दृष्टि क्षेत्र आज़माएँ। वास्तविक रेंडरर कोमल छायाएँ, अपवर्तन और प्रति पिक्सेल कई नमूने (path tracing) जोड़ते हैं, पर बैच वाली किरण-बनाम-सब तालिका वही रहती है।
meanings:
- पिक्सेल $p$ से गुज़रने वाली किरण का मूल और इकाई दिशा; $d$ कैमरा आधार में स्क्रीन बिंदु $(x, y, 1)$ है, आधार सूचकांक पर एक einsum
- गोले $s$ का केंद्र और त्रिज्या
- 'दोहराया गया $i$ ⇒ योग: हर किरण हर गोले के विरुद्ध एक कॉल में'
- द्विघात का निकटतर मूल; जहाँ $b^2 < q$ (किरण चूकती है) या टक्कर पीछे है वहाँ $\infty$
- दृश्य सतह; भूमि समतल $y = 0$, $t = -o_y/d_y$ वाला एक अतिरिक्त स्तंभ है
- विसरित और स्पेक्युलर गुणक, दूर की ओर 0 पर सीमित
- 'प्रकाश की ओर छाया किरणें: यदि प्रकाश से पहले कोई गोला न टकराए तो 1, अन्यथा 0'
- 'दोहराया गया $j$ ⇒ योग: दर्पण दिशा, किरणों का अगला बैच'
