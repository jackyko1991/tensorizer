source_hash: 9e25d7739db7
title: 數值積分與收斂階
summary: 梯形法、辛普森法與高斯–勒讓德求積都是加權和 $\sum_k w_k f(x_k)$，即對許多被積函數同時做一次 einsum。高斯節點與權重來自一個本徵值問題（Golub–Welsch）。在雙對數座標上，誤差以斜率 2 與 4 下降，或呈指數下降，直到折角或奇異點奪走高階精度。
notes: 對平滑被積函數，梯形法誤差以 $h^2 \propto N^{-2}$ 下降，辛普森法以 $N^{-4}$ 下降：$N$ 加倍時誤差分別除以 4 與 16。具 $N$ 個節點的高斯–勒讓德求積能精確積分次數至多 $2N - 1$ 的所有多項式，因此對解析函數其誤差呈指數下降，直到在 $10^{-16}$ 附近碰到 float64 捨入誤差。這些階數來自泰勒展開，因此需要導數。對有折角的 $|x - a|$，二階導數是一個尖峰：每個跨越折角的公式都在該處產生 $O(h^2)$ 誤差，所以辛普森法與高斯法退回 2 階（曲線呈鋸齒狀，因為折角落在其區段內的位置隨 $N$ 而變）。對 $(1+x)^{\alpha}$，導數在端點發散：梯形法與辛普森法降為 $1 + \alpha$ 階，而節點向兩端聚集的高斯法則約為 $2 + 2\alpha$ 階。補救方法是在折角處分割區間，或做變數變換使被積函數變得平滑。試試整數 $\alpha$（多項式），看高斯法變得精確，或把折角放在網格節點上（只要 $N$ 是 20 的倍數，$a = 0.3$ 就是節點）：此時梯形法對兩段直線是精確的，誤差降至捨入誤差。
meanings:
- 等距節點；權重 $h(\tfrac12, 1, \dots, 1, \tfrac12)$ 與 $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- 勒讓德遞迴關係的三對角矩陣，對角線旁為 $\beta_k = k/\sqrt{4k^2 - 1}$
- 本徵值為高斯–勒讓德節點，本徵向量在各行
- 由每個本徵向量的第一分量得到高斯權重；總和為 $\int_{-1}^{1} dx = 2$
- 平滑、折角與端點三種被積函數在每個節點的值
- 重複的 $k$ ⇒ 求和：同時算出三個積分
labels:
  n_max: 最大 $N$
  kink: 折角位置 $a$
  alpha: 端點冪次 $\alpha$
