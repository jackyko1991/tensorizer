source_hash: e272fe98f3be
title: Маленькая CNN находит мотив связывания ДНК
summary: Половина набора случайных последовательностей ДНК несёт одну вырожденную копию сайта связывания транскрипционного фактора. Однослойная одномерная свёрточная сеть, $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$ с последующим max-pooling, учится различать их с помощью autograd и Adam; если прочитать его как логотип последовательности, самый важный фильтр превращается в заданный мотив.
notes: 'Транскрипционный фактор связывает ДНК там, где находит короткое, слегка изменчивое слово — свой мотив, обычно описываемый позиционной весовой матрицей (PWM). Сканирование последовательности с PWM — это в точности одномерная свёртка one-hot последовательности с фильтром $w \times 4$, поэтому свёрточные сети подходят для геномики: фильтры первого слоя — детекторы мотивов, а max-pooling делает ответ независимым от положения сайта. Здесь сети никто не говорит, каков мотив: она видит только метки, и градиентный спуск формирует её самый полезный фильтр в заданное слово (смотрите, как логотип проявляется из шума). Пунктирная линия — эталон, который знает мотив: сканирование истинной PWM. Поскольку заданные сайты вырождены, а случайная ДНК иногда похожа на сайт, даже он не достигает 100%, и обученная сеть заканчивает близко к нему. Используется только прямая цепь, и фон равномерный; реальные модели сканируют и обратный комплемент и должны справляться с GC-составом, повторами и шумными экспериментальными
  метками. Это идея DeepBind (2015), который обучался мотивам по экспериментам по связыванию белков; модели вроде Basset, Basenji и Enformer складывают гораздо больше слоёв (и внимание), чтобы предсказывать хроматин и экспрессию по последовательностям длиной 100 т.п.н. Эта модель воспроизводит только идею первого слоя. Попробуйте более слабый мотив, короткий мотив (E-box, CACGTG, случайно встречается чаще) или меньше фильтров.'
meanings:
- 'заданная позиционная весовая матрица: консенсусное основание с вероятностью «сила», остальные три делят остаток'
- последовательность $n$ имеет основание $b \in$ {A, C, G, T} в позиции $l$; метка $y_n = 1$, если сайт был вставлен
- каждое окно из $w$ оснований (представление, без копирования), $P = \ell - w + 1$
- 'обучаемые фильтры: оценка для каждого основания и позиции, той же формы, что PWM'
- 'свёртка: суммирование по $k, b$, фильтр $f$ оценивается в каждой позиции $p$'
- 'глобальный max-pooling: лучшее совпадение где угодно, так что сайт может находиться в любой позиции'
- логит, суммирование по $f$; обучение с бинарной кросс-энтропией, autograd и Adam (мини-батчи по 100)
- 'обратно к мотиву, как в DeepBind: усреднение лучшего окна $p^*_{nf}$ каждой положительной последовательности, оценка которой превышает половину максимальной ($\kappa_{nf} = 1$), суммирование по $n$'
- 'информационное содержание в битах: высота стопки логотипа в позиции $k$'
- корреляция обученной и заданной матриц при лучшем сдвиге; 1 = идентичны
labels:
  motif: 'Заданный мотив: NF-κB, AP-1 или E-box'
  strength: Вероятность консенсусного основания
  n_seq: Последовательности (80% обучение / 20% тест)
  length: Длина последовательности $\ell$
  n_filters: Фильтры $F$
  width: Ширина фильтра $w$
  epochs: Эпохи обучения
  lr: Скорость обучения Adam
