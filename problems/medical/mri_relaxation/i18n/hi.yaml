title: 'MRI: T1 और T2 शिथिलन तथा छवि कंट्रास्ट'
summary: रेडियो-आवृत्ति पल्स के बाद हर ऊतक का चुंबकन समय-स्थिरांक $T_1$ के साथ क्षेत्र के अनुदिश वापस बढ़ता है और उसका अनुप्रस्थ भाग $T_2$ के साथ क्षीण होता है। स्पिन-इको संकेत को (ऊतक, $TR$, $TE$) पर एक टेंसर के रूप में निकालकर उसे एक कार्टून मस्तिष्क के ऊतक-लेबल मानचित्र के साथ संकुचित करने से दिखता है कि $TR$ और $TE$ का चुनाव छवि को T1-, PD- या T2-भारित कैसे बनाता है।
notes: 'छोटा $TR$ और छोटा $TE$ T1 भारण देते हैं: वसा और श्वेत द्रव्य चमकीले होते हैं, CSF गहरा, क्योंकि उसके लंबे $T_1$ को पुनःप्राप्ति का समय नहीं मिला। लंबे $TR$ और छोटे $TE$ से $T_1$ गुणक हट जाता है और प्रोटॉन घनत्व (PD) भारण बचता है। लंबा $TR$ और लंबा $TE$ T2 भारण देते हैं: अपने बहुत लंबे $T_2$ के कारण CSF सबसे चमकीला ऊतक बन जाता है। यह सरल सूत्र पुनः-केंद्रण पल्स के $M_z$ पर प्रभाव की उपेक्षा करता है और $TR \gg TE$ मानता है। स्कैनर डिस्प्ले की तरह हर छवि अपने सबसे चमकीले पिक्सेल के अनुसार विंडो की जाती है। ऊतक मान 1.5 T पर मोटे पाठ्यपुस्तकीय आँकड़े हैं, केवल शिक्षण के लिए, नैदानिक उपयोग के लिए नहीं। छोटे और लंबे $TR$/$TE$ बदलकर देखिए कि धूसर/श्वेत द्रव्य का कंट्रास्ट कैसे उलट जाता है।'
meanings:
- $S = 5$ ऊतकों के शिथिलन समय और प्रोटॉन घनत्व (1.5 T पर अनुमानित मान)
- अनुदैर्ध्य पुनःप्राप्ति, ऊतक $s$ और समय $t$ पर ब्रॉडकास्ट
- हर ऊतक का अनुप्रस्थ क्षय
- हर ऊतक, पुनरावृत्ति समय $TR_a$ और इको समय $TE_b$ के लिए स्पिन-इको संकेत (किसी सूचकांक का योग नहीं)
- 'वन-हॉट लेबल मानचित्र: पिक्सेल $(x, y)$ में कौन-सा ऊतक है'
- 'दोहराया गया $s$ ⇒ योग: हर $(TR, TE)$ के लिए छवि'
- व्युत्क्रमण समय जहाँ $M_0(1 - 2e^{-t/T_1})$ शून्य को पार करता है, वसा (STIR) या CSF (FLAIR) को दबाने के लिए प्रयुक्त
