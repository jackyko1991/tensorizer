source_hash: adf3aca0e79d
title: 'प्रोटॉन थेरेपी: ब्रैग शिखर'
summary: बेथे–ब्लॉख रोधन क्षमता $-dE/dz \propto 1/\beta^2$ को प्रोटॉन ऊर्जाओं के पूरे बैच के लिए एक साथ RK4 से समाकलित किया जाता है। हर प्रोटॉन के रुकने से ठीक पहले खुराक जमा हो जाती है (ब्रैग शिखर), और ऊर्जा परतों का भारित योग ट्यूमर पर एकसमान खुराक देता है, जबकि उसके पीछे लगभग कुछ नहीं पहुँचता।
notes: 'जल के लिए स्थिरांक: $K = 0.307$ MeV cm²/mol, $Z/A = 0.555$, $I \approx 75$ eV, $\rho = 1$ g/cm³; कोश और घनत्व संशोधनों की उपेक्षा की गई है। समाकलित परास (150 MeV → लगभग 15.8 cm) NIST PSTAR से लगभग 1 % तक मेल खाता है, और $p \approx 1.75$ के साथ ब्रैग–क्लीमैन नियम $R = \alpha E^p$ पर बैठता है। परास बिखराव ($R$ का $\sigma \approx 1.2\,\%$) और पुंज का ऊर्जा फैलाव शिखर को गोल कर देते हैं; नाभिकीय अभिक्रियाओं को केवल प्राथमिक कणों की 1 %/cm हानि के रूप में मॉडल किया गया है, इसलिए शिखर-से-प्रवेश अनुपात वास्तविक पुंज से अधिक है। उसी ट्यूमर खुराक पर सामान्यीकृत मेगावोल्टेज X-किरण पुंज (बिल्ड-अप, फिर $e^{-\mu z}$) प्रवेश पर अधिक ऊर्जा जमा करता है और ट्यूमर के पार भी चलता रहता है; प्रोटॉन रुक जाते हैं। सभी संख्याएँ अनुमानित हैं और केवल शिक्षा के लिए, नैदानिक उपयोग या उपचार योजना के लिए नहीं।'
meanings:
- हर गहराई-चरण पर पुंज $b$ की गतिज ऊर्जा (RK4, सभी पुंज एक साथ)
- बेथे–ब्लॉख $-dE/dz$ MeV/cm में, बैच पर अवयव-वार
- 'मूल खुराक: गहराई-खंड $k$ में प्रति cm खोई गई ऊर्जा'
- गाउसी परास बिखराव + ऊर्जा फैलाव, पंक्तियाँ सामान्यीकृत
- 'दोहराया गया $k$ ⇒ योग: धुंधला ब्रैग वक्र'
- 'दोहराया गया $k$ ⇒ योग: $K$ ऊर्जा परतों से फैला हुआ ब्रैग शिखर (SOBP)'
- एकसमान लक्ष्य खुराक के लिए अऋणात्मक न्यूनतम वर्ग (प्रक्षेपित प्रवणता)
labels:
  e_min: न्यूनतम पुंज ऊर्जा
  e_max: अधिकतम पुंज ऊर्जा
  n_energies: स्वीप में पुंज
  target_start: ट्यूमर आरंभ गहराई
  target_end: ट्यूमर अंत गहराई
  n_layers: SOBP ऊर्जा परतें
  energy_spread: पुंज ऊर्जा फैलाव $\sigma_E/E$
  i_ev: माध्य उत्तेजन ऊर्जा $I$
