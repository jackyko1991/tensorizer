source_hash: 099100757a12
title: 由 CNN 與混合專家控制器操控的貪食蛇
summary: 一個由兩部分組成的遊戲代理：一個觀察棋盤的小型 CNN，以及一個選擇動作的控制網路——這裡是混合專家模型，其路由器把每局遊戲送往 $K$ 個小型專家網路之一。遊戲是 $10 \times 10$ 格上的貪食蛇，完全以張量寫成，使一批遊戲能在一步之內同時推進。控制器透過模仿一位規劃式教師（廣度優先搜尋與洪水填充，同樣是張量運算）來學習。比較了四個權重預算相同的控制器：稠密混合、Switch top-1 路由器、以稠密方式訓練但以 top-1 使用的路由器，以及一個普通 MLP；接著將路由與遊戲狀態對照量測，看看每個專家究竟負責什麼（如果有的話）。四者每局都吃到約 20 個食物，而隨機策略僅吃到 0.2 個，相當於教師分數的三分之二；在這個規模下，普通 MLP 的表現不輸任何混合模型。
notes: 構想。Jacky Ka Long Ko 提議一個遊戲代理：以 CNN 負責感知，並以具混合專家路由的控制網路負責控制，且特別要求張量路由的部分。本問題以貪食蛇建構一個小型版本；貪食蛇是一款通用的格子遊戲，在此從頭寫成（自繪像素外觀，不使用任何素材）。遊戲。在 $N \times N$ 棋盤（$N = 10$）上的 $B$ 局遊戲構成同一組張量。棋盤儲存每個蛇身格的年齡（距離該格再次空出所需的步數：蛇頭的年齡 = 長度，蛇尾為 1），因此所有遊戲的一步只需少數幾個張量運算：對於相對動作 $a$（左轉、直行、右轉），蛇頭以新方向 $d' = (d + a - 1) \bmod 4$ 移到 $\mathbf x + \Delta_{d'}$；撞牆或撞上年齡 $> 1$ 的格子即結束遊戲（蛇尾格正要離開，所以是空的）；沒吃到食物時所有年齡減 1，吃到食物時蛇保留蛇尾並增長一格；新食物放在 $N^2$ 個帶種子的均勻亂數中數值最大的空格，因此絕不會落在蛇身上。遊戲也會在連續 $N^2$ 步未吃到食物，或蛇填滿棋盤時結束。測試：撞牆與撞到自身、空出的蛇尾格、增長一格、食物絕不在蛇身上、年齡永遠恰為 $\ell, \ell - 1, \dots, 1$，以及在相同亂數下批次步進與逐局的普通 Python 迴圈結果相同。代理。感知部分是一個 CNN（8 通道的 3×3 卷積、16 通道且步幅為 2 的 3×3 卷積、一個輸出 $F = 64$ 個特徵的線性層；共 84 472 個權重），輸入是以蛇頭為中心、前進方向朝上的視野，含四個平面：牆、蛇身、年齡/長度（哪些格子最先空出）與食物。在此座標系中，三個相對動作永遠對應中心的同樣三個鄰格（有測試檢查：某動作致命，當且僅當該鄰格是牆或不會空出的蛇身格）。控制部分是 $K = 4$ 個專家的混合，每個專家是輸出動作 logits 的 MLP $64 \to 32 \to 3$，前接 softmax 路由器 $p = \mathrm{softmax}(W^G \mathbf h + b^G)$：共 8976 個權重。路由層即 moe_dag_pipeline 中的那一層，直接從該處匯入：一個分派張量把每局遊戲放入其專家的緩衝區（以累積排名，如 GShard 與 Switch），所有專家在一次批次 einsum 中執行，再以一個合併
  einsum 把 logits 送回。精確檢查：使用固定 one-hot 路由器時，該層等同於對每局遊戲單獨執行其專家（誤差在 $10^{-6}$ 以內）；均勻的稠密路由器給出各專家的平均；路由器的每列總和為 1；以及負載平衡損失在已知情形下的值（平衡時為 1，崩塌時為 $K$，一個手算例子為 1.1）。四個控制器，相同預算：(a) 稠密混合 $z = \sum_k p_k f_k$（每個專家處理每局遊戲）；(b) Switch top-1，只執行機率最高的專家，並將其 logits 乘以 $p_k$；(c) 將 (a) 的稠密訓練模型改用 top-1 路由執行，不再額外訓練；(d) 一個 MLP $64 \to 132 \to 3$（8979 個權重，與混合模型相同）。(a) 與 (b) 都加入 $\alpha = 0.01$ 的 Switch 負載平衡損失。每個變體有兩個種子；種子 $s$ 在每個變體中都從相同的 CNN 與專家權重開始，而全部六個訓練模型共用一個模型軸（CNN 的分組卷積），各自使用自己的小批次。教師與訓練。教師是以相同張量寫成的規劃器：以在空格上反覆鬆弛實現的廣度優先搜尋（$\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$），並在同一迴圈中進行洪水填充，以每個空區域中最小的格子索引作為其標記。它從不走致命的一步，優先選擇其空區域容得下蛇的動作，其次是通往食物的最短路徑，再其次是較大的區域；測試中其距離場與教科書式基於佇列的 BFS 相同。訓練採用行為複製（Pomerleau 1989）：對教師的動作計算交叉熵，資料為 192 局教師遊戲中的 54 040 個狀態，每個模型 600 步 AdamW、每步 128 個狀態，並在 360 步後進行一輪 DAgger（Ross et al. 2011）：每個學生各玩 48 局，教師為它們到達的 38 267 個狀態標註，接著在兩者上繼續訓練。未進行強化學習微調；深度 Q 學習（Mnih et al. 2015）是僅憑獎勵學會此類遊戲的經典方法，但在 CPU 上會耗時許多。結果（預設執行，所有策略共用 128 局評估遊戲：相同的起始狀態與相同的食物序列，最多 300 步）。每局吃到的食物，對各局取平均，括號內為兩個種子：隨機
  0.16（15 步後死亡）；(a) 稠密 20.7（20.9, 20.4）；(b) Switch 20.4（21.1, 19.6）；(c) 稠密→top-1 18.1（18.4, 17.8）；(d) 單一模型 21.7（21.8, 21.6）；教師 31.0（平均在 300 步中存活 287 步，學生則為 147–179 步）。學生在 95–96 % 的訓練狀態上與教師一致，得分卻少了三分之一：小錯誤在一局中不斷累積，這是行為複製的常見弱點。一個慢速測試檢查訓練後的策略以明顯差距勝過隨機策略。路由——即使並非專門化也照樣呈現。稠密路由器使用全部四個專家（負載 0.16–0.38）。它們最能追蹤的是動作本身：被路由的專家與控制器動作之間的互資訊為 0.51 與 0.56 bit（四個專家時最多為 2 bit）；在種子 1 中，一個專家幾乎接下所有左轉與右轉，以及幾乎所有前方沒有空格的狀態，而其餘三個專家分擔直行動作。前方空格數帶有 0.20–0.28 bit，與食物的距離 0.08–0.12，蛇身長度 0.02–0.13（僅種子 1 有從短蛇到長蛇的漂移）。因此專家是依「要做什麼」（轉彎或繼續前進）分工，而非依某種策略，例如追逐食物與避開蛇尾；由於專家的輸出決定動作，這種分工有一部分是結構上內建的。Switch 路由器儘管有平衡損失仍然崩塌：種子 1 把 85 % 的狀態送往一個專家、15 % 送往第二個，種子 2 則為 73 % 與 26 %，各有兩個專家未被使用；在 moe_dag_pipeline 中所見的對稱性破缺困難，在這裡表現為崩塌。這對分數毫無損失，因為一個專家搭配共用的 CNN（它持有大部分權重）已經玩得和四個專家一樣好。以 top-1 執行稠密訓練的路由器 (c) 保留了稠密路由（與動作的互資訊為 0.60 與 0.67 bit），但每局少吃 2.6 個食物：稠密模型混合了各專家，並非完全可分離。哪些成立，哪些不成立。精確成立：批次遊戲與參考迴圈相同，固定路由器下的路由層等同於逐局呼叫專家，均勻路由器下的稠密混合即為專家平均。在單一棋盤大小與兩個種子上量測：模仿使每個控制器都達到教師約三分之二的水準，且沒有任何混合模型勝過權重相同的普通 MLP（MLP 在兩個種子中都領先約每局 1 個食物，就兩個種子而言差距不大）。混合專家要在眾多專家合計持有的權重遠多於單一輸入所能使用時才有回報；在一個承擔大部分工作的
  CNN 之後接上四專家控制器，展示的是路由本身，而非其優勢。相關研究。局部專家的自適應混合（Jacobs、Jordan、Nowlan 與 Hinton 1991）引入了一個閘控，將每個樣本分派給數個相互競爭的專家之一；稀疏閘控 MoE 層（Shazeer et al. 2017）與 Switch Transformer（Fedus et al. 2021，即此處所用的 top-1 路由與負載平衡損失）將其擴大規模。深度 Q 網路（Mnih et al. 2015）以 CNN 僅憑獎勵從像素學會 Atari 遊戲；ALVINN（Pomerleau 1989）透過模仿人類駕駛來操控車輛，是行為複製的起源；DAgger（Ross、Gordon 與 Bagnell 2011）則藉由標註學習者自身造訪的狀態來修正其累積誤差。裝置與限制。預設使用 CPU：在一台忙碌的 6 核心機器上，教師、訓練與評估約需 80 s（教師遊戲 6.6 s、DAgger 6.0 s、訓練 53 s、評估 16 s），GIF 另需約 30 s；GPU（pixi run -e cuda）能加速 CNN，但無法加速教師的大量小型搜尋。GIF 顯示 (c)，其路由器使用所有專家，且每局恰好執行一個；routing.png 顯示全部三個路由變體，routing.csv 與 scores.csv 存放數據。
meanings:
- 遊戲 $b$ 的棋盤：0 = 空格，否則為該蛇身格再次空出前所需的步數（蛇頭 = 長度 $\ell_b$，蛇尾 = 1）
- 全部 $B$ 局遊戲同時移動；對於相對動作 $a_b$（左轉、直行、右轉），$d'_b = (d_b + a_b - 1) \bmod 4$；撞牆或撞上年齡 $> 1$ 的格子即結束遊戲（年齡為 1 的蛇尾格正要離開）
- 吃到食物後，選取帶種子均勻亂數 $u_{brc}$ 中數值最大的空格：絕不在蛇身上
- CNN 看到的內容：牆、蛇身、年齡/長度與食物，以蛇頭為中心、前進方向朝上，因此三個動作永遠對應同樣三個鄰格
- CNN 特徵；模型軸 $m$（變體 × 種子）成為每層一個分組卷積中的各組
- 路由器：對 $K$ 個專家做 softmax，每列總和為 1
- 將遊戲 $b$ 分派到專家 $k$ 的槽位 $s$（即它在被路由到該專家的遊戲中的排名），從 moe_dag_pipeline 匯入
- 所有專家在一次批次乘積中計算，各自處理自己的遊戲緩衝區：三個動作 logits
- 合併；稠密時：$z = p_{mbk} y_{mkba}$，每個專家處理每局遊戲
- Switch 負載平衡，$K \sum_k f_k P_k$：平衡時為 1，崩塌時為 $K$
- 教師：不走致命的一步，其次選擇其空區域（洪水填充）容得下蛇的動作，再其次是通往食物的最短路徑（以反覆張量鬆弛實現的廣度優先搜尋）
labels:
  grid: 棋盤大小 $N$（格）
  seeds: 每個變體的種子數
  experts: 專家數 $K$
  steps: 訓練步數
  balance_weight: 負載平衡權重 $\alpha$
  dagger: DAgger 輪次（1 = 開啟）
  eval_games: 評估遊戲局數
