title: 弦上的驻波
summary: 两端固定的弦上的一维波动方程。二阶导数变成矩阵（有限差分模板 $D_{ij}$），所以一次 einsum 就能同时推进几根弦上的每个点：前几个谐波和一根拨动的弦。
notes: 第 1 到 $n$ 行从单一谐波 $\sin(n\pi x/L)$ 的形状出发，只在原地以 $f_n = nc/2L$ 起伏：这就是驻波。拨动的弦（三角形）是许多谐波之和，所以其折角分裂成两部分，跑向两端，翻转后返回。经过一个基频周期 $2L/c$ 后，每种形状都回到起点。时间步长满足库朗条件 $c\,\Delta t \le \Delta x$；能量 $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$（按单位线密度计）保持不变，因为没有任何阻尼。
meanings:
- 弦 $b$ 在内部格点 $i$ 处的位移（不含两个固定端）
- 二阶导数矩阵：对角线为 $-2$，相邻为 $1$
- 重复的 $j$ ⇒ 求和：每根弦的 $\partial_x^2 u$
- 时间上的中心差分（蛙跳格式）
- $D$ 的本征值给出 $\omega_n^2 = -c^2\lambda_n$：即各谐波
labels:
  n_harmonics: 显示的谐波数
  pluck_at: 拨弦位置 $x_p/L$
  c: 波速 $c$
  L: 弦长 $L$
  n_points: 格点数
  periods: 模拟的基频周期数
