source_hash: 15137dcd8bb9
title: 중합 반응 속도론과 분자량 분포
summary: 단계 성장 고분자(폴리에스터, 나일론)는 왜 그렇게 다분산적이고, 리빙 중합은 왜 거의 균일한 사슬을 만들까? 사슬 길이에 대한 개체군 수지식을 두 메커니즘 모두에 대해 하나의 $(S, L)$ 텐서로 풀면 캐러더스의 $X_n = 1/(1-p)$와 분산도 $Đ \to 2$인 플로리의 최빈 분포 $w(x) = x(1-p)^2p^{x-1}$를 재현하고(단량체 100 000개의 동역학적 몬테카를로로 검증), 리빙 사슬의 푸아송 분포와 $Đ \approx 1 + 1/X_n$도 재현한다.
notes: '단계 성장: 모든 분자에 반응성 말단이 있고(여기서는 하이드록시산처럼 A 하나와 B 하나), 어떤 두 사슬이든 결합할 수 있다. 단량체와 단량체, 이량체와 50량체도 마찬가지다. 플로리의 등반응성 가정(속도가 사슬 길이에 의존하지 않음)은 개체군 수지식을 상수 커널의 스몰루코프스키 응집 방정식으로 바꾸며, 그 정확한 해가 최빈 분포이다. 말단의 분율 $p$가 반응했으므로 길이 $x$인 사슬은 반응한 결합 $x - 1$개가 이어지고 반응하지 않은 결합 하나로 끝나는 것이며, 확률은 $(1-p)p^{x-1}$이다. 평균은 캐러더스의 $X_n = 1/(1-p)$와 $X_w = (1+p)/(1-p)$이므로 $Đ = 1 + p \to 2$이다. 실용적 교훈은 가혹하다. 전환율 98 %에서도 $X_n = 50$에 불과하며, 긴 사슬을 얻으려면 $p > 0.99$와 반응성 작용기의 완벽한 1:1 균형이 필요하다. 리빙 사슬 성장(음이온 중합, 또는 이를 근사하는 ATRP나 RAFT 같은 제어 라디칼 중합)은 그 반대이다. 모든 사슬이 함께 시작해 정지 반응 없이 한 번에 단량체 하나씩 자라므로, 사슬당 $\nu$번 첨가한 뒤 길이는 푸아송 분포를 따르고 $Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$은 1을 향해 줄어든다. 텐서 형태는 두 메커니즘을 RK4로 진행하는 하나의 $(S, L)$ 텐서에 담는다. 단계 성장의 합성곱 $\sum_y P_y P_{x-y}$는 $P$로부터 모은 퇴플리츠 행렬과의 einsum이다(FFT로도 $O(L\log L)$에 같은 계산을 할 수 있다). 두 행은 $X_n = 1 + s$인 시계를 쓰므로 각 프레임은 같은 $X_n$에서 두 메커니즘을 비교하며, 축 $x / X_n$에서 플로리 모양은 고정되고 푸아송 봉우리는 좁아진다. 동역학적 몬테카를로는 무작위로 고른 사슬 쌍을 결합한다. 결과는 표본 잡음 범위 안에서 개체군 수지식과 일치하는데, 끝으로 갈수록 사슬이 $N_0(1-p)$개만 남아($p = 0.98$에서
  2000개) 잡음이 커진다. 단순화: 고리 형성 없음, 부반응 없음, 완벽하게 균형 잡힌 A–B 화학량론, $L$에서 잘린 사슬 길이(생략된 꼬리는 $10^{-6}$ 미만), 리빙 중합에서는 순간적인 개시와 정지나 연쇄 이동 없음. 정지 반응이 있는 일반 자유 라디칼 중합은 그 중간이다($Đ \approx 1.5$–2).'
meanings:
- '메커니즘 $s$에서 길이 $x$($x = 1 … L$)인 사슬: 0 = 단계 성장(단량체당), 1 = 리빙(개시제당)'
- '두 행에 공통인 시계: 단계 성장은 $\tau = kN_0t$, 리빙 성장은 $\nu = \int k_p[M]\,dt$'
- 개체군으로부터 모은 퇴플리츠 행렬; $x - y < 1$인 곳은 0
- '반복된 $y$ ⇒ 합산: $y$량체와 $(x-y)$량체를 잇는 모든 방법'
- 사슬은 두 말단 중 어느 쪽으로든 $N$개 사슬 중 어느 것과도 반응
- 리빙 사슬은 단량체를 한 단위씩 더하기만 하고 정지하지 않음
- '$x$ 합산: 모멘트 $k = 0, 1, 2$가 $X_n = \mu_1/\mu_0$, $X_w = \mu_2/\mu_1$을 줌'
- '단계 성장의 정확한 해: 전환율 $p = \tau/(1+\tau)$에서 초기 단량체당 사슬 수'
- 리빙 성장의 정확한 해, 계승에는 lgamma 사용
- '무작위 두 사슬을 결합 하나씩 이음: 독립적인 확률적 검증'
labels:
  p_max: 최종 전환율 $p$ (단계 성장)
  n_monomers: 몬테카를로의 단량체 수 $N_0$
