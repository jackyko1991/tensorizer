name: Runner container image

# Builds the runner image (Dockerfile) and pushes it to the GitHub Container Registry:
#   ghcr.io/jackyko1991/tensorizer-runner:<version>        CPU     (also :latest)
#   ghcr.io/jackyko1991/tensorizer-runner:<version>-cuda   NVIDIA  (also :cuda)
# The server installer (scripts/install.sh) and docs/remote-server.md pull these tags.
#
# Runs only on version tags (v1.2.3, also what publishing a GitHub release creates) and by hand
# (Actions → Runner container image → Run workflow). Never on ordinary pushes: the CUDA image is large and slow.
# linux/amd64 only: pixi.toml lists no linux-aarch64 platform, so there is no lock for arm64 yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, e.g. 0.1.0 (empty = the version in pixi.toml)"
        required: false
        default: ""
      cuda:
        description: "Also build the CUDA variant"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jackyko1991/tensorizer-runner

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Skip CUDA when not asked for
        id: gate
        run: |
          if [ "${{ matrix.variant }}" = "cuda" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.cuda }}" != "true" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v7.0.1

      # The CUDA environment (PyTorch + CUDA libraries) needs more disk than a fresh runner has free.
      - name: Free disk space
        if: steps.gate.outputs.skip != '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version
        if: steps.gate.outputs.skip != '1'
        id: v
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$v" ]; then v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pixi.toml | head -n1)"; fi
          if [ "${{ matrix.variant }}" = "cuda" ]; then
            echo "tags=${IMAGE}:${v}-cuda,${IMAGE}:cuda" >> "$GITHUB_OUTPUT"
            echo "env=cuda" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "env=default" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.skip != '1'
        uses: docker/setup-buildx-action@v3

      - if: steps.gate.outputs.skip != '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.skip != '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: PIXI_ENV=${{ steps.v.outputs.env }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Tensorizer runner (${{ matrix.variant }})
          push: true
          cache-from: type=gha,scope=runner-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.variant }}

      # Smoke test of the pushed CPU image: read-only root, /work on tmpfs, /api/health answers.
      - name: Smoke test
        if: steps.gate.outputs.skip != '1' && matrix.variant == 'cpu'
        run: |
          docker run -d --name smoke --read-only --tmpfs /work:uid=1000,gid=1000 --tmpfs /tmp \
            -e TENSORIZER_PORT=8765 -e TENSORIZER_SHARED=0 -p 127.0.0.1:8765:8765 "${IMAGE}:${{ steps.v.outputs.version }}"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health; then echo; docker rm -f smoke; exit 0; fi
            sleep 2
          done
          docker logs smoke; exit 1
