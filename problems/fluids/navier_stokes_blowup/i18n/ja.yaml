source_hash: b740fafad36e
title: Navier–Stokes 方程式の正則性と爆発の候補
summary: クレイ研究所のミレニアム懸賞問題は、3 次元非圧縮性の滑らかな流れが永遠に滑らかであり続けるかを問う。トーラス上の擬スペクトル法ソルバーが、Euler（$\nu = 0$）と 2 通りの粘性での Taylor–Green 渦を 1 回の FFT バッチでまとめて計算し、最大渦度、エンストロフィー、そして爆発が起これば必ず発散する Beale–Kato–Majda 積分 $\int\|\omega\|_\infty dt$ を追跡する。渦の引き伸ばしにより Euler の渦度は格子で解像できなくなるまで増大し、粘性はそれを抑える。これは例示であって証明ではない。
notes: クレイ問題（Fefferman による公式の問題記述）は、$\nu > 0$ に対する次の 4 つの主張のいずれかを求めている：$\mathbb R^3$ 上（A）またはトーラス $\mathbb T^3$ 上（B）での大域的な滑らかな解の存在、あるいは $\mathbb R^3$ 上（C）または $\mathbb T^3$ 上（D）での破綻。GitHub のリポジトリ openai/NavierStokesAndEuler は、外力のある $\mathbb R^3$ および $\mathbb T^3$ 上の Navier–Stokes 方程式の破綻（選択肢 C と D）と、外力のない Euler 方程式が滑らかでコンパクト台をもつ初期値から有限時間で爆発することについて、Lean 4 で機械検証された証明と付随する論文を含むと述べている。これらは最近の主張であり、数学界とクレイ研究所による評価をまだ待っている段階である。本ページはこの懸賞問題を解決済みとは扱わない。Euler 方程式については、滑らかな解の有限時間特異性が、境界をもつ軸対称流の Luo–Hou（2014）の計算、さらに後のコンピュータ支援証明（Chen–Hou）によって支持されており、Elgindi（2021）は $C^{1,\alpha}$ 初期値に対する爆発を証明した。ここでのシミュレーションは、それらの研究が制御する量を例示するにすぎない。Taylor–Green 渦 $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$ は古典的なテスト問題である（Brachet ら 1983）：渦の引き伸ばしによって薄いシート状に急峻化し、エンストロフィーが増え、エネルギースペクトルが平坦になる。スペクトルの裾は $e^{-2\delta k}$ のように減衰する。爆発には解析性の帯の幅 $\delta(t)$ が有限時間でゼロに達する必要があるが、Brachet はそれが指数的にしか縮まないことを見いだした。$\delta\,k_\max < 1$ となると Euler の計算は解像不足になる（網掛け部分）：打ち切られた系はなおエネルギーを厳密に保存するが、その後の $\|\omega\|_\infty$ の増大は格子による人工物であり、特異性の証拠ではない。粘性があるとエネルギーは
  $dE/dt = -2\nu\Omega$ に従い（丸め誤差の範囲で確認）、エンストロフィーはピークに達したのち減衰する。2 次元の Taylor–Green 渦は厳密解 $e^{-2\nu t}$ であり、3 次元のものは $p_0 = \frac1{16}(\cos 2x + \cos 2y)(\cos 2z + 2)$ から既知の初期加速度をもつ。どちらもテストになっている。より大きな $N$ を試すと、解像できる時間を後ろに延ばせる。
meanings:
- トーラス $[0, 2\pi)^3$ 上の各ラン $b$（それぞれ 1 つの粘性）の速度フーリエ係数
- Levi-Civita テンソルによる回転（curl）。繰り返す $j, l$ ⇒ 和をとる
- 回転形式の非線形項。実空間で評価する（擬スペクトル法）
- Leray 射影：勾配部分を取り除くので圧力を計算する必要がなく、$k_i\hat u_i = 0$ となる
- 2 次の項がエイリアスを生むモードを落とす。$k_\max = N/3$
- 運動エネルギー $\frac12\langle|\mathbf u|^2\rangle$ とエンストロフィー $\frac12\langle|\boldsymbol\omega|^2\rangle$
- Beale–Kato–Majda 判定条件：滑らかな解が $T^*$ で破綻しうるのは、この量がそこで発散する場合に限る
- $E(k) \propto k^{-3}e^{-2\delta k}$ をフィットする。真の特異性には $\delta \to 0$ が必要で、格子が流れを解像できるのは $\delta\,k_\max \gtrsim 1$ の間だけである
labels:
  n: 格子 $N^3$
  nu: 粘性 $\nu$（ラン $0$、$\nu$、$2\nu$）
  t_max: シミュレーション時間
