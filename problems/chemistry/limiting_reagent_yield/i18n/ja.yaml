source_hash: 835586f4adf3
title: 限定試薬と収率
summary: アルミニウムとヨウ素（あるいは窒素と水素）を任意の割合で混ぜる：どちらの反応物が先に尽き、生成物はどれだけでき、もう一方はどれだけ余るか？すべての量は一つの反応進行度 $\xi$ とともに動き、限定試薬は $n_s/|\nu_s|$ の最小値で決まる。実験の一括も、出発質量の 2D マップも、同じテンソル演算で扱える。
notes: 一定の比で反応するのはグラムではなくモルである：まず各質量をモル質量で割る。すると反応の進み具合は一つの数、進行度 $\xi$ で表される：$2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$ はアルミニウムを $2\xi$ mol、ヨウ素を $3\xi$ mol 消費し、ヨウ化アルミニウムを $2\xi$ mol 生成する。各反応物は最大 $n^0_s/|\nu_s|$ 単位の反応を許し、その中で最小の数が勝つ：その反応物が限定試薬であり、そのバーがゼロに達する。Al 1.20 g（44.5 mmol）と I₂ 2.40 g（9.46 mmol）ではヨウ素が限定試薬である：$\xi^{\max} = 3.15$ mmol、AlI₃ は最大 2.57 g、アルミニウムは 1.03 g 残る。マップでは、化学量論比を示す破線の両側で生成物はそれぞれ一方の反応物だけに依存する。線上では両方が同時に尽き、無駄がない。実際の収率は理論収率より低く（損失、副反応、完結しない平衡：ハーバー反応器を一回通過しても約 15 % しか転化しない）、100 % を超える収率は生成物が湿っているか不純であることを意味する。質量、秤量した生成物、反応を変えてみよう。
meanings:
- 符号付き化学量論数：2 Al + 3 I₂ → 2 AlI₃ では $-2, -3, +2$
- $e$ の繰り返し ⇒ 和：各化学種の原子からモル質量
- 各実験 $b$ の初期モル数（最後があなたの実験）
- いずれかの反応物がゼロになるまでの最大進行度；argmin が限定試薬
- 0 から $\xi^{\max}$ までの $K$ 個の進行度での量（バー）
- 生成物の理論収量（g）
- 収率（%）
- 出発質量の格子は、より大きなバッチにすぎない
labels:
  reaction: 反応
  mass_1: 反応物 1 の質量（Al または N₂）
  mass_2: 反応物 2 の質量（I₂ または H₂）
  measured: 秤量した生成物
