title: गिब्स ऊर्जा न्यूनीकरण द्वारा रासायनिक साम्य
summary: मेथेन–वायु ज्वाला से क्या निकलता है? स्थिर $T$ और $P$ पर उत्पाद वहाँ स्थिर होते हैं जहाँ गिब्स ऊर्जा $G = \sum_j n_j \mu_j$ न्यूनतम हो, हर तत्व के संरक्षण $A_{ij} n_j = b_i$ की शर्त के साथ। एक बैच न्यूटन विधि (RAND विधि) 10 स्पीशीज़ को तापमानों की पूरी श्रेणी पर एक साथ हल करती है, दिखाती है कि गैस गर्म होने पर CO₂ और H₂O, CO, H₂, OH, H और O में टूटते हैं, और रुद्धोष्म ज्वाला तापमान खोजती है।
notes: '$G$ को न्यूनतम क्यों करें? स्थिर $T$ और $P$ पर ऊष्मागतिकी का द्वितीय नियम कहता है कि एक बंद तंत्र केवल अपनी गिब्स ऊर्जा घटा सकता है, इसलिए साम्य $G$ का वह न्यूनतम बिंदु है जो हर परमाणु को बनाए रखे: एक प्रतिबंधित न्यूनीकरण। लैग्रांज गुणकों $\pi_i$ (प्रति तत्व एक) के साथ शर्त $\mu_j/RT = \sum_i \pi_i A_{ij}$ है: हर स्पीशीज़ का रासायनिक विभव उसके परमाणुओं के “तत्व विभवों” का योग है। यह साम्य स्थिरांकों की सूची (प्रति अभिक्रिया एक) को सभी स्पीशीज़ पर एक इष्टतमीकरण से बदल देता है, और NASA CEA, STANJAN और Cantera जैसे कोड इसी तरह ज्वालाओं, रॉकेट निकास और वायुमंडलों की गणना करते हैं। यहाँ का हलकर्ता Gordon–McBride रूप (NASA RP-1311) में RAND विधि है: $\ln n_j$ पर न्यूटन विधि, जिसे $\pi_i$ और $\Delta\ln n_{tot}$ के लिए एक छोटे $(E{+}1)\times(E{+}1)$ तंत्र तक घटाया जाता है, और चरण सीमित किया जाता है ताकि मुख्य स्पीशीज़ प्रति चरण अधिकतम $e^2$ गुना बदलें। लघुगणकों में काम करने से $10^{-30}$ मोल अंश वाली अल्प स्पीशीज़ धनात्मक और सटीक रहती हैं। कंसोल दो इष्टतमता जाँच (तत्व संतुलन और $\mu_j/RT
  = \pi_i A_{ij}$, दोनों मशीन परिशुद्धता के निकट) और एक autograd जाँच छापता है: torch से $G/RT$ का अवकलन फिर से $\pi_i A_{ij}$ देता है। क्या देखें: लगभग 1500 K से नीचे उत्पाद केवल CO₂, H₂O और N₂ हैं (तथा क्षीण मिश्रण में O₂); 2000 K से ऊपर वे वियोजित होते हैं (CO₂ → CO + ½O₂, H₂O → OH + ½H₂, फिर परमाणुओं में), क्योंकि एन्ट्रॉपी पद $-T\,S$ बंध एन्थैल्पी पर भारी पड़ता है। वियोजन ऊष्मा अवशोषित करता है, इसलिए साम्य ज्वाला उस ज्वाला से लगभग 100 K ठंडी है जिसके उत्पाद अक्षत रहते (नीचे दाएँ), और सबसे गर्म ज्वाला रससमीकरणमितीय से थोड़ी समृद्ध (rich) ओर जलती है। ले शातेलिए देखने के लिए $P$ बढ़ाएँ: कम अणु अनुकूल होते हैं, इसलिए वियोजन दबता है। आँकड़े: $\Delta_f H^\circ$(298 K) और $S^\circ$(298 K) NIST-JANAF तालिकाओं से पूर्णांकित मान हैं। ऊष्मा धारिताएँ उदाहरणात्मक स्थिरांक हैं (लगभग 298 से 2000 K तक का औसत $c_p$), $T$ के सारणीबद्ध फलन नहीं, इसलिए संघटन अर्ध-मात्रात्मक हैं: यह मॉडल 1 bar पर रससमीकरणमितीय मेथेन–वायु के लिए $T_{ad} \approx 2260$ K देता है, जबकि सटीक ऊष्मरसायन लगभग 2225 K देता है। सरलीकरण:
  आदर्श गैसें, कोई संघनित प्रावस्था नहीं (न कालिख, न द्रव जल), उत्पादों में CH₄ या अन्य हाइड्रोकार्बन नहीं, और केवल साम्य: वास्तविक ज्वालाएँ CO और NO को गतिकी द्वारा जमा देती हैं, ऊष्मागतिकी द्वारा नहीं।'
meanings:
- स्पीशीज़ $j$ (CO₂, H₂O, CO, H₂, O₂, N₂, OH, H, O, NO) में तत्व $i$ (C, H, O, N) के परमाणु
- CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂) द्वारा दिए गए परमाणु, प्रति तुल्यता अनुपात $\varphi$ एक पंक्ति
- 'बैच: हर तापमान एक स्वतंत्र न्यूनीकरण है, सब एक साथ हल'
- $\Delta_f H^\circ$, $S^\circ$ और स्थिर $c_p$ से $[H_j(T) - T S_j(T)]/RT$
- 'दोहराया गया $j$ ⇒ योग: हर मिश्रण की गिब्स ऊर्जा'
- उपस्थित हर तत्व के परमाणु; हल पर $b_i$ के बराबर
- '$j$ पर योग: न्यूटन आव्यूह, प्रति पंक्ति एक भारित $A\,\mathrm{diag}(n)\,A^{\mathsf T}$'
- प्रति तापमान एक छोटा $(E{+}1)\times(E{+}1)$ तंत्र, सब एक कॉल में हल
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$, $i$ पर योग; NASA CEA की तरह अवमंदित
- 'autograd जाँच: न्यूनतम पर $\pi_{bi}A_{ij}$ के बराबर (लैग्रांज शर्त)'
- 'उत्पाद एन्थैल्पी; $T$ पर द्विभाजन जब तक यह अभिकारक एन्थैल्पी के बराबर न हो: $T_{ad}$'
labels:
  phi: तुल्यता अनुपात $\varphi$ (ईंधन / रससमीकरणमितीय ईंधन)
  P_bar: दाब $P$
  T_max: स्वीप का उच्चतम तापमान
