title: 'एकल-कोशिका RNA-seq: PCA और k-means क्लस्टरिंग'
summary: 'एक कृत्रिम एकल-कोशिका प्रयोग: कुछ प्रकारों की कोशिकाएँ, हर प्रकार अपने चिह्नक (marker) जीन चालू करता है, ऋणात्मक-द्विपद गिनतियों और अलग-अलग गहराई तक अनुक्रमित कोशिकाओं के साथ। हम मानक पाइपलाइन को टेंसर संक्रियाओं के रूप में चलाते हैं: $\log(1 + 10^4 K_{cg}/n_c)$ तक सामान्यीकरण, अत्यधिक परिवर्तनशील जीन रखना, SVD से PCA, फिर समांतर कई पुनरारंभों के साथ k-means, और क्लस्टरों को समायोजित रैंड सूचकांक (adjusted Rand index) से वास्तविक प्रकारों के सापेक्ष अंक देना।'
notes: 'हर कोशिका हज़ारों जीनों में फैली कुछ हज़ार mRNA गिनतियाँ देती है, इसलिए अधिकांश प्रविष्टियाँ शून्य हैं और कच्ची गिनतियाँ मुख्यतः यह दर्शाती हैं कि कोशिका कितनी गहराई तक अनुक्रमित हुई। लाइब्रेरी आकार $n_c$ से भाग देने पर गहराई हट जाती है; लघुगणक अभिव्यक्ति स्तरों की विशाल सीमा को काबू में करता है। अधिकांश जीन केवल रव रखते हैं, इसलिए हम वे जीन रखते हैं जिनका प्रसरण समान माध्य वाले जीनों से अधिक है: अत्यधिक परिवर्तनशील जीन, जो रोपित चिह्नकों से समृद्ध हैं। फिर PCA उन्हें संपीडित करता है: $K$ प्रकारों के साथ संकेत लगभग $K-1$ दिशाओं में रहता है, जो स्क्री (scree) प्लॉट के पहले $K-1$ स्तंभों के एक सपाट रव तल से ऊपर उठने के रूप में दिखता है। k-means दो चरणों को बारी-बारी से करता है, हर कोशिका को निकटतम केंद्र को सौंपना और हर केंद्र को उसकी कोशिकाओं के माध्य पर ले जाना; कोई भी चरण जड़त्व $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$ को बढ़ा नहीं सकता, इसलिए यह अभिसरित होता है, पर केवल एक स्थानीय न्यूनतम तक, इसीलिए कई यादृच्छिक आरंभ साथ-साथ चलाए जाते हैं (धूसर वक्र) और सबसे अच्छा रखा जाता है।
  चूँकि हम वास्तविक प्रकार जानते हैं, समायोजित रैंड सूचकांक परिणाम को ईमानदारी से अंक देता है। वैकल्पिक t-SNE मानचित्र autograd से प्रशिक्षित एक छोटा बल-विन्यास (force layout) है (Student-t समानताएँ, आरंभिक अतिशयोक्ति); ऐसे मानचित्रों में क्लस्टरों के बीच की दूरियों का अर्थ बहुत कम है। वास्तविक पाइपलाइनें (Scanpy, Seurat) गुणवत्ता नियंत्रण, बैच संशोधन और निकटतम-पड़ोसी ग्राफ़ पर ग्राफ़-आधारित क्लस्टरिंग (Leiden) जोड़ती हैं, और वास्तविक कोशिका प्रकार शायद ही इतने साफ़ होते हैं। छोटा गुणज परिवर्तन (fold change), कम चिह्नक या गलत $k$ आज़माएँ।'
meanings:
- 'प्रकार $k$ में जीन $g$ की माध्य अभिव्यक्ति: एक लॉग-सामान्य आधार रेखा, $k$ के $M$ चिह्नक जीनों के लिए गुणज परिवर्तन से गुणा'
- ऋणात्मक-द्विपद गिनतियाँ (प्रसरण $m + \varphi m^2$); $s_c$ एक लॉग-सामान्य अनुक्रमण गहराई है
- 'लाइब्रेरी आकार: कोशिका $c$ की कुल गिनतियाँ, $g$ पर योग'
- गहराई-सामान्यीकृत (प्रति $10^4$ गिनतियाँ, CPM की तरह) और लघुगणक-रूपांतरित
- परिक्षेपण $\mathrm{Var}/\mathrm{Mean}$, समान माध्य के बिनों के भीतर मानकीकृत (one-hot einsum से बिन योग)
- $H$ अत्यधिक परिवर्तनशील जीनों पर केंद्रित आव्यूह का PCA; torch.pca_lowrank वही शीर्ष घटक देता है
- PC स्कोर, $g$ पर योग; $\Sigma_p^2/\sum_q\Sigma_q^2$ व्याख्यात-प्रसरण अनुपात है
- पुनरारंभ $r$ के केंद्र $k$ से कोशिका $c$ की वर्ग दूरी; $p$ पर योग, सभी $R$ पुनरारंभ एक साथ
- 'नियुक्ति चरण: हर कोशिका अपने निकटतम केंद्र से जुड़ती है'
- 'अद्यतन चरण: हर केंद्र अपनी कोशिकाओं के माध्य पर जाता है, $c$ पर योग'
- आसंग तालिका $n_{ij}$ से युग्म-गणना सहमति (one-hot einsum); 1 = पूर्ण, लगभग 0 = यादृच्छिक
labels:
  n_cells: कोशिकाएँ $C$
  n_genes: जीन $G$
  n_types: वास्तविक कोशिका प्रकार $K$
  n_markers: प्रति प्रकार चिह्नक जीन
  fold_change: चिह्नक गुणज परिवर्तन
  dispersion: ऋणात्मक-द्विपद परिक्षेपण $\varphi$
  depth_spread: लाइब्रेरी-आकार फैलाव (लॉग-सामान्य $\sigma$)
  n_hvg: रखे गए अत्यधिक परिवर्तनशील जीन
  n_pcs: क्लस्टरिंग के लिए मुख्य घटक
  k: क्लस्टर $k$
  kmeans_iters: k-means पुनरावृत्तियाँ
  embedding: '2D दृश्य: PC1–PC2 या t-SNE'
