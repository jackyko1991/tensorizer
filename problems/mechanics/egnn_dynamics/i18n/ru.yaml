source_hash: 95b6effde453
title: E(n)-эквивариантная графовая нейронная сеть для динамики частиц
summary: Крошечная E(n)-эквивариантная графовая нейронная сеть (EGNN) учится продвигать во времени трёхмерную систему заряженных частиц. Её сообщения зависят только от расстояний $|\mathbf x_i - \mathbf x_j|^2$, а обновления координат направлены вдоль $\mathbf x_i - \mathbf x_j$, поэтому поворот входа в точности поворачивает предсказание; обычный MLP на тех же данных должен этому научиться — и не научается.
notes: 'Истинная система: $N$ частиц единичной массы с зарядами $c_i = \pm 1$, сглаженными кулоновскими силами и слабыми пружинами $k_s$ между каждой парой (чтобы облако не разлеталось), проинтегрированная RK4 с шагом $\Delta t / 10$. Обе сети видят одни и те же пары (состояние в $t$, состояние в $t + \Delta t$) из нескольких случайных систем и обучаются Adam по среднеквадратичной ошибке; отложенные системы дают тестовую ошибку. EGNN (Satorras, Hoogeboom & Welling, «E(n) Equivariant Graph Neural Networks», ICML 2021) строит сообщение $m_{ij}$ для каждой пары только из инвариантных входов (признаки узлов, $d_{ij} = |\mathbf x_i - \mathbf x_j|^2$ и произведение зарядов), затем сдвигает каждую частицу вдоль направлений $\mathbf x_i - \mathbf x_j$ с обученными скалярными весами. Заметьте, что это в точности форма истинного закона сил, $\ddot{\mathbf x}_i = \sum_j w_{ij}(\mathbf x_i - \mathbf x_j)$: симметрия встроена в архитектуру, а не выучивается из данных. Проверка поворачивает и сдвигает
  тестовый вход на случайные $R$ и $\mathbf s$: для EGNN $f(R\mathbf x + \mathbf s) = Rf(\mathbf x) + \mathbf s$ выполняется с точностью до округления float32 (около $10^{-6}$), тогда как для MLP, который видит сплющенные координаты, расхождение порядка самого предсказания. При малом числе обучающих систем EGNN достигает меньшей тестовой ошибки с гораздо меньшим числом весов. При прогоне каждой модели подаются её собственные предсказания; ошибки накапливаются в обеих, потому что заряженная система хаотична, но EGNN дольше остаётся близко. Упрощения: три слоя ширины 32, скоростной вариант EGNN с $\tau = \Delta t / L$ (наш выбор), полнопакетное обучение и фиксированное зерно. Та же идея эквивариантной передачи сообщений лежит в основе машинно-обученных межатомных потенциалов, таких как NequIP (Batzner et al., Nature Communications 2022), и эквивариантных диффузионных моделей, генерирующих трёхмерные молекулы (Hoogeboom et al., ICML 2022). Попробуйте меньше обучающих систем: разрыв между двумя
  сетями растёт.'
meanings:
- положение и скорость частицы $i$ в системе $b$, декартова компонента $a$
- все попарные разности положений через трансляцию (broadcasting)
- 'повторяющийся $a$ ⇒ суммирование: квадраты расстояний, единственный геометрический вход MLP (инвариантен к поворотам)'
- 'истинная сила: повторяющийся $j$ ⇒ суммирование по партнёрам (Кулон плюс пружины)'
- сообщение на каждой паре, $H = 32$ признака
- 'обновление координат: повторяющийся $j$ ⇒ суммирование; вектор, построенный только из $\mathbf x_i - \mathbf x_j$, поэтому он поворачивается вместе с входом'
- 'инвариантный скаляр, умноженный на вектор: по-прежнему эквивариантен'
- случайный поворот, используемый для проверки эквивариантности
labels:
  n_particles: Частицы $N$
  n_train: Обучающие системы
  dt: Шаг модели по времени $\Delta t$
  n_iter: Итерации обучения
  lr: Скорость обучения Adam
  rollout_steps: Шаги прогона
