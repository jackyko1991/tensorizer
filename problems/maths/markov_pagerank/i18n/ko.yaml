source_hash: 9576f7bf38f3
title: 마르코프 연쇄와 페이지랭크
summary: 무작위 서퍼가 작은 합성 웹에서 링크를 클릭하다가 가끔 무작위 페이지로 점프한다. 각 페이지에 있을 확률은 클릭마다 행렬–벡터 곱 한 번으로 변하며, 그 정상 분포가 페이지랭크이다. 여기서는 거듭제곱 반복, 고유값 분해, 그리고 수천 명의 서퍼를 동시에 시뮬레이션하는 방법으로 구한다.
notes: $S$는 열 확률 행렬이므로 확률 벡터를 확률 벡터로 보내지만, 웹 그래프에는 나가는 링크가 없는 페이지와 서퍼를 가두는 페이지 묶음이 있다. 막다른 페이지에는 균일한 열을 준다(서퍼가 무작위 주소를 입력한다). 그리고 순간 이동 항이 $G$의 모든 성분을 양수로 만든다. 그러면 페론–프로베니우스 정리에 의해 정상 분포는 유일하고 양수이며 어떤 시작점에서도 도달한다. $G$의 다른 모든 고유값은 $S$의 고유값의 $d$배이므로 $|\lambda_2| \le d$이고, 거듭제곱 반복은 적어도 $d^k$만큼 빠르게 수렴한다. 오른쪽 패널은 함께 푼 감쇠 인자 배치를 보여 준다. $d = 0.85$(Brin과 Page가 1998년에 제안한 값)이면 50단계로 웹의 크기와 무관하게 오차가 적어도 $0.85^{50} \approx 3\times10^{-4}$배로 줄어든다. 서퍼들은 같은 연쇄의 몬테카를로 추정이다. 그 비율은 $1/\sqrt W$ 정도의 잡음 범위에서 $\mathbf x_k$를 따르며, 시간 평균을 내면 거듭제곱 반복과 일치하는 순위를 준다. 막다른 페이지 처리를 빼면 확률이 새어 나가는 것을 터미널이 보여 준다. $d \to 1$로 해서 수렴이 느려지고 순위가 닫힌 페이지 묶음에 쌓이는 것을 보자.
meanings:
- '페이지 $j$가 페이지 $i$로 링크하면 1: 열은 서퍼가 떠나는 페이지'
- '$i$에 대해 합산: 페이지 $j$의 나가는 링크 수'
- 무작위 링크 클릭; 막다른 페이지($d_j = 0$)는 균일한 열 $1/N$을 받음
- 감쇠 인자 배치 $d_b$에 대한 구글 행렬; $1 - d$는 순간 이동 확률
- '반복된 $j$ ⇒ 합산: 모든 $d_b$에 대해 거듭제곱 반복 한 단계를 한꺼번에'
- 고유값 1의 고유 벡터, 합이 1이 되도록 스케일; $G$는 대칭이 아니므로 eigh가 아니라 eig
- '두 번째로 큰 고유값의 절댓값: 오차가 단계마다 이 비율로 줄어들며, $|\lambda_2| \le d$'
- '$W$명의 서퍼 각각의 페이지: 확률 $d$로 링크를 따라가고, 아니면 순간 이동'
labels:
  damping: 감쇠 인자 $d$
  pages: 페이지 수 $N$
  dangling: 막다른 페이지
  walkers: 무작위 서퍼 수 $W$
  iterations: 단계 수
  seed: 그래프 시드
