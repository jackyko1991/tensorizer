<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A convolutional filter W slides along a one-hot DNA sequence x; its best match, found by max pooling, gives the probability y-hat that the sequence contains the planted binding motif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- filter W sliding along the sequence -->
    <rect x="30" y="20" width="75" height="24" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="67" y="37" fill="#ffffff" font-style="italic" text-anchor="middle">W</text>
    <line x1="111" y1="32" x2="141" y2="32" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
    <line x1="30" y1="48" x2="30" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="105" y1="48" x2="105" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- DNA sequence, planted site highlighted -->
    <rect x="10" y="62" width="220" height="24" rx="3" fill="none" stroke="#374151" stroke-width="2"/>
    <rect x="105" y="64" width="75" height="20" fill="#93c5fd"/>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#374151">
      <text x="22" y="79" text-anchor="middle">A</text><text x="37" y="79" text-anchor="middle">T</text><text x="52" y="79" text-anchor="middle">C</text><text x="67" y="79" text-anchor="middle">A</text><text x="82" y="79" text-anchor="middle">G</text><text x="97" y="79" text-anchor="middle">T</text><text x="112" y="79" text-anchor="middle">G</text><text x="127" y="79" text-anchor="middle">G</text><text x="142" y="79" text-anchor="middle">G</text><text x="157" y="79" text-anchor="middle">A</text><text x="172" y="79" text-anchor="middle">C</text><text x="187" y="79" text-anchor="middle">T</text><text x="202" y="79" text-anchor="middle">T</text><text x="217" y="79" text-anchor="middle">A</text>
    </g>
    <rect x="105" y="62" width="75" height="24" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="16" y="104" font-style="italic">x</text>
    <!-- max pooling → probability -->
    <path d="M142,88 C142,108 150,118 130,124" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="150" y="110" font-size="13">max</text>
    <rect x="70" y="114" width="56" height="26" rx="4" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="98" y="132" text-anchor="middle" font-style="italic">ŷ</text>
    <text x="98" y="154" text-anchor="middle" font-size="13" fill="#6b7280">site?</text>
  </g>
</svg>
