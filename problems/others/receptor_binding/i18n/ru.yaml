source_hash: 9b626f6fbe35
title: Связывание рецептор–лиганд ($k_{\mathrm{on}}$, $k_{\mathrm{off}}$)
summary: Насколько прочно и как долго иммунный рецептор (T-клеточный рецептор или антитело) удерживает свою мишень? Кинетика закона действующих масс с константой ассоциации $k_{on}$ и константой диссоциации $k_{off}$ решается сразу для нескольких вариантов рецептора и целого титрования концентраций лиганда в одном тензоре $(B, C)$ и показывается в виде сенсограммы в стиле SPR рядом с изотермами связывания.
notes: 'Для связывания свободный рецептор и свободный лиганд должны встретиться, поэтому скорость равна $k_{on} R L$; диссоциация происходит с каждым комплексом независимо, со скоростью $k_{off} C$. В равновесии они уравновешиваются, и доля связанных рецепторов равна $\theta = L/(L + K_D)$, где $K_D = k_{off}/k_{on}$: половина рецепторов занята при $L = K_D$ (метка на каждой изотерме). Если начать с пустых рецепторов, выход на равновесие экспоненциальный: $C(t) = C_{eq}(1 - e^{-k_{obs} t})$, где $k_{obs} = k_{on} L + k_{off}$; именно так приборы SPR (поверхностного плазмонного резонанса) измеряют $k_{on}$. После промывки буфером комплексы распадаются как $e^{-k_{off} t}$ с периодом полураспада $t_{1/2} = \ln 2 / k_{off}$ — временем удержания. Варианты охватывают реалистичные диапазоны: T-клеточные рецепторы слабо связывают пептид–MHC ($K_D \sim 1$–$10\,\mu$M, время удержания — секунды), антитело связывается прочно ($K_D \sim 0.1$ nM, время удержания — часы). Посмотрите на точки на изотермах:
  при низкой концентрации $k_{obs} \approx k_{off}$ мало, поэтому к началу промывки антитело ещё не достигло равновесия. Почему $k_{off}$ так важна для T-клеток? В модели кинетической корректуры (kinetic proofreading) связанный TCR должен пройти несколько сигнальных этапов (фосфорилирований), прежде чем активировать клетку, и всё сбрасывается, если лиганд отсоединится раньше. Комплекс, живущий дольше этих этапов, гораздо вероятнее подаст сигнал, поэтому T-клетка считывает время удержания $1/k_{off}$, а не только степень занятости, и может отличить чужеродный пептид от собственного, сродство которого отличается лишь умеренно. Упрощения: один сайт связывания на рецептор (без авидности и повторного связывания), хорошо перемешанный раствор и отсутствие ограничений массопереноса; при включённом истощении каждый комплекс забирает один лиганд из замкнутого объёма, и равновесие описывается решением квадратного уравнения вместо $L/(L + K_D)$.'
meanings:
- константы скорости варианта рецептора $b$ (TCR со слабым / средним / высоким сродством, антитело)
- концентрация лиганда $c$ в титровании (нМ); последняя — для сенсограммы
- свободные рецепторы и комплексы для каждого варианта и концентрации
- 'свободный лиганд: $L_c$ или $L_c - C_{bc}$ с истощением'
- 'суммирования нет: $k_b$ транслируется (broadcast) на каждую концентрацию $c$'
- правая часть для RK4; $R$ и $C$ меняются на $\mp J$, поэтому $R + C = R_T$
- 'константа диссоциации: концентрация лиганда, при которой связана половина рецепторов'
- равновесная занятость (пунктирные изотермы)
