source_hash: 65c4646e64b8
title: 速率定律與 Arrhenius 圖
summary: 反應有多快？溫度升高時又快多少？零級、一級與二級速率定律在一個 $(O, T)$ 張量中同時對六個溫度積分，$k(T) = A\,e^{-E_a/RT}$。接著一個帶雜訊的合成實驗揭示其反應級數（$[A]$、$\ln[A]$ 或 $1/[A]$ 哪張圖是直線？）與活化能（$\ln k$ 對 $1/T$ 的最小平方直線）。
notes: 每個速率定律都有一個積分形式，在合適的變數下成為直線：$[A] = [A]_0 - kt$（零級）、$\ln[A] = \ln[A]_0 - kt$（一級）與 $1/[A] = 1/[A]_0 + kt$（二級）。因此化學家把三張圖都畫出來，保留最直的那張（$R^2$ 最接近 1）；其斜率為 $\mp k$。第二種檢驗利用半衰期：由於 $t_{1/2} \propto [A]_0^{1-n}$，從 $[A]_0/2$ 到 $[A]_0/4$ 的時間是第一個半衰期的 $2^{n-1}$ 倍（較短、相等或兩倍長），由此得 $n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$。在數個溫度下重複實驗得到 $k(T)$，而 $\ln k$ 對 $1/T$ 的 Arrhenius 圖是斜率為 $-E_a/R$ 的直線。取 $E_a = 75$ kJ/mol，從 290 K 升溫到 300 K 約使反應加快 2.8 倍；舊的經驗法則「每升高 10 K 快兩倍」在室溫附近對應 $E_a \approx 50$ kJ/mol。每次實驗都追蹤到 90 % 的 A 反應完畢，因此低溫實驗比高溫實驗持續得久得多（見圖例）；左圖使用各實驗時間的比例，讓六條曲線能放在同一軸上，這不會改變哪張圖是直線。數據是合成的（虛構的反應、固定亂數種子的高斯雜訊）。取 $\ln$ 或 $1/x$ 會放大後期稀薄數據點的雜訊（$\sigma/[A]$ 與 $\sigma/[A]^2$），因此每個點以 $(dg/d[A])^{-2}$ 加權，即 $1$、$[A]^2$ 或 $[A]^4$，並捨去低於 $[A]_0$ 2 % 的點。試試加大雜訊，看 $R^2$ 檢驗變得不那麼明確，或縮窄溫度範圍，看 $E_a$ 的誤差增大。
meanings:
- 介於 $T_{min}$ 與 $T_{max}$ 之間的六個溫度（K）
- 反應級數 $0, 1, 2$，並排積分
- Arrhenius 速率常數，單位 $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$
- 每次實驗的速率；不對任何指標求和，$k_t$ 廣播到各級數
- 每次實驗追蹤到 90 % 轉化，各用自己的時鐘 $t = \tau\,t_{end}$
- RK4 軌跡，在測試中與精確的積分定律比對
- 對 $t$ 的三張圖；只有正確的級數給出直線
- 直線擬合的設計矩陣
- 正規方程矩陣；對 $s$（樣本）求和；權重 $w_s = (dg/d[A])^{-2}$，$w_s = 0$ 捨去低於 $[A]_0$ 2 % 的點
- 截距與斜率，對每張圖與每個溫度同時求得
- Arrhenius 直線：斜率 $-E_a/R$，截距 $\ln A$
labels:
  Ea: 活化能 $E_a$
  log10_A: 指前因子 $\log_{10} A$
  order: 所測反應的級數
  T_min: 最低溫度 $T_{min}$
  T_max: 最高溫度 $T_{max}$
  noise: 量測雜訊 $\sigma$
