title: 'Структуры Тьюринга: реакция–диффузия Грея–Скотта'
summary: Два вещества, которые реагируют и диффундируют с разной скоростью, могут превратить почти однородную смесь в пятна, полосы и лабиринты — такова идея Тьюринга 1952 года о том, как формируется окраска животных и другие биологические узоры. Модель Грея–Скотта решается на периодической сетке с 5-точечным шаблоном лапласиана сразу для четырёх пар $(F, k)$ в одном тензоре $(2, B, n, n)$, а анализ линейной устойчивости (дисперсионное соотношение $\lambda(q)$) показывает, где существует настоящая неустойчивость Тьюринга.
notes: 'Догадка Тьюринга состояла в том, что диффузия, которая обычно всё сглаживает, может дестабилизировать однородное состояние, если автокатализатор (здесь $v$) распространяется медленнее, чем ограничивающее его вещество ($u$): небольшой бугорок $v$ растёт локально, поедая $u$, а обеднение $u$ вокруг него не даёт расти соседям — короткодействующая активация и дальнодействующее ингибирование. Линейная устойчивость делает это точным. Волна $e^{i\mathbf q\cdot\mathbf x + \lambda t}$ на однородном состоянии растёт с собственными значениями $J - q^2\,\mathrm{diag}(D_u, D_v)$; если $\lambda(0) < 0$, но $\lambda(q) > 0$ для полосы $q$, то из крошечного шума появляется наиболее быстро растущая длина волны $2\pi/q_{\max}$. При $D_u = D_v$ каждое собственное значение просто сдвигается на $-Dq^2$, так что неустойчивость Тьюринга невозможна: установите отношение коэффициентов диффузии равным 1, и синяя область на карте исчезнет. В модели Грея–Скотта только пара «Turing» здесь относится к этому типу,
  и она стартует из своего однородного состояния плюс 1 % шума; штриховая линия проверяет, что амплитуда сначала растёт как $e^{\lambda_{\max} t}$. Знаменитые пятна, полосы и лабиринты (Пирсон, 1993) в основном живут там, где единственное однородное состояние — $u = 1$, $v = 0$, устойчивое к любому малому возмущению; этим структурам нужен конечный затравочный участок (несколько квадратов $v$), и они являются нелинейными самовоспроизводящимися структурами, а не линейной неустойчивостью Тьюринга. 5-точечный шаблон видит волну как $q^2 \to (4/h^2)\sin^2(qh/2)$, что близко к $q^2$ для длин волн во много ячеек. Реальные биологические примеры — расположение пальцев в конечностях, расположение волосяных фолликулов и полосы на коже рыб, где активатором и ингибитором служат сигнальные белки.'
meanings:
- скорость подачи и скорость удаления для пары $b$; замыкающие единицы транслируют их на сетку
- концентрации субстрата и автокатализатора в ячейке $(i, j)$ для каждой пары, сложенные в $y$ формы $(2, B, n, n)$
- четыре соседа минус учетверённый центр, с torch.roll для периодических границ
- автокаталитическая стадия $U + 2V \to 3V$, подача и удаление
- явный метод Эйлера с $\Delta t = 1$, устойчив, пока $D\,\Delta t / h^2 < 1/4$
- $(1, 0)$ всегда; ещё два, если $F \ge 4(F + k)^2$
- линеаризованная кинетика $\partial R_\alpha / \partial c_\beta$ в однородном состоянии
- наибольшее по $\operatorname{Re}$ собственное значение $M(q)$ для пакета из $Q$ волновых чисел
- 'состояние с $\lambda(0) < 0$, но $\lambda(q) > 0$ в полосе: неустойчивость Тьюринга'
