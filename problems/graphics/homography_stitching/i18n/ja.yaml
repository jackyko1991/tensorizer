source_hash: 7fc4a728d6a3
title: ホモグラフィ推定とパノラマ合成
summary: 平らなポスターを撮った 2 枚の写真は $3\times3$ のホモグラフィで結ばれます。特徴点の対応 1 つから線形方程式が 2 本得られます。正規化した直接線形変換（DLT）はこれを SVD で解き、RANSAC は 4 対応の仮説を数千個まとめて 1 回のバッチ SVD で当てはめ、誤った対応を除外します。その後、2 枚目の画像を変形し、1 枚目とフェザーブレンドしてパノラマにします。
notes: 平面を見るカメラは平面上の点を $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$ で画素に写すので、同じ平面の 2 つの視点は $H_2 H_1^{-1}$ で結ばれます。スケールが自由なので数は 8 個です。対応 1 つでそのうち 2 個が決まるので、一般の位置にある 4 対応で $H$ が定まります。それ以上の対応は DLT で最小二乗の意味で組み合わせます。Hartley の正規化をしないと $A$ の要素は 1 から $10^4$（画素の二乗）まで広がり、SVD の精度が落ちます。最小二乗は誤った対応に弱く、わずかな外れ値でも素朴なパノラマは目に見えてずれます。RANSAC（Fischler & Bolles, 1981）は代わりに多数のランダムな最小サンプルに $H$ を当てはめ、最も多くの対応が一致するものを残します。外れ値の割合が $\varepsilon$ なら、4 対応のサンプルがきれいである確率は $(1-\varepsilon)^4$ なので、理論上は数十サンプルで十分です。ここではバッチ SVD が安いので数千個を一度に解きます。インライアの残差は画素ノイズと一致します。手法は Hartley & Zisserman, Multiple View Geometry in Computer Vision に従います。実際のパイプラインでは SIFT や ORB などの特徴検出器から対応を得ます。
meanings:
- 視点 1 と視点 2 で対応する画素位置（既知のポスター上の点 + ノイズ。一部はランダムな誤対応に置き換え）
- $j$ が繰り返し ⇒ 和をとり、3 番目の成分（射影スケール）で割る
- 重心へ平行移動し、平均距離が $\sqrt 2$ になるよう拡大縮小（Hartley の正規化）
- $\mathbf x' \times H\mathbf x = 0$ から対応 1 つにつき 2 行。9 個の要素 $h_a$ について線形
- 最小特異値の右特異ベクトル。その後 $H = T'^{-1}\hat H\,T$
- RANSAC 仮説：$B$ 個のランダムな 4 対応サンプルを、形状 $(B, 8, 9)$ のバッチ SVD 1 回ですべて解く
- すべての仮説の下でのすべての対応の再投影誤差
- コンセンサス集合が最大の仮説。そのインライアで DLT により再推定
- 逆変形：パノラマの各画素が視点 2 のどこに対応するかを参照し、フェザリング重みでブレンド
labels:
  matches: 特徴点の対応数
  outliers: 誤対応の割合
  noise: 画素ノイズ $\sigma$
  hypotheses: RANSAC 仮説数 $B$
  threshold: インライア閾値 $\tau$
