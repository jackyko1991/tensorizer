source_hash: f81a85fc73c6
title: 原子炉の臨界
summary: 核分裂性物質の平板は臨界か？1群中性子拡散理論により、この問いは格子上の一般化固有値問題 $M\phi = \tfrac1k F\phi$ になる。べき乗法——次世代の中性子について繰り返し解く——は基本中性子束モードと増倍率 $k_{eff}$ に収束し、多数の平板幅についてのバッチ化した固有値計算で臨界寸法が求まる。
notes: $k$ はある世代の中性子数と前の世代の中性子数の比である。べき乗法の各ステップは1世代に相当する：高次の空間モードは毎ステップ $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$ 倍に縮むので、偏った初期分布は対称な $\sin(\pi x/L)$ の形に緩和する。薄い平板は中性子の漏れが多すぎる（$k < 1$）。臨界幅 $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$ を超えると連鎖反応が成長する。既定の1群定数は熱中性子炉を例示するものである（$k_\infty \approx 1.06$）。簡略化：エネルギー1群、反射体のない均質な裸の平板、$L$ は外挿境界間で測る、遅発中性子やフィードバックはない——これは時間依存ではなく静的な固有値計算である。
meanings:
- 内部の点；（外挿された）平板の面で $\phi = 0$
- 2階差分行列 $(1, -2, 1)/h^2$
- 漏れと吸収で失われる中性子
- 核分裂で生まれる中性子
- 繰り返される $j$ ⇒ 和をとる：次世代の核分裂源
- べき乗法の1ステップ
- 直接求解、$S$ 個の平板幅についてバッチ化
labels:
  width: 平板の幅 $L$
  diffusion: 拡散係数 $D$
  sigma_a: 吸収 $\Sigma_a$
  nu_sigma_f: 生成 $\nu\Sigma_f$
  n_iter: べき乗法の反復回数
  n_grid: 格子点数
