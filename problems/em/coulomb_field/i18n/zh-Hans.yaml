source_hash: 1470d7e1b6a9
title: 点电荷的电场
summary: 在网格上运用库仑定律和叠加原理。广播一次性构造出从每个电荷到每个格点的位移矢量，对电荷指标的一次 einsum 把它们的电场相加。一个电荷沿圆周运动，电场线随之变化。
notes: 取 $k = 1$ 的单位。电荷是三维空间中的点电荷，因此各自的电场按 $1/r^2$ 衰减；我们只观察包含它们的平面。箭头背离正电荷（红色）、指向负电荷（蓝色）；两个电荷同号时，它们之间出现电场为零的中性点。
meanings:
- 格点 $g$，分量 $i \in \{x, y\}$
- 电荷 $q$ 的位置
- 各电荷的电量
- 广播：从每个电荷到每个格点的矢量
- 重复的 $j$ ⇒ 求和：距离
- 重复的 $q$ ⇒ 求和：所有电荷的叠加
labels:
  q_fixed: 固定电荷
  q_moving: 运动电荷
  n_grid: 每边箭头数
