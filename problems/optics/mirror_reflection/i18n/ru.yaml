title: Отражение от плоского и вогнутого зеркал
summary: 'Закон отражения в виде одной векторной формулы: обратить составляющую направления луча вдоль нормали к поверхности. Лучи от лампы отражаются от плоского зеркала, а параллельные лучи — от вогнутого зеркала и собираются вблизи его фокуса $F = R/2$.'
notes: 'Формула обращает лишь составляющую $\mathbf d$ вдоль $\mathbf n$, поэтому угол падения автоматически равен углу отражения. Штриховые линии продолжают отражённые лучи за плоское зеркало: все они сходятся в мнимом изображении лампы. Для вогнутого зеркала через $F = R/2$ проходят только лучи, близкие к оси (параксиальные); более удалённые лучи пересекают ось ближе к зеркалу (сферическая аберрация).'
meanings:
- единичный вектор направления падающего луча $r$, компонента $i \in \{x, y\}$
- единичная нормаль зеркала в точке падения луча $r$
- 'повторяющийся $j$ ⇒ суммирование: одно скалярное произведение на луч (${}= -\cos\theta_i$)'
- направление отражённого луча, по-прежнему единичный вектор
- нормаль вогнутого зеркала направлена к его центру $c$
labels:
  radius: Радиус кривизны зеркала $R$
  n_rays: Лучей на зеркало
  aperture: Самый высокий луч (доля $R$)
