title: Coupled oscillators and normal modes
category: mechanics
level: intermediate
order: 1
summary: >
  $N$ equal masses joined by springs between two fixed walls. The springs become one stiffness tensor $K_{ij}$,
  its eigenvectors are the normal modes, and the motion is a superposition of modes summed with a single einsum.
animated: true
vector_form: 'm\,\ddot{\mathbf x} = -\mathsf K\,\mathbf x'
index_form: 'm\,\ddot x_i = -K_{ij}\,x_j,\qquad x_i(t) = \sum_n A_n\,e_{in}\cos(\omega_n t + \varphi_n)'
translation:
  - {symbol: 'x_i', code: 'x[t, i]', shape: '(T, N)', meaning: 'displacement of mass $i$ from its rest position'}
  - {symbol: 'K_{ij}', code: 'stiffness(n, k)', shape: '(N, N)', meaning: 'stiffness tensor: $2k$ on the diagonal, $-k$ next to it'}
  - {symbol: 'K_{ij}x_j', code: "einsum('ij,...j->...i', K, x)", shape: '(N,)', meaning: 'repeated $j$ ⇒ summed: net spring force on mass $i$'}
  - {symbol: '\omega_n^2,\ e_{in}', code: 'torch.linalg.eigh(K / m)', shape: '(N,), (N, N)', meaning: 'eigenvalues and eigenvectors (column $n$) = normal modes'}
  - {symbol: 'q_n = e_{in}x_i', code: "einsum('in,i->n', e, x0)", shape: '(N,)', meaning: 'repeated $i$ ⇒ summed: project the start onto each mode'}
  - {symbol: 'x_i(t)', code: "einsum('in,tn->ti', e, modal)", shape: '(T, N)', meaning: 'repeated $n$ ⇒ summed: superposition of modes'}
notes: >
  Because $K_{ij}$ is symmetric, eigh gives real frequencies and orthonormal modes, so every motion is a sum of
  independent cosines and no time stepping is needed. Start in a single mode and the chain keeps that shape forever;
  pluck one mass and the energy sloshes along the chain. The analytic frequencies are $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$.
params:
  n_masses: {default: 6, min: 2, max: 12, step: 1, type: int, label: Number of masses}
  k: {default: 10.0, min: 1, max: 50, step: 1, label: Spring constant, unit: N/m}
  m: {default: 1.0, min: 0.1, max: 5, step: 0.1, label: Mass, unit: kg}
  start: {default: first mass, type: choice, options: [first mass, middle mass, mode 1, mode 2, highest mode], label: Initial displacement}
  amplitude: {default: 0.3, min: 0.05, max: 0.45, step: 0.05, label: Initial amplitude, unit: m}
  t_max: {default: 10.0, min: 2, max: 40, step: 1, label: Simulated time, unit: s}
