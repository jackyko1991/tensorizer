source_hash: 293708490c35
title: 由共演化推得蛋白質接觸（DCA）
summary: 在摺疊蛋白質中彼此接觸的殘基，在演化中會一起突變。我們在立方晶格上摺疊一個玩具蛋白質，在其接觸上植入耦合 $J_{ij}(a,b)$，以吉布斯取樣從 Potts 模型取樣出多重序列比對，再僅從比對中找回接觸：以 one-hot einsum 計算成對統計量，以平均場 DCA $J \approx -C^{-1}$（或以 autograd 做偽似然）得到直接耦合，再以 APC 校正的 Frobenius 分數評分，並對照真實接觸圖檢查。
notes: 為何可行？若殘基 $i$ 改變了大小或電荷，與它接觸的殘基 $j$ 往往也必須改變，否則蛋白質會錯誤摺疊。在許多相關序列中，這會在比對的第 $i$ 與第 $j$ 欄之間留下相關。但相關具有遞移性：若 $i$ 接觸 $j$、$j$ 接觸 $k$，則 $i$ 與 $k$ 即使不接觸也會相關。直接耦合分析（DCA）擬合一個全域模型，即 Potts 模型（$q$ 態伊辛模型），其耦合 $J_{ij}$ 一次解釋所有相關，於是間接相關被解釋掉。在平均場近似下，耦合就是共變異數矩陣之逆取負號（類似偏相關）；偽似然最大化則改為對每一欄擬合 $P(s_i\mid\text{rest})$，在真實家族上通常更準確。動畫讓比對從 20 條序列增長到全部：DCA（上三角）隨深度改善，而單純共變異數（下三角）停滯不前，因為它的偽陽性是間接配對。此處資料確實來自已知接觸的 Potts 模型，所以精確率是誠實的分數。真實比對更難：幾個字母代替了 20 種胺基酸加上空位，序列之間有系統發生關係（真實的 DCA 會降低近似重複序列的權重），而且只有部分接觸會留下訊號。共演化是當今結構預測的根源：plmDCA 類的接觸曾為早期深度學習方法提供輸入，而 AlphaFold 2 以 MSA 為主要輸入，並用注意力機制學會自己的、豐富得多的使用方式。這個玩具展示的是該輸入背後的統計概念，而非 AlphaFold 的運作方式。試試較弱的耦合、較少的序列或更多字母 $q$。
meanings:
- 填滿 $X\times Y\times Z$ 盒子的蛇形鏈；接觸是指沿鏈相隔至少 3 的晶格鄰居
- 「真實」模型：隨機場，以及只在 $\mathcal C_{ij} = 1$ 處的隨機 $q\times q$ 耦合區塊
- 局部場：對序列 $n$ 的所有其他欄與字母的 $j, b$ 求和
- 棋盤式吉布斯取樣：接觸連接相反顏色，所以一半的位點可在全部 $N$ 條鏈中同時重新取樣
- 以 one-hot 張量表示的比對
- 對 $n$ 求和：單點與成對頻率；將 $f_{iajb}$ 對 $b$ 求和即得回 $f_{ia}$
- 混入均勻頻率的偽計數 $\lambda$ 後的連通相關
- 平均場 DCA：求 $L(q-1)$ 階方陣共變異數的逆；最後一個字母為參考態
- 偽似然替代方案：以 Adam 加 $L_2$ 懲罰對 $h, J$ 最大化
- 一對位點的耦合強度，對 $a, b$ 求和，在零和規範 $J^z$ 下
- 平均乘積校正：移除每欄的背景，使各列與各欄平均為 0
labels:
  fold: 晶格摺疊（盒子大小）
  q: 每欄字母數 $q$
  coupling: 植入耦合強度 $\sigma_J$
  n_seq: MSA 中的序列數 $N$
  sweeps: 每條序列的吉布斯掃描次數
  pseudocount: 偽計數 $\lambda$
  method: 推論：平均場 DCA 或偽似然
  plm_iters: 偽似然 Adam 步數
