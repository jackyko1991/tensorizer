source_hash: e9d43436470c
title: Рисование эпициклами
summary: Замкнутая кривая, заданная отсчётами в виде комплексных чисел $z_n = x_n + i\,y_n$, имеет дискретное преобразование Фурье $c_k$, и каждый член $c_k e^{2\pi i k t}$ — это окружность радиуса $|c_k|$, делающая $k$ оборотов за один проход. Соедините окружности конец к началу, начиная с самой большой, и перо заново прочертит кривую. Смотрите, как по мере добавления окружностей проявляется контур логотипа Tensorizer, а ошибка убывает точно так, как предсказывает равенство Парсеваля.
notes: 'Матрица ДПФ $W$ выписывает сумму целиком ($N^2$ произведений); `torch.fft.fft` даёт те же $c_k$ с помощью быстрого преобразования Фурье Кули–Тьюки за $O(N \log N)$, и тест проверяет их совпадение. ДПФ обратимо: все $N$ окружностей в точности воспроизводят $N$ отсчётов, а сдвиг по времени $z_{n-s}$ лишь умножает $c_k$ на фазу $e^{-2\pi i k s/N}$ (радиусы не меняются, меняется только начальная точка). Окружности, пройденной один раз, нужен единственный член ($k = 1$), а сердце $x = 16\sin^3 s$, $y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$ — тригонометрический многочлен, поэтому ровно 8 окружностей ($k = \pm1 \dots \pm4$) рисуют его идеально. С многоугольниками иначе: в каждом углу скорость скачком меняется, поэтому $|c_k|$ убывает лишь как $1/k^2$, а ошибка при $M$ окружностях — как $M^{-3}$; при малом числе окружностей углы скругляются, а вдоль сторон бегут колебания. Сама кривая непрерывна, поэтому (в отличие от прямоугольной волны в задаче о рядах Фурье, где функция имеет скачок)
  колебания затухают до нуля; 9-процентный выброс Гиббса живёт в скорости, которая скачок имеет. Если сохранять сначала самые большие окружности, ошибка убывает монотонно, потому что по Парсевалю ошибка в точности равна $\sum|c_k|^2$ по отброшенным окружностям. История: в астрономии Птолемея («Альмагест», II век) планеты двигались по окружности (эпициклу), центр которой скользит по другой окружности (деференту); при достаточном числе эпициклов можно подогнать любую периодическую замкнутую траекторию, поэтому система 1400 лет так хорошо согласовывалась с наблюдениями, не будучи правильной физикой. Путь логотипа — шестиугольный контур куба Tensorizer плюс три его внутренних ребра, пройденные туда и обратно. Попробуйте звезду с небольшим числом окружностей.'
meanings:
- кривая в виде комплексных чисел в равноотстоящие моменты $t_n = n/N$; многоугольники передискретизируются по длине дуги
- матрица ДПФ, частоты $k = -N/2 \dots N/2 - 1$
- 'повторяющийся $n$ ⇒ суммирование: окружность $k$ имеет радиус $|c_k|$ и начальный угол $\arg c_k$'
- 'окружности, упорядоченные по радиусу: цепочка сохраняет сначала самые большие'
- 'повторяющийся $k$ ⇒ суммирование: кривая, нарисованная $M_m$ самыми большими окружностями, сразу для всех $M$ ($K_{mk} = [r_k < M_m]$, $E_{tk} = e^{2\pi i k t}$)'
- 'накопленная сумма членов: центр каждой окружности цепочки, последний — это перо'
- среднеквадратичная ошибка в отсчётах, равная энергии отброшенных окружностей (Парсеваль)
labels:
  shape: Кривая
  n_points: Число отсчётов $N$
  max_terms: Наибольшее число окружностей $M$
