source_hash: bd0f5adb6f78
title: autograd로 라그랑지안에서 운동 방정식 유도
summary: 라그랑지안 $L = T - V$만 입력하면 torch.autograd가 오일러–라그랑주 방정식을 유도합니다. 헤세 행렬 $\partial^2L/\partial\dot q_i\partial\dot q_j$가 질량 행렬이고, 선형 풀이 한 번으로 $\ddot q$를 얻습니다. 용수철(탄성) 진자에 적용합니다.
notes: 용수철 진자의 운동 방정식은 하나도 손으로 쓰지 않았습니다. 라그랑지안을 바꾸면 동역학도 따라 바뀝니다. 여기서 $H = \operatorname{diag}(m, mr^2)$는 $r$에 의존하고, $C$에는 코리올리와 비슷한 결합 $2mr\dot\theta$가 들어 있습니다. 기본값 $k \approx 3mg/\ell_0$에서는 용수철 진동수가 흔들림 진동수의 약 두 배(2:1 공명)이므로 에너지가 늘어났다 줄었다 하는 운동과 흔들리는 운동 사이를 오갑니다. 같은 코드가 좌표 개수와 상관없이 작동하며, 대가는 단계마다 역전파 몇 번이 더 필요하다는 것뿐입니다.
meanings:
- '일반화 좌표 $(r, \theta)$: 용수철 길이와 각'
- 일반화 속도
- 손으로 입력하는 유일한 물리
- 1계 도함수; $p_i = \partial L/\partial\dot q_i$는 정준 운동량
- 질량 행렬과 혼합 2계 도함수의 $i$번째 행
- 반복된 $k$ ⇒ 합
- 가속도에 대해 푼 오일러–라그랑주 방정식
- 에너지 함수, 역시 autograd로 계산; 보존량
labels:
  m: 질량 $m$
  k: 용수철 상수 $k$
  rest_length: 자연 길이 $\ell_0$
  r0: 초기 길이 $r_0$
  theta0: 초기 각 $\theta_0$
  t_max: 시뮬레이션 시간
