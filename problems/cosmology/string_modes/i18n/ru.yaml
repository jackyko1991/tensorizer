  mode_b: 'Мода $\tilde n$ левых мод (открытая: вторая мода)'
  n_points: Точки вдоль струны $\sigma$
  n_levels: Показанные уровни масс
  R_max: Наибольший радиус окружности $R/\sqrt{\alpha'}$ в развёртке
