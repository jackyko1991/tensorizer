source_hash: 85a6136cffba
title: 分层介质中的斯涅耳定律
summary: 一束光线穿过三层折射率不同的介质。矢量形式的斯涅耳定律用一次 einsum 同时折射所有光线，并在发生全反射处切换为镜面反射。
notes: 光线以速度 $c/n$ 传播，所以穿过光线前端的虚线是一个波前：它在光密层中滞后。默认设置下底层是空气（$n = 1$）；在该界面上比临界角 $\arcsin(n_3/n_2)$ 更陡的光线发生全反射，折返向上。把两个折射率设为相等，界面就消失了。
meanings:
- 光线 $r$ 的单位方向，分量 $i \in \{x, y\}$
- 朝向入射光线的单位表面法向量
- 每条光线所遇界面处的折射率比 $n_1/n_2$
- 重复的 $j$ ⇒ 求和：每条光线的 $\cos\theta_i$
- 折射方向（仍为单位矢量）
- 镜面反射方向，用于 $1 - \eta^2(1 - c^2) < 0$ 处（全反射）
labels:
  n1: 顶层折射率 $n_1$
  n2: 中层折射率 $n_2$
  n3: 底层折射率 $n_3$
  n_rays: 光线数
  max_angle: 最大光线角
  t_max: 模拟时长
