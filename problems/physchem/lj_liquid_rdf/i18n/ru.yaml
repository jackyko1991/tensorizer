source_hash: cb188a4168d9
title: 'Флюид Леннард-Джонса: молекулярная динамика и радиальная функция распределения'
summary: 'Пятьсот атомов, взаимодействующих через потенциал Леннард-Джонса в периодическом ящике, интегрируются скоростным алгоритмом Верле. Все векторы пар находятся в одном транслируемом тензоре с условием ближайшего образа, а три состояния (газ, жидкость вблизи тройной точки и сжатое твёрдое тело) рассчитываются одним пакетом. Термостат Берендсена задаёт температуру, затем следует сохраняющий энергию прогон NVE, а гистограммы расстояний между парами дают $g(r)$: плоскую для газа, затухающие оболочки для жидкости, резкие пики решётки для твёрдого тела. Вириал даёт давление.'
notes: 'Приведённые единицы: длины в $\sigma$, энергии в $\varepsilon$, масса 1, $T^* = k_BT/\varepsilon$, время $\tau = \sigma\sqrt{m/\varepsilon}$; для аргона $\sigma = 3.4$ Å, $\varepsilon/k_B = 120$ K, так что состояние жидкости соответствует примерно 86 K. Это моделирование, которое Рахман провёл для жидкого аргона в 1964 году (Phys. Rev. 136, A405), с интегратором и анализом $g(r)$, введёнными Верле в 1967 году (Phys. Rev. 159, 98). Потенциал обрезается на $r_c = 2.5\sigma$ и сдвигается там к нулю, чтобы энергия была непрерывной; давление получает стандартную поправку на хвост $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$, которая предполагает $g = 1$ за радиусом обрезания. Термостат Берендсена масштабирует скорости к целевой температуре; он не воспроизводит точные канонические флуктуации, поэтому используется только для уравновешивания, а измерения берутся из обычного прогона NVE, где ровная кривая энергии проверяет интегратор. Газ и жидкость стартуют горячими, чтобы решётка
  расплавилась. Первый пик $g(r)$ жидкости находится около минимума потенциала $2^{1/6}\sigma$, последующие оболочки затухают, и $g \to 1$ примерно к $3\sigma$; твёрдое тело сохраняет пики ГЦК. Для газа давление сравнивается с идеальным газом и со второй вириальной поправкой $P = \rho T(1 + B_2\rho)$, $B_2$ интегрируется численно. Прогоны короткие (несколько $\tau$), поэтому средние несут статистический шум в несколько процентов. Полный тензор пар стоит $O(N^2)$ на шаг; производственные программы используют списки ячеек или соседей, чтобы дойти до миллионов атомов.'
meanings:
- газ $(0.05, 1.5)$, жидкость $(0.84, 0.72)$, твёрдое тело $(1.10, 0.60)$ в приведённых единицах
- старт на ГЦК-решётке, $N = 4n^3$ атомов, ящик $L_s = (N/\rho_s)^{1/3}$
- все векторы пар сразу трансляцией (broadcasting), затем свёрнутые к ближайшему образу
- повторяющийся $a$ ⇒ суммирование
- $-u^{\prime}(r)/r$, ноль на диагонали и за пределами $r_c = 2.5\sigma$
- повторяющийся $j$ ⇒ суммирование; $d_{saji} = -d_{saij}$ даёт третий закон Ньютона бесплатно
- 'полутолчок, дрейф (со свёрткой в ящик), новые силы, полутолчок: обратимо во времени и сохраняет энергию'
- термостат Берендсена только во время уравновешивания
- $\rho T + W/3V$ плюс поправка на хвост для пар за пределами $r_c$
- число пар в оболочке, делённое на число для идеального газа $\tfrac12 N\rho\,4\pi r^2\Delta r$
