title: Фотон-счётная КТ и разложение по материалам
summary: Фотон-счётный детектор сортирует каждый рентгеновский фотон по энергетическим интервалам, поэтому каждый луч даёт несколько измерений Бера–Ламберта $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$ вместо одного. Пакетная подгонка методом максимального правдоподобия (градиент через autograd, шаги метода скоринга Фишера) превращает пуассоновские подсчёты каждого луча в линейные интегралы воды, кости и йода; фильтрованная обратная проекция строит карты материалов и виртуальные монохроматические изображения и разделяет йод и кость, которые обычный сканер показывает одинаковыми.
notes: 'Фотон-счётные детекторы (теллурид кадмия или кремний) регистрируют отдельные фотоны и сравнивают высоту каждого импульса с несколькими порогами, поэтому подсчёт в каждом энергетическом интервале — отдельное измерение Бера–Ламберта. Первый фотон-счётный КТ-сканер был одобрен FDA США в 2021 году, и с тех пор спектральная визуализация, более высокое разрешение и меньший электронный шум перешли из исследований в клиники. Трём материалам нужно не менее трёх интервалов: вода и кость различаются в основном за счёт фотоэффекта, а йод добавляет K-край на 33.2 кэВ, поэтому помогает порог около 35 кэВ (попробуйте настройку 25, 50, 75 кэВ). Костная вставка разбавлена так, чтобы её энергетически взвешенное ослабление совпадало со вставкой йода 10 мг/мл, поэтому обычное изображение показывает их одинаковыми; карты материалов их различают. Виртуальные монохроматические изображения $\mu_m(E)a_m$ усиливают контраст йода при низкой энергии и не имеют чашеобразного артефакта ужесточения пучка, который
  виден на обычном изображении. Разложение на три материала усиливает шум (базисные кривые ослабления почти параллельны), поэтому ошибка по йоду убывает лишь как $1/\sqrt{N_0}$ и составляет несколько мг/мл на пиксель при умеренной дозе; клинические системы часто используют два базисных материала, шумоподавление и итеративную реконструкцию. Упрощения: параллельные пучки, идеальный детектор, кроме гауссова энергетического разрешения (без разделения заряда, наложения импульсов и K-выхода), без рассеяния, округлённые таблицы ослабления. Учебная модель, не для клинического применения.'
meanings:
- 'базисные количества на пиксель: доля воды, доля кости, йод в мг/мл'
- 'преобразование Радона каждой базисной карты: см воды, см кости, мг/см² йода вдоль луча $r = (\theta, s)$'
- ослабление каждого базисного материала на сетке с шагом 1 кэВ (XCOM, интерполяция в log-log, K-край йода на 33.2 кэВ)
- фильтрованный спектр трубки; вероятность того, что фотон с энергией $E_e$ засчитывается в интервал $b$ (гауссово энергетическое разрешение)
- 'Бер–Ламберт для каждого интервала: повторяющийся $m$, затем $e$ ⇒ суммирование; подсчёты $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$'
- градиент пуассоновского отрицательного логарифма правдоподобия; лучи независимы, поэтому один обратный проход даёт каждому лучу собственный градиент
- информация Фишера, повторяющийся $b$ ⇒ суммирование; $J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- 'одно решение системы $3\times 3$ на луч, пакетно: шаг скоринга Фишера (ньютоновского типа)'
- виртуальное монохроматическое изображение при энергии $E$ по реконструированным базисным картам, в HU
labels:
  kvp: Напряжение трубки
  dose: Фотонов на луч $N_0$
  thresholds: Энергетические пороги (кэВ)
  sigma_kev: Энергетическое разрешение $\sigma$
  n_pixels: Размер изображения $N$
  n_angles: Углы проекций
