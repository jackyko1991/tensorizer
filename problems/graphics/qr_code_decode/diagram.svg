<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A camera photographs a tilted QR code lying on a table. The three finder patterns sit in three corners; a homography H maps the code plane to the image, and a thumb covers part of the code">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the tilted card with the code, seen in perspective -->
    <polygon points="96,150 222,140 196,92 92,100" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <polygon points="106,143 210,135 189,98 103,104" fill="#93c5fd" fill-opacity="0.35" stroke="#1e40af" stroke-width="1"/>
    <!-- data modules (a few) -->
    <g fill="#1e40af">
      <rect x="140" y="112" width="5" height="4"/><rect x="152" y="108" width="5" height="4"/><rect x="160" y="118" width="5" height="4"/>
      <rect x="134" y="124" width="5" height="4"/><rect x="170" y="110" width="5" height="4"/><rect x="176" y="124" width="5" height="4"/>
      <rect x="148" y="128" width="5" height="4"/><rect x="128" y="112" width="5" height="4"/>
    </g>
    <!-- finder patterns: top-left, top-right, bottom-left of the code -->
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <polygon points="104,104 122,103 124,116 106,118"/>
      <polygon points="170,99 188,98 194,110 175,111"/>
      <polygon points="106,128 125,127 127,142 107,143"/>
    </g>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <rect x="110" y="107" width="7" height="6"/><rect x="177" y="102" width="8" height="6"/><rect x="112" y="132" width="8" height="6"/>
    </g>
    <!-- occluding thumb -->
    <ellipse cx="190" cy="128" rx="13" ry="8" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <!-- camera -->
    <rect x="14" y="20" width="40" height="26" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="44" cy="33" r="7" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="20" y="15" width="12" height="6" fill="#374151"/>
    <!-- viewing rays to the card corners -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="48" y1="38" x2="96" y2="150"/><line x1="48" y1="38" x2="222" y2="140"/>
      <line x1="48" y1="38" x2="196" y2="92"/><line x1="48" y1="38" x2="92" y2="100"/>
    </g>
    <!-- homography: code plane to image -->
    <path d="M150,84 Q120,50 64,36" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#flow)"/>
    <text x="122" y="54" font-style="italic" fill="#b45309">H</text>
    <text x="10" y="64" font-size="12" fill="#374151">camera</text>
    <text x="198" y="86" font-size="12" fill="#374151">code</text>
  </g>
</svg>
