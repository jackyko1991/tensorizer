source_hash: c4f16483f7b8
title: '양자 우주론: 루프 바운스'
summary: '양자 중력의 장난감 모형: 질량 없는 스칼라장으로 채워진 평탄한 우주의 루프 양자 우주론(LQC). 접속 $b$를 플랑크 크기 면적을 가진 루프의 홀로노미 $\sin(\lambda b)/\lambda$로 바꾸면 프리드만 방정식이 $H^2 = \frac{8\pi G}{3}\rho(1-\rho/\rho_c)$로 바뀝니다. 우주들의 배치에 대한 RK4 적분은 빅뱅이 $\rho = \rho_c \approx 0.41\,\rho_\mathrm{P}$에서의 바운스로 대체됨을 보여 주며, 같은 모형의 휠러–디윗(Wheeler–DeWitt) 파속은 고전적인 붕괴를 따라 특이점으로 들어갑니다. 양자 중력은 열린 연구 문제이며, 이것은 단순화된 하나의 접근법일 뿐입니다.'
notes: '플랑크 단위 $G = \hbar = c = 1$; 바르베로–이미르치(Barbero–Immirzi) 매개변수 $\gamma = 0.2375$. 접근법: 개선된($\bar\mu$) 동역학을 쓰는 루프 양자 우주론의 유효 방정식(Ashtekar, Pawlowski, Singh 2006; Taveras 2008)으로, 시계 역할도 하는 질량 없는 스칼라장을 가진 공간적으로 평탄한 FRW 우주를 다룹니다. 현황: 받아들여진 양자 중력 이론은 없습니다. LQC는 루프 양자 중력에서 영감을 얻은, 대칭으로 축소된 양자화이며, 완전한 LQG와의 연결은 확립되지 않았고, 유효 방정식은 이 모형에서 날카롭게 집중된 양자 상태의 수치적 진화와 일치하는 근사입니다. 바운스를 검증한 관측은 없습니다. 보여 주는 내용은 모형 안에서 정확합니다: 구속 조건이 보존되고, 유효 프리드만 방정식이 성립하며, 바운스 밀도 $\rho_c$는 모든 $p_\varphi$에 대해 같고, 부피는 $V(t) = \sqrt{V_B^2 + 12\pi G p_\varphi^2 t^2}$를 따릅니다. $\rho_c$에서 멀리 떨어지면(또는 $\lambda \to 0$이면) 고전적 일반 상대성 이론이 돌아옵니다: $H^2 = 8\pi G\rho/3$이고 부피는 유한한 시간 안에 $V = 0$까지 선형으로 줄어듭니다(빨간 점선: 특이점). 회색 띠는 같은 모형(루프 없이 양자화, $x = \ln V$)의 정확한 휠러–디윗 해입니다: APS가 발견했듯이, 고전적 수축선을 따라 $V \to 0$으로 미끄러지는 자유 파속입니다. 옅은 곡선은 더 작은 루프($\lambda/2$, $\lambda/4$)를 사용합니다: 바운스가 더 늦게, 더 높은 밀도에서 일어납니다. 프레임은 바운스 근처에 촘촘하게 배치되어 있습니다.'
meanings:
- 배치에 있는 각 우주 $b$의 부피, 접속, 스칼라장 (구속면 $C = 0$ 위)
- '루프 크기: $\lambda^2 = 4\sqrt3\pi\gamma\,\ell_P^2$는 LQG 면적 간극; 더 작은 $\lambda$ ⇒ 더 큰 $\rho_c$'
- 유효 구속 조건의 해밀턴 방정식, 모든 우주를 한 번에
- 고유 시간에 대한 RK4 궤적
- 해밀토니안 구속 조건, $0$으로 유지되어야 함 (RK4 표류는 터미널에 출력)
- '$3/(8\pi G\gamma^2\lambda^2)$: 바운스 밀도'
- '반복된 $k$ ⇒ 합산: 시계 $\varphi_p$와 $x = \ln V$ 격자 위의 휠러–디윗 파속'
labels:
  p_phi: 스칼라장 운동량 $p_\varphi$ ($\hbar$)
  gap_scale: LQG 면적 간극에 대한 루프 크기 $\lambda$
  log10_rho_start: 초기 밀도 $\log_{10}(\rho/\rho_c)$
  dt: RK4 시간 간격 $\Delta t$
  spread: 휠러–디윗 파속 폭 $\Delta k/k_0$
