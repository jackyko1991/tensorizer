source_hash: b1957b563a0a
title: ケプラーの法則
summary: 軌道の大きさと離心率の異なる惑星が、ニュートンの逆2乗則の重力のもとで恒星のまわりを回る。1回のバッチ化した RK4 積分で、ケプラーの3法則がすべて示される：恒星を焦点とする楕円軌道、面積速度一定、そして $T^2 \propto a^3$。
notes: 単位は AU、年、太陽質量なので $GM_\odot = 4\pi^2$ となり、ケプラーの第3法則は単に $T^2 = a^3$ となる。どの惑星も近日点から活力方程式の速さ $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$ で出発する。最も離心率の大きい軌道の陰影付き扇形は、どれも同じ時間 $T/12$ を要する。恒星の近くでは短く幅広く、遠くでは長く細いが、面積は常に等しい。$dA/dt = L/2$ であり $L$ が保存されるからである。周期はシミュレーションから $2\pi$ を掃くまでの時間として測る。恒星は固定されているとみなし（その質量は惑星よりはるかに大きい）、惑星どうしは引き合わない。
meanings:
- 恒星に対する惑星 $b$ の位置、$i \in \{x, y\}$
- 惑星 $b$ の速度
- 繰り返される $j$ ⇒ 和をとる：距離の2乗 $r_b^2$
- 恒星へ向かう逆2乗の引力
- 2次元のレヴィ＝チヴィタ記号、$\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- 単位質量あたりの角運動量；$dA/dt = L_b/2$ は一定
- $\tfrac12 v^2 - GM/r$；$a = -GM/2E$ を与える
labels:
  n_planets: 惑星数
  e_max: 最大離心率 $e$
  t_max: シミュレーション時間
  dt: 時間刻み
