<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A steep Burgers wave u(x) resolved on a fine grid, the same wave as cell averages on a coarse grid, fluxes F through the cell faces, and a small CNN that adds a learned correction delta F to a face flux">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- fine solution: a ramp ending in a shock -->
    <path d="M20,104 C60,96 110,74 150,52 C158,48 162,48 165,60 C168,90 170,108 176,110 L220,112" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="24" y="92" font-style="italic">u</text>
    <!-- coarse cell averages -->
    <path d="M20,103 H50 V97 H80 V88 H110 V76 H140 V62 H170 V95 H200 V111 H220" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- coarse grid -->
    <line x1="20" y1="128" x2="220" y2="128" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="50" y1="40" x2="50" y2="128"/><line x1="80" y1="40" x2="80" y2="128"/><line x1="110" y1="40" x2="110" y2="128"/>
      <line x1="140" y1="40" x2="140" y2="128"/><line x1="170" y1="40" x2="170" y2="128"/><line x1="200" y1="40" x2="200" y2="128"/>
    </g>
    <!-- fluxes through faces -->
    <line x1="132" y1="120" x2="150" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="162" y1="120" x2="180" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="120" y="148" font-style="italic" fill="#b91c1c">F<tspan font-size="10" dy="3">i+½</tspan></text>
    <!-- learned correction -->
    <rect x="182" y="14" width="44" height="22" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="204" y="30" text-anchor="middle" font-size="12">CNN</text>
    <path d="M190,36 Q178,44 172,56" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="146" y="30" font-style="italic" fill="#b45309" font-size="13">δF</text>
  </g>
</svg>
