source_hash: 63ac7ba591c6
title: 'Одна частица, увиденная много раз: нарезка единственной мировой линии'
summary: 'Спекулятивная гипотеза, а не установленная физика: каждый электрон — один и тот же объект, одна мировая линия, которая зигзагом идёт вперёд и назад во времени (одноэлектронная Вселенная Уилера, 1940). Срез времени пересекает её много раз: пересечения вперёд выглядят как электроны, назад — как позитроны. Этот шаг нарезает пакеты случайных мировых линий. Все электроны получаются в точности одинаковыми, а пары рождаются и аннигилируют в точках поворота. Но замкнутая мировая линия пересекает каждый срез назад столько же раз, сколько вперёд, а открытая добавляет не больше одной частицы в итоге, тогда как во Вселенной около $10^{80}$ барионов и почти нет антиматерии. В простейшей форме идея исключена.'
notes: 'Статус: спекулятивно; исключено в простейшей форме. Шаг 2 гипотезы проекции (собственная спекулятивная идея автора, см. описание серии; не установленная физика), для постулата P3: все частицы — проекции одного объекта. Шаг 1 (cosmology/projection_postulate) сформулировал постулаты; шаг 3 (cosmology/projection_dimension_budget) подсчитывает нужные им измерения. Сначала известная физика. В 1940 году в телефонном разговоре Джон Уилер предположил Ричарду Фейнману, что все электроны одинаковы, потому что это один электрон, мировая линия которого идёт вперёд и назад во времени; участок, идущий назад, — это позитрон. Фейнман рассказал эту историю в своей Нобелевской лекции 1965 года вместе со своим возражением: позитронов не так много, как электронов. Уилер предположил, что они могут быть спрятаны в протонах. Идея о том, что позитрон — это электрон, движущийся назад во времени, сохранилась как картина античастиц Фейнмана–Штюкельберга (Feynman, Phys. Rev. 76, 749, 1949), но одноэлектронная
  Вселенная — нет: в квантовой теории поля все электроны одинаковы, потому что они — возбуждения одного поля. Здесь мировая линия живёт в пространстве $D$ измерений ($D$ — параметр, никогда не фиксируемый равным 4); для срезов важна только её временная координата, как говорит P2. Предсказание гипотезы: срез времени (P2) пересекает мировую линию в $N_+$ пересечениях вперёд и $N_-$ пересечениях назад. Что вычисляется: пакеты гладких (случайные ряды Фурье, $K$ гармоник, амплитуды $\propto k^{-\beta}$) и шероховатых (броуновских) мировых линий, замкнутых или открытых, разрезанных $L$ срезами. Пересечения подсчитываются через scatter в разностный массив и сверяются с таблицей полного перебора. Для замкнутой петли $N_+ = N_-$ на каждом срезе; для открытой $Q = N_+ - N_-$ равно $[t_{end}\geq u] - [t_{start}\geq u]$, так что $|Q|\leq 1$ и $N\equiv Q$ (mod 2). Наклон среза (движущийся наблюдатель) не меняет $Q$. Полное число равно $2(\#\text{minima} - \#\text{maxima})$ ниже среза, так что пары рождаются
  в минимумах $t(s)$ и исчезают в максимумах. Среднее число для случайных гладких петель следует формуле Райса. Что получается бесплатно: каждое пересечение считывает массу и заряд одной и той же мировой линии, поэтому все электроны в точности одинаковы, а позитроны имеют в точности противоположный заряд и ту же массу (PDG 2024: $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$). Проверка по данным (data/*.csv, цитируемые числа): AMS-02 измерил долю позитронов в космических лучах $e^+/(e^+ + e^-)$ от 0.5 ГэВ до 1 ТэВ (Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0, 74 бина через базу данных CRDB): 0.13 при 0.6 ГэВ, минимум 0.053 около 8 ГэВ и от 0.15 до 0.16 выше 200 ГэВ. Значит, асимметрия $1 - 2f$ лежит между 0.67 и 0.89, против $0$ для замкнутой петли. В космических масштабах плотность барионов Planck 2018 $\Omega_b h^2 = 0.0224$ даёт $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (см. cosmology/baryon_asymmetry). При 411 фотонах на
  см$^3$ в сфере радиусом 46.5 миллиарда световых лет это $N_B\approx 9\times10^{79}$ барионов, а антиматерия отсутствует (BESS-Polar: антигелий/гелий ниже $6.9\times10^{-8}$; Cohen, De Rújula and Glashow 1998: в видимой Вселенной нет доменов антиматерии). Одна мировая линия даёт не больше $|Q|/N = 1/N$, что равно $7\times10^{-90}$ при $N\approx 1.5\times10^{89}$, против $\eta = 6\times10^{-10}$; суммарного заряда не хватает примерно в $10^{80}$ раз. Обзор по открытым параметрам (гладкие или броуновские, замкнутые или открытые, от 2 до 32 гармоник, три значения шероховатости, около $3\times10^5$ срезов с $N\geq 2$) не находит ни одной конфигурации, достигающей асимметрии AMS-02, и оценка показывает, что такой и не может быть: при $N\geq 2$ пересечениях наибольшая возможная асимметрия равна $1/3$ (при $N = 3$). Вердикт: исключено в простейшей форме. Расширения, каждое из которых — дополнительное предположение и обозначено как таковое: (A) открытая мировая линия добавляет одну частицу в итоге,
  не больше. (B) Смещённая проекция, при которой наблюдатели видят античастицы с эффективностью $r$, требует по AMS-02 $r = f/(1-f)$ между 0.056 и 0.195, меняющегося с энергией, но $r < 7\times10^{-8}$ по антигелию. Скрытая антиматерия тогда весила бы столько же, сколько видимые барионы, около 0.19 тёмной материи. Это «спрятаны в протонах» Уилера в современной форме; для этого нужен механизм, а он не предложен. (C) Если бы время было окружностью, петля, обёрнутая $w$ раз, несла бы суммарный заряд $Q = w$ на каждом срезе (проверено), но $w\approx 10^{80}$ пришлось бы задать вручную, а компактное время означает замкнутые времениподобные кривые. Ни одно из этого не является предсказанием. Возродить идею мог бы механизм, делающий число пересечений среза одним объектом асимметричным, и это открытый вопрос, который данный шаг оставляет серии. Путь к спасению: простая версия исключена, но глобально сбалансированная мировая линия, у которой антиматерия находится за нашим горизонтом или в CPT-зеркальной
  антивселенной, не исключена. Шаг 7 (cosmology/projection_antimatter_universe) перечисляет критерии, которым должна удовлетворять такая антиматериальная вселенная, и проверяет каждый по данным.'
meanings:
- 'повторяющиеся $k$ (гармоника) и $c$ (cos, sin) ⇒ суммирование: $B$ случайных мировых линий в $D$ измерениях; координата 0 — время'
- пересечения каждого среза вперёд (частица) и назад (античастица); сумма по сегментам $s$ — это scatter в разностный массив плюс кумулятивная сумма
- суммарный заряд на срезе; равен числу пересечений двух концов, $0$ для замкнутой петли
- 'то же число только по точкам поворота: минимумы рождают пары, максимумы их аннигилируют'
- формула Райса со спектральными моментами $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$
- зарядовая асимметрия космических $e^\pm$ по доле позитронов AMS-02 $f_E$ при энергии $E$
- суммарное барионное число, которое должна была бы нести одна мировая линия ($\eta$ по Planck 2018)
labels:
  worldlines: Мировые линии в пакете $B$
  samples: Отсчёты вдоль каждой мировой линии $S$
  modes: Гармоники на координату $K$ (как часто линия может зигзагом менять направление)
  roughness: 'Шероховатость $\beta$: гармоника $k$ имеет амплитуду $\propto k^{-\beta}$'
  dims: Размерность $D$ пространства, в котором живёт мировая линия (открытый параметр)
  slices: Срезы времени $L$
