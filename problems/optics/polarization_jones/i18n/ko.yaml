source_hash: 3434371fc2c6
title: 존스 행렬로 보는 편광
summary: 빛의 편광은 복소 2-벡터 $(E_x, E_y)$이며, 모든 편광판과 파장판은 복소 $2\times 2$ 행렬입니다. 빛이 파장판을 지난 뒤 회전하는 편광판을 지납니다. $\mathbf E$장 타원과 투과 세기는 einsum으로 얻으며, 말뤼스 법칙을 재현하고 선편광을 원편광으로 바꿉니다.
notes: 빛은 입력 각에서 세기 $I_0 = 1$인 선편광으로 시작합니다. 오른쪽의 회색 점선은 말뤼스 법칙 $I_0\cos^2\theta$(파장판 없음)이고, 파란 곡선은 파장판을 지난 후의 투과 세기입니다. 입력 편광에 45°로 놓인 1/4 파장판은 원편광($\lvert E_x\rvert$와 $\lvert E_y\rvert$가 같고 위상이 90° 차이)을 만들므로, 편광판 각도와 상관없이 $I_0/2$가 투과합니다. $\alpha$에 놓인 반파장판은 선편광을 $2\alpha$만큼 회전시킵니다. 존스 벡터 하나는 언제나 완전 편광입니다. 비편광은 서로 직교하는 두 입력의 세기를 평균해 다룹니다(main.py가 출력하는 편광판 세 장 검사에 사용).
meanings:
- '존스 벡터: $E_x$와 $E_y$의 복소 진폭 (위상차가 모양을 결정)'
- 실험실 좌표계를 소자 자체의 축으로 회전
- 각 $\theta$의 투과축 방향 장만 남김
- '느린 축을 $\Gamma$만큼 지연: $\Gamma = \pi/2$는 1/4 파장, $\Gamma = \pi$는 반파장'
- 소자들을 연결(반복된 $j$에 대해 합); 빛이 처음 만나는 소자가 오른쪽
- 빛을 광학계에 통과시킴
- '반복된 $i$ ⇒ 합: 세기'
- '한 주기 동안의 실제 장: 편광 타원을 그림'
labels:
  plate: 파장판
  plate_angle: 파장판 빠른 축 $\alpha$
  input_angle: 입력 편광 각
