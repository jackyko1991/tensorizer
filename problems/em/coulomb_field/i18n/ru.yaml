source_hash: 1470d7e1b6a9
title: Поле точечных зарядов
summary: Закон Кулона и принцип суперпозиции на сетке. Broadcasting за один раз строит вектор от каждого заряда к каждой точке сетки, а один einsum по индексу заряда складывает их поля. Один заряд движется по окружности, и силовые линии следуют за ним.
notes: Единицы с $k = 1$. Заряды — точечные заряды в 3D, поэтому поле каждого убывает как $1/r^2$; мы смотрим лишь на плоскость, в которой они лежат. Стрелки направлены от положительных зарядов (красные) и к отрицательным (синие); при двух зарядах одного знака между ними появляется нейтральная точка, где поле обращается в нуль.
meanings:
- точка сетки $g$, компонента $i \in \{x, y\}$
- положение заряда $q$
- величина каждого заряда
- 'broadcasting: вектор от каждого заряда к каждой точке сетки'
- 'повторяющийся $j$ ⇒ суммирование: расстояния'
- 'повторяющийся $q$ ⇒ суммирование: суперпозиция всех зарядов'
labels:
  q_fixed: Неподвижный заряд
  q_moving: Движущийся заряд
  n_grid: Стрелок на сторону
