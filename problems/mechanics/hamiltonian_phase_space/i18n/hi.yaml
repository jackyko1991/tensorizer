source_hash: c92568d7c613
title: 'हैमिल्टनी यांत्रिकी: कला समष्टि और सिम्प्लेक्टिक समाकलन'
summary: लोलक का हैमिल्टनी $H(q, p)$ एक बार लिखिए और torch.autograd से हैमिल्टन के समीकरण $\dot z_a = J_{ab}\,\partial H/\partial z_b$ प्राप्त कीजिए। कक्षाओं का पूरा पंखा और एक लिउविल बूँद (blob) एक ही टेंसर की तरह चलते हैं, और सिम्प्लेक्टिक leapfrog की होड़ कई आवर्तकालों तक स्पष्ट (explicit) ऑयलर और RK4 से कराई जाती है।
notes: 'पृथक्करण रेखा (separatrix) $H = mgL$, अर्थात $p = \pm 2mL\sqrt{gL}\cos(q/2)$, लाइब्रेशन (बंद लूप) को घूर्णन (लहरदार रेखाएँ जो दाईं ओर निकलकर बाईं ओर लौट आती हैं) से अलग करती है। इसके पास आवर्तकाल असीमित रूप से बढ़ता है, इसलिए बूँद का भीतरी किनारा बाहरी किनारे से आगे निकल जाता है: वह खिंचकर एक पतली सर्पिल बन जाती है, पर उसका क्षेत्रफल वही रहता है (लिउविल प्रमेय)। Leapfrog केवल द्वितीय कोटि का है, फिर भी उसकी ऊर्जा-त्रुटि हमेशा सीमित रहती है, क्योंकि वह पास के एक "छाया" हैमिल्टनी को ठीक-ठीक संरक्षित करता है; RK4 प्रति चरण कहीं अधिक सटीक है, पर उसकी त्रुटि लगातार बढ़ती जाती है, और स्पष्ट ऑयलर हर चरण में कला-समष्टि क्षेत्रफल को लगभग $1 + \omega^2\Delta t^2$ से गुणा कर देता है, जिससे ऊर्जा विस्फोटक रूप से बढ़ती है। बड़ा $\Delta t$ आज़माइए, या आवर्ती (harmonic) निकाय, जहाँ बूँद बस दृढ़ पिंड की तरह घूमती है।'
meanings:
- 'कला-समष्टि बिंदु $b$: कोण $q$ और कोणीय संवेग $p$; हर कक्षा-बिंदु और बूँद-बिंदु एक पंक्ति है'
- हैमिल्टनी, हाथ से लिखी गई एकमात्र भौतिकी
- योग की प्रवणता हर स्वतंत्र बिंदु को उसकी अपनी प्रवणता देती है
- 'सिम्प्लेक्टिक आव्यूह $[[0, I], [-I, 0]]$: प्रवणता को 90° घुमाता है'
- 'दोहराया गया $c$ ⇒ योग: सभी बिंदुओं के लिए एक साथ हैमिल्टन के समीकरण'
- 'किक–ड्रिफ्ट–किक (श्टॉर्मर–वर्ले): हर उप-चरण एक अपरूपण (shear) है, इसलिए क्षेत्रफल ठीक-ठीक संरक्षित रहता है'
- 'तुलना के लिए स्पष्ट ऑयलर: हर चरण में कला समष्टि को खींचता है'
- बूँद के बहुभुज का क्षेत्रफल; लिउविल के अनुसार यह स्थिर रहता है
