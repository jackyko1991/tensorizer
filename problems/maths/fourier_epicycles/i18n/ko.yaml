source_hash: e9d43436470c
title: 주전원으로 그림 그리기
summary: 복소수 $z_n = x_n + i\,y_n$로 표본화한 닫힌 곡선은 이산 푸리에 변환 $c_k$를 가지며, 각 항 $c_k e^{2\pi i k t}$는 한 바퀴 도는 동안 $k$번 회전하는 반지름 $|c_k|$의 원입니다. 가장 큰 원부터 원들을 꼬리에 머리를 잇듯 연결하면 펜이 곡선을 다시 그립니다. 원이 추가될수록 Tensorizer 로고의 윤곽이 나타나고, 오차는 파르스발 정리가 예측하는 그대로 줄어드는 것을 지켜보세요.
notes: 'DFT 행렬 $W$는 합을 전부 풀어 씁니다($N^2$번의 곱). `torch.fft.fft`는 쿨리–튜키 고속 푸리에 변환으로 $O(N \log N)$에 같은 $c_k$를 구하며, 테스트에서 두 결과가 일치하는지 확인합니다. DFT는 가역입니다. $N$개의 원을 모두 쓰면 $N$개의 표본이 정확히 재현되고, 시간 이동 $z_{n-s}$는 $c_k$에 위상 $e^{-2\pi i k s/N}$를 곱할 뿐입니다(반지름은 변하지 않고 시작점만 바뀝니다). 한 번 그려지는 원에는 항 하나($k = 1$)면 충분하고, 하트 $x = 16\sin^3 s$, $y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$는 삼각 다항식이므로 정확히 8개의 원($k = \pm1 \dots \pm4$)으로 완벽하게 그려집니다. 다각형은 다릅니다. 모든 꼭짓점에서 속도가 불연속적으로 바뀌므로 $|c_k|$는 $1/k^2$ 정도로만 줄어들고, $M$개의 원을 쓸 때의 오차는 $M^{-3}$ 정도로 줄어듭니다. 원이 적으면 꼭짓점이 둥글게 깎이고 변을 따라 물결 같은 진동이 나타납니다. 곡선 자체는 연속이므로 (함수가 불연속적으로 뛰는 푸리에 급수 문제의 사각파와 달리) 진동은 0으로 줄어듭니다. 9 %의 깁스 오버슈트는 실제로 불연속인 속도 쪽에 나타납니다. 가장 큰 원부터 남기면 오차가 단조 감소하는데, 파르스발 정리에 따라 오차는 버린 원들에 대한 $\sum|c_k|^2$와 정확히 같기 때문입니다. 역사: 프톨레마이오스의 천문학(알마게스트, 2세기)은 행성을 한 원(주전원) 위에서 움직이게 하고, 그 원의 중심이 다른 원(이심원) 위를 따라 돌게 했습니다. 주전원을 충분히 많이 쓰면 어떤 주기적인 닫힌 경로도 맞출 수 있기 때문에, 이 체계는 올바른 물리학이 아니었음에도 1400년 동안 관측과 아주 잘 맞았습니다. 로고 경로는 Tensorizer 정육면체의 육각형 윤곽과 세 개의 안쪽 모서리를 갔다가 되돌아오는 경로입니다. 적은 수의 원으로 별을
  그려 보세요.'
meanings:
- 같은 시간 간격 $t_n = n/N$에서의 복소수로 나타낸 곡선. 다각형은 호의 길이에 따라 다시 표본화합니다
- DFT 행렬, 진동수 $k = -N/2 \dots N/2 - 1$
- '반복된 $n$ ⇒ 합산: 원 $k$의 반지름은 $|c_k|$, 시작 각도는 $\arg c_k$'
- '반지름 순으로 정렬한 원: 사슬은 가장 큰 원부터 남깁니다'
- '반복된 $k$ ⇒ 합산: 가장 큰 $M_m$개의 원이 그리는 곡선을 모든 $M$에 대해 한꺼번에 계산 ($K_{mk} = [r_k < M_m]$, $E_{tk} = e^{2\pi i k t}$)'
- '항들의 누적 합: 사슬에 있는 각 원의 중심이며, 마지막 것이 펜입니다'
- 표본에서의 평균 제곱 오차로, 버린 원들의 에너지와 같습니다(파르스발)
labels:
  shape: 곡선
  n_points: 표본 수 $N$
  max_terms: 최대 원 개수 $M$
