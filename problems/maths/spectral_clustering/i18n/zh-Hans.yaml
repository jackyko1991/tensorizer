source_hash: 4a434cf0af06
title: 谱聚类与图拉普拉斯矩阵
summary: 把点云变成一张图（在 $k$ 近邻边上赋高斯权重），以张量构造图拉普拉斯矩阵 $L = D - W$ 及其归一化形式 $L_{sym}$，再从最低的几个本征向量中读出聚类。普通 k-means 无法处理的双月形和同心环被完美分开；同一个拉普拉斯矩阵作用于网格时，给出鼓膜的振动模式。
notes: 原理：$f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$ 是平方和，所以 $L$ 是半正定的，且只有当 $f$ 在每条边上取值相同，即在每个连通分量上为常数时才为零。因此零本征值的个数恰好等于连通分量的个数（比较终端中的两个计数），各分量的指示向量张成该本征空间。当聚类之间只由少数弱边相连时，本征值很小但不为零，本征向量接近指示向量；最小化 $f^{\mathsf T}Lf$ 是切断最少边问题的松弛版本，即 Shi 和 Malik（2000）的归一化割。第二个本征向量（Fiedler 向量）给出最佳的二分。普通 k-means 围绕中心画直线边界，所以会把月形和环一切为二；在嵌入空间中（上排，观察点的滑动）聚类是分离的团块，k-means 就能奏效。谱中第 $k$ 个本征值之后的大间隙提示了聚类的数目。在 $g\times g$ 网格图上，$L = L_1\otimes I + I\otimes L_1$ 是自由（Neumann）边界离散拉普拉斯算子的负值，因此其本征向量是驻波 $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$，$\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$：与波动主题中振动鼓膜的模式相同（那里是固定边界）。模式 $(a, b)$ 和 $(b, a)$ 共享一个本征值，eigh 返回这一对的某种混合，所以有些看起来是对角的。结果取决于 $\sigma$ 和 $k$：邻居太少会把一个聚类分成碎片，太多则会在聚类之间搭桥。延伸阅读：U. von Luxburg, A tutorial on spectral clustering (2007)；Ng, Jordan and Weiss (2001)。
meanings:
- 点 $i$、坐标 $a$：双月形、双环或三个团块，附带用于评分的真实标签
- 重复的 $a$ ⇒ 求和：一次算出所有距离的平方
- 仅当 $j$ 是 $i$ 的 $k$ 个最近邻之一或反之时才保留高斯相似度；对称，对角线为零
- 重复的 $j$ ⇒ 求和：每个点的度
- 每行之和为 0，因此常向量的本征值为 0
- $s_i = d_i^{-1/2}$；不求和，$i$ 和 $j$ 保持自由
- 本征值升序；前 $k$ 个本征向量（各行归一化为单位长度）就是谱嵌入
- 带 k-means++ 初始化的 Lloyd 迭代；在嵌入空间中聚类是紧凑的团块
labels:
  n_points: 每个数据集的点数 $N$
  noise: 噪声
  k_neighbours: 最近邻数 $k$
  sigma: 核宽度 $\sigma$
  grid: 网格图边长 $g$
