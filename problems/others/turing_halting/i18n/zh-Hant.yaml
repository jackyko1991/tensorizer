source_hash: 55836e86a221
title: 用一批圖靈機演示停機問題
summary: 不是物理，只是好玩：把幾十萬台圖靈機作為張量同時執行。所有機器的一步只是一個 gather（讀取每個讀寫頭下的紙帶）、一次用進階索引查找規則和一個 scatter（寫入）。列舉所有 2 狀態和 3 狀態的忙碌海狸候選機器，找到冠軍 $S(2) = 6$ 和 $S(3) = 21$，並親眼看看停機問題：無論選多大的步數預算，總有一些機器仍未判定。
notes: 圖靈（1936）證明了沒有任何程式能對每台機器和每個輸入判定它是否停機。一段話講清對角線論證：假設機器 $D(M)$ 能對每台以自身描述為輸入啟動的機器 $M$ 回答「停機」或「永遠執行」。構造 $G$，它執行 $D(M)$ 然後反著做：若 $D$ 說「停機」就永遠迴圈，若 $D$ 說「永遠執行」就停機。現在問 $G$ 在自身描述上會怎樣：如果它停機，$D$ 說的是它永遠執行；如果它永遠執行，$D$ 說的是它停機。無論哪種情況 $D$ 都錯了，所以 $D$ 不可能存在。Radó（1962）把它變成了一個遊戲，即忙碌海狸：在所有從空白紙帶出發且會停機的 $n$ 狀態 2 符號機器中，$S(n)$ 是最長的執行步數，$\Sigma(n)$ 是留下的 1 的最多個數。兩者都比任何可計算函數增長得更快，因為計算 $S(n)$ 的程式就能判定停機：讓每台機器執行 $S(n)$ 步，到那時還沒停機就永遠不會停。已知值：$S(2) = 6$、$\Sigma(2) = 4$（Radó），$S(3) = 21$、$\Sigma(3) = 6$（Lin 與 Radó 1965），$S(4) = 107$、$\Sigma(4) = 13$（Brady 1983），以及 $S(5) = 47\,176\,870$，由 bbchallenge 合作團隊在 2024 年證明，並用 Coq 驗證了其餘每台 5 狀態機器都永遠執行。圖中顯示了難點所在：已停機比例 $f(t)$ 先上升後變平，而有限的預算永遠無法區分一台慢慢才停機的機器和一台永遠執行的機器。這裡第 21 步之後的平台正是 3 狀態的已知答案，因為剩下的機器已被證明會迴圈。3 狀態的正規化：第一條規則固定為 A0 → 1RB，這是保留已知冠軍的常用選擇（由左右對稱性，第一步可設為向右；其他狀態的名字可以互換；在空白紙帶上一直停留在 A 的機器永不停機），並且每條停機規則都是 1RH，於是得到 $13^5 = 371\,293$ 台機器，而不是 $16^6$ 台。試試 4 個狀態：隨機樣本中很少包含 107 步的冠軍。
meanings:
- 機器 $b$ 在狀態 $q$、讀到符號 $r$ 時的規則表：（寫入 $w$，移動 $m = \pm1$，下一狀態 $q'$）；狀態 $n$ 是停機狀態 $H$
- 機器 $b$ 紙帶上的格子 $x$，開始時全為 0；$L = 2t_{\max} + 1$，保證沒有讀寫頭能到達盡頭
- 讀寫頭位置（開始在中間）和目前狀態（開始為 $A$）
- 一次讀取所有讀寫頭下的符號
- 進階索引：每台機器查找自己的規則
- 寫入；然後只在 $s_b \ne H$ 處移動並改變狀態（已停機的機器凍結）
- 機器 $b$ 進入 $H$ 的步數，或 $-1$：在預算內未判定
- 滿足 $\tau_b \le t$ 的機器比例：單調不減，並停在 1 以下
- 重複的 $x$ ⇒ 求和：停機機器留下的 1 的個數
labels:
  states: 狀態數 $n$（2 和 3 窮舉，4 抽樣）
  budget: 步數預算 $t_{\max}$
  n_sample: 隨機 4 狀態機器數
