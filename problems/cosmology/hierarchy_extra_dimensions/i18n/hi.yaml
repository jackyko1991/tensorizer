title: पदानुक्रम समस्या और अतिरिक्त आयामों में रिसता गुरुत्व
summary: 'गुरुत्व दुर्बल बल से लगभग $10^{33}$ गुना कमज़ोर क्यों है ($G_F M_{Pl}^2$)? एक काल्पनिक उत्तर: गुरुत्व $n$ छिपे हुए संहत आयामों में फैल जाता है। $\mathbb R^3\times T^n$ पर विभव को दो तरह से जोड़ा जाता है, द्रव्यमान के प्रतिबिंबों पर और कालुज़ा–क्लाइन मीनार पर, जालक के कोशों पर एक ही टेंसर के रूप में। यह भीतर $1/r^{1+n}$ की तरह और बाहर $1/r$ की तरह घटता है, युकावा पूँछ $\alpha = 2n$, $\lambda = R$ के साथ। $n = 1..6$ के लिए ADD त्रिज्याओं की तुलना मरोड़ तुला और LHC की वास्तविक सीमाओं से की जाती है, और रैंडल–सुंद्रम वार्प गुणांक $e^{-\pi k r_c}$ $M_{Pl}$ को TeV में बदल देता है। अब तक कोई अतिरिक्त आयाम नहीं देखा गया है।'
notes: 'स्थिति: काल्पनिक। पदानुक्रम समस्या पूछती है कि विद्युत-दुर्बल पैमाना ($v \approx 246$ GeV) प्लांक पैमाने ($M_{Pl} \approx 1.22\times10^{19}$ GeV) से इतना नीचे क्यों है, जहाँ $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$। आर्कानी-हामेद, दिमोपूलोस और द्वाली (ADD, 1998) ने प्रस्ताव दिया कि केवल गुरुत्व मिलीमीटर से फ़ेम्टोमीटर आकार के $n$ संहत आयामों में फैलता है, इसलिए गुरुत्व का वास्तविक पैमाना $M_*$ एक TeV हो सकता है। रैंडल और सुंद्रम (1999) ने इसके बजाय एक मुड़ा हुआ आयाम प्रस्तावित किया। कोई अतिरिक्त आयाम नहीं मिला है। अन्य प्रस्तावित उत्तरों में अतिसममिति, संयुक्तता, रिलैक्सियॉन और मानवकेंद्रित चयन शामिल हैं। इनमें से कोई स्थापित नहीं है। क्या गणना की जाती है: $\mathbb R^3\times T^n$ पर एक बिंदु द्रव्यमान (त्रिज्या $R$ के वृत्त, इकाइयाँ $R = G_D M = 1$)। प्रतिबिंब योग और कालुज़ा–क्लाइन योग पॉइसों योग सूत्र से बराबर हैं; दोनों को कोशों $m = |\mathbf k|^2$ के अनुसार संख्याओं $r_n(m)$ के साथ समूहित किया जाता है। आलेख भीतर प्रतिबिंब योग ($r < R$, दूर के प्रतिबिंब एक समाकल से प्रतिस्थापित)
  और बाहर KK योग का उपयोग करता है। $3+n$ आकाशीय आयामों में गाउस का नियम $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$ तय करता है। सबसे हल्के KK स्तर में द्रव्यमान $1/R$ के $2n$ मोड हैं, इसलिए संहत आकाश के ठीक बाहर गुरुत्व $\alpha = 2n$, $\lambda = R$ वाले युकावा सुधार जैसा दिखता है (टोरस; अन्य आकार $\alpha$ बदलते हैं)। ADD त्रिज्याएँ $M_{Pl}^2 = M_*^{n+2}R^n$ का उपयोग करती हैं; शोधपत्र $(2\pi)^n$ और $8\pi$ जैसे गुणांकों से भिन्न होते हैं, इसलिए $R$ को परिमाण-कोटि मानें। आँकड़े, data/*.csv में उद्धृत संख्याओं के रूप में: Eöt-Wash मरोड़ तुलाएँ $\lambda = 56\,\mu$m से ऊपर $|\alpha| = 1$ को अपवर्जित करती हैं (Kapner et al., PRL 98, 021101, 2007, arXiv:hep-ph/0611184; एक अतिरिक्त आयाम $R \le 44\,\mu$m) और $38.6\,\mu$m से ऊपर भी (Lee et al., PRL 124, 101101, 2020, arXiv:2002.11761)। अपवर्जन वक्र स्वयं शामिल नहीं है। चूँकि यह $\lambda$ के साथ घटता है, $\alpha \ge 1$ और $\lambda > 38.6\,\mu$m वाला हर बिंदु अपवर्जित है, एक रूढ़िवादी परीक्षण। ATLAS की 13 TeV मोनोजेट खोज (139 fb$^{-1}$; Phys. Rev. D 103,
  112006, 2021, arXiv:2102.10874, CC-BY 4.0) $n = 2..6$ के लिए 11.2, 8.5, 7.1, 6.4 और 5.9 TeV से नीचे $M_D$ को अपवर्जित करती है (जुदीचे–रत्ताज़ी–वेल्स परिपाटी, यहाँ सीधे $M_*$ से तुलना)। $n = 1$ को सौरमंडल के आकार का आयाम चाहिए और ग्रहों की कक्षाएँ इसे अपवर्जित करती हैं। रैंडल–सुंद्रम: $k r_c \approx 11$–$12$ से $\bar M_{Pl}e^{-\pi k r_c}$ एक TeV बनता है; LHC ने इसके कालुज़ा–क्लाइन ग्रैविटॉन नहीं देखे।'
meanings:
- कालुज़ा–क्लाइन मोड सदिश (वृत्तों के चारों ओर संवेग $\mathbf k/R$); कोश-संख्याओं की जाँच के लिए
- 'कितने $\mathbf k$ के लिए $|\mathbf k|^2 = m$: थीटा श्रेणी की घात $n$, FFT संवलन से'
- 'दोहराया गया कोश सूचकांक $m$ ⇒ योग: द्रव्यमान और उसके प्रतिबिंब; दूर के प्रतिबिंब सतत पूँछ से'
- वही विभव, द्रव्यमान $\sqrt m/R$ के युकावा पदों की मीनार के रूप में (पॉइसों योग)
- autograd से क्षेत्र; $S^{2+n}$ (पास) या $S^2\times T^n$ (दूर) के क्षेत्रफल से गुणा करने पर गाउस फ्लक्स
- संहत आकाश के ठीक बाहर $\ln(\phi/\phi_N - 1)$ पर न्यूनतम वर्ग; अपेक्षा $2n$ और $R$
- हर $n$ और हर मूल पैमाने $M_*$ के लिए ADD त्रिज्या एक साथ (ब्रॉडकास्ट)
- प्लांक ब्रेन और TeV ब्रेन के बीच रैंडल–सुंद्रम वार्प गुणांक
labels:
  M_star: छपी तालिका के लिए मूल पैमाना $M_*$
  krc: रैंडल–सुंद्रम $k r_c$
  m_max: जोड़े गए जालक कोश, $|\mathbf k|^2 \le m_{max}$
