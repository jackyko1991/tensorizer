source_hash: efa79cfa67ef
title: 'Operatorsuche auf MNIST: ein Tensor-DAG schreibt seine eigene Klassifikationsgleichung'
summary: Können einige wenige lesbare Tensoroperatoren, als DAG verschaltet, mit einem CNN mithalten, wenn nur eine Handvoll Trainingsbilder vorliegt? Jede Kante eines kleinen DAG trägt eine softmax-gewichtete Mischung aus 23 Kandidatenoperatoren (Sobel, Laplace, Gabor, ein gelernter 3×3-Filter, ReLU, $x^2$, Pooling, Zeilensummen, FFT-Betrag, Klassenvorlagen, PCA, Momente, lineare und Prototyp-Ausleseschichten); eine DARTS-Suche auf 1 bis 100 Bildern pro Ziffer wählt einen Operator pro Kante, und der DAG wird als LaTeX-Gleichung ausgegeben, die seine Vorhersagen exakt reproduziert. Danach Daten und Rechenaufwand im Vergleich mit einem CNN im LeNet-Stil und zwei geschlossenen Referenzverfahren, jeder Seed gezeigt.
notes: 'Die Frage. Dieses Spielzeugproblem stammt von Jacky Ka Long Ko: ein Versuch, KI mit kleinen Batches zu trainieren und dabei Gleichungen als White Box zu schreiben. CNN gegen eine Tensormethode auf MNIST; die Kandidaten-Tensoroperatoren auflisten; einen Tensor, der den DAG kodiert, die besten Operatoren und ihre Verschaltung finden lassen; auf kleinen Batches trainieren und vergleichen, wie viele Daten und wie viel Rechenaufwand jedes Verfahren für dieselbe Genauigkeit braucht; und die Klassifikationsgleichung des gefundenen DAG aufschreiben. Methode. Die Bilder sind 14×14 groß (MNIST über 2×2-Blöcke gemittelt, sodass 30 Läufe in etwa eine Minute CPU-Zeit passen). Das Supernetz ist eine DARTS-Zelle (Liu, Simonyan und Yang 2019) mit drei Knoten $z_1, z_2, z_3$, die von jedem früheren Knoten über 6 Kanten gespeist werden, jede eine Mischung aus 12 Zelloperatoren (Null, Identität, $x^2$, $|x|$, ReLU, tanh, weiche Schwellwertfunktion $S_\lambda$, gelernter $3\times 3$-Filter, Sobel-$x$,
  Sobel-$y$, Laplace, Gabor), dann eine Pooling-Kante (Mittelwert oder Maximum $2\times 2$), eine Reduktionskante (vec, Zeilensummen, Spaltensummen, niederfrequenter FFT-Betrag, Korrelationen mit Klassenvorlagen, PCA-Projektion, Bildmomente) und eine Kopfkante (lineare Auslese oder 10 Prototypen). Die Architektur ist der Tensor $\alpha$ (9 Kanten × 23 Operatoren) mit einer Maske für die Typregel. Suche: DARTS erster Ordnung, abwechselnd ein $\theta$-Schritt auf einem Mini-Batch der Trainingshälfte und ein $\alpha$-Schritt auf der Validierungshälfte, wobei die Softmax-Temperatur von 1 auf 0.001 abgekühlt wird; der DAG behält den Argmax-Operator jeder Kante (Null entfernt die Kante), erbt das trainierte $\theta$ und wird kurz feinjustiert, wobei der beste Validierungsschritt behalten wird. Abweichungen von DARTS, genannt, weil sie wichtig sind: das Abkühlen (wie bei SNAS und GDAS) und die Argmax-Regel schließen eine Diskretisierungslücke, die in einem ersten Versuch bis zu 25 Genauigkeitspunkte
  kostete; das Bild wird als vierter Kanal der Zellausgabe beibehalten; die Köpfe starten beim nächsten Klassenmittelwert in ihrem Merkmalsraum. Das CNN (8 und 16 Kanäle mit $3\times 3$, Max-Pooling, eine lineare Schicht: 2698 Gewichte) wird mit Adam auf denselben Bildern mit demselben Early Stopping trainiert. Die Referenzverfahren haben keinen gelernten Parameter: nächster Klassenmittelwert in Pixeln sowie PCA gefolgt von geschrumpfter LDA. Ergebnisse. Die Tests prüfen, dass jeder Operator auf einer kleinen Eingabe seiner Formel entspricht, dass eine One-Hot-Mischung der einzelne Operator und das One-Hot-Supernetz der diskrete DAG ist, dass die Diskretisierung den Argmax wählt, dass die geschriebene Gleichung, allein aus ihrem LaTeX zurückgelesen, exakt die Vorhersagen des DAG liefert, und dass die Referenzverfahren ihren geschlossenen Formen entsprechen. Mitgelieferter Lauf (CPU, ein Thread, 3 Seeds), mittlere Testgenauigkeit für $n$ = 1, 5, 10, 50, 100 Bilder pro Ziffer: CNN 0.35, 0.53,
  0.64, 0.81, 0.85; gesuchter DAG 0.38, 0.48, 0.52, 0.69, 0.82; PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76; nächster Klassenmittelwert 0.41, 0.56, 0.64, 0.68, 0.69. Bilder pro Ziffer, um 70 % zu erreichen: CNN 18, DAG 52, PCA + LDA 20; um 80 % zu erreichen: CNN 45, DAG 91. Trainingszeit pro Lauf: CNN 0.4 bis 1 s, Suche plus Feinjustierung 2 bis 4 s. Also, ehrlich gesagt: Das CNN braucht ab etwa 10 Bildern pro Ziffer weniger Daten und weniger Rechenaufwand für dieselbe Genauigkeit; darunter sind die geschlossenen Referenzverfahren am besten, und kein lernendes Verfahren schlägt sie; das strukturierte Modell hat bei sehr kleinem $n$ nicht gewonnen (bei $n$ = 1 liegt es gleichauf mit den Klassenmittelwerten). Warum: Die Suche läuft auf einem Validierungsanteil, der selbst winzig ist, daher ist ihre Wahl verrauscht, und ihr Validierungsverlust bevorzugt oft Zeilensummen (28 Merkmale, 290 gelernte Zahlen, ein ruhigerer Verlust), die schlechter klassifizieren als alle Pixel (etwa 2000 gelernte Zahlen);
  7 der 15 DAGs wählten Zeilensummen. Wie für DARTS berichtet, bevorzugt die Suche parameterfreie Operatoren: Sobel-Filter besetzen die meisten Kanten, und ein gelernter Filter erscheint in 3 der 15 DAGs. Außerhalb des mitgelieferten Laufs wählten kürzere Suchen (20 oder 40 Schritte) alle Pixel und erreichten 0.74 bis 0.79 bei $n$ = 50, ein Hinweis darauf, dass sich die längere Suche zu früh festlegt; dies wurde auf dem Testdatensatz beobachtet, ist also eine Beobachtung und keine abgestimmte Einstellung. Die GPU (eine GTX 1080 Ti) brachte keine Beschleunigung: Tausende winziger Kernel, nicht die Arithmetik, bestimmen die Laufzeit. results/stages.csv enthält jede Zahl, results/equation.tex jede gefundene Gleichung. Verwandte Arbeiten. Neuronale Architektursuche (Zoph und Le 2017) und ihre differenzierbare Form DARTS; symbolische Regression, die statt Netzen Formeln sucht (AI Feynman, Udrescu und Tegmark 2020; PySR, Cranmer 2023; genetische Programmierung, Koza 1992); LeNet (LeCun et al.
  1998) für das CNN. Daten: MNIST (LeCun, Cortes und Burges), Lizenz CC BY-SA 3.0; data/mnist_subset.npz enthält 1000 Bilder des Trainingspools und 2000 Testbilder (die Share-Alike-Lizenz gilt für diese Teilmenge), siehe data/SOURCES.md. Ausprobieren. Ändern Sie show_n, um den mit 1 oder 100 Bildern pro Ziffer gefundenen DAG zu sehen, erhöhen Sie die Zahl der Suchschritte, oder verwenden Sie einen einzigen Seed für einen schnellen Lauf.'
meanings:
- 'die Typregel: Operator $o$ darf nur dann auf Kante $e$ sitzen, wenn er die Eingabeform dieser Kante auf ihre Ausgabeform abbildet (Zelle Karte → Karte, Pooling, Reduktion Karte → Vektor, Kopf Vektor → Logits)'
- maskierte Softmax des Architekturtensors $\alpha$ (Kanten × Operatoren); die Temperatur $T$ sinkt von 1 auf 0.001, sodass die Mischung am Ende One-Hot ist
- 'jeder Operator, den ein Knoten speist, einmal für alle seine ausgehenden Kanten berechnet: eine einzige Faltung liefert Sobel-$x$, Sobel-$y$, Laplace, Gabor und die gelernten $3\times 3$-Filter $K_e$'
- 'wiederholtes $o$ ⇒ summiert: jeder Knoten ist die Summe seiner gemischten eingehenden Kanten; die Zellausgabe ist der Stapel $(x, z_1, z_2, z_3)$'
- Merkmale der Reduktion $r$ (vec, Zeilen-/Spaltensummen, $|\mathcal F|$, Vorlagen $\langle z, \mu_k\rangle$, PCA $U^\top \mathrm{vec}$, Momente), mit den Trainingsbildern standardisiert
- alle Reduktionen × Köpfe auf Ebene der Logits gemischt (ihre Merkmalslängen unterscheiden sich); linear $W\hat f + b$ oder Prototypen $-e^\tau\lVert \hat f - p_k\rVert^2/D$, beide beim nächsten Klassenmittelwert gestartet
- 'DARTS erster Ordnung: $\theta$-Schritte auf einem Trainings-Mini-Batch, dann $\alpha$-Schritte auf einem Validierungs-Mini-Batch'
- 'der diskrete DAG als LaTeX geschrieben, von einem kleinen Parser zurückgelesen und ausgewertet: exakt dieselben Vorhersagen wie der DAG'
labels:
  search_steps: DARTS-Suchschritte (jeweils ein $\theta$- und ein $\alpha$-Update)
  retrain_steps: Feinjustierungsschritte des diskreten DAG
  cnn_steps: Trainingsschritte des CNN
  seeds: Seeds pro Trainingsmengengröße
  batch: Mini-Batch-Größe (über die Ziffern ausgewogen)
  show_n: Trainingsbilder pro Ziffer des gezeigten DAG
