title: 판데르발스 기체와 맥스웰 작도
summary: 판데르발스 방정식은 이상 기체에 분자 사이의 인력과 분자 크기를 더하며, 그러자 액체–기체 상전이가 나타납니다. 등온선 묶음 전체가 $(T, V)$ 브로드캐스팅 하나입니다. 임계 온도 아래에서는 비물리적인 고리를 맥스웰의 같은 넓이 직선으로 바꾸며, 그 압력은 여러 온도에 대해 한꺼번에 이분법으로 찾습니다.
notes: $a$는 분자 사이의 인력(압력을 낮춤), $b$는 분자 1몰이 차지하는 부피를 나타냅니다($V$는 $nb$보다 작아질 수 없습니다). $T_c$ 아래에서 등온선에는 기체를 압축하면 압력이 낮아지는 구간이 있는데, 이는 역학적으로 불안정합니다. 실제로 기체는 일정한 압력 $p^*$, 즉 증기압에서 응축합니다. 몰 부피 $V_l$인 액체가 부피 $V_g$인 기체와 공존합니다. 맥스웰 규칙은 직선 위와 아래의 넓이가 같도록 $p^*$를 정합니다(두 상의 깁스 에너지가 같다는 것과 동등합니다). 점선 돔은 모든 $(V_l, p^*)$와 $(V_g, p^*)$를 이은 것이며, 그 꼭대기가 액체와 기체가 똑같아지는 임계점입니다. 축은 임계값으로 환산했으며, 이 단위에서는 모든 판데르발스 기체가 똑같아 보입니다(대응 상태의 법칙). 부피 축은 선형이므로 음영 넓이를 눈으로 비교할 수 있습니다. 판데르발스 모형은 실제 유체에 대해 정성적일 뿐입니다. 예를 들어 $V_c = 3nb$는 실제 임계 부피를 과대평가합니다.
meanings:
- 온도 훑기, 열로
- 부피 격자, 행으로
- 브로드캐스팅으로 모든 등온선을 한 번에
- 여러 온도에 대한 3차 방정식 $p(V) = p^*$의 근
- '곡선과 직선 사이의 부호 있는 넓이: 답에서 0'
- '이분법: torch.where가 모든 구간을 한 번에 움직임'
labels:
  gas: 기체
  n: 기체의 양
  T_high: 처음 온도
  T_low: 최종 온도
  n_temps: 온도 수 (프레임)
