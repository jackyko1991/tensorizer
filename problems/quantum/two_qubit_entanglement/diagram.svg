<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Quantum circuit: two qubits start in state 0; a Hadamard gate on qubit 1 followed by a CNOT produces the entangled Bell state Phi plus">
  <defs>
    <marker id="arrow-gy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <line x1="54.0" y1="56.0" x2="184.0" y2="56.0" stroke="#374151" stroke-width="2" />
    <line x1="54.0" y1="112.0" x2="184.0" y2="112.0" stroke="#374151" stroke-width="2" />
    <text x="14" y="61">|0⟩</text>
    <text x="14" y="117">|0⟩</text>
    <rect x="72" y="41" width="30" height="30" rx="3" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <text x="87" y="61" text-anchor="middle" font-weight="600">H</text>
    <line x1="140.0" y1="56.0" x2="140.0" y2="123.0" stroke="#374151" stroke-width="2" />
    <circle cx="140" cy="56" r="5" fill="#374151"/>
    <circle cx="140" cy="112" r="11" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <line x1="129.0" y1="112.0" x2="151.0" y2="112.0" stroke="#374151" stroke-width="2" />
    <line x1="140.0" y1="101.0" x2="140.0" y2="123.0" stroke="#374151" stroke-width="2" />
    <path d="M188,50 q8,0 8,8 v20 q0,6 6,6 q-6,0 -6,6 v20 q0,8 -8,8" fill="none" stroke="#f59e0b" stroke-width="2" />
    <text x="206" y="89" fill="#b45309" font-size="13">|Φ⁺⟩</text>
    <line x1="60.0" y1="140.0" x2="180.0" y2="140.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gy)"/>
    <text x="120" y="154" fill="#4b5563" font-size="12" text-anchor="middle">time</text>
  </g>
</svg>
