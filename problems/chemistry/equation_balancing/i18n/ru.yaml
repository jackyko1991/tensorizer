source_hash: 94551bc4044d
title: Уравнивание химических уравнений (нуль-пространство)
summary: 'Уравнять уравнение — значит найти коэффициенты $\nu_s$, сохраняющие каждый элемент и заряд. В матричной записи это $M\nu = 0$: коэффициенты образуют нуль-пространство матрицы «элемент–вещество». Одно пакетное SVD решает сразу семь реакций, от горения метана до перманганата в кислой среде, и обнаруживает ту, уравнивание которой неоднозначно.'
notes: 'Каждый элемент даёт одно линейное уравнение относительно неизвестных коэффициентов, так что $S$ веществ и $E$ элементов дают систему $E\times S$ вида $M\nu = 0$. Обычно ранг $M$ равен $S-1$ и решения образуют прямую: уравненное уравнение единственно с точностью до общего множителя. SVD находит эту прямую как правый сингулярный вектор с сингулярным значением 0 (последний); деление на наименьшую компоненту и перебор множителей $k = 1, 2, \dots$ дают наименьшие целые числа, например $\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$. Для ионов заряд — просто ещё одна строка: без неё у $\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$ было бы двумерное нуль-пространство, а с ней получается знакомое окислительно-восстановительное уравнение $1{:}5{:}8 \rightarrow 1{:}5{:}4$. Пример с пероксидом $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$ имеет два нулевых сингулярных значения: в нём скрыты две независимые реакции ($2\mathrm{H_2}
  + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$ и $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$), и любая их положительная смесь тоже уравнена. Одна алгебра не может выбрать одну из них; реальные пропорции определяет химия (кинетика, условия). Код показывает базисные реакции, полученные обнулением одного коэффициента в двумерном нуль-пространстве. Попробуйте свою реакцию, добавив её в `REACTIONS` в tensors.py; парсер понимает скобки и заряды, например ''Ca3(PO4)2'' или ''Fe^3+''.'
meanings:
- атомы элемента $e$ в веществе $s$ реакции $r$; строка q — заряд (из крошечного парсера формул)
- $+1$ для реагента, $-1$ для продукта
- 'индекс не суммируется: каждый столбец получает знак'
- все реакции дополнены до одного тензора; неиспользуемые столбцы закреплены на $\nu_s = 0$
- пакетное SVD; сингулярные значения по убыванию
- 'сколько сингулярных значений обращается в нуль: 1 → единственное уравнивание, 2 → две независимые реакции'
- последний сингулярный вектор, масштабированный так, чтобы наименьшая компонента была 1, затем умноженный на первое $k_r$, дающее целые числа
- 'повторяющийся $s$ ⇒ суммирование: созданные атомы $e$; ноль для каждого элемента и заряда'
labels:
  show: Реакция, показанная как матрица
  max_scale: Наибольший пробуемый множитель $k$
