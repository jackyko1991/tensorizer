source_hash: 1bc9d739c88e
title: मुक्त तरंग पैकेट
summary: 'मुक्त कण के लिए समय चरणों की कोई आवश्यकता नहीं: संवेग समष्टि में श्रोडिंगर समीकरण हर फ़ूरिये घटक को उसकी अपनी कला $e^{-ik^2t/2}$ से गुणा करके हल होता है। एक FFT, एक गुणन, एक व्युत्क्रम FFT किसी भी समय पर $\psi$ देते हैं — $(T, N)$ टेंसर के रूप में सभी समयों के लिए एक साथ। पैकेट समूह वेग $k_0$ से खिसकता है और फैलता है क्योंकि उसके विभिन्न संवेग भिन्न चालों से चलते हैं।'
notes: 'मात्रक $\hbar = m = 1$। $\sigma$, $\lvert\psi\rvert^2$ का मानक विचलन है (अतः $\psi \propto \exp(-(x - x_0)^2/(4\sigma_0^2) + ik_0x)$)। सटीक परिणाम $\langle x\rangle = x_0 + k_0 t$ (समूह वेग $v_g = dE/dk = k$) और $\sigma(t) = \sigma_0\sqrt{1 + (t/(2\sigma_0^2))^2}$ हैं: संकरे पैकेट में संवेगों का व्यापक फैलाव होता है और इसलिए वह तेज़ी से फैलता है। धराशायी रेखाएँ उसी सूत्र से $\langle x\rangle \pm \sigma(t)$ दिखाती हैं। $\operatorname{Re}\psi$ की लहरें कला वेग $k/2$ से चलती हैं, जो आवरण की चाल का आधा है। ग्रिड आवर्ती है, इसलिए एक ओर से निकलने वाला पैकेट दूसरी ओर से लौट आता है।'
meanings:
- संवेग $k_0$ से चलता चौड़ाई $\sigma_0$ का गाउसीय
- 'दोहराया गया $x$ ⇒ योग: समतल तरंगों $e^{ikx}$ में आधार परिवर्तन'
- 'हर समय $t$ पर हर मोड $k$ की मुक्त-कण कला (किसी सूचकांक पर योग नहीं: बाह्य गुणनफल)'
- वापस $x$-समष्टि में, सभी $T$ स्नैपशॉट एक कॉल में
- हर समय पर $\lvert\psi\rvert^2$ का केंद्र और फैलाव
labels:
  k0: पैकेट संवेग $k_0$
  sigma0: प्रारंभिक चौड़ाई $\sigma_0$
  t_max: अनुकरण समय
