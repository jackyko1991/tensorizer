source_hash: bed4e5f065d8
title: P vs NP 與 3-SAT 相變
summary: 凡是答案容易驗證的問題，是否也都容易求解？這就是 P vs NP 問題，自 1971 年起懸而未決。隨機 3-SAT 把這種不對稱具體呈現出來：驗證一個給定的賦值只需一次 gather 和兩次歸約，而窮舉搜尋則把全部 $2^n$ 個賦值作為一個壓縮的位元張量一次過求值，其大小每增加一個變數就翻倍。掃描子句與變數之比 $\alpha$，可以看到可滿足性相變出現在 $\alpha_c \approx 4.27$ 附近，而搜尋成本在相變窗口內達到峰值。
notes: P vs NP 問的是：凡是「是」答案具有可在多項式時間內驗證之證書的判定問題（NP 類），是否也都能在多項式時間內求解（P 類）。Cook（1971）和 Levin（1973）證明了可滿足性問題是 NP 完全的：3-SAT 若有多項式時間演算法，NP 中的每個問題都會有。目前不知道這樣的演算法是否存在。大多數研究者預期 P $\ne$ NP，但沒有證明，而已知的障礙（相對化、自然證明、代數化）排除了整類的證明策略。這個問題是克雷千禧年大獎七大難題之一，至今未解決。本程式對此沒有證明任何東西：窮舉搜尋只是最顯而易見的演算法，而已知最好的 3-SAT 演算法仍然是指數時間的（PPSZ 約為 $1.307^n$）。它展示的是那種不對稱。驗證器只是一次 gather 加上一次 OR 和一次 AND，工作量為 $O(M)$。搜尋則建立完整的真值表，每個賦值一個位元，每個整數壓縮 32 個，因此張量有 $2^n$ 個位元，耗時每增加一個變數就翻倍（右下圖；$n$ 較小時固定開銷佔主導）。具有 $M = \alpha n$ 個子句的隨機 3-SAT 有一個尖銳的閾值：Friedgut（1999）證明了當 $n \to \infty$ 時相變變得尖銳，統計物理（Mézard、Parisi 與 Zecchina 2002）預測 $\alpha_c \approx 4.267$，而 Ding、Sly 與 Sun（2015）對 $k$ 很大的 $k$-SAT 證明了預測的閾值。對 $k = 3$，4.267 這個值仍然是猜想；已證明的是：隨機公式在 $\alpha = 3.52$ 以下以高機率可滿足，在 4.49 以上以高機率不可滿足。$n$ 較小時，50% 交叉點位於 4.27 之上，並隨 $n$ 增大而向下漂移（有限尺寸標度）。測試檢查：驗證器在每個賦值上都與暴力法一致；一個子句恰好排除全部賦值的 $1/8$；解的平均數目等於一階矩 $2^n (7/8)^M$；$P_{\mathrm{sat}}$ 單調，並在閾值附近驟降；窗口隨 $n$ 收窄。搜尋成本圖統計深度優先回溯搜尋的節點數：該搜尋依次固定 $x_0, x_1, \ldots$，一旦某個已完全賦值的子句為假就回溯。在閾值以下它很快找到解，遠高於閾值時短小的矛盾會及早剪枝，最難的公式位於相變窗口內（對這個簡單搜尋，$n
  = 16$ 時約在 $\alpha \approx 5$；帶單元傳播的求解器在 4.3 附近達到峰值）。試試更多變數，看曲線變得更尖銳；或更多公式，得到更平滑的曲線。
meanings:
- $B$ 個公式，各有 $M$ 個由 3 個不同變數組成的子句，每個變數以機率 $\frac12$ 取反
- 所有公式的所有文字一次 gather 取出
- 驗證器：$3M$ 次查表，關於 $n$ 是多項式的
- $x_j$ 在全部 $2^n$ 個賦值上的真值表，每個整數存 32 個賦值
- 用逐位元 OR 在全部 $2^n$ 個賦值上求值一個子句（與全 1 做 XOR 即取反）
- 逐個 AND 入子句；第 $d$ 層只收集變數都在前 $d$ 個之中的子句，由此得到回溯樹
- 巢狀公式（同一子句列表的前綴）一趟就給出所有 $\alpha = M/n$，並使 $P_{\mathrm{sat}}$ 不增
labels:
  n_max: 變數數 $n$（最大規模）
  instances: 每個規模的公式數
  seed: 隨機種子
