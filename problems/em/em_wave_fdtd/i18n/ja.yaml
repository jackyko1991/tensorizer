source_hash: 8807e34cb0a8
title: 電磁波（FDTD法）
summary: マクスウェル方程式の2つの回転の式を、Yee 格子上で時間発展させる。回転は $\varepsilon_{ijk}\,\partial_j F_k$ と書かれる：差分の表をレヴィ＝チヴィタ記号と1回の einsum で縮約したものである。点波源または線波源からの波が誘電体ブロックに当たり、減速し、屈折し、一部が反射する。一方、減衰境界が箱から出ていく波を吸収する。
notes: $c = \varepsilon_0 = \mu_0 = 1$、セルサイズ $\Delta x = 1$ とする単位系。$\mathbf E$ と $\mathbf H$ は半セルずれて配置され（$\partial\mathbf E$ には前進差分、$\partial\mathbf H$ には後退差分）、交互に更新される——リープフロッグ型の Yee 法である。波源は「ソフト」であり、$E_z$ に加算されるので、反射波はそのまま通り抜ける。吸収境界は単に、壁に向かって滑らかに強まる 1 よりわずかに小さい因子を場に掛けるだけである。実際のコードでは代わりに完全整合層（PML）を用いる。ブロック内では波長が $n = \sqrt{\varepsilon_r}$ 分の1に縮む。垂直入射では振幅の $(1 - n)/(1 + n)$ が反射する。
meanings:
- 格子上の場の成分；TM モード：$E_z$、$H_x$、$H_y$ のみが非零
- 差分の表；2次元では $j = z$ の行は0
- レヴィ＝チヴィタ記号
- 繰り返される $j, k$ ⇒ 和をとる：各セルでの回転
- 比誘電率：真空中で 1、ブロック内で $\varepsilon_\text{block}$（$n = \sqrt{\varepsilon_r}$）
- 時間刻み $S\,\Delta x/(c\sqrt2)$；$S > 1$ は計算が発散するので受け付けない
labels:
  source: 波源
  eps_block: ブロックの比誘電率 $\varepsilon_r$
  wavelength: 真空中の波長
  courant: クーラン数 $S$
  t_max: シミュレーション時間
