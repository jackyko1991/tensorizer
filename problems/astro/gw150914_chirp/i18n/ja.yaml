source_hash: 03516f527daf
title: GW150914：初めて捉えられた重力波の「チャープ」
summary: 2015 年 9 月 14 日に LIGO のハンフォード（Hanford）とリビングストン（Livingston）で記録された、16 秒間の実際のひずみデータ。Welch 法による PSD 推定、白色化、バンドパスフィルタによって、100 倍も大きな雑音に埋もれたチャープ信号を浮かび上がらせます。Q 変換の時間周波数マップでは周波数がおよそ 150 Hz まで上昇していく様子が見え、ポストニュートン近似によるインスパイラル波形のテンプレートバンクを一括でフィルタリングすると、チャープ質量 $30\,M_\odot$ 付近でピークが現れます。リッジを $\dot f \propto M_c^{5/3} f^{11/3}$ に autograd でフィットし、リビングストンの信号がハンフォードより約 7 ms 先行することも確かめます。
notes: 2015 年 9 月 14 日 09:50:45 UTC、2 台の Advanced LIGO 検出器が約 410 Mpc 彼方の 2 つのブラックホールの合体を記録しました（Abbott et al., PRL 116, 061102, 2016）。これが重力波の初の直接検出です。このページでは、公開データを用いて解析の簡略版を再現します。生のひずみデータは 30 Hz 以下で地面振動と熱雑音に支配されるため、Welch 法（4 s の Hann 窓セグメント、50 % オーバーラップ）で PSD $S_n(f)$ を推定し、データを $\sqrt{S_n}$ で割ります（白色化）。ページでは、白色化後の PSD が平坦であること、パーセバルの定理、そしてすべてのテンプレートが $\langle h|h\rangle = 1$ を満たすことを確認します。テンプレートバンクは等質量の場合の 2PN 位相をもつ停留位相近似インスパイラル波形を用い、$f_\mathrm{peak} = 0.36/(2\pi M)$ で打ち切ります。これは数値相対論で等質量合体がピークを迎える周波数です（ISCO 周波数で打ち切ると SNR の大部分が失われます）。すべてのテンプレートと両検出器のデータを、1 回のバッチ FFT でまとめてフィルタリングします。デフォルト設定では最良のテンプレートは $\mathcal M_c \approx 32\,M_\odot$、SNR は約 16（H1）と 10（L1）で、2 つの SNR ピークと H1–(−L1) の相互相関から、ハンフォードはリビングストンより 7–8 ms 遅れて信号を受けたことがわかります（公表値：6.9 +0.5/−0.4 ms。L1 のアームの向きにより符号が反転します）。Q マップのリッジにニュートン近似をフィットすると、より重い $\mathcal M_c \approx 37\,M_\odot$ が得られ、0PN のバンクでも同様です。ポストニュートン項は同じチャープ質量でもチャープを遅くするため、ニュートン模型ではより重い系と読み取ってしまうのです。注意（正直な但し書き）：これは教育用の解析であり、公表された解析そのものではありません。公表値は、スピンを含む完全なインスパイラル–合体–リングダウン波形、はるかに長いデータから求めた
  PSD、ベイズ的パラメータ推定によるものです：検出器系で $\mathcal M_c \approx 30\,M_\odot$、ネットワーク SNR 24（Abbott et al. 2016）、GWTC-1 では源系で $\mathcal M_c = 28.6^{+1.7}_{-1.5}\,M_\odot$、質量 $35.6$ と $30.6\,M_\odot$、距離 440 Mpc。ここでの SNR が低いのは、テンプレートに合体–リングダウン部分もスピンも含まれていないこと、そして PSD を信号を含むわずか 16 s のデータから求めていることによります。データ：GWOSC（Gravitational Wave Open Science Center、重力波オープンサイエンスセンター）、GW150914 リリース GWTC-1-confident v3、ファイル H-H1_GWOSC_4KHZ_R1-1126259447-32 および対応する L1 ファイル、gwosc.org/eventapi/json/GWTC-1-confident/GW150914/v3/ より取得、CC BY 4.0。GPS 1126259455 から 16 s を切り出し、900 Hz でローパスして 2048 Hz に間引き、ひずみ × 10⁻²¹ として data/gw150914_strain.csv に保存しています。GWOSC（Abbott et al., SoftwareX 13, 100658, 2021）と Abbott et al. 2016 を引用してください。受賞：2016 年ショウ賞天文学部門（Drever、Thorne、Weiss、LIGO の着想と設計に対して）、2016 年ブレイクスルー賞基礎物理学部門特別賞（Drever、Thorne、Weiss と LIGO の貢献者たち）、2017 年ノーベル物理学賞（Weiss、Barish、Thorne）。
meanings:
- 検出器 $d \in \{H1, L1\}$ のサンプル $n$ におけるひずみ。16 s、2048 Hz
- 片側 PSD：Hann 窓をかけたセグメント $s$ を FFT し、$|X|^2$ を $s$ について平均
- 白色化したひずみ：PSD が正しければ分散 1 の白色雑音になる
- 幅 $f_q/q$ のガウス型バンドパスフィルタのエネルギー。逆 FFT を 1 バッチで計算
- チャープ質量 $\mathcal M_m$、$\eta = 1/4$ に対する 2PN までの停留位相インスパイラル位相
- バンク全体を一度に計算し、合体ピーク周波数で打ち切って $\langle h|h\rangle = 1$ に規格化
- $4\,\mathrm{Re}\sum_k a_k b_k^*/S_k\,\Delta f$、$k$ について和をとる
- $k$ の和を逆 FFT で計算：すべての検出器・テンプレート・時刻に対する複素 SNR
- ニュートン近似の軌跡 $\frac1\pi(5/256\tau)^{3/8}\mathcal M_c^{-5/8}$ を Adam でリッジにフィット
labels:
  pn_order: テンプレート位相のポストニュートン次数
  cutoff: テンプレートの上限周波数
  f_low: テンプレートの最低周波数 $f_\mathrm{low}$
  n_templates: バンク内のテンプレート数
  mc_min: 最小チャープ質量 $\mathcal M_c$
  mc_max: 最大チャープ質量 $\mathcal M_c$
  q: 時間周波数マップの Q 値
  welch_segment: Welch 法のセグメント長
