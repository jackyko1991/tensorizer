source_hash: 07db7a3fd274
title: बॉक्स में कण और रंजकों का रंग
summary: लंबे संयुग्मित अणु अधिक लाल प्रकाश क्यों अवशोषित करते हैं? सायनीन रंजक के $\pi$ इलेक्ट्रॉन शृंखला के अनुदिश मुक्त रूप से चलते हैं, लंबाई $L$ के एक-विमीय बॉक्स में कणों की तरह। स्तरों $E_n \propto n^2/L^2$ को दो-दो करके भरने से HOMO→LUMO अंतराल $\Delta E = h^2(N+1)/8m_eL^2$ और पूरी सजातीय श्रेणी के लिए एक साथ अनुमानित $\lambda_{max}$ मिलता है; torch.linalg.eigh से विकर्णित एक बैच परिमित-अंतर हैमिल्टनी विश्लेषिक स्तरों को पुनः उत्पन्न करता है।
notes: 'Kuhn का मुक्त-इलेक्ट्रॉन मॉडल (1948) संयुग्मित शृंखला के $\pi$ इलेक्ट्रॉनों को बॉक्स में स्वतंत्र कणों के रूप में मानता है। सायनीन रंजक $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$ में धनात्मक आवेश दोनों नाइट्रोजनों में बँटा होता है, इसलिए शृंखला के सभी बंध लगभग बराबर हैं (लगभग $l = 0.139$ nm) और समतल तली वाला बॉक्स एक अच्छा चित्र है। $2k + 2$ बंधों, $N = 2k + 4$ इलेक्ट्रॉनों और हर नाइट्रोजन के पार एक बंध बाहर निकले बॉक्स के साथ, $L = (2k + 4)l$ और $\lambda_{max} = 8m_ec\,L^2/h(N + 1)$, $k$ के साथ लगभग रैखिक रूप से बढ़ता है: मॉडल प्रति जोड़ी गई CH=CH इकाई लगभग 125 nm की भविष्यवाणी करता है, और लाल वर्ग (सबसे सरल सायनीनों के पूर्णांकित मापित मान) लगभग 100 nm चढ़ते हैं। यह क्लासिक स्नातक प्रयोग है: बढ़ती शृंखला लंबाई वाले कुछ सायनीन रंजकों के दृश्य स्पेक्ट्रम दर्ज करें, फिर $\lambda_{max}$ से बॉक्स लंबाई या सिरे का विस्तार फ़िट करें। संख्यात्मक हलकर्ता वही स्तर $10^{-3}$ से बेहतर देता है (इसकी त्रुटि $(n\,\Delta x)^2$ की तरह घटती है), और वह कर सकता है जो सूत्र नहीं कर सकता: एक विभव चालू
  करना। पॉलीईनों में एकांतर द्वि और एकल बंध होते हैं; साधारण बॉक्स में उनका अनुमानित $\lambda_{max}$ अवरक्त में बहुत दूर चला जाता है, जबकि वास्तविक पॉलीईन स्थिर हो जाते हैं (β-कैरोटीन, 11 C=C के साथ, लगभग 450 nm पर अवशोषित करता है)। पॉलीईन श्रेणी चुनें और $V_{alt}$ को 1–2 eV तक बढ़ाएँ: आवर्ती विभव एक अंतराल खोलता है जो लंबी शृंखलाओं के लिए परिमित रहता है, जो बैंड अंतराल का एक-विमीय बीज है। रंग के नमूने हर $\lambda_{max}$ पर एक गाउसीय अवशोषण बैंड घटाकर श्वेत प्रकाश दिखाते हैं; पीला अवशोषित करने वाला रंजक नीला दिखता है, और केवल UV अवशोषित करने वाला रंगहीन।'
meanings:
- श्रेणी में अणु $b$ के π इलेक्ट्रॉन और संयुग्मित बंध
- 'बॉक्स लंबाई: सभी बंध और हर सिरे के परमाणु के पार एक बंध लंबाई'
- विश्लेषिक स्तर; किसी सूचकांक पर योग नहीं, $n^2$ और $1/L^2$ का बाह्य गुणनफल
- HOMO $n = N/2$ से LUMO $n = N/2 + 1$, और अवशोषित तरंगदैर्ध्य
- हर बॉक्स के आंतरिक ग्रिड बिंदु; दीवारों पर $\psi = 0$
- प्रति अणु एक परिमित-अंतर हैमिल्टनी, ढेर में
- दोहराया गया $j$ ⇒ योग; eigh पूरे बैच को एक कॉल में विकर्णित करता है
- 'दोहराया गया $w$ ⇒ दृश्य तरंगदैर्ध्यों पर योग: अवशोषण के बाद बचा रंग'
