source_hash: 698c7a054398
title: ドップラー効果とマッハ円錐
summary: 速さ $v_s$ で動く音源が、1周期ごとに1つの円形波面を放出する。各波面はテンソル（放出時刻、放出点）の1行なので、任意の時刻でのその半径は1回の引き算で求まる。波面は前方で詰まり後方で広がる。音速を超えると波面が積み重なってマッハ円錐になる。
notes: 聞こえる振動数は単に毎秒到達する波面の数である：音源の前方では波面はより間隔を詰めて放出されたので $f' = f\,c/(c - v_s)$、後方では $f' = f\,c/(c + v_s)$ となる。聴取者はこれらの公式が厳密に成り立つ運動の直線上に置く。$v_s > c$（マッハ数 $M = v_s/c > 1$）では音源は自分の音を追い越す：すべての波面は2本の直線、すなわち $\sin\mu = 1/M$ となる半頂角 $\mu$ のマッハ円錐に接する。このとき前方の聴取者には円錐が通過するまで何も聞こえず、波面は逆の順序で到達する。音速 $c = 340$ m/s；動くのは音源だけで、空気は静止している。
meanings:
- 周期 $1/f$ ごとに1つの波面
- 波面 $e$ を放出したときの音源の位置
- 時刻 $t$ における各波面の半径（まだ放出されていなければ0）
- 音源の前方と後方の聴取者
- 繰り返される $i$ ⇒ 和をとる：各放出点から各聴取者までの距離の2乗
- 波面 $e$ が聴取者 $o$ に届く時刻
labels:
  mach: マッハ数 $v_s/c$
  f: 音源の振動数 $f$（描く波面数）
  t_max: シミュレーション時間
