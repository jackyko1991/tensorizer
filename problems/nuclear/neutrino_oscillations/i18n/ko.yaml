source_hash: 9f4f33f51aa8
title: 중성미자 진동
summary: 중성미자는 특정한 맛깔($\nu_e, \nu_\mu, \nu_\tau$)로 생성되지만, 위상이 조금씩 다른 세 질량 상태로 이동합니다. PMNS 혼합 행렬과 질량 지표에 대한 복소 einsum 하나로 기준선 격자 전체에서 모든 맛깔 변환 확률을 구하며, $\nu_\mu$ 빔이 날아가면서 $\nu_\tau$와 $\nu_e$로 바뀌는 모습을 보여 줍니다.
notes: '$U$가 유니터리이므로 모든 거리에서 $\sum_\beta P(\alpha\to\beta) = 1$입니다. 중성미자는 맛깔이 바뀔 뿐 사라지지 않습니다. 맛깔이 두 개뿐이면 공식은 $P = \sin^2 2\theta\,\sin^2(1.267\,\Delta m^2 L/E)$로 줄어듭니다. 여기서 큰 $\Delta m^2_{31}$은 빠른 "대기" 진동을 주고($L/E \approx 500$ km/GeV 근처에서 첫 $\nu_\mu$ 감소, $\theta_{23} \approx 45°$이므로 대부분 $\nu_\tau$로), 작은 $\Delta m^2_{21}$은 느린 "태양" 진동을 줍니다($15\,000$ km/GeV 근처). 아래의 점들은 표본 중성미자로, 각각 그 거리에 놓인 검출기가 기록할 맛깔을 계산된 확률로 뽑아 보여 줍니다(고정 시드). 단순화: 진공 진동만 다루고 지구나 태양 내부의 MSW 물질 효과는 뺐으며, 정상 질량 순서를 가정합니다. 기본 매개변수는 현재의 전역 맞춤값에 가깝습니다. $\nu_\mu \to \nu_e$ 빔에서 $\delta_{CP}$ = 0과 270°를 비교해 보세요.'
meanings:
- 맛깔 $\alpha$ × 질량 상태 $i$; einsum('ab,bc,ci->ai')로 세 회전을 곱함
- 차이 $\Delta m^2_{21}, \Delta m^2_{31}$만 중요; $m_1^2 = 0$
- 로그 간격의 거리 (km)
- 각 기준선에서 각 질량 상태의 위상 (eV², km, GeV 단위로 $2.534\,m^2 L/E$)
- '반복된 $i$ ⇒ 합: 세 질량 상태가 간섭'
- 모든 기준선에서 아홉 가지 전이 확률 전부
labels:
  energy: 중성미자 에너지 $E$
  l_max: 최장 기준선 $L_{\max}$
  flavour: 생성 시 맛깔
  theta12: $\theta_{12}$
  theta13: $\theta_{13}$
  theta23: $\theta_{23}$
  delta_cp: $\delta_{CP}$
  dm21: $\Delta m^2_{21}$
  dm31: $\Delta m^2_{31}$
