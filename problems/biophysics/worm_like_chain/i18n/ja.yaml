title: DNA を引き伸ばす：みみず鎖モデル
summary: 光ピンセットで DNA 分子を引くと、エントロピーばねのように抵抗し、全長に近づくと急激に硬くなる。Marko–Siggia のみみず鎖（ワームライクチェーン）の式を自由連結鎖と比較し、曲げ剛性をもつ単位接線ベクトルの離散鎖を、力のバッチ全体について一つの $(B, M, N, 3)$ テンソルとしてモンテカルロ法で同時にシミュレーションする。持続長 $P \approx 50$ nm が、接線相関と力–伸長曲線へのフィットの両方から再び得られる。
notes: 二本鎖 DNA 分子は短いスケールでは硬いが、長いスケールではしなやかである：主鎖の向きは持続長 $P \approx 50$ nm（約 150 塩基対）の間は記憶され、その後は忘れられる。したがってまっすぐに引き伸ばすのに要するのは結合エネルギーではなくエントロピーである。低い力では応答は線形で、$z/L \approx 2 P F / 3 k_B T$ であり、クーン長 $b = 2P$ のどんな高分子でも同じである。高い力ではみみず鎖は全長にゆっくりとしか近づかず、$1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$ となる。あらゆる波長の曲げモードを伸ばしきらなければならないからである。一方、剛体リンクからなる自由連結鎖ははるかに速くまっすぐになり、$1 - z/L \approx k_B T / F b$ となる。λ ファージ DNA の実験（Smith、Finzi、Bustamante 1992；Bustamante、Marko、Siggia、Smith 1994）では約 10 pN までみみず鎖に従い、そこから二重らせんが弾性的に伸び始め、約 65 pN 付近で過伸長する。このモデルにはどちらも含まれない。Marko–Siggia の式は二つの極限の間の内挿で、中程度の伸長では厳密な WLC と力が最大約 10 % 異なる。シミュレーションでは $a = 2.5$ nm のセグメントを用いるので、剛性は $K \approx 20.5$ である。各モンテカルロスイープでは、すべての接線を少し回転させ（局所場に対するメトロポリス）、次に各鎖の尾部をランダムな軸の周りに回転させる（ピボット）。スイープの前半は平衡化、後半は平均に使う。最も低い力では伸長が鎖ごとに大きくゆらぎ、緩和も遅いので、それらの点はばらつく。フィットには 0.5–4 pN を用いる：各点で Marko–Siggia の式を $P$ について解き、対数空間で平均する（$\log F$ での最小二乗）。$F \sim K k_B T / a$ を超えると、鎖の離散性が連続の式よりわずかに大きな伸長として現れる。実験データは含まれていない。
meanings:
- 力 $b$ で引かれる鎖 $m$ のセグメント $i$ の単位接線；鎖は外力のない WLC から始まる
- $F_0 = 0$ に加えて 0.02 から 10 pN までの 12 個の力；$f_b$ は $k_B T$ を単位とした仕事 $F a$
- 曲げ剛性 $\kappa / k_B T$、$\coth K - 1/K = e^{-a/P}$ となるように選ぶ、すなわち $K \approx P/a + \tfrac12$
- 隣接する二つの接線からの引きと $z$ 方向の力
- 繰り返される $k$ ⇒ 和：一つの接線を回すときのエネルギー変化；偶数と奇数のセグメントを交互に動かす
- 繰り返される $i, k$ ⇒ 和：全曲げエネルギー、尾部全体を回すピボットムーブに使う
- 力の方向の伸長を輪郭長で割ったもの
- 外力のない鎖の接線相関；その減衰長が $P$
labels:
  persistence: 持続長 $P$
  contour_length: 輪郭長 $L$
  chains: 力あたりの鎖数 $M$
  sweeps: モンテカルロスイープ数
