source_hash: d014ac5184c9
title: '삼체 혼돈: 피타고라스 문제'
summary: '부라우의 문제: 질량 3, 4, 5인 물체가 3-4-5 삼각형의 꼭짓점에 정지한 채 출발하여, 하나가 튕겨 나갈 때까지 혼돈스럽게 춤춥니다. $\delta = 10^{-6}$만큼 떨어져 출발한 쌍둥이 실행을 같은 텐서(실행 인덱스 $k$)에서 적분하면, 둘 사이의 거리는 지수적으로 커지고, $|\Delta| \propto e^{\lambda t}$, 결국 운명이 갈립니다.'
notes: 어려운 부분은 근접 조우입니다. 두 물체가 약 $0.01$ 거리에서 스쳐 지나가는데, 그곳에서는 힘이 평소의 $10^4$배입니다. 고정 스텝은 거기서 발산하거나 다른 곳에서 지나치게 느려지므로, 풀이기는 적응형 Dormand–Prince 5(4) 방법을 씁니다. 매 스텝마다 5차와 4차 답을 비교하고, 근접 통과 근처에서는 dt가 자동으로 줄었다가 이후 다시 커집니다. 연화(softening)를 쓰지 않으므로 $G = 1$인 정확한 뉴턴 중력입니다. 두 실행은 같은 스텝을 공유하므로 같은 시각에서 비교됩니다. 운동이 혼돈적이라 허용 오차가 중요합니다. 기본값 $10^{-11}$에서 기준 실행은 고전적인 결과(Szebehely와 Peters, 1967)를 재현합니다. 가장 가벼운 물체($m = 3$)가 $t \approx 60$ 무렵 방출되고, 질량 4와 5는 단단한 쌍성이 되어 반대 방향으로 떠납니다. 겨우 $\delta$만큼 옮긴 쌍둥이는 $t \approx 45$까지 완전히 갈라져 다른 역사를 따라갑니다. $|\Delta|$ 곡선은 들쭉날쭉합니다. 근접 조우마다 쌍둥이가 고속으로 조금 더 일찍 또는 늦게 지나가므로 뾰족한 봉우리가 생기고, 증가는 계단식입니다. 맞춘 $\lambda$은 $t = 0$부터 $|\Delta|$가 $0.1$ 위에 영영 머물게 될 때까지의 평균 추세입니다. 허용 오차를 느슨하게 해 보세요. 그러면 기준 실행 자체의 운명이 바뀌는데, 수치 오차도 섭동이라는 사실을 일깨워 줍니다.
meanings:
- 실행 $k$($k = 0$ 기준, $k = 1$ 쌍둥이)에서 물체 $a$의 위치, 평면 성분 $i$
- 질량 3, 4, 5
- $a$에서 $b$로의 변위, 두 실행의 모든 쌍을 브로드캐스팅으로
- '반복된 $j$ ⇒ 합: 각 쌍의 거리 제곱'
- '반복된 $b$ ⇒ 합: 물체 $a$가 받는 전체 인력; $k$는 합하지 않으며 실행들은 독립적'
- 적응형 Dormand–Prince 스텝의 7개 단계 기울기; 5차에서 4차 조합을 뺀 값이 오차 추정치
- 위치와 속도에서 쌍둥이와 기준 사이의 거리
- '실행들이 완전히 갈라질 때까지 $t$에 대한 $\ln|\Delta|$의 기울기: 랴푸노프 지수'
labels:
  t_max: 시뮬레이션 시간
  log10_delta: 쌍둥이 오프셋 $\log_{10}\delta$
  log10_tol: 오차 허용치 $\log_{10}\mathrm{tol}$
