source_hash: d40b53524521
title: 脫離速度
summary: 一批火箭以接近脫離速度 $v_\mathrm{esc} = \sqrt{2GM/R}$ 的速率離開行星。能量的正負決定每枚火箭的命運：束縛的火箭（$E < 0$）會落回，非束縛的（$E \ge 0$）則一去不返。
notes: 單位：行星半徑 $R = 1$、$GM = 1$，因此 $v_\mathrm{esc} = \sqrt 2$（地球為 11.2 km/s）。火箭關閉引擎滑行，沒有空氣，行星也不自轉。速率略低於 $v_\mathrm{esc}$ 時，最高點按 $1/(1 - v^2/v_\mathrm{esc}^2)$ 急劇升高，旅程也愈來愈長。恰好等於 $v_\mathrm{esc}$ 時，火箭永遠在減速卻永不停下。把發射方向傾斜，可以看到脫離速度與方向無關（只要軌跡不撞上行星）：只有能量才重要。暗星：把行星壓縮到 $v_\mathrm{esc}$ 達到光速 $c$，便得到 $R = 2GM/c^2$。Michell（1783）與 Laplace 主張這樣的恆星將不可見。廣義相對論給出的黑洞視界半徑恰好相同（史瓦西半徑，太陽為 3 km），不過背後的牛頓式推理並非真正的物理圖像。
meanings:
- 火箭 $b$ 相對行星中心的位置
- 火箭 $b$ 的速度
- 重複的 $j$ ⇒ 求和：距離平方 $r_b^2$
- 行星的重力
- 單位質量能量：為負 ⇒ 束縛
- 在表面處使 $E = 0$ 的速率
- $2GM/c^2$：使 $v_\mathrm{esc} = c$ 的半徑
- $R/(1 - v^2/v_\mathrm{esc}^2)$，垂直發射的最高點
labels:
  n_rockets: 火箭數
  f_min: 最慢發射 $v/v_\mathrm{esc}$
  f_max: 最快發射 $v/v_\mathrm{esc}$
  tilt: 偏離鉛直角度
  t_max: 模擬時間
  dt: 時間步長
