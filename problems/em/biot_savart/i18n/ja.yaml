source_hash: 4d0cdb4cbe20
title: 円電流の磁場（ビオ–サバール）
summary: ビオ–サバールの法則は導線を短い線素の和に変える。外積 $d\mathbf l\times\mathbf r$ はレヴィ＝チヴィタテンソル $\varepsilon_{ijk}$ を2つのベクトルと縮約したものなので、（$i, j, k$、線素）にわたる1回の einsum で、コイル全体がつくる磁場がすべての格子点で求まる。ループ半径が膨らんだり縮んだりし、$x$–$z$ 面内と軸上の磁場がそれに追従する。
notes: SI 単位（$\mu_0 = 4\pi\times 10^{-7}$ T·m/A）、磁場は μT で表示。ループは水平面内にあるので、$x$–$z$ 面は各ループと2点で交わる（⊙ 電流は紙面の手前向き、⊗ 奥向き）。ヘルムホルツコイル（間隔 $R$、同じ電流）は両コイル間にほぼ一様な磁場をつくる。反ヘルムホルツコイル（逆向きの電流）は中心で0となり線形に増加する磁場を与える——冷却原子の捕獲に使われるトラップである。導線に近い格子点では磁場が有限に保たれるよう、小さな軟化長を用いる。
meanings:
- 平面 $y = 0$ 上の場の点 $g$
- 導線の線素 $s$ の中点と方向ベクトル
- 各線素から各場の点へ（ブロードキャスト）
- レヴィ＝チヴィタ記号：テンソルとしての外積
- 繰り返される $j, k$ ⇒ 外積；繰り返される $s$ ⇒ 導線全体の和
- ループ1つあたりの厳密解 $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$、和の検証用
labels:
  layout: コイル配置
  current: 電流
  radius: 平均ループ半径
  n_segments: ループあたりの線素数
  n_grid: 一辺あたりの矢印数
