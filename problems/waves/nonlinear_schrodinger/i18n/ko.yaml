title: 괴파 (비선형 슈뢰딩거)
summary: 집속형 비선형 슈뢰딩거 방정식은 깊은 물의 파동 묶음과 광섬유 속 빛 펄스의 포락선을 기술합니다. 균일한 파동열은 불안정합니다. 작은 잔물결이 배경의 약 세 배에 이르는 거대한 봉우리로 자라는데, 괴파(rogue wave)와 같습니다. 분할 단계 푸리에 방법으로 풉니다. 분산은 $k$ 공간에서, 비선형성은 $x$ 공간에서 정확히 계산합니다.
notes: '스트랭 분할: 분산 반 단계, 비선형 한 단계, 분산 반 단계. 2차 정확도이며 $N$을 반올림 오차 수준까지 보존합니다. 변조 불안정성: 높이 1인 배경 위에서 파수 $K < 2$인 섭동이 자라며, $K = \sqrt2$에서 성장률 1로 가장 빠릅니다. **modulation** 모드에서는 배경이 $10^{-3}$의 무작위 잡음(고정 시드)으로 시작합니다. $t \approx 8$ 이후 봉우리가 나타나 계속 생겼다 사라집니다. 페레그린 브리더 $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$는 배경에서 한 번 솟아올라 정확히 높이의 $3\times$에 이른 뒤 사라집니다. **peregrine** 모드는 이를 $t = -5$에서 시작합니다. **soliton** 모드는 모양을 영원히 유지하는 밝은 솔리톤 $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$를 발사합니다. 점선은 $|\psi| = 3$을 표시합니다. 길이 60인 주기적 상자.'
meanings:
- 주기적 격자 위의 복소 파동 포락선 (complex128)
- 분산 $i\psi_t = -\tfrac12\psi_{xx}$의 반 단계, 각 푸리에 모드에 대해 정확함
- '반복된 $l$ ⇒ 합: 이산 푸리에 변환'
- 비선형성 $i\psi_t = -|\psi|^2\psi$의 한 단계, $|\psi|$가 변하지 않으므로 정확함
- $\int|\psi|^2$와 $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$, 둘 다 보존
labels:
  mode: 초기 상태
  noise: 잡음 진폭 (modulation)
  eta: 솔리톤 높이 $\eta$
  t_max: 시뮬레이션 시간
