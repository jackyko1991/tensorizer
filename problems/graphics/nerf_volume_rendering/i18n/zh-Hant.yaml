source_hash: 09cd4df32aa9
title: NeRF：神經輻射場的體積渲染
summary: 一個小型 MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$ 賦予空間中每個點一個密度與一個顏色。一個像素是沿其光線收集到的光：分層取樣 $t_s$，再做求積 $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$，透射率 $T_s = e^{-\sum_{s'<s}\sigma_{s'}\delta_{s'}}$，對光線 × 取樣點批次計算。只以合成場景的照片訓練，它就能渲染保留的測試視角與深度圖，而另一個沒有位置編碼的網路則展示了普通 MLP 的頻譜偏差。
notes: 訓練資料是 $V$ 張紅色球、棋盤格立方體與橘色球的照片，由帶 Lambertian 著色的解析光線投射器產生；網路從未看到幾何，只看到像素顏色與每個像素的光線。每個 Adam 步驟從所有訓練像素中抽取一批隨機光線，以求積渲染並與真實顏色比較。由於 $w_{rs}$、$T_{rs}$ 與顏色都是 $\sigma$ 與 $\mathbf c$ 的平滑函數，自動微分會把照片誤差傳回網路：在多個視角的光線一致指向某個表面之處，密度會增長。深度圖 $\sum_s w_s t_s$ 與標記光線上的權重分布顯示了這一點：權重收縮成位於真實表面的尖峰。位置編碼是關鍵技巧。以 $(x, y, z)$ 為輸入的普通 MLP 先學會低頻，對銳利邊緣與細緻紋理的擬合非常緩慢（頻譜偏差）；改餵 $\sin(2^k\pi x), \cos(2^k\pi x)$ 則給了它高頻的構件。在相同步數下，編碼網路（藍）的輪廓更清晰、深度誤差約減半、訓練視角的 PSNR 更高，而普通網路（紅）仍然模糊。在測試視角上增益較小：視角少且小時，細節只受到微弱約束，而且兩個網路都還遠未收斂（真正的 NeRF 要訓練數小時）。相較於 Mildenhall et al.（ECCV 2020）的簡化：沒有視角方向輸入（場景為 Lambertian，顏色不隨觀看角度改變）、只用一個網路而非粗 + 細網路對與階層式取樣、極小的 MLP（3 × 64 而非 8 × 256）、$40\times 40$ 影像，以及數百步而非數十萬步。試試 $L = 2$ 或 $L = 10$、更少的取樣點 $S$（粗糙求積造成條紋）、更多步數（只有使用編碼時才會出現棋盤格），或更少的視角（幾何變得模稜兩可，測試視角變差，而訓練視角仍能擬合）。
meanings:
- 穿過每台相機 $P$ 個像素中每一個的光線之原點與單位方向
- 在 $[t_n, t_f]$ 的 $S$ 個等寬區間中各取一個隨機深度：每步一組新的，因此網路能看到整條光線
- 取樣點：對光線 $r$ 與取樣 $s$ 廣播
- $2^k\pi x_i$ 的 $\sin$ 與 $\cos$，$k = 0 \dots L-1$；不求和，是外積
- 一層 MLP 同時作用於所有取樣點，對 $g$ 求和；層間使用 ReLU
- 密度 $\ge 0$，顏色在 $(0, 1)$ 內
- 沿光線每個區間的長度
- 透射率：光學厚度 $\tau = \sigma\delta$ 對 $s' < s$ 的排他累加和
- 到達像素的光在區間 $s$ 中發出的機率；$\sum_s w_{rs} \le 1$
- 像素顏色，對 $s$ 求和；剩餘的透射率顯示白色背景
- 期望深度：同樣的權重免費給出深度圖
labels:
  n_freq: 編碼頻率數 $L$
  width: 隱藏層寬度 $H$
  n_samples: 每條光線取樣數 $S$
  steps: Adam 步數（每個網路）
  batch: 每步光線數
  lr: Adam 學習率
  n_views: 訓練視角數 $V$
  resolution: 影像大小（像素）
