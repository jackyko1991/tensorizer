source_hash: 07db7a3fd274
title: Частица в ящике и цвет красителей
summary: Почему более длинные сопряжённые молекулы поглощают более красный свет? $\pi$-электроны цианинового красителя свободно движутся вдоль цепи, как частицы в одномерном ящике длины $L$. Заполнение уровней $E_n \propto n^2/L^2$ по два электрона даёт щель HOMO→LUMO $\Delta E = h^2(N+1)/8m_eL^2$ и предсказанную $\lambda_{max}$ сразу для целого гомологического ряда; пакетный конечно-разностный гамильтониан, диагонализованный с помощью torch.linalg.eigh, воспроизводит аналитические уровни.
notes: 'Модель свободных электронов Куна (1948) рассматривает $\pi$-электроны сопряжённой цепи как независимые частицы в ящике. В цианиновом красителе $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$ положительный заряд поделён между двумя атомами азота, поэтому все связи цепи почти одинаковы (около $l = 0.139$ nm), и ящик с плоским дном — хорошее приближение. При $2k + 2$ связях, $N = 2k + 4$ электронах и ящике, выступающем на одну связь за каждый атом азота, $L = (2k + 4)l$ и $\lambda_{max} = 8m_ec\,L^2/h(N + 1)$ растёт почти линейно с $k$: модель предсказывает около 125 нм на каждое добавленное звено CH=CH, а красные квадраты (округлённые измеренные значения для простейших цианинов) поднимаются примерно на 100 нм. Это классический студенческий практикум: записать видимые спектры нескольких цианиновых красителей с возрастающей длиной цепи, а затем по $\lambda_{max}$ подогнать длину ящика или выступ на концах. Численный решатель даёт те же уровни с точностью лучше $10^{-3}$ (его ошибка убывает
  как $(n\,\Delta x)^2$) и может то, чего не может формула: включить потенциал. У полиенов чередуются двойные и одинарные связи; в простом ящике их предсказанная $\lambda_{max}$ уходит далеко в инфракрасную область, тогда как у реальных полиенов она выходит на плато (β-каротин с 11 связями C=C поглощает около 450 нм). Выберите ряд полиенов и поднимите $V_{alt}$ до 1–2 eV: периодический потенциал открывает щель, которая остаётся конечной для длинных цепей, — одномерный зародыш запрещённой зоны. Цветные образцы показывают белый свет за вычетом гауссовой полосы поглощения при каждой $\lambda_{max}$; краситель, поглощающий жёлтый, выглядит синим, а поглощающий только УФ — бесцветным.'
meanings:
- π-электроны и сопряжённые связи молекулы $b$ в ряду
- 'длина ящика: все связи плюс одна длина связи за каждым концевым атомом'
- аналитические уровни; индекс не суммируется, внешнее произведение $n^2$ и $1/L^2$
- от HOMO $n = N/2$ к LUMO $n = N/2 + 1$ и поглощаемая длина волны
- внутренние точки сетки каждого ящика; $\psi = 0$ на стенках
- один конечно-разностный гамильтониан на молекулу, сложенные в стопку
- повторяющийся $j$ ⇒ суммирование; eigh диагонализует весь пакет одним вызовом
- 'повторяющийся $w$ ⇒ суммирование по видимым длинам волн: цвет, остающийся после поглощения'
labels:
  series: Гомологический ряд
  n_max: Самая длинная цепь (добавленные звенья CH=CH)
  bond: Длина связи $l$
  end: Выступ ящика за каждый концевой атом (в связях)
  V_alt: Потенциал альтернирования связей $V_{alt}$
  n_points: Точки сетки $M$
