<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Graph of charged particles: every pair i, j exchanges a message m_ij built from the distance, and particle i is moved along the vector x_i minus x_j; a rotation R of the whole system rotates the prediction">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- pair edges of the graph -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="70" y1="100" x2="140" y2="50"/>
      <line x1="70" y1="100" x2="160" y2="120"/>
      <line x1="140" y1="50" x2="160" y2="120"/>
      <line x1="70" y1="100" x2="40" y2="40"/>
      <line x1="40" y1="40" x2="140" y2="50"/>
    </g>
    <!-- message on the pair i, j -->
    <text x="98" y="66" font-style="italic" fill="#6b7280">m</text>
    <text x="109" y="70" font-style="italic" font-size="10" fill="#6b7280">ij</text>
    <!-- coordinate update of i along x_i - x_j -->
    <line x1="64" y1="104" x2="40" y2="121" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- particles (charges) -->
    <circle cx="70" cy="100" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="140" cy="50" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="160" cy="120" r="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="10" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="78" y="126" font-style="italic">x</text>
    <text x="87" y="130" font-style="italic" font-size="10">i</text>
    <text x="152" y="40" font-style="italic">x</text>
    <text x="161" y="44" font-style="italic" font-size="10">j</text>
    <!-- rotation of the whole system -->
    <path d="M196,40 A26,26 0 1 1 196,92" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M196,92 l7,-7 M196,92 l9,2" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="214" y="71" font-style="italic" fill="#b45309">R</text>
  </g>
</svg>
