source_hash: aac1f92f727e
title: 牛顿分形
summary: 牛顿法 $z \leftarrow z - p(z)/p'(z)$ 作为一个复数张量，在复平面的每个像素上同时运行。按每个像素最终到达的根着色，就画出了吸引域，其边界是分形的，而在根附近误差每一步都会平方。
notes: 在单根 $r$ 附近展开 $p$ 得 $e_{k+1} \approx \frac{p''(r)}{2p'(r)}\,e_k^2$：正确位数每步加倍，右侧面板在对数坐标上把它显示为一条抛物线（对 $z^3 - 1$，该常数恰好为 1）。远离根时牛顿法是混沌的。在临界点（$p'(z) = 0$）附近，$z$ 的微小变化会把下一个迭代点送到平面上的任何地方，因此整幅图的副本在各个尺度上出现。有三个或更多根的多项式的各吸引域共享同一条边界，即牛顿映射的朱利亚集合：一个吸引域的每个边界点也是所有吸引域的边界点（Wada 性质）。终端统计有多少边界像素在其 $3\times3$ 邻域中包含所有颜色，分别在全视图和放大之后。这个比例在各个尺度上大致相同。试试 $z^3 - 2z + 2$，其中 0 附近的起点落入吸引周期 $0 \to 1 \to 0$，永远到不了根（灰色区域）。整个网格是一个复数张量，因此一次 einsum 就能更新每个像素。
meanings:
- 每个像素 $p = (h, w)$ 一个起点：$z = x_w + i\,y_h$
- 从常数项起的多项式系数，例如 $z^3 - 1 \to (-1, 0, 0, 1)$
- 每个像素的幂 $1, z, z^2, \dots$，用累乘构造
- 重复的 $k$ ⇒ 求和：每个像素上的 $p(z)$
- $p'(z)$ 的系数：求导使幂次下移
- 根，即伴随矩阵的本征值
- 每个像素到每个根的距离；对 $j$ 取最小值给出吸引域标签
- 一个双精度起点：该比值趋于 $|p''(r)/2p'(r)|$
labels:
  polynomial: 多项式 $p(z)$
  pixels: 每边像素数
  extent: 视图半宽
  iterations: 牛顿步数
  zoom: 放大倍数
  tol: 收敛容差 $|z - r|$
