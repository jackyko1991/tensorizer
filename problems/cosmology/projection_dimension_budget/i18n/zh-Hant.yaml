title: 需要多少維度？投影假說的維數預算
summary: 這是一個推測性假說，並非已確立的物理：投影的想法需要多少隱藏維度，而實驗又容許多少？量子方面，根據第 1 步，每個結果需要一個隱藏複數維度，$N$ 個糾纏粒子需要 $2^N$ 個，但這些維度存在於希爾伯特空間中，不必是空間中的方向。重力方面，$n$ 個半徑為 $R$ 的緊緻維度會在 $R$ 以下改變牛頓定律。扭秤、LHC 以及超新星與中子星的限制，逐一填滿一張 $(n, R)$ 圖。每個 $n$ 都能存活，但前提是 $R$ 夠小：$n = 1$ 時小於 38.6 μm，$n = 2$ 時小於 $2\times10^{-10}$ m。受到約束，但未被排除。
notes: 狀態：推測性；受到約束，但未被排除。這是投影假說（作者本人的推測性想法，見系列說明；並非已確立的物理）的第 3 步，對應公設 P5：量子效應需要某個 $d_Q$、重力需要某個 $d_G$ 個維度，這些數目是估計出來的，從不人為設定。第 1 步（cosmology/projection_postulate）發現投影競賽每個結果恰好需要一個隱藏複數維度；第 2 步（cosmology/projection_one_particle）切割了一條世界線；第 4 步（cosmology/projection_singularity_fold）把奇點當作投影的摺疊來處理。不預設任何 $n$：這張圖掃描 $n = 0$ 到 $n_{max}$，$R$ 從普朗克長度到 1 m。先講已知的物理。(a) 量子方面：對 $K$ 個結果，競賽以 $d + K$ 個維度重現玻恩定則，而 $N$ 個糾纏的二能級系統需要維數為 $2^N$ 的希爾伯特空間；標準量子力學使用同一個空間，而它的維度不是空間中的方向。如果把它們讀作空間方向，$N$ 個量子位元就需要 $2^{N+1} - 3$ 個額外實數維度（一對貝爾態需要 5 個），這個數目每當粒子發生糾纏就會改變，而任何固定的空間流形都不會如此。(b) 重力方面：在 $3 + n$ 個空間維度中，高斯定律給出引力 $G_D M/r^{n+2}$（以 autograd 計算穿過 $S^{n+2}$ 的通量，對 $n = 0..6$ 作了檢驗）。如果這 $n$ 個維度是半徑為 $R$ 的圓，鏡像求和會在 $R$ 以外把它變成牛頓的 $G_4 M/r^2$，其中 $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$（對 $n = 1, 2, 3$ 作了檢驗）。在稍外處，第一個 Kaluza–Klein 重力子能級給出一個湯川項，$\alpha = 8n/3$（2-環面為 $16/3$，與 PDG 綜述一致），$\lambda = R$。Arkani-Hamed、Dimopoulos 與 Dvali（1998）的 ADD 關係，採用 PDG 與 LHC 實驗所用的約定 $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$，重現了 PDG 的數字：$R = 30$ μm、$n = 2$ 給出 $M_D = 4.0$ TeV，而
  $M_D = 1$ TeV 對 $n = 1..6$ 分別需要 $10^{12}$ m、0.5 mm、……、0.1 MeV$^{-1}$。限制（data/gravity_bounds.csv，引用的數字；扭秤與 LHC 的資料列與 cosmology/hierarchy_extra_dimensions 中附帶的相同，此處再次引用）。Eöt-Wash 扭秤在 56 μm 以上（Kapner et al., PRL 98, 021101, 2007）以及 38.6 μm 以上（Lee et al., PRL 124, 101101, 2020）排除了 $|\alpha| = 1$；由於對每個 $n$ 都有 $\alpha\geq 1$，對所有 $n\geq 1$ 都排除了 $R > 38.6$ μm（這是保守的：量測曲線在更大的 $\lambda$ 處持續下降）。對 $n = 2$，Tan et al.（PRL 116, 131101, 2016）給出 $R < 30$ μm。ATLAS 單噴注搜尋（PRD 103, 112006, 2021, CC-BY 4.0）對 $n = 2..6$ 給出 $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV。SN1987A 的冷卻對 $n = 2$（3）給出 $M_D > 27$（2.4）TeV（Hanhart et al., PLB 509, 1, 2001），而被俘獲的 KK 重力子對中子星的加熱給出 $M_D > 1700$（76）TeV（Hannestad and Raffelt, PRD 67, 125008, 2003），兩者均引自 PDG 2024 綜述。每個限制都成為 $(n, R)$ 網格上的一個布林遮罩，並以玩具點對照手算答案作檢驗。結果：$R_{max} = 38.6$ μm（$n = 1$）、$1.7\times10^{-10}$ m（$n = 2$，中子星）、$2.6\times10^{-12}$ m（$n = 3$），而 $n = 4..6$ 則為 LHC 半徑（$5\times10^{-13}$ 到 $2.5\times10^{-15}$ m）。對 $n\geq 7$ 只附帶了扭秤限制；LHC 限制隨 $n$ 緩慢減弱，若外推（此處未做）會把 $R$ 推向 $1/M_D\sim
  10^{-20}$ m。$M_D = 1$ TeV 的 ADD，也就是層級問題的原始解法，對 $n = 1..6$ 已被排除。預算：最小值為 $n = 0$，因為重力不需要額外的空間維度，而量子的隱藏維度不必是空間性的；沒有最大值，因為只要 $R < R_{max}(n)$，數據容許任何 $n$。假說採取哪種解讀：對 P1 與 P2 採用希爾伯特空間解讀（隱藏維度是狀態空間的維度，因此 $D_Q\geq 2^N$ 對空間不構成約束），對 P4 與 P5 採用幾何解讀（嵌入維度；如果重力能進入其中，它們必須是緊緻的且小於 $R_{max}(n)$，否則它們只是嵌入的座標，而不是可以前往的地方）。結論：受到約束，但未被排除，也沒有新的預測：只有當假說把 $n$ 與 $R$ 固定在這些限制附近時，它才會變得可檢驗。
meanings:
- 重複的 $i$ ⇒ 求和：在 $S^{n+2}$ 上隨機點的向外引力（autograd）；通量在每個半徑上都相同
- 質量及其繞 $n$ 個圓的鏡像，對鏡像指標 $I$ 求和：內部為 $1/r^{n+2}$，外部為 $G_4/r^2$
- 某一引用限制所容許的最大半徑：扭秤為 $\lambda_{max}$，對撞機與天文物理限制則為 $M_D = M_b$ 時的 ADD 半徑
- 每一類限制一張布林圖，廣播到整個網格
- 維數預算：緊緻維度只有在此半徑以下才被容許
- $n$ 個半徑為 $R$ 的維度下重力的基本尺度（Giudice–Rattazzi–Wells 約定，與 PDG 所用相同）
- $N$ 個糾纏量子位元所需的希爾伯特空間維數 $2^N$（第 1 步）
labels:
  n_max: 圖上額外維度的最大數目 $n$（從 0 起的所有 $n$ 都會掃描）
  R_points: 圖上的半徑，從普朗克長度到 1 m 以對數間隔取樣
  M_star: ADD 線的基本尺度 $M_D$
  qubits: 量子計數所用的糾纏量子位元數 $N$
