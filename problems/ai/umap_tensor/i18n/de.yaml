source_hash: 3af965e9bb1a
title: 'UMAP als Tensorproblem: kNN-Graph, Fuzzy-Mengen und ein Kräfte-Layout auf MNIST'
summary: 'UMAP, das Verfahren zur Dimensionsreduktion, das MNIST-Ziffern mit 784 Pixeln als 2D-Karte darstellt, vollständig als Tensoroperationen geschrieben: ein exakter kNN-Graph aus einer einzigen Distanzmatrix und topk, eine Bisektion, die die Bandbreite $\sigma_i$ aller Punkte auf einmal findet, die Fuzzy-Vereinigung $P + P^\top - P\circ P^\top$, ein spektraler Start aus der Graph-Laplace-Matrix sowie anziehende und abstoßende Kräfte, die pro Epoche auf die gesamte Kantenliste angewendet werden (von Hand und noch einmal per Autograd). Auf 2500 Ziffern und einer Swiss Roll erreicht es die Bibliothek umap-learn bei Trustworthiness, Nachbar-Recall und Ziffern-Genauigkeit, weit vor PCA.'
notes: 'Die Frage. „UMAP als reines Tensorproblem“ ist die Anfrage von Jacky Ka Long Ko: UMAP (Uniform Manifold Approximation and Projection; McInnes, Healy und Melville 2018), das üblicherweise über die Bibliothek umap-learn mit ihren numba-Schleifen läuft, nehmen, jeden Schritt als gebatchte Tensoroperationen schreiben und dann prüfen, ob das Ergebnis genauso gut ist. Methode, als Tensoren (N Punkte in D Dimensionen). 1. kNN-Graph: die (N, N) quadrierten Distanzen $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$ (ein einsum), in Zeilenblöcken berechnet, dann liefert topk die (N, k) Distanzen und Indizes; exakt, wie umap-learn unterhalb von 4096 Punkten (darüber wechselt es zum approximativen Nearest-Neighbour-Descent). 2. Fuzzy-simpliziale Menge: $\rho_i$ ist die Distanz zum nächsten anderen Punkt; $\sigma_i$ löst $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ per Bisektion, wobei alle N Intervalle gemeinsam halbiert werden (64-mal, zuvor eine Verdopplungsphase, solange die
  obere Grenze unbekannt ist); die Zugehörigkeiten werden in eine dichte (N, N)-Matrix $P$ gestreut und durch die Fuzzy-Vereinigung $W = P + P^\top - P\circ P^\top$ symmetrisiert (dicht ist bei einigen tausend Punkten in Ordnung; ein dünnbesetzter COO-Tensor ist dieselbe Formel im großen Maßstab). 3. Die niedrigdimensionale Ähnlichkeit $q = 1/(1 + a d^{2b})$, wobei $a$ und $b$ durch eine Gauß-Newton-Kleinste-Quadrate-Anpassung mit 2 Parametern an min_dist angepasst werden; Start: die zwei kleinsten nichttrivialen Eigenvektoren der normalisierten Laplace-Matrix $I - D^{-1/2} W D^{-1/2}$ aus einem dichten torch.linalg.eigh (etwa 4 s für 2500 Punkte auf einem Kern; umap-learn verwendet einen dünnbesetzten Löser; schlägt eigh fehl, weicht der Code auf einen zufälligen Start aus). 4. Layout: 500 Epochen; eine Kante mit Gewicht $w_{ij}$ ist einmal alle $\max w / w_{ij}$ Epochen aktiv (der Zeitplan von umap-learn, gehalten als (E,)-Tensor der nächsten Sampling-Epochen); jede aktive Kante zieht
  ihre beiden Enden an und zieht 5 zufällige Negative, die ihren Kopf abstoßen; alle Kräfte der Epoche werden auf einmal berechnet und mit index_add_ pro Punkt summiert (ein synchrones Update, während umap-learn die Punkte Kante für Kante verschiebt). Dieselbe Schleife mit Autograd: der Gradient der gesampelten Kreuzentropie, nach dem Summieren begrenzt (Clipping). 5. Metriken, alle als Tensoroperationen mit $k$ = 10: Trustworthiness und Continuity (Venna und Kaski 2001) aus Rangmatrizen (ein argsort eines argsort), kNN-Recall und Leave-one-out-10-NN-Ziffern-Genauigkeit im 2D-Layout; PCA per SVD als lineare Baseline. Daten. MNIST (LeCun, Cortes und Burges), Lizenz CC BY-SA 3.0: data/mnist_subset.npz enthält die ersten 250 Trainingsbilder jeder Ziffer (2500 Bilder, uint8; die Share-Alike-Lizenz gilt für diese Teilmenge), siehe data/SOURCES.md. Die Swiss Roll (1500 Punkte, wie bei make_swiss_roll aus scikit-learn, mit etwas Rauschen) wird im Code erzeugt, sodass ihre wahren flachen Koordinaten
  (Bogenlänge, Höhe) bekannt sind. Die umap-learn-Referenz (umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42) wurde einmalig offline in einer Wegwerf-Umgebung von data/make_reference.py berechnet; nur ihre 2D-Koordinaten und Metriken sind beigefügt. Ergebnisse (beigefügter Lauf, CPU, ein Thread). MNIST, 2500 Ziffern: Trustworthiness / Continuity / 10-NN-Recall / 10-NN-Ziffern-Genauigkeit = 0.957 / 0.963 / 0.39 / 0.887 mit den handgeschriebenen Kräften, 0.960 / 0.963 / 0.40 / 0.898 mit Autograd, 0.963 / 0.963 / 0.40 / 0.896 für umap-learn und 0.740 / 0.913 / 0.07 / 0.414 für PCA. Swiss Roll: Trustworthiness 0.999 (umap-learn 0.999, PCA 0.943), und gegenüber den wahren flachen Koordinaten 0.999, wobei 76 % der wahren 10 nächsten Nachbarn erhalten bleiben (umap-learn 77 %, PCA 28 %). Unsere Trustworthiness stimmt außerdem auf den beigefügten umap-learn-Layouts bis auf $2\times 10^{-4}$ mit der von scikit-learn überein (getestet), und $a$, $b$ stimmen mit denen von umap-learn überein.
  Laufzeit auf MNIST: 11 s mit den Kräften (0.5 s Graph, 4 s eigh, 7 s Layout), 15 s mit Autograd, 14 s für umap-learn (zweiter Aufruf, ein Thread; sein erster Aufruf mit numba-Kompilierung dauerte 28 s). Nach der besten Rotation, Spiegelung und Skalierung (Procrustes) weicht unser MNIST-Layout von dem von umap-learn um eine Disparität von 0.05 ab (0 = gleiche Form, 1 = ohne Zusammenhang); dieselben Ziffern-Cluster liegen an denselben Stellen. Fazit und Grenzen. UMAP ist ein Tensorproblem: Graphkonstruktion, Bandbreitensuche, Fuzzy-Vereinigung, spektraler Start und Kräfte-Layout sind allesamt gebatchte Tensoroperationen, und das Ergebnis ist nach jeder hier verwendeten Metrik so gut wie die Referenz. Was sich unterscheidet: Layouts werden über Metriken verglichen, nie über Koordinaten, denn UMAP-Layouts sind nur bis auf Rotation, Spiegelung und die Zufälligkeit des Negative Sampling definiert (ein anderer Seed verschiebt die Cluster); oberhalb von 4096 Punkten wird der kNN von umap-learn
  approximativ, während unserer exakt bleibt (und $O(N^2)$ kostet); unsere dichten $N\times N$-Matrizen und eigh begrenzen diese Version auf etwa $10^4$ Punkte (Blöcke, dünnbesetzte Tensoren und ein iterativer Eigenwertlöser würden das aufheben); durch das synchrone Update sehen die frühen Epochen wie ein heißes Gas aus (die Lernrate liegt nahe 1 und jeder Punkt bekommt alle seine Stöße auf einmal), bevor das Layout abkühlt. Die Swiss Roll erhält jede lokale Nachbarschaft, wird aber nicht als eine saubere Fläche abgerollt: Sie reißt in Streifen, wie bei umap-learn, eine bekannte Eigenschaft von UMAP und t-SNE. Die Ziffern-Genauigkeit misst, wie gut die Karte Klassen trennt, die sie nie gesehen hat; sie ist kein Klassifikator. Die Ergebnisse schwanken je nach BLAS-Build und Thread-Anzahl um einige Tausendstel. Verwandte Arbeiten. t-SNE (van der Maaten und Hinton 2008) etablierte das Muster, Nachbarschaftswahrscheinlichkeiten mit einem Kern mit schweren Rändern in 2D abzugleichen; UMAP ersetzt
  dessen normalisierte Wahrscheinlichkeiten durch Fuzzy-Zugehörigkeiten und die vollständige Abstoßung durch Negative Sampling (wie in word2vec), weshalb es skaliert. Laplacian Eigenmaps (Belkin und Niyogi 2003) liefern den spektralen Start. Ausprobieren. Weniger Nachbarn (5) ergeben mehr, kleinere Cluster; min_dist nahe 0.9 verteilt die Punkte locker; weniger Epochen zeigen ein unfertiges Layout; ein anderer Seed dreht und mischt die Karte neu, während die Metriken gleich bleiben.'
meanings:
- Distanzen zu den $k$ nächsten Punkten (der Punkt selbst zuerst), aus $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$ (wiederholtes $d$ ⇒ summiert) und topk; exakt, Zeilenblöcke halten den Speicher bei $O(BN)$
- $\rho_i$ = Distanz zum nächsten anderen Punkt; $\sigma_i$ durch 64 Halbierungen eines einzigen Intervall-Tensors für alle Punkte gleichzeitig, sodass $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$
- 'gerichtete Zugehörigkeit: 1 für den nächsten Nachbarn, darüber hinaus mit der Distanz abfallend, 0 außerhalb der kNN-Liste'
- 'Fuzzy-Vereinigung (probabilistisches ODER) der beiden Richtungen: symmetrisch, in $[0, 1]$; ihre Nicht-Null-Einträge bilden die Kantenliste $(i_e, j_e)$, $E$ ≈ 50 000 für 2500 Ziffern'
- 'Gauß-Newton-Anpassung von $1/(1 + a x^{2b})$ an 1 unterhalb von min_dist und an $e^{-(x - \mathrm{min\_dist})}$ darüber: $a$ = 1.577, $b$ = 0.895 für min_dist = 0.1'
- 'spektraler Start: die zwei kleinsten nichttrivialen Eigenvektoren der normalisierten Graph-Laplace-Matrix, skaliert auf $[0, 10]$'
- Kräfte aller gesampelten Kanten $(i, j)$ und von 5 zufälligen Negativen $s$ pro Kante, pro Punkt in einem einzigen Scatter-Add summiert; jeder Term auf $\pm 4$ begrenzt; Lernrate $\alpha = 1 - \mathrm{epoch}/n$
- 'derselbe Schritt per Autograd aus dem gesampelten Verlust $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$: gleich den handgeschriebenen Kräften (getestet)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, Ränge $r$ aus einem argsort eines argsort; Continuity vertauscht $x$ und $y$
labels:
  n_neighbors: Nachbarn $k$ (einschließlich des Punktes selbst)
  min_dist: Minimaler Abstand im Layout
  n_epochs: Layout-Epochen
  neg_rate: Negative Samples pro Kanten-Sample
  n_mnist: MNIST-Bilder (über die Ziffern ausgeglichen)
  seed: Zufalls-Seed
