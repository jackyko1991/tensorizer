source_hash: 4e5cb68f190c
title: 'Сила оркестрации рабочих процессов: когорта виллизиева круга как тензорный DAG'
summary: 'Сосудистое исследование — это цепочка шагов (сегментировать МРА, извлечь граф центральных линий, измерить сосуды, расставить входы и выходы, рассчитать кровоток, составить отчёт), и каждый шаг уже является тензорной программой, поэтому рабочий процесс, который оркестрирует Snakemake, тоже может быть тензором. На шести открытых (CC0) МРА-снимках виллизиева круга из TopCoW один и тот же Snakefile выполняют Snakemake (офлайн) и тензорный DAG-движок: граф заданий — сумма кронекеровых произведений, его уровни, критический путь и набор для перезапуска — итерации матрица–вектор, а результаты совпадают задание за заданием. Затем: сколько времени сэкономлено, откуда берётся выигрыш и что не может дать файловый DAG — градиент через весь конвейер. Только для обучения, не для клинического применения.'
notes: 'Идея. Формулировка «сила оркестрации рабочих процессов» принадлежит Jacky Ko и выросла из его работы в HPC и диссертации о сосудистых конвейерах: если каждый этап конвейера — тензорная программа, то и DAG, который планирует менеджер рабочих процессов, может быть тензором. Эта задача строит такой DAG и измеряет его. Рабочий процесс. В data/Snakefile восемь правил (segment, centreline, measure, boundaries, flow, report, cohort, all) и два шаблона (wildcards): случай (шесть снимков) и условие (оба входа ICA открыты или левая ICA перекрыта). Shell каждого правила запускает workflow.py, который вызывает для одного случая ту же тензорную функцию, что тензорный движок вызывает один раз для всех случаев. Snakemake 9.27.1 был запущен офлайн в WSL2 (в собственном окружении, никогда не входившем в этот проект), и его результаты приложены как эталон в data/snakemake: DAG заданий (--dag), список заданий пробного запуска (dry-run), набор для перезапуска после изменения одного входа, --summary,
  время начала и конца каждого задания и таблица когорты, записанная его заданиями. Тесты проверяют, что у тензорного движка те же 50 заданий и 79 рёбер, что порядки Snakemake согласуются с нашей $A$ и дают наши уровни, что набор для перезапуска совпадает и что таблица когорты идентична до 9 записанных знаков. Деталь о перезапусках: touch входного файла не заставил Snakemake ничего перезапустить, потому что для маленьких файлов он сравнивает контрольные суммы; эталон меняет байты файла (при тех же массивах), и тогда перезапускаются 10 заданий, как и предсказывает $x = s \lor Rs$. Время. В приложенном запуске Snakemake занял 118 s на 1 ядре, 43 s на 6 и 27 s на 12 (более ранний запуск на менее загруженной машине: 79, 23 и 22 s); тензорный движок выполняет ту же работу примерно за 5–10 s в одном потоке. Честный учёт: каждое задание Snakemake — это новый процесс, который запускает Python и импортирует torch и модуль задания (около 1.8 s, data/snakemake/startup.csv, то есть около 88 s из 115
  s суммарного времени заданий), читает и пишет файлы .npz и ждёт планировщика; тензорный движок платит за это один раз. Сама пакетная обработка здесь на CPU даёт мало (поочерёдный прогон случаев в одном процессе занимает примерно столько же, иногда меньше), так что выигрыш идёт от запуска процессов и файлов, и он сокращается, когда каждое задание — тяжёлый расчёт на GPU, намного превышающий затраты на запуск. Никакое расписание на $c$ ядрах не быстрее $\max(\mathrm{CP}, W/c)$ — максимума из критического пути, полученного max-plus-итерацией, и общей работы, делённой на $c$, — и измеренные запуски соблюдают эту границу; поиск оптимального расписания в общем случае NP-труден (списочное планирование Грэма укладывается в $W/c + \mathrm{CP}$). Градиент. Файловый DAG передаёт числа, а не производные. Мягкий порог делает сегментацию, радиусы и кровоток дифференцируемыми, поэтому $\partial s_{\mathrm{L\,MCA}}/\partial\theta$ (доля оттока через левую MCA) получается для каждого случая одним обратным
  проходом и совпадает с центральными конечными разностями, которые стоили бы Snakemake двух дополнительных полных запусков. Граф центральных линий (топология) и маска связных компонент фиксированы. Конвейер. Сегментация: мягкий порог $\sigma((I - \theta)/w)$ нормированной интенсивности TOF, жёсткая маска $I > \theta$ без компонент меньше 64 вокселей, Dice относительно маски TopCoW около 0.86–0.91. Центральные линии: по меткам сосудов TopCoW — узлы там, где встречаются размеченные сосуды (контакты в пределах 3.5 mm объединяются; учитываются только анатомические пары, так что две идущие рядом A2 не считаются), свободный конец на каждый концевой сосуд (его самый дальний воксель по min-plus-эйконалу со временем пробега $\ell/R^2$, с повторным центрированием) и кратчайший центрированный путь между соседними узлами (как в тензорной замене VMTK в задаче об аневризме). Измерение: каждый воксель вблизи размеченных сосудов относится к ближайшей точке центральной линии, поэтому радиус ребра равен
  $\sqrt{V_e/(\pi L_e)}$ по мягкому объёму; асимметрия $2(r_R - r_L)/(r_R + r_L)$ для каждого сосуда; флаг стеноза там, где сглаженный профиль радиуса опускается ниже половины своей медианы (у этих здоровых добровольцев такие флаги — артефакты сегментации). Граничные условия, как в Venova: входы на свободных концах ICA и базилярной артерии, выходы на концах MCA, ACA и PCA; концы Pcom и Acom никогда не бывают границами. Кровоток: стационарная модель пониженного порядка, пуазейлева проводимость на каждом ребре, $P$ = 90 mmHg на открытых входах, каждый выход отводится в 0 Pa через нагрузку Мюррея $g_k \propto r_k^3$, настроенную так, чтобы сеть без сопротивления несла 10 ml/s; одно пакетное решение линейной системы. Тест коллатералей перекрывает левую ICA: там, где проходима Acom или Pcom, левое полушарие остаётся перфузируемым. Упрощения: ньютоновская кровь, жёсткие прямые трубки, без пульсации, без 3D-течения (задача об аневризме решает 3D CFD для одного сосуда), радиусы по порогу на вокселях
  0.5 mm, давления и расходы порядка литературных значений. Данные. TopCoW 2024, подмножество MRA_Lausanne (Zenodo 10.5281/zenodo.15692630, лицензия CC0): 20 снимков TOF-МРА здоровых добровольцев с разметкой виллизиева круга. Шесть случаев приложены как вырезки 96×80×48 с шагом 0.5 mm (изображение и метки, всего меньше 1 MB); в data/SOURCES.md описаны обработка и источники (Yang et al., соревнование TopCoW; Di Noto et al. 2022, лозаннская когорта). Основной выпуск TopCoW не используется (его лицензия ограничивает коммерческое использование). Результаты. Помимо GIF, есть два 3D-результата. results/centreline.pvd — анатомия: поверхность сегментации каждого случая (marching tetrahedra) и её граф центральных линий, оба окрашены по радиусу сосуда. results/flow.pvd — течение 1D-сети Пуазейля на 11 шагах, в ходе которых левая ICA сужается: шаг по времени — степень стеноза s, доля утраченного диаметра просвета (0 — открыта, 1 — закрыта). Его слои — поверхность сосуда, окрашенная по касательному
  напряжению на стенке $\tau_w = 4\mu|Q|/(\pi r^3)$ ближайшего ребра центральной линии (давление — вторым массивом), линии тока и частицы (и те и другие окрашены по скорости), а также диски входов и выходов со стрелками. 3D CFD здесь нет: линии тока — идеализированное осевое течение 1D-модели, линии, параллельные центральной линии каждого сосуда, на расстоянии $\rho = 0, 0.35, 0.7$ его радиуса, со скоростью Хагена–Пуазейля $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$; вторичного течения нет, и на развилках они обрываются. Каждый шаг — стационарное состояние; частицы продвигаются вдоль своих линий тока лишь на фиксированное псевдовремя 4 мс за шаг (пройдя конец сосуда, возвращаются к его началу), только чтобы показать скорости. Стеноз моделируется отрезком Пуазейля длиной 10 мм, последовательным со входом, поэтому его проводимость падает как $(1 - s)^4$; s = 0 и s = 1 — ровно два условия рабочего процесса, а промежуточные шаги считает только тензорный движок (одно пакетное решение на шаг). results/stenosis_sweep.csv
  содержит приток по левой ICA и долю левой MCA для каждого шага и случая; остальные числа содержатся в results/timings.csv, results/equivalence.csv и results/cohort.csv.'
meanings:
- правило $s$ читает файловый шаблон, который пишет правило $r$; разобрано из самого приложенного Snakefile
- 'для каждой оси шаблона $a$ (случай, условие): $I$, когда она есть у обоих правил (рёбра по случаям $A \otimes I$), $\mathbb 1$ для рассылки (broadcast), $\mathbb 1^\top$ для сбора, например в отчёт по когорте'
- $A_{ij} = 1$, когда задание $i$ читает выход задания $j$; 50 заданий, 79 рёбер
- замкнутые обходы длины $k$; все нули ⇔ $A$ нильпотентна ⇔ ацикличность
- считает пути $j \to i$; её 0/1-шаблон — достижимость (булево повторное возведение в квадрат)
- 'топологический уровень булевой итерацией матрица–вектор: задание готово, когда в его строке $A\,\neg\mathrm{done} = 0$'
- самые ранние времена завершения, неподвижная точка max-plus (тропической) алгебры; $\max_i t_i$ — критический путь
- задания для перезапуска после того, как задания из $s$ (читатели изменённого файла) устарели
- мягкая сегментация, дифференцируемая по порогу $\theta$ (по одному на случай)
- 'min-plus-эйконал на воксельном графе всех сосудов всех случаев сразу: свободные концы и центральные линии'
- радиус ребра по мягкому объёму вокселей, ближайших к его центральной линии
- Кирхгоф с пуазейлевыми проводимостями $G_e$ и выходными нагрузками Мюррея $g_k$, одно пакетное решение; строки Дирихле $p = P$ на открытых входах
- доля кровотока левой MCA, продифференцированная через кровоток, измерение и сегментацию, все случаи за один обратный проход
labels:
  threshold: Порог сегментации $\theta$ по нормированной интенсивности
  cores: Число ядер $c$ в границе $\max(\mathrm{CP}, W/c)$
