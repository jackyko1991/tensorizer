source_hash: a175ef505737
title: 以數千個零點看黎曼猜想
summary: 用張量形式的 Riemann–Siegel 公式在臨界線上定位 $\zeta$ 的數千個非平凡零點，將其數目與 Riemann–von Mangoldt 定律 $N(T) = \theta(T)/\pi + 1 + S(T)$ 及 Gram 定律比較，把它們的間距和對關聯與隨機 Hermite（GUE）矩陣比較，並由它們重建質數冪階梯函數 $\psi(x)$。猜想本身，即每個非平凡零點的實部都是 $\frac12$，至今仍未解決。
notes: 本頁補充問題「黎曼 zeta 函數與質數」（maths/zeta_primes）：那裏用 Euler–Maclaurin 從頭構造 $\zeta$、找出最初的零點並重建 $\pi(x)$；基礎知識請先讀那一頁。這裏用更快的 Riemann–Siegel 公式及其修正項 $C_0, C_1, C_2$（$\Psi$ 的導數由 Chebyshev 級數求得），在二十五萬個高度上計算 $Z(t)$，找出臨界線上低於 $T$ 的每一個零點；在 $t \ge 100$ 時，它與高精度計算（mpmath）的差小於 $10^{-5}$。在 $t = 1000$ 以下它找到 649 個變號，在 5000 以下找到 4520 個，恰好等於帶狀區域中到這些高度為止的零點總數（用 mpmath 獨立計算），因此它們全部位於臨界線上；計數函數跟隨 $\theta(T)/\pi + 1$，帶有一個平均為零的小幅波動 $S(t)$。Gram 定律在大多數 Gram 點成立，首次失效於 $g_{126} \approx 282.45$。展開到平均間距 1 之後，零點之間的互斥與大型隨機 Hermite 矩陣（GUE）的特徵值完全一樣：Montgomery（1973）猜想對關聯為 $1 - (\sin \pi u / \pi u)^2$，並在假設黎曼猜想的前提下，對 Fourier 支集在 $(-1, 1)$ 內的測試函數證明了它；Odlyzko 在第 $10^{20}$ 個零點附近的計算以驚人的精度證實了這一點；在本頁的低高度上，吻合程度已經很接近。顯式公式（von Mangoldt 1895，已證明）把零點轉化為質數：每對 $\frac12 \pm i\gamma$ 貢獻一個波 $x^{1/2}\cos(\gamma\ln x)$，有了數千個零點，$\psi(x)$ 就成為清晰的階梯。黎曼猜想，即每個非平凡零點的實部都是 $\frac12$，是克雷千禧年大獎難題之一，至今未解決。它已對高度 $3\times10^{12}$ 以下的所有零點驗證過（Platt 與 Trudgian 2021）。帶狀區域中顯示的已證明結果：$\operatorname{Re} s = 1$ 上沒有零點（Hadamard、de la Vallée Poussin 1896，等價於質數定理），以及無零點區域
  $\sigma > 1 - 1/(5.558691\ln t)$（Mossinghoff 與 Trudgian 2015），並由函數方程鏡像對稱。僅屬聲稱、尚未確立：據報導，OpenAI 於 2026 年 10 月在其公開的 AI 生成手稿庫 openai/math 中發表了一個聲稱的結果（我們未核查這些手稿）：$\zeta$ 及每個 Dirichlet $L$ 函數在半平面 $\operatorname{Re} s > 7/8$ 內沒有零點，另附一個關於 $\operatorname{Re} s > 11/12$ 的配套論證。這些預印本未經同行評審，也未經獨立驗證；若正確，一條固定寬度的無零點帶狀區域將是重大進展，但仍距 $\frac12$ 這條線很遠。任何計算都無法證明這個猜想：有限的搜尋只能找到線上的零點，或者找到反例。
meanings:
- 重複的 $n$ ⇒ 求和：一次過計算 250 000 個高度的主和，遮罩為 $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$
- $\Psi$ 是整函數，但其商式在 $p = \frac14, \frac34$ 處為 $0/0$；用 Chebyshev 擬合消除此問題
- Riemann–Siegel 修正項：Chebyshev 級數可逐項微分，$c'_{k-1} = c'_{k+1} + 2k\,c_k$
- 在步長 0.02 的網格上找 $Z$ 的變號，再對所有區間同時做 32 步二分
- 零點計數減去其光滑部分；保持很小且平均為 0
- 用 Newton 法一次過求出所有 Gram 點；Gram 定律指 $(-1)^n Z(g_n) > 0$
- 展開後的零點 $x = \theta(\gamma)/\pi + 1$ 與其後 $J = 10$ 個鄰居之差，用於對關聯
- 每個零點在每個 $x$ 處的貢獻，對零點累加：每個高度 $T$ 一行
labels:
  t_max: 高度 $T$
  x_max: 顯式公式計算到 $x$
