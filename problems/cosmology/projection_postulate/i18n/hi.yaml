source_hash: 296b0fae0936
title: 'प्रक्षेपण अभिधारणा: एक उच्च-विमीय अवस्था, अनेक छायाएँ'
summary: 'यह एक अनुमानात्मक परिकल्पना है, स्थापित भौतिकी नहीं: ब्रह्मांड बहुत अधिक विमाओं $D$ वाले स्थान में एक ही अवस्था $\Psi$ है, और प्रेक्षक जो मापता है वह कुछ ही विमाओं पर उसका प्रक्षेपण है। यह चरण अभिधारणाएँ लिखता है और उनके गणित की जाँच करता है। दिखने वाला अंश $\|P\Psi\|^2$ Beta$(d, D-d)$ बंटन का पालन करता है, और मापन को छिपे खंडों के बीच एक दौड़ के रूप में मॉडल किया गया है। हर परिणाम के लिए एक छिपी सम्मिश्र विमा ठीक बॉर्न नियम देती है; अधिक विमाएँ ऐसा विचलन देती हैं जिसे तीन-झिरी प्रयोग खारिज करते हैं। अब तक यह विचार क्वांटम यांत्रिकी से आगे जाने के बजाय उसे ही दोहराता है।'
notes: 'स्थिति: अनुमानात्मक। यह लेखक की अपनी परिकल्पना है (शृंखला का विवरण देखें), स्थापित भौतिकी नहीं, और कोई भी प्रयोग इसे मानक क्वांटम यांत्रिकी से अधिक समर्थन नहीं देता। यह पहला चरण अभिधारणाओं को सटीक रूप से लिखता है और उस गणित की जाँच करता है जिस पर वे टिकी हैं। अभिधारणाएँ। P0 (एक वास्तविकता): ब्रह्मांड विमा $D$ वाले स्थान में एकमात्र अवस्था $\Psi$ है, संभवतः $D\to\infty$। P1 (प्रक्षेपण): प्रेक्षक केवल $d$-विमीय उपस्थान पर प्रक्षेपण $P:\mathbb C^D\to\mathbb C^d$ देखता है; मापी गई क्वांटम अवस्था $\psi = P\Psi/\|P\Psi\|$ है, इसलिए तरंग-फलन $\Psi$ का प्रक्षेपण है, स्वयं $\Psi$ नहीं। P2 (घटना): मापन एक निश्चित समय-खंड पर प्रक्षेपण है जो एक परिणाम $k$ चुनता है; परिणामों के भार $\|P_k\Psi\|^2$ से आते हैं, और बॉर्न नियम को माना नहीं, परखा जाता है। P3 (एक कण): सभी कण एक ही वस्तु के प्रक्षेपण हैं। P4 (ज्यामिति): वक्र दिक्-काल एक सपाट उच्च-विमीय अंतःस्थापन का प्रक्षेपित आकार है, और विलक्षणता वह जगह है जहाँ प्रक्षेपण मुड़ता है (उसका जैकोबियन रैंक खो देता है)। P5 (खुली विमा): क्वांटम प्रभावों को
  किसी न्यूनतम $d_Q$ और गुरुत्व को $D$ के भीतर किसी $d_G$ की ज़रूरत है; इनका अनुमान लगाया जाता है या फिट किया जाता है, इन्हें कभी हाथ से $3+1$ पर नहीं रखा जाता। क्या गणना होती है। (1) माप का संकेंद्रण: $\mathbb C^D$ के गोले पर एकसमान $\Psi$ के लिए $\|P\Psi\|^2\sim$ Beta$(d, D-d)$, माध्य $d/D$; इसकी जाँच माध्य, प्रसरण और Kolmogorov–Smirnov परीक्षण से $D$ के 4 से $D_{max}$ तक के मानों के लिए होती है; सामान्यीकृत $\psi$ छोटे गोले पर एकसमान है, $D$ चाहे जो हो। एक सामान्य प्रेक्षक मानदंड का केवल $d/D$ अंश देखता है, जो $D\to\infty$ होने पर शून्य हो जाता है। (2) P2 को प्रक्षेपण दौड़ के रूप में ठोस बनाना (लेखक का मॉडल, यहाँ औपचारिक रूप में): हर परिणाम $k$ अपनी $m$ छिपी सम्मिश्र विमाओं वाले खंड से जुड़ता है जिसकी ऊर्जा $E_k = \|h_k\|^2$ है, और सबसे बड़े $|c_k|^2/E_k$ वाला परिणाम घटता है। $m = 1$ के लिए $E_k\sim$ Exp(1) है और घातांकी दौड़ ठीक $P(k) = |c_k|^2$ देती है: बॉर्न नियम। $m > 1$ के लिए $E_k\sim$ Gamma$(m)$ है और सबसे संभावित परिणाम बहुत बार जीतता है; दो परिणामों के लिए $P_1 = I_{|c_1|^2}(m,
  m)$, और विचलन $m$ के साथ बढ़ता है। वास्तविक छिपी विमाएँ Gamma$(m/2)$ देती हैं: एक वास्तविक विमा आर्कसाइन नियम $\tfrac2\pi\arcsin|c_1|$ देती है, दो बॉर्न नियम। (3) विमाओं की गिनती (P5): दौड़ को $K$ परिणामों के लिए $D\geq d + K$ चाहिए; $N$ उलझे हुए द्वि-स्तरीय निकायों को $D\geq 2^N$ चाहिए, यानी प्रेक्ष्य ब्रह्मांड के $\sim10^{80}$ कणों के लिए लगभग $10^{3\times10^{79}}$, जो P0 के $D\to\infty$ से मेल खाता है। ईमानदारी से: मानक क्वांटम यांत्रिकी पहले से ठीक यही हिल्बर्ट स्थान इस्तेमाल करती है, और आंशिक ट्रेस तथा प्रक्षेपण लेना मानक है। अब तक यह परिकल्पना एक पुनर्व्याख्या है; कोई भी परखने योग्य नवीनता वहीं से आनी चाहिए जहाँ $m > 1$ वाली दौड़ या कोई बाद का चरण कुछ अलग भविष्यवाणी करे। ग्लीसन का प्रमेय (1957) पहले ही दिखाता है कि $d\geq 3$ के लिए हिल्बर्ट स्थान पर कोई भी गैर-प्रासंगिक प्रायिकता निर्धारण बॉर्न नियम ही है। (4) आँकड़े: तीन-झिरी व्यवस्था में (परदे के 41 खाने और एक ''अवरुद्ध'' परिणाम, हर एक का अपना छिपा खंड) दौड़ Sorkin प्राचल $\kappa\approx s\,(a-1)$ देती है, जहाँ 9 विभाजनों में $s$
  0.56 और 0.74 के बीच है, और छिपा आकार प्राचल $a = m$ (सम्मिश्र) या $m/2$ (वास्तविक) है। मापे गए मान (data/born_rule_tests.csv, उद्धृत संख्याएँ): Sinha आदि (Science 329, 418, 2010) $|\kappa|$ को $10^{-2}$ से नीचे सीमित करते हैं; Park आदि (NMR, New J. Phys. 14, 113025, 2012) $\kappa = 0.001\pm0.003$; Kauten आदि (New J. Phys. 19, 033017, 2017, मुक्त अभिगम, CC-BY 3.0) घोषित एकल फोटॉनों से $0.0\pm1.6\times10^{-3}$, क्षीण लेज़र प्रकाश से $(1.3\pm1.8)\times10^{-4}$ और शास्त्रीय प्रकाश से $0.0\pm3.1\times10^{-5}$। $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ और सबसे छोटी ढलान लेने पर एकल-फोटॉन आँकड़े $|a-1|\leq 6\times10^{-3}$ की अनुमति देते हैं, और यदि हर फोटॉन संसूचन एक दौड़ है तो शास्त्रीय प्रकाश के आँकड़े $|a-1|\leq 1.1\times10^{-4}$ की। $m = 2$ वाली दौड़ $\kappa\approx 1$ देती है और एक वास्तविक छिपी विमा $\kappa\approx 0.1$, दोनों खारिज हैं; हर परिणाम के लिए केवल एक सम्मिश्र (दो वास्तविक) छिपी विमा बचती है। यह मॉडल पर एक प्रतिबंध है, उसका समर्थन नहीं: $m = 1$ ठीक वही स्थिति है जिसे मानक क्वांटम
  यांत्रिकी से अलग नहीं किया जा सकता। $\kappa$ से संबंध इस पर निर्भर है कि परिणामों को कैसे बाँटा जाए, इसलिए सबसे सतर्क ढलान ली गई है। शृंखला के अगले चरण (यहाँ नहीं बनाए गए): P3 (सभी कण एक वस्तु के प्रक्षेपण), P4 (वक्र दिक्-काल एक सपाट अंतःस्थापन की छाया: Janet–Cartan प्रमेय से विश्लेषिक 4D मीट्रिक स्थानीय रूप से 10 सपाट विमाओं में, और श्वार्ज़शिल्ड 6 में अंतःस्थापित होता है), गुरुत्व के लिए $d_G$ को फिट करना, और ऐसी भविष्यवाणी की खोज जो मानक भौतिकी से अलग हो।'
meanings:
- $\Psi$ के मानदंड का वह अंश जो प्रेक्षक देखता है, सभी $D$ के लिए एक साथ (नेस्टेड अवस्थाएँ)
- प्रेक्षित अवस्था, किसी भी $D$ के लिए $\mathbb C^d$ के इकाई गोले पर एकसमान
- Beta$(d, D-d)$ से Kolmogorov–Smirnov दूरी (अपूर्ण बीटा फलन क्षेत्रकलन से)
- '$m = 1..M$ विमाओं वाले छिपे खंड $k$ की ऊर्जा: Gamma$(m)$ (सम्मिश्र) या $2\,$Gamma$(m/2)$ (वास्तविक)'
- 'प्रक्षेपण दौड़: सबसे बड़े $|c_k|^2/E_k$ वाला परिणाम घटता है'
- दौड़ का बंद रूप; $j$ पर योग ($j = k$ को घटाकर) बाकी परिणामों पर गुणनफल है
- 'दोहराया गया झिरी सूचकांक $s$ ⇒ योग: खुली झिरियों के हर समुच्चय $S$ का आयाम'
- दौड़ मॉडल का Sorkin तीन-पथ प्राचल; बॉर्न नियम के लिए $0$
labels:
  D_max: सबसे बड़ी कुल विमा $D$ (उदाहरण; गणना इस तक की विमाओं की सीढ़ी लेती है)
  d: प्रेक्षक उपस्थान की विमा $d$ (उदाहरण)
  m_max: प्रति परिणाम छिपी विमाओं की अधिकतम संख्या $m$
  outcomes: परिणामों की संख्या $K$
  trials: प्रति स्थिति यादृच्छिक अवस्थाएँ और घटनाएँ
