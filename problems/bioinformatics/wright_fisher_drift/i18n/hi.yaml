title: हार्डी–वाइनबर्ग और राइट–फ़िशर आनुवंशिक विचलन
summary: यादृच्छिक संगम हार्डी–वाइनबर्ग जीनोटाइप आवृत्तियाँ $p^2, 2pq, q^2$ देता है; हर पीढ़ी में $2N$ जीन प्रतियों का यादृच्छिक नमूना युग्मविकल्पी (allele) आवृत्तियों को विचलित (drift) करता है। हज़ारों आबादियाँ द्विपद नमूनों के एक (प्रतिकृतियाँ, पीढ़ियाँ) टेंसर के रूप में एक साथ विकसित होती हैं, वैकल्पिक रूप से चयन $s$ के साथ, और विषमयुग्मजता के लिए $(1-1/2N)^t$ से तथा स्थिरीकरण के लिए $1/2N$ और किमुरा के सूत्र से तुलना की जाती है।
notes: 'हार्डी–वाइनबर्ग कहता है कि यादृच्छिक संगम का एक दौर युग्मविकल्पी आवृत्ति $p$ को जीनोटाइप आवृत्तियों $p^2, 2pq, q^2$ में बदल देता है, माता-पिता के जीनोटाइप चाहे जो रहे हों; बिंदु दो यादृच्छिक युग्मकों से बने $N$ व्यष्टि हैं और उन वक्रों के आसपास बिखरते हैं। युग्मविकल्पी आवृत्तियाँ केवल अनंत आबादी में स्थिर रहती हैं। $2N$ प्रतियों के साथ हर पीढ़ी पिछली का एक द्विपद नमूना है, इसलिए $p$ एक यादृच्छिक भ्रमण करता है जब तक वह 0 (युग्मविकल्पी लुप्त) या 1 (युग्मविकल्पी स्थिर) तक नहीं पहुँचता। यादृच्छिक रूप से चुनी गई दो प्रतियों की एक साझा जनक प्रति होने की प्रायिकता $1/2N$ है, इसलिए अपेक्षित विषमयुग्मजता $2pq$ प्रति पीढ़ी $1 - 1/2N$ के गुणक से घटती है; छोटी आबादियों में विचलन तेज़ होता है। एक नया उदासीन उत्परिवर्तन $2N$ में से एक प्रति के रूप में शुरू होता है; चूँकि अंततः $2N$ प्रतियों में से एक सबकी पूर्वज होगी, उसके स्थिर होने की संभावना $1/2N$ है। चयन के साथ किमुरा का विसरण परिणाम लागू होता है: $4Ns \gg 1$ वाला लाभकारी युग्मविकल्पी लगभग $2s$ प्रायिकता से स्थिर होता है, जो अब भी निश्चितता
  से बहुत दूर है, और हल्का हानिकारक युग्मविकल्पी $|4Ns| \lesssim 1$ होने पर विचलन से स्थिर हो सकता है। यहाँ $N$ आदर्शीकृत आबादी आकार है (स्थिर, यादृच्छिक संगम, कोई उत्परिवर्तन या प्रवासन नहीं); वास्तविक आबादियों का वर्णन एक छोटे प्रभावी आकार $N_e$ से होता है।'
meanings:
- पीढ़ी $t$ पर प्रतिकृति आबादी $r$ में युग्मविकल्पी A की आवृत्ति
- 'चयन के बाद: A प्रतियाँ $1+s$ गुना अधिक बार आगे जाती हैं'
- 'अगली पीढ़ी की $2N$ प्रतियों में A की संख्या: प्रति आबादी एक नमूना, सब एक साथ'
- यादृच्छिक संगम के तहत जीनोटाइप आवृत्तियाँ AA, Aa, aa
- हर एक दो यादृच्छिक युग्मकों से बने $N$ व्यष्टि, जीनोटाइप के अनुसार गिने गए (बिंदु)
- '$r$ पर योग: माध्य $2pq$, $H_0(1-1/2N)^t$ से तुलना'
- उन आबादियों का अंश जहाँ एक नई प्रति ($p_0 = 1/2N$) स्थिर हुई, हर $s$ के लिए
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$, $s = 0$ पर $p_0 = 1/2N$ के बराबर
