source_hash: 5ff140d5db65
title: Поиск автомодельных профилей взрыва
summary: 'Так сегодня охотятся за сингулярностями: записать $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$, превратить УрЧП в уравнение для профиля $U$ с неизвестным показателем $\lambda$ и обучить пакет профилей-кандидатов, по одному на каждое пробное значение $\lambda$, как один тензор методом Гаусса–Ньютона. Для невязкого уравнения Бюргерса воронки невязки схлопываются только в точных значениях $\lambda = 1/(2i+2)$, и обученные профили совпадают с классическими $y = -U - U^{2i+3}$. Тот же поиск для нелокального уравнения Кордобы–Кордобы–Фонтелоса находит его устойчивый показатель $\lambda \approx 1.18$.'
notes: 'Дополнение к fluids/navier_stokes_blowup, где показана картина 1983 года: прогнать вихрь Тейлора–Грина вперёд и смотреть, как растёт завихренность, пока сетка не перестанет справляться. Современный путь пропускает эволюцию во времени: он предполагает, что сингулярность автомодельна, и ищет профиль напрямую. Подстановка $u = \tau^\lambda U(y)$ в $u_t + uu_x = 0$ даёт $-\lambda U + ((1+\lambda)y + U)U'' = 0$. Решённое как линейное ОДУ для $y(U)$, оно даёт $y = -U - C\,U^{1+1/\lambda}$, что гладко, только если $1 + 1/\lambda$ — нечётное целое. Значит, $\lambda = 1/(2i+2)$, с точными профилями $y = -U - U^{2i+3}$ (нормировка $U''(0) = -1$ и $U(-2) = 1$). Это классические результаты (Eggers & Fontelos, Singularities, 2015). $\lambda = 1/2$ — устойчивый, типичный взрыв; $1/4, 1/6, \dots$ требуют тонко подобранных данных. Здесь 61 профиль-кандидат обучается одновременно при фиксированном $\lambda$. Лучшая невязка как функция $\lambda$ (воронка) падает до уровня округления ($\sim10^{-15}$)
  при $\lambda = 1/2$ и до $\sim10^{-11}$ при $1/4$. Между ними она гораздо больше (в $\sim10^{7}$ раз больше при $\lambda = 0.37$), потому что там существуют только профили с негладким членом $|y|^{1+1/\lambda}$. Условие $U''''''(0) = 0$ убирает воронку при $1/2$, и поиск тогда находит $1/4$. Добавочное условие $U^{(5)}(0) = 0$ должно выделить $1/6$. Но при таком разрешении воронка около $1/6$ слишком плоская, чтобы её зафиксировать: конкурирующие профили различаются лишь в порядке $y^{7}$, и неглубокий минимум оказывается при $\lambda \approx 0.19$. Невязка не отличает устойчивое от неустойчивого: это свойство эволюции во времени, и неустойчивые профили здесь достигаются только через дополнительные условия. Профиль — спектральное разложение с индуктивными допущениями, которые использует наука: компактифицированная координата и формирование выхода; в исследовательских работах применяются физически информированные нейронные сети (PINN) с теми же допущениями. Гаусс–Ньютон — оптимизатор Wang
  et al. (2025). Градиентные шаги по $\lambda$ застревают на острие каждой воронки, поэтому пакетный поиск золотым сечением фиксирует $\lambda$. Уравнение CCF $\theta_t - (H\theta)\theta_x = 0$ (одномерная модель поверхностного квазигеострофического уравнения; $H$ — преобразование Гильберта) решается в форме завихренности, $\omega = \theta_x = \Omega(y)/\tau$. $\Omega$ раскладывается по $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$, чьи преобразования Гильберта точны. Расчёт по умолчанию находит $\lambda \approx 1.18$ (невязка $\sim10^{-4}$); более длинные расчёты с большим базисом выходят на $1.1808$ (невязка $2\times10^{-6}$). Это согласуется с показателем основного состояния $\approx 1.18$ у Eggers & Fontelos (Nonlinearity, 2020). Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) нашли первый неустойчивый профиль CCF с помощью PINN, $\lambda_1 \approx 0.6057$. Wang et al. (2025, arXiv 2509.14185) нашли второй, $\lambda_2 \approx 0.4713$, и достигли невязок около $10^{-13}$,
  почти двойной точности. Они также нашли новые неустойчивые семейства для уравнений пористой среды и Буссинеска, которые остаются численными кандидатами. У неустойчивых профилей крутые градиенты, которые этот минутный поиск на CPU не разрешает; он показывает только устойчивую воронку. Статус: профили Бюргерса — точные теоремы. Взрыв для CCF доказали Córdoba, Córdoba & Fontelos (Annals, 2005). Профили, найденные нейросетевым поиском, остаются численными кандидатами, пока компьютерное доказательство не превратит их в теоремы, как сделали Chen & Hou (2022) для сценария Хоу–Луо осесимметричного уравнения Эйлера с границей. Задача тысячелетия о трёхмерных несжимаемых уравнениях Навье–Стокса остаётся открытой, и ничто здесь её напрямую не касается. Попробуйте более грубую сетку по $\lambda$ или меньше шагов Гаусса–Ньютона и посмотрите, как расплываются воронки.'
meanings:
- 'пакет: по одному пробному показателю на профиль-кандидат, все обучаются одновременно'
- 'компактифицированная координата $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$: $r = 1$ при $y = 0$, $r \to 0$ при $|y| \to \infty$'
- нечётность, $U'(0) = -1$ и $U \sim y^{\lambda/(1+\lambda)}$ на бесконечности встроены; $P$ — ряд Чебышёва по $r$
- невязка уравнения профиля в точках коллокации, а также $U(2) = -1$ и условия гладкости
- $R$ квадратична по $c$, поэтому якобиан точен (сверен с autograd в тестах)
- шаг Левенберга–Марквардта (демпфированный Гаусс–Ньютон) для каждого члена пакета в одном пакетном решении
- коэффициенты Тейлора $U = -y + c_3y^3 + c_5y^5 + \dots$; их обнуление убирает воронки при $\lambda = 1/2$ и $1/4$
- 'точное преобразование Гильберта базиса CCF: $(1-iy)^{-s}$ аналитична в верхней полуплоскости'
- фиксирует дно каждой воронки; профиль переобучается при каждом пробном $\lambda$
labels:
  n_lambda: 'Размер пакета: пробные показатели $\lambda$'
  gn_steps: Шагов Гаусса–Ньютона на профиль
  ccf_lambda0: Начальный показатель CCF $\lambda_0$
