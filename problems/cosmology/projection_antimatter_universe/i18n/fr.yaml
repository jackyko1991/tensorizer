title: Où pourrait se trouver l'antimatière ? Critères pour un univers d'antimatière
summary: Une hypothèse spéculative, pas de la physique établie. L'étape 2 a montré qu'une seule ligne d'univers traversant chaque tranche de temps donne autant de matière que d'antimatière, alors que nous voyons environ $10^{80}$ baryons et aucune antimatière. L'échappatoire est une ligne d'univers équilibrée globalement, avec l'antimatière très loin ou dans un univers miroir. Cette étape énumère ce qu'un tel univers d'antimatière doit satisfaire et confronte chaque critère aux données. Il n'y a pas d'antinoyaux dans le rayonnement cosmique ni de rayons gamma d'annihilation provenant des amas. Les domaines doivent être au moins aussi grands que l'horizon, environ 16 Gpc. Une ligne d'univers aléatoire est fantastiquement improbable. Il reste l'univers symétrique CPT de Boyle, Finn et Turok, dont les prédictions (un neutrino le plus léger de masse nulle, $r = 0$) concordent jusqu'ici avec les données et pourraient échouer.
notes: 'Statut : spéculatif. Il s''agit de l''hypothèse personnelle de l''auteur (voir la description de la série), pas de la physique établie. Étape 7 de l''hypothèse de projection, une étape théorique pour le postulat P3 (toutes les particules sont des projections d''un seul objet). L''étape 1 (cosmology/projection_postulate) a énoncé les postulats. L''étape 2 (cosmology/projection_one_particle) a exclu la forme la plus simple de P3 : une ligne d''univers fermée traverse chaque tranche de temps aussi souvent vers l''avant (matière) que vers l''arrière (antimatière), une ligne ouverte ajoute au plus une particule nette, et l''univers contient environ $9\times10^{79}$ baryons et aucune antimatière. Les étapes 3 à 6 (projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests) ont testé P5, P4 et P1-P2. Cette étape emprunte l''échappatoire de l''étape 2. La ligne d''univers est équilibrée globalement, et l''antimatière se trouve au-delà de notre
  horizon ou dans un anti-univers. La question est de savoir ce qu''un tel univers d''antimatière doit satisfaire pour être en accord avec les postulats, et s''il le fait. D''abord la physique connue. Les conditions de Sakharov (1967) expliquent un excès de matière par la violation du nombre baryonique, la violation de C et de CP et l''écart à l''équilibre. Elles prédisent un univers fait de matière partout, avec $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (Planck 2018, $\Omega_b h^2 = 0.0224$). L''alternative, un univers symétrique avec des régions séparées de matière et d''antimatière, a été étudiée à partir des années 1960 (Alfvén et Klein, Omnès). Steigman (ARA&A 14, 339, 1976) a passé en revue les tests, et Cohen, De Rújula et Glashow (ApJ 495, 539, 1998) ont clos le dossier des domaines à l''intérieur de l''univers visible. Toutes les données proviennent de data/antimatter_criteria.csv, qui contient des nombres cités avec leurs sources. Le nombre de dimensions $D$ dans lesquelles vit
  la ligne d''univers est un paramètre. Seule sa coordonnée temporelle intervient, donc aucun résultat ne dépend de $D$. Critère 1 : pas d''antimatière mélangée à proximité. BESS-Polar n''a trouvé aucun antihélium parmi environ 48 millions de noyaux d''hélium. La limite à 95 % est antihélium/hélium $< 6.9\times10^{-8}$ pour un spectre semblable à celui de l''hélium et $1.0\times10^{-7}$ sans cette hypothèse (Abe et al., PRL 108, 131301, 2012). AMS-02 n''a publié aucune détection d''antinoyau. Rayons gamma : dans le gaz chaud d''un amas, une fraction d''antiprotons $f$ s''annihile au taux $f\,n_p^2\langle\sigma v\rangle$, avec $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s (un choix d''ordre de grandeur). Chaque annihilation donne 2.1 photons au-dessus de 100 MeV dans le spectre de désintégration des pions utilisé ici. Pour l''amas de Coma (modèle bêta, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$) et la limite de Fermi-LAT $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$
  cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016), cela donne $f < 9\times10^{-8}$. Satisfait : toute antimatière doit se trouver hors des amas et hors de portée du rayonnement cosmique, qui est confiné à quelques dizaines de Mpc. Critère 2 : pas de domaines à l''intérieur de notre horizon. Si des domaines de matière et d''antimatière de taille comobile $d$ se touchaient, l''annihilation à leurs parois serait inévitable après la recombinaison. Le modèle utilisé ici est la version simple de l''argument de Cohen, De Rújula et Glashow. L''aire de paroi par unité de volume est $3/d$ pour des cubes de côté $d$ ($n/d$ en $n$ dimensions, vérifié), et les baryons affluent vers les parois à $\kappa$ fois la vitesse du son du gaz. Le gaz suit la température du CMB jusqu''à $z\approx150$, puis se refroidit adiabatiquement. Chaque annihilation donne 3 photons issus de la désintégration de pions neutres. Les photons sont décalés vers le rouge jusqu''à aujourd''hui, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal
  N}\,S(E(1+z))/H$, et cette intégrale est vérifiée par rapport à une forme fermée. L''annihilation est comptée depuis la recombinaison ($z_{max} = 1000$) jusqu''à $z = 20$. Comme chez CDG, les époques plus tardives sont laissées de côté parce qu''elles dépendent de la formation des structures ; les inclure ne ferait qu''augmenter le flux. Le flux est exactement $\propto 1/d$ (vérifié). Il est comparé au fond de COMPTEL, $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ de 0.8 à 30 MeV (Kappadath et al. 1996), et au fond isotrope de Fermi-LAT ($7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ au-dessus de 100 MeV, indice 2.32, coupure à 279 GeV ; Ackermann et al., ApJ 799, 86, 2015). Les photons émis à $z\sim20$-$300$ arrivent entre 1 et 10 MeV, là où COMPTEL fixe la limite. Résultat : la prédiction dépasse les données d''un facteur 160 pour $d = 100$ Mpc, 16 pour 1 Gpc et 1.6 pour 10 Gpc. La taille minimale des domaines est $d_{min}\approx16$ Gpc (à
  8.5 MeV, $\kappa = 1$), supérieure au rayon de 14.3 Gpc de l''univers observable. CDG sont parvenus à la même conclusion : le domaine de matière doit couvrir presque tout l''univers visible. C''est un modèle jouet, et $d_{min}$ varie avec $\kappa$. CDG soutiennent que le chauffage par annihilation accélère l''afflux, ce qui renforce la borne. Contraint : toute antimatière doit se trouver au-delà de notre horizon, où aucun télescope ne peut la tester. Critère 3 : ajustement fin. Supposons que l''antimatière soit au-delà de l''horizon sur la même tranche et que rien ne l''arrange. Une ligne d''univers aléatoire équilibrée donne alors à notre région une charge nette de l''ordre de $\sqrt M$ pour $M$ traversées. La variance de la charge nette vaut $M$, ou $M(T-M)/(T-1)$ lorsque le total des $T$ traversées est équilibré (les deux sont vérifiés). La probabilité d''un grand excès suit la fonction de taux de Cramér, $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$, vérifiée par rapport à la queue binomiale
  exacte. Aujourd''hui nous voyons $N_B\approx9\times10^{79}$ baryons et aucune antimatière, donc chaque traversée doit avoir le même signe : $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$. Si on l''interprète plutôt comme l''excès de l''univers primordial, $9\times10^{79}$ parmi environ $1.5\times10^{89}$ paires (une par photon), on obtient $\log_{10}P\approx-1.2\times10^{70}$. Sans mécanisme, la ligne d''univers équilibrée échoue. Le mécanisme devrait être une condition aux limites qui corrèle les signes de toutes les traversées dans notre région : une symétrie, pas une fluctuation. Critère 4 : l''univers symétrique CPT. Boyle, Finn et Turok (PRL 121, 251301, 2018) proposent que l''univers après le Big Bang soit l''image miroir CPT d''un univers d''avant celui-ci, de sorte que la paire dans son ensemble ne viole pas CPT. Voici l''alignement de l''auteur entre P3 et ce modèle. Une ligne d''univers qui traverse $t = 0$ est de la matière de notre côté. Les observateurs dans le miroir
  ont la flèche du temps opposée, ils voient donc le même tronçon comme de l''antimatière. La réserve démontrée à l''étape 2 s''applique toujours : sur toute tranche complète, une ligne d''univers continue a $|Q|\leq1$, donc le miroir seul n''aide pas. L''alignement fonctionne si la ligne d''univers s''enroule à travers le Big Bang et à travers la frontière future, les deux extrémités du temps conforme étant recollées. C''est une hypothèse supplémentaire au-delà du modèle publié, et c''est l''extension C de l''étape 2 à un nouvel endroit. Une boucle qui s''enroule $w$ fois se lit $+w$ sur chaque tranche de notre côté et $-w$ sur chaque tranche miroir, lue avec la flèche propre au miroir. Le total est nul (vérifié). L''excès est désormais un entier topologique, pas une fluctuation, bien que $w\approx10^{80}$ soit toujours introduit à la main. Les prédictions publiées du modèle (d''après le résumé de Boyle, Finn et Turok), confrontées à des nombres cités : (a) Le neutrino le plus léger est
  de masse nulle. Avec les écarts de NuFIT 6.0 ($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, $\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ normal, $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ inversé), cela fixe $\Sigma m_\nu = 0.0588$ eV (hiérarchie normale) ou $0.0989$ eV (inversée), et $m_\beta = 0.009$ ou $0.049$ eV. KATRIN borne $m_\beta$ en dessous de 0.8 eV (Nature Physics 18, 160, 2022) et de 0.45 eV (Science 388, 180, 2025), bien au-dessus des deux valeurs. Planck 2018 donne $\Sigma m_\nu < 0.12$ eV, ce qui permet les deux. DESI 2024 ($< 0.072$ eV) et DESI DR2 ($< 0.064$ eV, $\Lambda$CDM) excluent le cas inversé et permettent le cas normal. DESI DR2 note aussi une tension avec le plancher des oscillations, et un neutrino le plus léger de masse nulle est le cas le moins en tension. (b) La matière noire est un neutrino droit stable de masse $4.8\times10^8$ GeV. C''est bien au-delà de tout collisionneur et ne donne aucun signal de détection directe, donc cela ne peut pas être testé
  actuellement. (c) Il n''y a pas d''ondes gravitationnelles primordiales, donc $r = 0$. BICEP/Keck donne $r < 0.036$ (95 %, PRL 127, 151301, 2021), ce qui est compatible. Le vrai test est $\sigma(r)\sim10^{-3}$ : l''objectif de CMB-S4 (le projet a été arrêté en juillet 2025), et désormais de LiteBIRD et du Simons Observatory. Tableau des verdicts. (1) Rien de mélangé à proximité : requis ; satisfait. Un seul noyau d''antihélium ou des rayons gamma d''annihilation provenant d''un amas le réfuteraient. (2) Pas de domaines à l''intérieur de l''horizon : requis ; contraint ($d\gtrsim16$ Gpc). Un excès dans le fond MeV ou une distorsion du CMB due à des parois plus proches le réfuteraient ; au-delà de l''horizon, c''est invérifiable. (3) Pas d''ajustement fin : requis ; échoue pour une ligne d''univers aléatoire ($\log_{10}P\sim-10^{70}$ à $-10^{79}$), et seul un mécanisme lève le problème. (4a) Neutrino le plus léger de masse nulle : contraint, compatible jusqu''ici. Une masse mesurée non nulle
  pour le plus léger le réfute, par exemple $\Sigma m_\nu$ nettement au-dessus de 0.0588 eV en hiérarchie normale. (4b) Matière noire sous forme de neutrino droit lourd : invérifiable actuellement. Une matière noire identifiée comme autre chose le réfuterait. (4c) $r = 0$ : compatible. Des modes B primordiaux avec $r\gg10^{-3}$ le réfuteraient. Conclusion : le P3 étendu ne survit que sous la forme d''une ligne d''univers équilibrée à travers un univers miroir CPT, s''enroulant à travers le Big Bang. Sous cette forme, il hérite de prédictions réfutables. Une masse non nulle du neutrino le plus léger, ou des modes B primordiaux avec $r\gg0$, réfuteraient l''alignement sur le miroir CPT. Les étapes précédentes soit reproduisaient la physique standard, soit rencontraient des données que l''hypothèse pouvait absorber. C''est la première étape de la série avec un test qui pourrait échouer.'
meanings:
- '$z$ répété ⇒ sommé : intensité gamma diffuse aujourd''hui pour chaque taille de domaine $d$ et chaque énergie de photon $E$'
- 'annihilations par cm$^3$ comobile et par seconde aux parois : aire de paroi par unité de volume $3/d$ multipliée par l''afflux $n_b v$'
- photons par MeV issus d'une annihilation à l'énergie émise ; $j$ (énergie du pion) répété ⇒ sommé
- plus petite taille de domaine permise par les fonds de COMPTEL et de Fermi-LAT (le flux est exactement $\propto 1/d$)
- plus grande fraction d'antiprotons dans le gaz de l'amas de Coma, d'après la limite de flux de Fermi-LAT
- charge nette de $M$ traversées de signes aléatoires ; sa variance vaut $M$
- probabilité qu'une ligne d'univers aléatoire donne à notre région une charge nette $Q$ sur $M$ traversées (fonction de taux de Cramér)
- charge nette sur nos tranches et sur leurs images CPT, chacune lue avec sa propre flèche du temps ; $s$ (segment) répété ⇒ sommé
- somme des masses des neutrinos à partir de la masse la plus légère $m_l$ et des écarts de NuFIT
labels:
  dims: Dimensions $D$ de l'espace où vit la ligne d'univers (libre)
  speed_factor: Vitesse d'afflux vers les parois $\kappa$, en unités de la vitesse du son du gaz
  z_max: Décalage vers le rouge $z_{max}$ auquel commence l'annihilation aux parois (recombinaison)
  winding: Nombre d'enroulements $w$ de la ligne d'univers à travers le Big Bang
