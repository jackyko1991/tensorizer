source_hash: 492f2e3f4bf6
title: PET：陽電子消滅と画像再構成
summary: FDG などのトレーサは陽電子を放出し、陽電子は電子と対消滅して、互いに反対向きに飛ぶ 2 個の 511 keV 光子になります。シミュレーションした崩壊のバッチを検出器リングまで追跡し、各同時計数をその同時計数線（LOR）でサイノグラムに振り分け、MLEM で画像を再構成します：$\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$。スキャナ全体が一つのシステム行列 $A$ で表され、各反復は 2 回の行列–ベクトル積です。
notes: 2 個の光子は反対方向に飛ぶので、崩壊は同時に反応した 2 つの検出器を結ぶ直線上のどこかにあります。これが同時計数線（LOR）です。何百万本も集めるとサイノグラムになります（体内の各点は $(\theta, s)$ に正弦曲線を描きます）。MLEM は計数を平均 $\bar y = A\lambda + r$ のポアソン分布とみなし、対数尤度 $\sum_b y_b \log \bar y_b - \bar y_b$ を登っていきます。各反復で現在の画像を順投影し、データと比較し、その比を逆投影します。画像は決して負にならず、総計数を保存し（背景がなければ $\sum_b (A\lambda)_b = \sum_b y_b$）、尤度は決して減少しません。初期の反復は滑らかで、後の反復ほど鮮明になりますがポアソン雑音を増幅するため、誤差はいったん下がってから再び上がります（既定値では最小は約 50 回付近。150 回の反復や崩壊数を減らして上昇を確かめてください）。臨床装置は早めに打ち切ります（または OSEM のサブセットと後処理フィルタを使います）。FBP は各投影をランプフィルタで処理して一度に逆投影します。高速ですが雑音が多く、負の値も出ます。体を通る光子は $e^{-\int \mu\, dl}$ だけ減弱し、511 keV の水では $\mu \approx 0.096$ cm$^{-1}$ です。この因子は LOR だけで決まり、崩壊がその線上のどこで起きたかには依存しないので、$A$ に組み込めます。簡略化：2 次元のみ、ガウス型の陽電子飛程（F-18 の平均飛程は約 0.6 mm、Ga-68 は約 3 mm なので、値を上げない限り 6 mm の画素に隠れます）、光子の角度揺らぎ（非共線性）なし、理想的な結晶（LOR の端点は反応した結晶内のランダムな位置に置く）で相互作用深さや不感時間なし、ランダム・散乱の背景は既知で滑らかとしています。すべての数値は近似であり教育用です。臨床には使用しないでください。
meanings:
- 放射能分布からサンプリングした崩壊位置（ホットな病変ほど頻繁に崩壊する）
- 消滅点：陽電子はまず約 1 mm 移動する
- 反対向きの 2 個の光子 $p = 1, 2$、それぞれ $511$ keV
- 各光子がリングに達する位置：$t > 0$ として $|a + t u| = R$ を解く
- サイノグラム：同時計数線 $(\theta, s)$ ごとの検出された同時計数
- 画素 $j$ での崩壊がビン $b$ で計数される確率（減弱を含む）
- 繰り返される $j$ ⇒ 和：順投影にランダム・散乱を加えたもの
- 繰り返される $b$ ⇒ 和：各 LOR に沿った逆投影
- 乗法的更新：正の値を保ち、総計数を保存する
labels:
  kilo_decays: シミュレーションする崩壊数（千）
  n_iter: MLEM 反復回数
  positron_range: 陽電子飛程 $\sigma_+$
  attenuation: 体内での減弱
  background: ランダム＋散乱の割合
  grid: 画像グリッド $n \times n$
  n_detectors: リング上の検出器結晶数
