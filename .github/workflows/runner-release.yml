# Publish the local runner (scripts/runner_bundle.py) as a GitHub release asset at a fixed URL, so the website's
# Backend > Local steps can download and unzip it instead of cloning the repository:
#   https://github.com/jackyko1991/tensorizer/releases/download/runner-latest/tensorizer-runner.zip
name: Release local runner

on:
  push:
    branches: [main]
    paths: ["backend/**", "problems/**", "pixi.toml", "pixi.lock", "scripts/runner_bundle.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/runner_bundle.py --out dist  # standard library only
      - name: Upload to the runner-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view runner-latest >/dev/null 2>&1 || gh release create runner-latest \
            --title "Local runner (latest)" \
            --notes "Download, unzip, then in the folder run: pixi run api (CPU) or pixi run -e cuda api (NVIDIA GPU). See Backend > Local on https://jackyko1991.github.io/tensorizer/"
          gh release upload runner-latest dist/tensorizer-runner.zip --clobber
          git tag -f runner-latest "$GITHUB_SHA" && git push -f origin refs/tags/runner-latest
