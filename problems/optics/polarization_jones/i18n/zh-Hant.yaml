source_hash: 3434371fc2c6
title: 以瓊斯矩陣描述偏振
summary: 光的偏振是一個複數二維向量 $(E_x, E_y)$，每個偏振片或波片都是一個複數 $2\times 2$ 矩陣。光先通過波片，再通過旋轉的偏振片：$\mathbf E$ 場橢圓與透射強度由 einsum 求得，重現馬呂斯定律，並把線偏振光轉為圓偏振光。
notes: 光一開始以輸入角度線偏振，強度 $I_0 = 1$。右側灰色虛線是馬呂斯定律 $I_0\cos^2\theta$（無波片）；藍色曲線則是通過波片後的結果。與輸入方向成 45° 的四分之一波片產生圓偏振光（$\lvert E_x\rvert$ 與 $\lvert E_y\rvert$ 相等，相位差 90°），因此任何偏振片角度都透過 $I_0/2$。位於 $\alpha$ 的半波片使線偏振光旋轉 $2\alpha$。單一瓊斯向量總是完全偏振；非偏振光以兩個正交輸入的強度平均來處理（用於 main.py 印出的三偏振片檢驗）。
meanings:
- 瓊斯向量：$E_x$ 與 $E_y$ 的複振幅（相位差決定形狀）
- 把實驗室座標轉到元件自身的軸上
- 只保留沿角度 $\theta$ 透射軸的場
- 使慢軸延遲 $\Gamma$：$\Gamma = \pi/2$ 為四分之一波片，$\Gamma = \pi$ 為半波片
- 串接元件（重複的 $j$ 求和）；光最先遇到的元件在右邊
- 讓光通過光學元件
- 重複的 $i$ ⇒ 求和：強度
- 一個週期內的實數場：描出偏振橢圓
labels:
  plate: 波片
  plate_angle: 波片快軸 $\alpha$
  input_angle: 輸入偏振角
