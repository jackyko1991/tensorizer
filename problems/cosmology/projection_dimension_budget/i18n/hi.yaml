source_hash: b577c14eb932
title: कितनी विमाएँ? प्रक्षेपण परिकल्पना का बजट
summary: 'यह एक अनुमानात्मक परिकल्पना है, स्थापित भौतिकी नहीं: प्रक्षेपण विचार को कितनी छिपी विमाओं की आवश्यकता है, और प्रयोग कितनी की अनुमति देते हैं? क्वांटम पक्ष, चरण 1 के अनुसार, हर परिणाम के लिए एक छिपी सम्मिश्र विमा और $N$ उलझे कणों के लिए $2^N$ माँगता है, पर ये हिल्बर्ट स्थान में रहती हैं और इनका स्थान में दिशाएँ होना आवश्यक नहीं। गुरुत्व पक्ष पर, त्रिज्या $R$ की $n$ संहत विमाएँ $R$ से छोटी दूरियों पर न्यूटन का नियम बदल देती हैं। मरोड़ तुला, LHC तथा सुपरनोवा और न्यूट्रॉन-तारा सीमाएँ $(n, R)$ मानचित्र को एक-एक सीमा करके भरती हैं। हर $n$ बचा रहता है, पर केवल तभी जब $R$ छोटा हो: $n = 1$ के लिए 38.6 μm से कम और $n = 2$ के लिए $2\times10^{-10}$ m से कम। सीमित, पर खारिज नहीं।'
notes: 'स्थिति: अनुमानात्मक; सीमित, पर खारिज नहीं। प्रक्षेपण परिकल्पना का चरण 3 (लेखक का अपना अनुमानात्मक विचार, शृंखला का विवरण देखें; स्थापित भौतिकी नहीं), अभिधारणा P5 के लिए: क्वांटम प्रभावों को कुछ $d_Q$ और गुरुत्व को कुछ $d_G$ विमाओं की आवश्यकता है, जिनका अनुमान लगाया जाता है, उन्हें कभी हाथ से तय नहीं किया जाता। चरण 1 (cosmology/projection_postulate) ने पाया कि प्रक्षेपण दौड़ को हर परिणाम के लिए ठीक एक छिपी सम्मिश्र विमा चाहिए; चरण 2 (cosmology/projection_one_particle) ने एक विश्व-रेखा को काटा; चरण 4 (cosmology/projection_singularity_fold) विलक्षणताओं को प्रक्षेपण की तहों के रूप में देखता है। कोई $n$ पहले से नहीं माना गया: मानचित्र $n = 0$ से $n_{max}$ तक और $R$ को प्लांक लंबाई से 1 m तक खंगालता है। पहले ज्ञात भौतिकी। (a) क्वांटम पक्ष: दौड़ $K$ परिणामों के लिए $d + K$ विमाओं के साथ बॉर्न नियम को दोहराती है, और $N$ उलझे द्वि-स्तरीय निकायों को विमा $2^N$ वाले हिल्बर्ट स्थान की आवश्यकता है; मानक क्वांटम यांत्रिकी यही स्थान प्रयोग करती है, और इसकी विमाएँ स्थान में दिशाएँ नहीं हैं। यदि
  उन्हें स्थानिक दिशाएँ माना जाए, तो $N$ क्यूबिट को $2^{N+1} - 3$ अतिरिक्त वास्तविक विमाएँ चाहिए होंगी (बेल युग्म के लिए 5), एक ऐसी संख्या जो हर बार कणों के उलझने पर बदल जाएगी, जो कोई भी स्थिर स्थानिक बहुविध नहीं करता। (b) गुरुत्व पक्ष: $3 + n$ स्थानिक विमाओं में गाउस नियम खिंचाव $G_D M/r^{n+2}$ देता है ($n = 0..6$ के लिए $S^{n+2}$ से autograd फ्लक्स द्वारा जाँचा गया)। यदि $n$ विमाएँ त्रिज्या $R$ के वृत्त हैं, तो प्रतिबिंबों का योग इसे $R$ से परे न्यूटन के $G_4 M/r^2$ में बदल देता है, जहाँ $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ ($n = 1, 2, 3$ के लिए जाँचा गया)। ठीक बाहर, कलुज़ा–क्लाइन ग्रैविटॉन का पहला स्तर $\alpha = 8n/3$ (2-टोरस के लिए $16/3$, जैसा PDG समीक्षा में है) और $\lambda = R$ के साथ एक युकावा पद देता है। अर्कानी-हामेद, डिमोपूलस और द्वाली (1998) का ADD संबंध, PDG और LHC प्रयोगों द्वारा प्रयुक्त परिपाटी $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$ में, PDG की संख्याएँ दोहराता है: $R = 30$ μm, $n = 2$ से $M_D = 4.0$ TeV मिलता है, और $M_D = 1$ TeV के लिए $n = 1..6$ हेतु $10^{12}$ m, 0.5 mm, ...,
  0.1 MeV$^{-1}$ चाहिए। सीमाएँ (data/gravity_bounds.csv, उद्धृत संख्याएँ; मरोड़ और LHC पंक्तियाँ वही हैं जो cosmology/hierarchy_extra_dimensions में शामिल हैं, फिर से उद्धृत)। Eöt-Wash मरोड़ तुला $|\alpha| = 1$ को 56 μm से ऊपर (Kapner et al., PRL 98, 021101, 2007) और 38.6 μm से ऊपर (Lee et al., PRL 124, 101101, 2020) खारिज करती हैं; चूँकि हर $n$ के लिए $\alpha\geq 1$ है, सभी $n\geq 1$ के लिए $R > 38.6$ μm खारिज है (रूढ़िवादी: मापा गया वक्र बड़े $\lambda$ पर गिरता रहता है)। $n = 2$ के लिए Tan et al. (PRL 116, 131101, 2016) $R < 30$ μm देते हैं। ATLAS मोनोजेट खोज (PRD 103, 112006, 2021, CC-BY 4.0) $n = 2..6$ के लिए $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV देती है। SN1987A का ठंडा होना $n = 2$ (3) के लिए $M_D > 27$ (2.4) TeV देता है (Hanhart et al., PLB 509, 1, 2001), और फँसे KK ग्रैविटॉन द्वारा न्यूट्रॉन तारों का गर्म होना $M_D > 1700$ (76) TeV देता है (Hannestad and Raffelt, PRD 67, 125008, 2003), दोनों PDG 2024 समीक्षा में उद्धृत रूप में। हर सीमा $(n, R)$ ग्रिड पर एक बूलियन मास्क बन जाती है,
  और परीक्षण बिंदुओं को हाथ से निकाले गए उत्तरों से जाँचा जाता है। परिणाम: $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, न्यूट्रॉन तारे), $2.6\times10^{-12}$ m ($n = 3$), और $n = 4..6$ के लिए LHC त्रिज्याएँ ($5\times10^{-13}$ से $2.5\times10^{-15}$ m)। $n\geq 7$ के लिए केवल मरोड़ सीमा शामिल है; LHC सीमाएँ $n$ के साथ धीरे-धीरे कमज़ोर होती हैं और, बहिर्वेशन करने पर (यहाँ नहीं किया गया), $R$ को $1/M_D\sim 10^{-20}$ m की ओर धकेलेंगी। $M_D = 1$ TeV वाला ADD, पदानुक्रम समस्या का मूल समाधान, $n = 1..6$ के लिए खारिज है। बजट: न्यूनतम $n = 0$, क्योंकि गुरुत्व को किसी अतिरिक्त स्थानिक विमा की आवश्यकता नहीं और क्वांटम छिपी विमाओं का स्थानिक होना आवश्यक नहीं; अधिकतम कोई नहीं, क्योंकि आँकड़े किसी भी $n$ की अनुमति देते हैं यदि $R < R_{max}(n)$। परिकल्पना कौन-सी व्याख्या अपनाती है: P1 और P2 के लिए हिल्बर्ट-स्थान व्याख्या (छिपी विमाएँ अवस्था-स्थान की विमाएँ हैं, इसलिए $D_Q\geq 2^N$ स्थान पर कोई प्रतिबंध नहीं है), और P4 और P5 के लिए ज्यामितीय व्याख्या (अंतःस्थापन विमाएँ; यदि गुरुत्व उनमें
  जा सकता है तो वे संहत और $R_{max}(n)$ से छोटी होनी चाहिए, अन्यथा वे अंतःस्थापन के निर्देशांक हैं, ऐसे स्थान नहीं जहाँ जाया जा सके)। निर्णय: सीमित, पर खारिज नहीं, और कोई नई भविष्यवाणी नहीं: परिकल्पना तभी परीक्षण योग्य बनेगी जब वह $n$ और $R$ को इन सीमाओं के निकट तय करे।'
meanings:
- 'दोहराया गया $i$ ⇒ योग: $S^{n+2}$ के यादृच्छिक बिंदुओं पर बाहर की ओर खिंचाव (autograd); फ्लक्स हर त्रिज्या पर समान है'
- 'द्रव्यमान और $n$ वृत्तों के चारों ओर उसके प्रतिबिंब, प्रतिबिंब सूचकांक $I$ पर योग: भीतर $1/r^{n+2}$, बाहर $G_4/r^2$'
- 'एक उद्धृत सीमा द्वारा अनुमत सबसे बड़ी त्रिज्या: मरोड़ तुला के लिए $\lambda_{max}$, कोलाइडर और खगोलभौतिकीय सीमाओं के लिए $M_D = M_b$ पर ADD त्रिज्या'
- हर सीमा परिवार के लिए एक बूलियन मानचित्र, पूरी ग्रिड पर प्रसारित
- 'विमा बजट: संहत विमाएँ केवल इस त्रिज्या से नीचे अनुमत हैं'
- त्रिज्या $R$ की $n$ विमाओं के लिए गुरुत्व का मौलिक पैमाना (जूडीचे–रात्ताज़ी–वेल्स परिपाटी, जैसी PDG प्रयोग करता है)
- $N$ उलझे क्यूबिट को आवश्यक हिल्बर्ट-स्थान विमा $2^N$ (चरण 1)
labels:
  n_max: मानचित्र पर अतिरिक्त विमाओं की सबसे बड़ी संख्या $n$ (0 से सभी $n$ खंगाले जाते हैं)
  R_points: मानचित्र पर त्रिज्याएँ, प्लांक लंबाई से 1 m तक लघुगणकीय अंतराल पर
  M_star: ADD रेखा के लिए मौलिक पैमाना $M_D$
  qubits: क्वांटम गिनती के लिए उलझे क्यूबिट $N$
