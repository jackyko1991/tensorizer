source_hash: f81a85fc73c6
title: 원자로 임계
summary: 핵분열성 물질 판은 임계 상태일까요? 단일군 중성자 확산은 이 질문을 격자 위의 일반화 고윳값 문제 $M\phi = \tfrac1k F\phi$로 바꿉니다. 거듭제곱 반복(다음 세대의 중성자를 반복해서 구하기)은 기본 선속 모드와 증배 계수 $k_{eff}$로 수렴하며, 여러 판 두께에 대한 배치 고윳값 풀이로 임계 크기를 찾습니다.
notes: '$k$는 한 세대의 중성자 수와 이전 세대의 중성자 수의 비입니다. 거듭제곱 반복의 각 단계가 한 세대입니다. 높은 공간 모드는 매 단계 $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$배씩 줄어들므로, 한쪽으로 치우친 초기 상태가 대칭적인 $\sin(\pi x/L)$ 모양으로 완화됩니다. 얇은 판은 중성자가 너무 많이 새어 나가고($k < 1$), 임계 두께 $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$를 넘으면 연쇄 반응이 커집니다. 기본 단일군 상수는 열중성자로를 예시한 값입니다($k_\infty \approx 1.06$). 단순화: 에너지군 하나, 반사체 없는 균질한 맨 판, 외삽 경계면 사이에서 잰 $L$, 지발 중성자와 되먹임 없음. 이것은 시간 의존 계산이 아니라 정적 고윳값 계산입니다.'
meanings:
- 내부 점들; (외삽) 판 경계면에서 $\phi = 0$
- 2계 차분 행렬 $(1, -2, 1)/h^2$
- 누설과 흡수로 잃는 중성자
- 핵분열로 생기는 중성자
- '반복된 $j$ ⇒ 합: 다음 세대의 핵분열 선원'
- 거듭제곱 반복 한 단계
- 직접 풀이, $S$개의 판 두께에 대해 배치
labels:
  width: 판 두께 $L$
  diffusion: 확산 계수 $D$
  sigma_a: 흡수 $\Sigma_a$
  nu_sigma_f: 생성 $\nu\Sigma_f$
  n_iter: 거듭제곱 반복 횟수
  n_grid: 격자점 수
