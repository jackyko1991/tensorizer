  - {symbol: 'x_{bt},\ y_{bt}', code: 'light_clocks(beta, D, t_max, n)', shape: '(B, T)', meaning: 'photon of clock $b$ at time $t$: horizontal speed $\beta_b$, vertical $\sqrt{1-\beta_b^2}$, so always $c$'}
  - {symbol: '\gamma(\beta_b)', code: '1 / torch.sqrt(1 - beta**2)', shape: '(B,)', meaning: 'one tick takes $\gamma\cdot 2D/c$; ticks counted from the zigzag'}
  - {symbol: '\Lambda^\mu{}_\nu(\beta_b)', code: 'boost(beta)', shape: '(B, 4, 4)', meaning: 'a batch of boosts along $x$, $\eta = \operatorname{diag}(-1, 1, 1, 1)$'}
