source_hash: 79a2f1fd310e
title: Le fond diffus cosmologique, un corps noir parfait (COBE FIRAS)
summary: L'instrument FIRAS de COBE a mesuré le fond diffus cosmologique à 43 fréquences et y a trouvé le corps noir le plus parfait jamais observé. Un lot de quatre modèles (loi de Planck seule, avec un potentiel chimique de Bose–Einstein $\mu$, avec une distorsion Compton $y$, avec les deux) est ajusté au vrai tableau FIRAS dans un seul tenseur, la jacobienne étant obtenue par autograd. L'ajustement donne $T \approx 2.725$ K avec $\chi^2 \approx 45$ pour 42 degrés de liberté, des résidus inférieurs à $10^{-4}$ du pic, des distorsions compatibles avec zéro ($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$) et, à partir de $T$, environ 411 photons par cm³.
notes: 'En 1990, FIRAS (le Far-Infrared Absolute Spectrophotometer embarqué sur COBE, de la NASA) a comparé le ciel à un corps noir de calibration externe et n''a trouvé aucune différence ; le spectre final (Fixsen et al. 1996) s''écarte d''une courbe de Planck de moins de 50 parties par million du pic. John Mather et George Smoot ont partagé le prix Nobel de physique 2006 « pour leur découverte de la forme de corps noir et de l''anisotropie du rayonnement du fond diffus cosmologique ». Un corps noir aussi parfait signifie que l''Univers primordial était chaud, dense et en équilibre thermique : une énergie libérée après le décalage vers le rouge $z \sim 2\times10^6$ aurait laissé un potentiel chimique $\mu$ (spectre de Bose–Einstein, $z \gtrsim 2\times10^5$) ou une distorsion Compton $y$ (des électrons chauds qui donnent de l''énergie aux photons, $z \lesssim 5\times10^4$ ; même forme que l''effet Sunyaev–Zel''dovich, avec son zéro à $x = 3.83$, soit 217 GHz, et elle conserve le nombre de
  photons). Notre ajustement, avec les seules erreurs diagonales, donne des limites à 95 % d''environ $|\mu| < 7\times10^{-5}$ et $|y| < 6\times10^{-6}$ ; les limites publiées de FIRAS, $|\mu| < 9\times10^{-5}$ et $|y| < 1.5\times10^{-5}$, sont plus larges car elles utilisent la covariance corrélée complète et incluent les incertitudes systématiques (calibration et émission galactique). La température doit être lue avec prudence : l''ajustement fixe $T$ à environ $10^{-5}$ K statistiquement, mais l''échelle absolue vient de la thermométrie du calibrateur, et le tableau LAMBDA écrit le spectre comme un corps noir à 2.725 K plus les résidus publiés, si bien que $T = 2.725$ K y est intégré ; la meilleure valeur absolue actuelle est $2.72548 \pm 0.00057$ K (Fixsen 2009). De $T$ découlent $n_\gamma \approx 411$ cm$^{-3}$ et $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$. Dans l''animation, le panneau de gauche montre l''ajustement qui converge depuis l''estimation initiale (barres d''erreur agrandies
  400 fois, comme sur le célèbre graphique, sans quoi elles seraient invisibles) ; le panneau de droite zoome ensuite sur les résidus en unités de $10^{-4}$ du pic, avec les formes que laisseraient un $\mu$ ou un $y$ à notre limite de 95 % après réajustement de $T$. Données : Table 4 de D. J. Fixsen et al., ApJ 473, 576 (1996), issue de l''archive LAMBDA de la NASA (https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt), domaine public, fournie sous le nom data/firas_monopole.csv.'
meanings:
- les 43 nombres d'onde FIRAS (cm$^{-1}$), intensités et erreurs à $1\sigma$ (MJy/sr)
- une ligne $(T, \mu, y)$ par modèle $b$ du lot
- $h\nu/kT$ par diffusion (broadcasting) de $(B,1)$ contre $(F,)$
- occupation de Bose–Einstein plus le terme $y$ de Kompaneets, multipliée par $2hc\tilde\nu^3$
- 'autograd de $\sum_b I_{bf}$ : les lignes sont indépendantes, donc un seul appel donne la jacobienne de chaque modèle'
- '$f$ répété ⇒ sommé : la matrice de Fisher ; son inverse est la covariance'
- un pas de Levenberg–Marquardt pour tous les modèles à la fois
- qualité de l'ajustement par modèle
labels:
  T_init: Estimation initiale de $T$
  steps: Pas de Levenberg–Marquardt
