title: 分开训练，用 DAG 张量拼接：一个 CNN 与一个微型 LM
summary: 一个小型 CNN 学习 MNIST 数字，一个微型字符级 GPT 学习“three+two=five.”这类句子，两者各自独立训练。随后用一条 DAG 边将它们连接：连接器把 CNN 的特征转换成软 token，替换句子的第一个单词，于是 LM 对“[一张 3 的图像]+two=”回答“five”。整个训练流程本身也是一个张量 DAG（规则分层、max-plus 关键路径、每条规则对所有种子只做一次批量调用），并与同一网络在相同计算量（乘加次数）下、仅在联合任务上端到端训练的结果进行比较。拼接边还被写成一个固定路由器的混合专家（MoE）层，并检验学习式路由器能否胜任。
notes: 构想。网络可以先分开训练，再通过 DAG 张量连接，然后进行全局优化，而整个流程本身也可以由 DAG 张量控制。这一构想来自 Jacky Ka Long Ko；本问题在一个小型 CNN 和一个微型字符级 LM 上检验它，刻意不采用从零开始联合训练的视觉语言模型，并恰恰与这种非 DAG 的替代方案进行比较。哪些是新的，哪些不是。用分别预训练的图像编码器、预训练的 LM 和一个小型可学习连接器构建多模态模型，正是 LLaVA（Liu et al. 2023，通过线性或 MLP 投影映射到 LM 的 token 空间）和 BLIP-2（Li et al. 2023，在冻结的图像编码器与冻结的 LLM 之间加入 Q-Former）的做法；Frozen（Tsimpoukelli et al. 2021）与本问题一样，把图像作为软前缀输入冻结的 LM；而模型拼接（Lenc and Vedaldi, CVPR 2015, arXiv 2014；Bansal et al. 2021）则用一个小型可训练层连接两个已训练的网络。本问题新增的是编排：模型图和训练流程都由 Circle of Willis 工作流问题的张量 DAG 引擎运行（规则图、Kronecker 作业图、布尔分层、max-plus 关键路径），并把用 DAG 构建的模型与单体模型进行比较。任务与模型。一个 CNN（两个 5×5 卷积，8474 个权重）从 3000 张 MNIST 图像学习十个数字。一个两层 GPT（d = 32，四个注意力头，27 543 个权重，采用来自 chain_of_thought、带模型轴的 einsum 注意力）学习 300 个“a op b = r.”形式的句子，其中 op 为模 10 的 +、−、×，数字用英文单词书写（“three+two=five.”，第一个单词右对齐于 5 个字母的槽位中）。联合任务给出一张数字 a 的 MNIST 测试图像和文本“+two=”；操作数单词不在文本中。DAG 边是一个连接器（3808 个权重）：由 CNN 的十个数字概率 $q$ 和一个槽位向量 $S_t$，生成 $K = 5$ 个软 token $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$，在 LM 输入端替换操作数槽位。（试验中改为输入 CNN
  倒数第二层的特征时学习慢得多：连接器训练 100 步后联合准确率约 0.25，而前者约 0.6。）准确率是指在给定真实前缀时，答案的每个字母和句号都是 LM 首选的测试样本比例，这正是贪心解码会写出的结果。用 DAG 表示训练流程。data/training.smk 列出各条规则；引擎用 Circle of Willis 的解析器解析它并逐层运行，每条规则用“一次”批量调用处理其所有模型，这些模型堆叠在一个模型轴上（种子 × 联合数据集大小 $n$）：第 0 层 train_cnn ∥ train_lm ∥ train_monolith；第 1 层 train_connector（CNN 和 LM 冻结，通过 $I \otimes \mathbb 1$ 块从种子广播到 (种子, $n$)）；第 2 层 global_finetune（全部参数，穿过该边端到端训练，学习率小 100 倍）∥ 两个学习式路由器；第 3 层 evaluate。在 2 个种子和 4 种大小下：8 条规则、45 个作业、84 条作业边，$A$ 为幂零矩阵。测试检查分层是否正确、环是否被拒绝、两个种子在同一堆叠中训练得到的损失是否与各自单独训练时相同（Adam 是逐元素运算，梯度裁剪按模型进行），以及一个模型的损失传给其他模型的梯度是否为零。基线。单体模型是同样的 CNN + 连接器 + LM（39 825 个权重），随机初始化，仅在联合样本上端到端训练。它的预算按每个模型的乘加次数匹配：DAG 流程的 150 步 CNN、600 步 LM、150 步连接器和 80 步微调（批大小 32）的开销相当于 682 步联合训练，单体模型即获得这么多步（每个模型都完整计入每项预训练，尽管在 DAG 中一个预训练好的 CNN 和 LM 服务全部四个 $n$ 值）。结果（2 个种子，1000 张测试图像，随机猜测为 0.1，CPU）。多线程浮点归约使重复运行的结果相差几个百分点，因此以下数字是四次完整运行中种子均值的范围；results/stages.csv 保存随附运行的确切数字。单独使用时，CNN 能正确读出 0.89 的测试数字，LM 能补全 0.97 至 0.99 的文本提示；把 CNN 的数字写成文本交给 LM，得分 0.88 至 0.89，这是本流程的上限。在 $n$ = 100、300、1000、3000
  个联合样本下的联合准确率：未训练的连接器约 0.16；连接器阶段后 0.41–0.47、0.58–0.63、0.60–0.69、0.64–0.68；全局微调后 0.41–0.47、0.63–0.67、0.68–0.75、0.71–0.75；单体模型 0.14、0.13–0.15、0.16–0.17、0.23。用 DAG 构建的模型在每次运行、每个 $n$ 上都胜出，联合数据稀缺时差距最大，而从 $n$ = 300 起微调再提升 0.03 至 0.08（在 $n$ = 100 时平均而言没有变化）。原因很简单：DAG 复用了单模态数据（3000 个带标签的数字和所有句子），而单体模型必须仅从 $n$ 个答案单词中自行发现数字和算术，并且 × 常常会隐藏操作数（任何数 × 0 = 0）。若有更多步数或数据，单体模型会有所提升（在预算结束时它的损失仍在下降）：这是小预算下的比较，而不是定律。DAG 边 = MoE 分发。同一个输入层可以写成混合专家：专家 img（CNN + 连接器）和专家 txt（LM 的 token 嵌入），一个作用于位置 × 专家的路由器 $G$，每个专家对分发给它的位置批量运行，再用 $X^0 = G_{mntx}Y^x_{mntc}$ 合并。当 $G$ 按数据类型为 one-hot（图像槽位或字母，在看到任何数据之前就已知，正如工作流按通配符选择规则）时，MoE 输出与 DAG 连线的输出在 1e-6 以内一致，所有梯度也是如此（已测试）。精确的关系是：DAG 边是一个由数据类型决定、路由器固定的 MoE 分发；MoE 则是一个其边由学习式路由器逐 token 选择的 DAG。路由器能学会这种路由吗？在专家冻结的情况下，用 Switch 负载均衡损失（$\alpha$ = 0.01）训练一个作用于每个位置特征（7×7 池化图像和 one-hot id）的线性路由器。Switch top-1（只运行被选中的专家，并乘以 $p$）并不可靠：在各模型和各次运行中，它的路由准确率介于 0 至 0.92，任务准确率介于 0 至约 0.46，原因是未被选中的专家得不到梯度，因此早期的错误选择永远不会被纠正，而均衡损失又把分配拉向 50/50，但真实比例是 5/17。若以稠密混合（$G = p$，两个专家在所有位置都运行）训练，再以 top-1 使用，路由器在每个模型和每次运行中都能恢复模态路由（0.97
  至 0.99 的位置），并达到约 0.35 至 0.65 的任务准确率，略低于固定路由器，因为 $p < 1$ 会缩放输出。当正确的边可以由数据类型得知时，把它固定下来既精确又更省。时间。在 6 核台式机 CPU 上，机器空闲时默认运行的训练约需 66 s（与其他繁重作业共享时可达 2 至 4 分钟），另需约 15 s 生成 GIF：在空闲的那次运行中，单体模型耗时 35 s，LM 12 s，连接器 4.5 s，微调 4 s。每条规则一个工作进程时，max-plus 关键路径是单体模型再接 evaluate（39 s）；DAG 系统自身的链 LM → 连接器 → 微调 → evaluate 约需 24 s。当 torch 检测到 GPU 时，代码会使用 GPU；本项目环境中的 torch 是 CPU 版本，因此所有随附数据都来自 CPU。数据。MNIST（Y. LeCun, C. Cortes, C. J. C. Burges），许可证 CC BY-SA 3.0：随附一个均衡子集，包含 3000 张训练图像和 1000 张测试图像（data/mnist_subset.npz，0.7 MB；data/SOURCES.md 给出来源、校验和与处理方式）。句子由代码生成。试一试。减少 LM 步数（LM 的准确率是一切的上限）、增大 $\alpha$（Switch 路由器坍塌得更严重）、不做微调（0 步），或只用一个种子，看看各种子之间的差异有多大。
meanings:
- 规则 $s$ 读取规则 $r$ 写出的内容；训练流程由 data/training.smk 用 Circle of Willis 问题的解析器解析得到
- 在通配符 seed 和 $n$ 上的作业图：不含 $n$ 的规则广播到每个 $n$（$I \otimes \mathbb 1$），evaluate 收集全部（$\mathbb 1^\top$）
- 每条规则的层级：train_cnn、train_lm 和单体模型在第 0 层，连接器在第 1 层，微调和路由器在第 2 层，evaluate 在第 3 层
- 由实测规则耗时得到的 max-plus 完成时间；$\max t$ 即关键路径
- CNN 对每张图像给出的十个数字概率；模型轴 $m$ 成为每层一次分组卷积中的各组
- DAG 边：数字概率加上槽位向量 $S_t$ → 位置 $t$ 处的 LM 输入向量；$K = 5$ 个软 token 替换被隐藏的第一个单词
- 路由器：按数据类型（图像槽位或字母）的 one-hot，或作用于位置特征、学习得到的 Switch top-1 softmax
- 重复的 $x$ ⇒ 求和：MoE 层的合并；每个专家 $Y^x$ 只在分发给它的组上计算
- 微型 GPT 的下一字母 logits（带模型轴的 einsum 注意力，来自 chain_of_thought）
- 每个模型在前缀之后文本上的损失（nats）；把 $M$ 个损失相加，每个模型都得到自己的梯度
labels:
  seeds: 种子（独立重复）
  steps_cnn: CNN 预训练步数
  steps_lm: LM 预训练步数
  steps_con: 连接器步数（CNN 和 LM 冻结）
  steps_ft: 全局微调步数
  steps_router: 学习式路由器步数（每个路由器）
  lr_ft: 微调学习率
  alpha: 负载均衡权重 $\alpha$
