<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Plane wave hits a flat metasurface of nano-pillars of different sizes, which imprint a phase phi of x and focus the light to a spot at distance f">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- incoming plane wave -->
    <g stroke="#dc2626" stroke-width="2">
      <line x1="12" y1="45" x2="44" y2="45" marker-end="url(#arrow)"/>
      <line x1="12" y1="80" x2="44" y2="80" marker-end="url(#arrow)"/>
      <line x1="12" y1="115" x2="44" y2="115" marker-end="url(#arrow)"/>
    </g>
    <!-- substrate and meta-atoms (pillars of different widths) -->
    <line x1="56" y1="20" x2="56" y2="140" stroke="#374151" stroke-width="2"/>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <rect x="57" y="24" width="10" height="5"/>
      <rect x="57" y="36" width="10" height="3"/>
      <rect x="57" y="46" width="10" height="7"/>
      <rect x="57" y="58" width="10" height="5"/>
      <rect x="57" y="68" width="10" height="7"/>
      <rect x="57" y="77" width="10" height="8"/>
      <rect x="57" y="87" width="10" height="7"/>
      <rect x="57" y="99" width="10" height="5"/>
      <rect x="57" y="109" width="10" height="7"/>
      <rect x="57" y="123" width="10" height="3"/>
      <rect x="57" y="133" width="10" height="5"/>
    </g>
    <!-- converging rays to the focus -->
    <g stroke="#93c5fd" stroke-width="1.5">
      <line x1="68" y1="26" x2="190" y2="80"/>
      <line x1="68" y1="53" x2="190" y2="80"/>
      <line x1="68" y1="107" x2="190" y2="80"/>
      <line x1="68" y1="135" x2="190" y2="80"/>
    </g>
    <line x1="68" y1="80" x2="226" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="190" cy="80" r="5" fill="#f59e0b"/>
    <!-- focal length -->
    <line x1="62" y1="150" x2="190" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="122" y="146" font-style="italic">f</text>
    <text x="70" y="16" font-style="italic" fill="#1e40af">φ(x)</text>
  </g>
</svg>
