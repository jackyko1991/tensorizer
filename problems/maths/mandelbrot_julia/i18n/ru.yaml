source_hash: 88e5f57d0eb4
title: Множество Мандельброта и множества Жюлиа
summary: Итерируйте $z \mapsto z^2 + c$ сразу на целой сетке комплексных пикселей. Точки, орбита которых остаётся ограниченной, образуют множество Мандельброта $M$ (меняется $c$, старт с $z_0 = 0$) или заполненное множество Жюлиа $K_c$ (фиксированное $c$, старт с пикселя). Гладкий счётчик ухода и оценка расстояния через производную делают картинку резкой на всём пути увеличения в долину морских коньков, а множество Жюлиа меняет форму, пока $c$ обходит главную кардиоиду.
notes: 'Почему уход при $|z| > 2$: если $|z| > \max(2, |c|)$, то $|z^2 + c| \ge |z|^2 - |c| > |z|$, и орбита неограниченно растёт. Поэтому каждое $c$ с $|c| > 2$ уходит на первом же шаге, и $M$ лежит внутри круга $|c| \le 2$. Здесь используется больший порог $R = 1000$, потому что он делает гладкий счётчик $\nu = n + 1 - \log_2 \ln|z_n|$ точным: вблизи бесконечности $z \mapsto z^2$ удваивает $\ln|z|$ на каждом шаге, а $\log_2$ ровно это отменяет. Главная кардиоида — множество тех $c$, для которых $z^* = z^{*2} + c$ — притягивающая неподвижная точка, $|2z^*| < 1$; запись $2z^* = w$ даёт $c = w/2 - w^2/4$ с $|w| \le 1$, а луковица периода 2 — там, где притягивает 2-цикл, $|4(1+c)| < 1$. Эти две части покрывают около 1.37 из полной площади $\approx 1.5066$ множества $M$, и ни один пиксель внутри них никогда не уходит. Оценка расстояния $d = |z_n|\ln|z_n|/|z''_n|$ получается из потенциала $G(c) = \lim 2^{-n}\ln|z_n|$ как $G/|\nabla G|$; вблизи множества истинное расстояние отличается от неё
  не более чем примерно в 2 раза (следствие теоремы Кёбе об одной четверти). Панель Жюлиа держит $c$ на краю кардиоиды, где неподвижная точка нейтральна: там $K_c$ всегда связно, потому что $c \in M$, но его форма полностью меняется от одного угла к другому. Каждое множество Жюлиа похоже на $M$ вблизи соответствующего $c$, поэтому при увеличении $M$ видны маленькие множества Жюлиа. Увеличения глубже примерно $10^{-13}$ требуют больше 16 знаков complex128.'
meanings:
- одно комплексное число на пиксель $p$; индекс не суммируется, каждый пиксель считается сам по себе
- один шаг квадратичного отображения для всех ещё итерируемых пикселей
- 'цепное правило: $c'' = 1$ для $M$ (производная по $c$), $c'' = 0$ и $z''_0 = 1$ для множеств Жюлиа (производная по $z_0$)'
- первый шаг с $|z_p| > R$; ушедшие пиксели удаляются из тензоров, так что работа сокращается
- 'гладкий (непрерывный) счётчик ухода: без цветовых ступенек между полосами'
- 'оценка расстояния: пиксели с $d_p$ меньше четверти пикселя рисуются тёмными, что выявляет тонкие нити'
- точная проверка для главной кардиоиды (и $|c+1| \le \frac14$ для луковицы периода 2), где $q = (x-\frac14)^2 + y^2$
