source_hash: 16ad9ff3967d
title: 무작위 걷기와 확산
summary: 수천 개의 브라운 입자가 각자 무작위로 차입니다. (시간, 보행자, 2) 텐서 하나로 저장하면 걷기는 cumsum 한 번이고, 평균 제곱 변위 $\langle x_i x_i\rangle$(einsum 하나)는 시간에 따라 $2dDt$로 선형 증가하며, 보행자 무리는 가우스 분포로 퍼져 나갑니다.
notes: 각 단계는 성분마다 분산 $2D\Delta t$인 가우스 충격이므로, 시간 $t$ 후 모든 좌표의 분산은 $2Dt$이고 출발점으로부터 거리 제곱의 평균은 $d$차원에서 $2dDt$입니다(여기서 $d = 2$). 보행자 지표 $n$에 대해 합하면 무작위 무리가 매끄럽고 예측 가능한 법칙이 됩니다. 이것이 확산입니다. 보행자 수가 유한하므로 측정된 MSD는 상대적으로 약 $\sqrt{2/N}$만큼 흔들리며, 그림이 재현되도록 시드를 고정했습니다. 단위는 임의입니다(예를 들어 µm와 s).
meanings:
- 단계 $s$, 보행자 $n$, 성분 $i$에 대한 독립적인 표준 정규 충격
- '시각 $t$에서 보행자 $n$의 위치: 충격들의 누적 합'
- '반복된 $n$과 $i$ ⇒ 합: 각 시각의 평균 제곱 변위'
- 원점을 지나는 MSD 대 $t$의 최소제곱 기울기를 $2d$로 나눈 값
- 점 선원에서 시작한 확산 방정식 $\partial_t\rho = D\,\partial_i\partial_i\rho$의 해
labels:
  n_walkers: 보행자 수
  D: 확산 상수 $D$
  t_max: 시뮬레이션 시간
  n_steps: 시간 단계 수
