source_hash: 5ff140d5db65
title: 自己相似ブローアップ解の探索
summary: 現代の特異点探索の方法：$u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$ と書いて偏微分方程式を、未知の指数 $\lambda$ をもつプロファイル $U$ の方程式に変え、試行値 $\lambda$ ごとに一つずつ用意した候補プロファイルの一団を、一つのテンソルとしてガウス–ニュートン法で学習させる。非粘性バーガース方程式では、残差の漏斗は厳密な値 $\lambda = 1/(2i+2)$ でだけ崩れ落ち、学習したプロファイルは古典的な $y = -U - U^{2i+3}$ と一致する。同じ探索を非局所的なコルドバ–コルドバ–フォンテロス方程式に適用すると、安定な指数 $\lambda \approx 1.18$ が見つかる。
notes: fluids/navier_stokes_blowup の姉妹編。あちらは1983年の描像で、テイラー–グリーン渦を時間発展させ、格子が追いつかなくなるまで渦度が増えるのを見る。現代の方法は時間発展を飛ばし、特異点が自己相似であると仮定してプロファイルを直接探す。$u = \tau^\lambda U(y)$ を $u_t + uu_x = 0$ に代入すると $-\lambda U + ((1+\lambda)y + U)U' = 0$ を得る。$y(U)$ についての線形常微分方程式として解くと $y = -U - C\,U^{1+1/\lambda}$ となり、これは $1 + 1/\lambda$ が奇数の整数のときだけ滑らかである。したがって $\lambda = 1/(2i+2)$ で、厳密なプロファイルは $y = -U - U^{2i+3}$（正規化 $U'(0) = -1$ と $U(-2) = 1$）。これらは古典的な結果である（Eggers & Fontelos, Singularities, 2015）。$\lambda = 1/2$ が安定で一般的なブローアップであり、$1/4, 1/6, \dots$ は微調整された初期データを必要とする。ここでは61個の候補プロファイルを、$\lambda$ を固定して同時に学習させる。$\lambda$ に対する最良残差（漏斗）は $\lambda = 1/2$ で丸め誤差（$\sim10^{-15}$）まで、$1/4$ で $\sim10^{-11}$ まで落ちる。その間でははるかに大きく（$\lambda = 0.37$ では $\sim10^{7}$ 倍）、そこには滑らかでない項 $|y|^{1+1/\lambda}$ をもつプロファイルしか存在しないからである。$U'''(0) = 0$ を課すと $1/2$ の漏斗が消え、探索は $1/4$ を見つける。さらに $U^{(5)}(0) = 0$ を課せば $1/6$ が選ばれるはずだが、この解像度では $1/6$ 付近の漏斗は平らすぎて決めきれない。競合するプロファイルの違いは $y^{7}$ の次数にしか現れず、浅い最小値は $\lambda \approx 0.19$ に落ちる。残差では安定と不安定を区別できない。それは時間発展の性質であり、ここで不安定なプロファイルに届くのは追加の拘束によってだけである。プロファイルは、研究で使われる帰納バイアス（コンパクト化した座標と出力の整形）を備えたスペクトル展開であり、研究論文では同じバイアスをもつ物理情報ニューラルネットワーク（PINN）が使われる。ガウス–ニュートン法は
  Wang et al. (2025) の最適化手法である。$\lambda$ についての勾配ステップは各漏斗の尖った底で止まってしまうため、一括の黄金分割探索で $\lambda$ を決める。CCF方程式 $\theta_t - (H\theta)\theta_x = 0$（表面準地衡方程式の1次元モデル。$H$ はヒルベルト変換）は渦度形式 $\omega = \theta_x = \Omega(y)/\tau$ で解く。$\Omega$ は $\operatorname{Im}(1-iy)^{-s}$、$s = j/(1+\lambda) + m$ で展開し、そのヒルベルト変換は厳密である。既定の実行では $\lambda \approx 1.18$（残差 $\sim10^{-4}$）が得られ、より大きな基底で長く実行すると $1.1808$（残差 $2\times10^{-6}$）に落ち着く。これは Eggers & Fontelos (Nonlinearity, 2020) の基底状態の指数 $\approx 1.18$ と一致する。Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) はPINNで最初の不安定なCCFプロファイル $\lambda_1 \approx 0.6057$ を見つけた。Wang et al. (2025, arXiv 2509.14185) は2番目の $\lambda_2 \approx 0.4713$ を見つけ、倍精度に近い $10^{-13}$ 程度の残差に到達した。彼らは多孔質媒体方程式とブシネスク方程式についても新しい不安定な族を見つけたが、それらは数値的な候補である。不安定なプロファイルには急な勾配があり、この1分間のCPU探索では解像できない。ここで見えるのは安定な漏斗だけである。現状：バーガースのプロファイルは厳密な定理である。CCFのブローアップは Córdoba, Córdoba & Fontelos (Annals, 2005) が証明した。ニューラル探索で見つかったプロファイルは、計算機援用証明で定理になるまでは数値的な候補である。Chen & Hou (2022) は境界のある軸対称オイラー方程式のホウ–ルオ・シナリオについてそれを行った。3次元非圧縮ナビエ–ストークス方程式のミレニアム問題は未解決のままであり、ここでの内容はそれに直接関わらない。$\lambda$
  の格子を粗くしたりガウス–ニュートンのステップを減らしたりして、漏斗がぼやけるのを見てみよう。
meanings:
- 一団：候補プロファイルごとに試行指数を一つ、すべて同時に学習
- コンパクト化した座標 $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$：$y = 0$ で $r = 1$、$|y| \to \infty$ で $r \to 0$
- 奇関数性、$U'(0) = -1$、遠方での $U \sim y^{\lambda/(1+\lambda)}$ を組み込み済み。$P$ は $r$ のチェビシェフ級数
- 選点でのプロファイル方程式の残差に、$U(2) = -1$ と滑らかさの拘束を加えたもの
- $R$ は $c$ の2次式なので、ヤコビアンは厳密（テストで autograd と照合）
- 一団の各メンバーについて、レーベンバーグ–マーカート（減衰ガウス–ニュートン）ステップを一括で解く
- $U = -y + c_3y^3 + c_5y^5 + \dots$ のテイラー係数。これを0にすると $\lambda = 1/2$ と $1/4$ の漏斗が消える
- CCF基底の厳密なヒルベルト変換：$(1-iy)^{-s}$ は上半平面で解析的
- 各漏斗の底を決める。試行値 $\lambda$ ごとにプロファイルを学習し直す
labels:
  n_lambda: 一団の大きさ：試行指数 $\lambda$
  gn_steps: プロファイルあたりのガウス–ニュートン・ステップ数
  ccf_lambda0: CCFの初期指数 $\lambda_0$
