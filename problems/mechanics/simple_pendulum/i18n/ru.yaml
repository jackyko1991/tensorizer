source_hash: a761e752552d
title: Маятник при больших углах
summary: Полное нелинейное уравнение маятника сразу для нескольких начальных амплитуд. Все маятники хранятся в одном пакетном тензоре, и каждый сравнивается со школьным косинусом для малых углов.
notes: 'При малых колебаниях $\sin\theta \approx \theta$, и все маятники имеют одинаковый период $2\pi\sqrt{L/g}$. Большие колебания длятся дольше: точный период равен $4\sqrt{L/g}\,K(\sin(\theta_0/2))$ с полным эллиптическим интегралом $K$, при 90° он примерно на 18 % больше. Посмотрите, как маятник с большой амплитудой отстаёт от своего штрихового партнёра для малых углов.'
meanings:
- угол маятника $b$ от вертикали
- угловая скорость маятника $b$
- 'правая часть: $-(g/L)\sin\theta$ сразу для всех маятников'
- 'решение для малых углов: внешнее произведение, суммирования нет'
- энергия на единицу массы $\tfrac12L^2\omega^2 + gL(1 - \cos\theta)$, сохраняется
labels:
  length: Длина стержня $L$
  g: Ускорение свободного падения $g$
  n_pendulums: Маятники
  max_amplitude: Наибольшая амплитуда
  t_max: Время моделирования
