source_hash: 9f4f33f51aa8
title: Нейтринные осцилляции
summary: Нейтрино рождаются с определённым ароматом ($\nu_e, \nu_\mu, \nu_\tau$), но распространяются как три массовых состояния с немного разными фазами. Матрица смешивания PMNS и один комплексный einsum по массовому индексу дают вероятность любой смены аромата для целой сетки базовых расстояний, показывая, как пучок $\nu_\mu$ в полёте превращается в $\nu_\tau$ и $\nu_e$.
notes: 'Поскольку $U$ унитарна, $\sum_\beta P(\alpha\to\beta) = 1$ на любом расстоянии: нейтрино меняют аромат, но не исчезают. Для двух ароматов формула сводится к $P = \sin^2 2\theta\,\sin^2(1.267\,\Delta m^2 L/E)$. Здесь большая $\Delta m^2_{31}$ даёт быструю «атмосферную» осцилляцию (первый провал $\nu_\mu$ около $L/E \approx 500$ км/ГэВ, в основном в $\nu_\tau$, так как $\theta_{23} \approx 45°$), а малая $\Delta m^2_{21}$ — медленную «солнечную» (около $15\,000$ км/ГэВ). Точки внизу — пробные нейтрино: каждая показывает аромат, который зарегистрировал бы детектор на её расстоянии, разыгранный по вычисленным вероятностям (фиксированное зерно). Упрощения: только осцилляции в вакууме — эффект МСВ в веществе Земли или Солнца не учитывается — и нормальная иерархия масс. Параметры по умолчанию близки к современным глобальным подгонкам. Сравните $\delta_{CP}$ = 0 и 270° для пучка $\nu_\mu \to \nu_e$.'
meanings:
- аромат $\alpha$ × массовое состояние $i$; произведение трёх поворотов через einsum('ab,bc,ci->ai')
- важны только разности $\Delta m^2_{21}, \Delta m^2_{31}$; $m_1^2 = 0$
- расстояния в км с логарифмическим шагом
- фаза каждого массового состояния на каждом расстоянии ($2.534\,m^2 L/E$ в эВ², км, ГэВ)
- 'повторяющийся $i$ ⇒ суммирование: три массовых состояния интерферируют'
- все девять вероятностей перехода на каждом расстоянии
