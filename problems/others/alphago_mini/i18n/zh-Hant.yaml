source_hash: f0ace6f81d9f
title: 迷你 AlphaGo：在 $5\times5$ 圍棋盤上的樹搜尋
summary: 在小棋盤上下一盤自我對弈的圍棋，每一步都由 AlphaGo 所用的同一種搜尋選出：採用 PUCT 規則的蒙地卡羅樹搜尋。圍棋規則本身就是張量運算：提子與數子計分都是洪水填充，每一步只需與棋盤鄰接矩陣做一次 einsum。每個新局面都由同時進行的一整批隨機對局來評估。觀察訪問次數如何集中到搜尋所看好的那一手。
notes: 每次模擬都沿著樹往下走，選擇 PUCT 最大值，加入一個新局面，以整批隨機 playout 評分，再把結果加到路徑上的每一手。好棋累積訪問次數，因此搜尋不必看遍每一條變化，便能集中在關鍵之處。AlphaGo 用的是同一個迴圈，只是把均勻先驗 $P_a$ 換成策略網路、把隨機 playout 換成價值網路，兩者都以棋譜訓練；AlphaGo Zero 則完全透過自我對弈學會兩者。在 $5\times5$ 上，天元開局對黑棋很有利；模擬次數少時，搜尋會犯下明顯的錯誤；提高模擬次數，棋局會更精準但也更慢。規則：Tromp–Taylor（自殺會提掉自己的棋塊、數子計分），並做簡單的劫檢查。
meanings:
- 棋盤上的點 $p$：$+1$ 黑、$-1$ 白、0 空
- 把棋盤看成圖：當 $p$ 與 $q$ 水平或垂直相鄰時為 1
- 洪水填充：從空點出發穿過某一顏色，找出有氣的棋塊；其餘的被提掉
- 數子計分：棋子加上只有該顏色能到達的空點，黑減白再減貼目 $k$
- $R$ 盤隨機對局以一個 $(R, n^2)$ 張量同時進行；取黑棋的平均結果；絕不填自己的眼
- PUCT：價值 $Q_a$ 加上隨著 $a$ 被訪問而縮小的探索獎勵；均勻先驗 $P_a$
- 所有模擬後的訪問次數（最後一項：虛手）；下出訪問次數最多的那一手
labels:
  board_size: 棋盤大小 $n$
  simulations: 每手模擬次數
  rollouts: 每個葉節點的隨機 playout 數 $R$
  c_puct: 探索係數 $c$
  komi: 貼目 $k$
