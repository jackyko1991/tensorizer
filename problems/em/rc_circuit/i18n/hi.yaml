source_hash: 6cf1e64854dc
title: संधारित्र का आवेशन (RC परिपथ)
summary: प्रतिरोधक के माध्यम से आवेशित होता संधारित्र $dV/dt = (V_s - V)/(RC)$ का पालन करता है। अलग-अलग प्रतिरोधों वाले कई परिपथ वोल्टताओं के एक टेंसर में रखे जाते हैं, इसलिए एक ही रूंगे–कुट्टा चरण सबको आगे बढ़ाता है। स्रोत को वर्ग तरंग पर बदलें और संधारित्रों का आवेशन व निरावेशन देखें।
notes: 'मात्रक: $R$ kΩ में और $C$ mF में, इसलिए $\tau = RC$ सेकंड में और $I$ mA में आता है। एक समय नियतांक के बाद संधारित्र स्रोत वोल्टता का 63 % प्राप्त कर लेता है, $5\tau$ के बाद वह लगभग पूरा भर जाता है। बैटरी से आवेशन के दौरान स्रोत $CV_s^2$ ऊर्जा देता है: ठीक आधी संधारित्र में संचित होती है, बाकी आधी $R$ में ऊष्मा बन जाती है — $R$ का मान चाहे जो हो।'
meanings:
- संधारित्र $b$ पर वोल्टता (प्रति परिपथ एक प्रविष्टि)
- परिपथ $b$ का प्रतिरोध
- धारिता, हर परिपथ में समान
- स्रोत वोल्टता, सभी परिपथों में साझा ($b$ पर broadcast)
- 'अवयव-वार: सूचकांक $b$ दोनों ओर एक बार आता है, कोई योग नहीं'
- हर प्रतिरोधक से धारा
- हर संधारित्र में संचित ऊर्जा
labels:
  V_s: स्रोत वोल्टता
  C: धारिता
  R_min: न्यूनतम प्रतिरोध
  R_max: अधिकतम प्रतिरोध
  n_circuits: परिपथ
  source: स्रोत
  period: वर्ग तरंग का आवर्तकाल
  t_max: सिमुलेशन समय
