title: स्पिन पुरस्सरण और राबी दोलन
summary: चुंबकीय क्षेत्र में एक स्पिन-$\tfrac12$। हैमिल्टनियन क्षेत्र सदिश का पाउली टेंसर $\sigma_{kab}$ के साथ संकुचन है, अवस्था आव्यूह चरघातांकी $U = \exp(-iH\Delta t)$ से विकसित होती है, और ब्लॉख सदिश $s_k = \langle\psi\vert\sigma_k\vert\psi\rangle$ एक और einsum है। स्थैतिक क्षेत्र स्पिन को लार्मर आवृत्ति पर पुरस्सरण कराता है; एक दुर्बल अनुनादी अनुप्रस्थ क्षेत्र उसे धीरे-धीरे उलट देता है (राबी दोलन)।
notes: 'मात्रक $\hbar = 1$। $B_1 = 0$ के साथ स्पिन $z$ के परितः लार्मर आवृत्ति $\omega = \gamma B_0$ पर पुरस्सरण करता है, और $\lvert\mathbf s\rvert = 1$ सदा रहता है क्योंकि $U$ ऐकिक है। $B_1 > 0$ को $\omega \approx \gamma B_0$ पर चलाने से स्पिन उत्तरी ध्रुव से दक्षिणी ध्रुव की ओर कुंडलित होकर वापस आता है: ड्राइव के साथ घूमते फ़्रेम में रैखिक ड्राइव का केवल सह-घूर्णी आधा भाग मायने रखता है, जिससे राबी आवृत्ति $\Omega = \gamma B_1/2$ मिलती है (घूर्णी-तरंग सन्निकटन, RWA)। ड्राइव को असंगत (detune) करें तो उलटना अधूरा हो जाता है। पाउली आव्यूह $\sigma_i\sigma_j = \delta_{ij}I + i\,\varepsilon_{ijk}\sigma_k$ का पालन करते हैं।'
meanings:
- 'पाउली टेंसर: $k \in \{x, y, z\}$ आव्यूह चुनता है, $a, b$ स्पिनर सूचकांक हैं'
- $z$ के अनुदिश स्थैतिक $B_0$ और वैकल्पिक $x$ के अनुदिश $B_1\cos(\omega t)$
- 'दोहराया गया $k$ ⇒ योग: $\mathbf B\cdot\boldsymbol\sigma$ एक $2\times 2$ आव्यूह के रूप में ($t$ पर tk,kab->tab के रूप में बैच)'
- एक-चरण प्रसारक (propagator), ऐकिक
- 'ब्लॉख सदिश: $a$ और $b$ दोनों पर योग'
labels:
  B0: स्थैतिक क्षेत्र $B_0$ ($z$ के अनुदिश)
  B1: ड्राइव आयाम $B_1$ ($x$ के अनुदिश)
  drive_freq: ड्राइव आवृत्ति $\omega$
  gamma: घूर्णचुंबकीय अनुपात $\gamma$
  theta0: $z$ से प्रारंभिक झुकाव
  t_max: अनुकरण समय
