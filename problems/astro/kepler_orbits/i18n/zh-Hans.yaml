source_hash: b1957b563a0a
title: 开普勒行星运动定律
summary: 轨道大小和偏心率各异的行星在牛顿平方反比引力作用下绕恒星运行。一次批量 RK4 积分同时展示开普勒三大定律：恒星位于焦点的椭圆、相等时间扫过相等面积，以及 $T^2 \propto a^3$。
notes: 单位为 AU、年和太阳质量，因此 $GM_\odot = 4\pi^2$，开普勒第三定律简化为 $T^2 = a^3$。每颗行星都从近日点出发，初速为活力公式给出的 $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$。偏心率最大的轨道上，每块阴影扇形都用时 $T/12$：靠近恒星时短而宽，远离时长而窄，但面积始终相同，因为 $dA/dt = L/2$ 且 $L$ 守恒。周期由模拟测得，即扫过 $2\pi$ 所用的时间。恒星视为固定不动（其质量远大于行星），行星之间互不吸引。
meanings:
- 行星 $b$ 相对恒星的位置，$i \in \{x, y\}$
- 行星 $b$ 的速度
- 重复的 $j$ ⇒ 求和：距离平方 $r_b^2$
- 指向恒星的平方反比引力
- 二维列维-奇维塔符号，$\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- 单位质量角动量；$dA/dt = L_b/2$ 为常数
- $\tfrac12 v^2 - GM/r$；由此得 $a = -GM/2E$
labels:
  n_planets: 行星数
  e_max: 最大偏心率 $e$
  t_max: 模拟时长
  dt: 时间步长
