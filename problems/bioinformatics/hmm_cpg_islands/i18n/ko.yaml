source_hash: 5165c35a9a08
title: 은닉 마르코프 모형으로 CpG 섬 찾기
summary: DNA 서열은 보이지 않게 평범한 배경과 GC가 풍부한 CpG 섬 사이를 오간다. 두 상태 은닉 마르코프 모형이 이를 찾아낸다. 전향–후향 알고리즘은 각 위치에서 섬에 있을 확률을, 비터비 알고리즘은 단 하나의 최적 분할을 주고, 바움–웰치 알고리즘은 서열만으로 모형을 학습한다. 서열을 따라가는 각 단계는 상태에 대한 배치 행렬 곱이며 로그 공간에서 계산한다. 사후 확률이 심어 둔 섬에 고정되는 것을 보자.
notes: 데이터는 합성이다. 모든 서열에 100–300 글자 길이의 섬이 무작위 위치에 심어져 있고, 섬 안에는 C와 G가 더 많다. 글자 하나는 상태에 대해 거의 아무것도 알려 주지 않지만, 마르코프 사슬 $A$가 상태를 지속시키므로 전향·후향 계산이 긴 구간 전체의 증거를 모은다. 바움–웰치는 기댓값 최대화(EM)다. 현재 모형에서 $\gamma$와 $\xi$를 계산한 뒤, $E_{k\alpha}$를 각 상태의 기대 문자 빈도로, $A_{ij}$를 기대 전환 빈도로 설정한다. 가능도는 절대 감소하지 않는다. 막연한 추측에서 시작해도 참 모형(초록 선)에 가깝게 끝난다. 실제 CpG 섬은 단순히 C와 G가 아니라 다이뉴클레오타이드 CG가 풍부하다. Durbin et al.은 이를 8개 상태(A+, C+, G+, T+, A−, …)로 모형화하며, 그 전이 확률이 다이뉴클레오타이드 빈도다. 섬의 GC 함량을 낮추면 문제가 더 어려워진다.
meanings:
- 서열 $b$의 위치 $t$에 있는 글자, A, C, G, T에 대한 원-핫
- 시작, 전이, 방출 확률. 상태 0은 배경, 상태 1은 섬
- '반복된 $\alpha$ ⇒ 합: 각 상태가 관측된 글자를 방출할 가능성'
- 반복된 $i$ ⇒ 합. 언더플로가 없도록 가장 큰 항을 뽑아낸(log-sum-exp) $\log\alpha$로 저장
- '반복된 $j$ ⇒ 합: 상태 $i$가 주어졌을 때 나머지 서열의 확률'
- 사후 확률 $P(z_t = k \mid x)$. $\gamma_{bt1}$이 파란 곡선이다
- '비터비: 합 대신 최댓값을 쓰는 같은 점화식에, 최적 경로를 위한 역포인터를 더한 것'
- '반복된 $b, t$ ⇒ 합: $i \to j$ 전환의 기대 횟수. 바움–웰치는 $A_{ij} \propto \xi_{ij}$로 설정한다'
labels:
  n_seq: 서열 수 $B$
  length: 길이 $T$
  n_islands: 서열당 심은 섬 수
  gc_island: 섬의 GC 함량
  iterations: 바움–웰치 반복 횟수
