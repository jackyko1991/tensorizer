title: Singularitäten als Falten einer Projektion
summary: 'Eine spekulative Hypothese, keine etablierte Physik: Die gekrümmte Raumzeit ist der Schatten einer Fläche in einem flachen höherdimensionalen Raum, und eine Singularität ist die Stelle, an der dieser Schatten sich faltet. Zuerst wird die bekannte Geometrie geprüft. Das Flammsche Paraboloid und Fronsdals Einbettung (1959) der gesamten Schwarzschild-Raumzeit in sechs flache Dimensionen liefern die Metrik exakt zurück (autograd), und der Kretschmann-Skalar $12r_s^2/r^6$ folgt aus derselben automatischen Differentiation. Projizierte Flächen falten sich mit universellen Dichteexponenten: $-1/2$ für eine Falte, $-2/3$ für eine Spitze. Ein faltenförmiges Inneres lässt das Äußere exakt schwarzschildsch, sodass es sich hinter dem Horizont verbirgt. Nichts davon kann direkt beobachtet werden.'
notes: 'Schritt 4 der Projektionshypothese (siehe die Beschreibung der Serie), der spekulativen Hypothese des Autors, keine etablierte Physik. Schritt 1 (cosmology/projection_postulate) formuliert Postulat P4: Die gekrümmte Raumzeit ist die projizierte Gestalt einer flachen höherdimensionalen Einbettung, und eine Singularität ist die Stelle, an der die Projektion sich faltet (ihre Jacobi-Matrix verliert Rang). Schritt 3 (cosmology/projection_dimension_budget) zählt Dimensionen, Schritt 5 (cosmology/projection_bell_test) prüft die Messpostulate, und Schritt 6 (cosmology/projection_telescope_tests) betrachtet, was Teleskope prüfen können. Die Zahl der flachen Dimensionen $D$ bleibt offen: Sie ist hier ein Parameter und geht in kein Ergebnis ein. Zuerst die bekannte Geometrie. (a) Flamm (1916): Der äquatoriale Schnitt $t = $ const, $\theta = \pi/2$ von Schwarzschild, gezeichnet im flachen $\mathbb R^3$, ist das Paraboloid $z = 2\sqrt{r_s(r-r_s)}$, und seine induzierte Metrik $dr^2/(1-r_s/r)
  + r^2d\phi^2$ stimmt auf $10^{-16}$ überein. (b) Fronsdal (Phys. Rev. 116, 778, 1959) bettet die gesamte Schwarzschild-Raumzeit, auch innerhalb des Horizonts, in das flache $\mathbb R^{1,5}$ ein. Die induzierte Metrik $\eta_{AB}\partial_iz^A\partial_jz^B$, mit der Jacobi-Matrix aus autograd, stimmt außen und innen sowie in Kruskal-Koordinaten über den Horizont hinweg auf $10^{-13}$ mit Schwarzschild überein. Gekrümmte 4D-Geometrie lässt sich tatsächlich als Fläche in einem flachen Raum auffassen; das ist der Anker für P4. Zwei Tatsachen sind für P4 wichtig. Die Einbettung hat am Horizont vollen Rang: Der in $(t, r)$-Koordinaten gesehene Rangverlust verschwindet in Kruskal-Koordinaten. Bei $r\to0$ faltet sie sich ebenfalls nicht; sie läuft ins Unendliche davon, $z^2\approx-2r_s^{3/2} r^{-1/2}$. Die Krümmung, berechnet mit derselben automatischen Differentiation (Christoffel-Symbole, Riemann-Tensor, einsum-Kontraktionen), ergibt $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ auf $10^{-15}$ genau.
  Die statischen Gezeiteneigenwerte sind $+r_s/r^3$ (radiale Streckung) und $-r_s/2r^3$ (seitliche Stauchung), alle divergent bei $r = 0$. Die Behauptung von P4, konkret gemacht: Eine glatte Fläche im flachen $\mathbb R^D$, durch eine Projektion betrachtet, hat einen Schatten, dessen Dichte an Faltenkaustiken divergiert. Die Katastrophentheorie (Thom, Arnold) besagt, dass der Exponent universell ist. Die Abbildung $x = s^n$ ergibt $\rho\propto|x|^{1/n-1}$, gemessen als $-0.500$ (Falte), $-0.667$ (Spitze) und $-0.750$ ($n = 4$). Eine Sphäre $S^k$, projiziert auf $\mathbb R^3$, hat die Randdichte $u^{(k-3-1)/2}$, gemessen als $-0.51$, $0.00$, $+0.45$ für $k = 3, 4, 5$ bei beliebigem $D$. Eine Dichtespitze erfordert also eine Fläche mit genau so vielen Dimensionen wie der Schirm; eine dickere Fläche ergibt einen glatten Schatten. Die Animation kippt eine wellige Fläche, bis sie sich faltet, bei $a\tan\alpha > 1$. Vergleich mit der ART: Man gibt der Masse $M = r_s/2$ die Dichte des Schattens
  einer 3-Sphäre, $\rho\propto(1-r^2/R^2)^{-1/2}$, eine Karikatur im schwachen Feld, keine Lösung der Einsteinschen Gleichungen. Außerhalb von $R$ ist das Feld exakt $r_s/r^3$ (Birkhoff-Theorem, Schalentheorem), und das Zentrum bleibt endlich. Die Divergenz wandert zur Faltenschale und schwächt sich in Dichte und Gezeitenfeld zu $(R-r)^{-1/2}$ ab, und das Krümmungsmaß $8\sum E^2$ zu $(R-r)^{-1}$, statt $r^{-3}$ und $r^{-6}$ in der ART. Die Fläche selbst behält eine endliche Krümmung $1/R^2$. Urteil, ehrlich. P4 kann die streng geprüfte äußere Schwarzschild-Geometrie unverändert lassen und nur das Innere ändern, aber genau das macht sie unprüfbar: Für $R < r_s$ liegt die Falte hinter dem Horizont, und kein Signal von ihr erreicht uns. Die universellen Exponenten sind nur als Beschreibung neu, da nichts außerhalb des Horizonts von ihnen abhängt. Eine Falte außerhalb des Horizonts ($R > r_s$) wäre ein horizontloses kompaktes Objekt mit anderen Photonenringen und Echos; das prüft Schritt 6 mit
  Schatten Schwarzer Löcher. Hintergrund: fluids/blowup_profile_search zeigt, wie singuläre Profile und ihre Exponenten in der Praxis untersucht werden (selbstähnlicher Ansatz, Exponentensuche). Wikipedia: Schwarzschild-Metrik, Katastrophentheorie.'
meanings:
- Jacobi-Matrix der Einbettung durch automatische Differentiation, eine pro Stichprobenpunkt $b$
- 'induzierte Metrik: Über die wiederholten Einbettungsindizes $A, C$ wird mit der flachen Metrik $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ summiert'
- die zusätzliche Einbettungskoordinate, eine Gauß–Legendre-Summe mit 64 Knoten über $q$ in $\ell = \ln s$, differenzierbar in $r$; sie geht gegen $-\infty$, und zwar wie $r^{-1/2}$
- 'kleinster Singulärwert: Eine Falte der Abbildung liegt dort, wo er 0 erreicht und die Jacobi-Matrix Rang verliert'
- Christoffel-Symbole aus der autograd-Ableitung der Metrik; über $d$ wird summiert
- Riemann-Tensor aus einer zweiten Vorwärtsmodus-Ableitung und zwei einsum-Produkten (über $e$ summiert)
- Kretschmann-Skalar, über alle vier Indizes summiert; gleich $12r_s^2/r^6$ innerhalb und außerhalb des Horizonts
- Schattendichte einer gleichmäßigen Fläche unter $x = s^n$ (Falte $n = 2$, Spitze $n = 3$), Histogramm auf logarithmischen Klassen
- Newtonscher Gezeitentensor einer Masse, verteilt wie der Schatten einer 3-Sphäre mit Radius $R$ (Karikatur im schwachen Feld)
labels:
  fold_radius: Radius $R$ der Faltenschale
  sheet_amplitude: Amplitude $a$ der welligen Fläche
  D: Flache Dimension $D$, die die Sphärenflächen enthält (offen)
  samples: Abgetastete Punkte auf jeder Fläche
