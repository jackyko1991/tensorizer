title: Цепочка распадов (уравнения Бейтмана)
summary: Материнское ядро распадается в радиоактивное дочернее, которое распадается в стабильный конечный продукт. Три уравнения скоростей образуют одну линейную систему $\dot N_i = A_{ij} N_j$, точно решаемую матричной экспонентой $e^{At}$ сразу для всех моментов времени и проверяемую методом RK4. Цепочка по умолчанию — медицинский генератор $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc.
notes: 'Сумма каждого столбца $\mathsf A$ равна нулю, поэтому $\sum_i N_i$ не меняется: каждый распад перемещает одно ядро вниз по цепочке. Для двух звеньев точное решение (Бейтмана): $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$. Когда дочернее ядро живёт меньше ($\lambda_2 > \lambda_1$), активности сцепляются: отношение $a_2/a_1$ стремится к $\lambda_2/(\lambda_2-\lambda_1)$ (подвижное равновесие) и к 1, когда материнское ядро живёт гораздо дольше (вековое равновесие; попробуйте период полураспада материнского ядра 1000 ч). Сделайте дочернее ядро более долгоживущим, и равновесие не установится. Упрощения: на самом деле $^{99}$Mo переходит в $^{99m}$Tc лишь примерно в 88 % распадов, а $^{99}$Tc (период полураспада 211 000 лет) считается стабильным.'
meanings:
- $\ln 2/T_i$, с $\lambda_3 = 0$ для стабильного конца
- $-\lambda_i$ на диагонали, $+\lambda_i$ сразу под ней
- 'повторяющийся $j$ ⇒ суммирование: правая часть для RK4'
- одна матричная экспонента на момент времени, пакетно по $t$
- населённости во все моменты из начального вектора
- 'активность: число распадов в час для каждого звена'
labels:
  half_life_parent: Период полураспада материнского $T_1$
  half_life_daughter: Период полураспада дочернего $T_2$
  t_max: Интервал времени
  rk4_steps: Шаги RK4
