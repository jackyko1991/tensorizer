source_hash: 099100757a12
title: CNN과 전문가 혼합 컨트롤러가 플레이하는 스네이크
summary: '두 부분으로 이루어진 게임 플레이 에이전트: 보드를 보는 작은 CNN과 수를 고르는 제어 네트워크로, 여기서 제어 네트워크는 라우터가 각 게임을 $K$개의 작은 전문가 네트워크 중 하나로 보내는 전문가 혼합(mixture of experts)이다. 게임은 $10 \times 10$ 격자 위의 스네이크이며, 전부 텐서로 작성되어 게임 배치 전체가 한 번의 스텝으로 진행된다. 컨트롤러는 계획 교사(너비 우선 탐색과 플러드 필, 역시 텐서 연산)를 모방하여 학습한다. 같은 가중치 예산을 가진 네 가지 컨트롤러를 비교한다: 밀집 혼합, Switch top-1 라우터, 밀집으로 학습한 뒤 top-1로 사용하는 라우터, 그리고 하나의 일반 MLP. 이어서 라우팅을 게임 상태와 대조하여 각 전문가가 무엇에 쓰이는지(쓰인다면) 살펴본다. 네 컨트롤러 모두 게임당 약 20개의 먹이를 먹으며, 무작위 정책은 0.2개를 먹으니 교사 점수의 3분의 2에 해당한다. 이 규모에서는 일반 MLP도 어떤 혼합 못지않게 잘한다.'
notes: '아이디어. Jacky Ka Long Ko는 지각을 담당하는 CNN과 전문가 혼합 라우팅을 쓰는 제어 네트워크로 이루어진 게임 플레이 에이전트를 제안했고, 무엇보다 텐서 라우팅 부분을 요청했다. 이 문제는 여기서 처음부터 작성한 일반적인 격자 게임인 스네이크(자체 픽셀 그래픽, 외부 에셋 없음) 위에 그런 에이전트를 작게 구성한다. 게임. $N \times N$ 보드($N = 10$) 위의 $B$개 게임이 하나의 텐서 집합이다. 보드는 몸통 각 칸의 나이(그 칸이 다시 비게 될 때까지 남은 수: 머리의 나이 = 길이, 꼬리는 1)를 저장하므로, 모든 게임의 한 수는 몇 개의 텐서 연산으로 끝난다: 머리는 상대 행동 $a$(왼쪽, 직진, 오른쪽)에 대해 새 방향 $d'' = (d + a - 1) \bmod 4$로 $\mathbf x + \Delta_{d''}$로 이동한다. 벽이나 나이가 $> 1$인 칸에 닿으면 게임이 끝난다(꼬리 칸은 떠나므로 비어 있다). 먹이가 없으면 모든 나이가 1씩 줄고, 먹이를 먹으면 뱀은 꼬리를 유지하며 한 칸 자란다. 새 먹이는 시드가 고정된 $N^2$개의 균등 난수 중 가장 큰 값을 가진 빈 칸에 놓이므로 절대 몸통 위에 놓이지 않는다. 먹이 없이 $N^2$수가 지나거나 뱀이 보드를 가득 채워도 게임이 끝난다. 테스트: 벽 충돌과 자기 충돌, 비어 있는 꼬리 칸, 한 칸 성장, 먹이가 절대 몸통 위에 없음, 나이가 항상 정확히 $\ell, \ell - 1, \dots, 1$임, 그리고 같은 난수가 주어졌을 때 배치 스텝이 게임별 일반 Python 루프와 같음. 에이전트. 지각은 머리를 중심으로 진행 방향이 위를 향하도록 한 시야 위의 CNN(8채널 3×3 합성곱, 16채널 stride 2 3×3 합성곱, $F = 64$개 특징으로 가는 선형 층; 84 472개 가중치)이며, 입력은 벽, 몸통, 나이/길이(어느 칸이 먼저 비는지), 먹이의 네 평면이다. 이 좌표계에서 세 가지 상대 수는 항상 중심의 같은 세 이웃이다(테스트는
  그 이웃이 벽이거나 남아 있을 몸통 칸일 때에만 정확히 그 수가 치명적임을 확인한다). 제어는 $K = 4$개 전문가의 혼합으로, 각 전문가는 행동 로짓을 내는 MLP $64 \to 32 \to 3$이고 그 앞에 softmax 라우터 $p = \mathrm{softmax}(W^G \mathbf h + b^G)$가 있다: 8976개 가중치. 라우팅 층은 moe_dag_pipeline의 것을 그대로 가져와 쓴다: 디스패치 텐서가 각 게임을 해당 전문가의 버퍼에 넣고(GShard와 Switch처럼 누적 순위 사용), 모든 전문가가 하나의 배치 einsum으로 실행되며, 결합 einsum이 로짓을 되돌린다. 정확한 검사: 고정된 one-hot 라우터에서 이 층은 각 게임의 전문가를 단독으로 실행한 것과 같고($10^{-6}$까지), 균등한 밀집 라우터는 전문가들의 평균을 주며, 라우터의 행 합은 1이고, 부하 분산 손실은 알려진 경우에서 맞는 값을 준다(균형일 때 1, 붕괴 시 $K$, 손으로 계산한 예에서 1.1). 같은 예산의 네 컨트롤러: (a) 밀집 혼합 $z = \sum_k p_k f_k$(모든 전문가가 모든 게임에 작동); (b) Switch top-1, 가장 확률이 높은 전문가만 실행되며 그 로짓에 $p_k$를 곱한다; (c) (a)의 밀집 학습 모델을 추가 학습 없이 top-1 라우팅으로 실행; (d) 하나의 MLP $64 \to 132 \to 3$(8979개 가중치, 혼합과 같음). (a)와 (b)는 모두 $\alpha = 0.01$인 Switch 부하 분산 손실을 더한다. 각 변형에는 시드가 두 개 있으며, 시드 $s$는 모든 변형에서 같은 CNN 및 전문가 가중치로 시작하고, 학습되는 여섯 모델 모두가 하나의 모델 축(CNN의 그룹 합성곱)을 공유하되 각자 자신의 미니배치를 쓴다. 교사와 학습. 교사는 같은 텐서로 작성한 계획기이다: 빈 칸 위에서 반복 완화로 수행하는 너비 우선 탐색($\mathrm{dist} \leftarrow \min(\mathrm{dist},
  1 + \min_{\mathrm{nbr}} \mathrm{dist})$)과, 같은 루프 안에서 각 빈 영역에 그 영역의 가장 작은 칸 인덱스로 레이블을 붙이는 플러드 필. 교사는 절대 치명적인 수를 두지 않고, 빈 영역이 뱀을 담을 수 있는 수를 우선하며, 그다음 먹이까지의 최단 경로, 그다음 더 큰 영역을 택한다. 테스트에서 교사의 거리 필드는 교과서적인 큐 기반 BFS와 같다. 학습은 행동 복제(behaviour cloning, Pomerleau 1989)이다: 교사 게임 192판의 54 040개 상태에서 교사의 수에 대한 교차 엔트로피, 모델당 128개 상태씩 600번의 AdamW 스텝, 360스텝 후 DAgger 한 라운드(Ross et al. 2011): 학생들이 각각 48판을 두고, 교사가 그들이 도달한 38 267개 상태에 레이블을 붙이며, 학습은 두 데이터 모두로 계속된다. 강화학습 미세조정은 하지 않는다. 심층 Q-학습(Mnih et al. 2015)은 보상만으로 이런 게임을 배우는 고전적인 방법이지만 CPU에서는 훨씬 오래 걸릴 것이다. 결과(기본 실행, 모든 정책이 공유하는 평가 게임 128판: 같은 시작과 같은 먹이 순서, 최대 300수). 게임당 먹은 먹이, 게임 평균, 두 시드 값과 함께: 무작위 0.16(15수 후 죽음); (a) 밀집 20.7 (20.9, 20.4); (b) Switch 20.4 (21.1, 19.6); (c) 밀집→top-1 18.1 (18.4, 17.8); (d) 단일 모델 21.7 (21.8, 21.6); 교사 31.0(평균 300수 중 287수 생존, 학생은 147–179). 학생들은 학습 상태의 95–96 %에서 교사와 일치하지만 점수는 3분의 1 낮다: 작은 오류가 게임 동안 누적되는데, 이는 행동 복제의 흔한 약점이다. 느린 테스트는 학습된 정책이 무작위를 뚜렷한 차이로 이기는지 확인한다. 라우팅, 전문화가 아닌 경우에도 보여 준다. 밀집 라우터는 네 전문가를 모두 사용한다(부하 0.16–0.38). 라우터가
  가장 잘 추적하는 것은 수 자체이다: 선택된 전문가와 컨트롤러의 수 사이의 상호 정보량은 0.51과 0.56비트이다(전문가가 넷이면 최대 2비트). 시드 1에서는 한 전문가가 거의 모든 좌회전과 우회전, 그리고 앞에 빈 칸이 없는 거의 모든 상태를 맡고, 나머지 셋이 직진을 나눠 맡는다. 앞의 빈 칸은 0.20–0.28비트, 먹이까지의 거리는 0.08–0.12, 몸통 길이는 0.02–0.13(짧은 뱀에서 긴 뱀으로의 이동은 시드 1에서만)을 담는다. 따라서 전문가들은 먹이 추적 대 꼬리 회피 같은 전략이 아니라 무엇을 할지(회전 또는 계속 진행)에 따라 나뉜다. 전문가의 출력이 수를 결정하므로 이런 분업은 부분적으로 구조에 내재되어 있다. Switch 라우터는 부하 분산 손실에도 불구하고 붕괴했다: 시드 1은 상태의 85 %를 한 전문가에, 15 %를 두 번째 전문가에 보내고, 시드 2는 73 %와 26 %를 보내며, 각각 두 전문가는 쓰이지 않는다. moe_dag_pipeline에서 보았던 대칭 깨기의 어려움이 여기서는 붕괴로 나타난다. 점수에는 손해가 없는데, 공유 CNN(가중치 대부분을 보유)과 함께라면 전문가 하나만으로도 넷만큼 잘 두기 때문이다. 밀집 학습 라우터를 top-1로 실행하면(c) 밀집 라우팅은 유지되지만(수와의 상호 정보량 0.60과 0.67비트) 게임당 먹이 2.6개를 잃는다: 밀집 모델은 전문가들을 섞어 쓰므로 완전히 분리되지 않는다. 성립하는 것과 성립하지 않는 것. 정확: 배치 게임은 참조 루프와 같고, 고정 라우터의 라우팅 층은 게임별 전문가 호출과 같으며, 균등 라우터의 밀집 혼합은 전문가 평균이다. 하나의 보드 크기와 두 시드에서 측정: 모방은 모든 컨트롤러를 교사의 약 3분의 2까지 끌어올리며, 같은 가중치 수의 일반 MLP를 이기는 혼합은 없다(MLP가 두 시드 모두에서 게임당 먹이 약 1개 앞서지만, 시드 두 개로는 작은 차이이다). 전문가 혼합은 많은 전문가가 하나의 입력이 쓸 수 있는 것보다 훨씬 많은 가중치를 가질
  때 효과를 본다. 대부분의 일을 하는 CNN 뒤에 놓인 4-전문가 컨트롤러는 라우팅을 보여 줄 뿐, 그 이점을 보여 주지는 않는다. 관련 연구. 국소 전문가의 적응적 혼합(Jacobs, Jordan, Nowlan, Hinton 1991)은 각 사례를 경쟁하는 여러 전문가 중 하나에 배정하는 게이트를 도입했고, 희소 게이트 MoE 층(Shazeer et al. 2017)과 Switch Transformer(Fedus et al. 2021, 여기서 쓰는 top-1 라우팅과 부하 분산 손실)가 이를 대규모로 확장했다. 심층 Q-네트워크(Mnih et al. 2015)는 CNN과 보상만으로 픽셀에서 Atari 게임을 학습했다. ALVINN(Pomerleau 1989)은 인간 운전자를 모방해 차량을 조향했으며 이것이 행동 복제의 기원이고, DAgger(Ross, Gordon, Bagnell 2011)는 학습자 자신이 방문한 상태에 레이블을 붙여 누적 오류를 바로잡는다. 장치와 한계. 기본은 CPU: 바쁜 6코어 머신에서 교사, 학습, 평가에 약 80 s(교사 게임 6.6 s, DAgger 6.0 s, 학습 53 s, 평가 16 s), 여기에 GIF에 약 30 s. GPU(pixi run -e cuda)는 CNN을 빠르게 하지만 교사의 수많은 작은 탐색은 빠르게 하지 못한다. GIF는 라우터가 모든 전문가를 사용하면서 게임당 정확히 하나만 실행하는 (c)를 보여 준다. routing.png는 라우팅을 쓰는 세 변형을 모두 보여 주고, routing.csv와 scores.csv에 수치가 담겨 있다.'
meanings:
- '게임 $b$의 보드: 0 = 빈 칸, 그 외에는 그 몸통 칸이 다시 비게 될 때까지 남은 수 (머리 = 길이 $\ell_b$, 꼬리 = 1)'
- $B$개 게임 모두가 동시에 움직임; 상대 행동 $a_b$(왼쪽, 직진, 오른쪽)에 대해 $d'_b = (d_b + a_b - 1) \bmod 4$; 벽이나 나이가 $> 1$인 칸은 게임을 끝냄 (나이 1인 꼬리 칸은 떠나는 중)
- '먹은 뒤, 시드가 고정된 균등 난수 $u_{brc}$ 중 가장 큰 값을 가진 빈 칸: 절대 몸통 위가 아님'
- 'CNN이 보는 것: 벽, 몸통, 나이/길이, 먹이. 머리를 중심으로 진행 방향이 위를 향하므로 세 수는 항상 같은 세 이웃'
- CNN 특징; 모델 축 $m$(변형 × 시드)은 층마다 하나의 그룹 합성곱의 그룹이 됨
- '라우터: $K$개 전문가에 대한 softmax, 행 합은 1'
- 게임 $b$를 전문가 $k$의 슬롯 $s$로 (그곳으로 라우팅된 게임들 사이의 순위), moe_dag_pipeline에서 가져옴
- '모든 전문가를 하나의 배치 곱으로, 각자 자기 게임 버퍼에서: 세 개의 행동 로짓'
- '결합; 밀집: $z = p_{mbk} y_{mkba}$, 모든 전문가가 모든 게임에'
- 'Switch 부하 분산, $K \sum_k f_k P_k$: 균형일 때 1, 붕괴 시 $K$'
- '교사: 치명적인 수는 두지 않고, 그다음 빈 영역(플러드 필)이 뱀을 담을 수 있는 수, 그다음 먹이까지의 최단 경로 (반복 텐서 완화로 수행하는 너비 우선 탐색)'
labels:
  grid: 보드 크기 $N$ (칸)
  seeds: 변형당 시드 수
  experts: 전문가 수 $K$
  steps: 학습 스텝
  balance_weight: 부하 분산 가중치 $\alpha$
  dagger: DAgger 라운드 (1 = 켬)
  eval_games: 평가 게임 수
