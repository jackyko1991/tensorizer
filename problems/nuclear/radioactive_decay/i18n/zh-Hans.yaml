source_hash: 8bd75af0e44c
title: 放射性衰变
summary: 每个原子核以相同的每秒概率 $\lambda$ 随机衰变。把整个网格的原子核模拟为一个布尔张量——每个原子核每个时间步抛一次硬币——即可重现平滑的指数规律 $N(t) = N_0 e^{-\lambda t}$ 和半衰期 $T_{1/2} = \ln 2/\lambda$。
notes: 指数规律是关于平均值的陈述。有 $N_0$ 个原子核时，经过时间 $t$ 后的数目服从二项分布，均值为 $N_0 e^{-\lambda t}$，标准差为 $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$，所以小网格明显围绕曲线起伏，大网格则紧贴曲线。每经过一个半衰期，剩余原子核约减少一半，无论原来有多少。步长 $\Delta t$ 只需比 $T_{1/2}$ 小；精确的每步概率 $1 - e^{-\lambda\Delta t}$ 保证任意步长下均值都正确。随机种子固定，结果可重复。
meanings:
- 衰变常数 $\ln 2 / T_{1/2}$
- 原子核 $n$ 尚未衰变时为 True；网格只是画出 $n$ 的一种方式
- 每个原子核每步一个均匀随机数
- 在一个步长 $\Delta t$ 内衰变的概率
- 已衰变的原子核保持衰变状态
- 对所有原子核求和：数目 $N(t)$
labels:
  n_side: 网格边长（边长² 个原子核）
  half_life: 半衰期 $T_{1/2}$
  t_max: 模拟时长
  dt: 时间步长 $\Delta t$
