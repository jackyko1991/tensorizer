source_hash: d9c269ec5e13
title: シュレディンガー方程式：Crank–Nicolson 法による時間発展
summary: 時間依存シュレディンガー方程式 $i\,\partial_t\psi = H\psi$ を、格子上で陰的な Crank–Nicolson 法 $(I + \tfrac{i\Delta t}{2}H)\,\psi^{n+1} = (I - \tfrac{i\Delta t}{2}H)\,\psi^n$ により時間発展させます。左辺の行列は一度だけ LU 分解し、各ステップは三つの波束（$\psi_{xb}$ の各列）をまとめて解く安価な torch.linalg.lu_solve だけです。このステップは厳密にユニタリなのでノルムは 1 のまま保たれ、同じ $\Delta t$ の陽的 Euler 法は発散します。
notes: 単位は $\hbar = m = 1$。うまくいく理由：$U = (I + \tfrac{i\Delta t}{2}H)^{-1}(I - \tfrac{i\Delta t}{2}H)$ はエルミート行列 $H$ のケイリー変換です。エネルギー $E$ の固有ベクトルには $(1 - iE\Delta t/2)/(1 + iE\Delta t/2)$ を掛けるだけで、これは絶対値がちょうど 1 の数なので、$U$ は任意の $\Delta t$ でユニタリです：増大も減衰もせず、$U$ は $H$ の関数なので $\langle H\rangle$ も保存されます。その位相 $2\arctan(E\Delta t/2)$ は厳密な $E\Delta t$ と 1 ステップあたり $\mathcal O(E^3\Delta t^3)$ の差しかないので、2 次精度です。また陰的なので任意の $\Delta t$ で安定です（大きなステップは精度が落ちるだけで、不安定にはなりません）。陽的 Euler 法は代わりに $1 - iE\Delta t$ を掛け、その絶対値は $\sqrt{1 + E^2\Delta t^2} > 1$ です；$E \sim 2/dx^2$ の硬い格子モードが数十ステップで発散します（赤い曲線）。三つの波束は振幅が異なります；硬い $g\,x^4$ のばねにより大きな波束ほど速く振動し、エネルギー準位が等間隔でなくなるため位相がずれて（デフェージング）広がり形を失います。一方、小さな波束は非調和性をほとんど感じません。$g = 0$ を試してください：三つとも周期 $2\pi$ で一緒に振動し、決して広がりません（コヒーレント状態）。量子トンネル効果の分割ステップ FFT 法（もう一つのユニタリな 2 次スキーム）と比べてみてください。
meanings:
- 非調和井戸 $\tfrac12x^2 + g\,x^4$：振動周期が振幅に依存する
- 運動エネルギー $-\tfrac12\,D2$ と対角上の $V$；箱の端は壁
- 各列 $b$ に一つのガウス波束、$x_{0,b}$ から静止状態で放す
- $I \pm \tfrac{i\Delta t}{2}H$、ループの前に一度だけ作る
- 一度だけ分解（$\mathcal O(N^3)$）；以後各ステップは $\mathcal O(N^2)$ だけ
- 繰り返し添字 $y$ ⇒ 和：右辺を作り、全列に二回の三角求解
- 比較用の陽的 Euler 法：各固有成分が 1 ステップごとに $\sqrt{1 + E^2\Delta t^2}$ 倍に増大
- 繰り返し添字 $x, y$ ⇒ 和：各波束のエネルギー、厳密に保存
labels:
  g: 4 次項の強さ $g$
  x0: 最大初期位置 $x_0$
  t_max: シミュレーション時間
  dt: 時間刻み $\Delta t$
  n_grid: 格子点数
