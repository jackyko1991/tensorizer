<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Diffraction grating: a plane wave of wavelength lambda hits N slits spaced d apart; parallel rays leave at angle theta, neighbours differing in path by d sin theta (amber)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <line x1="24" y1="36" x2="24" y2="142" stroke="#93c5fd" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="142" stroke="#93c5fd" stroke-width="2"/>
    <line x1="56" y1="36" x2="56" y2="142" stroke="#93c5fd" stroke-width="2"/>
    <line x1="72" y1="36" x2="72" y2="142" stroke="#93c5fd" stroke-width="2"/>
    <line x1="16" y1="30" x2="80" y2="30" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="24" font-style="italic" fill="#b91c1c">λ</text>
    <line x1="92" y1="20" x2="92" y2="45" stroke="#374151" stroke-width="4"/>
    <line x1="92" y1="55" x2="92" y2="71" stroke="#374151" stroke-width="4"/>
    <line x1="92" y1="81" x2="92" y2="97" stroke="#374151" stroke-width="4"/>
    <line x1="92" y1="107" x2="92" y2="123" stroke="#374151" stroke-width="4"/>
    <line x1="92" y1="133" x2="92" y2="146" stroke="#374151" stroke-width="4"/>
    <line x1="92" y1="50" x2="178.3" y2="7.9" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="92" y1="76" x2="178.3" y2="33.9" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="92" y1="102" x2="178.3" y2="59.9" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="92" y1="128" x2="178.3" y2="85.9" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="92" y1="102" x2="102.2" y2="123" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="92" y1="128" x2="102.2" y2="123" stroke="#f59e0b" stroke-width="3"/>
    <line x1="92" y1="128" x2="152" y2="128" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M132,128 A40,40 0 0 0 128,110.5" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="136" y="124" font-style="italic" fill="#b45309">θ</text>
    <text x="76" y="68" font-style="italic">d</text>
  </g>
</svg>
