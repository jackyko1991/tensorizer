source_hash: 79a2f1fd310e
title: El fondo cósmico de microondas como cuerpo negro perfecto (COBE FIRAS)
summary: El instrumento FIRAS de COBE midió el fondo cósmico de microondas en 43 frecuencias y encontró el cuerpo negro más perfecto jamás observado. Un lote de cuatro modelos (ley de Planck sola, con un potencial químico de Bose–Einstein $\mu$, con una distorsión Compton $y$, con ambos) se ajusta a la tabla real de FIRAS en un solo tensor, con el jacobiano obtenido por autograd. El ajuste da $T \approx 2.725$ K con $\chi^2 \approx 45$ para 42 grados de libertad, residuos por debajo de $10^{-4}$ del pico, distorsiones compatibles con cero ($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$) y, a partir de $T$, unos 411 fotones por cm³.
notes: 'En 1990 FIRAS (el Far-Infrared Absolute Spectrophotometer del satélite COBE de la NASA) comparó el cielo con un calibrador externo de cuerpo negro y no encontró ninguna diferencia; el espectro final (Fixsen et al. 1996) se desvía de una curva de Planck en menos de 50 partes por millón del pico. John Mather y George Smoot compartieron el Premio Nobel de Física de 2006 «por su descubrimiento de la forma de cuerpo negro y la anisotropía de la radiación del fondo cósmico de microondas». Un cuerpo negro tan perfecto significa que el universo primitivo era caliente, denso y estaba en equilibrio térmico: la energía liberada después del corrimiento al rojo $z \sim 2\times10^6$ habría dejado un potencial químico $\mu$ (espectro de Bose–Einstein, $z \gtrsim 2\times10^5$) o una distorsión Compton $y$ (electrones calientes que dan energía a los fotones, $z \lesssim 5\times10^4$; la misma forma que el efecto Sunyaev–Zel''dovich, con su nulo en $x = 3.83$, es decir 217 GHz, y conserva el número
  de fotones). Nuestro ajuste, solo con los errores diagonales, da límites al 95 % de aproximadamente $|\mu| < 7\times10^{-5}$ y $|y| < 6\times10^{-6}$; los límites publicados de FIRAS, $|\mu| < 9\times10^{-5}$ y $|y| < 1.5\times10^{-5}$, son más amplios porque usan la covarianza correlacionada completa e incluyen incertidumbres sistemáticas (calibración y emisión galáctica). La temperatura debe leerse con cuidado: el ajuste fija $T$ a unos $10^{-5}$ K estadísticamente, pero la escala absoluta procede de la termometría del calibrador, y la tabla de LAMBDA escribe el espectro como un cuerpo negro de 2.725 K más los residuos publicados, de modo que $T = 2.725$ K viene incorporado; el mejor valor absoluto actual es $2.72548 \pm 0.00057$ K (Fixsen 2009). De $T$ se siguen $n_\gamma \approx 411$ cm$^{-3}$ y $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$. En la animación, el panel izquierdo muestra el ajuste convergiendo desde la estimación inicial (barras de error ampliadas 400 veces, como en el
  famoso gráfico, pues de lo contrario serían invisibles); el panel derecho amplía después los residuos en unidades de $10^{-4}$ del pico, con las formas que dejarían un $\mu$ o un $y$ en nuestro límite del 95 % tras reajustar $T$. Datos: Tabla 4 de D. J. Fixsen et al., ApJ 473, 576 (1996), del archivo LAMBDA de la NASA (https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt), de dominio público, incluida como data/firas_monopole.csv.'
meanings:
- los 43 números de onda de FIRAS (cm$^{-1}$), intensidades y errores a $1\sigma$ (MJy/sr)
- una fila $(T, \mu, y)$ por cada modelo $b$ del lote
- $h\nu/kT$ mediante broadcasting de $(B,1)$ frente a $(F,)$
- ocupación de Bose–Einstein más el término $y$ de Kompaneets, multiplicada por $2hc\tilde\nu^3$
- 'autograd de $\sum_b I_{bf}$: las filas son independientes, así que una sola llamada da el jacobiano de cada modelo'
- '$f$ repetido ⇒ sumado: la matriz de Fisher; su inversa es la covarianza'
- un paso de Levenberg–Marquardt para todos los modelos a la vez
- bondad del ajuste por modelo
labels:
  T_init: Estimación inicial de $T$
  steps: Pasos de Levenberg–Marquardt
