source_hash: a93d458517c4
title: コーネルボックスのモンテカルロ・パストレーシング
summary: フォトリアルなレンダリングは、レンダリング方程式をモンテカルロ法で解きます。すべてのサンプルのすべてのカメラレイを、平面と球でできた箱の中で 1 つのバッチとして追跡します。コサイン重み付きの反射、各交点から面光源へのシャドウレイ、パスを終わらせるロシアンルーレット。ノイズが $1/\sqrt{N}$ で減っていく様子と、赤と緑の壁の色が白い壁ににじむ様子を見てください。後者は大域照明でしか捉えられません。
notes: 拡散（ランバート）面のレンダリング方程式は、ある点から出る光がその放射と、入射光全体の反射率 $\rho$ 分との和であると述べます。入射光はまた別の面からの出射光なので、積分は再帰します。パストレーサはこれをランダムなパスで置き換えます。コサイン重み付きサンプリング（$p = \cos\theta/\pi$）は BRDF とコサインを打ち消すので、スループットは反射 1 回ごとに係数 $\rho$ を掛けるだけになります。各交点では光源上のランダムな点へのシャドウレイで直接光を加えます（ネクストイベント推定）。小さな光源に反射がたまたま当たるのを待つよりはるかにノイズが少なくなります。最初の交点からの光だけを使うと直接光のみの画像になります。それ以降の反射はすべて間接光を加えます：影の中の柔らかな補助光、より明るい天井、赤と緑の色にじみ。テストスイートのファーネステストが推定量を検証します。すべての壁が $L_e$ を放射し $\rho$ を反射する閉じた箱では、放射輝度はどこでも $L_e/(1-\rho)$ でなければなりません。コサインサンプリングではこれが分散ゼロで得られます。各画素は $N$ 個の独立なサンプルの平均なので、誤差は $1/\sqrt N$ で減ります。ノイズを半分にするにはサンプルが 4 倍必要で、だからこそプロダクションのレンダラはデノイザーを使います。
meanings:
- レイ $r = (s, p)$ の原点と方向：$P$ 個の画素それぞれに $N$ 個のジッタ付きサンプル、まとめて 1 バッチ
- 平面 $p$ は $n_{pi} x_i = d_p$、バウンディングボックスで切り取る。光源は小さな平面
- すべてのレイからすべての平面までの距離。$i$、$j$ が繰り返し ⇒ 和をとる
- すべてのレイと球についての $\lvert o + t\omega - c\rvert^2 = r^2$ の根
- 各レイに沿った最も近い交点：どのプリミティブか、どこか、その法線
- 次の方向：円板上の一様な点を半球へ持ち上げる。$f\cos\theta/p = \rho$
- パスのスループット：反射 $k$ で見つかった光のうちカメラに届く割合
- ネクストイベント推定：面光源上のランダムな点 $y$ へのシャドウレイ
- ロシアンルーレット：暗いパスをランダムに打ち切り、生き残りの重みを付け直すので平均は変わらない
- 画素の色：サンプル添字 $s$ についての平均
labels:
  resolution: 画像サイズ
  spp: 画素あたりのサンプル数 $N$
  reference_spp: 参照画像の画素あたりサンプル数
  bounces: 反射回数（ルーレット前）
  termination: パスの打ち切り
  light_power: 光源の放射輝度 $L_e$
