title: टेंसर अद्यतनों के तरंगाग्र के रूप में अनुक्रम संरेखण
summary: गतिक प्रोग्रामन से DNA अनुक्रमों का नीडलमैन–वुन्श (वैश्विक) और स्मिथ–वॉटरमैन (स्थानीय) संरेखण। तालिका के हर खाने को केवल अपने बाएँ, ऊपर और विकर्ण पड़ोसियों की ज़रूरत होती है, इसलिए पूरा प्रति-विकर्ण $i + j = d$ एक टेंसर अद्यतन में, अनुक्रम युग्मों के एक बैच के लिए एक साथ, भरा जाता है। तरंगाग्र को तालिका पर फैलते देखें, फिर ट्रेसबैक को इष्टतम संरेखण पढ़ते देखें।
notes: 'वैश्विक संरेखण दोनों अनुक्रमों को सिरे से सिरे तक संरेखित करने को बाध्य करता है; स्थानीय संरेखण विकल्प 0 जोड़ता है, इसलिए खराब खंड बस छोड़ दिया जाता है और कहीं भी सबसे अधिक स्कोर वाला टुकड़ा बताया जाता है (यहाँ यादृच्छिक पृष्ठभूमि में रोपा गया एक मोटिफ़)। ट्रेसबैक अंतिम खाने से पीछे चलता है, हर चरण पर पूछता है कि तीन विकल्पों में से किसने संग्रहीत मान दिया, और रिक्ति के अंदर रहते हुए तालिकाओं $H$, $E$, $F$ के बीच स्विच करता है। लागत अब भी $O(nm)$ खाने है, पर केवल $n + m - 1$ क्रमिक चरण: GPU और SIMD संरेखक इसी प्रति-विकर्ण समांतरता से काम करते हैं। उत्परिवर्तन दर बढ़ाकर, या कई छोटी रिक्तियों के बजाय कुछ लंबी रिक्तियों को वरीयता देने के लिए $g_o > g_e$ आज़माएँ। प्रोटीन $W$ के स्थान पर BLOSUM62 जैसा $20\times20$ आव्यूह प्रयोग करते हैं; और कुछ नहीं बदलता।'
meanings:
- युग्म $b$ के पहले अनुक्रम का अक्षर $i$ और दूसरे का $j$, A, C, G, T पर one-hot
- 'अक्षर $\alpha$ को $\beta$ के साथ संरेखित करने का स्कोर: विकर्ण पर मेल, अन्यत्र बेमेल'
- 'दोहराए गए $\alpha, \beta$ ⇒ योग: अक्षरों के हर संभव युग्मन का स्कोर'
- $k$ अक्षरों की रिक्ति की लागत $g_o + (k-1)\,g_e$ (affine); $g_o = g_e$ रैखिक रिक्ति है
- प्रति-विकर्ण $d$ के सभी खाने; वे केवल विकर्णों $d-1$ और $d-2$ पर निर्भर हैं
- 'प्रति विकर्ण एक टेंसर अद्यतन: मेल पर, $a$ में रिक्ति पर, $c$ में रिक्ति पर समाप्त होने वाला सबसे अच्छा स्कोर'
- कोने पर वैश्विक स्कोर, सबसे अच्छे खाने पर स्थानीय स्कोर; हर लंबाई से आगे की पैडिंग अनदेखी की जाती है
labels:
  mode: संरेखण (वैश्विक = नीडलमैन–वुन्श, स्थानीय = स्मिथ–वॉटरमैन)
  length: अनुक्रम लंबाई $L$
  n_pairs: बैच में युग्म $B$
  mutation: प्रति स्थल उत्परिवर्तन दर
  match: मेल स्कोर
  mismatch: बेमेल स्कोर
  gap_open: रिक्ति आरंभ $g_o$
  gap_extend: रिक्ति विस्तार $g_e$
