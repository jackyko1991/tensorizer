source_hash: f581627e3195
title: 箱の中の粒子
summary: 時間に依存しないシュレーディンガー方程式は、格子上では行列の固有値問題 $H_{ij}\psi_j = E\psi_i$ になる。torch.linalg.eigh が定常状態を与え、それらの重ね合わせは、各状態に位相 $e^{-iE_n t}$ をつけて einsum で足し合わせることで時間発展する。
notes: 単位 $\hbar = m = 1$。厳密なエネルギーは $E_n = n^2\pi^2/(2L^2)$ であり、格子は低いエネルギーを 1 パーセントのごく一部の精度で再現する。各固有状態は位相を獲得するだけなので、$\lvert c_n\rvert$ とノルムは決して変わらない——$\lvert\psi\rvert^2$ の揺れ動きは純粋に状態間の干渉である。リバイバル時間 $T = 4L^2/\pi$ の後にはすべての位相 $e^{-iE_n t}$ が 1 に戻り、初期状態が厳密に再現される。薄い破線は最低の定常状態 $\varphi_n(x)$ である。
meanings:
- $N$ 個の内部格子点上のハミルトニアン行列 $-\tfrac12\,D2$（壁：$\psi = 0$）
- 差分による $d^2/dx^2$：$(\psi_{x-1} - 2\psi_x + \psi_{x+1})/dx^2$
- エネルギーと固有ベクトル（第 $n$ 列が状態 $n$）
- 初期状態を固有基底に射影（繰り返される $x$ ⇒ 和をとる）
- 繰り返される $n$ ⇒ 和をとる：位相のついた成分から $\psi$ を再構成
labels:
  initial: 初期状態
  n_states: 重ね合わせる状態数
  L: 箱の幅
  n_grid: 格子点数
  revivals: シミュレーション時間
