title: 'The projection postulate: one high-dimensional state, many shadows'
category: cosmology
level: advanced
order: 13
tags: [series:projection-hypothesis:1, role:postulate, speculative]
summary: >
  A speculative hypothesis, not established physics: the universe is one state $\Psi$ in a space of very many
  dimensions $D$, and what an observer measures is its projection onto a few. This step states the postulates and
  checks their mathematics. The visible fraction $\|P\Psi\|^2$ follows Beta$(d, D-d)$, and a measurement is modelled
  as a race between hidden blocks. One hidden complex dimension per outcome gives exactly the Born rule; more give a
  deviation that triple-slit experiments rule out. So far the idea reproduces quantum mechanics rather than going
  beyond it.
animated: true
vector_form: '\psi = \frac{P\Psi}{\|P\Psi\|},\qquad \|P\Psi\|^2 \sim \mathrm{Beta}(d,\,D-d),\qquad k^* = \arg\max_k \frac{|c_k|^2}{E_k},\quad E_k = \|h_k\|^2 \sim \Gamma(m),\qquad P(k) = \int_0^\infty f_m(t;|c_k|^2)\prod_{j\neq k} Q\big(m, |c_j|^2 t\big)\,dt \;\overset{m=1}{=}\; |c_k|^2,\qquad D \geq 2^N,\qquad \kappa = \frac{\varepsilon_{ABC}}{|I_{AB}|+|I_{AC}|+|I_{BC}|}'
index_form: 'q_{tD} = \frac{\sum_{i\leq d}|z_{ti}|^2}{\sum_{i\leq D}|z_{ti}|^2},\qquad E_{tkm} = \sum_{l\leq m}|h_{tkl}|^2,\qquad P_{mk} = \int ds\; e^{\,m\ln(w_k t) - w_k t - \ln\Gamma(m) + \sum_{j} \ln Q(m, w_j t) - \ln Q(m, w_k t)},\qquad \psi_{Sx} = O_{Ss}\,\phi_{sx},\qquad \kappa = \frac{\varepsilon}{\delta}'
