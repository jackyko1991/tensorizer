source_hash: 6cf1e64854dc
title: 电容器充电（RC 电路）
summary: 通过电阻充电的电容器满足 $dV/dt = (V_s - V)/(RC)$。几个电阻不同的电路叠成一个电压张量，因此一步龙格–库塔即可同时推进所有电路。把电源切换为方波，可观察电容器的充电和放电。
notes: 单位：$R$ 以 kΩ 计，$C$ 以 mF 计，因此 $\tau = RC$ 以秒计，$I$ 以 mA 计。经过一个时间常数，电容器电压达到电源电压的 63 %，经过 $5\tau$ 后基本充满。用电池充电时，电源提供的能量为 $CV_s^2$：恰好一半储存在电容器中，另一半在 $R$ 上转化为热——与 $R$ 的大小无关。
meanings:
- 电容器 $b$ 两端的电压（每个电路一项）
- 电路 $b$ 的电阻
- 电容，所有电路相同
- 电源电压，所有电路共用（对 $b$ 广播）
- 逐元素运算：指标 $b$ 在两边各出现一次，不求和
- 通过各电阻的电流
- 各电容器储存的能量
labels:
  V_s: 电源电压
  C: 电容
  R_min: 最小电阻
  R_max: 最大电阻
  n_circuits: 电路数
  source: 电源
  period: 方波周期
  t_max: 模拟时长
