<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Light rays crossing three layers with refractive indices n1, n2 and n3: rays bend toward the normal in the denser middle layer, and the steeper ray is totally internally reflected at the bottom interface">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <rect x="10" y="12" width="220" height="43" fill="#93c5fd" fill-opacity="0.25"/>
    <rect x="10" y="55" width="220" height="50" fill="#93c5fd" fill-opacity="0.6"/>
    <line x1="10" y1="55" x2="230" y2="55" stroke="#374151" stroke-width="1.5"/>
    <line x1="10" y1="105" x2="230" y2="105" stroke="#374151" stroke-width="1.5"/>
    <line x1="60" y1="25" x2="60" y2="85" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M60,35 A20,20 0 0 0 47.1,39.7" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M60,75 A20,20 0 0 0 69.6,72.5" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M23.9,12 L60,55 L87.5,105 L139.6,147" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/>
    <path d="M70,30 L110,55 L151.2,105 L192.4,55 L216.4,40" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/>
    <text x="66" y="33" font-style="italic" fill="#b45309">θ</text>
    <text x="74" y="36" fill="#b45309" font-size="10">1</text>
    <text x="43" y="83" font-style="italic" fill="#b45309">θ</text>
    <text x="51" y="86" fill="#b45309" font-size="10">2</text>
    <text x="14" y="42.5" font-style="italic">n</text>
    <text x="22" y="45.5" font-size="10">1</text>
    <text x="14" y="85" font-style="italic">n</text>
    <text x="22" y="88" font-size="10">2</text>
    <text x="14" y="131.5" font-style="italic">n</text>
    <text x="22" y="134.5" font-size="10">3</text>
  </g>
</svg>
