source_hash: 79a2f1fd310e
title: 完全な黒体としての CMB（COBE FIRAS）
summary: COBE の FIRAS 装置は宇宙マイクロ波背景放射を 43 の周波数で測定し、これまでに観測された中で最も完全な黒体を見いだした。4 つのモデル（プランクの法則のみ、ボース–アインシュタイン化学ポテンシャル $\mu$ を加えたもの、コンプトン $y$ 歪みを加えたもの、両方を加えたもの）のバッチを 1 つのテンソルで実際の FIRAS 表にフィットし、ヤコビアンは自動微分で求める。フィットの結果は $T \approx 2.725$ K、自由度 42 に対して $\chi^2 \approx 45$、残差はピークの $10^{-4}$ 未満、歪みはゼロと矛盾せず（$|\mu| \lesssim 10^{-4}$、$|y| \lesssim 10^{-5}$）、$T$ から 1 cm³ あたり約 411 個の光子が得られる。
notes: 1990 年、FIRAS（NASA の COBE 衛星に搭載された遠赤外絶対分光光度計）は天空を外部の黒体較正源と比較し、差を見いださなかった。最終スペクトル（Fixsen et al. 1996）のプランク曲線からのずれはピークの 100 万分の 50 未満である。John Mather と George Smoot は「宇宙マイクロ波背景放射の黒体形状と異方性の発見」により 2006 年のノーベル物理学賞を共同受賞した。これほど完全な黒体は、初期宇宙が高温・高密度で熱平衡にあったことを意味する。赤方偏移 $z \sim 2\times10^6$ 以降に放出されたエネルギーは、化学ポテンシャル $\mu$（ボース–アインシュタイン・スペクトル、$z \gtrsim 2\times10^5$）またはコンプトン $y$ 歪み（高温電子が光子のエネルギーを押し上げる、$z \lesssim 5\times10^4$；スニヤエフ–ゼルドビッチ効果と同じ形で、$x = 3.83$ すなわち 217 GHz にゼロ点を持ち、光子数を保存する）を残したはずである。対角誤差のみを用いた我々のフィットでは、95 % 上限はおよそ $|\mu| < 7\times10^{-5}$ と $|y| < 6\times10^{-6}$ となる。FIRAS が公表した上限 $|\mu| < 9\times10^{-5}$ と $|y| < 1.5\times10^{-5}$ がより広いのは、相関を含む完全な共分散行列を用い、系統的（較正および銀河系）不確かさを含めているためである。温度の読み取りには注意が必要だ。フィットは統計的には $T$ を約 $10^{-5}$ K の精度で決めるが、絶対スケールは較正源の温度測定に由来し、しかも LAMBDA の表はスペクトルを 2.725 K の黒体に公表された残差を加えた形で記載しているため、$T = 2.725$ K は最初から組み込まれている。現在最良の絶対値は $2.72548 \pm 0.00057$ K（Fixsen 2009）である。$T$ から $n_\gamma \approx 411$ cm$^{-3}$ と $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$ が導かれる。アニメーションでは、左のパネルが初期推定値からフィットが収束する様子を示し（誤差棒は有名な図と同様に
  400 倍に拡大。そうしないと見えない）、続いて右のパネルがピークの $10^{-4}$ を単位として残差を拡大し、我々の 95 % 上限にある $\mu$ または $y$ が $T$ を再フィットした後に残す形を示す。データ：D. J. Fixsen et al., ApJ 473, 576 (1996) の表 4、NASA の LAMBDA アーカイブ（https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt）より取得、パブリックドメイン、data/firas_monopole.csv として同梱。
meanings:
- 43 個の FIRAS 波数（cm$^{-1}$）、強度と $1\sigma$ 誤差（MJy/sr）
- バッチ内のモデル $b$ ごとに 1 行の $(T, \mu, y)$
- $h\nu/kT$：$(B,1)$ と $(F,)$ のブロードキャストによる
- ボース–アインシュタイン占有数に Kompaneets の $y$ 項を加え、$2hc\tilde\nu^3$ を掛けたもの
- $\sum_b I_{bf}$ の自動微分：各行は独立なので、1 回の呼び出しで全モデルのヤコビアンが得られる
- 繰り返される $f$ ⇒ 和をとる：フィッシャー行列。その逆行列が共分散行列
- 全モデルに対して同時に行う Levenberg–Marquardt の 1 ステップ
- モデルごとの適合度
labels:
  T_init: $T$ の初期推定値
  steps: Levenberg–Marquardt ステップ数
