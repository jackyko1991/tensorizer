source_hash: 7c33ee10a4e7
title: Обратное проектирование металинзы
summary: Плоская метаповерхность из субволновых метаатомов накладывает на свет фазу $\varphi(x)$. Свет распространяется методом углового спектра (одно БПФ), а autograd с Adam настраивает каждый метаатом, чтобы направить как можно больше мощности в фокальное пятно, начиная с плоской поверхности. Результат сравнивается с аналитической гиперболической линзой, а проектирование сразу для двух длин волн (пакет) показывает хроматический компромисс.
notes: 'Аналитическая металинза приводит все пути от линзы к фокусу в фазу, $\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$, свёрнутую в $[0, 2\pi)$, потому что метаатом может задержать свет не более чем на одну волну (видимые металинзы такого типа продемонстрировали Khorasaninejad et al., Science 2016). Здесь оптимизатору формулу не дают: он начинает с плоской поверхности, вычисляет мощность в фокальном пятне $\eta$ пропагатором на основе БПФ и получает градиент по фазам всех метаатомов за один обратный проход — ту же информацию, что даёт метод сопряжённых уравнений в фотонном обратном проектировании. Для одной длины волны и одной фокальной точки лучшая фаза близка к гиперболической, и оптимизатор заново её находит (он может немного превзойти её по $\eta$, потому что пятно имеет конечную ширину, а скалярный пропагатор не совпадает в точности с лучевой картиной). Интересный случай — две длины волны: в модели каждый метаатом добавляет фиксированный оптический путь, свёрнутый в одну волну, поэтому
  при $\lambda_1 \neq \lambda_0$ фаза масштабируется на $\lambda_0/\lambda_1$, и свёртки больше не совпадают. Гиперболическая линза тогда фокусирует красный свет на другом расстоянии (дифракционная хроматическая аберрация). При проекте ''dual'' обе длины волны делят функцию потерь, и оптимизатор находит компромисс: лучше на $\lambda_1$, хуже на $\lambda_0$. Упрощения: скалярный одномерный свет, фазовая маска тонкого элемента (каждый метаатом — идеальный фазовращатель без связи с соседями), идеальное пропускание, модельная дисперсия и периодические границы. Реальное обратное проектирование решает уравнения Максвелла для метаатомов; дифференцируемые модели целых камер на метаповерхностях обучались сквозным образом Tseng et al. («Neural nano-optics», Nature Communications 2021), а Li et al. сделали обзор обратно спроектированных метаповерхностей (ACS Photonics 2022). Ширина полосы, которую плоская линза может сфокусировать одновременно, имеет фундаментальные пределы (Presutti & Monticone, Optica
  2020).'
meanings:
- 2048 точек сетки ($\Delta x = 0.05$ мкм) и их волновые числа БПФ
- 'проектная переменная: фазовая задержка каждого метаатома в волнах при $\lambda_0$, одно значение на атом 0.25 мкм'
- фаза на длине волны $\lambda_l$; $l$ — пакет из двух длин волн
- 'комплексное: мнимое (затухающее) для эванесцентных компонент $|k_x| > k$'
- повторяющийся $x$ ⇒ суммирование, выполняется за $O(X\log X)$ через БПФ
- поле на всех длинах волн и расстояниях сразу, трансляцией передаточной функции
- 'повторяющийся $x$ ⇒ суммирование: мощность внутри фокального пятна $|x| < \lambda_l f / D$'
- 'autograd через БПФ: метод сопряжённых уравнений бесплатно'
labels:
  design: Проект для обеих длин волн (dual) или только для $\lambda_0$
  wavelength: Проектная длина волны $\lambda_0$
  wavelength2: Вторая длина волны $\lambda_1$
  focal_length: Фокусное расстояние $f$
  diameter: Диаметр линзы $D$
  n_iter: Итерации Adam
  lr: Скорость обучения Adam (волн на шаг)
