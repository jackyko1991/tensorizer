title: Импульс на стыке струн
summary: Две струны с разной линейной плотностью связаны узлом. Импульс, пришедший слева, на узле разделяется на отражённый и прошедший импульсы, амплитуды которых задаются волновыми сопротивлениями $Z = \sqrt{T\mu}$. Вторая производная — одномерная свёртка с шаблоном $(1, -2, 1)$.
notes: 'Узел не может разорваться, поэтому $u$ непрерывно, и он невесом, поэтому поперечные силы $T u_x$ с обеих сторон уравновешены. Эти два условия дают $R$ и $\mathcal T$. Более тяжёлая правая струна ($Z_2 > Z_1$) отражает импульс перевёрнутым, как закреплённый конец; более лёгкая отражает его неперевёрнутым, как свободный конец. Прошедший импульс всегда неперевёрнутый и движется со скоростью $c_2 = \sqrt{T/\mu_2}$, поэтому он сжимается или растягивается в $c_2/c_1$ раз. Энергия, переносимая импульсом, пропорциональна $Z\,A^2$, что даёт баланс потоков $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$. Единицы: $T = 1$, $\mu_1 = 1$, струна от $-1$ до $1$. Серые штриховые линии отмечают предсказанные амплитуды. Следите за более быстрой струной: её импульс достигает дальней стенки и отражается обратно.'
meanings:
- смещение в точке сетки $i$; оба дальних конца закреплены
- 'масса на единицу длины: $\mu_1$ слева, $\mu_2$ справа, среднее на узле'
- 'повторяющийся $j$ ⇒ суммирование: шаблон скользит вдоль струны'
- волновое сопротивление струны $k$
- отношения амплитуд из непрерывности $u$ и силы $T\,u_x$ на узле
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$, сохраняется
labels:
  mu_ratio: Отношение плотностей $\mu_2/\mu_1$
  width: Ширина импульса
  t_max: Время моделирования
  n_points: Точки сетки
