title: 사영 경주의 벨 검증
summary: 이것은 확립된 물리학이 아닌 추측적 가설이다. 두 얽힌 입자는 하나의 공유 상태 $\Psi$ 이며, 이 상태는 $D$ 차원에 있다. 각 측정은 사영이고, 그 뒤에 1단계의 경주가 이어진다. $\Psi$ 위에서 결합하여, 즉 전체 공간 속 하나의 사건으로 실행하면, 이 경주는 양자역학의 $E = -\cos\theta$ 와 CHSH 값 $S = 2\sqrt2$ 를 정확히 준다. 각 당사자의 국소적 숨은 좌표 위에서 따로 실행하면, 이는 $S\leq2$ 인 국소 숨은 변수 모형이 되며, 허점 없는 벨 검증이 이를 배제한다. 결과마다 숨은 차원이 둘 이상인 경주는 Tsirelson 한계를 깨고 빛보다 빠른 신호 전달을 허용한다.
notes: '사영 가설의 5단계(시리즈 설명 참조)로, 확립된 물리학이 아닌 저자의 추측적 가설이다. 1단계(cosmology/projection_postulate)의 공준 P1(사영)과 P2(사건)를 얽힘에 대해 검증한다. 4단계(cosmology/projection_singularity_fold)는 기하를, 6단계(cosmology/projection_telescope_tests)는 관측을 다룬다. 공유 상태의 차원 $D$ 는 열려 있다. 이는 매개변수이며, 어떤 결과도 이에 의존하지 않는다. 먼저 알려진 물리학부터. 단일항은 $E(a,b) = -a\cdot b = -\cos\theta$ 를 준다. Bell(1964)과 Clauser, Horne, Shimony, Holt(1969)는 모든 국소 숨은 변수 모형에 대해 $S\leq2$ 임을 증명했으며, 양자역학은 Tsirelson 한계 $S = 2\sqrt2$ 에 도달한다. 가설: 하나의 공유된 $\Psi$ 가 있다(P0, P3). 각 당사자의 측정은 사영과 1단계의 경주로 이루어지며, 여기서 $\|P_k\Psi\|^2/E_k$ 가 가장 큰 결과가 일어나고, $E_k$ 는 $m$ 개의 숨은 복소 좌표($\Psi$ 의 좌표)에 담긴 에너지이다. (i) 결합 모형: 경주는 네 개의 결합 결과에 대해 한 번만 실행되며, 가중치는 $\|(P^a_i\otimes P^b_j)\Psi\|^2$ 이다. 3차원에서는 비국소적이지만, $D$ 차원에서는 단일 사건이다. $m = 1$(1단계에서 살아남은 유일한 값)일 때 이것은 양자역학을 정확히 재현한다. 닫힌 형태의 $E = -\cos\theta$ 가 $10^{-15}$ 까지 일치하고, $\Psi$($\mathbb C^D$ 안의)에서 출발한 몬테카를로도 통계 오차 안에서 일치한다. 최적 설정에서 $S = 2\sqrt2$ 이고, 2000 개의 무작위 설정에서의 최댓값은 이보다 낮으며, Alice 의 주변 분포는 Bob 의 설정에 의존하지 않는다(신호 전달 없음). (ii) 국소
  모형: 각 당사자는 자신의 숨은 에너지와 원천에서 정해진 숨은 방향 $n$ 만으로, 즉 가중치 $(1\pm a\cdot n)/2$ 로 경주한다. 이것은 국소 숨은 변수 모형이므로 $S\leq2$ 가 보장된다. $m = 1$ 은 $E = -\cos\theta/3$ 을 주고(최대 $S\approx0.93$), $m\to\infty$ 는 Bell 자신의 결정론적 모형 $E = -(1-2\theta/\pi)$ 로서 정확히 $S = 2$ 에 도달한다. Born 규칙을 넘어서: $m\neq1$ 인 결합 경주는 양자역학이 아니다. $m > 1$ 이면 Tsirelson 한계를 깬다($S = 3.85$, $m = 3$ 일 때; PR 상자의 값 4 로 다가간다). 부분적으로 얽힌 상태에서는 Alice 의 통계가 Bob 의 설정에 의존하게 되며, 이는 빛보다 빠른 신호 전달이다($dS/dm = 1.34$, 신호 전달 $\approx0.18\,|m-1|$). 따라서 $m = 1$ 은 삼중 슬릿 데이터뿐 아니라 상대론적 인과율에 의해서도 요구된다. 데이터(data/bell_tests.csv, 인용한 수치는 초록에서 가져옴). Hensen et al.(Nature 526, 682, 2015): 1.3 km 떨어진 NV 스핀, $S = 2.42\pm0.20$, $p = 0.039$. 그들의 두 번째 실험(Sci. Rep. 6, 30289, 2016): $S = 2.35\pm0.18$. Giustina et al. 과 Shalm et al.(Phys. Rev. Lett. 115, 250401 and 250402, 2015): 광자, CH–Eberhard 부등식, $p\leq3.74\times10^{-31}$ 및 $2.3\times10^{-7}$. Rosenfeld et al.(Phys. Rev. Lett. 119, 010402, 2017): 398 m 떨어진 원자, $S = 2.221\pm0.033$. Storz et al.(Nature 617, 265, 2023): 30 m 떨어진 초전도
  큐비트, $S = 2.0747\pm0.0033$, 2 보다 22.6$\sigma$ 높음. 판정: 모형 (ii), 그리고 그와 함께 경주의 모든 국소적 버전은 배제된다. 모형 (i)은 모든 검증과 일치하지만, 그것은 단지 양자역학을 다시 쓴 것이기 때문이며, 새로운 예측은 하지 않는다. 1단계가 여전히 허용하는 편차($|m-1|\leq6\times10^{-3}$)는 $S$ 를 최대 $8\times10^{-3}$ 만큼 이동시킨다. 이는 Storz 의 $\sigma_S$ 보다 크지만, 측정된 $S$ 값은 $2\sqrt2$ 보다 한참 아래에 있고(가시도 0.73), 알려지지 않은 가시도가 그런 이동을 흡수해 버린다. 그것을 볼 수 있는 것은 $E(\theta)$ 의 모양(잔차 $\leq1.5\times10^{-3}$)이나 직접적인 무신호 검증($\leq10^{-3}$)뿐이다. 위키백과: 벨 정리, CHSH 부등식.'
meanings:
- 단위 벡터 $n$ 방향의 스핀 사영 연산자로, Pauli 행렬에 대한 einsum 으로 구성한다
- '각 결합 결과의 가중치: 큐비트 지표 $x, y, u, v$ 에 대해 합한다'
- 상관 함수, 결과 부호 $s = (+1, -1)$ 에 대해 합한다
- 네 결과에 대한 결합 경주; $l$ 에 대한 합($l = k$ 제외)은 다른 결과들에 대한 곱이다; $m = 1$ 이면 $P = w$ 이다
- $\Psi$ 의 표본에서 읽은 숨은 블록 에너지; 표본은 $\mathbb C^D$ 의 구면 위에서 균일하다
- '원천에서 정해지는 숨은 방향, 즉 $\Psi$ 의 세 실수 좌표: $S^2$ 위에서 균일하다(어떤 $D$ 에서도)'
- '국소 경주: 각 당사자는 자신의 가중치 $(1\pm a\cdot n)/2$ 로 경주한다; 공유된 $\nu$ 에 대해 평균한다'
- CHSH 값, 네 항 중 어느 항이 음의 부호를 갖는지에 대해 최대화한다
labels:
  D: 총 차원 $D$ (공유 상태 $\Psi$ 의 차원, 열려 있음)
  m_max: 결과당 숨은 차원 수의 최댓값 $m$
  settings: 무작위 측정 설정 수
  trials: 각도당 경주 사건 수(몬테카를로)
