source_hash: 9483d7c492cb
title: Кривые вращения галактик и тёмная материя
summary: 'Звёзды и газ вдали от центра галактики вращаются слишком быстро: реальные кривые вращения из базы SPARC остаются плоскими там, где видимая масса предсказывает кеплеровское падение. Одна пакетная подгонка через autograd, все галактики сразу, сравнивает четыре объяснения: только барионы (с отношением масса–светимость $\Upsilon$), барионы плюс гало тёмной материи NFW, барионы плюс гало Буркерта с ядром и MOND с единым ускорением $a_0$ (радиальное соотношение ускорений). Тёмная материя выводится из гравитации, а не обнаружена напрямую.'
notes: 'Данные: шесть галактик (NGC 3198, NGC 2403, NGC 6503, DDO 154, UGC 2885, NGC 7814) из SPARC (Lelli, McGaugh, Schombert 2016, AJ 152, 157), файл Rotmod_LTG, скопированы без изменений в data/sparc_rotation_curves.csv. Источник http://astroweb.cwru.edu/SPARC/, который просит ссылаться на статью SPARC; зеркало на Zenodo (doi:10.5281/zenodo.16284118) опубликовано под CC-BY-4.0. Отношения масса–светимость на 3,6 мкм имеют априорное распределение шириной 0,1 dex вокруг $\Upsilon_d = 0.5$, $\Upsilon_b = 0.7$ (поставьте 0, чтобы его выключить). Что показывает подгонка: ни одно разумное $\Upsilon$ не позволяет барионам достичь плоских внешних скоростей (DDO 154 потребовалось бы $\Upsilon_d \approx 19$, далеко за пределами любого звёздного населения), так что нужна невидимая масса или изменённая динамика, как нашли Рубин и Форд по оптическим спектрам в 1970-х. Обе формы гало подходят хорошо; карликовая DDO 154 предпочитает ядро (проблема каспа и ядра). Одно значение $a_0 \approx 1.1\times10^{-10}$
  м/с² удивительно хорошо описывает все галактики, как и утверждает радиальное соотношение ускорений. Честный статус: тёмная материя выводится по её гравитации (кривые вращения, линзирование, скопления, реликтовое излучение, образование структур); ни одна частица тёмной материи напрямую не обнаружена. MOND хорошо описывает кривые вращения одним параметром, но испытывает трудности со скоплениями галактик, скоплением Пуля и акустическими пиками реликтового излучения и не имеет общепринятой релятивистской версии. Расстояния и наклоны здесь фиксированы (их ошибки не учитываются), а MOND взят в простейшей алгебраической форме.'
meanings:
- наблюдаемые скорости и ошибки галактики $g$ на радиусе $r$, дополненные до самой длинной кривой
- настоящая точка (1) или заполнение (0)
- квадраты скоростей складываются; $\Upsilon$ масштабирует диск и балдж SPARC (рассчитаны для $\Upsilon = 1$)
- гало с каспом из моделирования холодной тёмной материи, $\rho \propto 1/(x(1+x)^2)$
- гало с ядром, $\rho \propto 1/((1+x)(1+x^2))$
- одна функция с одним $a_0$ для всех галактик; без гало
- повторный $r$ ⇒ сумма по настоящим точкам каждой галактики
- 'один скаляр для всех моделей и галактик: один обратный проход даёт все градиенты (Adam, затем L-BFGS)'
labels:
  iterations: Итерации Adam перед L-BFGS
  lr: Скорость обучения Adam
  prior_dex: Ширина априорного распределения $\Upsilon$ (dex, 0 = нет)
