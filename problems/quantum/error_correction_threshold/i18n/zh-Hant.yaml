title: 低於閾值的量子錯誤更正
summary: 位元翻轉重複碼把一個邏輯位元分散到 $d$ 個有雜訊的量子位元上，並持續量測它們的奇偶性。數千次蒙地卡羅試驗以一個 $(S, R, d)$ 張量運行，精確的最小權重解碼器讀取時空症狀歷史，而 $d = 3, 5, 7, 9$ 的曲線在閾值處交會：低於閾值時，每一步 $d \to d + 2$ 都使邏輯錯誤率除以一個因子 $\Lambda > 1$，這正是 Google 2024 年低於閾值之表面碼記憶體背後的量。
notes: 此碼儲存 $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$ 與 $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$；奇偶校驗 $Z_jZ_{j+1}$ 揭示相鄰者在何處不一致，卻不揭示邏輯值。在碼容量模型（單一輪、完美校驗）中，最佳解碼器是多數決，模擬的 $P_L$ 依循精確的二項尾機率（虛線），閾值恰為 $p = 1/2$。在唯象模型中，校驗也會誤讀，所以單一症狀不可信；解碼器尋找能解釋整個 $d$ 輪歷史的最少資料翻轉加誤讀。這正是最小權重完美匹配所解的問題；在一維中，這裡以對 $2^d$ 種錯誤樣式的動態規劃精確求解（因此 $d \le 11$）。對此模型，閾值在 $p \approx 10\%$ 附近（對極大的 $d$ 約為 10.3 %），而當每個碼運行 $d$ 輪時，小 $d$ 的交會點落在它附近。低於閾值時較大的碼勝出，且 $\Lambda = \varepsilon_d/\varepsilon_{d+2}$ 隨 $p$ 下降而增大（大致如 $p_{th}/p$）；高於閾值時，增加量子位元只會增加出錯的地方。研究背景：Google Quantum AI and Collaborators，Quantum error correction below the surface code threshold，Nature 638, 920（2025；arXiv:2408.13687, 2024）在其 Willow 處理器上運行距離 3、5 與 7 的表面碼記憶體，報告 $\Lambda \approx 2.1$，距離 7 的邏輯錯誤約為每週期 0.14 %（概略值）。更早的步驟有重複碼（Nature 595, 383, 2021），以及距離 5 表面碼略勝距離 3（Nature 614, 676, 2023）。重複碼與表面碼的比較：重複碼是一維鏈，只能更正位元翻轉（$X$ 錯誤）——任何量子位元上的相位翻轉（$Z$）都是邏輯錯誤，所以它並非完整的量子記憶體。表面碼是具有 $Z$ 型與 $X$ 型校驗的二維晶格，兩種錯誤都能更正；其解碼圖是三維的（兩個空間維度加時間），閾值也較低，對此唯象雜訊約為 3 %，對真實的電路雜訊約為 1 %（概略值）。簡化：錯誤彼此獨立、最終讀取完美，且無洩漏或相關的突發錯誤，而在真實元件中這些會為邏輯錯誤率設下下限。
meanings:
- 試驗 $s$、第 $t$ 輪的資料翻轉（機率 $p$）與校驗誤讀（機率 $q$）
- 第 $t$ 輪後資料量子位元 $i$ 上累積的錯誤
- 校驗 $j$ 比較相鄰的 $i = j$ 與 $i = j + 1$（$Z_jZ_{j+1}$）
- 重複的 $i$ ⇒ 求和：每個校驗應回報的奇偶性
- 發生變化的症狀位元：時空中錯誤鏈的端點
- 以錯誤樣式 $x$ 結尾的最低成本歷史，$w = \ln\frac{1-p}{p}$；對 $y$ 取最小值即 $d$ 個單位元翻轉
- 多數決：校驗永不誤讀時的最佳解碼器
- 每輪的錯誤抑制，$1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: 雜訊模型（有或無校驗誤讀）
  d_max: 最大距離 $d$（11 較慢）
  shots: 每個 $(d, p)$ 點的試驗次數
  n_p: 錯誤率 $p$ 的個數
  p_min: 最小 $p$
  p_max: 最大 $p$
  q_ratio: 誤讀率 $q/p$
