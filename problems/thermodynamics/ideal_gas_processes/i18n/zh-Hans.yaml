source_hash: 7f418c1e4166
title: 理想气体的四种过程
summary: 同一气体从同一状态出发，沿四条教科书路径变化：等温、等压、等容和绝热。四条路径是一个 (过程, 点, 2) 的 $(V, p)$ 采样张量，功是 torch.trapezoid 给出的每条曲线下的面积，热力学第一定律再把它换算为热量。
notes: 初态：1 mol，300 K，10 升。等温、等压和绝热路径膨胀到相同的末体积；等容路径保持 $V$ 不变并加热气体，直到压强增大相同的倍数。由于等容线上 $dV = 0$，torch.trapezoid 在那里返回严格为零的功。等温线上 $\Delta U = 0$，所以 $Q = W$；绝热线上 $Q = 0$，所以气体以内能做功并降温。右侧的柱条是累计值，用 torch.cumulative_trapezoid 计算。
meanings:
- 过程 $c$（等温、等压、等容、绝热）上的第 $k$ 个采样点
- 理想气体状态方程，对整个张量逐元素计算
- 重复的 $k$ ⇒ 求和：每条路径上气体对外做的功
- 内能只取决于温度
- 热力学第一定律：气体吸收的热量
labels:
  ratio: 膨胀比 $V_2/V_1$
  T0: 初始温度
  n: 物质的量
  gas: 气体
