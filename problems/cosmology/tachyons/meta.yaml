  - {symbol: 'p^a\eta_{ab}p^b', code: "einsum('...a,a,...a->...', p, eta, p)", shape: '(F, U)', meaning: 'the invariant $m^2 = -\mu^2$, the same in every frame'}
  - {symbol: 'u'' = (u-\beta)/(1-u\beta)', code: 'velocity_add(u, beta)', shape: 'broadcast', meaning: 'rapidities subtract: $\tanh$ below $c$, $\coth$ above'}
