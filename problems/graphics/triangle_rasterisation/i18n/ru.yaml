source_hash: e60c88b1723d
title: Растеризация треугольников с z-буфером
summary: 'Так игры рисуют 3D: спроецируйте треугольную сетку на экран и вычислите барицентрические веса для всех пар (пиксель, треугольник) сразу. Минимум-редукция по треугольникам — это z-буфер. Те же веса затем управляют плоским затенением, затенением по Гуро и по Фонгу, а также выборкой текстуры. Интерполяция текстурных координат с $\lambda/z$ (перспективно-корректная) вместо $\lambda$ (аффинная) — вот что сохраняет клетчатый пол прямым.'
notes: 'Барицентрические веса — это ориентированные площади: $\lambda_k$ — площадь маленького треугольника напротив вершины $k$, делённая на площадь целого, поэтому три веса в сумме дают 1 и все положительны ровно внутри. Здесь они вычисляются для каждого пикселя и каждого треугольника сразу — это версия «в лоб» того, что GPU делает аппаратно. Разбиение пикселей на тайлы держит тензор $(P, T, 3)$ в пределах нескольких миллионов элементов; настоящий растеризатор обходит только ограничивающий прямоугольник каждого треугольника. Знак площади в экранном пространстве бесплатно даёт и отсечение задних граней: примерно половина замкнутой сетки обращена от камеры. Глубина вдоль треугольника не линейна на экране, а $1/z$ — линейна, поэтому и проверка z-буфера, и каждый интерполируемый атрибут используют веса $\lambda_k/z_k$. Пол состоит всего из двух треугольников, поэтому аффинная интерполяция (в стиле PlayStation 1) заметно изгибает его клетчатые линии, а перспективно-корректная версия сохраняет
  их прямыми. Плоское затенение показывает каждую грань. Гуро освещает вершины и смешивает яркость, что размазывает зеркальный блик. Фонг смешивает нормали и освещает каждый пиксель, что сохраняет блик чётким.'
meanings:
- вершины сетки плюс 4 угла пола; грани $(T, 3)$ индексируют их
- 'повторяющийся $j$ ⇒ суммирование: вращение сетки (одно вращение на кадр)'
- экранное положение и глубина вершины $k$ треугольника $t$ (камера-обскура $f\,(x, y)/z$)
- половина $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$; $A_t \le 0$ ⇒ задняя грань, отсекается
- барицентрические веса каждого пикселя в каждом треугольнике; вычисляются тайлами пикселей, чтобы ограничить память
- 'повторяющийся $k$ ⇒ суммирование: на экране линейно меняется именно $1/z$'
- 'z-буфер: ближайший покрывающий треугольник для каждого пикселя (пиксели снаружи равны $+\infty$)'
- текстурные координаты, нормали, положения, яркость по Гуро, интерполированные с весами $\lambda/z$
- 'аффинная интерполяция: верна для треугольников, обращённых прямо к камере, неверна для наклонённых'
