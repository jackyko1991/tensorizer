source_hash: 1e3affbcf0e4
title: 평면의 선형 사상
summary: $2\times 2$ 행렬은 평면의 모든 점을 움직이며, einsum 하나가 격자 전체, 단위원, 단위 정사각형을 모든 애니메이션 프레임에 대해 한꺼번에 움직인다. 평면이 항등 행렬에서 $A$로 변형되는 모습을 보자. 고유 벡터는 자기 직선 위에 머물고, $|\det A|$는 넓이를 확대하며, 음의 행렬식은 평면을 뒤집고, 원은 특이값을 반축으로 하는 타원이 된다.
notes: '$A$의 열은 기저 벡터 $\mathbf e_1$(빨간 화살표)과 $\mathbf e_2$(초록 화살표)가 옮겨 가는 곳이고, 나머지 모든 점은 선형성에 따라 움직이므로 곧은 격자선은 곧고 평행한 채로 남는다. 경로 $M(t) = (1-t)I + tA$를 따라 $A$의 고유 벡터 $\mathbf v$는 고유값 $1 - t + t\lambda$를 갖는 $M(t)$의 고유 벡터이기도 하므로, 주황색 점은 점선을 따라 미끄러지고 나머지는 모두 회전한다. 단위 정사각형(노란색)은 넓이 $|\det A|$인 평행사변형이 된다. $\det < 0$이면, 즉 $\mathbf e_1 \to \mathbf e_2$가 시계 방향이 되어 평면이 거울상이 되면 빨간색으로 바뀐다. 반사는 도중에 반드시 $\det = 0$을 지나며, 이때 평면은 직선 위로 짓눌린다. 회전과 반사는 길이를 보존하므로 $\sigma_1 = \sigma_2 = 1$이다. 층밀림은 넓이는 보존하지만($\det = 1$) 모양은 보존하지 않는다. 일반적으로 원은 반축이 특이값 $\sigma_1 \ge \sigma_2$인 타원이 되고, $|\det A| = \sigma_1\sigma_2$이다. 곱은 곱해진다: $\det(AB) = \det A\,\det B$.'
meanings:
- '보여 줄 행렬: 늘이기, 층밀림, 회전, 반사, 뒤집기, 또는 직접 입력'
- '평면의 점: 격자선, 단위원, 단위 정사각형'
- 항등 $\delta_{ij}$에서 $A$까지의 직선 경로, 프레임마다 행렬 하나
- '반복된 $j$ ⇒ 합산: 모든 점을 모든 프레임의 행렬로 한꺼번에 이동'
- '$\varepsilon_{12} = 1$, $\varepsilon_{21} = -1$: 2차원 레비-치비타 기호'
- '반복된 $i, j$ ⇒ 합산: 단위 정사각형의 상의 부호 있는 넓이'
- 원의 상은 반축이 $\sigma_1 \mathbf u_1$과 $\sigma_2 \mathbf u_2$인 타원
- 고유값과 고유 벡터; 회전에서는 복소수이므로 제자리에 머무는 직선이 없음
