source_hash: f581627e3195
title: 상자 속 입자
summary: 격자 위에서 시간 무관 슈뢰딩거 방정식은 행렬 고윳값 문제 $H_{ij}\psi_j = E\psi_i$가 됩니다. torch.linalg.eigh가 정상 상태들을 주고, 그 중첩은 각 상태에 위상 $e^{-iE_n t}$를 붙여 einsum으로 더하는 것으로 시간 전개됩니다.
notes: 단위 $\hbar = m = 1$. 정확한 에너지는 $E_n = n^2\pi^2/(2L^2)$이며, 격자는 가장 낮은 에너지들을 1 %의 작은 일부 이내로 재현합니다. 각 고유 상태는 위상만 얻으므로 $\lvert c_n\rvert$와 노름은 변하지 않습니다. $\lvert\psi\rvert^2$이 출렁이는 것은 순전히 상태들 사이의 간섭입니다. 부활 시간 $T = 4L^2/\pi$가 지나면 모든 위상 $e^{-iE_n t}$가 1로 돌아오고 초기 상태가 정확히 다시 나타납니다. 흐린 점선은 가장 낮은 정상 상태 $\varphi_n(x)$입니다.
meanings:
- '$N$개의 내부 격자점 위의 해밀토니안 행렬 $-\tfrac12\,D2$ (벽: $\psi = 0$)'
- '유한 차분 $d^2/dx^2$: $(\psi_{x-1} - 2\psi_x + \psi_{x+1})/dx^2$'
- 에너지와 고유벡터 (열 $n$이 상태 $n$)
- 초기 상태를 고유 기저에 사영 (반복된 $x$ ⇒ 합)
- '반복된 $n$ ⇒ 합: 위상이 붙은 성분들로 $\psi$를 재구성'
labels:
  initial: 초기 상태
  n_states: 중첩된 상태 수
  L: 상자 폭
  n_grid: 격자점 수
  revivals: 시뮬레이션 시간
