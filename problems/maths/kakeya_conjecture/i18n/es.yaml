source_hash: a69998e36eef
title: La conjetura de Kakeya
summary: Una aguja puede girarse en todas las direcciones dentro de un conjunto de área arbitrariamente pequeña. Este problema construye un conjunto así (el árbol de Perron, formado por $2^k$ triángulos delgados desplazados lateralmente) y mide su área de forma exacta, fila a fila. Después recubre uniones de $\delta$-tubos en $\mathbb R^2$, $\mathbb R^3$ y $\mathbb R^4$ con $\delta$-cubos para estimar su dimensión. La conjetura de Kakeya afirma que tales conjuntos tienen aun así dimensión completa $n$. Está demostrado para $n = 2$ y, desde 2025, para $n = 3$; para $n \ge 4$ las únicas demostraciones hasta ahora son afirmaciones no verificadas generadas por IA.
notes: 'Kakeya preguntó en 1917 cuál es el área mínima en la que se puede dar la vuelta a una aguja de longitud unidad. Besicovitch (1919, 1928) descubrió que un conjunto que contiene un segmento unidad en cada dirección puede tener medida cero, y Perron (1928) simplificó la construcción hasta obtener el árbol dibujado aquí. Se corta un triángulo en $2^k$ astillas y se deslizan lateralmente. Cada astilla conserva sus direcciones, y tras cada ronda del paso de Perron el solapamiento aumenta. El área cumple $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ (comprobado), y el mejor $\alpha$, encontrado probando 24 valores a la vez, la hace decrecer como $\ln k / k$. Córdoba (1977) demostró que el $\delta$-entorno de un conjunto de Kakeya del plano tiene área al menos $c / \log(1/\delta)$, así que este decrecimiento lento es inevitable, y Davies (1971) demostró que todo conjunto de Kakeya plano tiene dimensión de Hausdorff y de Minkowski igual a 2. Tres árboles girados 60° contienen una aguja
  unidad en cada dirección (la aguja roja barre 180°); unir las posiciones con el truco de Pál permite que la aguja gire de verdad dentro de un conjunto de área tan pequeña como se quiera. En $\mathbb R^n$, la conjetura de los conjuntos de Kakeya afirma que todo conjunto así tiene dimensión $n$: tubos de radio $\delta$ en direcciones $\delta$-separadas no pueden solaparse mucho, así que su unión tiene volumen $\gtrsim_\varepsilon \delta^{\varepsilon}$. Los paneles de la derecha cuentan $\delta$-cubos para dos disposiciones (todos los tubos pasando por el origen, y centros aleatorios). La pendiente de $\log N$ frente a $\log(1/\delta)$ se acerca a $n$ en ambos casos, como debe ocurrir si la conjetura es cierta. Un ordenador solo puede probar disposiciones concretas, nunca todas. Estado (noviembre de 2026): $n = 2$ demostrado (Davies 1971). $n = 3$ demostrado por Hong Wang y Joshua Zahl (preprint de 2025), tras la cota $(n+2)/2$ de Wolff (1995) y Katz–Łaba–Tao. Para $n \ge 4$ el problema está
  abierto en la literatura revisada por pares. La colección de manuscritos generados por IA publicada por OpenAI (github.com/openai/math, familias 074 y 079) afirma haber resuelto el caso de dimensión cuatro y, mediante la conjetura de suavizado local de Sogge, todas las dimensiones. El repositorio indica que algunos de sus enunciados se han formalizado en Lean, pero son afirmaciones producidas por máquina, sin revisión por pares, que aún esperan la comprobación de la comunidad matemática, por lo que esta página las trata como afirmadas, no como demostradas. La conjetura importa mucho más allá de la geometría: se deduce de las conjeturas de restricción de Fourier y de Bochner–Riesz del análisis armónico.'
meanings:
- 'los $N = 2^k$ triángulos delgados con vértice $(0, 1)$ y bases $[b_i, b_i + w_0]$ que dividen $[-1/\sqrt3, 1/\sqrt3]$: un cono de direcciones de 60°, con cada lado $\ge 1$'
- desplazamientos horizontales tras $k$ rondas de Perron, para $A$ valores de $\alpha$ a la vez; cada ronda hace que los núcleos vecinos se toquen y empuja el de la derecha hacia la izquierda en $(1-\alpha)(c - a)$
- dónde corta el triángulo $i$ a la recta horizontal de altura $y$
- ordenar los intervalos de cada fila por su extremo izquierdo; el máximo acumulado de los extremos derechos da lo que ya está cubierto
- '$i$ e $y$ repetidos ⇒ sumados: la longitud exacta de la unión de cada fila, promediada sobre las filas (regla del punto medio)'
- 'una $\delta$-malla sobre las caras del cubo $[-1,1]^n$, proyectada a la esfera: direcciones de rectas aproximadamente $\delta$-separadas'
- los cubos de lado $\delta$ que toca cada tubo, muestreados cada $\delta/2$ a lo largo de él
- '$i$ repetido ⇒ sumado: una clave entera por cubo, de modo que contar cubos distintos es una sola ordenación'
- '$j$ repetido ⇒ sumado: tres copias del árbol giradas 0°, 60° y 120° cubren todas las direcciones'
labels:
  k_max: Rondas de Perron $k$ ($2^k$ triángulos)
  n_max: Tubos hasta la dimensión $n$
