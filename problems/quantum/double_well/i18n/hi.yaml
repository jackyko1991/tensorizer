title: द्वि-कूप में सुरंगन
summary: 'एक सममित द्वि-कूप विभव में एक कण। torch.linalg.eigh दिखाता है कि दो निम्नतम अवस्थाएँ एक निकट युग्म बनाती हैं: एक सम अवस्था और एक विषम अवस्था, जो अत्यंत छोटी सुरंगन ऊर्जा $\Delta E$ से अलग हैं। इनका योग बाएँ कूप में बैठा कण है; जैसे-जैसे दोनों आपेक्षिक कलाएँ अलग होती हैं, वह दाएँ कूप में सुरंगन (tunnelling) करता है और आवर्तकाल $2\pi/\Delta E$ के साथ वापस आता है, यद्यपि उसकी ऊर्जा अवरोध से कम है।'
notes: 'मात्रक $\hbar = m = 1$। द्विक (doublet) ऊर्जाएँ अवरोध शिखर $V_0$ से नीचे हैं, इसलिए शास्त्रीय रूप से कण कभी पार नहीं कर सकता। केवल दो अवस्थाओं के साथ, $\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$ (एक वैश्विक कला तक): $t = 0$ पर यह बाईं ओर $(\varphi_0 + \varphi_1)$ है और $t = \pi/\Delta E$ पर दाईं ओर $(\varphi_0 - \varphi_1)$। $P_L(t) = \cos^2(\Delta E\,t/2)$ हर अवस्था के "गलत" कूप के साथ छोटे अतिव्यापन तक सत्य है। $\Delta E$ अवरोध की ऊँचाई और चौड़ाई के साथ लगभग चरघातांकी रूप से घटता है (WKB गुणक $e^{-\int\kappa\,dx}$), इसलिए थोड़ा ऊँचा अवरोध सुरंगन को बहुत धीमा कर देता है — अनुकरण समय सुरंगन आवर्तकालों $2\pi/\Delta E$ में मापा जाता है ताकि एनिमेशन सदा पूरे दोलन दिखाए।'
meanings:
- 'चतुर्घाती विभव: $x = \pm a$ पर निम्निष्ठ, $x = 0$ पर अवरोध $V_0$'
- गतिज $-\tfrac12\,D2$ और विकर्ण पर $V$
- ऊर्जाएँ और अवस्थाएँ; $\varphi_0$ सम, $\varphi_1$ विषम, $\Delta E = E_1 - E_0$
- '$(1, 1, 0, 0, \dots)/\sqrt2$: द्विक का समान मिश्रण, बाईं ओर स्थानीकृत'
- 'दोहराया गया $n$ ⇒ योग: आइगेन-आधार में सटीक विकास'
- बायाँ आधा चुनने वाला सोपान फलन; $P_L$, $x$ पर योग करता है
labels:
  V0: अवरोध ऊँचाई $V_0$
  a: कूप पृथक्करण $a$ ($\pm a$ पर निम्निष्ठ)
  periods: अनुकरण समय
  n_grid: ग्रिड बिंदु
