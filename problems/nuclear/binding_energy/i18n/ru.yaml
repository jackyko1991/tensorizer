source_hash: 895c388f37ef
title: Энергия связи ядер
summary: 'Полуэмпирическая формула масс (капельная модель) даёт энергию связи любого ядра из пяти слагаемых: объёмного, поверхностного, кулоновского, слагаемого асимметрии и спаривания. Вычисление на всей сетке $(Z, N)$ сразу через broadcasting показывает, почему железо и никель связаны сильнее всего и где проходит долина стабильности.'
notes: 'Объёмная энергия связи растёт как $A$, но у поверхностных нуклонов меньше соседей ($-A^{2/3}$), а отталкивание протонов растёт как $Z^2/A^{1/3}$; баланс помещает максимум $B/A$ около $A \approx 56$–$62$, поэтому энергию выделяют и синтез лёгких ядер, и деление тяжёлых. Слагаемое асимметрии тянет ядра к $N = Z$, кулоновское смещает тяжёлые ядра к $N > Z$: вместе они дают изогнутую долину стабильности $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$. Формула точна примерно до 1 % для средних и тяжёлых ядер, но не описывает самые лёгкие (⁴He связан гораздо сильнее, чем жидкая капля) и оболочечные эффекты при магических числах. Коэффициенты по умолчанию — распространённая подгонка методом наименьших квадратов; их изменение показывает, какое слагаемое отвечает за какую особенность.'
meanings:
- числа протонов вдоль столбца, числа нейтронов вдоль строки
- broadcasting столбца и строки заполняет всю таблицу
- $+a_P/\sqrt A$ для чётно-чётных, $-a_P/\sqrt A$ для нечётно-нечётных, 0 для нечётных $A$
- энергия связи каждого ядра на карте, МэВ
- энергия связи на нуклон (тепловая карта)
- наиболее связанная изобара для каждого массового числа (красная линия)
- $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$ из $\partial B/\partial Z = 0$
labels:
  a_V: Объёмный $a_V$
  a_S: Поверхностный $a_S$
  a_C: Кулоновский $a_C$
  a_A: Асимметрия $a_A$
  a_P: Спаривание $a_P$
  z_max: Наибольший $Z$ на сетке
