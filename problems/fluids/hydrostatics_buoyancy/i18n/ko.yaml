source_hash: 7be98e686941
title: 정수압과 부력
summary: '물탱크 속 압력은 깊이에 따라 선형으로 증가합니다: $p = p_0 + \rho_w g h$. 밀도가 서로 다른 블록들을 한꺼번에(배치 텐서 하나로) 떨어뜨립니다. 가벼운 블록은 출렁이다가 $\rho_b/\rho_w$ 비율만큼 물에 잠긴 채 뜨고, 무거운 블록은 바닥으로 가라앉습니다.'
notes: 각 블록은 한 변이 $s$인 정육면체입니다. 부력 $\rho_w g s^2 d_b$는 밀어낸 물의 무게(아르키메데스)이며, 압력 $p_0 + \rho_w g h$가 윗면보다 아랫면을 더 세게 미는 결과입니다. 뜨는 블록은 부력과 무게가 평형을 이루는 $d_b/s = \rho_b/\rho_w$에서 자리 잡습니다. 얼음($\rho \approx 917$)은 92 %가 물에 잠긴 채 뜹니다. 항력은 잠긴 부피에 비례하는 단순한 선형 감쇠입니다. 실제 항력은 제곱에 더 가깝고, 실제 물결과 부가 질량은 무시합니다. 가라앉은 블록은 바닥에 놓입니다.
meanings:
- 물속 점들의 격자, 성분 $i \in \{x, z\}$
- 중력 벡터 $(0, -g)$
- '반복된 $i$ ⇒ 합: 깊이 $h = -z$에서의 $g\,h$'
- 블록 $b$의 아랫면 높이와 속도
- 블록 $b$의 밀도 — 배치 지표
- 잠긴 깊이, 0(공기 중)과 $s$(완전히 잠김) 사이
- 단위 질량당 부력 빼기 무게 빼기 항력
labels:
  n_blocks: 블록 수
  rho_min: 최소 밀도 $\rho_\text{min}$
  rho_max: 최대 밀도 $\rho_\text{max}$
  size: 블록 크기 $s$
  drag: 감쇠 $\gamma$
  t_max: 시뮬레이션 시간
