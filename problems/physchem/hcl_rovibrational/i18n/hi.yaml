source_hash: dda111a1c11f
title: HCl का घूर्णी-कंपनिक स्पेक्ट्रम
summary: 'HCl का अवरक्त बैंड रेखाओं की एक कंघी है: अणु कंपन करता है (एक अप्रसंवादी दोलक) और घूमता है (एक घूर्णक जो घूमते हुए खिंचता है), और हर रेखा $\Delta J = \pm 1$ के साथ एक संक्रमण $v = 0 \to 1$ है। दोनों क्लोरीन समस्थानिकों की P और R शाखाएँ एक बैच $(I, J)$ ग्रिड के रूप में निकलती हैं, तापमान वृद्धि के लिए बोल्ट्ज़मान तीव्रताओं के साथ; फिर संयोजन-अंतर न्यूनतम-वर्ग फ़िट रेखाओं से $B_e$, $\alpha_e$ और $\nu_0$ पुनः प्राप्त करता है।'
notes: 'स्थिरांक H³⁵Cl के अनुमानित साहित्य मान हैं: $\omega_e \approx 2991$, $\omega_ex_e \approx 52.8$, $B_e \approx 10.59$, $\alpha_e \approx 0.31$ और $D_e \approx 5\times10^{-4}$ cm⁻¹। बैंड मूल $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹ पर कोई रेखा नहीं है, क्योंकि HCl जैसी $\Sigma$ अवस्था में $\Delta J = 0$ (Q) शाखा नहीं होती: R(0) और P(1) के बीच का अंतराल लगभग $4B$ है। चूँकि $B_1 < B_0$ (कंपित बंध औसतन लंबा होता है), R रेखाएँ उच्च $J$ की ओर सिमटती हैं जबकि P रेखाएँ फैलती हैं। हर रेखा एक द्विक है, H³⁷Cl लगभग 2 cm⁻¹ नीचे एक-तिहाई तीव्रता के साथ (प्राकृतिक प्रचुरता 76 : 24); यह विस्थापन $|\nu - \nu_0|$ के साथ बढ़ता है क्योंकि हर स्थिरांक समानीत द्रव्यमान की किसी घात के साथ स्केल होता है। गैस गर्म होने पर बोल्ट्ज़मान गुणक $(2J+1)e^{-hcF(J)/kT}$ अपना अधिकतम उच्च $J$ की ओर ले जाता है और दोनों शाखाएँ फैलती हैं (हर फ़्रेम अपनी सबसे प्रबल रेखा के अनुसार स्केल है)। संयोजन अंतर दोनों अवस्थाओं को अलग करने की स्पेक्ट्रमविद् की युक्ति हैं: R(J−1) और P(J+1) एक ही ऊपरी स्तर पर समाप्त होते
  हैं, इसलिए उनका अंतर केवल $v = 0$ पर निर्भर करता है; R(J) और P(J) एक ही निचले स्तर से शुरू होते हैं, इसलिए उनका केवल $v = 1$ पर। $J^2 + J + 1$ के विरुद्ध $\Delta_2F/(4J+2)$ का सीधी-रेखा फ़िट $B_v$ (अंतःखंड) और $D$ (ढलान) देता है, फिर $\alpha_e = B_0 - B_1$ और $B_e = B_0 + \alpha_e/2$। यह देखने के लिए मापन रव जोड़ें कि स्थिरांक कितने अच्छे बने रहते हैं। तुल्य मोर्स कूप गहराई $\omega_e^2/4\omega_ex_e$ है। सरलीकरण: कोई Herman–Wallis तीव्रता सुधार नहीं, हर रेखा के लिए एक लॉरेंट्ज़ियन चौड़ाई, और अवशोषण $\tilde\nu$ से भारित नहीं।'
meanings:
- अनुमानित H³⁵Cl स्थिरांक, $\rho = \sqrt{\mu_{35}/\mu_{37}}$ के साथ H³⁷Cl पर स्केल किए गए
- स्तर $v$ के घूर्णी पद; किसी सूचकांक पर योग नहीं, बाह्य गुणनफल
- दोनों समस्थानिकीयों (isotopologues) की हर रेखा एक ग्रिड में; $J$ निचला स्तर है
- वृद्धि के हर तापमान पर स्तर $J$ की बोल्ट्ज़मान जनसंख्या
- प्रचुरता × जनसंख्या × Hönl–London गुणक; P(0) को ठीक शून्य मिलता है
- 'दोहराया गया $\ell$ ⇒ सभी रेखाओं पर योग: विस्तृत स्पेक्ट्रम'
- निचली ($s=0$) और ऊपरी ($s=1$) अवस्था के लिए $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$
- 'दोहराया गया $n$ ⇒ योग: हर समस्थानिकीय और अवस्था के लिए न्यूनतम-वर्ग $B_v$ और $D$'
labels:
  T: अंतिम तापमान $T$
  J_max: उच्चतम निचला स्तर $J_{max}$
  fwhm: रेखा चौड़ाई (FWHM)
  noise: मापी गई रेखाओं पर रव
