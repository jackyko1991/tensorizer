title: नाभिकीय बंधन ऊर्जा
summary: 'अर्ध-आनुभविक (द्रव-बूँद) द्रव्यमान सूत्र पाँच पदों से हर नाभिक की बंधन ऊर्जा देता है: आयतन, पृष्ठ, कूलॉम, असममिति और युग्मन। इसे ब्रॉडकास्टिंग द्वारा पूरे $(Z, N)$ ग्रिड पर एक साथ मूल्यांकित करने से दिखता है कि लोहा और निकेल सबसे दृढ़ता से बँधे क्यों हैं और स्थायित्व की घाटी कहाँ से गुज़रती है।'
notes: 'आयतन बंधन $A$ की तरह बढ़ता है, पर पृष्ठ के न्यूक्लिऑनों के कम पड़ोसी होते हैं ($-A^{2/3}$) और प्रोटॉन प्रतिकर्षण $Z^2/A^{1/3}$ की तरह बढ़ता है; यह संतुलन $B/A$ का अधिकतम $A \approx 56$–$62$ के निकट रखता है, इसीलिए हल्के नाभिकों का संलयन और भारी नाभिकों का विखंडन दोनों ऊर्जा मुक्त करते हैं। असममिति पद नाभिकों को $N = Z$ की ओर खींचता है, कूलॉम पद भारी नाभिकों को $N > Z$ की ओर धकेलता है: मिलकर ये स्थायित्व की वक्र घाटी $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$ देते हैं। सूत्र मध्यम और भारी नाभिकों के लिए लगभग 1 % तक सही है, पर बहुत हल्के नाभिकों (⁴He द्रव-बूँद से कहीं अधिक बँधा है) और मैजिक संख्याओं पर कोश प्रभावों को नहीं पकड़ता। डिफ़ॉल्ट गुणांक एक सामान्य न्यूनतम-वर्ग फ़िट हैं; इन्हें बदलने से दिखता है कि कौन-सा पद किस विशेषता को आकार देता है।'
meanings:
- स्तंभ में नीचे प्रोटॉन संख्याएँ, पंक्ति में न्यूट्रॉन संख्याएँ
- एक स्तंभ और एक पंक्ति को ब्रॉडकास्ट करने से पूरी तालिका भर जाती है
- सम-सम के लिए $+a_P/\sqrt A$, विषम-विषम के लिए $-a_P/\sqrt A$, विषम $A$ के लिए 0
- चार्ट पर हर नाभिक की बंधन ऊर्जा, MeV
- प्रति न्यूक्लिऑन बंधन ऊर्जा (हीटमैप)
- हर द्रव्यमान संख्या के लिए सबसे अधिक बँधा समभारिक (लाल रेखा)
- $\partial B/\partial Z = 0$ से $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$
labels:
  a_V: आयतन $a_V$
  a_S: पृष्ठ $a_S$
  a_C: कूलॉम $a_C$
  a_A: असममिति $a_A$
  a_P: युग्मन $a_P$
  z_max: ग्रिड पर सबसे बड़ा $Z$
