source_hash: ea8025a41e84
title: 連成振動子と基準振動
summary: 2つの固定壁の間でばねにつながれた $N$ 個の等しい質点。ばねは1つの剛性テンソル $K_{ij}$ となり、その固有ベクトルが基準振動モードであり、運動は1回の einsum で足し合わせたモードの重ね合わせになる。
notes: $K_{ij}$ は対称なので、eigh は実の振動数と正規直交なモードを与える。そのためあらゆる運動は独立な余弦関数の和となり、時間積分は必要ない。1つのモードから始めると鎖はその形を永遠に保つ。1つの質点をはじくと、エネルギーが鎖に沿って行き来する。解析的な振動数は $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$ である。
meanings:
- 質点 $i$ のつり合いの位置からの変位
- 剛性テンソル：対角成分 $2k$、その隣 $-k$
- 繰り返される $j$ ⇒ 和をとる：質点 $i$ に働くばねの合力
- 固有値と固有ベクトル（第 $n$ 列）＝ 基準振動モード
- 繰り返される $i$ ⇒ 和をとる：初期状態を各モードに射影
- 繰り返される $n$ ⇒ 和をとる：モードの重ね合わせ
labels:
  n_masses: 質点の数
  k: ばね定数
  m: 質量
  start: 初期変位
  amplitude: 初期振幅
  t_max: シミュレーション時間
