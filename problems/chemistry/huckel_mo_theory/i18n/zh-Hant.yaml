source_hash: 0b2a4ba1c286
title: π 系統的休克爾分子軌域
summary: 平面碳氫化合物的 π 電子所處的 Hamiltonian 就是其碳骨架的鄰接矩陣，$H = \alpha\mathbb 1 + \beta A$。一次批次 eigh 同時對角化七個分子，從乙烯到萘；填入軌域後得到 HOMO–LUMO 能隙、離域能（苯：$2\beta$，環丁二烯：$0$），以及以對佔據軌域的 einsum 求得的 Coulson 鍵級，而環大小 $N = 3, 4, \dots$ 則展示休克爾的 $4n + 2$ 規則。
notes: Hückel（1931）只保留平面共軛分子 π 電子真正重要的部分：每個碳一個 $2p_z$ 軌域、每個原子相同的能量 $\alpha$、相鄰鍵結原子間的躍遷能 $\beta$，其餘全部忽略，也不計重疊。於是 Hamiltonian 為 $\alpha\mathbb 1 + \beta A$，其中 $A$ 是分子的圖，因此其本徵值為 $\alpha + \beta\lambda$，$\lambda$ 為 $A$ 的本徵值；由於 $\beta < 0$，最成鍵的軌域對應最大的 $\lambda$。苯給出 $\alpha + 2\beta$、$\alpha + \beta$（二重）、$\alpha - \beta$（二重）、$\alpha - 2\beta$；其六個電子的 $E_\pi = 6\alpha + 8\beta$，比三個孤立雙鍵低 $2\beta$。取 $|\beta| \approx 75$ kJ/mol（擬合苯氫化焓的粗略熱化學值；光譜學暗示更大的 $|\beta|$，故視為近似值），這就是著名的約 $\approx 150$ kJ/mol 芳香穩定化能。環丁二烯有兩個電子留在 $\alpha$ 處的簡併軌域對中：沒有離域能、能隙為零、是雙自由基，甚至比開鏈的丁二烯更不穩定：反芳香性。對 $N$ 個原子的環，能階為 $\alpha + 2\beta\cos(2\pi k/N)$，一個最低能階之後是成對的簡併能階（Frost 圓），因此閉殼層需要 $2 + 4n$ 個電子：休克爾規則。奇數環以其芳香離子表示，如環戊二烯基陰離子與草鎓（tropylium）陽離子。丁二烯的鍵級 $P_{ij} = \sum_k n_k C_{ik}C_{jk}$，兩端的鍵為 $0.894$、中間為 $0.447$，與其短–長–短的鍵長相符；苯的六個鍵級皆為 $2/3$。對交替烴（無奇數環），配對定理使能譜對 $\alpha$ 對稱，且每個 π 電荷皆為零。選擇其他分子來觀看其前緣軌域：HOMO 與 LUMO 決定親電試劑與親核試劑的攻擊位置，並經由能隙決定顏色（較長的多烯吸收較長的波長）。
meanings:
- 分子 $b$ 中鍵結碳 $i, j$（相距一個鍵長的原子）為 $1$，填補到最大 $N = 10$
- 休克爾矩陣；填補原子給予巨大的對角元，使其虛假軌域永不被填入
- MO 能量（遞增：由於 $\beta < 0$，成鍵軌域在前）與係數，MO $k$ 在第 $k$ 行
- 依構築原理每個 MO 填 2 個電子；部分填滿的簡併組平分其電子
- 重複的 $k$ ⇒ 求和：總 π 能量 $E_\pi$
- 相對於每個 $2(\alpha + \beta)$ 的孤立雙鍵的離域能
- 重複的 $k$ ⇒ 對佔據 MO 求和：鍵上為 Coulson 鍵級，對角線上為 π 電子布居
- π 電荷 $1 - P_{bii}$；在這些交替烴的每個原子上皆為零
- 環能階的解析式，以循環鄰接矩陣的 eigh 驗證
labels:
  molecule: 軌域圖所用分子
  ring_max: 最大環大小 $N$
  beta: 換算為 kJ/mol 的 $|\beta|$（近似值）
