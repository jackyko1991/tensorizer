title: 소수 나선과 하디–리틀우드 추측
summary: 소수를 체로 걸러 하나의 불리언 텐서에 담고, 울람 나선과 색스 나선 위에 그리면 소수가 직선들 위에 몰려 있습니다. 각 직선은 오일러의 $k^2 + k + 41$ 같은 이차식이며, 하디–리틀우드 추측은 그 위에 소수가 몇 개 있을지 예측합니다. 같은 체로 그들의 쌍둥이 소수 및 골드바흐 예측과 소수 간격에 대한 크라메르의 무작위 모형도 시험합니다. 이것들은 추측입니다. 프로그램은 수치적으로 확인할 뿐 증명하지는 않습니다.
notes: '울람(1963)은 정수를 정사각형 나선 위에 써 보다가 소수가 대각선을 따라 늘어선다는 것을 알아챘습니다. 색스 나선(1994)은 $n$을 반지름 $\sqrt n$, 각도 $2\pi\sqrt n$에 놓으며, 대신 곡선들을 보여 줍니다. 울람 나선의 각 대각선 반직선에는 이차식 $4k^2 + bk + c$의 값들이 놓이고, 41에서 시작하는 나선에서 주대각선은 오일러의 $k^2 + k + 41$로서 $k = 0, \dots, 39$에 대해 소수입니다(증명됨: 라비노비치는 $\mathbb Q(\sqrt{1 - 4p})$의 유수가 1일 때, 그리고 그때에만 $k^2 + k + p$가 모든 $k < p - 1$에 대해 소수임을 보였으므로 $p \in \{2, 3, 5, 11, 17, 41\}$이며, 이 목록은 헤그너와 스타크가 완성했습니다). 어떤 반직선은 빽빽하고 어떤 것은 비어 있는데, 이는 잉여 때문입니다. 판별식이 많은 작은 소수에 대해 비잉여이면 $f$는 그 소수들을 법으로 근이 없습니다. 하디와 리틀우드(1923)는 이를 추측 F로 만들었고, 베이트먼–혼 추측(1962)은 이를 $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$로 다시 표현합니다. 오른쪽 위 패널은 수백 개의 이차식에 대해 이를 한꺼번에 시험합니다. $K$가 커질수록 측정된 상수가 예측값 $C(f)$(대각선)에 가까워집니다. 무한히 많은 소수 값을 갖는다고 알려진 이차식은 하나도 없습니다. $n^2 + 1$에 대한 이 문제가 란다우의 네 번째 문제(1912)이며, 여전히 미해결입니다. 오일러 다항식에 대해 하디와 리틀우드는 홀수 소수에 대한 곱 $3.3197732$를 인용합니다. 베이트먼–혼 상수에는 $p = 2$에서 오는 인수 2가 포함되므로(값은 항상 홀수) $6.6395$입니다. 상수 $C_2 = 0.6601618\ldots$를 갖는 쌍둥이 소수 추측과 특이 급수를 갖는 골드바흐 추측은 $p$와 $p + 2$, 그리고 $p$와 $N - p$에 대한
  같은 아이디어입니다. 체는 알려진 개수 $\pi_2(10^6) = 8169$와 $\pi_2(10^7) = 58980$을 재현하며, 골드바흐 혜성은 예측 위로 모입니다. 혜성의 띠들은 특이 급수에 해당합니다(초록색: $3 \mid N$). 두 추측 모두 미해결입니다. 골드바흐 추측은 $4 \cdot 10^{18}$까지의 모든 짝수에 대해 확인되었습니다(올리베이라 이 시우바, 헤르초크, 파르디, 2014). 장이탕(2014)과 Polymath 및 메이너드의 연구는 길이가 최대 246인 소수 간격이 무한히 많음을 증명했고, 천징룬(1973)은 충분히 큰 모든 짝수가 소수와 최대 두 소수의 곱의 합임을 증명했습니다. 크라메르의 모형(1936)은 각 $n$을 확률 $1/\ln n$로 소수로 취급합니다. 이 모형은 평균 $\ln p$인 지수 분포 간격을 예측하는데 이는 관측과 가깝고, 최대 간격은 약 $\ln^2 p$ 크기로 예측합니다. 그러나 2, 3, 5, …로 나누어떨어짐을 무시하기 때문에 쌍둥이 개수를 정확히 $2C_2 \approx 1.32$배만큼 틀립니다(점선). 마이어(1985)는 이 모형이 다른 방식으로도 틀린다는 것을 보였고, 그랑빌은 최대 간격이 $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$까지 이를 수 있다고 제안했습니다.'
meanings:
- '에라토스테네스의 체: 각 소수 $p \le \sqrt{n_\text{max}}$마다 간격을 둔 슬라이스 하나'
- 모든 수의 울람 나선 위치를 한꺼번에, 그 수가 속한 고리 $k = \lceil(\sqrt m - 1)/2\rceil$와 모서리 $(2k+1)^2$까지의 거리로부터
- '색스 나선: 제곱수 $k^2$는 양의 $x$축 위에 놓입니다'
- 모든 $k$에서 $F$개 이차식 $4k^2 + bk + c$(울람 나선의 대각선 반직선)의 값
- 각 값을 체에서 찾아보고, 누적합으로 각 반직선 위의 소수를 셉니다
- $D = b^2 - 4ac$일 때 오일러 판정법 $(D/p) \equiv D^{(p-1)/2}$로 구한 법 $p$에 대한 $f_i$의 근; $p < 50$이면 직접 대입
- '반복된 $p$ ⇒ 합산: 소수 $p < 10^5$에 대한 로그의 합으로 나타낸 오일러 곱'
- '반복된 $m$ ⇒ 합산: 자기 합성곱으로 나타낸 골드바흐 개수, FFT로 계산'
- $p \le x$인 쌍둥이 소수 쌍 $(p, p+2)$
- 정규화된 간격, 크라메르 무작위 모형의 $e^{-s}$ 법칙과 비교
