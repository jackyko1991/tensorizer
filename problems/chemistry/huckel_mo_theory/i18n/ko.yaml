source_hash: 0b2a4ba1c286
title: π계의 휘켈 분자 오비탈
summary: '평면 탄화수소의 π 전자는 탄소 골격의 인접 행렬 그 자체인 해밀토니언 $H = \alpha\mathbb 1 + \beta A$ 속에 있다. 배치 eigh 한 번으로 에틸렌부터 나프탈렌까지 일곱 분자를 동시에 대각화한다. 오비탈을 채우면 HOMO–LUMO 간격, 비편재화 에너지(벤젠: $2\beta$, 사이클로뷰타다이엔: $0$), 그리고 점유 오비탈에 대한 einsum으로 쿨슨 결합 차수를 얻으며, 고리 크기 $N = 3, 4, \dots$는 휘켈의 $4n + 2$ 규칙을 보여 준다.'
notes: 휘켈(1931)은 평면 공액 분자의 π 전자에 중요한 것만 남겼다. 탄소마다 $2p_z$ 오비탈 하나, 모든 원자에서 같은 에너지 $\alpha$, 결합한 이웃 사이의 호핑 에너지 $\beta$, 그 밖에는 아무것도 없고 겹침도 없다. 그러면 해밀토니언은 $\alpha\mathbb 1 + \beta A$이고 $A$는 분자의 그래프이므로, 고유값은 $\alpha + \beta\lambda$이며 $\lambda$는 $A$의 고유값이다. $\beta < 0$이므로 가장 강한 결합성 오비탈은 $\lambda$가 가장 큰 것이다. 벤젠은 $\alpha + 2\beta$, $\alpha + \beta$(2중), $\alpha - \beta$(2중), $\alpha - 2\beta$를 주며, 여섯 전자의 $E_\pi = 6\alpha + 8\beta$는 고립된 이중 결합 세 개보다 $2\beta$ 낮다. 벤젠의 수소화 엔탈피에 맞춘 대략적인 열화학 값 $|\beta| \approx 75$ kJ/mol을 쓰면(분광학은 더 큰 $|\beta|$를 시사하므로 근삿값으로 다루자), 이것이 유명한 $\approx 150$ kJ/mol의 방향족 안정화 에너지이다. 사이클로뷰타다이엔은 $\alpha$의 축퇴된 쌍에 전자 두 개가 남는다. 비편재화 에너지가 없고 간격이 0인 이중 라디칼이며, 사슬형 뷰타다이엔보다도 불안정한 반방향족이다. 원자 $N$개의 고리에서 준위는 $\alpha + 2\beta\cos(2\pi k/N)$로, 가장 낮은 준위 하나와 그 뒤의 축퇴된 쌍들로 이루어지므로(프로스트 원) 닫힌 껍질에는 $2 + 4n$개의 전자가 필요하다. 이것이 휘켈 규칙이다. 홀수 고리는 사이클로펜타다이엔일 음이온과 트로필륨 양이온처럼 방향족 이온으로 표시한다. 뷰타다이엔의 결합 차수 $P_{ij} = \sum_k n_k C_{ik}C_{jk}$는 양 끝 결합이 $0.894$, 가운데 결합이 $0.447$로, 짧은–긴–짧은 결합 길이와 일치한다. 벤젠에서는 여섯 개 모두 $2/3$이다.
  교대 탄화수소(홀수 고리 없음)에서는 짝짓기 정리에 의해 스펙트럼이 $\alpha$를 중심으로 대칭이고 모든 π 전하가 0이다. 다른 분자를 골라 프런티어 오비탈을 보자. HOMO와 LUMO는 친전자체와 친핵체가 공격하는 위치를 정하고, 간격을 통해 색도 정한다(더 긴 폴리엔은 더 긴 파장을 흡수한다).
meanings:
- 분자 $b$에서 결합한 탄소 $i, j$(결합 길이 하나만큼 떨어진 원자)이면 $1$, 최대 $N = 10$까지 채움
- 휘켈 행렬; 채움용 원자는 큰 대각 성분을 받아 가짜 오비탈이 절대 채워지지 않음
- 'MO 에너지($\beta < 0$이므로 오름차순: 결합성이 먼저)와 계수, MO $k$는 $k$번째 열'
- MO당 전자 2개씩 쌓음 원리로 채움; 부분적으로 채워진 축퇴 집합은 전자를 나눠 가짐
- '반복된 $k$ ⇒ 합산: 전체 π 에너지 $E_\pi$'
- 각각 $2(\alpha + \beta)$인 고립된 이중 결합에 대한 비편재화 에너지
- '반복된 $k$ ⇒ 점유 MO에 대해 합산: 결합에서는 쿨슨 결합 차수, 대각에서는 π 전자 밀도'
- π 전하 $1 - P_{bii}$; 이 교대 탄화수소들의 모든 원자에서 0
- 닫힌 형태의 고리 준위, 순환 인접 행렬의 eigh로 검증
labels:
  molecule: 오비탈 그림의 분자
  ring_max: 최대 고리 크기 $N$
  beta: kJ/mol 변환용 $|\beta|$ (근삿값)
