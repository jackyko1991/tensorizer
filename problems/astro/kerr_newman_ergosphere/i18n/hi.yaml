source_hash: e53e4d6ab9fa
title: 'केर–न्यूमैन (Kerr–Newman) ब्लैक होल: क्षितिज, अर्गोस्फ़ीयर और नग्न विलक्षणताएँ'
summary: विद्युतचुंबकत्व सहित सामान्य आपेक्षिकता का सबसे व्यापक ब्लैक होल, जिसका द्रव्यमान $M$, स्पिन $a$ और आवेश $Q$ है। $(M, a, Q)$ के पूरे बैच्ड ग्रिड के लिए कोड क्षितिज $r_\pm$, अर्गोस्फ़ीयर, फ़्रेम ड्रैगिंग और विषुवतीय ISCO तथा फ़ोटॉन कक्षाएँ गणना करता है (मीट्रिक के अवकलज autograd से)। एनिमेशन स्पिन और आवेश को चरमता $a^2 + Q^2 = M^2$ तक और उसके पार ले जाता है, जहाँ क्षितिज गायब हो जाता है और वलय विलक्षणता उजागर हो जाती, जिसे ब्रह्मांडीय सेंसरशिप अनुमान (अप्रमाणित) के अनुसार प्रकृति वर्जित करती है।
notes: 'इकाइयाँ $G = c = 1$: लंबाइयाँ $GM/c^2$ में, स्पिन $a = J/(Mc)$, आवेश ज्यामितीय इकाइयों में। स्थापित (शास्त्रीय GR): केर–न्यूमैन (Kerr–Newman) मीट्रिक (Newman et al. 1965) आइंस्टीन–मैक्सवेल समीकरणों को हल करता है, इसके क्षितिज $\Delta$ के मूल हैं, और अर्गोस्फ़ीयर, जहाँ कोई प्रेक्षक स्थिर नहीं रह सकता, $r_+$ और $r_E(\theta)$ के बीच स्थित है और ध्रुवों पर क्षितिज को छूता है। इसके भीतर फ़्रेम ड्रैगिंग हर चीज़ को साथ घूमने पर विवश करता है: हरा वक्र शून्य कोणीय संवेग के साथ गिरता है और फिर भी घुमा दिया जाता है। प्रोग्रेड कक्षाएँ होल के पास सटी रहती हैं: केर के लिए ISCO $a = 0$ पर $6M$ से $a = M$ पर $M$ (प्रोग्रेड) और $9M$ (रेट्रोग्रेड) तक जाता है, जो Bardeen, Press और Teukolsky (1972) से मेल खाता है, और चरम रीसनर–नॉर्डस्ट्रॉम (Reissner–Nordström) ISCO $4M$ है। $a^2 + Q^2 > M^2$ के लिए सूत्र अब भी एक मीट्रिक देते हैं, पर बिना क्षितिज के और $r = 0$, $\theta = \pi/2$ पर एक नग्न वलय विलक्षणता के साथ (लाल रंग में दिखाई गई)। पेनरोज़ का दुर्बल ब्रह्मांडीय सेंसरशिप अनुमान कहता है कि गुरुत्वीय
  पतन कभी ऐसी विलक्षणता नहीं बनाता; यह सामान्य रूप से अप्रमाणित है (ज्ञात प्रति-उदाहरणों को सूक्ष्मता से समायोजित प्रारंभिक डेटा या अतिरिक्त आयामों की ज़रूरत होती है), और किसी चरम होल में कण फेंककर उसे अधिक स्पिन या अधिक आवेश देने के प्रयास दूसरे क्रम के विक्षोभ प्रभावों को शामिल करते ही विफल होते प्रतीत होते हैं (Sorce और Wald 2017)। वास्तविक होल में $Q \approx 0$ होता है (आवेश जल्दी उदासीन हो जाता है), और मापे गए स्पिन (लगभग $0.95$–$0.99\,M$ तक) चरमता से नीचे रहते हैं। विषुवतीय पैनल त्रिज्या के रूप में बॉयर–लिंडक्विस्ट (Boyer–Lindquist) $r$ का उपयोग करता है; वहाँ गिरते हरे वक्र का $\varphi$ $r_+$ पर असीमित रूप से लिपटता जाता है, जो एक निर्देशांक प्रभाव है।'
meanings:
- द्रव्यमान, स्पिन और आवेश का हर संयोजन एक बैच के रूप में, $G = c = 1$
- $\Delta = 0$ के मूल; $a^2 + Q^2 > M^2$ होने पर NaN (नग्न)
- स्थैतिक सीमा $g_{tt} = 0$, फ़्रेम $\times$ ध्रुवीय कोण पर ब्रॉडकास्ट
- बॉयर–लिंडक्विस्ट मीट्रिक का घूर्णी $(t, \varphi)$ खंड
- शून्य-कोणीय-संवेग प्रेक्षक का कोणीय वेग; क्षितिज पर $\Omega_H = a/(r_+^2 + a^2)$
- त्रिज्या ग्रिड पर मीट्रिक के अवकलज autograd से
- वृत्तीय कक्षा का कोणीय वेग और ऊर्जा; $E$ के न्यूनतम पर ISCO, फ़ोटॉन कक्षा वहाँ जहाँ कक्षा को वेग $c$ चाहिए
- पृष्ठ गुरुत्व, $T_H = \kappa/2\pi$; चरम होल के लिए शून्य
labels:
  angle: मिश्रण कोण $\psi$ ($0°$ शुद्ध स्पिन, $90°$ शुद्ध आवेश)
  chi_max: $\sqrt{a^2 + Q^2}/M$ तक स्वीप
  frames: फ़्रेम
  grid: बैच्ड $(a, Q)$ सर्वेक्षण में प्रति अक्ष ग्रिड बिंदु
