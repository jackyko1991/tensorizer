source_hash: 160447300c99
title: 'МРТ: релаксация T1 и T2 и контраст изображения'
summary: После радиочастотного импульса намагниченность каждой ткани восстанавливается вдоль поля с постоянной времени $T_1$, а её поперечная часть затухает с $T_2$. Вычисление сигнала спинового эха как одного тензора по (ткань, $TR$, $TE$) и свёртка его с картой меток тканей схематичного мозга показывают, как выбор $TR$ и $TE$ делает изображение T1-, PD- или T2-взвешенным.
notes: 'Короткие $TR$ и $TE$ дают T1-взвешивание: жир и белое вещество яркие, ЦСЖ тёмная, поскольку при её длинном $T_1$ намагниченность не успевает восстановиться. Длинное $TR$ при коротком $TE$ убирает множитель $T_1$, оставляя взвешивание по протонной плотности (PD). Длинные $TR$ и $TE$ дают T2-взвешивание: ЦСЖ с её очень длинным $T_2$ становится самой яркой тканью. Простая формула не учитывает влияние перефокусирующего импульса на $M_z$ и предполагает $TR \gg TE$. Каждое изображение нормируется по своему самому яркому пикселю, как на дисплее томографа. Параметры тканей — грубые учебниковые значения при 1,5 Тл, только для обучения, не для клинического применения. Попробуйте менять короткие и длинные $TR$/$TE$ и посмотрите, как контраст серого и белого вещества меняется на обратный.'
meanings:
- времена релаксации и протонная плотность $S = 5$ тканей (приближённые значения при 1,5 Тл)
- продольное восстановление, транслируемое (broadcast) по ткани $s$ и времени $t$
- поперечное затухание каждой ткани
- сигнал спинового эха для каждой ткани, времени повторения $TR_a$ и времени эха $TE_b$ (суммирования нет)
- 'карта меток в one-hot кодировке: какая ткань заполняет пиксель $(x, y)$'
- 'повторяющийся $s$ ⇒ суммирование: изображение для каждой пары $(TR, TE)$'
- время инверсии, при котором $M_0(1 - 2e^{-t/T_1})$ проходит через ноль; используется для подавления жира (STIR) или ЦСЖ (FLAIR)
labels:
  tr_short: Короткое время повторения $TR$
  tr_long: Длинное время повторения $TR$
  te_short: Короткое время эха $TE$
  te_long: Длинное время эха $TE$
  size: Размер фантома
  n_frames: Кадры анимации
