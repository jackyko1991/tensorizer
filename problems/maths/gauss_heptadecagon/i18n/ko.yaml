source_hash: 107eff242684
title: 자와 컴퍼스로 그리는 가우스의 정17각형
summary: 1796년, 19번째 생일을 한 달 앞두고 가우스는 정17각형을 자와 컴퍼스로 그릴 수 있음을 발견했다. 고대 그리스 이후 처음으로 찾은 새로운 작도 가능 다각형이다. 1의 17제곱근을 가우스 주기로 묶으면 이차방정식의 사슬이 풀린다. 이 사슬은 $\cos(2\pi/17)$를 제곱근만으로 쓴다. 이어서 Richmond의 1893년 작도법이 다각형을 한 단계씩 그리며, 직선과 원의 교점은 텐서 연산으로 쓰여 있다. 어떤 정$n$각형이 작도 가능한지 격자로 보여 준다(가우스–방첼 정리). 여기 있는 모든 것은 증명된 고전 수학이다.
notes: 가우스는 1796년 3월 30일, 19번째 생일 직전에 정17각형을 찾았고, 이 일로 문헌학 대신 수학을 택했다고 전해진다. 그는 이 이론을 『산술 연구』(Disquisitiones Arithmeticae, 1801)의 마지막 절에 발표했다. 아이디어는 이렇다. 3이 원시근이므로 16개의 비자명한 근 $\zeta^k$는 $k \mapsto 3k \bmod 17$에 의해 순환적으로 치환된다. 이 순환 순서에서 하나 걸러 하나씩 근을 더하면 8항짜리 주기 두 개가 생기고 $\eta_0 + \eta_1 = -1$, $\eta_0\eta_1 = -4$을 만족하므로 $\eta_{0,1} = (-1 \pm \sqrt{17})/2$이다. 다시 반으로 나누면 4항, 2항, 1항 주기가 나온다. 부분군의 위수가 $16 \to 8 \to 4 \to 2 \to 1$로 모두 2의 거듭제곱이므로, 각 쌍은 한 단계 위의 주기를 계수로 하는 이차방정식의 두 근이다. 2항 주기는 $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$이므로 제곱근 네 번으로 가우스의 공식이 나온다. 프로그램은 모든 이차 관계를 정확한 정수 계수로 확인하고, 제곱근만으로 모든 주기를 다시 세우며, 닫힌 공식을 `torch.cos`와 비교한다(sympy가 설치되어 있으면 60자리로도 확인한다). 어떤 원시근(3, 5, 6, 7, 10, 11, 12, 14)을 써도 순서만 다른 같은 나무가 나온다. 제곱근은 자와 컴퍼스로 할 수 있는 연산이므로 다각형은 작도 가능하다. H. W. Richmond(1893)는 단위원 위의 짧은 작도법을 제시했다. 수직 반지름 위에 $OJ = OB/4$를 잡는다. 지름 위에 $\angle OJE = \tfrac14\angle OJP_0$가 되도록 $E$를 잡고(각의 이등분 두 번), $\angle EJF = 45°$가 되도록 $F$를 잡는다. $FP_0$를 지름으로 하는 원이 $OB$와 $K$에서 만난다. $E$를 중심으로 $K$를 지나는 원이 지름과
  $N_3 = \cos(6\pi/17)$, $N_5 = \cos(10\pi/17)$에서 만나고, 거기서 세운 수선이 $P_3$와 $P_5$를 준다. 여기서는 모든 단계가 실제로 두 점을 지나는 직선이나, 한 점을 중심으로 다른 점을 지나는 원을 그린다. 새 점은 모두 직선–직선, 직선–원, 원–원 교점이며, 나머지 꼭짓점은 원으로 옮겨 찍는다. $P_k$를 중심으로 $P_{k-1}$를 지나는 원, 그리고 거울상에는 $P_0$를 중심으로 $P_k$를 지나는 원을 쓴다. 55단계로 17개 꼭짓점이 모두 float64에서 $e^{2\pi i k/17}$로부터 약 $10^{-15}$ 안에 놓인다. float32로 바꾸면 반올림 오차가 약 $10^{-6}$까지 커지는 것을 볼 수 있다. 가우스는 $p_i = 2^{2^j} + 1$가 서로 다른 페르마 소수이고 $n = 2^k p_1 \cdots p_r$일 때 정$n$각형이 작도 가능하다고 말했다. 방첼(1837)은 다른 $n$은 안 된다는 것을 증명했고, 이로써 각의 삼등분과 정육면체 배적 문제도 해결되었다. 이는 오일러 함수 $\varphi(n)$가 2의 거듭제곱이라는 것과 같으며, 격자는 $n$까지 두 판정을 모두 확인한다. 알려진 페르마 소수는 3, 5, 17, 257, 65537뿐이다. Richelot은 1832년에 정257각형을 발표했고, J. G. Hermes는 약 10년을 들여 정65537각형을 1894년에 완성했으며 원고는 괴팅겐에 보관되어 있다. 가우스는 묘비에 정17각형을 새겨 달라고 했지만, 원처럼 보일 것이라며 석공이 거절했다고 전해진다. 브라운슈바이크의 가우스 기념비에는 대신 17개의 꼭짓점을 가진 별이 새겨져 있다.
meanings:
- 1의 17제곱근, 복소평면 위 정17각형의 꼭짓점
- '원시근의 거듭제곱 순서로 늘어놓은 지수, $g = 3$: 1, 3, 9, 10, 13, …'
- '순환 순서의 어느 위치가 단계 $m$의 주기 $i$를 이루는지: $2^m$개마다 하나'
- '반복되는 $j$ ⇒ 합: 다섯 단계(길이 16, 8, 4, 2, 1)의 가우스 주기 전부를 한 번에'
- 형제 주기 둘의 곱은 $\zeta^{a+b}$의 합; 지수를 세면 부모 단계의 주기 위에서 일정한 정수가 나온다
- '반복되는 $k$ ⇒ 합: 한 단계 위에서 얻는 각 이차방정식의 상수항'
- '단계마다 제곱근 한 번: $16 \to 8 \to 4 \to 2 \to 1$; 단계 3에는 $2\cos(2\pi k/17)$가 있다'
- '자와 컴퍼스의 세 동작을 텐서 공식으로: 외적으로 푸는 $2\times 2$ 연립방정식, $t$에 대한 이차방정식, 두 원의 근축'
- 체로 구한 오일러 함수; $\varphi(n)$가 2의 거듭제곱일 때에만 작도 가능, $x \,\&\, (x-1) = 0$로 판정
- '홀수 부분이 $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$를 나누어야 한다: 서로 다른 페르마 소수의 곱'
labels:
  generator: 순환 순서의 원시근 $g$
  precision: 작도 정밀도
  n_max: 작도 가능성 격자 상한 $n$
