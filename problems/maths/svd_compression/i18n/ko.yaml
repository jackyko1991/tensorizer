source_hash: 7d50d95577a3
title: SVD를 이용한 이미지 압축
summary: 특이값 분해는 이미지를 계수 1 층 $\sigma_r\,\mathbf u_r\mathbf v_r^T$의 합으로, 강한 것부터 나타낸다. $k$개 층만 남기는 것이 최선의 계수 $k$ 근사이고, 그 오차는 정확히 버린 특이값의 에너지이며, 컬러 이미지는 배치 호출 한 번으로 분해되는 세 행렬이다.
notes: $H\times W$ 이미지의 층 $k$개를 저장하려면 $HW$개 대신 $k(H + W + 1)$개의 수가 필요하므로 압축률은 $HW / k(H + W + 1)$이다. 에카르트–영 정리에 따르면 프로베니우스 노름으로 $A$에 더 가까운 계수 $k$ 행렬은 없으며, 오차는 빠진 특이값의 제곱의 합이다. 터미널은 여러 $k$에 대해 실제로 재구성한 이미지와 비교해 이를 확인한다. 장면의 매끄러운 부분(하늘의 그라데이션)은 처음 몇 개 층으로 잡히지만, 날카로운 경계, 대각선, 글자에는 많은 층이 필요하다. 그래서 특이값이 처음에는 빠르게, 그 뒤로는 천천히 줄어들며, JPEG는 대신 국소 코사인 변환을 쓴다. 첫 번째 층은 대략 평균 밝기 분포이고, 이후 층들은 부호가 번갈아(빨강과 파랑) 세부를 더한다. 이미지는 절차적으로 그리므로 아무것도 내려받지 않는다. 더 큰 이미지나 더 높은 최대 계수를 시도해 보자.
meanings:
- matplotlib으로 그린 장면의 채널 $c$, 행 $i$, 열 $j$, 값은 $[0, 1]$
- '반복된 $c$ ⇒ 합산: 가중치 $(0.299, 0.587, 0.114)$로 계산한 밝기'
- 채널마다 SVD 하나, 앞쪽 첨자 $c$에 대해 배치; $R = \min(H, W)$
- '반복된 $r \le k$ ⇒ 합산: 처음 $k$개 계수 1 층'
- '반복된 첨자 없음: 회색 이미지의 외적 층 하나'
- 모든 $k$에 대한 에카르트–영 오차를 이미지 재구성 없이 한꺼번에
- dB 단위의 최대 신호 대 잡음비, 평균 제곱 오차는 버린 $\sigma$들로부터
labels:
  size: 이미지 크기 (픽셀)
  k_max: 보여 줄 최대 계수 $k$
  frames: 애니메이션 프레임 수
