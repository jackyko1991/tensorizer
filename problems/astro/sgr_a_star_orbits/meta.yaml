title: 'Weighing Sgr A*: the orbit of the star S2'
category: astro
level: intermediate
order: 8
tags: [shaw:2008, nobel:physics:2020, crafoord:2012]
summary: >
  The star S2 circles the centre of the Milky Way every 16 years, passing within 120 AU of an invisible mass. A
  Keplerian orbit, with Kepler's equation solved by vectorised Newton iterations, is fitted to 25 years of real
  positions and radial velocities. Levenberg–Marquardt with autograd Jacobians runs from 64 random starts at once
  and recovers a black hole of about $4.3\times 10^6\,M_\odot$ at $R_0 \approx 8.3$ kpc. The fit then predicts the two
  relativistic effects GRAVITY later detected: about 200 km/s of redshift at pericentre and $12'$ of precession per
  orbit.
animated: true
vector_form: 'E - e\sin E = \frac{2\pi}{P}(t - t_p),\qquad \mathbf r = R_z(\Omega)R_x(i)R_z(\omega)\begin{pmatrix} a(\cos E - e)\\ a\sqrt{1-e^2}\sin E\\ 0\end{pmatrix},\qquad P^2 = \frac{4\pi^2 (aR_0)^3}{GM}'
index_form: 'E_{bt} \leftarrow E_{bt} - \frac{E_{bt} - e_b\sin E_{bt} - M_{bt}}{1 - e_b\cos E_{bt}},\qquad r_{bti} = R_{bij}\,q_{btj},\qquad \chi^2_b = \sum_n \Big(\frac{y_{bn} - y_n^{\mathrm{obs}}}{\sigma_n}\Big)^2,\qquad (J^\top J + \lambda\,\mathrm{diag})_{bkl}\,\delta_{bl} = -J_{bnk}\,r_{bn}'
