title: 'Optimal transport with Sinkhorn'
category: maths
level: advanced
order: 11
summary: >
  How do you move a pile of sand shaped like a ring into two heaps, and then into a spiral, with the least total
  effort? Optimal transport finds the plan $P_{ij}$ that moves mass from $x_i$ to $y_j$ at cost $|x_i - y_j|^2$;
  its minimum is the squared Wasserstein distance $W_2^2$. Adding a little entropy $\varepsilon$ makes the problem
  solvable by Sinkhorn's alternating updates, written here in the log domain with logsumexp for a whole batch of
  $\varepsilon$ at once; as $\varepsilon \to 0$ the cost drops to the exact optimum found by the Hungarian algorithm.
animated: true
vector_form: 'W_2^2(\mu, \nu) = \min_{P\mathbf 1 = a,\ P^\top\mathbf 1 = b,\ P \ge 0} \langle P, C\rangle,\qquad \mathrm{OT}_\varepsilon = \min_P \langle P, C\rangle + \varepsilon\,\mathrm{KL}(P \,\|\, a \otimes b),\qquad P = \operatorname{diag}(a\,e^{f/\varepsilon})\,e^{-C/\varepsilon}\operatorname{diag}(b\,e^{g/\varepsilon})'
index_form: 'C_{ij} = (x_{ik} - y_{jk})(x_{ik} - y_{jk}),\qquad f_{ei} = -\varepsilon_e \log \sum_j b_j\,e^{(g_{ej} - C_{ij})/\varepsilon_e},\qquad g_{ej} = -\varepsilon_e \log \sum_i a_i\,e^{(f_{ei} - C_{ij})/\varepsilon_e},\qquad P_{eij} = a_i b_j\,e^{(f_{ei} + g_{ej} - C_{ij})/\varepsilon_e}'
translation:
  - {symbol: 'x_{ik},\ y_{jk}', code: 'ring(N), two_blobs(N), spiral(N)', shape: '(N, 2)', meaning: 'synthetic point clouds generated from formulas and random numbers, each point with mass $a_i = 1/N$'}
  - {symbol: 'C_{ij}', code: "einsum('ijk,ijk->ij', x[:, None] - y[None], x[:, None] - y[None])", shape: '(N, M)', meaning: 'squared distance, repeated $k$ ⇒ summed'}
  - {symbol: '\varepsilon_e', code: 'torch.logspace(0, log10(eps_min), E)', shape: '(E,)', meaning: 'a batch of regularisation strengths solved at the same time'}
  - {symbol: 'f_{ei}', code: '-eps * logsumexp(log_b + (g[:, None] - C) / eps, dim=-1)', shape: '(E, N)', meaning: 'Sinkhorn update in the log domain, sum over $j$ as a logsumexp; never overflows even for tiny $\varepsilon$'}
  - {symbol: 'g_{ej}', code: '-eps * logsumexp(log_a[:, None] + (f[..., None] - C) / eps, dim=-2)', shape: '(E, M)', meaning: 'the same over $i$: after it, the column sums of $P$ equal $b$ exactly'}
  - {symbol: 'P_{eij}', code: 'exp(log_a[:, None] + log_b + (f[..., None] + g[:, None] - C) / eps)', shape: '(E, N, M)', meaning: 'transport plan: blurred for large $\varepsilon$, almost a permutation for small $\varepsilon$'}
  - {symbol: 'T(x_i)', code: "einsum('ij,jk->ik', P, y) / P.sum(-1, keepdim=True)", shape: '(N, 2)', meaning: 'barycentric map: where the mass of $x_i$ goes; points move on straight lines $(1-t)\,x + t\,T(x)$ (McCann interpolation)'}
  - {symbol: 'S_\varepsilon', code: 'sinkhorn_divergence(x, a, y, b, eps, n_iter)', shape: '(E,)', meaning: '$\mathrm{OT}_\varepsilon(\mu,\nu) - \tfrac12\mathrm{OT}_\varepsilon(\mu,\mu) - \tfrac12\mathrm{OT}_\varepsilon(\nu,\nu)$, zero when $\mu = \nu$'}
notes: >
  Monge posed the problem in 1781 and Kantorovich relaxed it to plans $P$ in 1942. Cuturi (2013) showed that the
  entropic version is solved by Sinkhorn's matrix scaling, a few matrix products per iteration, which made optimal
  transport practical in machine learning. Small $\varepsilon$ needs care: the code works with the potentials
  $f, g$ and logsumexp instead of $e^{-C/\varepsilon}$ (which underflows), and anneals $\varepsilon$ from 1 down
  to its target ($\varepsilon$-scaling). The cost $\langle P_\varepsilon, C\rangle$ decreases to the exact
  $W_2^2$ computed by the Hungarian algorithm (a slow exact reference, checked against brute force over all
  permutations), while the dual value $\mathrm{OT}_\varepsilon$ carries an entropic bias that the Sinkhorn
  divergence of Feydy et al. (2019) removes. The tests also check two closed forms: in one dimension the optimal
  plan pairs sorted points (quantile functions), and between Gaussians $W_2^2 = |m_1 - m_2|^2 + \operatorname{tr}(S_1
  + S_2 - 2(S_1^{1/2} S_2 S_1^{1/2})^{1/2})$ (the Bures metric), using Brenier's theorem that the gradient of a
  convex function is the optimal map. All shapes are generated by the code; no images are used.
tags: []
params:
  n_points: {default: 250, min: 50, max: 800, step: 50, type: int, label: 'Points per shape $N$'}
  eps_min: {default: 0.002, min: 0.0005, max: 0.1, step: 0.0005, label: 'Smallest regularisation $\varepsilon$'}
  n_eps: {default: 8, min: 3, max: 16, step: 1, type: int, label: 'Values of $\varepsilon$ in the batch'}
  n_iter: {default: 600, min: 100, max: 3000, step: 50, type: int, label: Sinkhorn iterations}
