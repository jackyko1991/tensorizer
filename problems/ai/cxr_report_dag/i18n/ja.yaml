source_hash: 433f576ee66b
title: DAG テンソルで胸部 X 線からレポートへ：CNN と小さな言語モデルをつなぐ
summary: これは教材用のおもちゃであり、臨床レポート生成ではありません。小さな CNN が 410 枚の NIH 胸部 X 線画像から六つの所見を学習し、小さな文字レベルの GPT が書き出されたラベルヘッダーからテンプレートレポート（"enlarged heart. pleural effusion. no pneumothorax."）を学習します。両者はそれぞれ単独で訓練されます。一本の DAG の辺がそれらをつなぎます。コネクタが CNN の所見確率をソフトなヘッダーに変換し、言語モデルは画像だけからレポートを書きます。訓練プロセス自体もテンソル DAG であり（規則のレベル分け、max-plus のクリティカルパス、各規則はシード全体に対して一回のバッチ呼び出し）、同じ計算量でエンドツーエンドに訓練した同じネットワークと比較したうえで、オープンライセンス（CC BY）の PubMed Central 論文から得た 251 件の実テキスト（図のキャプションとその X 線画像を引用する文）で微調整します。ステージ 2 の結果は弱く、これほど少ないペアでは予想どおりであり、このページでもそう明記しています。
notes: これは何か。教材用のおもちゃであり、臨床レポート生成ではありません。モデルは小さく、画像は 64×64、ノイズを含むラベルは数百個しかなく、本物の放射線科レポートもありません。ここにある内容は臨床的な精度について何も示しません。このアイデア（別々に訓練したネットワークを DAG テンソルで接続し、全体として最適化し、プロセス全体も DAG テンソルで制御する）は Jacky Ka Long Ko によるものです。この問題は、本シリーズの前の問題での CNN + 小さな言語モデルの接続を、胸部 X 線画像と（ごく短い）レポートのように読めるテキストに持ち込みます。なぜ本物のレポートがないのか。公開されているレポートのコレクションはいずれも、ここで用いるライセンス規則（オープン、再配布可能、商用利用可）を満たしません。IU X-ray / OpenI（Demner-Fushman et al. 2016）は CC BY-NC-ND、MIMIC-CXR（Johnson et al. 2019）、VinDr-CXR、BRAX はデータ利用契約のもとでの資格付きアクセスが必要で、CheXpert と PadChest は研究目的に限られます。そのためステージ 1 では NIH のラベル集合からコードで生成したテンプレートレポートを使い、これはテキストとして言語化されたマルチラベル分類になります。ステージ 2 では CC BY の PubMed Central 論文から、図のキャプションとその図を引用する文を使います。これらは症例報告のために書かれた短く不均質なテキストで、矢印やパネルを指していることがよくあります。何が新しく、何が新しくないか。胸部 X 線からのレポート生成は活発な分野です（Jing et al. 2018、R2Gen by Chen et al. 2020）。事前学習済みの画像エンコーダを小さな学習可能コネクタで言語モデルにつなぐのは、LLaVA（Liu et al. 2023）や BLIP-2（Li et al. 2023）の構成そのものです。この問題が加えるのはオーケストレーションです。モデルのグラフと訓練プロセスの両方を Circle of Willis ワークフロー問題のテンソル DAG エンジンで実行し（data/training.smk
  から解析した規則グラフ、Kronecker ジョブグラフ、ブール値のレベル分け、max-plus のクリティカルパス）、各規則はシード全体に対する一回のバッチ呼び出しで、DAG で組んだモデルを同じ計算量のモノリスと比較します。データ。NIH ChestX-ray14（Wang et al. 2017、NIH Clinical Center。出典表示のうえ利用制限なし）：正面 PA 画像 549 枚、患者一人につき一枚、六つの所見（心拡大、胸水、浸潤影、無気肺、気胸、腫瘤または結節）またはなし、一枚につき最大二つ。訓練用 410 枚、テスト用 139 枚。ラベルはレポートから NLP で抽出されたもので、ノイズを含みます（約 10 % 以上が誤り）。PMC：316 本のオープンアクセス論文から得た 316 枚の胸部 X 線図で、すべて CC BY です（論文自身の XML のライセンスで確認。規則：CC BY、CC BY-SA、CC0 は可、NC、ND、その他、記載なしは不可）。候補は ROCOv2 のメタデータ（Rückert et al. 2024）から得ましたが、PMCID の索引としてのみ使い、ROCOv2 のものは何も同梱していません。確認した 2114 本の論文のうち 1575 本を採用し、539 本をライセンスにより除外しました（すべて CC BY-NC）。ステージ 2 のテキストは、キャプションの後に同じ論文中でその図を引用する文を続けたもので（316 本中 315 本に少なくとも一文あり）、完全な文のみ、最大 360 文字、つまり小さな言語モデルのコンテキスト長です。中央値 35 語（IQR 26–45）で、キャプション単独では 12 語（8–18）です。すべての図とテキストの出典は data/ATTRIBUTION.csv に記載し、data/SOURCES.md に出典、条件、件数、チェックサム、処理内容をまとめています。モデルと訓練 DAG。CNN：三層のグループ畳み込み、重み 41 014 個、sigmoid 出力六つ（マルチラベル、陽性は希少さに応じて重み付け）。言語モデル：二層の文字 GPT（d = 32、ヘッド四つ、重み 40 108 個）をすべてのテンプレートで訓練し、ラベルヘッダーを六文字で先頭に書きます（"ce----"、続いて
  "enlarged heart. pleural effusion."）。コネクタ（重み 2848 個）：六つの確率 $q$ とスロットベクトル $S_t$ から、ヘッダーを置き換える $K = 6$ 個のソフトトークンを作ります。レベル：0 train_cnn ∥ train_lm ∥ train_monolith、1 train_connector（CNN と言語モデルは凍結）、2 global_finetune ∥ train_router、3 caption_finetune（PMC テキストでコネクタ + 言語モデル、CNN は凍結）、4 evaluate。テストでは、レベルとクリティカルパス、ジョブグラフが冪零であること、一つのスタック内の二つのシードがそれぞれ単独の場合とまったく同じに訓練されること（float32 の丸め誤差まで）、あるモデルの損失が他のモデルに勾配を送らないこと、コネクタのステージがコネクタだけを変えること、そして固定ルーターを持つ MoE 層が DAG の配線と 1e-6 以内で一致すること（勾配も含む）を確認します。レポートは貪欲法で生成し（キー/バリューキャッシュを使用し、通常の順伝播と照合してテスト済み）、キーワードでラベルに解析し直します。否定（"no pneumothorax."）も扱います。ステージ 1 の結果（シード 2 つ、テスト画像 139 枚、シード平均。results/stages.csv にすべての数値）。CNN 単独：平均 AUROC 0.62（偶然レベルは 0.5）、閾値 0.5 での micro F1 0.31（訓練データの有病率でランダムに推測した場合：0.16）。そのラベルをヘッダーとして書き、言語モデル単独に渡した場合：micro F1 0.32。つまり言語モデルは忠実に言語化します（出力の 0.90 が正しい形式のテンプレートで、見たことのないラベル集合でも同様）。接続したモデル：コネクタのステージ後に micro F1 0.22、全体の微調整後に 0.20（実行とシードによって 0.15 から 0.25）、どのレポートも正しい形式のテンプレートで、0.26 から 0.27 が真のラベルのテンプレートと完全一致。モノリス、つまり同じネットワークを 410 組の画像–レポートのペアで同じ積和演算回数（405
  回の同時ステップ）でエンドツーエンドに訓練したものは、どの画像にも "clear lungs." か "normal chest." と書きます。micro F1 は 0、完全一致は 0.27（正常画像の割合）。したがって DAG パイプラインは、CNN のラベル教師とすべてのテンプレートテキストを再利用するため明らかにモノリスに勝りますが、CNN 単独には勝てません。テンプレートレポートは分類器が知っていることを言い換えるだけであり、尤度で訓練した接続モデルは最も確率の高いレポートを書くため、画像があいまいなときは「正常」に傾きます。一方、CNN の希少度で重み付けした閾値は再現率を優先し、$F_1$ はそれを評価します。微調整の効果はわずかです。DAG の辺 = MoE のディスパッチ。入力層を専門家の混合（画像の専門家 = CNN + コネクタ、テキストの専門家 = トークン埋め込み）とみなし、データの種類による one-hot の $G$ を使うと、DAG で配線した出力が厳密に得られます（テスト済み）。専門家を凍結したまま密な混合として訓練し、その後 top-1 で使う（ルーティングしてから選ばれた専門家を実行する）線形ルーターは、すべての位置をそのモダリティの専門家に送ります（両シードともルーティング精度 1.00）。そのため、そのレポートとスコアは固定ルーターのものと一致します。ステージ 2 の結果（ホールドアウトした PMC の図 65 枚）：予想どおり弱いです。251 件のテキストで 150 ステップ訓練した後、モデルは "chest x-ray showing" と書き、その後は文字の羅列になります。BLEU-1 0.05、ROUGE-L 0.06、所見キーワードの再現率 0、ホールドアウトの交差エントロピーは一文字あたり 2.32 nats。別の図の画像を与えても何も変わりません（2.32 nats、同じスコア）。画像は使われていないのです。固定の訓練テキストを一つ返すだけのブラインドなベースラインのほうが高いスコアになります（BLEU-1 0.17、ROUGE-L 0.22）。重み 40 000 個の文字言語モデルでは、CPU で一分間、約 70 000 文字からこの言語を学ぶことはできません。以前のバージョンの最初の節だけのキャプション（中央値
  6 語）では ROUGE-L は約 0.28 でしたが、それらのテキストはほとんど文になっていませんでした。DAG の仕組みは機能しています。ステージ 2 にはデータがあまりにも少なすぎるのです。時間。6 コアのデスクトップ CPU で、マシンが空いていれば訓練は約 85 s で、これに GIF の作成に約 30 s かかります。他の重いジョブとマシンを共有していると、計測時間は二倍から三倍に増えます（GIF と timings.csv に示した実行はそのような負荷のもとで行ったため、秒数が大きくなっています）。最も影響を受けるのはキャプションのステージです。規則ごとにワーカーが一つの場合、max-plus のクリティカルパスは CNN → コネクタ → 微調整 → キャプション → 評価 です。torch が GPU を認識するとコードはそれを使います（pixi run -e cuda）。デフォルト環境には CPU 版の torch が入っているため、同梱の数値はすべて CPU によるものです。試してみよう。キャプションのステップを増やす（ステージ 2 はゆっくり改善します）、全体の微調整をなくす（0 ステップ）、CNN のステップを減らす（CNN がすべての上限を決めます）、あるいはシードを一つにしてシード間のばらつきがどれほどかを見てみましょう。
meanings:
- 規則 $s$ は規則 $r$ が書いたものを読む。訓練プロセスは Circle of Willis 問題のパーサーで data/training.smk から解析したもの
- 各規則のレベル：CNN、言語モデル、モノリスが 0、コネクタが 1、微調整とルーターが 2、キャプションが 3、評価が 4
- 計測した規則の所要時間から求めた max-plus の終了時刻。$\max t$ がクリティカルパス
- 各画像に対する CNN の六つの所見確率（sigmoid、マルチラベル）。モデル軸 $m$ は各層で一つのグループ畳み込みのグループになる
- DAG の辺：所見確率とスロットベクトル $S_t$ → 言語モデルの入力ベクトル。$K = 6$ 個のソフトトークンが書き出されたラベルヘッダーを置き換える
- ルーター：データの種類（ヘッダースロットか文字か）による one-hot、または位置特徴に対する学習済み softmax（密に訓練し、top-1 で使用）
- 繰り返される $x$ ⇒ 和：MoE 層の結合。各専門家 $Y^x$ は割り当てられたグループ上でのみ計算される
- 小さな GPT の次の文字のロジット（モデル軸付きの einsum アテンション、chain_of_thought から）
- ヘッダーの後のレポート文字に対するモデルごとの損失（nats）。$M$ 個の損失を足すと各モデルがそれぞれ自分の勾配を得る
- 繰り返される $n$ ⇒ 和：書かれた各レポートから解析し直したラベルの真陽性。micro $F_1$ はそれらを $f$ にわたってまとめる
labels:
  seeds: シード数（独立な反復）
  steps_cnn: CNN の事前学習ステップ数
  steps_lm: 言語モデルの事前学習ステップ数（テンプレートレポート）
  steps_con: コネクタのステップ数（CNN と言語モデルは凍結）
  steps_ft: 全体の微調整ステップ数
  steps_router: 学習ルーターのステップ数
  steps_cap: キャプション微調整ステップ数（ステージ 2）
  lr_ft: 微調整の学習率
  lr_cap: キャプションの学習率
