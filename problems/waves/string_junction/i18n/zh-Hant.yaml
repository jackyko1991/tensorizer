source_hash: 162fb2c64168
title: 弦接點處的脈波
summary: 兩條線密度不同的弦綁在一起。從左方來的脈波在結點處分成反射脈波與透射脈波，其振幅由阻抗 $Z = \sqrt{T\mu}$ 決定。二階導數是以模板 $(1, -2, 1)$ 進行的一維卷積。
notes: 結點不會斷開，所以 $u$ 連續；結點無質量，所以兩側的橫向力 $T u_x$ 平衡。這兩個條件給出 $R$ 與 $\mathcal T$。較重的右弦（$Z_2 > Z_1$）使脈波倒立反射，如同固定端；較輕的右弦使其正立反射，如同自由端。透射脈波總是正立，並以 $c_2 = \sqrt{T/\mu_2}$ 前進，因此按 $c_2/c_1$ 被壓縮或拉長。脈波攜帶的能量與 $Z\,A^2$ 成正比，由此得到能流平衡 $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$。單位：$T = 1$、$\mu_1 = 1$，弦從 $-1$ 到 $1$。灰色虛線標示預測的振幅。觀察較快的那條弦：其脈波抵達遠端牆壁後反彈回來。
meanings:
- 格點 $i$ 的位移；兩個遠端皆固定
- 線密度：左側 $\mu_1$，右側 $\mu_2$，結點處取平均
- 重複的 $j$ ⇒ 求和：模板沿弦滑動
- 弦 $k$ 的波阻抗
- 由結點處 $u$ 與力 $T\,u_x$ 的連續性得到的振幅比
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$，守恆
labels:
  mu_ratio: 線密度比 $\mu_2/\mu_1$
  width: 脈波寬度
  t_max: 模擬時間
  n_points: 格點數
