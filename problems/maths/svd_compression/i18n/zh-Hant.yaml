source_hash: 7d50d95577a3
title: 以 SVD 壓縮影像
summary: 奇異值分解把影像寫成秩 1 圖層 $\sigma_r\,\mathbf u_r\mathbf v_r^T$ 之和，最強的在前。只保留 $k$ 層就是最佳的秩 $k$ 近似，其誤差恰好是被捨棄奇異值的能量，而彩色影像是三個矩陣，以一次批次呼叫分解。
notes: 儲存 $H\times W$ 影像的 $k$ 層需要 $k(H + W + 1)$ 個數，而非 $HW$ 個，因此壓縮比為 $HW / k(H + W + 1)$。Eckart–Young 定理指出，在 Frobenius 範數下沒有任何秩 $k$ 矩陣比它更接近 $A$，且誤差是被捨棄奇異值的平方和。終端會以數個 $k$ 實際重建的影像來驗證這一點。場景中平滑的部分（天空漸層）由前幾層就能捕捉，而銳利的邊緣、斜線與文字則需要許多層。這就是為什麼奇異值起初下降很快、之後緩慢衰減，也是 JPEG 改用局部餘弦轉換的原因。第一層大致是平均亮度剖面；後面的圖層正負號交替（紅與藍）以加入細節。影像是程序化繪製的，因此無需下載任何東西。試試更大的影像或更高的最大秩。
meanings:
- 以 matplotlib 繪製的場景的通道 $c$、列 $i$、行 $j$，值在 $[0, 1]$ 內
- 重複的 $c$ ⇒ 求和：權重為 $(0.299, 0.587, 0.114)$ 的亮度
- 每個通道一次 SVD，對首個指標 $c$ 批次處理；$R = \min(H, W)$
- 重複的 $r \le k$ ⇒ 求和：前 $k$ 個秩 1 圖層
- 沒有重複指標：灰階影像的一個外積圖層
- 同時算出每個 $k$ 的 Eckart–Young 誤差，無需重建任何影像
- 以 dB 表示的峰值訊噪比，均方誤差來自被捨棄的 $\sigma$
labels:
  size: 影像大小（像素）
  k_max: 顯示的最大秩 $k$
  frames: 動畫幀數
