<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two hidden states, background and island, with self-loops and switching transitions A; below, a DNA sequence whose middle stretch is a GC-rich island emitted by the island state">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- hidden states -->
    <circle cx="70" cy="52" r="20" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <circle cx="170" cy="52" r="20" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <text x="70" y="57" text-anchor="middle" font-size="13">bg</text>
    <text x="170" y="57" text-anchor="middle" font-size="13" fill="#ffffff">CpG</text>
    <!-- self loops -->
    <path d="M58,36 C44,6 96,6 82,36" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M158,36 C144,6 196,6 182,36" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- switches -->
    <path d="M92,45 Q120,34 148,45" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M148,60 Q120,71 92,60" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="113" y="33" font-style="italic" fill="#b91c1c">A</text>
    <!-- emissions -->
    <line x1="70" y1="74" x2="70" y2="112" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="170" y1="74" x2="140" y2="112" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="76" y="98" font-style="italic" fill="#374151">E</text>
    <!-- sequence with an island -->
    <rect x="100" y="116" width="96" height="24" fill="#93c5fd" opacity="0.6"/>
    <rect x="16" y="116" width="208" height="24" fill="none" stroke="#374151" stroke-width="2"/>
    <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" fill="#374151">
      <text x="28" y="133">A</text><text x="44" y="133">T</text><text x="60" y="133">T</text><text x="76" y="133">A</text><text x="92" y="133">C</text>
      <text x="108" y="133" fill="#1e40af">G</text><text x="124" y="133" fill="#1e40af">C</text><text x="140" y="133" fill="#1e40af">G</text>
      <text x="156" y="133" fill="#1e40af">C</text><text x="172" y="133" fill="#1e40af">G</text><text x="188" y="133" fill="#1e40af">G</text>
      <text x="204" y="133">A</text><text x="220" y="133">T</text>
    </g>
    <text x="16" y="156" font-size="12" fill="#374151">sequence <tspan font-style="italic">x</tspan><tspan font-size="9" baseline-shift="sub" font-style="italic">t</tspan></text>
    <text x="146" y="156" font-size="12" fill="#b45309">island?</text>
  </g>
</svg>
