source_hash: 94551bc4044d
title: 平衡化學方程式（零空間）
summary: 平衡方程式就是找出使每種元素與電荷守恆的係數 $\nu_s$。寫成矩陣即 $M\nu = 0$：係數就是元素–物種矩陣的零空間。一次批次 SVD 同時求解七個反應，從甲烷燃燒到酸性中的過錳酸根，並找出平衡方式不唯一的那一個。
notes: 每種元素對未知係數給出一條線性方程式，所以 $S$ 個物種與 $E$ 種元素構成一個 $E\times S$ 的系統 $M\nu = 0$。通常 $M$ 的秩為 $S-1$，解構成一條直線：平衡後的方程式在相差一個公因數的意義下唯一。SVD 以奇異值為 0（最後一個）的右奇異向量找出這條直線；除以其最小分量並嘗試乘數 $k = 1, 2, \dots$，便得到最小整數，例如 $\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$。對離子而言，電荷只是多一列：沒有它，$\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$ 會有二維零空間，有了它，熟悉的 $1{:}5{:}8 \rightarrow 1{:}5{:}4$ 氧化還原方程式便自然得出。過氧化物的例子 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$ 有兩個零奇異值：它隱藏了兩個獨立反應（$2\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$ 與 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$），兩者的任何正組合也都平衡。單靠代數無法挑出其中之一；真實的比例由化學（動力學、條件）決定。程式碼會顯示在二維零空間中令某一係數為零所得的基底反應。在 tensors.py 的 `REACTIONS` 中加入你自己的反應試試；剖析器能讀取括號與電荷，例如 'Ca3(PO4)2' 或 'Fe^3+'。
meanings:
- 反應 $r$ 中物種 $s$ 所含元素 $e$ 的原子數；第 q 列是電荷（來自小型化學式剖析器）
- 反應物為 $+1$，產物為 $-1$
- 不對任何指標求和：每一行都帶符號
- 所有反應填補到同一張量中；未使用的行固定為 $\nu_s = 0$
- 批次 SVD；奇異值由大到小排列
- 有多少奇異值為零：1 → 平衡唯一，2 → 兩個獨立反應
- 最後一個奇異向量，縮放使最小分量為 1，再乘以第一個能得到整數的 $k_r$
- 重複的 $s$ ⇒ 求和：生成的 $e$ 原子數；對每種元素與電荷皆為零
labels:
  show: 以矩陣顯示的反應
  max_scale: 嘗試的最大乘數 $k$
