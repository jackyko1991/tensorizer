source_hash: 88e5f57d0eb4
title: 망델브로 집합과 쥘리아 집합
summary: 복소수 픽셀 격자 전체에서 $z \mapsto z^2 + c$를 한꺼번에 반복한다. 궤도가 유계로 남는 점들은 망델브로 집합 $M$($c$를 바꾸고 $z_0 = 0$에서 시작) 또는 채워진 쥘리아 집합 $K_c$($c$를 고정하고 픽셀에서 시작)를 이룬다. 매끄러운 탈출 횟수와 도함수로 얻는 거리 추정 덕분에 해마 계곡으로 확대해 들어가는 내내 그림이 선명하며, $c$가 주 카디오이드 둘레를 도는 동안 쥘리아 집합의 모양이 바뀐다.
notes: '왜 $|z| > 2$에서 탈출로 판정할까: $|z| > \max(2, |c|)$이면 $|z^2 + c| \ge |z|^2 - |c| > |z|$이므로 궤도는 한없이 커진다. 따라서 $|c| > 2$인 모든 $c$는 첫 단계에서 탈출하고, $M$은 원판 $|c| \le 2$ 안에 있다. 여기서는 더 큰 탈출 반경 $R = 1000$을 쓰는데, 그래야 매끄러운 횟수 $\nu = n + 1 - \log_2 \ln|z_n|$이 정확해지기 때문이다. 무한대 근처에서 $z \mapsto z^2$는 매 단계 $\ln|z|$를 두 배로 만들고, $\log_2$가 정확히 그것을 되돌린다. 주 카디오이드는 $z^* = z^{*2} + c$가 끌개 고정점, 즉 $|2z^*| < 1$인 $c$의 집합이다. $2z^* = w$로 쓰면 $|w| \le 1$에 대해 $c = w/2 - w^2/4$이고, 주기 2 구는 2-주기 궤도가 끌개인 곳, $|4(1+c)| < 1$이다. 이 두 부분이 $M$의 전체 넓이 $\approx 1.5066$ 중 약 1.37을 차지하며, 그 안의 픽셀은 절대 탈출하지 않는다. 거리 추정 $d = |z_n|\ln|z_n|/|z''_n|$은 퍼텐셜 $G(c) = \lim 2^{-n}\ln|z_n|$에서 $G/|\nabla G|$로 얻는다. 집합 근처에서 실제 거리는 이 값의 대략 2배 범위 안에 있다(쾨베 1/4 정리의 결과). 쥘리아 패널은 고정점이 중립인 카디오이드의 가장자리에 $c$를 둔다. 그곳에서는 $c \in M$이므로 $K_c$가 항상 연결되어 있지만, 각도에 따라 모양이 완전히 달라진다. 각 쥘리아 집합은 그 $c$ 근처의 $M$과 닮았으며, 그래서 $M$을 확대하면 작은 쥘리아 집합들이 보인다. 약 $10^{-13}$보다 깊은 확대에는 complex128의 16자리보다 많은 자릿수가 필요하다.'
meanings:
- 픽셀 $p$마다 복소수 하나; 합산하는 첨자 없이 모든 픽셀이 독립적으로 진행
- 아직 반복 중인 모든 픽셀에 대한 이차 사상 한 단계
- '연쇄 법칙: $M$은 $c'' = 1$($c$에 대한 도함수), 쥘리아 집합은 $c'' = 0$, $z''_0 = 1$($z_0$에 대한 도함수)'
- $|z_p| > R$인 첫 단계; 탈출한 픽셀은 텐서에서 빠지므로 계산량이 줄어듦
- '매끄러운(연속) 탈출 횟수: 띠 사이에 색 계단이 없음'
- '거리 추정: $d_p$가 1/4 픽셀보다 작은 픽셀을 어둡게 그려 가는 필라멘트를 드러냄'
- 주 카디오이드에 대한 정확한 판정(주기 2 구는 $|c+1| \le \frac14$), $q = (x-\frac14)^2 + y^2$
