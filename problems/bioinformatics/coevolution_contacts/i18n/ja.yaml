source_hash: 293708490c35
title: 共進化からのタンパク質コンタクト予測（DCA）
summary: 折りたたまれたタンパク質で接触している残基は、進化の過程で一緒に変異する。トイモデルのタンパク質を立方格子上に折りたたみ、そのコンタクトに結合 $J_{ij}(a,b)$ を植え込み、Potts モデルからギブスサンプリングで多重配列アラインメントを生成する。そしてアラインメントだけからコンタクトを復元する：one-hot の einsum による対統計量、平均場 DCA $J \approx -C^{-1}$（または autograd による擬似尤度）による直接結合、APC 補正したフロベニウススコアを求め、真のコンタクトマップと照合する。
notes: なぜこれがうまくいくのか？残基 $i$ の大きさや電荷が変わると、それに接触する残基 $j$ もしばしば変わらなければならず、そうでなければタンパク質は誤って折りたたまれる。多数の関連配列にわたって、これはアラインメントの列 $i$ と $j$ の間に相関を残す。しかし相関は推移的である：$i$ が $j$ に、$j$ が $k$ に接触していれば、$i$ と $k$ も接触していないのに相関する。直接結合解析（DCA）は大域的なモデルである Potts モデル（$q$ 状態のイジングモデル）をフィットし、その結合 $J_{ij}$ がすべての相関を同時に説明するので、間接的な相関は説明し尽くされる。平均場近似では、結合は単に共分散行列の逆行列にマイナスを付けたものになる（偏相関のように）。擬似尤度最大化は代わりに各列について $P(s_i\mid\text{rest})$ をフィットし、実際のファミリーでは通常より正確である。アニメーションではアラインメントを 20 配列から全配列まで増やす：DCA（上三角）は深さとともに改善するが、単純な共分散（下三角）は偽陽性が間接的な組であるため頭打ちになる。ここではデータが本当に既知のコンタクトをもつ Potts モデルから来ているので、精度は公正なスコアである。実際のアラインメントはもっと難しい：数文字で 20 種のアミノ酸とギャップを代用しており、配列は系統関係でつながっていて（実際の DCA はほぼ重複した配列の重みを下げる）、シグナルを残すのは一部のコンタクトだけである。共進化は今日の構造予測の根幹にある：plmDCA 型のコンタクトは初期の深層学習手法の入力となり、AlphaFold 2 は MSA を主な入力として、アテンションによってはるかに豊かなその使い方を自ら学習する。このトイモデルが示すのはその入力の背後にある統計的な考え方であり、AlphaFold の仕組みではない。より弱い結合、より少ない配列、より多い文字数 $q$ を試してみよう。
meanings:
- $X\times Y\times Z$ の箱を埋める蛇行鎖。コンタクトとは鎖に沿って 3 以上離れた格子上の隣接点
- 「真の」モデル：ランダムな場と、$\mathcal C_{ij} = 1$ の箇所だけにあるランダムな $q\times q$ 結合ブロック
- 局所場：配列 $n$ の他のすべての列と文字について $j, b$ の和
- チェッカーボード型ギブス：コンタクトは異なる色を結ぶので、全 $N$ 本の鎖でサイトの半分を同時に再サンプリング
- one-hot テンソルとしてのアラインメント
- $n$ について和：単一頻度と対頻度。$f_{iajb}$ を $b$ について和をとると $f_{ia}$ に戻る
- 一様頻度の擬似カウント $\lambda$ を混ぜた後の連結相関
- 平均場 DCA：$L(q-1)$ 次正方の共分散行列を逆転。最後の文字が参照状態
- 擬似尤度による代替法：$L_2$ ペナルティ付きで Adam により $h, J$ について最大化
- 組の結合強度。$a, b$ について和、ゼロ和ゲージ $J^z$ で
- 平均積補正（APC）：列ごとの背景を除き、行と列の平均を 0 にする
labels:
  fold: 格子フォールド（箱のサイズ）
  q: 列あたりの文字数 $q$
  coupling: 植え込む結合の強さ $\sigma_J$
  n_seq: MSA の配列数 $N$
  sweeps: 配列あたりのギブススイープ数
  pseudocount: 擬似カウント $\lambda$
  method: 推定法：平均場 DCA または擬似尤度
  plm_iters: 擬似尤度の Adam ステップ数
