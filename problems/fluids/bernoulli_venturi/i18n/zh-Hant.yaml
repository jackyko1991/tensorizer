source_hash: 6140ba04c201
title: 白努利定律與文氏管
summary: 水流經漸窄的管子時必須加速，才能維持相同的流量（$A u = Q$）；依白努利定律，喉部的壓力隨之下降。截面積、速度與壓力都是沿管軸的張量；一批示蹤粒子顯示了加速過程。
notes: 流動視為一維：每個截面上速度均勻，並忽略摩擦，這使白努利定律在此嚴格成立。位於局部半徑固定比例處的示蹤粒子沿管壁形狀運動。壓力計是開口管，其液柱 $h = p/(\rho g)$ 隨局部錶壓升高。量測 $p_1 - p_2$ 即可得到流量 $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$——這就是文氏流量計的原理。若喉部壓力低於大氣壓，真實流動可能產生空蝕；此處改為印出警告。
meanings:
- 沿管軸的點，指標 $k$
- 每個軸上點的截面積
- 連續方程式：每秒通過每個截面的體積相同
- 白努利：流速愈快 ⇒ 壓力愈低
- 這批示蹤粒子的位置，以 RK4 推進
- 體積流量 $A_1 u_1$，單位 m³/s
labels:
  u1: 入口流速 $u_1$
  area_ratio: 截面積比 $A_1/A_2$
  p1: 入口錶壓 $p_1$
  t_max: 模擬時間
