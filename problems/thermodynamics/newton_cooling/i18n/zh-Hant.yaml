source_hash: 66c98bbdd023
title: 牛頓冷卻定律
summary: 一排熱咖啡朝室溫冷卻。每杯有各自的起始溫度與冷卻常數，但全部放在同一個張量中，因此一行 PyTorch 就能同時推進每一杯——結果與指數解吻合。
notes: 此定律說冷卻速率與和室溫的溫差成正比。因此溫差在相等時間內縮小相同的倍數：每經過 $t_{1/2} = \ln 2/k$ 就減半，與起始溫度無關。常微分方程式以 Runge–Kutta（RK4）數值求解，虛線則顯示精確的指數解以供比較。真實的杯子同時藉由對流、輻射與蒸發冷卻；$k$ 把這些全部合為一個數。
meanings:
- 杯 $b$ 的溫度（°C）
- 杯 $b$ 的冷卻常數（1/min）：愈大冷卻愈快
- 室溫，廣播到每一杯
- 逐元素運算：沒有指標被求和，每杯各自冷卻
- 外積：每個時刻配每一杯，用於精確解
- 溫差減半所需的時間
labels:
  n_cups: 杯數
  T_env: 室溫
  k_min: 最慢冷卻 $k$
  k_max: 最快冷卻 $k$
  t_max: 模擬時間
