source_hash: 2765022e4b7f
title: うなりと群速度
summary: 振動数の近い2つ（またはそれ以上）の正弦波を足し合わせる。すべての波は、波 $s$、時刻 $n$、位置 $j$ を添字とする1つのテンソルに入っており、$s$ についての1回の einsum で重ね合わされる。固定点では $|f_1 - f_2|$ のうなりが聞こえる。空間的には搬送波の山は位相速度で、包絡線は群速度で動く。
notes: 2つの波では $\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$：遅い包絡線の中に平均振動数の速い搬送波がある。音の大きさ $|{\rm envelope}|$ は毎秒 $|f_1 - f_2|$ 回、すなわちうなりの振動数で最大になる。分散関係 $\omega = c_0 k_0 (k/k_0)^p$ では群速度は位相速度の $p$ 倍である：弦の音（$p = 1$）では等しく、深水波（$p = \tfrac12$）では半分、表面張力波（$p = \tfrac32$）では1.5倍である。赤い点は $v_p$ で山に乗り、緑の点は $v_g$ で包絡線のピークに乗る。3つ以上の波ではうなりは孤立した波群になる。
meanings:
- 波 $s$ の角振動数と波数、分散関係 $\omega \propto k^p$ で結ばれる
- 波を評価する位置と時刻
- ブロードキャストによる、すべての時刻と場所での各波の位相
- 繰り返される $s$ ⇒ 和をとる：重ね合わせ
- 包絡線：フェーザーの和の長さ
labels:
  f1: 振動数 $f_1$
  f2: 振動数 $f_2$
  n_waves: 波の数（f1 から f2 まで分布）
  dispersion: 分散 $p$ = 1, ½, 3/2
  t_max: シミュレーション時間
