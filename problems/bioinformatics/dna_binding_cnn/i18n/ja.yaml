source_hash: e272fe98f3be
title: 小さな CNN が DNA 結合モチーフを見つける
summary: ランダムな DNA 配列の半分に、転写因子結合部位の縮重したコピーが一つずつ含まれている。1 層の 1 次元畳み込みネットワーク $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$ とそれに続く最大プーリングが、autograd と Adam で両者を区別するよう学習する。配列ロゴとして読み戻すと、最も重要なフィルターが植え込んだモチーフになる。
notes: 転写因子は、短くわずかに変化する語、すなわちモチーフを見つけた場所で DNA に結合する。モチーフは通常、位置重み行列（PWM）で要約される。PWM で配列を走査することは、one-hot 配列と $w \times 4$ のフィルターとの 1 次元畳み込みとまったく同じであり、これが畳み込みネットワークがゲノミクスに適する理由である：1 層目のフィルターはモチーフ検出器であり、最大プーリングによって答えは部位の位置に依存しなくなる。ここでは何もネットワークにモチーフを教えない：見るのはラベルだけで、勾配降下法が最も有用なフィルターを植え込んだ語の形に整えていく（ロゴがノイズから鮮明になる様子を見よう）。破線はモチーフを知っている参照、つまり真の PWM による走査である。植え込んだ部位は縮重しており、ランダムな DNA が部位のように見えることもあるため、それでも 100% には届かず、学習したネットワークはそれに近いところに落ち着く。順鎖のみを用い、背景は一様である。実際のモデルは逆相補鎖も走査し、GC 含量、反復配列、ノイズの多い実験ラベルに対処しなければならない。これは、タンパク質結合実験からモチーフを学習した DeepBind（2015）の背後にある考え方である。Basset、Basenji、Enformer などのモデルははるかに多くの層（およびアテンション）を重ね、100 kb の配列からクロマチンや発現を予測する。このトイモデルが再現するのは 1 層目の考え方だけである。より弱いモチーフ、短いモチーフ（E-box、CACGTG は偶然により頻繁に現れる）、少ないフィルター数を試してみよう。
meanings:
- 植え込む位置重み行列：コンセンサス塩基が確率「strength」、残りを他の三つが分け合う
- 配列 $n$ の位置 $l$ の塩基が $b \in$ {A, C, G, T}。部位を植え込んだ場合ラベル $y_n = 1$
- $w$ 塩基のすべての窓（ビューでありコピーなし）、$P = \ell - w + 1$
- 学習可能なフィルター：塩基と位置ごとのスコア。PWM と同じ形
- 畳み込み：$k, b$ について和、フィルター $f$ をすべての位置 $p$ で評価
- 大域最大プーリング：どこかで最もよく一致する箇所。部位はどの位置にあってもよい
- ロジット、$f$ について和。二値交差エントロピー、autograd、Adam（ミニバッチ 100）で学習
- モチーフへ戻す（DeepBind と同様）：スコアが最高スコアの半分を超える各正例配列の最良窓 $p^*_{nf}$（$\kappa_{nf} = 1$）を平均、$n$ について和
- ビット単位の情報量：位置 $k$ のロゴの積み上げの高さ
- 最良のずらしでの学習行列と植え込み行列の相関。1 = 同一
labels:
  motif: 植え込むモチーフ：NF-κB、AP-1 または E-box
  strength: コンセンサス塩基の確率
  n_seq: 配列数（訓練 80% / テスト 20%）
  length: 配列長 $\ell$
  n_filters: フィルター数 $F$
  width: フィルター幅 $w$
  epochs: 訓練エポック数
  lr: Adam の学習率
