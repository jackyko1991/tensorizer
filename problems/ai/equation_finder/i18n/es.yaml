source_hash: f8aa40a8b1bc
title: 'Buscador de ecuaciones: una IA tensorial que escribe la ecuación que gobierna sus datos'
summary: Dale datos de campo y te devuelve la ley en LaTeX. Una biblioteca de términos candidatos ($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$) se construye con diferencias finitas, filtros de Savitzky–Golay o la forma débil, y la regresión ridge con umbral secuencial (PDE-FIND) conserva los pocos términos que explican $\partial_t u$. A partir de datos simulados recupera el sistema de Lorenz, la ecuación del calor, la ecuación de Burgers viscosa y las ecuaciones de Maxwell de una simulación Yee FDTD (con $c$ con un error del 0.2 %, 0.03 % con la forma débil), y encuentra $\nabla\cdot\mathbf B = 0$ oculta en la biblioteca; un estudio de ruido muestra dónde falla cada estimador de derivadas.
notes: 'La idea. Este es el «buscador automático de ecuaciones físicas» de Jacky Ka Long Ko: una pequeña IA tensorial que mira datos de campo y escribe, en LaTeX, la ecuación que los gobierna (el enfoque SINDy / PDE-FIND). Continúa la búsqueda de operadores sobre MNIST, que terminó con «un dígito manuscrito no tiene ecuación que lo gobierne»; aquí los datos provienen de leyes, así que hay algo que encontrar. La arquitectura tiene tres módulos: (1) un suavizador que elimina ruido, (2) un motor de derivadas einsum / diferencias finitas, (3) regresión dispersa de operadores. Aquí (2) y (3) están completos y (1) es un suavizador de Savitzky–Golay (no hace falta ninguna red neuronal para ello). Método. Cada término candidato es una derivada de un monomio de los campos, $D^\alpha(\prod_g u_g^{p_g})$: 20 monomios hasta grado 3 para el sistema de Lorenz, 13 términos $D^d(u^p)$ ($p, d \le 3$) para las ecuaciones 1D, 17 términos para Maxwell (los campos, sus derivadas en $x$ y en $y$, sus laplacianos,
  algunos productos). Tres formas de construir el sistema lineal $\partial_t u = \Theta\xi$: diferencias finitas centradas (fd); Savitzky–Golay (sg: un suavizador cúbico sobre 7 muestras y luego un ajuste de derivada cuártico sobre 9), ambas convoluciones 1D eje por eje; y la forma débil (weak SINDy, Messenger y Bortz 2021), donde la ecuación se integra contra funciones bump $(1-s^2)^{10}$ y la integración por partes traslada todas las derivadas a ellas, una contracción tensorial por eje. STRidge (Rudy et al. 2017) se ejecuta después sobre columnas de norma unitaria: ridge, anular todo coeficiente por debajo de $\tau$, reajustar, repetir; un barrido de 41 tolerancias para 3 intensidades de ridge, y el modelo elegido es el de menos términos cuyo error de validación está dentro del 5 % (+ $10^{-3}$) del mejor. La intensidad de ridge mayor importa para Maxwell: como $\nabla\cdot\mathbf B = 0$, las columnas $\partial_x B_x$ y $\partial_y B_y$ son casi opuestas, y con un ridge débil la regresión
  añadía $2200\,\nabla\cdot\mathbf B$ a la ecuación de $E_z$. Los coeficientes se reajustan por mínimos cuadrados sobre los términos conservados, con un bootstrap sobre las filas para el ±; ese ± es solo estadístico y no incluye el sesgo de la estimación de derivadas, por lo que a menudo es mucho menor que el error real. La regresión alternativa es la relajación al estilo DARTS de operator_search_mnist: $\xi = \sigma(\alpha/T)\,w$ con una penalización sobre las compuertas y la temperatura recocida de 1 a 0.01. Datos, todos simulados aquí: 8 trayectorias de Lorenz (RK4); la ecuación del calor en una varilla periódica de 10 cm, exacta mediante modos de Fourier ($D$ = 0.2 cm²/s); Burgers viscosa en $2\pi$ m, exacta mediante la transformación de Cole–Hopf ($\nu$ = 0.1 m²/s); Maxwell en una caja periódica de 6.4 cm a partir de una simulación Yee FDTD (modo TM, celdas de 0.5 mm, número de Courant 0.5), muestreada como lo haría una medición (todos los campos interpolados a los mismos puntos e instantes).
  Ruido: gaussiano, 0, 0.1, 1 y 5 % de la desviación típica de cada campo. Resultados. Las pruebas comprueban que los núcleos y la forma débil son exactos donde el cálculo lo dice, que los datos obedecen sus leyes (núcleo del calor, Cole–Hopf, Yee mantiene $\nabla\cdot\mathbf B = 0$ hasta el redondeo y conserva su energía con un error del 0.2 %), que STRidge recupera exactamente un vector disperso implantado, que cada objetivo se recupera a partir de datos limpios y que el LaTeX escrito, releído por un analizador, reproduce el modelo ajustado. Ejecución incluida, datos limpios, diferencias finitas: Lorenz $\sigma$ = 9.9987, $\rho$ = 27.989, $\beta$ = 2.6662; calor $D$ = 0.20023 cm²/s; Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$; Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$ con $c$ = 29.92 cm/ns (valor real 29.98) y $\partial_t \mathbf B = -\nabla\times\mathbf E$ con coeficientes 0.996. La forma débil es mucho más precisa (errores de $10^{-8}$ con los datos exactos;
  0.03 % en Maxwell, que es la dispersión numérica propia del esquema de Yee, no del buscador). El vector singular más pequeño de la biblioteca de Maxwell es $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$, con un valor singular 220 veces menor que el siguiente: los datos revelan $\nabla\cdot\mathbf B = 0$ como una ley implícita. Ruido (¿se encuentran los términos correctos?): las diferencias finitas fallan a partir del 0.1 % de ruido en calor y Burgers y a partir del 1 % en Lorenz, y solo resisten el 5 % en Maxwell (con un 25 % de error en los coeficientes); Savitzky–Golay resiste el 0.1 % en todos los casos y el 5 % solo en Maxwell; la forma débil encuentra los términos correctos en todos los niveles para calor, Burgers y Maxwell (con 5 % de ruido, errores en los coeficientes del 7 %, 6 % y 0.1 %) y hasta el 1 % para Lorenz (al 5 % añade dos diminutos términos espurios a $\dot y$). Las compuertas recocidas igualan a STRidge débil en Burgers y Maxwell, pero omiten el término $-y$ de $\dot
  y$ en Lorenz en todos los niveles de ruido y con todas las penalizaciones probadas ($10^{-6}$ a $10^{-3}$): $25.5\,x - 0.95\,xz$ lo absorbe, un mínimo local del que la relajación no sale; también fallan en calor al 5 %. Volver a simular las ecuaciones encontradas desde la primera instantánea reproduce los datos de calor y Burgers con un error de $3\times 10^{-4}$ y Maxwell con un 3 %; Lorenz se desvía un 3 % tras 5 unidades de tiempo porque el caos amplifica un error del 0.01 % en un coeficiente. results/noise_study.csv y results/equations.tex contienen todos los números y ecuaciones; un GIF por objetivo (Maxwell es el principal) y results/summary.png. Veredicto. El buscador recupera formas de ecuaciones conocidas a partir de datos limpios y bien muestreados, y con la forma débil tolera ruido realista; lo que falla primero es la estimación de derivadas, no la regresión. Solo encuentra términos que están en su biblioteca, necesita que se midan las variables correctas, y una ecuación descubierta
  es una hipótesis: no descubre física (ni fisiología) nueva sin validación independiente. Tampoco sustituye a los grandes modelos de lenguaje; es una tarea distinta (ajustar una ley a los datos, no producir texto). Trabajos relacionados. SINDy (Brunton, Proctor y Kutz 2016), PDE-FIND y STRidge (Rudy et al. 2017), weak SINDy (Messenger y Bortz 2021); regresión simbólica mediante programación genética (Schmidt y Lipson 2009) y AI Feynman (Udrescu y Tegmark 2020); el esquema de Yee (Yee 1966). Pruébalo. Menos remuestreos bootstrap para una ejecución más rápida, más pasos de compuertas para ver si la relajación escapa de su mínimo de Lorenz (no lo hizo hasta 4000), o una malla de Yee más gruesa.'
meanings:
- 'la biblioteca: la columna $k$ es un término candidato $D^\alpha(\prod_g u_g^{p_g})$ en cada punto interior $n$ de la malla, p. ej. $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- 'motor de derivadas: una convolución 1D a lo largo de un eje; diferencias centradas, o Savitzky–Golay (polinomio de mínimos cuadrados de grado $p$ sobre $2m+1$ muestras) tras un suavizador cúbico'
- 'forma débil: suma sobre $x$ y $t$; las derivadas recaen sobre las funciones bump suaves $\phi(s) = (1-s^2)^{10}$, nunca sobre los datos ruidosos'
- una única resolución ridge por lotes para cada ecuación $f$ sobre sus términos supervivientes; STRidge anula $|\hat\xi_k| < \tau$ y reajusta
- 'barrido de tolerancias: conservar el modelo con menos términos cuyo error de validación está dentro del 5 % (+ $10^{-3}$) del mejor'
- 'la alternativa al estilo DARTS: $\xi = \sigma(\alpha/T)\, w$ con una penalización sobre las compuertas, temperatura recocida de 1 a 0.01'
- 'bootstrap: $B$ remuestreos de filas como pesos multinomiales, todos los ajustes en una única resolución por lotes'
- 'el LaTeX escrito, releído por un analizador: reproduce el modelo ajustado con la precisión impresa'
labels:
  bootstrap: Remuestreos bootstrap para el ± de cada coeficiente
  gate_steps: Pasos de Adam de la búsqueda con compuertas recocidas
  maxwell_grid: Malla de Yee de la simulación de Maxwell ($n \times n$ celdas de 0.5 mm)
