source_hash: 162fb2c64168
title: 弦の接合点でのパルス
summary: 線密度の異なる2本の弦を結び合わせる。左から来たパルスは結び目で反射パルスと透過パルスに分かれ、その振幅はインピーダンス $Z = \sqrt{T\mu}$ で決まる。2階微分はステンシル $(1, -2, 1)$ との1次元畳み込みである。
notes: 結び目は切れないので $u$ は連続であり、質量がないので両側の横方向の力 $T u_x$ はつり合う。この2つの条件から $R$ と $\mathcal T$ が得られる。右の弦が重い（$Z_2 > Z_1$）と、固定端のようにパルスは上下反転して反射する。軽いと、自由端のように正立して反射する。透過パルスは常に正立し、$c_2 = \sqrt{T/\mu_2}$ で進むので、$c_2/c_1$ 倍に縮んだり伸びたりする。パルスが運ぶエネルギーは $Z\,A^2$ に比例し、これから流束のつり合い $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$ が得られる。単位：$T = 1$、$\mu_1 = 1$、弦は $-1$ から $1$ まで。灰色の破線は予言される振幅を示す。速い方の弦に注目しよう：そのパルスは遠い壁に達して跳ね返ってくる。
meanings:
- 格子点 $i$ における変位；両端は固定
- 線密度：左は $\mu_1$、右は $\mu_2$、結び目ではその平均
- 繰り返される $j$ ⇒ 和をとる：ステンシルが弦に沿ってスライドする
- 弦 $k$ の波動インピーダンス
- 結び目での $u$ と力 $T\,u_x$ の連続性から得られる振幅比
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$、保存量
labels:
  mu_ratio: 線密度比 $\mu_2/\mu_1$
  width: パルス幅
  t_max: シミュレーション時間
  n_points: 格子点数
