source_hash: 045c5b4ab526
title: 4-импульс и двухчастичный распад
summary: Движущаяся частица распадается на две. В её системе покоя продукты разлетаются в противоположные стороны с фиксированным импульсом $p^*$; лоренцев буст $\Lambda^\mu{}_\nu$ (один einsum) переносит все углы распада сразу в лабораторную систему, где импульсы отклоняются вперёд. Метрика Минковского $\eta_{\mu\nu}$ превращает 4-импульсы продуктов обратно в массу исходной частицы — метод инвариантной массы, с помощью которого открывают новые частицы.
notes: 'Импульсы в системе покоя лежат на сфере радиуса $p^*$; буст растягивает её в эллипс (нарисованные кривые), сдвинутый вперёд на импульс исходной частицы, поэтому быстрая частица выбрасывает оба продукта в узкий конус вперёд. Энергии и лабораторные углы меняются с $\theta^*$, но $p_\mu p^\mu = m^2$ для каждого продукта и $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$ не меняются никогда — детектор, измеряющий оба импульса, всегда может восстановить $M$. Для $\pi^0 \to \gamma\gamma$ фотоны безмассовые ($p_\mu p^\mu = 0$), а наименьший угол разлёта равен $2\arcsin(1/\gamma)$. Все три распада реальны: $K^0_S \to \pi^+\pi^-$, $\pi^0 \to \gamma\gamma$, $\Lambda \to p\,\pi^-$. Моделируется только кинематика: углы распада перебираются равномерно, а не разыгрываются случайно, спин и поляризация не учитываются.'
meanings:
- diag(1, −1, −1, −1), единицы с $c = 1$
- 4-импульсы продуктов для B углов распада $\theta^*$ в системе покоя
- $\gamma$, $\gamma\beta_i$ и $\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$ для скорости исходной частицы $\boldsymbol\beta = \mathbf P/E$
- 'повторяющийся $\nu$ ⇒ суммирование: буст всех распадов сразу'
- 'скалярное произведение Минковского: одинаково в любой системе'
- восстановленная масса исходной частицы для каждой конфигурации
