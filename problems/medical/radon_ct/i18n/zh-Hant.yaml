source_hash: 8d871084eacb
title: 拉東變換與 CT 重建
summary: CT 掃描儀從每個角度記錄衰減分布圖的線積分 $p(\theta, s)$。以旋轉並加總張量的方式投影 Shepp–Logan 頭部假體，再用濾波反投影重建：先在傅立葉空間套用斜坡濾波器 $|\nu|$，再對所有角度做一次 einsum。
notes: 對每個角度，每個投影都守恆總質量：$\int p\,ds = \iint f\,dA$。把原始投影直接抹回去（單純反投影）會把一個點變成 $1/r$ 的光暈，所以影像是 $f$ 的模糊版本；斜坡濾波器 $|\nu|$ 恰好抵消這種模糊（中心切片定理）。角度太少會產生條紋；誤差隨角度數增加而下降，直到受像素網格限制為止。Shepp–Logan 窗在高頻處讓斜坡變得平緩，以些許銳利度換取較低的雜訊——打開雜訊試試看。簡化假設：平行射束幾何、單色射線、雙線性內插，以及用高斯檢測器雜訊取代光子統計。教學模型，不可用於臨床。
meanings:
- 衰減分布圖（修改版 Shepp–Logan：10 個橢圓之和）
- 沿射線在距離 $s$、位置 $t$、角度 $\theta$ 處取樣的影像
- 重複的 $t$ ⇒ 求和：正弦圖
- 斜坡 $|\nu|$（Ram-Lak），可選擇再乘上 $\mathrm{sinc}(\nu\,\Delta s)$（Shepp–Logan），作用於補零的檢測器上
- 濾波後的投影
- 每個投影沿其射線抹回：$q_\theta(x\cos\theta + y\sin\theta)$
- 重複的 $\theta$ ⇒ 求和：反投影
labels:
  n_pixels: 影像大小 $N$
  n_angles: 投影角度數
  filter: 斜坡濾波器窗函數
  noise: 檢測器雜訊（最大值的比例）
