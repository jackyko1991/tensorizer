<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Fourier neural operator: the input function u0(x) is Fourier transformed, only the lowest m modes are kept and multiplied by learned complex weights R, then transformed back, giving the output u(x, T)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- input function u0(x): a smooth random wave -->
    <line x1="6" y1="104" x2="62" y2="104" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M6,92 C12,70 18,66 24,80 C30,96 34,104 40,92 C46,78 50,62 56,72 C59,78 61,86 62,90" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="22" y="56" font-style="italic">u<tspan font-size="10" dy="3">0</tspan></text>
    <!-- arrow into the Fourier layer -->
    <line x1="64" y1="82" x2="80" y2="82" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Fourier layer: FFT, keep the low modes and multiply by R, IFFT -->
    <rect x="83" y="16" width="76" height="128" rx="6" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="121" y="36" text-anchor="middle" font-size="13">FFT</text>
    <line x1="88" y1="92" x2="154" y2="92" stroke="#374151" stroke-width="1.5"/>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <rect x="90" y="56" width="6" height="36"/><rect x="98" y="66" width="6" height="26"/>
      <rect x="106" y="72" width="6" height="20"/><rect x="114" y="78" width="6" height="14"/>
    </g>
    <g fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="2 2">
      <rect x="126" y="80" width="6" height="12"/><rect x="134" y="83" width="6" height="9"/>
      <rect x="142" y="85" width="6" height="7"/>
    </g>
    <line x1="123" y1="46" x2="123" y2="96" stroke="#f59e0b" stroke-width="2"/>
    <text x="133" y="60" font-style="italic" font-size="13" fill="#b45309">m</text>
    <text x="105" y="113" text-anchor="middle" font-size="13">× <tspan font-style="italic" fill="#b45309">R</tspan></text>
    <text x="121" y="135" text-anchor="middle" font-size="13">IFFT</text>
    <!-- arrow out -->
    <line x1="161" y1="82" x2="177" y2="82" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- output u(x, T): smoother, with a steep front -->
    <line x1="180" y1="104" x2="236" y2="104" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M180,90 C190,84 200,70 212,64 C214,64 215,66 216,74 L218,96 C220,102 228,100 236,94" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="190" y="56" font-style="italic">u(T)</text>
  </g>
</svg>
