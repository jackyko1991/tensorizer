source_hash: 702d9d9098be
title: 受容体–リガンド結合（k_on、k_off）
summary: 免疫受容体（T 細胞受容体や抗体）は標的にどれほど強く、どれほど長く結合するのか？結合速度定数 $k_{on}$ と解離速度定数 $k_{off}$ をもつ質量作用の速度論を、複数の受容体バリアントとリガンド濃度の滴定系列全体について一つの $(B, C)$ テンソルで同時に解き、SPR 風のセンサーグラムと結合等温線を並べて示す。
notes: 結合には遊離受容体と遊離リガンドが出会う必要があるので速度は $k_{on} R L$、解離は各複合体で独立に起こり速度は $k_{off} C$ である。平衡では両者がつり合い、結合率は $\theta = L/(L + K_D)$、ここで $K_D = k_{off}/k_{on}$：$L = K_D$ のとき受容体の半分が占有される（各等温線上の目盛り）。空の受容体から始めると平衡への接近は指数関数的で、$C(t) = C_{eq}(1 - e^{-k_{obs} t})$、$k_{obs} = k_{on} L + k_{off}$ となる。SPR（表面プラズモン共鳴）装置はこれを利用して $k_{on}$ を測定する。バッファーで洗浄した後、複合体は $e^{-k_{off} t}$ で減衰し、半減期は $t_{1/2} = \ln 2 / k_{off}$、すなわち滞留時間である。バリアントは現実的な範囲をカバーする：T 細胞受容体はペプチド–MHC に弱く結合し（$K_D \sim 1$–$10\,\mu$M、滞留時間は数秒）、抗体は強く結合する（$K_D \sim 0.1$ nM、滞留時間は数時間）。等温線上の点に注目しよう：低濃度では $k_{obs} \approx k_{off}$ が小さいため、洗浄開始時に抗体はまだ平衡に達していない。なぜ T 細胞にとって $k_{off}$ がそれほど重要なのか？キネティック・プルーフリーディング（動的校正）の描像では、結合した TCR は細胞を活性化する前にいくつかのシグナル伝達段階（リン酸化）を経なければならず、その前にリガンドが外れるとすべてリセットされる。これらの段階より長く存続する複合体のほうがはるかにシグナルを出しやすいので、T 細胞は占有率だけでなく滞留時間 $1/k_{off}$ を読み取り、親和性がわずかしか違わない自己ペプチドと外来ペプチドを見分けられる。単純化：受容体あたり結合部位は一つ（アビディティや再結合なし）、溶液は十分に混合され、物質輸送の制限はない。リガンド枯渇をオンにすると、各複合体が閉じた体積からリガンドを一つずつ取り除き、平衡は $L/(L + K_D)$ ではなく二次方程式の解に従う。
meanings:
- 受容体バリアント $b$ の速度定数（弱・中・高親和性 TCR、抗体）
- 滴定のリガンド濃度 $c$（nM）。最後のものがセンサーグラム用
- 各バリアント・各濃度での遊離受容体と複合体
- 遊離リガンド：$L_c$、枯渇ありでは $L_c - C_{bc}$
- 和をとる添字なし：$k_b$ をすべての濃度 $c$ にブロードキャスト
- RK4 の右辺。$R$ と $C$ は $\mp J$ ずつ変化するので $R + C = R_T$
- 解離定数：受容体の半分を結合させるリガンド濃度
- 平衡占有率（破線の等温線）
labels:
  log10_L: センサーグラムのリガンド $\log_{10}(L/\mu\mathrm{M})$
  t_assoc: 結合時間
  t_dissoc: 解離時間
  depletion: リガンド枯渇
  R_T: 受容体濃度 $R_T$
