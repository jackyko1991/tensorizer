source_hash: 1e3affbcf0e4
title: 平面上的线性映射
summary: 一个 $2\times 2$ 矩阵移动平面上的每个点，一次 einsum 就能同时为每个动画帧移动整个网格、单位圆和单位正方形。观察平面从单位矩阵变形到 $A$：本征向量停留在各自的直线上，$|\det A|$ 缩放面积，负的行列式把平面翻转过来，圆变成椭圆，其半轴就是奇异值。
notes: $A$ 的各列就是基向量 $\mathbf e_1$（红色箭头）和 $\mathbf e_2$（绿色箭头）的落点，其他所有点由线性性随之确定，所以直的网格线保持笔直且平行。沿着路径 $M(t) = (1-t)I + tA$，$A$ 的本征向量 $\mathbf v$ 也是 $M(t)$ 的本征向量，本征值为 $1 - t + t\lambda$，因此橙色点沿各自的虚线滑动，而其他一切都在转动。单位正方形（黄色）变成面积为 $|\det A|$ 的平行四边形；当 $\det < 0$ 时它变红，此时 $\mathbf e_1 \to \mathbf e_2$ 变为顺时针，平面成为镜像。反射在途中必须经过 $\det = 0$，此时平面被压扁成一条直线。旋转和反射保持长度，所以 $\sigma_1 = \sigma_2 = 1$；剪切保持面积（$\det = 1$）但不保持形状。一般情况下圆变为半轴为 $\sigma_1 \ge \sigma_2$（即奇异值）的椭圆，且 $|\det A| = \sigma_1\sigma_2$。乘积的行列式相乘：$\det(AB) = \det A\,\det B$。
meanings:
- 要展示的矩阵：拉伸、剪切、旋转、反射和翻转，或你自定义的矩阵
- 平面上的点：网格线、单位圆、单位正方形
- 从单位矩阵 $\delta_{ij}$ 到 $A$ 的直线路径，每帧一个矩阵
- 重复的 $j$ ⇒ 求和：每个点同时被每一帧的矩阵移动
- $\varepsilon_{12} = 1$，$\varepsilon_{21} = -1$：二维 Levi-Civita 符号
- 重复的 $i, j$ ⇒ 求和：单位正方形像的有向面积
- 圆的像是半轴为 $\sigma_1 \mathbf u_1$ 和 $\sigma_2 \mathbf u_2$ 的椭圆
- 本征值和本征向量；旋转的本征值为复数，因此没有直线保持不动
labels:
  matrix: 矩阵
  a11: 自定义 $A_{11}$
  a12: 自定义 $A_{12}$
  a21: 自定义 $A_{21}$
  a22: 自定义 $A_{22}$
  grid_lines: 每个方向的网格线数
