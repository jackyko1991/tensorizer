source_hash: 3b3a390c2f31
title: 傅立葉級數與吉布斯現象
summary: 以正弦函數構成方波、鋸齒波與三角波。係數是一次 einsum（數值積分，與 $4/(\pi n)$ 等結果比對），而每個部分和都是一次矩陣乘積 $S_N = B\,c$，取基底矩陣的前 $N$ 行。觀察振盪如何擠向跳躍處，而過衝始終維持在跳躍的約 9%。
notes: 精確係數為：方波 $b_n = 4/(\pi n)$（$n$ 為奇數）、鋸齒波 $2(-1)^{n+1}/(\pi n)$、三角波 $\pm 8/(\pi^2 n^2)$（$n$ 為奇數）；數值積分與之吻合至約 $10^{-6}$。在跳躍附近部分和會過衝。隨著 $N$ 增大，突起移向跳躍處（寬度以 $1/N$ 縮小），但其高度趨於跳躍的 $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$ 倍，而非趨於零：對從 $-1$ 到 $1$ 的方波，峰值停留在 $1.179$ 附近。這就是吉布斯現象。級數仍然均方收斂：由 Parseval 定理，$\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$，所以 $L^2$ 誤差的平方就是缺少的 $b_n^2$ 之和。以 $1/n$ 遞減的係數（有跳躍）給出 $\propto 1/N$ 的誤差；三角波只有折角，其係數以 $1/n^2$ 遞減，誤差以 $1/N^3$ 遞減。越平滑的函數收斂越快。試試粗網格（小 $X$），看數值係數如何偏移。
meanings:
- $(-\pi, \pi)$ 上 $X$ 個等寬格子的中點及其寬度 $h$：積分權重
- 在 $x_j$ 取樣的波 $w$（方波、鋸齒波、三角波）
- 基底矩陣：第 $n$ 行是網格上的 $\sin(n x)$
- 重複的 $j$ ⇒ 求和：積分 $b_n$ 寫成網格上的加權和
- 重複的 $n$ ⇒ 求和：含 $N$ 個諧波的部分和，即矩陣乘積
- $L^2$ 誤差平方，$d = F - S$；重複的 $j$ ⇒ 求和
labels:
  n_max: 最大諧波數 $N$
  n_x: 網格點數 $X$
