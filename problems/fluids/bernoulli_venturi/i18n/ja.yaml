source_hash: 6140ba04c201
title: ベルヌーイの定理とベンチュリ管
summary: 細くなる管を流れる水は、同じ流量（$A u = Q$）を運ぶために速くならなければならず、ベルヌーイの定理によりくびれ部で圧力が下がる。断面積、速度、圧力は管軸上のテンソルであり、多数のトレーサー粒子が加速の様子を示す。
notes: 流れは1次元として扱う：各断面で速度は一様で摩擦は無視する。このためここではベルヌーイの定理が厳密に成り立つ。局所半径の一定割合の位置にあるトレーサーは壁に沿って動く。圧力計は開いた管であり、その液柱 $h = p/(\rho g)$ は局所的なゲージ圧とともに高くなる。$p_1 - p_2$ を測れば流量 $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$ が得られる——これがベンチュリ流量計の原理である。くびれ部の圧力が大気圧を下回ると、実際の流れではキャビテーションが起こりうる。ここでは代わりに警告を表示する。
meanings:
- 管軸上の点、添字 $k$
- 各軸上の点での断面積
- 連続の式：毎秒同じ体積がどの断面も通過する
- ベルヌーイ：流れが速い ⇒ 圧力が低い
- RK4 で動かすトレーサー群の位置
- 体積流量 $A_1 u_1$（m³/s）
labels:
  u1: 入口流速 $u_1$
  area_ratio: 断面積比 $A_1/A_2$
  p1: 入口ゲージ圧 $p_1$
  t_max: シミュレーション時間
