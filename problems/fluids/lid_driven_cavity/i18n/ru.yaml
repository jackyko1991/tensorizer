source_hash: 87bf1a8993df
title: Каверна с подвижной крышкой
summary: 'Классическая тестовая задача вычислительной гидродинамики: квадратная полость с жидкостью, крышка которой скользит вправо. Двумерные уравнения Навье–Стокса в переменных «функция тока–завихренность» интегрируются по времени, а уравнение Пуассона для $\psi$ решается диагонализацией лапласиана через eigh. Раскручивается основной вихрь, и его скорость на центральной линии сравнивается с данными Ghia и др. (1982).'
notes: 'Единицы: размер полости 1 и скорость крышки 1, поэтому $\mathrm{Re} = 1/\nu$. Функция тока по построению делает течение бездивергентным, а давление исключается взятием ротора от уравнений Навье–Стокса. Каждый шаг: завихренность на стенках по формуле Тома (условие прилипания), шаг явного метода Эйлера для $\omega$, затем решение уравнения Пуассона. $\nabla^2\psi = T\psi + \psi T^\mathsf T$ становится диагональным в собственном базисе $T$ — та же идея, что у быстрого синус-преобразования. При Re = 100 центр вихря находится около (0,62, 0,74), выше и правее центра; при меньших Re он смещается к (0,5, 0,76), при больших — к середине, и в нижних углах появляются маленькие вихри обратного вращения. Большие Re требуют более мелкой сетки.'
meanings:
- завихренность и функция тока на сетке, индексы [x, y], стенки включены
- $(\partial_y\psi, -\partial_x\psi)$ центральными разностями
- 'повторяющийся $j$ ⇒ суммирование: перенос завихренности'
- пятиточечный шаблон
- одномерный лапласиан с $\psi = 0$ на стенках, диагонализуется один раз
- преобразование; затем $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$ и обратно
- 'Том: $-2\psi_\text{next}/h^2$, минус $2U/h$ под крышкой'
labels:
  re: Число Рейнольдса $UL/\nu$
  n: Точек сетки на сторону
  t_max: Время моделирования
