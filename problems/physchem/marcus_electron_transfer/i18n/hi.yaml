title: इलेक्ट्रॉन स्थानांतरण का मार्कस सिद्धांत और प्रतिलोमित क्षेत्र
summary: 'एक इलेक्ट्रॉन दाता से ग्राही पर तभी कूदता है जब आसपास का विलायक संयोगवश ऐसे विन्यास में उतार-चढ़ाव करे जहाँ दोनों अवस्थाओं की ऊर्जा समान हो: दो परवलयों का प्रतिच्छेद। इससे मार्कस दर $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$ मिलती है, जिसका मान यहाँ पुनर्गठन ऊर्जाओं, तापमानों और प्रेरक बलों के एक ब्रॉडकास्ट ग्रिड पर निकाला जाता है। यह $-\Delta G^\circ = \lambda$ होने पर सबसे तेज़ है और, अंतर्ज्ञान के विपरीत, और भी ढलवाँ अभिक्रियाओं के लिए फिर धीमी हो जाती है। प्रतिच्छेद पर लैंडाउ–ज़ेनर छलाँगों के साथ विलायक निर्देशांक का लांजेवें अनुकरण इस वक्र को पुनः उत्पन्न करता है।'
notes: 'इकाइयाँ: eV, K और ps। विलायक निर्देशांक $x$ वह सामूहिक ध्रुवण है जो स्थानांतरित आवेश महसूस करता है, इस तरह स्केल किया गया कि अभिकारक कूप 0 पर और उत्पाद कूप 1 पर हो; $\lambda$ वह ऊर्जा है जो विलायक को उत्पाद के अनुसार ध्रुवित करने में लगती है जबकि आवेश अभी भी दाता पर है। Marcus ने 1956 में द्विघात अवरोध व्युत्पन्न किया (J. Chem. Phys. 24, 966) और प्रतिलोमित क्षेत्र की भविष्यवाणी की, जिसकी प्रायोगिक पुष्टि केवल 1980 के दशक में हुई। प्रतिलोमित क्षेत्र ($-\Delta G^\circ > \lambda$) में उत्पाद परवलय अभिकारक परवलय को उसकी दूर वाली ओर काटता है, इसलिए बड़ा प्रेरक बल प्रतिच्छेद को ऊपर धकेलता है। दर सूत्र स्वर्णिम नियम (golden rule) है (अरुद्धोष्म, छोटा $H_{AB}$) शास्त्रीय विलायक के साथ; वास्तविक प्रतिलोमित-क्षेत्र दरें धीरे गिरती हैं क्योंकि उच्च-आवृत्ति आण्विक कंपन क्वांटम चैनल खोलते हैं (Marcus–Levich–Jortner विस्तार)। अनुकरण जानबूझकर एक सरल चित्र है: आवृत्ति $\omega$ और घर्षण $\gamma$ वाला एक शास्त्रीय विलायक निर्देशांक, एक समय में एक डायबैटिक परवलय पर चलता हुआ और प्रतिच्छेद पर लैंडाउ–ज़ेनर
  प्रायिकता $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$ से बदलता हुआ, जो एक सीधा, तेज़ गुज़रना मानती है। गुज़रनों के तापीय फ़्लक्स पर योग करने से $P_{\mathrm{LZ}} \ll 1$ होने पर स्वर्णिम-नियम दर वापस मिलती है, इसीलिए बिंदु वक्र पर पड़ते हैं; बड़े $H_{AB}$ के लिए छलाँगें संतृप्त होती हैं (रुद्धोष्म स्थानांतरण) और घर्षण मायने रखने लगता है। छलाँग लगाने वाले प्रक्षेप-पथ उत्पाद सतह पर जारी रहते हैं और वापस भी छलाँग लगा सकते हैं। $T$ घटाना (वक्र संकरा होता है), $H_{AB}$ बढ़ाना (अनुकरण सूत्र से नीचे खिसकता है) या $\lambda$ बदलना आज़माएँ।'
meanings:
- दर ग्रिड के तीन अक्ष
- ब्रॉडकास्टिंग हर संयोजन एक साथ बनाती है; किसी सूचकांक पर योग नहीं
- जहाँ परवलय काटते हैं; $x^* < 0$ का अर्थ है प्रतिलोमित क्षेत्र
- अभिकारक न्यूनतम से प्रतिच्छेद की ऊँचाई
- अनुकरित प्रेरक बल $d$ पर प्रक्षेप-पथ $n$, बोल्ट्ज़मान सांख्यिकी के साथ अभिकारक कूप में आरंभ
- अभिकारक सतह पर 0, उत्पाद सतह पर 1; यह वह न्यूनतम तय करता है जिसकी ओर विलायक खिंचता है
- सभी प्रक्षेप-पथों के लिए एक साथ अर्ध किक, अर्ध ड्रिफ़्ट, घर्षण + रव, अर्ध ड्रिफ़्ट, अर्ध किक
- जब भी कोई चरण $x^*$ को पार करे, इस प्रायिकता से सतह बदलें
- अभिकारक सतह पर बिताए प्रति इकाई समय आगे की छलाँगें; त्रुटि दंड $\sqrt{\text{hops}}/t$
