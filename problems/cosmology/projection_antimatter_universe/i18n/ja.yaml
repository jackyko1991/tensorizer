title: 反物質はどこにありうるか：反物質宇宙の判定基準
summary: これは推測的な仮説であり、確立された物理ではない。ステップ 2 では、すべての時間スライスを横切る 1 本の世界線は物質と反物質を等量与えるが、我々が見ているのは約 $10^{80}$ 個のバリオンと反物質の不在であることがわかった。逃げ道は大域的にバランスした世界線であり、反物質ははるか遠方か鏡像宇宙にある。このステップでは、そのような反物質宇宙が満たすべき条件を列挙し、各基準をデータで検証する。宇宙線中に反原子核はなく、銀河団からの対消滅ガンマ線もない。ドメインは少なくとも地平線と同程度、約 16 Gpc の大きさが必要である。ランダムな世界線は途方もなくありそうにない。残るのは Boyle、Finn、Turok の CPT 対称宇宙であり、その予言（最も軽いニュートリノの質量がゼロ、$r = 0$）はこれまでのところデータと整合しているが、破綻する可能性もある。
notes: ステータス：推測的。これは著者自身の仮説（シリーズの説明を参照）であり、確立された物理ではない。射影仮説のステップ 7 で、公準 P3（すべての粒子は一つの対象の射影である）に関する理論ステップである。ステップ 1（cosmology/projection_postulate）で公準を述べた。ステップ 2（cosmology/projection_one_particle）は P3 の最も単純な形を否定した：閉じた世界線はすべての時間スライスを前向き（物質）と後ろ向き（反物質）に同じ回数だけ横切り、開いた世界線が加えるのは高々 1 個の正味の粒子であるが、宇宙には約 $9\times10^{79}$ 個のバリオンがあり、反物質はない。ステップ 3 から 6（projection_dimension_budget、projection_singularity_fold、projection_bell_test、projection_telescope_tests）では P5、P4、P1-P2 を検証した。このステップはステップ 2 の逃げ道をたどる。世界線は大域的にバランスしており、反物質は我々の地平線の向こうか反宇宙にある。問題は、そのような反物質宇宙が公準と一致するために何を満たさなければならないか、そして実際に満たしているかである。まず既知の物理から。サハロフ条件（1967）は、バリオン数の破れ、C と CP の破れ、平衡からのずれによって物質の過剰を説明する。これらは至るところ物質でできた宇宙を予言し、$\eta = n_B/n_\gamma = 6.1\times10^{-10}$ となる（Planck 2018、$\Omega_b h^2 = 0.0224$）。別の可能性、すなわち物質と反物質の領域が分かれた対称な宇宙は、1960 年代から研究されてきた（Alfvén と Klein、Omnès）。Steigman（ARA&A 14, 339, 1976）がその検証をレビューし、Cohen、De Rújula、Glashow（ApJ 495, 539, 1998）が可視宇宙内のドメインという可能性に決着をつけた。すべてのデータは data/antimatter_criteria.csv から取っており、そこには引用した数値とその出典が収められている。世界線が存在する空間の次元数
  $D$ はパラメータである。計算に入るのはその時間座標だけなので、どの結果も $D$ に依存しない。基準 1：近傍に反物質が混ざっていない。BESS-Polar は約 4800 万個のヘリウム原子核の中に反ヘリウムを一つも見つけなかった。95% 上限は、ヘリウムと同様のスペクトルを仮定すると反ヘリウム/ヘリウム $< 6.9\times10^{-8}$、その仮定なしでは $1.0\times10^{-7}$ である（Abe et al., PRL 108, 131301, 2012）。AMS-02 は反原子核の検出を一つも発表していない。ガンマ線：銀河団の高温ガス中で、割合 $f$ の反陽子は率 $f\,n_p^2\langle\sigma v\rangle$ で対消滅する。ここで $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s（桁の見積もりとしての選択）である。ここで用いるパイ中間子崩壊スペクトルでは、1 回の対消滅が 100 MeV 以上の光子を 2.1 個生む。かみのけ座銀河団（ベータモデル、$n_0 = 3.4\times10^{-3}$ cm$^{-3}$、$r_c = 291$ kpc、$\beta = 0.75$）と Fermi-LAT の上限 $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$（Ackermann et al., ApJ 819, 149, 2016）に対して、これは $f < 9\times10^{-8}$ を与える。満たされる：反物質があるとすれば、銀河団の外、かつ数十 Mpc の範囲に閉じ込められている宇宙線の届かないところになければならない。基準 2：我々の地平線内にドメインがない。共動サイズ $d$ の物質ドメインと反物質ドメインが接していれば、再結合以降、その壁での対消滅は避けられない。ここでのモデルは Cohen、De Rújula、Glashow の議論の簡略版である。一辺 $d$ の立方体では単位体積あたりの壁の面積は $3/d$（$n$ 次元では $n/d$、検証済み）であり、バリオンはガスの音速の $\kappa$ 倍の速さで壁に流れ込む。ガスは $z\approx150$ までは CMB 温度に追随し、その後は断熱的に冷える。1
  回の対消滅は中性パイ中間子の崩壊から 3 個の光子を生む。光子は現在まで赤方偏移し、$dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$ となる。この積分は閉じた式と照合して検証した。対消滅は再結合（$z_{max} = 1000$）から $z = 20$ まで数える。CDG と同様に、それより後の時期は構造形成に依存するため除外する。それを含めてもフラックスが上がるだけである。フラックスは厳密に $\propto 1/d$ である（検証済み）。これを COMPTEL 背景放射、すなわち 0.8 から 30 MeV での $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$（Kappadath et al. 1996）、および Fermi-LAT の等方背景放射（100 MeV 以上で $7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$、指数 2.32、カットオフ 279 GeV；Ackermann et al., ApJ 799, 86, 2015）と比較する。$z\sim20$-$300$ からの光子は 1 から 10 MeV で到着し、そこでは COMPTEL が上限を決める。結果：予言はデータを、$d = 100$ Mpc で 160 倍、1 Gpc で 16 倍、10 Gpc で 1.6 倍上回る。最小のドメインサイズは $d_{min}\approx16$ Gpc（8.5 MeV、$\kappa = 1$）で、観測可能な宇宙の半径 14.3 Gpc より大きい。CDG も同じ結論に達した：物質ドメインはほぼ可視宇宙全体でなければならない。これはトイモデルであり、$d_{min}$ は $\kappa$ に応じてスケールする。CDG は、対消滅による加熱が流入を速め、それが制限をさらに強めると論じている。制約される：反物質があるとすれば我々の地平線の向こうであり、そこはどの望遠鏡でも検証できない。基準 3：微調整。反物質が同じスライス上で地平線の向こうにあり、何もそれを配置していないとしよう。すると、バランスしたランダムな世界線は、$M$
  回の交差に対して我々の領域に $\sqrt M$ 程度の正味の電荷を与える。正味の電荷の分散は $M$ に等しく、全 $T$ 回の交差の合計がバランスしている場合は $M(T-M)/(T-1)$ となる（どちらも検証済み）。大きな過剰が生じる確率はクラメールのレート関数 $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$ に従い、厳密な二項分布の裾と照合した。今日我々は $N_B\approx9\times10^{79}$ 個のバリオンを見ており、反物質は見ていないので、すべての交差が同じ符号でなければならない：$P = 2^{-N_B}$、$\log_{10}P\approx-2.7\times10^{79}$。代わりに初期宇宙における約 $1.5\times10^{89}$ 対（光子 1 個につき 1 対）の中の $9\times10^{79}$ の過剰と読むと、$\log_{10}P\approx-1.2\times10^{70}$ となる。機構がなければ、バランスした世界線は破綻する。その機構は、我々の領域内のすべての交差の符号を相関させる境界条件でなければならない：揺らぎではなく、対称性である。基準 4：CPT 対称宇宙。Boyle、Finn、Turok（PRL 121, 251301, 2018）は、ビッグバン後の宇宙はビッグバン前の宇宙の CPT 鏡像であり、したがって全体としての対は CPT を破らないと提案している。以下は、著者による P3 とこのモデルの対応づけである。$t = 0$ を横切る世界線は、我々の側では物質である。鏡像側の観測者は逆向きの時間の矢を持つので、同じ区間を反物質として見る。ステップ 2 で証明した但し書きは依然として当てはまる：任意の完全なスライス上で、1 本の連続な世界線は $|Q|\leq1$ を持つので、鏡像だけでは助けにならない。この対応づけが成り立つのは、世界線がビッグバンと未来の境界を通って巻きつき、共形時間の両端が貼り合わされている場合である。これは公表されたモデルを超える追加の仮定であり、ステップ 2 の拡張 C が別の場所に現れたものである。$w$ 回巻くループは、我々の側のすべてのスライスで $+w$、すべての鏡像スライスで（鏡像自身の矢で読んで）$-w$ と読める。合計はゼロである（検証済み）。過剰はいまや揺らぎではなく位相的な整数であるが、$w\approx10^{80}$
  は依然として手で入れられている。このモデルの公表された予言（Boyle、Finn、Turok のアブストラクトから）を、引用した数値で検証する：(a) 最も軽いニュートリノの質量はゼロである。NuFIT 6.0 の質量二乗差（$\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$、$\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ 順階層、$\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ 逆階層）を用いると、これにより $\Sigma m_\nu = 0.0588$ eV（順階層）または $0.0989$ eV（逆階層）、$m_\beta = 0.009$ または $0.049$ eV が決まる。KATRIN は $m_\beta$ を 0.8 eV 未満（Nature Physics 18, 160, 2022）および 0.45 eV 未満（Science 388, 180, 2025）に制限しているが、これはどちらの値よりもはるかに上である。Planck 2018 は $\Sigma m_\nu < 0.12$ eV を与え、両方を許す。DESI 2024（$< 0.072$ eV）と DESI DR2（$< 0.064$ eV、$\Lambda$CDM）は逆階層の場合を排除し、順階層の場合を許す。DESI DR2 は振動実験による下限との緊張も指摘しており、最も軽いニュートリノの質量がゼロの場合が最も緊張の小さい場合である。(b) 暗黒物質は質量 $4.8\times10^8$ GeV の安定な右巻きニュートリノである。これはどの加速器の到達範囲もはるかに超え、直接検出の信号も与えないので、現時点では検証できない。(c) 原始重力波は存在せず、したがって $r = 0$ である。BICEP/Keck は $r < 0.036$（95%、PRL 127, 151301, 2021）を与え、これは整合する。本当の検証は $\sigma(r)\sim10^{-3}$ である：これは CMB-S4 の目標であり（同計画は 2025 年 7 月に中止された）、現在は LiteBIRD と Simons Observatory が担う。判定表。(1) 近傍に何も混ざっていない：必要；満たされる。反ヘリウム原子核がただ一つ見つかるか、銀河団からの対消滅ガンマ線が見つかれば反証される。(2)
  地平線内にドメインがない：必要；制約される（$d\gtrsim16$ Gpc）。MeV 背景放射の過剰や、より近い壁による CMB の歪みがあれば反証される。地平線の向こうについては検証不可能である。(3) 微調整されていない：必要；ランダムな世界線では破綻し（$\log_{10}P\sim-10^{70}$ から $-10^{79}$）、機構だけがこの問題を取り除く。(4a) 最も軽いニュートリノの質量はゼロ：制約される、これまでのところ整合。最も軽い質量がゼロより大きいと測定されれば反証される。例えば順階層で $\Sigma m_\nu$ が 0.0588 eV を明確に上回る場合である。(4b) 重い右巻きニュートリノの暗黒物質：現時点では検証不可能。暗黒物質が別のものと同定されれば反証される。(4c) $r = 0$：整合。$r\gg10^{-3}$ の原始 B モードがあれば反証される。結論：拡張された P3 が生き残るのは、CPT 鏡像宇宙をまたいでバランスし、ビッグバンを通って巻きつく 1 本の世界線という形だけである。その形において、それは反証可能な予言を受け継ぐ。最も軽いニュートリノの質量がゼロでないこと、あるいは $r\gg0$ の原始 B モードは、CPT 鏡像への対応づけを反証する。これまでのステップは、標準的な物理を再現するか、仮説が吸収できるデータに出会うかのどちらかだった。これは本シリーズで初めて、破綻しうる検証を伴うステップである。
meanings:
- 繰り返される $z$ ⇒ 和をとる：各ドメインサイズ $d$ と光子エネルギー $E$ に対する現在の拡散ガンマ線強度
- 壁での共動 cm$^3$ あたり毎秒の対消滅数：単位体積あたりの壁の面積 $3/d$ と流入 $n_b v$ の積
- 1 回の対消滅による放出エネルギーでの MeV あたりの光子数；繰り返される $j$（パイ中間子のエネルギー）⇒ 和をとる
- COMPTEL と Fermi-LAT の背景放射が許す最小のドメインサイズ（フラックスは厳密に $\propto 1/d$）
- Fermi-LAT のフラックス上限から得られる、かみのけ座銀河団のガス中の最大の反陽子割合
- ランダムな符号を持つ $M$ 回の交差の正味の電荷；その分散は $M$
- ランダムな世界線が $M$ 回の交差のうちで我々の領域に正味の電荷 $Q$ を与える確率（クラメールのレート関数）
- 我々のスライスとその CPT 像の上の正味の電荷、それぞれ自身の時間の矢で読む；繰り返される $s$（セグメント）⇒ 和をとる
- 最も軽い質量 $m_l$ と NuFIT の質量二乗差から得られるニュートリノ質量の和
labels:
  dims: 世界線が存在する空間の次元数 $D$（開いたパラメータ）
  speed_factor: 壁への流入速度 $\kappa$（ガスの音速を単位とする）
  z_max: 壁での対消滅が始まる赤方偏移 $z_{max}$（再結合）
  winding: ビッグバンを通る世界線の巻き数 $w$
