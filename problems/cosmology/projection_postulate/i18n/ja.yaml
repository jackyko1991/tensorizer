title: 射影公準：ひとつの高次元状態と多くの影
summary: これは推測的な仮説であり、確立した物理ではない。宇宙は非常に多くの次元 $D$ をもつ空間の中のひとつの状態 $\Psi$ であり、観測者が測るのはそのわずかな次元への射影だとする。このステップでは公準を述べ、その数学を確かめる。見える割合 $\|P\Psi\|^2$ は Beta$(d, D-d)$ 分布に従い、測定は隠れたブロックどうしの競争としてモデル化される。結果ごとに隠れた複素次元が 1 つならちょうどボルンの規則になり、それより多いとずれが生じるが、そのずれは三重スリット実験で否定されている。今のところ、この考えは量子力学を再現するだけで、それを超えてはいない。
notes: 位置づけ：推測的。これは著者自身の仮説（シリーズの説明を参照）であり、確立した物理ではなく、標準的な量子力学よりこれを支持する実験はない。この最初のステップでは公準を正確に書き、それが依拠する数学を確かめる。公準。P0（ひとつの実在）：宇宙は次元 $D$ の空間の中のただひとつの状態 $\Psi$ であり、$D\to\infty$ かもしれない。P1（射影）：観測者には $d$ 次元部分空間への射影 $P:\mathbb C^D\to\mathbb C^d$ しか見えない。測定される量子状態は $\psi = P\Psi/\|P\Psi\|$ であり、波動関数は $\Psi$ の射影であって $\Psi$ そのものではない。P2（事象）：測定とは、ひとつの確定した時間スライスへの射影であり、ひとつの結果 $k$ を選ぶ。結果の重みは $\|P_k\Psi\|^2$ から来て、ボルンの規則は仮定ではなく検証の対象とする。P3（ひとつの粒子）：すべての粒子は同じ対象の射影である。P4（幾何）：曲がった時空は平坦な高次元埋め込みを射影した形であり、特異点は射影が折り畳まれる場所（ヤコビアンの階数が落ちる場所）である。P5（開いた次元）：量子効果にはある最小次元 $d_Q$、重力には $D$ の中のある $d_G$ が必要であり、これらは推定またはフィットするもので、決して手で $3+1$ に定めない。計算する内容。(1) 測度の集中：$\Psi$ が $\mathbb C^D$ の球面上で一様なとき、$\|P\Psi\|^2\sim$ Beta$(d, D-d)$（平均 $d/D$）であることを、平均、分散、Kolmogorov–Smirnov 検定で $D$ が 4 から $D_{max}$ まで確かめる。正規化した $\psi$ は $D$ によらず小さな球面上で一様である。典型的な観測者はノルムの割合 $d/D$ しか見ず、これは $D\to\infty$ で消える。(2) P2 を射影競争として具体化する（著者のモデルをここで定式化）：各結果 $k$ は $m$ 個の隠れた複素次元からなる自分のブロック（エネルギー $E_k = \|h_k\|^2$）と結びつき、$|c_k|^2/E_k$ が最大の結果が起こる。$m = 1$ では $E_k\sim$
  Exp(1) であり、指数分布の競争はちょうど $P(k) = |c_k|^2$、すなわちボルンの規則を与える。$m > 1$ では $E_k\sim$ Gamma$(m)$ となり、最も起こりやすい結果が勝ちすぎる。結果が 2 つなら $P_1 = I_{|c_1|^2}(m, m)$ であり、ずれは $m$ とともに増える。実数の隠れた次元は Gamma$(m/2)$ を与え、実数次元 1 つでは逆正弦法則 $\tfrac2\pi\arcsin|c_1|$、2 つでボルンになる。(3) 次元の勘定（P5）：競争には $K$ 個の結果に対して $D\geq d + K$ が必要である。$N$ 個のもつれた 2 準位系には $D\geq 2^N$ が必要で、観測可能な宇宙の $\sim10^{80}$ 個の粒子では約 $10^{3\times10^{79}}$ となり、P0 の $D\to\infty$ と矛盾しない。正直に言えば、標準的な量子力学はすでにまさにこのヒルベルト空間を使っており、部分トレースや射影をとるのも標準的である。今のところこの仮説は再解釈であり、検証可能な新しさは、$m > 1$ の競争か後のステップが異なる予言をする所から来なければならない。Gleason の定理（1957）はすでに、$d\geq 3$ ならヒルベルト空間上の非文脈的な確率の割り当てはすべてボルンの規則であることを示している。(4) データ：三重スリット配置（スクリーンの 41 区間と「遮られた」結果を加え、それぞれが自分の隠れたブロックをもつ）では、競争は Sorkin パラメータ $\kappa\approx s\,(a-1)$ を与え、9 通りの区分で $s$ は 0.56 から 0.74 の間にある。ここで隠れた形状パラメータは $a = m$（複素）または $m/2$（実数）である。測定値（data/born_rule_tests.csv、引用した数値）：Sinha ら（Science 329, 418, 2010）は $|\kappa|$ を $10^{-2}$ 未満に制限。Park ら（NMR、New J. Phys. 14, 113025, 2012）は $\kappa = 0.001\pm0.003$。Kauten ら（New J. Phys. 19, 033017,
  2017、オープンアクセス、CC-BY 3.0）は予告付き単一光子で $0.0\pm1.6\times10^{-3}$、減衰レーザー光で $(1.3\pm1.8)\times10^{-4}$、古典光で $0.0\pm3.1\times10^{-5}$。$|\kappa|\leq|\kappa_{meas}| + 2\sigma$ と最小の傾きを使うと、単一光子のデータは $|a-1|\leq 6\times10^{-3}$ を許し、光子の検出 1 回が競争 1 回だとすれば古典光のデータは $|a-1|\leq 1.1\times10^{-4}$ を許す。$m = 2$ の競争は $\kappa\approx 1$、実数の隠れた次元 1 つは $\kappa\approx 0.1$ を与え、どちらも否定される。生き残るのは結果ごとに複素次元 1 つ（実数次元 2 つ）だけである。これはモデルへの制約であって支持ではない。$m = 1$ はまさに標準的な量子力学と区別できない場合だからである。$\kappa$ への対応は結果の区分の仕方に依存するので、最も慎重な傾きを使っている。シリーズの次のステップ（ここでは作らない）：P3（すべての粒子をひとつの対象の射影とする）、P4（曲がった時空を平坦な埋め込みの影とする。Janet–Cartan の定理により解析的な 4 次元計量は局所的に 10 次元の平坦空間に、Schwarzschild 解は 6 次元に埋め込める）、重力の $d_G$ のフィット、そして標準物理と異なる予言の探索。
meanings:
- 観測者に見える $\Psi$ のノルムの割合。すべての $D$ を一度に計算（入れ子の状態）
- 観測される状態。どの $D$ でも $\mathbb C^d$ の単位球面上で一様
- Beta$(d, D-d)$ との Kolmogorov–Smirnov 距離（不完全ベータ関数は数値積分）
- 隠れたブロック $k$ が $m = 1..M$ 次元のときのエネルギー：Gamma$(m)$（複素）または $2\,$Gamma$(m/2)$（実数）
- 射影競争：$|c_k|^2/E_k$ が最大の結果が起こる
- 競争の閉じた形。$j$ についての和（$j = k$ を除く）が他の結果についての積になる
- 繰り返すスリット添字 $s$ ⇒ 和をとる：開いたスリットの組 $S$ ごとの振幅
- 競争モデルの Sorkin 三経路パラメータ。ボルンの規則なら $0$
labels:
  D_max: 全次元の最大値 $D$（例。計算はそこまでの次元の列を使う）
  d: 観測者の部分空間の次元 $d$（例）
  m_max: 結果あたりの隠れた次元の最大数 $m$
  outcomes: 結果の数 $K$
  trials: ケースごとのランダム状態と事象の数
