source_hash: 888a525ecc84
title: 小さな GPT がシェイクスピアを書く
summary: 生のテンソル演算だけで組み立てた文字レベルの GPT です。埋め込み、einsum で書いた因果的マルチヘッド自己注意、LayerNorm、MLP、残差接続から成り、nn.Transformer は使いません。『マクベス』と『ロミオとジュリエット』で約1分間学習させると、損失は $\ln V$（$V$ 種類の文字からの一様な推測）から下がり、生成サンプルは意味不明な文字列から単語や人名、詩の行のような形へと変わっていきます。その間も注意マップは厳密に下三角のままです。
notes: 'アーキテクチャは Vaswani らの「Attention is all you need」（2017）に基づき、デコーダのみの GPT 形式で pre-norm ブロックを用います：$X \leftarrow X + \mathrm{Attn}(\mathrm{LN}\,X)$、続いて $X \leftarrow X + \mathrm{MLP}(\mathrm{LN}\,X)$。テストでは仕組みを厳密に確認しています。einsum による注意が PyTorch の融合版 `scaled_dot_product_attention`（`is_causal=True`）と一致すること、位置 $t$ より後の文字を変えても $t$ までの出力が一切変わらないこと（マスク）、$A$ の各行の和が 1 であること、未学習時の損失が $\ln V$ であること、モデルが1つのバッチを丸暗記できること、そして重みの数が $Vd + Td + L(12d^2 + 13d) + 2d + dV + V$ であることです。マスクがあるので、1回の順伝播でウィンドウ内の $T$ 個の次文字予測すべてを同時に学習できますが、生成は1文字ずつ行う必要があります。これほど小さなモデル（113 093 個の重み、CPU で約1分）が学ぶのは綴り、空白、大文字の話者名、改行であって、意味ではありません。検証損失は最終的に1文字あたり約 2 nats になります。ヒートマップは各層について、「When shall we three meet again?」という行で直前の文字に最も強く注意するヘッドを示しています。バイオインフォマティクスのタンパク質言語モデルは同じ注意をマスクなしで使い、隠された文字を埋めます。テキスト：Project Gutenberg 電子書籍 #100『The Complete Works of William Shakespeare』（パブリックドメイン）から『マクベス』と『ロミオとジュリエット』を取り出し、電子書籍のヘッダーとライセンスを除去し、曲がった引用符を ASCII にしたもの。247 kB、data/shakespeare.txt に収録。ステップ数を増やしたり、モデルを広くしたり、温度 0.5 と 1.2 を比べたりしてみてください。'
meanings:
- テキストからランダムに切り出したウィンドウの文字 ID。ターゲットは同じウィンドウを1文字左にずらしたもの
- トークン埋め込みと学習される位置埋め込みの和
- 各トークンベクトルをチャネル方向に平均 0、分散 1 に正規化し、学習されるスケールとシフトを適用する
- 繰り返される $c$ ⇒ 和をとる：各ヘッドのクエリ（キーとバリューも同様）
- 対角線上とその下は $0$、上は $-\infty$：softmax の後、ある位置は後の文字を見られない
- 繰り返される $k$ ⇒ 和をとる。各行はそれより前の位置 $j \le i$ 上の確率分布
- 繰り返される $j$、続いて $h, k$ ⇒ 和をとる：各位置が過去から集めた情報で、残差接続を通して加え戻される
- 正しい次の文字の $-\log p$ の平均（nats 単位）。最初は $\ln V$
labels:
  steps: 学習ステップ数
  d_model: モデル幅 $d$
  heads: 注意ヘッド数 $H$
  layers: Transformer ブロック数
  context: コンテキスト長 $T$
  batch: バッチサイズ
  lr: 学習率
  temperature: サンプリング温度
