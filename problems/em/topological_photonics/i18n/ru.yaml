title: Топологическая фотоника на решётке Холдейна
summary: Сотовый массив связанных оптических резонаторов с комплексными связями между следующими за ближайшими соседями — фотонная модель Холдейна. Блоховский гамильтониан $2\times 2$ на всей $k$-сетке даёт число Черна методом связей Фукуи–Хацугаи–Судзуки (einsum по переменным связей). Зигзагообразная лента показывает краевые состояния, пересекающие щель, а свет, запущенный у края конечной чешуйки, течёт в одном направлении вокруг выемки, тогда как в тривиальной решётке он не проходит.
notes: 'Единицы: связь $t_1 = 1$, расстояние между резонаторами равно 1. $E$ — отстройка от собственной резонансной частоты, а в массиве волноводов время $t$ становится расстоянием распространения. Фаза фиксирована: $\phi = \pi/2$. Решётка топологическая, с $C = \pm1$, когда $\lvert M\rvert < 3\sqrt3\,t_2\lvert\sin\phi\rvert$; решётка для сравнения использует вдвое большую массу и имеет $C = 0$. Метод Фукуи–Хацугаи–Судзуки (J. Phys. Soc. Jpn., 2005) даёт точное целое число даже на грубой сетке. Соответствие объём–граница тогда обещает $\lvert C\rvert$ однонаправленных краевых каналов. Входной свет — пятно у нижнего края, отфильтрованное до частот внутри объёмной щели. Он обходит выемку, потому что нет состояния, движущегося назад, в которое он мог бы рассеяться. В тривиальной решётке тот же свет просто расплывается в объём. Модель принадлежит Холдейну (PRL, 1988). Холдейн и Рагху (Haldane & Raghu, PRL, 2008) предложили её фотонную версию, а Wang, Chong, Joannopoulos & Soljačić (Nature, 2009)
  наблюдали однонаправленные микроволновые краевые состояния в магнитооптическом фотонном кристалле. Rechtsman et al. (Nature, 2013) построили флоке-версию из спиральных волноводов. Затем появились лазеры на топологических изоляторах (Bandres et al., Science, 2018), а Ozawa et al. (Rev. Mod. Phys., 2019) сделали обзор области. Более поздние работы, включая долинные холловские фотонные кристаллы, которым не нужно магнитное поле, переносят идею на интегральные телекоммуникационные и терагерцовые волноводы. Попробуйте поднять $M$ выше критического значения: $C$ падает до 0, краевые состояния отрываются от зон, и свет больше не обходит выемку.'
meanings:
- комплексная амплитуда поля в резонаторе $i$ чешуйки
- связи $t_1$, $t_2 e^{-i\nu_{ij}\phi}$ и отстройка $\pm M$ плюс беспорядок
- $k\cdot\delta_n$ — einsum по координате $i$ для каждого $k$ на сетке; $\delta_n$, $b_n$ — векторы связей
- 'повторяющийся $\mu$ ⇒ суммирование: блоховский гамильтониан в каждой точке $k$'
- собственный вектор нижней зоны (его фаза произвольна)
- 'повторяющийся $a$ ⇒ суммирование: переменная связи между соседними точками $k$'
- 'фаза петли из четырёх связей: поток Берри, калибровочно-инвариантный'
- 'повторяющиеся $a, b, c$ ⇒ суммирование: непрерывная кривизна Берри, производные через autograd'
- $e^{-iHt}\psi_0$ из одного eigh на решётку (топологическую и тривиальную)
labels:
  t2: Связь со следующими соседями $t_2$
  mass: Подрешёточная отстройка $M$
  disorder: Сила случайной отстройки $W$
  defect_radius: Радиус выемки $R$
