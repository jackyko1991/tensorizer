source_hash: 0b5328cbe1c8
title: Интерференция в волновой ванне
summary: Два вибратора синхронно колеблются на поверхности воды и испускают круговые волны. Двумерное волновое уравнение интегрируется с лапласианом в виде ядра свёртки $3\times3$ (conv2d), поглощающая граница гасит уходящие волны, а интерференционная картина устанавливается в неподвижные узловые линии там, где разность хода равна полуцелому числу длин волн.
notes: 'Единицы: размер ячейки $h = 1$, скорость волны $c = 1$. Схема «чехарда» по времени с центрированным слагаемым затухания, так что шаг явный. Вдоль узловой линии волна от одного источника всегда приходит на полпериода позже волны от другого, и они гасятся; штриховые кривые — гиперболы $|r_1 - r_2| = (m + \tfrac12)\lambda$, совпадающие с тёмными линиями на правой панели достаточно далеко от источников. Если развести источники дальше чем на $\lambda$, узловых линий станет больше. Граница — грубый поглотитель (слой трения), а не идеально согласованный слой, поэтому небольшое отражение остаётся. Правая панель показывает скользящее среднее $u^2$; первые несколько периодов — переходный процесс, пока волны заполняют ванну.'
meanings:
- высота поверхности в ячейке сетки $(a, b)$
- ядро пятиточечного лапласиана, смещения $\alpha, \beta \in \{-1, 0, 1\}$
- 'повторяющиеся $\alpha, \beta$ ⇒ суммирование: ядро скользит по сетке'
- нуль внутри, плавно растёт в поглощающей границе
- два маленьких гауссовых источника, колеблющихся в фазе
- число Куранта выше $1/\sqrt2$ отвергается (схема стала бы неустойчивой)
- 'скользящее среднее $u^2$ примерно за один период: тёмные линии — узлы'
labels:
  wavelength: Длина волны $\lambda$
  separation: Расстояние между источниками $d$
  courant: Число Куранта $c\,\Delta t/h$
  t_max: Время моделирования
