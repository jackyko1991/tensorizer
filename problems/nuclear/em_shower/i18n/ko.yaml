source_hash: 24c72b95c811
title: 전자기 소나기
summary: 고에너지 전자가 납 덩어리에 부딪히면 연쇄가 시작됩니다. 전자는 광자를 복사하고, 광자는 전자–양전자 쌍으로 바뀌며, 에너지가 임계 에너지로 떨어질 때까지 단계마다 절반이 됩니다. 하이틀러 모형을 텐서 위의 분기 과정으로 시뮬레이션합니다. 입자 하나가 한 행, 분열 한 번이 새로운 두 행이며, 소나기 최대 $N_{max} \approx E_0/E_c$가 깊이 $t_{max} \approx \ln(E_0/E_c)/\ln 2$에서 생긴다고 예측합니다.
notes: '깊이는 복사 길이 $X_0$ 단위(납에서 0.56 cm)이고, $E_c$는 임계 에너지로 납에서 약 7.4 MeV입니다. 딸 입자가 $E_c$ 아래로 떨어지게 되면 배가가 멈추므로, 약 $E_0/E_c$개 입자의 최대에는 약 $\log_2(E_0/E_c)$ 복사 길이 후에 도달합니다. 소나기의 깊이는 에너지에 따라 로그적으로만 커지므로 열량계를 작게 만들 수 있습니다. 고정 길이 모드에서는 모든 입자가 정확히 $X_0$ 하나마다 분열하므로 한 세대 전체가 보조를 맞춰 움직이고 개수가 계단처럼 올라갑니다. 확률 모드(점선은 비교를 위한 다른 모드)는 각 상호작용 지점을 무작위로 뽑습니다(광자는 평균 $\tfrac97 X_0$ 진행). 세대들이 깊이 방향으로 퍼져 실제 소나기처럼 더 낮고 넓고 긴 분포가 되며, 에너지 장부는 정확히 맞습니다. 옆으로 퍼지는 정도는 예시일 뿐입니다(각도 차기 $\propto E_c/E$). 하이틀러 모형의 단순화: 에너지를 똑같이 나눔, $E_c$ 위에서 이온화 손실 없음, 문턱 아래 입자는 모든 에너지를 한 번에 내려놓음, 콤프턴 산란과 광전 효과 없음. 난수 시드는 고정되어 있습니다.'
meanings:
- 비행 중인 모든 입자의 에너지(MeV)와 종류(1 = e±, 0 = γ); 소나기가 커지면서 P가 변함
- '확률 모드: $1 - e^{-\Delta t/\lambda}$, $\lambda = X_0$ (e±) 또는 $\tfrac97 X_0$ (γ)'
- '불리언 마스크: 증식할 입자, 나머지는 에너지를 내려놓음'
- e → e + γ와 γ → e + e, 이어 붙인 두 절반으로
- 각 깊이에서 비행 중인 입자 수
- 임계 에너지 아래 입자들이 내려놓은 에너지
labels:
  e0: 1차 입자 에너지 $E_0$
  e_crit: 임계 에너지 $E_c$
  mode: 분열 길이
