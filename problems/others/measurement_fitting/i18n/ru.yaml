source_hash: 2ae828bc3a14
title: Подгонка экспериментальных измерений с помощью тензоров
summary: (Синтетическое) лабораторное измерение затухающего осциллятора с погрешностью $\sigma_i$ у каждой точки подгоняется методом максимального правдоподобия. Модель измерения содержит явный член ошибки $\varepsilon_i$, разброс которого включает неизвестный дополнительный разброс $s$; autograd минимизирует $-2\ln L$, якобиан и гессиан дают неопределённости параметров, а линейная подзадача показывает метод наименьших квадратов как одно решение lstsq.
notes: 'Измерение никогда не совпадает с моделью в точности: $x_i = f(t_i;\theta) + \varepsilon_i$, и статистика занимается именно членом ошибки $\varepsilon_i$. Если бы заявленные погрешности описывали всё, то $\varepsilon_i \sim N(0, \sigma_i^2)$, и максимизация правдоподобия совпала бы с минимизацией $\chi^2 = \sum_i ((x_i - f_i)/\sigma_i)^2$ (взвешенный метод наименьших квадратов). Реальные эксперименты часто разбросаны сильнее, чем говорят их погрешности (вибрации, неучтённый дрейф), поэтому здесь разброс равен $\sigma_{tot,i}^2 = \sigma_i^2 + s^2$ с неизвестным дополнительным разбросом («джиттером») $s$, который подгоняется вместе с пятью физическими параметрами. Член $\ln 2\pi\sigma_{tot,i}^2$ в $-2\ln L$ не даёт подгонке объяснить всё огромным $s$. Данные в measurements.csv синтетические, созданы с $s = 0.8$ мм поверх погрешностей 0,5–1 мм: подгонка только по $\chi^2$ заканчивается на $\chi^2/\mathrm{dof} \approx 2.5$ — признак заниженных погрешностей, а с подогнанным $s$ нормированные
  остатки $r_i = (x_i - f_i)/\sigma_{tot,i}$ следуют $N(0,1)$ и $\chi^2/\mathrm{dof} \approx 1$. Autograd даёт градиент $-2\ln L$ для Adam (анимированные итерации) и L-BFGS (финальная доводка). Неопределённости получаются из кривизны $-2\ln L$ в минимуме: $C = (J^TJ)^{-1}$ с якобианом $J_{ip} = \partial r_i/\partial\theta_p$ или $C = 2H^{-1}$ с полным гессианом, если включён $s$. Линейный и нелинейный метод наименьших квадратов: при фиксированных $\gamma$ и $\omega$ модель линейна по $(A\cos\varphi, A\sin\varphi, c)$, поэтому лучшие значения дают одно решение lstsq (без итераций, единственный ответ) — так строится начальное приближение по $\omega_0, \gamma_0$; $\gamma$ и $\omega$ входят нелинейно и требуют итеративного поиска, который может застрять в локальном минимуме. Попробуйте плохое $\omega_0$ (подгонка может зацепиться за неверную частоту), большую скорость обучения или отключите джиттер. Упрощения: независимые гауссовы ошибки, нет ошибки по $t$, ковариации только из локальной кривизны.'
meanings:
- время, измеренная координата и заявленная погрешность точки $i$, прочитанные из measurements.csv
- $(A, \gamma, \omega, \varphi, c, \ln s)$; подгонка $\ln s$ сохраняет джиттер $s$ положительным
- модель затухающего осциллятора во все моменты измерения
- 'разброс члена ошибки $\varepsilon_i$: погрешность и дополнительный разброс, сложенные в квадратуре'
- повторённый $i$ ⇒ сумма; при $s = 0$ это $\chi^2$ плюс константа
- как каждый нормированный остаток меняется с каждым параметром
- 'ковариация Гаусса–Ньютона $C$: неопределённости $\sqrt{C_{pp}}$ (сумма по $i$)'
- ковариация с учётом $\ln s$, из гессиана $-2\ln L$
- при фиксированных $\gamma, \omega$ модель линейна по $\beta = (A\cos\varphi, A\sin\varphi, c)$
labels:
  omega0: Начальное приближение $\omega_0$
  gamma0: Начальное приближение $\gamma_0$
  lr: Скорость обучения Adam
  iterations: Итерации Adam
  jitter: Подгонять дополнительный разброс $s$
