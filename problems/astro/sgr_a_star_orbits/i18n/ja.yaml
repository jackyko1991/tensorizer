source_hash: 28a44bb1dca2
title: いて座 A*（Sgr A*）の質量を量る：恒星 S2 の軌道
summary: 恒星 S2 は 16 年ごとに天の川銀河の中心を一周し、目に見えない質量からわずか 120 AU の距離を通過します。ケプラー方程式をベクトル化したニュートン反復で解くケプラー軌道を、25 年分の実際の位置と視線速度のデータにフィットします。autograd でヤコビアンを計算する Levenberg–Marquardt 法を 64 個のランダムな初期値から同時に走らせ、$R_0 \approx 8.3$ kpc にある約 $4.3\times 10^6\,M_\odot$ のブラックホールを導きます。さらにこのフィットから、のちに GRAVITY が検出した 2 つの相対論的効果、すなわち近点での約 200 km/s の赤方偏移と 1 周あたり $12'$ の近点移動が予言されます。
notes: 1990 年代初頭から、Reinhard Genzel（MPE、ESO の望遠鏡）と Andrea Ghez（UCLA、Keck）がそれぞれ率いる 2 つのチームが、銀河系中心の 1 秒角以内にある恒星を追跡してきました。S2 は短周期軌道をもつ恒星の中で最も明るい星です。その 16 年周期の楕円軌道により、内側に含まれる質量はブラックホール以外にありえないほど小さな体積に閉じ込められていることがわかります。位置データからは軌道の角度サイズと周期が、視線速度（スペクトル線のドップラー偏移）からは km 単位の実際の大きさが得られます。両者を合わせると距離 $R_0$ が決まり、ケプラーの第 3 法則から質量が求まります。モデルのパラメータは 8 個で、6 つの軌道要素に $M$ と $R_0$ を加えたものです（周期は $P^2 = 4\pi^2(aR_0)^3/GM$ から決まります）。フィットには autograd によるヤコビアンを用いた Levenberg–Marquardt 法を使い、多数のランダムな初期軌道から同時に計算します。その多くは局所最小に陥るため、初期値をバッチで用意する必要があり、$\chi^2$ が最良のものを採用します。ケプラー方程式は detach したテンソル上でニュートン反復により解き、最後に計算グラフを保持した 1 ステップを加えることで、autograd が正確な陰関数微分を得られるようにしています。デフォルト設定での結果：$M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$、$R_0 \approx 8.35 \pm 0.12$ kpc、$P \approx 16.03$ yr、$e \approx 0.884$、334 個のデータに対して $\chi^2 \approx 336$。公表値は 17 個の恒星から得られた $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ と $8.32 \pm 0.07 \pm 0.14$ kpc です（Gillessen et al. 2017）。このフィットは、自身には含まれていない 2 つの相対論的効果を予言します。近点（120 AU、7700 km/s、$c$ の 2.6 %）では、重力赤方偏移と横ドップラー効果を合わせて約
  200 km/s が加わります。GRAVITY は 2018 年 5 月の近点通過後、この一般相対論の予言値に対して $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ 倍を測定しました（GRAVITY Collaboration 2018）。また軌道は 1 周ごとに $6\pi GM/(c^2a(1-e^2)) \approx 12'$ だけ近点移動し、一般相対論の値の $f_{SP} = 1.10 \pm 0.19$ 倍と測定されています（GRAVITY Collaboration 2020）。これらは引用した検出結果であり、このデータから計算したものではありません。2016 年のデータ表は 2018 年の近点通過より前で終わっているためです。簡略化：純粋なケプラー軌道であり、レーマー遅延（軌道を横切る光の伝播時間、約 8 日）、相対論的項、基準座標系のドリフト（論文では座標系パラメータを 5 個追加でフィット）は含めていません。データ：Gillessen et al. 2017, ApJ 837, 30（arXiv:1611.09144）、S2 のデータ表 5、VizieR/CDS カタログ J/ApJ/837/30（doi:10.26093/cds/vizier.18370030）より、CDS の利用条件に従い出典を明記して使用。受賞：2008 年ショウ賞天文学部門（Genzel）、2012 年クラフォード賞天文学部門（Genzel と Ghez）、2020 年ノーベル物理学賞（半分を Genzel と Ghez に、銀河系中心の超大質量コンパクト天体の発見に対して）。
meanings:
- 初期値ごとに 1 つの軌道：$a$、$e$、$i$、$\Omega$、$\omega$、$t_p$、$M$、$R_0$
- ニュートン反復による離心近点角。すべての軌道と観測時刻を一度に計算
- 軌道面 →（北、東、視線方向）、einsum で構成
- $j$ について和：AU 単位の S2 の位置。$R_0$ で割ると天球上の mas になる
- km/s 単位の視線速度：これが $R_0$ を決める
- （モデル − データ）/$\sigma$、赤経 145 個、赤緯 145 個、速度 44 個
- フォワードモード autograd を 8 つのパラメータ方向について vmap
- すべての初期値に対して同時に Levenberg–Marquardt を 1 ステップ
- $6\pi GM/(c^2a(1-e^2))$：シュワルツシルト近点移動、S2 では $\approx 12'$
labels:
  n_starts: ランダムな初期軌道の数
  n_iter: Levenberg–Marquardt のステップ数
  seed: 乱数シード
