source_hash: ea8025a41e84
title: 결합 진동자와 정규 모드
summary: 고정된 두 벽 사이에 용수철로 연결된 $N$개의 같은 질량. 용수철들은 강성 텐서 하나 $K_{ij}$가 되고, 그 고유벡터가 정규 모드이며, 운동은 einsum 하나로 합한 모드들의 중첩입니다.
notes: $K_{ij}$가 대칭이므로 eigh는 실수 진동수와 정규직교 모드를 주고, 모든 운동은 독립적인 코사인들의 합이 되어 시간 적분이 필요 없습니다. 한 모드로 시작하면 사슬은 그 모양을 영원히 유지하고, 질량 하나를 튕기면 에너지가 사슬을 따라 이리저리 옮겨 다닙니다. 해석적 진동수는 $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$입니다.
meanings:
- 질량 $i$의 평형 위치로부터의 변위
- '강성 텐서: 대각선에 $2k$, 그 옆에 $-k$'
- '반복된 $j$ ⇒ 합: 질량 $i$에 작용하는 알짜 탄성력'
- 고윳값과 고유벡터(열 $n$) = 정규 모드
- '반복된 $i$ ⇒ 합: 초기 상태를 각 모드에 사영'
- '반복된 $n$ ⇒ 합: 모드들의 중첩'
labels:
  n_masses: 질량 개수
  k: 용수철 상수
  m: 질량
  start: 초기 변위
  amplitude: 초기 진폭
  t_max: 시뮬레이션 시간
