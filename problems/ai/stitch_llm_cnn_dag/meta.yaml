  - {symbol: 'A_{\mathrm{rule}}', code: 'rule_graph(parse_snakefile(training.smk))', shape: '(R, R)', meaning: 'rule $s$ reads what rule $r$ writes; the training process parsed from data/training.smk with the Circle of Willis problem''s parser'}
  - {symbol: 'A = \sum A_{\mathrm{rule}} \otimes M', code: 'dag.job_adjacency(A_rule, axes, sizes)', shape: '(J, J)', meaning: 'job graph over the wildcards seed and $n$: a rule without $n$ broadcasts to every $n$ ($I \otimes \mathbb 1$), evaluate gathers all ($\mathbb 1^\top$)'}
  - {symbol: '\ell_r', code: 'dag.levels(A_rule)', shape: '(R,)', meaning: 'level of each rule: train_cnn, train_lm and the monolith on 0, the connector on 1, fine-tune and router on 2, evaluate on 3'}
  - {symbol: 't = d \oplus (A \otimes t)', code: 'dag.finish_times(A_rule, seconds)', shape: '(R,)', meaning: 'max-plus finish times from the measured rule durations; $\max t$ is the critical path'}
  - {symbol: 'q_{mne}', code: 'cnn_output(x, w)', shape: '(M, N, 10)', meaning: 'the CNN''s ten digit probabilities for each image; the model axis $m$ becomes the groups of one grouped convolution per layer'}
  - {symbol: 'c_{mntc}', code: 'connector(q, slots, w)', shape: '(M, P, d)', meaning: 'the DAG edge: digit probabilities plus a slot vector $S_t$ → an LM input vector at position $t$; the $K = 5$ soft tokens replace the hidden first word'}
  - {symbol: 'G_{mntx}', code: 'route_fixed(...), route_learned(r, w)', shape: '(M, N, T, 2)', meaning: 'router: one-hot by data type (image slot or letter), or a learned Switch top-1 softmax over the position features'}
  - {symbol: 'X^0 = G_{mntx}Y^x_{mntc}', code: "einsum('mntx,xmntc->mntc', G, Y)", shape: '(M, N, T, d)', meaning: 'repeated $x$ ⇒ summed: the combine of the MoE layer; each expert $Y^x$ is computed only on its dispatched group'}
