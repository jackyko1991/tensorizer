title: 阈值以下的量子纠错
summary: 比特翻转重复码把一个逻辑比特分布到 $d$ 个有噪声的量子比特上，并不断测量它们的奇偶性。数千次蒙特卡罗采样作为一个 $(S, R, d)$ 张量运行，精确的最小权重解码器读取时空校验子历史，$d = 3, 5, 7, 9$ 的曲线在阈值处相交：在阈值以下，每一步 $d \to d + 2$ 都使逻辑错误率除以因子 $\Lambda > 1$，这正是 Google 2024 年阈值以下表面码存储实验背后的量。
notes: 该码存储 $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$ 和 $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$；奇偶校验 $Z_jZ_{j+1}$ 揭示相邻比特在哪里不一致，却不揭示逻辑值。在码容量模型（一轮、完美校验）中，最佳解码器是多数表决，模拟的 $P_L$ 遵循精确的二项尾概率（虚线），阈值恰为 $p = 1/2$。在唯象模型中，校验也会误读，因此单个校验子不可信；解码器寻找能解释整个 $d$ 轮历史的最少数据翻转加误读。这正是最小权重完美匹配所解决的问题；在一维中，这里用对 $2^d$ 种错误模式的动态规划精确求解（因此 $d \le 11$）。对该模型，阈值在 $p \approx 10\%$ 附近（$d$ 很大时约 10.3 %），当每个码运行 $d$ 轮时，小 $d$ 的交叉点落在其附近。在阈值以下，更大的码更好，$\Lambda = \varepsilon_d/\varepsilon_{d+2}$ 随 $p$ 减小而增大（大致按 $p_{th}/p$）；在阈值以上，增加量子比特只会增加出错的地方。研究背景：Google Quantum AI and Collaborators, Quantum error correction below the surface code threshold, Nature 638, 920（2025；arXiv:2408.13687, 2024）在其 Willow 处理器上运行了距离 3、5 和 7 的表面码存储，报告 $\Lambda \approx 2.1$，距离 7 的逻辑错误约为每周期 0.14 %（近似值）。更早的进展包括重复码（Nature 595, 383, 2021）以及距离 5 的表面码略胜距离 3（Nature 614, 676, 2023）。重复码与表面码：重复码是一条一维链，只纠正比特翻转（$X$ 错误）——任何量子比特上的相位翻转（$Z$）都是逻辑错误，因此它不是完整的量子存储器。表面码是二维晶格，同时具有 $Z$ 型和 $X$ 型校验，可纠正两者；其解码图是三维的（两个空间维度加时间），阈值更低，对这种唯象噪声约为 3 %，对实际的电路噪声约为 1 %（近似值）。简化：错误相互独立，最终读出完美，没有泄漏或关联突发错误，而在真实器件中这些因素决定了逻辑错误率的下限。
meanings:
- 第 $s$ 次采样、第 $t$ 轮的数据翻转（概率 $p$）与校验误读（概率 $q$）
- 第 $t$ 轮之后数据量子比特 $i$ 上的累积错误
- 校验 $j$ 比较相邻的 $i = j$ 与 $i = j + 1$（$Z_jZ_{j+1}$）
- 重复的 $i$ ⇒ 求和：每个校验应报告的奇偶性
- 发生变化的校验子比特：时空中错误链的端点
- 以错误模式 $x$ 结尾的代价最低的历史，$w = \ln\frac{1-p}{p}$；对 $y$ 取最小即 $d$ 个单比特翻转
- 多数表决：校验从不误读时的最优解码器
- 每轮的错误抑制，$1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: 噪声模型（有或无校验误读）
  d_max: 最大距离 $d$（11 较慢）
  shots: 每个 $(d, p)$ 点的采样次数
  n_p: 错误率 $p$ 的个数
  p_min: 最小 $p$
  p_max: 最大 $p$
  q_ratio: 误读率 $q/p$
