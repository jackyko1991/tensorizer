title: テンソル問題としての UMAP：MNIST 上の kNN グラフ、ファジィ集合、力学的レイアウト
summary: 784 ピクセルの MNIST 数字を 2 次元マップとして描く次元削減手法 UMAP を、すべてテンソル演算だけで記述する：1 つの距離行列と topk による厳密な kNN グラフ、全点の帯域幅 $\sigma_i$ を一度に求める二分法、ファジィ和 $P + P^\top - P\circ P^\top$、グラフラプラシアンによるスペクトル初期化、そしてエポックごとに辺リスト全体へ適用する引力と斥力（手書き版と autograd 版）。2500 個の数字とスイスロールにおいて、trustworthiness、近傍再現率、数字の正解率で umap-learn ライブラリと同等の結果を示し、PCA を大きく上回る。
notes: 問い。「UMAP を単なるテンソル問題として」は Jacky Ka Long Ko の依頼である：通常は numba ループを用いる umap-learn ライブラリで実行される UMAP（Uniform Manifold Approximation and Projection；McInnes, Healy, Melville 2018）を取り上げ、すべてのステップをバッチ化されたテンソル演算として書き直し、結果が同等に良いかを確認する。手法（テンソルとして；D 次元の N 点）。1. kNN グラフ：(N, N) の二乗距離 $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$（einsum）を行ブロックごとに計算し、topk で (N, k) の距離とインデックスを得る。umap-learn も 4096 点未満では厳密である（それを超えると近似最近傍降下法に切り替わる）。2. ファジィ単体的集合：$\rho_i$ は自分以外で最も近い点までの距離；$\sigma_i$ は $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ を二分法で解き、N 個の区間すべてを同時に半分にする（64 回；上端が未知の間はまず倍増フェーズ）。所属度は密な (N, N) 行列 $P$ に散布され、ファジィ和 $W = P + P^\top - P\circ P^\top$ で対称化される（数千点なら密行列で十分；大規模では疎な COO テンソルで同じ式を使う）。3. 低次元の類似度 $q = 1/(1 + a d^{2b})$。$a$ と $b$ は 2 パラメータの Gauss–Newton 最小二乗法で min_dist に合わせて当てはめる。初期値：密な torch.linalg.eigh による正規化ラプラシアン $I - D^{-1/2} W D^{-1/2}$ の非自明な最小 2 固有ベクトル（2500 点で 1 コアあたり約 4 秒；umap-learn は疎ソルバーを使用；eigh が失敗した場合はランダム初期化にフォールバック）。4. レイアウト：500 エポック。重み $w_{ij}$ の辺は $\max w / w_{ij}$ エポックごとに
  1 回有効になる（umap-learn のスケジュールで、次のサンプリングエポックを並べた (E,) テンソルとして保持）。有効な各辺は両端を引き寄せ、先頭点を押しのける 5 個のランダムな負例を引く。エポック内のすべての力は一度に計算され、index_add_ で点ごとに合計される（同期更新；umap-learn は辺ごとに点を動かす）。同じループの autograd 版：サンプリングされた交差エントロピーの勾配を、合計後にクリップする。5. 評価指標（すべてテンソル演算、$k$ = 10）：ランク行列（argsort の argsort）による trustworthiness と continuity（Venna, Kaski 2001）、kNN 再現率、2 次元レイアウトにおける leave-one-out 10-NN 数字正解率；線形ベースラインとして SVD による PCA。データ。MNIST（LeCun, Cortes, Burges）、ライセンス CC BY-SA 3.0：data/mnist_subset.npz は各数字の最初の 250 枚の訓練画像を含む（2500 枚、uint8；継承ライセンスはこのサブセットにも適用される）。data/SOURCES.md を参照。スイスロール（1500 点、scikit-learn の make_swiss_roll と同様、わずかなノイズ付き）はコード内で生成されるため、真の平坦座標（弧長、高さ）が既知である。umap-learn の参照結果（umap-learn 0.5.12、scikit-learn 1.9.1、random_state 42）は、使い捨て環境で data/make_reference.py により一度だけオフラインで計算された；同梱されているのは 2 次元座標と指標のみである。結果（同梱の実行、CPU、1 スレッド）。MNIST、2500 個の数字：trustworthiness / continuity / 10-NN 再現率 / 10-NN 数字正解率 = 手書きの力で 0.957 / 0.963 / 0.39 / 0.887、autograd で 0.960 / 0.963 / 0.40 / 0.898、umap-learn で 0.963 / 0.963 / 0.40 / 0.896、PCA
  で 0.740 / 0.913 / 0.07 / 0.414。スイスロール：trustworthiness 0.999（umap-learn 0.999、PCA 0.943）、真の平坦座標に対しては 0.999 で、真の 10 近傍の 76 % を保持（umap-learn 77 %、PCA 28 %）。我々の trustworthiness は、同梱の umap-learn レイアウト上で scikit-learn の値と $2\times 10^{-4}$ 以内で一致し（テスト済み）、$a$, $b$ も umap-learn の値と一致する。MNIST での実行時間：力の版で 11 秒（グラフ 0.5 秒、eigh 4 秒、レイアウト 7 秒）、autograd で 15 秒、umap-learn で 14 秒（2 回目の呼び出し、1 スレッド；numba のコンパイルを含む初回は 28 秒）。最適な回転・反転・スケーリング（Procrustes）の後、我々の MNIST レイアウトと umap-learn のレイアウトの差異（disparity）は 0.05 である（0 = 同じ形、1 = 無関係）；同じ数字のクラスタが同じ位置にある。結論と限界。UMAP はテンソル問題である：グラフ構築、帯域幅探索、ファジィ和、スペクトル初期化、力学的レイアウトはすべてバッチ化されたテンソル演算であり、結果はここでのすべての指標で参照実装と同等に良い。異なる点：レイアウトは座標ではなく常に指標で比較する。UMAP のレイアウトは回転、反転、負例サンプリングの乱数性を除いてしか定まらないからである（別のシードではクラスタの位置が入れ替わる）。4096 点を超えると umap-learn の kNN は近似になるが、我々のものは厳密なまま（ただしコストは $O(N^2)$）。密な $N\times N$ 行列と eigh のため、このバージョンは約 $10^4$ 点が上限である（ブロック化、疎テンソル、反復固有値ソルバーで引き上げられる）。同期更新のため、初期のエポックは熱い気体のように見える（学習率がほぼ 1 で、各点がすべてのキックを一度に受ける）が、やがてレイアウトは冷えて落ち着く。スイスロールは局所近傍をすべて保つが、1 枚のきれいなシートとしては展開されない：umap-learn
  と同様に帯状に裂ける。これは UMAP と t-SNE の既知の性質である。数字の正解率は、マップが一度も見ていないクラスをどれだけうまく分離するかの尺度であって、分類器ではない。結果は BLAS のビルドやスレッド数によって千分の数程度変動する。関連研究。t-SNE（van der Maaten, Hinton 2008）は、2 次元で裾の重いカーネルを用いて近傍確率を一致させるという枠組みを確立した；UMAP はその正規化された確率をファジィ所属度に、全点間の斥力を（word2vec と同様の）負例サンプリングに置き換えた。これがスケールする理由である。ラプラシアン固有写像（Belkin, Niyogi 2003）がスペクトル初期化を与える。試してみよう。近傍数を減らす（5）と、より多くの小さなクラスタができる；min_dist を 0.9 付近にすると点がゆるく詰まる；エポック数を減らすと未完成のレイアウトが見える；別のシードではマップが回転・再配置されるが、指標は変わらない。
meanings:
- $k$ 個の最近傍点（自分自身が最初）までの距離。$\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$（繰り返される $d$ ⇒ 和）と topk から求める；厳密で、行ブロックによりメモリを $O(BN)$ に抑える
- $\rho_i$ = 自分以外で最も近い点までの距離；$\sigma_i$ は全点に対する 1 つの区間テンソルを 64 回半分にして求め、$\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ を満たす
- 有向の所属度：最近傍で 1、それより遠いと距離とともに減衰し、kNN リストの外では 0
- 2 方向のファジィ和（確率的 OR）：対称で $[0, 1]$ に値をとる；非ゼロ要素が辺リスト $(i_e, j_e)$ で、2500 個の数字では $E$ ≈ 50 000
- $1/(1 + a x^{2b})$ を、min_dist 未満では 1、それ以上では $e^{-(x - \mathrm{min\_dist})}$ に Gauss–Newton で当てはめる：min_dist = 0.1 で $a$ = 1.577, $b$ = 0.895
- スペクトル初期化：正規化グラフラプラシアンの非自明な最小 2 固有ベクトルを $[0, 10]$ にスケーリング
- サンプリングされたすべての辺 $(i, j)$ と、辺ごとに 5 個のランダムな負例 $s$ の力を、1 回の scatter-add で点ごとに合計；各項は $\pm 4$ にクリップ；学習率 $\alpha = 1 - \mathrm{epoch}/n$
- サンプリングされた損失 $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$ に autograd を適用した同じステップ：手書きの力と一致（テスト済み）
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$、ランク $r$ は argsort の argsort から；continuity は $x$ と $y$ を入れ替える
labels:
  n_neighbors: 近傍数 $k$（自分自身を含む）
  min_dist: レイアウト内の最小距離
  n_epochs: レイアウトのエポック数
  neg_rate: 辺サンプルあたりの負例数
  n_mnist: MNIST 画像数（数字ごとに均等）
  seed: 乱数シード
