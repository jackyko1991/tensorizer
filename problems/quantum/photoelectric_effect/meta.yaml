title: Photoelectric effect and light quanta
category: quantum
level: intermediate
order: 6
tags: [annus-mirabilis:1905, nobel:physics:1921, nobel:physics:1923, series:einstein-1905:1]
summary: >
  Einstein's 1905 light-quantum paper: light of frequency $\nu$ arrives in packets of energy $h\nu$, and one packet frees one
  electron with kinetic energy $K = h\nu - \phi - \varepsilon$. A batch of photons × frequencies × intensities shows the threshold
  $\nu_0 = \phi/h$, a stopping potential $eV_s = h\nu - \phi$ that ignores the intensity, and no time delay — all against the classical wave
  picture. A straight-line fit to Millikan's 1916 sodium measurements gives back Planck's constant.
animated: true
vector_form: 'K = h\nu - \phi - \varepsilon,\qquad eV_s = h\nu - \phi,\qquad \nu_0 = \phi/h,\qquad I(V) = \Phi\,P(K > eV)'
index_form: 'K_{ifn} = h\,\nu_f - \phi - \varepsilon_{ifn},\qquad V_{s,if} = \max_n K_{ifn}/e,\qquad \min_{a,b}\sum_m \big(V_m - a\,\nu_m - b\big)^2'
