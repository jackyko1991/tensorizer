source_hash: 2ee80d9bf824
title: ブロッホ方程式とスピンエコー
summary: ブロッホ方程式は外積 $\varepsilon_{ijk} M_j \Omega_k$ に緩和を加えたものである。オフレゾナンス周波数 $\Delta\omega_n$ がわずかに異なる数百のアイソクロマットを、バッチ化した1回の RK4 更新でまとめて時間発展させる：90° パルスの後それらは扇状に広がり信号は $T_2^*$ で消えるが、$TE/2$ での 180° パルスにより再収束して $TE$ でエコーとなり、その高さは真の $T_2$ でのみ減衰する。
notes: 時間の単位は ms、周波数は rad/ms。個々のアイソクロマットは緩和を除けば $\lvert\mathbf M\rvert$ を一定に保つが、アンサンブル平均は位相のコヒーレンスを失う：ローレンツ型の広がりでは自由誘導減衰は $e^{-t/T_2^*}$ に従い、$1/T_2^* = 1/T_2 + 1/T_2^{\prime}$ である。180° パルスはすべての位相を反転させるので、先行していたスピンは遅れる側になり、$TE$ で再びそろう。これは静的な不均一性を打ち消すが、ランダムな $T_2$ 損失は打ち消さないので、エコーの高さは $e^{-TE/T_2}$ をたどる。複数の再収束パルス（CPMG 列、$y$ 軸まわりの 180°）でエコーの列が得られ、$T_2$ を描き出せる。パルスは同じブロッホ方程式で計算する短い矩形の「ハード」パルスであり、共鳴から大きく外れたスピンは不完全にしか再収束しない。値は説明用で、教育目的に限り、臨床には使用できない。ガウス型の広がり、より長い $T_2^{\prime}$、単一エコーを試してみよう。
meanings:
- 回転座標系におけるアイソクロマット $n$ の磁化、成分 $i \in \{x, y, z\}$
- レヴィ＝チヴィタ記号：外積。ローレンツ力とまったく同じ
- 回転座標系での $\gamma\mathbf B$：パルス中は $xy$ 平面内の RF 磁場 $\omega_1$、$z$ 方向にはオフレゾナンス $\Delta\omega_n$
- 繰り返される $j, k$ ⇒ 和をとる：各アイソクロマットの歳差運動 $\mathbf M\times\boldsymbol\Omega$
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$。$j$ について $M_{nj} - M^0_j$ と縮約する
- 磁場の不均一性による歳差周波数の広がり、幅 $1/T_2^{\prime}$
- 受信コイルが見るもの：$n$ について和をとった横磁化の平均
labels:
  T1: 縦緩和 $T_1$
  T2: 横緩和 $T_2$
  t2_prime: 不均一性の時間 $T_2^{\prime}$
  TE: エコー時間 $TE$
  n_echoes: エコー数（180° パルス）
  n_spins: アイソクロマット数
  spread: オフレゾナンスの線形
