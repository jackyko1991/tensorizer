source_hash: e6424f8df209
title: 機械学習で加速する CFD
summary: 真の解より 16 倍粗いグリッド上の単純な有限体積ソルバーは、粘性バーガース方程式の衝撃波をなまらせてしまう。小さな CNN が、展開した粗いシミュレーションを通して誤差逆伝播することで、セル面の流束に対する補正を学習する。一度も見たことのない初期条件に対して、学習したソルバーは同じ粗い解像度のまま細かい解に数倍近く追従し、しかも $\int u\,dx$ を厳密に保存する。
notes: 単位：領域は周期的な $[0, 2\pi)$。真の解は 512 セル上の同じ有限体積スキームで、安定性を保つためにサブサイクルした Heun 法で時間発展させる。訓練には 32 個のランダムな滑らかな波を使い、テストには別のシードから得た 8 個を使い、訓練データより 50% 長く（$t = 3$）実行する。Adam の各ステップで、学習ソルバーはランダムな時刻の真の粗い状態から出発して $S$ ステップ進み、平均化した真の解からのずれにペナルティを受ける。勾配はすべての時間ステップを通って逆伝播するので、ネットワークは自身の出力を入力されても良好であり続ける補正を学習する。二つの設計上の選択が公正さを保つ：$\delta F$ は流束として入るので $\sum_i u_i$ は丸め誤差まで保存され、最終層はゼロから始まるので訓練は単純なソルバーから出発する。この考え方は、まさにこの種の方程式についてデータ駆動の離散化を学習した Bar-Sinai, Hoyer, Hickey & Brenner（PNAS, 2019）と、Kochkov, Smith, Alieva, Wang, Brenner & Hoyer（PNAS, 2021）に従う。後者は 2D ナビエ–ストークスソルバー内部の補間係数を学習し、同じ精度で 8–10 倍粗いグリッド、およそ 40–80 倍の高速化を報告した。このトイモデルが示すのは仕組みであり、それらの高速化ではない。学習した補正は、訓練データから遠い入力では失敗することがある。訓練ステップを減らす、展開を短くする、ネットワークが訓練されていない粘性を使うなどを試してみよう。
meanings:
- 軌道 $b$ の粗いセル $i$ でのセル平均（周期的）
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$、$\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$。$u_{i+1}$ は roll(u, -1)
- 一つのセルから流れ出たものは次のセルへ流れ込む ⇒ $\sum_i u_i$ は保存
- $k$ の繰り返し ⇒ 和：5 セルのステンシル、周期的パディング
- 三つの畳み込みから得る学習済み流束補正（開始時はゼロ）
- 各粗いセル内の $f = N_f/N_c$ 個の細かいセルで平均した細かい解
- ソルバーの展開した $S$ 個の時間ステップすべてを通した autograd
labels:
  nu: 粘性 $\nu$
  n_coarse: 粗いセル数 $N_c$
  train_iters: 訓練ステップ数
  unroll: 展開ステップ数 $S$
