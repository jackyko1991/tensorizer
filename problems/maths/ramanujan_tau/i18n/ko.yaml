source_hash: 242e43034f00
title: 라마누잔의 $\tau(n)$과 사토–테이트 법칙
summary: 판별식 모듈러 형식 $\Delta(q) = q\prod_n (1-q^n)^{24}$을 텐서 멱급수로 전개하여 라마누잔의 $\tau(n)$을 구합니다. 소수 묶음에 대한 나머지를 이용해 $n \sim 10^5$–$10^6$까지 정확하게 계산합니다. $\tau$가 곱셈적이고 헤케 점화식을 따른다는 것, $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, $|\tau(p)| \le 2p^{11/2}$(들리뉴의 정리, 1974)임을 확인하고, 정규화된 값 $\tau(p)/2p^{11/2}$이 사토–테이트 반원을 채워 가는 모습을 지켜봅니다($\Delta$에 대해서는 2011년부터 정리). 프로그램은 이 정리들을 수치적으로 확인합니다.
notes: '라마누잔(1916)은 무게 12의 유일한 정규화된 첨점 형식 $\Delta(q) = q\prod(1-q^n)^{24}$의 계수 $\tau(n)$을 연구하고 세 가지를 추측했습니다: $\tau$는 곱셈적이고, $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$을 만족하며, $|\tau(p)| \le 2p^{11/2}$이다. 모델은 1917년에 앞의 두 가지를 증명했는데, 이는 훗날 헤케 이론이 된 것의 초기 사례입니다. 이 부등식은 $\Delta$에 대한 라마누잔 추측(일반적으로는 라마누잔–페테르손 추측)입니다: 들리뉴가 1974년 베유 추측을 증명한 결과로 이를 증명했으므로 정리입니다. 라마누잔은 또한 합동식 $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$을 증명했는데, 이는 $691$이 베르누이 수 $B_{12}$의 분자를 나누기 때문에 생깁니다. $\tau(p) = 2p^{11/2}\cos\theta_p$로 쓰면, 사토–테이트 추측은 각 $\theta_p$가 $\frac{2}{\pi}\sin^2\theta\,d\theta$ 분포를 따른다고 말합니다. 즉 $x_p = \cos\theta_p$는 반원 분포 $\frac{2}{\pi}\sqrt{1-x^2}$를 따르고, 그 모멘트는 $1/4$, $1/8$, $5/64$(카탈랑 수를 4의 거듭제곱으로 나눈 값)입니다. $\Delta$에 대해서는 바넷-램, 게라티, 해리스, 테일러(2011)가 이를 증명했습니다. 히스토그램은 독립 표본처럼 천천히 수렴합니다. $\tau(n)$이 결코 0이 아니라는 레머 추측은 여전히 미해결입니다. 이 범위를 훨씬 넘어서까지 확인되었고, 프로그램도 0을 찾지 못합니다. 수치 계산: $\tau(n)$은 $n^{11/2}$처럼 커지므로, 급수 전체를 float64 FFT로 계산하면 가장 큰 계수의 약 $10^{-16}$배에 달하는 절대 오차가 생겨 $\tau(2) = -24$를 완전히 묻어 버립니다(테스트가
  이를 보여 줍니다). 대신 급수를 열 개 남짓한 소수에 대해 한꺼번에 정확히 모듈러로 계산하고(소수마다 텐서 행 하나), 중국인의 나머지 정리로 재구성합니다. 재미로: 라마누잔은 알아챘다… (Ramanujan noticed that…) $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$임을; $1729 = 1^3 + 12^3 = 9^3 + 10^3$임을; 그리고 오직 정칙화된 의미에서만 $1 + 2 + 3 + \dots$ "$= -1/12$"임을. 이 급수는 발산하며, $-1/12$는 해석적으로 연속된 제타 함수의 값 $\zeta(-1)$입니다.'
meanings:
- '야코비 항등식 $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$: 0이 아닌 계수는 $O(\sqrt N)$개뿐'
- '반복된 $j$ ⇒ 합산: 잘린 급수의 곱을 퇴플리츠 행렬과 벡터의 곱으로, 작은 $N$에서는 int64로 정확하게'
- 제곱을 세 번 하면 24제곱
- 같은 곱을 FFT로 $M$개의 소수 법에 대해 한꺼번에, 정확한 나머지로 반올림(각각 $m^2 N \le 2^{42}$)
- 균형 자릿수를 쓰는 중국인의 나머지 정리로, 음수 값이 음수로 나오도록
- $mn \le 600$인 모든 서로소 쌍 $1 < m < n$을 한꺼번에
- $dj \le N$인 모든 약수 쌍 $(d, j)$가 $n = dj$에 $d^{11}$을 더함
- 소수에서의 정규화된 값, 들리뉴의 정리에 의해 $[-1, 1]$ 안에 있음
labels:
  n_max: 소수와 $\tau(n)$의 상한 $N$
