source_hash: f24d1ad2823c
title: Двумерная модель Изинга
summary: Решётка спинов $\pm 1$, которые стремятся выстроиться параллельно соседям. Сумма по соседям каждого узла — один conv2d с крестообразным ядром, а шахматное обновление Метрополиса переворачивает половину решётки параллельно. Ниже критической температуры домены растут, пока магнит не упорядочится; выше неё спины остаются неупорядоченными.
notes: 'Единицы: $J = k_B = 1$, поэтому $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$. В пакете бок о бок работают три решётки: при выбранной $T$, при $T_c$ и при $T = 3.5$. Все стартуют со случайных спинов (бесконечная температура) и резко охлаждаются. Обновлять все узлы сразу было бы неверно — соседи переворачивались бы по устаревшим значениям, — но узлы одного цвета шахматной доски касаются только узлов другого цвета, поэтому каждую половину можно обновлять параллельно. Закалка до низкой $T$ может надолго застрять в двух полосообразных доменах — реальная особенность динамики на периодической решётке. На конечной решётке $\lvert m\rvert$ выше $T_c$ не равно точно нулю, а вблизи $T_c$ сильно флуктуирует (критическое замедление). $E/N$ меняется от $-2$ (идеальный порядок) до 0.'
meanings:
- спин $\pm 1$ в строке $i$, столбце $j$ — для пакета из $B$ температур (1 — канал conv2d)
- ядро свёртки, выбирающее четырёх ближайших соседей
- 'повторяющиеся $k, l$ ⇒ суммирование: сумма по соседям, периодические края'
- цена переворота каждого спина по отдельности
- 'повторяющиеся $i, j$ ⇒ суммирование: удвоенная энергия связей (каждая связь видна с обоих концов)'
- по одной температуре на решётку, broadcast по узлам
labels:
  T: Температура $T$
  L: Размер решётки $L$
  n_sweeps: Проходы Монте-Карло
