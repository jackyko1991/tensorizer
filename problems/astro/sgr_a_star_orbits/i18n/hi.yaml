title: 'Sgr A* को तौलना: तारे S2 की कक्षा'
summary: 'तारा S2 हर 16 वर्ष में आकाशगंगा (मिल्की वे) के केंद्र की परिक्रमा करता है और एक अदृश्य द्रव्यमान से 120 AU के भीतर से गुज़रता है। एक केप्लरीय कक्षा, जिसमें केप्लर समीकरण को सदिशीकृत न्यूटन पुनरावृत्तियों से हल किया जाता है, 25 वर्षों की वास्तविक स्थितियों और त्रिज्य वेगों पर फ़िट की जाती है। autograd जैकोबियन के साथ लेवेनबर्ग–मार्क्वार्ट विधि एक साथ 64 यादृच्छिक प्रारंभ-बिंदुओं से चलती है और $R_0 \approx 8.3$ kpc पर लगभग $4.3\times 10^6\,M_\odot$ का ब्लैक होल पुनः प्राप्त करती है। फिर यह फ़िट उन दो सापेक्षिकीय प्रभावों की भविष्यवाणी करता है जिन्हें बाद में GRAVITY ने संसूचित किया: पेरिसेंटर पर लगभग 200 km/s का रेडशिफ़्ट और प्रति कक्षा $12''$ का पुरस्सरण।'
notes: '1990 के दशक की शुरुआत से दो दल, जिनका नेतृत्व राइनहार्ड गेन्ज़ेल (MPE, ESO दूरबीनें) और एंड्रिया गेज़ (UCLA, Keck) करते हैं, आकाशगंगा के केंद्रीय आर्कसेकंड में तारों का अनुसरण कर रहे हैं। छोटी कक्षा वाले तारों में S2 सबसे चमकीला है। इसका 16-वर्षीय दीर्घवृत्त उस आयतन में बंद द्रव्यमान को निर्धारित करता है जो ब्लैक होल के अलावा किसी भी चीज़ के लिए बहुत छोटा है। स्थितियाँ कक्षा का कोणीय आकार और आवर्तकाल देती हैं, और त्रिज्य वेग (स्पेक्ट्रमी रेखाओं के डॉप्लर विस्थापन) km में उसका वास्तविक आकार देते हैं। दोनों मिलकर दूरी $R_0$ और, केप्लर के तीसरे नियम के माध्यम से, द्रव्यमान देते हैं। मॉडल में 8 प्राचल हैं: छह कक्षीय अवयव तथा $M$ और $R_0$ (आवर्तकाल $P^2 = 4\pi^2(aR_0)^3/GM$ से निकलता है)। फ़िट autograd से प्राप्त जैकोबियन के साथ लेवेनबर्ग–मार्क्वार्ट विधि का उपयोग करता है, जो एक साथ कई यादृच्छिक प्रारंभिक कक्षाओं से चलाई जाती है। इनमें से कई स्थानीय निम्निष्ठ में फँस जाती हैं, इसीलिए प्रारंभ-बिंदुओं का एक बैच आवश्यक है, और सबसे अच्छा $\chi^2$ रखा जाता है। केप्लर समीकरण को डिटैच्ड (detached)
  टेंसरों पर न्यूटन पुनरावृत्तियों और अंत में एक लाइव चरण से हल किया जाता है, ताकि autograd सटीक अंतर्निहित (implicit) अवकलज देखे। डिफ़ॉल्ट मानों के साथ परिणाम: $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ kpc, $P \approx 16.03$ वर्ष, $e \approx 0.884$, 334 डेटा बिंदुओं के लिए $\chi^2 \approx 336$। प्रकाशित मान: 17 तारों से $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ और $8.32 \pm 0.07 \pm 0.14$ kpc (Gillessen et al. 2017)। फिर फ़िट दो ऐसे सापेक्षिकीय प्रभावों की भविष्यवाणी करता है जो उसमें शामिल नहीं हैं। पेरिसेंटर (120 AU, 7700 km/s, $c$ का 2.6 %) पर गुरुत्वीय रेडशिफ़्ट और अनुप्रस्थ डॉप्लर विस्थापन मिलकर लगभग 200 km/s जोड़ते हैं; GRAVITY ने मई 2018 के पेरिसेंटर के बाद उस GR मान का $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ गुना मापा (GRAVITY Collaboration 2018)। कक्षा प्रति परिक्रमा $6\pi GM/(c^2a(1-e^2)) \approx 12''$ से पुरस्सरण भी करती है, जिसे GR मान का $f_{SP} = 1.10 \pm 0.19$ गुना मापा गया (GRAVITY Collaboration 2020)। ये उद्धृत
  संसूचन हैं, इस डेटा से गणना किए गए नहीं: 2016 की तालिका 2018 के पेरिसेंटर से पहले समाप्त हो जाती है। सरलीकरण: शुद्ध केप्लर कक्षा, जिसमें रोमर विलंब (कक्षा के आर-पार प्रकाश का यात्रा-समय, लगभग 8 दिन), सापेक्षिकीय पद और संदर्भ फ़्रेम का विचलन नहीं है (शोधपत्र 5 अतिरिक्त फ़्रेम प्राचल फ़िट करता है)। डेटा: Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), VizieR/CDS कैटलॉग J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030) से S2 डेटा की तालिका 5, CDS उपयोग-शर्तों के अंतर्गत उद्धरण सहित प्रयुक्त। पुरस्कार: खगोलविज्ञान में शॉ पुरस्कार 2008 (गेन्ज़ेल), खगोलविज्ञान में क्राफ़ोर्ड पुरस्कार 2012 (गेन्ज़ेल और गेज़) और भौतिकी का नोबेल पुरस्कार 2020 (आधा गेन्ज़ेल और गेज़ को, हमारी आकाशगंगा के केंद्र में एक अतिविशाल सघन पिंड की खोज के लिए)।'
meanings:
- 'हर प्रारंभ-बिंदु के लिए एक कक्षा: $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- न्यूटन पुनरावृत्तियों से उत्केंद्र असंगति (eccentric anomaly), सभी कक्षाओं और युगों के लिए एक साथ
- कक्षीय तल → (उत्तर, पूर्व, दृष्टि-रेखा), einsum से निर्मित
- '$j$ पर योग: AU में S2 की स्थिति; $R_0$ से भाग देने पर आकाश पर mas मिलते हैं'
- 'km/s में दृष्टि-रेखा वेग: यही $R_0$ को निर्धारित करता है'
- 145 RA, 145 Dec और 44 वेगों के लिए (मॉडल − डेटा)/$\sigma$
- फ़ॉरवर्ड-मोड autograd, 8 प्राचल दिशाओं पर vmap किया गया
- हर प्रारंभ-बिंदु के लिए एक साथ लेवेनबर्ग–मार्क्वार्ट का एक चरण
- '$6\pi GM/(c^2a(1-e^2))$: श्वार्ज़शिल्ड पुरस्सरण, S2 के लिए $\approx 12''$'
