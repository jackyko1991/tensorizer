source_hash: 2b849cfef0cb
title: प्लेट पर ऊष्मा विसरण
summary: फ़ूरिए का नियम ताप प्रवणता को ऊष्मा फ्लक्स में बदलता है, और ऊर्जा संरक्षण उस फ्लक्स के अपसरण (divergence) को ताप परिवर्तन में बदलता है। ग्रिड पर दोनों अवकलज छोटे संवलन कर्नेल हैं, इसलिए एक समय चरण पूरी प्लेट पर बस दो conv2d कॉल है।
notes: 'अग्र-फिर-पश्च अंतर मिलकर परिचित 5-बिंदु लाप्लासियन बनाते हैं, इसलिए $\partial_i\partial_i T$ अलग से कोड नहीं किया जाता: यह प्रवणता और अपसरण कर्नेलों को जोड़ने से अपने आप निकलता है। स्पष्ट योजना केवल $\alpha\,dt/dx^2 \le 1/4$ के लिए स्थायी है (नीचे "स्थायित्व संख्या")। डिरिक्ले सीमाओं में किनारे 20 °C का स्नान हैं और ऊष्मा बह जाती है; न्यूमान (ऊष्मारोधी) किनारों पर कोई फ्लक्स सीमा पार नहीं करता और ताप समान होते हुए भी कुल ऊष्मा संरक्षित रहती है। एक साइन विधा $\sin(\pi x/L)\sin(\pi y/L)$ $\exp(-2\pi^2\alpha t/L^2)$ की तरह क्षय होती है।'
meanings:
- हर ग्रिड सेल का ताप (conv2d के लिए बैच और चैनल विमाएँ)
- अग्र-अंतर स्टेंसिल, हर दिशा $i \in \{x, y\}$ के लिए एक निर्गत चैनल
- 'फ़ूरिए का नियम: ऊष्मा फ्लक्स, चैनल $i$ घटक है'
- 'दोहराया गया $i$ ⇒ योग: conv2d अपने 2 निवेश चैनल जोड़ता है — अपसरण'
- ऊष्मीय विसरणशीलता (m²/s)
- 'दायाँ पक्ष; forward Euler: $T \leftarrow T + dt\,\partial_t T$'
labels:
  alpha: विसरणशीलता $\alpha$
  t_max: सिमुलेशन समय
  n_spots: गर्म बिंदु
  n_grid: प्रति भुजा ग्रिड सेल
  r: स्थायित्व संख्या $\alpha\,dt/dx^2$
  boundary: किनारे
