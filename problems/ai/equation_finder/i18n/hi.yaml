source_hash: f8aa40a8b1bc
title: 'समीकरण खोजक: एक टेंसर AI जो अपने डेटा का नियामक समीकरण लिखता है'
summary: इसे फ़ील्ड डेटा दीजिए, और LaTeX में नियम वापस पाइए। उम्मीदवार पदों की एक लाइब्रेरी ($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$) परिमित अंतरों, Savitzky–Golay फ़िल्टरों या दुर्बल रूप (weak form) से बनाई जाती है, और क्रमिक रूप से थ्रेशोल्ड की गई रिज रिग्रेशन (PDE-FIND) केवल वे थोड़े पद रखती है जो $\partial_t u$ की व्याख्या करते हैं। सिम्युलेटेड डेटा से यह Lorenz तंत्र, ऊष्मा समीकरण, श्यान Burgers समीकरण और एक Yee FDTD रन से Maxwell समीकरण पुनः प्राप्त करता है ($c$ 0.2 % तक सटीक, दुर्बल रूप के साथ 0.03 %), और लाइब्रेरी में छिपा $\nabla\cdot\mathbf B = 0$ खोज लेता है; एक शोर अध्ययन दिखाता है कि हर अवकलज अनुमानक कहाँ विफल होता है।
notes: 'विचार। यह Jacky Ka Long Ko का "स्वचालित भौतिकी-समीकरण खोजक" है: एक छोटा टेंसर AI जो फ़ील्ड डेटा को देखता है और उसे नियंत्रित करने वाला समीकरण LaTeX में लिखता है (SINDy / PDE-FIND दृष्टिकोण)। यह MNIST पर ऑपरेटर खोज के बाद आता है, जो इस निष्कर्ष पर समाप्त हुई थी कि "हस्तलिखित अंक का कोई नियामक समीकरण नहीं होता"; यहाँ डेटा नियमों से आता है, इसलिए खोजने को कुछ है। आर्किटेक्चर में तीन मॉड्यूल हैं: (1) शोर हटाने वाला स्मूदर, (2) einsum / परिमित-अंतर अवकलज इंजन, (3) विरल ऑपरेटर रिग्रेशन। यहाँ (2) और (3) पूर्ण हैं और (1) एक Savitzky–Golay स्मूदर है (इसके लिए किसी न्यूरल नेटवर्क की आवश्यकता नहीं)। विधि। हर उम्मीदवार पद फ़ील्डों के एक एकपदी का अवकलज है, $D^\alpha(\prod_g u_g^{p_g})$: Lorenz तंत्र के लिए घात 3 तक के 20 एकपदी, 1D समीकरणों के लिए 13 पद $D^d(u^p)$ ($p, d \le 3$), Maxwell के लिए 17 पद (फ़ील्ड, उनके $x$ और $y$ अवकलज, उनके लाप्लासियन, कुछ गुणनफल)। रैखिक तंत्र $\partial_t u = \Theta\xi$ बनाने के तीन तरीके: केंद्रीय परिमित अंतर (fd); Savitzky–Golay (sg: 7 नमूनों पर एक घन स्मूदर, फिर
  9 पर चतुर्घाती अवकलज फ़िट), दोनों अक्ष-दर-अक्ष 1D कनवल्यूशन; और दुर्बल रूप (weak SINDy, Messenger और Bortz 2021), जहाँ समीकरण को बम्प फलनों $(1-s^2)^{10}$ के विरुद्ध समाकलित किया जाता है और खंडशः समाकलन हर अवकलज को उन पर स्थानांतरित कर देता है, प्रति अक्ष एक टेंसर संकुचन। फिर STRidge (Rudy et al. 2017) इकाई-मानक स्तंभों पर चलता है: रिज, $\tau$ से छोटे हर गुणांक को शून्य करना, पुनः फ़िट, दोहराना; 3 रिज शक्तियों के लिए 41 सहनशीलताओं का स्वीप, और रखा गया मॉडल वह है जिसमें सबसे कम पद हों और जिसकी सत्यापन त्रुटि सर्वश्रेष्ठ के 5 % (+ $10^{-3}$) के भीतर हो। बड़ी रिज शक्ति Maxwell के लिए मायने रखती है: चूँकि $\nabla\cdot\mathbf B = 0$, स्तंभ $\partial_x B_x$ और $\partial_y B_y$ लगभग विपरीत हैं, और कमज़ोर रिज के साथ रिग्रेशन ने $E_z$ समीकरण में $2200\,\nabla\cdot\mathbf B$ जोड़ दिया था। रखे गए पदों पर गुणांकों को न्यूनतम वर्ग से पुनः फ़िट किया जाता है, ± के लिए पंक्तियों पर बूटस्ट्रैप के साथ; वह ± केवल सांख्यिकीय है और इसमें अवकलज अनुमान का पूर्वाग्रह (bias) शामिल नहीं है, इसलिए यह अक्सर वास्तविक
  त्रुटि से बहुत छोटा होता है। वैकल्पिक रिग्रेशन operator_search_mnist का DARTS-शैली रिलैक्सेशन है: $\xi = \sigma(\alpha/T)\,w$ गेट दंड के साथ और तापमान 1 से 0.01 तक एनील किया जाता है। डेटा, सब यहीं सिम्युलेट किया गया: 8 Lorenz प्रक्षेप-पथ (RK4); 10 cm की आवर्ती छड़ पर ऊष्मा समीकरण, Fourier मोड द्वारा सटीक ($D$ = 0.2 cm²/s); $2\pi$ m पर श्यान Burgers, Cole–Hopf रूपांतरण द्वारा सटीक ($\nu$ = 0.1 m²/s); 6.4 cm के आवर्ती बॉक्स में Maxwell, एक Yee FDTD रन से (TM मोड, 0.5 mm सेल, Courant संख्या 0.5), जिसे वैसे नमूनित किया गया जैसे कोई माप करता (सभी फ़ील्ड समान बिंदुओं और समयों पर इंटरपोलेट किए गए)। शोर: गॉसियन, प्रत्येक फ़ील्ड के मानक विचलन का 0, 0.1, 1 और 5 %। परिणाम। परीक्षण जाँचते हैं कि कर्नेल और दुर्बल रूप वहाँ सटीक हैं जहाँ कलन ऐसा कहता है, कि डेटा अपने नियमों का पालन करता है (ऊष्मा कर्नेल, Cole–Hopf, Yee $\nabla\cdot\mathbf B = 0$ को राउंड-ऑफ़ तक बनाए रखता है और अपनी ऊर्जा 0.2 % तक संरक्षित रखता है), कि STRidge एक रोपे गए विरल सदिश को ठीक-ठीक पुनः प्राप्त करता है, कि हर लक्ष्य स्वच्छ डेटा
  से पुनः प्राप्त होता है और कि लिखा गया LaTeX, एक पार्सर द्वारा वापस पढ़े जाने पर, फ़िट किए गए मॉडल को पुनः उत्पन्न करता है। साथ दिया गया रन, स्वच्छ डेटा, परिमित अंतर: Lorenz $\sigma$ = 9.9987, $\rho$ = 27.989, $\beta$ = 2.6662; ऊष्मा $D$ = 0.20023 cm²/s; Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$; Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$ जहाँ $c$ = 29.92 cm/ns (वास्तविक 29.98) और $\partial_t \mathbf B = -\nabla\times\mathbf E$ गुणांक 0.996 के साथ। दुर्बल रूप कहीं अधिक सटीक है (सटीक डेटा पर $10^{-8}$ की त्रुटियाँ; Maxwell पर 0.03 %, जो Yee योजना का अपना संख्यात्मक परिक्षेपण है, खोजक का नहीं)। Maxwell लाइब्रेरी का सबसे छोटा एकल सदिश $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$ है, जिसका एकल मान अगले वाले से 220 गुना कम है: डेटा $\nabla\cdot\mathbf B = 0$ को एक अंतर्निहित नियम के रूप में प्रकट करता है। शोर (क्या सही पद मिले?): परिमित अंतर ऊष्मा और Burgers पर 0.1 % शोर से और Lorenz पर 1 % से विफल होते हैं, और 5 % केवल Maxwell पर सह पाते हैं (25 % गुणांक त्रुटि
  के साथ); Savitzky–Golay हर जगह 0.1 % और केवल Maxwell पर 5 % सह पाता है; दुर्बल रूप ऊष्मा, Burgers और Maxwell के लिए हर स्तर पर सही पद खोजता है (5 % शोर पर गुणांक त्रुटियाँ 7 %, 6 % और 0.1 %) और Lorenz के लिए 1 % तक (5 % पर यह $\dot y$ में दो बहुत छोटे नकली पद जोड़ देता है)। एनील किए गए गेट Burgers और Maxwell पर दुर्बल STRidge के बराबर हैं, पर हर शोर स्तर पर और आज़माए गए हर दंड ($10^{-6}$ से $10^{-3}$) के लिए Lorenz के $\dot y$ का $-y$ पद चूक जाते हैं: $25.5\,x - 0.95\,xz$ उसे सोख लेता है, एक स्थानीय न्यूनतम जिसे रिलैक्सेशन नहीं छोड़ता; वे 5 % पर ऊष्मा पर भी विफल होते हैं। पहले स्नैपशॉट से मिले समीकरणों को पुनः सिम्युलेट करने पर ऊष्मा और Burgers डेटा $3\times 10^{-4}$ तक और Maxwell 3 % तक पुनः उत्पन्न होता है; Lorenz 5 समय इकाइयों के बाद 3 % हट जाता है क्योंकि अराजकता (chaos) 0.01 % की गुणांक त्रुटि को बढ़ा देती है। results/noise_study.csv और results/equations.tex में हर संख्या और समीकरण है; प्रति लक्ष्य एक GIF (Maxwell मुख्य है) और results/summary.png। निष्कर्ष। खोजक स्वच्छ, अच्छी तरह
  नमूनित डेटा से ज्ञात समीकरण रूप पुनः प्राप्त करता है, और दुर्बल रूप के साथ यथार्थवादी शोर सह लेता है; सबसे पहले अवकलज अनुमान टूटता है, रिग्रेशन नहीं। यह केवल वही पद खोजता है जो इसकी लाइब्रेरी में हैं, इसे सही चरों के मापे जाने की आवश्यकता है, और खोजा गया समीकरण एक परिकल्पना है: यह स्वतंत्र सत्यापन के बिना नई भौतिकी (या शरीरक्रिया विज्ञान) की खोज नहीं करता। यह बड़े भाषा मॉडलों का विकल्प भी नहीं है; यह एक अलग कार्य है (डेटा पर नियम फ़िट करना, पाठ उत्पन्न करना नहीं)। संबंधित कार्य। SINDy (Brunton, Proctor और Kutz 2016), PDE-FIND और STRidge (Rudy et al. 2017), weak SINDy (Messenger और Bortz 2021); आनुवंशिक प्रोग्रामिंग द्वारा प्रतीकात्मक रिग्रेशन (Schmidt और Lipson 2009) और AI Feynman (Udrescu और Tegmark 2020); Yee योजना (Yee 1966)। आज़माइए। तेज़ रन के लिए कम बूटस्ट्रैप पुनर्नमूने, यह देखने के लिए अधिक गेट चरण कि क्या रिलैक्सेशन अपने Lorenz न्यूनतम से निकल पाता है (4000 तक नहीं निकला), या एक मोटा Yee ग्रिड।'
meanings:
- 'लाइब्रेरी: स्तंभ $k$ हर आंतरिक ग्रिड बिंदु $n$ पर एक उम्मीदवार पद $D^\alpha(\prod_g u_g^{p_g})$ है, जैसे $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- 'अवकलज इंजन: एक अक्ष के साथ 1D कनवल्यूशन; केंद्रीय अंतर, या घन स्मूदर के बाद Savitzky–Golay ($2m+1$ नमूनों पर घात $p$ का न्यूनतम-वर्ग बहुपद)'
- 'दुर्बल रूप: $x$ और $t$ पर योग; अवकलज चिकने बम्प $\phi(s) = (1-s^2)^{10}$ पर होते हैं, शोरयुक्त डेटा पर कभी नहीं'
- हर समीकरण $f$ के बचे हुए पदों पर एक बैच रिज हल; STRidge $|\hat\xi_k| < \tau$ को शून्य करता है और पुनः फ़िट करता है
- 'सहनशीलता स्वीप: सबसे कम पदों वाला वह मॉडल रखें जिसकी सत्यापन त्रुटि सर्वश्रेष्ठ के 5 % (+ $10^{-3}$) के भीतर हो'
- 'DARTS-शैली विकल्प: $\xi = \sigma(\alpha/T)\, w$ गेट दंड के साथ, तापमान 1 से 0.01 तक एनील'
- 'बूटस्ट्रैप: $B$ पंक्ति पुनर्नमूने बहुपदीय (multinomial) भारों के रूप में, सभी फ़िट एक बैच हल में'
- 'लिखा गया LaTeX, पार्सर द्वारा वापस पढ़ा गया: यह फ़िट किए गए मॉडल को मुद्रित परिशुद्धता तक पुनः उत्पन्न करता है'
labels:
  bootstrap: हर गुणांक के ± के लिए बूटस्ट्रैप पुनर्नमूने
  gate_steps: एनील-गेट खोज के Adam चरण
  maxwell_grid: Maxwell सिमुलेशन का Yee ग्रिड (0.5 mm के $n \times n$ सेल)
