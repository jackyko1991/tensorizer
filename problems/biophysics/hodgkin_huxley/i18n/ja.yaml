title: Hodgkin–Huxley の活動電位
summary: 1952 年のイカ巨大軸索のモデル：膜キャパシタがナトリウムチャネルとカリウムチャネルを通じて放電し、それらのゲート $m$、$h$、$n$ が電圧に応じて開閉する。それぞれ異なるステップ電流で駆動される 41 本の軸索を一つの $(4, B)$ テンソルでまとめて積分し、発火閾値と電流に対する発火頻度を求める。
notes: Hodgkin と Huxley（1963 年ノーベル賞）は電位固定法でイカ巨大軸索のナトリウム電流とカリウム電流を測定し、3 種類のゲートでフィットした。ナトリウム電流は $m^3$ を通じて速く立ち上がり、不活性化ゲート $h$ を通じてよりゆっくりと止まる。カリウム電流は $n^4$ を通じて遅れて開く。スパイクは両者の競争である：小さな脱分極が $m$ を開き、流入する $\mathrm{Na}^+$ がさらに脱分極させ（正のフィードバック）、$V$ は $E_{Na}$ へ向かって跳ね上がる。次に $h$ が閉じて $n$ が開き、$V$ は下がって静止電位より下にアンダーシュートさえする。持続的なステップ電流に対してモデルは三つの領域を示す。約 2.3 µA/cm² 未満では膜は受動的に充電されるだけである。そこから約 6.3 µA/cm² までは 1 発だけスパイクを出して落ち着く。不活性化とカリウム電流が新しい静止状態に保つからである。それを超えると反復発火し、頻度はゼロからではなく約 50 Hz に跳ぶ：イカ軸索はタイプ II（共鳴子型）ニューロンで、その静止状態はホップ分岐で安定性を失う。いくらでもゆっくり発火できるタイプ I ニューロンとは異なる。その後 f–I 曲線は緩やかに上昇し、10 µA/cm² で約 68 Hz になる。速度関数には除去可能な特異点があり、$0.1(V+40)/(1 - e^{-(V+40)/10})$ は $V = -40$ mV で有限なので、コードでは $x/(1 - e^{-x})$ を通じて安全な極限で評価する。元の実験は 6.3 °C で行われた。軸索を温めるとすべてのゲートが $\phi = 3^{(T - 6.3)/10}$ 倍速くなり、スパイクは細く発火は速くなるが、約 30 °C を超えると軸索はまったく発火しなくなる。単純化：空間固定されたパッチ（軸索に沿った伝導なし）と決定論的なチャネル。
meanings:
- 軸索 $b$ の刺激電流、10 ms でオンになるステップ（µA/cm²）
- 各軸索の膜電位とゲート $g = (m, h, n)$
- 各ゲートの開口・閉口速度（1/ms）、イカ軸索の古典的なフィット
- チャネル $k$ = Na、K、リークの開口割合
- 最大コンダクタンス（120、36、0.3 mS/cm²）と反転電位（50、−77、−54.4 mV）
- 全イオン電流；繰り返される $k$ ⇒ チャネルについて和
- 温度係数（$Q_{10} = 3$）：10 °C ごとにすべてのゲートが 3 倍速くなる
- スパイク間隔から求めた定常発火頻度（Hz）
labels:
  I_max: 最大刺激 $I_{max}$
  t_end: シミュレーション時間
  temp: 温度 $T$
