source_hash: 242e43034f00
title: ラマヌジャンの $\tau(n)$ と佐藤–テイト則
summary: 判別式モジュラー形式 $\Delta(q) = q\prod_n (1-q^n)^{24}$ をテンソルのべき級数として展開し、ラマヌジャンの $\tau(n)$ を求めます。素数の組を法とする剰余を通じて、$n \sim 10^5$–$10^6$ まで厳密に計算します。$\tau$ が乗法的で Hecke の漸化式を満たすこと、$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$、$|\tau(p)| \le 2p^{11/2}$（ドリーニュの定理、1974）を確かめ、正規化した値 $\tau(p)/2p^{11/2}$ が佐藤–テイトの半円分布を埋めていく様子を観察します（$\Delta$ については 2011 年以降定理）。プログラムはこれらの定理を数値的に確かめます。
notes: ラマヌジャン（1916）は、重さ 12 の唯一の正規化されたカスプ形式 $\Delta(q) = q\prod(1-q^n)^{24}$ の係数 $\tau(n)$ を研究し、3 つのことを予想しました：$\tau$ が乗法的であること、$\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$ を満たすこと、そして $|\tau(p)| \le 2p^{11/2}$ であること。Mordell は 1917 年に最初の 2 つを証明しました。これは後に Hecke 理論となるものの初期の例です。この上界は $\Delta$ に対するラマヌジャン予想（一般にはラマヌジャン–ピーターソン予想）です：ドリーニュが 1974 年にヴェイユ予想の証明の帰結として証明したので、これは定理です。ラマヌジャンは合同式 $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$ も証明しました。これは $691$ がベルヌーイ数 $B_{12}$ の分子を割り切ることに由来します。$\tau(p) = 2p^{11/2}\cos\theta_p$ と書くと、佐藤–テイト予想は、角度 $\theta_p$ が $\frac{2}{\pi}\sin^2\theta\,d\theta$ に従う、すなわち $x_p = \cos\theta_p$ が半円分布 $\frac{2}{\pi}\sqrt{1-x^2}$ に従うと主張します。そのモーメントは $1/4$、$1/8$、$5/64$（カタラン数を 4 のべきで割ったもの）です。$\Delta$ については Barnet-Lamb、Geraghty、Harris、Taylor（2011）が証明しました。ヒストグラムは、独立な抽出による標本のようにゆっくりと収束します。$\tau(n)$ が決してゼロにならないという Lehmer 予想は今も未解決です。この範囲をはるかに超えて検証されており、プログラムもゼロを見つけません。数値計算について：$\tau(n)$ は $n^{11/2}$ のように増大するので、級数全体の float64 FFT の絶対誤差は最大係数の約 $10^{-16}$ 倍になり、$\tau(2) = -24$ をかき消してしまいます（テストで確認できます）。そこで級数を
  10 個ほどの素数を法として同時に厳密に計算し（素数ごとにテンソルの 1 行）、中国剰余定理で再構成します。おまけ：ラマヌジャンは気づいた……（Ramanujan noticed that…）$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$ であることに。$1729 = 1^3 + 12^3 = 9^3 + 10^3$ であることに。そして、正則化された意味においてのみ、$1 + 2 + 3 + \dots$「$= -1/12$」であることに：この級数は発散し、$-1/12$ は解析接続されたゼータ関数の値 $\zeta(-1)$ です。
meanings:
- ヤコビの恒等式 $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$：非ゼロ係数は $O(\sqrt N)$ 個だけ
- 繰り返された $j$ ⇒ 和をとる：打ち切った級数の積をテプリッツ行列とベクトルの積として計算し、小さい $N$ では int64 で厳密
- 3 回の 2 乗で 24 乗が得られる
- 同じ積を $M$ 個の素数の法に対して FFT で同時に計算し、厳密な剰余に丸める（各 $m^2 N \le 2^{42}$）
- 平衡表現の桁を用いた中国剰余定理。負の値は負のまま復元される
- $mn \le 600$ を満たす互いに素な組 $1 < m < n$ すべてを同時に
- $dj \le N$ を満たす約数の組 $(d, j)$ ごとに、$d^{11}$ を $n = dj$ に加える
- 素数における正規化された値。ドリーニュの定理により $[-1, 1]$ に収まる
labels:
  n_max: 素数と $\tau(n)$ の上限 $N$
