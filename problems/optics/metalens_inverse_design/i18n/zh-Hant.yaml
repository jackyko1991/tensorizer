source_hash: 7c33ee10a4e7
title: 超穎透鏡的逆向設計
summary: 由次波長超穎原子構成的平面超穎表面在光上印刻相位 $\varphi(x)$。光以角譜法（一次 FFT）傳播，autograd 搭配 Adam 從平坦的初始狀態調整每個超穎原子，把盡可能多的功率推進焦點。結果與解析的雙曲面透鏡比較，而同時為兩個波長設計（一個批次）則展現色散上的取捨。
notes: 解析的超穎透鏡使從透鏡到焦點的每條路徑同相，$\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$，並折疊到 $[0, 2\pi)$，因為一個超穎原子最多只能把光延遲一個波長（這類可見光超穎透鏡由 Khorasaninejad et al., Science 2016 展示）。這裡沒有給最佳化器任何公式：它從平坦表面開始，以 FFT 傳播子計算焦點功率 $\eta$，並以一次反向傳播得到對所有超穎原子相位的梯度，這與光子逆向設計中伴隨法給出的資訊相同。對單一波長與單一焦點，最佳相位接近雙曲面相位，最佳化器也重新發現了它（在 $\eta$ 上可能略好一些，因為焦點有有限寬度，且純量傳播子並非完全等同於射線圖像）。有趣的情況是兩個波長：在此玩具模型中，每個超穎原子加入一段固定光程並折疊到一個波長內，所以在 $\lambda_1 \neq \lambda_0$ 時相位按 $\lambda_0/\lambda_1$ 縮放，折疊處不再對齊。雙曲面透鏡於是把紅光聚焦在不同距離（繞射色差）。選擇 'dual' 設計時，兩個波長共享損失，最佳化器找到折衷：在 $\lambda_1$ 較好、在 $\lambda_0$ 較差。簡化：純量一維光、薄元件相位遮罩（每個超穎原子是理想相移器，鄰居之間無耦合）、完全穿透、玩具色散模型與週期邊界。真實的逆向設計會為超穎原子求解馬克士威方程；整個超穎表面相機的可微分模型由 Tseng et al. 端到端訓練（"Neural nano-optics", Nature Communications 2021），Li et al. 回顧了逆向設計的超穎表面（ACS Photonics 2022）。平面透鏡能同時聚焦多寬的頻寬有其基本極限（Presutti & Monticone, Optica 2020）。
meanings:
- 2048 個網格點（$\Delta x = 0.05$ μm）及其 FFT 波數
- 設計變數：每個超穎原子在 $\lambda_0$ 下以波長為單位的相位延遲，每個 0.25 μm 原子一個值
- 波長 $\lambda_l$ 下的相位；$l$ 是兩個波長組成的批次
- 複數：對消逝成分 $|k_x| > k$ 為虛數（衰減）
- 重複的 $x$ ⇒ 求和，以 FFT 在 $O(X\log X)$ 內完成
- 藉由廣播傳遞函數，一次得到每個波長與距離的場
- 重複的 $x$ ⇒ 求和：焦點 $|x| < \lambda_l f / D$ 內的功率
- 對 FFT 做 autograd：免費得到伴隨法
labels:
  design: 為兩個波長設計（dual）或只為 $\lambda_0$
  wavelength: 設計波長 $\lambda_0$
  wavelength2: 第二波長 $\lambda_1$
  focal_length: 焦距 $f$
  diameter: 透鏡直徑 $D$
  n_iter: Adam 迭代次數
  lr: Adam 學習率（每步波長數）
