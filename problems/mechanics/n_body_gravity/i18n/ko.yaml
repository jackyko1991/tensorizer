source_hash: 840ee0536fe3
title: 3차원 N체 중력
summary: $N$개 천체 사이의 뉴턴 중력. 브로드캐스팅으로 모든 쌍의 변위 $r_{abi}$를 한 번에 만들고, einsum 하나로 각 천체 $a$에 작용하는 모든 천체 $b$의 인력을 더하며, 속도 베를레 방법으로 계 전체를 전진시킵니다.
notes: 완화 길이 $\varepsilon$은 두 천체가 아주 가까이 지나갈 때 힘이 유한하도록 합니다. $\varepsilon = 0$이면 정확한 뉴턴 중력입니다. 단위는 $G = 1$이 되도록 정했습니다. 속도 베를레 방법은 심플렉틱하므로 에너지 오차가 표류하지 않고 작게 유한한 범위에 머뭅니다. 8자 궤도는 Moore(1993)와 Chenciner & Montgomery(2000)가 발견한 유명한 주기적 삼체 궤도입니다.
meanings:
- 천체 $a$의 위치, 성분 $i \in \{x, y, z\}$
- 천체 $b$의 질량
- $a$에서 $b$까지의 변위, 브로드캐스팅으로 모든 쌍
- '반복된 $j$ ⇒ 합: 모든 쌍의 거리 제곱'
- '반복된 $b$ ⇒ 합: 천체 $a$에 작용하는 전체 인력'
- 운동 에너지 + 쌍별 퍼텐셜, 보존량
labels:
  scenario: 초기 조건
  t_max: 시뮬레이션 시간
  dt: 시간 간격
  softening: 완화 길이 $\varepsilon$
