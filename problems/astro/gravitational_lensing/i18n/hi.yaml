title: ब्लैक होल द्वारा गुरुत्वीय लेंसिंग
summary: 'ब्लैक होल के पास से गुज़रती प्रकाश किरणें शून्य जियोडेसिक (null geodesics) हैं, जिन्हें संघट्ट प्राचलों (impact parameters) के पूरे पंखे के लिए एक साथ खींचा जाता है: दूर की किरणें $4GM/(c^2 b)$ से मुड़ती हैं, $\sqrt{27}\,GM/c^2$ के भीतर की किरणें अंदर गिर जाती हैं। आकाश पर, लेंस समीकरण एक ही टेंसर संक्रिया में हर पिक्सेल को स्रोत तल पर वापस मैप करता है, इसलिए होल के पीछे से गुज़रता तारा दो चापों, एक आइंस्टाइन वलय और आवर्धन के एक तीव्र शिखर में बदल जाता है।'
notes: 'किरण पैनल: मात्रक $G = c = M = 1$; बिंदुदार वृत्त फ़ोटॉन गोला ($r = 3M$) है, और $b < \sqrt{27}\,M \approx 5.2\,M$ वाली किरणें होल में समाप्त होती हैं, इसीलिए ब्लैक होल अपनी क्षितिज त्रिज्या की 2.6 गुना छाया डालता है। ठीक बाहर की किरणें निकलने से पहले चक्कर लगा सकती हैं। आकाश पैनल: आइंस्टाइन त्रिज्या के मात्रकों में पतला-लेंस बिंदु द्रव्यमान (हमारी आकाशगंगा के किसी तारकीय ब्लैक होल के लिए लगभग एक मिलीआर्कसेकंड, इसीलिए माइक्रोलेंसिंग पृथक प्रतिबिंबों के बजाय चमक बढ़ने के रूप में दिखती है)। लेंसिंग पृष्ठ दीप्ति को संरक्षित रखती है, अतः प्रतिबिंब बस $\beta(\theta)$ पर मूल्यांकित स्रोत है; अतिरिक्त प्रकाश प्रतिबिंबों के खिंचने से आता है। स्रोत का सीमित आकार लगभग पूर्ण संरेखण पर आवर्धन को सीमित करता है, जहाँ बिंदु स्रोत $\mu \to \infty$ देता।'
meanings:
- किरण $b$ के अनुदिश $1/r$, 0 (अनंत) से $du/d\varphi = 1/b$ के साथ शुरू
- शून्य-जियोडेसिक कक्षा समीकरण, सभी किरणों के लिए $\varphi$ में RK4
- निर्गम कोण घटा $\pi$; पकड़े जाने पर NaN
- पिक्सेल $p$ का आकाशीय कोण, $\theta_E$ के मात्रकों में
- दोहराया गया $j$ ⇒ योग
- प्रत्येक पिक्सेल स्रोत तल में कहाँ देखता है
- ब्रॉडकास्टिंग द्वारा हर फ़्रेम $f$ के लिए लेंसित प्रतिबिंब
- 'आवर्धन: कुल फ़्लक्स अनुपात'
