title: प्रक्षेपण दौड़ के बेल परीक्षण
summary: 'एक काल्पनिक परिकल्पना, स्थापित भौतिकी नहीं: दो उलझे हुए कण एक ही साझा अवस्था $\Psi$ हैं, जो $D$ विमाओं में है, और हर मापन एक प्रक्षेपण है जिसके बाद चरण 1 की दौड़ होती है। $\Psi$ पर संयुक्त रूप से, पूरे स्थान में एक ही घटना के रूप में चलाने पर, यह दौड़ ठीक क्वांटम परिणाम $E = -\cos\theta$ और CHSH मान $S = 2\sqrt2$ देती है। हर पक्ष के स्थानीय छिपे निर्देशांकों पर अलग-अलग चलाने पर, यह $S\leq2$ वाला एक स्थानीय छिपे-चर मॉडल है, जिसे खामी-रहित बेल परीक्षण खारिज करते हैं। प्रति परिणाम एक से अधिक छिपी विमा वाली दौड़ त्सिरेल्सन सीमा को तोड़ती है और प्रकाश से तेज़ संकेतन की अनुमति देती है।'
notes: 'प्रक्षेपण परिकल्पना का चरण 5 (श्रृंखला का विवरण देखें), जो लेखक की काल्पनिक परिकल्पना है, स्थापित भौतिकी नहीं। यह चरण 1 (cosmology/projection_postulate) के अभिगृहीत P1 (प्रक्षेपण) और P2 (घटना) को उलझाव पर परखता है। चरण 4 (cosmology/projection_singularity_fold) ज्यामिति है, और चरण 6 (cosmology/projection_telescope_tests) प्रेक्षण। साझा अवस्था की विमा $D$ खुली रहती है: यह एक प्राचल है, और कोई भी परिणाम इस पर निर्भर नहीं करता। पहले ज्ञात भौतिकी। सिंगलेट से $E(a,b) = -a\cdot b = -\cos\theta$ मिलता है। बेल (1964) तथा क्लॉज़र, हॉर्न, शिमोनी और होल्ट (1969) ने किसी भी स्थानीय छिपे-चर मॉडल के लिए $S\leq2$ सिद्ध किया, जबकि क्वांटम यांत्रिकी त्सिरेल्सन सीमा $S = 2\sqrt2$ तक पहुँचती है। परिकल्पना: एक ही साझा $\Psi$ है (P0, P3); हर पक्ष का मापन एक प्रक्षेपण और चरण 1 की दौड़ है, जिसमें सबसे बड़े $\|P_k\Psi\|^2/E_k$ वाला परिणाम घटित होता है, और $E_k$ वह ऊर्जा है जो $m$ छिपे सम्मिश्र निर्देशांकों में है, जो $\Psi$ के हैं। (i) संयुक्त मॉडल: दौड़ चार संयुक्त परिणामों पर एक बार चलती है, भार $\|(P^a_i\otimes
  P^b_j)\Psi\|^2$ के साथ। 3D में अस्थानीय, यह $D$ विमाओं में एक ही घटना है। $m = 1$ के साथ (वह एकमात्र मान जिसे चरण 1 ने जीवित छोड़ा) यह क्वांटम यांत्रिकी को ठीक-ठीक पुनरुत्पादित करती है: $E = -\cos\theta$ बंद रूप में $10^{-15}$ तक, और $\Psi$ से, जो $\mathbb C^D$ में है, एक मोंटे कार्लो सांख्यिकी की सीमा के भीतर। इष्टतम सेटिंग पर $S = 2\sqrt2$, 2000 यादृच्छिक सेटिंग पर अधिकतम मान इससे नीचे रहता है, और ऐलिस के सीमांत बॉब की सेटिंग पर निर्भर नहीं करते (कोई संकेतन नहीं)। (ii) स्थानीय मॉडल: हर पक्ष केवल अपनी छिपी ऊर्जाओं और स्रोत पर निर्धारित एक छिपी दिशा $n$ पर दौड़ चलाता है, अर्थात भार $(1\pm a\cdot n)/2$ पर। यह एक स्थानीय छिपे-चर मॉडल है, इसलिए $S\leq2$ की गारंटी है। $m = 1$ से $E = -\cos\theta/3$ मिलता है (अधिकतम $S\approx0.93$), और $m\to\infty$ बेल का अपना नियतात्मक मॉडल $E = -(1-2\theta/\pi)$ है, जो ठीक $S = 2$ तक पहुँचता है। बॉर्न से आगे: $m\neq1$ वाली संयुक्त दौड़ क्वांटम यांत्रिकी नहीं है। $m > 1$ के लिए यह त्सिरेल्सन सीमा तोड़ती है ($S = 3.85$, जब $m = 3$, और PR-बॉक्स मान 4 की ओर बढ़ते
  हुए)। आंशिक रूप से उलझी अवस्था के लिए यह ऐलिस की सांख्यिकी को बॉब की सेटिंग पर निर्भर बना देती है, जो प्रकाश से तेज़ संकेतन है ($dS/dm = 1.34$, संकेतन $\approx0.18\,|m-1|$)। इसलिए $m = 1$ त्रि-झिरी आँकड़ों के साथ-साथ सापेक्षिकीय कार्य-कारणता द्वारा भी आवश्यक है। आँकड़े (data/bell_tests.csv, सारांशों से उद्धृत संख्याएँ)। Hensen et al. (Nature 526, 682, 2015): 1.3 km दूर NV स्पिन, $S = 2.42\pm0.20$, $p = 0.039$। उनकी दूसरी श्रृंखला (Sci. Rep. 6, 30289, 2016): $S = 2.35\pm0.18$। Giustina et al. और Shalm et al. (Phys. Rev. Lett. 115, 250401 और 250402, 2015): फोटॉन, CH–Eberhard असमिका, $p\leq3.74\times10^{-31}$ और $2.3\times10^{-7}$। Rosenfeld et al. (Phys. Rev. Lett. 119, 010402, 2017): 398 m दूर परमाणु, $S = 2.221\pm0.033$। Storz et al. (Nature 617, 265, 2023): 30 m दूर अतिचालक क्यूबिट, $S = 2.0747\pm0.0033$, 2 से 22.6$\sigma$ ऊपर। निर्णय: मॉडल (ii), और उसके साथ दौड़ का हर स्थानीय संस्करण, खारिज है। मॉडल (i) हर परीक्षण से मेल खाता है, पर केवल इसलिए कि यह दोबारा लिखी गई क्वांटम यांत्रिकी है;
  यह कोई नई भविष्यवाणी नहीं करता। चरण 1 द्वारा अब भी अनुमत विचलन ($|m-1|\leq6\times10^{-3}$) $S$ को अधिकतम $8\times10^{-3}$ खिसकाएगा। यह Storz के $\sigma_S$ से अधिक है, पर मापे गए $S$ मान $2\sqrt2$ से काफ़ी नीचे हैं (दृश्यता 0.73), और एक अज्ञात दृश्यता ऐसे खिसकाव को सोख लेती है। केवल $E(\theta)$ का आकार (अवशेष $\leq1.5\times10^{-3}$) या संकेतन-रहितता का सीधा परीक्षण ($\leq10^{-3}$) इसे देख सकता है। विकिपीडिया: बेल प्रमेय, CHSH असमिका।'
meanings:
- इकाई सदिशों $n$ के अनुदिश स्पिन प्रक्षेपक, पाउली आव्यूहों पर einsum से बनाए गए
- 'हर संयुक्त परिणाम का भार: क्यूबिट सूचकांकों $x, y, u, v$ पर योग किया जाता है'
- सहसंबंध, परिणाम चिह्नों $s = (+1, -1)$ पर योग
- चार परिणामों पर संयुक्त दौड़; $l$ पर योग ($l = k$ को छोड़कर) बाकी परिणामों पर गुणनफल है; $m = 1$ से $P = w$ मिलता है
- छिपे खंडों की ऊर्जाएँ, $\Psi$ के नमूनों से पढ़ी गईं, जो $\mathbb C^D$ के गोले पर एकसमान हैं
- 'स्रोत पर निर्धारित छिपी दिशा, $\Psi$ के तीन वास्तविक निर्देशांक: $S^2$ पर एकसमान, किसी भी $D$ के लिए'
- 'स्थानीय दौड़ें: हर पक्ष अपने भार $(1\pm a\cdot n)/2$ पर दौड़ चलाता है; साझा $\nu$ पर औसत लिया जाता है'
- CHSH मान, इस पर अधिकतम किया गया कि चार पदों में से कौन ऋण चिह्न रखता है
labels:
  D: कुल विमा $D$, साझा अवस्था $\Psi$ की (खुली)
  m_max: प्रति परिणाम छिपी विमाओं की सबसे बड़ी संख्या $m$
  settings: यादृच्छिक मापन सेटिंग
  trials: प्रति कोण दौड़ घटनाएँ (मोंटे कार्लो)
