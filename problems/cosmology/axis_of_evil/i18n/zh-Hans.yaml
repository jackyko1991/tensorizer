source_hash: 9e147d6c0987
title: 微波天空中的“邪恶轴”
summary: 真实 WMAP 宇宙微波背景地图上最大的两个图样，四极矩（$\ell = 2$）和八极矩（$\ell = 3$），似乎指向同一方向。它们的系数 $a_{\ell m}$ 来自一次最小二乘拟合；每个多极矩的轴是 $3\times 3$ 角动量离散矩阵 $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$ 的最大特征向量，再用一批 $10^5$ 个各向同性的随机天空，把两轴的夹角换算成 $p$ 值。这是真实存在但仍有争议的异常：巧合、前景残留，还是新物理。
notes: 在统计上各向同性的宇宙中（暴胀的标准预言），不同多极矩的方向相互独立，所以四极矩与八极矩两轴的夹角应当是随机的：$|\cos|$ 在 $[0, 1]$ 上均匀分布。Tegmark、de Oliveira-Costa 与 Hamilton（2003）以及 de Oliveira-Costa 等人（2004）在最早的 WMAP 地图中发现两者都指向 $(l, b) \approx (-110^\circ, 60^\circ)$，Land 与 Magueijo（2005）称之为“邪恶轴”；Copi、Huterer、Schwarz 与 Starkman 用多极矢量研究了它，并发现它与黄道还有其他关联。在附带的 WMAP 九年 ILC 地图上，两轴位于 $(l, b) \approx (240^\circ, 60^\circ)$ 和 $(238^\circ, 63^\circ)$，仅相差 $3^\circ$，而每 1000 个各向同性天空中不到 2 个对齐得更好（$p \approx 0.0015$；对这个统计量恰好有 $p = 1 - |\cos|$，蒙特卡洛结果也证实了这一点）。右图检验模拟：至少对齐到 $x$ 的随机天空比例沿直线 $P = x$。现状：数据中确实存在这种对齐（Planck 2013、2015 和 2018 的各向同性论文在所有地图中都看到了它），但其显著性仍有争议。这个统计量是在注意到图样之后才选定的（事后选择，即“别处寻找”效应：在众多可能的异常中，总有一些看起来罕见）；四极矩功率偏低、ILC 中残留的银河前景、运动学多普勒四极矩（此处未扣除）以及地图的选择，都会让 $p$ 改变数倍。目前没有公认的物理解释；提出的可能包括非平凡拓扑、各向异性膨胀或局部前景，而多数宇宙学家视之为统计涨落。本页只报告单一统计量的 $p$，并不宣称任何探测。数据：WMAP 九年 ILC 地图（Bennett et al. 2013, ApJS 208, 20），NASA LAMBDA 档案库的 wmap_ilc_9yr_v5.fits（lambda.gsfc.nasa.gov；NASA 数据，公有领域），在此由 HEALPix $N_\mathrm{side} = 512$ 降分辨率至 16（列 glon_deg、glat_deg、T_uK）。任何同样是 lon/lat/T
  CSV 格式的地图（例如 Planck 地图）都可以替换它。拟合在全天、不加掩模的情况下使用直到 $\ell_\mathrm{fit}$ 的所有多极矩；各向同性天空使用单位高斯实系数（功率 $C_\ell$ 在轴中相消）。
meanings:
- 像素方向、温度和立体角，可来自任何 lon/lat/T CSV
- 每个像素上的实球谐函数；$a$ 遍历所有 $(\ell, m)$
- 加权最小二乘：一次拟合所有多极矩，彼此之间没有混叠
- 复系数，满足 $a_{\ell,-m} = (-1)^m a^*_{\ell m}$
- 自旋 $\ell$ 矩阵，$[L_x, L_y] = iL_z$，$L_iL_i = \ell(\ell+1)$
- 对 $m, n, k$ 求和：在 $z \parallel \hat n$ 的坐标系中 $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$
- 批量 eigh：多极矩最“扁平”所环绕的轴
- 对 $i$ 求和：天空 $s$ 中两轴的对齐程度（轴没有正反方向）
- 相对于各向同性高斯天空的蒙特卡洛 $p$ 值
labels:
  n_skies: 各向同性随机天空数 $K$
  lmax_fit: 一起拟合的多极矩 $\ell_\mathrm{fit}$
  seed: 随机种子
