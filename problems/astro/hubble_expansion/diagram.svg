<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Hubble expansion: galaxies on a comoving grid that is stretched by the scale factor a; an observer sees each galaxy at distance d receding with velocity v">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- comoving grid -->
    <g stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3">
      <line x1="30" y1="35" x2="210" y2="35"/><line x1="30" y1="80" x2="210" y2="80"/><line x1="30" y1="125" x2="210" y2="125"/>
      <line x1="45" y1="20" x2="45" y2="140"/><line x1="120" y1="20" x2="120" y2="140"/><line x1="195" y1="20" x2="195" y2="140"/>
    </g>
    <!-- galaxies at the grid nodes -->
    <g fill="#93c5fd" stroke="#1e40af" stroke-width="1.2">
      <ellipse cx="45" cy="35" rx="6" ry="3.5"/><ellipse cx="120" cy="35" rx="6" ry="3.5"/><ellipse cx="195" cy="35" rx="6" ry="3.5"/>
      <ellipse cx="45" cy="80" rx="6" ry="3.5"/><ellipse cx="195" cy="80" rx="6" ry="3.5"/>
      <ellipse cx="45" cy="125" rx="6" ry="3.5"/><ellipse cx="120" cy="125" rx="6" ry="3.5"/><ellipse cx="195" cy="125" rx="6" ry="3.5"/>
    </g>
    <!-- observer galaxy -->
    <circle cx="120" cy="80" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- distance to a neighbour -->
    <line x1="128" y1="92" x2="195" y2="92" stroke="#374151" stroke-width="1.5"/>
    <text x="152" y="108" font-style="italic">d</text>
    <!-- recession velocities, longer for farther galaxies -->
    <line x1="203" y1="80" x2="230" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="214" y="72" font-style="italic" fill="#b91c1c">v</text>
    <line x1="37" y1="80" x2="12" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="201" y1="31" x2="226" y2="17" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="120" y1="29" x2="120" y2="10" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- scale factor -->
    <text x="62" y="62" font-style="italic" fill="#b45309">a(t)</text>
  </g>
</svg>
