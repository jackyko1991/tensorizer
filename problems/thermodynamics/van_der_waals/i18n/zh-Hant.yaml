source_hash: db1c9922ad65
title: 凡得瓦氣體與馬克士威構造
summary: 凡得瓦方程式在理想氣體中加入分子間吸引力與分子大小，液–氣相變便突然出現。整族等溫線是一次 $(T, V)$ 廣播；低於臨界溫度時，非物理的迴圈被馬克士威等面積線取代，其壓力以二分法一次對一批溫度求得。
notes: $a$ 衡量分子間的吸引力（降低壓力），$b$ 是一莫耳分子佔據的體積（$V$ 不能低於 $nb$）。低於 $T_c$ 時，等溫線有一段壓縮氣體反而會降低壓力——力學上不穩定。實際上氣體在恆定壓力 $p^*$（蒸氣壓）下凝結：莫耳體積 $V_l$ 的液體與體積 $V_g$ 的氣體共存。馬克士威法則要求直線上方與下方面積相等來決定 $p^*$（等價於兩相的吉布斯自由能相等）。虛線圓頂連接所有 $(V_l, p^*)$ 與 $(V_g, p^*)$；其頂端是臨界點，液體與氣體在此變得完全相同。座標軸以臨界值縮放，在此之下所有凡得瓦氣體看起來都一樣（對應態定律）；體積軸為線性，以便目視比較陰影面積。凡得瓦模型對真實流體只具定性意義：例如其 $V_c = 3nb$ 高估了真實的臨界體積。
meanings:
- 掃描的溫度，排成行向量
- 體積網格，排成列向量
- 以廣播一次求出每條等溫線
- 對一批溫度求三次方程式 $p(V) = p^*$ 的根
- 曲線與直線間的有號面積：在答案處為零
- 二分法：torch.where 一次移動每個區間
labels:
  gas: 氣體
  n: 氣體量
  T_high: 起始溫度
  T_low: 結束溫度
  n_temps: 溫度數（影格數）
