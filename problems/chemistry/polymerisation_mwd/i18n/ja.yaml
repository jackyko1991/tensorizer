source_hash: 15137dcd8bb9
title: 重合反応速度論と分子量分布
summary: なぜ逐次重合ポリマー（ポリエステル、ナイロン）は多分散で、リビング重合はほぼ均一な鎖を作るのか？鎖長についての個数収支を、両方の機構に共通の一つの $(S, L)$ テンソルで解き、Carothers の $X_n = 1/(1-p)$ と Flory の最確分布 $w(x) = x(1-p)^2p^{x-1}$（分散度 $Đ \to 2$）を再現し、モノマー 100 000 個の動的モンテカルロと照合する。リビング鎖のポアソン分布 $Đ \approx 1 + 1/X_n$ も再現する。
notes: 逐次重合：各分子は反応性末端（ここではヒドロキシ酸のように A 一つと B 一つ）をもち、任意の二本の鎖が結合できる。モノマーとモノマー、二量体と 50 量体も結合する。Flory の等反応性仮定（速度は鎖長によらない）により、個数収支は定数カーネルのスモルコフスキー凝集方程式となり、その厳密解が最確分布である：末端の割合 $p$ が反応しているので、長さ $x$ の鎖は $x - 1$ 個の反応済み結合が並び、最後に未反応の末端で終わるもので、確率は $(1-p)p^{x-1}$ である。その平均は Carothers の $X_n = 1/(1-p)$ と $X_w = (1+p)/(1-p)$ なので $Đ = 1 + p \to 2$。実用上の教訓は厳しい：転化率 98 % でも $X_n = 50$ にしかならず、長い鎖には $p > 0.99$ と反応基の完全な 1:1 の釣り合いが必要である。リビング連鎖重合（アニオン重合、あるいはそれを近似する ATRP や RAFT などの制御ラジカル重合）は正反対である：すべての鎖が一斉に開始し、停止せずにモノマーを一つずつ付け加えて成長するので、鎖あたり $\nu$ 回の付加の後、鎖長はポアソン分布になり、$Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ は 1 に向かって下がる。テンソル形式では両方の機構を一つの $(S, L)$ テンソルに収め、RK4 で進める。逐次重合の畳み込み $\sum_y P_y P_{x-y}$ は、$P$ から集めたテプリッツ行列との einsum である（FFT なら同じことを $O(L\log L)$ で行える）。二つの行は $X_n = 1 + s$ となる時計を使うので、各フレームは二つの機構を同じ $X_n$ で比較する。横軸 $x / X_n$ では Flory の形は固定され、ポアソンのピークは細くなる。動的モンテカルロはランダムな鎖の対を結合させる。個数収支とはサンプリングノイズの範囲で一致するが、終盤では $N_0(1-p)$ 本の鎖しか残らない（$p = 0.98$ で 2000 本）ためノイズが大きくなる。単純化：環形成なし、副反応なし、A–B の化学量論は完全に釣り合い、鎖長は $L$ で打ち切る（省いた裾は
  $10^{-6}$ 未満）、リビング重合では瞬時開始で停止も連鎖移動もない。停止を伴う通常のフリーラジカル重合はその中間にある（$Đ \approx 1.5$–2）。
meanings:
- 機構 $s$ における長さ $x$（$x = 1 … L$）の鎖：0 = 逐次重合（モノマーあたり）、1 = リビング（開始剤あたり）
- 両方の行に共通の時計：逐次重合では $\tau = kN_0t$、リビング成長では $\nu = \int k_p[M]\,dt$
- 個数分布から集めたテプリッツ行列；$x - y < 1$ ではゼロ
- $y$ の繰り返し ⇒ 和：$y$ 量体と $(x-y)$ 量体を結合させるすべての組み合わせ
- 鎖は二つの末端のどちらかを通じて $N$ 本のどの鎖とも反応する
- リビング鎖はモノマーを一つずつ付加するだけで、決して停止しない
- $x$ について和：$k = 0, 1, 2$ のモーメントから $X_n = \mu_1/\mu_0$、$X_w = \mu_2/\mu_1$
- 逐次重合の厳密解：転化率 $p = \tau/(1+\tau)$ における初期モノマーあたりの鎖数
- リビング成長の厳密解、階乗には lgamma を使う
- ランダムな二本の鎖を一結合ずつ結合させる：独立な確率的チェック
labels:
  p_max: 最終転化率 $p$（逐次重合）
  n_monomers: モンテカルロのモノマー数 $N_0$
