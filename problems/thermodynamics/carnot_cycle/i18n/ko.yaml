source_hash: 539b278aa207
title: 이상 기체의 카르노 순환
summary: 이상 기체의 등온 과정 두 개와 단열 과정 두 개를 $(V, p)$ 점들의 텐서로 표본화합니다. 일은 $p$–$V$ 도표에서 둘러싸인 넓이로 torch.trapezoid로 계산하며, 효율 $W/Q_h$는 카르노 한계 $1 - T_c/T_h$와 정확히 일치합니다.
notes: 열은 등온 과정에서만 경계를 지납니다. $Q_h = nRT_h\ln(V_2/V_1)$가 들어오고 $Q_c = nRT_c\ln(V_3/V_4)$가 나갑니다. 단열 과정이 부피비를 연결하므로 $V_3/V_4 = V_2/V_1$이며, 그래서 효율은 두 온도에만 의존합니다. 압축 구간은 $V$가 작아지는 방향으로 진행하므로 torch.trapezoid가 자동으로 음의 일을 줍니다. $T$–$S$ 도표에서 순환은 직사각형이고 그 넓이도 $W$입니다. 부피는 $V_1 = 1$ 리터에서 시작합니다.
meanings:
- 순환의 구간 $l$ 위의 표본 $k$ ($l$ = 고온 등온, 단열, 저온 등온, 단열)
- 등온 과정, 부피 텐서에 원소별로
- 순환의 꼭짓점을 지나는 단열 과정
- '반복된 $k$ ⇒ 합: 각 구간의 일'
- '구간 $l$에 대한 합: 둘러싸인 넓이'
- $T$–$S$ 도표를 위한 경로를 따른 엔트로피
labels:
  T_h: 고온 열원 $T_h$
  T_c: 저온 열원 $T_c$
  ratio: 팽창비 $V_2/V_1$
  n: 기체의 양
  gas: 기체
