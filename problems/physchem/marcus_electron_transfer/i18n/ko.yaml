source_hash: d134f88d426a
title: 전자 전달의 마커스 이론과 역전 영역
summary: 전자는 주변 용매가 우연히 두 상태의 에너지가 같아지는 배치, 즉 두 포물선의 교점으로 요동할 때에만 주개에서 받개로 뛴다. 이로부터 마커스 속도 $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$가 나오며, 여기서는 재배치 에너지, 온도, 구동력의 브로드캐스트 격자 하나에서 계산한다. 속도는 $-\Delta G^\circ = \lambda$일 때 가장 빠르고, 직관과 달리 더 내리막인 반응에서는 다시 느려진다. 교점에서 란다우–제너 도약을 하는 용매 좌표의 랑주뱅 시뮬레이션이 이 곡선을 재현한다.
notes: '단위: eV, K, ps. 용매 좌표 $x$는 전달되는 전하가 느끼는 집단적 분극으로, 반응물 우물이 0, 생성물 우물이 1에 놓이도록 스케일한다. $\lambda$는 전하가 아직 주개에 있는 동안 용매를 생성물에 맞게 분극시키는 데 드는 에너지이다. 마커스는 1956년 이차 장벽을 유도했고(J. Chem. Phys. 24, 966) 역전 영역을 예측했는데, 이는 1980년대에야 실험으로 확인되었다. 역전 영역($-\Delta G^\circ > \lambda$)에서는 생성물 포물선이 반응물 포물선의 먼 쪽에서 교차하므로 구동력이 커질수록 교점이 높아진다. 속도 공식은 고전적 용매를 쓴 페르미 황금률(비단열, 작은 $H_{AB}$)이다. 실제 역전 영역의 속도는 고주파 분자 진동이 양자 통로를 열기 때문에 더 천천히 줄어든다(마커스–레비치–요르트너 확장). 시뮬레이션은 의도적으로 단순한 그림이다. 진동수 $\omega$와 마찰 $\gamma$를 갖는 하나의 고전적 용매 좌표가 한 번에 하나의 비단열(diabatic) 포물선 위에서 움직이다가, 교점에서 란다우–제너 확률 $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$로 전환하며, 이는 곧고 빠른 통과를 가정한다. 열적 통과 흐름에 대해 합하면 $P_{\mathrm{LZ}} \ll 1$일 때 황금률 속도를 되찾으며, 그래서 점들이 곡선 위에 놓인다. $H_{AB}$가 크면 도약이 포화되고(단열 전달) 마찰이 중요해지기 시작한다. 도약한 궤적은 생성물 표면 위에서 계속 진행하며 되돌아 도약할 수도 있다. $T$를 낮추거나(곡선이 좁아짐), $H_{AB}$를 높이거나(시뮬레이션이 공식보다 아래로 내려감), $\lambda$를 바꿔 보자.'
meanings:
- 속도 격자의 세 축
- 브로드캐스팅으로 모든 조합을 한꺼번에 만듦; 합산하는 첨자 없음
- 포물선의 교점; $x^* < 0$이면 역전 영역
- 반응물 최소점으로부터 교점의 높이
- 시뮬레이션 구동력 $d$에서의 궤적 $n$, 볼츠만 통계로 반응물 우물에서 시작
- 반응물 표면에서 0, 생성물 표면에서 1; 용매가 끌려가는 최소점을 정함
- 모든 궤적에 대해 함께 반 킥, 반 이동, 마찰 + 잡음, 반 이동, 반 킥
- 한 단계가 $x^*$를 지날 때마다 이 확률로 표면을 전환
- 반응물 표면에서 보낸 단위 시간당 정방향 도약 수; 오차 막대 $\sqrt{\text{hops}}/t$
labels:
  lam: 재배치 에너지 $\lambda$
  T: 온도 $T$
  H_ab: 전자 결합 $H_{AB}$
  omega: 용매 진동수 $\omega$
  friction: 용매 마찰 $\gamma$
  steps: 시간 단계 수
