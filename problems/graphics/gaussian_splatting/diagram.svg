<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Gaussian splatting: cameras around a cluster of 3D Gaussian ellipsoids with covariance Sigma; each Gaussian is projected by J W onto a camera's image plane as a 2D ellipse with covariance Sigma prime">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- viewing rays from the left camera -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="30" y1="86" x2="124" y2="84"/>
      <line x1="30" y1="86" x2="150" y2="104"/>
      <line x1="30" y1="86" x2="146" y2="64"/>
      <line x1="205" y1="30" x2="146" y2="64"/>
      <line x1="208" y1="134" x2="150" y2="104"/>
    </g>
    <!-- the Gaussians (ellipsoids) -->
    <ellipse cx="124" cy="84" rx="28" ry="12" transform="rotate(-25 124 84)" fill="#93c5fd" fill-opacity="0.85" stroke="#1e40af" stroke-width="1.5"/>
    <ellipse cx="150" cy="104" rx="20" ry="9" transform="rotate(35 150 104)" fill="#2563eb" fill-opacity="0.75" stroke="#1e40af" stroke-width="1.5"/>
    <ellipse cx="146" cy="64" rx="15" ry="7" transform="rotate(10 146 64)" fill="#2563eb" fill-opacity="0.5" stroke="#1e40af" stroke-width="1.5"/>
    <text x="104" y="62" font-style="italic">Σ</text>
    <!-- left camera with its image plane and a projected splat -->
    <rect x="12" y="78" width="16" height="16" rx="2" fill="#374151"/>
    <path d="M28,86 L54,70 M28,86 L54,102" fill="none" stroke="#374151" stroke-width="1.5"/>
    <line x1="54" y1="68" x2="54" y2="104" stroke="#374151" stroke-width="2"/>
    <ellipse cx="54" cy="85" rx="3" ry="8" fill="#f59e0b" fill-opacity="0.8" stroke="#b45309" stroke-width="1"/>
    <text x="40" y="62" font-style="italic" fill="#b45309">Σ′</text>
    <!-- projection J W (red arrow from the 3D Gaussian to its splat) -->
    <path d="M100,92 Q80,104 60,92" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="122" font-style="italic" fill="#b91c1c">J W</text>
    <!-- two more cameras -->
    <g transform="rotate(150 205 30)">
      <rect x="189" y="22" width="16" height="16" rx="2" fill="#374151"/>
      <path d="M205,30 L225,18 M205,30 L225,42 M225,16 L225,44" fill="none" stroke="#374151" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-150 208 134)">
      <rect x="192" y="126" width="16" height="16" rx="2" fill="#374151"/>
      <path d="M208,134 L228,122 M208,134 L228,146 M228,120 L228,148" fill="none" stroke="#374151" stroke-width="1.5"/>
    </g>
  </g>
</svg>
