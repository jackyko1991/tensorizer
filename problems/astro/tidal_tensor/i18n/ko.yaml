source_hash: c221614fc472
title: 블랙홀 근처의 스파게티화
summary: 입자들로 이루어진 고리가 항성 질량 블랙홀을 향해 떨어집니다. 고리를 가로지르는 중력의 차이가 조석 텐서 $T_{ij} = -\partial_i\partial_j\Phi$이며, 공식으로도 autograd 헤세 행렬로도 계산합니다. 조석 텐서는 고리를 지름 방향으로 늘이고($+2GM/r^3$) 가로 방향으로 압축합니다($-GM/r^3$ 두 개). 이것이 스파게티화로, 조석 반지름 안에서 실제 물체를 찢어 놓습니다.
notes: '단위: $G = c = 1$, 길이는 $GM/c^2$ 단위이므로 사건의 지평선은 $r_s = 2$에 있습니다(태양 질량 10배 블랙홀의 경우 30 km). 고리 입자들은 서로 끌어당기지 않습니다. 파란 점은 정확한 뉴턴 중력을, 빨간 곡선은 선형 법칙 $\ddot\xi_i = T_{ij}\xi_j$를 따르며, 고리가 $r$에 비해 작지 않게 될 때까지 둘은 일치합니다. 주황색 원은 고리 크기와 질량 $m$을 갖고 자체 중력으로 뭉쳐 있는 물체가 찢어지는 위치를 표시합니다. 항성 질량 블랙홀에서는 이 반지름이 사건의 지평선보다 훨씬 바깥에 있으므로, 떨어지는 별(또는 우주 비행사)은 지평선을 넘기 전에 갈가리 찢깁니다. 초대질량 블랙홀에서는 지평선 안쪽에 있을 수 있습니다. 여기서 중력은 뉴턴 중력이지만, 놀랍게도 일반 상대성 이론에서 지름 방향으로 떨어지는 관측자의 조석 텐서는 정확히 같은 고윳값 $(2, -1, -1)\,GM/r^3$를 가집니다. 계산은 지평선에 닿기 전에 멈춥니다.'
meanings:
- 고리 중심의 위치 (블랙홀은 원점)
- 고리 입자 $b$의 중심으로부터의 변위
- 외적, 합하는 지표 없음
- 공식으로 구한 조석 텐서
- autograd 헤세 행렬로 구한 같은 텐서
- '반복된 $j$ ⇒ 합: 선형 조석 가속도'
- 진공에서 $= -\nabla^2\Phi = 0$
- 자체 중력으로 뭉친 물체의 조석(로슈) 반지름
labels:
  r0: 처음 거리
  r_stop: 낙하를 멈출 거리
  ring_radius: 고리 반지름
  n_particles: 고리 입자 수
  mass_ratio: $r_t$를 위한 물체 질량 $m/M$
  n_steps: RK4 단계 수
