source_hash: bb811720bfea
title: 有空氣阻力的拋體
summary: 受二次方空氣阻力的球的牛頓第二定律。把多個發射角疊成一個批次張量同時求解，因此一次 einsum 就處理了所有軌跡。
notes: 批次指標 $b$ 不是物理：它是讓 PyTorch 一次求解 $B$ 個拋體的張量技巧。把阻力設為零，就回到課本上的拋物線，最大射程出現在 45°。
meanings:
- 球 $b$ 的位置，分量 $i \in \{x, z\}$
- 球 $b$ 的速度
- 重力向量 $(0, -9.81)$
- 重複的 $j$ ⇒ 求和：每顆球速率的平方
- 常微分方程式的右端項
labels:
  v0: 發射速率
  drag: 阻力 $c/m$
  n_angles: 發射角數
  t_max: 模擬時間
