<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Decay chain: parent decays with constant lambda 1 into a daughter, which decays with lambda 2 into a stable end product">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- parent -->
    <circle cx="40" cy="80" r="22" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="30" y="85" fill="#ffffff" font-style="italic">N</text><text x="41" y="89" font-size="10" fill="#ffffff">1</text>
    <!-- daughter -->
    <circle cx="120" cy="80" r="22" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="110" y="85" font-style="italic">N</text><text x="121" y="89" font-size="10">2</text>
    <!-- stable end -->
    <circle cx="200" cy="80" r="22" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="190" y="85" font-style="italic">N</text><text x="201" y="89" font-size="10">3</text>
    <text x="182" y="124" font-size="12" fill="#374151">stable</text>
    <!-- decays -->
    <line x1="64" y1="80" x2="96" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="144" y1="80" x2="176" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="66" font-style="italic" fill="#b91c1c">λ</text><text x="78" y="70" font-size="10" fill="#b91c1c">1</text>
    <text x="150" y="66" font-style="italic" fill="#b91c1c">λ</text><text x="158" y="70" font-size="10" fill="#b91c1c">2</text>
    <!-- time arrow -->
    <line x1="30" y1="140" x2="210" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="214" y="144" font-style="italic" fill="#6b7280">t</text>
  </g>
</svg>
