<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A point force f pushes an elastic solid with constants lambda and mu; a fast P wave front of speed c_P runs ahead of a slower S wave front of speed c_S">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- solid block -->
    <rect x="14" y="10" width="212" height="140" fill="#93c5fd" fill-opacity="0.25" stroke="#374151" stroke-width="2"/>
    <!-- P front: lobes along the force -->
    <circle cx="120" cy="80" r="62" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M178,58 A62,62 0 0 1 178,102 M62,58 A62,62 0 0 0 62,102" fill="none" stroke="#2563eb" stroke-width="4"/>
    <!-- S front: lobes across the force -->
    <circle cx="120" cy="80" r="32" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M104,52 A32,32 0 0 1 136,52 M104,108 A32,32 0 0 0 136,108" fill="none" stroke="#1e40af" stroke-width="4"/>
    <!-- source -->
    <line x1="106" y1="80" x2="138" y2="80" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
    <circle cx="120" cy="80" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <text x="114" y="98" font-style="italic" fill="#b91c1c">f</text>
    <text x="186" y="40" font-style="italic" fill="#1e40af">c<tspan font-size="10" dy="3" font-style="normal">P</tspan></text>
    <text x="142" y="56" font-style="italic" fill="#1e3a8a">c<tspan font-size="10" dy="3" font-style="normal">S</tspan></text>
    <text x="24" y="30" font-style="italic">λ, μ, ρ</text>
  </g>
</svg>
