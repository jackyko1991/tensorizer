title: रूलर और परकार से गाउस का 17-भुज
summary: '1796 में, अपने 19वें जन्मदिन से एक महीना पहले, गाउस ने पाया कि सम 17-भुज रूलर और परकार से बनाया जा सकता है: यूनानियों के बाद पहला नया रचनीय बहुभुज। इकाई के 17वें मूल, गाउस आवर्तों में समूहित होकर, द्विघात समीकरणों की एक शृंखला हल करते हैं। यह शृंखला $\cos(2\pi/17)$ को केवल वर्गमूलों से लिखती है। फिर Richmond की 1893 की रचना बहुभुज को कदम-दर-कदम बनाती है, और रेखाओं व वृत्तों के प्रतिच्छेद टेंसर संक्रियाओं के रूप में लिखे गए हैं। एक ग्रिड दिखाता है कि कौन-से $n$-भुज रचनीय हैं (गाउस–वांत्ज़ेल प्रमेय)। यहाँ सब कुछ सिद्ध शास्त्रीय गणित है।'
notes: 'गाउस ने 30 मार्च 1796 को, अपने 19वें जन्मदिन से कुछ पहले, 17-भुज खोजा, और कहा जाता है कि इसी कारण उन्होंने भाषाशास्त्र के बजाय गणित चुना। उन्होंने यह सिद्धांत Disquisitiones Arithmeticae (1801) के अंतिम खंड में प्रकाशित किया। विचार यह है: 3 एक आद्य मूल है, इसलिए 16 अतुच्छ मूल $\zeta^k$ $k \mapsto 3k \bmod 17$ द्वारा चक्रीय रूप से क्रमचयित होते हैं। इस चक्रीय क्रम में हर दूसरे मूल को जोड़ने से 8 पदों के दो आवर्त मिलते हैं, जिनके लिए $\eta_0 + \eta_1 = -1$ और $\eta_0\eta_1 = -4$, इसलिए $\eta_{0,1} = (-1 \pm \sqrt{17})/2$। फिर आधा करने पर 4, 2 और 1 पद के आवर्त मिलते हैं। हर जोड़ी एक द्विघात समीकरण के दो मूल है जिसके गुणांक ऊपर वाले स्तर के आवर्त हैं, क्योंकि उपसमूहों की कोटि $16 \to 8 \to 4 \to 2 \to 1$ है, सब 2 की घातें। 2 पदों वाले आवर्त $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$ हैं, इसलिए चार वर्गमूल गाउस का सूत्र देते हैं। प्रोग्राम हर द्विघात संबंध को सटीक पूर्णांक गुणांकों से जाँचता है, हर आवर्त को केवल वर्गमूलों से फिर बनाता है, और बंद सूत्र की तुलना `torch.cos` से करता है (और
  sympy स्थापित हो तो 60 अंकों तक भी)। कोई भी आद्य मूल (3, 5, 6, 7, 10, 11, 12, 14) अलग क्रम में वही वृक्ष देता है। वर्गमूल रूलर और परकार की संक्रिया है, इसलिए बहुभुज रचनीय है। H. W. Richmond (1893) ने इकाई वृत्त पर एक छोटी विधि दी। ऊर्ध्वाधर त्रिज्या पर $OJ = OB/4$ लें। व्यास पर $E$ ऐसे रखें कि $\angle OJE = \tfrac14\angle OJP_0$ (कोण को दो बार समद्विभाजित करके), और $F$ ऐसे कि $\angle EJF = 45°$। व्यास $FP_0$ पर बना वृत्त $OB$ को $K$ पर काटता है। $E$ केंद्र वाला और $K$ से होकर जाने वाला वृत्त व्यास को $N_3 = \cos(6\pi/17)$ और $N_5 = \cos(10\pi/17)$ पर काटता है, और वहाँ के लंब $P_3$ और $P_5$ देते हैं। यहाँ हर कदम सचमुच दो बिंदुओं से होकर एक रेखा, या एक बिंदु को केंद्र मानकर दूसरे बिंदु से होकर एक वृत्त खींचता है। हर नया बिंदु रेखा–रेखा, रेखा–वृत्त या वृत्त–वृत्त प्रतिच्छेद है, और बाकी शीर्ष वृत्तों से नापे जाते हैं: $P_k$ केंद्र और $P_{k-1}$ से होकर, तथा दर्पण-प्रतिबिंब के लिए $P_0$ केंद्र और $P_k$ से होकर। 55 कदम float64 में सभी 17 शीर्षों को $e^{2\pi i k/17}$ से लगभग $10^{-15}$ के भीतर
  रखते हैं; float32 पर जाकर पूर्णांकन त्रुटि को लगभग $10^{-6}$ तक बढ़ते देखें। गाउस ने कहा कि $n$-भुज रचनीय है जब $n = 2^k p_1 \cdots p_r$ हो और $p_i = 2^{2^j} + 1$ भिन्न फ़र्मा अभाज्य हों। वांत्ज़ेल (1837) ने सिद्ध किया कि कोई और $n$ काम नहीं करता, जिससे कोण-त्रिभाजन और घन-द्विगुणन के प्रश्न भी सुलझ गए। यह इसके तुल्य है कि ऑयलर फलन $\varphi(n)$ 2 की घात हो, और ग्रिड दोनों परीक्षण $n$ तक जाँचता है। ज्ञात फ़र्मा अभाज्य केवल 3, 5, 17, 257 और 65537 हैं। Richelot ने 1832 में 257-भुज प्रकाशित किया, और J. G. Hermes ने लगभग दस वर्ष 65537-भुज पर लगाए, जो 1894 में पूरा हुआ और गॉटिंगेन में रखा है। कहा जाता है कि गाउस ने अपनी समाधि पर 17-भुज चाहा था; बताया जाता है कि संगतराश ने मना कर दिया क्योंकि वह वृत्त जैसा दिखता। ब्राउनश्वाइग में गाउस स्मारक पर इसके बजाय 17 नोकों वाला तारा है।'
meanings:
- इकाई के 17वें मूल, सम्मिश्र तल में 17-भुज के शीर्ष
- 'एक आद्य मूल की घातों के क्रम में घातांक, $g = 3$: 1, 3, 9, 10, 13, …'
- 'चक्रीय क्रम के कौन-से स्थान स्तर $m$ पर आवर्त $i$ बनाते हैं: हर $2^m$-वाँ'
- 'दोहराया $j$ ⇒ योग: पाँचों स्तरों (लंबाई 16, 8, 4, 2, 1) के सभी गाउस आवर्त एक साथ'
- दो सहोदर आवर्तों का गुणनफल $\zeta^{a+b}$ का योग है; घातांकों को गिनने से ऐसे पूर्णांक मिलते हैं जो जनक स्तर के आवर्तों पर स्थिर हैं
- 'दोहराया $k$ ⇒ योग: ऊपर वाले स्तर से हर द्विघात का अचर पद'
- 'हर स्तर पर एक वर्गमूल: $16 \to 8 \to 4 \to 2 \to 1$; स्तर 3 में $2\cos(2\pi k/17)$ हैं'
- 'रूलर और परकार की तीन चालें टेंसर सूत्रों के रूप में: सदिश गुणनफल से $2\times 2$ हल, $t$ में द्विघात, और दो वृत्तों की मूलाक्ष रेखा'
- छलनी से ऑयलर फलन; रचनीय ठीक तब जब $\varphi(n)$ 2 की घात हो, $x \,\&\, (x-1) = 0$ से जाँचा गया
- 'विषम भाग को $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$ को विभाजित करना चाहिए: भिन्न फ़र्मा अभाज्यों का गुणनफल'
labels:
  generator: चक्रीय क्रम के लिए आद्य मूल $g$
  precision: रचना की परिशुद्धता
  n_max: रचनीयता ग्रिड $n$ तक
