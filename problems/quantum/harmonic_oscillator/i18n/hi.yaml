source_hash: 213c96e488f8
title: क्वांटम सरल आवर्ती दोलित्र
summary: हैमिल्टनियन $H = -\tfrac12\,d^2/dx^2 + \tfrac12\omega^2x^2$ ग्रिड पर एक आव्यूह बन जाता है, और torch.linalg.eigh उसकी समान अंतराल वाली ऊर्जा सीढ़ी $E_n = \omega(n + \tfrac12)$ लौटाता है। एक विस्थापित गाउसीय (संबद्ध अवस्था, coherent state) को आइगेन-अवस्थाओं के योग के रूप में लिखा जाता है; हर एक को उसकी कला $e^{-iE_n t}$ देने से पैकेट ठीक स्प्रिंग पर लगे शास्त्रीय द्रव्यमान की तरह आगे-पीछे झूलता है।
notes: मात्रक $\hbar = m = 1$। ग्रिड एक बड़ा बॉक्स है जिसकी दीवारों पर $\psi = 0$, और दीवारें इतनी दूर हैं कि कभी प्रभाव नहीं डालतीं। हल्के वक्र निम्नतम स्थिर अवस्थाएँ $\varphi_n(x)$ हैं, जो अपनी ऊर्जा $E_n$ की ऊँचाई पर खींची गई हैं; सीढ़ी के डंडों के बीच अंतराल ठीक $\omega$ है। प्रारंभिक अवस्था $x_0$ तक खिसकाई गई मूल-अवस्था गाउसीय है। इसके भार $\lvert c_n\rvert^2$ माध्य $\omega x_0^2/2$ वाला पॉयसन बंटन बनाते हैं, और चूँकि सभी ऊर्जाएँ $\omega$ के पूर्ण गुणजों से भिन्न हैं, पैकेट हर आवर्तकाल $2\pi/\omega$ के बाद बिना फैले $x_0$ पर लौट आता है। $\langle x\rangle$ शास्त्रीय गति $x_0\cos\omega t$ का पालन करता है (द्विघात विभव के लिए एहरनफ़ेस्ट प्रमेय सटीक है)।
meanings:
- हर ग्रिड बिंदु पर स्प्रिंग विभव $\tfrac12\omega^2x^2$
- गतिज $-\tfrac12\,D2$ और विकर्ण पर विभव
- ऊर्जाएँ और आइगेन-सदिश (स्तंभ $n$ अवस्था $n$ है)
- 'दोहराया गया $x$ ⇒ योग: प्रारंभिक अवस्था का अवस्था $n$ से अतिव्यापन'
- 'दोहराया गया $n$ ⇒ योग: कला-युक्त घटकों से $\psi$ का पुनर्निर्माण'
- औसत स्थिति, शास्त्रीय $x_0\cos\omega t$ से तुलना
labels:
  omega: कोणीय आवृत्ति $\omega$
  x0: प्रारंभिक विस्थापन $x_0$
  periods: अनुकरण समय
  n_grid: ग्रिड बिंदु
