source_hash: 5165c35a9a08
title: 以隱馬可夫模型尋找 CpG 島
summary: DNA 序列在一般背景與富含 GC 的 CpG 島之間不可見地切換。雙狀態隱馬可夫模型能找出它們：前向–後向演算法給出每個位置處於島內的機率，Viterbi 給出單一最佳分段，Baum–Welch 則僅從序列本身學習模型。沿序列的每一步都是對狀態的一次批次矩陣乘積，並在對數空間中進行。看看後驗機率如何鎖定植入的島。
notes: 資料是合成的：每條序列在隨機位置植入長 100–300 個字母的島，島內有較多 C 與 G。單一字母幾乎無法透露狀態，但馬可夫鏈 $A$ 使狀態得以延續，因此前向與後向傳遞能匯集整段序列的證據。Baum–Welch 是期望值最大化：在目前模型下計算 $\gamma$ 與 $\xi$，再將 $E_{k\alpha}$ 設為各狀態中預期的字母頻率、$A_{ij}$ 設為預期的切換頻率；似然值永不下降。從模糊的猜測出發，它最終接近真實模型（綠線）。真實的 CpG 島富含的是二核苷酸 CG，而不僅是 C 與 G；Durbin et al. 以 8 個狀態（A+、C+、G+、T+、A−、…）建模，其轉移即二核苷酸頻率。降低島的 GC 含量可使問題更難。
meanings:
- 序列 $b$ 在位置 $t$ 的字母，對 A、C、G、T 做 one-hot 編碼
- 起始、轉移與發射機率；狀態 0 為背景，狀態 1 為島
- 重複的 $\alpha$ ⇒ 求和：每個狀態發射所見字母的可能性
- 重複的 $i$ ⇒ 求和；以 $\log\alpha$ 儲存並提出最大項（log-sum-exp），以免下溢
- 重複的 $j$ ⇒ 求和：給定狀態 $i$ 時其餘序列的機率
- 後驗 $P(z_t = k \mid x)$；$\gamma_{bt1}$ 為藍色曲線
- Viterbi：同樣的遞迴但以 max 取代求和，並加上回溯指標以得最佳路徑
- 重複的 $b, t$ ⇒ 求和：$i \to j$ 切換的預期次數；Baum–Welch 設 $A_{ij} \propto \xi_{ij}$
labels:
  n_seq: 序列數 $B$
  length: 長度 $T$
  n_islands: 每條序列植入的島數
  gc_island: 島的 GC 含量
  iterations: Baum–Welch 迭代次數
