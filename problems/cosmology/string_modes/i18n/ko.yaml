source_hash: 49928f544229
title: 상대론적 끈의 모드와 T-이중성
summary: '광원뿔 게이지에서 남부–고토(Nambu–Goto) 끈은 24개의 자유로운 횡파입니다. 배치로 계산한 하나의 모드 합이 진동하는 닫힌 끈 또는 열린 끈을 그립니다. 모드에 담긴 에너지는 준위 $N$이며 $\alpha'' M^2 = N - 1$(열린 끈) 또는 $4(N-1)$(닫힌 끈)로 양자화되고, 상태 수 $1, 24, 324, 3200, \dots$는 멱급수 $\prod (1-q^n)^{-24}$에서 읽어 냅니다. 반지름 $R$인 원 위에서 닫힌 끈의 스펙트럼은 $R \leftrightarrow \alpha''/R$에 대해 변하지 않습니다: T-이중성. 끈 이론은 직접적인 실험적 확인이 없는 이론적 틀입니다.'
notes: '단위 $\alpha'' = 1$. 현황: 끈 이론은 양자 중력에 대한 수학적으로 일관된 후보 틀이지만, 이를 뒷받침하는 직접적인 실험적 증거는 없습니다. 여기 있는 어떤 것도 검증된 예측이 아닙니다. 보여 주는 것은 보손 끈의 표준 교과서 수학입니다(Goddard–Goldstone–Rebbi–Thorn 1973; Polchinski, String Theory vol. 1): 광원뿔 양자화는 $D = 26$에서만 일관되며 절편 $a = 1$을 가지므로, $N = 0$에 타키온($M^2 < 0$, 빨강), 열린 끈의 $N = 1$에 질량 없는 벡터, 닫힌 끈의 $N = \tilde N = 1$에 중력자, B-장, 딜라톤이 남습니다. 초끈(D = 10)은 타키온을 제거합니다. 그려진 끈은 진동자 에너지가 준위 $N$과 같은 고전적 배위입니다(모드 $n$의 각 양자는 $n$ 단위를 운반). 닫힌 끈에서는 오른쪽·왼쪽 이동 모드를 $N = \tilde N$이 되도록 고르며(준위 일치, $\int \dot X\cdot X''\,d\sigma = 0$), 끈은 정지 좌표계에 있으므로 광원뿔 좌표 $X^-$는 그리지 않습니다. T-이중성 패널은 반지름이 변할 때 몇몇 상태의 질량을 추적합니다: 운동량 상태($n/R$)와 감김 상태($wR/\alpha''$)는 $R \to \alpha''/R$에서 서로 바뀌고, 자기 이중 반지름 $R = \sqrt{\alpha''}$에서는 추가 상태들이 질량을 잃습니다. 제목은 잘라 낸 전체 스펙트럼이 겹침수까지 포함해 $R$과 $\alpha''/R$에서 동일함을 확인합니다.'
meanings:
- 24개 횡방향 $i$ 중 3개 방향에서 오른쪽·왼쪽 이동 모드 $n$의 복소 진폭
- 모든 세계면 점에서 각 모드의 위상 $e^{-in(\tau-\sigma)}$ (브로드캐스트)
- '반복된 모드 지수 $n$ ⇒ 합산: 모든 $\tau$와 $\sigma$에서의 끈 모양'
- 에너지 밀도; $\sigma$에 대해 적분하면 준위 $N$ (파스발)
- '브로드캐스트한 나눗셈 마스크로 얻은 약수 합: $\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$'
- 잘라 낸 멱급수는 하삼각 퇴플리츠 행렬처럼 곱해지므로, 급수의 $\exp$는 행렬 지수 함수
- 모든 반지름 $R_b$에서 준위 일치 상태 $N-\tilde N = nw$ 전체의 질량을 한 번에
labels:
  string: 끈 종류
  mode_a: '오른쪽 이동 모드의 모드 $n$ (열린 끈: 첫째 모드)'
  mode_b: '왼쪽 이동 모드의 모드 $\tilde n$ (열린 끈: 둘째 모드)'
  n_points: 끈을 따라가는 점 $\sigma$
  n_levels: 표시할 질량 준위
  R_max: 스윕에서 가장 큰 원 반지름 $R/\sqrt{\alpha'}$
