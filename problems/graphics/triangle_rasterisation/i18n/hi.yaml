title: z-बफ़र के साथ त्रिभुज रास्टराइज़ेशन
summary: 'गेम 3D ऐसे बनाते हैं: एक त्रिभुज जाल (mesh) को स्क्रीन पर प्रक्षेपित करें और हर (पिक्सेल, त्रिभुज) जोड़ी के बैरीसेंट्रिक भार एक साथ गणना करें। त्रिभुजों पर एक न्यूनतम-अपचयन ही z-बफ़र है। फिर वही भार फ़्लैट, Gouraud और Phong छायांकन तथा टेक्सचर लुकअप चलाते हैं। टेक्सचर निर्देशांकों को $\lambda$ (एफ़ाइन) के बजाय $\lambda/z$ (परिप्रेक्ष्य-सही) से अंतर्वेशित करना ही चेकर्ड फ़र्श को सीधा रखता है।'
notes: 'बैरीसेंट्रिक भार चिह्नित क्षेत्रफल हैं: $\lambda_k$ कोने $k$ के सामने वाले छोटे त्रिभुज का क्षेत्रफल पूरे से भाग देकर है, इसलिए तीनों का योग 1 है और ठीक भीतर सभी धनात्मक हैं। यहाँ वे हर पिक्सेल और हर त्रिभुज के लिए एक साथ गणना किए जाते हैं, जो GPU हार्डवेयर में करता है उसका बलपूर्वक (brute-force) संस्करण। पिक्सेलों को टाइलों में बाँटने से $(P, T, 3)$ टेंसर कुछ मिलियन प्रविष्टियों से नीचे रहता है; असली रास्टराइज़र केवल हर त्रिभुज के परिसीमा बॉक्स पर जाता है। स्क्रीन-स्पेस क्षेत्रफल का चिह्न मुफ़्त में बैक-फ़ेस कलिंग भी देता है: बंद जाल का लगभग आधा भाग दूर की ओर मुख किए होता है। त्रिभुज के अनुदिश गहराई स्क्रीन पर रैखिक नहीं है, पर $1/z$ है, इसलिए z-बफ़र परीक्षण और हर अंतर्वेशित गुण दोनों भार $\lambda_k/z_k$ उपयोग करते हैं। फ़र्श केवल दो त्रिभुज है, इसलिए एफ़ाइन अंतर्वेशन (PlayStation-1 शैली) उसकी चेकर रेखाओं को स्पष्ट रूप से मोड़ देता है, जबकि परिप्रेक्ष्य-सही संस्करण उन्हें सीधा रखता है। फ़्लैट छायांकन हर फलक दिखाता है। Gouraud कोनों को प्रकाशित करके चमक को मिश्रित करता है, जिससे
  स्पेक्युलर हाइलाइट फैल जाती है। Phong अभिलंबों को मिश्रित करके हर पिक्सेल को प्रकाशित करता है, जिससे हाइलाइट तीखी रहती है।'
meanings:
- जाल के शीर्ष और फ़र्श के 4 कोने; फलक $(T, 3)$ उनमें अनुक्रमित करते हैं
- 'दोहराया गया $j$ ⇒ योग: जाल को घुमाएँ (प्रति फ़्रेम एक घूर्णन)'
- त्रिभुज $t$ के कोने $k$ की स्क्रीन स्थिति और गहराई (पिनहोल कैमरा $f\,(x, y)/z$)
- $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$ का आधा; $A_t \le 0$ ⇒ पिछला फलक, हटाया गया
- हर त्रिभुज में हर पिक्सेल के बैरीसेंट्रिक भार; स्मृति सीमित रखने के लिए पिक्सेलों की टाइलों में गणना
- 'दोहराया गया $k$ ⇒ योग: $1/z$ ही स्क्रीन पर रैखिक रूप से बदलता है'
- 'z-बफ़र: प्रति पिक्सेल निकटतम ढकने वाला त्रिभुज (बाहर के पिक्सेल $+\infty$ हैं)'
- टेक्सचर निर्देशांक, अभिलंब, स्थितियाँ, Gouraud चमक भार $\lambda/z$ से अंतर्वेशित
- 'एफ़ाइन अंतर्वेशन: सामने से दिखते त्रिभुजों के लिए सही, झुके हुओं के लिए गलत'
labels:
  mesh: जाल (mesh)
  resolution: छवि आकार
  frames: प्रति चक्कर फ़्रेम
  tilt: $x$ के परितः झुकाव
