source_hash: 157106563a38
title: Slow-Roll-Inflation und die (n_s, r)-Ebene
summary: 'Fünf Inflatonpotentiale ($m^2\phi^2$, $\lambda\phi^4$, Starobinsky $R^2$, natürliche Inflation, ein quartisches Hilltop-Potential) rollen in einem einzigen gestapelten Tensor durch die Friedmann- und Klein–Gordon-Gleichungen, mit der Zahl der e-Folds $N = \ln a$ als Uhr. Die Slow-Roll-Parameter $\epsilon$, $\eta$ und die Vorhersagen $n_s$ und $r$ bei $N_* = 50$–$60$ werden am exakten Hintergrund überprüft und Planck 2018 sowie BICEP/Keck 2021 gegenübergestellt: $m^2\phi^2$ und $\lambda\phi^4$ sind disfavorisiert, Starobinsky liegt innerhalb. Inflation ist die führende Erklärung der Anfangsbedingungen, aber sie ist nicht bestätigt: Primordiale B-Moden wurden nicht nachgewiesen.'
notes: 'Einheiten: reduzierte Planck-Masse $M_\mathrm{pl} = 1$. Schreibt man die Gleichungen mit $N = \ln a$ als Zeit, $\psi = d\phi/dN$ und $\epsilon_H = \psi^2/2$, erhält man $d\psi/dN = -(3-\epsilon_H)(\psi + V''/V)$ und $H^2 = V/(3-\epsilon_H)$; es zählt also nur $V''/V$, und jedes Potential wird mit Höhe 1 gezeichnet (die Amplitude $A_s = 2.1\times10^{-9}$ legt dann die Energieskala fest, ausgegeben als $V_*^{1/4}$, für die meisten Modelle etwa $10^{16}$ GeV). Jedes Feld startet etwa 68 e-Folds vor seinem Ende, an einem Punkt aus der Slow-Roll-Abzählung des Lehrbuchs, auf der Slow-Roll-Geschwindigkeit $\psi = -V''/V$; der Test startet $m^2\phi^2$ mit sehr unterschiedlichen Geschwindigkeiten und findet alle innerhalb weniger e-Folds auf derselben Kurve: Slow Roll ist ein Attraktor. Die Inflation endet dort, wo $\epsilon_H = 1$. Die Vorhersagen werden zweimal berechnet: aus dem Potential in erster Ordnung ($n_s = 1 - 6\epsilon_V + 2\eta_V$, $r = 16\epsilon_V$, die ×-Markierungen) und
  aus den Hubble-Fluss-Parametern $\epsilon_{1,2,3}$ des numerischen Hintergrunds in zweiter Ordnung (Stewart und Lyth 1993; Schwarz, Terrero-Escalante und García 2001; die Punkte); sie unterscheiden sich in $O(\epsilon^2)$, einige $10^{-4}$ in $n_s$. Eine vollständige Mukhanov–Sasaki-Lösung Mode für Mode wird hier nicht durchgeführt. Ergebnisse bei $N_* = 55$: $m^2\phi^2$ liefert $n_s \approx 1 - 2/N_*$, $r \approx 8/N_* \approx 0.14$; $\lambda\phi^4$ liefert $r \approx 0.29$ und ein zu rotes $n_s$; Starobinsky liefert $n_s \approx 0.965$, $r \approx 12/N_*^2 \approx 0.004$; natürliche Inflation ($f = 7$) liefert $r \approx 0.08$, oberhalb der Grenze; das quartische Hilltop-Potential ($\mu = 15$) landet innerhalb. Der Beobachtungsbereich ist als Kasten gezeichnet (Planck 2018 $n_s = 0.9649 \pm 0.0042$ bei 68 %, TT,TE,EE+lowE+lensing; BICEP/Keck 2021 $r_{0.05} < 0.036$ bei 95 %), nicht als die veröffentlichten zweidimensionalen Konturen, die leicht geneigt sind und von der Datenkombination
  abhängen. Ehrlicher Stand: Inflation erklärt die Flachheit, das Horizontproblem und die nahezu skaleninvarianten, gaußschen, adiabatischen Fluktuationen, und $n_s < 1$ wurde vorhergesagt, bevor es gemessen wurde; aber es gibt konkurrierende Ideen (Bounce- und ekpyrotische Modelle), das Inflaton ist nicht identifiziert, und der entscheidende Beweis, die primordiale B-Moden-Polarisation durch Gravitationswellen, wurde nicht nachgewiesen (die Behauptung von BICEP2 aus dem Jahr 2014 erwies sich als galaktischer Staub). Probieren Sie $N_*$ zwischen 50 und 60 (es hängt davon ab, wie sich das Universum wieder aufgeheizt hat), oder ändern Sie $f$ und $\mu$: Bei $N_* = 55$ erreicht die natürliche Inflation den Kasten nie, denn ein kleineres $f$ senkt $r$, macht $n_s$ aber zu rot ($f = 5$: $n_s \approx 0.950$, $r \approx 0.04$).'
meanings:
- 'One-hot-Zeile: Feld $b$ verwendet Potential $p$'
- die fünf Potentialformen, ausgewertet für jedes Feld
- 'wiederholtes $p$ ⇒ summiert: das eigene Potential jedes Feldes'
- Feld und $d\phi/dN$, gemeinsam per RK4 in e-Folds vorangetrieben
- 'das Einzige, was der Hintergrund braucht: Die Höhe von $V$ fällt heraus'
- $V'$ und $V''$ per Autograd
- wo $\epsilon_H$ durch 1 steigt, d. h. $\ddot a$ das Vorzeichen wechselt
- Hubble-Fluss-Parameter $N_*$ e-Folds vor dem Ende, mit einem einzigen Gather
- Vorhersagen zweiter Ordnung aus dem exakten Hintergrund
labels:
  N_star: Pivot-e-Folds vor dem Ende $N_*$
  f: Skala der natürlichen Inflation $f$
  mu: Hilltop-Breite $\mu$
