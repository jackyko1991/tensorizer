source_hash: e9d43436470c
title: 用本輪作畫
summary: 把一條封閉曲線取樣為複數 $z_n = x_n + i\,y_n$，它有離散傅立葉轉換 $c_k$，而每一項 $c_k e^{2\pi i k t}$ 都是一個半徑為 $|c_k|$、每走一圈轉 $k$ 次的圓。把這些圓首尾相接、由大到小串起來，筆尖就會重新描出這條曲線。隨著圓一個個加入，可以看到 Tensorizer 標誌的輪廓逐漸浮現，而誤差正如 Parseval 定理所預測的那樣下降。
notes: DFT 矩陣 $W$ 把總和完整寫出來（$N^2$ 次乘法）；`torch.fft.fft` 則用 Cooley–Tukey 快速傅立葉轉換在 $O(N \log N)$ 內得到同樣的 $c_k$，並有測試檢查兩者一致。DFT 是可逆的：全部 $N$ 個圓能精確重現 $N$ 個取樣點，而時間平移 $z_{n-s}$ 只會讓 $c_k$ 乘上相位 $e^{-2\pi i k s/N}$（半徑不變，只有起點改變）。只繞一次的圓只需一項（$k = 1$），而心形 $x = 16\sin^3 s$、$y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$ 是三角多項式，所以恰好 8 個圓（$k = \pm1 \dots \pm4$）就能完美畫出它。多邊形則不同：每個角上速度都會跳變，因此 $|c_k|$ 只像 $1/k^2$ 那樣衰減，用 $M$ 個圓時的誤差則像 $M^{-3}$；圓太少時，角會被磨圓，邊上還會出現振鈴般的小波動。曲線本身是連續的，所以（不同於傅立葉級數問題中函數本身會跳變的方波）這些波動會縮小到消失；9 % 的 Gibbs 過衝出現在會跳變的速度上。先保留最大的圓會讓誤差單調下降，因為根據 Parseval 定理，誤差恰好等於被捨棄的圓的 $\sum|c_k|^2$。歷史：Ptolemy 的天文學（《天文學大成》，2 世紀）讓行星在一個圓（本輪）上運動，而本輪的圓心又沿著另一個圓（均輪）移動；只要本輪夠多，任何週期性的封閉路徑都能被擬合，這正是該體系雖然物理上並不正確，卻能在 1400 年間與觀測吻合得這麼好的原因。標誌路徑是 Tensorizer 立方體的六邊形輪廓加上三條內邊，走過去再走回來。試試用很少的圓畫星形。
meanings:
- 曲線在等間隔時間 $t_n = n/N$ 上的複數值；多邊形按弧長重新取樣
- DFT 矩陣，頻率 $k = -N/2 \dots N/2 - 1$
- 重複的 $n$ ⇒ 求和：第 $k$ 個圓的半徑為 $|c_k|$，起始角為 $\arg c_k$
- 按半徑排序的圓：圓鏈先保留最大的
- 重複的 $k$ ⇒ 求和：由最大的 $M_m$ 個圓畫出的曲線，一次算出所有 $M$（$K_{mk} = [r_k < M_m]$，$E_{tk} = e^{2\pi i k t}$）
- 各項的累加和：鏈中每個圓的圓心，最後一個就是筆尖
- 取樣點上的均方誤差，等於被捨棄的圓的能量（Parseval）
labels:
  shape: 曲線
  n_points: 取樣數 $N$
  max_terms: 最多的圓數 $M$
