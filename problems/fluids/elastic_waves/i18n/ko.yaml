source_hash: 36e54b56debf
title: 탄성 P파와 S파
summary: '탄성 고체에 대한 나비에–코시 방정식. 한 점을 짧게 밀면 두 파동이 퍼져 나갑니다: 빠른 압축 P파($\nabla\cdot\mathbf u$에서 보임)와 느린 전단 S파($\nabla\times\mathbf u$에서 보임). 두 항 모두 2계 도함수 표 하나 $\partial_i\partial_j u_k$의 축약이며, 반복 지표가 다른 einsum 두 개입니다.'
notes: $\rho = 1$, 셀 크기 1인 단위계. 시간 적분은 립프로그 $u^{n+1} = 2u^n - u^{n-1} + \Delta t^2\,\ddot u^n$입니다. 방정식의 발산을 취하면 속력 $c_P$인 $\theta = \partial_j u_j$의 파동 방정식이, 회전을 취하면 속력 $c_S < c_P$인 회전의 파동 방정식이 나옵니다. 암석에서는 $c_P \approx 1.7\,c_S$이므로 지진의 P파가 먼저 도착하고 S파는 몇 초 뒤에 옵니다. 점 힘은 P파를 주로 힘 방향으로, S파를 주로 그 수직 방향으로 내보내며, 두 개의 엽 모양 무늬가 이를 보여 줍니다. 점선 원은 예측된 파면 $c\,(t - t_0)$이며, $t_0$은 선원 웨이블릿의 봉우리 시각입니다. 감쇠 경계가 파동이 가장자리에 닿기 전에 흡수합니다(실제 코드는 완전 정합층을 씁니다). 푸아송 비가 ½에 가까우면($\lambda \gg \mu$) $c_P$가 커져서 시간 간격을 작게 해야 합니다.
meanings:
- 변위장, 모든 노드에서 성분 $i \in \{x, y\}$
- 중심 차분으로 구한 모든 2계 도함수
- 반복된 $j$ (2번째와 3번째 자리) ⇒ 발산의 기울기
- 반복된 $j$ (1번째와 2번째 자리) ⇒ 각 성분의 라플라시안
- 중심에서 한 방향으로 가하는 짧은 멕시칸 햇 모양의 밀기
- 부피 변화 (P)와 회전 (S)
- 립프로그 단계; 쿠랑 수 $S > 1$이면 기법이 발산하므로 거부
labels:
  lam: 라메 상수 $\lambda$
  mu: 전단 탄성률 $\mu$
  direction: 힘의 방향
  courant: 쿠랑 수 $S$
  t_max: 시뮬레이션 시간
