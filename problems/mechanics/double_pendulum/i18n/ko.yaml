source_hash: 75e6d7e3dc93
title: 이중 진자와 혼돈
summary: $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$로 쓴 이중 진자의 라그랑주 방정식. RK4의 각 단계에서 $2\times 2$ 질량 행렬 텐서를 만들고 torch.linalg.solve를 호출합니다. 거의 같은 두 초기 조건이 점점 멀어지며 혼돈을 보여 줍니다.
notes: 배치에는 $\theta_2$가 $\delta$만큼 다른 두 진자가 들어 있습니다. 둘의 차이는 운동이 서로 무관해질 때까지 대략 지수적으로 커지지만, 각 진자의 에너지는 높은 정확도로 일정하게 유지됩니다(float64 + 작은 간격의 RK4). 작은 진동에서 이 계는 두 정규 모드를 가지며, 질량과 길이가 같으면 $\omega^2 = (2 \mp \sqrt2)\,g/L$입니다. 막대는 질량이 없고 회전축에는 마찰이 없습니다.
meanings:
- 연직 아래 방향에서 잰 진자 $b$의 각 $(\theta_1, \theta_2)$
- 각속도
- 배위(각도)에 따라 달라지는 질량 행렬, 비대각 원소 $m_2L_1L_2\cos(\theta_1-\theta_2)$
- '일반화 힘: 원심 결합 + 중력'
- 배치 전체에 대해 $M\ddot q = f$를 한 번에 풂
- '$i$와 $j$에 대해 합: 운동 에너지의 두 배'
labels:
  theta1: 초기 $\theta_1$
  theta2: 초기 $\theta_2$
  delta: $\theta_2$의 섭동 $\delta$
  m1: 위 질량 $m_1$
  m2: 아래 질량 $m_2$
  L1: 위 막대 $L_1$
  L2: 아래 막대 $L_2$
  t_max: 시뮬레이션 시간
