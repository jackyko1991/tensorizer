title: 何度も見られる一つの粒子：1 本の世界線をスライスする
summary: これは推測的な仮説であり、確立された物理ではない：すべての電子は同一の対象であり、時間の中を行きつ戻りつジグザグに進む 1 本の世界線である（Wheeler が 1940 年に提案した一電子宇宙）。時間スライスはそれを何度も横切る：前向きの交差は電子に、後ろ向きの交差は陽電子に見える。このステップでは、ランダムな世界線のバッチをスライスする。すべての電子は厳密に同一となり、転回点で粒子対が生成・消滅する。しかし、閉じた世界線はすべてのスライスを後ろ向きと前向きに同じ回数だけ横切り、開いた世界線が加えるのは高々 1 個の正味の粒子である。一方、宇宙には約 $10^{80}$ 個のバリオンがあり、反物質はほとんどない。最も単純な形では、この考えは否定される。
notes: ステータス：推測的。最も単純な形では否定されている。射影仮説（著者自身の推測的なアイデア、シリーズの説明を参照。確立された物理ではない）のステップ 2 で、公準 P3「すべての粒子は一つの対象の射影である」に関するものである。ステップ 1（cosmology/projection_postulate）で公準を述べた。ステップ 3（cosmology/projection_dimension_budget）では、それらが必要とする次元を数える。まず既知の物理から。1940 年の電話で、John Wheeler は Richard Feynman に、すべての電子が同一なのはそれらが一つの電子であり、その世界線が時間の中を前向きにも後ろ向きにも進むからだと示唆した。後ろ向きの区間が陽電子である。Feynman は 1965 年のノーベル賞講演でこの話を、自身の反論とともに紹介した：陽電子は電子ほど多くは存在しない。Wheeler は、陽電子は陽子の中に隠れているのかもしれないと示唆した。陽電子とは時間を逆行する電子であるという考えは、反粒子のファインマン–シュテュッケルベルク描像として生き残った（Feynman, Phys. Rev. 76, 749, 1949）が、一電子宇宙は生き残らなかった：場の量子論では、すべての電子が同一なのは、それらが一つの場の励起だからである。ここでは世界線は $D$ 次元の空間に存在する（$D$ はパラメータであり、4 に固定されることはない）。P2 が述べるように、スライスにとって重要なのはその時間座標だけである。仮説の予言：時間スライス（P2）は世界線を $N_+$ 個の前向きの交差と $N_-$ 個の後ろ向きの交差で切る。計算する内容：滑らかな（ランダムフーリエ、$K$ 個の調和成分、振幅 $\propto k^{-\beta}$）世界線と粗い（ブラウン運動）世界線のバッチを、閉じたものも開いたものも、$L$ 枚のスライスで切る。交差は差分配列への scatter で数え、総当たりの表と照合して検証する。閉じたループではすべてのスライスで $N_+ = N_-$ となる。開いたものでは $Q = N_+ - N_-$ が $[t_{end}\geq u] - [t_{start}\geq u]$ に等しく、したがって $|Q|\leq
  1$ かつ $N\equiv Q$（mod 2）である。スライスを傾けても（運動する観測者）$Q$ は変わらない。総数はスライスより下の $2(\#\text{minima} - \#\text{maxima})$ に等しく、したがって粒子対は $t(s)$ の極小で生まれ、極大で消える。ランダムな滑らかなループの平均交差数はライスの公式に従う。この考えが自動的に正しく与えるもの：どの交差も同じ世界線の質量と電荷を読み取るので、すべての電子は厳密に同じであり、陽電子は厳密に反対の電荷と同じ質量を持つ（PDG 2024：$|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$、$|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$）。データとの照合（data/*.csv、引用した数値）：AMS-02 は宇宙線の陽電子比 $e^+/(e^+ + e^-)$ を 0.5 GeV から 1 TeV まで測定した（Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0、CRDB データベース経由で 74 ビン）：0.6 GeV で 0.13、8 GeV 付近で最小値 0.053、200 GeV 以上で 0.15 から 0.16。したがって非対称度 $1 - 2f$ は 0.67 から 0.89 の間であり、閉じたループでは $0$ である。宇宙論的スケールでは、Planck 2018 のバリオン密度 $\Omega_b h^2 = 0.0224$ が $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ を与える（cosmology/baryon_asymmetry を参照）。1 cm$^3$ あたり 411 個の光子、半径 465 億光年の球で考えると、これは $N_B\approx 9\times10^{79}$ 個のバリオンに相当し、反物質は存在しない（BESS-Polar：反ヘリウム/ヘリウムは $6.9\times10^{-8}$ 未満。Cohen、De Rújula、Glashow 1998：可視宇宙に反物質ドメインはない）。1 本の世界線が与えるのは高々 $|Q|/N = 1/N$ であり、$N\approx
  1.5\times10^{89}$ のとき $7\times10^{-90}$ である。これに対し $\eta = 6\times10^{-10}$ であり、正味の電荷は約 $10^{80}$ 倍足りない。開いたパラメータの探索（滑らかまたはブラウン運動、閉じたまたは開いた、2 から 32 個の調和成分、3 通りの粗さ、$N\geq 2$ のスライス約 $3\times10^5$ 枚）では AMS-02 の非対称度に達する配置は見つからず、上限からそれが不可能であることがわかる：交差数 $N\geq 2$ のとき、可能な最大の非対称度は $1/3$（$N = 3$ のとき）である。判定：最も単純な形では否定される。拡張（それぞれ追加の仮定であり、そのように明記する）：(A) 開いた世界線は正味の粒子を 1 個加えるだけで、それ以上ではない。(B) 偏った射影、すなわち観測者が反粒子を効率 $r$ で見るとする場合、AMS-02 からはエネルギーとともに変化する 0.056 から 0.195 の間の $r = f/(1-f)$ が必要だが、反ヘリウムからは $r < 7\times10^{-8}$ が必要となる。その場合、隠れた反物質は可視バリオンと同じだけの質量を持ち、暗黒物質の約 0.19 となる。これは Wheeler の「陽子の中に隠れている」の現代版であり、機構を必要とするが、それは与えられていない。(C) 時間が円であれば、$w$ 回巻くループはすべてのスライスで正味の電荷 $Q = w$ を持つ（検証済み）が、$w\approx 10^{80}$ は手で入れなければならず、コンパクトな時間は閉じた時間的曲線を意味する。これらはいずれも予言ではない。この考えを復活させるのは、単一の対象のスライス計数を非対称にする機構であり、それがこのステップがシリーズに残す未解決の問題である。逃げ道：単純な版は否定されるが、大域的にバランスした世界線で、反物質が我々の地平線の向こうか CPT 鏡像の反宇宙にあるものは否定されない。ステップ 7（cosmology/projection_antimatter_universe）では、そのような反物質宇宙が満たすべき基準を列挙し、それぞれをデータで検証する。
meanings:
- 繰り返される $k$（調和成分）と $c$（cos、sin）⇒ 和をとる：$D$ 次元の $B$ 本のランダムな世界線。座標 0 が時間
- 各スライスの前向き（粒子）と後ろ向き（反粒子）の交差。セグメント $s$ にわたる和は、差分配列への scatter と累積和
- スライス上の正味の電荷。両端の交差数に等しく、閉じたループでは $0$
- 転回点だけから得られる同じ計数：極小は粒子対を生成し、極大はそれを消滅させる
- スペクトルモーメント $\lambda_0 = \sum_k\sigma_k^2$、$\lambda_2 = \sum_k k^2\sigma_k^2$ を用いたライスの公式
- エネルギー $E$ での AMS-02 陽電子比 $f_E$ から得られる宇宙線 $e^\pm$ の電荷非対称度
- 1 本の世界線が担わなければならない正味のバリオン数（$\eta$ は Planck 2018 から）
labels:
  worldlines: バッチ内の世界線の数 $B$
  samples: 各世界線に沿ったサンプル数 $S$
  modes: 座標あたりの調和成分の数 $K$（どれだけ頻繁にジグザグできるか）
  roughness: 粗さ $\beta$：調和成分 $k$ の振幅は $\propto k^{-\beta}$
  dims: 世界線が存在する空間の次元数 $D$（開いたパラメータ）
  slices: 時間スライスの数 $L$
