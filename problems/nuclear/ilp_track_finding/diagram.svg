<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Track finding: four barrel detector layers seen along the beam, hits on each layer, candidate segments between adjacent layers as dashed lines, a chosen curved track through one hit per layer, and a triplet of hits with its bending angle">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- beam line (seen end-on) and magnetic field -->
    <circle cx="22" cy="140" r="4" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="22" cy="140" r="1.3" fill="#374151"/>
    <text x="8" y="126" font-style="italic">B</text>
    <!-- four barrel layers: arcs around the beam line -->
    <g fill="none" stroke="#374151" stroke-width="2">
      <path d="M 52,140 A 30,30 0 0 0 22,110"/>
      <path d="M 82,140 A 60,60 0 0 0 22,80"/>
      <path d="M 122,140 A 100,100 0 0 0 22,40"/>
      <path d="M 172,140 A 150,150 0 0 0 22,-10"/>
    </g>
    <!-- candidate segments between adjacent layers -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="47" y1="123" x2="71" y2="104"/>
      <line x1="47" y1="123" x2="63" y2="96"/>
      <line x1="40" y1="116" x2="71" y2="104"/>
      <line x1="71" y1="104" x2="99" y2="76"/>
      <line x1="63" y1="96" x2="108" y2="88"/>
      <line x1="99" y1="76" x2="136" y2="43"/>
      <line x1="108" y1="88" x2="148" y2="63"/>
    </g>
    <!-- chosen track (one hit per layer) -->
    <polyline points="22,140 47,123 71,104 99,76 136,43" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- hits -->
    <g fill="#1e40af">
      <circle cx="47" cy="123" r="3.5"/><circle cx="40" cy="116" r="3"/>
      <circle cx="71" cy="104" r="3.5"/><circle cx="63" cy="96" r="3"/>
      <circle cx="99" cy="76" r="3.5"/><circle cx="108" cy="88" r="3"/>
      <circle cx="136" cy="43" r="3.5"/><circle cx="148" cy="63" r="3"/>
    </g>
    <!-- triplet bending angle at the middle hit -->
    <path d="M 84,91 A 20,20 0 0 1 90,88" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="71" y1="104" x2="90" y2="84" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="78" y="72" font-style="italic" fill="#b45309">s</text><text x="85" y="75" font-size="10" fill="#b45309">t</text>
    <!-- labels -->
    <text x="150" y="30" font-style="italic" fill="#1e40af">x</text><text x="158" y="33" font-size="10" fill="#1e40af">t</text>
    <text x="164" y="30" fill="#1e40af">= 1</text>
    <text x="118" y="104" font-style="italic" fill="#6b7280">y</text><text x="125" y="107" font-size="10" fill="#6b7280">e</text>
    <text x="178" y="140" font-size="12" fill="#374151">layers</text>
  </g>
</svg>
