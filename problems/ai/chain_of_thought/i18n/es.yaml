source_hash: 71b446fca9cd
title: Por qué la cadena de pensamiento ayuda a un transformer
summary: 'La paridad de $n$ bits es un XOR acumulado, una tarea intrínsecamente secuencial. Transformers diminutos idénticos (atención escrita a mano con einsum, todos los modelos apilados en un eje de modelo y entrenados en una sola ejecución) la aprenden en dos formatos: responder de inmediato, "$b_1 \dots b_n = p$", o escribir primero las paridades acumuladas, "$b_1 \dots b_n : s_1 \dots s_n = p$". Con los mismos pesos y pasos, los modelos con borrador responden bien al 98–100 % de las secuencias de prueba para $n = 4$ a $10$, mientras que los modelos directos solo ajustan $n = 4$ y quedan al nivel del azar o por debajo más allá; la atención muestra la regla de dos tokens $s_k = s_{k-1} \oplus b_k$. Un modelo de juguete del mecanismo, no de cómo razonan los grandes modelos de lenguaje.'
notes: 'Estado: el efecto mostrado está establecido. La paridad es el caso difícil de manual para un transformer de profundidad fija que debe responder de inmediato. Li, Liu, Zhou y Ma (ICLR 2024, arXiv 2402.12875) demuestran que los transformers de profundidad constante sin pasos intermedios están limitados a circuitos paralelos poco profundos (de tipo $\mathrm{TC}^0$, bajo sus supuestos de precisión), mientras que $T$ pasos de cadena de pensamiento les permiten simular un circuito secuencial de tamaño $T$. Nye et al. (2021, arXiv 2112.00114) entrenaron transformers para escribir un "borrador" (scratchpad) de resultados intermedios y los vieron resolver tareas de varios pasos como la suma larga y el seguimiento de programas; Wei et al. (2022, arXiv 2201.11903) dieron nombre al prompting de cadena de pensamiento (chain-of-thought prompting) para los grandes modelos de lenguaje. Método: una secuencia de $n$ bits se escribe directamente, "$b_1 \dots b_n = p$", o con sus paridades acumuladas,
  "$b_1 \dots b_n : s_1 \dots s_n = p$". Todos los modelos son el mismo decodificador de 2 capas, $d = 64$ y 4 cabezas (el código de `tiny_transformer`, con un eje de modelo $m$ añadido a cada einsum), entrenado con AdamW durante el mismo número de pasos y con el mismo lote de secuencias; los modelos CoT leen unas dos veces más tokens por secuencia y se entrenan con sus tokens intermedios, que es exactamente la ayuda extra que da un borrador. Todos los modelos, $n$ por formato por semilla, más los modelos de generalización en longitud, se entrenan en una sola ejecución: sus pesos se apilan en el primer eje y el recorte de gradiente se hace por modelo, de modo que nunca se influyen entre sí (un test lo comprueba). Datos: para $n \ge 8$ se reserva una cuarta parte de las $2^n$ secuencias (como máximo 1024), con las que nunca se entrena; para $n = 4$ y $6$ hay demasiado pocas secuencias para reservar alguna, así que esas precisiones (marcadas con asterisco en la gráfica) miden el ajuste, no
  la generalización. En la prueba, un modelo CoT escribe su propio borrador de forma voraz, token a token, y solo se puntúa su respuesta final. Veredicto, con la ejecución por defecto (2 semillas, números impresos en el terminal): (a) los modelos CoT responden correctamente 0.98 a 1.00 de las secuencias de prueba para $n = 4, 6, 8, 10$; los modelos directos ajustan las 16 secuencias de $n = 4$ (1.00) pero obtienen 0.53, 0.27 y 0.53 para $n = 6, 8, 10$. Una lectura plausible de la puntuación por debajo del azar en $n = 8$ (no comprobada aquí): una secuencia reservada difiere de sus vecinas de entrenamiento en un bit y por tanto tiene la paridad opuesta, y un modelo que interpola entre vecinas falla. (b) La generalización en longitud falla en ambos: los modelos entrenados con $1 \le n \le 8$ obtienen 0.46 a 0.51 en $n = 12$ y $16$, porque las posiciones más allá de 19 nunca se entrenaron y, con la disposición CoT usada aquí, el bit $b_k$ está $n + 1$ posiciones antes de la celda que lo necesita,
  un desfase que cambia con $n$; los modelos CoT de longitudes mixtas dominan $n = 4$ (1.00) pero ni siquiera $n = 8$ (0.56) con el presupuesto de pasos. (c) Ocultar el borrador tras $k$ pasos hace caer la respuesta al nivel del azar para todo $k < n$: la respuesta se copia de la última celda, así que todo el cálculo vive en los tokens escritos. (d) En el modelo CoT con $n = 8$, en cada paso $k$ alguna cabeza pone 0.5 a 0.8 de la atención de la consulta que escribe $s_k$ sobre $b_k$, frente a 0.08 con atención uniforme (una sola cabeza promedia 0.48 a lo largo de los pasos; las cabezas se reparten los pasos). La otra entrada de la regla, $s_{k-1}$, es el propio token de la consulta y llega a la salida por el flujo residual, así que la regla aprendida es local: dos tokens por paso. Límites: esto es un modelo de juguete que muestra el mecanismo, no cómo razonan los grandes modelos de lenguaje. No dice nada sobre si los pasos escritos de un modelo grande son fieles al cálculo que realmente
  produce su respuesta; esa es una pregunta de investigación abierta. Los resultados varían entre semillas y con el presupuesto de pasos, por eso se grafica cada semilla. Prueba más pasos, $n$ hasta 16, o una sola capa.'
meanings:
- 'paridad acumulada de cada prefijo: los objetivos del borrador, y $p = s_n$'
- secuencias en formato directo o CoT como ids de token $0, 1, :, =, \_$; rellenadas con blancos para que todos los modelos de un mismo $n$ compartan un tensor
- token más embedding de posición aprendido, cada modelo $m$ con sus propias tablas
- $c$ repetido ⇒ sumado; el índice de modelo $m$ no se suma, así que $M$ transformers independientes corren en un solo producto
- 'atención causal: cada fila es una distribución de probabilidad sobre las posiciones $j \le i$'
- 'qué tokens siguientes se entrenan: solo $p$ (directo), o $s_1 \dots s_n$, "=" y $p$ (CoT)'
- media de $-\log p$ sobre los tokens entrenados del modelo $m$ (nats); se minimiza su suma, y cada término solo llega a sus propios pesos
- en la prueba el modelo escribe su propio borrador, un token por pasada hacia delante, y responde después
labels:
  steps: Pasos de entrenamiento
  lengths: Longitudes de secuencia $n$ del experimento (a)
  seeds: Semillas por modelo
  d_model: Anchura del modelo $d$
  heads: Cabezas de atención $H$
  layers: Bloques transformer
  batch: Secuencias por paso
  lr: Tasa de aprendizaje
