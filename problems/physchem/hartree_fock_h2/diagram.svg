<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="H2 molecule: two protons a bond length R apart, each carrying a 1s basis function phi made of Gaussians, which combine into a bonding molecular orbital psi spread over both nuclei">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- bonding orbital envelope over both nuclei -->
    <path d="M40,78 C40,40 200,40 200,78 C200,116 40,116 40,78 z" fill="#93c5fd" fill-opacity="0.35" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- 1s basis functions on each atom -->
    <circle cx="82" cy="78" r="26" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="158" cy="78" r="26" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- bond axis -->
    <line x1="20" y1="78" x2="220" y2="78" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- nuclei -->
    <circle cx="82" cy="78" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="158" cy="78" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="76" y="122" font-size="13">H</text>
    <text x="152" y="122" font-size="13">H</text>
    <!-- bond length -->
    <line x1="84" y1="138" x2="156" y2="138" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="114" y="154" font-style="italic">R</text>
    <!-- labels -->
    <text x="50" y="50" font-style="italic" fill="#1e40af">φ<tspan font-size="10" dy="4">A</tspan></text>
    <text x="178" y="50" font-style="italic" fill="#1e40af">φ<tspan font-size="10" dy="4">B</tspan></text>
    <text x="112" y="40" font-style="italic" fill="#b45309">ψ<tspan font-size="10" dy="4">1</tspan></text>
  </g>
</svg>
