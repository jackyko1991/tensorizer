- अधिकतम चालकताएँ (120, 36, 0.3 mS/cm²) और उत्क्रमण विभव (50, −77, −54.4 mV)
- कुल आयनिक धारा; दोहराया गया $k$ ⇒ चैनलों पर योग
- 'तापमान गुणक ($Q_{10} = 3$): हर द्वार प्रति 10 °C 3× तेज़ होता है'
- अंतर-स्पाइक अंतरालों से स्थिर फायरिंग दर (Hz)
