source_hash: 56bd5dd35d76
title: तस्वीर से QR कोड पढ़ना
summary: 'संस्करण 1–3 का QR कोड शून्य से बनाएँ (फ़ाइंडर, टाइमिंग और अलाइनमेंट पैटर्न, BCH फ़ॉर्मेट बिट, दंड से चुना गया मास्क, GF(256) पर रीड–सोलोमन), उसे यादृच्छिक होमोग्राफी, धुंधलापन, शोर, असमान प्रकाश और ऊपर रखे अँगूठे के साथ फ़ोटो करें, और उसे एक टेंसर पाइपलाइन से वापस पढ़ें: अनुकूली सीमा, 1:1:3:1:1 फ़ाइंडरों के लिए मिलान फ़िल्टर, DLT होमोग्राफी और grid_sample, तालिका gathers के रूप में $\mathrm{GF}(2^8)$ अंकगणित के साथ BCH और रीड–सोलोमन डिकोडिंग।'
notes: 'ZXing जैसे असली रीडर यही रूपरेखा अपनाते हैं: स्थानीय सीमा से द्विआधारीकरण, फ़ाइंडर के 1:1:3:1:1 रन पैटर्न के लिए पंक्तियाँ स्कैन करना और स्तंभों व विकर्णों में उसकी पुष्टि, समकोण बनाने वाले तीन फ़ाइंडर चुनना, उनकी दूरी से मॉड्यूल आकार और संस्करण का अनुमान, जहाँ एक एफ़ाइन अनुमान उसे रखता है उसके पास अलाइनमेंट पैटर्न ढूँढना, परिप्रेक्ष्य रूपांतरण फ़िट करना, ग्रिड का नमूना लेना, फिर फ़ॉर्मेट और रीड–सोलोमन परतें डिकोड करना। यहाँ होमोग्राफी को grid_sample के माध्यम से ज्ञात मॉड्यूलों (फ़ाइंडर, टाइमिंग, अलाइनमेंट, शांत क्षेत्र) के छवि के साथ सहसंबंध को अधिकतम करके और निखारा भी जाता है, और संस्करण वह है जिसका टेम्पलेट सबसे अच्छा बैठता है। चार त्रुटि-सुधार स्तर L, M, Q, H लगभग 7, 15, 25 और 30 % कोडवर्ड बहाल करते हैं: $T$ ECC बाइट वाला एक ब्लॉक $\lfloor T/2 \rfloor$ अज्ञात बाइट त्रुटियाँ सुधारता है (यदि उनकी स्थितियाँ ज्ञात हों, erasures के रूप में, तो दोगुनी)। प्रतीक का अंश $f$ ढकने वाला धब्बा $f$ से अधिक कोडवर्ड को प्रभावित करता है, क्योंकि हर बाइट मॉड्यूलों का एक $2\times4$ ब्लॉक है, इसलिए
  सफलता वक्र उन प्रतिशतों से नीचे गिरते हैं। मास्क केवल डेटा मॉड्यूलों को छूते हैं और $M \oplus M = 0$, इसलिए अनमास्किंग वही XOR है; एनकोडर सभी 8 मास्क एक बैच के रूप में आज़माता है और सबसे कम दंड वाला रखता है (रन, $2\times2$ ब्लॉक, फ़ाइंडर जैसे दिखने वाले, गहरा संतुलन)। सत्यापन: रीड–सोलोमन एनकोडर ISO/IEC 18004 के हल किए गए उदाहरण (''01234567'' संस्करण 1-M के रूप में) के ECC बाइट पुनः उत्पन्न करता है और फ़ॉर्मेट शब्द मानक तालिका से मेल खाते हैं; बाकी की जाँच राउंड ट्रिप और शून्य सिंड्रोम से होती है। सरलीकरण: केवल बाइट मोड, संस्करण 1–3 (एक अलाइनमेंट पैटर्न, कोई संस्करण-सूचना ब्लॉक नहीं), कोई दर्पित प्रतीक नहीं, कोई erasure डिकोडिंग नहीं। संस्करण 1 में कोई अलाइनमेंट पैटर्न नहीं है, इसलिए तीव्र परिप्रेक्ष्य उसे सबसे अधिक हानि पहुँचाता है। संदर्भ: ISO/IEC 18004 (QR code symbology); I. S. Reed and G. Solomon, Polynomial codes over certain finite fields, J. SIAM 8 (1960) 300–304।'
meanings:
- दो तालिका gathers के रूप में GF(256) गुणनफल; $\alpha = 2$ सभी 255 अशून्य बाइट मॉड्यूलो $x^8+x^4+x^3+x^2+1$ (0x11D) उत्पन्न करता है; $\oplus$ XOR है
- 'योग सूचकांक $i$ पर XOR: 8 बिट समतलों में से हर एक को मॉड्यूलो 2 जोड़ें'
- 'सिस्टमैटिक रीड–सोलोमन: $G$ की पंक्ति $i$ है $x^{T+k-1-i} \bmod g(x)$, इसलिए ECC बाइट डेटा में रैखिक हैं'
- $\alpha^j$ पर मूल्यांकित ब्लॉक बहुपद; ठीक कोडवर्डों के लिए सब शून्य
- Berlekamp–Massey से त्रुटि लोकेटर (torch.where से बैच में), सभी स्थितियों पर Chien खोज से मूल, परिमाण $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$ (Forney)
- जनक 0x537, XOR 0x5412 वाला BCH(15,5); 32 कोडवर्डों में निकटतम 3 तक बिट त्रुटियाँ ठीक करता है
- 'गहरा जहाँ पिक्सेल अपने $31\times31$ बॉक्स माध्य (conv2d) माइनस $c$ से नीचे हो: असमान प्रकाश का अनुसरण करता है'
- पंक्तियों और स्तंभों के अनुदिश 11 स्केल $s$ पर 1:1:3:1:1 प्रोफ़ाइल के लिए मिलान फ़िल्टर $K^s$; शिखर फ़ाइंडर केंद्र हैं (विकर्णों के अनुदिश भी जाँचे गए)
- '3 फ़ाइंडर केंद्रों + अलाइनमेंट पैटर्न से DLT/SVD (संस्करण 1: समांतर चतुर्भुज कोना), फिर सभी ज्ञात मॉड्यूलों पर फ़िट के प्रवणता आरोहण से परिष्कृत'
- मॉड्यूल $(i, j)$ उसके भीतर $3\times3$ बिंदुओं पर पढ़ा गया; फिर अनमास्क (XOR, एक अंतर्वलन) और ज़िग-ज़ैग क्रम पढ़ें
labels:
  message: संदेश
  version: सबसे छोटा संस्करण (संदेश न समाए तो बढ़ाया जाता है)
  ecc: त्रुटि-सुधार स्तर
  perspective: परिप्रेक्ष्य प्रबलता (कोना विस्थापन / भुजा)
  occlusion: प्रतीक का ढका हुआ अंश
  noise: पिक्सेल शोर $\sigma$
