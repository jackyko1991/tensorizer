source_hash: 6345d973de84
title: 以光線傳遞矩陣分析雙透鏡系統
summary: 近軸光學就是線性代數：自由空間與薄透鏡都是作用在（高度、角度）光線向量上的 $2\times 2$ 矩陣。整個系統是一串矩陣乘積，作用在一批光線上，並在第二片透鏡逐漸遠離第一片時重新計算。
notes: 順序很重要：光最先遇到的元件是最右邊的因子。每個因子的行列式都是 1，因此任何排列都有 $\det M = 1$。觀察當透鏡 1 的中間像恰好落在透鏡 2 的焦點上（$d = sf_1/(s - f_1) + f_2$）時，像跑到無窮遠，然後從另一側以虛像的形式回來。
meanings:
- 光線 $r$：$j = 0$ 為高度 $h$，$j = 1$ 為角度 $\theta$
- 傳播距離 $d$（批次 $d$ 得到 (..., 2, 2)）
- 焦距 $f$ 的薄透鏡
- 在系統上再串接一個元件（重複的 $j$ 求和）；與 torch.linalg.multi_dot 相同
- 從物體到每個軸向取樣點 $z$ 的傳遞矩陣
- 一次縮並得到每條光線在每個 $z$ 的狀態
- 高度不再依賴發射角的位置
labels:
  s: 物距
  f1: 透鏡 1 焦距
  f2: 透鏡 2 焦距
  d_start: 初始透鏡間距
  d_end: 最終透鏡間距
  h0: 物高
  half_angle: 扇形半角
  n_rays: 扇形光線數
