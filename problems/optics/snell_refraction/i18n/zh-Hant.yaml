source_hash: 85a6136cffba
title: 分層介質中的司乃耳定律
summary: 一扇形光線穿過三層折射率不同的介質。向量形式的司乃耳定律以一次 einsum 同時折射所有光線，並在發生全反射處改為鏡面反射。
notes: 光線以速率 $c/n$ 前進，因此通過光線前端的虛線是波前：它在密介質中落後。在預設值下，底層是空氣（$n = 1$）；在該界面上比臨界角 $\arcsin(n_3/n_2)$ 更陡的光線發生全反射並往上返回。把兩個折射率設為相等，即可讓界面消失。
meanings:
- 光線 $r$ 的單位方向，分量 $i \in \{x, y\}$
- 面向入射光線的單位表面法向量
- 各光線所遇界面的折射率比 $n_1/n_2$
- 重複的 $j$ ⇒ 求和：各光線的 $\cos\theta_i$
- 折射方向（仍為單位向量）
- 鏡面反射方向，用於 $1 - \eta^2(1 - c^2) < 0$ 處（全反射）
labels:
  n1: 上層折射率 $n_1$
  n2: 中層折射率 $n_2$
  n3: 下層折射率 $n_3$
  n_rays: 扇形光線數
  max_angle: 最大光線角度
  t_max: 模擬時間
