source_hash: 539b278aa207
title: 理想氣體的卡諾循環
summary: 理想氣體的兩條等溫線與兩條絕熱線，取樣成 $(V, p)$ 點的張量。功是 $p$–$V$ 圖中圍出的面積，以 torch.trapezoid 計算；效率 $W/Q_h$ 恰好等於卡諾極限 $1 - T_c/T_h$。
notes: 熱只在等溫過程中穿越邊界：吸收 $Q_h = nRT_h\ln(V_2/V_1)$，放出 $Q_c = nRT_c\ln(V_3/V_4)$。因為絕熱線把體積比聯繫起來，$V_3/V_4 = V_2/V_1$，所以效率只依賴兩個溫度。壓縮過程朝較小的 $V$ 進行，因此 torch.trapezoid 自動給出負功。在 $T$–$S$ 圖中循環是一個矩形，其面積同樣是 $W$。體積從 $V_1 = 1$ 公升開始。
meanings:
- 循環第 $l$ 段上的第 $k$ 個取樣點（$l$ = 高溫等溫、絕熱、低溫等溫、絕熱）
- 等溫線，對體積張量逐元素計算
- 通過循環某個角點的絕熱線
- 重複的 $k$ ⇒ 求和：沿每段的功
- 對各段 $l$ 求和：圍出的面積
- 沿路徑的熵，用於 $T$–$S$ 圖
labels:
  T_h: 高溫熱庫 $T_h$
  T_c: 低溫熱庫 $T_c$
  ratio: 膨脹比 $V_2/V_1$
  n: 氣體量
  gas: 氣體
