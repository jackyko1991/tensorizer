  - {symbol: 'f(\tau)', code: 'chirp_frequency(tau, mc)', shape: '(T,)', meaning: 'Newtonian track $\frac1\pi(5/256\tau)^{3/8}\mathcal M_c^{-5/8}$, fitted to the ridge by Adam'}
notes: >
  On 14 September 2015 at 09:50:45 UTC both Advanced LIGO detectors recorded the merger of two black holes about
  410 Mpc away (Abbott et al., PRL 116, 061102, 2016), the first direct detection of gravitational waves. This page
  repeats a simplified version of the analysis on the open data. Raw strain is dominated by seismic and thermal
  noise below 30 Hz, so the PSD $S_n(f)$ is estimated with Welch's method (4 s Hann segments, 50 % overlap) and the
  data are divided by $\sqrt{S_n}$ (whitening); the page checks that the whitened PSD is flat, Parseval's theorem
  and that every template has $\langle h|h\rangle = 1$. The template bank uses the stationary-phase inspiral with a
  2PN phase for equal masses, cut at $f_\mathrm{peak} = 0.36/(2\pi M)$, the frequency where an equal-mass merger
  peaks in numerical relativity (or at the ISCO frequency, which loses most of the SNR). All templates and both
  detectors are filtered in one batch of FFTs. With the defaults the best template has $\mathcal M_c \approx 32\,M_\odot$,
  SNR about 16 (H1) and 10 (L1), and the two SNR peaks and the H1–(−L1) cross-correlation put Hanford 7–8 ms after
  Livingston (published: 6.9 +0.5/−0.4 ms; the L1 arm orientation flips the sign). A Newtonian fit to the Q-map
  ridge gives a heavier $\mathcal M_c \approx 37\,M_\odot$, and so does the 0PN bank: post-Newtonian terms slow the
  chirp at a given chirp mass, so a Newtonian model reads it as heavier. HONESTY: this is a teaching analysis, not
  the published one. The published values come from full inspiral–merger–ringdown waveforms with spins, a PSD from
  much longer data and Bayesian parameter estimation: detector-frame $\mathcal M_c \approx 30\,M_\odot$ and network
  SNR 24 (Abbott et al. 2016), source-frame $\mathcal M_c = 28.6^{+1.7}_{-1.5}\,M_\odot$, masses $35.6$ and $30.6\,M_\odot$,
  distance 440 Mpc in GWTC-1. Our SNRs are lower because the templates have no merger–ringdown and no spins, and
  because the PSD comes from only 16 s that include the signal. Data: GWOSC (Gravitational Wave Open Science
  Center), GW150914 release GWTC-1-confident v3, files H-H1_GWOSC_4KHZ_R1-1126259447-32 and the L1 equivalent, from
  gwosc.org/eventapi/json/GWTC-1-confident/GW150914/v3/, CC BY 4.0; 16 s from GPS 1126259455, low-passed at 900 Hz and
  decimated to 2048 Hz, stored as strain × 10⁻²¹ in data/gw150914_strain.csv. Please cite GWOSC (Abbott et al.,
  SoftwareX 13, 100658, 2021) and Abbott et al. 2016. Prizes: Shaw Prize in Astronomy 2016 (Drever, Thorne and
  Weiss, for conceiving and designing LIGO), Special Breakthrough Prize in Fundamental Physics 2016 (Drever, Thorne,
  Weiss and the LIGO contributors) and Nobel Prize in Physics 2017 (Weiss, Barish and Thorne).
