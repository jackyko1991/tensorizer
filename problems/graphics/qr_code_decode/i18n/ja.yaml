source_hash: 56bd5dd35d76
title: 写真から QR コードを読み取る
summary: バージョン 1–3 の QR コードを一から作り（ファインダ・タイミング・アライメントパターン、BCH 形式情報ビット、ペナルティで選ぶマスク、GF(256) 上のリード・ソロモン符号）、ランダムなホモグラフィ、ぼかし、ノイズ、不均一な照明、上にかぶさる親指を加えて撮影し、テンソルのパイプラインで読み戻します：適応的二値化、1:1:3:1:1 のファインダ用の整合フィルタ、DLT ホモグラフィと grid_sample、そして $\mathrm{GF}(2^8)$ 演算をテーブル参照（gather）で行う BCH とリード・ソロモンの復号。
notes: ZXing のような実際のリーダーも同じ流れに従います：局所閾値で二値化し、行を走査してファインダの 1:1:3:1:1 のランパターンを探し、列と対角線方向でも確認し、直角をなす 3 つのファインダを選び、その間隔からモジュールサイズとバージョンを推定し、アフィン推定が示す付近でアライメントパターンを探し、透視変換を当てはめ、グリッドをサンプリングして、形式情報とリード・ソロモンの層を復号します。ここではさらに、既知のモジュール（ファインダ、タイミング、アライメント、クワイエットゾーン）と画像との相関を grid_sample を通して最大化することでホモグラフィを磨き上げ、テンプレートが最もよく合うものをバージョンとします。4 つの誤り訂正レベル L、M、Q、H はコード語のおよそ 7、15、25、30 % を復元します：$T$ 個の ECC バイトを持つブロックは $\lfloor T/2 \rfloor$ 個の未知のバイト誤りを訂正できます（位置がわかっている消失誤りならその 2 倍）。シンボルの割合 $f$ を覆う汚れは、各バイトが $2\times4$ のモジュールのブロックなので、$f$ より多くのコード語に当たり、成功率の曲線はそれらの割合より手前で落ちます。マスクはデータモジュールにしか作用せず $M \oplus M = 0$ なので、マスク解除も同じ XOR です。エンコーダは 8 種類のマスクすべてを 1 バッチで試し、ペナルティ（ラン、$2\times2$ ブロック、ファインダに似た模様、暗モジュールの比率）が最小のものを残します。検証：リード・ソロモン符号器は ISO/IEC 18004 の計算例（'01234567' をバージョン 1-M で）の ECC バイトを再現し、形式情報語は規格の表と一致します。残りは往復変換とゼロシンドロームで確認します。簡略化：バイトモードのみ、バージョン 1–3（アライメントパターン 1 つ、バージョン情報ブロックなし）、鏡像シンボルなし、消失復号なし。バージョン 1 にはアライメントパターンがないので、強い透視歪みの影響を最も受けます。参考文献：ISO/IEC 18004 (QR code symbology)；I. S. Reed and G. Solomon, Polynomial codes
  over certain finite fields, J. SIAM 8 (1960) 300–304。
meanings:
- テーブル参照（gather）2 回による GF(256) の積。$\alpha = 2$ は $x^8+x^4+x^3+x^2+1$ (0x11D) を法として 255 個の非ゼロバイトすべてを生成する。$\oplus$ は XOR
- 和をとる添字 $i$ についての XOR：8 枚のビットプレーンそれぞれを 2 を法として足す
- 組織的リード・ソロモン符号：$G$ の第 $i$ 行は $x^{T+k-1-i} \bmod g(x)$ なので、ECC バイトはデータについて線形
- $\alpha^j$ で評価したブロック多項式。コード語のときちょうどすべてゼロ
- Berlekamp–Massey 法による誤り位置多項式（torch.where でバッチ化）、全位置にわたる Chien 探索で根を求め、大きさは $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$（Forney）
- 生成多項式 0x537、XOR 0x5412 の BCH(15,5)。32 個のコード語のうち最も近いものを選び、最大 3 ビットの誤りを訂正
- 画素が $31\times31$ のボックス平均（conv2d）から $c$ を引いた値より低ければ暗：不均一な照明に追従する
- 行と列に沿った 1:1:3:1:1 プロファイル用の整合フィルタ $K^s$ を 11 個のスケール $s$ で。ピークがファインダの中心（対角線方向でも確認）
- 3 つのファインダ中心 + アライメントパターン（バージョン 1：平行四辺形の角）から DLT/SVD で求め、既知のすべてのモジュールへの適合度を勾配上昇法で改良
- モジュール $(i, j)$ をその内部の $3\times3$ 点で読み取る。その後マスクを解除し（XOR、対合）、ジグザグ順に読む
labels:
  message: メッセージ
  version: 最小バージョン（メッセージが収まらなければ上げる）
  ecc: 誤り訂正レベル
  perspective: 透視の強さ（角のずれ / 辺の長さ）
  occlusion: シンボルが隠される割合
  noise: 画素ノイズ $\sigma$
