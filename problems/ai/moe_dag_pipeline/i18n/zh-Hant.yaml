source_hash: 2c6e3e6a24cf
title: 工作流程 DAG 就是一個路由器固定的專家混合模型
summary: 一個 MNIST 數字 $d$ 加上一段三個字的文字（例如 "now plus three"），給出答案 $y = (d \circ k) \bmod 10$；單靠任何一種模態都不夠。把這條管線寫成 Snakemake 風格的工作流程（encode_image、encode_text、每種運算一條 fuse 規則並由輸入函式選擇、classify），交給 Willis 環問題的張量 DAG 引擎執行時，它算出的結果與 top-1 專家混合（mixture-of-experts）層完全相同，只要該層的路由矩陣 $G$ 固定為規則所做的選擇。接著是單一張量程式才允許的四個階段：學習得到的路由器、分開訓練再串接的專家、對整個 DAG 做一次反向傳播，以及蒸餾成一個以 int8 儲存的小型稠密網路。這是一個連結已知結果的框架，不是新的定理。
notes: 構想。這個框架出自 Jacky Ka Long Ko：建構 Willis 環工作流程（medical/cow_workflow_dag）時發現，一個 Snakemake DAG 可以是單一張量程式，而這樣的程式看起來就像多模態的專家混合模型。精確地說：工作流程 DAG 是一個路由器固定的 MoE；MoE 則是一個依輸入選擇邊的 DAG。這是一個連結已知結果的框架，不是新的定理，本問題建構它的一個小實例。等價性。data/Snakefile 含有規則 encode_image、encode_text、fuse（每個樣本、每種運算一個作業，萬用字元為 $op$）、classify 與 collect；classify 透過輸入函式 `routed` 讀取輸入，此函式指名樣本文字中那個運算的 fuse 輸出。引擎用 cow_workflow_dag 的剖析器解析該檔案，並由其 Kronecker 區塊建立作業鄰接矩陣；條件邊的區塊是 $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$，因此路由矩陣 $G$ 就位在鄰接矩陣之中，而 $N E$ 個 fuse 作業中只需要被選中的 $N$ 個（一次布林反向傳遞，就像 Snakemake 修剪作業一樣）。逐層執行、每條規則一次批次呼叫，它給出的 logits 與 Switch 風格的層（以累計名次建立分派張量 $D$、所有專家在一次批次 einsum 中計算、再合併）相同，條件是 $G$ 固定為規則的選擇且閘值為 1：在全部 1000 個測試樣本 × 2 個種子上，float32 下逐位元相同，float64 下差距在 $4 \times 10^{-15}$ 以內（堆疊乘積與分組乘積的加總順序不同），每處的預測都一樣。這是同一計算的兩種寫法之間的恆等式，不是實驗發現。學習得到的路由器。在文字特徵上使用 softmax 閘、top-1 路由與 Switch 負載平衡損失（$\alpha = 0.01$），編碼器凍結，兩種變體並列比較。放在工作流程本身的 fuse 專家之前時，閘單獨就能重新發現規則：預設 800 步後，運算 $e$ 在 0.85 ± 0.03 的測試樣本上被送往專家 $e$（準確率 0.82，固定路由器為
  0.92），而且仍在上升（試跑中 1500 步後為 0.95 與 0.90）。與全新的專家一起學習時則不然：路由與運算的對應不比隨機好（取最佳專家排列為 0.35；1/3 代表毫無關聯），專家保持混雜，準確率停在 0.40。fuse 專家看不到文字，因此忽略運算的路由會讓每個專家面對不可能的任務；但一開始沒有任何專家在任何運算上較好，所以 top-1 閘得不到打破對稱的訊號。在試跑中，閘雜訊、大 100× 的閘初始化、500 步的稠密（soft）暖身以及 $\alpha = 0.1$ 都沒有改變這一點（不屬於預設執行）。較大的 MoE 能從零成功訓練其路由器；這個玩具例子只說明，在這裡固定的規則並不是能免費重新發現的。階段。(2) 分開訓練：每個專家各自處理子任務，影像專家（一個 MLP）學數字標籤（測試準確率 0.916），文字專家（一層 einsum 注意力）學數字詞（1.000），fuse 專家從 one-hot 輸入學 300 項的表（1.000）；不經聯合訓練、直接透過 DAG 串接，管線答對 0.924 的測試配對（高於數字準確率，因為乘以 0 或乘以 5 能容忍部分錯誤數字）。(3) 端到端微調，對所有階段做一次反向傳播：0.924，沒有提升；瓶頸在影像專家，而聯合損失並未帶來關於數字的新資訊（同樣的 3000 張影像）。(4) 一個稠密學生網路（784 + 45 → 64 → 64 → 10，57 930 個權重，為管線 108 766 個的 0.53）在 $T = 4$ 下蒸餾（損失 $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 交叉熵）：0.85–0.86，在 0.85–0.87 的樣本上與教師一致，且在 3000 步結束時仍在進步；逐通道 int8：0.85–0.86，58.9 kB 而非 232 kB（管線為 435 kB）。在單一 CPU 執行緒上處理 1000 個測試配對的時間：DAG 引擎 90 ms，同一 DAG 寫成一個 MoE 層 19 ms（引擎還要建立作業區塊），學生 3.4 ms，int8 學生 3.5 ms（以反量化的浮點數計算，所以這裡較小但並非真的較快），而每個作業呼叫一次（如排程器在不計程序啟動的情況下執行）為 900–1000 ms。不能推出的結論。只有在同一記憶體空間中屬於張量程式的階段，才能無複製地融合並傳遞梯度：以檔案為基礎的工具（OpenFOAM、VMTK、大部分生物影像分析）做不到，由它們組成的
  Snakemake DAG 仍是程序構成的 DAG。Willis 環的加速主要來自省去每個作業的程序啟動與檔案 I/O，而非批次處理。端到端訓練也只有在某個階段能學到分開訓練沒有給它的東西時才有幫助；這裡並沒有。相關研究。Neural Module Networks（Andreas et al. 2016）依剖析器選出的模組為每個問題組裝網路，即依輸入選擇的 DAG；稀疏閘控 MoE（Shazeer et al. 2017）與 Switch Transformer（Fedus et al. 2021，本文所用的 top-1 路由與負載平衡損失）；LIMoE（Mustafa et al. 2022）與 Uni-MoE（Li et al. 2024）中的模態專家；模型縫合（Lenc & Vedaldi 2015；Bansal et al. 2021）透過學習得到的介面連接分開訓練的網路，正如階段 2 透過機率向量所做的；知識蒸餾（Hinton et al. 2015）；DSPy（Khattab et al. 2023）端到端最佳化整條語言模型呼叫管線。Google 的 Pathways（2021 年的一篇部落格文章與願景）描述一個模型，將每個任務路由到它所需的部分。資料。MNIST（LeCun, Cortes & Burges；LeCun et al. 1998），授權 CC BY-SA 3.0：3000 張訓練影像（每個數字 300 張）與 1000 張測試影像（每個數字 100 張），取檔案順序中各數字的最前幾張，以 uint8 打包（0.7 MB，data/mnist_train.npz, data/mnist_test.npz，依相同授權再散布；data/SOURCES.md 記載來源、校驗和與處理方式）。文字為生成：一個運算詞（plus、minus、times）、一個數字詞（zero 到 nine）和一個填充詞（now、then），順序隨機；測試文字使用固定種子。裝置與限制。附帶的數字來自在 CPU 上的預設執行（本專案環境在此沒有 PyTorch 的 CUDA 版本；權重約 $10^5$ 個，GPU 也幫不上忙）：在一台忙碌的 6 核心機器上，訓練與量測加上 GIF 約需 75–150 s。所有種子在模型軸上一起訓練，各自使用自己的小批次，每個種子都會繪出。這是只有一個數字和三種運算的玩具例子：它展示結構，而非大型多模態
  MoE 的行為。
meanings:
- 以 medical/cow_workflow_dag 的剖析器從 data/Snakefile 解析出的規則圖，加上輸入函式 `routed`（一條條件邊 classify ← fuse）
- 作業層級區塊：cow_workflow_dag 的 Kronecker 積（每個萬用字元軸 sample、op 各取 $I$、$\mathbb 1$、$\mathbb 1^\top$）；對條件邊則以路由器遮罩，因此 classify 的作業 $n$ 讀取 fuse 的作業 $(n, e)$ 若且唯若 $G_{ne} = 1$
- 工作流程的路由器：運算詞的 one-hot，由規則（輸入函式）求得，而非學習得到
- 目標所依賴的作業，$\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$：$N E$ 個 fuse 作業中只有 $N$ 個
- 引擎：規則逐層執行，每條規則對其所需作業做一次批次呼叫（fuse：其 $op$ 萬用字元的每個值一次呼叫）
- 樣本 $n$ 對應到專家 $e$ 的槽位 $c$（它在被路由到該處的樣本中的名次），如同 GShard/Switch；容量 $C$ = 最大的組
- 所有專家在一次批次乘積中計算；$m$ 是模型（種子）軸，從不加總
- 合併：對 $e$ 與 $c$ 加總，每個樣本只有一個非零項，因此當 $g = G$ 時等於 DAG 的輸出
- 學習得到的路由器：文字特徵上線性閘的 softmax；top-1 路由，輸出乘以 $p$
- Switch 負載平衡：$f_e$ = 路由到 $e$ 的比例，$P_e$ = 平均閘機率；平衡且均勻時為 1，崩塌時為 $E$
- 溫度 $T$ 下的 Hinton 蒸餾；學生損失為 $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ 交叉熵（相對於真實答案）
- 逐輸出通道的對稱 int8，$s_o = \max_i |W_{io}|/127$；以 int8 加上每通道一個 float32 縮放係數儲存
labels:
  seeds: 種子數（模型軸上的模型）
  split_steps: 階段 2 步數（每個專家處理其子任務）
  router_steps: 階段 1b 步數（學習得到的路由器）
  global_steps: 階段 3 步數（端到端微調）
  student_steps: 階段 4 步數（蒸餾）
  student_hidden: 學生寬度 $H$
  temperature: 蒸餾溫度 $T$
  balance_weight: 負載平衡權重 $\alpha$
