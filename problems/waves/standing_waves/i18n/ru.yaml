source_hash: 902cc4c799f5
title: Стоячие волны на струне
summary: 'Одномерное волновое уравнение для струны с закреплёнными концами. Вторая производная становится матрицей (конечно-разностный шаблон $D_{ij}$), так что один einsum продвигает все точки нескольких струн сразу: первые гармоники и защипнутую струну.'
notes: 'Строки с 1 по $n$ начинаются в форме одной гармоники $\sin(n\pi x/L)$ и просто «дышат» на месте с частотой $f_n = nc/2L$: стоячая волна. Защипнутая струна (треугольник) — сумма многих гармоник, поэтому её излом разделяется на две части, которые бегут к концам, переворачиваются и возвращаются. Через один период основного тона $2L/c$ каждая форма возвращается в исходное положение. Шаг по времени подчиняется условию Куранта $c\,\Delta t \le \Delta x$; энергия $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$ (на единицу линейной плотности) постоянна, поскольку струна не затухает.'
meanings:
- смещение струны $b$ во внутренней точке сетки $i$ (два закреплённых конца исключены)
- 'матрица второй производной: $-2$ на диагонали, $1$ рядом с ней'
- 'повторяющийся $j$ ⇒ суммирование: $\partial_x^2 u$ для каждой струны'
- центральная разность по времени (схема «чехарда»)
- 'собственные значения $D$ дают $\omega_n^2 = -c^2\lambda_n$: гармоники'
