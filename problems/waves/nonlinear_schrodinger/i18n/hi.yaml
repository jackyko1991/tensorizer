title: दैत्य तरंगें (अरैखिक श्रोडिंगर)
summary: 'फोकसकारी अरैखिक श्रोडिंगर समीकरण गहरे-पानी के तरंग समूहों और प्रकाशिक तंतुओं में प्रकाश स्पंदों के आवरण का वर्णन करता है। एकसमान तरंग शृंखला अस्थायी है: छोटी लहरें पृष्ठभूमि से लगभग तीन गुना ऊँचे शिखरों में बढ़ जाती हैं, दैत्य तरंगों (rogue waves) की तरह। split-step Fourier से हल: परिक्षेपण $k$-समष्टि में सटीक, अरैखिकता $x$-समष्टि में सटीक।'
notes: 'Strang splitting: आधा परिक्षेपण चरण, पूरा अरैखिक चरण, आधा परिक्षेपण चरण; द्वितीय-कोटि सटीक और यह $N$ को round-off तक बनाए रखता है। मॉड्यूलेशनल अस्थिरता: ऊँचाई 1 की पृष्ठभूमि पर तरंग संख्या $K < 2$ वाले विक्षोभ बढ़ते हैं, सबसे तेज़ $K = \sqrt2$ पर दर 1 से। **modulation** मोड में पृष्ठभूमि $10^{-3}$ यादृच्छिक शोर (स्थिर seed) से शुरू होती है: $t \approx 8$ के बाद शिखर प्रकट होते हैं और बनते-मिटते रहते हैं। Peregrine breather $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$ पृष्ठभूमि से एक बार उठता है, ठीक उसकी ऊँचाई के $3\times$ तक पहुँचता है और गायब हो जाता है; **peregrine** मोड इसे $t = -5$ पर शुरू करता है। **soliton** मोड चमकीला सॉलिटॉन $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$ छोड़ता है जो हमेशा अपनी आकृति बनाए रखता है। धराशायी रेखा $|\psi| = 3$ दर्शाती है। लंबाई 60 का आवर्ती बॉक्स।'
meanings:
- आवर्ती ग्रिड पर सम्मिश्र तरंग आवरण (complex128)
- परिक्षेपण $i\psi_t = -\tfrac12\psi_{xx}$ का आधा चरण, हर फ़ूरिए विधा के लिए सटीक
- 'दोहराया गया $l$ ⇒ योग: विविक्त फ़ूरिए रूपांतरण'
- अरैखिकता $i\psi_t = -|\psi|^2\psi$ का एक चरण, सटीक क्योंकि $|\psi|$ नहीं बदलता
- $\int|\psi|^2$ और $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$, दोनों संरक्षित
labels:
  mode: प्रारंभिक अवस्था
  noise: शोर आयाम (modulation)
  eta: सॉलिटॉन की ऊँचाई $\eta$
  t_max: सिमुलेशन समय
