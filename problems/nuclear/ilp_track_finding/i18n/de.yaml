source_hash: 16a2fcec9827
title: Teilchenspurfindung als ganzzahliges Programm
summary: 'Echte Treffer aus einer simulierten HL-LHC-Kollision (TrackML-Challenge, CC BY 4.0) werden durch ein ganzzahliges lineares Programm zu Spuren verbunden: Man wählt Treffer-Tripletts mit konsistenter Krümmung und konsistentem Polarwinkel, wobei jeder Treffer höchstens einmal verwendet wird. Unser Tensor-PDLP (primal-dualer hybrider Gradient mit Neustarts, das LP-Verfahren in OR-Tools und cuOpt) löst die LP-Relaxation live auf dünnbesetzten Tensoren, rundet sie anschließend und repariert sie. Verglichen wird es mit einer handgeschriebenen ungarischen Referenz (Kuhn–Munkres) und mit Offline-Läufen von HiGHS, Gurobi und scipy: Abstand im Zielfunktionswert, Effizienz, Fake-Rate, der offizielle TrackML-Score und die Skalierung der Laufzeit $t \propto N^k$.'
notes: 'Status: ein Werkzeugvergleich, kein offenes Problem. Das ILP ist ein Set-Packing-Problem (im Allgemeinen NP-schwer); PDLP ist ein LP-Verfahren erster Ordnung, und das Runden liefert eine heuristische ganzzahlige Lösung, kein zertifiziertes Optimum, daher wird der Abstand zum exakten Optimum stets angegeben. Die duale Schranke von PDLP liefert auch ohne exakten Löser eine zertifizierte obere Schranke. Methode. Kandidatensegmente verbinden Treffer auf benachbarten Lagen, die eine von der Strahlachse kommende Spur mit $p_T \ge p_{T,\min}$ verbinden könnte. Tripletts verbinden zwei Segmente über einen gemeinsamen mittleren Treffer und erhalten den Score $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ (nur $s_t > 0$ wird behalten). Das ILP wählt Tripletts $x_t$ und Segmente $y_e$: Jeder Treffer hat höchstens ein gewähltes eingehendes und ein ausgehendes Segment, sodass Spuren Ketten sind. Ein gewähltes Segment setzt sich auf jeder Seite in höchstens ein gewähltes
  Triplett fort, und jedes Segment kostet $\lambda = 0.1$. Seine LP-Relaxation ($0 \le x, y \le 1$) wird von unserem PDLP (Applegate et al. 2021) gelöst: PDHG mit Ruiz-Skalierung, KKT-basierten Neustarts zum Mittelwert und Aktualisierungen des primalen Gewichts, geschrieben mit torch.sparse, sodass es auf CPU oder CUDA läuft. Die ungarische Referenz löst pro Lagenpaar eine exakte lineare Zuordnung (zuerst das mittlere Paar, dann nach innen und nach außen, mit Triplett-Kosten auf Basis der bisherigen Kette). Das ist ein bipartites Matching, das exakt in polynomieller Zeit gelöst wird, aber es entscheidet jeweils nur ein Lagenpaar, während das ILP ganze Ketten global gewichtet. Deshalb unterscheiden sich seine Spuren. Daten. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), Trainingsereignis 1000 (200 Pile-up-Kollisionen): Zenodo-Eintrag 4730167, doi:10.5281/zenodo.4730167, Lizenz CC BY 4.0 (Salzburger, Innocente, Vlimant, Rousseau et al.). Es wird auf das Pixel-Barrel (Volumen 8,
  4 Lagen) mit $|\eta| < 1$ beschnitten: 11 519 Treffer, 2 452 Teilchen und 6% Rauschen, dazu die offiziellen Gewichte pro Treffer. Offline-Benchmark (data/solver_benchmark.csv) auf einem AMD Ryzen 5 5600G (1 Thread): HiGHS über scipy 1.18.1 (milp, linprog), Gurobi 13 über gurobipy mit seiner größenbeschränkten Lizenz (höchstens 2000 Variablen und 2000 Nebenbedingungen, daher nur $\Delta\phi \le 30°$), scipys linear_sum_assignment sowie unser PDLP auf der CPU und auf einer NVIDIA GTX 1080 Ti. NVIDIA cuOpt 26.10 wurde in WSL installiert, konnte aber nicht laufen: Seine Kernel sind für Compute Capability 7.0 (Volta) und neuer gebaut, die 1080 Ti hat 6.1 (cudaErrorNoKernelImageForDevice); es wird daher übersprungen und hat keine Zahlen. Der zitierte Stand der Technik steht in data/trackml_sota.csv. Fazit. Auf allen acht Sektoren (5° bis 360°, 151 bis 11 519 Treffer) war die LP-Relaxation scharf: Das LP-Optimum von HiGHS stimmt bis auf $10^{-13}$ mit dem MILP-Optimum überein. Unser PDLP mit
  Reparatur erreichte jedes Mal dasselbe Optimum (Abstand unter $10^{-9}$), mit genau den Tripletts, die HiGHS und Gurobi wählten (0 abweichend). Das ist empirisch, nicht garantiert: Set Packing ist NP-schwer, und hier hält die Kettenstruktur mit vier Lagen das LP scharf. Bei kontinuierlichen Scores sind exakte Gleichstände unwahrscheinlich, daher stimmen Löser, die das Optimum erreichen, überein. Während des Laufs ist etwa ein Drittel der PDLP-Werte gebrochen, viele nahe $\tfrac12$, wo konkurrierende Tripletts fast gleichauf liegen (zum Beispiel Doppeltreffer in überlappenden Modulen); sie stabilisieren sich, während PDLP konvergiert. Die ungarischen Ketten liegen 0 bis 2.2% unter dem Optimum (5 bis 651 abweichende Tripletts) und treffen den Zuordnungs-Zielwert von scipy exakt (eine Kontrolle unseres ungarischen Algorithmus). Vollständige Barrel-Teilmenge (360°): Effizienz 93.1% und Fake-Rate 13.0% für die ILP-Löser gegenüber 90.9% und 16.2% für den ungarischen Algorithmus, TrackML-Score
  0.495 gegenüber 0.482. Ein perfekter Tracker der rekonstruierbaren Teilchen käme hier auf 0.618; der zitierte Stand der Technik für vollständige Ereignisse liegt bei 0.88 bis 0.94 (Mikado 0.944 in 0.56 s). Skalierung über $N \ge 1000$ Treffer: HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, unser PDLP auf der CPU $N^{0.92}$, auf der GPU $N^{0.36}$ (bei 10 000 Variablen dominiert noch der Startaufwand der Kernel, daher ist die 1080 Ti noch nicht schneller), unser ungarischer Algorithmus $N^{2.14}$ (schlimmster Fall $O(n^3)$; dünnbesetzte, gefilterte Kosten halten die augmentierenden Pfade kurz), scipy $N^{1.57}$. Gurobi passt nur bis 860 Treffer in seine Größenbeschränkung (dort $N^{1.04}$). Bei diesen Größen ist HiGHS so schnell wie PDLP; Verfahren erster Ordnung lohnen sich erst bei viel größeren LPs. Auf kleinen Sektoren findet der ungarische Algorithmus etwas mehr Teilchen (97.4% gegenüber 94.8% bei 30°): Die ILP-Zielfunktion ist ein Stellvertreter, nicht die physikalische Metrik. Vorbehalte.
  Unsere Instanzen sind ein Barrel-Sektor mit 4 Lagen, daher haben Spuren höchstens 4 Treffer und es gibt keine Endkappen: einfacher als die vollständigen Ereignisse der Challenge und anders. Der Vergleich der TrackML-Scores ist indikativ, nicht unter gleichen Bedingungen: Etwa 40% des Score-Gewichts der Teilmenge entfallen auf Teilchen unterhalb des $p_T$-Schnitts oder mit weniger als 3 Lagen innerhalb des Schnitts, und unsere Zeiten decken ein Zehntel eines Ereignisses ab und schließen Einlesen und Kandidatenaufbau aus. Echte Tracker (ACTS und die eigenen der Experimente) verwenden kombinatorische Kalman-Filter, und graphbasierte neuronale Netze (Exa.TrkX) sind der wichtigste Ansatz des maschinellen Lernens; niemand löst ein MILP pro Ereignis.'
meanings:
- 'echte TrackML-Treffer auf den 4 Lagen des Pixel-Barrels, beschnitten auf einen $\Delta\phi$-Sektor: die Problemgröße'
- Trefferpaare auf benachbarten Lagen mit $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ und $|z_0| \le 150$ mm, alle Paare auf einmal
- Krümmung des Kreises durch die Strahlachse und beide Treffer
- Tripletts teilen sich den mittleren Treffer; eine Helix hat auf beiden Hälften dieselben $\kappa$ und $\theta$, daher sinkt $s_t$ mit der Abweichung
- Zeilen für Treffer-Exklusivität (ein Segment hinein, eines hinaus) und Kontinuitätszeilen; wiederholtes $v$ ⇒ in jedem Produkt summiert
- PDHG auf dem Ruiz-skalierten LP mit Mittelung, Neustarts und primalem Gewicht; zwei dünnbesetzte Matrix-Vektor-Produkte pro Iteration
- Segmente nach LP-Wert ordnen, konfliktfreie in parallelen Runden annehmen, Kettenenden kürzen, die mehr kosten als sie einbringen
- 'Kuhn–Munkres mit Potentialen: eine exakte lineare Zuordnung pro Lagenpaar, zu Spuren verkettet'
- 'offizieller TrackML-Score: Summe der Gewichte der Treffer auf Spuren, die > 50% eines Teilchens enthalten und zu > 50% aus diesem Teilchen bestehen'
labels:
  dphi: Sektorbreite $\Delta\phi$ (Problemgröße)
  pt_min: Minimaler Transversalimpuls $p_{T,\min}$
  max_iter: Maximale Anzahl PDLP-Iterationen
  digits: PDLP-Zielgenauigkeit $10^{-k}$, $k$ =
  check: Iterationen zwischen Neustartprüfungen (je ein Bild)
