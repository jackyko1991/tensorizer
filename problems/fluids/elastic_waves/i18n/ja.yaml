source_hash: 36e54b56debf
title: 弾性波：P波とS波
summary: 弾性体に対するナビエ–コーシー方程式。1点を短く押すと2つの波が出ていく：速い縦波の P 波（$\nabla\cdot\mathbf u$ に見える）と、遅い横波の S 波（$\nabla\times\mathbf u$ に見える）である。両項とも2階微分の1つの表 $\partial_i\partial_j u_k$ の縮約である——繰り返し添字の異なる2回の einsum。
notes: $\rho = 1$、セルサイズ 1 の単位系。時間積分はリープフロッグ法 $u^{n+1} = 2u^n - u^{n-1} + \Delta t^2\,\ddot u^n$。方程式の発散をとると $\theta = \partial_j u_j$ に対する速さ $c_P$ の波動方程式が、回転をとると速さ $c_S < c_P$ の回転に対する波動方程式が得られる——岩石では $c_P \approx 1.7\,c_S$ であり、地震の P 波が先に到着し S 波が数秒遅れて来るのはこのためである。点力は P 波を主に力の方向に、S 波を主にそれと垂直な方向に放射する。2つのローブ状のパターンがそれを示している。破線の円は予言される波面 $c\,(t - t_0)$ で、$t_0$ は波源ウェーブレットのピーク時刻である。減衰境界は波が端に達する前に吸収する（実際のコードでは完全整合層を用いる）。ポアソン比が ½ に近い（$\lambda \gg \mu$）と $c_P$ が大きくなり、小さな時間刻みが必要になる。
meanings:
- 変位場、各節点での成分 $i \in \{x, y\}$
- 中心差分によるすべての2階微分
- 繰り返される $j$（2番目と3番目の位置）⇒ 発散の勾配
- 繰り返される $j$（1番目と2番目の位置）⇒ 各成分のラプラシアン
- 中心で一方向に加える短いメキシカンハット型の押し
- 体積変化（P）と回転（S）
- リープフロッグの1ステップ；クーラン数 $S > 1$ は計算が発散するので受け付けない
labels:
  lam: ラメ定数 $\lambda$
  mu: 剛性率 $\mu$
  direction: 力の方向
  courant: クーラン数 $S$
  t_max: シミュレーション時間
