source_hash: b577c14eb932
title: Wie viele Dimensionen? Das Budget der Projektionshypothese
summary: 'Eine spekulative Hypothese, keine gesicherte Physik: Wie viele verborgene Dimensionen braucht die Projektionsidee, und wie viele lassen Experimente zu? Die Quantenseite braucht nach Schritt 1 eine verborgene komplexe Dimension pro Ausgang und $2^N$ für $N$ verschränkte Teilchen, aber diese leben im Hilbertraum und müssen keine Richtungen im Raum sein. Auf der Gravitationsseite verändern $n$ kompakte Dimensionen mit Radius $R$ das Newtonsche Gesetz unterhalb von $R$. Torsionswaagen, der LHC sowie Schranken aus Supernovae und Neutronensternen füllen Schranke für Schranke eine $(n, R)$-Karte. Jedes $n$ überlebt, aber nur wenn $R$ klein ist: unter 38.6 μm für $n = 1$ und $2\times10^{-10}$ m für $n = 2$. Eingeschränkt, nicht ausgeschlossen.'
notes: 'Status: spekulativ; eingeschränkt, nicht ausgeschlossen. Schritt 3 der Projektionshypothese (die eigene spekulative Idee des Autors, siehe die Beschreibung der Serie; keine gesicherte Physik), zu Postulat P5: Quanteneffekte brauchen eine gewisse Zahl $d_Q$ und die Gravitation eine gewisse Zahl $d_G$ von Dimensionen, geschätzt, nie von Hand festgelegt. Schritt 1 (cosmology/projection_postulate) ergab, dass der Projektionswettlauf genau eine verborgene komplexe Dimension pro Ausgang braucht; Schritt 2 (cosmology/projection_one_particle) zerschnitt eine Weltlinie; Schritt 4 (cosmology/projection_singularity_fold) behandelt Singularitäten als Falten der Projektion. Kein $n$ wird angenommen: Die Karte durchläuft $n = 0$ bis $n_{max}$ und $R$ von der Planck-Länge bis 1 m. Zuerst die bekannte Physik. (a) Quantenseite: Der Wettlauf reproduziert die Bornsche Regel mit $d + K$ Dimensionen für $K$ Ausgänge, und $N$ verschränkte Zweiniveausysteme brauchen einen Hilbertraum der Dimension $2^N$;
  die Standard-Quantenmechanik verwendet denselben Raum, und seine Dimensionen sind keine Richtungen im Raum. Läse man sie als räumliche Richtungen, bräuchten $N$ Qubits $2^{N+1} - 3$ zusätzliche reelle Dimensionen (5 für ein Bell-Paar), eine Zahl, die sich jedes Mal ändern würde, wenn Teilchen verschränkt werden, was keine feste räumliche Mannigfaltigkeit tut. (b) Gravitationsseite: In $3 + n$ Raumdimensionen liefert das Gaußsche Gesetz eine Anziehung $G_D M/r^{n+2}$ (geprüft durch autograd-Flüsse durch $S^{n+2}$ für $n = 0..6$). Sind die $n$ Dimensionen Kreise mit Radius $R$, macht die Bildsumme daraus jenseits von $R$ das Newtonsche $G_4 M/r^2$ mit $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ (geprüft für $n = 1, 2, 3$). Knapp außerhalb liefert das erste Kaluza–Klein-Gravitonniveau einen Yukawa-Term mit $\alpha = 8n/3$ ($16/3$ für einen 2-Torus, wie in der PDG-Übersicht) und $\lambda = R$. Die ADD-Relation von Arkani-Hamed, Dimopoulos und Dvali (1998) in der Konvention $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$,
  die die PDG und die LHC-Experimente verwenden, reproduziert die PDG-Zahlen: $R = 30$ μm, $n = 2$ ergibt $M_D = 4.0$ TeV, und $M_D = 1$ TeV erfordert $10^{12}$ m, 0.5 mm, ..., 0.1 MeV$^{-1}$ für $n = 1..6$. Schranken (data/gravity_bounds.csv, zitierte Zahlen; die Torsions- und LHC-Zeilen sind die in cosmology/hierarchy_extra_dimensions mitgelieferten, erneut zitiert). Die Eöt-Wash-Torsionswaagen schließen $|\alpha| = 1$ oberhalb von 56 μm aus (Kapner et al., PRL 98, 021101, 2007) und oberhalb von 38.6 μm (Lee et al., PRL 124, 101101, 2020); da $\alpha\geq 1$ für jedes $n$ gilt, ist $R > 38.6$ μm für alle $n\geq 1$ ausgeschlossen (konservativ: Die gemessene Kurve fällt bei größerem $\lambda$ weiter). Für $n = 2$ geben Tan et al. (PRL 116, 131101, 2016) $R < 30$ μm an. Die ATLAS-Monojet-Suche (PRD 103, 112006, 2021, CC-BY 4.0) ergibt $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV für $n = 2..6$. Die Abkühlung von SN1987A ergibt $M_D > 27$ (2.4) TeV für $n = 2$ (3) (Hanhart et al., PLB 509, 1, 2001),
  und die Aufheizung von Neutronensternen durch eingefangene KK-Gravitonen ergibt $M_D > 1700$ (76) TeV (Hannestad und Raffelt, PRD 67, 125008, 2003), beide wie in der PDG-Übersicht 2024 zitiert. Jede Schranke wird zu einer booleschen Maske auf dem $(n, R)$-Gitter, und Testpunkte werden gegen von Hand gerechnete Antworten geprüft. Ergebnis: $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, Neutronensterne), $2.6\times10^{-12}$ m ($n = 3$) und LHC-Radien für $n = 4..6$ ($5\times10^{-13}$ bis $2.5\times10^{-15}$ m). Für $n\geq 7$ ist nur die Torsionsschranke mitgeliefert; die LHC-Grenzen werden mit $n$ langsam schwächer und würden, extrapoliert (hier nicht durchgeführt), $R$ in Richtung $1/M_D\sim 10^{-20}$ m drücken. ADD mit $M_D = 1$ TeV, die ursprüngliche Lösung des Hierarchieproblems, ist für $n = 1..6$ ausgeschlossen. Das Budget: Minimum $n = 0$, weil die Gravitation keine zusätzliche räumliche Dimension braucht und verborgene Quantendimensionen nicht räumlich sein müssen;
  kein Maximum, weil die Daten jedes $n$ zulassen, wenn $R < R_{max}(n)$. Welche Lesart die Hypothese wählt: die Hilbertraum-Lesart für P1 und P2 (verborgene Dimensionen sind Dimensionen des Zustandsraums, daher ist $D_Q\geq 2^N$ keine Einschränkung für den Raum) und die geometrische Lesart für P4 und P5 (Einbettungsdimensionen; kann sich die Gravitation in sie ausbreiten, müssen sie kompakt und kleiner als $R_{max}(n)$ sein, andernfalls sind sie Koordinaten der Einbettung, keine Orte, an die man gelangen kann). Urteil: eingeschränkt, nicht ausgeschlossen, und keine neue Vorhersage: Die Hypothese würde erst testbar, wenn sie $n$ und $R$ nahe diesen Schranken festlegte.'
meanings:
- 'wiederholtes $i$ ⇒ summiert: die nach außen gerichtete Anziehung an zufälligen Punkten von $S^{n+2}$ (autograd); der Fluss ist bei jedem Radius gleich'
- 'die Masse und ihre Bilder um die $n$ Kreise, summiert über den Bildindex $I$: $1/r^{n+2}$ innen, $G_4/r^2$ außen'
- 'größter Radius, den eine zitierte Schranke zulässt: $\lambda_{max}$ für Torsionswaagen, der ADD-Radius bei $M_D = M_b$ für Collider- und astrophysikalische Grenzen'
- eine boolesche Karte pro Schrankenfamilie, über das gesamte Gitter gebroadcastet
- 'das Dimensionsbudget: kompakte Dimensionen sind nur unterhalb dieses Radius erlaubt'
- fundamentale Skala der Gravitation für $n$ Dimensionen mit Radius $R$ (Giudice–Rattazzi–Wells-Konvention, wie sie die PDG verwendet)
- Hilbertraum-Dimension $2^N$, die $N$ verschränkte Qubits brauchen (Schritt 1)
labels:
  n_max: Größte Zahl zusätzlicher Dimensionen $n$ auf der Karte (alle $n$ ab 0 werden durchlaufen)
  R_points: Radien auf der Karte, logarithmisch verteilt von der Planck-Länge bis 1 m
  M_star: Fundamentale Skala $M_D$ für die ADD-Linie
  qubits: Verschränkte Qubits $N$ für die Quantenzählung
