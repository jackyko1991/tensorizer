title: 'मोंटे कार्लो: यादृच्छिक डार्ट से $\pi$ का अनुमान'
summary: 'एक इकाई वर्ग पर यादृच्छिक डार्ट फेंकिए और गिनिए कि कितने चौथाई वृत्त के अंदर गिरते हैं: यह अनुपात $\pi/4$ की ओर जाता है। कई स्वतंत्र प्रयोग एक ही $(B, N)$ टेंसर में साथ-साथ चलते हैं, जो मोंटे कार्लो का मूल नियम दिखाता है: त्रुटि केवल $1/\sqrt N$ की तरह घटती है। बफ़ॉन की सुई 18वीं सदी का एक दूसरा अनुमान देती है।'
notes: 'हर अनुमान औसतन सही है पर शोरयुक्त है, और शोर केवल $1/\sqrt N$ की तरह घटता है: एक और सही अंक के लिए सौ गुना अधिक डार्ट। यह दर आयाम पर निर्भर नहीं करती, इसीलिए मोंटे कार्लो कई चरों वाले समाकलों के लिए पसंदीदा विधि है, न्यूट्रॉन परिवहन और आइज़िंग मॉडल से लेकर ऑप्शन मूल्य निर्धारण और चिकित्सा डोसिमेट्री में फ़ोटॉन पथों तक। धूसर वक्र अलग-अलग प्रयोग हैं: हर एक भटकता है, पर सभी $\sigma_N$ द्वारा तय पट्टी में रहते हैं। स्थिर सीड हर रन को पुनरुत्पादनीय बनाते हैं; अधिक प्रयोग आज़माइए और देखिए कि फैलाव सिद्धांत से और करीब मेल खाता है।'
meanings:
- प्रयोग $b$ का डार्ट $n$, निर्देशांक $i$, $[0, 1)$ में समान रूप से वितरित
- 'दोहराया गया $i$ ⇒ योग: कोने से दूरी का वर्ग; 1 यदि डार्ट चौथाई वृत्त के अंदर है'
- 'संचयी योग को $n$ से भाग: हर प्रयोग के लिए हर डार्ट के बाद का अनुमान'
- प्रयोगों के बीच फैलाव; सिद्धांत $\sqrt{\pi(4-\pi)/n}$ द्विपद प्रसरण से
- 'बफ़ॉन की सुई: प्रायिकता $2\ell/(\pi d)$ से एक रेखा को काटती है, अतः $\hat\pi = 2\ell N/(d\,\text{crossings})$'
labels:
  n_darts: प्रति प्रयोग डार्ट $N$
  n_experiments: प्रयोग $B$
  needle_length: सुई की लंबाई $\ell/d$
