title: Noise and the Langevin equation
category: others
level: intermediate
order: 2
summary: >
  A Brownian particle in a harmonic trap is kicked at random by the molecules around it. The Langevin equation
  adds this noise term, $\sqrt{2\gamma k_BT}\,dW$, to Newton's law; Euler–Maruyama steps a whole ensemble of
  particles at once in one batch tensor, and the spread of positions settles to the Boltzmann distribution
  $N(0, k_BT/k)$ (equipartition).
animated: true
vector_form: 'm\,d\mathbf v = \left(-\gamma\,\mathbf v - k\,\mathbf x\right)dt + \sqrt{2\gamma k_BT}\;d\mathbf W,\qquad d\mathbf x = \mathbf v\,dt,\qquad \langle dW\,dW\rangle = dt'
index_form: 'v_{b,n+1} = v_{bn} + \frac{-\gamma\,v_{bn} - k\,x_{bn}}{m}\,\Delta t + \frac{\sqrt{2\gamma k_BT\,\Delta t}}{m}\,\xi_{nb} \qquad x_{b,n+1} = x_{bn} + v_{b,n+1}\Delta t \qquad \langle \xi_{nb}\,\xi_{n''b''}\rangle = \delta_{nn''}\delta_{bb''} \qquad \langle x^2\rangle_n = \tfrac1B\,x_{nb}\,x_{nb}'
translation:
  - {symbol: 'x_{bn},\ v_{bn}', code: 'x, v', shape: '(B,)', meaning: 'position and velocity of particle $b$ at step $n$: the whole ensemble is one batch'}
  - {symbol: '\xi_{nb}', code: 'torch.randn(x.shape, generator=gen)', shape: '(B,)', meaning: 'the noise tensor, one row per step: independent standard normals (fixed seed)'}
  - {symbol: '\frac{\sqrt{2\gamma k_BT\Delta t}}{m}', code: 'noise_amplitude(gamma, T, m, dt)', shape: 'scalar', meaning: 'size of the random kick per step; it scales as $\sqrt{\Delta t}$, not $\Delta t$'}
  - {symbol: '\frac{-\gamma v_{bn} - k x_{bn}}{m}', code: 'drift(x, v, gamma, k, m)', shape: '(B,)', meaning: 'deterministic acceleration: friction plus spring'}
  - {symbol: 'v_{b,n+1},\ x_{b,n+1}', code: 'euler_maruyama_step(x, v, xi, ...)', shape: '(B,), (B,)', meaning: 'Euler–Maruyama step; the position uses the new velocity (symplectic Euler)'}
  - {symbol: '\tfrac1B\,x_{nb}x_{nb}', code: "einsum('tb,tb->t', x, x) / B", shape: '(T,)', meaning: 'ensemble average: repeated $b$ ⇒ summed over particles'}
  - {symbol: 'k_BT/k,\ k_BT/m', code: 'equipartition(T, k, m)', shape: 'scalars', meaning: 'equilibrium $\langle x^2\rangle$ and $\langle v^2\rangle$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$'}
notes: >
  Newton's law with friction alone would let the particle come to rest at the bottom of the trap (the bold red
  curve). Real particles in a fluid never stop: molecules hit them from all sides, and that random force is the
  noise or error term of the Langevin equation. Its size is not free. The fluctuation–dissipation theorem fixes it
  to $\sqrt{2\gamma k_BT}$, so the same collisions that cause the friction $\gamma$ also kick the particle, and the
  ensemble settles at temperature $T$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$
  (equipartition), with positions distributed as $N(0, k_BT/k)$. The Wiener increment $dW$ has variance $dt$, so in
  a finite step it becomes $\sqrt{\Delta t}\,\xi$ with $\xi \sim N(0,1)$; the velocity kick per step has variance
  $2\gamma k_BT\Delta t/m^2$. If the noise were scaled with $\Delta t$ instead, it would vanish as the step shrinks:
  random kicks add up like a random walk, so their spread grows like $\sqrt{t}$. Because the equation is linear, the
  ensemble mean $\langle x\rangle$ follows the noise-free damped oscillator exactly (dashed black on red), while each
  single trajectory wanders. Try $T = 0$ (pure damped oscillator), a large $\gamma$ with a small $m$ (overdamped
  Brownian motion: $\langle x^2\rangle$ relaxes at rate $2k/\gamma$ without oscillating), or a small $\gamma$ (slow
  approach to equilibrium). Simplifications: reduced units with $k_B = 1$, one dimension, white (uncorrelated)
  noise, and a first-order scheme whose equilibrium variances carry an $O(\Delta t)$ bias.
params:
  temperature: {default: 1.0, min: 0, max: 5, step: 0.1, label: 'Temperature $k_BT$'}
  gamma: {default: 0.5, min: 0.05, max: 10, step: 0.05, label: 'Friction $\gamma$'}
  k: {default: 1.0, min: 0.2, max: 5, step: 0.1, label: 'Stiffness $k$'}
  m: {default: 1.0, min: 0.1, max: 5, step: 0.1, label: 'Mass $m$'}
  n_particles: {default: 2000, min: 50, max: 5000, step: 50, type: int, label: 'Number of particles $B$'}
  t_max: {default: 40.0, min: 5, max: 100, step: 5, label: 'Duration $t_{max}$'}
