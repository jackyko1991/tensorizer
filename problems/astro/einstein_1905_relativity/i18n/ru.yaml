source_hash: 278f16a6d4b6
title: 'Эйнштейн, 1905: движущиеся тела и $E = mc^2$'
summary: Путь самого Эйнштейна через две его статьи 1905 года по теории относительности. Из двух постулатов — одинаковые законы во всех инерциальных системах отсчёта, свет всегда движется со скоростью $c$ — набор световых часов показывает, что время движущихся часов замедляется в $\gamma$ раз, стержни укорачиваются в $1/\gamma$ раз, одновременность зависит от наблюдателя, а скорости при сложении никогда не превышают $c$. Статья о массе и энергии (тело, излучающее световую энергию $L$, теряет массу $L/c^2$) проверяется на дефекте массы He-4 и аннигиляции $e^+e^-$, а подгонка к счёту мюонов Фриша и Смита 1963 года на горе Вашингтон и на уровне моря даёт $\gamma \approx 9$.
notes: 'Это одна из четырёх статей Эйнштейна «чудесного года» 1905 — точнее, сразу две: «К электродинамике движущихся тел» (июнь) и «Зависит ли инерция тела от содержащейся в нём энергии?» (сентябрь). Остальные — статья о световых квантах (quantum: Фотоэффект и кванты света) и о броуновском движении (thermodynamics: Случайное блуждание и диффузия). Об относительности как геометрии см. Специальная теория относительности: диаграммы Минковского (astro), о тензоре поля — преобразование Лоренца для $F^{\mu\nu}$ (em), о столкновениях — Четырёхимпульс и двухчастичный распад (nuclear). Единицы $c = 1$, расстояние между зеркалами $D = 1$. Рассуждение Эйнштейна о массе: покоящееся тело излучает $L/2$ вперёд и $L/2$ назад; в системе, движущейся со скоростью $v$, свет уносит $\gamma L$, больше чем $L$, и сохранение энергии в обеих системах требует, чтобы кинетическая энергия тела уменьшилась на $L(\gamma - 1)$ — ровно столько, сколько несла бы масса $L/c^2$ (он оставил только низкоскоростной член $\tfrac12
  (L/c^2)v^2$). Атомные массы — AME2020. Реальные данные (data/frisch_smith_1963_muons.csv): D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508 — мюоны, замедленные до одной и той же энергии, $563 \pm 10$ в час на высоте 1917 м на горе Вашингтон и $408 \pm 9$ в час на уровне моря (опубликованные значения измерений; в сводке Википедии последнее округлено до 412). Полёт длится около 6.4 мкс, почти три времени жизни мюона по 2.2 мкс, так что без замедления времени долетало бы лишь около 30 в час; по счёту часы мюона показывают 0.71 мкс и $\gamma \approx 9.1 \pm 0.8$ (в статье, с измеренной кривой распада: $8.8 \pm 0.8$). Предсказание по скоростям интегрирует торможение от $\beta \approx 0.995$ до $\approx 0.989$ в воздухе (ионизационные потери $dE/dx$, изотермическая атмосфера): около 8.4, как в статье. Росси и Холл (1941) впервые показали эффект на мюонах космических лучей на озере Эхо и в Денвере.'
meanings:
- 'фотон часов $b$ в момент $t$: горизонтальная скорость $\beta_b$, вертикальная $\sqrt{1-\beta_b^2}$, то есть всегда $c$'
- один тик длится $\gamma\cdot 2D/c$; тики отсчитываются по зигзагу
- набор бустов вдоль $x$, $\eta = \operatorname{diag}(-1, 1, 1, 1)$
- 'повторяющийся $\nu$ ⇒ суммирование: каждое событие в каждой системе; вспышки в поезде получают $\Delta t'' = -\gamma\beta\Delta x$'
- интервал, не меняющийся ни при каком бусте
- 'два световых импульса из движущейся системы: вместе $\gamma L$, поэтому $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$'
- 'дефект массы × 931.494 МэВ/а.е.м. (He-4: 28.30 МэВ)'
- шаги Ньютона с autograd по $\chi^2(\gamma)$ для двух скоростей счёта мюонов
