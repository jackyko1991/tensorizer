title: 'कुरामोतो मॉडल: स्वतःस्फूर्त समकालन'
summary: 'एक साथ चमकते जुगनू, साझा तख़्ते पर रखे मेट्रोनोम, पेसमेकर कोशिकाएँ: अलग-अलग प्राकृतिक आवृत्तियों $\omega_i$ वाले दोलक, जिनमें से प्रत्येक दूसरों की ओर खिंचता है, युग्मन $K$ के एक सीमा पार करते ही अचानक ताल में बंध जाते हैं। सम्मिश्र माध्य क्षेत्र $r e^{i\psi} = \frac1N \sum_j e^{i\theta_j}$ सब-से-सब योग को $O(N)$ काम में बदल देता है, युग्मनों का पूरा बैच एक साथ चलता है, और क्रम प्राचल $r$ $K_c = 2/(\pi g(0))$ पर उछलकर बढ़ता है, लॉरेन्ट्ज़ियन आवृत्तियों के लिए सटीक ऑट–एंटोनसेन वक्र $r = \sqrt{1 - K_c/K}$ का अनुसरण करते हुए।'
notes: 'कुरामोतो (1975) ने मॉडल को स्व-संगत रूप से हल किया और सममित एकशिखरी आवृत्ति घनत्व $g$ के लिए $K_c = 2/(\pi g(0))$ पाया; स्ट्रोगैट्ज़ (2000) यह कहानी बताते हैं। ऑट और एंटोनसेन (2008) ने सिद्ध किया कि लॉरेन्ट्ज़ियन $g(\omega) = (\gamma/\pi)/(\omega^2 + \gamma^2)$ के लिए अनंत-$N$ गतिकी एक ही समीकरण $\dot r = -\gamma r + \tfrac K2 r(1 - r^2)$ में सिमट जाती है, जिसकी स्थायी अवस्था $r = \sqrt{1 - 2\gamma/K}$ है: $N = 1200$ के साथ अनुकरण लगभग $0.01$ तक इससे मेल खाता है। $K_c$ से नीचे $r$ केवल $1/\sqrt N$ कोटि का परिमित-आकार शोर है। गाउसीय आवृत्तियों की सीमा छोटी होती है, $K_c = 2\sigma\sqrt{2\pi}/\pi \approx 1.6\,\sigma$ (हरा)। धीमी वृद्धि (लाल) $K$ बढ़ने के साथ वक्र का अनुसरण करती है; वृत्त माध्य क्षेत्र के फ़्रेम में दोलकों को $\omega_i$ के अनुसार रंगकर दिखाता है: छोटे $|\omega_i|$ वाले पहले ताल में बंधते हैं, तेज़ वाले बहते रहते हैं। तीसरा पैनल एक छोटा अतिरिक्त भाग है: अस्थानीय युग्मन और कला विलंब $\alpha = \pi/2 - 0.18$ वाले एक वलय पर समान दोलक एक समकालित और एक असंबद्ध क्षेत्र में बँट
  जाते हैं, यह काइमेरा अवस्था है जिसे कुरामोतो और बट्टोग्तोख (2002) ने खोजा और एब्राम्स और स्ट्रोगैट्ज़ (2004) ने यह नाम दिया। माध्य कला ठीक माध्य आवृत्ति पर बहती है क्योंकि $\sin(\theta_j - \theta_i)$ प्रतिसममित है।'
meanings:
- प्राकृतिक आवृत्तियाँ, लॉरेन्ट्ज़ियन (या गाउसीय) घनत्व के $N$ समान-प्रायिकता अंतरालों में से प्रत्येक में एक यादृच्छिक चयन
- 'बैच के प्रत्येक सदस्य के लिए एक युग्मन: हर समष्टि समानांतर में विकसित होती है'
- सम्मिश्र माध्य क्षेत्र, दोहराया गया $j$ ⇒ औसत; $r = 0$ असंबद्ध, $r = 1$ पूर्ण समकालन
- 'प्रत्येक दोलक केवल माध्य क्षेत्र को महसूस करता है: $O(N^2)$ के बजाय $O(N)$'
- धीमा युग्मवार योग, संदर्भ के रूप में रखा गया; परीक्षण जाँचते हैं कि यह माध्य-क्षेत्र रूप के बराबर है
- लॉरेन्ट्ज़ियन आवृत्तियों के लिए सटीक $N \to \infty$ क्रम प्राचल, $K_c = 2\gamma$ से ऊपर $\sqrt{1 - 2\gamma/K}$
- काइमेरा अवस्था के लिए वलय पर अस्थानीय युग्मन $(1 + A\cos x)/2\pi$
labels:
  n_oscillators: दोलक $N$
  width: आवृत्ति फैलाव $\gamma$ (लॉरेन्ट्ज़ियन) या $\sigma$ (गाउसीय)
  k_max: सबसे बड़ा युग्मन $K$
  n_couplings: बैच में युग्मन
  t_relax: प्रति युग्मन विश्रांति समय
  ramp_time: $K$ की धीमी वृद्धि की अवधि
  distribution: वृद्धि में दिखाया गया आवृत्ति घनत्व
  seed: यादृच्छिक बीज
