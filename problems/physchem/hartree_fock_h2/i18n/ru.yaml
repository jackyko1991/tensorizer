title: Метод Хартри–Фока для $\mathrm{H_2}$ в минимальном базисе STO-3G
summary: Классический расчёт самосогласованного поля Сабо и Остлунда, записанный тензорами. Каждый атом водорода несёт одну 1s-функцию из трёх гауссианов (STO-3G); интегралы перекрывания, кинетической энергии, притяжения к ядрам и двухэлектронные интегралы имеют замкнутую форму, матрица Фока — свёртка матрицы плотности с тензором $(\mu\nu|\lambda\sigma)$, а уравнения Рутана $FC = SC\varepsilon$ решаются с помощью eigh сразу для целого пакета длин связи. При $R = 1.4$ bohr получается $E = -1.1167$ hartree; сканирование находит длину связи и показывает, почему ограниченный метод Хартри–Фока не может разорвать связь.
notes: 'Атомные единицы: длины в bohr ($a_0 = 0.529$ Å) и энергии в hartree ($E_h = 27.21$ eV). Базис — STO-3G со слейтеровскими показателями $\zeta_{\mathrm H} = 1.24$ и $\zeta_{\mathrm{He}} = 2.0925$, как у Сабо и Остлунда, Modern Quantum Chemistry (1982; издание Dover 1996), глава 3; при двух базисных функциях каждая матрица имеет размер $2\times2$, так что каждое число можно сверить с книгой: $S_{12} = 0.6593$, $T_{11} = 0.7600$, $E = -1.1167$ hartree при $R = 1.4$ bohr и $-2.8607$ hartree для $\mathrm{HeH^+}$ при $R = 1.4632$ bohr. ССП начинается с $P = 0$ (гамильтониан остова); для $\mathrm{H_2}$ симметрия фиксирует орбитали $\psi_{1,2} \propto \phi_A \pm \phi_B$ и сходимость достигается сразу, тогда как $\mathrm{HeH^+}$ требует около дюжины проходов, пока заряд перетекает на гелий. Каждая длина связи — элемент пакета, поэтому ССП выполняется для всей кривой в одном цикле. Ограниченный метод Хартри–Фока помещает оба электрона на одну и ту же пространственную орбиталь $\psi_1$; при
  больших $R$ это состояние наполовину $\mathrm{H + H}$ и наполовину ионное $\mathrm{H^+ + H^-}$, поэтому кривая поднимается намного выше $2E_{\mathrm H}$. Штриховая кривая — полное конфигурационное взаимодействие в том же базисе (синглетная матрица $3\times3$ из $|1^2\rangle$, $|1^12^1\rangle$, $|2^2\rangle$): оно подмешивает $|2^2\rangle$, правильно диссоциирует, а его отличие от RHF в равновесии (около $-0.02$ hartree) — энергия корреляции. Минимальный базис далёк от точной энергии $\mathrm{H_2}$, $-1.1745$ hartree при $R = 1.4$ bohr; более крупным базисам нужны p- и d-функции и общие рекуррентные формулы для гауссовых интегралов. Попробуйте $\mathrm{HeH^+}$: там кривая RHF действительно выходит на правильный предел $\mathrm{He + H^+}$, потому что оба электрона оказываются на гелии.'
meanings:
- три гауссовых показателя на функцию, $\alpha_p\zeta^2$, и коэффициенты сжатия с включённой нормировкой примитивов $(2\alpha/\pi)^{3/4}$
- два ядра (и центры базиса) для каждой длины связи $R_b$ в пакете
- произведение двух гауссианов — один гауссиан с центром в $P = (\alpha A + \beta B)/(\alpha + \beta)$
- 'повторяющиеся $p, q$ ⇒ суммирование: сжатие по примитивам; то же для $T$, $V$'
- $-\sum_c Z_c\,\tfrac{2\pi}{\alpha+\beta}\,e^{-\dots}F_0\big((\alpha+\beta)|P - C|^2\big)$ с функцией Бойса $F_0(t) = \tfrac12\sqrt{\pi/t}\,\mathrm{erf}\sqrt t$
- парные тензоры бра и кет транслируются друг относительно друга, затем $p, q, r, t$ суммируются одним einsum
- 'симметричная ортогонализация (по Лёвдину): $X^{\mathsf T}SX = 1$'
- кулоновская матрица $J$; повторяющиеся $\lambda, \sigma$ ⇒ суммирование
- 'обменная матрица $K$: тот же тензор, прочитанный с переставленными индексами'
- один пакетный eigh на проход ССП; $C = XC^{\prime}$
- 'число электронов по Малликену: ровно 2'
- потенциальная кривая, по одному элементу на длину связи
