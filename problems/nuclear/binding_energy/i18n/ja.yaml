source_hash: 895c388f37ef
title: 原子核の結合エネルギー
summary: 半経験的質量公式（液滴模型）は、体積項、表面項、クーロン項、非対称項、対項の5項からあらゆる原子核の結合エネルギーを与える。ブロードキャストで $(Z, N)$ 格子全体について一度に評価すると、鉄とニッケルが最も強く結合している理由と、安定の谷の位置がわかる。
notes: 体積による結合は $A$ に比例して増えるが、表面の核子は隣接核子が少なく（$-A^{2/3}$）、陽子間の斥力は $Z^2/A^{1/3}$ のように増える。これらのつり合いにより $B/A$ の最大は $A \approx 56$–$62$ 付近になる。軽い原子核の核融合と重い原子核の核分裂がどちらもエネルギーを放出するのはこのためである。非対称項は原子核を $N = Z$ へ引き寄せ、クーロン項は重い原子核を $N > Z$ へ押しやる。両者が合わさって曲がった安定の谷 $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$ ができる。この公式は中重核では約 1 % の精度をもつが、非常に軽い原子核（⁴He は液滴よりはるかに強く結合している）や魔法数における殻効果は再現できない。既定の係数はよく使われる最小二乗フィットであり、係数を変えるとどの項がどの特徴を形づくるかがわかる。
meanings:
- 列方向に陽子数、行方向に中性子数
- 列と行をブロードキャストで足すと表全体が埋まる
- 偶偶核で $+a_P/\sqrt A$、奇奇核で $-a_P/\sqrt A$、奇数 $A$ で 0
- 核図表上の全原子核の結合エネルギー（MeV）
- 核子1個あたりの結合エネルギー（ヒートマップ）
- 各質量数で最も強く結合した同重体（赤線）
- $\partial B/\partial Z = 0$ から得られる $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$
labels:
  a_V: 体積項 $a_V$
  a_S: 表面項 $a_S$
  a_C: クーロン項 $a_C$
  a_A: 非対称項 $a_A$
  a_P: 対項 $a_P$
  z_max: 格子上の最大の $Z$
