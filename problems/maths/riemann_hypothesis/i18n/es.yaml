source_hash: a175ef505737
title: La hipótesis de Riemann en miles de ceros
summary: Localizar miles de ceros no triviales de $\zeta$ en la recta crítica con la fórmula de Riemann–Siegel en forma tensorial, contarlos frente a la ley de Riemann–von Mangoldt $N(T) = \theta(T)/\pi + 1 + S(T)$ y la ley de Gram, comparar sus espaciados y su correlación de pares con matrices hermíticas aleatorias (GUE) y reconstruir a partir de ellos la escalera de potencias de primos $\psi(x)$. La hipótesis en sí, que todo cero no trivial tiene parte real $\frac12$, sigue abierta.
notes: 'Esta página complementa el problema «La función zeta de Riemann y los números primos» (maths/zeta_primes), que construye $\zeta$ desde cero con Euler–Maclaurin, encuentra los primeros ceros y reconstruye $\pi(x)$; léalo primero para lo básico. Aquí, la fórmula de Riemann–Siegel, más rápida, con sus correcciones $C_0, C_1, C_2$ (derivadas de $\Psi$ obtenidas de una serie de Chebyshov), evalúa $Z(t)$ en un cuarto de millón de alturas y encuentra todos los ceros en la recta crítica por debajo de $T$; para $t \ge 100$ coincide con una evaluación de alta precisión (mpmath) con un error menor que $10^{-5}$. Por debajo de $t = 1000$ encuentra 649 cambios de signo y por debajo de 5000 encuentra 4520, exactamente el número total de ceros en la banda hasta esas alturas (calculado de forma independiente con mpmath), así que todos están en la recta; la función de conteo sigue $\theta(T)/\pi + 1$ con una pequeña fluctuación $S(t)$ de media cero. La ley de Gram se cumple en la mayoría de los puntos
  de Gram y falla por primera vez en $g_{126} \approx 282.45$. Tras normalizar a espaciado medio 1, los ceros se repelen exactamente como los autovalores de grandes matrices hermíticas aleatorias (GUE): Montgomery (1973) conjeturó la correlación de pares $1 - (\sin \pi u / \pi u)^2$ y la demostró, suponiendo la hipótesis de Riemann, para funciones test con soporte de Fourier en $(-1, 1)$, y los cálculos de Odlyzko cerca del cero $10^{20}$-ésimo la confirman de forma espectacular; a las bajas alturas consideradas aquí la concordancia ya es buena. La fórmula explícita (von Mangoldt 1895, demostrada) convierte los ceros en los primos: cada par $\frac12 \pm i\gamma$ añade una onda $x^{1/2}\cos(\gamma\ln x)$, y con miles de ceros $\psi(x)$ se convierte en una escalera nítida. La hipótesis de Riemann, que todo cero no trivial tiene parte real $\frac12$, es uno de los problemas del Premio del Milenio del Instituto Clay y está abierta. Se ha verificado para todos los ceros hasta la altura $3\times10^{12}$
  (Platt y Trudgian 2021). Resultados demostrados que se muestran en la banda: no hay ceros en $\operatorname{Re} s = 1$ (Hadamard, de la Vallée Poussin 1896, equivalente al teorema de los números primos) y la región libre de ceros $\sigma > 1 - 1/(5.558691\ln t)$ (Mossinghoff y Trudgian 2015), reflejada por la ecuación funcional. Afirmado, no establecido: en octubre de 2026, OpenAI publicó (según se ha informado; no hemos revisado los manuscritos), en su repositorio público openai/math de manuscritos generados por IA, un supuesto semiplano libre de ceros $\operatorname{Re} s > 7/8$ para $\zeta$ y toda función $L$ de Dirichlet, junto con un argumento complementario para $\operatorname{Re} s > 11/12$. Estas prepublicaciones no han sido revisadas por pares ni verificadas de forma independiente; si fueran correctas, una banda libre de ceros de anchura fija sería un avance importante, aunque todavía lejos de la recta $\frac12$. Ningún cálculo puede demostrar la hipótesis: una búsqueda finita
  solo puede encontrar ceros en la recta, o un contraejemplo.'
meanings:
- '$n$ repetido ⇒ sumado: la suma principal para 250 000 alturas a la vez, enmascarada a $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$'
- $\Psi$ es entera, pero el cociente es $0/0$ en $p = \frac14, \frac34$; un ajuste de Chebyshov lo elimina
- 'las correcciones de Riemann–Siegel: una serie de Chebyshov se deriva término a término, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- cambios de signo de $Z$ en una malla de paso 0.02, y luego 32 pasos de bisección en todos los intervalos a la vez
- conteo de ceros menos su parte suave; se mantiene pequeño y tiene media 0
- todos los puntos de Gram por Newton a la vez; la ley de Gram dice $(-1)^n Z(g_n) > 0$
- diferencias entre ceros normalizados $x = \theta(\gamma)/\pi + 1$ y sus $J = 10$ vecinos siguientes, para la correlación de pares
- 'cada cero en cada $x$, acumulado sobre los ceros: una fila por altura $T$'
labels:
  t_max: Altura $T$
  x_max: Fórmula explícita hasta $x$
