source_hash: e3a181f70abb
title: Дифракционная решётка как сумма фазоров
summary: Дальнее поле $N$ щелей — сумма $N$ комплексных фазоров, по одному на щель, каждый задержан на дополнительный путь $d\sin\theta$. С комплексными тензорами вся картина — один einsum. При росте $N$ от 2 до 20 главные максимумы остаются на месте, но становятся острее, а между ними появляются $N-2$ слабых побочных максимума.
notes: 'Правая панель изображает $N$ фазоров, приставленных друг к другу, при одном угле. В главном максимуме ($d\sin\theta = m\lambda$) все они направлены одинаково и складываются в длину $N$. При отходе от максимума цепочка закручивается и замыкается в многоугольник при $N\phi = 2\pi$: это первый нуль, угол которого убывает как $1/N$. Интенсивности нормированы на 1 в центральном пике; пунктирные линии отмечают $d\sin\theta = m\lambda$. От ширины щели $a$ зависит только огибающая дифракции на одной щели.'
meanings:
- номер щели; щель $n$ находится на расстоянии $nd$ от щели 0
- направление наблюдения на мелкой сетке
- фазовый множитель щели $n$ под углом $t$
- 'повторяющийся $n$ ⇒ суммирование: сложение волн от всех щелей'
- огибающая дифракции на одной щели $\operatorname{sinc}^2(a\sin\theta/\lambda)$
- интенсивность = квадрат модуля комплексной амплитуды
- та же сумма, вычисленная вручную (геометрическая прогрессия), $\phi = kd\sin\theta$
labels:
  wavelength: Длина волны $\lambda$
  d: Период решётки $d$
  a: Ширина щели $a$
  n_max: Наибольшее число щелей $N$
