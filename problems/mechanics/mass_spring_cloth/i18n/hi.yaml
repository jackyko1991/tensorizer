title: द्रव्यमान–स्प्रिंग कपड़ा
summary: 'बिंदु द्रव्यमानों का एक वर्गाकार ग्रिड, जो संरचनात्मक, अपरूपण (shear) और बंकन (bending) स्प्रिंगों से जुड़ा है, दो कोनों पर टँगा है और गुरुत्व में छोड़ा जाता है। एक आपतन आव्यूह (incidence matrix) $D_{ea}$ जाल को टेंसरों में बदल देता है: एक einsum हर स्प्रिंग सदिश देता है, दूसरा हर नोड पर बलों को जोड़ता है।'
notes: विकर्णों के अनुदिश अपरूपण स्प्रिंगें वर्गों को समचतुर्भुज बनने से रोकती हैं, और एक नोड छोड़कर जुड़ी स्प्रिंगें कपड़े को कुछ बंकन दृढ़ता देती हैं। दोनों टँगे कोनों का त्वरण बस शून्य रखा जाता है। वायु अवमंदन $\gamma$ ही एकमात्र क्षय है, इसलिए कुल ऊर्जा केवल घट सकती है ($dE/dt = -m\gamma\lvert\mathbf v\rvert^2$) और $\gamma = 0$ पर संरक्षित रहती है। स्प्रिंगें कठोर हैं, इसलिए समय चरण $\sqrt{m/k}$ से बँधा है। स्व-टक्करों की उपेक्षा की गई है। हर नोड का द्रव्यमान 10 g और ग्रिड अंतराल 10 cm है।
meanings:
- नोड $a$ की स्थिति; $N = n^2$ द्रव्यमान
- 'आपतन आव्यूह: स्प्रिंग $e$ के दोनों सिरों पर $-1$ / $+1$'
- 'दोहराया गया $a$ ⇒ योग: हर स्प्रिंग के अनुदिश सदिश'
- स्प्रिंगों की वर्तमान लंबाइयाँ; $\ell^0_e$ विराम लंबाइयाँ हैं
- 'दोहराया गया $e$ ⇒ योग: नोड $a$ पर कुल स्प्रिंग बल'
- वही योग, किनारों की सूची पर scatter के रूप में
- गतिज + प्रत्यास्थ + गुरुत्वीय ऊर्जा
labels:
  n_side: प्रति भुजा द्रव्यमान
  k: स्प्रिंग नियतांक $k$
  damping: वायु अवमंदन $\gamma$
  t_max: सिमुलेशन समय
