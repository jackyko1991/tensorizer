title: MRI k 空间：用梯度与傅里叶变换成像
summary: 磁场梯度让每个像素拥有自己的进动相位，因此线圈记录到的是图像的傅里叶变换：$s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$，其中 $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$。写成编码矩阵的 einsum，它就等于 FFT。逐行填满 k 空间再逆变换，可以看到图像逐渐清晰；跳过某些行会让图像折叠（混叠），只保留中心则会模糊并出现吉布斯振铃。
notes: 隔行采样（$R = 2$）会使视野减半：补零图像恰好是 $\tfrac12[\rho(p) + \rho(p + N/2)]$，即平移 $\mathrm{FOV}/2$ 并卷绕的副本。只保留中心几行会保留直流分量，因此总强度不变，却失去边缘：图像模糊并出现振铃（吉布斯现象）。正则化重建对图像的每一列求解一个小型最小二乘问题，并惩罚头部掩模之外的信号（掩模由中心几行估计）；它让随机采样的误差略有降低，但当折叠的两个副本都落在头部内时，无法消除规则混叠。实际的扫描仪会加入多个线圈（并行成像）或稀疏先验（压缩感知）。体模是经典的 Shepp–Logan 头部模型；仅供示意，不可用于临床。
meanings:
- 质子密度图像：像素行 $p$（相位编码方向），列 $r$（读出方向）
- k 空间位置是梯度的累积积分 $\tfrac{\gamma}{2\pi}\int G\,dt$；步长 $\Delta k = 1/\mathrm{FOV}$
- 像素 $p$ 在 k 空间第 $u$ 行的相位 $e^{-2\pi i\,up/N}$；二维矩阵 $E_{kx}$ 可分解为 $E_{up}E_{vr}$
- 重复的 $p, r$ ⇒ 求和：测得的 k 空间信号，与 fft2(rho) 完全相同
- 采样掩模：已采集的相位编码行为 1
- 补零重建
- 对每一列 $r$ 做 Tikhonov 最小二乘，惩罚头部以外的信号
labels:
  size: 图像大小 $N$
  R: 跳行因子 $R$（每 $R$ 行取一行）
  lowpass: 保留的 k 空间中心比例
  random_frac: 随机保留的行比例
  lam: Tikhonov 权重 $\lambda$
  n_frames: 填充帧数
