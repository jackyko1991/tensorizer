source_hash: 3a74544d7716
title: 投影競賽的貝爾檢驗
summary: 這是一個推測性的假說，並非已確立的物理：兩個糾纏粒子是同一個共享態 $\Psi$，存在於 $D$ 維中；每次測量都是一次投影，接著進行第 1 步的競賽。若在 $\Psi$ 上聯合執行，作為完整空間中的單一事件，這個競賽恰好給出量子力學的 $E = -\cos\theta$ 與 CHSH 值 $S = 2\sqrt2$。若分別在各方的局域隱藏座標上執行，它就是一個 $S\leq2$ 的局域隱變數模型，而無漏洞貝爾檢驗已將其排除。每個結果擁有多於一個隱藏維度的競賽會打破 Tsirelson 界限，並允許超光速傳訊。
notes: 投影假說的第 5 步（見系列說明），這是作者的推測性假說，並非已確立的物理。它在糾纏上檢驗第 1 步（cosmology/projection_postulate）的公設 P1（投影）與 P2（事件）。第 4 步（cosmology/projection_singularity_fold）處理幾何，第 6 步（cosmology/projection_telescope_tests）處理觀測。共享態的維度 $D$ 保持開放：它是一個參數，沒有任何結果依賴於它。先看已知的物理。單態給出 $E(a,b) = -a\cdot b = -\cos\theta$。Bell（1964）以及 Clauser、Horne、Shimony 與 Holt（1969）證明了任何局域隱變數模型都滿足 $S\leq2$，而量子力學可達到 Tsirelson 界限 $S = 2\sqrt2$。假說內容：存在一個共享的 $\Psi$（P0、P3）；各方的測量是一次投影加上第 1 步的競賽，其中 $\|P_k\Psi\|^2/E_k$ 最大的結果會發生，而 $E_k$ 是 $m$ 個隱藏複座標（屬於 $\Psi$）中的能量。(i) 聯合模型：競賽在四個聯合結果上只執行一次，權重為 $\|(P^a_i\otimes P^b_j)\Psi\|^2$。它在三維中是非局域的，在 $D$ 維中則是單一事件。當 $m = 1$（第 1 步留下的唯一可行值）時，它精確重現量子力學：閉式解的 $E = -\cos\theta$ 精確到 $10^{-15}$，而從 $\Psi$（位於 $\mathbb C^D$ 中）出發的蒙地卡羅模擬在統計誤差內吻合。在最佳設定下 $S = 2\sqrt2$，2000 組隨機設定上的最大值都低於此值，且 Alice 的邊際分佈不依賴於 Bob 的設定（無傳訊）。(ii) 局域模型：各方只在自己的隱藏能量以及在源頭設定的隱藏方向 $n$ 上進行競賽，也就是在權重 $(1\pm a\cdot n)/2$ 上。這是一個局域隱變數模型，因此 $S\leq2$ 必然成立。$m = 1$ 給出 $E = -\cos\theta/3$（最大 $S\approx0.93$），而 $m\to\infty$ 就是 Bell 本人的確定性模型 $E = -(1-2\theta/\pi)$，恰好達到
  $S = 2$。超越 Born 規則：$m\neq1$ 的聯合競賽不是量子力學。當 $m > 1$ 時它打破 Tsirelson 界限（$S = 3.85$ 於 $m = 3$，趨向 PR 盒的值 4）。對於部分糾纏態，它會讓 Alice 的統計依賴於 Bob 的設定，這就是超光速傳訊（$dS/dm = 1.34$，傳訊量 $\approx0.18\,|m-1|$）。因此，$m = 1$ 既是相對論因果性的要求，也是三縫實驗數據的要求。數據（data/bell_tests.csv，引用的數值取自摘要）。Hensen et al.（Nature 526, 682, 2015）：相距 1.3 km 的 NV 自旋，$S = 2.42\pm0.20$，$p = 0.039$。他們的第二次實驗（Sci. Rep. 6, 30289, 2016）：$S = 2.35\pm0.18$。Giustina et al. 與 Shalm et al.（Phys. Rev. Lett. 115, 250401 and 250402, 2015）：光子，CH–Eberhard 不等式，$p\leq3.74\times10^{-31}$ 與 $2.3\times10^{-7}$。Rosenfeld et al.（Phys. Rev. Lett. 119, 010402, 2017）：相距 398 m 的原子，$S = 2.221\pm0.033$。Storz et al.（Nature 617, 265, 2023）：相距 30 m 的超導量子位元，$S = 2.0747\pm0.0033$，比 2 高出 22.6$\sigma$。結論：模型 (ii)，連同競賽的所有局域版本，都已被排除。模型 (i) 與所有檢驗一致，但這只是因為它是改寫過的量子力學；它沒有做出任何新預測。第 1 步仍然允許的偏差（$|m-1|\leq6\times10^{-3}$）最多只會使 $S$ 偏移 $8\times10^{-3}$。這大於 Storz 的 $\sigma_S$，但實測的 $S$ 值遠低於 $2\sqrt2$（可見度 0.73），而未知的可見度會吸收這樣的偏移。只有 $E(\theta)$ 的形狀（殘差 $\leq1.5\times10^{-3}$）或直接的無傳訊檢驗（$\leq10^{-3}$）才可能看到它。維基百科：貝爾定理、CHSH
  不等式。
meanings:
- 沿單位向量 $n$ 的自旋投影算子，以對 Pauli 矩陣的 einsum 構建
- 每個聯合結果的權重：對量子位元指標 $x, y, u, v$ 求和
- 關聯函數，對結果符號 $s = (+1, -1)$ 求和
- 四個結果上的聯合競賽；對 $l$ 的求和（扣除 $l = k$）即對其他結果的乘積；$m = 1$ 給出 $P = w$
- 從 $\Psi$ 的樣本中讀出的隱藏區塊能量，樣本在 $\mathbb C^D$ 的球面上均勻分佈
- 在源頭設定的隱藏方向，即 $\Psi$ 的三個實座標：在 $S^2$ 上均勻分佈，對任何 $D$ 皆然
- 局域競賽：各方在自己的權重 $(1\pm a\cdot n)/2$ 上競賽；對共享的 $\nu$ 取平均
- CHSH 值，對四項中哪一項帶負號取最大值
labels:
  D: 總維度 $D$（共享態 $\Psi$ 的維度，開放）
  m_max: 每個結果的最大隱藏維度數 $m$
  settings: 隨機測量設定數
  trials: 每個角度的競賽事件數（蒙地卡羅）
