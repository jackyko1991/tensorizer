source_hash: 698c7a054398
title: 도플러 효과와 마하 원뿔
summary: 속력 $v_s$로 움직이는 음원이 주기마다 원형 파면 하나를 냅니다. 모든 파면은 (방출 시각, 방출 지점) 텐서의 한 행이므로, 임의 시각의 반지름은 뺄셈 한 번입니다. 파면은 앞쪽에서 촘촘해지고 뒤쪽에서 성겨지며, 음속을 넘으면 쌓여서 마하 원뿔을 이룹니다.
notes: 들리는 진동수는 단순히 초당 도착하는 파면의 수입니다. 음원 앞쪽에서는 파면들이 더 가까이 방출되었으므로 $f' = f\,c/(c - v_s)$, 뒤쪽에서는 $f' = f\,c/(c + v_s)$입니다. 청취자는 이 공식이 정확한 운동 직선 위에 놓여 있습니다. $v_s > c$(마하 수 $M = v_s/c > 1$)이면 음원이 자기 소리를 앞지릅니다. 모든 파면이 두 직선, 즉 $\sin\mu = 1/M$인 반각 $\mu$의 마하 원뿔에 접합니다. 그러면 앞쪽 청취자는 원뿔이 지나갈 때까지 아무것도 듣지 못하고, 파면은 역순으로 도착합니다. 음속 $c = 340$ m/s; 음원만 움직이고 공기는 정지해 있습니다.
meanings:
- 주기 $1/f$마다 파면 하나
- 파면 $e$를 방출할 때 음원의 위치
- 시각 $t$에서 모든 파면의 반지름 (아직 방출 전이면 0)
- 음원 앞과 뒤의 청취자
- '반복된 $i$ ⇒ 합: 각 방출 지점에서 각 청취자까지 거리의 제곱'
- 파면 $e$가 청취자 $o$에 도달하는 시각
labels:
  mach: 마하 수 $v_s/c$
  f: 음원 진동수 $f$ (그려진 파면)
  t_max: 시뮬레이션 시간
