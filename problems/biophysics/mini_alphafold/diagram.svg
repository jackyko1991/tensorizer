<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Mini AlphaFold: a predicted distance map d_ij on the left is turned into a chain of C-alpha beads on the right, a helix-turn-helix in which residues i and j are a distance d_ij apart and neighbours are 3.8 angstrom apart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- distance map: dark diagonal, light far corners -->
    <g stroke="#ffffff" stroke-width="1">
      <rect x="14" y="44" width="14" height="14" fill="#1e40af"/><rect x="28" y="44" width="14" height="14" fill="#2563eb"/><rect x="42" y="44" width="14" height="14" fill="#93c5fd"/><rect x="56" y="44" width="14" height="14" fill="#dbeafe"/>
      <rect x="14" y="58" width="14" height="14" fill="#2563eb"/><rect x="28" y="58" width="14" height="14" fill="#1e40af"/><rect x="42" y="58" width="14" height="14" fill="#2563eb"/><rect x="56" y="58" width="14" height="14" fill="#93c5fd"/>
      <rect x="14" y="72" width="14" height="14" fill="#93c5fd"/><rect x="28" y="72" width="14" height="14" fill="#2563eb"/><rect x="42" y="72" width="14" height="14" fill="#1e40af"/><rect x="56" y="72" width="14" height="14" fill="#2563eb"/>
      <rect x="14" y="86" width="14" height="14" fill="#dbeafe"/><rect x="28" y="86" width="14" height="14" fill="#93c5fd"/><rect x="42" y="86" width="14" height="14" fill="#2563eb"/><rect x="56" y="86" width="14" height="14" fill="#1e40af"/>
    </g>
    <rect x="14" y="44" width="56" height="56" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="27" y="122" font-style="italic">d<tspan font-size="10" dy="3">ij</tspan></text>
    <!-- arrow: distances to coordinates -->
    <line x1="80" y1="72" x2="112" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- chain: two antiparallel zigzag helices joined by a loop -->
    <path d="M142,138 L130,124 L144,110 L130,96 L144,82 L130,68 L144,54 L136,38 Q160,18 184,38 L176,54 L190,68 L176,82 L190,96 L176,110 L190,124 L178,138" fill="none" stroke="#374151" stroke-width="2"/>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.5">
      <circle cx="142" cy="138" r="4.5"/><circle cx="130" cy="124" r="4.5"/><circle cx="144" cy="110" r="4.5"/><circle cx="130" cy="96" r="4.5"/>
      <circle cx="144" cy="82" r="4.5"/><circle cx="130" cy="68" r="4.5"/><circle cx="144" cy="54" r="4.5"/><circle cx="136" cy="38" r="4.5"/>
      <circle cx="184" cy="38" r="4.5"/><circle cx="176" cy="54" r="4.5"/><circle cx="190" cy="68" r="4.5"/><circle cx="176" cy="82" r="4.5"/>
      <circle cx="190" cy="96" r="4.5"/><circle cx="176" cy="110" r="4.5"/><circle cx="190" cy="124" r="4.5"/><circle cx="178" cy="138" r="4.5"/>
    </g>
    <!-- pair distance between residue i and residue j -->
    <circle cx="144" cy="82" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="176" cy="82" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <line x1="149" y1="82" x2="171" y2="82" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="151" y="76" font-style="italic" fill="#b45309">i</text>
    <text x="164" y="76" font-style="italic" fill="#b45309">j</text>
    <text x="203" y="134" font-size="13" fill="#374151">3.8 Å</text>
  </g>
</svg>
