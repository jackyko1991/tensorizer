title: 射影の折り目としての特異点
summary: 推測的な仮説であり、確立された物理ではない：曲がった時空は平坦な高次元空間内の曲面の影であり、特異点はその影が折り畳まれる場所である。まず既知の幾何を確認する。Flamm の放物面と、Schwarzschild 時空全体を6次元の平坦空間に埋め込む Fronsdal の 1959 年の埋め込みは、どちらも計量を正確に再現し（autograd）、Kretschmann スカラー $12r_s^2/r^6$ も同じ自動微分から得られる。射影されたシートは普遍的な密度指数で折り畳まれる：折り目では $-1/2$、カスプでは $-2/3$。折り目の形をした内部は外部を正確に Schwarzschild のまま残すので、それは地平線の背後に隠れる。ここにあるものは何一つ直接観測できない。
notes: 射影仮説のステップ4（シリーズの説明を参照）。これは著者による推測的な仮説であり、確立された物理ではない。ステップ1（cosmology/projection_postulate）は公準 P4 を述べる：曲がった時空は平坦な高次元埋め込みを射影した形であり、特異点は射影が折り畳まれる場所（そのヤコビアンが階数落ちする場所）である。ステップ3（cosmology/projection_dimension_budget）は次元を数え、ステップ5（cosmology/projection_bell_test）は測定の公準を検証し、ステップ6（cosmology/projection_telescope_tests）は望遠鏡で何が検証できるかを調べる。平坦な次元の数 $D$ は未定のままである：ここではパラメータであり、どの結果にも入らない。まず既知の幾何から。(a) Flamm（1916）：Schwarzschild の赤道断面 $t = $ const、$\theta = \pi/2$ を平坦な $\mathbb R^3$ に描くと放物面 $z = 2\sqrt{r_s(r-r_s)}$ になり、その誘導計量 $dr^2/(1-r_s/r) + r^2d\phi^2$ は $10^{-16}$ まで一致する。(b) Fronsdal（Phys. Rev. 116, 778, 1959）は、地平線の内側も含めた Schwarzschild 時空全体を、平坦な $\mathbb R^{1,5}$ に埋め込む。誘導計量 $\eta_{AB}\partial_iz^A\partial_jz^B$ は、ヤコビアンを autograd で求めると、外側でも内側でも、また地平線をまたぐ Kruskal 座標でも、Schwarzschild と $10^{-13}$ まで一致する。曲がった4次元幾何は、本当に平坦空間内の曲面として見ることができる。これが P4 の拠り所である。P4 にとって重要な事実が2つある。埋め込みは地平線でフルランクである：$(t, r)$ 座標で見られる階数落ちは Kruskal 座標では消える。$r\to0$ でも折り畳まれない。無限遠へと走り去り、$z^2\approx-2r_s^{3/2} r^{-1/2}$ となる。同じ自動微分（Christoffel
  記号、Riemann テンソル、einsum による縮約）で計算した曲率は $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ を $10^{-15}$ の精度で与える。静的な潮汐固有値は $+r_s/r^3$（動径方向の引き伸ばし）と $-r_s/2r^3$（横方向の圧縮）で、いずれも $r = 0$ で発散する。P4 の主張を具体化すると：平坦な $\mathbb R^D$ 内の滑らかなシートを射影を通して見ると、その影の密度は折り目のコースティクスで発散する。カタストロフ理論（Thom、Arnold）によれば、その指数は普遍的である。写像 $x = s^n$ は $\rho\propto|x|^{1/n-1}$ を与え、測定値は $-0.500$（折り目）、$-0.667$（カスプ）、$-0.750$（$n = 4$）である。球面 $S^k$ を $\mathbb R^3$ に射影すると縁の密度は $u^{(k-3-1)/2}$ となり、測定値は $-0.51$、$0.00$、$+0.45$（それぞれ $k = 3, 4, 5$）で、どの $D$ でも同じである。したがって密度のスパイクには、スクリーンとちょうど同じ次元数のシートが必要であり、それより厚いシートは滑らかな影を与える。アニメーションでは波打つシートを傾けていき、$a\tan\alpha > 1$ で折り畳まれる。一般相対論との比較：質量 $M = r_s/2$ に3次元球面の影の密度 $\rho\propto(1-r^2/R^2)^{-1/2}$ を与える。これは弱い場の戯画であり、アインシュタイン方程式の解ではない。$R$ の外側では場はちょうど $r_s/r^3$ であり（Birkhoff の定理、殻定理）、中心は有限のままである。発散は折り目の殻へ移り、密度と潮汐場では $(R-r)^{-1/2}$ に、曲率の代理量 $8\sum E^2$ では $(R-r)^{-1}$ に弱まる。一般相対論の $r^{-3}$ と $r^{-6}$ の代わりにである。シート自体は有限の曲率 $1/R^2$ を保つ。正直な結論。P4 は厳密に検証された外部 Schwarzschild 幾何を変えずに内部だけを変えることができるが、まさにそのことが P4 を検証不可能にしている：$R
  < r_s$ では折り目は地平線の背後にあり、そこからの信号は私たちに届かない。普遍的な指数は記述として新しいにすぎない。地平線の外側には、それに依存するものが何もないからである。地平線の外側にある折り目（$R > r_s$）は、異なる光子リングとエコーをもつ、地平線のないコンパクト天体となるだろう。それこそがステップ6がブラックホールシャドウで検証するものである。背景：fluids/blowup_profile_search は、特異なプロファイルとその指数が実際にどのように研究されるか（自己相似仮定、指数探索）を示している。Wikipedia：シュヴァルツシルト計量、カタストロフ理論。
meanings:
- 自動微分による埋め込みのヤコビアン。サンプル点 $b$ ごとに1つ
- 誘導計量：繰り返される埋め込み添字 $A, C$ について、平坦計量 $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ とともに和をとる
- 追加の埋め込み座標。$q$ についての 64 ノードの Gauss–Legendre 和（$\ell = \ln s$ で行う）で、$r$ について微分可能。$-\infty$ へ向かい、その振る舞いは $r^{-1/2}$ のようになる
- 最小特異値：写像の折り目とは、これが 0 に達してヤコビアンが階数落ちする場所である
- 計量の autograd 微分から得た Christoffel 記号。$d$ について和をとる
- 2回目のフォワードモード微分と2つの einsum 積から得た Riemann テンソル（$e$ について和をとる）
- Kretschmann スカラー。4つの添字すべてについて和をとる。地平線の内側でも外側でも $12r_s^2/r^6$ に等しい
- $x = s^n$ のもとでの一様なシートの影の密度（折り目 $n = 2$、カスプ $n = 3$）。対数ビンのヒストグラム
- 半径 $R$ の3次元球面の影として分布する質量のニュートン潮汐テンソル（弱い場の戯画）
labels:
  fold_radius: 折り目の殻の半径 $R$
  sheet_amplitude: 波打つシートの振幅 $a$
  D: 球面シートを収める平坦次元 $D$（未定）
  samples: 各シート上のサンプル点数
