source_hash: 1e3affbcf0e4
title: Линейные отображения плоскости
summary: 'Матрица $2\times 2$ перемещает каждую точку плоскости, а один einsum перемещает целую сетку, единичную окружность и единичный квадрат сразу для каждого кадра анимации. Смотрите, как плоскость плавно переходит от единичной матрицы к $A$: собственные векторы остаются на своих прямых, $|\det A|$ масштабирует площади, отрицательный определитель переворачивает плоскость, а окружность становится эллипсом, полуоси которого — сингулярные значения.'
notes: 'Столбцы $A$ — это то, куда попадают базисные векторы $\mathbf e_1$ (красная стрелка) и $\mathbf e_2$ (зелёная стрелка), а каждая другая точка следует по линейности, поэтому прямые линии сетки остаются прямыми и параллельными. Вдоль пути $M(t) = (1-t)I + tA$ собственный вектор $\mathbf v$ матрицы $A$ является и собственным вектором $M(t)$ с собственным значением $1 - t + t\lambda$, поэтому оранжевые точки скользят вдоль своих штриховых прямых, пока всё остальное поворачивается. Единичный квадрат (жёлтый) становится параллелограммом площади $|\det A|$; он краснеет при $\det < 0$, когда переход $\mathbf e_1 \to \mathbf e_2$ идёт по часовой стрелке и плоскость становится зеркальным образом. Отражение должно по пути пройти через $\det = 0$, где плоскость сплющивается в прямую. Повороты и отражения сохраняют длины, так что $\sigma_1 = \sigma_2 = 1$; сдвиг сохраняет площадь ($\det = 1$), но не форму. В общем случае окружность переходит в эллипс с полуосями $\sigma_1 \ge \sigma_2$ — сингулярными
  значениями, и $|\det A| = \sigma_1\sigma_2$. Произведения перемножаются: $\det(AB) = \det A\,\det B$.'
meanings:
- 'показываемые матрицы: растяжение, сдвиг, поворот, отражение и переворот или ваша собственная'
- 'точки плоскости: линии сетки, единичная окружность, единичный квадрат'
- прямой путь от единичной матрицы $\delta_{ij}$ к $A$, по одной матрице на кадр
- 'повторяющийся $j$ ⇒ суммирование: каждая точка перемещается матрицей каждого кадра сразу'
- '$\varepsilon_{12} = 1$, $\varepsilon_{21} = -1$: двумерный символ Леви-Чивиты'
- 'повторяющиеся $i, j$ ⇒ суммирование: ориентированная площадь образа единичного квадрата'
- образ окружности — эллипс с полуосями $\sigma_1 \mathbf u_1$ и $\sigma_2 \mathbf u_2$
- собственные значения и собственные векторы; для поворота они комплексные, поэтому ни одна прямая не остаётся на месте
