source_hash: 1470d7e1b6a9
title: 點電荷的電場
summary: 在網格上應用庫侖定律與疊加原理。廣播一次建立從每個電荷到每個格點的位移向量，再對電荷指標作一次 einsum，把它們的電場相加。一個電荷沿圓周移動，電力線隨之變化。
notes: 單位取 $k = 1$。這些電荷是三維空間中的點電荷，因此各自的電場按 $1/r^2$ 衰減；我們只觀察包含它們的平面。箭頭從正電荷（紅）指出、指向負電荷（藍）；兩電荷同號時，兩者之間會出現電場為零的中性點。
meanings:
- 格點 $g$，分量 $i \in \{x, y\}$
- 電荷 $q$ 的位置
- 各電荷的電量
- 廣播：從每個電荷到每個格點的向量
- 重複的 $j$ ⇒ 求和：距離
- 重複的 $q$ ⇒ 求和：所有電荷的疊加
labels:
  q_fixed: 固定電荷
  q_moving: 移動電荷
  n_grid: 每邊箭頭數
