title: 'स्थिति भार आव्यूह: मोटिफ़ लोगो और स्कैन'
summary: किसी प्रतिलेखन कारक के संरेखित बंधन स्थलों को एक $(m, 4)$ आव्यूह में गिना जाता है, छद्म-गणन के साथ आवृत्तियों में और पृष्ठभूमि के सापेक्ष लॉग-ऑड्स स्कोर में बदला जाता है। सूचना सामग्री एक अनुक्रम लोगो देती है, और खोली गई खिड़कियों पर एक einsum एक लंबे अनुक्रम के दोनों रज्जुकों को एक साथ स्कोर करता है; मेल (hits) अनुक्रम की फेंटी (shuffled) प्रतियों से लिए गए p-मान से तय होते हैं।
notes: 'PWM मानता है कि बंधन स्थल की हर स्थिति स्वतंत्र रूप से योगदान देती है, इसलिए किसी खिड़की का स्कोर प्रति अक्षर एक संख्या का योग है: one-hot खिड़की का $W$ के साथ आंतर गुणनफल। छद्म-गणन $\beta$ कुछ प्रशिक्षण स्थलों में कभी न देखे गए अक्षरों को $-\infty$ स्कोर मिलने से रोकता है; जितने अधिक स्थल हों, यह उतना कम मायने रखता है। किसी स्तंभ की सूचना सामग्री बताती है कि मोटिफ़ वहाँ अक्षर को कितना सीमित करता है, 0 बिट (कुछ भी चलेगा) से 2 बिट (हमेशा एक ही अक्षर) तक, और लोगो अक्षरों को $P_{ja}$ के अनुपात में ढेर करता है। यहाँ स्थल कृत्रिम हैं: 12 bp, TATA बॉक्स जैसे कोर के साथ (सर्वसम्मत TATAWAWR, जहाँ W = A या T और R = A या G) और हर ओर दो स्थिर अक्षर, ताकि मोटिफ़ में खोजे जाने लायक पर्याप्त बिट हों। अकेला छोटा अपभ्रष्ट मोटिफ़ बहुत कम सूचना रखता है: लंबे अनुक्रम में यादृच्छिक खिड़कियाँ वास्तविक स्थलों जितना ऊँचा स्कोर करती हैं, इसीलिए वास्तविक TATA बॉक्स को केवल उसके PWM से खोजना कठिन है। p-मान अनुक्रम की फेंटी गई प्रतियों (वही अक्षर, कोई मोटिफ़ नहीं) को स्कैन करने से आता है; $2(L-m+1)$ खिड़कियों
  के साथ $p$ पर कट लगभग $2(L-m+1)\,p$ यादृच्छिक मेल को आने देता है, और सबसे छोटा पहचाना जा सकने वाला p-मान $1/(1 + \#\text{null scores})$ है। कम प्रशिक्षण स्थल, कमज़ोर मोटिफ़ या ढीला कट आज़माएँ और रोपित स्थलों को छूटते या मिथ्या मेल प्रकट होते देखें।'
meanings:
- प्रशिक्षण स्थल $s$, स्तंभ $j$, अक्षर $a$ ∈ (A, C, G, T)
- 'दोहराया गया $s$ ⇒ योग: हर स्तंभ में अक्षर गिनतियाँ'
- छद्म-गणन $\beta$ के साथ आवृत्तियाँ; हर पंक्ति का योग 1 है और कोई प्रविष्टि 0 नहीं
- 'पृष्ठभूमि $q_a$ के सापेक्ष लॉग-ऑड्स (बिट): > 0 वरीय, < 0 परिहार्य'
- 'दोहराया गया $a$ ⇒ योग: प्रति स्तंभ बिट, एकसमान पृष्ठभूमि के लिए 0 और 2 के बीच; लोगो की ऊँचाई'
- $t = 0$ धन रज्जुक, $t = 1$ विपरीत पूरक (स्तंभ उलटे, A↔T, C↔G)
- लंबे अनुक्रम के $m$ अक्षरों की हर खिड़की
- 'दोहराए गए $j$, $a$ ⇒ योग: दोनों रज्जुक एक कॉल में; वही कोड सभी फेंटों $(R, 2, L-m+1)$ को स्कोर करता है'
- फेंटे गए अनुक्रमों के उन स्कोरों का अंश जो कम से कम इतने ऊँचे हों
