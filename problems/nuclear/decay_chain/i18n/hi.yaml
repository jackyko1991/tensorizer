source_hash: 006d4ce1966d
title: क्षय शृंखला (बेटमैन समीकरण)
summary: एक जनक (parent) रेडियोधर्मी संतति (daughter) में क्षयित होता है, जो एक स्थायी अंतिम उत्पाद में क्षयित होती है। तीनों दर समीकरण एक रैखिक निकाय $\dot N_i = A_{ij} N_j$ बनाते हैं, जिसे आव्यूह चरघातांकी $e^{At}$ से हर समय के लिए एक साथ सटीक हल किया जाता है और RK4 से जाँचा जाता है। डिफ़ॉल्ट शृंखला चिकित्सीय जनरेटर $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc है।
notes: '$\mathsf A$ के हर स्तंभ का योग शून्य है, अतः $\sum_i N_i$ कभी नहीं बदलता: हर क्षय एक नाभिक को शृंखला में नीचे ले जाता है। दो सदस्यों के लिए सटीक (बेटमैन) हल $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$ है। जब संतति अल्पजीवी हो ($\lambda_2 > \lambda_1$) तो सक्रियताएँ एक साथ बँध जाती हैं: अनुपात $a_2/a_1$, $\lambda_2/(\lambda_2-\lambda_1)$ की ओर जाता है (क्षणिक साम्य), और जब जनक बहुत अधिक जीवित रहे तो 1 की ओर (स्थायी/सेक्युलर साम्य, जनक की अर्धायु 1000 h आज़माएँ)। संतति को दीर्घजीवी बनाएँ तो कोई साम्य नहीं बनता। सरलीकरण: $^{99}$Mo वास्तव में केवल लगभग 88 % क्षयों में $^{99m}$Tc देता है, और $^{99}$Tc (अर्धायु 211 000 वर्ष) को स्थायी माना गया है।'
meanings:
- $\ln 2/T_i$, स्थायी अंत के लिए $\lambda_3 = 0$
- विकर्ण पर $-\lambda_i$, ठीक उसके नीचे $+\lambda_i$
- 'दोहराया गया $j$ ⇒ योग: RK4 द्वारा प्रयुक्त दायाँ पक्ष'
- प्रति समय एक आव्यूह चरघातांकी, $t$ पर बैच
- प्रारंभिक सदिश से हर समय पर समष्टियाँ
- 'सक्रियता: हर सदस्य के प्रति घंटा क्षय'
labels:
  half_life_parent: जनक की अर्धायु $T_1$
  half_life_daughter: संतति की अर्धायु $T_2$
  t_max: समय अवधि
  rk4_steps: RK4 चरण
