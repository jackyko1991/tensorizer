title: MNIST での演算子探索：テンソル DAG が自ら分類式を書く
summary: 学習画像がほんの数枚しかないとき、DAG として配線した少数の読み解けるテンソル演算子は CNN に対抗できるでしょうか。小さな DAG の各辺には、23 個の候補演算子（Sobel、ラプラシアン、Gabor、学習される 3×3 フィルタ、ReLU、$x^2$、プーリング、行和、FFT 振幅、クラステンプレート、PCA、モーメント、線形およびプロトタイプ読み出し）を softmax で重み付けした混合が置かれます。数字ごとに 1〜100 枚の画像で DARTS 探索を行って各辺に演算子を 1 つずつ選び、得られた DAG はその予測を厳密に再現する LaTeX の式として出力されます。そのうえで、LeNet 風の CNN と 2 つの閉形式ベースラインに対して必要なデータ量と計算量を比較し、すべてのシードの結果を示します。
notes: 問い。このトイ問題は Jacky Ka Long Ko によるもので、ホワイトボックスな式の記述を伴う小バッチ AI 学習の試みです。MNIST 上で CNN とテンソル手法を比較する。候補となるテンソル演算子を列挙する。DAG を符号化するテンソルに最良の演算子とその配線を見つけさせる。小バッチで学習し、同じ精度に達するのにそれぞれが必要とするデータ量と計算量を比較する。そして見つかった DAG の分類式を書き出す。手法。画像は 14×14 です（MNIST を 2×2 ブロックで平均したもので、30 回の実行が CPU で約 1 分に収まります）。スーパーネットは DARTS セル（Liu, Simonyan and Yang 2019）で、3 つのノード $z_1, z_2, z_3$ がそれより前のすべてのノードから 6 本の辺を通じて入力を受けます。各辺は 12 個のセル演算子（ゼロ、恒等、$x^2$、$|x|$、ReLU、tanh、ソフトしきい値 $S_\lambda$、学習される $3\times 3$ フィルタ、Sobel-$x$、Sobel-$y$、ラプラシアン、Gabor）の混合です。その後にプーリング辺（平均または最大 $2\times 2$）、縮約辺（vec、行和、列和、低周波 FFT 振幅、クラステンプレートとの相関、PCA 射影、画像モーメント）、ヘッド辺（線形読み出しまたは 10 個のプロトタイプ）が続きます。アーキテクチャはテンソル $\alpha$（9 辺 × 23 演算子）で、型付け規則のためのマスクを伴います。探索：一次の DARTS で、学習用の半分のミニバッチでの $\theta$ ステップと検証用の半分での $\alpha$ ステップを交互に行い、softmax の温度を 1 から 0.001 までアニーリングします。DAG は各辺の argmax 演算子を残し（ゼロはその辺を取り除きます）、学習済みの $\theta$ を引き継いで短時間ファインチューニングされ、検証で最良のステップが保持されます。DARTS からの変更点は重要なので明記します：アニーリング（SNAS や GDAS と同様）と argmax 規則は離散化ギャップを埋めるもので、最初の試行ではこのギャップにより最大 25 ポイントの精度が失われました。画像はセル出力の
  4 番目のチャネルとして保持されます。ヘッドはそれぞれの特徴空間における最近傍クラス平均から始まります。CNN（$3\times 3$ の 8 チャネルと 16 チャネル、最大プーリング、線形層：重み 2698 個）は、同じ画像に対し同じ早期終了を用いて Adam で学習されます。ベースラインには学習パラメータがありません：ピクセル空間での最近傍クラス平均と、PCA の後に縮小推定 LDA を行うものです。結果。テストでは、各演算子が小さな入力上でその式に一致すること、one-hot の混合が単一の演算子に、one-hot のスーパーネットが離散 DAG に等しいこと、離散化が argmax を選ぶこと、書き出された式を LaTeX だけから読み戻すと DAG の予測と厳密に一致すること、そしてベースラインがその閉形式に等しいことを確認します。同梱の実行（CPU、1 スレッド、3 シード）における、数字ごとの画像数 $n$ = 1, 5, 10, 50, 100 での平均テスト精度：CNN 0.35, 0.53, 0.64, 0.81, 0.85；探索された DAG 0.38, 0.48, 0.52, 0.69, 0.82；PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76；最近傍クラス平均 0.41, 0.56, 0.64, 0.68, 0.69。70 % に達するのに必要な数字ごとの画像数：CNN 18、DAG 52、PCA + LDA 20；80 % に達するには：CNN 45、DAG 91。1 回の実行あたりの学習時間：CNN 0.4〜1 s、探索とファインチューニングの合計 2〜4 s。つまり正直に言えば、数字あたり約 10 枚以上では、同じ精度に対して CNN の方が必要なデータも計算も少なく、それ未満では閉形式ベースラインが最良で、どの学習器もそれに勝てません。構造化モデルはごく小さな $n$ で勝つことはありませんでした（$n$ = 1 ではクラス平均と同等）。理由：探索はそれ自体ごく小さな検証分割上で行われるため選択にノイズが多く、またその検証損失はしばしば行和（28 特徴、学習される数値 290 個、より穏やかな損失）を好みますが、行和は全ピクセル（学習される数値約 2000 個）より分類性能が劣ります。15 個の DAG
  のうち 7 個が行和を選びました。DARTS について報告されているとおり、探索はパラメータを持たない演算子を好みます：Sobel フィルタがほとんどの辺を占め、学習されるフィルタは 15 個の DAG のうち 3 個に現れるだけです。同梱の実行以外では、より短い探索（20 または 40 ステップ）が全ピクセルを選び、$n$ = 50 で 0.74〜0.79 に達しました。これは長い探索が過度に決め打ちしてしまうことを示唆しますが、テストセット上で観察されたものなので、調整済みの設定ではなくあくまで観察です。GPU（GTX 1080 Ti）では高速化は得られませんでした：時間を決めているのは算術演算ではなく、何千もの小さなカーネルです。results/stages.csv にすべての数値が、results/equation.tex に見つかったすべての式が収められています。関連研究。ニューラルアーキテクチャ探索（Zoph and Le 2017）とその微分可能な形である DARTS。ネットワークの代わりに式を探索する記号回帰（AI Feynman, Udrescu and Tegmark 2020；PySR, Cranmer 2023；遺伝的プログラミング, Koza 1992）。CNN については LeNet（LeCun et al. 1998）。データ：MNIST（LeCun, Cortes and Burges）、ライセンス CC BY-SA 3.0。data/mnist_subset.npz には学習プール用 1000 枚とテスト用 2000 枚の画像が含まれます（継承ライセンスはこのサブセットに適用されます）。data/SOURCES.md を参照してください。試してみよう。show_n を変えて数字ごとに 1 枚または 100 枚の画像で見つかった DAG を見たり、探索ステップを増やしたり、手早く試すならシードを 1 つにしたりしてください。
meanings:
- 型付け規則：演算子 $o$ が辺 $e$ に置けるのは、その辺の入力形状を出力形状へ写す場合に限られる（セル：マップ → マップ、プール、縮約：マップ → ベクトル、ヘッド：ベクトル → ロジット）
- アーキテクチャテンソル $\alpha$（辺 × 演算子）のマスク付き softmax。温度 $T$ は 1 から 0.001 まで下がり、混合は最終的に one-hot になる
- ノードが入力するすべての演算子を、その出力辺すべてに対して一度だけ計算する：1 回の畳み込みで Sobel-$x$、Sobel-$y$、ラプラシアン、Gabor、および学習される $3\times 3$ フィルタ $K_e$ が得られる
- 繰り返される $o$ ⇒ 和をとる：各ノードは混合された入力辺の和であり、セル出力はスタック $(x, z_1, z_2, z_3)$ である
- 縮約 $r$ の特徴（vec、行和／列和、$|\mathcal F|$、テンプレート $\langle z, \mu_k\rangle$、PCA $U^\top \mathrm{vec}$、モーメント）。学習画像を用いて標準化する
- すべての縮約 × ヘッドをロジットの段階で混合する（特徴の長さが異なるため）。線形 $W\hat f + b$ またはプロトタイプ $-e^\tau\lVert \hat f - p_k\rVert^2/D$ で、いずれも最近傍クラス平均から始める
- 一次の DARTS：学習ミニバッチで $\theta$ ステップ、続いて検証ミニバッチで $\alpha$ ステップ
- LaTeX として書き出した離散 DAG を小さなパーサで読み戻して評価する：DAG と厳密に同じ予測になる
labels:
  search_steps: DARTS 探索ステップ数（各ステップで $\theta$ と $\alpha$ を 1 回ずつ更新）
  retrain_steps: 離散 DAG のファインチューニングステップ数
  cnn_steps: CNN の学習ステップ数
  seeds: 学習セットのサイズごとのシード数
  batch: ミニバッチサイズ（数字間で均衡）
  show_n: 表示する DAG の数字ごとの学習画像数
