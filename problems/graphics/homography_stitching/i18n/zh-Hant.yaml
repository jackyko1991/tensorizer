source_hash: 7fc4a728d6a3
title: 單應性估計與全景拼接
summary: 一張平面海報的兩張照片之間以一個 $3\times3$ 單應性相關聯。每組特徵匹配給出兩條線性方程。正規化直接線性變換（DLT）以 SVD 求解它們，RANSAC 則將數千個 4 組匹配假設作為一次批次 SVD 擬合，以剔除錯誤匹配。接著將第二個視角變形，並與第一個視角羽化混合成全景圖。
notes: 觀看平面的相機以 $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$ 將平面上的點映射到像素，因此同一平面的兩個視角之間以 $H_2 H_1^{-1}$ 相關聯：八個數，因為尺度是自由的。每組匹配固定其中兩個，因此四組處於一般位置的匹配即可決定 $H$。更多匹配則由 DLT 以最小平方意義結合。若沒有 Hartley 正規化，$A$ 的元素範圍從 1 到 $10^4$（像素平方），SVD 會失去精度。最小平方會被錯誤匹配破壞：少數離群值就會把天真的全景圖明顯拖離對齊。RANSAC（Fischler & Bolles, 1981）改為對許多隨機最小樣本擬合 $H$，並保留與最多匹配一致的那個。若離群值比例為 $\varepsilon$，一個 4 組匹配樣本乾淨的機率為 $(1-\varepsilon)^4$，因此理論上幾十個樣本就足夠。此處一次求解數千個，因為批次 SVD 很便宜。內群值上剩餘的誤差與像素雜訊相符。方法依循 Hartley & Zisserman, Multiple View Geometry in Computer Vision。實際流程的匹配來自 SIFT 或 ORB 等特徵偵測器。
meanings:
- 視角 1 與視角 2 中匹配的像素位置（已知海報點 + 雜訊，部分以隨機錯誤匹配取代）
- 重複的 $j$ ⇒ 求和，再除以第三分量（射影尺度）
- 平移到質心並縮放至平均距離 $\sqrt 2$（Hartley 正規化）
- 每組匹配由 $\mathbf x' \times H\mathbf x = 0$ 得兩列，對九個元素 $h_a$ 為線性
- 最小奇異值的右奇異向量；再得 $H = T'^{-1}\hat H\,T$
- RANSAC 假設：$B$ 個隨機 4 組匹配樣本，全部以一次形狀為 $(B, 8, 9)$ 的批次 SVD 求解
- 每組匹配在每個假設下的重投影誤差
- 共識集最大的假設；再以 DLT 對其內群值重新擬合
- 反向變形：每個全景像素查找它落在視角 2 中的位置；以羽化權重混合
labels:
  matches: 特徵匹配數
  outliers: 錯誤匹配比例
  noise: 像素雜訊 $\sigma$
  hypotheses: RANSAC 假設數 $B$
  threshold: 內群值門檻 $\tau$
