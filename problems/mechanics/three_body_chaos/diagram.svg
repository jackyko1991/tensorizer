<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Pythagorean three-body problem: masses 3, 4 and 5 released from rest at the corners of a 3-4-5 right triangle, each opposite the side of the same length, with a twin of mass 3 offset by a tiny delta">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- faint tangled paths hinting at the chaotic dance -->
    <path d="M150,48 C120,40 96,70 128,86 C160,102 118,128 104,110 C90,92 142,72 150,100 C158,126 112,132 96,122" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- the 3-4-5 triangle -->
    <polygon points="165,22 75,138 165,138" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- right angle at mass 5 -->
    <polyline points="153,138 153,126 165,126" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- side lengths -->
    <text x="114" y="154" fill="#374151">3</text>
    <text x="172" y="84" fill="#374151">4</text>
    <text x="104" y="74" fill="#374151">5</text>
    <!-- masses, radius ~ m^(1/3) -->
    <circle cx="165" cy="22" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="161.5" y="26.5" font-size="11" fill="#ffffff">3</text>
    <circle cx="75" cy="138" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="71.5" y="142.5" font-size="11" fill="#ffffff">4</text>
    <circle cx="165" cy="138" r="11" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="161.5" y="142.5" font-size="11" fill="#ffffff">5</text>
    <!-- the twin: mass 3 nudged by delta -->
    <circle cx="186" cy="22" r="9" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="176" y1="10" x2="186" y2="10" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="190" y="14" font-style="italic" fill="#b45309">δ</text>
    <text x="16" y="24" fill="#374151">at rest,</text>
    <text x="16" y="40" font-style="italic" fill="#374151">v = 0</text>
  </g>
</svg>
