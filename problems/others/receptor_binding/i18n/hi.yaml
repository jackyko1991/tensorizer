title: रिसेप्टर–लिगैंड बंधन (k_on, k_off)
summary: एक प्रतिरक्षा रिसेप्टर (receptor) (T-कोशिका रिसेप्टर या एंटीबॉडी (antibody)) अपने लक्ष्य को कितनी दृढ़ता से और कितनी देर पकड़े रहता है? ऑन-दर $k_{on}$ और ऑफ़-दर $k_{off}$ वाली द्रव्यमान-अनुपाती (mass-action) गतिकी को कई रिसेप्टर प्रकारों और लिगैंड (ligand) सांद्रताओं के पूरे अनुमापन के लिए एक साथ, एक $(B, C)$ टेंसर में हल किया जाता है, और बंधन समतापी (isotherms) के साथ SPR-शैली सेंसरग्राम के रूप में दिखाया जाता है।
notes: 'बंधन के लिए एक मुक्त रिसेप्टर और एक मुक्त लिगैंड का मिलना आवश्यक है, इसलिए उसकी दर $k_{on} R L$ है; विबंधन हर संकुल के साथ स्वतंत्र रूप से दर $k_{off} C$ पर होता है। साम्यावस्था में दोनों संतुलित होते हैं और बद्ध अंश $\theta = L/(L + K_D)$ है, जहाँ $K_D = k_{off}/k_{on}$: $L = K_D$ पर आधे रिसेप्टर भरे होते हैं (हर समतापी पर निशान)। खाली रिसेप्टरों से शुरू करने पर पहुँच चरघातांकी होती है, $C(t) = C_{eq}(1 - e^{-k_{obs} t})$ जहाँ $k_{obs} = k_{on} L + k_{off}$, और SPR (surface plasmon resonance) उपकरण इसी से $k_{on}$ मापते हैं; बफ़र धुलाई के बाद संकुल $e^{-k_{off} t}$ की तरह क्षयित होते हैं, जिसकी अर्धायु $t_{1/2} = \ln 2 / k_{off}$ है, यही निवास काल (dwell time) है। प्रकार यथार्थवादी परिसर में हैं: T-कोशिका रिसेप्टर पेप्टाइड–MHC से दुर्बल रूप से बँधते हैं ($K_D \sim 1$–$10\,\mu$M, निवास काल कुछ सेकंड), एंटीबॉडी दृढ़ता से बँधती है ($K_D \sim 0.1$ nM, निवास काल घंटों का)। समतापियों पर बिंदु देखें: कम सांद्रता पर $k_{obs} \approx k_{off}$ छोटा है, इसलिए धुलाई शुरू होने तक एंटीबॉडी साम्य
  तक नहीं पहुँची होती। T कोशिकाओं के लिए $k_{off}$ इतना महत्त्वपूर्ण क्यों है? गतिक प्रूफ़रीडिंग (kinetic proofreading) चित्र में, बँधे TCR को कोशिका को सक्रिय करने से पहले कई संकेतन चरणों (फ़ॉस्फ़ोरिलीकरण) से गुज़रना पड़ता है, और यदि लिगैंड पहले छूट जाए तो सब कुछ रीसेट हो जाता है। उन चरणों से अधिक जीवित रहने वाले संकुल के संकेत देने की संभावना कहीं अधिक है, इसलिए T कोशिका केवल अधिग्रहण के बजाय निवास काल $1/k_{off}$ पढ़ती है, और किसी विदेशी पेप्टाइड को उस स्व-पेप्टाइड से अलग पहचान सकती है जिसकी बंधुता (affinity) केवल थोड़ी भिन्न हो। सरलीकरण: प्रति रिसेप्टर एक बंधन स्थल (कोई avidity या पुनर्बंधन नहीं), भली-भाँति मिश्रित विलयन और कोई द्रव्यमान-परिवहन सीमा नहीं; depletion चालू होने पर हर संकुल एक बंद आयतन से एक लिगैंड हटाता है और साम्य $L/(L + K_D)$ के बजाय द्विघात हल का पालन करता है।'
meanings:
- रिसेप्टर प्रकार $b$ के दर स्थिरांक (दुर्बल / मध्यम / उच्च-बंधुता TCR, एंटीबॉडी)
- अनुमापन की लिगैंड सांद्रता $c$ (nM); अंतिम वाली सेंसरग्राम है
- हर प्रकार और सांद्रता के लिए मुक्त रिसेप्टर और संकुल
- 'मुक्त लिगैंड: $L_c$, या depletion के साथ $L_c - C_{bc}$'
- 'किसी सूचकांक पर योग नहीं: $k_b$ हर सांद्रता $c$ पर ब्रॉडकास्ट होता है'
- RK4 के लिए दायाँ पक्ष; $R$ और $C$, $\mp J$ से बदलते हैं, अतः $R + C = R_T$
- 'वियोजन स्थिरांक: वह लिगैंड स्तर जो आधे रिसेप्टरों को बाँधता है'
- साम्य अधिग्रहण (धराशायी समतापी)
labels:
  log10_L: सेंसरग्राम लिगैंड $\log_{10}(L/\mu\mathrm{M})$
  t_assoc: संगुणन समय
  t_dissoc: वियोजन समय
  depletion: लिगैंड ह्रास (depletion)
  R_T: रिसेप्टर $R_T$ (depletion के साथ महत्त्वपूर्ण)
