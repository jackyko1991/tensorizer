source_hash: 4a434cf0af06
title: 譜聚類與圖拉普拉斯矩陣
summary: 把點雲轉成一張圖（在 $k$ 近鄰邊上賦予高斯權重），以張量建立圖拉普拉斯矩陣 $L = D - W$ 及其正規化形式 $L_{sym}$，再從其最低的本徵向量讀出群集。普通 k-means 會失敗的雙月形與同心環被完美分開；同一個拉普拉斯矩陣作用在網格上則給出鼓膜的振動模態。
notes: 為何有效：$f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$ 是平方和，所以 $L$ 是半正定的，且只有當 $f$ 在每條邊上都相等，也就是在每個連通分量上為常數時才為零。因此零本徵值的個數恰好等於連通分量數（比較終端中的兩個計數），而各分量的指示向量張成該本徵空間。當群集之間只由少數弱邊連接時，本徵值很小而非為零，本徵向量則接近指示向量；最小化 $f^{\mathsf T}Lf$ 是切斷最少邊的鬆弛版本，即 Shi 與 Malik（2000）的正規化切割。第二本徵向量（Fiedler 向量）給出最佳的二分。普通 k-means 圍繞中心畫出直線邊界，因此把雙月與環切成兩半；在嵌入空間中（上排，看點如何滑動）群集是分離的團塊，k-means 便能奏效。譜中第 $k$ 個本徵值之後的大間隙暗示了群集數。在 $g\times g$ 網格圖上，$L = L_1\otimes I + I\otimes L_1$ 是自由（Neumann）邊界下離散拉普拉斯算子的負值，因此其本徵向量是駐波 $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$，$\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$：與波動主題中振動鼓膜的模態相同（後者邊界為固定）。模態 $(a, b)$ 與 $(b, a)$ 共享一個本徵值，eigh 會回傳這一對的某種混合，所以有些看起來是斜的。結果取決於 $\sigma$ 與 $k$：鄰居太少會把一個群集拆成碎片，太多則會在群集間搭起橋樑。延伸閱讀：U. von Luxburg, A tutorial on spectral clustering (2007)；Ng, Jordan and Weiss (2001)。
meanings:
- 點 $i$、座標 $a$：雙月、雙環或三個團塊，附有真實標籤以供評分
- 重複的 $a$ ⇒ 求和：同時算出所有距離平方
- 只有當 $j$ 是 $i$ 的 $k$ 個最近鄰之一（或反之）時才保留高斯相似度；對稱，對角為零
- 重複的 $j$ ⇒ 求和：每個點的度
- 每列總和為 0，因此常數向量的本徵值為 0
- $s_i = d_i^{-1/2}$；不求和，$i$ 與 $j$ 保持自由
- 本徵值遞增；前 $k$ 個本徵向量，各列縮放為單位長度，即譜嵌入
- 以 k-means++ 初始化的 Lloyd 迭代；在嵌入空間中群集是緊密的團塊
labels:
  n_points: 每個資料集的點數 $N$
  noise: 雜訊
  k_neighbours: 最近鄰數 $k$
  sigma: 核寬度 $\sigma$
  grid: 網格圖邊長 $g$
