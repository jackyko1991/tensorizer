source_hash: b577c14eb932
title: 차원은 몇 개인가? 사영 가설의 차원 예산
summary: 확립된 물리가 아닌 추측성 가설이다. 사영이라는 생각에는 숨은 차원이 몇 개 필요하고, 실험은 몇 개를 허용하는가? 양자 쪽에서는 1단계에 따라 결과마다 숨은 복소 차원이 하나, 얽힌 입자 $N$ 개에는 $2^N$ 개가 필요하지만, 이들은 힐베르트 공간에 있으며 공간 속 방향일 필요가 없다. 중력 쪽에서는 반지름 $R$ 인 콤팩트 차원 $n$ 개가 $R$ 아래에서 뉴턴 법칙을 바꾼다. 비틀림 저울, LHC, 초신성과 중성자별 한계가 $(n, R)$ 지도를 한계 하나씩 채운다. 모든 $n$ 이 살아남지만, $R$ 이 작을 때만이다. $n = 1$ 이면 38.6 μm 미만, $n = 2$ 이면 $2\times10^{-10}$ m 미만이다. 제약되었지만 배제되지는 않았다.
notes: '상태: 추측성; 제약되었지만 배제되지는 않았다. 사영 가설(저자 자신의 추측성 아이디어, 시리즈 설명 참조; 확립된 물리가 아님)의 3단계로, 공준 P5 에 해당한다. 양자 효과에는 어떤 $d_Q$ 개, 중력에는 어떤 $d_G$ 개의 차원이 필요하며, 이는 추정되는 것이지 손으로 정해지지 않는다. 1단계(cosmology/projection_postulate)는 사영 경주에 결과마다 정확히 하나의 숨은 복소 차원이 필요함을 발견했다. 2단계(cosmology/projection_one_particle)는 하나의 세계선을 잘랐다. 4단계(cosmology/projection_singularity_fold)는 특이점을 사영의 접힘으로 다룬다. 어떤 $n$ 도 가정하지 않는다. 지도는 $n = 0$ 부터 $n_{max}$ 까지, $R$ 은 플랑크 길이부터 1 m 까지 훑는다. 먼저 알려진 물리. (a) 양자 쪽: 경주는 $K$ 개의 결과에 대해 $d + K$ 개의 차원으로 보른 규칙을 재현하고, 얽힌 2준위계 $N$ 개에는 차원이 $2^N$ 인 힐베르트 공간이 필요하다. 표준 양자역학도 같은 공간을 쓰며, 그 차원은 공간 속 방향이 아니다. 이를 공간 방향으로 읽는다면 큐비트 $N$ 개에는 $2^{N+1} - 3$ 개의 추가 실수 차원(벨 쌍에는 5개)이 필요하고, 이 수는 입자가 얽힐 때마다 바뀌게 되는데, 고정된 공간 다양체는 그런 일을 하지 않는다. (b) 중력 쪽: 공간 차원이 $3 + n$ 개이면 가우스 법칙은 인력 $G_D M/r^{n+2}$ 를 준다($S^{n+2}$ 를 지나는 autograd 선속으로 $n = 0..6$ 에 대해 확인). $n$ 개의 차원이 반지름 $R$ 인 원이면, 상(image) 합은 $R$ 너머에서 이를 뉴턴의 $G_4 M/r^2$ 로 바꾸며, 여기서 $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ 이다($n = 1, 2, 3$ 에 대해 확인). 바로 바깥에서는 첫 Kaluza–Klein 중력자 준위가
  $\alpha = 8n/3$ (2-토러스에서 $16/3$, PDG 리뷰와 같음), $\lambda = R$ 인 유카와 항을 준다. Arkani-Hamed, Dimopoulos, Dvali(1998)의 ADD 관계는, PDG 와 LHC 실험이 쓰는 규약 $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$ 에서 PDG 의 수치를 재현한다. $R = 30$ μm, $n = 2$ 이면 $M_D = 4.0$ TeV 이고, $M_D = 1$ TeV 에는 $n = 1..6$ 에 대해 $10^{12}$ m, 0.5 mm, ..., 0.1 MeV$^{-1}$ 가 필요하다. 한계(data/gravity_bounds.csv, 인용된 수치; 비틀림 저울과 LHC 행은 cosmology/hierarchy_extra_dimensions 에 포함된 것과 같으며 다시 인용함). Eöt-Wash 비틀림 저울은 56 μm 이상(Kapner et al., PRL 98, 021101, 2007)과 38.6 μm 이상(Lee et al., PRL 124, 101101, 2020)에서 $|\alpha| = 1$ 을 배제한다. 모든 $n$ 에 대해 $\alpha\geq 1$ 이므로, 모든 $n\geq 1$ 에서 $R > 38.6$ μm 가 배제된다(보수적: 측정 곡선은 더 큰 $\lambda$ 에서 계속 내려간다). $n = 2$ 에 대해 Tan et al.(PRL 116, 131101, 2016)은 $R < 30$ μm 를 준다. ATLAS 모노제트 탐색(PRD 103, 112006, 2021, CC-BY 4.0)은 $n = 2..6$ 에 대해 $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV 를 준다. SN1987A 냉각은 $n = 2$ (3)에 대해 $M_D > 27$ (2.4) TeV 를 주고(Hanhart et al., PLB 509, 1, 2001), 갇힌 KK 중력자에 의한 중성자별 가열은 $M_D > 1700$ (76) TeV 를 주며(Hannestad and Raffelt,
  PRD 67, 125008, 2003), 둘 다 PDG 2024 리뷰에 인용된 값이다. 각 한계는 $(n, R)$ 격자 위의 불리언 마스크가 되고, 장난감 점들을 손으로 계산한 답과 대조해 확인한다. 결과: $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, 중성자별), $2.6\times10^{-12}$ m ($n = 3$), 그리고 $n = 4..6$ 에서는 LHC 반지름($5\times10^{-13}$ 에서 $2.5\times10^{-15}$ m). $n\geq 7$ 에는 비틀림 저울 한계만 포함되어 있다. LHC 한계는 $n$ 에 따라 천천히 약해지며, 외삽하면(여기서는 하지 않음) $R$ 을 $1/M_D\sim 10^{-20}$ m 쪽으로 밀어낼 것이다. 계층 문제의 원래 해법인 $M_D = 1$ TeV 의 ADD 는 $n = 1..6$ 에서 배제된다. 예산: 최솟값은 $n = 0$ 이다. 중력은 추가 공간 차원을 필요로 하지 않고, 양자의 숨은 차원은 공간적일 필요가 없기 때문이다. 최댓값은 없다. $R < R_{max}(n)$ 이면 데이터는 어떤 $n$ 이든 허용하기 때문이다. 가설이 취하는 해석: P1 과 P2 에는 힐베르트 공간 해석(숨은 차원은 상태 공간의 차원이므로 $D_Q\geq 2^N$ 은 공간에 대한 제약이 아니다), P4 와 P5 에는 기하학적 해석(매장 차원; 중력이 그 안으로 들어갈 수 있다면 콤팩트하고 $R_{max}(n)$ 아래여야 하며, 그렇지 않으면 그것은 매장의 좌표일 뿐 갈 수 있는 장소가 아니다). 판정: 제약되었지만 배제되지는 않았고, 새로운 예측도 없다. 가설이 $n$ 과 $R$ 을 이 한계 근처로 정할 때에만 검증 가능해진다.'
meanings:
- '반복된 $i$ ⇒ 합: $S^{n+2}$ 위 무작위 점에서의 바깥 방향 인력(autograd); 선속은 모든 반지름에서 같다'
- '질량과 $n$ 개의 원을 도는 그 상들을 상 지표 $I$ 에 대해 합한 것: 안쪽에서는 $1/r^{n+2}$, 바깥에서는 $G_4/r^2$'
- '인용된 한계 하나가 허용하는 최대 반지름: 비틀림 저울은 $\lambda_{max}$, 충돌기와 천체물리 한계는 $M_D = M_b$ 에서의 ADD 반지름'
- 한계 종류마다 하나의 불리언 지도, 격자 전체로 브로드캐스트
- '차원 예산: 콤팩트 차원은 이 반지름 아래에서만 허용된다'
- 반지름 $R$ 인 차원 $n$ 개에 대한 중력의 기본 척도(Giudice–Rattazzi–Wells 규약, PDG 와 같음)
- 얽힌 큐비트 $N$ 개에 필요한 힐베르트 공간 차원 $2^N$ (1단계)
labels:
  n_max: 지도에 있는 추가 차원의 최대 개수 $n$ (0부터 모든 $n$ 을 훑음)
  R_points: 지도의 반지름, 플랑크 길이부터 1 m 까지 로그 간격
  M_star: ADD 선의 기본 척도 $M_D$
  qubits: 양자 계수에 쓰는 얽힌 큐비트 수 $N$
