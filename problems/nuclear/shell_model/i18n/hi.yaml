title: नाभिकीय कोश मॉडल
summary: न्यूक्लिऑन वुड्स–सैक्सन कूप में स्वतंत्र रूप से परिक्रमा करते हैं। हर $(l, j)$ चैनल के लिए त्रिज्य श्रोडिंगर समीकरण को परिमित-अंतर हैमिल्टनियनों के एक बैच के रूप में हल करने और स्पिन–कक्षा बल बढ़ाने से मैजिक संख्याएँ 2, 8, 20, 28, 50, 82, 126 — विशेष रूप से स्थायी नाभिकों की न्यूक्लिऑन संख्याएँ — ऊर्जा स्तर योजना में सबसे बड़े अंतरालों के रूप में दिखती हैं।
notes: 'स्पिन–कक्षा के बिना स्तर 3D सरल आवर्ती दोलित्र की तरह गुच्छे बनाते हैं और अंतराल 2, 8, 20 और 40 न्यूक्लिऑनों के बाद आते हैं (वुड्स–सैक्सन कूप का सपाट तल 58, 92 और 138 भी अलग करता है)। स्पिन–कक्षा पद $j = l + \tfrac12$ को नीचे और $j = l - \tfrac12$ को ऊपर ले जाता है, जिसकी मात्रा $l$ के साथ बढ़ती है, इसलिए हर दोलित्र कोश का उच्च-$j$ साथी (1f7/2, 1g9/2, 1h11/2, 1i13/2) नीचे के कोश में गिर जाता है — 28, 50, 82 और 126 की मायर और जेन्सन की 1949 की व्याख्या। डिफ़ॉल्ट प्राचल ²⁰⁸Pb में न्यूट्रॉनों के लिए हैं: $V_0 = 51 - 33(N-Z)/A \approx 44$ MeV, $r_0 = 1.27$ fm, $a = 0.67$ fm। सरलीकरण: सभी स्तरों के लिए एक स्थिर कूप (कोई स्व-संगति नहीं, कोई युग्मन नहीं), कोई कूलॉम पद नहीं (अतः ये न्यूट्रॉन स्तर हैं), और 18 fm का बॉक्स, अतः केवल बद्ध स्तर दिखाए गए हैं।'
meanings:
- आंतरिक ग्रिड बिंदु; $r = 0$ पर और बॉक्स किनारे पर $u = 0$
- परिमित-अंतर $d^2/dr^2$
- $l = 8$ तक हर चैनल $(l, j = l \pm \tfrac12)$
- $j = l+\tfrac12$ के लिए $+l/2$, $j = l-\tfrac12$ के लिए $-(l+1)/2$
- कूप + स्पिन–कक्षा + अपकेंद्री, einsum('k,i->ki') से
- प्रति चैनल एक हैमिल्टनियन, एक के ऊपर एक
- $k$ पर बैच; बद्ध स्तर $E < 0$ रखें
- 'हर क्रमित स्तर तक भरे न्यूक्लिऑन: मैजिक संख्याएँ बड़े अंतरालों पर हैं'
labels:
  v_so: अंतिम स्पिन–कक्षा सामर्थ्य $V_{so}$
  v0: कूप गहराई $V_0$
  mass_number: द्रव्यमान संख्या $A$ ($R = r_0 A^{1/3}$ तय करती है)
  diffuseness: पृष्ठ विसरणता $a$
  n_grid: ग्रिड बिंदु
