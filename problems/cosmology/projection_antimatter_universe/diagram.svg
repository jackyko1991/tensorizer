<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Conformal time eta runs up the page; the Big Bang is the horizontal line eta = 0. One worldline crosses it: above, in our universe, it is matter (blue); below, in the CPT mirror universe where the arrow of time points down, the same stretch is antimatter (red). Arrows show the two arrows of time.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- the two halves -->
    <rect x="30" y="10" width="200" height="70" fill="#93c5fd" fill-opacity="0.25"/>
    <rect x="30" y="80" width="200" height="70" fill="#fecaca" fill-opacity="0.45"/>
    <!-- Big Bang -->
    <line x1="30" y1="80" x2="230" y2="80" stroke="#374151" stroke-width="2"/>
    <text x="150" y="94" font-size="12">Big Bang</text>
    <!-- arrows of time -->
    <line x1="18" y1="74" x2="18" y2="18" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="18" y1="86" x2="18" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="4" y="14" font-style="italic">η</text>
    <!-- the worldline: matter above, antimatter below -->
    <path d="M70,150 C80,120 95,100 105,80" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M105,80 C115,60 135,40 150,10" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- a time slice and its mirror -->
    <line x1="34" y1="44" x2="226" y2="44" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="34" y1="116" x2="226" y2="116" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="132" cy="44" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="86" cy="116" r="5" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="142" y="38" fill="#1e40af">matter</text>
    <text x="96" y="111" fill="#b91c1c">antimatter</text>
    <text x="160" y="24" font-size="11" fill="#1e40af">our universe</text>
    <text x="165" y="144" font-size="11" fill="#b91c1c">CPT mirror</text>
  </g>
</svg>
