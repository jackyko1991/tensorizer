source_hash: cb188a4168d9
title: Lennard-Jones 流体：分子动力学与径向分布函数
summary: 五百个原子在周期性盒子中通过 Lennard-Jones 势相互作用，用速度 Verlet 算法积分。所有原子对向量都放在一个按最小镜像约定广播的张量中，三个状态点（气体、三相点附近的液体和压缩的固体）作为一个批次运行。Berendsen 恒温器设定温度，随后进行能量守恒的 NVE 模拟，原子对距离的直方图给出 $g(r)$：气体是平坦的，液体是逐渐衰减的壳层，固体是尖锐的晶格峰。维里给出压强。
notes: 约化单位：长度以 $\sigma$ 计，能量以 $\varepsilon$ 计，质量为 1，$T^* = k_BT/\varepsilon$，时间 $\tau = \sigma\sqrt{m/\varepsilon}$；对氩，$\sigma = 3.4$ Å，$\varepsilon/k_B = 120$ K，所以液态状态点约为 86 K。这正是 Rahman 于 1964 年对液氩所做的模拟（Phys. Rev. 136, A405），使用了 Verlet 于 1967 年提出的积分器和 $g(r)$ 分析（Phys. Rev. 159, 98）。势能在 $r_c = 2.5\sigma$ 处截断并平移使其在该处为零，以保证能量连续；压强加上标准的长程修正 $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$，该修正假定截断半径之外 $g = 1$。Berendsen 恒温器把速度向目标温度缩放；它不能产生精确的正则涨落，因此只用于平衡阶段，测量来自普通的 NVE 模拟，其中平坦的能量曲线用来检验积分器。气体和液体从高温开始，使晶格熔化。液体 $g(r)$ 的第一个峰位于势能极小值 $2^{1/6}\sigma$ 附近，后面的壳层逐渐衰减，约到 $3\sigma$ 时 $g \to 1$；固体保留 fcc 峰。对气体，压强与理想气体以及第二维里修正 $P = \rho T(1 + B_2\rho)$ 比较，$B_2$ 用数值积分求得。模拟很短（几个 $\tau$），所以平均值带有百分之几的统计噪声。完整的原子对张量每步开销为 $O(N^2)$；生产级程序使用元胞列表或近邻列表来处理数百万个原子。
meanings:
- 约化单位下气体 $(0.05, 1.5)$、液体 $(0.84, 0.72)$、固体 $(1.10, 0.60)$
- 从 fcc 晶格出发，$N = 4n^3$ 个原子，盒子 $L_s = (N/\rho_s)^{1/3}$
- 通过广播一次得到所有原子对向量，再折回到最近镜像
- 重复的 $a$ ⇒ 求和
- $-u^{\prime}(r)/r$，对角线上以及 $r_c = 2.5\sigma$ 之外为零
- 重复的 $j$ ⇒ 求和；$d_{saji} = -d_{saij}$ 自动满足牛顿第三定律
- 半步冲量、漂移（折回盒子内）、新的力、半步冲量：时间可逆且能量守恒
- 仅在平衡阶段使用 Berendsen 恒温器
- $\rho T + W/3V$ 加上对 $r_c$ 之外原子对的长程修正
- 每个壳层中的原子对数除以理想气体计数 $\tfrac12 N\rho\,4\pi r^2\Delta r$
labels:
  rho_liquid: 液体密度 $\rho^*$
  T_liquid: 液体温度 $T^*$
  n_cells: 每边 fcc 晶胞数（$N = 4n^3$）
  dt: 时间步长 $\Delta t$
  equilibration_steps: 平衡步数
  production_steps: 采样步数
