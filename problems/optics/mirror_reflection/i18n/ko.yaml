source_hash: d32c883229aa
title: 평면 거울과 곡면 거울의 반사
summary: '벡터 공식 하나로 쓴 반사 법칙: 광선 방향 중 면의 법선 방향 성분만 뒤집습니다. 등에서 나온 광선은 평면 거울에서 반사되고, 평행 광선은 오목 거울에서 반사되어 초점 $F = R/2$ 근처에 모입니다.'
notes: 공식은 $\mathbf d$의 $\mathbf n$ 방향 성분만 뒤집으므로 입사각과 반사각이 저절로 같아집니다. 점선은 반사된 광선을 평면 거울 뒤로 연장한 것으로, 모두 등의 허상에서 만납니다. 오목 거울에서는 축에 가까운 광선(근축 광선)만 $F = R/2$를 지나고, 더 바깥의 광선은 거울에 더 가까운 곳에서 축을 가로지릅니다(구면 수차).
meanings:
- 입사 광선 $r$의 단위 방향, 성분 $i \in \{x, y\}$
- 광선 $r$이 닿는 곳에서 거울의 단위 법선
- '반복된 $j$ ⇒ 합: 광선마다 내적 하나 (${}= -\cos\theta_i$)'
- 반사된 방향, 여전히 단위 벡터
- 곡면 거울의 법선은 중심 $c$를 향함
labels:
  radius: 거울의 곡률 반지름 $R$
  n_rays: 거울당 광선 수
  aperture: 가장 높은 광선($R$에 대한 비율)
