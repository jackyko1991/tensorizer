<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A 3-SAT formula as a factor graph: five Boolean variables x1 to x5 (circles) and three clauses (squares), each clause joined to three variables; dashed edges are negated literals. Below, the 2^n assignments as a row of bits, one of them satisfying.">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- edges: solid = plain literal, dashed = negated literal -->
    <g stroke="#374151" stroke-width="2">
      <line x1="60" y1="34" x2="32" y2="86"/>
      <line x1="60" y1="34" x2="76" y2="86" stroke-dasharray="4 3"/>
      <line x1="60" y1="34" x2="120" y2="86"/>
      <line x1="120" y1="34" x2="76" y2="86"/>
      <line x1="120" y1="34" x2="164" y2="86" stroke-dasharray="4 3"/>
      <line x1="120" y1="34" x2="208" y2="86"/>
      <line x1="180" y1="34" x2="32" y2="86" stroke-dasharray="4 3"/>
      <line x1="180" y1="34" x2="164" y2="86"/>
      <line x1="180" y1="34" x2="208" y2="86" stroke-dasharray="4 3"/>
    </g>
    <!-- clauses -->
    <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
      <rect x="50" y="24" width="20" height="20"/><rect x="110" y="24" width="20" height="20"/><rect x="170" y="24" width="20" height="20"/>
    </g>
    <text x="54" y="16" font-size="12" fill="#b45309">∨</text>
    <text x="114" y="16" font-size="12" fill="#b45309">∨</text>
    <text x="174" y="16" font-size="12" fill="#b45309">∨</text>
    <!-- variables -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.5">
      <circle cx="32" cy="92" r="10"/><circle cx="76" cy="92" r="10"/><circle cx="120" cy="92" r="10"/>
      <circle cx="164" cy="92" r="10"/><circle cx="208" cy="92" r="10"/>
    </g>
    <g font-size="11" font-style="italic" fill="#ffffff">
      <text x="24" y="96">x₁</text><text x="68" y="96">x₂</text><text x="112" y="96">x₃</text>
      <text x="156" y="96">x₄</text><text x="200" y="96">x₅</text>
    </g>
    <!-- all 2^n assignments as one bit row -->
    <g stroke="#9ca3af" stroke-width="1">
      <rect x="24" y="124" width="192" height="14" fill="#f3f4f6"/>
    </g>
    <rect x="132" y="124" width="6" height="14" fill="#2563eb"/>
    <text x="24" y="154" font-size="12" fill="#374151">all 2<tspan dy="-5" font-size="9">n</tspan><tspan dy="5"> assignments, AND over clauses</tspan></text>
  </g>
</svg>
