source_hash: 16a2fcec9827
title: Поиск треков частиц как целочисленная программа
summary: 'Реальные хиты из смоделированного столкновения на HL-LHC (конкурс TrackML, CC BY 4.0) объединяются в треки с помощью целочисленной линейной программы: выбираются триплеты хитов с согласованной кривизной и полярным углом, причём каждый хит используется не более одного раза. Наш тензорный PDLP (прямо-двойственный гибридный градиент с перезапусками, LP-метод внутри OR-Tools и cuOpt) решает LP-релаксацию в реальном времени на разреженных тензорах, затем округляет её и исправляет. Он сравнивается с написанным вручную венгерским алгоритмом (Kuhn–Munkres) и с офлайн-запусками HiGHS, Gurobi и scipy: разрыв по целевой функции, эффективность, доля ложных треков, официальная оценка TrackML и масштабирование времени работы $t \propto N^k$.'
notes: 'Статус: сравнение инструментов, а не открытая проблема. ILP — это задача об упаковке множеств (в общем случае NP-трудная); PDLP — LP-метод первого порядка, а округление даёт эвристическое целочисленное решение, а не сертифицированный оптимум, поэтому разрыв до точного оптимума всегда указывается. Двойственная граница PDLP даёт сертифицированную верхнюю оценку даже без точного решателя. Метод. Сегменты-кандидаты соединяют хиты на соседних слоях, которые мог бы соединить трек с $p_T \ge p_{T,\min}$, выходящий из линии пучка. Триплеты соединяют два сегмента через общий средний хит и получают оценку $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ (сохраняются только $s_t > 0$). ILP выбирает триплеты $x_t$ и сегменты $y_e$: у каждого хита не более одного выбранного входящего и одного исходящего сегмента, поэтому треки являются цепочками. Выбранный сегмент продолжается не более чем в один выбранный триплет с каждой стороны, и каждый сегмент стоит $\lambda =
  0.1$. Её LP-релаксацию ($0 \le x, y \le 1$) решает наш PDLP (Applegate et al. 2021): PDHG с масштабированием Ruiz, перезапусками к среднему на основе условий KKT и обновлениями прямого веса, написанный на torch.sparse, так что он работает на CPU или CUDA. Венгерский базовый метод решает одну точную задачу линейного назначения на каждую пару слоёв (сначала средняя пара, затем внутрь и наружу, со стоимостями триплетов с учётом уже построенной цепочки). Это двудольное паросочетание, решаемое точно за полиномиальное время, но оно принимает решение для одной пары слоёв за раз, тогда как ILP взвешивает целые цепочки глобально. Поэтому его треки отличаются. Данные. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), обучающее событие 1000 (200 наложенных столкновений): запись Zenodo 4730167, doi:10.5281/zenodo.4730167, лицензия CC BY 4.0 (Salzburger, Innocente, Vlimant, Rousseau et al.). Оно ограничено пиксельным баррелем (объём 8, 4 слоя) с $|\eta| < 1$: 11 519 хитов, 2 452 частицы и 6%
  шума, плюс официальные веса хитов. Офлайн-бенчмарк (data/solver_benchmark.csv) на AMD Ryzen 5 5600G (1 поток): HiGHS через scipy 1.18.1 (milp, linprog), Gurobi 13 через gurobipy с лицензией, ограниченной по размеру (не более 2000 переменных и 2000 ограничений, поэтому только $\Delta\phi \le 30°$), linear_sum_assignment из scipy и наш PDLP на CPU и на NVIDIA GTX 1080 Ti. NVIDIA cuOpt 26.10 был установлен в WSL, но не смог запуститься: его ядра собраны для вычислительной способности 7.0 (Volta) и новее, а у 1080 Ti она 6.1 (cudaErrorNoKernelImageForDevice), поэтому он пропущен и чисел для него нет. Цитируемый уровень техники приведён в data/trackml_sota.csv. Вывод. На всех восьми секторах (от 5° до 360°, от 151 до 11 519 хитов) LP-релаксация оказалась точной: LP-оптимум HiGHS совпадает с MILP-оптимумом с точностью до $10^{-13}$. Наш PDLP с исправлением каждый раз достигал того же оптимума (разрыв меньше $10^{-9}$), выбирая ровно те же триплеты, что HiGHS и Gurobi (0 отличий). Это эмпирический
  результат, а не гарантия: упаковка множеств NP-трудна, и здесь точность LP обеспечивает структура цепочек из четырёх слоёв. При непрерывных оценках точные равенства маловероятны, поэтому решатели, достигшие оптимума, совпадают. В середине работы примерно треть значений PDLP дробные, многие близки к $\tfrac12$ там, где конкурирующие триплеты почти равны (например, двойные хиты в перекрывающихся модулях); они устанавливаются по мере сходимости PDLP. Венгерские цепочки на 0–2.2% хуже оптимума (от 5 до 651 отличающихся триплетов) и точно совпадают с целевой функцией назначения scipy (проверка нашего венгерского алгоритма). Полное подмножество барреля (360°): эффективность 93.1% и доля ложных треков 13.0% у ILP-решателей против 90.9% и 16.2% у венгерского алгоритма, оценка TrackML 0.495 против 0.482. Идеальный трекер реконструируемых частиц получил бы здесь 0.618; цитируемый уровень техники для полных событий — от 0.88 до 0.94 (Mikado 0.944 за 0.56 s). Масштабирование при $N \ge 1000$ хитов:
  HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, наш PDLP на CPU $N^{0.92}$, на GPU $N^{0.36}$ (при 10 000 переменных ещё доминируют накладные расходы на запуск ядер, поэтому 1080 Ti пока не быстрее), наш венгерский алгоритм $N^{2.14}$ (в худшем случае $O(n^3)$; разреженные отфильтрованные стоимости делают увеличивающие пути короткими), scipy $N^{1.57}$. Gurobi укладывается в своё ограничение по размеру только до 860 хитов (там $N^{1.04}$). При таких размерах HiGHS так же быстр, как PDLP; методы первого порядка окупаются на гораздо более крупных LP. На малых секторах венгерский алгоритм находит немного больше частиц (97.4% против 94.8% при 30°): целевая функция ILP — это косвенный показатель, а не физическая метрика. Оговорки. Наши примеры — сектор барреля с 4 слоями, поэтому у треков не более 4 хитов и нет торцевых частей: это проще полных событий конкурса и отличается от них. Сравнение оценок TrackML ориентировочное, а не в равных условиях: около 40% веса оценки подмножества приходится на
  частицы ниже порога по $p_T$ или с менее чем 3 слоями внутри отбора, а наши времена охватывают одну десятую события и не включают чтение данных и построение кандидатов. Реальные трекеры (ACTS и собственные трекеры экспериментов) используют комбинаторные фильтры Калмана, а графовые нейронные сети (Exa.TrkX) — основной подход машинного обучения; никто не решает MILP для каждого события.'
meanings:
- 'реальные хиты TrackML на 4 слоях пиксельного барреля, ограниченные сектором $\Delta\phi$: размер задачи'
- пары хитов на соседних слоях с $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ и $|z_0| \le 150$ mm, все пары сразу
- кривизна окружности, проходящей через линию пучка и оба хита
- триплеты имеют общий средний хит; у спирали одинаковые $\kappa$ и $\theta$ на обеих половинах, поэтому $s_t$ уменьшается с ростом расхождения
- строки исключительности хитов (один сегмент входит, один выходит) и строки непрерывности; повторяющийся $v$ ⇒ суммируется в каждом произведении
- PDHG на LP, масштабированной по Ruiz, с усреднением, перезапусками и прямым весом; два разреженных умножения матрицы на вектор за итерацию
- упорядочить сегменты по значению LP, принимать бесконфликтные в параллельных раундах, обрезать концы цепочек, которые стоят больше, чем приносят
- 'Kuhn–Munkres с потенциалами: одно точное линейное назначение на каждую пару слоёв, сцепленное в треки'
- 'официальная оценка TrackML: сумма весов хитов на треках, которые содержат > 50% хитов частицы и на > 50% состоят из этой частицы'
labels:
  dphi: Ширина сектора $\Delta\phi$ (размер задачи)
  pt_min: Минимальный поперечный импульс $p_{T,\min}$
  max_iter: Максимальное число итераций PDLP
  digits: Целевая точность PDLP $10^{-k}$, $k$ =
  check: Итераций между проверками перезапуска (по одному кадру)
