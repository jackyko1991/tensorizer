source_hash: 6b976c8609c8
title: La conjecture de Hodge
summary: 'Calculer des diamants de Hodge en comptant : pour les hypersurfaces de Fermat $x_0^d + \dots + x_{n+1}^d = 0$, les nombres de Hodge sont les coefficients d''une puissance de polynôme, et pour les tores complexes et les produits ce sont des produits extérieurs et des convolutions. Le comptage des caractères de Shioda donne ensuite les classes de Hodge rationnelles, celles dont la conjecture de Hodge affirme qu''elles doivent provenir de sous-variétés. Pour les surfaces, c''est le théorème $(1,1)$ de Lefschetz, qui est démontré, et les droites tracées sur la surface l''illustrent. En dimension supérieure, la conjecture reste ouverte ; cette page se contente de compter les classes.'
notes: 'Sur une variété kählérienne compacte, chaque classe de cohomologie se décompose en morceaux de type $(p, q)$ : $p$ directions holomorphes et $q$ directions antiholomorphes (Hodge, 1941). Les nombres $h^{p,q}$ vérifient la symétrie de Hodge $h^{p,q} = h^{q,p}$ et la dualité de Serre $h^{p,q} = h^{n-p,n-q}$, et chaque diamant à gauche passe ces deux tests. Leur somme alternée est la caractéristique d''Euler, qui pour une hypersurface de degré $d$ vaut $((1-d)^{n+2} - 1)/d + n + 2$. Le diamant la retrouve, ainsi que $h^{1,1} = 20$ pour la quartique K3, $h^{2,1} = 101$ pour la quintique de dimension trois et $h^{3,1} = 1$ pour la cubique de dimension quatre. Une sous-variété $Z$ de codimension $p$ définit une classe rationnelle de type $(p, p)$. La conjecture de Hodge (Hodge 1950 ; l''un des problèmes du prix du millénaire de l''institut Clay) affirme que toute classe rationnelle $(p, p)$ est une combinaison rationnelle de telles classes. Ce qui est démontré : $p = 1$ par le théorème
  $(1,1)$ de Lefschetz (1924), donc $p = n-1$ par le théorème de Lefschetz difficile. Elle est aussi vraie pour les variétés abéliennes de dimension au plus 3, pour les variétés uniréglées de dimension quatre et les cubiques de dimension quatre (Conte–Murre, Zucker), et dans de nombreux cas particuliers, dont les variétés de Fermat de nombreux degrés (Shioda 1979, Ran 1980). La version entière est fausse (Atiyah–Hirzebruch, 1962). Pour les variétés de Fermat, les caractères de Shioda rendent les classes de Hodge rationnelles dénombrables, avec une condition par conjugué de Galois. Pour les surfaces, ce nombre est le nombre de Picard : $7, 20, 37, 86$ pour $d = 3, 4, 5, 6$, et $3(d-1)(d-2) + 1$ lorsque $\gcd(d, 6) = 1$. Les $3d^2$ droites de la surface donnent des classes algébriques explicites, et leur matrice d''intersection (rang et signature de l''indice de Hodge $(1, \rho - 1)$, calculés ici) les engendre toutes sur $\mathbb Q$ exactement lorsque $d \le 4$ ou $\gcd(d, 6) = 1$. Pour $d
  = 6, 8, 9, 10$, il faut d''autres courbes, dont l''existence est garantie par Lefschetz. Pour les variétés de Fermat de dimension quatre, le programme compte les classes de Hodge, mais savoir si chacune est algébrique, c''est précisément la conjecture. État (novembre 2026) : ouvert. La collection de manuscrits générés par IA publiée par OpenAI (github.com/openai/math, famille 032) affirme démontrer la conjecture de Hodge rationnelle pour toute variété abélienne CM et annonce une formalisation de cet énoncé en Lean. Il s''agit d''une affirmation produite par machine, non relue par des pairs, en attente de vérification par la communauté mathématique, et même si elle est correcte, elle ne couvre qu''une classe particulière, pas la conjecture générale.'
meanings:
- 'multiplier des polynômes revient à convoluer leurs vecteurs de coefficients, répété $n+2$ fois : la base de monômes $x^b$, $0 \le b_i \le d-2$, de l''anneau jacobien du polynôme de Fermat'
- 'Griffiths : les nombres de Hodge primitifs du milieu sont donnés par l''anneau jacobien en degré $(q+1)d - (n+2)$'
- 'un tore complexe : $\wedge^p$ des $dz$ fois $\wedge^q$ des $d\bar z$'
- 'Künneth : chaque paire de classes, additionnée dans la case $(a + c, b + d)$'
- 'caractères de Shioda : $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$ ; chacun indexe une droite $V(a)$ de la cohomologie primitive'
- '$i$ répété ⇒ sommé : le type de Hodge de tous les conjugués de Galois $t\cdot a$ à la fois'
- 'une classe de Hodge rationnelle : de type $(\frac n2, \frac n2)$ pour chaque conjugué'
- deux droites se coupent si et seulement si leurs quatre vecteurs générateurs dans $\mathbb C^4$ sont liés ; $L^2 = 2-d$ par adjonction
- 'rang du réseau engendré par les droites, et sa signature (théorème de l''indice de Hodge : exactement une valeur propre positive)'
labels:
  d_max: Plus grand degré $d$
  n_max: Test d'Euler jusqu'à la dimension $n$
  g_max: Tores jusqu'à la dimension $g$
