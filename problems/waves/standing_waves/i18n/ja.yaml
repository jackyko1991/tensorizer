source_hash: 902cc4c799f5
title: 弦の定在波
summary: 両端を固定した弦の1次元波動方程式。2階微分は行列（差分ステンシル $D_{ij}$）になるので、1回の einsum で複数の弦のすべての点を一度に動かせる：低次の倍音とはじいた弦。
notes: 1行目から $n$ 行目は単一の倍音 $\sin(n\pi x/L)$ の形から始まり、$f_n = nc/2L$ でその場で振動するだけである：定在波である。はじいた弦（三角形）は多くの倍音の和なので、その折れ目は2つに分かれて両端へ走り、反転して戻ってくる。基本周期 $2L/c$ が1回経つと、すべての形が出発時に戻る。時間刻みはクーラン条件 $c\,\Delta t \le \Delta x$ に従う。弦を減衰させるものがないので、エネルギー $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$（線密度あたり）は一定に保たれる。
meanings:
- 内部格子点 $i$ における弦 $b$ の変位（固定された両端は除く）
- 2階微分行列：対角に $-2$、その隣に $1$
- 繰り返される $j$ ⇒ 和をとる：各弦の $\partial_x^2 u$
- 時間についての中心差分（リープフロッグ）
- $D$ の固有値が $\omega_n^2 = -c^2\lambda_n$ を与える：倍音
labels:
  n_harmonics: 表示する倍音の数
  pluck_at: はじく位置 $x_p/L$
  c: 波の速さ $c$
  L: 弦の長さ $L$
  n_points: 格子点数
  periods: シミュレーションする基本周期数
