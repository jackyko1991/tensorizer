source_hash: 7a350e6eef20
title: 霍金辐射与黑洞蒸发
summary: 黑洞像黑体一样以霍金温度 $T_H = \hbar c^3/(8\pi G M k_B)$ 发光。一次广播即可同时计算多个质量和波长的普朗克定律，并用 RK4 积分质量损失 $dM/dt = -\alpha/M^2$：黑洞缩小、变热，最终在 $t \propto M^3$ 之后以爆发告终。
notes: 全程使用 SI 单位。一个太阳质量的黑洞温度为 $6\times10^{-8}$ K，远低于 2.7 K 的微波背景，因此真实的天体物理黑洞吸收多于发射。只有极小的（原初）黑洞会蒸发：大爆炸时形成、质量约 $2\times10^{11}$ kg 的黑洞如今正要蒸发殆尽。该模型只计光子，并把视界看作面积为 $4\pi r_s^2$ 的理想黑体；真实黑洞还会发射中微子、引力子，足够热时还有更重的粒子，从而缩短寿命，而灰体因子会改变光谱形状。时间步长的选取使每个 RK4 步消耗剩余质量的固定比例；动画以 $\log M$ 的等步长推进，所以最后几帧只覆盖极短的时间。视界半径按 $M^{0.35}$ 绘制，以保持可见。
meanings:
- 一批黑洞质量（kg）：太阳、地球……以及动画中的黑洞
- 霍金温度，逐元素计算
- 对数间隔的波长网格
- 通过 T[:, None] 与 lam[None, :] 广播求普朗克谱
- 维恩定律 $b/T_H$
- 视界的斯特藩–玻尔兹曼辐射功率
- $-P/c^2$，用 RK4 积分
- 解析寿命，与积分结果比较
labels:
  log10_mass: 初始质量 $\log_{10}(M_0/\mathrm{kg})$
  burn_fraction: 每个 RK4 步消耗的质量比例
