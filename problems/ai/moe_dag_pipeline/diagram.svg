<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A digit image and a short text go through an image encoder and a text encoder; a router picks one of three fuse experts (plus, minus, times) per sample; a classifier gives the answer digit">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
    <!-- inputs: a digit image and a text -->
    <rect x="8" y="22" width="26" height="26" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="14" y="42" font-size="20" font-weight="bold" fill="#374151">7</text>
    <text x="4" y="110" font-size="10" fill="#374151">"plus</text>
    <text x="4" y="122" font-size="10" fill="#374151">three"</text>
    <!-- encoders -->
    <rect x="46" y="24" width="34" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="52" y="39" font-size="10">img</text>
    <rect x="46" y="104" width="34" height="22" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="52" y="119" font-size="10">text</text>
    <g stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="34" y1="35" x2="44" y2="35"/>
      <line x1="34" y1="114" x2="44" y2="114"/>
    </g>
    <!-- router -->
    <rect x="50" y="68" width="26" height="18" rx="3" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
    <text x="57" y="81" font-style="italic">G</text>
    <line x1="63" y1="104" x2="63" y2="88" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- experts -->
    <rect x="112" y="22" width="40" height="22" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
    <text x="127" y="38" font-size="14">+</text>
    <rect x="112" y="66" width="40" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="127" y="82" font-size="14" fill="#9ca3af">−</text>
    <rect x="112" y="110" width="40" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="127" y="126" font-size="14" fill="#9ca3af">×</text>
    <g stroke="#16a34a" stroke-width="1.8" marker-end="url(#green)">
      <line x1="80" y1="35" x2="110" y2="33"/>
      <line x1="80" y1="112" x2="110" y2="38"/>
      <line x1="152" y1="33" x2="180" y2="72"/>
    </g>
    <g stroke="#d1d5db" stroke-width="1" fill="none">
      <line x1="80" y1="38" x2="112" y2="77"/><line x1="80" y1="40" x2="112" y2="121"/>
      <line x1="80" y1="116" x2="112" y2="80"/><line x1="80" y1="118" x2="112" y2="121"/>
      <line x1="152" y1="77" x2="180" y2="77"/><line x1="152" y1="121" x2="180" y2="82"/>
    </g>
    <path d="M76,77 Q96,60 110,40" fill="none" stroke="#111827" stroke-width="1.2" stroke-dasharray="3 2"/>
    <!-- classify -->
    <rect x="182" y="66" width="34" height="22" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
    <text x="194" y="81" font-style="italic">y</text>
    <text x="186" y="104" font-size="11">= 0</text>
    <text x="96" y="152" font-size="10" fill="#374151">fixed router = workflow DAG</text>
  </g>
</svg>
