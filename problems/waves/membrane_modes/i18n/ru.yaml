title: Моды колеблющейся мембраны
summary: Нормальные моды квадратной или круглой мембраны барабана. Двумерный лапласиан на сетке строится из одномерного с помощью кронекеровых произведений, $\Delta = D\otimes I + I\otimes D$, и один вызов симметричного решателя собственных задач (eigh) возвращает все формы мод и частоты сразу.
notes: 'Каждая панель показывает одну моду $\phi_m(x, y)\cos(\omega_m t)$; белые линии внутри — узловые линии, которые никогда не движутся. Для квадрата со стороной $L$ точные частоты $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$, поэтому отношения к основной частоте равны $\sqrt{(m^2+n^2)/2}$ = 1, 1,58, 1,58, 2, 2,24 …: не целые числа, поэтому барабан и не звучит как струна. Пары вроде $(1,2)$ и $(2,1)$ имеют общую частоту, и eigh возвращает какую-то их смесь. Для круга точные отношения получаются из нулей функций Бесселя (1, 1,59, 2,14, 2,30 …); ступенчатый край сетки сдвигает их на несколько процентов. Единицы: $c = 1$, сторона квадрата или диаметр круга $L = 1$; время показано в периодах основного тона.'
meanings:
- одномерная вторая производная с закреплёнными краями ($u = 0$ снаружи)
- 'парный индекс $p = (a, b)$ нумерует точки сетки: двумерный лапласиан'
- оставляем только точки внутри мембраны (круговая маска); край закреплён
- собственные значения $\omega^2/c^2$ и ортонормированные формы мод в столбцах
- 'повторяющийся $p$ ⇒ суммирование: единичная матрица'
labels:
  shape: Форма мембраны
  n_grid: Точек сетки на сторону
  periods: Показано периодов основного тона
