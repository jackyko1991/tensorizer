source_hash: d29dc3e384c1
title: 'Повторное зажигание мёртвых звёзд: коричневые карлики, новые, рентгеновские вспышки и чёрные дыры'
summary: Что происходит, когда звёздный остаток получает свежий газ? Коричневый карлик, выросший больше примерно $0.075\,M_\odot$, может начать жечь водород и стать звездой; белый карлик поджигает аккрецированный водородный слой как классическая новая; нейтронная звезда каждые несколько часов вспыхивает аккрецированным H/He как рентгеновский барстер I типа; у чёрной дыры нет поверхности, поэтому ничего не загорается и она лишь светится, вплоть до эддингтоновского предела. Одна пакетная тензорная модель (политропы Лейна–Эмдена, вырожденное уравнение состояния и однозонное зажигание слоя с autograd) сразу даёт критическую аккрецированную массу для каждого остатка и каждой массы.
notes: 'Точные результаты: константы Лейна–Эмдена (Lane–Emden), масса Чандрасекара ($1.456\,M_\odot$ при $\mu_e = 2$), светимость Эддингтона ($1.26\times10^{38}$ erg/s на $M_\odot$) и эффективность на ISCO (от $5.7\%$ до $42\%$). Всё остальное — модель с точностью до порядка величины: (1) Коричневые карлики: наибольшая температура, которую когда-либо достигает сжимающийся политроп $n = 3/2$, $T_{\max} \propto M^{4/3}$, в сравнении с $3\times10^5$ K (медленное горение дейтерия на протяжении миллиардов лет) и $3\times10^6$ K (водород); модель даёт около $14\,M_J$ и $0.074\,M_\odot$, близко к пределам эволюционных моделей около $13\,M_J$ (Spiegel et al. 2011) и $0.07$–$0.08\,M_\odot$ (Burrows et al. 2001). Это необходимое условие: старый холодный коричневый карлик, перешедший предел, должен ещё и нагреться за счёт аккреции (сжатия), прежде чем загорится. (2) Новые: массы зажигания от $10^{-7}$ до $10^{-3}\,M_\odot$, меньше для более тяжёлых белых карликов и более быстрой аккреции, как в сетках
  моделей новых Yaron et al. (2005), но лишь с точностью до множителя в несколько раз (теплопроводность, перемешивание и экранирование не учитываются). Новые, вероятно, выбрасывают как минимум то, что было аккрецировано, поэтому вопрос о том, может ли белый карлик дорасти до $M_{\rm Ch}$ и взорваться как сверхновая типа Ia (канал с одним вырожденным компонентом), остаётся дискуссионным. (3) Рентгеновские вспышки: столбы зажигания около $10^8$ g/cm² и времена повторения в часы, как и наблюдается (Galloway и Keek 2021); гравитационная энергия на грамм примерно в 40 раз больше ядерной ($\alpha$). Та же аккреция, что запускает вспышки, раскручивает нейтронную звезду: около $0.04\,M_\odot$ превращает старый пульсар в миллисекундный. (4) Чёрные дыры: нет поверхности — нет вспышки.'
meanings:
- 'один аккрецирующий остаток на элемент: белые карлики (масса $\times$ темп) и нейтронные звёзды (топливо $\times$ темп)'
- поверхностная плотность столба аккрецированного слоя, g/cm²; давление $P = g y$
- обращение уравнения для идеальных ионов + частично вырожденных электронов пакетной бисекцией
- радиационная температура основания, итерация неподвижной точки ($\kappa$, $\rho$ зависят от $T$)
- 'неустойчивость тонкого слоя: нагрев растёт с $T$ быстрее охлаждения ⇒ тепловой разгон'
- 'критическая аккрецированная масса: новая или рентгеновская вспышка'
- политроп $n = 3/2$, сжимающийся через все радиусы; максимум по $r$ ⇒ пределы для коричневых карликов
- 'Лейн–Эмден для $n = 1, 3/2, 3$ одновременно: константы $\omega_3$, $\rho_c/\bar\rho$, $P_c$'
- 'чёрная дыра: только свет аккреции, $\eta = 1 - E_{\rm ISCO}$'
