title: Газ Ван-дер-Ваальса и правило Максвелла
summary: Уравнение Ван-дер-Ваальса добавляет к идеальному газу притяжение и размер молекул — и сразу появляется переход жидкость–газ. Целое семейство изотерм — один broadcast $(T, V)$; ниже критической температуры нефизичная петля заменяется прямой равных площадей Максвелла, давление которой находится бисекцией сразу для пакета температур.
notes: '$a$ характеризует притяжение молекул (оно понижает давление), а $b$ — объём, занимаемый одним молем молекул ($V$ не может быть меньше $nb$). Ниже $T_c$ у изотермы есть участок, где сжатие газа понижало бы его давление, — механически неустойчивый. В действительности газ конденсируется при постоянном давлении $p^*$ — давлении насыщенного пара: жидкость с молярным объёмом $V_l$ сосуществует с газом объёма $V_g$. Правило Максвелла фиксирует $p^*$ требованием равенства площадей над и под прямой (что эквивалентно равенству энергий Гиббса двух фаз). Штриховой купол соединяет все $(V_l, p^*)$ и $(V_g, p^*)$; его вершина — критическая точка, где жидкость и газ становятся неразличимы. Оси нормированы на критические значения, в которых любой газ Ван-дер-Ваальса выглядит одинаково (закон соответственных состояний); ось объёма линейная, чтобы закрашенные площади можно было сравнить на глаз. Модель Ван-дер-Ваальса для реальных веществ лишь качественная: например, её $V_c = 3nb$ завышает реальные
  критические объёмы.'
meanings:
- набор температур в виде столбца
- сетка объёмов в виде строки
- все изотермы сразу через broadcasting
- корни кубического уравнения $p(V) = p^*$ для пакета температур
- 'площадь со знаком между кривой и прямой: нуль в ответе'
- 'бисекция: torch.where сдвигает все интервалы сразу'
