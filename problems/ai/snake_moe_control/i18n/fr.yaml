title: Snake joué par un CNN et un mélange de contrôleurs experts
summary: 'Un agent de jeu construit en deux parties : un petit CNN qui regarde le plateau et un réseau de contrôle qui choisit le coup, ici un mélange d''experts dont le routeur envoie chaque partie vers l''un de $K$ petits réseaux experts. Le jeu est Snake sur une grille $10 \times 10$, écrit entièrement en tenseurs, de sorte qu''un lot de parties avance en une seule étape. Les contrôleurs apprennent en imitant un professeur planificateur (parcours en largeur et remplissage par diffusion, eux aussi des opérations tensorielles). Quatre contrôleurs avec le même budget de poids sont comparés : un mélange dense, un routeur Switch top-1, un routeur entraîné en dense utilisé en top-1 et un simple MLP ; puis le routage est mesuré par rapport à l''état du jeu, pour voir à quoi sert chaque expert, s''il sert à quelque chose. Les quatre mangent environ 20 aliments par partie là où une politique aléatoire en mange 0.2, soit deux tiers du score du professeur ; à cette taille, le simple MLP fait aussi
  bien que n''importe quel mélange.'
notes: 'Idée. Jacky Ka Long Ko a proposé un agent de jeu composé d''un CNN pour la perception et d''un réseau de contrôle avec un routage par mélange d''experts, et a demandé avant tout la partie routage tensoriel. Ce problème en construit un petit sur Snake, un jeu sur grille générique écrit ici de zéro (rendu pixel propre, sans ressources externes). Jeu. $B$ parties sur un plateau $N \times N$ ($N = 10$) forment un seul ensemble de tenseurs. Le plateau stocke l''âge de chaque cellule du corps (nombre de coups avant qu''elle ne redevienne libre : la tête a l''âge = longueur, la queue 1), de sorte qu''un coup de toutes les parties se réduit à une poignée d''opérations tensorielles : la tête avance en $\mathbf x + \Delta_{d''}$ avec la nouvelle direction $d'' = (d + a - 1) \bmod 4$ pour l''action relative $a$ (gauche, tout droit, droite) ; un mur ou une cellule d''âge $> 1$ termine la partie (la cellule de la queue est en train de partir, elle est donc libre) ; sans nourriture, chaque âge
  diminue de 1, avec de la nourriture le serpent garde sa queue et grandit d''une case ; la nouvelle nourriture est la cellule vide portant le plus grand de $N^2$ nombres uniformes tirés avec graine, elle ne tombe donc jamais sur le corps. Une partie se termine aussi après $N^2$ coups sans nourriture ou lorsque le serpent remplit le plateau. Tests : collision avec le mur et avec soi-même, la cellule de queue libre, la croissance d''une case, la nourriture jamais sur le corps, les âges toujours exactement $\ell, \ell - 1, \dots, 1$, et l''étape par lot égale à une simple boucle Python partie par partie avec les mêmes nombres aléatoires. Agent. La perception est un CNN (convolution 3×3 à 8 canaux, convolution 3×3 de pas 2 à 16 canaux, couche linéaire vers $F = 64$ caractéristiques ; 84 472 poids) appliqué à une vue centrée sur la tête, direction vers le haut, à quatre plans : mur, corps, âge/longueur (quelles cellules se libèrent en premier) et nourriture. Dans ce repère, les trois coups relatifs
  sont toujours les trois mêmes voisins du centre (un test vérifie qu''un coup est mortel exactement lorsque ce voisin est un mur ou une cellule du corps qui reste). Le contrôle est un mélange de $K = 4$ experts, chacun un MLP $64 \to 32 \to 3$ donnant des logits d''action, derrière un routeur softmax $p = \mathrm{softmax}(W^G \mathbf h + b^G)$ : 8976 poids. La couche routée est celle de moe_dag_pipeline, importée de celui-ci : un tenseur de répartition place chaque partie dans le tampon de son expert (rangs cumulés, comme dans GShard et Switch), tous les experts s''exécutent en un seul einsum par lot, et un einsum de combinaison ramène les logits. Vérifications exactes : avec un routeur one-hot fixe, la couche équivaut à exécuter seul l''expert de chaque partie (à $10^{-6}$ près), un routeur dense uniforme donne la moyenne des experts, les lignes du routeur somment à 1, et la perte d''équilibrage de charge sur des cas connus (1 si équilibré, $K$ si effondré, 1.1 sur un exemple calculé à
  la main). Quatre contrôleurs, même budget : (a) un mélange dense $z = \sum_k p_k f_k$ (chaque expert sur chaque partie) ; (b) Switch top-1, seul l''expert le plus probable s''exécute et ses logits sont multipliés par $p_k$ ; (c) le modèle entraîné en dense de (a) exécuté avec un routage top-1, sans entraînement supplémentaire ; (d) un seul MLP $64 \to 132 \to 3$ (8979 poids, autant que le mélange). (a) et (b) ajoutent tous deux la perte d''équilibrage de charge de Switch avec $\alpha = 0.01$. Chaque variante a deux graines ; la graine $s$ part des mêmes poids de CNN et d''experts dans chaque variante, et les six modèles entraînés partagent un même axe de modèle (la convolution groupée du CNN), chacun avec ses propres mini-lots. Professeur et entraînement. Le professeur est un planificateur écrit avec les mêmes tenseurs : parcours en largeur sous forme de relaxation répétée sur les cellules libres ($\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$) et,
  dans la même boucle, un remplissage par diffusion qui étiquette chaque région libre par le plus petit indice de ses cellules. Il ne joue jamais un coup mortel, préfère un coup dont la région libre peut contenir le serpent, puis le plus court chemin vers la nourriture, puis la plus grande région ; un test vérifie que son champ de distances est égal à celui d''un BFS classique à base de file. L''entraînement est du clonage comportemental (Pomerleau 1989) : entropie croisée sur les coups du professeur, à partir de 54 040 états issus de 192 parties du professeur, 600 pas d''AdamW de 128 états par modèle, avec un tour de DAgger (Ross et al. 2011) après 360 pas : les élèves jouent chacun 48 parties, le professeur étiquette les 38 267 états qu''ils atteignent, et l''entraînement continue sur les deux. Aucun affinage par apprentissage par renforcement n''est effectué ; le deep Q-learning (Mnih et al. 2015) est la manière classique d''apprendre de tels jeux à partir de la seule récompense, ce qui
  prendrait bien plus longtemps sur un CPU. Résultats (exécution par défaut, 128 parties d''évaluation communes à toutes les politiques : mêmes départs et même séquence de nourriture, au plus 300 coups). Nourriture mangée par partie, moyenne sur les parties, avec les deux graines : aléatoire 0.16 (meurt après 15 coups) ; (a) dense 20.7 (20.9, 20.4) ; (b) Switch 20.4 (21.1, 19.6) ; (c) dense→top-1 18.1 (18.4, 17.8) ; (d) monolithique 21.7 (21.8, 21.6) ; professeur 31.0 (287 coups sur 300 survécus en moyenne, contre 147–179 pour les élèves). Les élèves sont d''accord avec le professeur sur 95–96 % des états d''entraînement, mais obtiennent un tiers de moins : les petites erreurs s''accumulent au fil d''une partie, la faiblesse habituelle du clonage comportemental. Un test lent vérifie qu''une politique entraînée bat nettement l''aléatoire. Le routage, montré même là où il ne s''agit pas d''une spécialisation. Les routeurs denses utilisent les quatre experts (charges 0.16–0.38). Ce qu''ils
  suivent le mieux, c''est le coup lui-même : l''information mutuelle entre l''expert routé et le coup du contrôleur est de 0.51 et 0.56 bit (2 bits est le maximum possible avec quatre experts) ; avec la graine 1, un expert prend presque tous les virages à gauche et à droite et presque tous les états sans cellule libre devant, tandis que les trois autres se partagent les coups tout droit. Les cellules libres devant portent 0.20–0.28 bit, la distance à la nourriture 0.08–0.12 et la longueur du corps 0.02–0.13 (une dérive des serpents courts vers les longs avec la graine 1 seulement). Les experts se répartissent donc selon quoi faire (tourner ou continuer), et non selon une stratégie comme la chasse à la nourriture contre l''évitement de la queue ; comme la sortie d''un expert décide du coup, cette répartition est en partie intégrée par construction. Les routeurs Switch se sont effondrés malgré la perte d''équilibrage : la graine 1 envoie 85 % des états vers un expert et 15 % vers un second,
  la graine 2 73 % et 26 %, deux experts inutilisés dans chaque cas ; la difficulté de brisure de symétrie observée dans moe_dag_pipeline apparaît ici sous forme d''effondrement. Cela ne coûte rien en score, car un seul expert avec le CNN partagé (qui contient la plupart des poids) joue déjà aussi bien que quatre. Exécuter le routeur entraîné en dense en top-1 (c) conserve le routage dense (0.60 et 0.67 bit avec le coup) mais perd 2.6 aliments par partie : le modèle dense mélange ses experts et n''est pas tout à fait séparable. Ce qui tient et ce qui ne tient pas. Exact : le jeu par lot est égal à la boucle de référence, la couche routée avec un routeur fixe est égale aux appels d''expert partie par partie, et le mélange dense avec un routeur uniforme est la moyenne des experts. Mesuré sur une seule taille de plateau avec deux graines : l''imitation amène chaque contrôleur à environ deux tiers du professeur, et aucun mélange ne bat le simple MLP à poids égaux (le MLP est devant d''environ
  1 aliment par partie avec les deux graines, un petit écart à deux graines). Les mélanges d''experts sont rentables lorsque de nombreux experts contiennent bien plus de poids qu''une seule entrée ne peut en utiliser ; un contrôleur à quatre experts derrière un CNN qui fait l''essentiel du travail démontre le routage, pas son avantage. Travaux connexes. Les mélanges adaptatifs d''experts locaux (Jacobs, Jordan, Nowlan et Hinton 1991) ont introduit une porte qui attribue chaque cas à l''un de plusieurs experts en compétition ; la couche MoE à porte creuse (Shazeer et al. 2017) et le Switch Transformer (Fedus et al. 2021, routage top-1 et la perte d''équilibrage de charge utilisée ici) l''ont passée à l''échelle. Les deep Q-networks (Mnih et al. 2015) ont appris des jeux Atari à partir des pixels avec un CNN et la seule récompense ; ALVINN (Pomerleau 1989) dirigeait un véhicule en imitant un conducteur humain, l''origine du clonage comportemental, et DAgger (Ross, Gordon et Bagnell 2011) corrige
  ses erreurs cumulées en étiquetant les états que l''apprenant visite lui-même. Matériel et limites. CPU par défaut : environ 80 s de professeur, d''entraînement et d''évaluation sur une machine à 6 cœurs chargée (6.6 s de parties du professeur, 6.0 s de DAgger, 53 s d''entraînement, 16 s d''évaluation) plus environ 30 s pour le GIF ; un GPU (pixi run -e cuda) accélère le CNN mais pas les nombreuses petites recherches du professeur. Le GIF montre (c), dont le routeur utilise tous les experts et en exécute exactement un par partie ; routing.png montre les trois variantes routées, routing.csv et scores.csv contiennent les chiffres.'
meanings:
- 'le plateau de la partie $b$ : 0 = vide, sinon le nombre de coups avant que cette cellule du corps ne redevienne libre (tête = longueur $\ell_b$, queue = 1)'
- les $B$ parties avancent en même temps ; $d'_b = (d_b + a_b - 1) \bmod 4$ pour l'action relative $a_b$ (gauche, tout droit, droite) ; un mur ou une cellule d'âge $> 1$ termine la partie (la cellule de la queue, d'âge 1, est en train de partir)
- 'après avoir mangé, la cellule vide portant le plus grand des nombres uniformes tirés avec graine $u_{brc}$ : jamais sur le corps'
- 'ce que voit le CNN : mur, corps, âge/longueur et nourriture, centré sur la tête avec la direction vers le haut, de sorte que les trois coups sont toujours les trois mêmes voisins'
- caractéristiques du CNN ; l'axe de modèle $m$ (variante × graine) devient les groupes d'une convolution groupée par couche
- 'routeur : softmax sur les $K$ experts, les lignes somment à 1'
- partie $b$ vers l'emplacement $s$ de l'expert $k$ (son rang parmi les parties routées vers lui), importé de moe_dag_pipeline
- 'tous les experts en un seul produit par lot, chacun sur son propre tampon de parties : trois logits d''action'
- 'combinaison ; dense : $z = p_{mbk} y_{mkba}$ avec chaque expert sur chaque partie'
- 'équilibrage de charge de Switch, $K \sum_k f_k P_k$ : 1 si équilibré, $K$ si effondré'
- 'le professeur : aucun coup mortel, puis un coup dont la région libre (remplissage par diffusion) peut contenir le serpent, puis le plus court chemin vers la nourriture (parcours en largeur sous forme de relaxation tensorielle répétée)'
labels:
  grid: Taille du plateau $N$ (cellules)
  seeds: Graines par variante
  experts: Experts $K$
  steps: Pas d'entraînement
  balance_weight: Poids d'équilibrage de charge $\alpha$
  dagger: Tour de DAgger (1 = activé)
  eval_games: Parties d'évaluation
