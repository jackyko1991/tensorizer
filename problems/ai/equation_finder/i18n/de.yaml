source_hash: f8aa40a8b1bc
title: 'Gleichungsfinder: eine Tensor-KI, die die bestimmende Gleichung ihrer Daten aufschreibt'
summary: Feld-Daten hinein, das Gesetz in LaTeX heraus. Eine Bibliothek von Kandidatentermen ($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$) wird mit finiten Differenzen, Savitzky–Golay-Filtern oder der schwachen Formulierung aufgebaut, und sequenziell schwellwertbasierte Ridge-Regression (PDE-FIND) behält die wenigen Terme, die $\partial_t u$ erklären. Aus simulierten Daten gewinnt sie das Lorenz-System, die Wärmeleitungsgleichung, die viskose Burgers-Gleichung und die Maxwell-Gleichungen aus einem Yee-FDTD-Lauf zurück (mit $c$ auf 0.2 % genau, 0.03 % mit der schwachen Formulierung) und findet das in der Bibliothek versteckte $\nabla\cdot\mathbf B = 0$; eine Rauschstudie zeigt, wo jeder Ableitungsschätzer versagt.
notes: 'Die Idee. Dies ist Jacky Ka Long Kos „automatischer Physikgleichungs-Finder“: eine kleine Tensor-KI, die Felddaten betrachtet und die Gleichung, die sie bestimmt, in LaTeX aufschreibt (der SINDy- / PDE-FIND-Ansatz). Sie knüpft an die Operatorsuche auf MNIST an, die mit „eine handgeschriebene Ziffer hat keine bestimmende Gleichung“ endete; hier stammen die Daten aus Gesetzen, es gibt also etwas zu finden. Die Architektur hat drei Module: (1) einen entrauschenden Glätter, (2) eine einsum- / Finite-Differenzen-Ableitungsmaschine, (3) dünnbesetzte Operatorregression. Hier sind (2) und (3) vollständig, und (1) ist ein Savitzky–Golay-Glätter (dafür ist kein neuronales Netz nötig). Methode. Jeder Kandidatenterm ist eine Ableitung eines Monoms der Felder, $D^\alpha(\prod_g u_g^{p_g})$: 20 Monome bis Grad 3 für das Lorenz-System, 13 Terme $D^d(u^p)$ ($p, d \le 3$) für die 1D-Gleichungen, 17 Terme für Maxwell (die Felder, ihre Ableitungen nach $x$ und $y$, ihre Laplace-Operatoren, einige Produkte).
  Drei Wege, das lineare System $\partial_t u = \Theta\xi$ aufzubauen: zentrale finite Differenzen (fd); Savitzky–Golay (sg: ein kubischer Glätter über 7 Stützstellen, dann ein quartischer Ableitungsfit über 9), beides 1D-Faltungen Achse für Achse; und die schwache Formulierung (weak SINDy, Messenger und Bortz 2021), bei der die Gleichung gegen Buckelfunktionen $(1-s^2)^{10}$ integriert wird und partielle Integration jede Ableitung auf diese überträgt, eine Tensorkontraktion pro Achse. STRidge (Rudy et al. 2017) läuft dann auf Spalten mit Einheitsnorm: Ridge, jeden Koeffizienten unter $\tau$ auf null setzen, neu fitten, wiederholen; ein Durchlauf über 41 Toleranzen für 3 Ridge-Stärken, und behalten wird das Modell mit den wenigsten Termen, dessen Validierungsfehler innerhalb von 5 % (+ $10^{-3}$) des besten liegt. Die größere Ridge-Stärke ist für Maxwell wichtig: Wegen $\nabla\cdot\mathbf B = 0$ sind die Spalten $\partial_x B_x$ und $\partial_y B_y$ fast entgegengesetzt, und mit schwachem
  Ridge fügte die Regression der $E_z$-Gleichung $2200\,\nabla\cdot\mathbf B$ hinzu. Die Koeffizienten werden auf den behaltenen Termen per kleinster Quadrate neu gefittet, mit einem Bootstrap über die Zeilen für das ±; dieses ± ist rein statistisch und enthält nicht den Bias der Ableitungsschätzung, daher ist es oft weit kleiner als der wahre Fehler. Die alternative Regression ist die DARTS-artige Relaxation aus operator_search_mnist: $\xi = \sigma(\alpha/T)\,w$ mit einer Gate-Strafe und einer von 1 auf 0.01 abgekühlten Temperatur. Daten, alle hier simuliert: 8 Lorenz-Trajektorien (RK4); die Wärmeleitungsgleichung auf einem periodischen 10-cm-Stab, exakt über Fourier-Moden ($D$ = 0.2 cm²/s); viskose Burgers-Gleichung auf $2\pi$ m, exakt über die Cole–Hopf-Transformation ($\nu$ = 0.1 m²/s); Maxwell in einer periodischen 6.4-cm-Box aus einem Yee-FDTD-Lauf (TM-Mode, 0.5-mm-Zellen, Courant-Zahl 0.5), so abgetastet, wie es eine Messung täte (alle Felder auf dieselben Punkte und Zeiten interpoliert).
  Rauschen: gaußsch, 0, 0.1, 1 und 5 % der Standardabweichung jedes Feldes. Ergebnisse. Die Tests prüfen, dass die Kerne und die schwache Formulierung dort exakt sind, wo die Analysis es sagt, dass die Daten ihren Gesetzen gehorchen (Wärmeleitungskern, Cole–Hopf, Yee hält $\nabla\cdot\mathbf B = 0$ bis auf Rundungsfehler ein und erhält seine Energie auf 0.2 % genau), dass STRidge einen eingepflanzten dünnbesetzten Vektor exakt zurückgewinnt, dass jedes Ziel aus sauberen Daten gefunden wird und dass das geschriebene LaTeX, von einem Parser zurückgelesen, das gefittete Modell reproduziert. Mitgelieferter Lauf, saubere Daten, finite Differenzen: Lorenz $\sigma$ = 9.9987, $\rho$ = 27.989, $\beta$ = 2.6662; Wärme $D$ = 0.20023 cm²/s; Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$; Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$ mit $c$ = 29.92 cm/ns (wahr 29.98) und $\partial_t \mathbf B = -\nabla\times\mathbf E$ mit Koeffizienten 0.996. Die schwache Formulierung ist weit genauer
  (Fehler von $10^{-8}$ auf den exakten Daten; 0.03 % bei Maxwell, was die eigene numerische Dispersion des Yee-Schemas ist, nicht die des Finders). Der kleinste Singulärvektor der Maxwell-Bibliothek ist $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$, mit einem Singulärwert 220-mal kleiner als der nächste: Die Daten offenbaren $\nabla\cdot\mathbf B = 0$ als implizites Gesetz. Rauschen (richtige Terme gefunden?): Finite Differenzen versagen ab 0.1 % Rauschen bei Wärme und Burgers und ab 1 % bei Lorenz und überstehen 5 % nur bei Maxwell (mit 25 % Koeffizientenfehler); Savitzky–Golay übersteht 0.1 % überall und 5 % nur bei Maxwell; die schwache Formulierung findet die richtigen Terme auf jedem Niveau für Wärme, Burgers und Maxwell (bei 5 % Rauschen Koeffizientenfehler von 7 %, 6 % und 0.1 %) und bis 1 % für Lorenz (bei 5 % fügt sie $\dot y$ zwei winzige Scheinterme hinzu). Die abgekühlten Gates erreichen die schwache STRidge bei Burgers und Maxwell, verfehlen aber den Term $-y$ des Lorenz-$\dot
  y$ auf jedem Rauschniveau und für jede getestete Strafe ($10^{-6}$ bis $10^{-3}$): $25.5\,x - 0.95\,xz$ absorbiert ihn, ein lokales Minimum, das die Relaxation nicht verlässt; sie versagen auch bei Wärme mit 5 %. Die gefundenen Gleichungen vom ersten Schnappschuss aus erneut zu simulieren reproduziert die Wärme- und Burgers-Daten auf $3\times 10^{-4}$ und Maxwell auf 3 %; Lorenz liegt nach 5 Zeiteinheiten 3 % daneben, weil Chaos einen Koeffizientenfehler von 0.01 % verstärkt. results/noise_study.csv und results/equations.tex enthalten alle Zahlen und Gleichungen; ein GIF pro Ziel (Maxwell ist das wichtigste) und results/summary.png. Fazit. Der Finder gewinnt bekannte Gleichungsformen aus sauberen, gut abgetasteten Daten zurück und toleriert mit der schwachen Formulierung realistisches Rauschen; zuerst versagt die Ableitungsschätzung, nicht die Regression. Er findet nur Terme, die in seiner Bibliothek stehen, er braucht die richtigen gemessenen Variablen, und eine entdeckte Gleichung ist
  eine Hypothese: Er entdeckt keine neue Physik (oder Physiologie) ohne unabhängige Validierung. Er ist auch kein Ersatz für große Sprachmodelle; es ist eine andere Aufgabe (ein Gesetz an Daten anpassen, nicht Text erzeugen). Verwandte Arbeiten. SINDy (Brunton, Proctor und Kutz 2016), PDE-FIND und STRidge (Rudy et al. 2017), weak SINDy (Messenger und Bortz 2021); symbolische Regression durch genetische Programmierung (Schmidt und Lipson 2009) und AI Feynman (Udrescu und Tegmark 2020); das Yee-Schema (Yee 1966). Ausprobieren. Weniger Bootstrap-Stichproben für einen schnelleren Lauf, mehr Gate-Schritte, um zu sehen, ob die Relaxation ihrem Lorenz-Minimum entkommt (bis 4000 tat sie es nicht), oder ein gröberes Yee-Gitter.'
meanings:
- 'die Bibliothek: Spalte $k$ ist ein Kandidatenterm $D^\alpha(\prod_g u_g^{p_g})$ an jedem inneren Gitterpunkt $n$, z. B. $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- 'Ableitungsmaschine: eine 1D-Faltung entlang einer Achse; zentrale Differenzen oder Savitzky–Golay (Kleinste-Quadrate-Polynom vom Grad $p$ über $2m+1$ Stützstellen) nach einem kubischen Glätter'
- 'schwache Formulierung: über $x$ und $t$ summiert; die Ableitungen liegen auf den glatten Buckeln $\phi(s) = (1-s^2)^{10}$, nie auf den verrauschten Daten'
- eine gebündelte Ridge-Lösung für jede Gleichung $f$ über ihre verbliebenen Terme; STRidge setzt $|\hat\xi_k| < \tau$ auf null und fittet neu
- 'Toleranzdurchlauf: Behalte das Modell mit den wenigsten Termen, dessen Validierungsfehler innerhalb von 5 % (+ $10^{-3}$) des besten liegt'
- 'die DARTS-artige Alternative: $\xi = \sigma(\alpha/T)\, w$ mit einer Gate-Strafe, Temperatur von 1 auf 0.01 abgekühlt'
- 'Bootstrap: $B$ Zeilen-Stichproben als multinomiale Gewichte, alle Fits in einer gebündelten Lösung'
- 'das geschriebene LaTeX, von einem Parser zurückgelesen: Es reproduziert das gefittete Modell auf die angezeigte Genauigkeit'
labels:
  bootstrap: Bootstrap-Stichproben für das ± jedes Koeffizienten
  gate_steps: Adam-Schritte der Suche mit abgekühlten Gates
  maxwell_grid: Yee-Gitter der Maxwell-Simulation ($n \times n$ Zellen zu 0.5 mm)
