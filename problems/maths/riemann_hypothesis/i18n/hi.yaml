title: हज़ारों शून्यकों में रीमान परिकल्पना
summary: टेंसर रूप में रीमान–सीगल सूत्र से क्रांतिक रेखा पर $\zeta$ के हज़ारों अतुच्छ शून्यक खोजिए, उनकी गिनती की तुलना रीमान–फ़ॉन मैंगोल्ट नियम $N(T) = \theta(T)/\pi + 1 + S(T)$ और ग्राम नियम से कीजिए, उनके अंतरालों और युग्म सहसंबंध की तुलना यादृच्छिक हर्मिटी (GUE) आव्यूहों से कीजिए, और उनसे अभाज्य-घात सीढ़ी $\psi(x)$ का पुनर्निर्माण कीजिए। स्वयं परिकल्पना, कि हर अतुच्छ शून्यक का वास्तविक भाग $\frac12$ है, अभी भी अनसुलझी है।
notes: 'यह पृष्ठ समस्या “रीमान ज़ीटा फलन और अभाज्य संख्याएँ” (maths/zeta_primes) का पूरक है, जो ऑयलर–मैक्लॉरिन से $\zeta$ को शुरू से बनाती है, पहले शून्यक खोजती है और $\pi(x)$ का पुनर्निर्माण करती है; मूल बातों के लिए उसे पहले पढ़िए। यहाँ अधिक तेज़ रीमान–सीगल सूत्र, अपने संशोधनों $C_0, C_1, C_2$ (चेबीशेव श्रेणी से $\Psi$ के अवकलज) के साथ, ढाई लाख ऊँचाइयों पर $Z(t)$ का मान निकालता है और $T$ से नीचे क्रांतिक रेखा पर हर शून्यक खोजता है; $t \ge 100$ पर यह उच्च-परिशुद्धता गणना (mpmath) से $10^{-5}$ से बेहतर मेल खाता है। $t = 1000$ से नीचे यह 649 चिह्न परिवर्तन पाता है और 5000 से नीचे 4520, जो ठीक उन ऊँचाइयों तक पट्टी में शून्यकों की कुल संख्या है (mpmath से स्वतंत्र रूप से गणना की गई), इसलिए वे सभी रेखा पर स्थित हैं; गणना फलन $\theta(T)/\pi + 1$ का अनुसरण करता है, एक छोटे उतार-चढ़ाव $S(t)$ के साथ जिसका औसत शून्य है। ग्राम नियम अधिकांश ग्राम बिंदुओं पर लागू होता है और पहली बार $g_{126} \approx 282.45$ पर विफल होता है। औसत अंतराल 1 पर सामान्यीकृत करने के बाद शून्यक एक-दूसरे को ठीक उसी तरह प्रतिकर्षित
  करते हैं जैसे बड़े यादृच्छिक हर्मिटी आव्यूहों (GUE) के आइगेनमान: मॉन्टगोमरी (1973) ने युग्म सहसंबंध $1 - (\sin \pi u / \pi u)^2$ का अनुमान लगाया, रीमान परिकल्पना मानकर इसे उन परीक्षण फलनों के लिए सिद्ध किया जिनका फ़ूरिये आधार $(-1, 1)$ में है, और $10^{20}$-वें शून्यक के पास ओडलिज़्को की गणनाएँ इसकी शानदार पुष्टि करती हैं; यहाँ की कम ऊँचाइयों पर भी मेल पहले से ही काफ़ी निकट है। स्पष्ट सूत्र (फ़ॉन मैंगोल्ट 1895, सिद्ध) शून्यकों को अभाज्य संख्याओं में बदल देता है: हर युग्म $\frac12 \pm i\gamma$ एक तरंग $x^{1/2}\cos(\gamma\ln x)$ जोड़ता है, और हज़ारों शून्यकों के साथ $\psi(x)$ एक स्पष्ट सीढ़ी बन जाता है। रीमान परिकल्पना, कि हर अतुच्छ शून्यक का वास्तविक भाग $\frac12$ है, क्ले मिलेनियम पुरस्कार की समस्याओं में से एक है और अनसुलझी है। इसे ऊँचाई $3\times10^{12}$ तक के सभी शून्यकों के लिए सत्यापित किया जा चुका है (प्लैट और ट्रजियन 2021)। पट्टी में दिखाए गए सिद्ध परिणाम: $\operatorname{Re} s = 1$ पर कोई शून्यक नहीं (आदामार, द ला वाले पूसें 1896, अभाज्य संख्या प्रमेय के तुल्य) और शून्यक-मुक्त क्षेत्र
  $\sigma > 1 - 1/(5.558691\ln t)$ (मॉसिंगहॉफ़ और ट्रजियन 2015), जिसे फलनीय समीकरण द्वारा प्रतिबिंबित किया गया है। दावा किया गया, स्थापित नहीं: अक्टूबर 2026 में OpenAI ने (रिपोर्टों के अनुसार; हमने पांडुलिपियों की जाँच नहीं की है) AI-जनित पांडुलिपियों के अपने सार्वजनिक भंडार openai/math में $\zeta$ और हर डिरिक्ले $L$-फलन के लिए एक दावा किया गया शून्यक-मुक्त अर्धतल $\operatorname{Re} s > 7/8$ प्रकाशित किया, साथ में $\operatorname{Re} s > 11/12$ के लिए एक सहायक तर्क भी। ये प्रीप्रिंट समकक्ष-समीक्षित नहीं हैं और इनका स्वतंत्र रूप से सत्यापन नहीं हुआ है; यदि ये सही हों, तो निश्चित चौड़ाई की शून्यक-मुक्त पट्टी एक बड़ी प्रगति होगी, फिर भी रेखा $\frac12$ से बहुत दूर। कोई भी गणना इस परिकल्पना को सिद्ध नहीं कर सकती: एक परिमित खोज केवल रेखा पर शून्यक, या कोई प्रतिउदाहरण, ढूँढ सकती है।'
meanings:
- 'दोहराया गया $n$ ⇒ योग: 250 000 ऊँचाइयों के लिए मुख्य योग एक साथ, $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$ तक मास्क किया गया'
- $\Psi$ संपूर्ण फलन है, लेकिन भागफल $p = \frac14, \frac34$ पर $0/0$ है; चेबीशेव फ़िट इसे हटा देता है
- 'रीमान–सीगल संशोधन: चेबीशेव श्रेणी का पद-दर-पद अवकलन होता है, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- 0.02 के चरण वाले ग्रिड पर $Z$ के चिह्न परिवर्तन, फिर सभी अंतरालों पर एक साथ 32 द्विभाजन चरण
- शून्यक गणना में से उसका चिकना भाग घटाकर; छोटा रहता है और औसत 0 होता है
- सभी ग्राम बिंदु न्यूटन विधि से एक साथ; ग्राम नियम कहता है $(-1)^n Z(g_n) > 0$
- युग्म सहसंबंध के लिए, सामान्यीकृत शून्यकों $x = \theta(\gamma)/\pi + 1$ के अगले $J = 10$ पड़ोसियों तक के अंतर
- 'हर $x$ पर हर शून्यक, शून्यकों पर संचित: हर ऊँचाई $T$ के लिए एक पंक्ति'
labels:
  t_max: ऊँचाई $T$
  x_max: $x$ तक स्पष्ट सूत्र
