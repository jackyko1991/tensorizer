source_hash: 37c952badf1f
title: 限制性三体问题的拉格朗日点
summary: 恒星与行星相互绕转；在它们的旋转参考系中，试验粒子受到引力、离心力和科里奥利力，后者用 $\varepsilon_{ijk}$ 写出。对 $\nabla\Phi_\mathrm{eff} = 0$ 用牛顿法（梯度和黑塞矩阵由 autograd 求得）一次找出全部五个拉格朗日点；从 L4 稍微推开的粒子绕它描出蝌蚪形轨道。
notes: 单位：两体间距为 1，$G(M_1 + M_2) = 1$，因此两体每 $2\pi$ 转一圈。行星的质量分数为 $\mu$，试验粒子轻到不会扰动任一天体。L1、L2 和 L3 位于两天体连线上，是 $\Phi_\mathrm{eff}$ 的鞍点；L4 和 L5 与两天体构成等边三角形，是 $\Phi_\mathrm{eff}$ 的极大值点，但当 $\mu < 0.0385$ 时科里奥利力使它们稳定。这就是木星的特洛伊小行星聚集在其前后 60° 处的原因。粒子从行星轨道上 L4 前方几度处静止出发：小的偏移给出小蝌蚪环（上面叠加快速的本轮），较大的偏移拉长成沿轨道的长香蕉形环，超过约 20°（$\mu = 0.01$ 时）粒子便会漂走。$\mu$ 大于 0.0385 时，即使极小的偏移也会漂走。
meanings:
- 试验粒子 $b$ 在旋转系中的位置
- 恒星位于 $(-\mu, 0, 0)$，行星位于 $(1-\mu, 0, 0)$
- 重复的 $s$ ⇒ 求和：两个天体的引力
- 用于叉积的列维-奇维塔符号
- 科里奥利加速度，$\boldsymbol\Omega = \hat{\mathbf z}$
- 在全部五个点上由 autograd 求梯度
- 由 autograd 求黑塞矩阵：牛顿步是一次批量 linalg.solve
