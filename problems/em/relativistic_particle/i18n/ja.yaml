source_hash: b693da8b6e0e
title: 相対論的荷電粒子
summary: 共変形式で書いたローレンツ力 $dU^\mu/d\tau = (q/m)\,F^\mu{}_\nu U^\nu$：電磁場テンソルの第2添字をミンコフスキー計量で下げ、4元速度と1回の einsum で縮約する。固有時で積分すると、速い粒子はニュートン力学の予言よりゆっくり回ること、そして一定の電場が粒子を光速にどこまでも近づけるが決して超えさせないことがわかる。
notes: $c = 1$ の単位系。運動方程式は各粒子の固有時 $\tau$ で RK4 により積分し、アニメーション用に実験室時間 $t = X^0$ に再標本化する。サイクロトロン：磁気力は仕事をしないので $\gamma$ は一定のままだが、軌道はニュートン力学の円より $\gamma$ 倍大きく、$\gamma$ 倍ゆっくりになる（$\omega = qB/(\gamma m)$）。加速：一様な $E$ 中で静止から始めると運動は双曲線運動 $x = (\sqrt{1 + (at)^2} - 1)/a$（$a = qE/m$）となり、$v \to 1$ となる。一方ニュートン力学の $\tfrac12 at^2$ では $t = 2/a$ 以降に光を追い越してしまう。
meanings:
- 粒子 $p$ の4元位置 $(t, x, y, z)$ と4元速度 $\gamma(1, \mathbf v)$
- ミンコフスキー計量 $\operatorname{diag}(+1, -1, -1, -1)$、$c = 1$
- $F^{0i} = -E_i$、$F^{ij} = -\varepsilon_{ijk}B_k$
- 繰り返される $\alpha$ ⇒ 和をとる：第2添字を下げる
- 繰り返される $\nu$ ⇒ 和をとる：各粒子に働く4元力
- $U$ のミンコフスキー長さ、1 に保たれるべき量
labels:
  config: シナリオ
  strength: 場の強さ（$B$ または $E$）
  v_max: 最大初速（サイクロトロン）
  n_particles: 粒子数
  t_max: 実験室時間
