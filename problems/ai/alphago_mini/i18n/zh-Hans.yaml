source_hash: f0ace6f81d9f
title: 迷你 AlphaGo：在 $5\times5$ 围棋盘上的树搜索
summary: 在小棋盘上下一盘自我对弈的围棋，每一步都由 AlphaGo 所用的同一种搜索选出：采用 PUCT 规则的蒙特卡洛树搜索。围棋规则本身就是张量运算：提子与数子计分都是泛洪填充，每一步只需与棋盘邻接矩阵做一次 einsum。每个新局面都由同时进行的一整批随机对局来评估。观察访问次数如何集中到搜索所看好的那一手。
notes: 每次模拟都沿着树往下走，选择 PUCT 最大值，加入一个新局面，用整批随机 playout 打分，再把结果加到路径上的每一手。好棋积累访问次数，因此搜索不必看遍每一条变化，就能集中在关键之处。AlphaGo 用的是同一个循环，只是把均匀先验 $P_a$ 换成策略网络、把随机 playout 换成价值网络，两者都用棋谱训练；AlphaGo Zero 则完全通过自我对弈学会两者。在 $5\times5$ 上，天元开局对黑棋很有利；模拟次数少时，搜索会犯下明显的错误；提高模拟次数，棋局会更精准但也更慢。规则：Tromp–Taylor（自杀会提掉自己的棋块、数子计分），并做简单的劫检查。
meanings:
- 棋盘上的点 $p$：$+1$ 黑、$-1$ 白、0 空
- 把棋盘看成图：当 $p$ 与 $q$ 水平或垂直相邻时为 1
- 泛洪填充：从空点出发穿过某一颜色，找出有气的棋块；其余的被提掉
- 数子计分：棋子加上只有该颜色能到达的空点，黑减白再减贴目 $k$
- $R$ 盘随机对局以一个 $(R, n^2)$ 张量同时进行；取黑棋的平均结果；绝不填自己的眼
- PUCT：价值 $Q_a$ 加上随着 $a$ 被访问而缩小的探索奖励；均匀先验 $P_a$
- 所有模拟后的访问次数（最后一项：虚着）；下出访问次数最多的那一手
labels:
  board_size: 棋盘大小 $n$
  simulations: 每手模拟次数
  rollouts: 每个叶节点的随机 playout 数 $R$
  c_puct: 探索系数 $c$
  komi: 贴目 $k$
