source_hash: 3b3a390c2f31
title: 푸리에 급수와 깁스 현상
summary: 사인 함수로 만든 사각파, 톱니파, 삼각파. 계수는 einsum 하나(수치 적분이며 $4/(\pi n)$ 등과 비교해 검증)이고, 모든 부분합은 기저 행렬의 처음 $N$개 열과의 행렬 곱 $S_N = B\,c$ 하나이다. 물결이 불연속점으로 몰려드는 동안 오버슈트가 도약 크기의 약 9%에 머무는 것을 보자.
notes: 정확한 계수는 홀수 $n$에 대해 $b_n = 4/(\pi n)$(사각파), $2(-1)^{n+1}/(\pi n)$(톱니파), 홀수 $n$에 대해 $\pm 8/(\pi^2 n^2)$(삼각파)이며, 수치 적분은 이와 약 $10^{-6}$까지 일치한다. 불연속점 근처에서 부분합은 오버슈트한다. $N$이 커지면 그 혹은 불연속점 쪽으로 이동하지만(폭은 $1/N$처럼 줄어든다) 높이는 0이 아니라 도약 크기의 $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$배로 수렴한다. $-1$에서 $1$로 뛰는 사각파의 최댓값은 $1.179$ 근처에 머문다. 이것이 깁스 현상이다. 그래도 급수는 평균 수렴한다. 파르스발 정리에 의해 $\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$이므로, $L^2$ 오차의 제곱은 빠진 $b_n^2$의 합이다. $1/n$처럼 줄어드는 계수(불연속)는 $\propto 1/N$의 오차를 준다. 삼각파는 꺾인 점만 있어 계수가 $1/n^2$처럼, 오차는 $1/N^3$처럼 줄어든다. 더 매끄러운 함수일수록 더 빨리 수렴한다. 성긴 격자(작은 $X$)로 수치 계수가 어긋나는 것을 보자.
meanings:
- '$(-\pi, \pi)$ 위 $X$개의 같은 칸의 중점과 그 폭 $h$: 적분 가중치'
- $x_j$에서 표본화한 파형 $w$(사각파, 톱니파, 삼각파)
- '기저 행렬: $n$번째 열은 격자 위의 $\sin(n x)$'
- '반복된 $j$ ⇒ 합산: 격자에 대한 가중합으로 나타낸 적분 $b_n$'
- '반복된 $n$ ⇒ 합산: 고조파 $N$개의 부분합, 행렬 곱'
- $d = F - S$인 $L^2$ 오차의 제곱; 반복된 $j$ ⇒ 합산
labels:
  n_max: 최대 고조파 수 $N$
  n_x: 격자점 수 $X$
