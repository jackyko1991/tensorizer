title: Теория Маркуса переноса электрона и инвертированная область
summary: 'Электрон перескакивает с донора на акцептор, только когда окружающий растворитель случайно флуктуирует в конфигурацию, где оба состояния имеют одинаковую энергию: пересечение двух парабол. Это даёт скорость Маркуса $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$, вычисляемую здесь на одной транслируемой сетке энергий реорганизации, температур и движущих сил. Перенос быстрее всего при $-\Delta G^\circ = \lambda$ и, вопреки интуиции, снова замедляется для ещё более выгодных реакций. Ланжевеновское моделирование координаты растворителя с перескоками Ландау–Зинера в точке пересечения воспроизводит кривую.'
notes: 'Единицы: eV, K и ps. Координата растворителя $x$ — коллективная поляризация, которую ощущает переносимый заряд, масштабированная так, что яма реагента находится в 0, а яма продукта — в 1; $\lambda$ — энергия, необходимая, чтобы поляризовать растворитель как для продукта, пока заряд ещё на доноре. Маркус вывел квадратичный барьер в 1956 году (J. Chem. Phys. 24, 966) и предсказал инвертированную область, которая была экспериментально подтверждена лишь в 1980-х. В инвертированной области ($-\Delta G^\circ > \lambda$) парабола продукта пересекает параболу реагента с дальней стороны, поэтому большая движущая сила поднимает пересечение выше. Формула скорости — золотое правило (неадиабатический случай, малое $H_{AB}$) с классическим растворителем; реальные скорости в инвертированной области падают медленнее, потому что высокочастотные молекулярные колебания открывают квантовые каналы (расширение Маркуса–Левича–Джортнера). Моделирование — нарочито простая картина: одна классическая координата
  растворителя с частотой $\omega$ и трением $\gamma$, движущаяся по одной диабатической параболе за раз и переключающаяся в точке пересечения с вероятностью Ландау–Зинера $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$, которая предполагает прямолинейное быстрое прохождение. Суммирование по тепловому потоку прохождений возвращает скорость по золотому правилу при $P_{\mathrm{LZ}} \ll 1$, поэтому точки ложатся на кривую; при больших $H_{AB}$ перескоки насыщаются (адиабатический перенос) и начинает играть роль трение. Траектории, совершившие перескок, продолжают движение по поверхности продукта и могут перескочить обратно. Попробуйте понизить $T$ (кривая сужается), повысить $H_{AB}$ (моделирование уходит ниже формулы) или изменить $\lambda$.'
meanings:
- три оси сетки скоростей
- трансляция строит все комбинации сразу; индекс не суммируется
- где пересекаются параболы; $x^* < 0$ означает инвертированную область
- высота пересечения над минимумом реагента
- траектория $n$ при моделируемой движущей силе $d$, стартующая в яме реагента с больцмановской статистикой
- 0 на поверхности реагента, 1 на поверхности продукта; задаёт минимум, к которому тянется растворитель
- полутолчок, полудрейф, трение + шум, полудрейф, полутолчок для всех траекторий вместе
- переключение поверхности с этой вероятностью всякий раз, когда шаг проходит через $x^*$
- прямые перескоки на единицу времени, проведённого на поверхности реагента; погрешность $\sqrt{\text{hops}}/t$
labels:
  lam: Энергия реорганизации $\lambda$
  T: Температура $T$
  H_ab: Электронное взаимодействие $H_{AB}$
  omega: Частота растворителя $\omega$
  friction: Трение растворителя $\gamma$
  steps: Шаги по времени
