source_hash: cd1d0cc0a127
title: 광선 방정식으로 보는 도로 신기루
summary: 뜨거운 도로 위의 공기는 희박하므로 굴절률 $n(y)$가 지면 근처에서 낮아집니다. 기하 광학의 광선 방정식은 빛을 $n$이 높은 쪽으로 휘게 합니다. 여러 시선 방향에 대해 RK4로 적분하면 도로를 향한 광선이 다시 위로 휘어 올라가므로, 눈에는 멀리 있는 물체의 뒤집힌 두 번째 상이 보입니다.
notes: 광선은 눈에서 거꾸로 추적합니다(빛의 경로는 가역적입니다). 각 광선은 "이 방향을 볼 때 눈에 무엇이 보이는가?"에 답합니다. 약간 아래를 향한 광선은 굴절률이 낮은 층에서 위로 휘어 물체의 아래쪽에서 닿으므로, 시선 각이 낮을수록 물체의 더 높은 부분이 보입니다. 즉 상이 뒤집힙니다. 더 가파른 광선은 도로(회색)에 닿습니다. 세로 축척은 약 100배 과장되어 있습니다. 실제 굴절률 차이는 $\sim 10^{-5}$이고 각은 밀리라디안 정도입니다. $n\cos\theta$가 소수점 일곱째 자리에서야 변하므로 float64로 계산합니다.
meanings:
- 광선 $r$의 위치 $(x, y)$
- '광학 방향 벡터: 단위 접선 곱하기 $n$'
- 굴절률, 뜨거운 도로 표면 $y = 0$에서 가장 낮음
- '$y$ 성분만 0이 아님: $(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$'
- 1계 연립 방정식으로 쓴 광선 방정식, RK4로 전진
- '반복된 $j$ ⇒ 합: $\lvert\mathbf p\rvert$는 $n$과 같게 유지되어야 함(정확도 검사)'
- '수평 층에 대한 스넬 법칙: 각 광선을 따라 보존'
labels:
  delta_n: 도로에서의 굴절률 감소 $\Delta n$
  scale_height: 뜨거운 층의 두께 $h$
  eye_height: 눈 높이
  distance: 물체까지 거리
  max_dip: 가장 가파른 아래 시선
  n_rays: 광선 다발의 광선 수
