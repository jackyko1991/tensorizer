title: Спирали простых чисел и гипотезы Харди–Литтлвуда
summary: 'Просеиваем простые числа в один булев тензор и рисуем их на спиралях Улама и Сакса, где они скапливаются вдоль линий. Каждая линия — квадратный трёхчлен, например эйлеров $k^2 + k + 41$, и гипотезы Харди–Литтлвуда предсказывают, сколько простых чисел на ней лежит. Затем то же решето проверяет их предсказания для простых-близнецов и для проблемы Гольдбаха, а также случайную модель Крамера для промежутков между простыми. Это гипотезы: программа проверяет их численно, но не доказывает.'
notes: 'Улам (1963) записал целые числа по квадратной спирали и заметил, что простые выстраиваются вдоль диагоналей; спираль Сакса (1994) помещает $n$ на радиус $\sqrt n$ и угол $2\pi\sqrt n$ и показывает вместо этого кривые. Каждый диагональный луч спирали Улама содержит значения квадратного трёхчлена $4k^2 + bk + c$, а на спирали, начинающейся с 41, главная диагональ — это эйлеров $k^2 + k + 41$, простой при $k = 0, \dots, 39$ (доказано: Рабинович показал, что $k^2 + k + p$ прост при всех $k < p - 1$ ровно тогда, когда $\mathbb Q(\sqrt{1 - 4p})$ имеет число классов один, так что $p \in \{2, 3, 5, 11, 17, 41\}$ — список, завершённый Хегнером и Старком). Одни лучи плотные, другие пустые из-за вычетов: у $f$ нет корней по модулю многих малых простых, если её дискриминант для них является невычетом. Харди и Литтлвуд (1923) превратили это в гипотезу F, которую гипотеза Бейтмана–Хорна (1962) переформулирует как $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$. Правая верхняя панель проверяет её сразу
  на нескольких сотнях квадратных трёхчленов: с ростом $K$ измеренные константы приближаются к предсказанным $C(f)$ (диагональная линия). Неизвестно даже, принимает ли хоть один квадратный трёхчлен бесконечно много простых значений: для $n^2 + 1$ это четвёртая проблема Ландау (1912), до сих пор открытая. Для многочлена Эйлера Харди и Литтлвуд приводят произведение по нечётным простым $3.3197732$; константа Бейтмана–Хорна включает множитель 2 от $p = 2$ (значения всегда нечётны), поэтому она равна $6.6395$. Гипотеза о простых-близнецах с константой $C_2 = 0.6601618\ldots$ и гипотеза Гольдбаха с её особым рядом — та же идея для $p$ и $p + 2$ и для $p$ и $N - p$. Решето воспроизводит известные значения $\pi_2(10^6) = 8169$ и $\pi_2(10^7) = 58980$, а «комета Гольдбаха» ложится на предсказание: полосы кометы — это особый ряд (зелёным: $3 \mid N$). Обе гипотезы открыты. Гипотеза Гольдбаха проверена для всех чётных чисел до $4 \cdot 10^{18}$ (Оливейра-и-Силва, Херцог и Парди, 2014); Чжан (2014),
  а также проект Polymath и Мейнард доказали, что существует бесконечно много промежутков между простыми длиной не более 246, а Чэнь (1973) — что каждое достаточно большое чётное число есть сумма простого и произведения не более чем двух простых. Модель Крамера (1936) считает каждое $n$ простым с вероятностью $1/\ln n$; она предсказывает экспоненциальные промежутки со средним $\ln p$, что близко к наблюдаемому, и максимальные промежутки порядка $\ln^2 p$, но ошибается в числе близнецов ровно в $2C_2 \approx 1.32$ раза (пунктирная линия), потому что не учитывает делимость на 2, 3, 5, … Майер (1985) показал, что она неверна и в других отношениях, а Гранвиль предположил максимальные промежутки до $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$.'
meanings:
- 'решето Эратосфена: один срез с шагом на каждое простое $p \le \sqrt{n_\text{max}}$'
- положение каждого числа на спирали Улама сразу — по его кольцу $k = \lceil(\sqrt m - 1)/2\rceil$ и расстоянию до угла $(2k+1)^2$
- 'спираль Сакса: квадраты $k^2$ лежат на положительной полуоси $x$'
- значения $F$ квадратных трёхчленов $4k^2 + bk + c$ (диагональных лучей спирали Улама) при каждом $k$
- каждое значение ищется в решете; накопленная сумма подсчитывает простые на каждом луче
- корни $f_i$ по модулю $p$ из критерия Эйлера $(D/p) \equiv D^{(p-1)/2}$, где $D = b^2 - 4ac$; для $p < 50$ — прямым перебором
- 'повторяющийся $p$ ⇒ суммирование: эйлерово произведение как сумма логарифмов по простым $p < 10^5$'
- 'повторяющийся $m$ ⇒ суммирование: число представлений Гольдбаха как самосвёртка, вычисленная через БПФ'
- пары близнецов $(p, p+2)$ с $p \le x$
- нормированные промежутки в сравнении с законом $e^{-s}$ случайной модели Крамера
