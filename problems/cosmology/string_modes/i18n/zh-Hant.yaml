source_hash: 49928f544229
title: 相對論性弦的振動模與 T 對偶
summary: 光錐規範下的 Nambu–Goto 弦就是 24 個自由的橫向波。一次批次化的模態求和即可畫出振動中的閉弦或開弦；其各模態的能量即能階 $N$，量子化為 $\alpha' M^2 = N - 1$（開弦）或 $4(N-1)$（閉弦），態數 $1, 24, 324, 3200, \dots$ 可從冪級數 $\prod (1-q^n)^{-24}$ 讀出。在半徑 $R$ 的圓上，閉弦譜在 $R \leftrightarrow \alpha'/R$ 下不變：這就是 T 對偶。弦論是一個尚無直接實驗證實的理論框架。
notes: 單位 $\alpha' = 1$。現況：弦論是數學上自洽的量子重力候選框架，但目前沒有支持它的直接實驗證據；此處沒有任何內容是已受檢驗的預測。所展示的是玻色弦的標準教科書數學（Goddard–Goldstone–Rebbi–Thorn 1973；Polchinski，String Theory 第 1 卷）：光錐量子化僅在 $D = 26$、截距 $a = 1$ 時自洽，這留下 $N = 0$ 的快子（$M^2 < 0$，紅色）、開弦在 $N = 1$ 的無質量向量，以及閉弦在 $N = \tilde N = 1$ 的重力子、B 場與伸縮子。超弦（D = 10）可消除快子。所畫的弦是一個古典組態，其振子能量等於能階 $N$（模態 $n$ 的每個量子攜帶 $n$ 個單位）；對閉弦，右行與左行模取 $N = \tilde N$（能階匹配，$\int \dot X\cdot X'\,d\sigma = 0$），且弦處於靜止系，因此不畫出光錐座標 $X^-$。T 對偶面板追蹤幾個態的質量隨半徑的變化：動量態（$n/R$）與纏繞態（$wR/\alpha'$）在 $R \to \alpha'/R$ 下互換，而在自對偶半徑 $R = \sqrt{\alpha'}$ 處會有額外的態變為無質量。標題會檢查整個截斷譜（含簡併度）在 $R$ 與 $\alpha'/R$ 處完全相同。
meanings:
- 24 個橫向方向 $i$ 中 3 個方向上右行與左行模態 $n$ 的複振幅
- 每個模態在每個世界面點上的相位 $e^{-in(\tau-\sigma)}$（廣播）
- 重複的模態指標 $n$ ⇒ 求和：每個 $\tau$ 與 $\sigma$ 下的弦形狀
- 能量密度；對 $\sigma$ 積分即得能階 $N$（Parseval）
- 由廣播整除遮罩得到的因數和：$\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$
- 截斷冪級數的乘法如同下三角 Toeplitz 矩陣，因此級數的 $\exp$ 就是矩陣指數
- 所有能階匹配態 $N-\tilde N = nw$ 在每個半徑 $R_b$ 上的質量，一次算出
labels:
  string: 弦的類型
  mode_a: 右行模態 $n$（開弦：第一個模態）
  mode_b: 左行模態 $\tilde n$（開弦：第二個模態）
  n_points: 沿弦的點數 $\sigma$
  n_levels: 顯示的質量能階數
  R_max: 掃描中的最大圓半徑 $R/\sqrt{\alpha'}$
