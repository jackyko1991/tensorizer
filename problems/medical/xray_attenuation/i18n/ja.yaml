source_hash: 9753ed59836b
title: X線の減弱と画像コントラスト
summary: X線は体内を通る間に指数関数的に弱まる：$I = I_0\,e^{-\int\mu\,dl}$。肺、軟部組織、骨、ヨード造影剤からなる胸部ファントムを1回の einsum で線ごとに投影し、なぜ低エネルギーで骨が目立つのか、実際の管球スペクトルが深さとともにどう硬化するのかを示す。
notes: 対数空間では投影は加法的である：$-\ln(I/I_0)$ は物質ごとの $\mu\,L$ の和なので、単色の画像は物質の長さの線形写像になる。均質な板はビームを半価層 $\ln 2/\mu$ ごとに半分にする。光電吸収はおよそ $Z^3/E^3$ のように増えるので、骨のコントラストは 30–50 keV で大きく、高エネルギーでは薄れる。ヨードは 33 keV の K 吸収端より上で吸収が跳ね上がり、これが造影剤として使われる理由である。実際の管球はスペクトルを放出する：軟らかい光子が先に吸収され、平均エネルギーが上がり、実効的な $\mu$ は深さとともに下がる（線質硬化）。簡略化：まっすぐな平行線、散乱なし、検出器応答なし、表にした8つのエネルギーと丸めた $\mu$ の値。数値はすべて近似値で教育目的に限り、臨床には使用できない。
meanings:
- one-hot ファントム：画素 $(y, x)$ が物質 $m$ なら 1
- 画素の行 $y$ 内の線の経路長
- 繰り返される $y$ ⇒ 和をとる：線 $x$ が横切る物質 $m$ の長さ
- エネルギー $E_e$ における物質 $m$ の線減弱係数（1/cm）
- 繰り返される $m$ ⇒ 和をとる：各エネルギー・各線の線積分 $\int \mu\, dl$
- 管球スペクトル（クラマースの法則、アルミニウムフィルタ）、$\sum_e S_e = 1$
- 繰り返される $e$ ⇒ 和をとる：多色ビームの透過率
labels:
  energy_kev: 光子エネルギー $E$
  kvp: 管電圧
  iodine_mg_ml: ヨード濃度
  n_pixels: 横方向の画素数
