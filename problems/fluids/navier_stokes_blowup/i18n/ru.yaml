title: Регулярность уравнений Навье–Стокса и кандидаты на взрыв решений
summary: Задача тысячелетия Института Клэя спрашивает, остаются ли гладкие трёхмерные несжимаемые течения гладкими навсегда. Псевдоспектральный решатель на торе моделирует вихрь Тейлора–Грина (Taylor–Green) для уравнения Эйлера ($\nu = 0$) и двух значений вязкости одним пакетом БПФ, отслеживая максимальную завихренность, энстрофию и интеграл Била–Като–Майды $\int\|\omega\|_\infty dt$, который обязан расходиться при любом взрыве решения. Растяжение вихрей заставляет завихренность Эйлера расти, пока сетка не перестаёт её разрешать; вязкость её ограничивает. Это иллюстрация, а не доказательство.
notes: 'Задача Клэя (официальное описание Феффермана) требует доказать одно из четырёх утверждений: существование глобальных гладких решений на $\mathbb R^3$ (A) или на торе $\mathbb T^3$ (B), либо разрушение решения на $\mathbb R^3$ (C) или на $\mathbb T^3$ (D), при $\nu > 0$. В репозитории openai/NavierStokesAndEuler на GitHub заявлено, что он содержит машинно проверенные в Lean 4 доказательства (с сопровождающими статьями) разрушения решений уравнений Навье–Стокса с внешней силой на $\mathbb R^3$ и $\mathbb T^3$ (альтернативы C и D), а также взрыва за конечное время для уравнения Эйлера без внешней силы из гладких данных с компактным носителем. Это недавние заявления, которые ещё ожидают оценки математическим сообществом и Институтом Клэя; эта страница не считает призовую задачу решённой. Для уравнения Эйлера сингулярность гладких решений за конечное время подкреплялась осесимметричным расчётом с границей Луо–Хоу (2014), а позже компьютерными доказательствами (Чен–Хоу), а Элгинди (2021)
  доказал взрыв для данных класса $C^{1,\alpha}$. Моделирование здесь лишь иллюстрирует величины, которые контролируются в этих работах. Вихрь Тейлора–Грина $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$ — классический тест (Brachet и др., 1983): растяжение вихрей превращает его в тонкие слои, энстрофия растёт, а энергетический спектр становится более пологим. Хвост спектра убывает как $e^{-2\delta k}$; для взрыва полоса аналитичности $\delta(t)$ должна достичь нуля за конечное время, тогда как Brachet обнаружил лишь её экспоненциальное сужение. Как только $\delta\,k_\max < 1$, расчёт для уравнения Эйлера становится недоразрешённым (затенённая область): усечённая система по-прежнему точно сохраняет энергию, но дальнейший рост $\|\omega\|_\infty$ — артефакт сетки, а не свидетельство сингулярности. С вязкостью энергия подчиняется $dE/dt = -2\nu\Omega$ (проверено с точностью до ошибки округления), а энстрофия достигает максимума и затухает. Двумерный вихрь Тейлора–Грина — точное
  решение $e^{-2\nu t}$, а у трёхмерного известно начальное ускорение из $p_0 = \frac1{16}(\cos 2x + \cos 2y)(\cos 2z + 2)$: оба служат тестами. Попробуйте большее $N$, чтобы сдвинуть разрешённое время дальше.'
meanings:
- фурье-коэффициенты скорости каждого расчёта $b$ (у каждого своя вязкость) на торе $[0, 2\pi)^3$
- ротор через тензор Леви-Чивиты; по повторяющимся $j, l$ ⇒ суммирование
- нелинейный член в роторной форме, вычисляемый в физическом пространстве (псевдоспектрально)
- 'проекция Лере: убирает градиентную часть, поэтому давление никогда не вычисляется и $k_i\hat u_i = 0$'
- отбрасывает моды, которые квадратичный член исказил бы алиасингом; $k_\max = N/3$
- кинетическая энергия $\frac12\langle|\mathbf u|^2\rangle$ и энстрофия $\frac12\langle|\boldsymbol\omega|^2\rangle$
- 'критерий Била–Като–Майды: гладкое решение может разрушиться в момент $T^*$, только если этот интеграл там расходится'
- подгонка $E(k) \propto k^{-3}e^{-2\delta k}$; настоящая сингулярность требует $\delta \to 0$, а сетка разрешает течение лишь пока $\delta\,k_\max \gtrsim 1$
labels:
  n: Сетка $N^3$
  nu: Вязкость $\nu$ (расчёты $0$, $\nu$, $2\nu$)
  t_max: Время моделирования
