source_hash: bed4e5f065d8
title: P vs NP y la transición de fase de 3-SAT
summary: '¿Todo problema cuyas soluciones son fáciles de comprobar es también fácil de resolver? Esa es la cuestión P vs NP, abierta desde 1971. El 3-SAT aleatorio hace concreta la asimetría: comprobar una asignación propuesta es una operación de recogida (gather) y dos reducciones, mientras que la búsqueda exhaustiva evalúa las $2^n$ asignaciones a la vez como un único tensor de bits empaquetados, cuyo tamaño se duplica con cada variable. Al barrer la razón cláusulas/variables $\alpha$ aparece la transición de fase de satisfacibilidad cerca de $\alpha_c \approx 4.27$ y el coste de búsqueda alcanza su máximo dentro de la ventana de transición.'
notes: 'P vs NP pregunta si todo problema de decisión cuyas respuestas afirmativas tienen certificados verificables en tiempo polinómico (la clase NP) puede también resolverse en tiempo polinómico (la clase P). Cook (1971) y Levin (1973) demostraron que la satisfacibilidad es NP-completa: un algoritmo de tiempo polinómico para 3-SAT daría uno para todo problema de NP. Se desconoce si existe. La mayoría de los investigadores espera que P $\ne$ NP, pero no hay demostración, y barreras conocidas (relativización, pruebas naturales, algebrización) descartan familias enteras de estrategias de demostración. La cuestión es uno de los siete problemas del Premio del Milenio del Instituto Clay y está abierta. Este programa no demuestra nada al respecto: la búsqueda exhaustiva es simplemente el algoritmo obvio, y los mejores algoritmos conocidos para 3-SAT siguen siendo exponenciales (alrededor de $1.307^n$ para PPSZ). Lo que muestra es la asimetría. El verificador es una recogida más un OR y un AND,
  un trabajo $O(M)$. La búsqueda construye la tabla de verdad completa, un bit por asignación empaquetado de 32 en 32 por entero, de modo que el tensor tiene $2^n$ bits y su tiempo se duplica con cada variable (abajo a la derecha; para $n$ pequeño dominan los costes fijos). El 3-SAT aleatorio con $M = \alpha n$ cláusulas tiene un umbral abrupto: Friedgut (1999) demostró que la transición se vuelve abrupta cuando $n \to \infty$, la física estadística (Mézard, Parisi y Zecchina 2002) predice $\alpha_c \approx 4.267$, y Ding, Sly y Sun (2015) demostraron el umbral predicho para $k$-SAT con $k$ grande. Para $k = 3$ el valor 4.267 sigue siendo una conjetura; lo demostrado es que las fórmulas aleatorias son satisfacibles con alta probabilidad por debajo de $\alpha = 3.52$ e insatisfacibles por encima de 4.49. Para $n$ pequeño, el cruce del 50 % queda por encima de 4.27 y desciende al crecer $n$ (escalado de tamaño finito). Las pruebas comprueban que el verificador coincide con la fuerza bruta
  en cada asignación, que una cláusula elimina exactamente $1/8$ de todas las asignaciones, que el número medio de soluciones es igual al primer momento $2^n (7/8)^M$, que $P_{\mathrm{sat}}$ es monótona y se desploma cerca del umbral, y que la ventana se estrecha con $n$. El panel del coste de búsqueda cuenta los nodos de una búsqueda en profundidad con vuelta atrás que fija $x_0, x_1, \ldots$ sucesivamente y retrocede en cuanto una cláusula totalmente asignada es falsa. Por debajo del umbral encuentra pronto una solución, muy por encima de él contradicciones cortas podan el árbol pronto, y las fórmulas más difíciles están en la ventana de transición (para esta búsqueda simple con $n = 16$, cerca de $\alpha \approx 5$; los resolvedores con propagación unitaria alcanzan su máximo cerca de 4.3). Pruebe con más variables para ver cómo se afinan las curvas, o con más fórmulas para obtener curvas más suaves.'
meanings:
- $B$ fórmulas con $M$ cláusulas de 3 variables distintas, cada una negada con probabilidad $\frac12$
- todos los literales de todas las fórmulas en una sola recogida
- 'el verificador: $3M$ consultas, polinómico en $n$'
- tabla de verdad de $x_j$ sobre las $2^n$ asignaciones, 32 asignaciones por entero
- una cláusula evaluada en las $2^n$ asignaciones con OR bit a bit (un XOR con todo unos niega)
- AND de las cláusulas una a una; el nivel $d$ solo recoge las cláusulas cuyas variables están entre las $d$ primeras, lo que da el árbol de vuelta atrás
- fórmulas anidadas (prefijos de una misma lista de cláusulas) dan todos los $\alpha = M/n$ en una pasada y hacen que $P_{\mathrm{sat}}$ sea no creciente
