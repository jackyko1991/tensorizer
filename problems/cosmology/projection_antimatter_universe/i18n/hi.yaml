title: प्रतिद्रव्य कहाँ हो सकता है? प्रतिद्रव्य ब्रह्मांड के मानदंड
summary: यह एक अनुमानात्मक परिकल्पना है, स्थापित भौतिकी नहीं। चरण 2 ने पाया कि हर समय-खंड को काटने वाली एक विश्व-रेखा बराबर मात्रा में द्रव्य और प्रतिद्रव्य देती है, जबकि हम लगभग $10^{80}$ बैरियॉन देखते हैं और कोई प्रतिद्रव्य नहीं। बचाव का रास्ता एक ऐसी विश्व-रेखा है जो वैश्विक रूप से संतुलित हो, और जिसका प्रतिद्रव्य बहुत दूर हो या किसी दर्पण ब्रह्मांड में हो। यह चरण सूचीबद्ध करता है कि ऐसे प्रतिद्रव्य ब्रह्मांड को किन शर्तों को पूरा करना होगा, और हर मानदंड को आँकड़ों पर परखता है। कॉस्मिक किरणों में कोई प्रति-नाभिक नहीं है और आकाशगंगा-समूहों से कोई विलोपन गामा किरणें नहीं आतीं। डोमेन कम से कम क्षितिज जितने बड़े होने चाहिए, लगभग 16 Gpc। एक यादृच्छिक विश्व-रेखा अविश्वसनीय रूप से असंभाव्य है। बचता है Boyle, Finn और Turok का CPT-सममित ब्रह्मांड, जिसकी भविष्यवाणियाँ (सबसे हल्का न्यूट्रिनो द्रव्यमानहीन, $r = 0$) अब तक आँकड़ों से मेल खाती हैं और विफल भी हो सकती हैं।
notes: 'स्थिति: अनुमानात्मक। यह लेखक की अपनी परिकल्पना है (शृंखला का विवरण देखें), स्थापित भौतिकी नहीं। प्रक्षेपण परिकल्पना का चरण 7, अभिधारणा P3 (सभी कण एक ही वस्तु के प्रक्षेपण हैं) के लिए एक सैद्धांतिक चरण। चरण 1 (cosmology/projection_postulate) ने अभिधारणाएँ प्रस्तुत कीं। चरण 2 (cosmology/projection_one_particle) ने P3 के सरलतम रूप को खारिज किया: एक बंद विश्व-रेखा हर समय-खंड को जितनी बार आगे (द्रव्य) काटती है उतनी ही बार पीछे (प्रतिद्रव्य), एक खुली रेखा अधिकतम एक शुद्ध कण जोड़ती है, और ब्रह्मांड में लगभग $9\times10^{79}$ बैरियॉन हैं और कोई प्रतिद्रव्य नहीं। चरण 3 से 6 (projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests) ने P5, P4 और P1-P2 की जाँच की। यह चरण चरण 2 के बचाव-मार्ग को अपनाता है। विश्व-रेखा वैश्विक रूप से संतुलित है, और प्रतिद्रव्य हमारे क्षितिज के पार या किसी प्रति-ब्रह्मांड में स्थित है। प्रश्न यह है कि अभिधारणाओं से मेल खाने के लिए ऐसे प्रतिद्रव्य ब्रह्मांड को किन शर्तों को पूरा करना होगा, और क्या वह उन्हें पूरा करता
  है। पहले ज्ञात भौतिकी। सखारोव शर्तें (1967) द्रव्य की अधिकता को बैरियॉन-संख्या के उल्लंघन, C और CP उल्लंघन, और साम्यावस्था से विचलन द्वारा समझाती हैं। वे एक ऐसे ब्रह्मांड की भविष्यवाणी करती हैं जो हर जगह द्रव्य से बना है, जिसमें $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (Planck 2018, $\Omega_b h^2 = 0.0224$)। विकल्प, यानी द्रव्य और प्रतिद्रव्य के अलग-अलग क्षेत्रों वाला एक सममित ब्रह्मांड, 1960 के दशक से अध्ययन किया गया (Alfvén और Klein, Omnès)। Steigman (ARA&A 14, 339, 1976) ने परीक्षणों की समीक्षा की, और Cohen, De Rújula and Glashow (ApJ 495, 539, 1998) ने दृश्य ब्रह्मांड के भीतर डोमेनों का मामला बंद कर दिया। सभी आँकड़े data/antimatter_criteria.csv से आते हैं, जिसमें उद्धृत संख्याएँ उनके स्रोतों के साथ हैं। जिन आयामों में विश्व-रेखा रहती है उनकी संख्या $D$ एक प्राचल है। केवल इसका समय-निर्देशांक भूमिका निभाता है, इसलिए कोई भी परिणाम $D$ पर निर्भर नहीं करता। मानदंड 1: पास में कोई प्रतिद्रव्य मिला हुआ नहीं। BESS-Polar को लगभग 4.8 करोड़ (48 मिलियन) हीलियम नाभिकों के बीच एक भी प्रति-हीलियम
  नहीं मिला। 95% सीमा हीलियम-जैसे स्पेक्ट्रम के लिए प्रति-हीलियम/हीलियम $< 6.9\times10^{-8}$ है, और उस धारणा के बिना $1.0\times10^{-7}$ (Abe et al., PRL 108, 131301, 2012)। AMS-02 ने किसी प्रति-नाभिक की खोज प्रकाशित नहीं की है। गामा किरणें: किसी समूह की गर्म गैस में प्रतिप्रोटॉनों का अंश $f$ दर $f\,n_p^2\langle\sigma v\rangle$ से विलोपित होता है, जहाँ $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s (परिमाण-कोटि का चयन)। यहाँ प्रयुक्त पायन-क्षय स्पेक्ट्रम में हर विलोपन 100 MeV से ऊपर 2.1 फोटॉन देता है। कोमा समूह (बीटा मॉडल, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$) और Fermi-LAT सीमा $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016) के लिए इससे $f < 9\times10^{-8}$ मिलता है। संतुष्ट: कोई भी प्रतिद्रव्य समूहों के बाहर और कॉस्मिक किरणों की पहुँच से परे होना चाहिए, जो दसियों Mpc तक सीमित रहती हैं। मानदंड 2: हमारे क्षितिज के भीतर कोई डोमेन नहीं। यदि सहगामी आकार $d$ के द्रव्य और प्रतिद्रव्य डोमेन एक-दूसरे को छूते, तो
  पुनर्संयोजन के बाद उनकी डोमेन भित्तियों पर विलोपन अपरिहार्य होता। यहाँ का मॉडल Cohen, De Rújula और Glashow के तर्क का सरल रूप है। भुजा $d$ वाले घनों के लिए प्रति आयतन भित्ति-क्षेत्रफल $3/d$ है ($n$ आयामों में $n/d$, परीक्षित), और बैरियॉन गैस की ध्वनि-गति के $\kappa$ गुना वेग से भित्तियों में प्रवाहित होते हैं। गैस $z\approx150$ तक CMB तापमान का अनुसरण करती है और फिर रुद्धोष्म रूप से ठंडी होती है। हर विलोपन उदासीन पायन के क्षय से 3 फोटॉन देता है। फोटॉन आज तक अभिरक्त-विस्थापित होते हैं, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$, और इस समाकल की जाँच एक बंद सूत्र से की जाती है। विलोपन पुनर्संयोजन ($z_{max} = 1000$) से $z = 20$ तक गिना जाता है। CDG की तरह, बाद के युग छोड़ दिए गए हैं क्योंकि वे संरचना-निर्माण पर निर्भर करते हैं; उन्हें शामिल करने से फ्लक्स केवल बढ़ेगा। फ्लक्स ठीक $\propto 1/d$ है (परीक्षित)। इसकी तुलना COMPTEL पृष्ठभूमि, 0.8 से 30 MeV तक $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ (Kappadath et al. 1996), और Fermi-LAT
  समदैशिक पृष्ठभूमि (100 MeV से ऊपर $7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$, सूचकांक 2.32, कटऑफ 279 GeV; Ackermann et al., ApJ 799, 86, 2015) से की जाती है। $z\sim20$-$300$ से आने वाले फोटॉन 1 से 10 MeV पर पहुँचते हैं, जहाँ सीमा COMPTEL तय करता है। परिणाम: भविष्यवाणी आँकड़ों से $d = 100$ Mpc के लिए 160 गुना, 1 Gpc के लिए 16 गुना और 10 Gpc के लिए 1.6 गुना अधिक है। न्यूनतम डोमेन आकार $d_{min}\approx16$ Gpc है (8.5 MeV पर, $\kappa = 1$), जो प्रेक्षणीय ब्रह्मांड की 14.3 Gpc त्रिज्या से बड़ा है। CDG भी इसी निष्कर्ष पर पहुँचे थे: द्रव्य डोमेन लगभग पूरा दृश्य ब्रह्मांड होना चाहिए। यह एक खिलौना मॉडल है, और $d_{min}$ का मान $\kappa$ के साथ बदलता है। CDG का तर्क है कि विलोपन से होने वाला तापन अंतर्प्रवाह को तेज़ करता है, जिससे सीमा और कड़ी होती है। बाधित: कोई भी प्रतिद्रव्य हमारे क्षितिज के पार होना चाहिए, जहाँ कोई दूरबीन उसकी जाँच नहीं कर सकती। मानदंड 3: सूक्ष्म-समायोजन। मान लीजिए प्रतिद्रव्य उसी खंड पर क्षितिज के पार है और उसे कोई व्यवस्थित नहीं करता। तब एक संतुलित यादृच्छिक विश्व-रेखा $M$
  प्रतिच्छेदनों के लिए हमारे क्षेत्र को लगभग $\sqrt M$ कोटि का शुद्ध आवेश देती है। शुद्ध आवेश का प्रसरण $M$ के बराबर है, या $M(T-M)/(T-1)$ जब कुल $T$ प्रतिच्छेदन संतुलित हों (दोनों परीक्षित)। बड़ी अधिकता की संभावना Cramér के दर-फलन का अनुसरण करती है, $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$, जिसकी जाँच सटीक द्विपद पूँछ से की जाती है। आज हम $N_B\approx9\times10^{79}$ बैरियॉन देखते हैं और कोई प्रतिद्रव्य नहीं, इसलिए हर प्रतिच्छेदन का चिह्न एक ही होना चाहिए: $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$। इसके बजाय इसे प्रारंभिक ब्रह्मांड की अधिकता के रूप में पढ़ें, यानी लगभग $1.5\times10^{89}$ युग्मों (प्रति फोटॉन एक) में $9\times10^{79}$, तो $\log_{10}P\approx-1.2\times10^{70}$। किसी क्रियाविधि के बिना संतुलित विश्व-रेखा विफल होती है। वह क्रियाविधि एक ऐसी सीमा-शर्त होनी चाहिए जो हमारे क्षेत्र के सभी प्रतिच्छेदनों के चिह्नों को सहसंबद्ध करे: एक सममिति, कोई उतार-चढ़ाव नहीं। मानदंड 4: CPT-सममित ब्रह्मांड। Boyle, Finn and Turok (PRL 121, 251301, 2018) प्रस्तावित करते हैं कि महाविस्फोट
  (बिग बैंग) के बाद का ब्रह्मांड उससे पहले के ब्रह्मांड का CPT दर्पण-प्रतिबिंब है, इसलिए यह युग्म समग्र रूप से CPT सममिति का उल्लंघन नहीं करता। आगे P3 का इस मॉडल के साथ लेखक द्वारा किया गया संरेखण दिया गया है। $t = 0$ को काटने वाली विश्व-रेखा हमारी ओर द्रव्य है। दर्पण में प्रेक्षकों का समय-तीर विपरीत है, इसलिए वे उसी हिस्से को प्रतिद्रव्य के रूप में देखते हैं। चरण 2 में सिद्ध की गई चेतावनी अब भी लागू है: किसी भी पूर्ण खंड पर एक सतत विश्व-रेखा के लिए $|Q|\leq1$, इसलिए अकेला दर्पण मदद नहीं करता। संरेखण तभी काम करता है जब विश्व-रेखा महाविस्फोट और भविष्य की सीमा से होकर लिपटती है, और अनुरूप समय (conformal time) के दोनों सिरे आपस में जुड़े हों। यह प्रकाशित मॉडल से परे एक अतिरिक्त धारणा है, और चरण 2 का विस्तार C एक नई जगह पर। $w$ बार लिपटा हुआ पाश हमारी ओर के हर खंड पर $+w$ पढ़ता है और हर दर्पण खंड पर $-w$, जब दर्पण के अपने समय-तीर से पढ़ा जाए। कुल योग शून्य है (परीक्षित)। अधिकता अब एक सांस्थितिक पूर्णांक है, उतार-चढ़ाव नहीं, हालाँकि $w\approx10^{80}$ अब भी हाथ से डाला जाता है। मॉडल की प्रकाशित
  भविष्यवाणियाँ (Boyle, Finn और Turok के सारांश से), उद्धृत संख्याओं पर परखी गईं: (a) सबसे हल्का न्यूट्रिनो द्रव्यमानहीन है। NuFIT 6.0 के द्रव्यमान-अंतरालों ($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, सामान्य के लिए $\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$, व्युत्क्रम के लिए $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$) के साथ यह $\Sigma m_\nu = 0.0588$ eV (सामान्य द्रव्यमान-क्रम) या $0.0989$ eV (व्युत्क्रम द्रव्यमान-क्रम), और $m_\beta = 0.009$ या $0.049$ eV तय करता है। KATRIN $m_\beta$ को 0.8 eV (Nature Physics 18, 160, 2022) और 0.45 eV (Science 388, 180, 2025) से नीचे सीमित करता है, जो दोनों मानों से बहुत ऊपर है। Planck 2018 $\Sigma m_\nu < 0.12$ eV देता है, जो दोनों की अनुमति देता है। DESI 2024 ($< 0.072$ eV) और DESI DR2 ($< 0.064$ eV, $\Lambda$CDM) व्युत्क्रम स्थिति को खारिज करते हैं और सामान्य की अनुमति देते हैं। DESI DR2 दोलन-प्रयोगों से मिलने वाली निचली सीमा के साथ एक तनाव भी दर्ज करता है, और द्रव्यमानहीन सबसे हल्का न्यूट्रिनो वह स्थिति है जिसमें तनाव सबसे कम है। (b) डार्क
  मैटर $4.8\times10^8$ GeV द्रव्यमान का एक स्थायी दक्षिण-हस्तिक (right-handed) न्यूट्रिनो है। यह किसी भी कोलाइडर की पहुँच से बहुत परे है और कोई प्रत्यक्ष-संसूचन संकेत नहीं देता, इसलिए अभी इसका परीक्षण नहीं किया जा सकता। (c) कोई आदिम गुरुत्वीय तरंगें नहीं हैं, इसलिए $r = 0$। BICEP/Keck $r < 0.036$ (95%, PRL 127, 151301, 2021) देता है, जो संगत है। असली परीक्षण $\sigma(r)\sim10^{-3}$ है: यह CMB-S4 का लक्ष्य था (परियोजना जुलाई 2025 में रोक दी गई), और अब LiteBIRD तथा Simons Observatory का। निर्णय तालिका। (1) पास में कुछ भी मिला हुआ नहीं: आवश्यक; संतुष्ट। एक भी प्रति-हीलियम नाभिक या किसी समूह से विलोपन गामा किरणें इसे असत्य सिद्ध (falsify) करेंगी। (2) क्षितिज के भीतर कोई डोमेन नहीं: आवश्यक; बाधित ($d\gtrsim16$ Gpc)। MeV-पृष्ठभूमि में अधिकता या निकटतर भित्तियों से CMB विकृति इसे असत्य सिद्ध करेगी; क्षितिज के पार यह अपरीक्षणीय है। (3) सूक्ष्म-समायोजित नहीं: आवश्यक; यादृच्छिक विश्व-रेखा के लिए यह विफल होता है ($\log_{10}P\sim-10^{70}$ से $-10^{79}$), और केवल कोई क्रियाविधि ही इस समस्या को दूर करती
  है। (4a) सबसे हल्का न्यूट्रिनो द्रव्यमानहीन: बाधित, अब तक संगत। शून्य से अधिक मापा गया सबसे हल्का द्रव्यमान इसे असत्य सिद्ध करेगा, उदाहरण के लिए सामान्य क्रम में $\Sigma m_\nu$ का स्पष्ट रूप से 0.0588 eV से ऊपर होना। (4b) भारी दक्षिण-हस्तिक न्यूट्रिनो डार्क मैटर: अभी अपरीक्षणीय। डार्क मैटर का किसी और चीज़ के रूप में पहचाना जाना इसे असत्य सिद्ध करेगा। (4c) $r = 0$: संगत। $r\gg10^{-3}$ वाले आदिम B-मोड इसे असत्य सिद्ध करेंगे। निष्कर्ष: विस्तारित P3 केवल एक ऐसी विश्व-रेखा के रूप में बचता है जो CPT दर्पण ब्रह्मांड के आर-पार संतुलित हो और महाविस्फोट से होकर लिपटी हो। इस रूप में उसे असत्य सिद्ध की जा सकने वाली (falsifiable) भविष्यवाणियाँ विरासत में मिलती हैं। सबसे हल्के न्यूट्रिनो का शून्येतर द्रव्यमान, या $r\gg0$ वाले आदिम B-मोड, CPT-दर्पण संरेखण को असत्य सिद्ध करेंगे। पिछले चरणों ने या तो मानक भौतिकी को दोहराया या ऐसे आँकड़ों का सामना किया जिन्हें परिकल्पना आत्मसात कर सकती थी। यह शृंखला का पहला चरण है जिसमें ऐसा परीक्षण है जो विफल हो सकता है।'
meanings:
- 'दोहराया गया $z$ ⇒ योग: हर डोमेन आकार $d$ और फोटॉन ऊर्जा $E$ के लिए आज की विसरित गामा-किरण तीव्रता'
- 'भित्तियों पर प्रति सहगामी cm$^3$ प्रति सेकंड विलोपन: प्रति आयतन भित्ति-क्षेत्रफल $3/d$ गुणा अंतर्प्रवाह $n_b v$'
- उत्सर्जित ऊर्जा पर एक विलोपन से प्रति MeV फोटॉन; दोहराया गया $j$ (पायन ऊर्जा) ⇒ योग
- COMPTEL और Fermi-LAT पृष्ठभूमियों द्वारा अनुमत सबसे छोटा डोमेन आकार (फ्लक्स ठीक $\propto 1/d$ है)
- Fermi-LAT फ्लक्स सीमा से, कोमा समूह की गैस में प्रतिप्रोटॉनों का अधिकतम अंश
- यादृच्छिक चिह्नों वाले $M$ प्रतिच्छेदनों का शुद्ध आवेश; इसका प्रसरण $M$ है
- संभावना कि एक यादृच्छिक विश्व-रेखा $M$ प्रतिच्छेदनों में से हमारे क्षेत्र को शुद्ध आवेश $Q$ दे (Cramér दर-फलन)
- हमारे खंडों और उनके CPT प्रतिबिंबों पर शुद्ध आवेश, प्रत्येक अपने समय-तीर से पढ़ा गया; दोहराया गया $s$ (खंडांश) ⇒ योग
- सबसे हल्के द्रव्यमान $m_l$ और NuFIT द्रव्यमान-अंतरालों से न्यूट्रिनो द्रव्यमानों का योग
labels:
  dims: उस समष्टि के आयाम $D$ जिसमें विश्व-रेखा रहती है (खुला प्राचल)
  speed_factor: भित्तियों में अंतर्प्रवाह वेग $\kappa$, गैस की ध्वनि-गति की इकाइयों में
  z_max: अभिरक्त-विस्थापन $z_{max}$ जिस पर भित्ति-विलोपन शुरू होता है (पुनर्संयोजन)
  winding: महाविस्फोट से होकर विश्व-रेखा की लपेट-संख्या $w$
