source_hash: 26b3bf83c6f6
title: A → B → C 的朗伯–比尔光谱
summary: 分光光度计跟踪连串反应 $A \to B \to C$。混合物的光谱是一个矩阵乘积 $D = l\,E\,c$（波长 × 物种），因此浓度曲线可以用伪逆 $E^{+}$ 通过最小二乘从带噪声的光谱中恢复。观察等吸收点：在某一步反应进行时，光谱在这些点上保持不动。
notes: 每个物种吸收的光与其浓度和光程成正比，$D = \varepsilon\,l\,c$，混合物的吸光度简单相加。对所有波长和时间同时写出，就是矩阵乘积 $D_{tw} = l\,E_{ws}c_{ts}$，所以当波长数多于物种数时，浓度由一个超定线性方程组给出，用最小二乘求解：$\hat c = E^{+}D/l$，伪逆 $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$。这只在纯物种光谱明显不同时才有效；终端打印的 $E$ 的条件数说明噪声被放大了多少。动力学 $A \to B \to C$ 是线性系统 $\dot{\mathbf c} = K\mathbf c$，用矩阵指数精确求解：$[A]$ 衰减，$[B]$ 先升后降（在 $t = \ln(k_1/k_2)/(k_1 - k_2)$ 处达到峰值），$[C]$ 增长，而 $[A] + [B] + [C]$ 保持不变，因为 $K$ 的每一列之和为零。等吸收点：如果只发生 $A \to B$，则 $D = l(\varepsilon_A[A] + \varepsilon_B[B])$ 且 $[A] + [B]$ 固定，所以在 $\varepsilon_A = \varepsilon_B$ 的波长处吸光度不会改变。清晰的等吸收点是干净的双物种转化的经典标志；这里交点从 $\varepsilon_A = \varepsilon_B$（早期）移到 $\varepsilon_B = \varepsilon_C$（后期），其间因三个物种共存而变得模糊。设 $k_2 = 0$ 可看到完美的等吸收点，设 $k_2 \approx k_1$ 则看到它消失。光谱是合成的高斯谱带，具有典型的染料级摩尔吸光系数（$\sim 10^4$ L mol$^{-1}$ cm$^{-1}$），使用 1 cm 比色皿。
meanings:
- 300–700 nm，步长 2 nm
- 每个物种的摩尔吸光系数（合成高斯谱带，L mol$^{-1}$ cm$^{-1}$）
- $A \to B \to C$ 的速率矩阵；每列之和为 0（质量守恒）
- 每个采样时刻的精确浓度；对 $r$ 求和
- 混合物的朗伯–比尔定律：吸光度相加，对物种 $s$ 求和
- 纯光谱的重叠（Gram）矩阵；对 $w$ 求和
- 伪逆；当各光谱线性无关时等于 torch.linalg.pinv(E)
- 由每条带噪声光谱得到的最小二乘浓度；对 $w$ 求和
- 步骤 $A \to B$ 的等吸收点（$B \to C$ 同理）
labels:
  k1: 速率常数 $k_1$（$A \to B$）
  k2: 速率常数 $k_2$（$B \to C$）
  t_end: 运行时间
  c0: 初始 $[A]_0$
  noise: 检测器噪声 $\sigma$（吸光度）
