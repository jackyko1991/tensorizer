source_hash: aac1f92f727e
title: 뉴턴 프랙털
summary: 뉴턴법 $z \leftarrow z - p(z)/p'(z)$를 복소 평면의 모든 픽셀에서 하나의 복소 텐서로 한꺼번에 실행한다. 각 픽셀을 도달한 근에 따라 색칠하면 끌개 영역이 그려지는데, 그 경계는 프랙털이고, 근 가까이에서는 오차가 매 단계 제곱된다.
notes: 단순근 $r$ 주위에서 $p$를 전개하면 $e_{k+1} \approx \frac{p''(r)}{2p'(r)}\,e_k^2$이다. 정확한 자릿수가 매 단계 두 배가 되며, 오른쪽 패널은 이를 로그 척도의 포물선으로 보여 준다($z^3 - 1$에서는 상수가 정확히 1이다). 근에서 멀리 떨어진 곳에서 뉴턴법은 혼돈적이다. $p'(z) = 0$인 임계점 근처에서는 $z$의 아주 작은 변화가 다음 반복값을 평면 어디로든 보내므로, 그림 전체의 복사본이 모든 척도에서 나타난다. 근이 셋 이상인 다항식의 끌개 영역들은 하나의 경계, 즉 뉴턴 사상의 쥘리아 집합을 공유한다. 한 영역의 모든 경계점은 모든 영역의 경계점이다(와다 성질). 터미널은 $3\times3$ 이웃에 모든 색이 있는 경계 픽셀의 수를 전체 화면과 확대 후에 센다. 그 비율은 모든 척도에서 거의 같다. $z^3 - 2z + 2$를 시도해 보자. 0 근처의 시작점은 끌개 주기 $0 \to 1 \to 0$에 빠져 근에 도달하지 못한다(회색 영역). 격자 전체가 하나의 복소 텐서이므로 einsum 하나가 모든 픽셀을 갱신한다.
meanings:
- '픽셀 $p = (h, w)$마다 시작점 하나: $z = x_w + i\,y_h$'
- '상수항부터 올라가는 다항식 계수, 예: $z^3 - 1 \to (-1, 0, 0, 1)$'
- 누적 곱으로 만든 모든 픽셀의 거듭제곱 $1, z, z^2, \dots$
- '반복된 $k$ ⇒ 합산: 모든 픽셀에서의 $p(z)$'
- '$p''(z)$의 계수: 미분하면 거듭제곱이 하나씩 내려감'
- 동반 행렬의 고유값으로 구한 근
- 모든 픽셀에서 모든 근까지의 거리; $j$에 대한 최솟값이 영역 레이블
- '배정밀도의 시작점 하나: 비율이 $|p''''(r)/2p''(r)|$로 수렴'
labels:
  polynomial: 다항식 $p(z)$
  pixels: 한 변의 픽셀 수
  extent: 화면의 반폭
  iterations: 뉴턴 단계 수
  zoom: 확대 배율
  tol: 수렴 허용 오차 $|z - r|$
