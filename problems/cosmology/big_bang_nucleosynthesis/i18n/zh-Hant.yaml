source_hash: fcafdb67dc0d
title: 大霹靂核合成
summary: 把最初三分鐘寫成一個剛性反應網路：中子與質子脫離弱交互作用平衡而凍結，氘瓶頸在 $T \approx 80$ keV 附近打開，幾乎所有中子最後都進入 $^4$He。十二個反應連接 n、p、d、t、$^3$He、$^4$He、$^7$Li 與 $^7$Be；一整批重子光子比 $\eta$ 用隱式 BDF2 方法一次積分，得到 Schramm 圖。在 Planck 值 $\eta \approx 6.1\times10^{-10}$ 時，氦與氘符合觀測，而鋰卻高出約 3 倍：宇宙學鋰問題，至今未解。
notes: 現狀：標準大霹靂核合成是已確立的物理。它對 $^4$He 與 D 的預測，在由宇宙微波背景獨立量得的重子密度下與觀測相符，是熱大霹靂模型的支柱之一（Alpher、Bethe 與 Gamow 1948；Wagoner、Fowler 與 Hoyle 1967）。宇宙學鋰問題仍未解決：預測的 $^7$Li/H 約為老年暈族恆星 Spite 平台的 3 倍（$(1.6\pm0.3)\times10^{-10}$），核物理、恆星耗損或新粒子都尚未能解釋。觀測值（引用的常數）：$Y_p = 0.245\pm0.003$（PDG 的 BBN 評述），D/H $= (2.527\pm0.030)\times10^{-5}$（Cooke、Pettini 與 Steidel 2018）。模型：Smith、Kawano 與 Malaney（1993）的 12 個反應，熱核反應率取自 JINA REACLIB 資料庫（Cyburt 等 2010；資料組 an06、de04、gi17、go17、cd08、db18），逆反應率由細致平衡求得。明示的近似：弱反應率用 Born 近似（不含輻射、有限質量與有限溫度修正），微中子瞬間脫耦（$N_\mathrm{eff} = N_\nu$ 而非 3.044），$^7$Be 計為 $^7$Li、t 計為 $^3$He（之後會衰變），T9 擬合在 $T_9 = 10$ 以上保持不變。因此 $Y_p$ 比 PRIMAT 或 PArthENoPE 等精密程式（$0.2470$）低約 2%；D/H 相差僅幾個百分點。試試 $N_\nu = 4$：膨脹較快，凍結更多中子，使 $Y_p$ 增加約 0.013，BBN 就是這樣計算微中子種類數的。
meanings:
- 反應 $r$ 消耗與產生多少個核種 $i$（12 個反應、8 種核）
- 淨變化；對每個 $r$ 都有 $\sum_i A_i S_{ri} = 0$（重子數）
- REACLIB 擬合：重複的 $k$（$T_9$ 的 7 個基底函數）⇒ 求和，再把同一反應的各資料組相加
- 每個 $\eta_b$ 的正向（$\propto n_b \propto \eta$）與逆向（細致平衡）反應率
- $\prod_j Y_j^{R_{rj}}$，例如 d + d 為 $Y_d^2$
- 重複的 $r$ ⇒ 對所有反應求和
- 牛頓法用的精確雅可比矩陣
- 整批 $\eta$ 的隱式 BDF2 步驟的一次牛頓更新
- Born 近似的弱反應率，以中子壽命 $\tau_n$ 歸一化
labels:
  n_eta: 批次中 $\eta$ 值的數量
  eta10: 標示的 $\eta \times 10^{10}$（左圖）
  tau_n: 中子壽命 $\tau_n$
  n_nu: 微中子種類 $N_\nu$
  n_steps: 以 $\ln T$ 計的 BDF2 步數
