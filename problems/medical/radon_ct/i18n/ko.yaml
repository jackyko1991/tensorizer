source_hash: 8d871084eacb
title: 라돈 변환과 CT 재구성
summary: CT 스캐너는 모든 각도에서 감쇠 지도의 선적분 $p(\theta, s)$를 기록합니다. 셰프–로건 머리 팬텀을 텐서를 회전하고 합하여 투영하고, 필터 역투영으로 다시 만듭니다. 푸리에 공간에서 램프 필터 $|\nu|$를 적용한 뒤 각도에 대한 einsum 하나를 계산합니다.
notes: '모든 투영은 각 각도마다 전체 질량 $\int p\,ds = \iint f\,dA$를 보존합니다. 날것의 투영을 그대로 되돌려 펴 바르면(단순 역투영) 한 점이 $1/r$ 후광으로 바뀌므로 영상은 $f$가 흐려진 모양이 됩니다. 램프 필터 $|\nu|$가 이 흐림을 정확히 되돌립니다(중심 단면 정리). 각도가 너무 적으면 줄무늬가 생기고, 각도 수가 늘수록 오차가 줄다가 픽셀 격자에 의해 한계에 이릅니다. 셰프–로건 창은 높은 진동수에서 램프를 부드럽게 하여 약간의 선명도를 내주고 잡음을 줄입니다. 잡음을 켜고 시도해 보세요. 단순화: 평행 빔 기하, 단색 광선, 쌍선형 보간, 광자 통계 대신 가우스 검출기 잡음. 교육용 모형이며 임상용이 아닙니다.'
meanings:
- '감쇠 지도(수정된 셰프–로건: 타원 10개의 합)'
- 거리 $s$, 위치 $t$, 각도 $\theta$의 광선을 따라 샘플링한 영상
- '반복된 $t$ ⇒ 합: 사이노그램'
- 0으로 덧댄 검출기 위의 램프 $|\nu|$(Ram-Lak), 선택적으로 $\mathrm{sinc}(\nu\,\Delta s)$를 곱함(셰프–로건)
- 필터링된 투영
- '각 투영을 그 광선을 따라 되돌려 펼침: $q_\theta(x\cos\theta + y\sin\theta)$'
- '반복된 $\theta$ ⇒ 합: 역투영'
labels:
  n_pixels: 영상 크기 $N$
  n_angles: 투영 각도 수
  filter: 램프 필터 창
  noise: 검출기 잡음(최댓값 대비 비율)
