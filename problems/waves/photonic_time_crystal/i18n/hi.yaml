title: फ़ोटोनिक समय क्रिस्टल और समय परावर्तन
summary: ऐसे माध्यम में प्रकाश जिसकी परावैद्युतांक (permittivity) $\varepsilon(t)$ समय में बदलती है पर स्थान में नहीं। $\varepsilon$ की अचानक छलाँग एक स्पंद को एक नई आवृत्ति पर एक अग्र और एक समय-परावर्तित पश्च तरंग में विभाजित करती है; एक आवर्ती मॉडुलन संवेग $k$ में एक बैंड अंतराल खोलता है, जिसके अंदर तरंगें चरघातांकी रूप से बढ़ती हैं। हर फ़ूरिये विधा एक स्वतंत्र $2\times 2$ समस्या है, इसलिए सभी $k$ एक बैच के रूप में हल होते हैं, और फ़्लोके बैंड एक बैच eigvals कॉल से आते हैं।
notes: 'स्थान और समय की भूमिकाएँ बदलने पर परिचित प्रकाशिकी उलट जाती है। स्थान में साधारण अंतरापृष्ठ पर आवृत्ति संरक्षित रहती है और तरंग-संख्या बदलती है; कालिक अंतरापृष्ठ पर, जहाँ पूरा माध्यम एक साथ $\varepsilon_1$ से $\varepsilon_2$ पर स्विच होता है, तरंग-संख्या $k$ संरक्षित रहती है और आवृत्ति छलाँग लगाती है, $\omega_2 = \omega_1 n_1/n_2$। चूँकि कोई आवेश या धाराएँ प्रकट नहीं होतीं, $D$ और $B$ सतत रहते हैं ($E$ और $H$ नहीं), जिससे कालिक फ़्रेनेल गुणांक $D_f = \tfrac12(1 + n_2/n_1)$ और $D_b = \tfrac12(1 - n_2/n_1)$ मिलते हैं (Morgenthaler, 1958): स्पंद का एक भाग मुड़कर पीछे चलता है, यही समय परावर्तन है, और ऊर्जा संरक्षित नहीं रहती क्योंकि माध्यम को स्विच करना क्षेत्र पर कार्य करता है। समय में स्विच किए गए संचरण-लाइन मेटामटीरियल में माइक्रोवेव के साथ कालिक परावर्तन और चौड़ी-बैंड आवृत्ति स्थानांतरण देखे गए (Moussa et al., Nature Physics 2023)। एक आवर्ती मॉडुलन $\varepsilon(t) = \varepsilon_0(1 + \alpha\cos\Omega t)$ हर विधा को एक प्राचलिक दोलक बना देता है, $\ddot D_k + (k^2/\varepsilon)D_k =
  0$ (माथ्यू-जैसा समीकरण)। $k/n_0 = \Omega/2$ के पास अग्र और पश्च तरंगें अनुनादी रूप से युग्मित होती हैं: अर्ध-आवृत्ति $\Omega/2$ पर बँध जाती है और एक काल्पनिक भाग प्राप्त करती है, संवेग में (आवृत्ति के बजाय) एक बैंड अंतराल, जिसके किनारे $k \approx \tfrac{n_0\Omega}{2}(1 \mp \alpha/4)$ हैं और शिखर वृद्धि दर $\alpha$ में प्रथम कोटि तक $\approx \alpha\Omega/8$ है। $k \approx n_0\Omega$ पर एक दूसरा, कहीं अधिक संकरा अंतराल कोटि $\alpha^2$ पर प्रकट होता है। एनिमेशन में स्पंद स्पेक्ट्रम का केवल अंतराल के भीतर का भाग बढ़ता है। यह फ़ोटोनिक समय क्रिस्टलों के पीछे का विचार है (समीक्षा: Galiffi et al., "Photonics of time-varying media", Advanced Photonics 2022); प्रकाशीय आवृत्तियों पर आवश्यक मॉडुलन गहराई और गति तक पहुँचना बहुत कठिन है, इसलिए अब तक के प्रयोग मुख्यतः माइक्रोवेव और रेडियो आवृत्तियों पर काम करते हैं। सरलीकरण: 1D में हानिरहित, परिक्षेपणरहित माध्यम, $\mu = 1$, तात्क्षणिक छलाँग, और बाहर से थोपा गया मॉडुलन (वृद्धि के लिए ऊर्जा पंप से आती है)।'
meanings:
- फ़ूरिये आयाम; माध्यम $x$ में एकसमान है, इसलिए $k$ संरक्षित है और हर विधा अपने आप विकसित होती है
- प्रति तरंग-संख्या एक $2\times 2$ जनक
- दोहराया गया $b$ ⇒ योग; वही पंक्ति मोनोड्रोमी आव्यूह $(K, 2, 2)$ को विकसित करती है
- $D$ और $B$ की सततता से अग्र/पश्च आयाम $\tfrac12(1 \pm n_2/n_1)$
- एक आवर्तकाल पर संचारक, तत्समक आव्यूह पर लागू RK4 से
- एक बैच कॉल में सभी $k$ के लिए फ़्लोके गुणक; $\det M = 1$, अतः $\lambda_+\lambda_- = 1$
- 'अर्ध-आवृत्ति: बैंड में वास्तविक, संवेग अंतराल में $\operatorname{Im}\omega > 0$ (वृद्धि)'
labels:
  eps2: छलाँग के बाद परावैद्युतांक $\varepsilon_2$
  alpha: मॉडुलन गहराई $\alpha$
  omega: मॉडुलन आवृत्ति $\Omega$
