title: Моды релятивистской струны и T-дуальность
summary: 'Струна Намбу–Гото (Nambu–Goto) в калибровке светового конуса — это 24 свободные поперечные волны. Одна пакетная сумма по модам рисует колеблющуюся замкнутую или открытую струну; энергия в её модах — это уровень $N$, квантуемый как $\alpha'' M^2 = N - 1$ (открытая) или $4(N-1)$ (замкнутая), а числа состояний $1, 24, 324, 3200, \dots$ считываются из степенного ряда $\prod (1-q^n)^{-24}$. На окружности радиуса $R$ спектр замкнутой струны не меняется при $R \leftrightarrow \alpha''/R$: это T-дуальность. Теория струн — теоретическая схема без прямого экспериментального подтверждения.'
notes: 'Единицы $\alpha'' = 1$. Статус: теория струн — математически согласованная схема-кандидат для квантовой гравитации, но прямых экспериментальных свидетельств в её пользу нет; ничто здесь не является проверенным предсказанием. Показана стандартная учебная математика бозонной струны (Goddard–Goldstone–Rebbi–Thorn 1973; Polchinski, String Theory vol. 1): квантование в калибровке светового конуса согласовано только при $D = 26$, с интерсептом $a = 1$, что оставляет тахион при $N = 0$ ($M^2 < 0$, красный), безмассовый вектор при $N = 1$ для открытых струн и гравитон, B-поле и дилатон при $N = \tilde N = 1$ для замкнутых. Суперструны (D = 10) устраняют тахион. Нарисованная струна — классическая конфигурация, энергия осцилляторов которой равна уровню $N$ (каждый квант моды $n$ несёт $n$ единиц); для замкнутых струн правые и левые моды выбираются с $N = \tilde N$ (согласование уровней, $\int \dot X\cdot X''\,d\sigma = 0$), и струна находится в своей системе покоя, поэтому координата светового
  конуса $X^-$ не рисуется. Панель T-дуальности следит за массами нескольких состояний при изменении радиуса: импульсные состояния ($n/R$) и состояния намотки ($wR/\alpha''$) меняются местами при $R \to \alpha''/R$, а на самодуальном радиусе $R = \sqrt{\alpha''}$ дополнительные состояния становятся безмассовыми. Заголовок проверяет, что весь усечённый спектр с кратностями совпадает при $R$ и $\alpha''/R$.'
meanings:
- комплексные амплитуды правых и левых мод $n$ в 3 из 24 поперечных направлений $i$
- фаза $e^{-in(\tau-\sigma)}$ каждой моды в каждой точке мировой поверхности (broadcast)
- 'повторяющийся индекс моды $n$ ⇒ суммирование: форма струны при каждых $\tau$ и $\sigma$'
- плотность энергии; проинтегрированная по $\sigma$, она даёт уровень $N$ (Парсеваль)
- 'суммы делителей из broadcast-маски делимости: $\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$'
- усечённые степенные ряды перемножаются как нижнетреугольные тёплицевы матрицы, поэтому $\exp$ ряда — матричная экспонента
- массы всех состояний с согласованными уровнями $N-\tilde N = nw$ на каждом радиусе $R_b$ сразу
labels:
