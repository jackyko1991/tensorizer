source_hash: 7c33ee10a4e7
title: メタレンズの逆設計
summary: サブ波長のメタアトムからなる平坦なメタサーフェスは、光に位相 $\varphi(x)$ を刻み込む。光は角スペクトル法（一回の FFT）で伝播させ、autograd と Adam が平坦な初期状態からすべてのメタアトムを調整して、焦点スポットにできるだけ多くのパワーを送り込む。結果を解析的な双曲面レンズと比較し、二つの波長を同時に（バッチとして）設計することで色収差のトレードオフを示す。
notes: 解析的なメタレンズは、レンズから焦点までのすべての経路を同位相にする：$\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$ を $[0, 2\pi)$ に折り返す。メタアトムは光を最大で 1 波長分しか遅らせられないからである（この種の可視光メタレンズは Khorasaninejad et al., Science 2016 で実証された）。ここでは最適化器に公式は与えない：平坦な面から出発し、FFT ベースの伝播計算で焦点スポットのパワー $\eta$ を求め、一回の逆伝播ですべてのメタアトム位相に関する勾配を得る。これはフォトニクスの逆設計で随伴法が与える情報と同じである。単一波長・単一焦点では最良の位相は双曲面のものに近く、最適化器はそれを再発見する（スポットには有限の幅があり、スカラー伝播計算は光線描像と厳密には一致しないので、$\eta$ についてはわずかに上回ることもある）。興味深いのは二波長の場合である：このトイモデルでは各メタアトムは 1 波長内に折り返した固定の光路を加えるので、$\lambda_1 \neq \lambda_0$ では位相が $\lambda_0/\lambda_1$ 倍され、折り返しがもう揃わない。すると双曲面レンズは赤い光を異なる距離に集光する（回折による色収差）。設計を 'dual' にすると両波長が損失を分け合い、最適化器は妥協点を見つける：$\lambda_1$ では改善し、$\lambda_0$ では悪化する。単純化：スカラーの 1 次元光、薄い素子の位相マスク（各メタアトムは隣接間の結合のない理想的な位相シフター）、完全透過、トイの分散モデル、周期境界。実際の逆設計ではメタアトムについてマクスウェル方程式を解く。メタサーフェスカメラ全体の微分可能モデルは Tseng et al.（"Neural nano-optics", Nature Communications 2021）によってエンドツーエンドで訓練され、Li et al. は逆設計メタサーフェスをレビューしている（ACS Photonics 2022）。平坦なレンズが同時に集光できる帯域幅には基本的な限界がある（Presutti & Monticone, Optica 2020）。
meanings:
- 2048 個のグリッド点（$\Delta x = 0.05$ μm）とその FFT 波数
- 設計変数：各メタアトムの位相遅延（$\lambda_0$ での波長単位）。0.25 μm のアトムごとに一つの値
- 波長 $\lambda_l$ での位相。$l$ は二つの波長のバッチ
- 複素数：エバネッセント成分 $|k_x| > k$ では虚数（減衰）
- $x$ の繰り返し ⇒ 和。FFT により $O(X\log X)$ で計算
- 伝達関数のブロードキャストにより、すべての波長と距離での場を同時に
- $x$ の繰り返し ⇒ 和：焦点スポット $|x| < \lambda_l f / D$ 内のパワー
- FFT を通した autograd：随伴法がただで手に入る
labels:
  design: 両波長（dual）または $\lambda_0$ のみで設計
  wavelength: 設計波長 $\lambda_0$
  wavelength2: 第 2 波長 $\lambda_1$
  focal_length: 焦点距離 $f$
  diameter: レンズ直径 $D$
  n_iter: Adam の反復回数
  lr: Adam の学習率（ステップあたりの波長数）
