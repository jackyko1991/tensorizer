source_hash: 0456b6169f6d
title: 二维波包散射
summary: 二维含时薛定谔方程，在 $(N, N)$ 网格上用分步傅里叶法求解。高斯波包射到有两条缝的墙（或圆盘形障碍物）上；torch.fft.fft2 在 $x$ 空间（势能为对角）和 $k$ 空间（动能为对角）之间切换。势垒后方的探测屏记录时间积分概率：由单个粒子的波函数形成的干涉图样。
notes: 单位 $\hbar = m = 1$，波包能量 $E \approx k_0^2/2$。没有掩模 $M$ 时每个因子都是纯相位，所以每一步都严格幺正，归一化保持为 1；掩模有意移除到达边缘的概率（否则周期性 FFT 网格会把它从对侧带回来），所以后期打印的归一化会下降。对于间距为 $d$ 的双缝，距离 $D$ 处屏上的条纹间距约为 $\lambda D/d$，其中 $\lambda = 2\pi/k_0$（屏不在远场，所以只是近似）。选择圆盘时可看到阴影，其后轴线上有明亮的泊松亮斑。图像颜色采用按每帧归一化的平方根标度，使微弱的散射波仍可见；势垒用灰色表示。
meanings:
- 周期性二维网格上的波函数（第一个指标 $x$，第二个 $y$）
- 势垒：$x \approx 0$ 处带两个开口的高墙，或一个圆盘
- 半步势能算符，在 $x$ 空间中为对角
- 整步动能算符，在 $k$ 空间中为对角
- 对 $x$ 和 $y$ 都求和：沿每个轴做一维傅里叶变换
- 边缘附近的平滑阻尼，使波离开而不是绕回
- 探测线 $x = x_\text{screen}$ 上的时间积分概率
labels:
  barrier: 势垒
  k0: 波包动量 $k_0$
  slit_sep: 缝间距 $d$（圆盘直径）
  slit_width: 缝宽 $w$
  n_grid: 每轴格点数
