title: 畸形波（非线性薛定谔方程）
summary: 聚焦型非线性薛定谔方程描述深水波群和光纤中光脉冲的包络。均匀波列是不稳定的：微小的波纹长成约为背景三倍高的巨峰，就像畸形波（疯狗浪）。用分步傅里叶法求解：色散在 $k$ 空间中精确处理，非线性在 $x$ 空间中精确处理。
notes: Strang 分裂：半步色散、一整步非线性、再半步色散；具有二阶精度，并在舍入误差内保持 $N$ 守恒。调制不稳定性：在高度为 1 的背景上，波数 $K < 2$ 的扰动会增长，在 $K = \sqrt2$ 时最快，增长率为 1。在 **modulation** 模式下，背景开始时带有 $10^{-3}$ 的随机噪声（固定种子）：峰在 $t \approx 8$ 后出现，并不断形成和消散。Peregrine 呼吸子 $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$ 从背景中升起一次，恰好达到背景高度的 $3\times$，然后消失；**peregrine** 模式从 $t = -5$ 开始。**soliton** 模式发射亮孤子 $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$，其形状永远保持不变。虚线标出 $|\psi| = 3$。周期盒长度为 60。
meanings:
- 周期网格上的复波包络（complex128）
- 半步色散 $i\psi_t = -\tfrac12\psi_{xx}$，对每个傅里叶模式精确
- 重复的 $l$ ⇒ 求和：离散傅里叶变换
- 一步非线性 $i\psi_t = -|\psi|^2\psi$，因 $|\psi|$ 不变而精确
- $\int|\psi|^2$ 和 $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$，两者都守恒
labels:
  mode: 初态
  noise: 噪声振幅（modulation）
  eta: 孤子高度 $\eta$
  t_max: 模拟时长
