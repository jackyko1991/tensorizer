source_hash: 890ee320b06e
title: 脉冲星计时阵列与 Hellings–Downs 曲线
summary: 纳赫兹引力波的海洋轻轻拉伸地球与众多毫秒脉冲星之间的路径。由一千个随机平面波构成的各向同性背景，通过天线方向图 $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$（对偏振张量做一次 einsum）使每颗脉冲星的脉冲到达时间发生偏移。将每对计时残差做相关并按夹角分箱，即可恢复 Hellings–Downs 曲线——脉冲星计时阵列在 2023 年报告了其证据的四极指纹。
notes: 引力波会改变脉冲星与地球之间的光行时间，因此脉冲到达时间在数年间漂移数十到数百纳秒。对单个波，效应通过 $F^{+}$ 和 $F^{\times}$ 依赖于几何；对各向同性背景，对方向取平均后留下的相关只取决于两颗脉冲星之间的夹角。Hellings 和 Downs（ApJL 265, L39, 1983）算出了它：天球上相近的脉冲星相关为 $\tfrac12$（每颗脉冲星的另一半功率是其自身不相关的脉冲星项），相距约 $82.5^\circ$ 的脉冲星对略呈反相关，而相对的脉冲星又以 $\tfrac14$ 正相关。这种四极形状是横向自旋 2 波的特征：时钟误差会给出单极（$\Gamma = 1$），太阳系历表误差会给出偶极（$\Gamma = \cos\zeta$）；两者都被拟合以作比较。页面用两种方式检验归一化：公式与蒙特卡罗天球积分 $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$ 的比较，以及天线方向图平均 $\langle\sum_A (F^A)^2\rangle = 1/3$。单个天空在曲线周围散布明显：只有少数几个主导频率时，这种“宇宙方差”是真实存在的，也影响真实的阵列；对许多模拟天空取平均可显示收敛。拟合振幅被白噪声稀释到 1 以下。研究背景：2023 年 6 月，NANOGrav 合作组（15 年数据集，Agazie et al., ApJL 951, L8, 2023）报告了具有 Hellings–Downs 相关的纳赫兹引力波背景的证据（相关性约 3σ，近似值），同时发布结果的还有欧洲与印度 PTA（EPTA + InPTA, A&A 2023）、Parkes PTA（Reardon et al., ApJL 951, L6, 2023）和中国 PTA。可能的来源是一群超大质量黑洞双星，由此给出这里使用的 $h_c \propto f^{-2/3}$ 谱。简化：残差未针对每颗脉冲星的自转减慢进行拟合（只去除了均值），只有白噪声，没有脉冲星特有的红噪声，并使用简单的归一化互相关，而非最优统计量或完整的贝叶斯分析。
meanings:
- 指向脉冲星 $a$ 的单位矢量，在天球上均匀分布
- 波 $m$ 的传播方向与偏振角
- 由横向标架 $m, n \perp \hat\Omega$ 构成的 $+$ 与 $\times$ 张量
- 对 $i$ 和 $j$ 求和：地球–脉冲星连线的拉伸
- 天线方向图；$\sum_A (F^A)^2$ 的天球平均恰为 $1/3$
- 脉冲星项的相位延迟，$\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- 对 $m$ 和 $A$ 求和：脉冲星 $a$ 在历元 $t$ 的计时残差
- 对 $t$ 求和：每对的相关，以平均自功率归一化
- 期望相关，$\Gamma(0^+) = \tfrac12$，在 $\zeta \approx 82.5^\circ$ 处取最小值 $\approx -0.152$
labels:
  n_pulsars: 脉冲星数 $N$
  n_realisations: 模拟天空数 $K$
  n_waves: 每个天空的平面波数 $M$
  n_freq: 频率箱 $j/T_{span}$
  span: 观测时长 $T_{span}$
  n_times: 每颗脉冲星的历元数
  noise: 白噪声 $\sigma$ / 引力波均方根
  n_bins: 角度分箱数
  seed: 随机种子
