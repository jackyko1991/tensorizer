source_hash: e1ad81688a05
title: 2D फ़ूरिए रूपांतरण के रूप में फ्रॉनहोफ़र विवर्तन
summary: दूर-क्षेत्र में किसी द्वारक (aperture) का विवर्तन पैटर्न उसके पारगमन फलन का 2D फ़ूरिए रूपांतरण होता है। torch.fft.fft2 का एक कॉल वर्ग, वृत्ताकार छिद्र, द्वि-झिरी और ग्रेटिंग को उनके दूर-क्षेत्र पैटर्न में बदल देता है, और छिद्र बड़ा होने पर एयरी वलय सिकुड़ते हैं।
notes: 'द्वारक तल में लंबाइयाँ $\Delta x$ आकार के पिक्सेलों में हैं; रूपांतरण का आवृत्ति पिक्सेल $(k, l)$ दिशा $\sin\theta = \lambda k/(N\Delta x)$ के संगत है। इसलिए वृत्ताकार छिद्र का पहला काला वलय, $\sin\theta = 1.22\,\lambda/D$ पर, केंद्र से $1.22\,N/D$ आवृत्ति पिक्सेल दूर होता है (धराशायी वृत्त)। बड़े द्वारक छोटे पैटर्न देते हैं: चौड़े फलन का रूपांतरण संकरा होता है। einsum रूप वही रूपांतरण है जो fft2, बस $O(N^2\log N)$ के बजाय $O(N^3)$।'
meanings:
- 'मास्क का पारगमन: 1 = खुला, 0 = अपारदर्शी; पंक्ति $a = y$, स्तंभ $b = x$'
- विविक्त फ़ूरिए रूपांतरण आव्यूह
- 'दोहराए गए $a$ और $b$ ⇒ योग: $y$ के अनुदिश एक 1D रूपांतरण और $x$ के अनुदिश एक'
- वही रूपांतरण fast Fourier transform से, शून्य आवृत्ति केंद्र में खिसकाई गई
- दूर-क्षेत्र तीव्रता, $\log_{10}(I/I_{\max})$ के रूप में दिखाई गई
- व्यास $D$ वाले वृत्ताकार छिद्र का पहला काला वलय, आवृत्ति पिक्सेलों में
labels:
  size_min: प्रारंभिक द्वारक आकार $D$
  size_max: अंतिम द्वारक आकार $D$
  frames_per_aperture: प्रति द्वारक आकृति फ्रेम
