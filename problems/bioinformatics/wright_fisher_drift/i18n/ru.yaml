title: Харди–Вайнберг и генетический дрейф Райта–Фишера
summary: Случайное скрещивание даёт частоты генотипов Харди–Вайнберга $p^2, 2pq, q^2$; случайная выборка $2N$ копий гена в каждом поколении заставляет частоты аллелей дрейфовать. Тысячи популяций эволюционируют одновременно как один тензор (реплики, поколения) биномиальных выборок, при желании с отбором $s$, и сравниваются с $(1-1/2N)^t$ для гетерозиготности и с $1/2N$ и формулой Кимуры для фиксации.
notes: 'Закон Харди–Вайнберга гласит, что один раунд случайного скрещивания превращает частоту аллеля $p$ в частоты генотипов $p^2, 2pq, q^2$, каковы бы ни были генотипы родителей; точки — это $N$ особей, построенных из двух случайных гамет, и они разбросаны вокруг этих кривых. Частоты аллелей остаются неизменными только в бесконечной популяции. При $2N$ копиях каждое поколение — биномиальная выборка из предыдущего, поэтому $p$ совершает случайное блуждание, пока не достигнет 0 (аллель утрачен) или 1 (аллель фиксирован). Две случайно выбранные копии имеют общую родительскую копию с вероятностью $1/2N$, поэтому ожидаемая гетерозиготность $2pq$ уменьшается в $1 - 1/2N$ раз за поколение; в малых популяциях дрейф быстрее. Новая нейтральная мутация начинается как одна копия из $2N$; поскольку в итоге одна из $2N$ копий станет предком всех, её шанс фиксации равен $1/2N$. При отборе применим диффузионный результат Кимуры: полезный аллель с $4Ns \gg 1$ фиксируется с вероятностью, близкой к $2s$,
  что всё ещё далеко от гарантии, а слабовредный может быть фиксирован дрейфом, когда $|4Ns| \lesssim 1$. Здесь $N$ — идеализированный размер популяции (постоянный, случайное скрещивание, без мутаций и миграции); реальные популяции описываются меньшим эффективным размером $N_e$.'
meanings:
- частота аллеля A в реплике популяции $r$ в поколении $t$
- 'после отбора: копии A передаются в $1+s$ раз чаще'
- 'число A среди $2N$ копий следующего поколения: одна выборка на популяцию, все сразу'
- частоты генотипов AA, Aa, aa при случайном скрещивании
- $N$ особей, каждая из двух случайных гамет, подсчитанных по генотипу (точки)
- 'сумма по $r$: среднее $2pq$, сравниваемое с $H_0(1-1/2N)^t$'
- доля популяций, в которых одна новая копия ($p_0 = 1/2N$) зафиксировалась, для каждого $s$
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$, равно $p_0 = 1/2N$ при $s = 0$
labels:
  N: Размер популяции $N$ (диплоидной)
  p0: Начальная частота $p_0$
  s: Коэффициент отбора $s$
  generations: Поколения $G$
  replicates: Популяции $R$
  fix_replicates: Популяций на $s$ (фиксация)
  seed: Случайное зерно
