source_hash: 296b0fae0936
title: 'El postulado de proyección: un estado de muchas dimensiones, muchas sombras'
summary: 'Una hipótesis especulativa, no física establecida: el universo es un único estado $\Psi$ en un espacio de muchísimas dimensiones $D$, y lo que mide un observador es su proyección sobre unas pocas. Este paso enuncia los postulados y comprueba sus matemáticas. La fracción visible $\|P\Psi\|^2$ sigue una Beta$(d, D-d)$, y una medición se modela como una carrera entre bloques ocultos. Una dimensión compleja oculta por resultado da exactamente la regla de Born; más dimensiones dan una desviación que los experimentos de triple rendija descartan. Por ahora la idea reproduce la mecánica cuántica en lugar de ir más allá.'
notes: 'Estado: especulativo. Es la hipótesis propia del autor (véase la descripción de la serie), no física establecida, y ningún experimento la favorece frente a la mecánica cuántica estándar. Este primer paso escribe los postulados con precisión y comprueba las matemáticas en que se apoyan. Los postulados. P0 (una sola realidad): el universo es un único estado $\Psi$ en un espacio de dimensión $D$, posiblemente $D\to\infty$. P1 (proyección): un observador solo ve una proyección $P:\mathbb C^D\to\mathbb C^d$ sobre un subespacio de dimensión $d$; el estado cuántico medido es $\psi = P\Psi/\|P\Psi\|$, así que la función de onda es una proyección de $\Psi$, no $\Psi$ en sí. P2 (evento): una medición es una proyección sobre una franja de tiempo definida que elige un resultado $k$; los pesos de los resultados vienen de $\|P_k\Psi\|^2$, y la regla de Born se pone a prueba, no se supone. P3 (una sola partícula): todas las partículas son proyecciones del mismo objeto. P4 (geometría): el espacio-tiempo
  curvo es la forma proyectada de una inmersión plana de más dimensiones, y una singularidad es donde la proyección se pliega (su jacobiano pierde rango). P5 (dimensión abierta): los efectos cuánticos necesitan una dimensión mínima $d_Q$ y la gravedad una $d_G$ dentro de $D$; se estiman o se ajustan, nunca se fijan a mano en $3+1$. Qué se calcula. (1) Concentración de la medida: para $\Psi$ uniforme en la esfera de $\mathbb C^D$, $\|P\Psi\|^2\sim$ Beta$(d, D-d)$ con media $d/D$, comprobado con la media, la varianza y una prueba de Kolmogórov–Smirnov para $D$ de 4 a $D_{max}$; el $\psi$ normalizado es uniforme en la esfera pequeña sea cual sea $D$. Un observador típico ve una fracción $d/D$ de la norma, que se anula cuando $D\to\infty$. (2) P2 hecho concreto como una carrera de proyección (el modelo del autor, formalizado aquí): cada resultado $k$ se acopla a su propio bloque de $m$ dimensiones complejas ocultas con energía $E_k = \|h_k\|^2$, y ocurre el resultado con el mayor $|c_k|^2/E_k$.
  Para $m = 1$, $E_k\sim$ Exp(1) y la carrera exponencial da exactamente $P(k) = |c_k|^2$: la regla de Born. Para $m > 1$, $E_k\sim$ Gamma$(m)$ y el resultado más probable gana demasiado a menudo; para dos resultados $P_1 = I_{|c_1|^2}(m, m)$, y la desviación crece con $m$. Las dimensiones ocultas reales dan Gamma$(m/2)$: una dimensión real da la ley del arcoseno $\tfrac2\pi\arcsin|c_1|$, dos dan Born. (3) Recuento de dimensiones (P5): la carrera necesita $D\geq d + K$ para $K$ resultados; $N$ sistemas de dos niveles entrelazados necesitan $D\geq 2^N$, es decir, unos $10^{3\times10^{79}}$ para las $\sim10^{80}$ partículas del universo observable, coherente con el $D\to\infty$ de P0. Honestidad: la mecánica cuántica estándar ya usa exactamente este espacio de Hilbert, y tomar trazas parciales y proyecciones es estándar. Por ahora la hipótesis es una reinterpretación; cualquier novedad comprobable debe venir de donde la carrera con $m > 1$, o un paso posterior, prediga algo distinto. El teorema
  de Gleason (1957) ya muestra que para $d\geq 3$ cualquier asignación de probabilidades no contextual en un espacio de Hilbert es la regla de Born. (4) Datos: en un montaje de tres rendijas (41 casillas de pantalla más un resultado «bloqueado», cada uno con su propio bloque oculto) la carrera da un parámetro de Sorkin $\kappa\approx s\,(a-1)$, con $s$ entre 0,56 y 0,74 en 9 particiones, donde la forma oculta es $a = m$ (compleja) o $m/2$ (real). Valores medidos (data/born_rule_tests.csv, cifras citadas): Sinha et al. (Science 329, 418, 2010) acotan $|\kappa|$ por debajo de $10^{-2}$; Park et al. (RMN, New J. Phys. 14, 113025, 2012) $\kappa = 0.001\pm0.003$; Kauten et al. (New J. Phys. 19, 033017, 2017, acceso abierto, CC-BY 3.0) $0.0\pm1.6\times10^{-3}$ con fotones individuales anunciados, $(1.3\pm1.8)\times10^{-4}$ con láser atenuado y $0.0\pm3.1\times10^{-5}$ con luz clásica. Con $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ y la pendiente más pequeña, los datos de fotones individuales permiten
  $|a-1|\leq 6\times10^{-3}$, y los de luz clásica, si cada detección de un fotón es una carrera, $|a-1|\leq 1.1\times10^{-4}$. La carrera con $m = 2$ da $\kappa\approx 1$ y una dimensión oculta real $\kappa\approx 0.1$, ambas excluidas; solo sobrevive una dimensión oculta compleja (dos reales) por resultado. Es una restricción del modelo, no un apoyo: $m = 1$ es justo el caso que no se puede distinguir de la mecánica cuántica estándar. La correspondencia con $\kappa$ depende de cómo se agrupen los resultados, por eso se usa la pendiente más prudente. Próximos pasos de la serie (no construidos aquí): P3 (todas las partículas como proyecciones de un objeto), P4 (el espacio-tiempo curvo como sombra de una inmersión plana: una métrica analítica 4D se sumerge localmente en 10 dimensiones planas por el teorema de Janet–Cartan, y Schwarzschild en 6), el ajuste de $d_G$ para la gravedad y la búsqueda de una predicción que difiera de la física estándar.'
meanings:
- fracción de la norma de $\Psi$ que ve el observador, para todas las $D$ a la vez (estados anidados)
- el estado observado, uniforme en la esfera unidad de $\mathbb C^d$ para cualquier $D$
- distancia de Kolmogórov–Smirnov a Beta$(d, D-d)$ (beta incompleta por cuadratura)
- 'energía del bloque oculto $k$ con $m = 1..M$ dimensiones: Gamma$(m)$ (complejas) o $2\,$Gamma$(m/2)$ (reales)'
- 'la carrera de proyección: ocurre el resultado con el mayor $|c_k|^2/E_k$'
- forma cerrada de la carrera; la suma sobre $j$ (menos $j = k$) es el producto sobre los demás resultados
- 'índice de rendija $s$ repetido ⇒ sumado: la amplitud para cada conjunto $S$ de rendijas abiertas'
- parámetro de Sorkin de tres caminos del modelo de carrera; $0$ para la regla de Born
labels:
  D_max: Mayor dimensión total $D$ (ejemplo; el cálculo usa una escalera hasta ella)
  d: Dimensión del subespacio del observador $d$ (ejemplo)
  m_max: Mayor número de dimensiones ocultas por resultado $m$
  outcomes: Número de resultados $K$
  trials: Estados aleatorios y eventos por caso
