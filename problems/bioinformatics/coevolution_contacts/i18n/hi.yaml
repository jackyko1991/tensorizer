title: सह-विकास से प्रोटीन संपर्क (DCA)
summary: 'मुड़े हुए प्रोटीन में एक-दूसरे को छूने वाले अवशेष विकास के दौरान साथ-साथ उत्परिवर्तित होते हैं। हम एक खिलौना प्रोटीन को घनीय जालक पर मोड़ते हैं, उसके संपर्कों पर युग्मन $J_{ij}(a,b)$ रखते हैं, गिब्स सैंपलिंग द्वारा पॉट्स मॉडल से एक बहु-अनुक्रम संरेखण (MSA) का नमूना लेते हैं, और फिर केवल संरेखण से संपर्क पुनः प्राप्त करते हैं: one-hot einsum से युग्म सांख्यिकी, माध्य-क्षेत्र DCA $J \approx -C^{-1}$ (या autograd के साथ छद्म-संभाविता) से प्रत्यक्ष युग्मन, और APC-संशोधित फ्रोबेनियस स्कोर, जिसकी जाँच वास्तविक संपर्क मानचित्र से की जाती है।'
notes: 'यह काम क्यों करता है? यदि अवशेष $i$ अपना आकार या आवेश बदलता है, तो उसे छूने वाले अवशेष $j$ को भी अक्सर बदलना पड़ता है, वरना प्रोटीन गलत मुड़ता है। कई संबंधित अनुक्रमों में यह संरेखण के स्तंभों $i$ और $j$ के बीच सहसंबंध छोड़ता है। पर सहसंबंध संक्रामी होते हैं: यदि $i$, $j$ को छूता है और $j$, $k$ को, तो $i$ और $k$ भी बिना छुए सहसंबद्ध होते हैं। प्रत्यक्ष युग्मन विश्लेषण (DCA) एक वैश्विक मॉडल फ़िट करता है, पॉट्स मॉडल ($q$-अवस्था आइसिंग मॉडल), जिसके युग्मन $J_{ij}$ सभी सहसंबंधों को एक साथ समझाते हैं, ताकि अप्रत्यक्ष सहसंबंध अलग से युग्मन के बिना समझ में आ जाएँ। माध्य-क्षेत्र सन्निकटन में युग्मन बस सहप्रसरण आव्यूह के व्युत्क्रम का ऋण हैं (आंशिक सहसंबंधों की तरह); छद्म-संभाविता अधिकतमीकरण इसके बजाय हर स्तंभ के लिए $P(s_i\mid\text{rest})$ फ़िट करता है और वास्तविक परिवारों पर आमतौर पर अधिक सटीक होता है। एनिमेशन संरेखण को 20 अनुक्रमों से बढ़ाकर सभी तक ले जाता है: DCA (ऊपरी त्रिभुज) गहराई के साथ सुधरता है, जबकि सादा सहप्रसरण (निचला त्रिभुज) अटक जाता है क्योंकि उसके मिथ्या धनात्मक अप्रत्यक्ष
  युग्म हैं। यहाँ डेटा वास्तव में ज्ञात संपर्कों वाले पॉट्स मॉडल से आता है, इसलिए परिशुद्धता एक ईमानदार स्कोर है। वास्तविक संरेखण कठिन होते हैं: कुछ अक्षर 20 अमीनो अम्लों और एक रिक्ति का स्थान लेते हैं, अनुक्रम एक जातिवृत्त (phylogeny) से संबंधित होते हैं (वास्तविक DCA लगभग-प्रतियों का भार घटाता है), और केवल कुछ संपर्क ही संकेत छोड़ते हैं। सह-विकास आज की संरचना भविष्यवाणी की जड़ है: plmDCA-प्रकार के संपर्कों ने आरंभिक डीप-लर्निंग विधियों को इनपुट दिया, और AlphaFold 2 मुख्य इनपुट के रूप में MSA लेता है और ध्यान (attention) से उसका अपना, कहीं अधिक समृद्ध उपयोग सीखता है। यह खिलौना उस इनपुट के पीछे के सांख्यिकीय विचार को दिखाता है, AlphaFold कैसे काम करता है उसे नहीं। कमज़ोर युग्मन, कम अनुक्रम, या अधिक अक्षर $q$ आज़माएँ।'
meanings:
- एक सर्पिलाकार शृंखला जो $X\times Y\times Z$ बक्से को भरती है; संपर्क वह जालक पड़ोसी है जो शृंखला के अनुदिश कम से कम 3 दूर हो
- '"वास्तविक" मॉडल: यादृच्छिक क्षेत्र, और यादृच्छिक $q\times q$ युग्मन खंड केवल जहाँ $\mathcal C_{ij} = 1$'
- 'स्थानीय क्षेत्र: अनुक्रम $n$ के हर अन्य स्तंभ और अक्षर पर $j, b$ का योग'
- 'शतरंज-पट गिब्स: संपर्क विपरीत रंगों को जोड़ते हैं, इसलिए आधे स्थलों का एक साथ, सभी $N$ शृंखलाओं में, पुनः नमूना लिया जाता है'
- संरेखण एक one-hot टेंसर के रूप में
- '$n$ पर योग: एकल और युग्म आवृत्तियाँ; $f_{iajb}$ का $b$ पर योग फिर से $f_{ia}$ देता है'
- एकसमान आवृत्तियों का छद्म-गणन (pseudocount) $\lambda$ मिलाने के बाद संबद्ध सहसंबंध
- 'माध्य-क्षेत्र DCA: $L(q-1)$-वर्ग सहप्रसरण का व्युत्क्रम; अंतिम अक्षर संदर्भ अवस्था है'
- 'छद्म-संभाविता विकल्प: $L_2$ दंड के साथ Adam द्वारा $h, J$ पर अधिकतमीकृत'
- युग्म का युग्मन बल, $a, b$ पर योग, शून्य-योग गेज $J^z$ में
- 'औसत-गुणनफल संशोधन (APC): प्रति-स्तंभ पृष्ठभूमि हटाता है, ताकि पंक्तियों और स्तंभों का माध्य 0 हो'
labels:
  fold: जालक तह (बक्से का आकार)
  q: प्रति स्तंभ अक्षर $q$
  coupling: रोपित युग्मन बल $\sigma_J$
  n_seq: MSA में अनुक्रम $N$
  sweeps: प्रति अनुक्रम गिब्स स्वीप
  pseudocount: छद्म-गणन $\lambda$
  method: 'अनुमान: माध्य-क्षेत्र DCA या छद्म-संभाविता'
  plm_iters: छद्म-संभाविता Adam चरण
