source_hash: 895c388f37ef
title: 原子核結合能
summary: 半經驗（液滴模型）質量公式由五項給出每個原子核的結合能：體積項、表面項、庫侖項、不對稱項與配對項。透過廣播一次在整個 $(Z, N)$ 網格上求值，可以看出為何鐵與鎳結合得最緊密，以及穩定谷的走向。
notes: 體積結合能按 $A$ 增長，但表面核子的鄰居較少（$-A^{2/3}$），質子間的排斥則按 $Z^2/A^{1/3}$ 增長；兩者平衡使 $B/A$ 的極大值落在 $A \approx 56$–$62$ 附近，這就是輕核融合與重核分裂都會釋放能量的原因。不對稱項把原子核拉向 $N = Z$，庫侖項則把重核推向 $N > Z$：兩者共同給出彎曲的穩定谷 $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$。此公式對中、重核的準確度約 1 %，但對極輕的核不適用（⁴He 的結合遠比液滴緊密），也無法描述魔數處的殼層效應。預設係數是常見的最小平方擬合值；改變它們可看出哪一項塑造了哪個特徵。
meanings:
- 質子數沿行向下，中子數沿列排列
- 行向量加列向量的廣播填滿整張表
- 偶偶核為 $+a_P/\sqrt A$，奇奇核為 $-a_P/\sqrt A$，$A$ 為奇數時為 0
- 核素圖上每個原子核的結合能，MeV
- 每核子結合能（熱圖）
- 每個質量數下結合最緊的同量異位素（紅線）
- 由 $\partial B/\partial Z = 0$ 得 $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$
labels:
  a_V: 體積項 $a_V$
  a_S: 表面項 $a_S$
  a_C: 庫侖項 $a_C$
  a_A: 不對稱項 $a_A$
  a_P: 配對項 $a_P$
  z_max: 網格上最大的 $Z$
