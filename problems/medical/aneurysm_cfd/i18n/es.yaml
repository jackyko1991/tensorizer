source_hash: 96c00309dd36
title: 'CFD de aneurisma: el flujo de trabajo OpenFOAM + VMTK, reconstruido con tensores'
summary: Flujo sanguíneo pulsátil a través de un aneurisma intracraneal real, segmentado de una angio-RM TOF abierta (CC0), siguiendo el flujo de trabajo estándar de investigación (líneas centrales y extensiones de flujo de VMTK, un solver incompresible al estilo de OpenFOAM y después tensión de cizalla en la pared, TAWSS y OSI), con cada paso escrito como operaciones tensoriales. El solver se comprueba con los flujos de Poiseuille y Womersley y con cálculos de OpenFOAM en un tubo y en la misma malla del aneurisma; las líneas centrales, con VMTK. Solo con fines educativos, no para uso clínico.
notes: 'Flujo de trabajo. Un estudio típico de aneurisma segmenta la luz, la limpia con VMTK (Antiga et al. 2008), resuelve el flujo con OpenFOAM (Weller et al. 1998) y posprocesa la tensión de cizalla en la pared. Aquí cada paso es nuestro, escrito con tensores; no se copia código de ninguno de los dos proyectos GPL. Pasos de VMTK y sus sustitutos: vmtksurfacesmoothing, vmtksurfaceremeshing y vmtkflowextensions (-adaptivelength 1 -extensionratio 5) se ejecutaron una vez sin conexión para crear los archivos STL; vmtkcenterlines -seedselector profileidlist (diagrama de Voronoi, fast marching sobre $|\nabla T| = 1/R$, retroceso por máxima pendiente) se convierte en solve.centrelines: el radio inscrito $R$ es la distancia a la pared de cada vóxel, la ecuación eikonal se resuelve con barridos min-plus repetidos sobre un grafo de 26 vecinos (un sustituto tensorial del fast marching, con velocidad $R^2$ porque el grafo es toda la luz y no el diagrama de Voronoi, que ya es medial), y todas las
  salidas retroceden por los predecesores a la vez. icoFoam/pimpleFoam de OpenFOAM y nuestro código: lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh'']; phi → u; fvc::div(phi) → divergence; fvm::laplacian(p) y su resolución PCG → pressure_matrix y pcg; la corrección de presión PISO → project (una proyección de Chorin por paso); fvm::laplacian(nu, U) → face_laplacian; div(phi,U) → advect semilagrangiano; el objeto de función wallShearStress → wss_at. Malla: vóxeles cúbicos del STL, con un valor fantasma de frontera inmersa en la pared. Geometría: por defecto, un aneurisma de la Lausanne TOF-MRA Aneurysm Cohort (Di Noto et al. 2022; OpenNeuro ds003949, CC0), sujeto 074: un recorte de 28 mm alrededor del aneurisma marcado, umbralizado, mallado con marching cubes, suavizado y extendido (data/SOURCES.md); una entrada y tres salidas. La opción «synthetic» es nuestro propio aneurisma de bifurcación (CC0). Otros conjuntos de datos revisados: AneuriskWeb (CC BY-NC) y AneuX (CC BY-NC
  4.0) son no comerciales; IntrA y AnXplore no indican licencia; el Vascular Model Repository tiene su propia licencia de investigación; los STL de los fantomas de Kiel (CC BY 4.0) son cáscaras de pared con ramas muy finas. Entrada: una onda analítica tipo ACI (media 4,58 ml/s, pico/media 1,66, Ford et al. 2005, periodo 1 s) escalada con la ley de Murray al radio de entrada, perfil de Womersley; salidas a presión cero. Sangre: newtoniana, $\nu = 3.5\times10^{-6}$ m²/s, $\rho = 1060$ kg/m³; paredes rígidas. Residuos (ejecución por defecto): tubo frente a OpenFOAM v1912 pimpleFoam, velocidad en el eje L2 1,2 %, fase −10 mrad, WSS L2 2,5 %; tubo frente a la solución exacta de Womersley, L2 0,4 %; líneas centrales frente a VMTK 1.5.0, distancia media 0,20 mm (0,5 vóxel), máxima 0,5 mm, diferencia de radio media 0,12 mm; aneurisma frente a pimpleFoam en nuestra propia malla de vóxeles exportada como polyMesh (misma entrada y mismas salidas), |u| en el corte L2 35 %, WSS en el pico sistólico L2
  38 %, TAWSS L2 32 %. Esta última diferencia es grande: un cálculo con un paso de tiempo cuatro veces menor dio lo mismo, así que proviene del distinto tratamiento de la pared (nuestros valores fantasma sobre una superficie lisa frente a las caras escalonadas de OpenFOAM), de la posición de las salidas y de los esquemas de advección en una malla gruesa en la que ninguno de los dos códigos ha convergido. Lea los resultados del aneurisma como cualitativos. Las salidas a presión cero además envían demasiado caudal a la rama más pequeña y dan una caída de presión poco realista. Salida: además del GIF, results/aneurysm.pvd es una serie temporal de ParaView de la pared (WSS, TAWSS, OSI), las líneas de corriente y los trazadores. Advertencias: simulación gruesa y educativa de una segmentación por umbral, no para uso clínico. Una WSS baja y un OSI alto en el saco se asocian en la literatura con el crecimiento y la rotura de aneurismas, pero la evidencia es contradictoria y debatida (Meng et al.
  2014). Las referencias de OpenFOAM y VMTK se produjeron una vez, sin conexión, y nunca las ejecutan el problema ni sus pruebas.'
meanings:
- celda propietaria y vecina de cada cara de vóxel, como en las listas owner/neighbour de OpenFOAM
- velocidad normal a la cara (el flujo de OpenFOAM $\phi_f = u_f h^2$)
- 'dos llamadas index_add sobre las caras: fvc::div(phi)'
- $-\nabla^2$ ensamblado a partir de las caras (fvm::laplacian); paredes y entrada Neumann, salidas $p = 0$
- gradientes conjugados, Jacobi más una corrección en agregados gruesos
- seis vecinos en la misma dirección; los valores fantasma imponen $u = 0$ exactamente en la pared
- 'semilagrangiano: rastrear cada cara hacia atrás e interpolar (grid_sample)'
- perfil de Womersley por armónico de $Q(t)$, Bessel $J_0, J_1$ de argumento complejo
- parábola que pasa por $u = 0$ en la pared y muestras en $h$, $2h$ a lo largo de la normal interior
- promedios sobre el ciclo registrado, tau de forma (T, V, 3)
- distancia a la pared = radio de la mayor esfera inscrita
- líneas de corriente RK4 en lote a través de la velocidad interpolada trilinealmente, sembradas en la entrada
- barrido min-plus (Bellman–Ford) de la ecuación eikonal en el grafo de vóxeles de 26 vecinos
labels:
  geometry: 'Geometría: real (angio-RM TOF de Lausana, CC0) o sintética'
  voxel: Tamaño de vóxel $h$
  cycles: Ciclos cardíacos simulados (se registra el último)
  dt_ms: Paso de tiempo $\Delta t$
  frames: Fotogramas de animación por ciclo
