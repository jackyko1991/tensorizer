source_hash: 2b849cfef0cb
title: 平板上的热扩散
summary: 傅里叶定律把温度梯度变为热流，能量守恒把热流的散度变为温度变化。在网格上，两个导数都是很小的卷积核，所以一个时间步只是对整个平板调用两次 conv2d。
notes: 先前向差分再后向差分，组合成熟悉的五点拉普拉斯算子，所以 $\partial_i\partial_i T$ 从不单独编写：它由梯度核与散度核的复合自然得出。显式格式只有在 $\alpha\,dt/dx^2 \le 1/4$ 时才稳定（即下面的“稳定数”）。采用狄利克雷边界时，边缘是 20 °C 的热浴，热量流失；采用诺伊曼（绝热）边界时，没有热流穿过边界，总热量守恒，而温度趋于均匀。正弦模式 $\sin(\pi x/L)\sin(\pi y/L)$ 按 $\exp(-2\pi^2\alpha t/L^2)$ 衰减。
meanings:
- 每个网格单元的温度（为 conv2d 保留批量和通道维度）
- 前向差分模板，每个方向 $i \in \{x, y\}$ 一个输出通道
- 傅里叶定律：热流，通道 $i$ 即分量
- 重复的 $i$ ⇒ 求和：conv2d 把 2 个输入通道相加——即散度
- 热扩散率（m²/s）
- 右端项；前向欧拉：$T \leftarrow T + dt\,\partial_t T$
labels:
  alpha: 热扩散率 $\alpha$
  t_max: 模拟时长
  n_spots: 热点数
  n_grid: 每边网格数
  r: 稳定数 $\alpha\,dt/dx^2$
  boundary: 边界
