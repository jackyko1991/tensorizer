source_hash: 2765022e4b7f
title: 맥놀이와 군속도
summary: 진동수가 가까운 두 개(또는 그 이상)의 사인파를 더합니다. 모든 파동은 파동 $s$, 시각 $n$, 위치 $j$로 색인되는 텐서 하나에 들어 있고, $s$에 대한 einsum 하나가 이들을 중첩합니다. 고정된 점에서는 $|f_1 - f_2|$의 맥놀이가 들리고, 공간에서는 반송파의 마루가 위상 속도로, 포락선이 군속도로 움직입니다.
notes: 두 파동에 대해 $\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$입니다. 느린 포락선 안에 평균 진동수의 빠른 반송파가 있습니다. 소리 크기 $|{\rm envelope}|$는 초당 $|f_1 - f_2|$번, 즉 맥놀이 진동수로 최대가 됩니다. 분산 관계 $\omega = c_0 k_0 (k/k_0)^p$에서 군속도는 위상 속도의 $p$배입니다. 줄 위의 소리($p = 1$)는 같고, 깊은 물의 물결($p = \tfrac12$)은 절반, 표면 장력 잔물결($p = \tfrac32$)은 1.5배입니다. 빨간 점은 $v_p$로 마루를 타고, 초록 점은 $v_g$로 포락선의 봉우리를 탑니다. 파동이 둘보다 많으면 맥놀이는 고립된 파동 묶음이 됩니다.
meanings:
- 파동 $s$의 각진동수와 파수, 분산 관계 $\omega \propto k^p$로 연결
- 파동을 계산하는 위치와 시각
- 브로드캐스팅으로 모든 시각과 장소에서 모든 파동의 위상
- '반복된 $s$ ⇒ 합: 중첩'
- '포락선: 페이저 합의 길이'
labels:
  f1: 진동수 $f_1$
  f2: 진동수 $f_2$
  n_waves: 파동 수 (f1에서 f2까지 분포)
  dispersion: 분산 $p$ = 1, ½, 3/2
  t_max: 시뮬레이션 시간
