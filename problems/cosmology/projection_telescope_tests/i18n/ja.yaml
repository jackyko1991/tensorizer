source_hash: c17ad8b19789
title: 射影の望遠鏡による検証：重力波、ブラックホールシャドウ、超新星
summary: 確立された物理ではなく推測的な仮説を、公開天文データと突き合わせる。重力が $3+1$ より多くの次元を見ているなら、重力波は $1/d$ より速く弱まる。曲がった時空が折り畳まれた射影の影であるなら、光子球の外側にある折り目はブラックホールのシャドウを大きくする。GW170817 とその母銀河の距離からは $D = 4.00^{+0.07}_{-0.25}$ が得られ、M87* と Sgr A* の EHT シャドウは折り目を約 $2.3$ シュヴァルツシルト半径以内にしか許さず、Pantheon+ の超新星は漏れのある（DGP）宇宙と $\Lambda$CDM を区別できない。すべては $3+1$ 次元の一般相対性理論と一致する。余剰次元があるとすれば、それはこれらのスケールで重力が感じない次元でなければならない。
notes: 状態：推測的。これは著者自身の仮説であり（シリーズの説明を参照）、確立された物理ではない。射影仮説のステップ 6、観測のステップである。ステップ 1（cosmology/projection_postulate）では公準を述べ、ボルン則が生き残るのは標準的な量子力学と区別できない場合だけであることを見出した。ステップ 2 から 5（projection_one_particle、projection_dimension_budget、projection_singularity_fold、projection_bell_test）では P3、P5、P4、P1-P2 を検討した。このステップでは、P4（幾何は折り畳まれうる射影である）と P5（重力にはある $d_G$ が必要で、それは仮定ではなくフィットで決める）の未定パラメータを公開データにフィットし、結果がどちらに転んでもその判定を示す。まず既知の物理から。$3+1$ 次元の一般相対性理論では、重力波のひずみは $1/d$ で減衰する。$D$ 次元の時空ではそのエネルギーは $(D-2)$ 次元球面上に広がり、$h\propto d^{-(D-2)/2}$ となる。$1/d$ を仮定する検出器は $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$ を推定する（$d_* = 1$ Mpc、Pardo、Fishbach、Holz、Spergel 2018 と同じ）。あるいは、漏れが遮蔽スケール $R_c$ より先でのみ始まるなら $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ を推定する（彼らの遮蔽型で、$D > 4$ のときに意味を持つ）。仮説の予言：重力が大距離で余剰次元に広がるなら、$d_{GW} > d_{EM}$ かつ $D > 4$ となる。検証 (a)：GW170817、NGC 4993 に光学対応天体を持つ中性子星合体。データ：GWTC-1 リリースの GW 光度距離の事後サンプル 8078 個（data/gw170817_distance.csv；LIGO Scientific および Virgo Collaborations、低スピン事前分布、天球位置は自由；GWOSC、ライセンス CC BY 4.0；Abbott
  et al. 2019, PRX 9, 031040）。解析の事前分布は $\propto d^2$ なので、各サンプルに $d^{-2}$ の重みを付け、カーネル密度推定で $d_{GW}$ の尤度を得る（公表値は $40^{+8}_{-14}$ Mpc、Abbott et al. 2017）。電磁的距離（data/em_distances.csv、引用値）：表面輝度ゆらぎ $40.7\pm1.4\pm1.9$ Mpc（Cantiello et al. 2018, ApJL 854, L31、既定値）、および Pardo らが用いたハッブル流距離、すなわち $v_H = 3017\pm250$ km/s を $H_0 = 73.24\pm1.74$（SH0ES）または $67.74\pm0.46$ km/s/Mpc（Planck）で割ったもの。結果：$D = 4.00^{+0.07}_{-0.25}$（68%、SBF；autograd フィットでは $4.00\pm0.11$）、$3.98^{+0.09}_{-0.24}$（SH0ES）、$3.94^{+0.08}_{-0.24}$（Planck）。Pardo らは $4.02^{+0.07}_{-0.10}$（SH0ES）と $3.98^{+0.07}_{-0.09}$（Planck）を得た。彼らの下側誤差が小さいのは、天球位置を対応天体に固定し、LVC の $H_0$ 事後分布を用いたためである。一方、ここに同梱したサンプルは天球位置が自由なので、距離と傾斜角の縮退により小さい距離の側に長い裾が残る。遮蔽された漏れについては、$-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ により、$D = 5$、$n = 1$ では数百 Mpc 未満の $R_c$ が、$n = 2$ から 5 では約 50-80 Mpc 未満のものが除外される。緩やかな遷移（$n(D-4)/2$ が小さい）はグリッドの端 $10^4$ Mpc まで除外される。Pardo らは、尤度比ではなく事後分布から、どの急峻さについても $R_c\gtrsim 20$ Mpc を与えている。判定 (a)：40 Mpc まで、重力は約 $\pm0.1$ の精度で $D = 4.0$ として振る舞う。重力が感じる余剰次元があるとすれば、それはこれらの距離ではコンパクトであるか遮蔽されている。検証
  (b)：ブラックホールシャドウ。シュヴァルツシルト時空では光子球は $r = 3GM/c^2$ にあり、シャドウ半径は $b_c = \sqrt{27}\,GM/c^2$ である。ここではこれを $\min_r r/\sqrt{f}$ として計算すると同時に、一群の衝突パラメータについて $u'' = -u + \tfrac32 u^2$ を光線追跡しても求める。スピンはシャドウの等面積半径を最大 7% 縮める（Bardeen 曲線；極方向から見た極限ブラックホールでは $2(1+\sqrt2)\,GM/c^2$）。折り目は著者のモデル化上の選択であり、ここで正確に定める。P4 は特異点を射影が折り畳まれる場所とする。射影された幾何は半径 $r_f$ の折り目までシュヴァルツシルトであり、折り目に達した光は二度と戻らないと仮定する。光子球の内側の折り目（$r_f\leq 1.5\,r_s$）はシャドウを変えない。外側の折り目は、それをかすめる光線をシャドウの縁にし、$b = r_f/\sqrt{1 - r_s/r_f}$、したがって $\delta = b/b_c - 1 > 0$ となる。データ（data/eht_shadows.csv、引用値）：M87* のリング $42\pm3$ $\mu$as と $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as（EHT 2019、Papers I および VI）を、恒星力学による $3.64\pm0.22$ $\mu$as（Gebhardt et al. 2011、17.9 Mpc で $6.6\pm0.4\times10^9\,M_\odot$）と比べると $\delta = +0.04\pm0.13$（ここで計算した値であり、公表値ではない）。Sgr A* のリング $51.8\pm2.3$ $\mu$as（EHT 2022、Paper I）と、Paper VI の Table 2 による $\delta = -0.04^{+0.09}_{-0.10}$（Keck 事前分布）および $-0.08\pm0.09$（VLTI 事前分布）。$\delta + 2\sigma$ を取り、スピンが最大 7% を隠しうるとすると、折り目がシャドウを大きくできるのは最大で 0.37（M87*）、0.21（Keck）、0.17（VLTI）であり、したがって
  $r_f\leq 2.86$、$2.40$、$2.28\,r_s$ となる。判定 (b)：シャドウはシュヴァルツシルト/カーと一致する。約 $2.3\,r_s$ より外側の折り目は除外されるが、光子球の内側の折り目（P4 が自然に置く場所、すなわち地平面または中心特異点）はシャドウ画像には見えない。検証 (c、任意)：超新星。DGP ブレーンワールドでは重力は $r_c$ より先で第五の次元に漏れ、膨張は $H^2 - H/r_c\propto\rho$ に従う。Dvali と Turner の指数 $\alpha$ は両者を補間する（$E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$、$\alpha = 0$ は $\Lambda$CDM、$\alpha = 1$ は DGP）。データ：cosmology/cosmological_constant_fit の Pantheon+ 表を data/pantheon_plus.csv にコピーしたもの（超新星 1466 個、$z > 0.01$、対角誤差；Scolnic et al. 2022、Brout et al. 2022；Pantheon+ のデータファイルにはライセンスの記載がなく、論文は CC BY 4.0）。結果（一様事前分布、$-1\leq\alpha\leq 1.8$）：$\alpha = 0.44\pm0.71$；$\Lambda$CDM で $\chi^2 = 639.5$、DGP で $638.9$（どちらも超新星の数を大きく下回るのは、対角誤差に共分散の対角成分が含まれているため）。判定 (c)：超新星だけでは漏れのある宇宙と $\Lambda$CDM を区別できない。自己加速する DGP 分枝を排除するのは CMB およびバリオン音響振動との組み合わせであり（例：Fang et al. 2008, Phys. Rev. D 78, 103509）、ここでは再フィットしない。P4 と P5 に対する総合判定：すべての検証は $3+1$ 次元の一般相対性理論と整合する。仮説が生き残るのは、$3+1$ を超える次元がこれらのスケールで重力の感じないもの（コンパクト、遮蔽されている、あるいはステップ 1 と 5 の量子セクターにのみ存在する）であり、かつ折り目があるとすればそれが光子球の内側にある場合だけである。これは制約であって支持ではない。これまでのところ、本シリーズは標準物理と異なり、かつデータと一致する予言を見つけていない。
meanings:
- GW170817 の距離サンプル 8078 個（GWTC-1）；$w_i = d_i^{-2}$ で体積一様の事前分布を割り戻す
- 繰り返される $i$（サンプル）⇒ 和を取る：$d_{GW}$ のカーネル密度、すなわち正規化された尤度
- 重力が $D_a$ 次元に広がるとき、各電磁的距離 $d_j$ に対して検出器が推定する距離
- $D$ の事後分布、電磁的距離について周辺化（$j$ で和、台形公式）
- autograd フィット：$\log p(D)$ に対するニュートン法のステップ、誤差は二階微分から（ラプラス近似）
- $B$ 個の衝突パラメータと $F$ 個の折り目半径に対する光子軌道 $u = r_s/r$ を一度に計算（$\varphi$ について RK4）
- $r_f$ にある折り目によるシャドウの相対的な拡大（光子球の内側ではゼロ）
- スピン $a$ と傾斜角ごとのカー・シャドウの縮小（Bardeen 曲線、等面積半径）
- 各漏れ指数 $\alpha_a$ と $\Omega_{m}$ に対する超新星の $\chi^2$、オフセット（$H_0$、$M$）は除去；$i$ で和
labels:
  em_distance: 判定に用いる NGC 4993 までの電磁的距離
  D_screen: 遮蔽スケールより先の次元 $D$（遮蔽された漏れ）
  n_screen: 遮蔽遷移の急峻さ $n$
  inc_max_sgra: スピン帯に対する Sgr A* の最大傾斜角
