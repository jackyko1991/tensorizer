title: प्रतिबल, विकृति और मोर वृत्त
summary: एक प्रत्यास्थ प्लेट की सांतत्यक यांत्रिकी। हुक नियम एक रैंक-4 दृढ़ता टेंसर $C_{ijkl}$ है जो लामे स्थिरांकों से einsum द्वारा बनता है; एक भार रैंप (पहले तनाव, फिर अपरूपण) प्लेट को विकृत करता है, विकृति विस्थापन क्षेत्र की प्रवणता से आती है, और मुख्य प्रतिबल eigh से — जिन्हें प्रतिबल दीर्घवृत्त और मोर वृत्त के रूप में दिखाया गया है।
notes: 'प्लेट पतली है और उसके फलक मुक्त हैं, अतः $\sigma_{zz} = 0$ (समतल प्रतिबल) — फिर भी वह पतली होती है: $\varepsilon_{zz} = -\nu(\sigma_{xx} + \sigma_{yy})/E$। रैंप के एक-अक्षीय आधे भाग में आप यंग गुणांक $E = \sigma_{xx}/\varepsilon_{xx} = \mu(3\lambda + 2\mu)/(\lambda + \mu)$ और पॉयसन अनुपात $\nu = -\varepsilon_{yy}/\varepsilon_{xx} = \lambda/2(\lambda + \mu)$ पढ़ सकते हैं। अपरूपण जोड़ने से मुख्य अक्ष $x$ और $y$ से घूम जाते हैं; मोर वृत्त पर बिंदु $(\sigma_{xx}, \tau_{xy})$ और $(\sigma_{yy}, -\tau_{xy})$ एक व्यास के सिरे हैं, और वृत्त अक्ष को मुख्य प्रतिबलों पर काटता है। त्रिज्या अधिकतम तल-अंतर्गत अपरूपण प्रतिबल है, जो तन्य धातुओं में पराभव (yielding) नियंत्रित करता है (ट्रेस्का)। विस्थापन बहुत छोटे हैं और चित्र में बढ़ा-चढ़ाकर दिखाए गए हैं।'
meanings:
- $\delta$ के तीन einsum बाह्य गुणनफल; 81 अवयव, केवल 2 स्वतंत्र स्थिरांक
- 'सममित टेंसरों पर $C$ का व्युत्क्रम: $\varepsilon = S:\sigma$ (9×9 आव्यूह का pinv)'
- हर पदार्थ बिंदु का विस्थापन
- परिमित अंतरों से विस्थापन प्रवणता (torch.gradient)
- विस्थापन प्रवणता का सममित भाग
- 'दोहराए गए $k, l$ ⇒ योग: हुक नियम'
- मुख्य प्रतिबल और उनकी दिशाएँ
labels:
  E: यंग गुणांक $E$
  poisson: पॉयसन अनुपात $\nu$
  sigma_max: अंतिम तनाव $\sigma_{xx}$
  tau_max: अंतिम अपरूपण $\tau_{xy}$
