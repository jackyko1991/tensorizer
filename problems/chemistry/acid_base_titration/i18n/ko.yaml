source_hash: e3d9a69287ac
title: 산–염기 적정 곡선
summary: 강산, 약산, 인산에 수산화 나트륨을 한 방울씩 떨어뜨린다. 구간마다 다른 교과서식 근사를 쓰는 대신, 하나의 전하 균형식을 이분법으로 $[\mathrm{H^+}]$에 대해 풀며, 모든 산과 모든 부피를 하나의 $(A, N)$ 텐서로 동시에 처리한다. 곡선에서 당량점($d\mathrm{pH}/dV$의 봉우리), 완충 구간, 화학종 분율 $\alpha_j(\mathrm{pH})$를 읽을 수 있다.
notes: '전하 균형은 곡선 전체에서 성립하므로 시작점, 완충 구간, 당량점, 과량의 염기에 대한 별도의 공식을 모두 대신한다. 각 항은 pH의 단조 함수이므로 이분법이 안전하다. 매번 구간을 절반으로 줄이며 근을 놓칠 수 없다. 강산(pKa $\approx -6$으로 모형화)은 급격한 도약을 보이며 당량점에서 pH 7이 되는데, 이때 남는 것은 $\mathrm{Na^+}$, $\mathrm{Cl^-}$와 물뿐이다. 약산은 더 높은 pH에서 시작해 완충 구간을 완만하게 지나 오르고, 짝염기 $\mathrm{A^-}$ 자체가 약염기이므로 당량점이 7보다 위에 있다. 당량점까지의 절반 지점에서는 $[\mathrm{HA}] = [\mathrm{A^-}]$이므로 헨더슨–하셀바흐 식 $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$에서 $\mathrm{pH} = \mathrm{p}K_a$가 된다. pKa 값은 이렇게 적정으로 측정한다. 인산(pKa ≈ 2.15, 7.20, 12.35, 25 °C에서의 근삿값)은 두 번의 도약을 보인다. 세 번째 양성자는 산성이 너무 약해서 0.1 M NaOH로는 눈에 띄게 떼어 낼 수 없고, 그 도약은 과량의 염기 속에 묻힌다. 화학종 패널이 그 이유를 보여 준다. 각 $\alpha_j$는 두 pKa 값 사이에서 최대가 되며, 이웃한 두 분율은 정확히 $\mathrm{pH} = \mathrm{p}K$에서 같아진다. 단순화: 활동도 대신 농도를 쓰고, 25 °C이며, 공기 중 CO₂는 고려하지 않는다.'
meanings:
- 산 $a$, 양성자 $i$; 없는 양성자는 $+\infty$($K = 0$)로 채움
- '누적 상수: pKa 값의 누적합에 $-$를 붙인 것, $\beta_{a0} = 1$'
- 산 $V_0$와 염기 $V_n$을 섞은 뒤의 산과 나트륨
- 화학종 분율; 분모의 $k$에 대한 합은 softmax 정규화
- '반복된 $j$ ⇒ 합산: 산 분자당 방출된 양성자 수 $\bar n$'
- $\mathrm{pH} = -\log_{10}h$에 대한 이분법, 모든 산과 부피를 한 텐서로
- 기울기; max-pool로 찾은 봉우리가 당량점
labels:
  c_acid: 산 농도 $c_a$
  V0: 산 부피 $V_0$
  c_base: NaOH 농도 $c_b$
  V_max: NaOH 최대 부피
  pKa_weak: 약산의 pKa (아세트산 ≈ 4.76)
