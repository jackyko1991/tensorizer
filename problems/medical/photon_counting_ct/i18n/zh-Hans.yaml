source_hash: e03f3730cc96
title: 光子计数 CT 与物质分解
summary: 光子计数探测器把每个 X 射线光子分到能量箱中，因此每条射线给出若干个 Beer–Lambert 测量 $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$，而不是一个。批量最大似然拟合（自动微分梯度、Fisher 评分步）把每条射线的泊松计数转换为水、骨和碘的线积分；滤波反投影生成物质图和虚拟单能图像，并区分常规扫描仪显示为相同的碘和骨。
notes: 光子计数探测器（碲化镉或硅）记录单个光子，并把每个脉冲高度与多个阈值比较，因此每个能量箱中的计数都是一个独立的 Beer–Lambert 测量。首台光子计数 CT 扫描仪于 2021 年获得美国 FDA 批准，此后能谱成像、更高的分辨率和更低的电子噪声已从研究走向临床。三种物质至少需要三个能量箱：水和骨的差别主要来自光电效应，而碘还在 33.2 keV 处有 K 边，因此 35 keV 附近的阈值有帮助（试试 25、50、75 keV 的设置）。骨插件被稀释到与 10 mg/mL 碘插件具有相同的能量加权衰减，因此常规图像把两者显示为相同；物质图则能把它们区分开。虚拟单能图像 $\mu_m(E)a_m$ 在低能量时增强碘对比度，而且没有常规图像所显示的射束硬化杯状伪影。三物质分解会放大噪声（基物质衰减曲线几乎平行），因此碘的误差只按 $1/\sqrt{N_0}$ 下降，在中等剂量下每个像素为几 mg/mL；临床系统常使用两种基物质、去噪和迭代重建。简化：平行束，除高斯能量分辨率外探测器理想（无电荷共享、堆积或 K 逃逸），无散射，衰减表经过取整。教学模型，不可用于临床。
meanings:
- 每个像素的基物质含量：水分数、骨分数、碘（mg/mL）
- 每张基物质图的 Radon 变换：沿射线 $r = (\theta, s)$ 的水（cm）、骨（cm）、碘（mg/cm²）
- 各基物质在 1 keV 网格上的衰减（XCOM，双对数插值，碘 K 边位于 33.2 keV）
- 滤过后的球管能谱；能量为 $E_e$ 的光子被计入能量箱 $b$ 的概率（高斯能量分辨率）
- 每个能量箱的 Beer–Lambert：重复的 $m$ 然后 $e$ ⇒ 求和；计数为 $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$
- 泊松负对数似然的梯度；射线之间相互独立，因此一次反向传播给出每条射线各自的梯度
- Fisher 信息，重复的 $b$ ⇒ 求和；$J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- 每条射线一次 $3\times 3$ 求解，批量进行：Fisher 评分（类牛顿）步
- 由重建的基物质图得到的能量 $E$ 处的虚拟单能图像，以 HU 显示
labels:
  kvp: 管电压
  dose: 每条射线的光子数 $N_0$
  thresholds: 能量阈值（keV）
  sigma_kev: 能量分辨率 $\sigma$
  n_pixels: 图像大小 $N$
  n_angles: 投影角度数
