source_hash: d134f88d426a
title: 電子移動のマーカス理論と逆転領域
summary: 電子がドナーからアクセプターへ跳ぶのは、周囲の溶媒がたまたま両状態のエネルギーが等しい配置にゆらいだとき、すなわち二つの放物線の交点に来たときだけである。これからマーカスの速度 $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$ が得られ、ここでは再配向エネルギー、温度、駆動力の一つのブロードキャスト格子上で評価する。速度は $-\Delta G^\circ = \lambda$ で最大になり、直観に反して、さらに下り坂の反応では再び遅くなる。交点でのランダウ–ツェナー跳躍を伴う溶媒座標のランジュバンシミュレーションがこの曲線を再現する。
notes: 単位：eV、K、ps。溶媒座標 $x$ は移動する電荷が感じる集団的な分極で、反応物の井戸が 0、生成物の井戸が 1 になるようスケーリングしている。$\lambda$ は、電荷がまだドナー上にある間に溶媒を生成物向けに分極させるのに要するエネルギーである。Marcus は 1956 年に二次の障壁を導き（J. Chem. Phys. 24, 966）、逆転領域を予言したが、実験で確認されたのは 1980 年代になってからである。逆転領域（$-\Delta G^\circ > \lambda$）では生成物の放物線が反応物の放物線の向こう側で交わるので、駆動力が大きいほど交点は高くなる。速度式は古典的な溶媒を伴う黄金律（非断熱、小さな $H_{AB}$）である。実際の逆転領域の速度はもっとゆっくり下がる。高振動数の分子振動が量子的な経路を開くからである（マーカス–レビッチ–ヨルトナーの拡張）。シミュレーションは意図的に単純な描像である：振動数 $\omega$、摩擦 $\gamma$ をもつ一つの古典的な溶媒座標が、一度に一つの透熱放物線の上を動き、交点でランダウ–ツェナー確率 $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$ で乗り移る。これはまっすぐで速い通過を仮定している。通過の熱的な流束について足し合わせると、$P_{\mathrm{LZ}} \ll 1$ のとき黄金律の速度に戻るので、点は曲線上に乗る。$H_{AB}$ が大きいと跳躍は飽和し（断熱的移動）、摩擦が効いてくる。跳躍した軌跡は生成物の面上で続き、跳び戻ることもある。$T$ を下げる（曲線が細くなる）、$H_{AB}$ を上げる（シミュレーションが式より下にずれる）、$\lambda$ を変える、などを試してみよう。
meanings:
- 速度格子の三つの軸
- ブロードキャストですべての組み合わせを一度に作る；どの添字についても和をとらない
- 放物線が交わる位置；$x^* < 0$ は逆転領域を意味する
- 反応物の極小から測った交点の高さ
- シミュレーションした駆動力 $d$ での軌跡 $n$、ボルツマン統計で反応物の井戸から開始
- 反応物の面上で 0、生成物の面上で 1；溶媒が引き寄せられる極小を決める
- すべての軌跡をまとめて、半キック、半ドリフト、摩擦 + ノイズ、半ドリフト、半キック
- ステップが $x^*$ を通過するたびに、この確率で面を乗り換える
- 反応物の面上で過ごした単位時間あたりの順方向跳躍数；誤差棒は $\sqrt{\text{hops}}/t$
labels:
  lam: 再配向エネルギー $\lambda$
  T: 温度 $T$
  H_ab: 電子カップリング $H_{AB}$
  omega: 溶媒の振動数 $\omega$
  friction: 溶媒の摩擦 $\gamma$
  steps: 時間ステップ数
