title: 工作流 DAG 就是一个路由器固定的专家混合模型
summary: 一个 MNIST 数字 $d$ 加上一段三个词的文本（例如 "now plus three"），给出答案 $y = (d \circ k) \bmod 10$；单靠任何一种模态都不够。把这条流水线写成 Snakemake 风格的工作流（encode_image、encode_text、每种运算一条 fuse 规则并由输入函数选择、classify），交给 Willis 环问题的张量 DAG 引擎运行时，它算出的结果与 top-1 专家混合（mixture-of-experts）层完全相同，只要该层的路由矩阵 $G$ 固定为规则所做的选择。接着是单一张量程序才允许的四个阶段：学习得到的路由器、分开训练再串接的专家、对整个 DAG 做一次反向传播，以及蒸馏成一个以 int8 存储的小型稠密网络。这是一个连接已知结果的框架，不是新的定理。
notes: 构想。这个框架出自 Jacky Ka Long Ko：构建 Willis 环工作流（medical/cow_workflow_dag）时发现，一个 Snakemake DAG 可以是单一张量程序，而这样的程序看起来就像多模态的专家混合模型。准确地说：工作流 DAG 是一个路由器固定的 MoE；MoE 则是一个按输入选择边的 DAG。这是一个连接已知结果的框架，不是新的定理，本问题构建它的一个小实例。等价性。data/Snakefile 包含规则 encode_image、encode_text、fuse（每个样本、每种运算一个作业，通配符为 $op$）、classify 与 collect；classify 通过输入函数 `routed` 读取输入，该函数指定样本文本中那个运算的 fuse 输出。引擎用 cow_workflow_dag 的解析器解析该文件，并由其 Kronecker 块构建作业邻接矩阵；条件边的块是 $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$，因此路由矩阵 $G$ 就位于邻接矩阵之中，而 $N E$ 个 fuse 作业中只需要被选中的 $N$ 个（一次布尔反向传递，就像 Snakemake 剪除作业一样）。逐层运行、每条规则一次批量调用，它给出的 logits 与 Switch 风格的层（以累计名次构建分派张量 $D$、所有专家在一次批量 einsum 中计算、再合并）相同，条件是 $G$ 固定为规则的选择且门控值为 1：在全部 1000 个测试样本 × 2 个种子上，float32 下逐位相同，float64 下差距在 $4 \times 10^{-15}$ 以内（堆叠乘积与分组乘积的求和顺序不同），各处的预测都一样。这是同一计算的两种写法之间的恒等式，不是实验发现。学习得到的路由器。在文本特征上使用 softmax 门控、top-1 路由与 Switch 负载均衡损失（$\alpha = 0.01$），编码器冻结，两种变体并列比较。放在工作流本身的 fuse 专家之前时，门控单独就能重新发现规则：默认 800 步后，运算 $e$ 在 0.85 ± 0.03 的测试样本上被送往专家 $e$（准确率 0.82，固定路由器为 0.92），而且仍在上升（试运行中
  1500 步后为 0.95 与 0.90）。与全新的专家一起学习时则不然：路由与运算的对应不比随机好（取最佳专家排列为 0.35；1/3 表示毫无关联），专家保持混杂，准确率停在 0.40。fuse 专家看不到文本，因此忽略运算的路由会让每个专家面对不可能的任务；但一开始没有任何专家在任何运算上更好，所以 top-1 门控得不到打破对称的信号。在试运行中，门控噪声、大 100× 的门控初始化、500 步的稠密（soft）预热以及 $\alpha = 0.1$ 都没有改变这一点（不属于默认运行）。更大的 MoE 能从零成功训练其路由器；这个玩具例子只说明，在这里固定的规则并不是能免费重新发现的。阶段。(2) 分开训练：每个专家各自处理子任务，图像专家（一个 MLP）学习数字标签（测试准确率 0.916），文本专家（一层 einsum 注意力）学习数字词（1.000），fuse 专家从 one-hot 输入学习 300 项的表（1.000）；不经联合训练、直接通过 DAG 串接，流水线答对 0.924 的测试样本对（高于数字准确率，因为乘以 0 或乘以 5 能容忍部分错误数字）。(3) 端到端微调，对所有阶段做一次反向传播：0.924，没有提升；瓶颈在图像专家，而联合损失并未带来关于数字的新信息（同样的 3000 张图像）。(4) 一个稠密学生网络（784 + 45 → 64 → 64 → 10，57 930 个权重，为流水线 108 766 个的 0.53）在 $T = 4$ 下蒸馏（损失 $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 交叉熵）：0.85–0.86，在 0.85–0.87 的样本上与教师一致，且在 3000 步结束时仍在进步；逐通道 int8：0.85–0.86，58.9 kB 而非 232 kB（流水线为 435 kB）。在单个 CPU 线程上处理 1000 个测试样本对的时间：DAG 引擎 90 ms，同一 DAG 写成一个 MoE 层 19 ms（引擎还要构建作业块），学生 3.4 ms，int8 学生 3.5 ms（以反量化的浮点数计算，所以这里更小但并非真的更快），而每个作业调用一次（如调度器在不计进程启动的情况下运行）为 900–1000 ms。不能推出的结论。只有在同一内存空间中属于张量程序的阶段，才能无拷贝地融合并传递梯度：基于文件的工具（OpenFOAM、VMTK、大部分生物图像分析）做不到，由它们组成的
  Snakemake DAG 仍是进程构成的 DAG。Willis 环的加速主要来自省去每个作业的进程启动与文件 I/O，而非批处理。端到端训练也只有在某个阶段能学到分开训练没有给它的东西时才有帮助；这里并没有。相关工作。Neural Module Networks（Andreas et al. 2016）按解析器选出的模块为每个问题组装网络，即按输入选择的 DAG；稀疏门控 MoE（Shazeer et al. 2017）与 Switch Transformer（Fedus et al. 2021，本文所用的 top-1 路由与负载均衡损失）；LIMoE（Mustafa et al. 2022）与 Uni-MoE（Li et al. 2024）中的模态专家；模型拼接（Lenc & Vedaldi 2015；Bansal et al. 2021）通过学习得到的接口连接分开训练的网络，正如阶段 2 通过概率向量所做的；知识蒸馏（Hinton et al. 2015）；DSPy（Khattab et al. 2023）端到端优化整条语言模型调用流水线。Google 的 Pathways（2021 年的一篇博客文章与愿景）描述一个模型，将每个任务路由到它所需的部分。数据。MNIST（LeCun, Cortes & Burges；LeCun et al. 1998），许可证 CC BY-SA 3.0：3000 张训练图像（每个数字 300 张）与 1000 张测试图像（每个数字 100 张），取文件顺序中各数字的最前几张，以 uint8 打包（0.7 MB，data/mnist_train.npz, data/mnist_test.npz，按相同许可证再分发；data/SOURCES.md 记载来源、校验和与处理方式）。文本为生成：一个运算词（plus、minus、times）、一个数字词（zero 到 nine）和一个填充词（now、then），顺序随机；测试文本使用固定种子。设备与限制。附带的数字来自在 CPU 上的默认运行（本项目环境在此没有 PyTorch 的 CUDA 版本；权重约 $10^5$ 个，GPU 也帮不上忙）：在一台繁忙的 6 核机器上，训练与测量加上 GIF 约需 75–150 s。所有种子在模型轴上一起训练，各自使用自己的小批量，每个种子都会绘出。这是只有一个数字和三种运算的玩具例子：它展示结构，而非大型多模态
  MoE 的行为。
meanings:
- 用 medical/cow_workflow_dag 的解析器从 data/Snakefile 解析出的规则图，加上输入函数 `routed`（一条条件边 classify ← fuse）
- 作业级块：cow_workflow_dag 的 Kronecker 积（每个通配符轴 sample、op 各取 $I$、$\mathbb 1$、$\mathbb 1^\top$）；对条件边则用路由器掩码，因此 classify 的作业 $n$ 读取 fuse 的作业 $(n, e)$ 当且仅当 $G_{ne} = 1$
- 工作流的路由器：运算词的 one-hot，由规则（输入函数）求得，而非学习得到
- 目标所依赖的作业，$\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$：$N E$ 个 fuse 作业中只有 $N$ 个
- 引擎：规则逐层运行，每条规则对其所需作业做一次批量调用（fuse：其 $op$ 通配符的每个值一次调用）
- 样本 $n$ 对应到专家 $e$ 的槽位 $c$（它在被路由到该处的样本中的名次），如同 GShard/Switch；容量 $C$ = 最大的组
- 所有专家在一次批量乘积中计算；$m$ 是模型（种子）轴，从不求和
- 合并：对 $e$ 与 $c$ 求和，每个样本只有一个非零项，因此当 $g = G$ 时等于 DAG 的输出
- 学习得到的路由器：文本特征上线性门控的 softmax；top-1 路由，输出乘以 $p$
- Switch 负载均衡：$f_e$ = 路由到 $e$ 的比例，$P_e$ = 平均门控概率；均衡且均匀时为 1，坍缩时为 $E$
- 温度 $T$ 下的 Hinton 蒸馏；学生损失为 $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ 交叉熵（相对于真实答案）
- 逐输出通道的对称 int8，$s_o = \max_i |W_{io}|/127$；以 int8 加上每通道一个 float32 缩放因子存储
labels:
  seeds: 种子数（模型轴上的模型）
  split_steps: 阶段 2 步数（每个专家处理其子任务）
  router_steps: 阶段 1b 步数（学习得到的路由器）
  global_steps: 阶段 3 步数（端到端微调）
  student_steps: 阶段 4 步数（蒸馏）
  student_hidden: 学生宽度 $H$
  temperature: 蒸馏温度 $T$
  balance_weight: 负载均衡权重 $\alpha$
