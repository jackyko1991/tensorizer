title: 'General relativity: orbits and infall around a black hole'
category: astro
level: advanced
order: 1
tags: [nobel:physics:2020, wolf:physics:1988]
summary: >
  Geodesics in the Schwarzschild metric, with the Christoffel symbols obtained from $g_{\mu\nu}(x)$ by automatic differentiation and contracted
  with einsum. A bound orbit precesses instead of closing, the effective potential shows the innermost stable circular orbit at $6GM/c^2$ and the
  photon sphere at $3GM/c^2$, and a radial plunge reaches the horizon after a finite proper time while the far-away clock freezes.
animated: true
vector_form: 'ds^2 = -\Big(1 - \frac{r_s}{r}\Big)c^2dt^2 + \Big(1 - \frac{r_s}{r}\Big)^{-1}dr^2 + r^2 d\Omega^2,\qquad r_s = \frac{2GM}{c^2}'
index_form: '\frac{d^2x^\mu}{d\tau^2} = -\Gamma^\mu{}_{\alpha\beta}\,\dot x^\alpha\dot x^\beta,\qquad \Gamma^\mu{}_{\alpha\beta} = \tfrac12\,g^{\mu\sigma}\left(\partial_\alpha g_{\sigma\beta} + \partial_\beta g_{\sigma\alpha} - \partial_\sigma g_{\alpha\beta}\right)'
translation:
  - {symbol: 'x^\mu', code: 'y[:, 0, :]', shape: '(B, 4)', meaning: 'event $(t, r, \theta, \varphi)$ on each geodesic, $G = c = M = 1$'}
  - {symbol: '\dot x^\mu', code: 'y[:, 1, :]', shape: '(B, 4)', meaning: '4-velocity $dx^\mu/d\tau$'}
  - {symbol: 'g_{\mu\nu}', code: 'metric(x, M)', shape: '(4, 4)', meaning: 'Schwarzschild metric, signature $(-, +, +, +)$'}
  - {symbol: 'g^{\mu\sigma}', code: 'torch.linalg.inv(g)', shape: '(B, 4, 4)', meaning: 'inverse metric'}
  - {symbol: '\partial_\alpha g_{\sigma\beta}', code: 'vmap(jacrev(metric))(x)', shape: '(B, 4, 4, 4)', meaning: 'metric derivatives by autograd, derivative index last'}
  - {symbol: '\Gamma^\mu{}_{\alpha\beta}', code: "0.5 * einsum('zms,zsab->zmab', g_inv, d1 + d2 - d3)", shape: '(B, 4, 4, 4)', meaning: 'repeated $\sigma$ ⇒ summed ($z$ = batch)'}
  - {symbol: '\Gamma^\mu{}_{\alpha\beta}\dot x^\alpha\dot x^\beta', code: "einsum('zmab,za,zb->zm', Gamma, u, u)", shape: '(B, 4)', meaning: 'repeated $\alpha, \beta$ ⇒ summed'}
  - {symbol: 'g_{\mu\nu}\dot x^\mu\dot x^\nu', code: 'norm(y, M)', shape: '(T, B)', meaning: '$= -1$ for a massive particle, checks the integration'}
notes: >
  Units: $G = c = M = 1$, so lengths are in $GM/c^2$ (1.5 km per solar mass) and the horizon is at $r_s = 2$. The orbit starts at periapsis
  with the exact Schwarzschild energy $E$ and angular momentum $L$ of an orbit with semi-latus rectum $p$ and eccentricity $e$. It is integrated
  in proper time $\tau$ with RK4; the grey Newtonian ellipse with the same $p$ and $e$ closes on itself. The perihelion advance approaches
  $6\pi GM/(c^2 p)$ for large $p$ (43″ per century for Mercury) and grows much larger close to the hole. Bound orbits exist only for $p > 6 + 2e$;
  below the ISCO ($r = 6$) circular orbits are unstable, and at $r = 3$ even light can circle. In the plunge (lower right), the falling clock
  reaches the horizon after $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$-ish (finite), but in Schwarzschild time $t$ the fall slows and freezes at $r = 2$;
  the run stops at $r = 2.1$, where these coordinates start to fail.
params:
  p: {default: 14.0, min: 8, max: 60, step: 1, label: 'Semi-latus rectum $p$', unit: GM/c²}
  e: {default: 0.4, min: 0.0, max: 0.8, step: 0.05, label: 'Eccentricity $e$'}
  n_orbits: {default: 3.0, min: 1, max: 6, step: 0.5, label: Orbits to simulate}
  dt: {default: 2.0, min: 0.5, max: 5, step: 0.5, label: 'Proper-time step $\Delta\tau$', unit: GM/c³}
  r_infall: {default: 10.0, min: 4, max: 30, step: 1, label: Plunge starts at rest at, unit: GM/c²}
