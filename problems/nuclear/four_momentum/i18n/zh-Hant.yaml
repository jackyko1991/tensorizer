source_hash: 045c5b4ab526
title: 四維動量與二體衰變
summary: 一個運動中的粒子衰變成兩個。在其靜止座標系中，產物以固定動量 $p^*$ 背對背飛出；勞侖茲變換 $\Lambda^\mu{}_\nu$（一次 einsum）把所有衰變角度一次轉到實驗室座標系，動量在那裡被向前推。閔考斯基度規 $\eta_{\mu\nu}$ 把產物的四維動量還原成母粒子的質量——這就是用來發現新粒子的不變質量技巧。
notes: 靜止座標系中的動量位於半徑 $p^*$ 的球面上；變換把它拉伸成橢圓（描出的曲線），並按母粒子的動量向前平移，因此高速的母粒子會把兩個產物都拋進狹窄的前向錐中。能量與實驗室角度隨 $\theta^*$ 改變，但每個產物的 $p_\mu p^\mu = m^2$ 以及 $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$ 永不改變——量測兩個動量的偵測器總能重建 $M$。對 $\pi^0 \to \gamma\gamma$，光子無質量（$p_\mu p^\mu = 0$），最小張角為 $2\arcsin(1/\gamma)$。三種衰變都是真實的：$K^0_S \to \pi^+\pi^-$、$\pi^0 \to \gamma\gamma$、$\Lambda \to p\,\pi^-$。只模擬運動學：衰變角度均勻掃描而非隨機取樣，並忽略自旋與極化。
meanings:
- diag(1, −1, −1, −1)，單位取 $c = 1$
- 靜止座標系中 B 個衰變角 $\theta^*$ 的子粒子四維動量
- 對母粒子速度 $\boldsymbol\beta = \mathbf P/E$ 的 $\gamma$、$\gamma\beta_i$ 與 $\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$
- 重複的 $\nu$ ⇒ 求和：一次變換所有衰變
- 閔考斯基內積：在每個座標系中都相同
- 每種組態重建出的母粒子質量
