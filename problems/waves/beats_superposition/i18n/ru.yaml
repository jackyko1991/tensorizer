source_hash: 2765022e4b7f
title: Биения и групповая скорость
summary: Сложите две (или больше) синусоиды с близкими частотами. Все волны хранятся в одном тензоре с индексами волны $s$, времени $n$ и положения $j$; один einsum по $s$ их суммирует. В фиксированной точке слышны биения с частотой $|f_1 - f_2|$; в пространстве гребни несущей движутся с фазовой скоростью, а огибающая — с групповой.
notes: 'Для двух волн $\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$: быстрая несущая на средней частоте внутри медленной огибающей. Громкость $|{\rm envelope}|$ достигает максимума $|f_1 - f_2|$ раз в секунду — это частота биений. При законе дисперсии $\omega = c_0 k_0 (k/k_0)^p$ групповая скорость в $p$ раз больше фазовой: равна ей для звука на струне ($p = 1$), вдвое меньше для волн на глубокой воде ($p = \tfrac12$), в полтора раза больше для капиллярной ряби ($p = \tfrac32$). Красная точка едет на гребне со скоростью $v_p$, зелёная — на пике огибающей со скоростью $v_g$. При более чем двух волнах биения превращаются в обособленные волновые группы.'
meanings:
- циклическая частота и волновое число волны $s$, связанные законом дисперсии $\omega \propto k^p$
- положения и моменты времени, в которых вычисляется волна
- фаза каждой волны в каждый момент и в каждой точке, через broadcasting
- 'повторяющийся $s$ ⇒ суммирование: суперпозиция'
- 'огибающая: длина суммы фазоров'
labels:
  f1: Частота $f_1$
  f2: Частота $f_2$
  n_waves: Число волн (от f1 до f2)
  dispersion: Дисперсия $p$ = 1, ½, 3/2
  t_max: Время моделирования
