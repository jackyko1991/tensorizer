source_hash: 006d4ce1966d
title: 붕괴 사슬 (베이트먼 방정식)
summary: 어미핵이 방사성 딸핵으로 붕괴하고, 딸핵은 다시 안정한 최종 생성물로 붕괴합니다. 세 속도 방정식은 하나의 선형계 $\dot N_i = A_{ij} N_j$를 이루며, 행렬 지수 $e^{At}$로 모든 시각에 대해 한꺼번에 정확히 풀고 RK4와 비교해 검증합니다. 기본 사슬은 의료용 발생기 $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc입니다.
notes: '$\mathsf A$의 각 열의 합은 0이므로 $\sum_i N_i$는 변하지 않습니다. 붕괴할 때마다 원자핵 하나가 사슬 아래로 옮겨 갈 뿐입니다. 두 구성원에 대한 정확한(베이트먼) 해는 $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$입니다. 딸핵의 수명이 더 짧으면($\lambda_2 > \lambda_1$) 방사능이 서로 맞물립니다. 비 $a_2/a_1$은 $\lambda_2/(\lambda_2-\lambda_1)$로 수렴하고(과도 평형), 어미핵의 수명이 훨씬 길면 1로 수렴합니다(영년 평형, 어미핵 반감기를 1000 h로 해 보세요). 딸핵의 수명을 더 길게 하면 평형이 생기지 않습니다. 단순화: 실제로 $^{99}$Mo는 붕괴의 약 88 %에서만 $^{99m}$Tc를 만들며, $^{99}$Tc(반감기 211 000년)는 안정한 것으로 취급합니다.'
meanings:
- $\ln 2/T_i$, 안정한 끝은 $\lambda_3 = 0$
- 대각선에 $-\lambda_i$, 바로 아래에 $+\lambda_i$
- '반복된 $j$ ⇒ 합: RK4가 쓰는 우변'
- 시각마다 행렬 지수 하나, $t$에 대해 배치
- 초기 벡터로부터 모든 시각의 개체 수
- '방사능: 각 구성원의 시간당 붕괴 수'
labels:
  half_life_parent: 어미핵 반감기 $T_1$
  half_life_daughter: 딸핵 반감기 $T_2$
  t_max: 시간 범위
  rk4_steps: RK4 단계 수
