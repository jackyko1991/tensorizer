source_hash: ee1c00fce805
title: 群聚行為：Vicsek 模型與 boids
summary: 椋鳥、魚群和蝗蟲都能在沒有領袖的情況下集體移動。在 Vicsek 模型中，每隻鳥以恆定速率飛行，並模仿鄰居的平均方向，再加上最大幅度為 $\eta$ 的隨機角度；在 Reynolds 的 boids 中，每隻鳥則依分離、對齊和聚合三條規則轉向。週期性盒子中全部 $N^2$ 個鳥與鳥之間的距離構成一個張量，整批雜訊強度同時運行，以展示極序參數 $\varphi$ 的有序–無序相變。
notes: Vicsek 等人（1995）提出此模型，作為集體運動最簡單的物理描述：對齊加上雜訊。雜訊低時，鳥群會達成一致方向（$\varphi \to 1$）；當 $\eta = 2\pi$ 時方向完全隨機，$\varphi$ 只剩下量級為 $1/\sqrt N$ 的有限尺寸雜訊。這在二維中相當了不起，因為 Mermin–Wagner 定理禁止具有連續對稱性的平衡系統出現長程有序；移動中的鳥群能夠規避此定理，是因為鄰居關係不斷改變（Toner 與 Tu 1995）。對於大型系統，相變其實是不連續的，並會出現行進帶（Grégoire 與 Chaté 2004）；但在這裡的小 $N$ 下看起來是平滑的。Reynolds（1987）為電腦動畫寫出了 boids。這裡他的三條規則被寫成對 $i \leftrightarrow j$ 反對稱的成對力，因此若不做速率正規化，鳥群的總動量會精確守恆（有測試檢驗這一點）；正規化到恆定速率 $v_0$ 後，鳥群才能自行選擇方向。聚合力太強會讓鳥群塌縮成一個旋轉的球，所以把它設得較弱。可以試試較小的盒子（較高密度）或較大的半徑，讓有序更容易出現。
meanings:
- 盒子 $[0, L)^2$ 中 $N$ 隻鳥的位置，每個雜訊強度 $b$ 對應一個鳥群
- 從鳥 $i$ 到鳥 $j$ 最近週期映像的位移；對 $i \leftrightarrow j$ 反對稱
- 鄰居矩陣，重複的 $k$ ⇒ 求和；鳥 $i$ 也把自己算在內
- 重複的 $j$ ⇒ 求和：鄰居的平均方向
- 雜訊角度，在 $[-\eta/2, \eta/2]$ 中均勻分布；$\eta = 2\pi$ 使方向完全隨機
- boids：分離 $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$、對齊 $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$、聚合 $\sum_j A_{ij}\mathbf d_{ij}$
- 極序參數：鳥群一致移動時為 1，方向隨機時約為 $1/\sqrt N$
labels:
  n_birds: 鳥的數量 $N$
  box: 盒子邊長 $L$（鄰居半徑 $R = 1$）
  speed: 速率 $v_0$
  eta: 所顯示鳥群的雜訊 $\eta$
  n_noise: 批次中的雜訊強度數目
  steps: 時間步數
  seed: 隨機種子
