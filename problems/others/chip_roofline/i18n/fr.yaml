source_hash: 3c8cc50504ae
title: Mesurer le roofline de votre puce
summary: Quelle est la vitesse de la machine qui exécute ce code ? Chronométrez une grande copie mémoire pour obtenir la bande passante $\beta$, et un produit de matrices $n\times n$ $C_{ij} = A_{ik}B_{kj}$ en FP64, FP32, TF32, BF16 et FP16 pour obtenir le débit $\pi$ de chaque précision ; le roofline $P(I) = \min(\pi, \beta I)$ indique alors quels noyaux votre puce exécute à pleine vitesse et lesquels attendent la mémoire. Compétences de code ▸ Puces d'accélération place votre résultat à côté des fiches techniques d'autres puces.
notes: 'Les fiches techniques donnent des pics ; une mesure donne ce que PyTorch obtient réellement sur votre machine, en général 50–90% du pic pour un grand produit de matrices. Le travail sur GPU est asynchrone : chaque chronométrage attend donc que l''appareil ait fini (synchronize) et prend la médiane de plusieurs exécutions après un échauffement. Sur les GPU NVIDIA, le produit FP32 est mesuré deux fois : une fois en vrai FP32 et une fois avec les cœurs tensoriels TF32 (torch.set_float32_matmul_precision("high")), le réglage qui échange discrètement des bits de mantisse contre de la vitesse. Le backend GPU d''Apple (MPS) n''a pas de float64, donc FP64 y est ignoré ; les GPU grand public exécutent le FP64 à une petite fraction de leur débit FP32, ce qui compte pour la physique. Essayez une taille de matrice plus grande : le débit augmente jusqu''à ce que le produit soit limité par le calcul, tandis que la copie mémoire reste à la bande passante.'
meanings:
- bande passante mémoire mesurée par une grande copie (lecture + écriture), GB/s
- débit de produit de matrices atteint en précision $p$, TFLOP/s
- '$k$ répété ⇒ sommé : $n^3$ multiplications-additions'
- 'FLOP par octet déplacé : $2n/(3b)$ pour des éléments de $b$ octets'
- le maximum que peut atteindre un noyau d'intensité $I$
labels:
  matrix_size: Taille de matrice $n$
  copy_mb: Taille de la copie
  repeats: Répétitions chronométrées
