source_hash: 615dd7755626
title: Волны-убийцы (нелинейное ур. Шрёдингера)
summary: 'Фокусирующее нелинейное уравнение Шрёдингера описывает огибающую групп волн на глубокой воде и световых импульсов в волокнах. Однородный цуг волн неустойчив: крошечная рябь вырастает в огромные пики примерно втрое выше фона, как волны-убийцы. Решается split-step методом Фурье: дисперсия точна в $k$-пространстве, нелинейность точна в $x$-пространстве.'
notes: 'Расщепление Странга: полшага дисперсии, полный нелинейный шаг, полшага дисперсии; второй порядок точности, и $N$ сохраняется с точностью до округления. Модуляционная неустойчивость: на фоне высоты 1 растут возмущения с волновым числом $K < 2$, быстрее всего при $K = \sqrt2$ со скоростью роста 1. В режиме **modulation** фон начинается с шума $10^{-3}$ (фиксированное зерно): пики появляются после $t \approx 8$ и продолжают возникать и рассасываться. Бризер Перегрина $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$ один раз поднимается из фона, достигает ровно $3\times$ его высоты и исчезает; режим **peregrine** запускает его при $t = -5$. Режим **soliton** запускает светлый солитон $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$, который сохраняет форму вечно. Штриховая линия отмечает $|\psi| = 3$. Периодическая область длины 60.'
meanings:
- комплексная огибающая волны на периодической сетке (complex128)
- полшага дисперсии $i\psi_t = -\tfrac12\psi_{xx}$, точно для каждой фурье-моды
- 'повторяющийся $l$ ⇒ суммирование: дискретное преобразование Фурье'
- один шаг нелинейности $i\psi_t = -|\psi|^2\psi$, точно, так как $|\psi|$ не меняется
- $\int|\psi|^2$ и $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$, оба сохраняются
labels:
  mode: Начальное состояние
  noise: Амплитуда шума (modulation)
  eta: Высота солитона $\eta$
  t_max: Время моделирования
