source_hash: faa64f98c4b2
title: KdV 孤子碰撞
summary: 科特韦格–德弗里斯方程的两个孤立波。较高的孤子更快，追上后两者从碰撞中出来时形状完好，只是位置有所偏移。导数在傅里叶空间中计算（$\partial_x \to ik$），刚性的 $u_{xxx}$ 项用积分因子精确求解，其余部分用 RK4。
notes: 约定：$u_t + 6uu_x + u_{xxx} = 0$，速度为 $c$ 的孤子高度为 $c/2$，即其速度是振幅的两倍。越高越快、越窄。碰撞后，高孤子比无相互作用时的位置靠前，矮孤子靠后；取 $\kappa = \sqrt c/2$，精确的位移为向前 $\frac{1}{\kappa_1}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ 和向后 $\frac{1}{\kappa_2}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$。点线：若孤子互不影响时应在的位置。盒子是周期性的（长度 100），所以长时间运行会绕回。FFT 把每个导数变为乘法，积分因子消除了 $u_{xxx}$ 对时间步长的严格限制，只剩非线性项较宽松的限制。
meanings:
- 周期网格上的波高（float64）
- 傅里叶系数；$\partial_x \to ik$，$\partial_x^3 \to -ik^3$
- 非线性项 $(u^2)$ 在实空间计算，去掉最高三分之一的模式（2/3 法则）
- 色散部分在一个步长内的精确解（积分因子）
- 守恒量：$\int u\,dx$ 和 $\int u^2\,dx$
labels:
  c_tall: 高孤子速度 $c_1$
  c_short: 矮孤子速度 $c_2$
  t_max: 模拟时长
