source_hash: 5a26364d7c17
title: 'मैट्रिक्स यांत्रिकी: सीढ़ी संकारकों से हाइज़ेनबर्ग का दोलित्र'
summary: 'न तरंग फलन, न ग्रिड: संख्या आधार $|0\rangle, \dots, |N-1\rangle$ में अवनमन संकारक मैट्रिक्स $a_{mn} = \sqrt n\,\delta_{m,n-1}$ है, और $X$, $P$ तथा $H = \tfrac12(P^2 + X^2)$ मैट्रिक्स गुणनफलों से प्राप्त होते हैं। इसके आइगेनमान $n + \tfrac12$ हैं और $[X, P] = i$। torch.linalg.matrix_exp से या तो संकारक $X(t) = U^\dagger X U$ चलता है (हाइज़ेनबर्ग चित्र) या अवस्था $U|\alpha\rangle$ चलती है (श्रोडिंगर चित्र); दोनों एक ही $\langle X\rangle(t)$ देते हैं, और एक संबद्ध अवस्था स्प्रिंग पर लगे शास्त्रीय द्रव्यमान की तरह कला समष्टि में वृत्त बनाती है।'
notes: 'इकाइयाँ $\hbar = m = \omega = 1$। यही वह क्वांटम यांत्रिकी है जिसे हाइज़ेनबर्ग, बॉर्न और जॉर्डन ने 1925 में पहली बार लिखा: प्रेक्षणीय राशियाँ मैट्रिक्स हैं और उनके गुणनफल क्रमविनिमेय नहीं हैं। $N$ अवस्थाओं तक काटना ही एकमात्र सन्निकटन है। यह अंतिम विकर्ण अवयव में $[X, P] = i$ को तोड़ता है, जो $i(1 - N)$ के बराबर होना ही चाहिए क्योंकि परिमित मैट्रिक्सों के क्रमविनिमयक का ट्रेस 0 होता है, और यह अंतिम आधार अवस्था को $N - \tfrac12$ के बजाय ऊर्जा $(N-1)/2$ देता है; $N$ से काफ़ी नीचे की अवस्थाएँ सटीक हैं। हाइज़ेनबर्ग चित्र में हर अवयव $X(t)_{mn} = X_{mn}e^{i(E_m - E_n)t}$ एक बोर आवृत्ति पर घूमता है, इसलिए दोलित्र के लिए $X(t) = X\cos t + P\sin t$, यानी मैट्रिक्सों के लिए लिखा गया शास्त्रीय हल। संबद्ध अवस्था $|\alpha\rangle$ के लिए $\langle X\rangle(t) = \sqrt2\,\mathrm{Re}(\alpha e^{-it})$ है और वह त्रिज्या $\sqrt2\,\alpha$ के वृत्त में कला समष्टि में घूमती है। क्वांटम सरल आवर्ती दोलित्र की ग्रिड गणना एक बिल्कुल अलग निरूपण से वही सीढ़ी और वही दोलन देती है। $\lambda > 0$ आज़माएँ: स्तर अब
  समान दूरी पर नहीं रहते, बोर आवृत्तियाँ फैल जाती हैं, और पैकेट के विकलित होने पर वृत्त अंदर की ओर सर्पिल बनाता है। छोटे $\lambda$ के लिए ऊर्जाएँ प्रथम-कोटि क्षोभ सिद्धांत $\lambda\langle n|X^4|n\rangle = \lambda\,\tfrac34(2n^2 + 2n + 1)$ से मेल खाती हैं।'
meanings:
- 'ऊपरी उपविकर्ण पर $\sqrt1, \sqrt2, \dots$: $a|n\rangle = \sqrt n\,|n-1\rangle$'
- $(a + a^\dagger)/\sqrt2$ और $i(a^\dagger - a)/\sqrt2$, दोनों हर्मिटी
- 'दोहराया गया $k$ ⇒ योग: मैट्रिक्स गुणनफल; अंतिम अवयव को छोड़कर $a^\dagger a + \tfrac12$ के बराबर'
- '$i\,\delta_{mn}$, पर कोने में $i(1 - N)$: परिमित मैट्रिक्स के लिए $[X, P] = i$ संभव नहीं (उसका ट्रेस 0 है)'
- $n + \tfrac12$; $\lambda X^4$ के साथ $\approx \lambda\,\tfrac34(2n^2 + 2n + 1)$ से खिसके हुए
- समय-विकास संकारक $e^{-iHt}$ सभी समयों के लिए एक साथ
- 'दोहराए गए $k, l$ ⇒ योग: हाइज़ेनबर्ग चित्र, संकारक चलता है'
- '$e^{-|\alpha|^2/2}\alpha^n/\sqrt{n!}$: विस्थापित मूल अवस्था'
- '$c(t) = Uc$ के साथ श्रोडिंगर चित्र: हाइज़ेनबर्ग चित्र जैसी ही संख्याएँ'
labels:
  alpha: संबद्ध अवस्था का आयाम $\alpha$
  lam: अनावर्तिता $\lambda$ ($\lambda X^4$ जोड़ता है)
  periods: सिम्युलेटेड समय
  n_states: आधार का आकार $N$
