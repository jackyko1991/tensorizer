source_hash: 15137dcd8bb9
title: Cinétique de polymérisation et distributions des masses molaires
summary: Pourquoi les polymères obtenus par polymérisation par étapes (polyesters, nylons) sont-ils si polydisperses, alors que la polymérisation vivante donne des chaînes presque uniformes ? Un bilan de population sur les longueurs de chaîne, un seul tenseur $(S, L)$ pour les deux mécanismes, reproduit la relation de Carothers $X_n = 1/(1-p)$ et la distribution la plus probable de Flory $w(x) = x(1-p)^2p^{x-1}$ avec une dispersité $Đ \to 2$, vérifiées par un Monte-Carlo cinétique de 100 000 monomères, ainsi que la distribution de Poisson des chaînes vivantes avec $Đ \approx 1 + 1/X_n$.
notes: 'Polymérisation par étapes : chaque molécule porte des extrémités réactives (ici un A et un B, comme un hydroxyacide) et N''IMPORTE QUELLES deux chaînes peuvent se lier, monomère avec monomère, dimère avec 50-mère. L''hypothèse de réactivité égale de Flory (la vitesse ne dépend pas de la longueur de chaîne) transforme le bilan de population en équation de coagulation de Smoluchowski à noyau constant, dont la solution exacte est la distribution la plus probable : une fraction $p$ des extrémités a réagi, donc une chaîne de longueur $x$ est une suite de $x - 1$ liaisons formées terminée par une extrémité non réagie, avec une probabilité $(1-p)p^{x-1}$. Ses moyennes sont celles de Carothers, $X_n = 1/(1-p)$ et $X_w = (1+p)/(1-p)$, donc $Đ = 1 + p \to 2$. La leçon pratique est rude : une conversion de 98 % ne donne que $X_n = 50$, et les longues chaînes exigent $p > 0.99$ et un équilibre 1:1 parfait des groupes réactifs. La polymérisation en chaîne vivante (anionique, ou méthodes radicalaires
  contrôlées comme l''ATRP ou le RAFT, qui s''en approchent) est l''opposé : toutes les chaînes démarrent ensemble et croissent d''un monomère à la fois sans terminaison, donc après $\nu$ additions par chaîne les longueurs suivent une loi de Poisson et $Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ tend vers 1. La forme tensorielle garde les deux mécanismes dans un seul tenseur $(S, L)$ avancé par RK4. La convolution de la polymérisation par étapes $\sum_y P_y P_{x-y}$ est un einsum avec une matrice de Toeplitz construite à partir de $P$ (une FFT ferait de même en $O(L\log L)$). Comme les deux lignes utilisent des horloges avec $X_n = 1 + s$, chaque image compare les deux mécanismes au même $X_n$, sur un axe $x / X_n$ où la forme de Flory est fixe et le pic de Poisson se rétrécit. Le Monte-Carlo cinétique lie des paires de chaînes aléatoires ; il concorde avec le bilan de population au bruit d''échantillonnage près, qui augmente vers la fin car il ne reste que $N_0(1-p)$ chaînes (2000 à $p =
  0.98$). Simplifications : pas de formation de cycles, pas de réactions secondaires, une stœchiométrie A–B parfaitement équilibrée, des longueurs de chaîne tronquées à $L$ (la queue omise est inférieure à $10^{-6}$), et pour le cas vivant un amorçage instantané sans terminaison ni transfert. La polymérisation radicalaire classique, avec terminaison, se situe entre les deux ($Đ \approx 1.5$–2).'
meanings:
- 'chaînes de longueur $x$ ($x = 1 … L$) pour le mécanisme $s$ : 0 = par étapes (par monomère), 1 = vivante (par amorceur)'
- 'une seule horloge pour les deux lignes : $\tau = kN_0t$ pour la polymérisation par étapes, $\nu = \int k_p[M]\,dt$ pour la croissance vivante'
- matrice de Toeplitz construite à partir des populations ; nulle là où $x - y < 1$
- '$y$ répété ⇒ sommé : toutes les façons de lier un $y$-mère à un $(x-y)$-mère'
- une chaîne réagit par l'une ou l'autre de ses deux extrémités avec n'importe laquelle des $N$ chaînes
- les chaînes vivantes ne font qu'ajouter du monomère, une unité à la fois, et ne se terminent jamais
- '$x$ sommé : les moments $k = 0, 1, 2$ donnent $X_n = \mu_1/\mu_0$, $X_w = \mu_2/\mu_1$'
- 'solution exacte pour la polymérisation par étapes : chaînes par monomère initial à la conversion $p = \tau/(1+\tau)$'
- solution exacte pour la croissance vivante, avec lgamma pour la factorielle
- 'lier deux chaînes aléatoires une liaison à la fois : une vérification stochastique indépendante'
labels:
  p_max: Conversion finale $p$ (polymérisation par étapes)
  n_monomers: Monomères du Monte-Carlo $N_0$
