source_hash: bed4e5f065d8
title: P vs NP и фазовый переход в 3-SAT
summary: 'Верно ли, что всякую задачу, решения которой легко проверить, также легко решить? Это вопрос P vs NP, открытый с 1971 года. Случайная 3-SAT делает асимметрию наглядной: проверка предложенного набора значений — это одна операция gather и две редукции, а полный перебор вычисляет все $2^n$ наборов сразу в виде одного упакованного битового тензора, размер которого удваивается с каждой переменной. Изменяя отношение числа дизъюнктов к числу переменных $\alpha$, мы видим фазовый переход выполнимости около $\alpha_c \approx 4.27$ и пик стоимости поиска внутри окна перехода.'
notes: 'Вопрос P vs NP состоит в том, можно ли всякую задачу распознавания, у положительных ответов которой есть сертификаты, проверяемые за полиномиальное время (класс NP), также решить за полиномиальное время (класс P). Кук (1971) и Левин (1973) доказали, что задача выполнимости NP-полна: полиномиальный алгоритм для 3-SAT дал бы такой алгоритм для любой задачи из NP. Существует ли он, неизвестно. Большинство исследователей ожидают, что P $\ne$ NP, но доказательства нет, а известные барьеры (релятивизация, естественные доказательства, алгебризация) исключают целые семейства стратегий доказательства. Этот вопрос — одна из семи задач тысячелетия Института Клэя, и он открыт. Эта программа ничего о нём не доказывает: полный перебор — просто очевидный алгоритм, а лучшие известные алгоритмы для 3-SAT по-прежнему экспоненциальны (около $1.307^n$ для PPSZ). Она показывает асимметрию. Верификатор — это одна операция gather плюс OR и AND, работа $O(M)$. Поиск строит полную таблицу истинности, по
  одному биту на набор, по 32 в одном целом числе, так что тензор содержит $2^n$ бит и время удваивается с каждой переменной (внизу справа; при малых $n$ преобладают фиксированные накладные расходы). Случайная 3-SAT с $M = \alpha n$ дизъюнктами имеет резкий порог: Фридгут (1999) доказал, что переход становится резким при $n \to \infty$, статистическая физика (Мезар, Паризи и Дзеккина 2002) предсказывает $\alpha_c \approx 4.267$, а Дин, Слай и Сунь (2015) доказали предсказанный порог для $k$-SAT при больших $k$. Для $k = 3$ значение 4.267 по-прежнему остаётся гипотезой; доказано лишь, что случайные формулы с высокой вероятностью выполнимы ниже $\alpha = 3.52$ и невыполнимы выше 4.49. При малых $n$ точка пересечения уровня 50% лежит выше 4.27 и смещается вниз с ростом $n$ (конечноразмерный скейлинг). Тесты проверяют, что верификатор согласуется с полным перебором на каждом наборе, что один дизъюнкт исключает ровно $1/8$ всех наборов, что среднее число решений равно первому моменту $2^n (7/8)^M$,
  что $P_{\mathrm{sat}}$ монотонна и резко падает около порога и что окно сужается с ростом $n$. Панель стоимости поиска считает узлы поиска в глубину с возвратом, который фиксирует по очереди $x_0, x_1, \ldots$ и возвращается, как только полностью означенный дизъюнкт оказывается ложным. Ниже порога он быстро находит решение, намного выше порога короткие противоречия рано отсекают дерево, а самые трудные формулы находятся в окне перехода (для этого простого поиска при $n = 16$ около $\alpha \approx 5$; решатели с распространением единичных дизъюнктов достигают пика около 4.3). Попробуйте больше переменных, чтобы увидеть, как кривые становятся круче, или больше формул для более гладких кривых.'
meanings:
- $B$ формул с $M$ дизъюнктами из 3 различных переменных, каждая берётся с отрицанием с вероятностью $\frac12$
- все литералы всех формул одной операцией gather
- 'верификатор: $3M$ обращений, полиномиально по $n$'
- таблица истинности $x_j$ по всем $2^n$ наборам, 32 набора в одном целом числе
- один дизъюнкт, вычисленный на всех $2^n$ наборах побитовым OR (XOR со всеми единицами даёт отрицание)
- AND по дизъюнктам по одному; уровень $d$ собирает только дизъюнкты, переменные которых входят в первые $d$, что и даёт дерево поиска с возвратом
- вложенные формулы (префиксы одного списка дизъюнктов) дают все $\alpha = M/n$ за один проход и делают $P_{\mathrm{sat}}$ невозрастающей
