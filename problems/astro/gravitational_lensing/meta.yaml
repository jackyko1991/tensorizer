title: Gravitational lensing by a black hole
category: astro
level: advanced
order: 3
summary: >
  Light rays past a black hole are null geodesics, traced for a whole fan of impact parameters at once: far rays bend by
  $4GM/(c^2 b)$, rays inside $\sqrt{27}\,GM/c^2$ fall in. On the sky, the lens equation maps every pixel back to the source
  plane in one tensor operation, so a star passing behind the hole turns into two arcs, an Einstein ring and a magnification spike.
animated: true
vector_form: '\frac{d^2u}{d\varphi^2} + u = \frac{3GM}{c^2}\,u^2,\qquad \alpha \approx \frac{4GM}{c^2 b},\qquad \boldsymbol\beta = \boldsymbol\theta - \theta_E^2\,\frac{\boldsymbol\theta}{\lvert\boldsymbol\theta\rvert^2},\qquad \theta_E = \sqrt{\frac{4GM}{c^2}\frac{D_{ls}}{D_l D_s}}'
index_form: 'u_b'''' = -u_b + 3M\,u_b^2,\qquad \beta_{pi} = \theta_{pi} - \frac{\theta_{pi}}{\theta_{pj}\theta_{pj}},\qquad I_{fp} = S\big(\beta_{p} - c_{f}\big)'
translation:
  - {symbol: 'u_b', code: 'y[:, 0]', shape: '(B,)', meaning: '$1/r$ along ray $b$, starting at 0 (infinity) with $du/d\varphi = 1/b$'}
  - {symbol: 'u_b''''', code: 'binet_rhs(y, M)', shape: '(B, 2)', meaning: 'null-geodesic orbit equation, RK4 in $\varphi$ for all rays'}
  - {symbol: '\alpha_b', code: 'deflection_angles(rays)', shape: '(B,)', meaning: 'exit angle minus $\pi$; NaN if captured'}
  - {symbol: '\theta_{pi}', code: 'sky_grid(n, 2.5)', shape: '(n, n, 2)', meaning: 'sky angle of pixel $p$, in units of $\theta_E$'}
  - {symbol: '\theta_{pj}\theta_{pj}', code: "einsum('...j,...j->...', theta, theta)", shape: '(n, n)', meaning: 'repeated $j$ ⇒ summed'}
  - {symbol: '\beta_{pi}', code: 'lens_map(theta)', shape: '(n, n, 2)', meaning: 'where each pixel looks in the source plane'}
  - {symbol: 'I_{fp}', code: 'source_brightness(beta[None], c[:, None, None])', shape: '(F, n, n)', meaning: 'lensed image for every frame $f$ by broadcasting'}
  - {symbol: '\mu_f', code: 'lensed.sum((-2, -1)) / plain.sum((-2, -1))', shape: '(F,)', meaning: 'magnification: total flux ratio'}
notes: >
  Ray panel: units $G = c = M = 1$; the dotted circle is the photon sphere ($r = 3M$), and rays with $b < \sqrt{27}\,M \approx 5.2\,M$ end in the hole,
  which is why a black hole casts a shadow 2.6 times its horizon radius. Rays just outside can loop around before escaping. Sky panel: thin-lens
  point mass in units of the Einstein radius (about a milliarcsecond for a stellar black hole in our Galaxy, which is why microlensing is
  seen as a brightening rather than resolved images). Lensing conserves surface brightness, so the image is simply the source evaluated at
  $\beta(\theta)$; the extra light comes from the images being stretched. The finite source size caps the magnification near perfect alignment,
  where a point source would give $\mu \to \infty$.
params:
  b_min: {default: 4.0, min: 2, max: 10, step: 0.5, label: 'Smallest impact parameter $b$', unit: GM/c²}
  b_max: {default: 14.0, min: 6, max: 30, step: 1, label: 'Largest impact parameter $b$', unit: GM/c²}
  n_rays: {default: 9, min: 3, max: 20, step: 1, type: int, label: Rays}
  impact: {default: 0.15, min: 0.0, max: 1.5, step: 0.05, label: 'Source offset from the lens $u$', unit: '$\theta_E$'}
  source_radius: {default: 0.12, min: 0.02, max: 0.5, step: 0.02, label: Source radius, unit: '$\theta_E$'}
  n_pixels: {default: 200, min: 80, max: 400, step: 20, type: int, label: Sky pixels per side}
