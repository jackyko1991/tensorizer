source_hash: 09cd4df32aa9
title: 'NeRF: न्यूरल रेडियंस फ़ील्ड का आयतन रेंडरिंग'
summary: 'एक छोटा MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$ स्पेस के हर बिंदु को एक घनत्व और एक रंग देता है। एक पिक्सेल उसकी किरण के अनुदिश एकत्रित प्रकाश है: स्तरीकृत नमूने $t_s$, फिर क्षेत्रकलन (quadrature) $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$ पारगम्यता $T_s = e^{-\sum_{s''<s}\sigma_{s''}\delta_{s''}}$ के साथ, किरणों × नमूनों पर बैच में। केवल एक कृत्रिम दृश्य की तस्वीरों पर प्रशिक्षित होकर यह एक अलग रखा दृश्य और एक गहराई मानचित्र रेंडर करता है, और स्थितीय एन्कोडिंग के बिना एक दूसरा नेटवर्क सादे MLP का स्पेक्ट्रल पूर्वाग्रह दिखाता है।'
notes: 'प्रशिक्षण डेटा एक लाल गोले, एक चेकर्ड घन और एक नारंगी गेंद की $V$ तस्वीरें हैं, जो Lambertian छायांकन वाले एक विश्लेषणात्मक रे-कास्टर से बनाई गई हैं; नेटवर्क ज्यामिति कभी नहीं देखता, केवल पिक्सेल रंग और हर पिक्सेल की किरण। हर Adam कदम सभी प्रशिक्षण पिक्सेलों से किरणों का एक यादृच्छिक बैच लेता है, उन्हें क्षेत्रकलन से रेंडर करता है और सही रंगों से तुलना करता है। क्योंकि $w_{rs}$, $T_{rs}$ और रंग $\sigma$ और $\mathbf c$ के सुचारु फलन हैं, autograd फ़ोटो त्रुटि को नेटवर्क में वापस ले जाता है: जहाँ कई दृश्यों की किरणें किसी सतह पर सहमत होती हैं वहाँ घनत्व बढ़ते हैं। गहराई मानचित्र $\sum_s w_s t_s$ और चिह्नित किरण के अनुदिश भार प्रोफ़ाइल यह दिखाते हैं: भार सही सतह पर एक शिखर में सिमट जाते हैं। स्थितीय एन्कोडिंग मुख्य युक्ति है। $(x, y, z)$ पर एक सादा MLP पहले निम्न आवृत्तियाँ सीखता है और तीखे किनारों व बारीक बनावट को बहुत धीरे फ़िट करता है (स्पेक्ट्रल पूर्वाग्रह); इसके बजाय उसे $\sin(2^k\pi x), \cos(2^k\pi x)$ देने से उसे उच्च-आवृत्ति निर्माण खंड मिलते हैं। उतने ही कदमों में एन्कोडेड
  नेटवर्क (नीला) की आकृति-रेखाएँ अधिक स्पष्ट होती हैं, गहराई त्रुटि लगभग आधी और प्रशिक्षण दृश्यों पर PSNR अधिक होता है, जबकि सादा वाला (लाल) धुंधला रहता है। अलग रखे दृश्य पर लाभ कम है: कम और छोटे दृश्यों से बारीक विवरण केवल कमज़ोर रूप से बँधता है, और दोनों नेटवर्क अभी अभिसरण से बहुत दूर हैं (असली NeRF घंटों प्रशिक्षित होते हैं)। Mildenhall et al. (ECCV 2020) की तुलना में सरलीकरण: दृश्य-दिशा इनपुट नहीं (दृश्य Lambertian है, इसलिए उसके रंग देखने के कोण पर निर्भर नहीं करते), श्रेणीबद्ध नमूनाकरण वाली coarse + fine जोड़ी के बजाय एक नेटवर्क, एक नन्हा MLP (8 × 256 के बजाय 3 × 64), $40\times 40$ छवियाँ, और लाखों के बजाय कुछ सौ कदम। $L = 2$ या $L = 10$, कम नमूने $S$ (मोटे क्षेत्रकलन से पट्टियाँ), अधिक कदम (चेकरबोर्ड केवल एन्कोडिंग के साथ दिखता है), या कम दृश्य (ज्यामिति अस्पष्ट हो जाती है और अलग रखा दृश्य बिगड़ता है जबकि प्रशिक्षण दृश्य अब भी फ़िट होते हैं) आज़माएँ।'
meanings:
- हर कैमरे के $P$ पिक्सेलों में से हर एक से गुज़रती किरण का मूल और इकाई दिशा
- '$[t_n, t_f]$ के $S$ बराबर खंडों में से हर एक में एक यादृच्छिक गहराई: हर कदम एक नया समुच्चय, ताकि नेटवर्क पूरी किरण देखे'
- 'नमूना बिंदु: किरणों $r$ और नमूनों $s$ पर ब्रॉडकास्टिंग'
- $2^k\pi x_i$ का $\sin$ और $\cos$, $k = 0 \dots L-1$; किसी पर योग नहीं, एक बाह्य गुणनफल
- एक MLP परत सभी नमूनों पर एक साथ लागू, $g$ पर योग; परतों के बीच ReLU
- घनत्व $\ge 0$ और रंग $(0, 1)$ में
- किरण के अनुदिश हर अंतराल की लंबाई
- 'पारगम्यता: $s'' < s$ पर प्रकाशीय मोटाई $\tau = \sigma\delta$ का एक अनन्य संचयी योग'
- प्रायिकता कि पिक्सेल तक पहुँचा प्रकाश अंतराल $s$ में उत्सर्जित हुआ; $\sum_s w_{rs} \le 1$
- पिक्सेल रंग, $s$ पर योग; बची हुई पारगम्यता सफ़ेद पृष्ठभूमि दिखाती है
- 'अपेक्षित गहराई: वही भार मुफ़्त में गहराई मानचित्र देते हैं'
labels:
  n_freq: एन्कोडिंग आवृत्तियाँ $L$
  width: छिपी परत चौड़ाई $H$
  n_samples: प्रति किरण नमूने $S$
  steps: Adam कदम (प्रति नेटवर्क)
  batch: प्रति कदम किरणें
  lr: Adam सीखने की दर
  n_views: प्रशिक्षण दृश्य $V$
  resolution: छवि आकार (पिक्सेल)
