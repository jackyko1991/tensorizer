<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Projectile launched at angle theta with velocity v, pulled down by gravity g and slowed by air drag F opposite to v; the drag path falls short of the dashed drag-free parabola">
