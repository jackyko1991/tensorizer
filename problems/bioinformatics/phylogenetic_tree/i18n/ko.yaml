source_hash: 72ebeb1bb100
title: DNA 거리로 계통수 만들기
summary: DNA 서열이 숨겨진 무작위 나무를 따라 진화하며, 각 가지는 주크스–캔터 전이 행렬과의 행렬 곱 하나다. 잎만 가지고 원-핫 글자에 대한 einsum 하나로 차이를 세고, 숨겨진 다중 치환을 보정한 뒤, UPGMA와 이웃 결합법으로 나무를 재구성한다. 사용하는 자리가 늘어날수록 두 나무가 어떻게 변하는지 로빈슨–포울즈 거리로 참 나무와 비교하며 보자.
notes: 참 나무는 무작위 합착(coalescent) 나무다. 완화된 분자 시계에서는 각 가지가 고유한 속도도 가지므로 잎마다 뿌리로부터의 거리가 다르다. 서로 다른 자리의 원시 비율 $p$는 $3/4$에서 포화되어 긴 경로를 과소평가한다(대각선 아래의 회색 점). 주크스–캔터 $d$는 편향이 없지만(대각선 위의 파란 점) 잡음이 더 크며, 그 잡음은 $1/\sqrt L$로 줄어든다. UPGMA는 모든 잎이 뿌리에서 같은 거리에 있다고 가정하므로, 완화된 시계에서는 아무리 많은 자리를 보아도 이웃이 아닌 짧은 두 가지를 결합할 수 있다(빨간 가지). 이웃 결합법은 거리가 나무를 따라 더해지기만 하면 되고, 참 무근 모양으로 수렴한다. 거리만으로는 뿌리를 정할 수 없으므로 가장 긴 경로의 중점을 뿌리로 하여 그린다. 엄격한 시계로 바꾸면 UPGMA도 일치(consistent) 추정이 된다.
meanings:
- 길이 $t$(자리당 기대 치환 수)인 가지를 지난 뒤 글자 $\alpha$가 $\beta$로 바뀌었을 확률
- '반복된 $\alpha$ ⇒ 합: 모든 자리에서 자식의 글자 확률. 역 CDF로 샘플링'
- 관측된 잎 서열, A, C, G, T에 대한 원-핫
- '반복된 $l, \alpha$ ⇒ 합: $i$와 $j$가 다른 자리의 비율'
- '보정 거리 $-\tfrac34\ln(1 - \tfrac43 p)$: 한 자리에서 반복된 치환에 가려진 치환까지 센다'
- 이웃 결합법은 가장 작은 $d$가 아니라 가장 작은 $Q$를 갖는 쌍을 합친다. $r_i = d_{ik}\mathbf 1_k$
- 참 경로 길이. 가지 $v$가 잎 $i$와 뿌리 사이에 있으면 $M_{iv} = 1$, $b_v$는 그 길이
- 두 나무 중 하나에만 있는 잎 이분할(안쪽 가지마다 하나)의 수
labels:
  n_taxa: 분류군 수 $n$
  n_sites: 자리 수 $L$
  tree_depth: 뿌리–잎 깊이(자리당 치환 수)
  clock: 분자 시계
