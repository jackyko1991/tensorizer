source_hash: 7be98e686941
title: 靜水壓與浮力
summary: 水槽中的壓力隨深度線性增加，$p = p_0 + \rho_w g h$。密度不同的方塊同時投入（一個批次張量）：輕的上下浮動後浮起，有 $\rho_b/\rho_w$ 的比例沒入水中；重的沉到底部。
notes: 每個方塊是邊長 $s$ 的立方體；浮力 $\rho_w g s^2 d_b$ 等於其排開水的重量（阿基米德原理），它是壓力 $p_0 + \rho_w g h$ 作用在底面比頂面更大的淨效果。浮體停在浮力與重力平衡處，$d_b/s = \rho_b/\rho_w$——冰（$\rho \approx 917$）浮著時有 92 % 在水下。阻力取與浸水體積成正比的簡單線性阻尼；真實阻力較接近二次方，且忽略了真實的波浪與附加質量。下沉的方塊停在底部。
meanings:
- 水中的格點，分量 $i \in \{x, z\}$
- 重力向量 $(0, -g)$
- 重複的 $i$ ⇒ 求和：深度 $h = -z$ 處的 $g\,h$
- 方塊 $b$ 底面的高度與速度
- 方塊 $b$ 的密度——即批次指標
- 浸沒深度，介於 0（在空氣中）與 $s$（完全浸沒）之間
- 浮力減重力減阻力，每單位質量
labels:
  n_blocks: 方塊數
  rho_min: 最小密度 $\rho_\text{min}$
  rho_max: 最大密度 $\rho_\text{max}$
  size: 方塊大小 $s$
  drag: 阻尼 $\gamma$
  t_max: 模擬時間
