title: स्व-समरूप विस्फोट प्रोफ़ाइलों की खोज
summary: 'आज विलक्षणताओं को ऐसे खोजा जाता है: $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$ लिखें, आंशिक अवकल समीकरण को अज्ञात घातांक $\lambda$ वाली प्रोफ़ाइल $U$ के समीकरण में बदलें, और उम्मीदवार प्रोफ़ाइलों के एक बैच को, हर परीक्षण मान $\lambda$ के लिए एक, गॉस–न्यूटन से एक ही टेंसर के रूप में प्रशिक्षित करें। अश्यान बर्गर्स समीकरण के लिए अवशेष की कीपें केवल सटीक मानों $\lambda = 1/(2i+2)$ पर ढहती हैं, और सीखी गई प्रोफ़ाइलें शास्त्रीय $y = -U - U^{2i+3}$ से मेल खाती हैं। यही खोज अस्थानीय कोर्दोबा–कोर्दोबा–फ़ोंतेलोस समीकरण पर उसका स्थिर घातांक $\lambda \approx 1.18$ पाती है।'
notes: 'यह fluids/navier_stokes_blowup का साथी है, जो 1983 की तस्वीर दिखाता है: टेलर–ग्रीन भंवर को समय में आगे चलाएँ और भ्रमिलता को तब तक बढ़ते देखें जब तक ग्रिड साथ न छोड़ दे। आधुनिक तरीका समय-विकास को छोड़ देता है: वह मानता है कि विलक्षणता स्व-समरूप है और प्रोफ़ाइल को सीधे खोजता है। $u = \tau^\lambda U(y)$ को $u_t + uu_x = 0$ में रखने पर $-\lambda U + ((1+\lambda)y + U)U'' = 0$ मिलता है। $y(U)$ के लिए रैखिक साधारण अवकल समीकरण की तरह हल करने पर यह $y = -U - C\,U^{1+1/\lambda}$ देता है, जो तभी चिकना है जब $1 + 1/\lambda$ एक विषम पूर्णांक हो। अतः $\lambda = 1/(2i+2)$, और सटीक प्रोफ़ाइलें $y = -U - U^{2i+3}$ हैं ($U''(0) = -1$ और $U(-2) = 1$ से मानकीकृत)। ये शास्त्रीय परिणाम हैं (Eggers & Fontelos, Singularities, 2015)। $\lambda = 1/2$ स्थिर, सामान्य विस्फोट है; $1/4, 1/6, \dots$ के लिए बारीकी से समायोजित आरंभिक आँकड़े चाहिए। यहाँ 61 उम्मीदवार प्रोफ़ाइलें स्थिर $\lambda$ पर एक साथ प्रशिक्षित होती हैं। $\lambda$ के सापेक्ष सबसे अच्छा अवशेष (कीप) $\lambda = 1/2$ पर पूर्णांकन-त्रुटि ($\sim10^{-15}$)
  तक और $1/4$ पर $\sim10^{-11}$ तक गिरता है। बीच में यह कहीं अधिक है ($\lambda = 0.37$ पर $\sim10^{7}$ गुना), क्योंकि वहाँ केवल अचिकने पद $|y|^{1+1/\lambda}$ वाली प्रोफ़ाइलें होती हैं। $U''''''(0) = 0$ लगाने से $1/2$ की कीप हट जाती है, और खोज तब $1/4$ पाती है। साथ में $U^{(5)}(0) = 0$ लगाने से $1/6$ चुना जाना चाहिए। पर इस विभेदन पर $1/6$ के पास की कीप इतनी सपाट है कि उसे तय नहीं किया जा सकता: प्रतिस्पर्धी प्रोफ़ाइलें केवल $y^{7}$ कोटि पर भिन्न होती हैं, और उथला न्यूनतम $\lambda \approx 0.19$ पर पड़ता है। अवशेष स्थिर और अस्थिर में भेद नहीं कर सकता: यह समय-विकास का गुण है, और यहाँ अस्थिर प्रोफ़ाइलें केवल अतिरिक्त बाधाओं से मिलती हैं। प्रोफ़ाइल एक स्पेक्ट्रमी प्रसार है जिसमें शोध में प्रयुक्त आगमनात्मक पूर्वाग्रह हैं, एक संकुचित निर्देशांक और आउटपुट का आकार-निर्धारण; शोध-पत्र इन्हीं पूर्वाग्रहों वाले भौतिकी-सूचित तंत्रिका नेटवर्क (PINN) का उपयोग करते हैं। गॉस–न्यूटन Wang et al. (2025) का अनुकूलक है। $\lambda$ पर प्रवणता-कदम हर कीप की नोक पर अटक जाते हैं, इसलिए बैच में स्वर्ण-अनुपात खोज $\lambda$
  तय करती है। CCF समीकरण $\theta_t - (H\theta)\theta_x = 0$ (सतही अर्ध-भूविक्षेपी समीकरण का 1D मॉडल; $H$ हिल्बर्ट रूपांतर है) भ्रमिलता रूप $\omega = \theta_x = \Omega(y)/\tau$ में हल किया जाता है। $\Omega$ को $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$ में प्रसारित किया जाता है, जिनके हिल्बर्ट रूपांतर सटीक हैं। डिफ़ॉल्ट रन $\lambda \approx 1.18$ पाता है (अवशेष $\sim10^{-4}$); बड़े आधार के साथ लंबे रन $1.1808$ पर स्थिर होते हैं (अवशेष $2\times10^{-6}$)। यह Eggers & Fontelos (Nonlinearity, 2020) के मूल-अवस्था घातांक $\approx 1.18$ से मेल खाता है। Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) ने PINN से पहली अस्थिर CCF प्रोफ़ाइल $\lambda_1 \approx 0.6057$ पाई। Wang et al. (2025, arXiv 2509.14185) ने दूसरी $\lambda_2 \approx 0.4713$ पाई, और $10^{-13}$ के आसपास के अवशेष तक पहुँचे, लगभग दोहरी परिशुद्धता। उन्होंने सरंध्र-माध्यम और बूसिनेस्क समीकरणों के लिए भी नए अस्थिर परिवार पाए, जो संख्यात्मक उम्मीदवार हैं। अस्थिर प्रोफ़ाइलों में तीखी प्रवणताएँ हैं जिन्हें यह एक मिनट की CPU खोज
  विभेदित नहीं करती; यह केवल स्थिर कीप दिखाती है। स्थिति: बर्गर्स प्रोफ़ाइलें सटीक प्रमेय हैं। CCF विस्फोट Córdoba, Córdoba & Fontelos (Annals, 2005) ने सिद्ध किया। तंत्रिका खोज से मिली प्रोफ़ाइलें तब तक संख्यात्मक उम्मीदवार हैं जब तक कंप्यूटर-सहायित प्रमाण उन्हें प्रमेय न बना दे, जैसा Chen & Hou (2022) ने सीमा वाले अक्षसममित यूलर के हौ–लुओ परिदृश्य के लिए किया। 3D असंपीड्य नेवियर–स्टोक्स सहस्राब्दी समस्या खुली है, और यहाँ कुछ भी उससे सीधे संबंधित नहीं है। $\lambda$ का मोटा ग्रिड या कम गॉस–न्यूटन कदम आज़माएँ, और कीपों को धुँधला होते देखें।'
meanings:
- 'बैच: हर उम्मीदवार प्रोफ़ाइल के लिए एक परीक्षण घातांक, सब एक साथ प्रशिक्षित'
- 'संकुचित निर्देशांक $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$: $y = 0$ पर $r = 1$, $|y| \to \infty$ पर $r \to 0$'
- विषमता, $U'(0) = -1$ और दूर $U \sim y^{\lambda/(1+\lambda)}$ अंतर्निहित हैं; $P$, $r$ में चेबीशेव श्रेणी है
- संस्थापन बिंदुओं पर प्रोफ़ाइल-समीकरण का अवशेष, साथ में $U(2) = -1$ और चिकनाई की बाधाएँ
- $R$, $c$ में द्विघाती है, इसलिए जैकोबियन सटीक है (परीक्षणों में autograd से जाँचा गया)
- बैच के हर सदस्य के लिए लेवेनबर्ग–मार्क्वार्ट (अवमंदित गॉस–न्यूटन) कदम, एक ही सामूहिक हल में
- $U = -y + c_3y^3 + c_5y^5 + \dots$ के टेलर गुणांक; इन्हें शून्य करने से $\lambda = 1/2$ और $1/4$ की कीपें हट जाती हैं
- 'CCF आधार का सटीक हिल्बर्ट रूपांतर: $(1-iy)^{-s}$ ऊपरी अर्धतल में विश्लेषिक है'
- हर कीप का तल तय करता है; हर परीक्षण $\lambda$ पर प्रोफ़ाइल फिर से प्रशिक्षित होती है
