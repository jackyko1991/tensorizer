source_hash: c27c115f2935
title: 사영의 접힘으로서의 특이점
summary: 이것은 확립된 물리학이 아닌 추측적 가설이다. 휘어진 시공간은 평탄한 고차원 공간 속 곡면의 그림자이며, 특이점은 그 그림자가 접히는 곳이다. 먼저 알려진 기하를 확인한다. Flamm 포물면과, Schwarzschild 시공간 전체를 6차원 평탄 공간에 매장하는 Fronsdal 의 1959년 매장은 모두 계량을 정확히 되돌려 주며(autograd), Kretschmann 스칼라 $12r_s^2/r^6$ 도 같은 자동 미분에서 나온다. 사영된 시트는 보편적인 밀도 지수로 접힌다. 접힘(fold)은 $-1/2$, 첨점(cusp)은 $-2/3$ 이다. 접힘 모양의 내부는 외부를 정확히 Schwarzschild 로 남겨 두므로, 그것은 지평선 뒤에 숨는다. 여기 있는 어떤 것도 직접 관측할 수 없다.
notes: '사영 가설의 4단계(시리즈 설명 참조)로, 확립된 물리학이 아닌 저자의 추측적 가설이다. 1단계(cosmology/projection_postulate)는 공준 P4 를 제시한다. 휘어진 시공간은 평탄한 고차원 매장을 사영한 모양이며, 특이점은 사영이 접히는 곳(그 Jacobian 의 계수가 떨어지는 곳)이다. 3단계(cosmology/projection_dimension_budget)는 차원을 세고, 5단계(cosmology/projection_bell_test)는 측정 공준을 검증하며, 6단계(cosmology/projection_telescope_tests)는 망원경이 무엇을 검증할 수 있는지 살펴본다. 평탄한 차원의 수 $D$ 는 열려 있다. 여기서는 매개변수이며, 어떤 결과에도 들어가지 않는다. 먼저 알려진 기하부터. (a) Flamm(1916): Schwarzschild 의 적도 단면 $t = $ const, $\theta = \pi/2$ 를 평탄한 $\mathbb R^3$ 에 그리면 포물면 $z = 2\sqrt{r_s(r-r_s)}$ 가 되며, 그 유도 계량 $dr^2/(1-r_s/r) + r^2d\phi^2$ 는 $10^{-16}$ 까지 일치한다. (b) Fronsdal(Phys. Rev. 116, 778, 1959)은 지평선 내부까지 포함한 Schwarzschild 시공간 전체를 평탄한 $\mathbb R^{1,5}$ 에 매장한다. 유도 계량 $\eta_{AB}\partial_iz^A\partial_jz^B$ 는, Jacobian 을 autograd 로 구했을 때, 외부와 내부에서, 그리고 지평선을 가로지르는 Kruskal 좌표에서 Schwarzschild 와 $10^{-13}$ 까지 일치한다. 휘어진 4차원 기하는 실제로 평탄한 공간 속 곡면으로 볼 수 있다. 이것이 P4 의 근거이다. P4 에 중요한 사실이 두 가지 있다. 매장은 지평선에서 완전 계수를 갖는다. $(t, r)$ 좌표에서 보이는 계수 저하는 Kruskal 좌표에서
  사라진다. $r\to0$ 에서도 접히지 않는다. 무한대로 달아나며, $z^2\approx-2r_s^{3/2} r^{-1/2}$ 이다. 같은 자동 미분(Christoffel 기호, Riemann 텐서, einsum 축약)으로 계산한 곡률은 $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ 를 $10^{-15}$ 의 정밀도로 준다. 정적 조석 고윳값은 $+r_s/r^3$(지름 방향 늘림)과 $-r_s/2r^3$(옆 방향 압축)이며, 모두 $r = 0$ 에서 발산한다. P4 의 주장을 구체화하면: 평탄한 $\mathbb R^D$ 속 매끄러운 시트를 사영을 통해 보면, 그 그림자의 밀도는 접힘 초점선(caustic)에서 발산한다. 파국 이론(Thom, Arnold)에 따르면 그 지수는 보편적이다. 사상 $x = s^n$ 은 $\rho\propto|x|^{1/n-1}$ 를 주며, 측정값은 $-0.500$(접힘), $-0.667$(첨점), $-0.750$($n = 4$)이다. 구면 $S^k$ 를 $\mathbb R^3$ 에 사영하면 가장자리 밀도는 $u^{(k-3-1)/2}$ 이고, 측정값은 $-0.51$, $0.00$, $+0.45$(각각 $k = 3, 4, 5$)이며, 어떤 $D$ 에서도 같다. 따라서 밀도 스파이크에는 스크린과 정확히 같은 차원 수의 시트가 필요하며, 더 두꺼운 시트는 매끄러운 그림자를 준다. 애니메이션은 물결 모양의 시트를 기울여 가다가 $a\tan\alpha > 1$ 에서 접히게 한다. 일반상대론과의 비교: 질량 $M = r_s/2$ 에 3차원 구면 그림자의 밀도 $\rho\propto(1-r^2/R^2)^{-1/2}$ 를 부여한다. 이는 약한 장의 캐리커처일 뿐, 아인슈타인 방정식의 해가 아니다. $R$ 바깥에서 장은 정확히 $r_s/r^3$ 이며(Birkhoff 정리, 껍질 정리), 중심은 유한하게 남는다. 발산은 접힘 껍질로 옮겨 가고, 밀도와 조석장에서는 $(R-r)^{-1/2}$ 로, 곡률 대리량 $8\sum E^2$ 에서는
  $(R-r)^{-1}$ 로 약해진다. 일반상대론의 $r^{-3}$ 과 $r^{-6}$ 대신에 그렇다. 시트 자체는 유한한 곡률 $1/R^2$ 를 유지한다. 솔직한 판정. P4 는 엄밀하게 검증된 외부 Schwarzschild 기하를 그대로 두고 내부만 바꿀 수 있지만, 바로 그 점이 P4 를 검증 불가능하게 만든다. $R < r_s$ 이면 접힘은 지평선 뒤에 있고, 그곳에서 오는 어떤 신호도 우리에게 닿지 않는다. 보편적 지수는 기술(記述)로서만 새로울 뿐이다. 지평선 바깥의 어떤 것도 그것에 의존하지 않기 때문이다. 지평선 바깥에 있는 접힘($R > r_s$)은 다른 광자 고리와 메아리를 갖는, 지평선 없는 조밀 천체가 될 것이다. 그것이 바로 6단계가 블랙홀 그림자로 검증하는 것이다. 배경: fluids/blowup_profile_search 는 특이 프로파일과 그 지수가 실제로 어떻게 연구되는지(자기 유사 가정, 지수 탐색)를 보여 준다. 위키백과: 슈바르츠실트 계량, 파국 이론.'
meanings:
- 자동 미분으로 구한 매장의 Jacobian, 표본점 $b$ 마다 하나
- '유도 계량: 반복되는 매장 지표 $A, C$ 를 평탄 계량 $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ 과 함께 합한다'
- 추가 매장 좌표, $q$ 에 대한 64 노드 Gauss–Legendre 합($\ell = \ln s$ 에서 수행)이며 $r$ 에 대해 미분 가능하다; $-\infty$ 로 가며, 그 거동은 $r^{-1/2}$ 와 같다
- '최소 특이값: 사상의 접힘은 이 값이 0 에 도달하고 Jacobian 의 계수가 떨어지는 곳이다'
- 계량의 autograd 도함수로부터 얻은 Christoffel 기호; $d$ 에 대해 합한다
- 두 번째 순방향 모드 도함수와 두 번의 einsum 곱으로부터 얻은 Riemann 텐서($e$ 에 대해 합함)
- Kretschmann 스칼라, 네 지표 모두에 대해 합한다; 지평선 안팎에서 $12r_s^2/r^6$ 와 같다
- $x = s^n$ 아래에서 균일한 시트의 그림자 밀도(접힘 $n = 2$, 첨점 $n = 3$), 로그 구간 히스토그램
- 반지름 $R$ 인 3차원 구면의 그림자처럼 퍼진 질량의 뉴턴 조석 텐서(약한 장의 캐리커처)
labels:
  fold_radius: 접힘 껍질의 반지름 $R$
  sheet_amplitude: 물결 모양 시트의 진폭 $a$
  D: 구면 시트를 담는 평탄 차원 $D$ (열려 있음)
  samples: 각 시트에서 추출한 표본점 수
