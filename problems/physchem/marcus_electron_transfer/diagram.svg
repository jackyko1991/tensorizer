<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Marcus picture: reactant and product free-energy parabolas along a solvent coordinate x, the product lower by the driving force Delta G, crossing at the transition point; lambda is the reactant free energy at the product geometry">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axis -->
    <line x1="10" y1="146" x2="230" y2="146" stroke="#374151" stroke-width="2"/>
    <text x="218" y="140" font-style="italic">x</text>
    <!-- level of the reactant minimum, and of the product minimum -->
    <line x1="72" y1="92" x2="214" y2="92" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="152" y1="124" x2="214" y2="124" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- reactant parabola, vertex (72, 92) -->
    <path d="M-10,11.3 Q72,172.7 154,11.3" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- product parabola, vertex (152, 124) -->
    <path d="M82,65.2 Q152,182.8 222,65.2" fill="none" stroke="#374151" stroke-width="2.5"/>
    <!-- reorganisation energy: reactant surface at the product minimum -->
    <line x1="152" y1="90" x2="152" y2="20" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="158" y="52" font-style="italic" fill="#b91c1c">λ</text>
    <!-- driving force -->
    <line x1="206" y1="94" x2="206" y2="122" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="176" y="113" font-style="italic" fill="#b91c1c">ΔG°</text>
    <!-- crossing point -->
    <circle cx="95.3" cy="85.5" r="5" fill="#f59e0b"/>
    <!-- minima -->
    <circle cx="72" cy="92" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="152" cy="124" r="4" fill="#374151"/>
    <text x="16" y="34" font-size="13" fill="#1e40af">R</text>
    <text x="214" y="60" font-size="13">P</text>
  </g>
</svg>
