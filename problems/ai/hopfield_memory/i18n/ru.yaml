source_hash: a8220b6707c1
title: 'Сети Хопфилда: классическая и современная ассоциативная память'
summary: 'Память, которая восстанавливает картинку по искажённой или наполовину скрытой версии. Классическая сеть Хопфилда (Hopfield) хранит бинарные образы в хеббовских весах $W_{ij}$ и скатывается вниз по энергии; она вмещает не более примерно $0.138\,N$ случайных образов и гораздо меньше коррелированных. Современная непрерывная сеть Хопфилда Рамзауэра (Ramsauer) и др. (2020) хранит сами образы и обновляет $\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$ — это механизм внимания трансформеров: она извлекает мультяшные лица за один шаг там, где классическая сеть их путает.'
notes: 'Лица не изображают никого реального: каждое рисуется кодом из нескольких случайных чисел (форма головы, глаза, очки, брови, нос, изгиб рта, волосы, уши), поэтому никакие персонажи, защищённые авторским правом, или фотографии не используются. Каждый запрос скрывает нижние 40 % лица и инвертирует 5 % остальных пикселей. Для случайных образов предел классической сети $\alpha_c \approx 0.138$ вычислили Амит, Гутфройнд и Сомполинский (Amit, Gutfreund, Sompolinsky, 1985) методами теории спиновых стёкол, а доля ошибочных битов за один шаг подчиняется гауссову закону перекрёстных помех $\Phi(-1/\sqrt\alpha)$ (оба факта проверяются в тестах). Лица сильно коррелированы (у них общий контур и много пустой бумаги), поэтому классическая сеть путает их уже при нагрузке намного ниже $0.138$: она скатывается в смеси лиц. Энергия современной сети содержит член log-sum-exp; Рамзауэр и др. доказывают, что она уменьшается при каждом обновлении, что обычно хватает одного обновления и что ёмкость растёт
  экспоненциально с $N$ для хорошо разделённых образов. Её обновление — это в точности внимание трансформера, где сохранённые образы служат ключами и значениями. Сделайте $\beta$ маленьким, чтобы увидеть метастабильные средние нескольких лиц вместо одного. Идея следует записи в блоге, сопровождающей статью, с процедурными лицами вместо её мультяшных изображений.'
meanings:
- 'образ $\mu$: процедурно нарисованное мультяшное лицо, чернила $+1$, бумага $-1$, $N = 32 \times 32$ пикселей'
- правило Хебба, повторяющийся $\mu$ ⇒ суммирование; одна сеть $f$ на каждое число сохранённых лиц, диагональ обнулена
- 'повторяющийся $j$ ⇒ суммирование: поле на нейроне $i$ для каждой сети и каждого запроса; $s_i$ берёт его знак'
- энергия; никогда не растёт при обновлении нейронов по одному
- 'повторяющийся $n$ ⇒ суммирование: сходство запроса с каждым сохранённым образом, заострённое множителем $\beta$'
- 'повторяющийся $\mu$ ⇒ суммирование: новое состояние — взвешенное среднее образов, один образ при большом $\beta$'
- 'качество восстановления: 1, когда лицо восстановлено точно'
labels:
  n_faces: Максимум сохранённых лиц $P$
  beta: Обратная температура $\beta$
  mask: Скрытая доля каждого лица
  noise: Инвертированные пиксели
  sweeps: Проходы классического обновления
  n_random: Нейроны $N$ для кривой ёмкости
