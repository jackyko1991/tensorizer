title: मार्कोवियन म्पेम्बा प्रभाव
summary: क्या गर्म पानी गुनगुने पानी से तेज़ जम सकता है? मेट्रोपोलिस दरों के साथ जालक विभव में कूदते कण के लिए उत्तर हाँ है। मास्टर समीकरण $\dot p = W p$ को एक बार विकर्णित किया जाता है, हर प्रारंभिक तापमान को एक einsum में सबसे धीमी विधा (mode) पर प्रक्षेपित किया जाता है, और जिस गर्म प्रारंभ का धीमी-विधा आयाम $a_2$ शून्य हो जाता है वह अधिक ठंडे प्रारंभ से चरघातांकी रूप से तेज़ विश्रांत होता है।
notes: 'इकाइयाँ: $k_B = 1$ और प्रयास दर 1 है। ऊष्मा-कुंड $T_b$ पर है और तंत्र तापमान $T_0$ पर साम्य में शुरू होता है। यदि कूदें विस्तृत संतुलन (detailed balance) का पालन करती हैं, $W_{ij}\pi_j = W_{ji}\pi_i$, तो $W$ एक सममित आव्यूह के समरूप है, इसलिए इसके सभी आइगेनमान वास्तविक और $\le 0$ हैं, और इसकी स्थिर अवस्था बोल्ट्ज़मान वितरण $\pi$ है। थोड़े समय बाद केवल सबसे धीमी विधा बचती है, $p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$, इसलिए छोटे $\lvert a_2\rvert$ वाला प्रारंभ साम्य के अधिक निकट पहुँचता है, उसका तापमान चाहे जो हो। चूँकि $a_2(T_0)$ का एकदिष्ट होना आवश्यक नहीं, एक अधिक गर्म प्रारंभ गुनगुने प्रारंभ से आगे निकल सकता है (मार्कोवियन म्पेम्बा प्रभाव)। विशेष $T^*$ पर जहाँ $a_2 = 0$, धीमी विधा पूरी तरह अनुपस्थित होती है, और विश्रांति तेज़ दर $\lambda_3$ पर चलती है (प्रबल प्रभाव)। इस विभव में आकार द्रोणियों (basins) के बीच प्रतिस्पर्धा से आता है। निम्न $T_0$ पर गहरा संकरा कूप अधिकांश प्रायिकता रखता है। मध्यवर्ती $T_0$ पर चौड़ा उथला कूप एन्ट्रॉपी के कारण जीतता है। उच्च $T_0$ पर ऊँचा पठार
  भरता है, इसलिए बाईं द्रोणी का हिस्सा फिर बढ़ता है और $T^*$ पर अपने साम्य मान को पार करता है। सिद्धांत Lu & Raz (PNAS, 2017) का है। Kumar & Bechhoefer (Nature, 2020) ने प्रकाशीय रूप से आकारित द्वि-कूप विभव में एक कोलॉइडी मनके के साथ प्रबल संस्करण सहित यह प्रभाव देखा। Kumar, Chétrite & Bechhoefer (PNAS, 2022) ने फिर व्युत्क्रम प्रभाव (असामान्य तापन) देखा। हाल ही में फँसे-आयन प्रयोगों में क्वांटम अनुरूप बताए गए हैं। यह जालक उन तंत्रों का एक खिलौना संस्करण है। $T_b$ बढ़ाकर देखें: लगभग $1.4$ से ऊपर प्रतिच्छेद गायब हो जाता है।'
meanings:
- 'स्थल $i$ की सीढ़ीनुमा ऊर्जा: पठार, गहरा संकरा कूप, अवरोध, चौड़ा उथला कूप'
- शृंखला पर निकटतम पड़ोसियों के लिए 1, अन्यथा 0
- कूद $j \to i$ की दर; विकर्ण हर स्तंभ का योग शून्य बनाता है
- हर प्रारंभिक तापमान $T_{0,b}$ पर बोल्ट्ज़मान अवस्था, प्रारंभों का एक बैच
- 'दोहराया गया $j$ ⇒ योग: सभी प्रारंभों के लिए एक साथ मास्टर समीकरण'
- सममित $\Pi^{-1/2} W \Pi^{1/2}$ का eigh; $\lambda_1 = 0$ साम्य है, $\lambda_2$ सबसे धीमा क्षय
- 'दोहराया गया $i$ ⇒ योग: हर प्रारंभ का हर विधा के साथ अतिव्यापन'
- 'दोहराया गया $k$ ⇒ योग: हर समय पर सटीक हल'
- साम्य तक कुलबैक–लाइबलर दूरी, $\sum_i p_i \ln(p_i/\pi_i)$
