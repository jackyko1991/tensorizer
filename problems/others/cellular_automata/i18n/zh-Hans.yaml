source_hash: ebc73dcb492e
title: 全部 256 种初等元胞自动机，以及 Lenia
summary: 一排元胞，每个新元胞取决于它自身和左右两个邻居：这三个比特构成一个编码 $k \in \{0, \dots, 7\}$，而规则编号的二进制写法就是查找表。全部 256 条规则以一个 $(256, W)$ 张量同时运行，每一步只需一次 gather：规则 90 画出谢尔宾斯基三角形，规则 30 看似随机，规则 110 构建出相互作用的结构，规则 184 则让车流移动。它的连续版本 Lenia 用平滑的环形核取代查找表，并长出一个会滑行的生物。
notes: Wolfram 把初等规则分为四类：(1) 全部死亡或填满，(2) 静止或周期性图样，(3) 混沌，例如规则 30，它的中心列曾长期被用作随机数生成器，(4) 复杂、长寿且相互作用的结构，例如规则 110，Matthew Cook 证明（2004 年发表）它是图灵完备的。马赛克图依照一个粗略的自动测试为每条规则着色，测试在 151 个元胞的环上运行 600 步：均匀、在平移意义下周期，或找不到周期。最后一组混合了第 3 类与第 4 类，两者的区分并没有精确的定义。规则 90 把邻居相加后取模 2，因此从单个元胞出发得到的是模 2 的帕斯卡三角形；规则 184 是最简单的交通模型：前方格子空着时车就向右移动，所以车辆总数守恒。与生命游戏（二维、$3\times3$ 计数、只有一条规则）不同，这里所有规则同时运行。Lenia（Bert Chan，2019）让空间、时间和状态都变为连续；它的经典滑翔者 Orbium 从随 Lenia 发布的元胞表（MIT 许可）出发，在移动时保持质量不变，是一个没有任何守恒律强制、却呈现类孤子行为的图样例子。
meanings:
- 规则编号 $r$ 的第 $k$ 位：邻域编码为 $k$ 时的新状态
- 环上元胞 $i$ 周围的左、中、右元胞
- 重复的 $j$ ⇒ 求和：3 比特邻域编码 $4\,\text{left} + 2\,\text{centre} + \text{right}$
- 一次查表就同时推进所有规则
- 规则的左右镜像与 0/1 互补；256 条规则构成 88 个对称类
- 半径 $R = 13$ 的平滑环，归一化使总和为 1
- 周期网格上的卷积，写成傅里叶变换的乘积
- 在 $U \approx \mu$ 处增长，其他地方衰减，步长为 $1/T$
labels:
  rule: 你的规则 $r$（第一个面板）
  start: 你的规则的初始状态
  width: 线宽 $W$
  generations: 代数
  density: 随机初始密度
  lenia_size: Lenia 世界 $S$
  lenia_steps: Lenia 步数
