source_hash: e3a181f70abb
title: फेज़रों के योग के रूप में विवर्तन ग्रेटिंग
summary: $N$ झिरियों का दूर-क्षेत्र (far-field) पैटर्न $N$ सम्मिश्र फेज़रों का योग है, हर झिरी के लिए एक, और हर एक अतिरिक्त पथ $d\sin\theta$ से विलंबित। सम्मिश्र टेंसरों के साथ पूरा पैटर्न एक einsum है। जैसे-जैसे $N$ 2 से 20 तक बढ़ता है, मुख्य उच्चिष्ठ अपनी जगह रहते हैं पर अधिक तीखे हो जाते हैं, और उनके बीच $N-2$ धुँधले द्वितीयक उच्चिष्ठ प्रकट होते हैं।
notes: 'दायाँ पैनल एक कोण पर $N$ फेज़रों को सिरे-से-सिरा जोड़कर दिखाता है। मुख्य उच्चिष्ठ ($d\sin\theta = m\lambda$) पर सभी एक ही दिशा में होते हैं और जुड़कर लंबाई $N$ बनाते हैं। उच्चिष्ठ से हटने पर शृंखला मुड़ने लगती है और $N\phi = 2\pi$ पर एक बहुभुज में बंद हो जाती है: यह पहला शून्य है, जिसका कोण $1/N$ की तरह घटता है। तीव्रताएँ केंद्रीय शिखर पर 1 के सापेक्ष प्रसामान्यीकृत हैं; बिंदुदार रेखाएँ $d\sin\theta = m\lambda$ दर्शाती हैं। केवल एकल-झिरी आवरण (envelope) ही झिरी की चौड़ाई $a$ पर निर्भर करता है।'
meanings:
- झिरी क्रमांक; झिरी $n$ झिरी 0 से $nd$ दूरी पर है
- प्रेक्षण की दिशा, बारीक ग्रिड पर नमूनित
- कोण $t$ पर दिखने वाला झिरी $n$ का कला गुणक
- 'दोहराया गया $n$ ⇒ योग: सभी झिरियों की तरंगों को जोड़ें'
- एकल-झिरी विवर्तन आवरण $\operatorname{sinc}^2(a\sin\theta/\lambda)$
- तीव्रता = सम्मिश्र आयाम के परिमाण का वर्ग
- वही योग हाथ से (गुणोत्तर श्रेणी), $\phi = kd\sin\theta$
labels:
  wavelength: तरंगदैर्ध्य $\lambda$
  d: झिरी अंतराल $d$
  a: झिरी की चौड़ाई $a$
  n_max: झिरियों की अधिकतम संख्या $N$
