source_hash: 695e730c122f
title: Монти Холл с $N$ дверями
summary: 'Автомобиль спрятан за одной из $N$ дверей. Вы выбираете одну; ведущий, который знает, где автомобиль, открывает $N-2$ двери с козами и предлагает вам последнюю закрытую дверь. Миллионы игр для каждого $N$ от 3 до 1000 идут одновременно в одном тензоре $(B, G)$: смена выбора выигрывает с вероятностью $(N-1)/N$ (знаменитые $2/3$ для трёх дверей), сохранение — с вероятностью $1/N$, и каждая текущая доля побед остаётся внутри своей биномиальной полосы погрешности.'
notes: 'Смена выбора проигрывает, только если ваш первый выбор уже был автомобилем, что случается с вероятностью $1/N$; во всех остальных случаях выбор ведущего вынужден, поэтому дверь, которую он оставляет закрытой, несёт информацию обо всех открытых им дверях. При 1000 дверях ответ очевиден, и это тот же аргумент, что и для трёх. Задача прославилась благодаря журнальной колонке Мэрилин вос Савант (Marilyn vos Savant) 1990 года, когда многие читатели, в том числе математики, настаивали, что ответ — $1/2$. Эта интуиция верна для другой игры: выберите несведущего ведущего, который открывает двери наугад и иногда показывает автомобиль. Если отбросить такие игры (выживает лишь доля $2/N$), то сохранение и смена выигрывают ровно в $1/2$ случаев, потому что случайное открытие ничего не говорит о вашей двери. Терминал также проверяет, что ни один первый выбор не особенный, а медленная поигровая эталонная реализация в тестах согласуется с тензорной версией.'
meanings:
- сравниваемые бок о бок числа дверей, от 3 до 1000
- дверь с автомобилем и первый выбор в игре $g$ строки $b$, равномерно по $N_b$ дверям; broadcasting даёт каждой строке своё $N_b$
- 'дверь, которую ведущий оставляет закрытой: обязательно автомобиль, если вы выбрали козу, случайная дверь, если вы выбрали автомобиль'
- '$N-2$ двери, которые открывает ведущий: все двери, кроме $p$ и $k$'
- победы при сохранении и при смене; в каждой игре истинно ровно одно из них
- 'накопленные победы, делённые на накопленные корректные игры: доля побед после каждой игры'
- полоса $\pm 2\sigma$ биномиальной доли, внутри которой текущая доля остаётся примерно 95 % времени
labels:
  n_games: Игр на каждое число дверей $G$
  max_doors: Наибольшее число дверей $N$
  host: Ведущий
