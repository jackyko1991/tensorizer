source_hash: ab1a099d3cd6
title: 'Модель Курамото: спонтанная синхронизация'
summary: 'Светлячки, вспыхивающие в унисон, метрономы на общей доске, клетки водителя ритма: осцилляторы с разными собственными частотами $\omega_i$, каждый из которых притягивается к остальным, внезапно синхронизируются, когда связь $K$ превышает порог. Комплексное среднее поле $r e^{i\psi} = \frac1N \sum_j e^{i\theta_j}$ превращает сумму «все со всеми» в работу $O(N)$, целый пакет значений связи считается одновременно, а параметр порядка $r$ скачком растёт при $K_c = 2/(\pi g(0))$, следуя точной кривой Отта–Антонсена $r = \sqrt{1 - K_c/K}$ для лоренцевых частот.'
notes: 'Курамото (1975) решил модель самосогласованно и нашёл $K_c = 2/(\pi g(0))$ для симметричной унимодальной плотности частот $g$; эту историю рассказывает Строгац (2000). Отт и Антонсен (2008) доказали, что для лоренцевой $g(\omega) = (\gamma/\pi)/(\omega^2 + \gamma^2)$ динамика при бесконечном $N$ сводится к одному уравнению $\dot r = -\gamma r + \tfrac K2 r(1 - r^2)$, устойчивое состояние которого $r = \sqrt{1 - 2\gamma/K}$: моделирование совпадает с ним примерно до $0.01$ при $N = 1200$. Ниже $K_c$ величина $r$ — лишь шум конечного размера порядка $1/\sqrt N$. У гауссовых частот порог меньше: $K_c = 2\sigma\sqrt{2\pi}/\pi \approx 1.6\,\sigma$ (зелёный). Медленное нарастание (красный) следует кривой по мере роста $K$; круг показывает осцилляторы в системе отсчёта среднего поля, окрашенные по $\omega_i$: осцилляторы с малыми $|\omega_i|$ синхронизируются первыми, быстрые продолжают дрейфовать. Третья панель — небольшое дополнение: одинаковые осцилляторы на кольце с нелокальной связью
  и фазовым сдвигом $\alpha = \pi/2 - 0.18$ разделяются на синхронную и некогерентную области — химерное состояние, открытое Курамото и Баттогтохом (2002) и названное так Абрамсом и Строгацем (2004). Средняя фаза дрейфует точно со средней частотой, потому что $\sin(\theta_j - \theta_i)$ антисимметричен.'
meanings:
- собственные частоты, по одной случайной выборке в каждом из $N$ равновероятных интервалов лоренцевой (или гауссовой) плотности
- 'по одному значению связи на каждый элемент пакета: все популяции эволюционируют параллельно'
- комплексное среднее поле, повторяющийся $j$ ⇒ усреднение; $r = 0$ — некогерентность, $r = 1$ — полная синхронность
- 'каждый осциллятор чувствует только среднее поле: $O(N)$ вместо $O(N^2)$'
- медленная попарная сумма, оставленная как эталон; тесты проверяют, что она равна форме через среднее поле
- точный параметр порядка при $N \to \infty$ для лоренцевых частот, $\sqrt{1 - 2\gamma/K}$ выше $K_c = 2\gamma$
- нелокальная связь $(1 + A\cos x)/2\pi$ на кольце, для химерного состояния
labels:
  n_oscillators: Осцилляторов $N$
  width: Разброс частот $\gamma$ (Лоренц) или $\sigma$ (Гаусс)
  k_max: Наибольшая связь $K$
  n_couplings: Значений связи в пакете
  t_relax: Время релаксации на одно значение связи
  ramp_time: Длительность медленного нарастания $K$
  distribution: Плотность частот при нарастании
  seed: Начальное значение генератора случайных чисел
