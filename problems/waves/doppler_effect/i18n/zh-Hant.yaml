source_hash: 698c7a054398
title: 都卜勒效應與馬赫錐
summary: 以速率 $v_s$ 運動的波源每個週期發出一個圓形波前。每個波前是張量的一列（發射時刻、發射點），因此其在任意時刻的半徑只是一次減法。波前在前方聚集、在後方散開；超過音速時則堆疊成馬赫錐。
notes: 聽到的頻率就是每秒抵達的波前數：在波源前方，波前發射時彼此較近，因此 $f' = f\,c/(c - v_s)$；在後方則 $f' = f\,c/(c + v_s)$。聽者位於運動直線上，此時這些公式是精確的。當 $v_s > c$（馬赫數 $M = v_s/c > 1$）時，波源跑得比自己的聲音還快：所有波前都與兩條直線相切，即半角為 $\mu$ 的馬赫錐，$\sin\mu = 1/M$。前方的聽者在錐面通過之前什麼也聽不到，而波前以相反的順序抵達。音速 $c = 340$ m/s；只有波源在動，空氣靜止。
meanings:
- 每個週期 $1/f$ 一個波前
- 波源發出波前 $e$ 時的位置
- 每個波前在時刻 $t$ 的半徑（尚未發出則為零）
- 波源前方與後方的聽者
- 重複的 $i$ ⇒ 求和：每個發射點到每位聽者的距離平方
- 波前 $e$ 抵達聽者 $o$ 的時刻
labels:
  mach: 馬赫數 $v_s/c$
  f: 波源頻率 $f$（繪出的波前）
  t_max: 模擬時間
