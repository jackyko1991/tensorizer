source_hash: 63ac7ba591c6
title: 'Ein Teilchen, viele Male gesehen: eine einzige Weltlinie zerschneiden'
summary: 'Eine spekulative Hypothese, keine gesicherte Physik: Jedes Elektron ist dasselbe Objekt, eine einzige Weltlinie, die im Zickzack vorwärts und rückwärts in der Zeit läuft (Wheelers Ein-Elektronen-Universum von 1940). Ein Zeitschnitt schneidet sie viele Male: Vorwärtsdurchgänge sehen aus wie Elektronen, Rückwärtsdurchgänge wie Positronen. Dieser Schritt zerschneidet Stapel zufälliger Weltlinien. Alle Elektronen kommen exakt identisch heraus, und an den Umkehrpunkten werden Paare erzeugt und vernichtet. Aber eine geschlossene Weltlinie durchquert jeden Schnitt ebenso oft rückwärts wie vorwärts, und eine offene fügt höchstens ein Nettoteilchen hinzu, während das Universum etwa $10^{80}$ Baryonen und fast keine Antimaterie enthält. In ihrer einfachsten Form ist die Idee ausgeschlossen.'
notes: 'Status: spekulativ; in der einfachsten Form ausgeschlossen. Schritt 2 der Projektionshypothese (die eigene spekulative Idee des Autors, siehe die Beschreibung der Serie; keine gesicherte Physik), zu Postulat P3: Alle Teilchen sind Projektionen eines einzigen Objekts. Schritt 1 (cosmology/projection_postulate) formulierte die Postulate; Schritt 3 (cosmology/projection_dimension_budget) zählt die Dimensionen, die sie brauchen. Zuerst die bekannte Physik. In einem Telefongespräch 1940 schlug John Wheeler Richard Feynman vor, dass alle Elektronen identisch sind, weil sie ein einziges Elektron sind, dessen Weltlinie vorwärts und rückwärts in der Zeit verläuft; ein rückwärts laufendes Stück ist ein Positron. Feynman erzählte die Geschichte in seinem Nobelvortrag von 1965, zusammen mit seinem eigenen Einwand: Es gibt nicht so viele Positronen wie Elektronen. Wheeler meinte, sie könnten in Protonen versteckt sein. Die Idee, dass ein Positron ein rückwärts in der Zeit laufendes Elektron ist,
  überlebte als Feynman–Stueckelberg-Bild der Antiteilchen (Feynman, Phys. Rev. 76, 749, 1949), das Ein-Elektronen-Universum jedoch nicht: In der Quantenfeldtheorie sind alle Elektronen identisch, weil sie Anregungen eines einzigen Feldes sind. Hier lebt die Weltlinie in einem Raum mit $D$ Dimensionen ($D$ ist ein Parameter, nie auf 4 festgelegt); für die Schnitte zählt nur ihre Zeitkoordinate, wie P2 sagt. Die Vorhersage der Hypothese: Ein Zeitschnitt (P2) schneidet die Weltlinie in $N_+$ Vorwärts- und $N_-$ Rückwärtsdurchgängen. Was berechnet wird: Stapel glatter (zufällige Fourier-Reihen, $K$ Harmonische, Amplituden $\propto k^{-\beta}$) und rauer (Brownscher) Weltlinien, geschlossen oder offen, geschnitten von $L$ Schnitten. Die Durchgänge werden durch ein Scatter in ein Differenzenarray gezählt und gegen eine Brute-Force-Tabelle geprüft. Für eine geschlossene Schleife gilt $N_+ = N_-$ auf jedem Schnitt; für eine offene ist $Q = N_+ - N_-$ gleich $[t_{end}\geq u] - [t_{start}\geq u]$,
  also $|Q|\leq 1$ und $N\equiv Q$ (mod 2). Das Kippen des Schnitts (ein bewegter Beobachter) ändert $Q$ nicht. Die Gesamtzahl ist gleich $2(\#\text{minima} - \#\text{maxima})$ unterhalb des Schnitts, also entstehen Paare an Minima von $t(s)$ und vergehen an Maxima. Die mittlere Zahl für zufällige glatte Schleifen folgt der Rice-Formel. Was sie umsonst richtig bekommt: Jeder Durchgang liest Masse und Ladung derselben Weltlinie ab, also sind alle Elektronen exakt gleich, und Positronen haben exakt die entgegengesetzte Ladung und dieselbe Masse (PDG 2024: $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$). Der Test an Daten (data/*.csv, zitierte Zahlen): AMS-02 maß den Positronenanteil der kosmischen Strahlung $e^+/(e^+ + e^-)$ von 0.5 GeV bis 1 TeV (Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0, 74 Bins über die CRDB-Datenbank): 0.13 bei 0.6 GeV, ein Minimum von 0.053 nahe 8 GeV und 0.15 bis 0.16 oberhalb von 200 GeV. Die Asymmetrie
  $1 - 2f$ liegt also zwischen 0.67 und 0.89, gegenüber $0$ für eine geschlossene Schleife. Auf kosmischen Skalen ergibt die Baryonendichte von Planck 2018 $\Omega_b h^2 = 0.0224$ den Wert $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (siehe cosmology/baryon_asymmetry). Mit 411 Photonen pro cm$^3$ in einer Kugel mit Radius 46.5 Milliarden Lichtjahre sind das $N_B\approx 9\times10^{79}$ Baryonen, und Antimaterie fehlt (BESS-Polar: Antihelium/Helium unter $6.9\times10^{-8}$; Cohen, De Rújula und Glashow 1998: keine Antimateriedomänen im sichtbaren Universum). Eine einzige Weltlinie ergibt höchstens $|Q|/N = 1/N$, also $7\times10^{-90}$ bei $N\approx 1.5\times10^{89}$, gegenüber $\eta = 6\times10^{-10}$; die Nettoladung ist um einen Faktor von etwa $10^{80}$ zu klein. Ein Durchmustern der offenen Parameter (glatt oder Brownsch, geschlossen oder offen, 2 bis 32 Harmonische, drei Rauheiten, etwa $3\times10^5$ Schnitte mit $N\geq 2$) findet keine Konfiguration, die die AMS-02-Asymmetrie erreicht,
  und die Schranke zeigt, dass keine es kann: Bei $N\geq 2$ Durchgängen ist die größtmögliche Asymmetrie $1/3$ (bei $N = 3$). Urteil: in der einfachsten Form ausgeschlossen. Erweiterungen, jede eine zusätzliche Annahme und als solche gekennzeichnet: (A) Eine offene Weltlinie fügt ein Nettoteilchen hinzu, nicht mehr. (B) Eine verzerrte Projektion, bei der Beobachter Antiteilchen mit Effizienz $r$ sehen, erfordert nach AMS-02 $r = f/(1-f)$ zwischen 0.056 und 0.195, energieabhängig, aber nach Antihelium $r < 7\times10^{-8}$. Die verborgene Antimaterie wöge dann so viel wie die sichtbaren Baryonen, etwa 0.19 der Dunklen Materie. Das ist Wheelers „in Protonen versteckt“ in moderner Form; es braucht einen Mechanismus, und keiner wird angegeben. (C) Wäre die Zeit ein Kreis, trüge eine Schleife, die sich $w$-mal windet, auf jedem Schnitt die Nettoladung $Q = w$ (geprüft), aber $w\approx 10^{80}$ müsste von Hand eingesetzt werden, und kompakte Zeit bedeutet geschlossene zeitartige Kurven. Keine davon
  ist eine Vorhersage. Was die Idee wiederbeleben würde, ist ein Mechanismus, der die Schnittzählung eines einzigen Objekts asymmetrisch macht, und das ist die offene Frage, die dieser Schritt der Serie hinterlässt. Ausweg: Die einfache Version ist ausgeschlossen, eine global ausgeglichene Weltlinie, deren Antimaterie jenseits unseres Horizonts oder in einem CPT-gespiegelten Antiuniversum liegt, dagegen nicht. Schritt 7 (cosmology/projection_antimatter_universe) listet die Kriterien auf, die ein solches Antimaterie-Universum erfüllen muss, und prüft jedes an Daten.'
meanings:
- 'wiederholte $k$ (Harmonische) und $c$ (cos, sin) ⇒ summiert: $B$ zufällige Weltlinien in $D$ Dimensionen; Koordinate 0 ist die Zeit'
- Vorwärts- (Teilchen) und Rückwärtsdurchgänge (Antiteilchen) jedes Schnitts; die Summe über die Segmente $s$ ist ein Scatter in ein Differenzenarray plus eine kumulative Summe
- Nettoladung auf dem Schnitt; gleich der Durchgangszahl der beiden Enden, $0$ für eine geschlossene Schleife
- 'dieselbe Zählung allein aus den Umkehrpunkten: Minima erzeugen Paare, Maxima vernichten sie'
- Rice-Formel mit den Spektralmomenten $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$
- Ladungsasymmetrie der $e^\pm$ der kosmischen Strahlung aus dem AMS-02-Positronenanteil $f_E$ bei der Energie $E$
- Netto-Baryonenzahl, die eine einzige Weltlinie tragen müsste ($\eta$ aus Planck 2018)
labels:
  worldlines: Weltlinien im Stapel $B$
  samples: Stützstellen entlang jeder Weltlinie $S$
  modes: Harmonische pro Koordinate $K$ (wie oft sie im Zickzack laufen kann)
  roughness: 'Rauheit $\beta$: Harmonische $k$ hat Amplitude $\propto k^{-\beta}$'
  dims: Dimensionen $D$ des Raums, in dem die Weltlinie lebt (offen)
  slices: Zeitschnitte $L$
