source_hash: 2cd1c41299f8
title: 'Допплеровское УЗИ: измерение кровотока'
summary: 'Ультразвуковой датчик слушает эхо от эритроцитов. Каждая движущаяся клетка сдвигает частоту эха на $f_D = 2 f_0 v \cos\theta / c$, и сотни клеток в пульсирующей артерии моделируются сразу как один пакет фазоров. Оконное (кратковременное) преобразование Фурье превращает их суммарное эхо в допплеровскую спектрограмму, какую показывает сканер: распределение скоростей крови на протяжении сердечного цикла.'
notes: 'Множитель 2 появляется потому, что сдвиг происходит дважды: движущаяся клетка принимает уже сдвинутую волну и переизлучает её, продолжая двигаться. Значение имеет только составляющая скорости вдоль луча, поэтому при $\theta = 90°$ сдвига нет совсем; сканер запрашивает у оператора угол и вычисляет $v = f_D c / (2 f_0 \cos\theta)$, что становится очень неточным при углах больше примерно 60°. При значениях по умолчанию ($f_0 = 5$ МГц, $\theta = 60°$, пик 1 м/с) систолический сдвиг около 3,2 кГц — это слышимый диапазон, поэтому допплеровские приборы воспроизводят сигнал и как звук. В ламинарном потоке профиль параболический: клетки у стенки почти не движутся, быстрее всего — на оси. Поскольку равные площади сечения содержат одинаковое число клеток, все скорости от 0 до $v_{\max}$ встречаются одинаково часто: спектр — плоская полоса («заполненное» окно), а средняя частота ровно вдвое меньше максимальной. Возмущённый или стенотический поток, напротив, расширил бы спектр. Импульсный допплер
  измеряет эхо один раз за импульс, поэтому по теореме Найквиста может измерить лишь $|f_D| < \mathrm{PRF}/2$: уменьшите PRF (или увеличьте скорость), и систолический пик перескочит на отрицательную сторону (алиасинг, наложение частот). Реальным сканерам нужна высокая PRF для быстрых струй, но низкая PRF для глубоких сосудов, ведь каждый импульс должен вернуться до отправки следующего. Упрощения: контрольный объём охватывает весь сосуд, луч однородный, IQ-сигнал моделируется сразу в основной полосе, нет фильтра стенки и помех от тканей. Все значения приблизительные и предназначены только для обучения, не для клинического применения.'
meanings:
- 'скорость на оси за два сердечных сокращения: систолический пик, короткий обратный ток, медленный диастолический поток'
- 'случайные эритроциты: радиус в сосуде, фаза и сила эха'
- 'параболический (ламинарный) профиль, умноженный на форму волны: внешнее произведение, суммирования нет'
- допплеровский сдвиг $2 f_0 v \cos\theta / c$ каждой клетки в каждом импульсе
- 'повторяющийся $n$ ⇒ суммирование: принятое эхо, один комплексный (IQ) отсчёт на импульс с шагом $\Delta t = 1/\mathrm{PRF}$'
- 'спектрограмма: мощность на частоте $f$ во временном окне $k$'
- импульсный допплер видит $f$ только свёрнутой в $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$
labels:
  f0: Частота излучения $f_0$
  theta: Угол луч–поток $\theta$
  v_peak: Пиковая систолическая скорость
  prf: Частота повторения импульсов PRF
  heart_rate: Частота сердечных сокращений
  n_scatterers: Число моделируемых эритроцитов
