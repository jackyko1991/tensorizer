source_hash: b740fafad36e
title: Regularität der Navier–Stokes-Gleichungen und Kandidaten für Blowup
summary: Das Millennium-Problem des Clay-Instituts fragt, ob glatte inkompressible 3D-Strömungen für alle Zeiten glatt bleiben. Ein pseudospektraler Löser auf dem Torus rechnet den Taylor–Green-Wirbel für Euler ($\nu = 0$) und zwei Viskositäten als einen Stapel von FFTs und verfolgt dabei die maximale Wirbelstärke, die Enstrophie und das Beale–Kato–Majda-Integral $\int\|\omega\|_\infty dt$, das bei jedem Blowup divergieren muss. Wirbelstreckung lässt die Euler-Wirbelstärke wachsen, bis das Gitter sie nicht mehr auflösen kann; Viskosität begrenzt sie. Dies ist eine Veranschaulichung, kein Beweis.
notes: 'Das Clay-Problem (Feffermans offizielle Beschreibung) verlangt eine von vier Aussagen: globale glatte Lösungen auf $\mathbb R^3$ (A) oder auf dem Torus $\mathbb T^3$ (B), oder Zusammenbruch auf $\mathbb R^3$ (C) oder auf $\mathbb T^3$ (D), jeweils für $\nu > 0$. Das Repository openai/NavierStokesAndEuler auf GitHub gibt an, maschinell geprüfte Beweise in Lean 4 samt begleitenden Arbeiten zu enthalten: für den Zusammenbruch der angetriebenen Navier–Stokes-Gleichungen auf $\mathbb R^3$ und $\mathbb T^3$ (Alternativen C und D) und für Blowup in endlicher Zeit der nicht angetriebenen Euler-Gleichung aus glatten Daten mit kompaktem Träger. Dies sind neue Behauptungen, deren Prüfung durch die mathematische Gemeinschaft und das Clay-Institut noch aussteht; diese Seite betrachtet das Preisproblem nicht als gelöst. Für Euler wurde eine Singularität glatter Lösungen in endlicher Zeit durch die axialsymmetrische Rechnung mit Rand von Luo–Hou (2014) und später durch computergestützte Beweise
  (Chen–Hou) gestützt, und Elgindi (2021) bewies Blowup für $C^{1,\alpha}$-Daten. Die Simulation hier veranschaulicht nur die Größen, die diese Arbeiten kontrollieren. Der Taylor–Green-Wirbel $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$ ist der klassische Test (Brachet et al. 1983): Wirbelstreckung steilt ihn zu dünnen Schichten auf, die Enstrophie steigt und das Energiespektrum wird flacher. Der Schwanz des Spektrums fällt wie $e^{-2\delta k}$ ab; ein Blowup würde erfordern, dass der Analytizitätsstreifen $\delta(t)$ in endlicher Zeit null erreicht, während Brachet fand, dass er nur exponentiell schrumpft. Sobald $\delta\,k_\max < 1$ gilt, ist der Euler-Lauf unteraufgelöst (schattiert): Das abgeschnittene System erhält die Energie zwar weiterhin exakt, doch das weitere Wachstum von $\|\omega\|_\infty$ ist ein Gitterartefakt und kein Hinweis auf eine Singularität. Mit Viskosität gehorcht die Energie $dE/dt = -2\nu\Omega$ (bis auf Rundungsfehler geprüft), und die Enstrophie
  erreicht ein Maximum und fällt dann ab. Der 2D-Taylor–Green-Wirbel ist eine exakte Lösung $e^{-2\nu t}$, und der 3D-Wirbel hat eine bekannte Anfangsbeschleunigung aus $p_0 = \frac1{16}(\cos 2x + \cos 2y)(\cos 2z + 2)$: beides sind Tests. Probieren Sie ein größeres $N$, um die aufgelöste Zeit nach hinten zu verschieben.'
meanings:
- Fourier-Koeffizienten der Geschwindigkeit jedes Laufs $b$ (je eine Viskosität) auf dem Torus $[0, 2\pi)^3$
- Rotation mit dem Levi-Civita-Tensor; wiederholte $j, l$ ⇒ summiert
- der nichtlineare Term in Rotationsform, im Ortsraum ausgewertet (pseudospektral)
- 'Leray-Projektion: entfernt den Gradientenanteil, sodass der Druck nie berechnet wird und $k_i\hat u_i = 0$ gilt'
- verwirft die Moden, die der quadratische Term per Aliasing verfälschen würde; $k_\max = N/3$
- kinetische Energie $\frac12\langle|\mathbf u|^2\rangle$ und Enstrophie $\frac12\langle|\boldsymbol\omega|^2\rangle$
- 'Beale–Kato–Majda-Kriterium: Eine glatte Lösung kann bei $T^*$ nur zusammenbrechen, wenn dieser Ausdruck dort divergiert'
- Anpassung $E(k) \propto k^{-3}e^{-2\delta k}$; eine echte Singularität erfordert $\delta \to 0$, und das Gitter löst die Strömung nur auf, solange $\delta\,k_\max \gtrsim 1$
labels:
  n: Gitter $N^3$
  nu: Viskosität $\nu$ (Läufe $0$, $\nu$, $2\nu$)
  t_max: Simulierte Zeit
