title: अभाज्य सर्पिल और हार्डी–लिटिलवुड अनुमान
summary: 'अभाज्य संख्याओं को छलनी से छानकर एक बूलियन टेंसर में रखिए और उन्हें उलम और सैक्स सर्पिलों पर बनाइए, जहाँ वे रेखाओं पर इकट्ठी हो जाती हैं। हर रेखा एक द्विघात व्यंजक है, जैसे ऑयलर का $k^2 + k + 41$, और हार्डी–लिटिलवुड अनुमान बताते हैं कि उस पर कितनी अभाज्य संख्याएँ होंगी। फिर वही छलनी उनके जुड़वाँ-अभाज्य और गोल्डबाख पूर्वानुमानों तथा अभाज्य अंतरालों के क्रैमर के यादृच्छिक मॉडल की जाँच करती है। ये अनुमान हैं: प्रोग्राम इन्हें संख्यात्मक रूप से जाँचता है, सिद्ध नहीं करता।'
notes: 'उलम (1963) ने पूर्णांकों को एक वर्गाकार सर्पिल पर लिखा और देखा कि अभाज्य संख्याएँ विकर्णों के साथ पंक्तिबद्ध हो जाती हैं; सैक्स सर्पिल (1994) $n$ को त्रिज्या $\sqrt n$ और कोण $2\pi\sqrt n$ पर रखता है और इसके बजाय वक्र दिखाता है। उलम सर्पिल की हर विकर्ण किरण पर एक द्विघात $4k^2 + bk + c$ के मान होते हैं, और 41 से शुरू होने वाले सर्पिल पर मुख्य विकर्ण ऑयलर का $k^2 + k + 41$ है, जो $k = 0, \dots, 39$ के लिए अभाज्य है (सिद्ध: राबिनोविच ने दिखाया कि $k^2 + k + p$ सभी $k < p - 1$ के लिए ठीक तब अभाज्य है जब $\mathbb Q(\sqrt{1 - 4p})$ की वर्ग संख्या एक हो, इसलिए $p \in \{2, 3, 5, 11, 17, 41\}$, एक सूची जिसे हेगनर और स्टार्क ने पूरा किया)। कुछ किरणें घनी और कुछ खाली होती हैं, शेषफलों (रेज़िड्यू) के कारण: जब $f$ का विविक्तकर कई छोटे अभाज्यों के लिए अशेष (नॉन-रेज़िड्यू) होता है, तो उन अभाज्यों के मॉड्यूलो उसके कोई मूल नहीं होते। हार्डी और लिटिलवुड (1923) ने इसे अनुमान F में बदला, जिसे बेटमैन–हॉर्न अनुमान (1962) $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$ के रूप में फिर से कहता है। ऊपर-दाईं
  ओर का पैनल कई सौ द्विघातों पर एक साथ इसकी जाँच करता है: जैसे-जैसे $K$ बढ़ता है, मापे गए स्थिरांक पूर्वानुमानित $C(f)$ (विकर्ण रेखा) के निकट पहुँचते हैं। किसी भी द्विघात के बारे में यह तक ज्ञात नहीं कि वह अनंत रूप से अनेक अभाज्य मान लेता है: $n^2 + 1$ के लिए यह लैंडाउ की चौथी समस्या (1912) है, जो अब भी खुली है। ऑयलर के बहुपद के लिए हार्डी और लिटिलवुड विषम-अभाज्य गुणनफल $3.3197732$ उद्धृत करते हैं; बेटमैन–हॉर्न स्थिरांक में $p = 2$ से आने वाला गुणक 2 शामिल है (मान हमेशा विषम होते हैं), इसलिए यह $6.6395$ है। स्थिरांक $C_2 = 0.6601618\ldots$ वाला जुड़वाँ-अभाज्य अनुमान और अपनी विचित्र श्रेणी (सिंगुलर सीरीज़) वाला गोल्डबाख अनुमान वही विचार हैं, $p$ और $p + 2$ के लिए, तथा $p$ और $N - p$ के लिए। छलनी ज्ञात गिनतियाँ $\pi_2(10^6) = 8169$ और $\pi_2(10^7) = 58980$ फिर से प्राप्त करती है, और गोल्डबाख का धूमकेतु पूर्वानुमान पर आ सिमटता है: धूमकेतु की पट्टियाँ विचित्र श्रेणी हैं (हरा: $3 \mid N$)। दोनों अनुमान खुले हैं। गोल्डबाख $4 \cdot 10^{18}$ तक की सभी सम संख्याओं के लिए सत्यापित है (ओलिवेरा ए सिल्वा,
  हर्ज़ोग और पार्दी, 2014); झांग (2014) और पॉलीमैथ तथा मेनार्ड के काम ने सिद्ध किया कि अधिकतम 246 के अभाज्य अंतराल अनंत रूप से अनेक हैं, और चेन (1973) ने कि हर बड़ी सम संख्या एक अभाज्य और अधिकतम दो अभाज्यों के गुणनफल का योग है। क्रैमर का मॉडल (1936) हर $n$ को प्रायिकता $1/\ln n$ से अभाज्य मानता है; यह माध्य $\ln p$ वाले चरघातांकी अंतरालों का पूर्वानुमान करता है, जो हमारे देखे के करीब है, और लगभग $\ln^2 p$ आकार के अधिकतम अंतरालों का भी, लेकिन यह जुड़वाँ गिनती में ठीक $2C_2 \approx 1.32$ गुना की ग़लती करता है (बिंदुदार रेखा), क्योंकि यह 2, 3, 5, … से विभाज्यता की उपेक्षा करता है। माइयर (1985) ने दिखाया कि यह अन्य तरीकों से भी विफल होता है, और ग्रानविल ने सुझाया कि अधिकतम अंतराल $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$ तक हो सकते हैं।'
meanings:
- 'एराटोस्थनीज़ की छलनी: हर अभाज्य $p \le \sqrt{n_\text{max}}$ के लिए एक स्ट्राइडेड स्लाइस'
- हर संख्या की उलम सर्पिल पर स्थिति एक साथ, उसके वलय $k = \lceil(\sqrt m - 1)/2\rceil$ और कोने $(2k+1)^2$ से उसकी दूरी के आधार पर
- 'सैक्स सर्पिल: वर्ग संख्याएँ $k^2$ धनात्मक $x$-अक्ष पर स्थित होती हैं'
- हर $k$ पर $F$ द्विघातों $4k^2 + bk + c$ (उलम सर्पिल की विकर्ण किरणें) के मान
- हर मान को छलनी में देखिए; चालू योग हर किरण पर अभाज्यों की गिनती करता है
- ऑयलर कसौटी $(D/p) \equiv D^{(p-1)/2}$ से $f_i$ के मॉड्यूलो $p$ मूल, जहाँ $D = b^2 - 4ac$; $p < 50$ के लिए सीधे आज़माए गए
- 'दोहराया गया $p$ ⇒ योग: अभाज्यों $p < 10^5$ पर लघुगणकों के योग के रूप में ऑयलर गुणनफल'
- 'दोहराया गया $m$ ⇒ योग: स्व-कनवल्यूशन के रूप में गोल्डबाख गिनती, FFT द्वारा'
- जुड़वाँ युग्म $(p, p+2)$ जहाँ $p \le x$
- सामान्यीकृत अंतराल, क्रैमर के यादृच्छिक मॉडल के $e^{-s}$ नियम से तुलना
