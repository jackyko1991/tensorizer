title: Why is there more matter than antimatter?
category: cosmology
level: advanced
order: 6
tags: [series:early-universe:2, role:theory, speculative]
summary: >
  The universe holds about $6\times 10^{-10}$ baryons per photon and almost no antimatter. Sakharov's three
  conditions say what any explanation needs; leptogenesis is a leading candidate: heavy Majorana neutrinos decay
  slightly more often into leptons than antileptons (CP asymmetry $\varepsilon$), inverse decays wash part of it out
  (strength $K$), and sphalerons turn the leptons into baryons. The Boltzmann equations for thousands of
  $(\varepsilon, K)$ models are solved as one batched ODE and compared with the observed $\eta_B$. An open problem.
animated: true
vector_form: '\frac{dN_N}{dz} = -D\,(N_N - N_N^{eq}),\qquad \frac{dN_{B-L}}{dz} = \varepsilon\,D\,(N_N - N_N^{eq}) - W\,N_{B-L},\qquad D = Kz\frac{K_1(z)}{K_2(z)},\quad W = \frac{K}{4}z^3K_1(z),\qquad \eta_B = \frac{a_{sph}}{f}\,N_{B-L}^f'
index_form: '\Delta_{k,n+1} = \Delta_{kn}\,e^{-D_kh} - \frac{dN^{eq}}{dz}\,h\,\varphi(D_kh),\qquad N_{ek,n+1} = N_{ekn}\,e^{-W_kh} + \varepsilon_e D_k\,\bar\Delta_k\,h\,\varphi(W_kh),\qquad \varphi(x) = \frac{1 - e^{-x}}{x}'
