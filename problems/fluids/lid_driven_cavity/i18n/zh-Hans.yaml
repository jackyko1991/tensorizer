source_hash: 87bf1a8993df
title: 顶盖驱动方腔流（纳维–斯托克斯）
summary: 计算流体力学的经典基准问题：一个方形流体腔，顶盖向右滑动。以流函数–涡量形式的二维纳维–斯托克斯方程做时间推进，$\psi$ 的泊松方程通过用 eigh 对角化拉普拉斯算子求解。主涡逐渐形成，其中心线速度与 Ghia 等人（1982）的结果比较。
notes: 单位：方腔尺寸为 1，顶盖速度为 1，因此 $\mathrm{Re} = 1/\nu$。流函数天然保证流动无散，对纳维–斯托克斯方程取旋度则消去了压强。每一步：由 Thom 公式得到壁面涡量（无滑移），对 $\omega$ 做一步前向欧拉，再求解泊松方程。$\nabla^2\psi = T\psi + \psi T^\mathsf T$ 在 $T$ 的本征基下变为对角形式——与快速正弦变换的思路相同。Re = 100 时涡心位于 (0.62, 0.74) 附近，在中心的右上方；Re 较低时移到 (0.5, 0.76)，Re 较高时移向中部，并在底部两角出现反向旋转的小涡。Re 越高需要越细的网格。
meanings:
- 网格上的涡量和流函数，按 [x, y] 索引，包括壁面
- 用中心差分求 $(\partial_y\psi, -\partial_x\psi)$
- 重复的 $j$ ⇒ 求和：涡量的对流
- 五点差分格式
- 壁面 $\psi = 0$ 的一维拉普拉斯算子，只需对角化一次
- 变换；然后 $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$ 再变换回来
- Thom 公式：$-2\psi_\text{next}/h^2$，顶盖下再减去 $2U/h$
labels:
  re: 雷诺数 $UL/\nu$
  n: 每边格点数
  t_max: 模拟时长
