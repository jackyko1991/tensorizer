source_hash: 1d6c71673889
title: 畳み込みとしてのライフゲーム（コンウェイ）
summary: 物理ではなく、ただの遊び：生きたセルと死んだセルからなる格子で、各セルは周囲の 8 つの隣接セルを見る。その数を数えるのは $3\times3$ の畳み込みであり、展開したパッチに対する一つの einsum として書ける。誕生／生存のルールはテンソルどうしの比較なので、複数の盤面のすべてのセルが同時に更新される。グライダー、グライダー銃、ランダムなスープを観察しよう。
notes: 3 つの数（3 で誕生、2 または 3 で生存）だけで、4 世代ごとに斜めに 1 セル進むグライダー、パルサー（周期 3）のような振動子、そしてゴスパーのグライダー銃が生まれる。グライダー銃は 30 世代ごとに新しいグライダーを発射するので、個体数は周期ごとに 5 ずつ増える。わずか 5 セルの $R$ ペントミノは、無限の格子上では 1103 世代にわたり変化し続ける。有限の盤面では端がこれを途中で打ち切る。ランダムなスープは燃え尽きて、静物、ブリンカー、そして逃げ去るグライダーになる。灰色の曲線は、この減衰がスープごとにどれほど似ているかを示す。同じ「展開して einsum」というパターンが、畳み込みニューラルネットワークの層の計算方法そのものである。
meanings:
- 盤面 $b$ のセル $(i, j)$：1 は生、0 は死
- セルの周囲が 1、中央が 0：セルは自分自身の隣接セルではない
- 各セル $p$ の周囲の $3\times3$ パッチを列として並べたもの。盤面外のセルは死んでいるとみなす
- 繰り返される $k$ ⇒ 和をとる：各セルの生きた隣接セルの数。$K$ との畳み込みと同じ
- B3/S23：隣接セルがちょうど 3 つなら誕生、2 つか 3 つなら生存、それ以外は死滅
- 各世代における各盤面の個体数
