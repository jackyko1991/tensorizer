source_hash: f8aa40a8b1bc
title: '방정식 탐색기: 데이터의 지배 방정식을 써 내는 텐서 AI'
summary: 장(field) 데이터를 주면 그 법칙을 LaTeX로 돌려줍니다. 후보 항 라이브러리($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$)를 유한 차분, Savitzky–Golay 필터 또는 약형식(weak form)으로 구성하고, 순차 임계 릿지 회귀(PDE-FIND)가 $\partial_t u$를 설명하는 소수의 항만 남깁니다. 시뮬레이션 데이터로부터 Lorenz 계, 열 방정식, 점성 Burgers 방정식, 그리고 Yee FDTD 계산으로부터 Maxwell 방정식을 복원하며($c$의 오차 0.2 %, 약형식으로는 0.03 %), 라이브러리 속에 숨은 $\nabla\cdot\mathbf B = 0$도 찾아냅니다. 노이즈 연구는 각 미분 추정 방법이 어디서 무너지는지 보여 줍니다.
notes: '아이디어. 이것은 Jacky Ka Long Ko의 ‘자동 물리 방정식 탐색기’입니다. 장 데이터를 보고 그것을 지배하는 방정식을 LaTeX로 써 내는 작은 텐서 AI입니다(SINDy / PDE-FIND 접근법). MNIST에서의 연산자 탐색의 후속작으로, 그 탐색은 ‘손글씨 숫자에는 지배 방정식이 없다’는 결론으로 끝났습니다. 여기서는 데이터가 법칙에서 나오므로 찾을 것이 있습니다. 아키텍처는 세 모듈로 이루어집니다: (1) 노이즈 제거 평활기, (2) einsum / 유한 차분 미분 엔진, (3) 희소 연산자 회귀. 여기서 (2)와 (3)은 완성되었고 (1)은 Savitzky–Golay 평활기입니다(신경망은 필요 없습니다). 방법. 모든 후보 항은 장의 단항식의 미분 $D^\alpha(\prod_g u_g^{p_g})$입니다: Lorenz 계에는 3차까지의 단항식 20개, 1차원 방정식에는 13개 항 $D^d(u^p)$($p, d \le 3$), Maxwell에는 17개 항(장 자체, 그 $x$ 및 $y$ 미분, 라플라시안, 몇 가지 곱). 선형 시스템 $\partial_t u = \Theta\xi$를 만드는 방법은 세 가지입니다: 중심 유한 차분(fd); Savitzky–Golay(sg: 7개 샘플에서 3차 평활 후 9개 샘플에서 4차 미분 피팅) — 둘 다 축별 1차원 합성곱 —; 그리고 약형식(weak SINDy, Messenger and Bortz 2021)으로, 방정식을 범프 함수 $(1-s^2)^{10}$에 대해 적분하고 부분 적분으로 모든 미분을 범프 쪽으로 옮기며, 축마다 텐서 축약 한 번입니다. 이어서 STRidge(Rudy et al. 2017)를 단위 노름 열에 대해 실행합니다: 릿지 회귀, $\tau$ 미만의 모든 계수를 0으로, 재피팅, 반복. 3가지 릿지 강도에 대해 41개의 허용치를 훑고, 검증 오차가 최솟값의 5 %(+ $10^{-3}$) 이내인 모델 중 항이 가장 적은 것을 채택합니다. 큰 릿지 강도는 Maxwell에서
  중요합니다: $\nabla\cdot\mathbf B = 0$이므로 열 $\partial_x B_x$와 $\partial_y B_y$는 거의 반대 방향이고, 릿지가 약하면 회귀가 $E_z$ 방정식에 $2200\,\nabla\cdot\mathbf B$를 더해 버렸습니다. 계수는 남은 항에 대해 최소제곱법으로 재피팅하며, ±는 행에 대한 부트스트랩으로 구합니다. 이 ±는 통계적인 것일 뿐이며 미분 추정의 편향을 포함하지 않으므로, 실제 오차보다 훨씬 작은 경우가 많습니다. 대안 회귀는 operator_search_mnist의 DARTS 방식 완화입니다: $\xi = \sigma(\alpha/T)\,w$에 게이트 페널티를 더하고, 온도를 1에서 0.01로 어닐링합니다. 데이터는 모두 여기서 시뮬레이션했습니다: Lorenz 궤적 8개(RK4); 10 cm 주기적 막대 위의 열 방정식, Fourier 모드로 구한 정확해($D$ = 0.2 cm²/s); $2\pi$ m 위의 점성 Burgers 방정식, Cole–Hopf 변환으로 구한 정확해($\nu$ = 0.1 m²/s); 주기적 6.4 cm 상자 속 Maxwell 방정식, Yee FDTD 계산(TM 모드, 0.5 mm 셀, Courant 수 0.5)으로, 실제 측정처럼 샘플링했습니다(모든 장을 같은 점과 시각으로 보간). 노이즈: 가우스 노이즈, 각 장 표준편차의 0, 0.1, 1, 5 %. 결과. 테스트는 다음을 확인합니다: 커널과 약형식이 미적분상 정확해야 하는 곳에서 정확한지, 데이터가 각자의 법칙을 따르는지(열 커널, Cole–Hopf, Yee는 $\nabla\cdot\mathbf B = 0$을 반올림 오차 수준으로 유지하고 에너지를 0.2 % 이내로 보존), STRidge가 심어 둔 희소 벡터를 정확히 복원하는지, 모든 대상이 깨끗한 데이터에서 복원되는지, 그리고 써 낸 LaTeX를 파서로 다시 읽으면 피팅된 모델이 재현되는지. 동봉된 실행 결과(깨끗한 데이터, 유한 차분): Lorenz $\sigma$ = 9.9987,
  $\rho$ = 27.989, $\beta$ = 2.6662; 열 $D$ = 0.20023 cm²/s; Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$; Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$, $c$ = 29.92 cm/ns(참값 29.98), 그리고 계수 0.996의 $\partial_t \mathbf B = -\nabla\times\mathbf E$. 약형식은 훨씬 정확합니다(정확한 데이터에서 오차 $10^{-8}$; Maxwell에서 0.03 %, 이는 탐색기가 아니라 Yee 기법 자체의 수치 분산입니다). Maxwell 라이브러리의 최소 특이 벡터는 $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$이며, 그 특이값은 다음 값보다 220배 작습니다: 데이터가 $\nabla\cdot\mathbf B = 0$을 암묵적 법칙으로 드러냅니다. 노이즈(올바른 항을 찾았는가?): 유한 차분은 열과 Burgers에서 0.1 % 노이즈부터, Lorenz에서 1 %부터 실패하며 5 %를 견디는 것은 Maxwell뿐입니다(계수 오차 25 %). Savitzky–Golay는 모든 경우에 0.1 %를 견디고 5 %는 Maxwell에서만 견딥니다. 약형식은 열, Burgers, Maxwell에서 모든 노이즈 수준에서 올바른 항을 찾고(5 % 노이즈에서 계수 오차는 각각 7 %, 6 %, 0.1 %), Lorenz에서는 1 %까지 찾습니다(5 %에서는 $\dot y$에 아주 작은 가짜 항 두 개를 추가합니다). 어닐링 게이트는 Burgers와 Maxwell에서 약형식 STRidge와 일치하지만, 모든 노이즈 수준과 시도한 모든 페널티($10^{-6}$에서 $10^{-3}$)에서 Lorenz $\dot y$의 $-y$ 항을 놓칩니다: $25.5\,x - 0.95\,xz$가 그것을 흡수하며, 완화 방법이 벗어나지 못하는 국소 최솟값입니다.
  또한 열 방정식 5 %에서도 실패합니다. 첫 스냅숏에서 찾은 방정식으로 다시 시뮬레이션하면 열과 Burgers 데이터를 $3\times 10^{-4}$, Maxwell을 3 %로 재현합니다. Lorenz는 5 시간 단위 후 3 % 벗어나는데, 혼돈이 0.01 %의 계수 오차를 증폭하기 때문입니다. results/noise_study.csv와 results/equations.tex에 모든 수치와 방정식이 담겨 있고, 대상마다 GIF 하나(Maxwell이 메인)와 results/summary.png가 있습니다. 결론. 탐색기는 깨끗하고 충분히 샘플링된 데이터에서 알려진 방정식 형태를 복원하며, 약형식을 쓰면 현실적인 노이즈도 견딥니다. 가장 먼저 무너지는 것은 회귀가 아니라 미분 추정입니다. 라이브러리에 있는 항만 찾을 수 있고, 올바른 변수가 측정되어야 하며, 발견된 방정식은 가설입니다: 독립적인 검증 없이 새로운 물리학(또는 생리학)을 발견하지 않습니다. 또한 대규모 언어 모델의 대체물도 아닙니다. 이는 다른 과제(텍스트를 생성하는 것이 아니라 데이터에 법칙을 피팅하는 것)입니다. 관련 연구. SINDy(Brunton, Proctor and Kutz 2016), PDE-FIND와 STRidge(Rudy et al. 2017), weak SINDy(Messenger and Bortz 2021); 유전 프로그래밍에 의한 기호 회귀(Schmidt and Lipson 2009)와 AI Feynman(Udrescu and Tegmark 2020); Yee 기법(Yee 1966). 직접 해 보기. 더 빠른 실행을 위해 부트스트랩 재표집 횟수를 줄이거나, 게이트 단계 수를 늘려 완화 방법이 Lorenz 국소 최솟값을 벗어나는지 보거나(4000까지는 벗어나지 못했습니다), Yee 격자를 더 성기게 해 보세요.'
meanings:
- '라이브러리: 열 $k$는 각 내부 격자점 $n$에서의 후보 항 $D^\alpha(\prod_g u_g^{p_g})$, 예: $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- '미분 엔진: 한 축을 따른 1차원 합성곱; 중심 차분, 또는 3차 평활 후의 Savitzky–Golay($2m+1$개 샘플에서의 $p$차 최소제곱 다항식)'
- '약형식: $x$와 $t$에 대해 합산; 미분은 노이즈가 있는 데이터가 아니라 항상 매끄러운 범프 $\phi(s) = (1-s^2)^{10}$에 걸림'
- 각 방정식 $f$에 대해 남은 항으로 릿지 회귀를 한 번에 일괄 풀이; STRidge는 $|\hat\xi_k| < \tau$를 0으로 만들고 재피팅
- '허용치 훑기: 검증 오차가 최솟값의 5 %(+ $10^{-3}$) 이내인 모델 중 항이 가장 적은 것을 채택'
- 'DARTS 방식 대안: $\xi = \sigma(\alpha/T)\, w$에 게이트 페널티, 온도를 1에서 0.01로 어닐링'
- '부트스트랩: $B$번의 행 재표집을 다항 가중치로 표현하고, 모든 피팅을 한 번의 일괄 풀이로 수행'
- '써 낸 LaTeX를 파서로 다시 읽기: 출력 정밀도 내에서 피팅된 모델을 재현'
labels:
  bootstrap: 각 계수의 ±를 위한 부트스트랩 재표집 횟수
  gate_steps: 어닐링 게이트 탐색의 Adam 단계 수
  maxwell_grid: Maxwell 시뮬레이션의 Yee 격자(0.5 mm 셀 $n \times n$개)
