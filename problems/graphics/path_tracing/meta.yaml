title: Monte Carlo path tracing of a Cornell box
category: graphics
level: intermediate
order: 2
tags: [turing:2019]
summary: >
  Photorealistic rendering solves the rendering equation by Monte Carlo. Every camera ray of every sample is traced
  as one batch through a box of planes and spheres: cosine-weighted bounces, a shadow ray to the area light at each
  hit, and Russian roulette to end paths. Watch the noise fall as $1/\sqrt{N}$ and the red and green walls bleed
  colour onto the white ones, which only global illumination captures.
animated: true
vector_form: 'L(\mathbf x) = L_e(\mathbf x) + \int_{\Omega} \frac{\rho}{\pi}\,L\big(\mathbf x''(\boldsymbol\omega)\big)\,\cos\theta\;d\omega \;\approx\; \frac{1}{N}\sum_{s=1}^{N} \sum_{k} \beta_k\,D_k,\qquad p(\boldsymbol\omega) = \frac{\cos\theta}{\pi}'
index_form: 't_{rp} = \frac{d_p - n_{pi}\,o_{ri}}{n_{pj}\,\omega_{rj}} \qquad \beta_{k+1,rc} = \beta_{krc}\,\rho_{krc} \qquad D_{rc} = \frac{\rho_{rc}}{\pi}\,L^e_c\,\frac{(n_{ri}\,\omega_{ri})(-m_j\,\omega_{rj})\,A}{\lvert \mathbf y - \mathbf x\rvert_r^2}\,V_r \qquad L_{pc} = \frac{1}{N}\sum_s \sum_k \beta_{k,(sp)c}\,D_{k,(sp)c}'
translation:
  - {symbol: 'o_{ri},\ \omega_{ri}', code: 'camera_rays(cam, spp, gen, device)', shape: '(R, 3)', meaning: 'origin and direction of ray $r = (s, p)$: $N$ jittered samples for each of the $P$ pixels, one batch'}
  - {symbol: 'n_{pi},\ d_p', code: "scene['n'], scene['d']", shape: '(Pl, 3), (Pl,)', meaning: 'plane $p$ is $n_{pi} x_i = d_p$, clipped to a bounding box; the light is a small plane'}
  - {symbol: 't_{rp}', code: 'intersect_planes(o, d, scene)', shape: '(R, Pl)', meaning: 'distance from every ray to every plane; repeated $i$, $j$ ⇒ summed'}
  - {symbol: 't_{rs}', code: 'intersect_spheres(o, d, scene)', shape: '(R, S)', meaning: 'roots of $\lvert o + t\omega - c\rvert^2 = r^2$ for every ray and sphere'}
  - {symbol: '\min_p t_{rp}', code: 't_all.min(dim=1)', shape: '(R,)', meaning: 'nearest hit along each ray: which primitive, where, and its normal'}
  - {symbol: '\omega \sim \cos\theta/\pi', code: 'cosine_sample(n, gen)', shape: '(R, 3)', meaning: 'next direction: uniform point in a disc lifted onto the hemisphere; $f\cos\theta/p = \rho$'}
  - {symbol: '\beta_{krc}', code: 'beta = beta * rho', shape: '(R, 3)', meaning: 'path throughput: how much of the light found at bounce $k$ reaches the camera'}
  - {symbol: 'D_{rc}', code: 'direct_light(x, n, rho, scene, gen)', shape: '(R, 3)', meaning: 'next-event estimation: a shadow ray to a random point $y$ on the area light'}
  - {symbol: 'q_r = \min(0.95, \max_c \beta_{rc})', code: 'survive = rand < q;  beta / q', shape: '(R,)', meaning: 'Russian roulette: end dim paths at random but re-weight survivors, so the mean is unchanged'}
  - {symbol: 'L_{pc}', code: "total.reshape(m, -1, 3).sum(0) / spp", shape: '(P, 3)', meaning: 'the pixel colour: average over the sample index $s$'}
notes: >
  The rendering equation for a diffuse (Lambertian) surface says that light leaving a point is its emission plus
  the reflected fraction $\rho$ of all incoming light. The incoming light is in turn the outgoing light of other
  surfaces, so the integral recurses. A path tracer replaces it by random paths. Cosine-weighted sampling
  ($p = \cos\theta/\pi$) cancels the BRDF and the cosine, so the throughput just picks up a factor $\rho$ per bounce.
  At every hit a shadow ray to a random point on the light adds the direct light (next-event estimation), which is
  far less noisy than waiting for a bounce to hit the small light by chance. Only light from the first hit gives the
  direct-only image. Every further bounce adds indirect light: soft fill in the shadows, a brighter ceiling and red
  and green colour bleeding. The furnace test in the test suite checks the estimator. A closed box whose walls all
  emit $L_e$ and reflect $\rho$ must have radiance $L_e/(1-\rho)$ everywhere. With cosine sampling this comes out
  with zero variance. The error falls as $1/\sqrt N$ because each pixel is a mean of $N$ independent samples.
  Halving the noise costs four times the samples, which is why production renderers use denoisers.
params:
  resolution: {default: 96, min: 32, max: 160, step: 16, type: int, label: Image size, unit: px}
  spp: {default: 128, min: 16, max: 1024, step: 16, type: int, label: 'Samples per pixel $N$'}
  reference_spp: {default: 512, min: 256, max: 4096, step: 256, type: int, label: Reference samples per pixel}
  bounces: {default: 3, min: 1, max: 10, step: 1, type: int, label: Bounces (before roulette)}
  termination: {default: roulette, type: choice, options: [roulette, fixed], label: Path termination}
  light_power: {default: 30.0, min: 5, max: 80, step: 1, label: 'Light radiance $L_e$'}
