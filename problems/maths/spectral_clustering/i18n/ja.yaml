source_hash: 4a434cf0af06
title: スペクトラルクラスタリングとグラフラプラシアン
summary: 点群をグラフに変え（$k$ 近傍の辺にガウス重み）、グラフラプラシアン $L = D - W$ とその正規化形 $L_{sym}$ をテンソルとして作り、最小の固有ベクトルからクラスタを読み取る。素朴な k-means が失敗する二つの三日月と同心円も完全に分離できる。同じラプラシアンを格子上で使うと太鼓の振動モードが得られる。
notes: なぜうまくいくのか：$f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$ は二乗和なので $L$ は半正定値であり、ゼロになるのは $f$ がすべての辺で一定、すなわち各連結成分上で一定のときだけである。したがってゼロ固有値の数はちょうど連結成分の数であり（ターミナルの二つの数を比べよう）、成分の指示ベクトルがその固有空間を張る。クラスタがわずかな弱い辺でしかつながっていないと、固有値はゼロではなく小さな値になり、固有ベクトルは指示ベクトルに近くなる。$f^{\mathsf T}Lf$ の最小化は、切る辺を最少にする問題の緩和版であり、Shi と Malik（2000）の正規化カットである。2 番目の固有ベクトル（フィードラーベクトル）が最良の二分割を与える。素朴な k-means は中心のまわりにまっすぐな境界を引くので、三日月や円を半分に切ってしまう。埋め込み（上段、点が滑っていく様子を見よう）ではクラスタは分離した塊になり、k-means がうまくいく。スペクトルで $k$ 番目の固有値の後に大きなギャップがあれば、それがクラスタ数の手がかりになる。$g\times g$ の格子グラフでは $L = L_1\otimes I + I\otimes L_1$ は自由（ノイマン）境界の離散ラプラシアンの符号を反転したものなので、固有ベクトルは定在波 $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$、固有値は $\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$ である：波動のトピックの振動する太鼓と同じモードである（ただしそちらは固定端）。モード $(a, b)$ と $(b, a)$ は固有値を共有し、eigh はその対の何らかの混合を返すので、斜めに見えるものがある。結果は $\sigma$ と $k$ に依存する：近傍が少なすぎるとクラスタがばらばらに分かれ、多すぎるとクラスタ間に橋がかかる。参考文献：U. von Luxburg, A tutorial on spectral clustering (2007); Ng, Jordan
  and Weiss (2001)。
meanings:
- 点 $i$、座標 $a$：二つの三日月、二つの円、または三つの塊、評価用の正解ラベル付き
- $a$ の繰り返し ⇒ 和：すべての距離の二乗を一度に
- $j$ が $i$ の $k$ 近傍の一つであるか、その逆の場合にのみ残すガウス類似度；対称、対角はゼロ
- $j$ の繰り返し ⇒ 和：各点の次数
- 各行の和は 0 なので、定数ベクトルは固有値 0 をもつ
- $s_i = d_i^{-1/2}$；和はとらず、$i$ と $j$ は自由なまま
- 固有値は昇順；最初の $k$ 個の固有ベクトルを、行を単位長に正規化したものがスペクトル埋め込み
- k-means++ 初期化による Lloyd 反復；埋め込みではクラスタはまとまった塊
labels:
  n_points: データセットあたりの点数 $N$
  noise: ノイズ
  k_neighbours: 近傍数 $k$
  sigma: カーネル幅 $\sigma$
  grid: 格子グラフの一辺 $g$
