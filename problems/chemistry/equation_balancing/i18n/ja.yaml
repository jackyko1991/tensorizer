source_hash: 94551bc4044d
title: 化学反応式の係数合わせ（零空間）
summary: 反応式の係数を合わせるとは、すべての元素と電荷を保存する係数 $\nu_s$ を見つけることである。行列で書けば $M\nu = 0$：係数は元素–化学種行列の零空間である。一回のバッチ SVD でメタンの燃焼から酸性条件の過マンガン酸塩まで七つの反応を同時に解き、係数が一意に決まらない反応を見つけ出す。
notes: 各元素は未知の係数についての線形方程式を一本与えるので、$S$ 個の化学種と $E$ 個の元素からは $E\times S$ の系 $M\nu = 0$ が得られる。通常 $M$ の階数は $S-1$ で、解は直線をなす：係数の合った反応式は共通因子を除いて一意である。SVD はこの直線を特異値 0（最後のもの）に対応する右特異ベクトルとして見つける。最小の成分で割り、乗数 $k = 1, 2, \dots$ を試すと最小の整数が得られる。例：$\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$。イオンでは電荷がもう一行加わるだけである：それがなければ $\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$ の零空間は 2 次元になるが、あればおなじみの $1{:}5{:}8 \rightarrow 1{:}5{:}4$ の酸化還元反応式が現れる。過酸化物の例 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$ はゼロ特異値を二つもつ：二つの独立な反応（$2\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$ と $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$）が隠れており、それらの任意の正の組み合わせも係数が合う。代数だけでは一つに決められず、実際の比率は化学（反応速度論、条件）で決まる。コードは 2 次元の零空間で係数の一つをゼロにして得た基底反応を示す。tensors.py の `REACTIONS` に追加すれば自分の反応も試せる。パーサーは 'Ca3(PO4)2' や 'Fe^3+' のような括弧や電荷も読み取る。
meanings:
- 反応 $r$ の化学種 $s$ に含まれる元素 $e$ の原子数；行 q は電荷（小さな化学式パーサーによる）
- 反応物は $+1$、生成物は $-1$
- どの添字についても和をとらない：各列に符号を付ける
- すべての反応を一つのテンソルに詰め、未使用の列は $\nu_s = 0$ に固定
- バッチ SVD；特異値は降順
- 消える特異値の数：1 → 係数は一意、2 → 二つの独立な反応
- 最後の特異ベクトルを最小成分が 1 になるようにスケーリングし、さらに整数を与える最初の $k_r$ を掛ける
- $s$ の繰り返し ⇒ 和：生成される $e$ の原子数；すべての元素と電荷でゼロ
labels:
  show: 行列として表示する反応
  max_scale: 試す乗数 $k$ の最大値
