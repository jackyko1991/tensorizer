source_hash: 55836e86a221
title: 用一批图灵机演示停机问题
summary: 不是物理，只是好玩：把几十万台图灵机作为张量同时运行。所有机器的一步只是一个 gather（读取每个读写头下的纸带）、一次用高级索引查找规则和一个 scatter（写入）。枚举所有 2 状态和 3 状态的忙碌海狸候选机器，找到冠军 $S(2) = 6$ 和 $S(3) = 21$，并亲眼看看停机问题：无论选多大的步数预算，总有一些机器仍未判定。
notes: 图灵（1936）证明了没有任何程序能对每台机器和每个输入判定它是否停机。一段话讲清对角线论证：假设机器 $D(M)$ 能对每台以自身描述为输入启动的机器 $M$ 回答“停机”或“永远运行”。构造 $G$，它运行 $D(M)$ 然后反着做：若 $D$ 说“停机”就永远循环，若 $D$ 说“永远运行”就停机。现在问 $G$ 在自身描述上会怎样：如果它停机，$D$ 说的是它永远运行；如果它永远运行，$D$ 说的是它停机。无论哪种情况 $D$ 都错了，所以 $D$ 不可能存在。Radó（1962）把它变成了一个游戏，即忙碌海狸：在所有从空白纸带出发且会停机的 $n$ 状态 2 符号机器中，$S(n)$ 是最长的运行步数，$\Sigma(n)$ 是留下的 1 的最多个数。两者都比任何可计算函数增长得更快，因为计算 $S(n)$ 的程序就能判定停机：让每台机器运行 $S(n)$ 步，到那时还没停机就永远不会停。已知值：$S(2) = 6$、$\Sigma(2) = 4$（Radó），$S(3) = 21$、$\Sigma(3) = 6$（Lin 与 Radó 1965），$S(4) = 107$、$\Sigma(4) = 13$（Brady 1983），以及 $S(5) = 47\,176\,870$，由 bbchallenge 合作组在 2024 年证明，并用 Coq 验证了其余每台 5 状态机器都永远运行。图中显示了难点所在：已停机比例 $f(t)$ 先上升后变平，而有限的预算永远无法区分一台慢慢才停机的机器和一台永远运行的机器。这里第 21 步之后的平台正是 3 状态的已知答案，因为剩下的机器已被证明会循环。3 状态的规范化：第一条规则固定为 A0 → 1RB，这是保留已知冠军的常用选择（由左右对称性，第一步可设为向右；其他状态的名字可以互换；在空白纸带上一直停留在 A 的机器永不停机），并且每条停机规则都是 1RH，于是得到 $13^5 = 371\,293$ 台机器，而不是 $16^6$ 台。试试 4 个状态：随机样本中很少包含 107 步的冠军。
meanings:
- 机器 $b$ 在状态 $q$、读到符号 $r$ 时的规则表：（写入 $w$，移动 $m = \pm1$，下一状态 $q'$）；状态 $n$ 是停机状态 $H$
- 机器 $b$ 纸带上的格子 $x$，开始时全为 0；$L = 2t_{\max} + 1$，保证没有读写头能到达尽头
- 读写头位置（开始在中间）和当前状态（开始为 $A$）
- 一次读取所有读写头下的符号
- 高级索引：每台机器查找自己的规则
- 写入；然后只在 $s_b \ne H$ 处移动并改变状态（已停机的机器冻结）
- 机器 $b$ 进入 $H$ 的步数，或 $-1$：在预算内未判定
- 满足 $\tau_b \le t$ 的机器比例：单调不减，并停在 1 以下
- 重复的 $x$ ⇒ 求和：停机机器留下的 1 的个数
labels:
  states: 状态数 $n$（2 和 3 穷举，4 抽样）
  budget: 步数预算 $t_{\max}$
  n_sample: 随机 4 状态机器数
