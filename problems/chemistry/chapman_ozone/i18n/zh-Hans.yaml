source_hash: 909629a494c2
title: Chapman 机理与臭氧层
summary: O、O₂ 和 O₃ 之间由阳光驱动的四个反应形成了臭氧层。把它写成反应网络 $\dot c = S\,r(c)$，配以 $3\times4$ 的化学计量矩阵，这个刚性系统用带牛顿迭代的后向欧拉法在所有高度上同时积分，从日出一直到数百年之后：O 与 O₃ 在几秒内相互转化，奇氧需要数天到数百年才能稳定，稳态在约 30 km 处达到峰值。
notes: Sydney Chapman（1930）用四个反应解释了臭氧层。波长短于 242 nm 的紫外光使 $\mathrm{O_2}$ 分解（1）；每个 O 原子很快与一个 $\mathrm{O_2}$ 结合，并由第三体 $\mathrm M$ 带走能量（2）；臭氧吸收紫外光和可见光后再次分解（3），这正是它保护地面的方式，但这并不消灭“奇氧” $\mathrm O_x = \mathrm O + \mathrm{O_3}$；只有 $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$（4）才会。反应（2）和（3）在毫秒到分钟之间使 O 与 $\mathrm{O_3}$ 循环转化，而（1）和（4）决定总量，在平流层上部需要数天，在低处需要数十年甚至更久：这是一个时间尺度相差 $10^{14}$ 的刚性系统，显式步进需要数十亿步，而后向欧拉法（对任何 $\Delta t$ 都稳定）只需在 $\log t$ 上均匀分布的 300 步。$S$ 的每一列都守恒氧原子，而后向欧拉法能精确保持这类线性不变量。平衡两对反应得到 $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$：越往下，空气（以及 $[\mathrm{O_2}]^{3/2}$）呈指数变稠密，而能分解 $\mathrm{O_2}$ 的光则被逐渐耗尽，乘积在倾斜 $\mathrm{O_2}$ 光学厚度约为 3 处达到峰值。速率常数 $k_2$、$k_4$ 取自 JPL 评估值（近似）；光解速率对每种分子只用一个有效波段，参数仅作示意，用以代替对太阳光谱的积分，而且太阳始终照耀。在约 18 km 以下，奇氧寿命甚至超过最长的模拟时长，因此这些高度永远不会稳定；在真实大气中，风会把臭氧输送到那里。仅靠 Chapman 化学会得到过多的臭氧（这里峰值约为 $8\times10^{12}$ cm$^{-3}$，15 km 以上约 380 DU，而观测值约为 20–25 km 附近 $5\times10^{12}$ cm$^{-3}$ 和 300 DU）。缺失的汇是催化循环 $\mathrm X + \mathrm{O_3} \to \mathrm{XO} + \mathrm{O_2}$、$\mathrm{XO}
  + \mathrm O \to \mathrm X + \mathrm{O_2}$，每个催化剂可多次完成反应（4）：NOₓ（Crutzen，1970）以及来自氟氯烃的氯（Molina 和 Rowland，1974），这正是臭氧空洞和《蒙特利尔议定书》背后的化学（1995 年诺贝尔奖）。
meanings:
- 高度 $a$ 处 $\mathrm O$、$\mathrm{O_2}$、$\mathrm{O_3}$ 的数密度，单位 cm$^{-3}$
- 反应 $r$ 净生成的物种 $s$ 分子数；第 1 列为 $(2, -1, 0)$，对应 $\mathrm{O_2} \to 2\,\mathrm O$
- 重复的 $s$ ⇒ 求和：每个反应生成的氧原子数，全部为零
- 四个反应的质量作用速率
- 重复的 $r$ ⇒ 求和：$dc/dt$
- 反应网络的雅可比矩阵，对重复的 $r$ 求和
- 后向欧拉步的一次牛顿更新，每个高度求解一个 $3\times3$ 方程组
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$ 和 $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$（JPL，近似）
- 被上方 $\mathrm{O_2}$ 和 $\mathrm{O_3}$ 柱衰减的光解速率（示意性单波段模型）
- 由关于 $[\mathrm O]$ 的二次方程得到的精确 Chapman 稳态
labels:
  sza: 太阳天顶角
  log10_t_end: 模拟时长 $\log_{10}(t/\mathrm{s})$
  levels: 高度层数
