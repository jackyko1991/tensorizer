title: 싱크혼 알고리즘으로 푸는 최적 수송
summary: 고리 모양의 모래 더미를 두 개의 무더기로, 다시 나선 모양으로 옮길 때 전체 수고를 최소로 하려면 어떻게 해야 할까요? 최적 수송은 질량을 $x_i$에서 $y_j$로 비용 $|x_i - y_j|^2$에 옮기는 계획 $P_{ij}$를 찾으며, 그 최솟값이 바서슈타인 거리의 제곱 $W_2^2$입니다. 작은 엔트로피 $\varepsilon$을 더하면 싱크혼의 교대 갱신으로 문제를 풀 수 있게 되는데, 여기서는 로그 영역에서 logsumexp로 여러 $\varepsilon$ 값을 한 배치로 동시에 계산합니다. $\varepsilon \to 0$이 되면 비용은 헝가리안 알고리즘이 찾은 정확한 최적값까지 내려갑니다.
notes: 몽주는 1781년에 이 문제를 제기했고, 칸토로비치는 1942년에 이를 계획 $P$에 대한 문제로 완화했습니다. 쿠투리(2013)는 엔트로피 버전이 반복마다 행렬 곱 몇 번이면 되는 싱크혼 행렬 스케일링으로 풀린다는 것을 보였고, 이로써 최적 수송이 머신러닝에서 실용적이 되었습니다. 작은 $\varepsilon$은 주의가 필요합니다. 코드는 언더플로가 나는 $e^{-C/\varepsilon}$ 대신 퍼텐셜 $f, g$와 logsumexp를 사용하고, $\varepsilon$을 1에서 목표값까지 점차 줄여 갑니다($\varepsilon$-스케일링). 비용 $\langle P_\varepsilon, C\rangle$은 헝가리안 알고리즘으로 계산한 정확한 $W_2^2$(모든 순열에 대한 전수 조사로 검증한 느리지만 정확한 기준값)까지 감소하며, 쌍대 값 $\mathrm{OT}_\varepsilon$에는 엔트로피 편향이 있는데 Feydy 등(2019)의 싱크혼 발산이 이를 제거합니다. 테스트는 두 가지 닫힌 형태도 확인합니다. 1차원에서는 최적 계획이 정렬된 점끼리 짝짓고(분위수 함수), 가우스 분포 사이에서는 $W_2^2 = |m_1 - m_2|^2 + \operatorname{tr}(S_1 + S_2 - 2(S_1^{1/2} S_2 S_1^{1/2})^{1/2})$(뷰레스 계량)이며, 이는 볼록 함수의 기울기가 최적 사상이라는 브르니에 정리를 이용합니다. 모든 도형은 코드로 생성되며 이미지는 사용하지 않습니다.
meanings:
- 수식과 난수로 생성한 합성 점구름, 각 점의 질량은 $a_i = 1/N$
- 거리의 제곱, 반복되는 $k$ ⇒ 합산
- 동시에 푸는 여러 정규화 강도의 배치
- 로그 영역에서의 싱크혼 갱신, $j$에 대한 합을 logsumexp로 계산; 아주 작은 $\varepsilon$에서도 오버플로가 나지 않음
- '$i$에 대해 같은 연산: 이후 $P$의 열 합이 정확히 $b$와 같아짐'
- '수송 계획: 큰 $\varepsilon$에서는 흐릿하고, 작은 $\varepsilon$에서는 거의 순열'
- '무게중심 사상: $x_i$의 질량이 가는 곳; 점들은 직선 $(1-t)\,x + t\,T(x)$를 따라 움직임(매캔 보간)'
- $\mathrm{OT}_\varepsilon(\mu,\nu) - \tfrac12\mathrm{OT}_\varepsilon(\mu,\mu) - \tfrac12\mathrm{OT}_\varepsilon(\nu,\nu)$, $\mu = \nu$일 때 0
labels:
  n_points: 도형당 점의 수 $N$
  eps_min: 가장 작은 정규화 $\varepsilon$
  n_eps: 배치 내 $\varepsilon$ 값의 수
  n_iter: 싱크혼 반복 횟수
