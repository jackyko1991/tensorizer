<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Worm-like chain: a DNA molecule tethered to a surface is pulled upward by a force F on a bead; its extension z is measured along the force, and neighbouring unit tangents t_i and t_i+1 along the chain are bent by a small angle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- surface -->
    <line x1="40" y1="140" x2="180" y2="140" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="48" y1="140" x2="40" y2="148"/><line x1="62" y1="140" x2="54" y2="148"/><line x1="76" y1="140" x2="68" y2="148"/>
      <line x1="90" y1="140" x2="82" y2="148"/><line x1="104" y1="140" x2="96" y2="148"/><line x1="118" y1="140" x2="110" y2="148"/>
      <line x1="132" y1="140" x2="124" y2="148"/><line x1="146" y1="140" x2="138" y2="148"/><line x1="160" y1="140" x2="152" y2="148"/>
      <line x1="174" y1="140" x2="166" y2="148"/>
    </g>
    <!-- DNA: a gently wiggling chain from the surface to the bead -->
    <path d="M110,140 C90,128 132,118 112,104 C92,90 136,82 114,68 C96,56 128,48 110,40" fill="none" stroke="#374151" stroke-width="2.5"/>
    <!-- bead in the trap -->
    <circle cx="110" cy="30" r="11" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- force -->
    <line x1="110" y1="18" x2="110" y2="2" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="118" y="14" font-style="italic" fill="#b91c1c">F</text>
    <!-- extension z -->
    <line x1="60" y1="140" x2="60" y2="40" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="54" y1="40" x2="110" y2="40" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="44" y="94" font-style="italic">z</text>
    <!-- two neighbouring tangents along the chain -->
    <circle cx="117" cy="114" r="2.5" fill="#374151"/>
    <circle cx="112" cy="104" r="2.5" fill="#374151"/>
    <line x1="117" y1="114" x2="122" y2="96" stroke="#f59e0b" stroke-width="2" marker-end="url(#tan)"/>
    <line x1="112" y1="104" x2="97" y2="94" stroke="#f59e0b" stroke-width="2" marker-end="url(#tan)"/>
    <text x="126" y="110" font-style="italic" fill="#b45309">t<tspan font-size="10" dy="3">i</tspan></text>
    <text x="72" y="98" font-style="italic" fill="#b45309">t<tspan font-size="10" dy="3">i+1</tspan></text>
    <text x="150" y="70" font-size="12" fill="#374151">persistence</text>
    <text x="150" y="84" font-size="12" fill="#374151">length <tspan font-style="italic">P</tspan></text>
  </g>
</svg>
