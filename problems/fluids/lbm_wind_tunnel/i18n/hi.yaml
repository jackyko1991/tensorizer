title: 'डिजिटल पवन सुरंग: STL हवाई जहाज़ के चारों ओर 3D लैटिस बोल्ट्ज़मान'
summary: 'OpenLB लाइब्रेरी की शैली में एक छोटी 3D पवन सुरंग: एक मॉडल हवाई जहाज़ की STL फ़ाइल को त्रिभुज टेंसर में पढ़ा जाता है, सभी लैटिस नोडों पर एक साथ किरण-प्रक्षेपण से वॉक्सेलाइज़ किया जाता है, आक्रमण कोण पर झुकाया जाता है, और TRT या MRT टक्करों, वैकल्पिक Smagorinsky LES और पिंड पर बाउंस-बैक के साथ D3Q19 लैटिस बोल्ट्ज़मान प्रवाह में रखा जाता है। कर्षण और उत्थापन संवेग विनिमय से आते हैं; धारा-रेखाएँ (बैच RK4) और अनुरेखक कण प्रवाह दिखाते हैं। एक गोले का उदाहरण सॉल्वर को स्वयं OpenLB के पहले से गणना किए गए रन से जाँचता है और अवशेष दिखाता है।'
notes: 'लैटिस इकाइयाँ: नोड अंतराल और समय-चरण 1, मुक्त धारा $U = 0.08$ (मैक 0.14), श्यानता $\nu = UL/\mathrm{Re}$ जहाँ $L$ नोडों में पिंड की लंबाई है, और $\tau = 3\nu + \tfrac12$। हवाई जहाज़ $80\times 36\times 26$ लैटिस में $L = 32$ (धड़ की लंबाई; पंख-फैलाव 28 नोड) के साथ उड़ता है, वैकल्पिक NACA 0012 पंख $72\times 24\times 24$ (कॉर्ड 20) में। दोनों STL फ़ाइलें इस समस्या के लिए बनाई गईं (data/SOURCES.md देखें): एक गठीला मॉडल विमान (परिक्रमण-धड़, पीछे झुका NACA 0018 पंख, क्षैतिज और ऊर्ध्वाधर पूँछ), जिसके भाग जोड़ों पर एक-दूसरे में घुसते हैं, इसलिए वॉक्सेलाइज़र साधारण किरण-समता के बजाय वाइंडिंग संख्या (चिह्नित प्रतिच्छेदन) गिनता है; और एक पंख जो पूरी आवर्ती चौड़ाई में फैला है, यानी अनंत पंख ($C_L$ की तुलना $2\pi\alpha$ से करें)। गुणांक ऊपर से देखे गए क्षेत्रफल (प्लानफ़ॉर्म) पर आधारित हैं। सीमाएँ: प्रवाह के आर-पार आवर्ती (विमानों की एक जाली) और वॉक्सेलाइज़्ड पिंड पर आधे-रास्ते बाउंस-बैक; solve.simulate चलती ज़मीन और फिसलन वाली छत भी देता है। इनलेट और आउटलेट के बजाय अंतिम 16 नोड एक fringe क्षेत्र
  हैं जो प्रवाह के $x = 0$ पर फिर प्रवेश करने से पहले उसे मुक्त धारा में लौटा देता है; गति 300 चरणों में बढ़ती है ($C_D$ का शुरुआती उभार वह दाब प्रवणता है जो हवा को त्वरित करती है) और एनीमेशन उसके बाद शुरू होता है। TRT “जादुई” $\Lambda = 3/16$, MRT d''Humières आदि (2002) की D3Q19 दरें, Smagorinsky $C_s = 0.17$। डिफ़ॉल्ट Re = 1000 ($\tau \approx 0.508$) पर इस मोटे लैटिस पर अकेला TRT फट जाता है और LES उसे स्थिर रखता है: LES बंद करके देखें। 8° पर परिणाम: विमान $C_D \approx 0.39$, $C_L \approx 0.12$; पंख $C_L \approx 0.31$, जबकि $2\pi\alpha = 0.88$। उत्थापन कम है क्योंकि पंख केवल 1–3 सेल मोटे हैं, Re लेमिनार है और ऊपर-नीचे की आवर्ती छवियाँ द्वितल विमानों के ढेर जैसा काम करती हैं: ये विधि के उदाहरण हैं, भविष्यवाणियाँ नहीं। सत्यापन (पिंड sphere_openlb): Re = 20 पर एक गोला ($D = 10$, $80\times 40\times 40$, BGK, संतुलन इनलेट) उसी लैटिस पर एक बार ऑफ़लाइन चलाए गए OpenLB 1.7 (data/openlb_reference_*.csv) के विरुद्ध: $C_D$ 3.360 बनाम 3.378 (−0.5 %); मध्य-तल $u_x$: सापेक्ष L2 0.8 %, L∞ 1.1 %, अधिकतम
  $|\Delta u|/U$ 1.3 %। शेष अंतर सीमा योजनाओं से आता है (OpenLB प्रक्षेपित वेग और दाब सीमाएँ लेता है और ध्वनि तरंगों से गूँजता रहता है, $C_D$ में ±5 %) और पूर्ण बनाम आधे-रास्ते बाउंस-बैक से; टक्कर संकारक (BGK) और विभेदन समान हैं। दोनों कोड Schiller–Naumann मान 2.61 से ऊपर हैं क्योंकि यह गोला मुक्त नहीं है: $160\times 60\times 60$ बॉक्स में OpenLB 3.04 देता है और समान अनुपात में $D = 20$ के साथ 3.21। OpenLB केवल पहले से गणना किए गए संदर्भ के रूप में इस्तेमाल हुआ; उसका कोई (GPL) कोड यहाँ उपयोग नहीं होता। सत्यापन उसी रन में विमान के बाद तुरंत चलता है (पैरामीटर validate, डिफ़ॉल्ट चालू; 2000 चरण) और अवशेष पैनल भरता है।'
meanings:
- 'पॉपुलेशन: नोड $(x, y, z)$ पर लैटिस वेग $i$ से चलता द्रव'
- D3Q19 वेग (विराम, 6 फलक, 12 किनारे), भार और विपरीत दिशाएँ
- 'STL त्रिभुज: त्रिभुज $t$, शीर्ष $v$, निर्देशांक $a$'
- अंदर, यदि $+x$ के साथ किरण के चिह्नित प्रतिच्छेदन (वाइंडिंग संख्या) धनात्मक हों; सभी किरणें × सभी त्रिभुज, फिर searchsorted
- 'दोहराया $a$ ⇒ योग: हर लैटिस दिशा के साथ वेग'
- 'दोहराया $i$ ⇒ योग: संवेग घनत्व'
- 'MRT: असंतुलन आघूर्ण, हर एक अपनी दर $s_k$ से शिथिल'
- असंतुलन संवेग फ्लक्स; इसका परिमाण Smagorinsky भँवर श्यानता $\nu_t$ तय करता है
- 'स्ट्रीमिंग: हर पॉपुलेशन को एक कड़ी खिसकाना'
- 1 जहाँ कोई पॉपुलेशन द्रव नोड से पिंड की ओर निकलती है (बाउंस-बैक एक मास्क्ड अदला-बदली)
- 'संवेग विनिमय: पिंड पर बल, उसकी सीमा कड़ियों पर योग'
