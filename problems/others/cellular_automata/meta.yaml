  start: {default: single, type: choice, options: [single, random], label: Start of your rule}
  width: {default: 161, min: 41, max: 401, step: 20, type: int, label: 'Line width $W$'}
  generations: {default: 80, min: 20, max: 300, step: 10, type: int, label: Generations}
  density: {default: 0.5, min: 0.05, max: 0.95, step: 0.05, label: Random start density}
  lenia_size: {default: 64, min: 48, max: 128, step: 16, type: int, label: 'Lenia world $S$'}
  lenia_steps: {default: 600, min: 100, max: 2000, step: 100, type: int, label: Lenia steps}
