source_hash: 8bd75af0e44c
title: रेडियोधर्मी क्षय
summary: हर नाभिक प्रति सेकंड समान प्रायिकता $\lambda$ से यादृच्छिक रूप से क्षयित होता है। नाभिकों के पूरे ग्रिड को एक बूलियन टेंसर के रूप में अनुकरित करना — प्रति नाभिक प्रति समय चरण एक सिक्का उछाल — चिकना चरघातांकी नियम $N(t) = N_0 e^{-\lambda t}$ और अर्धायु $T_{1/2} = \ln 2/\lambda$ पुनः उत्पन्न करता है।
notes: चरघातांकी नियम औसतों के बारे में एक कथन है। $N_0$ नाभिकों के साथ समय $t$ के बाद गिनती द्विपद है, जिसका माध्य $N_0 e^{-\lambda t}$ और मानक विचलन $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$ है, इसलिए छोटा ग्रिड वक्र के आसपास स्पष्ट रूप से डगमगाता है जबकि बड़ा ग्रिड उसका निकटता से अनुसरण करता है। हर अर्धायु के बाद शेष नाभिकों में से लगभग आधे चले जाते हैं, चाहे कितने भी हों। चरण $\Delta t$ को केवल $T_{1/2}$ की तुलना में छोटा होना चाहिए; सटीक प्रति-चरण प्रायिकता $1 - e^{-\lambda\Delta t}$ किसी भी चरण के लिए माध्य को सही रखती है। यादृच्छिक seed स्थिर है ताकि चित्र दोहराया जा सके।
meanings:
- क्षय स्थिरांक $\ln 2 / T_{1/2}$
- जब तक नाभिक $n$ क्षयित नहीं हुआ तब तक True; ग्रिड केवल $n$ को दिखाने का तरीका है
- प्रति नाभिक प्रति चरण एक एकसमान यादृच्छिक संख्या
- एक चरण $\Delta t$ में क्षय की संभावना
- क्षयित नाभिक क्षयित ही रहता है
- 'सभी नाभिकों पर योग: गिनती $N(t)$'
labels:
  n_side: ग्रिड भुजा (side² नाभिक)
  half_life: अर्धायु $T_{1/2}$
  t_max: अनुकरण समय
  dt: समय चरण $\Delta t$
