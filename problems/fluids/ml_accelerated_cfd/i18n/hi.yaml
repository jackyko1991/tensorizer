title: मशीन-लर्निंग से त्वरित CFD
summary: वास्तविक हल से 16 गुना मोटे ग्रिड पर एक सादा परिमित-आयतन हलकर्ता श्यान बर्गर्स समीकरण के प्रघातों (shocks) को धुंधला कर देता है। एक छोटा CNN फलक फ़्लक्सों में एक संशोधन सीखता है, जिसे एक खोले गए (unrolled) मोटे अनुकरण के माध्यम से पश्चप्रसारण से प्रशिक्षित किया जाता है। उन प्रारंभिक स्थितियों पर जिन्हें उसने कभी नहीं देखा, सीखा हुआ हलकर्ता उसी मोटे विभेदन पर बारीक हल का कई गुना अधिक निकटता से अनुसरण करता है, जबकि $\int u\,dx$ को ठीक संरक्षित रखता है।
notes: 'इकाइयाँ: डोमेन $[0, 2\pi)$ है, आवर्ती। वास्तविक हल वही परिमित-आयतन योजना 512 कोशिकाओं पर है, स्थिर रहने के लिए उप-चक्रित ह्यून (Heun) समय-चरणों के साथ। प्रशिक्षण 32 यादृच्छिक चिकनी तरंगों का उपयोग करता है, और परीक्षण किसी अन्य बीज से 8 दूसरी तरंगें, जो प्रशिक्षण डेटा से 50% अधिक देर ($t = 3$) चलाई जाती हैं। हर Adam चरण पर सीखा हुआ हलकर्ता यादृच्छिक समयों पर वास्तविक मोटी अवस्था से शुरू करता है, $S$ चरण चलता है, और औसतित वास्तविकता से भटकने पर दंडित होता है। प्रवणताएँ हर समय-चरण से होकर पीछे बहती हैं, इसलिए नेटवर्क ऐसे संशोधन सीखता है जो उसे अपना ही आउटपुट दिए जाने पर भी अच्छे बने रहते हैं। दो डिज़ाइन विकल्प इसे ईमानदार रखते हैं: $\delta F$ एक फ़्लक्स के रूप में प्रवेश करता है, इसलिए $\sum_i u_i$ पूर्णांकन-त्रुटि तक संरक्षित है, और अंतिम परत शून्य से शुरू होती है, इसलिए प्रशिक्षण सादे हलकर्ता से शुरू होता है। यह विचार Bar-Sinai, Hoyer, Hickey & Brenner (PNAS, 2019) का अनुसरण करता है, जिन्होंने ठीक इसी प्रकार के समीकरण के डेटा-संचालित विविक्तीकरण सीखे, और Kochkov, Smith, Alieva, Wang,
  Brenner & Hoyer (PNAS, 2021) का। उन्होंने एक 2D नेवियर–स्टोक्स हलकर्ता के भीतर अंतर्वेशन गुणांक सीखे और समान सटीकता पर 8–10× मोटे ग्रिड, लगभग 40–80× तेज़, बताए। यह खिलौना तंत्र दिखाता है, वे गति-वृद्धियाँ नहीं। सीखा हुआ संशोधन अपने प्रशिक्षण डेटा से दूर के इनपुट पर विफल हो सकता है। कम चरणों का प्रशिक्षण, छोटा अनरोल, या ऐसी श्यानता आज़माएँ जिस पर नेटवर्क प्रशिक्षित नहीं हुआ।'
meanings:
- प्रक्षेप-पथ $b$ के लिए मोटी कोशिका $i$ में कोशिका औसत (आवर्ती)
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$, $\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$; $u_{i+1}$ roll(u, -1) है
- जो एक कोशिका से बाहर बहता है वह अगली में आता है ⇒ $\sum_i u_i$ संरक्षित
- 'दोहराया गया $k$ ⇒ योग: 5-कोशिका स्टेंसिल, आवर्ती पैडिंग'
- तीन संवलनों से सीखा गया फ़्लक्स संशोधन (शुरुआत में शून्य)
- हर मोटी कोशिका में $f = N_f/N_c$ बारीक कोशिकाओं पर औसतित बारीक हल
- हलकर्ता के सभी $S$ खोले गए समय-चरणों से होकर autograd
