<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Single-cell RNA-seq: cells of different types give a cells-by-genes count matrix K, which PCA maps to two dimensions where k-means finds clusters with centres mu">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- cells -->
    <circle cx="20" cy="40" r="9" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="20" cy="66" r="9" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="20" cy="92" r="9" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="20" cy="118" r="9" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <!-- count matrix: rows = cells, columns = genes -->
    <rect x="40" y="31" width="60" height="96" fill="none" stroke="#374151" stroke-width="2"/>
    <g fill="#93c5fd">
      <rect x="46" y="35" width="8" height="10"/><rect x="70" y="35" width="8" height="10"/>
      <rect x="58" y="61" width="8" height="10"/><rect x="82" y="61" width="8" height="10"/>
      <rect x="46" y="87" width="8" height="10"/><rect x="70" y="87" width="8" height="10"/>
      <rect x="58" y="113" width="8" height="10"/>
    </g>
    <g fill="#2563eb">
      <rect x="82" y="35" width="8" height="10"/><rect x="46" y="61" width="8" height="10"/>
      <rect x="82" y="87" width="8" height="10"/><rect x="70" y="113" width="8" height="10"/>
    </g>
    <text x="70" y="22" text-anchor="middle" font-style="italic">K<tspan font-size="10" dy="3">cg</tspan></text>
    <!-- PCA -->
    <line x1="106" y1="79" x2="126" y2="79" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <!-- PC axes -->
    <line x1="140" y1="136" x2="232" y2="136" stroke="#374151" stroke-width="2"/>
    <line x1="140" y1="136" x2="140" y2="24" stroke="#374151" stroke-width="2"/>
    <text x="206" y="153" font-size="13">PC1</text>
    <text x="146" y="30" font-size="13">PC2</text>
    <!-- three clusters -->
    <ellipse cx="166" cy="104" rx="16" ry="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="210" cy="96" rx="15" ry="13" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="190" cy="54" rx="16" ry="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#93c5fd" stroke="#1e40af" stroke-width="1">
      <circle cx="158" cy="100" r="3"/><circle cx="170" cy="110" r="3"/><circle cx="174" cy="98" r="3"/><circle cx="162" cy="109" r="3"/>
      <circle cx="182" cy="50" r="3"/><circle cx="196" cy="58" r="3"/><circle cx="198" cy="48" r="3"/><circle cx="186" cy="60" r="3"/>
    </g>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <circle cx="204" cy="90" r="3"/><circle cx="216" cy="100" r="3"/><circle cx="208" cy="104" r="3"/><circle cx="218" cy="90" r="3"/>
    </g>
    <!-- centres -->
    <g stroke="#dc2626" stroke-width="2.5">
      <line x1="162" y1="100" x2="170" y2="108"/><line x1="170" y1="100" x2="162" y2="108"/>
      <line x1="206" y1="92" x2="214" y2="100"/><line x1="214" y1="92" x2="206" y2="100"/>
      <line x1="186" y1="50" x2="194" y2="58"/><line x1="194" y1="50" x2="186" y2="58"/>
    </g>
    <text x="214" y="68" font-style="italic" fill="#b91c1c">μ<tspan font-size="10" dy="3">k</tspan></text>
  </g>
</svg>
