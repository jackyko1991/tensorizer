source_hash: 176bf5bc914e
title: 분자를 위한 그래프 신경망 (메시지 전달)
summary: 분자는 그래프이고, 메시지 전달 신경망은 인접 행렬에 대한 몇 개의 einsum이다. 각 원자는 이웃의 상태를 반복해서 더하고($s_{mic} = A_{mij}h_{mjc}$), 분자의 예측은 원자에 대한 합이다. 무작위 공액 탄화수소의 휘켈 π 전자 에너지를 예측하도록 학습시키면, 원자 번호를 어떻게 매기든 같은 답을 주고, 학습한 어떤 분자보다 큰 분자에서도 여전히 작동한다. 반면 인접 행렬에 대한 일반 MLP는 실패한다.
notes: 데이터는 정답을 정확히 알 수 있도록 일부러 합성한 것이다. 각 "분자"는 수소를 생략한 무작위 탄소 골격(탄소당 이웃이 최대 셋인 나무 구조에 5원 고리와 6원 고리를 몇 개 닫은 것)으로, 실제 화합물을 정리한 데이터셋이 아니라 그래프 이론적 장난감이다. 레이블은 휘켈 π 전자 에너지이다. $H = \alpha + \beta A$에서 탄소당 π 전자 하나가 $A$의 가장 큰 고유값 $\lambda_k$의 오비탈부터 채우면 $E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$이고, 신경망은 그래프만으로 $y = \sum_k o_k\lambda_k$를 학습한다. 고유값은 한 번도 보지 않는다. 텐서 측면의 교훈은 그래프 신경망에 새로운 연산이 하나만 필요하다는 것이다. 인접 행렬에 대한 einsum $A_{mij}h_{mjc}$는 모든 분자의 모든 원자에 대해 이웃의 상태를 한꺼번에 더한다. 모든 가중치는 한 번에 원자 하나에 작용하고, 원자는 $A$와 마지막 합을 통해서만 결합되므로, 모형은 구조상 순열 불변이며 같은 가중치가 어떤 크기의 분자에도 맞는다. 콘솔은 두 성질을 모두 보여 준다. 원자 번호를 바꾸면 GNN 출력은 약 $10^{-6}$(float32 반올림)만큼, MLP 출력은 $|\beta|$의 정수 단위만큼 바뀐다. 학습 데이터의 어떤 분자보다 큰 탄소 11–16개 분자에서는 MLP가 입력의 추가 행에서 아무것도 본 적이 없어 실패하지만, GNN의 오차는 거의 늘지 않는다. "결합 수 세기" 기준선 $aN + bN_{bonds} + c$와 비교해 보자. π 에너지는 거의 가산적이며(탄소당 약 $1.2|\beta|$), GNN의 실제 역할은 가지, 고리, 홀수 전자에서 오는 보정이고, 여기서 오차를 대략 절반으로 줄인다. 메시지 4라운드는 결합 4개까지만 닿으므로 공액계 전체에 의존하는 효과(방향족성, 4n 고리)는 근사적으로만 학습된다. 이는 Gilmer et al. (ICML 2017)의 메시지 전달 신경망(MPNN)
  틀로, 그들은 기존의 여러 분자 그래프 신경망이 이 패턴에 들어맞음을 보이고 QM9 분자들의 DFT 물성으로 학습시켰다. 이 계열의 모형(SchNet, DimeNet, 3D 기하도 쓰는 NequIP나 MACE 같은 등변 신경망)은 오늘날 분자 물성 예측과 원자 간 퍼텐셜 맞춤에 널리 쓰이지만, 학습 데이터만큼만 좋으며 그와 다른 화학에서는 실패할 수 있다. 층 1개(가장 가까운 이웃만), 더 적은 학습 분자, 더 좁은 신경망을 시도해 보자.
meanings:
- 분자 $m$의 탄소 골격 인접 행렬, $N = 16$ 원자까지 0으로 채움
- '원자 특징: 탄소 이웃 수(1, 2, 3)의 원-핫 인코딩'
- '목표: $A$의 점유된 휘켈 고유값(eigvalsh), $|\beta|$ 단위의 π 에너지'
- '$f$ 합산: 각 원자를 $C$개 채널로 임베딩'
- '반복된 $j$ ⇒ 원자 $i$의 이웃에 대해 합산: 메시지'
- '$c$ 합산: 모든 분자의 모든 원자에 같은 가중치'
- 학습된 원자당 에너지(분자 위의 색)
- '$i$를 실제 원자에 대해 합산: 크기 확장적이며 원자 순서와 무관'
- '원자 번호 바꾸기: GNN 출력은 부동소수점 정밀도 내에서 그대로'
- '기준선: 평탄화한 256개 인접 성분에 대한 고정 크기 신경망'
labels:
  n_train: 학습 분자 수
  epochs: 학습 에폭
  width: 채널 수 $C$
  layers: 메시지 전달 층 수 $L$
  lr: Adam 학습률
