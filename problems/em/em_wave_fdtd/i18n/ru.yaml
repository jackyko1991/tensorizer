source_hash: 8807e34cb0a8
title: Электромагнитные волны (FDTD)
summary: 'Два роторных уравнения Максвелла, продвигаемые во времени на сетке Йи. Ротор записан как $\varepsilon_{ijk}\,\partial_j F_k$: таблица конечных разностей, свёрнутая с символом Леви-Чивиты в одном einsum. Волна от точечного или линейного источника падает на диэлектрический блок, замедляется, преломляется и частично отражается, а поглощающая граница гасит всё, что покидает область.'
notes: 'Единицы с $c = \varepsilon_0 = \mu_0 = 1$ и размером ячейки $\Delta x = 1$. $\mathbf E$ и $\mathbf H$ сдвинуты на полъячейки (разности вперёд для $\partial\mathbf E$, назад для $\partial\mathbf H$) и обновляются поочерёдно — схема Йи «чехарда» (leap-frog). Источник «мягкий»: он добавляется к $E_z$, поэтому отражённые волны проходят сквозь него. Поглощающая граница просто умножает поля на множитель чуть меньше 1, плавно растущий к стенкам; в реальных кодах вместо этого используют идеально согласованный слой (PML). Внутри блока длина волны уменьшается в $n = \sqrt{\varepsilon_r}$ раз; при нормальном падении отражается доля $(1 - n)/(1 + n)$ амплитуды.'
meanings:
- 'компоненты поля на сетке; TM-мода: ненулевые только $E_z$, $H_x$, $H_y$'
- таблица конечных разностей; строка $j = z$ в 2D нулевая
- символ Леви-Чивиты
- 'повторяющиеся $j, k$ ⇒ суммирование: ротор в каждой ячейке'
- 'относительная диэлектрическая проницаемость: 1 в вакууме, $\varepsilon_\text{block}$ в блоке ($n = \sqrt{\varepsilon_r}$)'
- шаг по времени $S\,\Delta x/(c\sqrt2)$; $S > 1$ отвергается, так как схема становится неустойчивой
labels:
  source: Источник
  eps_block: Проницаемость блока $\varepsilon_r$
  wavelength: Длина волны в вакууме
  courant: Число Куранта $S$
  t_max: Время моделирования
