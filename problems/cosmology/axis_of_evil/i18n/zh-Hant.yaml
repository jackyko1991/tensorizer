source_hash: 9e147d6c0987
title: 微波天空中的「邪惡軸」
summary: 真實 WMAP 宇宙微波背景地圖上最大的兩個圖樣，四極矩（$\ell = 2$）和八極矩（$\ell = 3$），似乎指向同一方向。它們的係數 $a_{\ell m}$ 來自一次最小平方擬合；每個多極矩的軸是 $3\times 3$ 角動量離散矩陣 $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$ 的最大特徵向量，再用一批 $10^5$ 個各向同性的隨機天空，把兩軸的夾角換算成 $p$ 值。這是真實存在但仍有爭議的異常：巧合、前景殘留，還是新物理。
notes: 在統計上各向同性的宇宙中（暴脹的標準預測），不同多極矩的方向互相獨立，所以四極矩與八極矩兩軸的夾角應該是隨機的：$|\cos|$ 在 $[0, 1]$ 上均勻分布。Tegmark、de Oliveira-Costa 與 Hamilton（2003）以及 de Oliveira-Costa 等人（2004）在最早的 WMAP 地圖中發現兩者都指向 $(l, b) \approx (-110^\circ, 60^\circ)$，Land 與 Magueijo（2005）稱之為「邪惡軸」；Copi、Huterer、Schwarz 與 Starkman 用多極向量研究它，並發現它與黃道還有其他關聯。在附帶的 WMAP 九年 ILC 地圖上，兩軸位於 $(l, b) \approx (240^\circ, 60^\circ)$ 和 $(238^\circ, 63^\circ)$，相差僅 $3^\circ$，而每 1000 個各向同性天空中不到 2 個對齊得更好（$p \approx 0.0015$；對此統計量恰好有 $p = 1 - |\cos|$，蒙地卡羅結果也證實了這點）。右圖檢驗模擬：至少對齊到 $x$ 的隨機天空比例沿直線 $P = x$。現狀：資料中確實存在這種對齊（Planck 2013、2015 和 2018 的各向同性論文在所有地圖中都看到它），但其顯著性仍有爭議。這個統計量是在注意到圖樣之後才選的（事後選擇，即「別處查看」效應：在眾多可能的異常中，總有一些看起來罕見）；四極矩功率偏低、ILC 中殘留的銀河前景、運動學都卜勒四極矩（此處未扣除）以及地圖的選擇，都會讓 $p$ 改變數倍。目前沒有公認的物理解釋；提出的可能包括非平凡拓撲、各向異性膨脹或局部前景，而多數宇宙學家視之為統計漲落。本頁只報告單一統計量的 $p$，並不宣稱任何探測。資料：WMAP 九年 ILC 地圖（Bennett et al. 2013, ApJS 208, 20），NASA LAMBDA 檔案庫的 wmap_ilc_9yr_v5.fits（lambda.gsfc.nasa.gov；NASA 資料，公有領域），在此由 HEALPix $N_\mathrm{side} = 512$ 降解析度至 16（欄位 glon_deg、glat_deg、T_uK）。任何同樣是 lon/lat/T
  CSV 格式的地圖（例如 Planck 地圖）都可以替換它。擬合在全天、不加遮罩下使用直到 $\ell_\mathrm{fit}$ 的所有多極矩；各向同性天空使用單位高斯實係數（功率 $C_\ell$ 在軸中相消）。
meanings:
- 像素方向、溫度和立體角，可來自任何 lon/lat/T CSV
- 每個像素上的實球諧函數；$a$ 遍歷所有 $(\ell, m)$
- 加權最小平方：一次擬合所有多極矩，彼此之間沒有混疊
- 複數係數，滿足 $a_{\ell,-m} = (-1)^m a^*_{\ell m}$
- 自旋 $\ell$ 矩陣，$[L_x, L_y] = iL_z$，$L_iL_i = \ell(\ell+1)$
- 對 $m, n, k$ 求和：在 $z \parallel \hat n$ 的座標系中 $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$
- 批次 eigh：多極矩最「扁平」所環繞的軸
- 對 $i$ 求和：天空 $s$ 中兩軸的對齊程度（軸沒有正反方向）
- 相對於各向同性高斯天空的蒙地卡羅 $p$ 值
labels:
  n_skies: 各向同性隨機天空數 $K$
  lmax_fit: 一起擬合的多極矩 $\ell_\mathrm{fit}$
  seed: 隨機種子
