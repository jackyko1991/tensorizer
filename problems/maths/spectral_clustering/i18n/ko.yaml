source_hash: 4a434cf0af06
title: 스펙트럴 군집화와 그래프 라플라시안
summary: 점 구름을 그래프로 바꾸고($k$-최근접 이웃 간선에 가우시안 가중치), 그래프 라플라시안 $L = D - W$와 정규화된 형태 $L_{sym}$을 텐서로 만든 뒤, 가장 낮은 고유 벡터에서 군집을 읽어 낸다. 일반 k-평균이 실패하는 두 개의 반달과 동심원 고리가 완벽하게 분리되며, 같은 라플라시안을 격자에 쓰면 북의 진동 모드가 나온다.
notes: '작동하는 이유: $f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$는 제곱의 합이므로 $L$은 양의 준정부호이며, $f$가 모든 간선을 따라 일정할 때, 즉 각 연결 성분에서 일정할 때만 0이다. 따라서 고유값 0의 개수는 정확히 연결 성분의 개수이며(터미널의 두 개수를 비교해 보자), 성분들의 지시 벡터가 그 고유 공간을 생성한다. 군집이 약한 간선 몇 개로만 이어져 있으면 고유값은 0 대신 작은 값이 되고 고유 벡터는 지시 벡터에 가깝다. $f^{\mathsf T}Lf$의 최소화는 가장 적은 간선을 자르는 문제의 완화된 형태, Shi와 Malik(2000)의 정규화 절단이다. 두 번째 고유 벡터(피들러 벡터)는 가장 좋은 이분할을 준다. 일반 k-평균은 중심 주위로 직선 경계를 그리므로 반달과 고리를 반으로 자른다. 임베딩(위쪽 행, 점이 미끄러지는 것을 보자)에서는 군집이 분리된 덩어리가 되어 k-평균이 작동한다. $k$번째 고유값 뒤의 스펙트럼에 있는 큰 간격은 군집 수에 대한 힌트이다. $g\times g$ 격자 그래프에서 $L = L_1\otimes I + I\otimes L_1$은 자유(노이만) 경계를 갖는 이산 라플라시안에 음의 부호를 붙인 것이므로, 고유 벡터는 정상파 $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$이고 $\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$이다. 이는 파동 주제의 진동하는 북과 같은 모드이다(그쪽은 고정 경계이지만). 모드 $(a, b)$와 $(b, a)$는 고유값을 공유하며 eigh는 그 쌍의 어떤 혼합을 돌려주므로, 일부는 대각선 모양으로 보인다. 결과는 $\sigma$와 $k$에 의존한다. 이웃이 너무 적으면 군집이 여러 조각으로 갈라지고, 너무 많으면 군집 사이에 다리가 생긴다. 더 읽을거리: U. von Luxburg,
  A tutorial on spectral clustering (2007); Ng, Jordan and Weiss (2001).'
meanings:
- '점 $i$, 좌표 $a$: 두 반달, 두 고리 또는 세 덩어리, 채점용 실제 레이블 포함'
- '반복된 $a$ ⇒ 합산: 모든 거리 제곱을 한꺼번에'
- $j$가 $i$의 $k$-최근접 이웃이거나 그 반대일 때만 남기는 가우시안 유사도; 대칭, 대각은 0
- '반복된 $j$ ⇒ 합산: 각 점의 차수'
- 모든 행의 합이 0이므로 상수 벡터의 고유값은 0
- $s_i = d_i^{-1/2}$; 합 없음, $i$와 $j$는 자유 첨자
- 고유값은 오름차순; 행을 단위 길이로 스케일한 처음 $k$개 고유 벡터가 스펙트럴 임베딩
- k-means++ 초기화를 쓴 로이드 반복; 임베딩에서 군집은 조밀한 덩어리
labels:
  n_points: 데이터셋당 점 수 $N$
  noise: 잡음
  k_neighbours: 최근접 이웃 수 $k$
  sigma: 커널 폭 $\sigma$
  grid: 격자 그래프 한 변 $g$
