title: Вращение твёрдого тела (эффект Джанибекова)
summary: Уравнения Эйлера для бруска без внешних моментов, записанные через тензор инерции $I_{ij}$ и тензор Леви-Чивиты $\varepsilon_{ijk}$. Вращение вокруг самой длинной или самой короткой оси устойчиво; вращение вокруг промежуточной оси раз за разом переворачивается (эффект Джанибекова).
notes: Без внешнего момента сохраняются и энергия $\tfrac12\boldsymbol\omega\cdot I\boldsymbol\omega$, и модуль $\mathbf L = I\boldsymbol\omega$, поэтому $\boldsymbol\omega$ движется по пересечению эллипсоида постоянной энергии и сферы постоянного $\lvert\mathbf L\rvert$ (в пространстве $\mathbf L$). Вблизи большой и малой осей эти кривые — маленькие петли, и вращение устойчиво; вблизи промежуточной оси они проходят через седло, так что малое покачивание нарастает, и брусок переворачивается, а затем возвращается. Момент импульса в лабораторной системе $RI\boldsymbol\omega$ (неподвижная стрелка) не меняется. Параметры $a, b, c$ упорядочены так, что $a \ge b \ge c$.
meanings:
- тензор инерции сплошного бруска, $(M/12)\operatorname{diag}(b^2+c^2,\ a^2+c^2,\ a^2+b^2)$
- угловая скорость в компонентах связанной с телом системы
- 'тензор Леви-Чивиты: векторное произведение как тензор'
- 'суммирование по $j, k, l$: $\boldsymbol\omega\times(I\boldsymbol\omega)$'
- решение $I_{ij}\dot\omega_j = -\varepsilon_{ijk}\omega_j I_{kl}\omega_l$
- 'ориентация: матрица поворота тело → лабораторная система'
- кинетическая энергия вращения, сохраняется
