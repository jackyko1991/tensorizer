source_hash: a93d458517c4
title: 康奈尔盒的蒙特卡罗路径追踪
summary: 照片级真实感渲染用蒙特卡罗方法求解渲染方程。所有采样的所有相机光线作为一个批次，在由平面和球体组成的盒子里追踪：余弦加权的反弹，每次命中时向面光源发射一条阴影光线，并用俄罗斯轮盘赌终止路径。观察噪声按 $1/\sqrt{N}$ 下降，以及红墙和绿墙把颜色渗到白墙上——这只有全局光照才能捕捉到。
notes: 对漫反射（朗伯）表面，渲染方程说：离开一点的光等于它的自发光加上所有入射光中被反射的比例 $\rho$。而入射光又是其他表面的出射光，所以这个积分是递归的。路径追踪器用随机路径来代替它。余弦加权采样（$p = \cos\theta/\pi$）把 BRDF 和余弦项相互抵消，于是每次反弹吞吐量只乘上一个因子 $\rho$。每次命中时，向光源上一个随机点发射的阴影光线加入直接光照（下一事件估计），这比等待某次反弹碰巧击中小光源的噪声小得多。只取第一次命中的光就得到仅直接光照的图像。之后的每次反弹都加入间接光：阴影中柔和的补光、更亮的天花板，以及红色和绿色的渗色。测试套件中的熔炉测试检验了这个估计器。一个所有墙壁都发出 $L_e$ 并反射 $\rho$ 的封闭盒子，各处的辐亮度必须为 $L_e/(1-\rho)$。使用余弦采样时，这个结果的方差为零。误差按 $1/\sqrt N$ 下降，因为每个像素是 $N$ 个独立采样的平均值。噪声减半需要四倍的采样，这就是为什么生产级渲染器要使用降噪器。
meanings:
- 光线 $r = (s, p)$ 的起点和方向：$P$ 个像素中每个都有 $N$ 个抖动采样，作为一个批次
- 平面 $p$ 为 $n_{pi} x_i = d_p$，并裁剪到一个包围盒；光源是一块小平面
- 每条光线到每个平面的距离；重复的 $i$、$j$ ⇒ 求和
- 对每条光线和每个球体求 $\lvert o + t\omega - c\rvert^2 = r^2$ 的根
- 每条光线上最近的命中：哪个图元、在哪里，以及其法线
- 下一个方向：圆盘内的均匀点抬升到半球上；$f\cos\theta/p = \rho$
- 路径吞吐量：第 $k$ 次反弹处找到的光有多少到达相机
- 下一事件估计：向面光源上随机点 $y$ 发射一条阴影光线
- 俄罗斯轮盘赌：随机终止较暗的路径，但对存活的路径重新加权，使均值不变
- 像素颜色：对采样索引 $s$ 取平均
labels:
  resolution: 图像尺寸
  spp: 每像素采样数 $N$
  reference_spp: 参考图每像素采样数
  bounces: 反弹次数（轮盘赌之前）
  termination: 路径终止方式
  light_power: 光源辐亮度 $L_e$
