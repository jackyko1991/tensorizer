source_hash: 8944aa9bc162
title: 로렌츠 끌개와 나비 효과
summary: 대류 모형에서 나온 세 개의 연립 방정식은 결코 멈추지도 반복되지도 않습니다. 선형 부분 $A_{ij}x_j$와 3차 텐서를 쓴 이차 부분 $Q_{ijk}x_j x_k$의 합으로 쓰면, 서로 $10^{-6}$ 이내에서 출발한 궤적 묶음 전체를 하나의 einsum으로 진행시킬 수 있습니다. 궤적들은 최대 랴푸노프 지수 $\lambda \approx 0.9$가 정하는 속도로 지수적으로 벌어져, 결국 나비 전체에 퍼집니다.
notes: 로렌츠(1963)는 아래에서 가열되는 유체 모형을 세 개의 수로 줄였습니다. $x$는 대류 롤의 세기, $y$와 $z$는 온도 분포를 나타냅니다. $\sigma = 10$, $\rho = 28$, $\beta = 8/3$일 때 운동은 두 고정점 $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$ 중 하나의 둘레를 돌다가 예측할 수 없이 다른 날개로 건너뜁니다. 가까운 궤적들은 $e^{\lambda t}$($\lambda \approx 0.906$)처럼 멀어집니다. $10^{-6}$의 오차가 약 $15$ 시간 단위 뒤에는 끌개 크기만큼 자라므로, 예보에는 한계가 있습니다(나비 효과). 동시에 모든 상태 부피는 $e^{-(\sigma+1+\beta)t}$처럼 줄어들어, 궤적들은 얇은 프랙털 집합, 곧 기묘한 끌개 위로 모입니다. 텐서 형식은 구조를 분명하게 보여 줍니다. $A$는 모든 선형 결합을 담고, 비선형성 전체는 $Q$의 두 성분입니다. 계산 전에 $(1, 1, 1)$에서 출발한 궤적 하나를 $10$ 시간 단위 동안 적분해, 공이 끌개 위에서 출발하도록 합니다. 여기서는 고정 스텝 $0.005$의 RK4로 충분히 정확합니다. $\rho < 1$을 시도해 보세요. 원점이 안정해져 모든 궤적이 그곳으로 감쇠합니다. $1 < \rho < 24.74$에서는 $C_+$ 또는 $C_-$로 나선을 그리며 빠져들고, $\rho = 28$ 근처와 그 이상에서는 혼돈이 돌아옵니다.
meanings:
- 궤적 $b$의 상태 $(x, y, z)$
- '선형 부분: 행 $(-\sigma, \sigma, 0)$, $(\rho, -1, 0)$, $(0, 0, -\beta)$'
- '이차 부분, 0이 아닌 성분이 두 개인 3차 텐서: $\dot y$의 $-xz$와 $\dot z$의 $+xy$'
- 반복된 $j$ ⇒ 합
- '반복된 $j$와 $k$ ⇒ 합: 혼돈을 만드는 비선형성'
- '야코비 행렬의 대각합: 상태 부피는 일정한 비율 $\sigma + 1 + \beta$로 줄어듦'
- 궤적들이 평균에서 떨어진 제곱평균제곱근 거리
- 퍼짐이 $10\,s(0)$에서 $1$로 커지는 동안 $t$에 대한 $\ln s$의 기울기
labels:
  sigma: 프란틀 수 $\sigma$
  rho: 레일리 수 $\rho$
  beta: 기하 인자 $\beta$
  t_max: 시뮬레이션 시간
  log10_radius: 초기 공의 반지름 $\log_{10} r$
  n_traj: 궤적 수
