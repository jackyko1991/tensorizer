source_hash: 7f418c1e4166
title: 四種理想氣體過程
summary: 同一份氣體從同一狀態出發，沿課本上的四條路徑變化：等溫、等壓、等容與絕熱。四條路徑是一個 (過程, 點, 2) 的 $(V, p)$ 取樣張量，功是 torch.trapezoid 求得的各曲線下面積，再由第一定律轉為熱。
notes: 起始：1 mol、300 K、10 公升。等溫、等壓與絕熱路徑膨脹到相同的最終體積；等容路徑保持 $V$ 不變，加熱氣體直到壓力增加相同的比例。因為等容線上 $dV = 0$，torch.trapezoid 在那裡給出恰好為零的功。在等溫線上 $\Delta U = 0$，所以 $Q = W$；在絕熱線上 $Q = 0$，所以氣體以內能支付所作的功而冷卻。右側長條是以 torch.cumulative_trapezoid 計算的累計值。
meanings:
- 過程 $c$（等溫、等壓、等容、絕熱）上的第 $k$ 個取樣點
- 理想氣體定律，對整個張量逐元素計算
- 重複的 $k$ ⇒ 求和：氣體在各路徑上所作的功
- 內能只依賴溫度
- 熱力學第一定律：加給氣體的熱
labels:
  ratio: 膨脹比 $V_2/V_1$
  T0: 起始溫度
  n: 氣體量
  gas: 氣體
