source_hash: 66c98bbdd023
title: ニュートンの冷却の法則
summary: 熱いコーヒーカップの列が室温に向かって冷えていく。各カップはそれぞれ初期温度と冷却定数をもつが、すべて1つのテンソルに入っているので、PyTorch の1行ですべてのカップが一度に進む——そして結果は指数関数解と一致する。
notes: この法則は、冷却の速さが室温との温度差に比例することを述べる。したがって温度差は等しい時間に同じ割合で縮む：初期温度によらず $t_{1/2} = \ln 2/k$ ごとに半分になる。常微分方程式はルンゲ–クッタ法（RK4）で数値的に解き、破線は比較のための厳密な指数関数を示す。実際のカップは対流、放射、蒸発で同時に冷える。$k$ はそれらすべてを1つの数にまとめたものである。
meanings:
- カップ $b$ の温度（°C）
- カップ $b$ の冷却定数（1/min）：大きいほど速く冷える
- 室温、すべてのカップにブロードキャスト
- 要素ごと：和をとる添字はなく、各カップは独立に冷える
- 外積：厳密解のための、すべての時刻とすべてのカップの組
- 温度差が半分になる時間
labels:
  n_cups: カップ数
  T_env: 室温
  k_min: 最も遅い冷却 $k$
  k_max: 最も速い冷却 $k$
  t_max: シミュレーション時間
