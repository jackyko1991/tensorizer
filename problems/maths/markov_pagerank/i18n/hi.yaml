title: मार्कोव शृंखलाएँ और PageRank
summary: एक यादृच्छिक सर्फ़र एक छोटे कृत्रिम वेब पर लिंक क्लिक करता है और कभी-कभी किसी यादृच्छिक पृष्ठ पर कूद जाता है। हर पृष्ठ पर होने की प्रायिकता प्रति क्लिक एक आव्यूह–सदिश गुणनफल से विकसित होती है, और इसका स्थिर वितरण PageRank है, जो यहाँ घात पुनरावृत्ति (power iteration), आइगेन-वियोजन और एक साथ हज़ारों अनुकरित सर्फ़रों द्वारा पाया जाता है।
notes: '$S$ स्तंभ-प्रसंभाव्य (column-stochastic) है, इसलिए यह प्रायिकता सदिशों को प्रायिकता सदिशों पर प्रतिचित्रित करता है, पर एक वेब ग्राफ़ में बिना बाहरी लिंक वाले पृष्ठ और सर्फ़र को फँसाने वाले पृष्ठ-समूह होते हैं। लटकते (dangling) पृष्ठों को एकसमान स्तंभ दिया जाता है (सर्फ़र कोई यादृच्छिक पता टाइप करता है), और टेलीपोर्ट पद $G$ की हर प्रविष्टि को धनात्मक बनाता है। पेरॉन–फ़्रोबेनियस प्रमेय से तब स्थिर वितरण अद्वितीय, धनात्मक और किसी भी आरंभ से प्राप्य है। $G$ का हर अन्य आइगेनमान $S$ के किसी आइगेनमान का $d$ गुना है, इसलिए $|\lambda_2| \le d$ और घात पुनरावृत्ति कम-से-कम $d^k$ जितनी तेज़ी से अभिसरित होती है। दायाँ पैनल एक साथ हल किए गए अवमंदन गुणकों का बैच दिखाता है। $d = 0.85$ (Brin और Page, 1998 द्वारा सुझाया गया मान) के साथ 50 चरण त्रुटि को कम-से-कम $0.85^{50} \approx 3\times10^{-4}$ गुना घटाते हैं, वेब का आकार चाहे जो हो। सर्फ़र उसी शृंखला का मोंटे कार्लो अनुमान हैं: उनके अंश $1/\sqrt W$ कोटि के रव तक $\mathbf x_k$ का अनुसरण करते हैं, और समय पर औसत लेने से ऐसी रैंक मिलती हैं जो घात पुनरावृत्ति
  से मेल खाती हैं। लटकते पृष्ठों का सुधार हटाने पर प्रायिकता रिसकर निकल जाती है, जैसा टर्मिनल दिखाता है। $d \to 1$ आज़माएँ और देखें कि अभिसरण धीमा होता है और रैंक पृष्ठों के बंद समूहों में जमा हो जाती हैं।'
meanings:
- 'यदि पृष्ठ $j$ पृष्ठ $i$ से लिंक करता है तो 1: स्तंभ वे पृष्ठ हैं जिन्हें सर्फ़र छोड़ता है'
- '$i$ पर योग: पृष्ठ $j$ के बाहरी लिंकों की संख्या'
- कोई यादृच्छिक लिंक क्लिक करें; लटकते पृष्ठ ($d_j = 0$) को एकसमान स्तंभ $1/N$ मिलता है
- अवमंदन गुणकों $d_b$ के बैच के लिए Google आव्यूह; $1 - d$ टेलीपोर्ट प्रायिकता है
- 'दोहराया गया $j$ ⇒ योग: हर $d_b$ के लिए एक साथ एक घात-पुनरावृत्ति चरण'
- आइगेनमान 1 का आइगेनसदिश, योग 1 होने तक स्केल किया गया; $G$ सममित नहीं है, इसलिए eigh के बजाय eig
- 'दूसरा सबसे बड़ा आइगेनमान मापांक: त्रुटि प्रति चरण इस गुणक से घटती है, और $|\lambda_2| \le d$'
- '$W$ सर्फ़रों में से हर एक का पृष्ठ: प्रायिकता $d$ से लिंक का अनुसरण, अन्यथा टेलीपोर्ट'
labels:
  damping: अवमंदन गुणक $d$
  pages: पृष्ठ $N$
  dangling: लटकते पृष्ठ
  walkers: यादृच्छिक सर्फ़र $W$
  iterations: चरण
  seed: ग्राफ़ बीज (seed)
