source_hash: 8da6dcc23206
title: 位置权重矩阵：基序标识图与扫描
summary: 把转录因子已比对的结合位点计数成 $(m, 4)$ 矩阵，加上伪计数转为频率，再相对背景转为对数几率分数。信息量给出序列标识图，而对展开窗口的一次 einsum 可同时为一条长序列的两条链打分；命中以从序列打乱副本得到的 p 值判定。
notes: PWM 假设结合位点的每个位置独立贡献，因此窗口的分数是每个字母一个数之和：独热窗口与 $W$ 的内积。伪计数 $\beta$ 防止在少数训练位点中从未出现的字母得到 $-\infty$ 的分数；位点越多，它就越不重要。一列的信息量表示基序在该处把字母限定到什么程度，从 0 比特（任意字母）到 2 比特（总是同一个字母），标识图按 $P_{ja}$ 的比例堆叠字母。这里的位点是合成的：12 bp，核心类似 TATA 盒（共有序列 TATAWAWR，W = A 或 T，R = A 或 G），两侧各有两个固定字母，使基序携带足够的比特以便被找到。仅有一个短的简并基序时信息太少：在长序列中，随机窗口的得分和真实位点一样高，这就是为什么仅凭 PWM 很难找到真实的 TATA 盒。p 值来自扫描序列的打乱副本（字母相同，没有基序）；共有 $2(L-m+1)$ 个窗口时，阈值 $p$ 会放过约 $2(L-m+1)\,p$ 个随机命中，可分辨的最小 p 值为 $1/(1 + \#\text{null scores})$。试试更少的训练位点、更弱的基序或更宽松的阈值，看植入的位点如何丢失或出现假命中。
meanings:
- 训练位点 $s$、列 $j$、字母 $a$ ∈ (A, C, G, T)
- 重复的 $s$ ⇒ 求和：每列的字母计数
- 带伪计数 $\beta$ 的频率；每行之和为 1，且没有为 0 的元素
- 相对背景 $q_a$ 的对数几率（比特）：> 0 为偏好，< 0 为回避
- 重复的 $a$ ⇒ 求和：每列的比特数，在均匀背景下介于 0 与 2 之间；即标识图的高度
- $t = 0$ 为正链，$t = 1$ 为反向互补链（列反转，A↔T，C↔G）
- 长序列中每个 $m$ 个字母的窗口
- 重复的 $j$、$a$ ⇒ 求和：一次调用处理两条链；同样的代码为所有打乱副本 $(R, 2, L-m+1)$ 打分
- 打乱序列中得分至少一样高的比例
labels:
  n_train: 训练位点数 $N$
  strength: 基序强度（共有碱基的概率）
  pseudo: 伪计数 $\beta$
  length: 序列长度 $L$
  n_sites: 植入位点数
  log10_p: p 值阈值 $\log_{10} p$
  shuffles: 打乱序列数 $R$
  seed: 随机种子
