source_hash: cb188a4168d9
title: レナード–ジョーンズ流体：分子動力学と動径分布関数
summary: 周期境界の箱の中でレナード–ジョーンズポテンシャルにより相互作用する 500 個の原子を、速度ベルレ法で積分する。すべての対ベクトルは最小像規約のもとで一つのブロードキャストテンソルに収まり、三つの状態点（気体、三重点付近の液体、圧縮された固体）を一つのバッチとして実行する。ベレンゼン熱浴で温度を設定し、エネルギーを保存する NVE 計算を続け、対距離のヒストグラムから $g(r)$ を得る：気体では平坦、液体では減衰する殻、固体では鋭い格子のピーク。ビリアルから圧力が得られる。
notes: 換算単位：長さは $\sigma$、エネルギーは $\varepsilon$、質量は 1、$T^* = k_BT/\varepsilon$、時間は $\tau = \sigma\sqrt{m/\varepsilon}$。アルゴンでは $\sigma = 3.4$ Å、$\varepsilon/k_B = 120$ K なので、液体の状態点は約 86 K である。これは Rahman が 1964 年に液体アルゴンについて行ったシミュレーション（Phys. Rev. 136, A405）に、Verlet が 1967 年に導入した積分法と $g(r)$ 解析（Phys. Rev. 159, 98）を組み合わせたものである。ポテンシャルは $r_c = 2.5\sigma$ で切断し、そこでゼロになるようシフトしてエネルギーを連続にする。圧力には標準的な裾補正 $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$ を加える。これはカットオフより先で $g = 1$ と仮定している。ベレンゼン熱浴は速度を目標温度に向けてスケーリングするが、厳密なカノニカルゆらぎを生まないので平衡化にのみ使い、測定は素の NVE 計算から行う。そこでは平坦なエネルギーの推移が積分法のチェックになる。気体と液体は格子が融けるよう高温から始める。液体の $g(r)$ の第一ピークはポテンシャルの極小 $2^{1/6}\sigma$ 付近にあり、その後の殻は減衰し、約 $3\sigma$ で $g \to 1$ となる。固体は fcc のピークを保つ。気体では圧力を理想気体と、第二ビリアル補正 $P = \rho T(1 + B_2\rho)$（$B_2$ は数値積分）と比較する。計算は短い（数 $\tau$）ので、平均には数パーセントの統計ノイズが含まれる。完全な対テンソルはステップあたり $O(N^2)$ のコストがかかる。実用コードはセルリストや近接リストを使って数百万原子に到達する。
meanings:
- 換算単位で気体 $(0.05, 1.5)$、液体 $(0.84, 0.72)$、固体 $(1.10, 0.60)$
- fcc 格子から開始、$N = 4n^3$ 原子、箱 $L_s = (N/\rho_s)^{1/3}$
- ブロードキャストですべての対ベクトルを一度に求め、最も近い像に折り返す
- $a$ の繰り返し ⇒ 和
- $-u^{\prime}(r)/r$、対角上と $r_c = 2.5\sigma$ より先ではゼロ
- $j$ の繰り返し ⇒ 和；$d_{saji} = -d_{saij}$ によりニュートンの第三法則が自動的に成り立つ
- 半キック、ドリフト（箱に折り返す）、新しい力、半キック：時間反転可能でエネルギーを保存する
- 平衡化の間だけのベレンゼン熱浴
- $\rho T + W/3V$ に $r_c$ より先の対に対する裾補正を加える
- 殻ごとの対の数を理想気体の数 $\tfrac12 N\rho\,4\pi r^2\Delta r$ で割る
labels:
  rho_liquid: 液体の密度 $\rho^*$
  T_liquid: 液体の温度 $T^*$
  n_cells: 一辺あたりの fcc セル数（$N = 4n^3$）
  dt: 時間刻み $\Delta t$
  equilibration_steps: 平衡化ステップ数
  production_steps: 本計算ステップ数
