source_hash: 673b0fc9f634
title: 이상 기체의 분자 운동론
summary: 수백 개의 단단한 원판이 상자 안에서 튀어 다닙니다. 모든 원판이 같은 속력으로 출발하지만 탄성 충돌이 에너지를 섞어 속력이 맥스웰–볼츠만 분포를 따르게 되고, 원판들이 벽에 전달하는 운동량은 이상 기체 법칙 $PA = NkT$를 재현합니다.
notes: '환산 단위: 상자 한 변 1, 질량 1, 볼츠만 상수 1. 쌍 텐서는 $N\times N$으로, 원판 수백 개에는 문제없습니다(실제 코드는 셀 목록을 씁니다). 같은 단계에서 다른 두 원판과 닿는 원판은 한 단계 기다리므로, 모든 충돌은 깔끔한 2체 교환이고 에너지는 반올림 오차 수준까지 보존됩니다. 압력은 충돌마다 전달되는 운동량 $2m\lvert v_\perp\rvert$를 실행 동안 합하고 시간 × 벽 길이로 나눈 것입니다. 원판 자체가 넓이를 차지하므로 $NkT/A$보다 몇 % 높게 나옵니다. 이상 기체에 대한 첫 번째 보정으로, 넓이 비율 $\eta$에 대해 대략 $(1 + \eta^2/8)/(1 - \eta)^2$입니다.'
meanings:
- 원판 $a$의 위치, 성분 $i \in \{x, y\}$
- 원판 $a$의 속도
- 브로드캐스팅으로 모든 쌍의 변위를 한 번에
- '반복된 $i$ ⇒ 합: 모든 쌍의 거리 제곱'
- 충돌하는 $P$개 쌍에 대해, 충돌 법선에 사영한 상대 속도
- 전체 운동 에너지, 2차원에서 $NkT$와 같음
- 2차원 속력 분포 $(mv/kT)\exp(-mv^2/2kT)$
labels:
  n_particles: 입자 수
  radius: 원판 반지름
  speed: 처음 속력
  t_max: 시뮬레이션 시간
