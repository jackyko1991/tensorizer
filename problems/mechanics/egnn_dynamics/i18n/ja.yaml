source_hash: 95b6effde453
title: 粒子ダイナミクスのための E(n) 同変グラフニューラルネットワーク
summary: 小さな E(n) 同変グラフニューラルネットワーク（EGNN）が、荷電粒子からなる 3D 系を時間的に一歩進めることを学習する。そのメッセージは距離 $|\mathbf x_i - \mathbf x_j|^2$ だけに依存し、座標の更新は $\mathbf x_i - \mathbf x_j$ の方向を向くので、入力を回転すると予測も厳密に回転する。同じデータで学習した単純な MLP はこれを学習しなければならず、実際には学習できない。
notes: 真の系：電荷 $c_i = \pm 1$ をもつ単位質量の $N$ 個の粒子で、軟化したクーロン力と、すべての組の間の弱いばね $k_s$（雲がまとまったままになるように）が働き、ステップ $\Delta t / 10$ の RK4 で積分する。両ネットワークは少数のランダムな系から同じ組（時刻 $t$ の状態、時刻 $t + \Delta t$ の状態）を見て、平均二乗誤差について Adam で訓練される。訓練に使わない系がテスト誤差を与える。EGNN（Satorras, Hoogeboom & Welling, "E(n) Equivariant Graph Neural Networks", ICML 2021）は、不変な入力（ノード特徴、$d_{ij} = |\mathbf x_i - \mathbf x_j|^2$、電荷の積）だけから各組のメッセージ $m_{ij}$ を作り、学習したスカラー重みで各粒子を方向 $\mathbf x_i - \mathbf x_j$ に沿って動かす。これが真の力の法則 $\ddot{\mathbf x}_i = \sum_j w_{ij}(\mathbf x_i - \mathbf x_j)$ とまったく同じ形であることに注意しよう：対称性はデータから学習されるのではなく、アーキテクチャに組み込まれている。検証では、テスト入力をランダムな $R$ と $\mathbf s$ で回転・平行移動する：EGNN では $f(R\mathbf x + \mathbf s) = Rf(\mathbf x) + \mathbf s$ が float32 の丸め誤差（約 $10^{-6}$）の範囲で成り立つが、平坦化した座標を見る MLP では、ずれが予測そのものと同程度の大きさになる。訓練系が少ないとき、EGNN ははるかに少ない重みでより低いテスト誤差に達する。ロールアウトでは各モデルに自身の予測を入力する。荷電系はカオス的なので誤差はどちらでも累積するが、EGNN のほうが長く近い状態を保つ。単純化：幅 32 の 3 層、$\tau = \Delta t / L$ とした EGNN の速度版（我々の選択）、フルバッチ訓練と固定シード。同じ同変メッセージパッシングの考え方は、NequIP（Batzner et al., Nature
  Communications 2022）のような機械学習原子間ポテンシャルや、3D 分子を生成する同変拡散モデル（Hoogeboom et al., ICML 2022）の基礎になっている。訓練系を減らしてみよう：二つのネットワークの差が広がる。
meanings:
- 系 $b$ の粒子 $i$ の位置と速度、デカルト成分 $a$
- ブロードキャストによるすべての組の相対位置
- $a$ の繰り返し ⇒ 和：距離の二乗。MLP への唯一の幾何学的入力（回転不変）
- 真の力：$j$ の繰り返し ⇒ 相手について和（クーロン力とばね）
- 各組上のメッセージ、$H = 32$ 個の特徴
- 座標の更新：$j$ の繰り返し ⇒ 和。$\mathbf x_i - \mathbf x_j$ だけから作ったベクトルなので、入力とともに回転する
- 不変スカラーとベクトルの積：依然として同変
- 同変性の検証に使うランダムな回転
labels:
  n_particles: 粒子数 $N$
  n_train: 訓練系の数
  dt: モデルの時間ステップ $\Delta t$
  n_iter: 訓練反復回数
  lr: Adam の学習率
  rollout_steps: ロールアウトのステップ数
