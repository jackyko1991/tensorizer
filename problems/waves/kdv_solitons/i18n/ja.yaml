source_hash: faa64f98c4b2
title: KdV ソリトンの衝突
summary: コルテヴェーク–ド・フリース方程式の2つの孤立波。高い方が速く、追いつき、衝突後も両者とも形を保ったまま、位置がずれるだけで現れる。微分はフーリエ空間でとり（$\partial_x \to ik$）、硬い $u_{xxx}$ 項は積分因子で厳密に、残りは RK4 で解く。
notes: 規約：$u_t + 6uu_x + u_{xxx} = 0$。この方程式の速さ $c$ のソリトンは高さ $c/2$ をもつ、すなわち振幅の2倍の速さで進む。高いほど速く、幅が狭い。衝突後、高いソリトンは相互作用がなかった場合より前方に、低いソリトンは後方にある。$\kappa = \sqrt c/2$ として、厳密なずれは前方へ $\frac{1}{\kappa_1}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$、後方へ $\frac{1}{\kappa_2}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ である。点線：ソリトンが互いを無視した場合の位置。箱は周期的（長さ 100）なので、長時間走らせると回り込む。FFT はあらゆる微分を掛け算に変え、積分因子は $u_{xxx}$ による厳しい時間刻みの制限を取り除き、非線形項によるより緩い制限だけが残る。
meanings:
- 周期格子上の波の高さ（float64）
- フーリエ係数；$\partial_x \to ik$、$\partial_x^3 \to -ik^3$
- 実空間で計算した非線形項 $(u^2)$、上位3分の1のモードを除去（2/3 則）
- 1ステップにわたる分散部分の厳密解（積分因子）
- 保存量：$\int u\,dx$ と $\int u^2\,dx$
labels:
  c_tall: 高いソリトンの速さ $c_1$
  c_short: 低いソリトンの速さ $c_2$
  t_max: シミュレーション時間
