source_hash: c221614fc472
title: 黑洞附近的麵條化
summary: 一圈粒子落向恆星質量黑洞。環上各處的重力差就是潮汐張量 $T_{ij} = -\partial_i\partial_j\Phi$，分別由公式與 autograd Hessian 計算。它沿徑向拉伸圓環（$+2GM/r^3$），並在橫向擠壓（兩個 $-GM/r^3$）：這就是麵條化，在潮汐半徑內會把真實物體撕裂。
notes: 單位：$G = c = 1$，長度以 $GM/c^2$ 計，因此視界位於 $r_s = 2$（10 倍太陽質量的黑洞為 30 km）。環上粒子彼此不互相吸引：藍點遵循精確的牛頓重力，紅色曲線遵循線性定律 $\ddot\xi_i = T_{ij}\xi_j$，兩者一致，直到圓環相對於 $r$ 不再算小。橙色圓標示一個與圓環同樣大小、質量為 $m$、靠自身重力維繫的物體會被撕裂的位置。對恆星質量黑洞，這個半徑遠在視界之外，因此落入的恆星（或太空人）在穿越視界前就被撕碎；對超大質量黑洞，它則可能位於視界之內。此處的重力是牛頓式的；值得注意的是，在廣義相對論中徑向下落觀測者的潮汐張量恰好有相同的特徵值 $(2, -1, -1)\,GM/r^3$。模擬在抵達視界前停止。
meanings:
- 圓環中心的位置（黑洞位於原點）
- 環上粒子 $b$ 相對中心的位移
- 外積，沒有指標被求和
- 由公式得到的潮汐張量
- 以 autograd Hessian 得到的同一張量
- 重複的 $j$ ⇒ 求和：線性潮汐加速度
- 在真空中 $= -\nabla^2\Phi = 0$
- 自重力物體的潮汐（洛希）半徑
labels:
  r0: 起始距離
  r_stop: 停止下落的位置
  ring_radius: 圓環半徑
  n_particles: 環上粒子數
  mass_ratio: 用於 $r_t$ 的物體質量 $m/M$
  n_steps: RK4 步數
