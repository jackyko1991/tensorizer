title: बेलौसोव–झाबोटिंस्की दोलक (ओरेगोनेटर)
summary: ब्रोमेट, मैलोनिक अम्ल और सीरियम उत्प्रेरक का एक हिलाया गया बीकर घड़ी की तरह रंग बदलता है। स्केल किया गया दो-चर ओरेगोनेटर एक दृढ़ (stiff) ODE है; एक धनात्मक उत्पादन–क्षय (Patankar) चरण रससमीकरणमितीय गुणकों $f$ के पूरे बैच को एक साथ समाकलित करता है, जैकोबियन का अनुरेख (trace) उन दो हॉप्फ़ द्विशाखन (Hopf bifurcation) बिंदुओं को खोजता है जो दोलनों को सीमित करते हैं, और विसरण के साथ वही गतिकी एक टूटी तरंग को घूमते सर्पिल में बदल देती है।
notes: 'बेलौसोव–झाबोटिंस्की अभिक्रिया (1950 के दशक में Belousov द्वारा खोजी गई, 1972 में Field, Kőrös और Noyes द्वारा समझाई गई) ब्रोमेट से मैलोनिक अम्ल का ऑक्सीकरण करती है। ब्रोमाइड आयन $\mathrm{HBrO_2}$ के स्वउत्प्रेरकीय उत्पादन को रोकते हैं; जब तक ब्रोमाइड मौजूद है अभिक्रिया रेंगती है, उसके ख़त्म होते ही $\mathrm{HBrO_2}$ विस्फोटक रूप से बढ़ता है और उत्प्रेरक का ऑक्सीकरण करता है (रंग परिवर्तन), और ऑक्सीकृत उत्प्रेरक फिर नया ब्रोमाइड बनाता है, जो इस उछाल को बंद कर देता है। ओरेगोनेटर इसे कुछ चरणों में, और स्केलिंग तथा तेज़ ब्रोमाइड को हटाने के बाद दो समीकरणों में संक्षिप्त करता है। स्थिरांक $\varepsilon \approx 0.04$ और $q \approx 8\times10^{-4}$ Field–Kőrös–Noyes दर स्थिरांकों के फ़िट से अनुमानित मान हैं; नुस्ख़े भिन्न होते हैं और प्रकाशित मान भी। चूँकि $\varepsilon$ और $q$ छोटे हैं, $x$ समीकरण दृढ़ है: $x$ लगभग $\varepsilon$ कोटि के समय में लगभग हज़ार गुना उछलता है, फिर अपनी नलक्लाइन (nullcline) की एक शाखा पर रेंगता है। साधारण RK4 को स्थिर रहने के लिए लगभग $5\times10^{-4}$ के चरण चाहिए;
  $\varepsilon\dot x$ को उत्पादन घटा क्षय के रूप में लिखकर और क्षय को अंतर्निहित (implicit) रूप से लेकर $x$ किसी भी चरण पर धनात्मक रहता है, और $\Delta t = 2\times10^{-3}$ आवर्तकाल को 1 % से बेहतर सटीकता से देता है। स्थायी अवस्था (दो नलक्लाइनों का प्रतिच्छेद) तब स्थिर है जब वह N-आकार के $\dot x = 0$ वक्र की किसी बाहरी शाखा पर हो, और मध्य शाखा पर अस्थिर, जहाँ एक सीमा चक्र (limit cycle) उसे घेरता है; $J$ का अनुरेख दो हॉप्फ़ बिंदुओं पर चिह्न बदलता है, छोटे $q$ के लिए लगभग $f = 0.5$ और $f = 2.4$ पर। बड़ा $\varepsilon$ आज़माएँ: खिड़की सिकुड़ती है और अंततः बंद हो जाती है। बिना हिलाई पतली परत में उत्प्रेरक स्थिर रहता है जबकि $\mathrm{HBrO_2}$ विसरित होता है, इसलिए ऑक्सीकरण की एक तरंग डिश में दौड़ती है; एक टूटा तरंगाग्र अपने मुक्त सिरे पर मुड़कर प्रसिद्ध घूमता सर्पिल बनाता है, जिसका घूर्णन आवर्तकाल थोक दोलन से छोटा है, इसलिए वह पूरे माध्यम पर छा जाता है।'
meanings:
- अभिक्रिया $b$ का रससमीकरणमितीय गुणक (प्रति अपचयित उत्प्रेरक बना ब्रोमाइड), $0.3$ से $3$ तक
- हर अभिक्रिया का स्केल किया गया $[\mathrm{HBrO_2}]$ (स्वउत्प्रेरक) और $[\mathrm{Ce^{4+}}]$ (ऑक्सीकृत उत्प्रेरक)
- ऋणेतर लाभ और क्षय दर, $\varepsilon\dot x = P - Lx$ के साथ
- 'Patankar–Euler: क्षय अंतर्निहित, लाभ स्पष्ट, इसलिए $x$ कितना भी दृढ़ हो धनात्मक रहता है'
- $x^2 + (f + q - 1)x - q(1 + f) = 0$ का धनात्मक मूल
- स्थायी अवस्था पर रैखिकीकृत गतिकी $\partial \dot y_\alpha / \partial y_\beta$
- 'दोहराया गया $\alpha$ ⇒ योग: अनुरेख; इसका चिह्न परिवर्तन हॉप्फ़ द्विशाखन को चिह्नित करता है'
- कला चित्र (phase portrait) का N-आकार का $\dot x = 0$ वक्र
- शून्य-फ़्लक्स किनारों वाला 5-बिंदु स्टेंसिल; 2D माध्यम में केवल $x$ विसरित होता है
labels:
  f: कला चित्र और सर्पिल के लिए रससमीकरणमितीय गुणक $f$
  eps: समय-पैमाना अनुपात $\varepsilon$ (अनुमानित)
  t_max: अनुकरित समय
  spiral: 2D सर्पिल तरंग
  grid: ग्रिड आकार $n$
