source_hash: fcafdb67dc0d
title: 빅뱅 핵합성
summary: '처음 3분을 강성(stiff) 반응 네트워크로 푼다: 중성자와 양성자는 약한 상호작용 평형에서 동결되고, 중수소 병목은 $T \approx 80$ keV 근처에서 열리며, 거의 모든 중성자가 $^4$He 에 들어간다. 12개의 반응이 n, p, d, t, $^3$He, $^4$He, $^7$Li, $^7$Be 를 잇고, 바리온-광자 비 $\eta$ 의 묶음 전체를 음함수 BDF2 방식으로 한 번에 적분해 Schramm 그림을 얻는다. Planck 값 $\eta \approx 6.1\times10^{-10}$ 에서 헬륨과 중수소는 관측과 일치하지만 리튬은 약 3배 높게 나온다: 아직 풀리지 않은 우주론적 리튬 문제이다.'
notes: '현황: 표준 빅뱅 핵합성은 확립된 물리이다. $^4$He 와 D 에 대한 예측은 우주 마이크로파 배경에서 독립적으로 측정된 바리온 밀도에서 관측과 일치하며, 뜨거운 빅뱅 모형의 기둥 중 하나이다(Alpher, Bethe, Gamow 1948; Wagoner, Fowler, Hoyle 1967). 우주론적 리튬 문제는 열려 있다: 예측된 $^7$Li/H 는 늙은 헤일로 별의 Spite 고원($(1.6\pm0.3)\times10^{-10}$)의 약 3배이며, 핵물리, 별 내부 소모, 새로운 입자 어느 것도 아직 설명하지 못했다. 관측값(인용 상수): $Y_p = 0.245\pm0.003$ (PDG의 BBN 리뷰), D/H $= (2.527\pm0.030)\times10^{-5}$ (Cooke, Pettini, Steidel 2018). 모형: Smith, Kawano, Malaney(1993)의 12개 반응, 열핵 반응률은 JINA REACLIB 데이터베이스(Cyburt 외 2010; 세트 an06, de04, gi17, go17, cd08, db18), 역반응률은 상세 균형에서. 밝혀 둔 근사: Born 근사의 약한 반응률(복사, 유한 질량, 유한 온도 보정 없음), 중성미자의 순간 분리(3.044 대신 $N_\mathrm{eff} = N_\nu$), $^7$Be 는 $^7$Li 로, t 는 $^3$He 로 계산(이후 붕괴), T9 맞춤식은 $T_9 = 10$ 이상에서 고정. 이 때문에 $Y_p$ 는 PRIMAT 이나 PArthENoPE 같은 정밀 코드($0.2470$)보다 약 2% 낮고, D/H 는 몇 퍼센트 안에서 일치한다. $N_\nu = 4$ 를 넣어 보라: 팽창이 빨라져 더 많은 중성자가 동결되고 $Y_p$ 가 약 0.013 늘어난다. 이것이 BBN 이 중성미자 종류를 세는 방법이다.'
meanings:
- 반응 $r$ 이 소비하고 생성하는 핵종 $i$ 의 개수(12개 반응, 8개 핵종)
- 순변화; 모든 $r$ 에 대해 $\sum_i A_i S_{ri} = 0$ (바리온 수)
- 'REACLIB 맞춤식: 반복된 $k$ ($T_9$ 의 기저 함수 7개) ⇒ 합, 그다음 한 반응의 세트들을 더함'
- 각 $\eta_b$ 의 정반응률($\propto n_b \propto \eta$)과 역반응률(상세 균형)
- '$\prod_j Y_j^{R_{rj}}$, 예: d + d 는 $Y_d^2$'
- 반복된 $r$ ⇒ 반응들에 대해 합
- 뉴턴 방법을 위한 정확한 야코비 행렬
- $\eta$ 묶음 전체에 대한 음함수 BDF2 단계의 뉴턴 갱신 한 번
- Born 근사의 약한 반응률, 중성자 수명 $\tau_n$ 으로 규격화
labels:
  n_eta: 묶음 안의 $\eta$ 값 개수
  eta10: 표시할 $\eta \times 10^{10}$ (왼쪽 그림)
  tau_n: 중성자 수명 $\tau_n$
  n_nu: 중성미자 종류 수 $N_\nu$
  n_steps: $\ln T$ 에서의 BDF2 단계 수
