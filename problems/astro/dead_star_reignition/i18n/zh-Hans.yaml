source_hash: d29dc3e384c1
title: 重新点燃死亡恒星：褐矮星、新星、X 射线暴与黑洞
summary: 当恒星残骸获得新鲜气体时会发生什么？褐矮星的质量被推过约 $0.075\,M_\odot$ 后可以燃烧氢而成为恒星；白矮星会点燃其吸积的氢壳层，形成经典新星；中子星每隔几小时就会让吸积的氢/氦发生闪燃，形成 I 型 X 射线暴；黑洞没有表面，因此什么都不会被点燃，它只会发光，最高可达爱丁顿（Eddington）极限。一个批量化的张量模型（Lane–Emden 多方球、简并物态方程以及借助自动微分的单区壳层点火）可同时给出每种残骸、每种质量的临界吸积质量。
notes: 精确结果：Lane–Emden 常数、钱德拉塞卡（Chandrasekhar）质量（$\mu_e = 2$ 时为 $1.456\,M_\odot$）、爱丁顿（Eddington）光度（每 $M_\odot$ 为 $1.26\times10^{38}$ erg/s）以及 ISCO 效率（$5.7\%$ 至 $42\%$）。其余部分均为数量级模型：(1) 褐矮星：收缩中的 $n = 3/2$ 多方球所能达到的最高温度 $T_{\max} \propto M^{4/3}$，分别与 $3\times10^5$ K（在 Gyr 时间尺度上缓慢燃烧氘）和 $3\times10^6$ K（氢）比较；模型给出约 $14\,M_J$ 和 $0.074\,M_\odot$，接近演化模型给出的极限，约 $13\,M_J$（Spiegel et al. 2011）和 $0.07$–$0.08\,M_\odot$（Burrows et al. 2001）。这只是必要条件：一颗年老、冰冷的褐矮星被推过极限后，还必须被吸积（压缩）加热才能点火。(2) 新星：点火质量从 $10^{-7}$ 到 $10^{-3}\,M_\odot$，白矮星越重、吸积越快则越小，与 Yaron et al. (2005) 的新星网格趋势一致，但仅精确到几倍以内（忽略了热传导、混合与屏蔽效应）。新星抛出的物质可能至少与吸积的一样多，因此白矮星能否增长到 $M_{\rm Ch}$ 并爆发为 Ia 型超新星（单简并通道）仍有争议。(3) X 射线暴：点火柱密度接近 $10^8$ g/cm²，复发时间为数小时，与观测一致（Galloway and Keek 2021）；每克的引力能约为核能的 40 倍（$\alpha$）。触发暴发的同一吸积过程也会使中子星自转加快：约 $0.04\,M_\odot$ 即可将一颗老年脉冲星“回收”为毫秒脉冲星。(4) 黑洞：没有表面，就没有闪燃。
meanings:
- 每个条目对应一个吸积残骸：白矮星（质量 $\times$ 吸积率）和中子星（燃料 $\times$ 吸积率）
- 吸积层的柱密度，g/cm²；压强 $P = g y$
- 用批量二分法反解理想离子 + 部分简并电子的物态方程
- 辐射底部温度，不动点迭代（$\kappa$、$\rho$ 依赖于 $T$）
- 薄壳不稳定性：加热随 $T$ 增长得比冷却更快 ⇒ 热失控
- 临界吸积质量：新星或 X 射线暴
- $n = 3/2$ 多方球收缩经过每一个半径；对 $r$ 取最大值 ⇒ 褐矮星极限
- 同时求解 $n = 1, 3/2, 3$ 的 Lane–Emden 方程：常数 $\omega_3$、$\rho_c/\bar\rho$、$P_c$
- 黑洞：只有吸积发光，$\eta = 1 - E_{\rm ISCO}$
