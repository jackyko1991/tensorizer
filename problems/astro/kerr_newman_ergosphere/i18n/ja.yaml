source_hash: e53e4d6ab9fa
title: Kerr–Newman ブラックホール：地平面、エルゴ領域、裸の特異点
summary: 電磁場を含む一般相対性理論で最も一般的なブラックホールで、質量 $M$、スピン $a$、電荷 $Q$ を持ちます。バッチ化した $(M, a, Q)$ のグリッド全体について、コードは地平面 $r_\pm$、エルゴ領域、慣性系の引きずり、赤道面の ISCO と光子軌道を計算します（計量の微分は自動微分で求めます）。アニメーションはスピンと電荷を極限条件 $a^2 + Q^2 = M^2$ まで、さらにそれを超えて掃引します。そこでは地平面が消えてリング特異点がむき出しになりますが、宇宙検閲仮説（未証明）はそれが自然界では禁じられていると主張します。
notes: 単位は $G = c = 1$：長さは $GM/c^2$ 単位、スピンは $a = J/(Mc)$、電荷は幾何化単位系。確立された事実（古典一般相対論）：Kerr–Newman 計量（Newman et al. 1965）は Einstein–Maxwell 方程式の解であり、その地平面は $\Delta$ の根です。どの観測者も静止していられないエルゴ領域は $r_+$ と $r_E(\theta)$ の間にあり、両極で地平面に接します。その内部では慣性系の引きずりによってあらゆるものが共回転させられます。緑の曲線は角運動量ゼロで落下しますが、それでも回転方向へ流されます。順行軌道はブラックホールに近づきます。Kerr の場合、ISCO は $a = 0$ での $6M$ から、$a = M$ では $M$（順行）と $9M$（逆行）に移り、Bardeen、Press、Teukolsky (1972) と一致します。極限 Reissner–Nordström の ISCO は $4M$ です。$a^2 + Q^2 > M^2$ でも式は計量を与えますが、地平面はなく、$r = 0$、$\theta = \pi/2$ に裸のリング特異点があります（赤で表示）。Penrose の弱い宇宙検閲仮説は、重力崩壊がそのような特異点を決して生じないと主張します。これは一般には未証明であり（既知の反例は微調整された初期データか余剰次元を必要とします）、粒子を投げ込んで極限ブラックホールのスピンや電荷を限界以上にしようとする試みは、2 次の摂動効果を含めると失敗するようです（Sorce and Wald 2017）。実際のブラックホールは $Q \approx 0$ であり（電荷はすぐに中和されます）、測定されたスピン（最大で約 $0.95$–$0.99\,M$）は極限値より小さいままです。赤道面パネルでは Boyer–Lindquist 座標の $r$ を半径として用いています。そこでは落下する緑の曲線の $\varphi$ が $r_+$ で際限なく巻き付きますが、これは座標による効果です。
meanings:
- 質量・スピン・電荷のすべての組み合わせを 1 つのバッチとして扱う、$G = c = 1$
- $\Delta = 0$ の根；$a^2 + Q^2 > M^2$（裸の特異点）のときは NaN
- 静止限界 $g_{tt} = 0$、フレーム $\times$ 極角にブロードキャスト
- Boyer–Lindquist 計量の回転する $(t, \varphi)$ ブロック
- 角運動量ゼロの観測者の角速度；地平面では $\Omega_H = a/(r_+^2 + a^2)$
- 半径グリッド上の計量の微分を自動微分で求める
- 円軌道の角速度とエネルギー；ISCO は $E$ の最小点、光子軌道は軌道に速度 $c$ が必要となる位置
- 表面重力、$T_H = \kappa/2\pi$；極限ブラックホールではゼロ
labels:
  angle: 混合角 $\psi$（$0°$ は純粋なスピン、$90°$ は純粋な電荷）
  chi_max: 掃引の上限 $\sqrt{a^2 + Q^2}/M$
  frames: フレーム数
  grid: バッチ化した $(a, Q)$ 探索の各軸のグリッド点数
