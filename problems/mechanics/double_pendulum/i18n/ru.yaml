source_hash: 75e6d7e3dc93
title: Двойной маятник и хаос
summary: Уравнения Лагранжа для двойного маятника в виде $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$. На каждой стадии RK4 строится тензор матрицы масс $2\times 2$ и вызывается torch.linalg.solve; два почти одинаковых начальных состояния расходятся, демонстрируя хаос.
notes: В пакете два маятника, у которых $\theta_2$ отличается на $\delta$. Их разница растёт примерно экспоненциально, пока движения не станут никак не связаны, хотя энергия каждого сохраняется с высокой точностью (float64 + RK4 с малым шагом). При малых колебаниях система имеет две нормальные моды; при равных массах и длинах $\omega^2 = (2 \mp \sqrt2)\,g/L$. Стержни невесомы, ось без трения.
meanings:
- углы $(\theta_1, \theta_2)$ маятника $b$ от нижней вертикали
- угловые скорости
- матрица масс, зависящая от конфигурации, внедиагональный элемент $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 'обобщённые силы: центробежная связь + гравитация'
- решение $M\ddot q = f$ для всего пакета за один вызов
- 'суммирование по $i$ и $j$: удвоенная кинетическая энергия'
labels:
  theta1: Начальный $\theta_1$
  theta2: Начальный $\theta_2$
  delta: Возмущение $\delta$ угла $\theta_2$
  m1: Верхняя масса $m_1$
  m2: Нижняя масса $m_2$
  L1: Верхний стержень $L_1$
  L2: Нижний стержень $L_2$
  t_max: Время моделирования
