<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Road mirage: above a hot road the refractive index n increases with height, so a ray from the tree curves upward near the road and reaches the eye from below, which sees an inverted image">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="grin-mirage-heat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0.4"/></linearGradient>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <rect x="10" y="94" width="220" height="24" fill="url(#grin-mirage-heat)"/>
    <line x1="10" y1="118" x2="230" y2="118" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="16" y1="118" x2="8" y2="126"/>
      <line x1="30" y1="118" x2="22" y2="126"/>
      <line x1="44" y1="118" x2="36" y2="126"/>
      <line x1="58" y1="118" x2="50" y2="126"/>
      <line x1="72" y1="118" x2="64" y2="126"/>
      <line x1="86" y1="118" x2="78" y2="126"/>
      <line x1="100" y1="118" x2="92" y2="126"/>
      <line x1="114" y1="118" x2="106" y2="126"/>
      <line x1="128" y1="118" x2="120" y2="126"/>
      <line x1="142" y1="118" x2="134" y2="126"/>
      <line x1="156" y1="118" x2="148" y2="126"/>
      <line x1="170" y1="118" x2="162" y2="126"/>
      <line x1="184" y1="118" x2="176" y2="126"/>
      <line x1="198" y1="118" x2="190" y2="126"/>
      <line x1="212" y1="118" x2="204" y2="126"/>
      <line x1="226" y1="118" x2="218" y2="126"/>
    </g>
    <line x1="38" y1="118" x2="38" y2="100" stroke="#92400e" stroke-width="4"/>
    <circle cx="38" cy="86" r="15" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
    <g opacity="0.45">
      <line x1="38" y1="121" x2="38" y2="130" stroke="#92400e" stroke-width="3"/>
      <ellipse cx="38" cy="140" rx="13" ry="10" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
    </g>
    <path d="M42,74 Q125,78 202,94" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M42,78 C88,116 134,117 202,97" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="200" y1="97" x2="44" y2="141.9" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M224,96 Q214,87 204,96 Q214,105 224,96 Z" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <circle cx="209" cy="96" r="2.6" fill="#374151"/>
    <line x1="120" y1="64" x2="120" y2="34" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="127" y="52" fill="#b45309">∇<tspan font-style="italic">n</tspan></text>
    <text x="150" y="148" fill="#6b7280" font-size="12">hot road</text>
  </g>
