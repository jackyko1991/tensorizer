title: 鼓膜振动模式
summary: 方形或圆形鼓膜的简正模。网格上的二维拉普拉斯算子由一维算子经克罗内克积构造，$\Delta = D\otimes I + I\otimes D$，一次对称本征求解（eigh）就返回所有模式形状和频率。
notes: 每个面板显示一个模式 $\phi_m(x, y)\cos(\omega_m t)$；内部的白线是永不移动的节线。对边长为 $L$ 的正方形，精确频率为 $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$，所以与基频之比为 $\sqrt{(m^2+n^2)/2}$ = 1、1.58、1.58、2、2.24……：不是整数，这就是鼓声听起来不像弦声的原因。像 $(1,2)$ 和 $(2,1)$ 这样的模式对频率相同，eigh 返回它们的某种混合。对圆形，精确比值来自贝塞尔函数的零点（1、1.59、2.14、2.30……）；网格的阶梯状边缘使其偏移几个百分点。单位：$c = 1$，正方形边长或圆直径 $L = 1$；时间以基频周期显示。
meanings:
- 边缘固定的一维二阶导数（外部 $u = 0$）
- 指标对 $p = (a, b)$ 为格点编号：二维拉普拉斯算子
- 只保留鼓膜内的点（圆形掩模）；边缘固定
- 本征值 $\omega^2/c^2$ 和各列中正交归一的模式形状
- 重复的 $p$ ⇒ 求和：单位矩阵
labels:
  shape: 鼓膜形状
  n_grid: 每边格点数
  periods: 显示的基频周期数
