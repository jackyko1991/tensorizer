title: HP जालक प्रोटीन वलन
summary: 'सबसे सरल प्रोटीन मॉडल जो फिर भी वलित होता है: एक वर्ग जालक पर जलविरागी (H) और ध्रुवीय (P) अवशेषों की एक श्रृंखला, जहाँ उन अवशेषों के बीच हर H–H संपर्क जो श्रृंखला-पड़ोसी नहीं हैं, ऊर्जा को एक से घटाता है। 20-अवशेष बेंचमार्क की कई प्रतिकृतियाँ पुल (pull) और क्रैंकशाफ्ट चालों के साथ मेट्रोपोलिस मोंटे कार्लो द्वारा एक साथ वलित होती हैं जबकि तापमान घटाया जाता है, और संपर्क मानचित्र $(R, N, N)$ आकार के एक युग्मीय-दूरी टेंसर से निकलता है।'
notes: 'प्रोटीन मुख्यतः इसलिए वलित होते हैं क्योंकि जलविरागी पार्श्व श्रृंखलाएँ एक सघन कोर में पानी से छिप जाती हैं। HP मॉडल (Dill, 1985) केवल इतना रखता है: एक H–H संपर्क का मान $-\varepsilon$ है, और कुछ नहीं गिना जाता, और श्रृंखला जालक पर एक स्व-परिहारी भ्रमण (self-avoiding walk) है। फिर भी, न्यूनतम ऊर्जा खोजना NP-कठिन है, और संरूपणों की संख्या $2.64^N$ की तरह बढ़ती है। डिफ़ॉल्ट अनुक्रम HPHPPHHPHPPHPHHPPHPH Unger और Moult (1993) का क्लासिक 20-अवशेष बेंचमार्क है जिसकी निम्नतम अवस्था $E = -9$ है; अन्य के ज्ञात न्यूनतम $-9$, $-8$ और $-14$ हैं। हर चरण में, हर प्रतिकृति एक अवशेष चुनती है और एक पुल चाल (Lesh, Mitzenmacher और Whitesides, 2003: अवशेष एक खाली कोने पर कूदता है और श्रृंखला के साथ अपने पड़ोसियों को खींचता है जब तक श्रृंखला फिर से जुड़ न जाए; सिरों पर यह अंतिम अवशेष को घुमाती है, और सबसे सरल स्थिति में यह कोना पलटना है) या क्रैंकशाफ्ट चाल (एक U-आकार का युग्म पलट जाता है) आज़माती है। जो प्रस्ताव आबंध तोड़ता है या दो अवशेषों को एक स्थल पर रखता है वह अस्वीकार किया जाता है; अन्यथा मेट्रोपोलिस
  नियम निर्णय लेता है। उच्च तापमान श्रृंखलाओं को अन्वेषण करने देता है, धीमा शीतलन उन्हें H कोर और सतह पर P अवशेषों वाले सघन वलनों में बसने देता है। ऊर्जा $E$ हर स्वीकृत चाल के $\Delta E$ से अद्यतन होती है और परीक्षणों में पूर्ण पुनर्गणना से जाँची जाती है। पुल चालें पूर्णतः सममित प्रस्ताव नहीं हैं, इसलिए यह रन एक सटीक तापीय प्रतिदर्शक (sampler) के बजाय एक अनुकूलक (optimiser) है। 36-अवशेष अनुक्रम आज़माएँ: इसे अधिक चरणों या प्रतिकृतियों की आवश्यकता है, और निम्नतम अवस्था तक पहुँचने वाली प्रतिकृतियों का अंश दिखाता है कि इसका ऊर्जा परिदृश्य कितना ऊबड़-खाबड़ है।'
meanings:
- प्रतिकृति $r$ में अवशेष $i$ का जालक निर्देशांक $k$; हर प्रतिकृति सीधी छड़ के रूप में शुरू होती है
- H के लिए 1, P के लिए 0
- 'दोहराया गया $k$ ⇒ योग: एक बैच ग्राम आव्यूह; वर्ग मानकों के साथ यह $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$ देता है'
- जालक पड़ोसी जो श्रृंखला पड़ोसी नहीं हैं
- 'दोहराए गए $i$ और $j$ ⇒ योग: H–H संपर्क, हर एक दो बार गिना गया, इसलिए $\tfrac12$'
- लंबाई 1 के आबंध और एक स्थल पर कोई दो अवशेष नहीं, अन्यथा चाल अस्वीकार
- 'तापानुशीतन (annealing) अनुसूची: $T$ चरण-दर-चरण ज्यामितीय रूप से घटता है'
- 'मेट्रोपोलिस नियम: ढलान नीचे हमेशा, ऊपर प्रायिकता $e^{-\Delta E/T}$ के साथ'
