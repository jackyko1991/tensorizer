title: Tachyons and the antitelephone
category: cosmology
level: intermediate
order: 12
tags: [series:tachyons:1, role:theory, speculative]
summary: >
  What if a particle had an imaginary mass, $m^2 < 0$? With complex tensors, $E^2 = p^2 + m^2$ still gives real
  energies, but the particle is always faster than light and speeds up as it loses energy. Batched Lorentz boosts of
  superluminal worldlines find frames where the signal arrives before it is sent, and close Tolman's
  antitelephone loop. In field theory $m^2 < 0$ instead means an unstable vacuum that condenses, as the Higgs field
  does. Speculative: no tachyon has ever been seen, and the 2011 OPERA "faster-than-light neutrinos" were a loose cable.
animated: true
vector_form: 'E^2 = p^2c^2 + m^2c^4,\quad m^2 = -\mu^2 < 0\;\Rightarrow\; v = c\sqrt{1 + \frac{\mu^2c^4}{E^2}} > c,\qquad \Delta t'' = \gamma\,\Delta t\Big(1 - \frac{\beta\,u}{c}\Big) < 0 \;\text{ if }\; \beta c > \frac{c^2}{u}'
index_form: 'x''^a_{Bn} = \Lambda^a{}_b(\beta_B)\,x^b_n,\qquad p^a\eta_{ab}p^b = -\mu^2,\qquad t_{\mathrm{back}} = t_{\mathrm{send}}\,\frac{u^2(1-\beta^2)}{(u-\beta)^2},\qquad \ddot\phi_i + \gamma\dot\phi_i = \frac{\phi_{i+1} - 2\phi_i + \phi_{i-1}}{\Delta x^2} - m^2\phi_i - \lambda\phi_i^3'
