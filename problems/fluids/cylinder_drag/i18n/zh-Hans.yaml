source_hash: fdbefecc20a0
title: 圆柱绕流：阻力与涡脱落
summary: 用格子玻尔兹曼方法（D2Q9）模拟圆柱绕流。分布函数 $f_{xyi}$ 向用 einsum 构造的平衡态碰撞，并用 torch.roll 迁移；圆柱所受的力来自每个从其表面反弹的分布函数所传递的动量。Re ≈ 47 以上，尾流变成卡门涡街：阻力脉动，升力左右摆动。
notes: 格子单位：节点间距和时间步长为 1，圆柱直径 $D = 10$，来流 $U = 0.12$；黏度 $\nu = UD/\mathrm{Re}$ 决定弛豫时间 $\tau = 3\nu + \tfrac12$。当 $U$ 远低于格子声速 $1/\sqrt3$ 时，该模型重现纳维–斯托克斯方程。入口为固定平衡态，出口复制相邻节点，上下边界为周期性（一排间距为 $H$ 的圆柱），圆柱采用全程反弹格式，即圆的阶梯近似。动量交换力统计每个撞到圆柱的分布函数：它反向运动，因此传递 $2 f_i\mathbf e_i$。由于通道较窄（$D/H \approx 0.18$），Re = 100 时阻力高于自由来流的 $C_D \approx 1.4$，涡脱落也稍快（$St \approx 0.16$–$0.2$）。最初几百步是声学启动瞬态；应从后半段读取平均值。开始时的一个小侧向扰动使涡脱落更早出现。
meanings:
- 分布函数：节点 $(x, y)$ 处以格子速度 $i$ 运动的流体
- D2Q9 速度（静止、4 个轴向、4 个对角）及权重
- 密度：对 $i$ 求和
- 重复的 $i$ ⇒ 求和：动量密度
- 速度在各格子方向上的投影
- 迁移：每个分布函数沿一条链移动一格
- 分布函数从流体迁移到圆柱内处为 1
- 动量交换：圆柱所受的力（反弹使每次撞击反向）
labels:
  re: 雷诺数 $UD/\nu$
  steps: 格子时间步数
