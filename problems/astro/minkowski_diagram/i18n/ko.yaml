source_hash: 8adb8e4369f3
title: '특수 상대성: 민코프스키 도표와 로렌츠 변환'
summary: 사건은 2-벡터 $x^\mu = (t, x)$이며, 관성 좌표계를 바꾸는 것은 행렬 하나 $\Lambda^\mu{}_\nu$를 einsum으로 모든 사건에 적용하는 것입니다. 쌍둥이 한 명이 별까지 갔다가 돌아옵니다. 집 좌표계와 부스트된 좌표계의 도표는 기울어진 동시선, 불변인 광원뿔, 그리고 $\int\sqrt{1 - v^2}\,dt$만큼 흐르는 여행자의 시계를 보여 줍니다. 이는 집에 남은 쌍둥이보다 적습니다.
notes: '단위: 년과 광년이므로 $c = 1$이고 광선은 45° 점선입니다. 여행자는 속력 $v$로 거리 $L$의 별까지 날아가 순간적으로 방향을 바꾸고 돌아옵니다. 주황색 선은 여행자가 "지금"이라고 부르는 사건들의 집합입니다. 갈 때는 $v$만큼 기울어 있다가 반환점에서 집에 있는 쌍둥이의 세계선을 가로질러 휙 넘어가는데, 집 쌍둥이의 "사라진" 세월이 바로 여기에 있습니다. 여행자만 관성 좌표계를 바꾸므로 이 역설은 대칭이 아닙니다. 오른쪽 패널의 부스트를 $v$로 두면 여행자의 출발 좌표계에, $-v$로 두면 귀환 구간의 좌표계에 있게 됩니다. 광원뿔은 모든 좌표계에서 모양이 같습니다.'
meanings:
- 사건 $(t, x)$, $\mu \in \{0, 1\}$, $c = 1$
- 민코프스키 계량 $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- '반복된 $\nu$ ⇒ 합: 세계선이나 격자의 모든 사건을 한 번에 부스트'
- 간격의 제곱, 모든 좌표계에서 같음
- 세계선을 따라 $\sqrt{-\Delta s^2}$의 누적 합
- $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$와 같음
labels:
  v: 여행자 속력 $v/c$
  distance: 별까지 거리 $L$
  beta_view: 오른쪽 패널의 부스트 $\beta$
