source_hash: 888a525ecc84
title: Крошечный GPT пишет Шекспира
summary: 'Посимвольный GPT, собранный из простых тензорных операций: эмбеддинги, каузальное многоголовое самовнимание, записанное через einsum, LayerNorm, MLP и остаточные связи, без nn.Transformer. После примерно минуты обучения на «Макбете» и «Ромео и Джульетте» его функция потерь падает от $\ln V$ (равномерное угадывание среди $V$ символов), а его образцы превращаются из бессмыслицы в слова, имена и строки, похожие на стихи, при этом карты внимания остаются строго нижнетреугольными.'
notes: 'Архитектура — это архитектура Vaswani et al., "Attention is all you need" (2017), в варианте GPT только с декодером и блоками с предварительной нормализацией: $X \leftarrow X + \mathrm{Attn}(\mathrm{LN}\,X)$, затем $X \leftarrow X + \mathrm{MLP}(\mathrm{LN}\,X)$. Тесты точно проверяют механику: внимание через einsum совпадает с объединённым `scaled_dot_product_attention` из PyTorch с `is_causal=True`; изменение символов после позиции $t$ не меняет ни одного выхода до $t$ включительно (маска); строки $A$ в сумме дают 1; потери необученной модели равны $\ln V$; модель способна запомнить один батч; число весов равно $Vd + Td + L(12d^2 + 13d) + 2d + dV + V$. Благодаря маске один прямой проход обучает сразу все $T$ предсказаний следующего символа в окне, тогда как генерация должна идти по одному символу. Такая маленькая модель (113 093 веса, около минуты на CPU) выучивает орфографию, пробелы, имена говорящих с заглавной буквы и переносы строк, но не смысл; потери на валидации в итоге
  около 2 нат на символ. Тепловые карты показывают для каждого слоя голову, которая сильнее всего смотрит на предыдущий символ, на строке "When shall we three meet again?". Белковая языковая модель из биоинформатики использует такое же внимание без маски, чтобы восстанавливать скрытые буквы. Текст: «Макбет» и «Ромео и Джульетта» из The Complete Works of William Shakespeare, Project Gutenberg eBook #100 (общественное достояние), с удалёнными заголовком электронной книги и лицензией и с фигурными кавычками, заменёнными на ASCII; 247 кБ в data/shakespeare.txt. Попробуйте больше шагов, более широкую модель или температуру 0.5 против 1.2.'
meanings:
- случайные окна текста в виде идентификаторов символов; цели — те же окна, сдвинутые на один символ влево
- эмбеддинг токена плюс обучаемый эмбеддинг позиции
- каждый вектор токена сдвигается к среднему 0 и масштабируется к дисперсии 1 по своим каналам, затем применяются обучаемые масштаб и сдвиг
- 'повторяющийся $c$ ⇒ суммирование: запросы каждой головы (ключи и значения аналогично)'
- '$0$ на диагонали и ниже, $-\infty$ выше неё: после softmax позиция не видит более поздних символов'
- повторяющийся $k$ ⇒ суммирование; каждая строка — распределение вероятностей по более ранним позициям $j \le i$
- 'повторяющийся $j$, затем $h, k$ ⇒ суммирование: то, что каждая позиция собирает из своего прошлого, добавляется обратно через остаточную связь'
- среднее $-\log p$ истинного следующего символа в натах; начинается с $\ln V$
labels:
  steps: Шаги обучения
  d_model: Ширина модели $d$
  heads: Головы внимания $H$
  layers: Блоки трансформера
  context: Длина контекста $T$
  batch: Размер батча
  lr: Скорость обучения
  temperature: Температура сэмплирования
