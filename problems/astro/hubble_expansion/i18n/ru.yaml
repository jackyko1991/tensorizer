source_hash: b6ae9044b340
title: Хаббловское расширение
summary: 'Галактики сидят на неподвижной сопутствующей сетке, которую растягивает масштабный фактор $a(t)$. Одно внешнее произведение $x_{gi} = a\,q_{gi}$ перемещает все галактики, и из любой выбранной галактики остальные удаляются со скоростью $v = H d$. Фотон, пересекающий сетку, растягивается в том же отношении: $1 + z = a_\mathrm{obs}/a_\mathrm{emit}$.'
notes: 'Единицы: Мпк, млрд лет и км/с/Мпк. В модели с доминированием материи (Эйнштейна–де Ситтера) $a = (t/t_0)^{2/3}$, поэтому $H = 2/(3t)$ убывает со временем; в модели де Ситтера $a = e^{H_0 (t - t_0)}$ и $H$ остаётся постоянной. В обоих случаях $v = Hd$ выполняется точно для любого наблюдателя: переместите наблюдателя, и синие точки по-прежнему лягут на ту же прямую, что и пустые кружки, видимые из центра. Сами галактики не движутся в пространстве (пекулярных скоростей нет): растёт пространство между ними. За шаг фотон проходит сопутствующее расстояние $c\,dt/a$, а скорости выше $c$ у далёких галактик допустимы, поскольку локально ничто не обгоняет свет.'
meanings:
- сопутствующие координаты галактики $g$ (не меняются)
- масштабный фактор в каждый момент, $a = 1$ сегодня
- 'физические положения: внешнее произведение, суммирования нет'
- '$\dot a/a$: $2/(3t)$ для материи, постоянная для де Ситтера'
- скорость хаббловского потока каждой галактики
- положения с точки зрения наблюдателя $o$ (вычитание с broadcasting)
- 'повторяющиеся $g, i$ ⇒ суммирование: наклон $v$ от $d$ методом наименьших квадратов'
- растяжение длины волны фотона с момента испускания
labels:
  model: Закон расширения $a(t)$
  H0: Постоянная Хаббла сегодня $H_0$
  n_grid: Галактик на сторону
  spacing: Шаг сопутствующей сетки
  observer_x: Столбец наблюдателя (шаги сетки)
  observer_y: Строка наблюдателя (шаги сетки)
  a_start: Масштабный фактор в начале $a_\mathrm{emit}$
  a_end: Масштабный фактор в конце $a_\mathrm{obs}$
