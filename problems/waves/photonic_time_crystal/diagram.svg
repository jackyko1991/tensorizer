<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Permittivity epsilon of the whole medium jumps at time t0; an incoming forward wave packet splits into a forward wave and a time-reflected backward wave">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- epsilon(t): a step at t0 -->
    <line x1="20" y1="58" x2="225" y2="58" stroke="#374151" stroke-width="2"/>
    <path d="M24,48 L110,48 L110,22 L220,22" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="34" y="40" font-style="italic" fill="#1e40af">ε</text>
    <text x="43" y="44" font-size="10" fill="#1e40af">1</text>
    <text x="180" y="16" font-style="italic" fill="#1e40af">ε</text>
    <text x="189" y="20" font-size="10" fill="#1e40af">2</text>
    <text x="214" y="73" font-style="italic">t</text>
    <!-- the moment of the jump -->
    <line x1="110" y1="14" x2="110" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="114" y="74" font-style="italic" fill="#b45309">t</text>
    <text x="121" y="78" font-size="10" fill="#b45309">0</text>
    <!-- before: one forward packet -->
    <path d="M22,110 q6,-18 12,0 t12,0 t12,0 t12,0 t12,0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="40" y1="134" x2="78" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- after: forward (bigger) and backward (smaller) packets -->
    <path d="M168,110 q8,-26 16,0 t16,0 t16,0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="176" y1="134" x2="214" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M120,110 q6,-10 12,0 t12,0 t12,0" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <line x1="156" y1="134" x2="122" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
