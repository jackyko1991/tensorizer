title: Система двух линз (лучевые матрицы)
summary: 'Параксиальная оптика — это линейная алгебра: свободное пространство и тонкие линзы — матрицы $2\times 2$, действующие на векторы лучей (высота, угол). Вся система — одно цепное произведение матриц, применённое к пакету лучей и пересчитываемое по мере того, как вторая линза отодвигается от первой.'
notes: 'Порядок важен: элемент, который свет встречает первым, — крайний правый множитель. Определитель каждого множителя равен 1, поэтому $\det M = 1$ при любом расположении. Посмотрите, как изображение уходит в бесконечность, когда промежуточное изображение от линзы 1 оказывается точно в фокусе линзы 2 ($d = sf_1/(s - f_1) + f_2$), а затем возвращается с другой стороны как мнимое.'
meanings:
- 'луч $r$: $j = 0$ высота $h$, $j = 1$ угол $\theta$'
- распространение на расстояние $d$ (пакет $d$ даёт (..., 2, 2))
- тонкая линза с фокусным расстоянием $f$
- добавление ещё одного элемента в систему (повторяющийся $j$ суммируется); то же, что torch.linalg.multi_dot
- матрица переноса от предмета до каждой точки оси $z$
- все лучи во всех $z$ одной свёрткой
- где высота перестаёт зависеть от начального угла
labels:
  s: Расстояние до предмета
  f1: Фокусное расстояние линзы 1
  f2: Фокусное расстояние линзы 2
  d_start: Начальное расстояние между линзами
  d_end: Конечное расстояние между линзами
  h0: Высота предмета
  half_angle: Полуугол веера
  n_rays: Лучей в веере
