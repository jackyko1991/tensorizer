source_hash: f93e7ab544e0
title: 單細胞 RNA-seq：PCA 與 k-means 分群
summary: 一個合成的單細胞實驗：數種類型的細胞各自開啟自己的標記基因，計數服從負二項分布，且各細胞定序深度不同。我們以張量運算執行標準流程：正規化為 $\log(1 + 10^4 K_{cg}/n_c)$、保留高變異基因、以 SVD 做 PCA，再以多個平行重啟執行 k-means，並以調整蘭德指數對照真實類型為分群評分。
notes: 每個細胞產生數千個 mRNA 計數，分散在數千個基因上，所以大多數項為零，而原始計數主要反映細胞被定序的深度。除以文庫大小 $n_c$ 可去除深度；取對數則馴服表現量的巨大範圍。大多數基因只帶有雜訊，因此我們保留變異數超過相近平均值基因所呈現者的基因：即高變異基因，其中富含植入的標記。PCA 接著壓縮它們：有 $K$ 種類型時，訊號位於約 $K-1$ 個方向，在陡坡圖中顯示為高出平坦雜訊底的前 $K-1$ 根長條。k-means 交替兩個步驟：把每個細胞指派給最近的中心，再把每個中心移到其細胞的平均；兩步都不會增加慣性 $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$，所以會收斂，但只收斂到局部最小值，這就是為什麼並排執行數個隨機起點（灰色曲線）並保留最佳者。因為我們知道真實類型，調整蘭德指數能誠實地為結果評分。可選的 t-SNE 圖是以 autograd 訓練的小型力導向佈局（Student-t 相似度、早期誇大）；這類圖中群與群之間的距離意義不大。真實流程（Scanpy、Seurat）還會加入品質控制、批次校正，以及在最近鄰圖上的圖分群（Leiden），而真實細胞類型很少如此乾淨。試試較小的倍數變化、較少的標記或錯誤的 $k$。
meanings:
- 基因 $g$ 在類型 $k$ 中的平均表現量：對數常態基線，對 $k$ 的 $M$ 個標記基因再乘上倍數變化
- 負二項計數（變異數 $m + \varphi m^2$）；$s_c$ 為對數常態的定序深度
- 文庫大小：細胞 $c$ 的總計數，對 $g$ 求和
- 深度正規化（每 $10^4$ 計數，類似 CPM）並取對數轉換
- 離散度 $\mathrm{Var}/\mathrm{Mean}$，在平均值相近的分箱內標準化（分箱和以 one-hot einsum 計算）
- 在 $H$ 個高變異基因上對中心化矩陣做 PCA；torch.pca_lowrank 給出相同的前幾個主成分
- 主成分分數，對 $g$ 求和；$\Sigma_p^2/\sum_q\Sigma_q^2$ 為解釋變異比例
- 細胞 $c$ 到重啟 $r$ 之中心 $k$ 的距離平方；對 $p$ 求和，所有 $R$ 個重啟同時進行
- 指派步驟：每個細胞加入最近的中心
- 更新步驟：每個中心移到其細胞的平均，對 $c$ 求和
- 由列聯表 $n_{ij}$（one-hot einsum）計算的成對計數一致性；1 = 完美，約 0 = 隨機
labels:
  n_cells: 細胞數 $C$
  n_genes: 基因數 $G$
  n_types: 真實細胞類型數 $K$
  n_markers: 每種類型的標記基因數
  fold_change: 標記倍數變化
  dispersion: 負二項離散度 $\varphi$
  depth_spread: 文庫大小離散程度（對數常態 $\sigma$）
  n_hvg: 保留的高變異基因數
  n_pcs: 用於分群的主成分數
  k: 群數 $k$
  kmeans_iters: k-means 迭代次數
  embedding: 二維檢視：PC1–PC2 或 t-SNE
