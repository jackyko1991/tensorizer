source_hash: dc1d9350a90f
title: 双势阱中的隧穿
summary: 对称双势阱中的粒子。torch.linalg.eigh 显示两个最低态构成紧密的一对：一个偶态和一个奇态，被微小的隧穿能量 $\Delta E$ 分开。两者之和是位于左阱中的粒子；随着两者相对相位逐渐错开，粒子以周期 $2\pi/\Delta E$ 隧穿到右阱再返回，尽管其能量低于势垒。
notes: 单位 $\hbar = m = 1$。双重态能量低于势垒顶 $V_0$，所以经典粒子永远无法越过。只有两个态参与时，$\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$（相差一个全局相位）：$t = 0$ 时为左边的 $(\varphi_0 + \varphi_1)$，$t = \pi/\Delta E$ 时为右边的 $(\varphi_0 - \varphi_1)$。$P_L(t) = \cos^2(\Delta E\,t/2)$ 成立，误差只来自每个态与“错误”势阱的微小重叠。$\Delta E$ 随势垒高度和宽度大致按指数减小（WKB 因子 $e^{-\int\kappa\,dx}$），所以势垒稍高一点，隧穿就大大变慢——模拟时长以隧穿周期 $2\pi/\Delta E$ 为单位，因此动画总是显示完整的振荡。
meanings:
- 四次势：极小值在 $x = \pm a$，势垒 $V_0$ 在 $x = 0$
- 动能 $-\tfrac12\,D2$ 加上对角线上的 $V$
- 能量和本征态；$\varphi_0$ 为偶，$\varphi_1$ 为奇，$\Delta E = E_1 - E_0$
- $(1, 1, 0, 0, \dots)/\sqrt2$：双重态的等量混合，局域在左侧
- 重复的 $n$ ⇒ 求和：在本征基中精确演化
- 选出左半边的阶跃函数；$P_L$ 对 $x$ 求和
labels:
  V0: 势垒高度 $V_0$
  a: 势阱间距 $a$（极小值在 $\pm a$）
  periods: 模拟时长
  n_grid: 格点数
