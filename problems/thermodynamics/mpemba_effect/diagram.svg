<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Staircase potential U on a lattice: a raised plateau, a deep narrow well, a barrier and a wide shallow well; a particle hops between neighbouring sites, kicked by a bath at temperature T_b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- bath -->
    <rect x="10" y="8" width="220" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="24" text-anchor="middle" fill="#b45309">bath <tspan font-style="italic">T</tspan><tspan font-size="10" dy="3">b</tspan></text>
    <!-- lattice sites -->
    <g fill="#9ca3af">
      <circle cx="24" cy="146" r="2"/><circle cx="40" cy="146" r="2"/><circle cx="56" cy="146" r="2"/><circle cx="72" cy="146" r="2"/>
      <circle cx="88" cy="146" r="2"/><circle cx="104" cy="146" r="2"/><circle cx="120" cy="146" r="2"/><circle cx="136" cy="146" r="2"/>
      <circle cx="152" cy="146" r="2"/><circle cx="168" cy="146" r="2"/><circle cx="184" cy="146" r="2"/><circle cx="200" cy="146" r="2"/>
      <circle cx="216" cy="146" r="2"/>
    </g>
    <!-- staircase potential: plateau, deep narrow well, barrier, wide shallow well -->
    <path d="M16,72 H80 V132 H112 V50 H128 V112 H224" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="30" y="66" font-style="italic">U</text>
    <!-- particle in the deep well and its hops -->
    <circle cx="96" cy="123" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M90,112 Q82,96 74,106" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M102,112 Q110,96 116,104" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- wide well probability -->
    <rect x="132" y="98" width="88" height="14" fill="#93c5fd" opacity="0.7"/>
    <text x="176" y="92" text-anchor="middle" font-style="italic">p<tspan font-size="10" dy="3">i</tspan></text>
  </g>
</svg>
