title: डोरी के जोड़ पर स्पंद
summary: भिन्न द्रव्यमान घनत्व वाली दो डोरियाँ आपस में बँधी हैं। बाईं ओर से आता स्पंद गाँठ पर परावर्तित और पारगमित स्पंदों में बँट जाता है, जिनके आयाम प्रतिबाधाओं $Z = \sqrt{T\mu}$ से तय होते हैं। द्वितीय अवकलज स्टेंसिल $(1, -2, 1)$ के साथ एक 1D संवलन है।
notes: 'गाँठ टूट नहीं सकती, इसलिए $u$ संतत है, और वह द्रव्यमानहीन है, इसलिए दोनों ओर अनुप्रस्थ बल $T u_x$ संतुलित रहते हैं। ये दो शर्तें $R$ और $\mathcal T$ देती हैं। भारी दाहिनी डोरी ($Z_2 > Z_1$) स्पंद को उलटा परावर्तित करती है, बँधे सिरे की तरह; हल्की डोरी उसे सीधा परावर्तित करती है, मुक्त सिरे की तरह। पारगमित स्पंद हमेशा सीधा होता है और $c_2 = \sqrt{T/\mu_2}$ से चलता है, इसलिए वह $c_2/c_1$ गुना सिकुड़ता या फैलता है। स्पंद द्वारा ले जाई गई ऊर्जा $Z\,A^2$ के समानुपाती है, जिससे फ्लक्स संतुलन $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$ मिलता है। मात्रक: $T = 1$, $\mu_1 = 1$, डोरी $-1$ से $1$ तक। धूसर धराशायी रेखाएँ अनुमानित आयाम दर्शाती हैं। तेज़ डोरी पर ध्यान दें: उसका स्पंद दूर की दीवार तक पहुँचकर लौट आता है।'
meanings:
- ग्रिड बिंदु $i$ पर विस्थापन; दोनों दूर के सिरे बँधे हैं
- 'प्रति इकाई लंबाई द्रव्यमान: बाईं ओर $\mu_1$, दाईं ओर $\mu_2$, गाँठ पर औसत'
- 'दोहराया गया $j$ ⇒ योग: स्टेंसिल डोरी के अनुदिश खिसकता है'
- डोरी $k$ की तरंग प्रतिबाधा
- गाँठ पर $u$ और बल $T\,u_x$ की सांतत्यता से आयाम अनुपात
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$, संरक्षित
labels:
  mu_ratio: घनत्व अनुपात $\mu_2/\mu_1$
  width: स्पंद की चौड़ाई
  t_max: सिमुलेशन समय
  n_points: ग्रिड बिंदु
