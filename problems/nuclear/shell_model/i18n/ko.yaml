source_hash: f7213dbb7c33
title: 핵 껍질 모형
summary: 핵자들은 우즈–색슨 우물 속에서 독립적으로 궤도 운동을 합니다. 모든 $(l, j)$ 채널의 지름 방향 슈뢰딩거 방정식을 유한 차분 해밀토니안 배치 하나로 풀고 스핀–궤도 힘을 키우면, 마법수 2, 8, 20, 28, 50, 82, 126(특히 안정한 원자핵의 핵자 수)이 준위 구조에서 가장 큰 간격으로 나타납니다.
notes: '스핀–궤도가 없으면 준위들은 3차원 조화 진동자처럼 뭉치고, 간격은 핵자 2, 8, 20, 40개 다음에 생깁니다(우즈–색슨 우물의 평평한 바닥 때문에 58, 92, 138도 갈라져 나옵니다). 스핀–궤도 항은 $j = l + \tfrac12$를 낮추고 $j = l - \tfrac12$를 높이며, 그 크기는 $l$과 함께 커집니다. 그래서 각 진동자 껍질의 높은 $j$ 짝(1f7/2, 1g9/2, 1h11/2, 1i13/2)이 아래 껍질로 내려옵니다. 이것이 28, 50, 82, 126에 대한 마이어와 옌젠의 1949년 설명입니다. 기본 매개변수는 ²⁰⁸Pb의 중성자에 대한 값입니다: $V_0 = 51 - 33(N-Z)/A \approx 44$ MeV, $r_0 = 1.27$ fm, $a = 0.67$ fm. 단순화: 모든 준위에 고정된 우물 하나(자기 일관성 없음, 짝짓기 없음), 쿨롱 항 없음(따라서 중성자 준위), 18 fm 상자이므로 속박 준위만 표시합니다.'
meanings:
- 내부 격자점; $r = 0$과 상자 가장자리에서 $u = 0$
- 유한 차분 $d^2/dr^2$
- $l = 8$까지의 모든 채널 $(l, j = l \pm \tfrac12)$
- $j = l+\tfrac12$이면 $+l/2$, $j = l-\tfrac12$이면 $-(l+1)/2$
- 우물 + 스핀–궤도 + 원심 항, einsum('k,i->ki')로
- 채널마다 해밀토니안 하나, 쌓아 올림
- $k$에 대해 배치; 속박 준위 $E < 0$만 남김
- '정렬된 각 준위까지 채운 핵자 수: 마법수는 큰 간격에 있음'
labels:
  v_so: 최종 스핀–궤도 세기 $V_{so}$
  v0: 우물 깊이 $V_0$
  mass_number: 질량수 $A$ ($R = r_0 A^{1/3}$ 결정)
  diffuseness: 표면 확산도 $a$
  n_grid: 격자점 수
