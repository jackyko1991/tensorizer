source_hash: 0456b6169f6d
title: Рассеяние волнового пакета в 2D
summary: 'Нестационарное уравнение Шрёдингера в двух измерениях, решаемое split-step методом Фурье на сетке $(N, N)$. Гауссов волновой пакет падает на стенку с двумя щелями (или на препятствие в форме диска); torch.fft.fft2 переключает между $x$-пространством, где потенциал диагонален, и $k$-пространством, где диагональна кинетическая энергия. Экран-детектор за барьером регистрирует проинтегрированную по времени вероятность: интерференционную картину, созданную волновой функцией одной частицы.'
notes: Единицы $\hbar = m = 1$, энергия пакета $E \approx k_0^2/2$. Без маски $M$ каждый множитель — чистая фаза, поэтому каждый шаг точно унитарен и норма остаётся равной 1; маска намеренно удаляет вероятность, достигшую краёв (иначе периодическая сетка БПФ вернула бы её с противоположной стороны), поэтому выводимая норма в конце падает. Для двух щелей на расстоянии $d$ полосы на экране на расстоянии $D$ отстоят друг от друга примерно на $\lambda D/d$ с $\lambda = 2\pi/k_0$ (экран не в дальней зоне, так что это лишь приближение). При выборе диска видна тень с ярким пятном Пуассона на оси позади него. Цвет изображения использует шкалу квадратного корня, нормированную на каждый кадр, чтобы слабые рассеянные волны оставались видимыми; барьер нарисован серым.
meanings:
- волновая функция на периодической двумерной сетке (первый индекс $x$, второй $y$)
- 'барьер: высокая стенка при $x \approx 0$ с двумя отверстиями или диск'
- оператор потенциала на полшага, диагональный в $x$-пространстве
- кинетический оператор на полный шаг, диагональный в $k$-пространстве
- 'суммирование по $x$ и $y$: одномерное преобразование Фурье вдоль каждой оси'
- плавное затухание у краёв, чтобы волны уходили, а не заворачивались
- проинтегрированная по времени вероятность на линии детектора $x = x_\text{screen}$
labels:
  barrier: Барьер
  k0: Импульс пакета $k_0$
  slit_sep: Расстояние между щелями $d$ (диаметр диска)
  slit_width: Ширина щели $w$
  n_grid: Точек сетки на ось
