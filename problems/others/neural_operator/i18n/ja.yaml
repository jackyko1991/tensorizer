source_hash: 4e46f39a529c
title: フーリエニューラルオペレーター：バーガース方程式の解作用素を学ぶ
summary: フーリエニューラルオペレーター（FNO）は、1 本の方程式を解くのではなく、スペクトル法ソルバーが生成したデータ対から、粘性バーガース方程式 $u_t + u\,u_x = \nu\,u_{xx}$ の写像 $u_0(x) \mapsto u(x, T)$ 全体を学習します。中心となる層はスペクトル畳み込みです。フーリエ変換し、複素重み $R_{iok}$ でモードごとにチャネルを混ぜ、最も低い $m$ 個のモードだけを残し、逆変換します。重みはフーリエモードの上に定義されているので、学習済みモデルは学習時より細かい格子でも動作します。
notes: 学習データは対 $(u_0, u(\cdot, T))$ です。ランダムな滑らかな初期条件（振幅が $1/k$ のように減衰するフーリエモード $k \le 5$ の和）とその解を、擬スペクトル法ソルバーで 256 点上で計算し、学習用に 64 点へ間引きます。ネットワークは方程式を一度も見ず、ソルバーのデータだけを見ます。テンソルの要点はスペクトル畳み込みです。rfft の後、各サンプル $b$ の各チャネル $i$ はフーリエ係数 $\hat v_{bik}$ になり、einsum('bik,iok->bok') は入力チャネル $i$ について和をとりますが、波数 $k$ は自由な添字として残すので、各モードが自分専用の $C\times C$ 複素行列 $R_{\cdot\cdot k}$ を持ちます。これは大域的な学習可能カーネルによる畳み込みで、フーリエ空間での積として計算されます。高いモード $k \ge m$ は切り捨てられ、局所経路 $W_{oi}v_{bix}$ と非線形関数 $\sigma$ が細部を取り戻します。$R_{iok}$、$W_{oi}$、$P$、$Q$ のどれも格子点数に依存しないので、学習済みの作用素は $2m$ 点より多い任意の格子で動作します。右下のパネルは「同じ」重みを 256 点に適用します（ゼロショット超解像）。対象は最も急な波面をもつテストケースです。64 点での予測（点）は 256 点の曲線の上に乗っています。この離散化不変性は近似的です。$\sigma$ が生む高調波は格子ごとに異なるエイリアシングを起こすからです。それでも 256 点での誤差は 64 点での誤差と同じです。精度を制限しているのは格子ではなくモデルです。衝撃波に近い解は $m$ を超えるモードを必要とし、最も難しいケースです。このトピックの PINN と比べてみましょう。PINN は方程式を損失関数に入れて「一つの」問題を解き、初期条件が変わるたびに学習し直す必要があります。ニューラルオペレーターはソルバーのデータから問題の族全体を学習し、その後の新しい予測はそれぞれ 1 回の順伝播だけで済みます。コンソールにはこの順伝播とソルバーの時間比較が表示されます。ここでは数十倍速いですが、1 次元バーガース方程式ではソルバー自体がすでに安く、データ生成と学習のほうがはるかに高くつきます。ニューラルオペレーターが真価を発揮するのは、1
  回のシミュレーションに何時間もかかり（気象、乱流、多孔質媒体の流れ）、多数の問い合わせが必要な場合で、しかも学習したデータの分布の内側に限られます。モード数 $m$ を減らす、学習データを小さくする、$\nu$ を大きくする（解がより滑らかで学習しやすい）などを試してください。簡略化：出力時刻 $T$ は 1 つだけ、乱数シードは固定、格子位置は単なる入力チャネルとして与え、パディングなし（領域はもともと周期的）。
meanings:
- 入力関数：サンプル $b$ の $N$ 個の格子点それぞれでの $u_0$ と位置
- 持ち上げ：$f$ について和をとり、各点で 2 つの特徴量を $C$ 個のチャネルにする
- 各チャネル $i$、波数 $k$ の複素フーリエ係数
- 複素重み、残す各モード $k < m$ ごとに $C\times C$ 行列が 1 つ：$N$ に依存しない
- 繰り返す $i$ ⇒ 和をとる；$k$ は和をとらない：各モードを別々に混ぜる
- 切り捨て：最も低い $m$ 個のフーリエモードだけがスペクトル畳み込みを通る
- 任意の個数 $N$ の格子点へ戻す：解像度はここで決まる
- 局所経路、各点で同じ $C\times C$ 行列；$\sigma$ = GELU
- 点ごとの 2 層の射影、$C$ 個のチャネルから予測 $u(x, T)$ へ
- サンプルごとの相対 $L^2$ 誤差をバッチで平均したもの：Adam が最小化する損失
- データ：擬スペクトル法ソルバー、積分因子 RK4 と 2/3 則によるエイリアシング除去、全サンプルを一度に計算
labels:
  nu: 粘性係数 $\nu$
  t_final: 出力時刻 $T$
  n_train: 学習サンプル数（初期条件）
  modes: 残すフーリエモード数 $m$
  width: チャネル数 $C$
  epochs: 学習エポック数
  lr: Adam の学習率
