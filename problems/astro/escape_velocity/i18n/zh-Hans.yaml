source_hash: d40b53524521
title: 逃逸速度
summary: 一批火箭以接近逃逸速度 $v_\mathrm{esc} = \sqrt{2GM/R}$ 的速率离开行星。能量的正负决定每枚火箭的命运：束缚的火箭（$E < 0$）会落回，非束缚的火箭（$E \ge 0$）则一去不返。
notes: 单位：行星半径 $R = 1$，$GM = 1$，因此 $v_\mathrm{esc} = \sqrt 2$（地球为 11.2 km/s）。火箭关闭发动机滑行，没有空气，行星不自转。速度略低于 $v_\mathrm{esc}$ 时，最高点按 $1/(1 - v^2/v_\mathrm{esc}^2)$ 急剧升高，往返时间也越来越长。恰好等于 $v_\mathrm{esc}$ 时，火箭永远在减速却永不停下。倾斜发射方向可以看到，逃逸速度与方向无关（只要轨迹不撞上行星）：只有能量起作用。暗星：把行星压缩到 $v_\mathrm{esc}$ 达到光速 $c$，就得到 $R = 2GM/c^2$。米歇尔（1783）和拉普拉斯认为这样的星体是看不见的。广义相对论给出的黑洞视界半径恰好相同（史瓦西半径，太阳约为 3 km），尽管背后的牛顿式推理并非真实的物理图像。
meanings:
- 火箭 $b$ 相对行星中心的位置
- 火箭 $b$ 的速度
- 重复的 $j$ ⇒ 求和：距离平方 $r_b^2$
- 行星的引力
- 单位质量能量：为负 ⇒ 束缚
- 表面处 $E = 0$ 对应的速率
- $2GM/c^2$：使 $v_\mathrm{esc} = c$ 的半径
- $R/(1 - v^2/v_\mathrm{esc}^2)$，竖直发射的最高点
labels:
  n_rockets: 火箭数
  f_min: 最慢发射 $v/v_\mathrm{esc}$
  f_max: 最快发射 $v/v_\mathrm{esc}$
  tilt: 偏离竖直的倾角
  t_max: 模拟时长
  dt: 时间步长
