title: 拉伸 DNA：蠕虫状链
summary: 用光镊拉一条 DNA 分子，它会像熵弹簧一样抵抗，并在接近全长时急剧变硬。将 Marko–Siggia 蠕虫状链公式与自由连接链进行比较，并用蒙特卡罗模拟一条具有弯曲刚度、由单位切向量构成的离散链，一次处理一整批力，作为同一个 $(B, M, N, 3)$ 张量。持续长度 $P \approx 50$ nm 可同时从切向量相关性和力–伸长曲线的拟合中得到。
notes: 双链 DNA 分子在短尺度上是刚性的，在长尺度上却很柔软：其骨架方向在持续长度 $P \approx 50$ nm（约 150 个碱基对）内被记住，之后便被遗忘。因此把它拉直付出的是熵，而不是键能。低力时响应是线性的，$z/L \approx 2 P F / 3 k_B T$，对任何 Kuhn 长度为 $b = 2P$ 的高分子都相同；高力时蠕虫状链只缓慢地趋近全长，$1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$，因为它必须熨平所有波长的弯曲模式，而由刚性链节组成的自由连接链则拉直得快得多，$1 - z/L \approx k_B T / F b$。对 λ 噬菌体 DNA 的实验（Smith、Finzi 和 Bustamante 1992；Bustamante、Marko、Siggia 和 Smith 1994）在约 10 pN 以下符合蠕虫状链，超过后双螺旋开始弹性伸长，并在约 65 pN 附近发生过度拉伸；本模型二者皆无。Marko–Siggia 公式是两个极限之间的插值，在中等伸长时与精确 WLC 的力相差最多约 10 %。模拟采用 $a = 2.5$ nm 的链段，因此刚度为 $K \approx 20.5$；每次蒙特卡罗扫描先把每个切向量稍微转动（对局部场做 Metropolis），再把每条链的尾段绕随机轴旋转（枢轴移动）。前一半扫描用于平衡，后一半用于平均。在最低的力下，伸长量在各链之间剧烈涨落且弛豫缓慢，因此这些点较为分散。拟合使用 0.5–4 pN：在每一点用 Marko–Siggia 解出 $P$，再在对数空间中平均（对 $\log F$ 做最小二乘）。在 $F \sim K k_B T / a$ 以上，链的离散性会表现为比连续公式略大的伸长。不含任何实验数据。
meanings:
- 受力 $b$ 拉伸的链 $m$ 中链段 $i$ 的单位切向量；各链从无外力的 WLC 出发
- $F_0 = 0$ 加上 0.02 到 10 pN 的 12 个力；$f_b$ 是以 $k_B T$ 为单位的功 $F a$
- 弯曲刚度 $\kappa / k_B T$，选取使 $\coth K - 1/K = e^{-a/P}$，即 $K \approx P/a + \tfrac12$
- 两个相邻切向量的拉力加上沿 $z$ 的外力
- 重复的 $k$ ⇒ 求和：转动一个切向量的能量变化；偶数和奇数链段轮流移动
- 重复的 $i, k$ ⇒ 求和：总弯曲能，用于转动整段尾链的枢轴移动
- 沿外力方向的伸长除以轮廓长度
- 无外力链的切向量相关性；其衰减长度为 $P$
labels:
  persistence: 持续长度 $P$
  contour_length: 轮廓长度 $L$
  chains: 每个力的链数 $M$
  sweeps: 蒙特卡罗扫描次数
