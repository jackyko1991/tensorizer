source_hash: 2038e43e9d92
title: 小さなタンパク質言語モデルがコンタクトを学ぶ
summary: einsum によるアテンション $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$ をもつ 2 層の Transformer を、格子フォールド上に結合を植え込んだ Potts モデルの配列について、マスクした文字を埋めることだけで訓練する。誰も構造を教えないのに、対称化し APC 補正したアテンションマップは植え込んだコンタクトを指し示す。これがタンパク質言語モデルのコンタクトヘッドの背後にある考え方である。
notes: なぜアテンションはコンタクトを見つけるのか？Potts モデルでは、他のすべてを与えたときのサイト $i$ の文字は、それに結合したサイト（マルコフブランケット）だけに依存する。したがってマスクした文字を推測する最良の方法はコンタクト相手を見ることであり、アテンションはまさにそれを学習する。Rao et al., "Transformer protein language models are unsupervised structure learners"（ICLR 2021）は、数百万の天然配列で訓練した大規模タンパク質言語モデルのアテンションマップがコンタクトを符号化していることを示した。読み出しは、APC 補正・対称化したマップに対し、少数のタンパク質でフィットしたロジスティック回帰で行う。その後 ESM-2（2022–2023）などのモデルは、こうした表現から 3D 構造を予測するに至った。ここでの読み出しは完全に教師なし（ヘッドの単純平均）で、ファミリーは合成であり、テスト損失は文脈を使わない二つのベースライン、ユニグラム（一つの文字分布）とサイトごとのプロファイルと比較する。プロファイルを上回ることは、モデルが文脈、すなわち結合を利用していることを意味する。蛇行フォールドはコンタクトを β シートのストランドのように反対角線上に置く。ランダムな組なら当たるのは約 5 % にすぎない。APC は誰もが注目する位置の背景を除去する。より弱い結合、より少ない配列、単一ヘッドを試してみよう。
meanings:
- 格子フォールドで接触する残基の間だけにあるランダムな結合ブロック。ギブスサンプリングで配列ファミリーにする
- 文字 $s_{ni}$ のトークン埋め込みと位置埋め込みの和（マスクした文字は [MASK] トークンを使う）
- $c$ の繰り返し ⇒ 和：各ヘッドのクエリ（キーとバリューも同様）
- $k$ の繰り返し ⇒ 和。各行は注目先の位置 $j$ についての確率分布
- $j$、続いて $h, k$ の繰り返し ⇒ 和：各位置が他の位置から集める情報
- マスクした 15 % の位置での真の文字の交差エントロピー。Adam で最小化
- テスト配列で平均し、ヘッドごとに対称化・APC 補正したアテンションを、さらに層 $l$ とヘッド $h$ について平均
labels:
  coupling: 植え込む結合の強さ $\sigma_J$
  n_seq: 訓練配列数
  q: アルファベットサイズ $q$
  layers: Transformer の層数
  heads: アテンションヘッド数 $H$
  d_model: モデル幅 $d$
  steps: 訓練ステップ数
  lr: 学習率
  mask_rate: マスクの割合
