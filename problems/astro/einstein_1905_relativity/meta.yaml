title: 'Einstein 1905: moving bodies and $E = mc^2$'
category: astro
level: intermediate
order: 7
tags: [annus-mirabilis:1905, series:einstein-1905:3]
summary: >
  Einstein's own route through his two 1905 relativity papers. From two postulates — the same laws in every inertial frame, light always at $c$ —
  a batch of light clocks shows moving time slowed by $\gamma$, rods shortened by $1/\gamma$, simultaneity that depends on the observer and
  speeds that never add beyond $c$. The mass–energy paper (a body emitting light energy $L$ loses mass $L/c^2$) is checked on the He-4 mass
  defect and $e^+e^-$ annihilation, and a fit to Frisch and Smith's 1963 muon counts on Mt Washington and at sea level gives $\gamma \approx 9$.
animated: true
vector_form: '\Delta t = \gamma\,\Delta\tau,\quad L = L_0/\gamma,\quad \gamma = \frac{1}{\sqrt{1 - v^2/c^2}},\qquad w = \frac{u + v}{1 + uv/c^2},\qquad \Delta m = \frac{L}{c^2},\quad E^2 = (pc)^2 + (mc^2)^2'
index_form: 'x''^\mu = \Lambda^\mu{}_\nu\,x^\nu,\qquad \eta_{\mu\nu}\Delta x''^\mu\Delta x''^\nu = \eta_{\mu\nu}\Delta x^\mu\Delta x^\nu,\qquad \eta_{\mu\nu}\,p^\mu p^\nu = -m^2c^2,\qquad N_{\text{sea}} = N_{\text{top}}\,e^{-t_{\text{lab}}/(\gamma\tau_\mu)}'
