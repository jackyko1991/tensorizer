  - {symbol: 'E = \sqrt{p^2 + m^2}', code: 'energy(p, 1j * mu)', shape: '(U,) complex', meaning: 'complex square root: real when $p > \mu$, even though $m$ and $\gamma$ are both imaginary'}
  - {symbol: '\Lambda^a{}_b(\beta_B)', code: 'boost_matrix(betas)', shape: '(F, 2, 2)', meaning: 'one Lorentz boost per observer frame ($c = 1$)'}
