source_hash: 5c7383dc415a
title: Квантовое туннелирование
summary: 'Гауссов волновой пакет падает на прямоугольный барьер. Нестационарное уравнение Шрёдингера решается split-step методом Фурье: потенциал — диагональный оператор в $x$-пространстве, а кинетическая энергия — диагональный оператор в $k$-пространстве, так что каждая половина шага по времени — просто поэлементное умножение тензоров, а torch.fft переключает между двумя базисами.'
notes: Единицы $\hbar = m = 1$, энергия пакета $E \approx k_0^2/2$. Диагональный оператор $D_{xy} = d_x\,\delta_{xy}$, действующий на $\psi$, даёт $D_{xy}\psi_y = d_x\psi_x$ — матрица не нужна, достаточно поэлементного умножения. Расщепление Странга $P\cdot K\cdot P$ имеет второй порядок точности по $\Delta t$ и точно унитарно, так что норма остаётся равной 1 с точностью до округления. Время моделирования выбирается автоматически ($45/k_0$), чтобы центр пакета прошёл от $x = -25$ примерно до $x = +20$. При $E < V_0$ классическая частица всегда отразилась бы; прошедший сгусток справа — это туннелирование. Коэффициент прохождения плоской волны $T(k_0)$, выводимый для сравнения, не учитывает разброс импульсов пакета (и использует ширину барьера в том виде, в каком она легла на сетку); более широкий пакет (больший $\sigma_0$) имеет более определённый импульс и лучше с ним согласуется.
meanings:
- волновая функция на периодической сетке $x$
- 'оператор потенциала на полшага: диагонален по $x$, применяется как psi * P'
- 'кинетический оператор на полный шаг: диагонален по $k$, применяется как psi_k * K'
- смена базиса $x \to k$ (быстрое матричное произведение, матрица явно не строится)
- 'прохождение: вероятность обнаружить частицу справа от барьера'
labels:
  k0: Импульс пакета $k_0$
  V0: Высота барьера $V_0$
  width: Ширина барьера $a$
  sigma: Ширина пакета $\sigma_0$
