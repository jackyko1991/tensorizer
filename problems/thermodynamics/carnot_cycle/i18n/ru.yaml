source_hash: 539b278aa207
title: Цикл Карно идеального газа
summary: Две изотермы и две адиабаты идеального газа, представленные тензором точек $(V, p)$. Работа — площадь, охваченная циклом на диаграмме $p$–$V$, вычисленная через torch.trapezoid, а КПД $W/Q_h$ точно совпадает с пределом Карно $1 - T_c/T_h$.
notes: 'Теплота пересекает границу только на изотермах: $Q_h = nRT_h\ln(V_2/V_1)$ подводится, $Q_c = nRT_c\ln(V_3/V_4)$ отводится. Поскольку адиабаты связывают отношения объёмов, $V_3/V_4 = V_2/V_1$, поэтому КПД зависит только от двух температур. Участки сжатия идут в сторону меньших $V$, так что torch.trapezoid автоматически даёт для них отрицательную работу. На диаграмме $T$–$S$ цикл — прямоугольник, и его площадь тоже равна $W$. Объём начинается с $V_1 = 1$ литра.'
meanings:
- точка $k$ на участке $l$ цикла ($l$ = горячая изотерма, адиабата, холодная изотерма, адиабата)
- изотерма, поэлементно на тензоре объёмов
- адиабата через вершину цикла
- 'повторяющийся $k$ ⇒ суммирование: работа на каждом участке'
- 'сумма по участкам $l$: охваченная площадь'
- энтропия вдоль пути, для диаграммы $T$–$S$
labels:
  T_h: Нагреватель $T_h$
  T_c: Холодильник $T_c$
  ratio: Степень расширения $V_2/V_1$
  n: Количество газа
  gas: Газ
