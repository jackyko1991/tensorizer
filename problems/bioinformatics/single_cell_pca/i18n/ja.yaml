source_hash: f93e7ab544e0
title: シングルセル RNA-seq：PCA と k-means クラスタリング
summary: 合成のシングルセル実験：いくつかの型の細胞がそれぞれ固有のマーカー遺伝子をオンにし、カウントは負の二項分布に従い、細胞ごとにシーケンス深度が異なる。標準的なパイプラインをテンソル演算として実行する：$\log(1 + 10^4 K_{cg}/n_c)$ に正規化し、高変動遺伝子を残し、SVD による PCA を行い、複数の初期値で並列に k-means を実行し、調整ランド指数で真の型とクラスターを比較して評価する。
notes: 各細胞からは数千の遺伝子にわたって数千個の mRNA カウントが得られるので、ほとんどの要素はゼロで、生のカウントは主に細胞がどれだけ深くシーケンスされたかを反映する。ライブラリサイズ $n_c$ で割ると深度の影響が除かれ、対数は発現レベルの巨大な幅を和らげる。ほとんどの遺伝子はノイズしか運ばないので、同程度の平均をもつ遺伝子が示す以上の分散をもつ遺伝子、すなわち植え込んだマーカーが濃縮された高変動遺伝子を残す。次に PCA がそれらを圧縮する：$K$ 個の型があるとシグナルは約 $K-1$ 個の方向にあり、スクリープロットで平坦なノイズの床の上に立つ最初の $K-1$ 本のバーとして見える。k-means は二つのステップを交互に行う。各細胞を最も近い中心に割り当て、各中心をその細胞群の平均に移す。どちらのステップも慣性 $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$ を増やせないので収束するが、局所最小にしか収束しない。そのため複数のランダムな初期値を並べて実行し（灰色の曲線）、最良のものを残す。真の型がわかっているので、調整ランド指数は結果を公正に評価する。オプションの t-SNE マップは autograd で学習する小さな力学的レイアウトである（Student-t 類似度、early exaggeration）。こうしたマップ上のクラスター間の距離にはあまり意味がない。実際のパイプライン（Scanpy、Seurat）は品質管理、バッチ補正、最近傍グラフ上のグラフベースのクラスタリング（Leiden）を加え、実際の細胞型がこれほどきれいなことはまれである。より小さい発現変化倍率、より少ないマーカー、誤った $k$ を試してみよう。
meanings:
- 型 $k$ における遺伝子 $g$ の平均発現：対数正規分布のベースラインに、$k$ の $M$ 個のマーカー遺伝子では発現変化倍率を掛ける
- 負の二項分布のカウント（分散 $m + \varphi m^2$）。$s_c$ は対数正規分布のシーケンス深度
- ライブラリサイズ：細胞 $c$ の総カウント、$g$ について和
- 深度正規化（CPM のように $10^4$ あたりのカウント）と対数変換
- 分散比 $\mathrm{Var}/\mathrm{Mean}$。平均が近いビン内で標準化（ビンの和は one-hot の einsum で）
- $H$ 個の高変動遺伝子についての中心化行列の PCA。torch.pca_lowrank も同じ上位成分を与える
- PC スコア、$g$ について和。$\Sigma_p^2/\sum_q\Sigma_q^2$ が寄与率
- 初期値 $r$ における細胞 $c$ と中心 $k$ の距離の二乗。$p$ について和、$R$ 個の初期値すべてを同時に
- 割り当てステップ：各細胞が最も近い中心に属する
- 更新ステップ：各中心がその細胞群の平均へ移動、$c$ について和
- 分割表 $n_{ij}$（one-hot の einsum）からの組の数え上げによる一致度。1 = 完全、約 0 = ランダム
labels:
  n_cells: 細胞数 $C$
  n_genes: 遺伝子数 $G$
  n_types: 真の細胞型の数 $K$
  n_markers: 型あたりのマーカー遺伝子数
  fold_change: マーカーの発現変化倍率
  dispersion: 負の二項分布の分散パラメータ $\varphi$
  depth_spread: ライブラリサイズのばらつき（対数正規分布の $\sigma$）
  n_hvg: 残す高変動遺伝子数
  n_pcs: クラスタリングに使う主成分数
  k: クラスター数 $k$
  kmeans_iters: k-means の反復回数
  embedding: 2D 表示：PC1–PC2 または t-SNE
