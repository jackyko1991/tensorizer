title: बर्नूली और वेंचुरी नली
summary: संकरे होते पाइप से बहता पानी समान प्रवाह दर ($A u = Q$) बनाए रखने के लिए तेज़ होता है, और बर्नूली नियम के अनुसार कंठ (throat) में उसका दाब घटता है। क्षेत्रफल, वेग और दाब पाइप अक्ष पर टेंसर हैं; अनुरेखक (tracer) कणों का एक बैच चाल में वृद्धि दिखाता है।
notes: 'प्रवाह को एकविमीय माना गया है: हर अनुप्रस्थ काट पर वेग एकसमान है और घर्षण उपेक्षित है, यही बर्नूली नियम को यहाँ सटीक बनाता है। स्थानीय त्रिज्या के एक निश्चित अंश पर रखे अनुरेखक दीवार का अनुसरण करते हैं। गेज खुली नलियाँ हैं जिनका द्रव स्तंभ $h = p/(\rho g)$ स्थानीय गेज दाब के साथ बढ़ता है। $p_1 - p_2$ मापने से प्रवाह दर मिलती है, $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$ — वेंचुरी मीटर ऐसे ही काम करता है। यदि कंठ का दाब वायुमंडलीय से नीचे गिरे, तो वास्तविक प्रवाह में कोटरन (cavitation) हो सकता है; यहाँ उसके बजाय एक चेतावनी छपती है।'
meanings:
- पाइप अक्ष के अनुदिश बिंदु, सूचकांक $k$
- अक्ष के हर बिंदु पर अनुप्रस्थ काट
- 'सांतत्य: हर काट से प्रति सेकंड समान आयतन गुज़रता है'
- 'बर्नूली: तेज़ प्रवाह ⇒ कम दाब'
- अनुरेखकों के बैच की स्थितियाँ, RK4 से चलाई गईं
- आयतन प्रवाह दर $A_1 u_1$, m³/s में
labels:
  u1: प्रवेश चाल $u_1$
  area_ratio: क्षेत्रफल अनुपात $A_1/A_2$
  p1: प्रवेश गेज दाब $p_1$
