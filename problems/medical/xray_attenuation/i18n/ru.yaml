source_hash: 9753ed59836b
title: Ослабление рентгеновского излучения и контраст изображения
summary: Рентгеновское излучение экспоненциально ослабевает в теле, $I = I_0\,e^{-\int\mu\,dl}$. Фантом грудной клетки из лёгкого, мягких тканей, кости и йодного контрастного вещества проецируется луч за лучом одним einsum, показывая, почему кость выделяется при низкой энергии и как реальный спектр трубки становится жёстче с глубиной.
notes: 'В логарифмическом масштабе проекция аддитивна: $-\ln(I/I_0)$ — сумма $\mu\,L$ по материалам, так что монохроматическое изображение линейно зависит от длин пути в материалах. Однородный слой ослабляет пучок вдвое на каждом слое половинного ослабления $\ln 2/\mu$. Фотоэлектрическое поглощение растёт примерно как $Z^3/E^3$, поэтому контраст кости велик при 30–50 кэВ и пропадает при более высокой энергии; поглощение йода скачком возрастает выше его K-края при 33 кэВ, поэтому его и используют как контрастное вещество. Реальная трубка излучает спектр: мягкие фотоны поглощаются первыми, средняя энергия растёт, а эффективный $\mu$ уменьшается с глубиной (ужесточение пучка). Упрощения: прямые параллельные лучи, без рассеяния, без отклика детектора, восемь табличных энергий с округлёнными значениями $\mu$. Все числа приближённые и только для обучения, не для клинического применения.'
meanings:
- 'фантом в one-hot кодировке: 1, где пиксель $(y, x)$ состоит из материала $m$'
- длина пути луча внутри строки пикселей $y$
- 'повторяющийся $y$ ⇒ суммирование: длина материала $m$, пересекаемая лучом $x$'
- линейный коэффициент ослабления материала $m$ при энергии $E_e$ (1/см)
- 'повторяющийся $m$ ⇒ суммирование: линейный интеграл $\int \mu\, dl$ для каждой энергии и каждого луча'
- спектр трубки (закон Крамерса, алюминиевый фильтр), $\sum_e S_e = 1$
- 'повторяющийся $e$ ⇒ суммирование: прошедшая доля полихроматического пучка'
