source_hash: 28d4b810cb16
title: 제한 삼체 문제의 라그랑주 점
summary: 별과 행성이 서로의 주위를 돕니다. 이들과 함께 회전하는 좌표계에서 시험 입자는 중력, 원심력, 그리고 $\varepsilon_{ijk}$로 쓴 코리올리 힘을 받습니다. $\nabla\Phi_\mathrm{eff} = 0$에 뉴턴 방법을 적용하면(기울기와 헤세 행렬은 autograd로) 다섯 라그랑주 점을 한꺼번에 찾고, L4에서 살짝 밀려난 입자들은 올챙이 궤도와 말굽 궤도를 그립니다.
notes: '단위: 두 천체 사이 거리 1, $G(M_1 + M_2) = 1$이므로 쌍은 $2\pi$마다 한 바퀴 돕니다. 행성의 질량비는 $\mu$이며, 시험 입자는 너무 가벼워 두 천체에 영향을 주지 않습니다. L1, L2, L3는 두 천체를 잇는 직선 위에 있고 $\Phi_\mathrm{eff}$의 안장점입니다. L4와 L5는 두 천체와 정삼각형을 이루며 $\Phi_\mathrm{eff}$의 극대점이지만, $\mu < 0.0385$이면 코리올리 힘 덕분에 안정합니다. 목성의 트로이 소행성들이 행성의 60° 앞과 뒤에 모여 있는 이유입니다. 더 크게 밀면 작은 올챙이 고리가 커지고, 결국 L3까지 감싸는 말굽 궤도가 됩니다. $\mu$가 0.0385보다 크면 입자들은 멀리 떠내려갑니다.'
meanings:
- 회전 좌표계에서 시험 입자 $b$의 위치
- 별은 $(-\mu, 0, 0)$, 행성은 $(1-\mu, 0, 0)$
- '반복된 $s$ ⇒ 합: 두 천체의 중력'
- 외적을 위한 레비치비타 기호
- 코리올리 가속도, $\boldsymbol\Omega = \hat{\mathbf z}$
- 다섯 점 모두에서 autograd로 구한 기울기
- 'autograd로 구한 헤세 행렬: 뉴턴 단계는 배치 linalg.solve 한 번'
- $-2\Phi_\mathrm{eff} - \dot x_i\dot x_i$, 보존량
labels:
  mu: 행성 질량비 $\mu$
  nudge: 궤도 방향으로 L4에서 민 최대 변위
  t_max: 시뮬레이션 시간
  dt: 시간 간격
