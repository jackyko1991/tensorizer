<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Operator search: a digit image x feeds a small DAG of nodes z1, z2, z3; every edge is a mixture of candidate operators weighted by softmax of alpha; the chosen operators are written as an equation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#111827">
    <!-- the digit -->
    <rect x="8" y="60" width="34" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <path d="M17,70 Q25,62 32,70 Q34,78 22,88 L34,88" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <text x="18" y="108" font-style="italic">x</text>
    <!-- edges -->
    <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="44" y1="70" x2="82" y2="38"/>
      <line x1="44" y1="84" x2="82" y2="118"/>
      <line x1="94" y1="44" x2="94" y2="110"/>
      <line x1="44" y1="77" x2="132" y2="77"/>
      <line x1="104" y1="38" x2="136" y2="70"/>
      <line x1="104" y1="118" x2="136" y2="86"/>
      <line x1="158" y1="77" x2="180" y2="77"/>
    </g>
    <!-- nodes -->
    <g fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5">
      <circle cx="94" cy="32" r="11"/><circle cx="94" cy="124" r="11"/><circle cx="146" cy="77" r="11"/>
    </g>
    <text x="87" y="36" font-style="italic">z₁</text>
    <text x="87" y="128" font-style="italic">z₂</text>
    <text x="139" y="81" font-style="italic">z₃</text>
    <!-- mixture weights on one edge: softmax(alpha) bars -->
    <g fill="#2563eb">
      <rect x="50" y="34" width="4" height="4"/><rect x="55" y="30" width="4" height="8"/><rect x="60" y="22" width="4" height="16"/><rect x="65" y="35" width="4" height="3"/>
    </g>
    <text x="44" y="18" font-size="10" fill="#1d4ed8">softmax(α)</text>
    <!-- read-out and equation -->
    <rect x="182" y="64" width="50" height="26" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="191" y="81" font-style="italic">ŷ = …</text>
    <text x="166" y="112" font-size="10" fill="#374151">equation</text>
  </g>
</svg>
