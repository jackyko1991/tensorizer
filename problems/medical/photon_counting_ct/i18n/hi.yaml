title: फ़ोटॉन-गणक CT और पदार्थ विघटन
summary: एक फ़ोटॉन-गणक (photon-counting) संसूचक हर एक्स-रे को ऊर्जा बिनों में छाँटता है, इसलिए हर किरण एक के बजाय कई बियर–लैम्बर्ट मापन $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$ देती है। एक बैच अधिकतम-संभाविता फ़िट (autograd प्रवणता, फ़िशर-स्कोरिंग चरण) हर किरण की पॉइसॉन गिनतियों को जल, अस्थि और आयोडीन के रेखा-समाकलों में बदलता है; फ़िल्टर्ड बैक-प्रोजेक्शन पदार्थ मानचित्र और आभासी एकऊर्जी (monoenergetic) प्रतिबिंब बनाता है, और आयोडीन को अस्थि से अलग करता है जिन्हें पारंपरिक स्कैनर एक जैसा दिखाता है।
notes: 'फ़ोटॉन-गणक संसूचक (कैडमियम टेल्यूराइड या सिलिकॉन) एकल फ़ोटॉन दर्ज करते हैं और हर स्पंद की ऊँचाई की तुलना कई देहलियों (thresholds) से करते हैं, इसलिए हर ऊर्जा बिन की गिनती एक अलग बियर–लैम्बर्ट मापन है। पहले फ़ोटॉन-गणक CT स्कैनर को 2021 में US FDA की स्वीकृति मिली, और तब से स्पेक्ट्रमी इमेजिंग, बेहतर विभेदन और कम इलेक्ट्रॉनिक रव शोध से क्लिनिकों तक पहुँचे हैं। तीन पदार्थों के लिए कम से कम तीन बिन चाहिए: जल और अस्थि मुख्यतः प्रकाशविद्युत प्रभाव से भिन्न होते हैं, और आयोडीन 33.2 keV पर अपना K-किनारा (K-edge) जोड़ता है, इसलिए 35 keV के पास की देहली मदद करती है (25, 50, 75 keV सेटिंग आज़माएँ)। अस्थि इंसर्ट को तब तक तनु किया गया है जब तक उसका ऊर्जा-भारित क्षीणन 10 mg/mL आयोडीन इंसर्ट के बराबर न हो जाए, इसलिए पारंपरिक प्रतिबिंब दोनों को बराबर दिखाता है; पदार्थ मानचित्र उन्हें अलग करते हैं। आभासी एकऊर्जी प्रतिबिंब $\mu_m(E)a_m$ कम ऊर्जा पर आयोडीन विपर्यास बढ़ाते हैं और उनमें बीम-हार्डनिंग कपिंग नहीं होती, जो पारंपरिक प्रतिबिंब में दिखती है। तीन-पदार्थ विघटन रव को बढ़ाता है (आधार क्षीणन वक्र
  लगभग समांतर हैं), इसलिए आयोडीन त्रुटि केवल $1/\sqrt{N_0}$ की तरह घटती है और मध्यम खुराक पर प्रति पिक्सेल कुछ mg/mL होती है; क्लिनिकल तंत्र अक्सर दो आधार पदार्थ, रव-निवारण और पुनरावृत्त पुनर्निर्माण का उपयोग करते हैं। सरलीकरण: समांतर किरणपुंज, गॉसियन ऊर्जा विभेदन को छोड़कर आदर्श संसूचक (कोई आवेश-साझेदारी, पाइल-अप या K-पलायन नहीं), कोई प्रकीर्णन नहीं, पूर्णांकित क्षीणन तालिकाएँ। शैक्षिक मॉडल, क्लिनिकल उपयोग के लिए नहीं।'
meanings:
- 'प्रति पिक्सेल आधार मात्राएँ: जल अंश, अस्थि अंश, mg/mL में आयोडीन'
- 'हर आधार मानचित्र का रेडॉन रूपांतरण: किरण $r = (\theta, s)$ के अनुदिश जल के cm, अस्थि के cm, आयोडीन के mg/cm²'
- 1 keV ग्रिड पर हर आधार पदार्थ का क्षीणन (XCOM, log-log अंतर्वेशित, आयोडीन K-किनारा 33.2 keV पर)
- फ़िल्टर किया गया ट्यूब स्पेक्ट्रम; ऊर्जा $E_e$ के फ़ोटॉन के बिन $b$ में गिने जाने की प्रायिकता (गॉसियन ऊर्जा विभेदन)
- 'प्रति बिन बियर–लैम्बर्ट: दोहराया गया $m$ फिर $e$ ⇒ योग; गिनतियाँ $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$ हैं'
- पॉइसॉन ऋणात्मक लॉग-संभाविता की प्रवणता; किरणें स्वतंत्र हैं, इसलिए एक पश्च पास हर किरण को उसकी अपनी प्रवणता देता है
- फ़िशर सूचना, दोहराया गया $b$ ⇒ योग; $J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- 'प्रति किरण एक $3\times 3$ हल, बैच में: फ़िशर-स्कोरिंग (न्यूटन-जैसा) चरण'
- पुनर्निर्मित आधार मानचित्रों से ऊर्जा $E$ पर आभासी एकऊर्जी प्रतिबिंब, HU में दिखाया गया
labels:
  kvp: ट्यूब वोल्टता
  dose: प्रति किरण फ़ोटॉन $N_0$
  thresholds: ऊर्जा देहलियाँ (keV)
  sigma_kev: ऊर्जा विभेदन $\sigma$
  n_pixels: प्रतिबिंब आकार $N$
  n_angles: प्रक्षेपण कोण
