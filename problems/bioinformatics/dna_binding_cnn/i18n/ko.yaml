source_hash: e272fe98f3be
title: 작은 CNN이 DNA 결합 모티프를 찾는다
summary: 무작위 DNA 서열 집합의 절반에 전사 인자 결합 부위의 축퇴된 사본이 하나씩 들어 있다. 1층 1D 합성곱 신경망 $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$와 최대 풀링이 autograd와 Adam으로 둘을 구별하도록 학습한다. 서열 로고로 읽어 보면 가장 중요한 필터가 심어 둔 모티프로 변한다.
notes: 전사 인자는 짧고 약간 가변적인 단어, 즉 모티프를 찾은 곳에서 DNA에 결합하며, 모티프는 보통 위치 가중 행렬(PWM)로 요약된다. PWM으로 서열을 스캔하는 것은 정확히 원-핫 서열과 $w \times 4$ 필터의 1D 합성곱이다. 그래서 합성곱 신경망이 유전체학에 잘 맞는다. 첫 층의 필터는 모티프 검출기이고, 최대 풀링은 부위가 어디에 있든 답이 같게 만든다. 여기서는 아무것도 신경망에 모티프가 무엇인지 알려 주지 않는다. 신경망은 레이블만 보며, 경사 하강법이 가장 유용한 필터를 심어 둔 단어의 모양으로 만든다(잡음에서 로고가 선명해지는 것을 보자). 점선은 모티프를 아는 기준선으로, 참 PWM으로 스캔한 결과다. 심은 부위가 축퇴되어 있고 무작위 DNA가 가끔 부위처럼 보이기 때문에 이 기준선조차 100%에 도달할 수 없으며, 학습된 신경망은 그에 가깝게 끝난다. 정방향 가닥만 사용하고 배경은 균일하다. 실제 모형은 역상보 가닥도 스캔하고 GC 함량, 반복 서열, 잡음 섞인 실험 레이블을 감당해야 한다. 이것은 단백질 결합 실험에서 모티프를 학습한 DeepBind(2015)의 아이디어다. Basset, Basenji, Enformer 같은 모형은 훨씬 많은 층(과 어텐션)을 쌓아 100 kb 서열에서 크로마틴과 발현을 예측한다. 이 장난감은 첫 층의 아이디어만 재현한다. 더 약한 모티프, 짧은 모티프(E-box, CACGTG는 우연히 더 자주 나타난다), 또는 더 적은 필터를 시도해 보자.
meanings:
- '심은 위치 가중 행렬: 합의 염기가 확률 "strength"로 나오고 나머지 세 염기가 남은 확률을 나눈다'
- 서열 $n$은 위치 $l$에 염기 $b \in$ {A, C, G, T}를 가진다. 부위를 심었으면 레이블 $y_n = 1$
- 길이 $w$인 모든 창(복사 없는 뷰), $P = \ell - w + 1$
- '학습 가능한 필터: 염기와 위치마다 점수가 있으며 PWM과 모양이 같다'
- '합성곱: $k, b$에 대해 합, 필터 $f$를 모든 위치 $p$에서 점수화'
- '전역 최대 풀링: 어디서든 가장 잘 맞는 곳을 취하므로 부위가 어느 위치에 있어도 된다'
- 로짓, $f$에 대해 합. 이진 교차 엔트로피, autograd, Adam(미니배치 100)으로 학습
- 'DeepBind처럼 모티프로 되돌리기: 점수가 최고 점수의 절반을 넘는($\kappa_{nf} = 1$) 각 양성 서열의 최적 창 $p^*_{nf}$을 평균, $n$에 대해 합'
- '비트 단위 정보량: 위치 $k$에서 로고 쌓기의 높이'
- 최적 이동에서 학습된 행렬과 심은 행렬의 상관. 1 = 동일
labels:
  motif: '심은 모티프: NF-κB, AP-1 또는 E-box'
  strength: 합의 염기의 확률
  n_seq: 서열 수(학습 80% / 테스트 20%)
  length: 서열 길이 $\ell$
  n_filters: 필터 수 $F$
  width: 필터 너비 $w$
  epochs: 학습 에폭
  lr: Adam 학습률
