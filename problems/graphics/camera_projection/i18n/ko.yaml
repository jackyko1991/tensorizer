title: 핀홀 카메라
summary: '3D 장면이 2D 이미지가 되는 과정: 모델, 뷰, 투영 $4\times4$ 행렬이 동차 좌표에 작용하고, 원근 나눗셈과 뷰포트가 픽셀을 준다. 카메라가 궤도를 도는 동안 와이어프레임 물체의 모든 꼭짓점을 einsum 한 번으로 동시에 투영한다. 원근 투영을 정사영 투영 및 돌리 줌과 비교하고, 평행선이 소실점에서 만나는 것을 보고, 같은 카메라를 $K[R\,|\,\mathbf t]$로 써 보자.'
notes: 네 번째 좌표 덕분에 카메라가 선형이 된다. 평행 이동은 행렬의 한 열이 되고, 깊이로 나누는 원근 투영은 깊이를 $\tilde x_4$에 복사하는 행렬과 마지막의 나눗셈 한 번이 된다. $w = 0$인 점은 방향이며, 그 상이 소실점이다. 모든 수평 방향은 지평선 위에서 소실되며, 카메라가 아래를 내려다볼 때 지평선은 이미지 중심보다 위에 있다. 정사영 카메라는 $\tilde x_4 = 1$이므로 소실점이 없고 먼 물체도 작아지지 않는다. 공학 도면이나 많은 전략 게임이 이렇다. 돌리 줌("현기증 효과")은 $d\,\tan(\text{fov}/2)$가 일정하도록 카메라를 움직이면서 시야각을 바꾼다. 물체의 크기는 그대로지만 뒤의 바닥이 늘어난다. 컴퓨터 비전 라이브러리는 $z$가 앞을 향하는 $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$를 쓰고, 그래픽스 API는 $z$가 뒤를 향하는 $P V M$을 쓴다. 둘은 $y$축과 $z$축을 뒤집는 것만 다르며, 터미널에서 같은 픽셀을 주는지 확인한다.
meanings:
- 동차 좌표 $(x, y, z, 1)$의 꼭짓점 $v$; 모서리는 첨자 쌍 $(E, 2)$
- '물체 → 월드: 크기 조절, $y$축 회전, 그다음 평행 이동(네 번째 열)'
- '월드 → 카메라: 행은 카메라 축, 평행 이동은 $-R\,\mathbf e$'
- '카메라 → 클립 공간; 마지막 행이 $-z$를 $\tilde x_4$에 복사(정사영: $\tilde x_4 = 1$)'
- '반복된 $j, k, l$ ⇒ 합산: 모든 꼭짓점을 세 행렬에 한 번의 호출로 통과'
- $\tilde x_4$로 원근 나눗셈 후 뷰포트; 이미지 행은 아래로 셈
- 초점 거리 $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$와 주점; 강체 운동 월드 → 카메라
- '무한원점 $(\hat{\mathbf d}, 0)$은 평행 이동을 잃음: $\hat{\mathbf d}$ 방향의 모든 직선이 그곳에서 만남'
labels:
  shape: 물체
  yaw: 물체 회전 (모델 행렬)
  fov: 시야각
  distance: 카메라 거리
  height_cam: 카메라 높이
  width: 이미지 너비
  height: 이미지 높이
  frames: 궤도당 프레임 수
