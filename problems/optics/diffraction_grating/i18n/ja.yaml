source_hash: e3a181f70abb
title: フェーザーの和としての回折格子
summary: $N$ 本のスリットによる遠方場は、スリットごとに1つ、余分な光路差 $d\sin\theta$ だけ遅れた $N$ 個の複素フェーザーの和である。複素テンソルを使えばパターン全体が1回の einsum になる。$N$ を 2 から 20 に増やすと、主極大の位置は変わらないが鋭くなり、その間に $N-2$ 個の弱い副極大が現れる。
notes: 右パネルは、ある角度での $N$ 個のフェーザーを頭と尾をつないで描く。主極大（$d\sin\theta = m\lambda$）ではすべてが同じ向きを向き、長さ $N$ に足し合わさる。極大から離れると鎖は丸まり、$N\phi = 2\pi$ で多角形として閉じる：これが最初の零点であり、その角度は $1/N$ のように縮む。強度は中央ピークで 1 に規格化している。点線は $d\sin\theta = m\lambda$ を示す。スリット幅 $a$ に依存するのは単スリットの包絡線だけである。
meanings:
- スリット番号；スリット $n$ はスリット 0 から距離 $nd$
- 観測方向、細かい格子でサンプリング
- 角度 $t$ で見たスリット $n$ の位相因子
- 繰り返される $n$ ⇒ 和をとる：全スリットからの波を足す
- 単スリット回折の包絡線 $\operatorname{sinc}^2(a\sin\theta/\lambda)$
- 強度 ＝ 複素振幅の絶対値の2乗
- 同じ和を手計算で（等比級数）、$\phi = kd\sin\theta$
labels:
  wavelength: 波長 $\lambda$
  d: スリット間隔 $d$
  a: スリット幅 $a$
  n_max: 最大スリット数 $N$
