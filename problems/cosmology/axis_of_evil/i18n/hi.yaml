title: माइक्रोवेव आकाश में “बुराई की धुरी”
summary: 'कॉस्मिक माइक्रोवेव पृष्ठभूमि के असली WMAP मानचित्र के दो सबसे बड़े पैटर्न, चतुर्ध्रुव ($\ell = 2$) और अष्टध्रुव ($\ell = 3$), एक ही दिशा में इशारा करते लगते हैं। उनके गुणांक $a_{\ell m}$ एक ही न्यूनतम-वर्ग फ़िट से आते हैं; हर बहुध्रुव की धुरी $3\times 3$ कोणीय-संवेग प्रसरण $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$ का सबसे बड़ा आइगेनवेक्टर है, और $10^5$ समदैशिक यादृच्छिक आकाशों का एक बैच दोनों धुरियों के बीच के कोण को $p$-मान में बदल देता है। एक वास्तविक पर विवादित विसंगति: संयोग, अग्रभूमि का अवशेष या नई भौतिकी।'
notes: 'सांख्यिकीय रूप से समदैशिक ब्रह्मांड में (स्फीति की मानक भविष्यवाणी) अलग-अलग बहुध्रुवों के अभिविन्यास स्वतंत्र होते हैं, इसलिए चतुर्ध्रुव और अष्टध्रुव की धुरियों के बीच का कोण यादृच्छिक होना चाहिए: $|\cos|$ अंतराल $[0, 1]$ पर एकसमान। Tegmark, de Oliveira-Costa और Hamilton (2003) तथा de Oliveira-Costa आदि (2004) ने पहले WMAP मानचित्रों में पाया कि दोनों $(l, b) \approx (-110^\circ, 60^\circ)$ की ओर इशारा करते हैं, जिसे Land और Magueijo (2005) ने “बुराई की धुरी” नाम दिया; Copi, Huterer, Schwarz और Starkman ने बहुध्रुव सदिशों से इसका अध्ययन किया और क्रांतिवृत्त से और संबंध पाए। साथ दिए गए WMAP 9-वर्षीय ILC मानचित्र पर धुरियाँ $(l, b) \approx (240^\circ, 60^\circ)$ और $(238^\circ, 63^\circ)$ पर आती हैं, केवल $3^\circ$ दूर, और 1000 में से 2 से कम समदैशिक आकाश इससे बेहतर संरेखित होते हैं ($p \approx 0.0015$; इस सांख्यिकी के लिए ठीक $p = 1 - |\cos|$, जिसकी मोंटे कार्लो पुष्टि करता है)। दायाँ पैनल सिमुलेशन की जाँच करता है: कम से कम $x$ जितने संरेखित यादृच्छिक आकाशों का अनुपात रेखा $P = x$
  पर चलता है। स्थिति: आँकड़ों में संरेखण वास्तविक है (Planck 2013, 2015 और 2018 के समदैशिकता शोधपत्र इसे अपने सभी मानचित्रों में देखते हैं), पर इसकी सार्थकता विवादित है। सांख्यिकी पैटर्न दिखने के बाद चुनी गई (a posteriori, look-elsewhere प्रभाव: बहुत-सी संभावित विसंगतियों में से कुछ दुर्लभ दिखेंगी ही); कम चतुर्ध्रुव शक्ति, ILC में बची गैलेक्टिक अग्रभूमि, गतिक डॉप्लर चतुर्ध्रुव (यहाँ हटाया नहीं गया) और मानचित्र का चुनाव $p$ को कई गुना बदल देते हैं। कोई स्वीकृत भौतिक व्याख्या नहीं है; प्रस्तावों में अतुच्छ टोपोलॉजी, विषमदैशिक प्रसार या स्थानीय अग्रभूमियाँ शामिल हैं, और अधिकांश ब्रह्मांडविज्ञानी इसे सांख्यिकीय उतार-चढ़ाव मानते हैं। यह पृष्ठ एक सांख्यिकी के लिए $p$ बताता है और किसी खोज का दावा नहीं करता। आँकड़े: WMAP 9-वर्षीय ILC मानचित्र (Bennett et al. 2013, ApJS 208, 20), NASA के LAMBDA अभिलेखागार की फ़ाइल wmap_ilc_9yr_v5.fits (lambda.gsfc.nasa.gov; NASA आँकड़े, सार्वजनिक डोमेन), यहाँ HEALPix $N_\mathrm{side} = 512$ से 16 तक मोटा किया गया (स्तंभ glon_deg, glat_deg, T_uK)। उसी lon/lat/T CSV
  रूप का कोई भी मानचित्र (जैसे Planck मानचित्र) इसकी जगह ले सकता है। फ़िट पूरे आकाश पर बिना मास्क के $\ell_\mathrm{fit}$ तक के सभी बहुध्रुव लेता है; समदैशिक आकाश इकाई गाउसीय वास्तविक गुणांकों से बनते हैं (शक्ति $C_\ell$ धुरी में कट जाती है)।'
meanings:
- पिक्सेल की दिशा, तापमान और ठोस कोण, किसी भी lon/lat/T CSV से
- हर पिक्सेल पर वास्तविक हार्मोनिक्स; $a$ सभी $(\ell, m)$ पर चलता है
- 'भारित न्यूनतम वर्ग: सभी बहुध्रुव एक साथ, आपस में कोई एलियासिंग नहीं'
- सम्मिश्र गुणांक, $a_{\ell,-m} = (-1)^m a^*_{\ell m}$ के साथ
- स्पिन-$\ell$ मैट्रिक्स, $[L_x, L_y] = iL_z$, $L_iL_i = \ell(\ell+1)$
- '$m, n, k$ पर योग: $z \parallel \hat n$ वाले फ़्रेम में $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$'
- 'बैच eigh: वह धुरी जिसके चारों ओर बहुध्रुव सबसे समतल है'
- '$i$ पर योग: आकाश $s$ में दोनों धुरियों का संरेखण (धुरियों की कोई दिशा नहीं)'
- समदैशिक गाउसीय आकाशों के विरुद्ध मोंटे कार्लो $p$-मान
labels:
  n_skies: समदैशिक यादृच्छिक आकाश $K$
  lmax_fit: एक साथ फ़िट किए गए बहुध्रुव $\ell_\mathrm{fit}$
  seed: यादृच्छिक बीज
