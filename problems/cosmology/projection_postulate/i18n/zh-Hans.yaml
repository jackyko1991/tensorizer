source_hash: 296b0fae0936
title: 投影公设：一个高维状态，许多影子
summary: 这是一个推测性假说，并非已确立的物理：宇宙是维数 $D$ 极高的空间中的单一状态 $\Psi$，观察者测到的只是它在少数几个维度上的投影。本步骤写出公设并检验其数学。可见的比例 $\|P\Psi\|^2$ 服从 Beta$(d, D-d)$ 分布，而一次测量被建模为隐藏区块之间的竞赛。每个结果配一个隐藏复数维度，正好给出玻恩定则；更多维度则产生偏差，而三缝实验已排除这种偏差。到目前为止，这个想法重现了量子力学，而没有超越它。
notes: 状态：推测性。这是作者本人的假说（见系列说明），并非已确立的物理，也没有任何实验比起标准量子力学更支持它。这第一步把公设精确写出，并检验它们所依赖的数学。公设如下。P0（唯一实在）：宇宙是维数为 $D$ 的空间中的单一状态 $\Psi$，可能 $D\to\infty$。P1（投影）：观察者只看到投影 $P:\mathbb C^D\to\mathbb C^d$，投到一个 $d$ 维子空间上；测到的量子态是 $\psi = P\Psi/\|P\Psi\|$，所以波函数是 $\Psi$ 的投影，而不是 $\Psi$ 本身。P2（事件）：测量是投影到某一确定的时间切片上，从而选出一个结果 $k$；各结果的权重来自 $\|P_k\Psi\|^2$，玻恩定则要被检验，而不是被假设。P3（唯一粒子）：所有粒子都是同一个物体的投影。P4（几何）：弯曲时空是更高维平直嵌入的投影形状，奇点是投影折叠之处（其雅可比矩阵降秩）。P5（开放维数）：量子效应需要某个最小维数 $d_Q$，引力需要 $D$ 之内的某个 $d_G$；它们要估计或拟合，绝不手动设为 $3+1$。计算内容。(1) 测度集中：当 $\Psi$ 在 $\mathbb C^D$ 的球面上均匀分布时，$\|P\Psi\|^2\sim$ Beta$(d, D-d)$，均值为 $d/D$；以均值、方差及 Kolmogorov–Smirnov 检验，对 $D$ 从 4 到 $D_{max}$ 验证；不论 $D$ 为何，归一化的 $\psi$ 都在小球面上均匀分布。典型的观察者只看到范数的 $d/D$ 比例，当 $D\to\infty$ 时趋于零。(2) 把 P2 具体化为投影竞赛（作者的模型，在此形式化）：每个结果 $k$ 耦合到自己的一个由 $m$ 个隐藏复数维度组成的区块，能量为 $E_k = \|h_k\|^2$，而 $|c_k|^2/E_k$ 最大的结果发生。当 $m = 1$ 时，$E_k\sim$ Exp(1)，指数竞赛正好给出 $P(k) = |c_k|^2$：玻恩定则。当 $m > 1$ 时，$E_k\sim$ Gamma$(m)$，最可能的结果赢得太频繁；两个结果时 $P_1 = I_{|c_1|^2}(m, m)$，偏差随 $m$ 增大。实数隐藏维度给出 Gamma$(m/2)$：一个实数维度给出反正弦定律
  $\tfrac2\pi\arcsin|c_1|$，两个给出玻恩定则。(3) 维数计算（P5）：对 $K$ 个结果，竞赛需要 $D\geq d + K$；$N$ 个纠缠的二能级系统需要 $D\geq 2^N$，对可观测宇宙中 $\sim10^{80}$ 个粒子约为 $10^{3\times10^{79}}$，与 P0 的 $D\to\infty$ 一致。诚实说明：标准量子力学本来就使用完全相同的希尔伯特空间，取部分迹和投影也是标准做法。到目前为止，这个假说只是一种重新诠释；任何可检验的新意，必须来自 $m > 1$ 的竞赛或后续步骤预测出不同结果之处。Gleason 定理（1957）早已证明：当 $d\geq 3$ 时，希尔伯特空间上任何非情境性的概率指派都是玻恩定则。(4) 数据：在三缝装置中（41 个屏幕区间加上一个“被挡住”的结果，各自有自己的隐藏区块），竞赛给出 Sorkin 参数 $\kappa\approx s\,(a-1)$，在 9 种分区下 $s$ 介于 0.56 和 0.74 之间，其中隐藏形状参数为 $a = m$（复数）或 $m/2$（实数）。测量值（data/born_rule_tests.csv，引用的数字）：Sinha 等人（Science 329, 418, 2010）把 $|\kappa|$ 限制在 $10^{-2}$ 以下；Park 等人（核磁共振，New J. Phys. 14, 113025, 2012）$\kappa = 0.001\pm0.003$；Kauten 等人（New J. Phys. 19, 033017, 2017，开放获取，CC-BY 3.0）以预告单光子得 $0.0\pm1.6\times10^{-3}$，以衰减激光得 $(1.3\pm1.8)\times10^{-4}$，以经典光得 $0.0\pm3.1\times10^{-5}$。取 $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ 并用最小斜率，单光子数据允许 $|a-1|\leq 6\times10^{-3}$；若每次光子探测都是一次竞赛，经典光数据允许 $|a-1|\leq 1.1\times10^{-4}$。$m = 2$ 的竞赛给出 $\kappa\approx 1$，一个实数隐藏维度给出 $\kappa\approx
  0.1$，两者都被排除；每个结果只有一个复数（两个实数）隐藏维度能存活。这是对模型的约束，而不是对它的支持：$m = 1$ 恰好是无法与标准量子力学区分的情形。对 $\kappa$ 的对应取决于结果如何分区，因此使用最保守的斜率。系列的后续步骤（此处未建立）：P3（所有粒子作为同一物体的投影）、P4（弯曲时空作为平直嵌入的影子：依 Janet–Cartan 定理，解析的四维度规可局部嵌入 10 维平直空间，Schwarzschild 解可嵌入 6 维）、拟合引力的 $d_G$，以及寻找与标准物理不同的预测。
meanings:
- 观察者看到的 $\Psi$ 范数比例，一次算出所有 $D$（嵌套状态）
- 观察到的状态，对任何 $D$ 都在 $\mathbb C^d$ 的单位球面上均匀分布
- 与 Beta$(d, D-d)$ 的 Kolmogorov–Smirnov 距离（以数值积分计算不完全 Beta 函数）
- 隐藏区块 $k$ 在 $m = 1..M$ 维时的能量：Gamma$(m)$（复数）或 $2\,$Gamma$(m/2)$（实数）
- 投影竞赛：$|c_k|^2/E_k$ 最大的结果发生
- 竞赛的闭合形式；对 $j$ 求和（减去 $j = k$）即对其他结果的乘积
- 重复的狭缝指标 $s$ ⇒ 求和：每组打开狭缝 $S$ 的振幅
- 竞赛模型的 Sorkin 三路径参数；玻恩定则下为 $0$
labels:
  D_max: 最大总维数 $D$（示例；计算使用一串直到此值的维数）
  d: 观察者子空间维数 $d$（示例）
  m_max: 每个结果的最大隐藏维数 $m$
  outcomes: 结果数 $K$
  trials: 每种情况的随机状态与事件数
