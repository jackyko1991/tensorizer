  mc_min: {default: 15.0, min: 5.0, max: 25.0, step: 1.0, label: 'Smallest chirp mass $\mathcal M_c$', unit: 'M☉'}
  mc_max: {default: 55.0, min: 35.0, max: 80.0, step: 1.0, label: 'Largest chirp mass $\mathcal M_c$', unit: 'M☉'}
  q: {default: 5.66, min: 3.0, max: 12.0, step: 0.1, label: 'Q of the time-frequency map'}
  welch_segment: {default: 4.0, min: 1.0, max: 8.0, step: 0.5, label: 'Welch segment length', unit: s}
