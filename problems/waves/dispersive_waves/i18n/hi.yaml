title: परिक्षेपी जल तरंगें
summary: 'गहरे पानी पर एक तरंग पैकेट, जहाँ लंबी तरंगें छोटी तरंगों से आगे निकल जाती हैं: $\omega = \sqrt{g k}$। हर फ़ूरिए विधा बस अपनी कला घुमाती है, इसलिए किसी भी समय पैकेट एक FFT, एक गुणा और एक व्युत्क्रम FFT है, जो सभी समयों के लिए एक साथ किया जाता है। शीर्ष आवरण से दोगुनी चाल से उसमें से गुज़रते हैं।'
notes: 'रैखिक गहरे-पानी की गुरुत्व तरंगें (गहराई तरंगदैर्ध्य से बहुत अधिक, कोई पृष्ठ तनाव नहीं, छोटी ढाल)। चूँकि $\omega \propto \sqrt k$, समूह वेग $d\omega/dk$ ठीक कला वेग $\omega/k$ का आधा है: देखें कि लाल शीर्ष हरे आवरण शिखर से आगे निकलता है, आगे जाकर मिट जाता है और पीछे जन्मा नया शीर्ष उसकी जगह लेता है (लाल बिंदु पूरे तरंगदैर्ध्यों से पीछे कूदता है)। लंबी तरंगें तेज़ चलती हैं, इसलिए पैकेट धीरे-धीरे फैलता है और उसके आगे के भाग में पीछे की तुलना में लंबी तरंगें होती हैं (chirp)। FFT बॉक्स को आवर्ती बनाता है। चूँकि हर विधा केवल अपनी कला घुमाती है, $\sum|\hat a_k|^2$ (पार्सेवल के अनुसार तरंग ऊर्जा) ठीक संरक्षित रहता है।'
meanings:
- 'सम्मिश्र पैकेट: गाउसीय आवरण गुणा $e^{ik_0x}$'
- प्रारंभिक पैकेट के फ़ूरिए आयाम
- हर विधा के लिए गहरे-पानी का परिक्षेपण संबंध
- broadcasting से हर समय पर हर विधा (सटीक, कोई समय-चरण नहीं)
- 'दोहराया गया $k$ ⇒ योग: सभी समयों के लिए वापस वास्तविक समष्टि में'
labels:
  wavelength: वाहक तरंगदैर्ध्य $2\pi/k_0$
  width: पैकेट की चौड़ाई $\sigma$
  t_max: सिमुलेशन समय
