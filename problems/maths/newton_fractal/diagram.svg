<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="The complex plane with the three cube roots of unity on the unit circle; a starting point z0 takes Newton steps z1, z2 that jump towards the root r at 1">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes, origin (110, 82), unit = 52 px -->
    <line x1="30" y1="82" x2="200" y2="82" stroke="#374151" stroke-width="2"/>
    <line x1="110" y1="150" x2="110" y2="12" stroke="#374151" stroke-width="2"/>
    <text x="204" y="87" font-size="12" fill="#374151">Re</text>
    <text x="116" y="18" font-size="12" fill="#374151">Im</text>
    <!-- unit circle -->
    <circle cx="110" cy="82" r="52" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- roots of z^3 - 1 -->
    <circle cx="162" cy="82" r="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="84" cy="37" r="6" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <circle cx="84" cy="127" r="6" fill="#16a34a" stroke="#166534" stroke-width="1.5"/>
    <text x="166" y="102" font-style="italic">r</text>
    <!-- Newton steps z0 -> z1 -> z2 -->
    <circle cx="200" cy="30" r="4" fill="#f59e0b"/>
    <text x="206" y="30" font-style="italic" fill="#b45309">z<tspan font-size="10" dy="3">0</tspan></text>
    <line x1="198" y1="34" x2="178" y2="62" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="175" cy="66" r="3.5" fill="#f59e0b"/>
    <text x="182" y="66" font-style="italic" fill="#b45309">z<tspan font-size="10" dy="3">1</tspan></text>
    <line x1="173" y1="69" x2="166" y2="76" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="16" y="150" font-size="13"><tspan font-style="italic">p</tspan>(<tspan font-style="italic">z</tspan>) = <tspan font-style="italic">z</tspan>³ − 1</text>
  </g>
</svg>
