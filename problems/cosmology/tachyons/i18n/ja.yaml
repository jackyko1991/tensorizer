source_hash: e3fd71733e91
title: タキオンと反電話
summary: もし粒子の質量が虚数、つまり $m^2 < 0$ だったらどうなるでしょうか。複素テンソルを使うと $E^2 = p^2 + m^2$ は依然として実数のエネルギーを与えますが、その粒子は常に光より速く、エネルギーを失うほど加速します。超光速の世界線にバッチでローレンツ変換を施すと、信号が送信される前に到着する座標系が見つかり、トールマンの反電話のループが閉じます。場の理論では、$m^2 < 0$ はむしろ凝縮を起こす不安定な真空を意味し、ヒッグス場がまさにそうです。推測的な内容です：タキオンはこれまで一度も観測されておらず、2011 年の OPERA の「超光速ニュートリノ」の原因はケーブルの接続不良でした。
notes: 推測的な物理：タキオンは仮説上の粒子です。標準模型にタキオン的な粒子は存在せず、タキオンを検出した実験もこれまで一つもありません。特殊相対性理論は質量をもつ物体を $c$ を越えて加速することを禁じますが、常に光より速い粒子そのものを禁じてはいません（Bilaniuk、Deshpande、Sudarshan 1962；Feinberg 1967、「タキオン」の名付け親）。その代償は因果律です。速さ $u > c$ の信号で結ばれた二つの事象は空間的に隔たっているので、その時間順序は観測者によって変わります：$c^2/u$ より速く動く任意の座標系では、信号は送信前に到着し、負のエネルギーを運びます。Feinberg の再解釈では、これを逆向きに進む正エネルギーの反タキオンとみなします。これでエネルギーの正値性は守られますが、「誰が送ったのか」は座標系に依存したままです。二つの座標系を使うとトールマンの反電話（1917）になります：Alice は $\beta$ で遠ざかる Bob に信号を送り、Bob は自分の座標系で同じ速さで返信します。$\beta > 2u/(1+u^2)$ となると、返信は Alice がメッセージを送る前に彼女に届き、因果ループが閉じます。場の量子論では、負の $m^2$ は速い粒子ではなく不安定性を表します。場は $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ の山頂 $\phi = 0$ から $\phi = \pm\sqrt{-m^2/\lambda}$ へと転がり落ち（「タキオン凝縮」、エネルギーは $m^4/4\lambda$ だけ下がる）、そこには質量$^2 = 2|m^2|$ の通常の粒子が存在します。これはまさにヒッグス場が行っていることで、パネルではハッブル摩擦に似た摩擦をもつ格子上でそれを示します。実データ：2011 年、OPERA は 730 km の距離でミューニュートリノが $60.7 \pm 6.9 \pm 7.4$ ns 早く到着したと報告しました。$(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$（arXiv:1109.4897v1）。原因は接続不良の光ファイバーケーブルと時計のずれであることが判明しました。修正後の結果は
  $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$（v4、JHEP 10 (2012) 093）で、ICARUS は $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns を測定しました（Phys. Lett. B 713 (2012) 17）：どちらも $c$ と矛盾しません。2011 年の値をタキオンとして解釈すると $|m| \approx 120$ MeV が必要となり、その場合、超新星 SN1987A からの 10 MeV のニュートリノは光を約 12 倍の差で追い越していたはずです。実際には 168 000 年の旅の後、光と数時間以内の差で到着しました（$|v-c|/c \lesssim 2\times10^{-9}$、Longo 1987）。単位：$c = 1$、信号の扇形図ではタキオン質量 $\mu = 1$。
meanings:
- 複素平方根：$m$ と $\gamma$ がともに虚数でも、$p > \mu$ のとき実数
- 観測者の座標系ごとに一つのローレンツ変換（$c = 1$）
- 繰り返される $b$ ⇒ 和をとる：すべての信号をすべての座標系から一度に見る
- 不変量 $m^2 = -\mu^2$、どの座標系でも同じ
- ラピディティは引き算：$c$ 未満では $\tanh$、超えると $\coth$
- 返信が Alice に届く時刻；$< t_{\mathrm{send}}$ なら因果ループが閉じる
- 偽の真空 $\phi = 0$ から転がり落ちる格子場（torch.roll によるラプラシアン、速度ベルレ法）
labels:
  u: タキオン信号の速さ $u$
  beta_max: 最速の観測者座標系 $\beta_\mathrm{max}$
  m2: 場のタキオン的な質量$^2$ $m^2$
  lam: 自己結合 $\lambda$
  friction: ハッブル摩擦 $\gamma$
