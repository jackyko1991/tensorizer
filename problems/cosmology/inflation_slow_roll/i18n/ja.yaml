title: スローロール・インフレーションと (n_s, r) 平面
summary: 5 つのインフラトン・ポテンシャル（$m^2\phi^2$、$\lambda\phi^4$、Starobinsky $R^2$、ナチュラル・インフレーション、4 次のヒルトップ）を 1 つのバッチ・テンソルでフリードマン方程式とクライン–ゴルドン方程式に従って転がし、e-fold 数 $N = \ln a$ を時計として用いる。スローロール・パラメータ $\epsilon$、$\eta$ と、$N_* = 50$–$60$ における予言 $n_s$ と $r$ を厳密な背景解で検証し、Planck 2018 および BICEP/Keck 2021 と比較する：$m^2\phi^2$ と $\lambda\phi^4$ は棄却傾向にあり、Starobinsky は許容領域の内側にある。インフレーションは初期条件の有力な説明だが、確証はない：原始 B モードはまだ検出されていない。
notes: 単位：換算プランク質量 $M_\mathrm{pl} = 1$。$N = \ln a$ を時間として方程式を書き、$\psi = d\phi/dN$、$\epsilon_H = \psi^2/2$ とおくと $d\psi/dN = -(3-\epsilon_H)(\psi + V'/V)$ および $H^2 = V/(3-\epsilon_H)$ となるので、効くのは $V'/V$ だけであり、どのポテンシャルも高さ 1 で描く（振幅 $A_s = 2.1\times10^{-9}$ がエネルギースケールを決め、$V_*^{1/4}$ として表示される。ほとんどのモデルで約 $10^{16}$ GeV）。各場は終了の約 68 e-fold 前、教科書的なスローロール計算から得た点から、スローロール速度 $\psi = -V'/V$ で出発する。テストでは $m^2\phi^2$ を大きく異なる初速度で出発させ、どれも数 e-fold 以内に同じ曲線に乗ることを確認する：スローロールはアトラクターである。インフレーションは $\epsilon_H = 1$ で終わる。予言は 2 通りに計算する：ポテンシャルから 1 次で（$n_s = 1 - 6\epsilon_V + 2\eta_V$、$r = 16\epsilon_V$、× 印）、および数値背景のハッブル・フロー・パラメータ $\epsilon_{1,2,3}$ から 2 次で（Stewart and Lyth 1993；Schwarz, Terrero-Escalante and García 2001；点）。両者の差は $O(\epsilon^2)$ で、数 $10^{-4}$ 程度（$n_s$ において）である。モードごとの完全な Mukhanov–Sasaki 解はここでは扱わない。$N_* = 55$ での結果：$m^2\phi^2$ は $n_s \approx 1 - 2/N_*$、$r \approx 8/N_* \approx 0.14$；$\lambda\phi^4$ は $r \approx 0.29$ で、$n_s$ が赤すぎる；Starobinsky は $n_s \approx 0.965$、$r \approx 12/N_*^2 \approx 0.004$；ナチュラル・インフレーション（$f
  = 7$）は $r \approx 0.08$ で上限を超える；4 次のヒルトップ（$\mu = 15$）は内側に入る。観測領域は箱として描いている（Planck 2018 $n_s = 0.9649 \pm 0.0042$、68 %、TT,TE,EE+lowE+lensing；BICEP/Keck 2021 $r_{0.05} < 0.036$、95 %）。公表された 2 次元等高線ではなく、そちらはわずかに傾いており、データの組み合わせに依存する。正直な現状：インフレーションは平坦性、地平線問題、そしてほぼスケール不変でガウス的・断熱的なゆらぎを説明し、$n_s < 1$ は測定される前に予言されていた。しかし対抗する考え（バウンス・モデルやエキピロティック・モデル）もあり、インフラトンは特定されておらず、決定的証拠である重力波由来の原始 B モード偏光は検出されていない（BICEP2 の 2014 年の主張は銀河系の塵によるものと判明した）。$N_*$ を 50 から 60 の間で試したり（宇宙がどのように再加熱したかに依存する）、$f$ と $\mu$ を変えたりしてみよう：$N_* = 55$ ではナチュラル・インフレーションは決して箱に入らない。$f$ を下げると $r$ は下がるが、$n_s$ が赤くなりすぎるからである（$f = 5$：$n_s \approx 0.950$、$r \approx 0.04$）。
meanings:
- one-hot 行：場 $b$ はポテンシャル $p$ を使う
- 全ての場で評価した 5 つのポテンシャル形状
- 繰り返される $p$ ⇒ 和をとる：各場自身のポテンシャル
- 場と $d\phi/dN$、e-fold を刻みとして RK4 で一緒に進める
- 背景に必要な唯一の量：$V$ の高さは消える
- 自動微分による $V'$ と $V''$
- $\epsilon_H$ が 1 を上に横切る点、すなわち $\ddot a$ の符号が変わる点
- 終了の $N_*$ e-fold 前のハッブル・フロー・パラメータを 1 回の gather で取得
- 厳密な背景からの 2 次の予言
labels:
  N_star: 終了前のピボット e-fold 数 $N_*$
  f: ナチュラル・インフレーションのスケール $f$
  mu: ヒルトップの幅 $\mu$
