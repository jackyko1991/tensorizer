title: 진동하는 북의 모드
summary: 정사각형 또는 원형 북 가죽의 정규 모드. 격자 위의 2차원 라플라시안은 1차원 라플라시안으로부터 크로네커 곱 $\Delta = D\otimes I + I\otimes D$로 만들며, 대칭 고윳값 풀이(eigh) 한 번으로 모든 모드 모양과 진동수를 한꺼번에 얻습니다.
notes: '각 패널은 모드 하나 $\phi_m(x, y)\cos(\omega_m t)$를 보여 줍니다. 안쪽의 흰 선은 움직이지 않는 마디선입니다. 한 변이 $L$인 정사각형의 정확한 진동수는 $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$이므로, 기본 진동수에 대한 비는 $\sqrt{(m^2+n^2)/2}$ = 1, 1.58, 1.58, 2, 2.24 …입니다. 정수가 아니므로 북은 줄처럼 소리 나지 않습니다. $(1,2)$와 $(2,1)$ 같은 쌍은 진동수가 같으며, eigh는 이들을 섞은 어떤 조합을 돌려줍니다. 원의 정확한 비는 베셀 함수의 영점에서 나오며(1, 1.59, 2.14, 2.30 …), 격자의 계단 모양 테두리가 이를 몇 % 바꿉니다. 단위: $c = 1$, 정사각형 한 변 또는 원 지름 $L = 1$; 시간은 기본 주기 단위로 표시합니다.'
meanings:
- 가장자리를 고정한 1차원 2계 도함수 (바깥에서 $u = 0$)
- '쌍 지표 $p = (a, b)$가 격자점에 번호를 매김: 2차원 라플라시안'
- 북 안쪽 점만 남김 (원형 마스크); 테두리는 고정
- 고윳값 $\omega^2/c^2$와 열에 담긴 정규직교 모드 모양
- '반복된 $p$ ⇒ 합: 단위 행렬'
labels:
  shape: 북 모양
  n_grid: 한 변의 격자점 수
  periods: 표시할 기본 주기 수
