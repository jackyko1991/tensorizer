source_hash: 786f22a93dbf
title: 光電効果と光量子
summary: アインシュタインの 1905 年の光量子論文：振動数 $\nu$ の光はエネルギー $h\nu$ の塊として届き、1 つの塊が 1 個の電子を運動エネルギー $K = h\nu - \phi - \varepsilon$ で解き放つ。光子 × 振動数 × 強度の一括計算により、しきい値 $\nu_0 = \phi/h$、強度に依存しない阻止電圧 $eV_s = h\nu - \phi$、そして時間遅れがないことが示される——いずれも古典的な波動像に反する。Millikan の 1916 年のナトリウム測定に直線をフィットすると、プランク定数が得られる。
notes: これはアインシュタインの 1905 年「奇跡の年」の 4 論文のうちの 1 つである：光量子と光電効果（本問題。1921 年ノーベル賞、「特に光電効果の法則の発見に対して」）、ブラウン運動（熱力学：ランダムウォークと拡散）、そして $E = mc^2$ を含む特殊相対論（天体物理：アインシュタイン 1905：運動物体と $E = mc^2$）。波動像は 3 つの点で破綻する：どの振動数でも電子が放出され、運動エネルギーが強度とともに増え、弱い光では数分の遅れが生じる（1 個の原子が $S = 10$ mW/m² から $\phi$ を集める場合）——一方、実験では鋭いしきい値があり、$V_s$ は強度によらず、測定可能な遅れもない（3 ns 未満、Lawrence と Beams 1928）。明るい光は光子が多いというだけなので、電流は増えるが $V_s$ は動かない。赤い四角は、真空中で切り出したナトリウム表面に対する Millikan の 1916 年の阻止電圧である（R. A. Millikan, Phys. Rev. 7, 355 (1916)、水銀の 4 本の輝線。ロスキレ大学の演習問題集に掲載された論文の表から data/millikan_1916_sodium.csv に書き写した。1916 年の出版物でパブリックドメイン）。Millikan はアインシュタインの式を反証しようとして、逆にそれを確証した。彼の傾きから得られる $h$ は、現在の厳密値 $6.62607015\times10^{-34}$ J s と約 0.3 % 以内で一致する。切片は約 1.8 eV で、清浄なナトリウムの仕事関数（2.3 eV）ではない：装置の接触電位を含み、表面もおそらく汚染されていた（D. Lloyd, Am. J. Phys. 2015）。シミュレーションの金属は理想化されている（深さが一様に分布した平らなバンド、角度も温度も考えない）：直線 $eV_s = h\nu - \phi$ は厳密だが、電流曲線の形は模式的なものにすぎない。
meanings:
- 光の振動数（単位 $10^{14}$ Hz）
- 光子 $n$ を吸収する電子の深さ、$[0, 3]$ eV 上で一様（$i$：強度）
- 1 回のブロードキャスト：すべての振動数・強度のすべての光子を同時に計算。$K \le 0$ ⇒ 放出なし
- 逆電圧 $V$ を登りきる電子：光電流
- 阻止電圧：最も速い電子。どの強度 $i$ でも等しい
- Millikan の点を通る直線：傾き $a = h/e$、切片 $b = -\phi/e$
- 波動像：放射照度 $S$ のもとで、1 個の原子の面積 $A$ で $\phi$ を吸収するのにかかる時間
labels:
  phi: 仕事関数 $\phi$
  irradiance: 放射照度 $S$（波動像での遅れ用）
  n_photons: 強度 1 での 1 回の露光あたりの光子数
