source_hash: e60c88b1723d
title: 使用 z 緩衝區的三角形光柵化
summary: 遊戲繪製 3D 的方式：將三角網格投影到螢幕上，一次計算每個（像素、三角形）組合的重心權重。對三角形取最小值的歸約就是 z 緩衝區。同樣的權重接著驅動平面、Gouraud 與 Phong 著色，以及紋理查找。以 $\lambda/z$（透視校正）而非 $\lambda$（仿射）內插紋理座標，正是讓棋盤格地板保持筆直的關鍵。
notes: 重心權重是有號面積：$\lambda_k$ 是角 $k$ 對面的小三角形面積除以整體面積，因此三者總和為 1，且恰好在內部時全為正。此處一次對每個像素與每個三角形計算，這是 GPU 以硬體所做之事的暴力版本。將像素分塊可讓 $(P, T, 3)$ 張量維持在數百萬個元素以下；真正的光柵化器只會走訪每個三角形的邊界框。螢幕空間面積的正負號也免費提供背面剔除：封閉網格約有一半的面背對相機。三角形上的深度在螢幕上不是線性的，但 $1/z$ 是，因此 z 緩衝區測試與每個內插屬性都使用權重 $\lambda_k/z_k$。地板只有兩個三角形，所以仿射內插（PlayStation-1 風格）會明顯讓棋盤線彎曲，而透視校正版本則保持筆直。平面著色會顯出每個面。Gouraud 在角點打光再混合亮度，會把鏡面高光抹開。Phong 混合法向量並對每個像素打光，讓高光保持銳利。
meanings:
- 網格頂點加上地板的 4 個角；面 $(T, 3)$ 為其索引
- 重複的 $j$ ⇒ 求和：旋轉網格（每幀一個旋轉）
- 三角形 $t$ 的角 $k$ 之螢幕位置與深度（針孔相機 $f\,(x, y)/z$）
- $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$ 的一半；$A_t \le 0$ ⇒ 背面，剔除
- 每個像素在每個三角形中的重心權重；以像素分塊計算以限制記憶體
- 重複的 $k$ ⇒ 求和：在螢幕上線性變化的是 $1/z$
- z 緩衝區：每個像素最近的覆蓋三角形（外部像素為 $+\infty$）
- 紋理座標、法向量、位置與 Gouraud 亮度，以權重 $\lambda/z$ 內插
- 仿射內插：對正對的三角形正確，對傾斜的則錯誤
labels:
  mesh: 網格
  resolution: 影像大小
  frames: 每圈幀數
  tilt: 繞 $x$ 傾斜
