title: ब्लॉख समीकरण और स्पिन इको
summary: 'ब्लॉख समीकरण एक सदिश गुणनफल $\varepsilon_{ijk} M_j \Omega_k$ और शिथिलन का योग है। थोड़ी भिन्न ऑफ़-रेज़ोनेंस आवृत्तियों $\Delta\omega_n$ वाले सैकड़ों आइसोक्रोमैट एक ही बैच RK4 अद्यतन में साथ आगे बढ़ाए जाते हैं: 90° पल्स के बाद वे पंखे की तरह फैलते हैं और संकेत $T_2^*$ के साथ मिट जाता है, फिर $TE/2$ पर 180° पल्स उन्हें $TE$ पर एक इको में पुनः केंद्रित करता है, जिसकी ऊँचाई केवल वास्तविक $T_2$ के साथ घटती है।'
notes: 'समय ms में और आवृत्तियाँ rad/ms में हैं। अकेला हर आइसोक्रोमैट शिथिलन को छोड़कर $\lvert\mathbf M\rvert$ को स्थिर रखता है, पर समष्टि (ensemble) औसत कला-सम्बद्धता खो देता है: लॉरेंट्ज़ी फैलाव के साथ मुक्त प्रेरण क्षय $e^{-t/T_2^*}$ का अनुसरण करता है, जहाँ $1/T_2^* = 1/T_2 + 1/T_2^{\prime}$। 180° पल्स हर कला को उलट देता है, इसलिए जो स्पिन आगे निकल गए थे वे अब पीछे हैं और $TE$ पर सब फिर एक पंक्ति में आ जाते हैं; यह स्थैतिक असमांगता को रद्द करता है पर यादृच्छिक $T_2$ हानि को नहीं, इसलिए इको की ऊँचाइयाँ $e^{-TE/T_2}$ का अनुसरण करती हैं। कई पुनः-केंद्रण पल्स (CPMG श्रृंखला, $y$ के परितः 180°) इको की एक पंक्ति देते हैं जो $T_2$ को दर्शाती है। पल्स छोटे आयताकार "हार्ड" पल्स हैं जिन्हें उसी ब्लॉख समीकरण से चलाया जाता है; अनुनाद से बहुत दूर के स्पिन अपूर्ण रूप से पुनः केंद्रित होते हैं। मान केवल उदाहरण के लिए और शिक्षा हेतु हैं, नैदानिक उपयोग के लिए नहीं। गाउसी फैलाव, लंबा $T_2^{\prime}$ या एकल इको आज़माइए।'
meanings:
- घूर्णी निर्देश-तंत्र में आइसोक्रोमैट $n$ का चुंबकन, घटक $i \in \{x, y, z\}$
- 'लेवी-चिविटा प्रतीक: सदिश गुणनफल, ठीक लॉरेंट्ज़ बल की तरह'
- 'घूर्णी निर्देश-तंत्र में $\gamma\mathbf B$: पल्स के दौरान $xy$-तल में RF क्षेत्र $\omega_1$, $z$ के अनुदिश ऑफ़-रेज़ोनेंस $\Delta\omega_n$'
- 'दोहराए गए $j, k$ ⇒ योग: हर आइसोक्रोमैट का पुरस्सरण $\mathbf M\times\boldsymbol\Omega$'
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$; $j$ पर $M_{nj} - M^0_j$ के साथ संकुचित
- क्षेत्र असमांगता से पुरस्सरण आवृत्तियों का फैलाव, चौड़ाई $1/T_2^{\prime}$
- 'ग्राही कुंडली जो देखती है: $n$ पर योग किया गया औसत अनुप्रस्थ चुंबकन'
labels:
  T1: अनुदैर्ध्य शिथिलन $T_1$
  T2: अनुप्रस्थ शिथिलन $T_2$
  t2_prime: असमांगता समय $T_2^{\prime}$
  TE: इको समय $TE$
  n_echoes: इको की संख्या (180° पल्स)
  n_spins: आइसोक्रोमैट
  spread: ऑफ़-रेज़ोनेंस रेखा-आकृति
