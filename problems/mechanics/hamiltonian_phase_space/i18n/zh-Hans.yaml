source_hash: c92568d7c613
title: 哈密顿力学：相空间与辛积分
summary: 只需写一次单摆的哈密顿量 $H(q, p)$，再由 torch.autograd 给出哈密顿方程 $\dot z_a = J_{ab}\,\partial H/\partial z_b$。一整束轨道和一团刘维尔点云作为同一个张量一起演化，并在许多周期内比较辛蛙跳法、显式欧拉法与 RK4。
notes: 分界线 $H = mgL$，即 $p = \pm 2mL\sqrt{gL}\cos(q/2)$，把天平动（闭合回路）与转动（从右侧离开、再从左侧回来的波浪线）分开。在分界线附近周期会无限增长，因此点云的内缘会超前外缘一圈：点云被拉成细长的螺旋，但面积保持不变（刘维尔定理）。蛙跳法只有二阶精度，但能量误差永远有界，因为它精确守恒一个相近的“影子”哈密顿量；RK4 每步精确得多，但误差会稳定地缓慢累积；显式欧拉法每步把相空间面积放大约 $1 + \omega^2\Delta t^2$ 倍，因此能量发散。试试更大的 $\Delta t$，或改用简谐系统，此时点云只是刚性旋转。
meanings:
- 相空间点 $b$：角度 $q$ 和角动量 $p$；每条轨道和点云中的每一点都是一行
- 哈密顿量，唯一需要手动输入的物理
- 对总和求梯度，使每个独立的点得到各自的梯度
- 辛矩阵 $[[0, I], [-I, 0]]$：把梯度旋转 90°
- 重复的 $c$ ⇒ 求和：同时对所有点写出哈密顿方程
- 踢–漂–踢（Störmer–Verlet）：每个子步都是剪切变换，因此面积被精确保持
- 显式欧拉法，作为对照：每一步都会拉伸相空间
- 点云多边形的面积；刘维尔定理说它保持不变
labels:
  system: 系统
  m: 质量 $m$
  length: 摆长 $L$
  amplitude: 测试轨道振幅 $q_0$
  n_orbits: 相图中的轨道数
  dt: 时间步长 $\Delta t$
  t_max: 模拟时间
