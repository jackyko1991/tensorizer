source_hash: bed4e5f065d8
title: P vs NP 与 3-SAT 相变
summary: 凡是答案容易验证的问题，是否也都容易求解？这就是 P vs NP 问题，自 1971 年起悬而未决。随机 3-SAT 把这种不对称具体呈现出来：验证一个给定的赋值只需一次 gather 和两次归约，而穷举搜索则把全部 $2^n$ 个赋值作为一个压缩的比特张量一次性求值，其大小每增加一个变量就翻倍。扫描子句与变量之比 $\alpha$，可以看到可满足性相变出现在 $\alpha_c \approx 4.27$ 附近，而搜索代价在相变窗口内达到峰值。
notes: P vs NP 问的是：凡是“是”答案具有可在多项式时间内验证之证书的判定问题（NP 类），是否也都能在多项式时间内求解（P 类）。Cook（1971）和 Levin（1973）证明了可满足性问题是 NP 完全的：3-SAT 若有多项式时间算法，NP 中的每个问题都会有。目前不知道这样的算法是否存在。大多数研究者预期 P $\ne$ NP，但没有证明，而已知的障碍（相对化、自然证明、代数化）排除了整类证明策略。这个问题是克雷千禧年大奖七大难题之一，至今未解决。本程序对此没有证明任何东西：穷举搜索只是最显而易见的算法，而已知最好的 3-SAT 算法仍然是指数时间的（PPSZ 约为 $1.307^n$）。它展示的是那种不对称。验证器只是一次 gather 加上一次 OR 和一次 AND，工作量为 $O(M)$。搜索则构建完整的真值表，每个赋值一个比特，每个整数压缩 32 个，因此张量有 $2^n$ 个比特，耗时每增加一个变量就翻倍（右下图；$n$ 较小时固定开销占主导）。具有 $M = \alpha n$ 个子句的随机 3-SAT 有一个尖锐的阈值：Friedgut（1999）证明了当 $n \to \infty$ 时相变变得尖锐，统计物理（Mézard、Parisi 与 Zecchina 2002）预测 $\alpha_c \approx 4.267$，而 Ding、Sly 与 Sun（2015）对 $k$ 很大的 $k$-SAT 证明了预测的阈值。对 $k = 3$，4.267 这个值仍然是猜想；已证明的是：随机公式在 $\alpha = 3.52$ 以下以高概率可满足，在 4.49 以上以高概率不可满足。$n$ 较小时，50% 交叉点位于 4.27 之上，并随 $n$ 增大而向下漂移（有限尺寸标度）。测试检查：验证器在每个赋值上都与暴力法一致；一个子句恰好排除全部赋值的 $1/8$；解的平均数目等于一阶矩 $2^n (7/8)^M$；$P_{\mathrm{sat}}$ 单调，并在阈值附近骤降；窗口随 $n$ 收窄。搜索代价图统计深度优先回溯搜索的节点数：该搜索依次固定 $x_0, x_1, \ldots$，一旦某个已完全赋值的子句为假就回溯。在阈值以下它很快找到解，远高于阈值时短小的矛盾会及早剪枝，最难的公式位于相变窗口内（对这个简单搜索，$n = 16$
  时约在 $\alpha \approx 5$；带单元传播的求解器在 4.3 附近达到峰值）。试试更多变量，看曲线变得更尖锐；或更多公式，得到更平滑的曲线。
meanings:
- $B$ 个公式，各有 $M$ 个由 3 个不同变量组成的子句，每个变量以概率 $\frac12$ 取反
- 所有公式的所有文字一次 gather 取出
- 验证器：$3M$ 次查表，关于 $n$ 是多项式的
- $x_j$ 在全部 $2^n$ 个赋值上的真值表，每个整数存 32 个赋值
- 用按位 OR 在全部 $2^n$ 个赋值上对一个子句求值（与全 1 做 XOR 即取反）
- 逐个 AND 入子句；第 $d$ 层只收集变量都在前 $d$ 个之中的子句，由此得到回溯树
- 嵌套公式（同一子句列表的前缀）一趟就给出所有 $\alpha = M/n$，并使 $P_{\mathrm{sat}}$ 不增
labels:
  n_max: 变量数 $n$（最大规模）
  instances: 每个规模的公式数
  seed: 随机种子
