source_hash: 65c4646e64b8
title: दर नियम और आरेनियस आलेख
summary: कोई अभिक्रिया कितनी तेज़ चलती है, और गर्म होने पर कितनी अधिक तेज़? शून्य-, प्रथम- और द्वितीय-कोटि दर नियम छह तापमानों के लिए एक साथ एक $(O, T)$ टेंसर में समाकलित किए जाते हैं, $k(T) = A\,e^{-E_a/RT}$ के साथ। फिर एक रवयुक्त कृत्रिम प्रयोग अपनी कोटि (कौन-सा आलेख, $[A]$, $\ln[A]$ या $1/[A]$, सीधा है?) और अपनी सक्रियण ऊर्जा ($1/T$ के विरुद्ध $\ln k$ पर न्यूनतम-वर्ग रेखा) प्रकट करता है।
notes: 'हर दर नियम का एक समाकलित रूप है जो सही चर में सीधी रेखा बन जाता है: $[A] = [A]_0 - kt$ (शून्य कोटि), $\ln[A] = \ln[A]_0 - kt$ (प्रथम) और $1/[A] = 1/[A]_0 + kt$ (द्वितीय)। इसलिए रसायनज्ञ तीनों आलेख बनाता है और सबसे सीधे को रखता है ($R^2$ 1 के सबसे निकट); उसका ढलान $\mp k$ है। दूसरा परीक्षण अर्धायुओं का उपयोग करता है: चूँकि $t_{1/2} \propto [A]_0^{1-n}$, $[A]_0/2$ से $[A]_0/4$ तक का समय पहली अर्धायु का $2^{n-1}$ गुना है (छोटा, बराबर या दोगुना), जिससे $n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$ मिलता है। कई तापमानों पर रन दोहराने से $k(T)$ मिलता है, और $1/T$ के विरुद्ध $\ln k$ का आरेनियस आलेख ढलान $-E_a/R$ की सीधी रेखा है। $E_a = 75$ kJ/mol के साथ 290 K से 300 K तक गर्म करने पर अभिक्रिया लगभग 2.8 गुना तेज़ होती है; पुराना अँगूठा नियम “प्रति 10 K दोगुनी तेज़” कमरे के तापमान के पास $E_a \approx 50$ kJ/mol के संगत है। हर रन तब तक चलाया जाता है जब तक 90 % A अभिक्रिया न कर ले, इसलिए ठंडे रन गर्म रनों से कहीं अधिक लंबे चलते हैं (लेजेंड देखें); बायाँ आलेख हर रन के समय का अंश उपयोग करता है
  ताकि छहों एक अक्ष पर समा जाएँ, जिससे यह नहीं बदलता कि कौन-सा आलेख सीधा है। आँकड़े कृत्रिम हैं (एक काल्पनिक अभिक्रिया, स्थिर बीज के साथ गाउसीय रव)। $\ln$ या $1/x$ लेने से देर वाले, तनु बिंदुओं का रव बढ़ जाता है ($\sigma/[A]$ और $\sigma/[A]^2$), इसलिए हर बिंदु को $(dg/d[A])^{-2}$ से भारित किया जाता है, यानी $1$, $[A]^2$ या $[A]^4$ से, और $[A]_0$ के 2 % से नीचे के बिंदु छोड़ दिए जाते हैं। $R^2$ परीक्षण को कम निर्णायक होते देखने के लिए बड़ा रव आज़माएँ, या $E_a$ पर त्रुटि बढ़ते देखने के लिए संकरी तापमान श्रेणी।'
meanings:
- $T_{min}$ और $T_{max}$ के बीच छह तापमान (K)
- अभिक्रिया कोटियाँ $0, 1, 2$, साथ-साथ समाकलित
- आरेनियस दर स्थिरांक, $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$ में
- हर रन की दर; किसी सूचकांक पर योग नहीं, $k_t$ कोटियों पर ब्रॉडकास्ट होता है
- हर रन 90 % रूपांतरण तक चलाया जाता है, अपनी घड़ी $t = \tau\,t_{end}$ पर
- RK4 प्रक्षेप-पथ, परीक्षणों में सटीक समाकलित नियमों से तुलना
- $t$ के विरुद्ध तीन आलेख; केवल सही कोटि सीधी रेखा देती है
- सीधी-रेखा फ़िट का अभिकल्प आव्यूह
- प्रसामान्य-समीकरण आव्यूह; $s$ (नमूने) पर योग; भार $w_s = (dg/d[A])^{-2}$, और $w_s = 0$, $[A]_0$ के 2 % से नीचे के बिंदु हटाता है
- अंतःखंड और ढलान, हर आलेख और तापमान के लिए एक साथ
- 'आरेनियस रेखा: ढलान $-E_a/R$, अंतःखंड $\ln A$'
labels:
  Ea: सक्रियण ऊर्जा $E_a$
  log10_A: पूर्व-चरघातांकी गुणक $\log_{10} A$
  order: मापी गई अभिक्रिया की कोटि
  T_min: न्यूनतम तापमान $T_{min}$
  T_max: उच्चतम तापमान $T_{max}$
  noise: मापन रव $\sigma$
