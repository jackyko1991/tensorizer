source_hash: f8aa40a8b1bc
title: 'Chercheur d''équations : une IA tensorielle qui écrit l''équation qui gouverne ses données'
summary: Donnez-lui des données de champ, elle vous rend la loi en LaTeX. Une bibliothèque de termes candidats ($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$) est construite par différences finies, filtres de Savitzky–Golay ou forme faible, et une régression ridge à seuillage séquentiel (PDE-FIND) conserve les quelques termes qui expliquent $\partial_t u$. À partir de données simulées, elle retrouve le système de Lorenz, l'équation de la chaleur, l'équation de Burgers visqueuse et les équations de Maxwell issues d'une simulation Yee FDTD (avec $c$ à 0.2 % près, 0.03 % avec la forme faible), et découvre $\nabla\cdot\mathbf B = 0$ caché dans la bibliothèque ; une étude du bruit montre où chaque estimateur de dérivée cède.
notes: 'L''idée. Voici le « chercheur automatique d''équations physiques » de Jacky Ka Long Ko : une petite IA tensorielle qui regarde des données de champ et écrit, en LaTeX, l''équation qui les gouverne (l''approche SINDy / PDE-FIND). Elle fait suite à la recherche d''opérateurs sur MNIST, qui concluait qu''« un chiffre manuscrit n''a pas d''équation gouvernante » ; ici les données proviennent de lois, il y a donc quelque chose à trouver. L''architecture comporte trois modules : (1) un lisseur débruiteur, (2) un moteur de dérivées einsum / différences finies, (3) une régression parcimonieuse d''opérateurs. Ici (2) et (3) sont complets et (1) est un lisseur de Savitzky–Golay (aucun réseau de neurones n''est nécessaire pour cela). Méthode. Chaque terme candidat est une dérivée d''un monôme des champs, $D^\alpha(\prod_g u_g^{p_g})$ : 20 monômes jusqu''au degré 3 pour le système de Lorenz, 13 termes $D^d(u^p)$ ($p, d \le 3$) pour les équations 1D, 17 termes pour Maxwell (les champs, leurs
  dérivées en $x$ et en $y$, leurs laplaciens, quelques produits). Trois façons de construire le système linéaire $\partial_t u = \Theta\xi$ : différences finies centrées (fd) ; Savitzky–Golay (sg : un lisseur cubique sur 7 échantillons, puis un ajustement de dérivée quartique sur 9), toutes deux des convolutions 1D axe par axe ; et la forme faible (weak SINDy, Messenger et Bortz 2021), où l''équation est intégrée contre des bosses $(1-s^2)^{10}$ et l''intégration par parties reporte toutes les dérivées sur elles, une contraction tensorielle par axe. STRidge (Rudy et al. 2017) s''exécute ensuite sur des colonnes de norme unité : ridge, mise à zéro de tout coefficient inférieur à $\tau$, réajustement, et on recommence ; un balayage de 41 tolérances pour 3 forces de ridge, et le modèle retenu est celui qui a le moins de termes parmi ceux dont l''erreur de validation est à moins de 5 % (+ $10^{-3}$) de la meilleure. La force de ridge la plus grande compte pour Maxwell : puisque $\nabla\cdot\mathbf
  B = 0$, les colonnes $\partial_x B_x$ et $\partial_y B_y$ sont presque opposées, et avec une ridge faible la régression ajoutait $2200\,\nabla\cdot\mathbf B$ à l''équation de $E_z$. Les coefficients sont réajustés par moindres carrés sur les termes conservés, avec un bootstrap sur les lignes pour le ± ; ce ± est uniquement statistique et n''inclut pas le biais de l''estimation des dérivées, il est donc souvent bien plus petit que l''erreur réelle. La régression alternative est la relaxation de type DARTS d''operator_search_mnist : $\xi = \sigma(\alpha/T)\,w$ avec une pénalité sur les portes et une température recuite de 1 à 0.01. Les données, toutes simulées ici : 8 trajectoires de Lorenz (RK4) ; l''équation de la chaleur sur une tige périodique de 10 cm, exacte par modes de Fourier ($D$ = 0.2 cm²/s) ; Burgers visqueuse sur $2\pi$ m, exacte par la transformation de Cole–Hopf ($\nu$ = 0.1 m²/s) ; Maxwell dans une boîte périodique de 6.4 cm à partir d''une simulation Yee FDTD (mode TM, cellules
  de 0.5 mm, nombre de Courant 0.5), échantillonnée comme le serait une mesure (tous les champs interpolés aux mêmes points et aux mêmes instants). Bruit : gaussien, 0, 0.1, 1 et 5 % de l''écart type de chaque champ. Résultats. Les tests vérifient que les noyaux et la forme faible sont exacts là où le calcul différentiel l''affirme, que les données obéissent à leurs lois (noyau de la chaleur, Cole–Hopf, Yee conserve $\nabla\cdot\mathbf B = 0$ à l''arrondi près et conserve son énergie à 0.2 % près), que STRidge retrouve exactement un vecteur parcimonieux implanté, que chaque cible est retrouvée à partir de données propres et que le LaTeX écrit, relu par un analyseur, reproduit le modèle ajusté. Exécution fournie, données propres, différences finies : Lorenz $\sigma$ = 9.9987, $\rho$ = 27.989, $\beta$ = 2.6662 ; chaleur $D$ = 0.20023 cm²/s ; Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$ ; Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$ avec $c$ = 29.92 cm/ns (valeur vraie
  29.98) et $\partial_t \mathbf B = -\nabla\times\mathbf E$ avec des coefficients de 0.996. La forme faible est bien plus précise (erreurs de $10^{-8}$ sur les données exactes ; 0.03 % sur Maxwell, ce qui est la dispersion numérique propre au schéma de Yee, pas celle du chercheur). Le plus petit vecteur singulier de la bibliothèque de Maxwell est $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$, avec une valeur singulière 220 fois inférieure à la suivante : les données révèlent $\nabla\cdot\mathbf B = 0$ comme loi implicite. Bruit (les bons termes sont-ils trouvés ?) : les différences finies échouent dès 0.1 % de bruit sur la chaleur et Burgers et dès 1 % sur Lorenz, et ne résistent à 5 % que sur Maxwell (avec 25 % d''erreur sur les coefficients) ; Savitzky–Golay résiste à 0.1 % partout et à 5 % seulement sur Maxwell ; la forme faible trouve les bons termes à tous les niveaux pour la chaleur, Burgers et Maxwell (à 5 % de bruit, erreurs sur les coefficients de 7 %, 6 % et 0.1 %) et jusqu''à
  1 % pour Lorenz (à 5 % elle ajoute deux minuscules termes parasites à $\dot y$). Les portes recuites égalent STRidge faible sur Burgers et Maxwell mais manquent le terme $-y$ du $\dot y$ de Lorenz à tous les niveaux de bruit et pour toutes les pénalités essayées ($10^{-6}$ à $10^{-3}$) : $25.5\,x - 0.95\,xz$ l''absorbe, un minimum local que la relaxation ne quitte pas ; elles échouent aussi sur la chaleur à 5 %. Re-simuler les équations trouvées à partir du premier instantané reproduit les données de la chaleur et de Burgers à $3\times 10^{-4}$ près et Maxwell à 3 % près ; Lorenz s''écarte de 3 % après 5 unités de temps car le chaos amplifie une erreur de 0.01 % sur un coefficient. results/noise_study.csv et results/equations.tex contiennent tous les nombres et toutes les équations ; un GIF par cible (Maxwell est le principal) et results/summary.png. Verdict. Le chercheur retrouve des formes d''équations connues à partir de données propres et bien échantillonnées, et avec la forme faible
  il tolère un bruit réaliste ; c''est l''estimation des dérivées, et non la régression, qui cède en premier. Il ne trouve que des termes présents dans sa bibliothèque, il a besoin que les bonnes variables soient mesurées, et une équation découverte est une hypothèse : il ne découvre pas de physique (ni de physiologie) nouvelle sans validation indépendante. Ce n''est pas non plus un substitut aux grands modèles de langage ; c''est une tâche différente (ajuster une loi à des données, et non produire du texte). Travaux connexes. SINDy (Brunton, Proctor et Kutz 2016), PDE-FIND et STRidge (Rudy et al. 2017), weak SINDy (Messenger et Bortz 2021) ; la régression symbolique par programmation génétique (Schmidt et Lipson 2009) et AI Feynman (Udrescu et Tegmark 2020) ; le schéma de Yee (Yee 1966). À essayer. Moins de rééchantillonnages bootstrap pour une exécution plus rapide, plus de pas de portes pour voir si la relaxation s''échappe de son minimum de Lorenz (ce ne fut pas le cas jusqu''à 4000),
  ou une grille de Yee plus grossière.'
meanings:
- 'la bibliothèque : la colonne $k$ est un terme candidat $D^\alpha(\prod_g u_g^{p_g})$ en chaque point intérieur $n$ de la grille, par ex. $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- 'moteur de dérivées : une convolution 1D le long d''un axe ; différences centrées, ou Savitzky–Golay (polynôme des moindres carrés de degré $p$ sur $2m+1$ échantillons) après un lisseur cubique'
- 'forme faible : sommation sur $x$ et $t$ ; les dérivées portent sur les bosses lisses $\phi(s) = (1-s^2)^{10}$, jamais sur les données bruitées'
- une seule résolution ridge par lots pour chaque équation $f$ sur ses termes survivants ; STRidge met à zéro $|\hat\xi_k| < \tau$ et réajuste
- 'balayage des tolérances : garder le modèle ayant le moins de termes parmi ceux dont l''erreur de validation est à moins de 5 % (+ $10^{-3}$) de la meilleure'
- 'l''alternative de type DARTS : $\xi = \sigma(\alpha/T)\, w$ avec une pénalité sur les portes, température recuite de 1 à 0.01'
- 'bootstrap : $B$ rééchantillonnages des lignes sous forme de poids multinomiaux, tous les ajustements en une seule résolution par lots'
- 'le LaTeX écrit, relu par un analyseur : il reproduit le modèle ajusté à la précision affichée'
labels:
  bootstrap: Rééchantillonnages bootstrap pour le ± de chaque coefficient
  gate_steps: Pas d'Adam de la recherche à portes recuites
  maxwell_grid: Grille de Yee de la simulation de Maxwell ($n \times n$ cellules de 0.5 mm)
