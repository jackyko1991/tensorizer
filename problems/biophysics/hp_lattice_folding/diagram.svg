<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="HP lattice protein: a chain of hydrophobic H and polar P residues on a square lattice; a dashed red line marks an H-H contact worth minus epsilon, and an arrow shows a corner residue flipping to a free lattice site">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- lattice -->
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3">
      <line x1="20" y1="30" x2="220" y2="30"/><line x1="20" y1="60" x2="220" y2="60"/>
      <line x1="20" y1="90" x2="220" y2="90"/><line x1="20" y1="120" x2="220" y2="120"/>
      <line x1="40" y1="14" x2="40" y2="136"/><line x1="70" y1="14" x2="70" y2="136"/><line x1="100" y1="14" x2="100" y2="136"/>
      <line x1="130" y1="14" x2="130" y2="136"/><line x1="160" y1="14" x2="160" y2="136"/><line x1="190" y1="14" x2="190" y2="136"/>
    </g>
    <!-- backbone -->
    <polyline points="40,120 70,120 70,90 100,90 100,60 70,60 70,30 100,30 130,30 130,60 160,60 160,90 130,90 130,120 160,120 190,120"
      fill="none" stroke="#374151" stroke-width="2"/>
    <!-- H-H contacts -->
    <line x1="100" y1="90" x2="130" y2="90" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="100" y1="60" x2="130" y2="60" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="130" y1="60" x2="130" y2="90" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- residues: H blue, P white -->
    <g stroke-width="1.5">
      <circle cx="40" cy="120" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="70" cy="120" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="70" cy="90" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="100" cy="90" r="7" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="100" cy="60" r="7" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="70" cy="60" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="70" cy="30" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="100" cy="30" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="130" cy="30" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="130" cy="60" r="7" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="160" cy="60" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="160" cy="90" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="130" cy="90" r="7" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="130" cy="120" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="160" cy="120" r="7" fill="#ffffff" stroke="#374151"/>
      <circle cx="190" cy="120" r="7" fill="#2563eb" stroke="#1e40af"/>
    </g>
    <!-- a move: residue at a corner flips to the free corner opposite -->
    <circle cx="40" cy="90" r="7" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M62,113 Q46,112 43,99" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- labels -->
    <text x="104" y="80" font-style="italic" fill="#b91c1c" font-size="13">−ε</text>
    <text x="36" y="146" font-weight="bold" fill="#374151" font-size="13">P</text>
    <text x="186" y="146" font-weight="bold" fill="#1e40af" font-size="13">H</text>
  </g>
</svg>
