source_hash: b693da8b6e0e
title: Релятивистская заряженная частица
summary: 'Сила Лоренца в ковариантной форме, $dU^\mu/d\tau = (q/m)\,F^\mu{}_\nu U^\nu$: второй индекс тензора поля опускается метрикой Минковского и сворачивается с 4-скоростью в одном einsum. Интегрирование по собственному времени показывает, что быстрые частицы вращаются медленнее, чем предсказывает Ньютон, а постоянное электрическое поле разгоняет частицу всё ближе к скорости света, но никогда не выше неё.'
notes: 'Единицы с $c = 1$. Уравнения интегрируются методом RK4 по собственному времени $\tau$ каждой частицы, а затем для анимации пересчитываются на лабораторное время $t = X^0$. Циклотрон: магнитная сила не совершает работы, поэтому $\gamma$ постоянна, но орбита в $\gamma$ раз больше, а движение в $\gamma$ раз медленнее, чем для ньютоновской окружности ($\omega = qB/(\gamma m)$). Ускорение: из состояния покоя в однородном $E$ движение гиперболическое, $x = (\sqrt{1 + (at)^2} - 1)/a$ при $a = qE/m$, так что $v \to 1$, тогда как ньютоновское $\tfrac12 at^2$ обогнало бы свет после $t = 2/a$.'
meanings:
- 4-координата $(t, x, y, z)$ и 4-скорость $\gamma(1, \mathbf v)$ частицы $p$
- метрика Минковского $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$
- $F^{0i} = -E_i$, $F^{ij} = -\varepsilon_{ijk}B_k$
- 'повторяющийся $\alpha$ ⇒ суммирование: второй индекс опущен'
- 'повторяющийся $\nu$ ⇒ суммирование: 4-сила для каждой частицы'
- длина $U$ по Минковскому, должна оставаться равной 1
