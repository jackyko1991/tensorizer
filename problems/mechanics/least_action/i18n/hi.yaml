source_hash: 31fa57e56a24
title: 'न्यूनतम क्रिया का सिद्धांत: प्रवणता अवरोहण से पथ खोजना'
summary: स्थिर सिरों वाले पथ को बिंदुओं $q_n$ में काटिए, क्रिया $S = \sum_n L\,\Delta t$ को एक टेंसर व्यंजक के रूप में लिखिए, और autograd तथा एक ऑप्टिमाइज़र को गलत अनुमानों के एक बैच को तब तक ढलान पर नीचे खिसकाने दीजिए जब तक $\partial S/\partial q_n = 0$ न हो जाए। वे फेंकी गई गेंद के परवलय या दोलक की ज्या (sine) वक्र पर टिक जाते हैं।
notes: 'यहाँ प्रकृति चरण-दर-चरण आगे समाकलन नहीं करती: पूरा पथ एक साथ समायोजित होता है, यह जानते हुए कि उसे कहाँ से शुरू और कहाँ समाप्त होना है। $\partial S/\partial q_n = 0$ रखने पर $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 = -V''(q_n)$ मिलता है, जो असतत ऑयलर–लाग्रांज समीकरण है और ठीक वर्ले योजना है; स्थिर गुरुत्व के लिए यह परवलय को पूर्णांकन-त्रुटि तक पुनः उत्पन्न करता है, दोलक के लिए $O(\Delta t^2)$ तक। वास्तव में यह स्थिर (stationary) क्रिया का सिद्धांत है: दोलक के लिए हेसियन का सबसे छोटा आइगेनमान लगभग $m\Delta t\,(\pi^2/T^2 - \omega^2)$ है, इसलिए जैसे ही $T$ आधे आवर्तकाल $\pi/\omega$ से अधिक होता है, वास्तविक पथ $S$ का पल्याण (saddle) बिंदु बन जाता है, प्रवणता अवरोहण भटक जाएगा, और कोड न्यूटन चरणों $x \leftarrow x - \alpha H^{-1}\nabla S$ पर चला जाता है, जो कोई भी स्थिर बिंदु खोज लेते हैं। चिकनी, लंबी लहरें सबसे धीरे शिथिल होती हैं (सबसे छोटे हेसियन आइगेनमान); छोटी लहरें कुछ ही पुनरावृत्तियों में मिट जाती हैं।'
meanings:
- समय $t_n = n\,\Delta t$ पर परीक्षण पथ $b$; $q_{b0}$ और $q_{bN}$ स्थिर हैं
- 'विकर्ण पर $-1$, उसके दाईं ओर $+1$: $(Dq)_n = q_{n+1} - q_n$'
- 'दोहराया गया $k$ ⇒ योग: हर पथ के हर चरण पर वेग'
- गतिज ऊर्जा घटा स्थितिज ऊर्जा, चरणों पर योग; $V$ हर चरण के बाएँ सिरे पर लिया गया
- स्वतंत्र भीतरी बिंदुओं के लिए प्रवणता; पथ स्वतंत्र हैं, इसलिए एक बैकवर्ड पास सबके लिए काफ़ी है
- संवेग (momentum) सहित प्रवणता अवरोहण, $\eta = 0.8\,\Delta t/m$
- 'हेसियन: त्रिविकर्णी, विकर्ण पर $2m/\Delta t - V''''\Delta t$ और उसके बगल में $-m/\Delta t$'
- असतत ऑयलर–लाग्रांज समीकरण $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 + V'(q_n)$, वर्ले योजना; $\partial S/\partial q_n = -\Delta t\,r_n$
labels:
  system: निकाय
  method: विधि
  T: कुल समय $T$
  omega: दोलक आवृत्ति $\omega$
  q_start: आरंभ $q_0$
  q_end: अंत $q_N$
  n_steps: समय-चरण $N$
  n_paths: परीक्षण पथ
  wiggle: परीक्षण पथों की लहर
  n_iter: पुनरावृत्तियाँ
