source_hash: adf3aca0e79d
title: 質子治療：布拉格峰
summary: 以 RK4 同時對一整批質子能量積分 Bethe–Bloch 阻止本領 $-dE/dz \propto 1/\beta^2$。劑量在每個質子停下前急遽堆積（布拉格峰），而多個能量層的加權和能在腫瘤上形成平坦的劑量，後方幾乎沒有劑量。
notes: 水的常數：$K = 0.307$ MeV cm²/mol，$Z/A = 0.555$，$I \approx 75$ eV，$\rho = 1$ g/cm³；忽略殼層與密度修正。積分得到的射程（150 MeV → 約 15.8 cm）與 NIST PSTAR 相差約 1 %，並符合 Bragg–Kleeman 規則 $R = \alpha E^p$，其中 $p \approx 1.75$。射程歧離（$\sigma \approx 1.2\,\%$ 的 $R$）與射束能量分散使峰變圓；核反應僅以每公分 1 % 的初級粒子損失來模擬，因此峰值與入口劑量之比高於真實射束。歸一到相同腫瘤劑量的百萬伏特 X 射線束（先建成，再 $e^{-\mu z}$ 衰減）在入口處沉積更多劑量，並繼續穿過腫瘤後方；質子則會停下。所有數值皆為近似，僅供教學，不可用於臨床或治療計畫。
meanings:
- 射束 $b$ 在每個深度步上的動能（RK4，所有射束一起計算）
- Bethe–Bloch $-dE/dz$，單位 MeV/cm，對整批逐元素計算
- 原始劑量：在深度區間 $k$ 中每公分損失的能量
- 高斯射程歧離 + 能量分散，各列歸一化
- 重複的 $k$ ⇒ 求和：模糊後的布拉格曲線
- 重複的 $k$ ⇒ 求和：由 $K$ 個能量層組成的展寬布拉格峰
- 非負最小平方法（投影梯度），求平坦的靶區劑量
