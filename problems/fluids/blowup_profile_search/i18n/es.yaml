source_hash: 5ff140d5db65
title: Búsqueda de perfiles de explosión autosemejantes
summary: 'Así se cazan hoy las singularidades: escribir $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$, convertir la EDP en una ecuación para el perfil $U$ con exponente desconocido $\lambda$ y entrenar un lote de perfiles candidatos, uno por cada valor de prueba de $\lambda$, como un solo tensor con Gauss–Newton. Para Burgers no viscosa, los embudos del residuo solo colapsan en los valores exactos $\lambda = 1/(2i+2)$, y los perfiles aprendidos coinciden con los clásicos $y = -U - U^{2i+3}$. La misma búsqueda en la ecuación no local de Córdoba–Córdoba–Fontelos encuentra su exponente estable $\lambda \approx 1.18$.'
notes: 'Complemento de fluids/navier_stokes_blowup, que muestra la imagen de 1983: hacer avanzar el vórtice de Taylor–Green y ver crecer la vorticidad hasta que la malla no da más. El enfoque moderno se salta la evolución temporal: supone que la singularidad es autosemejante y busca el perfil directamente. Al sustituir $u = \tau^\lambda U(y)$ en $u_t + uu_x = 0$ se obtiene $-\lambda U + ((1+\lambda)y + U)U'' = 0$. Resuelta como EDO lineal para $y(U)$, da $y = -U - C\,U^{1+1/\lambda}$, que solo es suave cuando $1 + 1/\lambda$ es un entero impar. Así que $\lambda = 1/(2i+2)$, con perfiles exactos $y = -U - U^{2i+3}$ (normalizados por $U''(0) = -1$ y $U(-2) = 1$). Son resultados clásicos (Eggers & Fontelos, Singularities, 2015). $\lambda = 1/2$ es la explosión estable y genérica; $1/4, 1/6, \dots$ requieren datos ajustados con precisión. Aquí se entrenan 61 perfiles candidatos a la vez con $\lambda$ fijo. El mejor residuo frente a $\lambda$ (el embudo) cae al nivel de redondeo ($\sim10^{-15}$)
  en $\lambda = 1/2$ y a $\sim10^{-11}$ en $1/4$. Entre medias es mucho mayor ($\sim10^{7}$ veces mayor en $\lambda = 0.37$), porque allí solo existen perfiles con un término no suave $|y|^{1+1/\lambda}$. Imponer $U''''''(0) = 0$ elimina el embudo de $1/2$, y la búsqueda encuentra entonces $1/4$. Imponer además $U^{(5)}(0) = 0$ debería aislar $1/6$. Con esta resolución, sin embargo, el embudo cerca de $1/6$ es demasiado plano para fijarlo: los perfiles rivales solo difieren en el orden $y^{7}$, y el mínimo poco profundo cae en $\lambda \approx 0.19$. El residuo no distingue estable de inestable: eso es una propiedad de la evolución temporal, y aquí los perfiles inestables solo se alcanzan mediante las restricciones adicionales. El perfil es un desarrollo espectral con los sesgos inductivos que usa la investigación, una coordenada compactificada y la conformación de la salida; los artículos de investigación usan redes neuronales informadas por la física (PINN) con los mismos sesgos. Gauss–Newton
  es el optimizador de Wang et al. (2025). Los pasos de gradiente en $\lambda$ se atascan en la punta de cada embudo, así que una búsqueda por sección áurea, en lote, fija $\lambda$. La ecuación CCF $\theta_t - (H\theta)\theta_x = 0$ (un modelo 1D de la ecuación cuasigeostrófica de superficie; $H$ es la transformada de Hilbert) se resuelve en forma de vorticidad, $\omega = \theta_x = \Omega(y)/\tau$. $\Omega$ se desarrolla en $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$, cuyas transformadas de Hilbert son exactas. La ejecución por defecto encuentra $\lambda \approx 1.18$ (residuo $\sim10^{-4}$); ejecuciones más largas con una base mayor se estabilizan en $1.1808$ (residuo $2\times10^{-6}$). Esto concuerda con el exponente del estado fundamental $\approx 1.18$ de Eggers & Fontelos (Nonlinearity, 2020). Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) hallaron el primer perfil CCF inestable con PINN, $\lambda_1 \approx 0.6057$. Wang et al. (2025, arXiv 2509.14185) hallaron un segundo,
  $\lambda_2 \approx 0.4713$, y alcanzaron residuos cercanos a $10^{-13}$, casi precisión doble. También hallaron nuevas familias inestables para las ecuaciones de medios porosos y de Boussinesq, que son candidatos numéricos. Los perfiles inestables tienen gradientes abruptos que esta búsqueda de un minuto en CPU no resuelve; solo muestra el embudo estable. Estado: los perfiles de Burgers son teoremas exactos. La explosión para CCF la demostraron Córdoba, Córdoba & Fontelos (Annals, 2005). Los perfiles hallados por búsqueda neuronal son candidatos numéricos hasta que una demostración asistida por ordenador los convierte en teoremas, como hicieron Chen & Hou (2022) para el escenario de Hou–Luo de Euler axisimétrico con frontera. El problema del milenio de Navier–Stokes incompresible en 3D sigue abierto, y nada de esto le atañe directamente. Pruebe una malla de $\lambda$ más gruesa o menos pasos de Gauss–Newton y vea cómo se difuminan los embudos.'
meanings:
- 'el lote: un exponente de prueba por perfil candidato, todos entrenados a la vez'
- 'coordenada compactificada $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$: $r = 1$ en $y = 0$, $r \to 0$ cuando $|y| \to \infty$'
- impar, $U'(0) = -1$ y $U \sim y^{\lambda/(1+\lambda)}$ lejos están incorporados; $P$ es una serie de Chebyshov en $r$
- residuo de la ecuación del perfil en los puntos de colocación, más $U(2) = -1$ y las restricciones de suavidad
- $R$ es cuadrático en $c$, así que el jacobiano es exacto (comprobado frente a autograd en las pruebas)
- paso de Levenberg–Marquardt (Gauss–Newton amortiguado) para cada miembro del lote en una sola resolución conjunta
- coeficientes de Taylor de $U = -y + c_3y^3 + c_5y^5 + \dots$; anularlos elimina los embudos en $\lambda = 1/2$ y $1/4$
- 'transformada de Hilbert exacta de la base CCF: $(1-iy)^{-s}$ es analítica en el semiplano superior'
- fija el fondo de cada embudo; el perfil se reentrena en cada valor de prueba de $\lambda$
labels:
  n_lambda: 'Tamaño del lote: exponentes de prueba $\lambda$'
  gn_steps: Pasos de Gauss–Newton por perfil
  ccf_lambda0: Exponente inicial de CCF $\lambda_0$
