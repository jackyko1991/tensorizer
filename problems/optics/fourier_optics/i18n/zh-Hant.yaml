source_hash: e1ad81688a05
title: 以二維傅立葉轉換描述夫朗和斐繞射
summary: 在遠場中，孔徑的繞射圖樣就是其透射函數的二維傅立葉轉換。呼叫一次 torch.fft.fft2，就能把方孔、圓孔、雙狹縫與光柵轉成各自的遠場圖樣；圓孔變大時，艾里環隨之縮小。
notes: 孔徑平面上的長度以大小為 $\Delta x$ 的像素計；轉換後的頻率像素 $(k, l)$ 對應於方向 $\sin\theta = \lambda k/(N\Delta x)$。因此圓孔位於 $\sin\theta = 1.22\,\lambda/D$ 的第一暗環，距中心 $1.22\,N/D$ 個頻率像素（虛線圓）。大孔徑產生小圖樣：寬函數的轉換是窄的。einsum 形式與 fft2 是同一個轉換，只是複雜度為 $O(N^3)$ 而非 $O(N^2\log N)$。
meanings:
- 遮罩的透射率：1 = 透光，0 = 不透光；列 $a = y$，行 $b = x$
- 離散傅立葉轉換矩陣
- 重複的 $a$ 與 $b$ ⇒ 求和：沿 $y$ 與沿 $x$ 各一次一維轉換
- 以快速傅立葉轉換做同一轉換，零頻移到中心
- 遠場強度，以 $\log_{10}(I/I_{\max})$ 顯示
- 直徑 $D$ 的圓孔的第一暗環，以頻率像素計
labels:
  size_min: 起始孔徑大小 $D$
  size_max: 最終孔徑大小 $D$
  frames_per_aperture: 每種孔徑形狀的影格數
