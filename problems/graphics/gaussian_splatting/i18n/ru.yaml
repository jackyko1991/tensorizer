source_hash: fb9eaaef3d46
title: 3D гауссов сплэттинг
summary: Сцена представлена несколькими сотнями цветных полупрозрачных 3D-гауссиан. Каждая проецируется в камеру с помощью якобиана перспективного отображения, $\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$, пятна сортируются по глубине и альфа-композитируются спереди назад, $C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$, а Adam подгоняет каждое среднее, масштаб, вращение, цвет и непрозрачность под фотографии синтетической сцены. Отложенный ракурс проверяет, что гауссианы выучили 3D-формы, а не только обучающие снимки.
notes: 'Эталон — три сферы и куб, аналитически отрендеренные трассировкой лучей с ламбертовым затенением в 12 камер на двух кольцах вокруг сцены ($64\times 64$ пикс.); 13-я камера между ними, на другой высоте, отложена для проверки. Гауссианы стартуют в случайных точках куба, серые и бледные, со случайной ориентацией. Каждый шаг Adam рендерит один обучающий ракурс через весь описанный конвейер и распространяет L1-ошибку фотографии назад в каждое среднее, логарифм масштаба, кватернион, цвет и непрозрачность. Тензорный урок — алгебра ковариаций: $\Sigma = RSS^{\mathsf T}R^{\mathsf T}$ остаётся допустимой (симметричной положительно определённой) ковариацией, что бы ни делал оптимизатор, а проекция нелинейна, поэтому каждая гауссиана проводится через свою локальную линеаризацию $J$; 2D-пятно $\Sigma'' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$ — это цепочка einsum. Панель эллипсов рисует эти эллипсы $1\sigma$ в отложенном ракурсе. Уплотнение, упрощённое: каждые 50 шагов (в первые 70%) гауссианы,
  центры которых получили наибольшие градиенты, расщепляются на две копии в $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$ с осями, уменьшенными в 1,6 раза, при этом переиспользуются почти прозрачные гауссианы ($o < 0.05$), так что $M$ остаётся постоянным; в статье вместо этого клонируют и расщепляют по градиентам в пространстве вида, прореживают, сбрасывают непрозрачности и наращивают число гауссиан до миллионов. Другие упрощения по сравнению с Kerbl et al. (SIGGRAPH 2023): постоянные цвета вместо сферических гармоник (сцена ламбертова), случайный старт вместо облака точек из структуры из движения, потеря L1 без члена D-SSIM и плотный растеризатор, вычисляющий каждое пятно в каждом пикселе (настоящий сортирует пятна по тайлам $16\times 16$ на GPU и пропускает дальние), поэтому изображение маленькое. PSNR на отложенном ракурсе остаётся немного ниже обучающего: невиданные ракурсы слабее ограничивают гауссианы. Попробуйте меньше ракурсов (отложенный ракурс ухудшается), потерю L2, выключенное
  уплотнение или больше гауссиан и шагов (более чёткие края).'
meanings:
- вращение гауссианы $m$ из кватерниона, нормируемого внутри, так что любые 4 числа задают допустимое вращение
- 3D-ковариация, суммирование по $j$; симметрична и положительно определена при любых параметрах, $s = e^{\log s}$
- центр каждой гауссианы в системе координат каждой камеры (x вправо, y вниз, z = глубина)
- проекция центров в пиксельные координаты по модели камеры-обскуры
- '$\partial\mu''_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$: локальная линеаризация проекции'
- 2D-ковариация каждого пятна, суммирование по $j, k$, где $JW = $ einsum('vmai,vij->vmaj'), плюс фильтр нижних частот 0.3 пикс.²
- 'квадратичная форма $d^{\mathsf T}\Sigma''^{-1}d$, разложенная по 6 мономам $\varphi = (u^2, 2uv, v^2, u, v, 1)$ пикселя: одно матричное произведение'
- какую часть пикселя $p$ покрывает пятно $m$; $o_m = \sigma(\text{logit})$
- порядок по глубине для каждой камеры; маленькие тензоры гауссиан переупорядочиваются до того, как появятся большие $(V, M, P)$
- 'пропускание: свет, оставшийся после пятен перед $m$; не возрастает по $m$'
- композитинг спереди назад, суммирование по $m$; прошедший свет показывает белый фон $b$
- средняя абсолютная ошибка пикселя на одном случайном обучающем ракурсе за шаг; Adam обновляет все $14M$ чисел
labels:
  n_gaussians: Гауссианы $M$
  iterations: Шаги Adam
  lr: Скорость обучения Adam (средние; остальные масштабированы)
  loss: Фотометрическая потеря
  densify: Уплотнение расщеплением
  n_views: Обучающие ракурсы $V$
  resolution: Размер изображения (пиксели)
