source_hash: 2c6e3e6a24cf
title: वर्कफ़्लो DAG एक स्थिर राउटर वाला मिक्सचर ऑफ़ एक्सपर्ट्स है
summary: 'एक MNIST अंक $d$ और "now plus three" जैसा तीन शब्दों का पाठ मिलकर उत्तर $y = (d \circ k) \bmod 10$ देते हैं; अकेली कोई भी मोडैलिटी पर्याप्त नहीं है। Snakemake-शैली के वर्कफ़्लो के रूप में लिखी गई (encode_image, encode_text, इनपुट फ़ंक्शन द्वारा चुनी गई हर संक्रिया के लिए एक fuse नियम, classify) और Circle of Willis (विलिस वृत्त) समस्या के टेंसर DAG इंजन से चलाई गई यह पाइपलाइन ठीक वही गणना करती है जो एक top-1 मिक्सचर-ऑफ़-एक्सपर्ट्स लेयर करती है, जब उसकी राउटर मैट्रिक्स $G$ नियम के चुनाव पर स्थिर कर दी जाए। फिर वे चार चरण जो एक ही टेंसर प्रोग्राम में संभव हैं: सीखा हुआ राउटर, अलग-अलग प्रशिक्षित करके जोड़े गए एक्सपर्ट, पूरे DAG से होकर एक बैकवर्ड पास, और int8 में संग्रहीत एक छोटे डेंस नेटवर्क में डिस्टिलेशन। यह ज्ञात परिणामों को जोड़ने वाला एक दृष्टिकोण है, कोई नया प्रमेय नहीं।'
notes: 'विचार। यह दृष्टिकोण Jacky Ka Long Ko का है: विलिस वृत्त का वर्कफ़्लो (medical/cow_workflow_dag) बनाते समय यह दिखा कि एक Snakemake DAG एक ही टेंसर प्रोग्राम हो सकता है, और ऐसा प्रोग्राम एक मल्टीमोडल मिक्सचर ऑफ़ एक्सपर्ट्स जैसा दिखता है। सटीक रूप में: वर्कफ़्लो DAG एक स्थिर राउटर वाला MoE है; MoE एक ऐसा DAG है जिसके किनारे (edges) हर इनपुट के लिए चुने जाते हैं। यह ज्ञात परिणामों को जोड़ने वाला एक दृष्टिकोण है, कोई नया प्रमेय नहीं, और यह समस्या उसका एक छोटा उदाहरण बनाती है। तुल्यता। data/Snakefile में नियम encode_image, encode_text, fuse (हर सैंपल और हर संक्रिया के लिए एक जॉब, वाइल्डकार्ड $op$), classify और collect हैं; classify अपना इनपुट एक इनपुट फ़ंक्शन `routed` से पढ़ता है, जो सैंपल के पाठ में दी गई संक्रिया के fuse आउटपुट को चुनता है। इंजन cow_workflow_dag के पार्सर से फ़ाइल को पार्स करता है और उसके क्रोनेकर ब्लॉकों से जॉब्स की आसन्नता (adjacency) मैट्रिक्स बनाता है; सशर्त किनारे का ब्लॉक $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$ है, इसलिए राउटर
  मैट्रिक्स $G$ आसन्नता मैट्रिक्स के भीतर ही बैठी है, और $N E$ fuse जॉब्स में से केवल चुने गए $N$ की ज़रूरत होती है (एक बूलियन बैकवर्ड पास, जैसे Snakemake अनावश्यक जॉब्स छाँट देता है)। स्तर-दर-स्तर, हर नियम के लिए एक बैच कॉल से चलाने पर यह वही लॉजिट देता है जो एक Switch-शैली की लेयर देती है (संचयी रैंकों से डिस्पैच टेंसर $D$, सभी एक्सपर्ट एक बैच einsum में, फिर combine), जिसमें $G$ नियम के चुनाव पर स्थिर है और गेट मान 1 हैं: float32 में बिट-दर-बिट समान और float64 में $4 \times 10^{-15}$ के भीतर, सभी 1000 परीक्षण सैंपलों × 2 सीड पर (स्टैक किया गया और समूह-वार गुणनफल अलग क्रम में जोड़े जाते हैं), और भविष्यवाणी हर जगह एक जैसी। यह एक ही गणना को लिखने के दो तरीकों की सर्वसमिका है, कोई प्रायोगिक खोज नहीं। सीखा हुआ राउटर। पाठ-फ़ीचर्स पर एक softmax गेट, top-1 रूटिंग और Switch लोड-बैलेंसिंग लॉस ($\alpha = 0.01$) के साथ, एनकोडर स्थिर (frozen), दो रूप साथ-साथ। वर्कफ़्लो के अपने fuse एक्सपर्ट्स के आगे अकेला गेट नियम को फिर से खोज लेता है: डिफ़ॉल्ट 800 स्टेप के बाद 0.85 ± 0.03 परीक्षण सैंपलों के लिए
  संक्रिया $e$ एक्सपर्ट $e$ के पास जाती है (सटीकता 0.82, जबकि स्थिर राउटर के साथ 0.92), और यह अब भी बढ़ रही है (एक परीक्षण रन में 1500 स्टेप के बाद 0.95 और 0.90)। नए एक्सपर्ट्स के साथ मिलकर सीखने पर ऐसा नहीं होता: रूटिंग संक्रियाओं से संयोग से बेहतर मेल नहीं खाती (सर्वोत्तम एक्सपर्ट क्रमचय के साथ 0.35; 1/3 का अर्थ है कोई संबंध नहीं), एक्सपर्ट मिले-जुले रहते हैं और सटीकता 0.40 पर टिकी रहती है। fuse एक्सपर्ट पाठ नहीं देखते, इसलिए संक्रिया को अनदेखा करने वाली रूटिंग हर एक्सपर्ट को एक असंभव काम दे देती है; लेकिन शुरुआत में कोई भी एक्सपर्ट किसी भी संक्रिया में बेहतर नहीं होता, इसलिए top-1 गेट को सममिति तोड़ने का कोई संकेत नहीं मिलता। गेट नॉइज़, 100× बड़ा गेट इनिशियलाइज़ेशन, 500 स्टेप का डेंस (सॉफ़्ट) वार्म-अप और $\alpha = 0.1$ ने परीक्षण रनों में इसे नहीं बदला (ये डिफ़ॉल्ट रन का हिस्सा नहीं हैं)। बड़े MoE अपने राउटर शून्य से सफलतापूर्वक प्रशिक्षित करते हैं; यह खिलौना उदाहरण केवल इतना कहता है कि यहाँ स्थिर नियम अपने-आप दोबारा नहीं खोजा जाता। चरण। (2) अलग-अलग प्रशिक्षण: हर एक्सपर्ट अपने उप-कार्य
  पर — इमेज एक्सपर्ट (एक MLP) अंक-लेबलों पर (परीक्षण सटीकता 0.916), टेक्स्ट एक्सपर्ट (einsum वाली एक अटेंशन लेयर) संख्या-शब्द पर (1.000), fuse एक्सपर्ट one-hot इनपुट से 300 प्रविष्टियों वाली तालिका पर (1.000); बिना संयुक्त प्रशिक्षण के DAG से जोड़ने पर पाइपलाइन 0.924 परीक्षण जोड़ों का सही उत्तर देती है (अंक-सटीकता से अधिक, क्योंकि 0 या 5 से गुणा कुछ गलत अंकों को माफ़ कर देता है)। (3) एंड-टू-एंड फ़ाइन-ट्यूनिंग, सभी चरणों से होकर एक बैकवर्ड पास: 0.924, कोई लाभ नहीं; अड़चन इमेज एक्सपर्ट है, और संयुक्त लॉस अंकों के बारे में कोई नई जानकारी नहीं लाता (वही 3000 छवियाँ)। (4) एक डेंस स्टूडेंट (784 + 45 → 64 → 64 → 10, 57 930 वेट, पाइपलाइन के 108 766 का 0.53) जिसे $T = 4$ पर डिस्टिल किया गया (लॉस $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 क्रॉस-एंट्रॉपी): 0.85–0.86, 0.85–0.87 सैंपलों पर अपने टीचर से सहमत, और अपने 3000 स्टेप के अंत में भी सुधर रहा है; प्रति चैनल int8: 0.85–0.86, 232 kB के बजाय 58.9 kB (पाइपलाइन के लिए 435 kB)। एक CPU थ्रेड पर 1000 परीक्षण जोड़ों का समय: DAG इंजन 90 ms, वही DAG एक MoE लेयर
  के रूप में 19 ms (इंजन अपने जॉब ब्लॉक भी बनाता है), स्टूडेंट 3.4 ms, int8 स्टूडेंट 3.5 ms (डीक्वांटाइज़ किए गए फ़्लोट से गणना होती है, इसलिए छोटा है पर यहाँ वास्तव में तेज़ नहीं), और हर जॉब के लिए एक कॉल, जैसे कोई शेड्यूलर प्रोसेस शुरू करने की लागत के बिना चलाता, 900–1000 ms। क्या निष्कर्ष नहीं निकलता। केवल वे चरण जो एक ही मेमोरी स्पेस में टेंसर प्रोग्राम हैं, बिना कॉपी के जुड़ते हैं और ग्रेडिएंट आगे बढ़ाते हैं: फ़ाइल-आधारित टूल (OpenFOAM, VMTK, बायोइमेज विश्लेषण का अधिकांश भाग) ऐसा नहीं करते, और उनसे बना Snakemake DAG प्रोसेसों का DAG ही रहता है। विलिस वृत्त वाली गति-वृद्धि मुख्यतः हर जॉब के लिए प्रोसेस शुरू करने और फ़ाइल I/O से बचने से आई थी, बैचिंग से नहीं। और एंड-टू-एंड प्रशिक्षण तभी मदद करता है जब कोई चरण कुछ ऐसा सीख सके जो अलग-अलग प्रशिक्षण ने उसे नहीं दिया; यहाँ ऐसा नहीं हुआ। संबंधित कार्य। Neural Module Networks (Andreas et al. 2016) हर प्रश्न के लिए पार्सर द्वारा चुने गए मॉड्यूलों से एक नेटवर्क जोड़ते हैं, यानी हर इनपुट के लिए चुना गया DAG; स्पार्स-गेटेड MoE (Shazeer et al. 2017)
  और Switch Transformer (Fedus et al. 2021, यहाँ प्रयुक्त top-1 रूटिंग और लोड-बैलेंसिंग लॉस); LIMoE (Mustafa et al. 2022) और Uni-MoE (Li et al. 2024) में मोडैलिटी एक्सपर्ट; मॉडल स्टिचिंग (Lenc & Vedaldi 2015; Bansal et al. 2021) अलग-अलग प्रशिक्षित नेटवर्कों को एक सीखे हुए इंटरफ़ेस से जोड़ती है, जैसे चरण 2 प्रायिकता सदिशों के ज़रिए करता है; नॉलेज डिस्टिलेशन (Hinton et al. 2015); DSPy (Khattab et al. 2023) भाषा-मॉडल कॉल्स की पूरी पाइपलाइनों को एंड-टू-एंड ऑप्टिमाइज़ करता है। Google का Pathways (2021 का एक ब्लॉग पोस्ट और विज़न) एक ऐसे मॉडल का वर्णन करता है जो हर कार्य को केवल उसके ज़रूरी हिस्सों से होकर रूट करता है। डेटा। MNIST (LeCun, Cortes & Burges; LeCun et al. 1998), लाइसेंस CC BY-SA 3.0: 3000 प्रशिक्षण छवियाँ (प्रति अंक 300) और 1000 परीक्षण छवियाँ (प्रति अंक 100), फ़ाइल क्रम में हर अंक की पहली छवियाँ, uint8 के रूप में साथ में दी गई (0.7 MB, data/mnist_train.npz, data/mnist_test.npz, उसी लाइसेंस के तहत पुनर्वितरित; स्रोत, चेकसम और प्रोसेसिंग data/SOURCES.md में हैं)। पाठ जनरेट किए जाते
  हैं: एक संक्रिया-शब्द (plus, minus, times), एक संख्या-शब्द (zero से nine तक) और एक भराव-शब्द (now, then), यादृच्छिक क्रम में; परीक्षण पाठ एक स्थिर सीड का उपयोग करते हैं। डिवाइस और सीमाएँ। साथ दिए गए आँकड़े CPU पर डिफ़ॉल्ट रन से हैं (प्रोजेक्ट के एनवायरनमेंट में यहाँ PyTorch का CUDA बिल्ड नहीं है; लगभग $10^5$ वेट पर GPU से कोई लाभ नहीं होता): एक व्यस्त 6-कोर मशीन पर प्रशिक्षण और मापन में लगभग 75–150 s, साथ में GIF। सभी सीड मॉडल अक्ष पर एक साथ प्रशिक्षित होते हैं, हर एक अपने मिनीबैच के साथ, और हर सीड को प्लॉट किया जाता है। एक अंक और तीन संक्रियाओं वाला खिलौना उदाहरण: यह संरचना दिखाता है, यह नहीं कि बड़े मल्टीमोडल MoE कैसे व्यवहार करते हैं।'
meanings:
- data/Snakefile से medical/cow_workflow_dag के पार्सर द्वारा पार्स किया गया नियम-ग्राफ़, साथ में इनपुट फ़ंक्शन `routed` (एक सशर्त किनारा classify ← fuse)
- 'जॉब-स्तरीय ब्लॉक: cow_workflow_dag का क्रोनेकर गुणनफल (हर वाइल्डकार्ड अक्ष sample, op के लिए $I$, $\mathbb 1$, $\mathbb 1^\top$); सशर्त किनारे के लिए इसे राउटर से मास्क किया जाता है, इसलिए classify का जॉब $n$ fuse का जॉब $(n, e)$ तभी और केवल तभी पढ़ता है जब $G_{ne} = 1$'
- 'वर्कफ़्लो का राउटर: संक्रिया-शब्द का one-hot, जो एक नियम (इनपुट फ़ंक्शन) से मिलता है, सीखा नहीं जाता'
- 'वे जॉब जिन पर लक्ष्य निर्भर है, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$: $N E$ fuse जॉब्स में से केवल $N$'
- 'इंजन: नियम स्तर-दर-स्तर, हर नियम अपने ज़रूरी जॉब्स पर केवल एक बैच कॉल (fuse: अपने $op$ वाइल्डकार्ड के हर मान के लिए एक कॉल)'
- सैंपल $n$ को एक्सपर्ट $e$ के स्लॉट $c$ में (वहाँ रूट किए गए सैंपलों में उसकी रैंक), जैसा GShard/Switch में; क्षमता $C$ = सबसे बड़ा समूह
- सभी एक्सपर्ट एक बैच गुणनफल में; $m$ मॉडल (सीड) अक्ष है, उस पर कभी योग नहीं होता
- 'combine: $e$ और $c$ पर योग, हर सैंपल के लिए एक ही शून्येतर पद, इसलिए $g = G$ होने पर यह DAG आउटपुट के बराबर है'
- 'सीखा हुआ राउटर: पाठ-फ़ीचर्स पर एक रैखिक गेट का softmax; top-1 रूटिंग, आउटपुट $p$ से स्केल किया गया'
- 'Switch लोड बैलेंसिंग: $f_e$ = $e$ को रूट किया गया अंश, $P_e$ = औसत गेट प्रायिकता; संतुलित और एकसमान होने पर 1, ढह जाने पर $E$'
- तापमान $T$ पर Hinton डिस्टिलेशन; स्टूडेंट का लॉस $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ गुणा सही उत्तर पर क्रॉस-एंट्रॉपी है
- प्रति आउटपुट चैनल सममित int8, $s_o = \max_i |W_{io}|/127$; int8 + प्रति चैनल एक float32 स्केल के रूप में संग्रहीत
