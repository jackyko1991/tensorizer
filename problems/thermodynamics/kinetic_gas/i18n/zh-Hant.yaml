source_hash: 673b0fc9f634
title: 理想氣體動力論
summary: 數百個硬圓盤在盒中彈跳。每個圓盤起初速率相同，但彈性碰撞重新分配能量，直到速率服從馬克士威–波茲曼分佈；圓盤交給牆壁的動量則重現理想氣體定律 $PA = NkT$。
notes: 約化單位：盒邊長 1、質量 1、波茲曼常數 1。配對張量是 $N\times N$，對數百個圓盤沒問題（實際程式使用網格列表）。同一步中同時接觸兩個圓盤的圓盤會等待一步，因此每次碰撞都是乾淨的二體交換，能量守恆到捨入誤差。壓力是每次反彈傳遞的動量 $2m\lvert v_\perp\rvert$，對整個模擬求和後除以時間 × 牆長。結果比 $NkT/A$ 高幾個百分點，因為圓盤本身佔據面積——這是理想氣體的第一階修正，對面積分率 $\eta$ 約為 $(1 + \eta^2/8)/(1 - \eta)^2$。
meanings:
- 圓盤 $a$ 的位置，分量 $i \in \{x, y\}$
- 圓盤 $a$ 的速度
- 以廣播一次求出所有兩兩位移
- 重複的 $i$ ⇒ 求和：每對的距離平方
- 相對速度投影到碰撞法線上，對 $P$ 個碰撞對
- 總動能，在二維中等於 $NkT$
- 二維速率分佈 $(mv/kT)\exp(-mv^2/2kT)$
labels:
  n_particles: 粒子數
  radius: 圓盤半徑
  speed: 初始速率
  t_max: 模擬時間
