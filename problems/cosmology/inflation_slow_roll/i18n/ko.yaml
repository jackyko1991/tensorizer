source_hash: 157106563a38
title: 느린 굴림 인플레이션과 (n_s, r) 평면
summary: 다섯 가지 인플라톤 퍼텐셜($m^2\phi^2$, $\lambda\phi^4$, 스타로빈스키 $R^2$, 자연 인플레이션, 4차 언덕꼭대기)이 하나의 배치 텐서 안에서 프리드만 방정식과 클라인–고든 방정식에 따라 굴러가며, e-폴드 수 $N = \ln a$를 시계로 사용합니다. 느린 굴림 매개변수 $\epsilon$, $\eta$와 $N_* = 50$–$60$에서의 예측값 $n_s$, $r$을 정확한 배경 해와 비교해 검증하고, Planck 2018 및 BICEP/Keck 2021 결과 위에 표시합니다. $m^2\phi^2$와 $\lambda\phi^4$는 배제되는 쪽이고, 스타로빈스키 모델은 허용 영역 안에 있습니다. 인플레이션은 초기 조건에 대한 가장 유력한 설명이지만 확증되지는 않았습니다. 원시 B-모드는 아직 검출되지 않았습니다.
notes: '단위: 환산 플랑크 질량 $M_\mathrm{pl} = 1$. $N = \ln a$를 시간으로, $\psi = d\phi/dN$, $\epsilon_H = \psi^2/2$로 두고 방정식을 쓰면 $d\psi/dN = -(3-\epsilon_H)(\psi + V''/V)$와 $H^2 = V/(3-\epsilon_H)$를 얻으므로 $V''/V$만 중요하며, 모든 퍼텐셜은 높이 1로 그립니다(그러면 진폭 $A_s = 2.1\times10^{-9}$가 에너지 규모를 정하며, 이는 $V_*^{1/4}$로 출력되고 대부분의 모델에서 약 $10^{16}$ GeV입니다). 각 장은 종료 약 68 e-폴드 전, 교과서적 느린 굴림 계산으로 정한 지점에서 느린 굴림 속도 $\psi = -V''/V$로 출발합니다. 테스트에서는 $m^2\phi^2$를 매우 다른 속도들로 출발시키는데, 모두 몇 e-폴드 안에 같은 곡선에 도달합니다. 즉 느린 굴림은 끌개입니다. 인플레이션은 $\epsilon_H = 1$인 곳에서 끝납니다. 예측값은 두 번 계산합니다. 퍼텐셜로부터 1차까지($n_s = 1 - 6\epsilon_V + 2\eta_V$, $r = 16\epsilon_V$, × 표시), 그리고 수치 배경 해의 허블 흐름 매개변수 $\epsilon_{1,2,3}$로부터 2차까지(Stewart and Lyth 1993; Schwarz, Terrero-Escalante and García 2001; 점)입니다. 둘은 $O(\epsilon^2)$만큼, 즉 $n_s$에서 $10^{-4}$의 몇 배 정도 다릅니다. 모드별 완전한 무하노프–사사키 해는 여기서 다루지 않습니다. $N_* = 55$에서의 결과: $m^2\phi^2$는 $n_s \approx 1 - 2/N_*$, $r \approx 8/N_* \approx 0.14$를 주고, $\lambda\phi^4$는 $r \approx 0.29$와 너무 붉은 $n_s$를 주며, 스타로빈스키 모델은 $n_s \approx 0.965$, $r
  \approx 12/N_*^2 \approx 0.004$를 줍니다. 자연 인플레이션($f = 7$)은 한계를 넘는 $r \approx 0.08$을 주고, 4차 언덕꼭대기($\mu = 15$)는 영역 안에 들어옵니다. 관측 영역은 상자로 그렸으며(Planck 2018 $n_s = 0.9649 \pm 0.0042$, 68 %, TT,TE,EE+lowE+lensing; BICEP/Keck 2021 $r_{0.05} < 0.036$, 95 %), 약간 기울어져 있고 데이터 조합에 따라 달라지는 발표된 2차원 등고선을 그린 것은 아닙니다. 솔직한 현황: 인플레이션은 평탄성, 지평선 문제, 거의 규모 불변이고 가우스적이며 단열적인 요동을 설명하고, $n_s < 1$은 측정되기 전에 예측되었습니다. 그러나 경쟁 이론들(반동 모델과 에키피로틱 모델)이 있고, 인플라톤은 정체가 밝혀지지 않았으며, 결정적 증거인 중력파에 의한 원시 B-모드 편광은 검출되지 않았습니다(BICEP2의 2014년 주장은 은하 먼지로 판명되었습니다). $N_*$를 50에서 60 사이로 바꿔 보거나(우주가 어떻게 재가열되었는지에 따라 달라집니다) $f$와 $\mu$를 바꿔 보세요. $N_* = 55$에서 자연 인플레이션은 결코 상자에 들어오지 못하는데, $f$를 낮추면 $r$은 내려가지만 $n_s$가 너무 붉어지기 때문입니다($f = 5$: $n_s \approx 0.950$, $r \approx 0.04$).'
meanings:
- '원-핫 행: 장 $b$가 퍼텐셜 $p$를 사용'
- 모든 장에서 계산한 다섯 가지 퍼텐셜 모양
- '반복된 $p$ ⇒ 합산: 각 장 자신의 퍼텐셜'
- 장과 $d\phi/dN$, e-폴드 단위로 RK4로 함께 전진
- '배경 해에 필요한 유일한 것: $V$의 높이는 소거됨'
- 자동 미분으로 구한 $V'$와 $V''$
- $\epsilon_H$가 1을 넘어서는 곳, 즉 $\ddot a$의 부호가 바뀌는 곳
- 종료 $N_*$ e-폴드 전의 허블 흐름 매개변수, 한 번의 gather로
- 정확한 배경 해로부터의 2차 예측값
labels:
  N_star: 종료 전 기준 e-폴드 수 $N_*$
  f: 자연 인플레이션 규모 $f$
  mu: 언덕꼭대기 폭 $\mu$
