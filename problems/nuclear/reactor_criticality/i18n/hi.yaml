title: रिएक्टर क्रांतिकता
summary: क्या विखंडनीय पदार्थ की एक पट्टी (slab) क्रांतिक है? एक-समूह न्यूट्रॉन विसरण इस प्रश्न को ग्रिड पर एक व्यापकीकृत आइगेनमान समस्या $M\phi = \tfrac1k F\phi$ में बदल देता है। घात पुनरावृत्ति (power iteration) — बार-बार अगली न्यूट्रॉन पीढ़ी के लिए हल करना — मूल फ़्लक्स मोड और गुणन गुणक $k_{eff}$ पर अभिसरित होती है, और अनेक पट्टी चौड़ाइयों पर बैच आइगेन हल क्रांतिक आकार ढूँढता है।
notes: '$k$ एक पीढ़ी के न्यूट्रॉनों का पिछली पीढ़ी से अनुपात है। हर घात-पुनरावृत्ति चरण एक पीढ़ी है: उच्च स्थानिक मोड हर चरण में गुणक $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$ से सिकुड़ते हैं, इसलिए असंतुलित प्रारंभ सममित $\sin(\pi x/L)$ आकार में स्थिर हो जाता है। पतली पट्टी बहुत अधिक न्यूट्रॉन रिसने देती है ($k < 1$); क्रांतिक चौड़ाई $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$ से ऊपर शृंखला अभिक्रिया बढ़ती है। डिफ़ॉल्ट एक-समूह स्थिरांक एक तापीय रिएक्टर के दृष्टांत हैं ($k_\infty \approx 1.06$)। सरलीकरण: एक ऊर्जा समूह, परावर्तक रहित समांगी नग्न पट्टी, $L$ बहिर्वेशित (extrapolated) फलकों के बीच मापी गई, और कोई विलंबित न्यूट्रॉन या पुनर्निवेश (feedback) नहीं — यह स्थैतिक आइगेनमान गणना है, समय-आश्रित नहीं।'
meanings:
- आंतरिक बिंदु; (बहिर्वेशित) पट्टी फलकों पर $\phi = 0$
- द्वितीय-अंतर आव्यूह $(1, -2, 1)/h^2$
- रिसाव और अवशोषण से खोए न्यूट्रॉन
- विखंडन में जन्मे न्यूट्रॉन
- 'दोहराया गया $j$ ⇒ योग: अगली पीढ़ी का विखंडन स्रोत'
- एक घात-पुनरावृत्ति चरण
- प्रत्यक्ष हल, $S$ पट्टी चौड़ाइयों पर बैच
labels:
  width: पट्टी चौड़ाई $L$
  diffusion: विसरण गुणांक $D$
  sigma_a: अवशोषण $\Sigma_a$
  nu_sigma_f: उत्पादन $\nu\Sigma_f$
  n_iter: घात पुनरावृत्तियाँ
  n_grid: ग्रिड बिंदु
