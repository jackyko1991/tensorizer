source_hash: f24d1ad2823c
title: 二维伊辛模型
summary: 由 $\pm 1$ 自旋组成的晶格，自旋倾向于与近邻平行。每个格点的近邻求和是一次十字形卷积核的 conv2d，棋盘格 Metropolis 更新并行翻转半个晶格。在临界温度以下，畴不断长大直到磁体有序；在临界温度以上，自旋保持无序。
notes: 单位：$J = k_B = 1$，因此 $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$。批量中三个晶格并行运行：所选的 $T$、$T_c$ 和 $T = 3.5$。全部从随机自旋（无穷高温）出发并突然冷却。同时更新所有格点是错误的——近邻会基于过时的值翻转——但棋盘格中同一颜色的格点只与另一颜色相邻，因此每一半可以并行更新。淬火到低 $T$ 时可能长时间卡在两个条形畴中，这是周期性晶格上动力学的真实特征。在有限晶格上，$T_c$ 以上 $\lvert m\rvert$ 并不严格为零，在 $T_c$ 附近涨落很大（临界慢化）。$E/N$ 从 $-2$（完全有序）到 0。
meanings:
- 第 $i$ 行第 $j$ 列的自旋 $\pm 1$——对 $B$ 个温度批量计算（1 是 conv2d 的通道）
- 选出四个最近邻的卷积核
- 重复的 $k, l$ ⇒ 求和：近邻和，周期边界
- 单独翻转每个自旋的能量代价
- 重复的 $i, j$ ⇒ 求和：键能的两倍（每个键从两端各计一次）
- 每个晶格一个温度，对格点广播
labels:
  T: 温度 $T$
  L: 晶格尺寸 $L$
  n_sweeps: 蒙特卡罗扫描次数
