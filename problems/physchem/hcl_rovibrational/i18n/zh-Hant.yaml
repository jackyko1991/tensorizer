source_hash: dda111a1c11f
title: HCl 振轉光譜
summary: HCl 的紅外吸收帶是一排梳狀譜線：分子會振動（非諧振子）與轉動（旋轉時會伸長的轉子），每條譜線都是 $\Delta J = \pm 1$ 的 $v = 0 \to 1$ 躍遷。兩種氯同位素的 P 支與 R 支以一個批次 $(I, J)$ 網格得出，並以 Boltzmann 強度呈現升溫過程；接著以組合差的最小平方擬合從譜線還原 $B_e$、$\alpha_e$ 與 $\nu_0$。
notes: '常數是 H³⁵Cl 的近似文獻值：$\omega_e \approx 2991$、$\omega_ex_e \approx 52.8$、$B_e \approx 10.59$、$\alpha_e \approx 0.31$ 與 $D_e \approx 5\times10^{-4}$ cm⁻¹。帶原點 $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹ 處沒有譜線，因為像 HCl 這樣的 $\Sigma$ 態沒有 $\Delta J = 0$（Q）支：R(0) 與 P(1) 之間的間隙約為 $4B$。由於 $B_1 < B_0$（振動中的鍵平均較長），R 支譜線向高 $J$ 處擠在一起，而 P 支譜線則散開。每條譜線都是雙線，H³⁷Cl 位於低約 2 cm⁻¹ 處，強度為三分之一（天然豐度 76 : 24）；位移隨 $|\nu - \nu_0|$ 增大，因為每個常數都隨約化質量的某個冪次縮放。氣體升溫時，Boltzmann 因子 $(2J+1)e^{-hcF(J)/kT}$ 的極大值移向更高的 $J$，兩支譜線散開（每一幀都以其最強譜線歸一化）。組合差是光譜學家分離兩個狀態的技巧：R(J−1) 與 P(J+1) 終止於同一個上能階，因此其差只取決於 $v = 0$；R(J) 與 P(J) 始於同一個下能階，因此其差只取決於 $v = 1$。以 $\Delta_2F/(4J+2)$ 對 $J^2 + J + 1$ 做直線擬合，得到 $B_v$（截距）與 $D$（斜率），再得 $\alpha_e = B_0 - B_1$ 與 $B_e = B_0 + \alpha_e/2$。加入量測雜訊，看這些常數保留得多好。等效的 Morse 位阱深度為 $\omega_e^2/4\omega_ex_e$。簡化：沒有 Herman–Wallis 強度修正、所有譜線使用同一個 Lorentz 寬度，且吸收不以 $\tilde\nu$ 加權。'
meanings:
- H³⁵Cl 的近似常數，以 $\rho = \sqrt{\mu_{35}/\mu_{37}}$ 縮放至 H³⁷Cl
- 能階 $v$ 的轉動項；不對任何指標求和，皆為外積
- 兩種同位素分子的所有譜線在同一網格中；$J$ 為下能階
- 升溫過程中各溫度下能階 $J$ 的 Boltzmann 布居
- 豐度 × 布居 × Hönl–London 因子；P(0) 恰好為零
- 重複的 $\ell$ ⇒ 對所有譜線求和：加寬後的光譜
- 下能態（$s=0$）與上能態（$s=1$）的 $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$
- 重複的 $n$ ⇒ 求和：每種同位素分子與每個狀態的最小平方 $B_v$ 與 $D$
labels:
  T: 最終溫度 $T$
  J_max: 最高下能階 $J_{max}$
  fwhm: 譜線寬度（FWHM）
  noise: 量測譜線的雜訊
