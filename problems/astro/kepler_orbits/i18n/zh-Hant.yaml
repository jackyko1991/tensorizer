source_hash: b1957b563a0a
title: 克卜勒行星運動定律
summary: 軌道大小與離心率各不相同的行星，在牛頓平方反比重力下繞恆星運行。一次批次 RK4 積分就展示了克卜勒三大定律：恆星位於焦點的橢圓、相等時間掃過相等面積，以及 $T^2 \propto a^3$。
notes: 單位為 AU、年與太陽質量，因此 $GM_\odot = 4\pi^2$，克卜勒第三定律簡化為 $T^2 = a^3$。每顆行星都從近日點以活力公式速率 $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$ 出發。離心率最大的軌道上，每塊陰影扇形都花相同時間 $T/12$：靠近恆星時短而寬，遠離時長而窄，但面積始終相同，因為 $dA/dt = L/2$ 而 $L$ 守恆。週期由模擬量得，即掃過 $2\pi$ 所需的時間。恆星視為固定（其質量遠大於行星），行星之間也不互相吸引。
meanings:
- 行星 $b$ 相對恆星的位置，$i \in \{x, y\}$
- 行星 $b$ 的速度
- 重複的 $j$ ⇒ 求和：距離平方 $r_b^2$
- 指向恆星的平方反比引力
- 二維 Levi-Civita 符號，$\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- 單位質量角動量；$dA/dt = L_b/2$ 為常數
- $\tfrac12 v^2 - GM/r$；由此得 $a = -GM/2E$
labels:
  n_planets: 行星數
  e_max: 最大離心率 $e$
  t_max: 模擬時間
  dt: 時間步長
