source_hash: 0b86e0abca1f
title: 卢瑟福散射
summary: 一束 α 粒子射向金原子核。所有 α 粒子作为一个批量张量用 RK4 在库仑斥力场中积分，散射角的直方图重现了卢瑟福的 $1/\sin^4(\theta/2)$ 规律——这正是原子正电荷集中在微小原子核中的证据。
notes: 单位：fm、MeV，时间以 fm/$c$ 计。沿每条路径能量和角动量守恒，所以仅由 $E$ 和瞄准距离 $b$ 就确定偏转角 $\theta = 2\arctan(k/2Eb)$；正碰的 α 粒子在 $d = k/E$ 处折返（5 MeV 打金约为 45 fm，仍远在 7 fm 的核之外，因此纯库仑定律成立）。粒子束均匀分布在半径为 $b_{\max}$ 的圆盘上（随机但种子固定），因此散射进某立体角的数目为（单位面积 α 粒子数）× $d\sigma/d\Omega$。只有几百分之一的 α 粒子反弹超过 90°——这是 1909 年盖革和马斯登的意外发现。简化：原子核是固定的点电荷（无反冲，无核力），运动是非相对论性的（$v \approx 0.05c$）。每个 α 粒子从 30 $d$ 远处出发，能量和角动量与从无穷远来的完全相同；力的剩余 $1/r^2$ 尾部使角度偏移远小于 1°。
meanings:
- $Z_\alpha Z e^2/4\pi\varepsilon_0 = 2Z \cdot 1.44$ MeV fm
- α 粒子 $b$ 的位置（fm）和速度（以 $c$ 为单位）
- 重复的 $j$ ⇒ 求和：距离平方 $r_b^2$
- 对整个粒子束一次计算库仑斥力
- 二维叉积：单位质量角动量
- 出射速度与束流轴的夹角
- 卢瑟福预言，与直方图比较
labels:
  energy: α 粒子能量 $E$
  z_target: 靶核电荷数 $Z$
  b_max: 束流半径 $b_{\max}$
  n_beam: 束中 α 粒子数
  n_steps: RK4 步数
