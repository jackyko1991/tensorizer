source_hash: 936404bf1075
title: Измерьте roofline своего чипа
summary: Насколько быстра машина, на которой это работает? Засеките время одного большого копирования памяти, чтобы получить пропускную способность $\beta$, и произведения матриц $n\times n$ $C_{ij} = A_{ik}B_{kj}$ в FP64, FP32, TF32, BF16 и FP16, чтобы получить скорость $\pi$ для каждой точности; модель roofline $P(I) = \min(\pi, \beta I)$ затем показывает, какие ядра ваш чип выполняет на полной скорости, а какие ждут память. Навыки программирования ▸ Чипсеты-ускорители помещает ваш результат рядом с характеристиками других чипов.
notes: 'В характеристиках указаны пиковые значения; измерение показывает, что PyTorch на самом деле получает на вашей машине, обычно 50–90% от пика для большого произведения матриц. Работа GPU асинхронна, поэтому каждое измерение времени ждёт, пока устройство закончит (synchronize), и берёт медиану нескольких запусков после прогрева. На GPU NVIDIA произведение в FP32 измеряется дважды: один раз в настоящем FP32 и один раз с тензорными ядрами TF32 (torch.set_float32_matmul_precision("high")), то есть с настройкой, которая незаметно меняет биты мантиссы на скорость. У GPU-бэкенда Apple (MPS) нет float64, поэтому там FP64 пропускается; потребительские GPU считают в FP64 лишь с малой долей своей скорости FP32, что важно для физики. Попробуйте матрицу побольше: скорость растёт, пока произведение не упрётся в вычисления, а копирование памяти остаётся на уровне пропускной способности.'
meanings:
- пропускная способность памяти по большому копированию (чтение + запись), GB/s
- достигнутая скорость произведения матриц в точности $p$, TFLOP/s
- 'повторяющийся $k$ ⇒ суммирование: $n^3$ умножений со сложением'
- 'FLOP на перемещённый байт: $2n/(3b)$ для элементов по $b$ байт'
- максимум, которого может достичь ядро с интенсивностью $I$
labels:
  matrix_size: Размер матрицы $n$
  copy_mb: Объём копирования
  repeats: Повторы для замера
