source_hash: 0b5328cbe1c8
title: 물결 통 간섭
summary: 두 개의 진동자가 수면에서 보조를 맞춰 위아래로 움직이며 원형 물결을 보냅니다. 2차원 파동 방정식은 라플라시안을 $3\times3$ 합성곱 커널(conv2d)로 써서 전진시키고, 감쇠 경계가 나가는 파동을 흡수하며, 간섭무늬는 경로차가 반파장의 홀수배인 곳에서 정지한 마디선으로 자리 잡습니다.
notes: '단위: 셀 크기 $h = 1$, 파동 속력 $c = 1$. 시간에 대해 립프로그를 쓰고 감쇠 항을 중심에 맞추므로 단계는 양해법입니다. 마디선을 따라서는 한 파원에서 온 물결이 언제나 다른 파원의 물결보다 반 주기 늦게 도착하므로 상쇄됩니다. 점선 곡선은 쌍곡선 $|r_1 - r_2| = (m + \tfrac12)\lambda$이며, 파원에서 충분히 먼 곳에서는 오른쪽 패널의 어두운 선과 일치합니다. 파원 간격을 $\lambda$보다 넓히면 마디선이 더 생깁니다. 경계는 엉성한 흡수체(마찰층)이지 완전 정합층이 아니므로 약간의 반사가 남습니다. 오른쪽 패널은 $u^2$의 이동 평균을 보여 줍니다. 처음 몇 주기는 파동이 통을 채우는 과도 상태입니다.'
meanings:
- 격자 칸 $(a, b)$의 수면 높이
- 5점 라플라시안 커널, 오프셋 $\alpha, \beta \in \{-1, 0, 1\}$
- '반복된 $\alpha, \beta$ ⇒ 합: 커널이 격자 위를 미끄러짐'
- 안쪽에서 0, 흡수 경계에서 매끄럽게 증가
- 같은 위상으로 진동하는 두 개의 작은 가우스 파원
- 쿠랑 수가 $1/\sqrt2$보다 크면 거부 (기법이 발산함)
- '약 한 주기 동안의 $u^2$ 이동 평균: 어두운 선이 마디'
labels:
  wavelength: 파장 $\lambda$
  separation: 파원 간격 $d$
  courant: 쿠랑 수 $c\,\Delta t/h$
  t_max: 시뮬레이션 시간
