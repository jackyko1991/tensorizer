source_hash: a794040c9063
title: 鼓膜振動模態
summary: 方形或圓形鼓膜的簡正模態。網格上的二維拉普拉斯由一維拉普拉斯經克羅內克積構成，$\Delta = D\otimes I + I\otimes D$，一次對稱特徵值求解（eigh）便給出所有模態形狀與頻率。
notes: 每個面板顯示一個模態 $\phi_m(x, y)\cos(\omega_m t)$；內部的白線是永不移動的節線。對邊長 $L$ 的正方形，精確頻率為 $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$，因此與基頻之比為 $\sqrt{(m^2+n^2)/2}$ = 1、1.58、1.58、2、2.24 …：不是整數，這就是鼓聽起來不像弦的原因。像 $(1,2)$ 與 $(2,1)$ 這樣的配對頻率相同，eigh 會回傳它們的某種混合。對圓形，精確比值來自貝索函數的零點（1、1.59、2.14、2.30 …）；網格的階梯狀邊緣使其偏移幾個百分點。單位：$c = 1$，正方形邊長或圓直徑 $L = 1$；時間以基頻週期顯示。
meanings:
- 邊緣固定的一維二階導數（外側 $u = 0$）
- 配對指標 $p = (a, b)$ 為格點編號：二維拉普拉斯
- 只保留鼓內的點（圓形遮罩）；邊緣固定
- 特徵值 $\omega^2/c^2$ 與排在各行的正交歸一模態形狀
- 重複的 $p$ ⇒ 求和：單位矩陣
labels:
  shape: 鼓的形狀
  n_grid: 每邊格點數
  periods: 顯示的基頻週期數
