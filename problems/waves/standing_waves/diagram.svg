<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="String of length L fixed at both ends vibrating in its second harmonic, with a node in the middle">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- fixed supports -->
    <line x1="34" y1="44" x2="34" y2="112" stroke="#374151" stroke-width="2"/>
    <line x1="206" y1="44" x2="206" y2="112" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="34" y1="52" x2="26" y2="60"/><line x1="34" y1="66" x2="26" y2="74"/><line x1="34" y1="80" x2="26" y2="88"/><line x1="34" y1="94" x2="26" y2="102"/>
      <line x1="206" y1="52" x2="214" y2="60"/><line x1="206" y1="66" x2="214" y2="74"/><line x1="206" y1="80" x2="214" y2="88"/><line x1="206" y1="94" x2="214" y2="102"/>
    </g>
    <!-- rest position and the opposite extreme of the swing -->
    <line x1="34" y1="78" x2="206" y2="78" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M34,78 Q77,130 120,78 T206,78" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- the string -->
    <path d="M34,78 Q77,26 120,78 T206,78" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="34" cy="78" r="3.5" fill="#374151"/>
    <circle cx="206" cy="78" r="3.5" fill="#374151"/>
    <circle cx="120" cy="78" r="4" fill="#f59e0b"/>
    <text x="126" y="72" font-size="13" fill="#b45309">node</text>
    <text x="64" y="44" font-style="italic">u(x, t)</text>
    <!-- length -->
    <line x1="36" y1="132" x2="204" y2="132" stroke="#6b7280" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="115" y="150" font-style="italic">L</text>
  </g>
</svg>
