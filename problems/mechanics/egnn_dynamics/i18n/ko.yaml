source_hash: 95b6effde453
title: 입자 동역학을 위한 E(n)-등변 그래프 신경망
summary: 작은 E(n)-등변 그래프 신경망(EGNN)이 하전 입자로 이루어진 3D 계를 시간에 따라 한 단계씩 진행시키는 법을 학습한다. 메시지는 거리 $|\mathbf x_i - \mathbf x_j|^2$에만 의존하고 좌표 갱신은 $\mathbf x_i - \mathbf x_j$ 방향을 향하므로, 입력을 회전하면 예측도 정확히 회전한다. 같은 데이터를 쓰는 평범한 MLP는 이를 학습해야 하며, 학습하지 못한다.
notes: '참 계: 전하 $c_i = \pm 1$인 단위 질량 입자 $N$개가 완화된 쿨롱 힘과 모든 쌍 사이의 약한 용수철 $k_s$(구름이 흩어지지 않도록)로 상호작용하며, 간격 $\Delta t / 10$의 RK4로 적분한다. 두 신경망 모두 몇 개의 무작위 계에서 얻은 같은 쌍(시각 $t$의 상태, 시각 $t + \Delta t$의 상태)을 보고, 평균 제곱 오차에 대해 Adam으로 학습한다. 따로 떼어 둔 계로 테스트 오차를 구한다. EGNN(Satorras, Hoogeboom & Welling, "E(n) Equivariant Graph Neural Networks", ICML 2021)은 불변 입력(노드 특징, $d_{ij} = |\mathbf x_i - \mathbf x_j|^2$, 전하 곱)만으로 모든 쌍에 대한 메시지 $m_{ij}$를 만들고, 학습된 스칼라 가중치로 각 입자를 방향 $\mathbf x_i - \mathbf x_j$를 따라 움직인다. 이것이 참 힘 법칙 $\ddot{\mathbf x}_i = \sum_j w_{ij}(\mathbf x_i - \mathbf x_j)$와 정확히 같은 형태임에 주목하자. 대칭성이 데이터에서 학습되는 대신 구조에 내장되어 있다. 검사는 테스트 입력을 무작위 $R$과 $\mathbf s$로 회전·이동한다. EGNN에서는 $f(R\mathbf x + \mathbf s) = Rf(\mathbf x) + \mathbf s$가 float32 반올림 오차(약 $10^{-6}$) 수준으로 성립하지만, 평탄화한 좌표를 보는 MLP에서는 불일치가 예측 자체와 같은 크기다. 학습 계가 적을 때 EGNN은 훨씬 적은 가중치로 더 낮은 테스트 오차에 도달한다. 롤아웃에서는 각 모형에 자신의 예측을 입력한다. 하전 계는 혼돈적이므로 두 모형 모두에서 오차가 누적되지만, EGNN이 더 오래 가깝게 유지된다. 단순화: 너비 32인 층 3개, $\tau = \Delta t / L$인 EGNN의 속도 변형(우리의 선택), 전체 배치
  학습, 고정된 시드. 같은 등변 메시지 전달 아이디어가 NequIP(Batzner et al., Nature Communications 2022) 같은 기계 학습 원자간 퍼텐셜과 3D 분자를 생성하는 등변 확산 모형(Hoogeboom et al., ICML 2022)의 바탕에 있다. 학습 계를 줄여 보자. 두 신경망 사이의 격차가 벌어진다.'
meanings:
- 계 $b$에서 입자 $i$의 위치와 속도, 데카르트 성분 $a$
- 브로드캐스팅으로 구한 모든 쌍 간 변위
- '반복된 $a$ ⇒ 합: 거리 제곱, MLP의 유일한 기하 입력(회전 불변)'
- '참 힘: 반복된 $j$ ⇒ 상대 입자에 대해 합(쿨롱 힘과 용수철)'
- 모든 쌍 위의 메시지, 특징 $H = 32$개
- '좌표 갱신: 반복된 $j$ ⇒ 합. $\mathbf x_i - \mathbf x_j$로만 만든 벡터이므로 입력과 함께 회전한다'
- '불변 스칼라 곱하기 벡터: 여전히 등변'
- 등변성 검사에 쓰는 무작위 회전
labels:
  n_particles: 입자 수 $N$
  n_train: 학습 계 수
  dt: 모형 시간 간격 $\Delta t$
  n_iter: 학습 반복 횟수
  lr: Adam 학습률
  rollout_steps: 롤아웃 단계 수
