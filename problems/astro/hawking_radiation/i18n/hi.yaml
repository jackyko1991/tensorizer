title: हॉकिंग विकिरण और ब्लैक होल का वाष्पन
summary: 'ब्लैक होल हॉकिंग ताप $T_H = \hbar c^3/(8\pi G M k_B)$ पर कृष्णिका (black body) की तरह चमकता है। एक ब्रॉडकास्ट अनेक द्रव्यमानों और तरंगदैर्ध्यों के लिए प्लांक नियम एक साथ मूल्यांकित करता है, और RK4 द्रव्यमान ह्रास $dM/dt = -\alpha/M^2$ को समाकलित करता है: होल सिकुड़ता है, गर्म होता है और $t \propto M^3$ के बाद एक विस्फोट में समाप्त होता है।'
notes: 'पूरे में SI मात्रक। एक सौर-द्रव्यमान ब्लैक होल $6\times10^{-8}$ K पर है, जो 2.7 K सूक्ष्मतरंग पृष्ठभूमि से बहुत ठंडा है, इसलिए वास्तविक खगोलीय ब्लैक होल उत्सर्जन से अधिक अवशोषण करते हैं। केवल बहुत छोटे (आदिकालीन, primordial) होल वाष्पित होते हैं: बिग बैंग में बना लगभग $2\times10^{11}$ kg का होल अभी समाप्त हो रहा होगा। मॉडल केवल फ़ोटॉनों को गिनता है और क्षितिज को $4\pi r_s^2$ क्षेत्रफल की आदर्श कृष्णिका मानता है; वास्तविक होल न्यूट्रिनो, ग्रैविटॉन और पर्याप्त गर्म होने पर भारी कण भी उत्सर्जित करते हैं, जिससे जीवनकाल घटता है, और ग्रेबॉडी गुणक (greybody factors) स्पेक्ट्रम का आकार बदलते हैं। समय चरण ऐसे चुना जाता है कि हर RK4 चरण शेष द्रव्यमान का एक निश्चित अंश जलाए; एनिमेशन $\log M$ के समान चरणों में आगे बढ़ता है, इसलिए अंतिम फ़्रेम बहुत छोटा समय अंतराल दिखाते हैं। क्षितिज त्रिज्या $M^{0.35}$ के रूप में खींची गई है ताकि वह दिखती रहे।'
meanings:
- 'ब्लैक होल द्रव्यमानों (kg) का बैच: सूर्य, पृथ्वी, …, एनिमेटेड होल'
- हॉकिंग ताप, अवयववार
- लघुगणकीय अंतराल वाला तरंगदैर्ध्य ग्रिड
- T[:, None] को lam[None, :] के विरुद्ध ब्रॉडकास्ट करके प्लांक स्पेक्ट्रम
- वीन का नियम $b/T_H$
- क्षितिज की स्टीफ़न–बोल्ट्ज़मान शक्ति
- $-P/c^2$, RK4 से समाकलित
- विश्लेषणात्मक जीवनकाल, समाकलन से तुलना
