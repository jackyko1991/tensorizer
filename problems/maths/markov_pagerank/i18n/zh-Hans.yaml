title: 马尔可夫链与 PageRank
summary: 一个随机冲浪者在一个小型合成网络上点击链接，并不时跳转到随机页面。处于每个页面的概率每次点击按一次矩阵–向量乘法演化，其平稳分布就是 PageRank，这里分别用幂迭代、本征分解以及同时模拟的数千个冲浪者求得。
notes: $S$ 是列随机矩阵，因此它把概率向量映射为概率向量，但网页图中有没有出链的页面，也有会困住冲浪者的页面群。悬挂页面被赋予均匀的一列（冲浪者随手输入一个地址），传送项则使 $G$ 的每个元素都为正。由 Perron–Frobenius 定理，平稳分布于是唯一、为正，且从任何起点都能到达。$G$ 的其他每个本征值都是 $S$ 的某个本征值的 $d$ 倍，所以 $|\lambda_2| \le d$，幂迭代至少以 $d^k$ 的速度收敛。右侧面板显示一起求解的一批阻尼因子。取 $d = 0.85$（Brin 和 Page 在 1998 年建议的值）时，无论网络多大，50 步都能把误差至少缩小到 $0.85^{50} \approx 3\times10^{-4}$。冲浪者是对同一条链的蒙特卡罗估计：它们的比例在 $1/\sqrt W$ 量级的噪声内跟随 $\mathbf x_k$，对时间取平均得到的排名与幂迭代一致。去掉悬挂页面的修正会让概率流失，终端中可以看到这一点。试试 $d \to 1$，看收敛如何变慢、排名如何堆积在封闭的页面群中。
meanings:
- 若页面 $j$ 链接到页面 $i$ 则为 1：各列是冲浪者离开的页面
- 对 $i$ 求和：页面 $j$ 的出链数
- 点击一个随机链接；悬挂页面（$d_j = 0$）获得均匀列 $1/N$
- 一批阻尼因子 $d_b$ 的 Google 矩阵；$1 - d$ 是传送概率
- 重复的 $j$ ⇒ 求和：对每个 $d_b$ 同时执行一步幂迭代
- 本征值 1 的本征向量，归一化使其和为 1；$G$ 不对称，所以用 eig 而非 eigh
- 第二大本征值的模：误差每步按此因子缩小，且 $|\lambda_2| \le d$
- $W$ 个冲浪者各自所在的页面：以概率 $d$ 跟随链接，否则传送
labels:
  damping: 阻尼因子 $d$
  pages: 页面数 $N$
  dangling: 悬挂页面
  walkers: 随机冲浪者 $W$
  iterations: 步数
  seed: 图的随机种子
