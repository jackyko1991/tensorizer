source_hash: 72ebeb1bb100
title: DNA 距離からの系統樹
summary: DNA 配列は隠れたランダムな樹に沿って進化し、各枝は Jukes–Cantor 遷移行列との一つの行列積である。葉だけから、one-hot の文字に対する一つの einsum で差異を数え、隠れた多重置換を補正し、UPGMA と近隣結合法で樹を再構築する。使うサイトを増やしながら両方の樹を観察し、Robinson–Foulds 距離で真の樹と比べて評価する。
notes: 真の樹はランダムな合祖樹である。緩和時計ではさらに各枝が固有の速度をもつので、葉は根から異なる距離に位置する。異なるサイトの生の割合 $p$ は $3/4$ で飽和し、長い経路を過小評価する（対角線より下の灰色の点）。Jukes–Cantor の $d$ は不偏（対角線上の青い点）だがノイズが大きく、そのノイズは $1/\sqrt L$ で縮む。UPGMA はすべての葉が根から等距離にあると仮定するので、緩和時計の下では、どれほど多くのサイトを見ても、隣接していない二つの短い枝を結合してしまうことがある（赤い枝）。近隣結合法は距離が樹に沿って加法的であることだけを必要とし、真の無根の形に収束する。距離だけでは根の位置を決められないので、最長経路の中点を根として描く。厳密な時計に切り替えると UPGMA も一致推定になる。
meanings:
- 長さ $t$（サイトあたりの期待置換数）の枝の後に文字 $\alpha$ が $\beta$ になっている確率
- $\alpha$ の繰り返し ⇒ 和：各サイトにおける子の文字確率。逆 CDF でサンプリング
- 観測された葉の配列。A、C、G、T についての one-hot
- $l, \alpha$ の繰り返し ⇒ 和：$i$ と $j$ が異なるサイトの割合
- 補正距離 $-\tfrac34\ln(1 - \tfrac43 p)$：一つのサイトでの重複ヒットに隠れた置換を数える
- 近隣結合法は $d$ ではなく $Q$ が最小の組を併合する。$r_i = d_{ik}\mathbf 1_k$
- 真の経路長。枝 $v$ が葉 $i$ と根の間にあるとき $M_{iv} = 1$、$b_v$ はその長さ
- 二つの樹の一方にしか存在しない葉の二分割（内部枝ごとに一つ）の数
labels:
  n_taxa: 分類群数 $n$
  n_sites: サイト数 $L$
  tree_depth: 根から葉までの深さ（サイトあたりの置換数）
  clock: 分子時計
