source_hash: f93e7ab544e0
title: '단일 세포 RNA-seq: PCA와 k-평균 군집화'
summary: '합성 단일 세포 실험: 몇 가지 유형의 세포가 각자 고유한 마커 유전자를 켜고, 계수는 음이항 분포를 따르며, 세포마다 시퀀싱 깊이가 다르다. 표준 파이프라인을 텐서 연산으로 실행한다. $\log(1 + 10^4 K_{cg}/n_c)$로 정규화하고, 변동성이 큰 유전자를 남기고, SVD로 PCA를 한 뒤, 여러 재시작을 병렬로 돌리는 k-평균을 수행하고, 조정 랜드 지수로 군집을 참 유형과 비교해 점수화한다.'
notes: 각 세포는 수천 개 유전자에 흩어진 수천 개의 mRNA 계수를 주므로 대부분의 항목은 0이고, 원시 계수는 주로 세포가 얼마나 깊이 시퀀싱되었는지를 반영한다. 라이브러리 크기 $n_c$로 나누면 깊이가 제거되고, 로그는 발현 수준의 거대한 범위를 길들인다. 대부분의 유전자는 잡음만 담고 있으므로, 평균이 비슷한 유전자들이 보이는 것보다 분산이 큰 유전자, 즉 변동성이 큰 유전자를 남긴다. 이들에는 심은 마커가 풍부하다. 그다음 PCA가 이들을 압축한다. 유형이 $K$개이면 신호는 약 $K-1$개 방향에 있으며, 스크리 도표에서 처음 $K-1$개 막대가 평평한 잡음 바닥 위로 솟은 것으로 보인다. k-평균은 두 단계, 즉 각 세포를 가장 가까운 중심에 할당하고 각 중심을 그 세포들의 평균으로 옮기는 단계를 번갈아 수행한다. 어느 단계도 관성 $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$를 증가시킬 수 없으므로 수렴하지만, 국소 최솟값으로만 수렴한다. 그래서 여러 무작위 시작을 나란히 실행하고(회색 곡선) 가장 좋은 것을 남긴다. 참 유형을 알기 때문에 조정 랜드 지수는 결과를 정직하게 점수화한다. 선택 사항인 t-SNE 지도는 autograd로 학습하는 작은 힘 기반 배치(스튜던트 t 유사도, 초기 과장)다. 이런 지도에서 군집 사이의 거리는 큰 의미가 없다. 실제 파이프라인(Scanpy, Seurat)은 품질 관리, 배치 보정, 최근접 이웃 그래프 위의 그래프 기반 군집화(Leiden)를 추가하며, 실제 세포 유형은 이렇게 깔끔한 경우가 드물다. 더 작은 배수 변화, 더 적은 마커, 또는 잘못된 $k$를 시도해 보자.
meanings:
- '유형 $k$에서 유전자 $g$의 평균 발현: 로그 정규 기준값에, $k$의 마커 유전자 $M$개에 대해서는 배수 변화를 곱한 값'
- 음이항 계수(분산 $m + \varphi m^2$). $s_c$는 로그 정규 시퀀싱 깊이
- '라이브러리 크기: 세포 $c$의 총 계수, $g$에 대해 합'
- 깊이 정규화(CPM처럼 $10^4$당 계수) 후 로그 변환
- 분산 지수 $\mathrm{Var}/\mathrm{Mean}$, 평균이 비슷한 구간 안에서 표준화(구간 합은 원-핫 einsum으로)
- 변동성이 큰 유전자 $H$개에 대한 중심화된 행렬의 PCA. torch.pca_lowrank도 같은 상위 성분을 준다
- PC 점수, $g$에 대해 합. $\Sigma_p^2/\sum_q\Sigma_q^2$는 설명된 분산 비율
- 재시작 $r$의 중심 $k$까지 세포 $c$의 거리 제곱. $p$에 대해 합, $R$개 재시작을 한꺼번에
- '할당 단계: 각 세포가 가장 가까운 중심에 합류한다'
- '갱신 단계: 각 중심이 그 세포들의 평균으로 이동, $c$에 대해 합'
- 분할표 $n_{ij}$(원-핫 einsum)로 쌍을 세는 일치도. 1 = 완벽, 약 0 = 무작위
labels:
  n_cells: 세포 수 $C$
  n_genes: 유전자 수 $G$
  n_types: 참 세포 유형 수 $K$
  n_markers: 유형당 마커 유전자 수
  fold_change: 마커 배수 변화
  dispersion: 음이항 분산 매개변수 $\varphi$
  depth_spread: 라이브러리 크기 퍼짐(로그 정규 $\sigma$)
  n_hvg: 남길 변동성이 큰 유전자 수
  n_pcs: 군집화에 쓸 주성분 수
  k: 군집 수 $k$
  kmeans_iters: k-평균 반복 횟수
  embedding: '2D 보기: PC1–PC2 또는 t-SNE'
