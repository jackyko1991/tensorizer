source_hash: f0ace6f81d9f
title: '미니 AlphaGo: $5\times5$ 바둑판 위의 트리 탐색'
summary: '작은 바둑판에서 자기 대국을 한 판 두며, 각 수를 AlphaGo가 사용한 것과 같은 탐색으로 고릅니다: PUCT 규칙을 쓰는 몬테카를로 트리 탐색입니다. 바둑 규칙 자체가 텐서 연산입니다: 따냄과 계가(집과 돌을 함께 세는 방식)는 모두 플러드 필이며, 한 단계마다 바둑판의 인접 행렬과 einsum을 한 번 수행합니다. 새 국면마다 동시에 진행되는 무작위 대국 한 묶음으로 평가합니다. 탐색이 믿는 수로 방문 횟수가 모이는 모습을 지켜보세요.'
notes: '각 시뮬레이션은 PUCT 최댓값을 고르며 트리를 내려가고, 새 국면을 하나 추가한 뒤, 무작위 플레이아웃 묶음으로 점수를 매기고, 그 결과를 경로 위의 모든 수에 더합니다. 좋은 수가 방문을 모으므로, 탐색은 모든 변화를 살피지 않고도 중요한 곳에 집중합니다. AlphaGo도 같은 루프를 사용했지만, 균등 사전확률 $P_a$를 정책 네트워크로, 무작위 플레이아웃을 가치 네트워크로 바꾸었고 둘 다 기보로 학습했습니다. AlphaGo Zero는 둘 다 오직 자기 대국만으로 학습했습니다. $5\times5$에서는 천원 첫수가 흑에게 강하며, 시뮬레이션이 적으면 탐색이 눈에 띄는 실수를 합니다. 시뮬레이션을 늘리면 대국이 더 정확해지지만 느려집니다. 규칙: Tromp–Taylor(자충수는 자신의 돌 무리를 들어냄, 면적 계가)와 간단한 패 검사.'
meanings:
- '바둑판의 점 $p$: $+1$ 흑, $-1$ 백, 0 빈 점'
- '그래프로서의 바둑판: $p$와 $q$가 가로나 세로로 이웃하면 1'
- '플러드 필: 빈 점에서 한 색을 따라 퍼져 나가 활로가 있는 돌 무리를 찾고, 나머지는 따냄'
- '면적 계가: 돌과 그 색만 닿을 수 있는 빈 점의 수, 흑 빼기 백 빼기 덤 $k$'
- $R$판의 무작위 대국을 하나의 $(R, n^2)$ 텐서로 진행; 흑의 평균 결과; 자기 눈은 절대 메우지 않음
- 'PUCT: 가치 $Q_a$에 수 $a$가 방문될수록 줄어드는 탐색 보너스를 더함; 균등 사전확률 $P_a$'
- '모든 시뮬레이션 후의 방문 횟수(마지막 항목: 패스); 가장 많이 방문된 수를 둠'
labels:
  board_size: 바둑판 크기 $n$
  simulations: 수당 시뮬레이션 수
  rollouts: 잎당 무작위 플레이아웃 수 $R$
  c_puct: 탐색 계수 $c$
  komi: 덤 $k$
