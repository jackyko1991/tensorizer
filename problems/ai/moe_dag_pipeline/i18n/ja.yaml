title: ワークフロー DAG はルーターが固定された混合エキスパートである
summary: MNIST の数字 $d$ と "now plus three" のような 3 語のテキストから答え $y = (d \circ k) \bmod 10$ が決まります。どちらのモダリティも単独では足りません。このパイプラインを Snakemake 風のワークフロー（encode_image、encode_text、入力関数で選ばれる演算ごとの fuse ルール、classify）として書き、Willis 動脈輪の問題のテンソル DAG エンジンで実行すると、ルーター行列 $G$ をルールの選択に固定した top-1 混合エキスパート（mixture-of-experts）層とまったく同じものを計算します。続いて、ひとつのテンソルプログラムだからこそ可能な 4 つの段階を示します：学習されたルーター、別々に学習して連結したエキスパート、DAG 全体を通す 1 回の逆伝播、そして int8 で保存する小さな密ネットワークへの蒸留です。既知の結果をつなぐ枠組みであり、新しい定理ではありません。
notes: 着想。この枠組みは Jacky Ka Long Ko によるものです。Willis 動脈輪のワークフロー（medical/cow_workflow_dag）を作る中で、Snakemake の DAG がひとつのテンソルプログラムになりうること、そしてそのようなプログラムがマルチモーダルな混合エキスパートに見えることが分かりました。正確に言えば、ワークフロー DAG はルーターが固定された MoE であり、MoE は入力ごとに辺が選ばれる DAG です。これは既知の結果をつなぐ枠組みであって新しい定理ではなく、この問題ではその小さな一例を構成します。等価性。data/Snakefile にはルール encode_image、encode_text、fuse（サンプルごと・演算ごとに 1 ジョブ、ワイルドカードは $op$）、classify、collect があります。classify は入力関数 `routed` を通して入力を読み、この関数がサンプルのテキストにある演算の fuse 出力を指定します。エンジンは cow_workflow_dag のパーサーでこのファイルを解析し、その Kronecker ブロックからジョブの隣接行列を組み立てます。条件付き辺のブロックは $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$ なので、ルーター行列 $G$ は隣接行列の中にあり、$N E$ 個の fuse ジョブのうち必要なのは選ばれた $N$ 個だけです（Snakemake がジョブを刈り込むのと同じく、ブール値の逆向きパス）。レベルごとに、ルールごとに 1 回のバッチ呼び出しで実行すると、$G$ をルールの選択に固定しゲート値を 1 とした Switch 型の層（累積順位によるディスパッチテンソル $D$、すべてのエキスパートを 1 回のバッチ einsum で計算、結合）と同じ logits が得られます：1000 個のテストサンプル × 2 シードのすべてで、float32 ではビット単位で一致し、float64 では $4 \times 10^{-15}$ 以内（積み重ねた積とグループごとの積とで和の順序が異なるため）、予測はどこでも同じです。これはひとつの計算の
  2 通りの書き方の間の恒等式であり、実験的な発見ではありません。学習されたルーター。テキスト特徴に対する softmax ゲート、top-1 ルーティング、Switch の負荷分散損失（$\alpha = 0.01$）を用い、エンコーダーは凍結し、2 つの変種を並べて比較します。ワークフロー自身の fuse エキスパートの前に置くと、ゲートだけでルールを再発見します：既定の 800 ステップ後、テストサンプルの 0.85 ± 0.03 で演算 $e$ がエキスパート $e$ に送られ（精度 0.82、固定ルーターでは 0.92）、まだ上昇中です（試行では 1500 ステップ後に 0.95 と 0.90）。新しいエキスパートと一緒に学習すると、そうはなりません：ルーティングと演算の対応は偶然と変わらず（最良のエキスパート置換で 0.35、1/3 は無関係を意味する）、エキスパートは混ざったまま、精度は 0.40 にとどまります。fuse エキスパートはテキストを見ないので、演算を無視するルーティングでは各エキスパートに不可能な課題が残ります。しかし最初はどのエキスパートもどの演算に対しても優れていないため、top-1 ゲートは対称性を破る信号を得られません。ゲートノイズ、100× 大きいゲート初期化、500 ステップの密（soft）なウォームアップ、$\alpha = 0.1$ のいずれも、試行ではこれを変えませんでした（既定の実行には含まれません）。より大きな MoE はルーターをゼロから問題なく学習します。このトイ例が言えるのは、ここでは固定されたルールをただで再発見できるわけではない、ということだけです。段階。(2) 分割学習：各エキスパートを自分の部分課題で学習します。画像エキスパート（MLP）は数字ラベル（テスト精度 0.916）、テキストエキスパート（einsum 注意層 1 層）は数の単語（1.000）、fuse エキスパートは one-hot 入力から 300 項目の表（1.000）です。共同学習なしに DAG で連結すると、パイプラインはテストペアの 0.924 に正答します（数字の精度より高いのは、0 倍や 5 倍では誤った数字の一部が許されるため）。(3) エンドツーエンドの微調整、全段階を通す 1 回の逆伝播：0.924 で改善なし。ボトルネックは画像エキスパートで、共同損失は数字について新しい情報をもたらしません（同じ
  3000 枚の画像）。(4) 密な生徒ネットワーク（784 + 45 → 64 → 64 → 10、重み 57 930 個、パイプラインの 108 766 個の 0.53）を $T = 4$ で蒸留（損失 $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 交差エントロピー）：0.85–0.86、サンプルの 0.85–0.87 で教師と一致し、3000 ステップの終わりでもまだ改善中です。チャネルごとの int8：0.85–0.86、232 kB の代わりに 58.9 kB（パイプラインは 435 kB）。CPU 1 スレッドで 1000 テストペアを処理する時間：DAG エンジン 90 ms、同じ DAG をひとつの MoE 層として 19 ms（エンジンはジョブブロックの構築も行う）、生徒 3.4 ms、int8 生徒 3.5 ms（逆量子化した浮動小数点で計算するため、ここでは小さいが実際に速いわけではない）、そしてジョブごとに 1 回の呼び出し（スケジューラーがプロセス起動なしに実行する場合）で 900–1000 ms。言えないこと。ひとつのメモリ空間内のテンソルプログラムである段階だけが、コピーなしに融合し勾配を通せます。ファイルベースのツール（OpenFOAM、VMTK、バイオイメージ解析の大部分）はそうではなく、それらからなる Snakemake DAG はプロセスの DAG のままです。Willis 動脈輪での高速化は主に、ジョブごとのプロセス起動とファイル I/O を避けたことによるもので、バッチ化によるものではありません。またエンドツーエンド学習が役立つのは、分割学習で得られなかった何かをある段階が学べる場合だけです。ここではそうではありませんでした。関連研究。Neural Module Networks（Andreas et al. 2016）はパーサーが選んだモジュールから質問ごとにネットワークを組み立てる、入力ごとに選ばれる DAG です。スパースゲート MoE（Shazeer et al. 2017）と Switch Transformer（Fedus et al. 2021、ここで使う top-1 ルーティングと負荷分散損失）。LIMoE（Mustafa et al. 2022）と Uni-MoE（Li et al.
  2024）のモダリティエキスパート。モデルスティッチング（Lenc & Vedaldi 2015; Bansal et al. 2021）は別々に学習したネットワークを学習されたインターフェースでつなぎ、段階 2 が確率ベクトルを通して行うのと同様です。知識蒸留（Hinton et al. 2015）。DSPy（Khattab et al. 2023）は言語モデル呼び出しのパイプライン全体をエンドツーエンドで最適化します。Google の Pathways（2021 年のブログ記事とビジョン）は、各タスクを必要な部分に通すひとつのモデルを描いています。データ。MNIST（LeCun, Cortes & Burges; LeCun et al. 1998）、ライセンス CC BY-SA 3.0：訓練画像 3000 枚（数字ごとに 300 枚）とテスト画像 1000 枚（数字ごとに 100 枚）、各数字についてファイル順で最初のものを uint8 で同梱（0.7 MB、data/mnist_train.npz, data/mnist_test.npz、同じライセンスで再配布。data/SOURCES.md に出典、チェックサム、処理を記載）。テキストは生成したもので、演算語 1 つ（plus、minus、times）、数の単語 1 つ（zero から nine）、つなぎ語 1 つ（now、then）をランダムな順序で並べます。テスト用テキストは固定シードを使います。デバイスと制限。同梱の数値は CPU での既定の実行によるものです（このプロジェクトの環境にはここでは PyTorch の CUDA ビルドがなく、重みが約 $10^5$ 個では GPU は役に立ちません）：負荷のかかった 6 コアのマシンで、学習と計測に GIF を加えて約 75–150 s。すべてのシードはモデル軸上で一緒に、それぞれ独自のミニバッチで学習し、すべてのシードを描画します。数字 1 つと演算 3 つのトイ例です：構造を示すものであり、大規模なマルチモーダル MoE の振る舞いを示すものではありません。
meanings:
- medical/cow_workflow_dag のパーサーで data/Snakefile から解析したルールグラフと、入力関数 `routed`（条件付き辺 classify ← fuse）
- ジョブ単位のブロック：cow_workflow_dag の Kronecker 積（ワイルドカード軸 sample、op ごとに $I$、$\mathbb 1$、$\mathbb 1^\top$）。条件付き辺ではルーターでマスクされるので、classify のジョブ $n$ が fuse のジョブ $(n, e)$ を読むのは $G_{ne} = 1$ のとき、かつそのときに限る
- ワークフローのルーター：演算語の one-hot。学習ではなくルール（入力関数）で求める
- ターゲットが依存するジョブ、$\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$：$N E$ 個の fuse ジョブのうち $N$ 個だけ
- エンジン：ルールをレベルごとに実行し、それぞれ必要なジョブに対して 1 回のバッチ呼び出し（fuse：$op$ ワイルドカードの値ごとに 1 回）
- サンプル $n$ をエキスパート $e$ のスロット $c$ へ（そこへルーティングされたサンプル内での順位）、GShard/Switch と同様。容量 $C$ = 最大のグループ
- すべてのエキスパートを 1 回のバッチ積で計算。$m$ はモデル（シード）軸で、決して和をとらない
- 結合：$e$ と $c$ について和をとる。各サンプルで非零の項は 1 つなので、$g = G$ のとき DAG の出力に等しい
- 学習されたルーター：テキスト特徴に対する線形ゲートの softmax。top-1 ルーティングで、出力は $p$ 倍される
- Switch の負荷分散：$f_e$ = $e$ にルーティングされた割合、$P_e$ = ゲート確率の平均。均衡かつ一様なら 1、崩壊すると $E$
- 温度 $T$ での Hinton 蒸留。生徒の損失は $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ 交差エントロピー（正解に対して）
- 出力チャネルごとの対称 int8、$s_o = \max_i |W_{io}|/127$。int8 とチャネルごとに 1 つの float32 スケールで保存
labels:
  seeds: シード数（モデル軸上のモデル）
  split_steps: 段階 2 のステップ数（各エキスパートを部分課題で学習）
  router_steps: 段階 1b のステップ数（学習されたルーター）
  global_steps: 段階 3 のステップ数（エンドツーエンド微調整）
  student_steps: 段階 4 のステップ数（蒸留）
  student_hidden: 生徒の幅 $H$
  temperature: 蒸留温度 $T$
  balance_weight: 負荷分散の重み $\alpha$
