source_hash: 66c98bbdd023
title: 뉴턴의 냉각 법칙
summary: 뜨거운 커피 여러 잔이 실온을 향해 식어 갑니다. 잔마다 처음 온도와 냉각 상수가 다르지만 모두 텐서 하나에 들어 있으므로, PyTorch 한 줄로 모든 잔을 한꺼번에 전진시키며 결과는 지수 함수 해와 일치합니다.
notes: 이 법칙에 따르면 냉각 속도는 실온과의 온도 차에 비례합니다. 따라서 온도 차는 같은 시간 동안 같은 비율로 줄어듭니다. 처음 온도와 상관없이 $t_{1/2} = \ln 2/k$마다 절반이 됩니다. 상미분 방정식은 룽게–쿠타(RK4)로 수치적으로 풀며, 점선은 비교를 위한 정확한 지수 함수입니다. 실제 잔은 대류, 복사, 증발로 동시에 식으며, $k$는 이 모두를 숫자 하나로 묶은 것입니다.
meanings:
- 잔 $b$의 온도 (°C)
- '잔 $b$의 냉각 상수 (1/min): 클수록 빨리 식음'
- 실온, 모든 잔에 브로드캐스팅
- '원소별 연산: 합하는 지표 없음, 각 잔이 독립적으로 식음'
- '외적: 정확한 해를 위한 모든 시각과 모든 잔의 조합'
- 온도 차가 절반이 되는 시간
labels:
  n_cups: 잔 수
  T_env: 실온
  k_min: 가장 느린 냉각 $k$
  k_max: 가장 빠른 냉각 $k$
  t_max: 시뮬레이션 시간
