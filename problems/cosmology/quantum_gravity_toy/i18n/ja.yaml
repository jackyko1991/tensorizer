source_hash: c4f16483f7b8
title: 量子宇宙論：ループ・バウンス
summary: 量子重力のトイモデル：質量ゼロのスカラー場で満たされた平坦な宇宙のループ量子宇宙論（LQC）。接続 $b$ をプランクサイズの面積をもつループのホロノミー $\sin(\lambda b)/\lambda$ で置き換えると、フリードマン方程式は $H^2 = \frac{8\pi G}{3}\rho(1-\rho/\rho_c)$ になる。宇宙のバッチを RK4 で積分すると、ビッグバンが $\rho = \rho_c \approx 0.41\,\rho_\mathrm{P}$ でのバウンスに置き換わる一方、同じモデルの Wheeler–DeWitt 波束は古典的な崩壊に従って特異点へ落ち込む。量子重力は未解決の研究課題であり、これは単純化された一つのアプローチにすぎない。
notes: プランク単位 $G = \hbar = c = 1$、Barbero–Immirzi パラメータ $\gamma = 0.2375$。採用したアプローチ：改良（$\bar\mu$）ダイナミクスによるループ量子宇宙論の有効方程式（Ashtekar、Pawlowski、Singh 2006；Taveras 2008）を、時計の役割も果たす質量ゼロのスカラー場をもつ空間的に平坦な FRW 宇宙に適用する。現状：受け入れられた量子重力理論は存在しない。LQC はループ量子重力に着想を得た対称性簡約量子化であり、完全な LQG との関係は確立されていない。有効方程式は近似であり、このモデルでは鋭くピークをもつ量子状態の数値発展と一致する。バウンスを検証した観測はない。示している内容はこのモデルについては厳密である：拘束条件は保存され、有効フリードマン方程式が成り立ち、バウンス密度 $\rho_c$ はすべての $p_\varphi$ で同じであり、体積は $V(t) = \sqrt{V_B^2 + 12\pi G p_\varphi^2 t^2}$ に従う。$\rho_c$ から遠い領域（または $\lambda \to 0$）では古典一般相対論が戻る：$H^2 = 8\pi G\rho/3$ となり、体積は有限時間で線形に $V = 0$ まで減少する（赤の破線：特異点）。灰色の帯は同じモデルの厳密な Wheeler–DeWitt 解（ループなしで量子化、$x = \ln V$）である：これは自由な波束で、APS が見出したとおり古典的な収縮線に沿って $V \to 0$ へ滑り落ちる。薄い曲線はより小さなループ（$\lambda/2$、$\lambda/4$）を用いたもので、バウンスはより遅く、より高い密度で起こる。フレームはバウンス付近で密に配置している。
meanings:
- バッチ内の各宇宙 $b$ の体積、接続、スカラー場（拘束面 $C = 0$ 上）
- ループの大きさ：$\lambda^2 = 4\sqrt3\pi\gamma\,\ell_P^2$ は LQG の面積ギャップ。$\lambda$ が小さいほど ⇒ $\rho_c$ が大きい
- 有効拘束のハミルトン方程式、全宇宙を一度に計算
- 固有時での RK4 軌道
- ハミルトニアン拘束、$0$ のまま保たれる必要がある（RK4 によるドリフトはターミナルに表示）
- $3/(8\pi G\gamma^2\lambda^2)$：バウンス密度
- 繰り返される $k$ ⇒ 和をとる：時計 $\varphi_p$ と $x = \ln V$ の格子上の Wheeler–DeWitt 波束
labels:
  p_phi: スカラー場の運動量 $p_\varphi$ ($\hbar$)
  gap_scale: LQG 面積ギャップに対するループの大きさ $\lambda$
  log10_rho_start: 初期密度 $\log_{10}(\rho/\rho_c)$
  dt: RK4 の時間刻み $\Delta t$
  spread: Wheeler–DeWitt 波束の幅 $\Delta k/k_0$
