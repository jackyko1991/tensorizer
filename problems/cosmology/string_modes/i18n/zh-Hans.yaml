source_hash: 49928f544229
title: 相对论性弦的振动模与 T 对偶
summary: 光锥规范下的 Nambu–Goto 弦就是 24 个自由的横向波。一次批量化的模式求和即可画出振动中的闭弦或开弦；其各模式的能量即能级 $N$，量子化为 $\alpha' M^2 = N - 1$（开弦）或 $4(N-1)$（闭弦），态数 $1, 24, 324, 3200, \dots$ 可从幂级数 $\prod (1-q^n)^{-24}$ 读出。在半径 $R$ 的圆上，闭弦谱在 $R \leftrightarrow \alpha'/R$ 下不变：这就是 T 对偶。弦论是一个尚无直接实验证实的理论框架。
notes: 单位 $\alpha' = 1$。现状：弦论是数学上自洽的量子引力候选框架，但目前没有支持它的直接实验证据；此处没有任何内容是已受检验的预言。所展示的是玻色弦的标准教科书数学（Goddard–Goldstone–Rebbi–Thorn 1973；Polchinski，String Theory 第 1 卷）：光锥量子化仅在 $D = 26$、截距 $a = 1$ 时自洽，这留下 $N = 0$ 的快子（$M^2 < 0$，红色）、开弦在 $N = 1$ 的无质量矢量，以及闭弦在 $N = \tilde N = 1$ 的引力子、B 场与伸缩子。超弦（D = 10）可消除快子。所画的弦是一个经典位形，其振子能量等于能级 $N$（模式 $n$ 的每个量子携带 $n$ 个单位）；对闭弦，右行与左行模取 $N = \tilde N$（能级匹配，$\int \dot X\cdot X'\,d\sigma = 0$），且弦处于静止系，因此不画出光锥坐标 $X^-$。T 对偶面板追踪几个态的质量随半径的变化：动量态（$n/R$）与缠绕态（$wR/\alpha'$）在 $R \to \alpha'/R$ 下互换，而在自对偶半径 $R = \sqrt{\alpha'}$ 处会有额外的态变为无质量。标题会检查整个截断谱（含简并度）在 $R$ 与 $\alpha'/R$ 处完全相同。
meanings:
- 24 个横向方向 $i$ 中 3 个方向上右行与左行模式 $n$ 的复振幅
- 每个模式在每个世界面点上的相位 $e^{-in(\tau-\sigma)}$（广播）
- 重复的模式指标 $n$ ⇒ 求和：每个 $\tau$ 与 $\sigma$ 下的弦形状
- 能量密度；对 $\sigma$ 积分即得能级 $N$（Parseval）
- 由广播整除掩码得到的因数和：$\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$
- 截断幂级数的乘法如同下三角 Toeplitz 矩阵，因此级数的 $\exp$ 就是矩阵指数
- 所有能级匹配态 $N-\tilde N = nw$ 在每个半径 $R_b$ 上的质量，一次算出
labels:
  string: 弦的类型
  mode_a: 右行模式 $n$（开弦：第一个模式）
  mode_b: 左行模式 $\tilde n$（开弦：第二个模式）
  n_points: 沿弦的点数 $\sigma$
  n_levels: 显示的质量能级数
  R_max: 扫描中的最大圆半径 $R/\sqrt{\alpha'}$
