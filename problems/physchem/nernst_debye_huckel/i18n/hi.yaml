title: नेर्न्स्ट समीकरण और डेबाई–ह्यूकेल परिरक्षण
summary: 'डेनियल सेल, Zn | Zn²⁺ ‖ Cu²⁺ | Cu, का वोल्टेज नेर्न्स्ट समीकरण का पालन करता है, जिसकी गणना यहाँ तापमानों और सांद्रता अनुपातों के एक $(T, Q)$ ग्रिड के रूप में की गई है। वास्तविक आयन अपनी सांद्रता के संकेत से कम सक्रिय होते हैं: हर एक विपरीत आवेश का $\kappa^{-1}$ मोटाई वाला बादल ओढ़े रहता है। आयन के चारों ओर रैखिकीकृत पॉयसन–बोल्ट्ज़मान समीकरण एक त्रिज्य ग्रिड पर बैच रैखिक तंत्र के रूप में हल किया जाता है, विश्लेषिक युकावा विभव से मेल खाता है, और डेबाई–ह्यूकेल सक्रियता गुणांक पुनः उत्पन्न करता है जो EMF को खिसकाते हैं।'
notes: 'डेनियल सेल में ज़िंक का ऑक्सीकरण और कॉपर आयनों का अपचयन होता है, $\mathrm{Zn + Cu^{2+} \to Zn^{2+} + Cu}$, $n = 2$ इलेक्ट्रॉनों और $E^\circ \approx 1.10$ V के साथ (यहाँ स्थिर रखा गया, क्योंकि इसका अपना तापमान परिवर्तन छोटा है)। $Q$ का हर दस गुना परिवर्तन EMF को $\ln 10\,RT/nF$ खिसकाता है, जो 25 °C पर 29.6 mV है, और ढलान $T$ के अनुपात में बढ़ता है। नेर्न्स्ट समीकरण मोललता नहीं, सक्रियताएँ $a = \gamma m$ उपयोग करता है। Debye और Hückel ने $\gamma$ की गणना इस तरह की कि अन्य आयनों को एक केंद्रीय आयन के विभव $\varphi$ में बोल्ट्ज़मान भारों के साथ व्यवस्थित होने दिया, और रैखिकीकृत किया: $\nabla^2\varphi = \kappa^2\varphi$। इसका हल परिरक्षित कूलॉम (युकावा) विभव है, जो 25 °C पर जल में डेबाई लंबाई $\kappa^{-1} \approx 0.304\,\mathrm{nm}/\sqrt{I}$ पर क्षीण होता है। संख्यात्मक हलकर्ता $u = r\varphi$ के लिए त्रिज्य समीकरण को त्रिविकर्णी तंत्र के रूप में लिखता है, आयन सतह पर गाउस नियम और बारह डेबाई लंबाई दूर $\varphi = 0$ के साथ, और विश्लेषिक रूप से लगभग $10^{-4}$ तक मेल खाता है। अपने ही बादल
  के विभव में आयन की ऊर्जा $kT\ln\gamma$ है, जो ठीक विस्तारित नियम देती है; $I \to 0$ के लिए यह सीमांत नियम $\log_{10}\gamma = -Az^2\sqrt I$ बन जाता है, $A \approx 0.51$ के साथ। हर अर्ध-सेल एक अलग 2:2 सल्फ़ेट विलयन है ($I = 4m$), इसलिए $m(\mathrm{Zn^{2+}})$ बदलने से $\gamma_{Zn}$ बदलता है जबकि $\gamma_{Cu}$ वही रहता है, और EMF आदर्श नेर्न्स्ट मान से कई मिलीवोल्ट दूर खिसकता है। एकल-आयन सक्रियता गुणांक अकेले नहीं मापे जा सकते (केवल माध्य $\gamma_\pm$ मापा जा सकता है), और $I \approx 0.01$ से ऊपर 2:2 सल्फ़ेटों में आयन युग्मन और विशिष्ट अन्योन्यक्रियाएँ विस्तारित नियम को भी गुणात्मक बना देती हैं। आयन आकार $a \approx 0.5$ nm एक विशिष्ट जलयोजित-आयन मान है।'
meanings:
- सेल तापमानों और अभिक्रिया भागफलों का एक बैच
- 'किसी सूचकांक पर योग नहीं: हर ढलान हर भागफल से मिलता है'
- स्वीप किए गए ZnSO₄ अर्ध-सेल की आयनिक सामर्थ्य $I = mz^2$ और व्युत्क्रम डेबाई लंबाई
- विस्तारित नियम; $a \to 0$ सीमांत नियम $-Az^2\sqrt I$ देता है
- आयन सतह $a$ से $a + 12\,\kappa_c^{-1}$ तक ग्रिड, प्रति सांद्रता एक
- $u = r\varphi$ के साथ $u^{\prime\prime} - \kappa^2u = 0$; पंक्ति 0, $r = a$ पर गाउस नियम है
- दोहराया गया $j$ ⇒ योग; प्रति सांद्रता एक सघन हल, बैच में
- 'अपने ही बादल में आयन की ऊर्जा: विस्तारित डेबाई–ह्यूकेल नियम पुनः प्राप्त करती है'
