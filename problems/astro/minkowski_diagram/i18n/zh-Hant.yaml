source_hash: 8adb8e4369f3
title: 狹義相對論：閔考斯基圖與勞侖茲變換
summary: 事件是二維向量 $x^\mu = (t, x)$，更換慣性座標系就是用 einsum 對所有事件作用同一個矩陣 $\Lambda^\mu{}_\nu$。一位雙胞胎飛往一顆恆星再返回：在家中座標系與變換後座標系的時空圖中，可以看到傾斜的同時線、不變的光錐，以及旅行者的時鐘走了 $\int\sqrt{1 - v^2}\,dt$——比留在家中的雙胞胎少。
notes: 單位：年與光年，因此 $c = 1$，光線為 45° 虛線。旅行者以速率 $v$ 飛往距離 $L$ 的恆星，瞬間折返，再飛回來。琥珀色線是旅行者稱為「現在」的事件集合：去程時傾斜 $v$，在折返點掃過留家雙胞胎的世界線，留家雙胞胎「消失」的那些年就在這裡。這個佯謬並不對稱，因為只有旅行者更換了慣性座標系。把右側面板的變換速度設為 $v$ 即處於旅行者的去程座標系，設為 $-v$ 則為回程。光錐在每個座標系中都保持形狀。
meanings:
- 一個事件 $(t, x)$，$\mu \in \{0, 1\}$，$c = 1$
- 閔考斯基度規 $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- 重複的 $\nu$ ⇒ 求和：世界線或網格上的所有事件一次變換
- 時空間隔平方，在每個座標系中都相同
- 沿世界線對 $\sqrt{-\Delta s^2}$ 的累加和
- 等於 $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$
labels:
  v: 旅行者速率 $v/c$
  distance: 到恆星的距離 $L$
  beta_view: 右側面板的變換速度 $\beta$
