source_hash: e3dd0dc823a1
title: 黑洞的重力透鏡效應
summary: 掠過黑洞的光線是零測地線，一次即可追蹤一整扇不同碰撞參數的光線：遠處的光線偏折 $4GM/(c^2 b)$，位於 $\sqrt{27}\,GM/c^2$ 以內的光線則會落入。在天空上，透鏡方程式以單一張量運算把每個像素映回光源平面，因此從黑洞後方經過的恆星會變成兩道弧、一個愛因斯坦環與一個放大率尖峰。
notes: 光線圖：單位 $G = c = M = 1$；虛線圓是光子球（$r = 3M$），$b < \sqrt{27}\,M \approx 5.2\,M$ 的光線最終落入黑洞，這就是黑洞投下的陰影為其視界半徑 2.6 倍的原因。剛好在外側的光線可能先繞一圈才逃離。天空圖：以愛因斯坦半徑為單位的薄透鏡點質量（對銀河系中的恆星級黑洞約為一毫角秒，因此微重力透鏡呈現為增亮，而非可分辨的影像）。重力透鏡保持表面亮度不變，所以影像就是在 $\beta(\theta)$ 處取值的光源；多出來的光來自影像被拉伸。在接近完美對齊時，有限的光源大小限制了放大率，而點光源則會給出 $\mu \to \infty$。
meanings:
- 沿光線 $b$ 的 $1/r$，從 0（無窮遠）出發，$du/d\varphi = 1/b$
- 零測地線軌道方程式，對所有光線以 RK4 對 $\varphi$ 積分
- 出射角減去 $\pi$；被捕獲則為 NaN
- 像素 $p$ 的天空角度，以 $\theta_E$ 為單位
- 重複的 $j$ ⇒ 求和
- 每個像素在光源平面上對應的位置
- 以廣播求每一格 $f$ 的透鏡影像
- 放大率：總通量比
labels:
  b_min: 最小碰撞參數 $b$
  b_max: 最大碰撞參數 $b$
  n_rays: 光線數
  impact: 光源相對透鏡的偏移 $u$
  source_radius: 光源半徑
  n_pixels: 每邊天空像素數
