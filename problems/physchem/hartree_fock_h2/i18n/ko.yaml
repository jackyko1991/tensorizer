source_hash: de68545f1f70
title: 최소 STO-3G 기저에서 $\mathrm{H_2}$의 하트리–폭 계산
summary: Szabo와 Ostlund의 교과서적 자기 일관장 계산을 텐서로 작성했다. 각 수소는 가우시안 세 개로 만든 1s 함수 하나(STO-3G)를 갖는다. 겹침, 운동 에너지, 핵 인력, 2전자 적분은 닫힌 형태이고, 폭 행렬은 밀도와 $(\mu\nu|\lambda\sigma)$ 텐서의 축약이며, 루탄 방정식 $FC = SC\varepsilon$를 여러 결합 길이에 대해 eigh로 한꺼번에 푼다. $R = 1.4$ bohr에서 $E = -1.1167$ hartree를 주며, 스캔은 결합 길이를 찾고 제한 하트리–폭이 결합을 끊을 수 없는 이유를 보여 준다.
notes: '원자 단위: 길이는 bohr($a_0 = 0.529$ Å), 에너지는 hartree($E_h = 27.21$ eV). 기저는 Szabo와 Ostlund의 Modern Quantum Chemistry(1982; Dover판 1996) 3장과 같이 슬레이터 지수 $\zeta_{\mathrm H} = 1.24$와 $\zeta_{\mathrm{He}} = 2.0925$를 쓴 STO-3G이다. 기저 함수가 두 개이므로 모든 행렬이 $2\times2$이고, 각 숫자를 책과 대조할 수 있다: $S_{12} = 0.6593$, $T_{11} = 0.7600$, $R = 1.4$ bohr에서 $E = -1.1167$ hartree, $R = 1.4632$ bohr에서 $\mathrm{HeH^+}$는 $-2.8607$ hartree. SCF는 $P = 0$(코어 해밀토니언)에서 시작한다. $\mathrm{H_2}$에서는 대칭성이 오비탈 $\psi_{1,2} \propto \phi_A \pm \phi_B$를 정하므로 즉시 수렴하지만, $\mathrm{HeH^+}$는 전하가 헬륨 쪽으로 이동하면서 십여 번의 반복이 필요하다. 각 결합 길이가 배치 항목이므로 곡선 전체에 대한 SCF가 하나의 루프에서 실행된다. 제한 하트리–폭은 두 전자를 같은 공간 오비탈 $\psi_1$에 넣는다. 큰 $R$에서 그 상태는 절반이 $\mathrm{H + H}$, 절반이 이온성 $\mathrm{H^+ + H^-}$이므로 곡선이 $2E_{\mathrm H}$보다 훨씬 위로 올라간다. 점선은 같은 기저에서의 완전 배치 상호작용(full CI)이다($|1^2\rangle$, $|1^12^1\rangle$, $|2^2\rangle$의 $3\times3$ 일중항 행렬). 이는 $|2^2\rangle$을 섞어 올바르게 해리하며, 평형에서 RHF와의 차이(약 $-0.02$ hartree)가 상관 에너지이다. 최소 기저는 정확한 $\mathrm{H_2}$ 에너지, $R = 1.4$ bohr에서 $-1.1745$
  hartree와 거리가 멀다. 더 큰 기저에는 p와 d 함수, 그리고 일반적인 가우시안 적분 점화식이 필요하다. $\mathrm{HeH^+}$를 시도해 보자. 여기서는 두 전자가 모두 헬륨에 가므로 RHF 곡선이 올바른 극한 $\mathrm{He + H^+}$에 도달한다.'
meanings:
- 함수당 가우시안 지수 세 개 $\alpha_p\zeta^2$와, 원시 함수 정규화 $(2\alpha/\pi)^{3/4}$를 포함한 축약 계수
- 배치의 모든 결합 길이 $R_b$에 대한 두 핵(및 기저 중심)
- 두 가우시안의 곱은 $P = (\alpha A + \beta B)/(\alpha + \beta)$에 놓인 하나의 가우시안
- '반복된 $p, q$ ⇒ 합산: 원시 함수에 대한 축약; $T$, $V$도 마찬가지'
- 보이스 함수 $F_0(t) = \tfrac12\sqrt{\pi/t}\,\mathrm{erf}\sqrt t$를 쓴 $-\sum_c Z_c\,\tfrac{2\pi}{\alpha+\beta}\,e^{-\dots}F_0\big((\alpha+\beta)|P - C|^2\big)$
- 브라와 켓 쌍 텐서를 서로 브로드캐스팅한 뒤 einsum 하나로 $p, q, r, t$ 합산
- '대칭(뢰브딘) 직교화: $X^{\mathsf T}SX = 1$'
- 쿨롱 행렬 $J$; 반복된 $\lambda, \sigma$ ⇒ 합산
- '교환 행렬 $K$: 같은 텐서를 첨자를 바꿔 읽은 것'
- SCF 반복마다 배치 eigh 한 번; $C = XC^{\prime}$
- '멀리컨 전자 수: 정확히 2'
- 퍼텐셜 곡선, 결합 길이마다 항목 하나
labels:
  molecule: 분자
  R_min: 가장 짧은 결합 길이 $R$
  R_max: 가장 긴 결합 길이 $R$
  n_bond_lengths: 배치의 결합 길이 수
