source_hash: 31a92e6ff86f
title: 一般相対論：ブラックホールのまわりの軌道と落下
summary: シュワルツシルト計量における測地線。クリストッフェル記号は $g_{\mu\nu}(x)$ から自動微分で求め、einsum で縮約する。束縛軌道は閉じずに歳差運動し、有効ポテンシャルには最内安定円軌道（ISCO）が $6GM/c^2$ に、光子球が $3GM/c^2$ に現れる。動径方向の落下は有限の固有時で事象の地平面に達するが、遠方の時計は凍りついたように止まる。
notes: 単位：$G = c = M = 1$ なので長さは $GM/c^2$ 単位（太陽質量あたり 1.5 km）で、事象の地平面は $r_s = 2$ にある。軌道は近点から出発し、半直弦 $p$、離心率 $e$ の軌道に対するシュワルツシルト計量での厳密なエネルギー $E$ と角運動量 $L$ を用いる。固有時 $\tau$ について RK4 で積分する。同じ $p$ と $e$ をもつ灰色のニュートン楕円は閉じる。近日点移動は $p$ が大きいとき $6\pi GM/(c^2 p)$ に近づき（水星では 1 世紀あたり 43″）、ブラックホールに近づくとずっと大きくなる。束縛軌道は $p > 6 + 2e$ のときのみ存在する。ISCO（$r = 6$）より内側では円軌道は不安定であり、$r = 3$ では光さえ周回できる。落下（右下）では、落ちていく時計はおよそ $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$（有限）で地平面に達するが、シュワルツシルト時間 $t$ では落下はしだいに遅くなり $r = 2$ で凍結する。計算は $r = 2.1$ で止める。ここでこの座標系は破綻し始める。
meanings:
- 各測地線上の事象 $(t, r, \theta, \varphi)$、$G = c = M = 1$
- 4元速度 $dx^\mu/d\tau$
- シュワルツシルト計量、符号 $(-, +, +, +)$
- 逆計量
- autograd による計量の微分、微分の添字は最後
- 繰り返される $\sigma$ ⇒ 和をとる（$z$ = バッチ）
- 繰り返される $\alpha, \beta$ ⇒ 和をとる
- 質量をもつ粒子では $= -1$、積分のチェック
labels:
  p: 半直弦 $p$
  e: 離心率 $e$
  n_orbits: シミュレーションする周回数
  dt: 固有時の刻み $\Delta\tau$
  r_infall: 落下開始位置（静止）
