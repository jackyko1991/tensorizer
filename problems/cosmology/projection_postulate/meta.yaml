  - {symbol: 'q_{tD}', code: 'cumsum(z.abs()**2, 1)[:, D - 1]', shape: '(T, n_D)', meaning: 'fraction of the norm of $\Psi$ the observer sees, for every $D$ at once (nested states)'}
  - {symbol: '\psi', code: 'z[:, :d] / z[:, :d].norm(dim=1)', shape: '(T, d)', meaning: 'the observed state, uniform on the unit sphere of $\mathbb C^d$ for any $D$'}
  - {symbol: '\mathrm{KS}', code: 'ks_distance(q, a, b)', shape: '(n_D,)', meaning: 'Kolmogorov–Smirnov distance to Beta$(d, D-d)$ (incomplete beta by quadrature)'}
  - {symbol: 'E_{tkm}', code: 'cumsum(h.abs()**2, -1)', shape: '(T, K, M)', meaning: 'energy of hidden block $k$ with $m = 1..M$ dimensions: Gamma$(m)$ (complex) or $2\,$Gamma$(m/2)$ (real)'}
  - {symbol: 'k^*', code: '(w[:, None] / E).argmax(1)', shape: '(T, M)', meaning: 'the projection race: the outcome with the largest $|c_k|^2/E_k$ happens'}
  - {symbol: 'P_{mk}', code: 'race_probabilities(w, a)', shape: '(M, K)', meaning: 'closed form of the race; the sum over $j$ (minus $j = k$) is the product over the other outcomes'}
