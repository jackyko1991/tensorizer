source_hash: 8da6dcc23206
title: 位置重み行列：モチーフロゴと走査
summary: 転写因子のアラインメントされた結合部位を数えて $(m, 4)$ 行列にし、擬似カウントで頻度に、背景に対する対数オッズスコアに変換する。情報量から配列ロゴが得られ、展開した窓に対する一つの einsum で長い配列の両鎖を一度にスコア化する。ヒットは配列のシャッフルコピーから求めた p 値で判定する。
notes: PWM は結合部位の各位置が独立に寄与すると仮定するので、窓のスコアは文字ごとに一つの数の和、すなわち one-hot の窓と $W$ の内積になる。擬似カウント $\beta$ は、少数の訓練部位で一度も見られなかった文字のスコアが $-\infty$ になるのを防ぐ。部位が多いほどその影響は小さくなる。列の情報量は、モチーフがその位置の文字をどれだけ絞り込むかを表し、0 ビット（何でもよい）から 2 ビット（常に同じ文字）までをとる。ロゴは文字を $P_{ja}$ に比例して積み上げる。ここでの部位は合成である：TATA ボックスに似たコア（コンセンサス TATAWAWR、W = A または T、R = A または G）と両側に二つずつの固定文字からなる 12 bp で、モチーフが見つけられるだけのビット数をもつようにしてある。短い縮重モチーフだけでは情報が少なすぎる：長い配列ではランダムな窓が本物の部位と同じくらい高いスコアを得るため、実際の TATA ボックスを PWM だけで見つけるのは難しい。p 値は配列のシャッフルコピー（文字は同じでモチーフなし）を走査して求める。$2(L-m+1)$ 個の窓がある場合、$p$ で切ると約 $2(L-m+1)\,p$ 個のランダムなヒットが通過し、分解できる最小の p 値は $1/(1 + \#\text{null scores})$ である。訓練部位を減らす、モチーフを弱める、閾値を緩めるなどして、植え込んだ部位が見逃されたり偽のヒットが現れたりする様子を見よう。
meanings:
- 訓練部位 $s$、列 $j$、文字 $a$ ∈ (A, C, G, T)
- $s$ の繰り返し ⇒ 和：各列の文字数
- 擬似カウント $\beta$ 付きの頻度。各行の和は 1 で、0 の要素はない
- 背景 $q_a$ に対する対数オッズ（ビット）：> 0 は選好、< 0 は回避
- $a$ の繰り返し ⇒ 和：列あたりのビット数。一様背景では 0 から 2 の間。ロゴの高さ
- $t = 0$ はプラス鎖、$t = 1$ は逆相補鎖（列を反転、A↔T、C↔G）
- 長い配列の $m$ 文字のすべての窓
- $j$、$a$ の繰り返し ⇒ 和：両鎖を一回の呼び出しで。同じコードですべてのシャッフル $(R, 2, L-m+1)$ をスコア化
- シャッフル配列のスコアのうち同等以上のものの割合
labels:
  n_train: 訓練部位数 $N$
  strength: モチーフの強さ（コンセンサスの確率）
  pseudo: 擬似カウント $\beta$
  length: 配列長 $L$
  n_sites: 植え込む部位数
  log10_p: p 値の閾値 $\log_{10} p$
  shuffles: シャッフル配列数 $R$
  seed: 乱数シード
