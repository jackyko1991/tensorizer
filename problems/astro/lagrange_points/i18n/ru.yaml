source_hash: 28d4b810cb16
title: Точки Лагранжа
summary: Звезда и планета обращаются друг вокруг друга; во вращающейся с ними системе отсчёта пробная частица испытывает гравитацию, центробежную силу и силу Кориолиса, записанные через $\varepsilon_{ijk}$. Метод Ньютона для $\nabla\Phi_\mathrm{eff} = 0$ (градиент и гессиан через autograd) находит все пять точек Лагранжа сразу, а частицы, смещённые от L4, описывают «головастиковые» и подковообразные орбиты.
notes: 'Единицы: расстояние между телами 1, $G(M_1 + M_2) = 1$, так что пара делает один оборот за $2\pi$. Доля массы планеты равна $\mu$, а пробные частицы слишком лёгкие, чтобы возмущать тела. L1, L2 и L3 лежат на прямой, проходящей через тела, и являются седловыми точками $\Phi_\mathrm{eff}$; L4 и L5 образуют с телами равносторонние треугольники и являются максимумами $\Phi_\mathrm{eff}$, однако сила Кориолиса делает их устойчивыми при $\mu < 0.0385$. Поэтому троянские астероиды Юпитера скапливаются на 60° впереди и позади планеты. При больших смещениях малые «головастиковые» петли становятся большими, а затем переходят в подковообразные орбиты, огибающие и L3. При $\mu$ больше 0,0385 частицы уходят прочь.'
meanings:
- положение пробной частицы $b$ во вращающейся системе
- звезда в $(-\mu, 0, 0)$ и планета в $(1-\mu, 0, 0)$
- 'повторяющийся $s$ ⇒ суммирование: притяжение обоих тел'
- символ Леви-Чивиты для векторных произведений
- кориолисово ускорение, $\boldsymbol\Omega = \hat{\mathbf z}$
- градиент через autograd во всех пяти точках
- 'гессиан через autograd: шаг Ньютона — один пакетный linalg.solve'
- $-2\Phi_\mathrm{eff} - \dot x_i\dot x_i$, сохраняется
labels:
  mu: Доля массы планеты $\mu$
  nudge: Наибольшее смещение от L4 вдоль орбиты
  t_max: Время моделирования
  dt: Шаг по времени
