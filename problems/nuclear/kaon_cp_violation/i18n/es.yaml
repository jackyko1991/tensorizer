source_hash: ebe74e0d5d26
title: Inversión temporal y CPT con kaones neutros
summary: 'Un kaón neutro es un sistema de dos estados ($K^0$, $\bar K^0$) que oscila y se desintegra, por lo que evoluciona bajo un hamiltoniano no hermítico $2\times 2$ $H = M - i\Gamma/2$. Construido a partir de valores del PDG y exponenciado para un lote de mundos en todos los instantes a la vez, muestra la extrañeza oscilando a $\Delta m$, la interferencia $\pi\pi$ que viola CP y la prueba de inversión temporal de CPLEAR: $K^0 \to \bar K^0$ y $\bar K^0 \to K^0$ difieren en $A_T \approx 4\,\mathrm{Re}\,\varepsilon \approx 6.5\times 10^{-3}$, mientras que CPT mantiene iguales la masa y la vida media de $K^0$ y $\bar K^0$.'
notes: 'C (conjugación de carga) intercambia partículas y antipartículas, P (paridad) refleja el espacio como un espejo y T invierte el tiempo. El teorema CPT (Lüders, Pauli, Schwinger) afirma que toda teoría cuántica de campos local e invariante de Lorentz es simétrica bajo las tres juntas, de modo que una partícula y su antipartícula tienen exactamente las mismas masas y vidas medias. En 1964, Christenson, Cronin, Fitch y Turlay observaron la desintegración del $K_L$ de vida larga en dos piones, que CP prohíbe: CP se viola, al nivel $|\varepsilon| \approx 2.2\times 10^{-3}$ (Premio Nobel de 1980 para Cronin y Fitch). Si CPT se cumple, la violación de CP implica también violación de T, y CPLEAR en el CERN la observó directamente en 1998: partiendo de $K^0$ y $\bar K^0$ etiquetados y etiquetando la extrañeza en la desintegración mediante desintegraciones semileptónicas, $\bar K^0 \to K^0$ ocurre algo más a menudo que $K^0 \to \bar K^0$, $\langle A_T\rangle = (6.6 \pm 1.3 \pm 1.0)\times 10^{-3}$
  (la interpretación como violación de T supone la regla $\Delta S = \Delta Q$ y ninguna violación de CPT en las desintegraciones). Aquí $H$ se construye a partir de sus estados propios, de modo que el parámetro CP $\varepsilon$ y el parámetro CPT $\delta$ son controles ajustables: con $\delta = 0$, $H_{11} = H_{22}$ (masas y vidas medias iguales), $P(K^0\to K^0) = P(\bar K^0\to\bar K^0)$ y $A_T$ es una meseta plana en $(|p/q|^2 - |q/p|^2)/(|p/q|^2 + |q/p|^2) \approx 4\,\mathrm{Re}\,\varepsilon$; un $\mathrm{Re}\,\delta$ distinto de cero hace que $A_{CPT} = [P(\bar K^0\to\bar K^0) - P(K^0\to K^0)]/[\ldots]$ suba hasta $4\,\mathrm{Re}\,\delta$ tras unos pocos $\tau_S$ (CPLEAR encontró $\mathrm{Re}\,\delta$ compatible con cero al nivel de $10^{-4}$). El panel inferior muestra la clásica interferencia $\pi^+\pi^-$ entre las desintegraciones de $K_S$ y $K_L$, máxima cerca de $12\,\tau_S$, a partir de la cual se miden $|\eta_{+-}|$ y $\phi_{+-}$. La unitariedad se comprueba con la relación de
  Bell–Steinberger $(i\Delta m + \bar\Gamma)\langle K_S|K_L\rangle = \sum_f A_S^* A_L$; con dominancia $\pi\pi$, el $\eta_{+-}$ medido predice $\mathrm{Re}\,\varepsilon$ con una precisión del 0,2 %. Valores: PDG 2024 ($\tau_S = 0.8954\times10^{-10}$ s, $\tau_L = 5.116\times10^{-8}$ s, $\Delta m = 0.5293\times10^{10}\,\hbar$/s, $|\varepsilon| = 2.228\times 10^{-3}$, $\phi_\varepsilon = 43.52°$, $|\eta_{+-}| = 2.232\times10^{-3}$); CPLEAR, Phys. Lett. B 444 (1998) 43. Simplificaciones: se desprecia la violación directa de CP ($\varepsilon''$, $10^{-3}$ de $\varepsilon$), de modo que $\eta_{+-} = \varepsilon$; el etiquetado semileptónico se idealiza como una medida perfecta de la extrañeza; y no hay regeneración en la materia.'
meanings:
- columnas $K_S \propto (1+\varepsilon_S, 1-\varepsilon_S)$, $K_L \propto (1+\varepsilon_L, -(1-\varepsilon_L))$ con $\varepsilon_{S,L} = \varepsilon \pm \delta$
- $\mp\Delta m/2 - i\Gamma_{S,L}/2$ en unidades de $\hbar/\tau_S$ (la masa común es una fase global)
- '$i$ repetido ⇒ sumado: un hamiltoniano efectivo por mundo'
- $e^{-iHt}$ en cada instante, comprobado con matrix_exp
- probabilidad de que un kaón nacido como $b$ se encuentre como $a$ ($0 = K^0$, $1 = \bar K^0$)
- 'hermítica y $\ge 0$: unitariedad, la relación de Bell–Steinberger'
- vector fila con $a\cdot K_S = 1$, $a\cdot K_L = \eta_{+-}$
- '$x$ repetido ⇒ sumado: tasa de desintegración $\pi^+\pi^-$ de un haz nacido como $K^0$ o $\bar K^0$'
labels:
  eps_abs: $|\varepsilon|$
  eps_phase: Fase $\phi_\varepsilon$
  re_delta: Violación de CPT $\mathrm{Re}\,\delta$
  dm: Diferencia de masa $\Delta m$
  t_max: Ventana temporal $t_\mathrm{max}$
