<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A spiral galaxy seen edge-on inside a dark halo, with a star orbiting at radius r with speed V; the sketch of V against r stays flat instead of falling like Kepler">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- dark halo -->
    <circle cx="62" cy="80" r="56" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="14" y="26" font-size="11" fill="#6b7280">halo?</text>
    <!-- disk and bulge -->
    <ellipse cx="62" cy="80" rx="46" ry="11" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <ellipse cx="62" cy="80" rx="12" ry="8" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- star at radius r with velocity -->
    <line x1="62" y1="80" x2="100" y2="80" stroke="#374151" stroke-width="2"/>
    <text x="76" y="98" font-style="italic">r</text>
    <circle cx="102" cy="80" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <line x1="102" y1="76" x2="102" y2="48" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="108" y="56" font-style="italic" fill="#b91c1c">V</text>
    <!-- rotation curve sketch -->
    <line x1="140" y1="132" x2="232" y2="132" stroke="#374151" stroke-width="2"/>
    <line x1="140" y1="132" x2="140" y2="40" stroke="#374151" stroke-width="2"/>
    <text x="222" y="150" font-style="italic">r</text>
    <text x="126" y="50" font-style="italic">V</text>
    <path d="M140,132 Q150,70 166,66 L228,64" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M166,66 Q190,86 228,108" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="196" y="58" font-size="11" fill="#1e40af">observed</text>
    <text x="190" y="124" font-size="11" fill="#6b7280">Kepler</text>
  </g>
</svg>
