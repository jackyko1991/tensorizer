title: Тесты Белла для гонки проекций
summary: 'Спекулятивная гипотеза, а не установленная физика: две запутанные частицы образуют одно общее состояние $\Psi$ в $D$ измерениях, и каждое измерение есть проекция, за которой следует гонка из шага 1. Если проводить её совместно над $\Psi$, как одно событие в полном пространстве, гонка даёт ровно квантовое $E = -\cos\theta$ и значение CHSH $S = 2\sqrt2$. Если проводить её отдельно над локальными скрытыми координатами каждой стороны, это локальная модель скрытых параметров с $S\leq2$, которую исключают тесты Белла без лазеек. Гонка с более чем одним скрытым измерением на исход нарушает границу Цирельсона и допускает сверхсветовую передачу сигналов.'
notes: 'Шаг 5 гипотезы проекции (см. описание серии), спекулятивной гипотезы автора, а не установленной физики. Он проверяет постулаты P1 (проекция) и P2 (событие) из шага 1 (cosmology/projection_postulate) на запутанности. Шаг 4 (cosmology/projection_singularity_fold) посвящён геометрии, а шаг 6 (cosmology/projection_telescope_tests) наблюдениям. Размерность $D$ общего состояния остаётся открытой: это параметр, и ни один результат от неё не зависит. Сначала известная физика. Синглет даёт $E(a,b) = -a\cdot b = -\cos\theta$. Белл (1964), а также Клаузер, Хорн, Шимони и Холт (1969) доказали $S\leq2$ для любой локальной модели скрытых параметров, тогда как квантовая механика достигает границы Цирельсона $S = 2\sqrt2$. Гипотеза: существует одно общее $\Psi$ (P0, P3); измерение каждой стороны есть проекция плюс гонка из шага 1, в которой осуществляется исход с наибольшим $\|P_k\Psi\|^2/E_k$, а $E_k$ есть энергия в $m$ скрытых комплексных координатах $\Psi$. (i) Совместная модель: гонка проводится
  один раз по четырём совместным исходам с весами $\|(P^a_i\otimes P^b_j)\Psi\|^2$. Нелокальная в 3D, она является одним событием в $D$ измерениях. При $m = 1$ (единственное значение, которое оставил в живых шаг 1) она в точности воспроизводит квантовую механику: $E = -\cos\theta$ в замкнутом виде с точностью $10^{-15}$, а метод Монте-Карло исходя из $\Psi$ в $\mathbb C^D$ согласуется в пределах статистики. $S = 2\sqrt2$ при оптимальных настройках, максимум по 2000 случайным настройкам остаётся ниже, и маргинальные распределения Алисы не зависят от настройки Боба (нет передачи сигналов). (ii) Локальная модель: каждая сторона проводит гонку только по собственным скрытым энергиям и скрытому направлению $n$, заданному в источнике, т. е. по весам $(1\pm a\cdot n)/2$. Это локальная модель скрытых параметров, так что $S\leq2$ гарантировано. $m = 1$ даёт $E = -\cos\theta/3$ (макс. $S\approx0.93$), а $m\to\infty$ есть собственная детерминистическая модель Белла $E = -(1-2\theta/\pi)$, которая достигает
  ровно $S = 2$. За пределами правила Борна: совместная гонка с $m\neq1$ не является квантовой механикой. При $m > 1$ она нарушает границу Цирельсона ($S = 3.85$ при $m = 3$, стремясь к значению 4 для PR-ящика). Для частично запутанного состояния она делает статистику Алисы зависящей от настройки Боба, что является сверхсветовой передачей сигналов ($dS/dm = 1.34$, сигнал $\approx0.18\,|m-1|$). Таким образом, $m = 1$ требуется релятивистской причинностью, так же как и данными опытов с тремя щелями. Данные (data/bell_tests.csv, числа приведены по аннотациям). Hensen et al. (Nature 526, 682, 2015): NV-спины на расстоянии 1.3 км, $S = 2.42\pm0.20$, $p = 0.039$. Их второй запуск (Sci. Rep. 6, 30289, 2016): $S = 2.35\pm0.18$. Giustina et al. и Shalm et al. (Phys. Rev. Lett. 115, 250401 и 250402, 2015): фотоны, неравенство CH–Eberhard, $p\leq3.74\times10^{-31}$ и $2.3\times10^{-7}$. Rosenfeld et al. (Phys. Rev. Lett. 119, 010402, 2017): атомы на расстоянии 398 м, $S = 2.221\pm0.033$. Storz et al.
  (Nature 617, 265, 2023): сверхпроводящие кубиты на расстоянии 30 м, $S = 2.0747\pm0.0033$, на 22.6$\sigma$ выше 2. Вердикт: модель (ii), а вместе с ней и любая локальная версия гонки, исключена. Модель (i) согласуется со всеми тестами, но лишь потому, что это переписанная квантовая механика; она не делает новых предсказаний. Отклонение, всё ещё допустимое по шагу 1 ($|m-1|\leq6\times10^{-3}$), сдвинуло бы $S$ не более чем на $8\times10^{-3}$. Это больше, чем $\sigma_S$ у Storz, но измеренные значения $S$ лежат значительно ниже $2\sqrt2$ (видность 0.73), и неизвестная видность поглощает такой сдвиг. Заметить его могли бы только форма $E(\theta)$ (остаток $\leq1.5\times10^{-3}$) или прямой тест на отсутствие сигналов ($\leq10^{-3}$). Википедия: теорема Белла, неравенство CHSH.'
meanings:
- спиновые проекторы вдоль единичных векторов $n$, построенные через einsum по матрицам Паули
- 'вес каждого совместного исхода: по индексам кубитов $x, y, u, v$ ведётся суммирование'
- корреляция, суммирование по знакам исходов $s = (+1, -1)$
- совместная гонка по четырём исходам; сумма по $l$ (за вычетом $l = k$) есть произведение по остальным исходам; $m = 1$ даёт $P = w$
- энергии скрытых блоков, считанные из выборок $\Psi$, равномерных на сфере в $\mathbb C^D$
- 'скрытое направление, заданное в источнике, три вещественные координаты $\Psi$: равномерно на $S^2$ при любом $D$'
- 'локальные гонки: каждая сторона проводит гонку по собственным весам $(1\pm a\cdot n)/2$; по общему $\nu$ ведётся усреднение'
- значение CHSH, максимизированное по тому, какой из четырёх членов несёт знак минус
labels:
  D: Полная размерность $D$ общего состояния $\Psi$ (открыта)
  m_max: Наибольшее число скрытых измерений на исход $m$
  settings: Случайные настройки измерения
  trials: События гонки на угол (Монте-Карло)
