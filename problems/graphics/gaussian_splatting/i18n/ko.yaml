source_hash: fb9eaaef3d46
title: 3D 가우시안 스플래팅
summary: 장면을 색이 있고 반투명한 3D 가우시안 수백 개로 표현한다. 각 가우시안은 원근 사상의 야코비안으로 카메라에 투영되고 $\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$, 스플랫들은 깊이순으로 정렬되어 앞에서 뒤로 알파 합성되며 $C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$, Adam이 모든 평균, 스케일, 회전, 색, 불투명도를 합성 장면의 사진에 맞춘다. 학습에서 제외한 시점으로, 가우시안들이 학습 사진만이 아니라 3D 형상을 배웠는지 확인한다.
notes: '정답 데이터는 구 세 개와 정육면체 하나로, 램버트 음영을 넣어 해석적으로 광선 투사한 것이며, 장면 주위 두 개의 고리에 놓인 카메라 12대로 촬영한다($64\times 64$ px). 그 사이 다른 높이에 있는 13번째 카메라는 학습에서 제외한다. 가우시안들은 정육면체 안의 무작위 위치에서 회색의 희미한 상태로, 무작위 방향을 가지고 시작한다. Adam의 매 단계는 학습 시점 하나를 위의 파이프라인 전체로 렌더링하고, L1 사진 오차를 모든 평균, 로그 스케일, 쿼터니언, 색, 불투명도로 역전파한다. 텐서 측면의 교훈은 공분산 대수다. $\Sigma = RSS^{\mathsf T}R^{\mathsf T}$는 최적화기가 무엇을 하든 유효한(대칭 양의 정부호) 공분산으로 남으며, 투영은 선형이 아니므로 각 가우시안은 국소 선형화 $J$를 통과한다. 2D 스플랫 $\Sigma'' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$는 einsum의 연쇄다. 타원 패널은 제외한 시점에서 이 $1\sigma$ 타원들을 그린다. 밀집화(단순화한 버전): 처음 70% 동안 50단계마다 중심이 가장 큰 기울기를 받은 가우시안들을 $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$ 위치의 두 복사본으로 나누고 축을 1.6배 줄이며, 거의 투명한 가우시안($o < 0.05$)을 재활용하므로 $M$은 고정된다. 논문은 대신 시점 공간 기울기로 복제와 분할을 하고, 가지치기와 불투명도 재설정을 하며, 가우시안을 수백만 개까지 늘린다. Kerbl et al. (SIGGRAPH 2023)과 비교한 그 밖의 단순화: 구면 조화 함수 대신 상수 색(장면이 램버트 면이므로), 움직임 기반 구조 복원 점군 대신 무작위 시작, D-SSIM 항 없는 L1 손실, 그리고 모든 스플랫을 모든 픽셀에서 평가하는 조밀한 래스터라이저(실제 구현은 GPU에서 스플랫을 $16\times 16$ 타일로 정렬하고 먼 것은 건너뛴다). 이미지가 작은
  이유가 이것이다. 제외한 시점의 PSNR은 학습 PSNR보다 약간 낮게 유지된다. 한 번도 보지 못한 시점은 가우시안을 덜 제약하기 때문이다. 시점 수를 줄이거나(제외한 시점이 나빠진다), L2 손실을 쓰거나, 밀집화를 끄거나, 가우시안과 단계를 늘려 보자(가장자리가 더 선명해진다).'
meanings:
- 쿼터니언으로 만든 가우시안 $m$의 회전, 내부에서 정규화하므로 어떤 4개 숫자든 유효한 회전
- 3D 공분산, $j$에 대해 합; 어떤 매개변수에서도 대칭 양의 정부호, $s = e^{\log s}$
- 모든 카메라 좌표계에서의 모든 가우시안 중심(x 오른쪽, y 아래, z = 깊이)
- 중심을 픽셀 좌표로 보내는 핀홀 투영
- '$\partial\mu''_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$: 투영의 국소 선형화'
- 각 스플랫의 2D 공분산, $j, k$에 대해 합, $JW = $ einsum('vmai,vij->vmaj'), 여기에 0.3 px² 저역 통과 추가
- '이차 형식 $d^{\mathsf T}\Sigma''^{-1}d$를 픽셀의 단항식 6개 $\varphi = (u^2, 2uv, v^2, u, v, 1)$로 전개: 행렬 곱 한 번'
- 스플랫 $m$이 픽셀 $p$를 얼마나 덮는가; $o_m = \sigma(\text{logit})$
- 카메라별 깊이 순서; 큰 $(V, M, P)$ 텐서가 생기기 전에 가우시안별 작은 텐서들을 재정렬
- '투과율: $m$ 앞의 스플랫들을 지나고 남은 빛; $m$을 따라 증가하지 않음'
- 앞에서 뒤로 합성, $m$에 대해 합; 통과한 빛은 흰 배경 $b$를 보여 줌
- 단계마다 무작위 학습 시점 하나에서의 평균 절대 픽셀 오차; Adam이 $14M$개의 숫자를 모두 갱신
labels:
  n_gaussians: 가우시안 수 $M$
  iterations: Adam 단계 수
  lr: Adam 학습률(평균 기준, 나머지는 비례 조정)
  loss: 광도 손실
  densify: 분할 밀집화
  n_views: 학습 시점 수 $V$
  resolution: 이미지 크기(픽셀)
