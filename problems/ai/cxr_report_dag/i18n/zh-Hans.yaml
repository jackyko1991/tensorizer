title: 用 DAG 张量从胸部 X 光生成报告：拼接一个 CNN 与一个微型语言模型
summary: 这是一个教学玩具，不是临床报告生成。一个小型 CNN 从 410 张 NIH 胸部 X 光片学习六种病灶，一个微型字符级 GPT 则从写出的标签标头学习模板报告（"enlarged heart. pleural effusion. no pneumothorax."），两者各自独立训练。一条 DAG 边把它们连起来：连接器把 CNN 的病灶概率转成一个软标头，让语言模型仅凭图像就能写出报告。训练流程本身也是一个张量 DAG（规则分层、max-plus 关键路径、每条规则对所有种子只做一次批量调用），并与以相同计算量端到端训练的同一网络比较，之后再用 251 段真实文本（图注加上引用该张 X 光片的句子）微调，这些文本来自开放许可（CC BY）的 PubMed Central 文章。第二阶段的结果很弱，在配对这么少的情况下这在意料之中，本页也如实说明。
notes: 这是什么。这是一个教学玩具，不是临床报告生成：模型很小，图像只有 64×64，只有几百个带噪声的标签，也没有真正的放射科报告。这里的任何内容都不代表临床准确度。这个构想（分别训练的网络通过 DAG 张量连接、进行全局优化，整个流程本身也由 DAG 张量控制）出自 Jacky Ka Long Ko；本问题把本系列上一个问题中 CNN + 微型语言模型的拼接方法，迁移到胸部 X 光片以及读起来像（非常简短的）报告的文本上。为什么没有真实报告。公开可得的报告数据集中，没有一个符合这里采用的许可规则（开放、可再分发、允许商业使用）：IU X-ray / OpenI（Demner-Fushman et al. 2016）是 CC BY-NC-ND；MIMIC-CXR（Johnson et al. 2019）、VinDr-CXR 和 BRAX 需要在数据使用协议下获得认证访问；CheXpert 和 PadChest 仅限研究使用。因此第一阶段使用由代码根据 NIH 标签组合生成的模板报告，这使它变成以文本表达的多标签分类；第二阶段则使用 CC BY 的 PubMed Central 文章中的图注加上引用该图的句子：这些是为病例报告而写的简短、异质的文本，常常指向箭头和子图。哪些是新的，哪些不是。从胸部 X 光生成报告是一个活跃的领域（Jing et al. 2018，R2Gen by Chen et al. 2020）；用一个小型可学习的连接器把预训练图像编码器接到语言模型上，正是 LLaVA（Liu et al. 2023）和 BLIP-2（Li et al. 2023）的构建方式。本问题增加的是编排：模型图和训练流程都由 Circle of Willis 工作流问题的张量 DAG 引擎执行（规则图从 data/training.smk 解析而来、Kronecker 作业图、布尔分层、max-plus 关键路径），每条规则都是对所有种子的一次批量调用，并且把用 DAG 构建的模型与相同计算量的单体模型比较。数据。NIH ChestX-ray14（Wang et al. 2017，NIH Clinical Center；使用不受限制，需注明出处）：549 张正面 PA 图像，每位病人一张，包含六种病灶（心脏扩大、积液、浸润、肺不张、气胸、肿块或结节）或无病灶，每张图像最多两种；410
  张用于训练，139 张用于测试。这些标签是用 NLP 从报告中提取的，带有噪声（约 10 % 或更多是错的）。PMC：来自 316 篇开放获取文章的 316 张胸部 X 光图，每一张都是 CC BY（以文章本身 XML 中的许可核对；规则：CC BY、CC BY-SA 或 CC0，拒绝 NC、ND、其他或缺失）。候选来自 ROCOv2 的元数据（Rückert et al. 2024），仅作为 PMCID 的索引使用；没有附带任何 ROCOv2 的内容。在检查的 2114 篇文章中，1575 篇被接受，539 篇因许可被拒（全部是 CC BY-NC）。第二阶段的文本是图注，后接同一篇文章中引用该图的句子（316 篇中有 315 篇至少有一句），只取完整句子，最多 360 个字符，即微型语言模型的上下文长度：中位数 35 个词（IQR 26–45），而单独图注只有 12 个（8–18）。每张图和每段文本都在 data/ATTRIBUTION.csv 中注明出处；data/SOURCES.md 列出来源、条款、数量、校验和与处理方式。模型与训练 DAG。CNN：三层分组卷积，41 014 个权重，六个 sigmoid 输出（多标签，正例按其稀有程度加权）。语言模型：一个两层的字符 GPT（d = 32，四个头，40 108 个权重），在所有模板上训练，标签标头以六个字母写在前面（"ce----"，接着是 "enlarged heart. pleural effusion."）。连接器（2848 个权重）：由六个概率 $q$ 和一个槽向量 $S_t$ 生成 $K = 6$ 个软 token，取代标头。分层：0 train_cnn ∥ train_lm ∥ train_monolith；1 train_connector（CNN 与语言模型冻结）；2 global_finetune ∥ train_router；3 caption_finetune（用 PMC 文本训练连接器 + 语言模型，CNN 冻结）；4 evaluate。测试检查分层与关键路径、作业图是幂零的、同一堆叠中的两个种子训练结果与各自单独训练完全相同（至 float32 舍入误差）、一个模型的损失不会把梯度传给其他模型、连接器阶段只改变连接器，以及使用固定路由器的 MoE 层与 DAG 连线在 1e-6 以内相等，梯度亦然。报告以贪心方式生成（使用键/值缓存，并与普通前向传播对照测试），再按关键词解析回标签，并处理否定（"no
  pneumothorax."）。第一阶段结果（2 个种子，139 张测试图像，取种子平均；results/stages.csv 有全部数字）。单独的 CNN：平均 AUROC 0.62（随机为 0.5），在阈值 0.5 下 micro F1 为 0.31（按训练患病率随机猜测：0.16）。把它的标签写成标头交给单独的语言模型：micro F1 0.32，因此语言模型能忠实地转述（0.90 的输出是格式正确的模板，即使是它从未见过的标签组合也一样）。拼接后的模型：连接器阶段后 micro F1 为 0.22，全局微调后为 0.20（不同运行与种子间为 0.15 到 0.25），每份报告都是格式正确的模板，0.26 到 0.27 与真实标签的模板完全一致。单体模型，即同一网络在 410 组图像–报告配对上以相同乘加次数（405 个联合步）端到端训练，对每张图像都写出 "clear lungs." 或 "normal chest."：micro F1 为 0，完全一致率 0.27（正常图像所占比例）。所以 DAG 流程明显胜过单体模型，因为它复用了 CNN 的标签监督和全部模板文本，但它并没有胜过单独的 CNN：模板报告只能重新表达分类器已知的内容，而以似然训练的拼接模型会写出概率最高的报告，在图像模棱两可时偏向“正常”，而 CNN 按稀有度加权的阈值偏向召回率，这正是 $F_1$ 所奖励的。微调的影响不大。DAG 边 = MoE 分派。把输入层视为专家混合（图像专家 = CNN + 连接器，文本专家 = token 嵌入），用按数据类型的 one-hot $G$，就能完全得到 DAG 连线的输出（已测试）。一个线性路由器在专家冻结下以稠密混合方式训练，然后以 top-1 使用（先路由，再运行所选的专家），它把每个位置都送到其模态对应的专家（两个种子的路由准确率均为 1.00），因此其报告和分数与固定路由器相同。第二阶段结果（65 张留出的 PMC 图）：很弱，正如预期。在 251 段文本上训练 150 步后，模型写出 "chest x-ray showing"，接着就是一堆乱码字母：BLEU-1 0.05，ROUGE-L 0.06，病灶关键词召回率 0，留出集交叉熵每字母 2.32 nats。给它另一张图的图像也毫无变化（2.32 nats，分数相同）：图像根本没被使用。一个总是返回同一段固定训练文本的盲基线分数反而更高（BLEU-1
  0.17，ROUGE-L 0.22）。一个 40 000 个权重的字符语言模型，无法在一分钟 CPU 时间内从约 70 000 个字符学会这种语言；用较早版本的首子句图注（中位数 6 个词）时 ROUGE-L 约为 0.28，但那些文本几乎称不上句子。DAG 机制运作正常；对第二阶段来说数据实在太少。时间。在一台 6 核桌面 CPU 上，机器空闲时训练约需 85 s，另加约 30 s 生成 GIF；当其他繁重任务同时占用机器时，测得的时间会增加到两至三倍（GIF 与 timings.csv 中显示的运行就是在这种负载下进行的，所以其秒数较大），其中图注阶段受影响最大。每条规则一个工作进程时，max-plus 关键路径是 CNN → 连接器 → 微调 → 图注 → 评估。当 torch 检测到 GPU 时代码会选用它（pixi run -e cuda）；默认环境使用 CPU 版的 torch，所以所有附带的数字都来自 CPU。试试看。更多图注步数（第二阶段改善得很慢）、不做全局微调（0 步）、更少的 CNN 步数（CNN 是一切的上限），或只用一个种子，看看种子之间的差异有多大。
meanings:
- 规则 $s$ 读取规则 $r$ 所写的内容；训练流程用 Circle of Willis 问题的解析器从 data/training.smk 解析而来
- 每条规则的层级：CNN、语言模型和单体模型在 0，连接器在 1，微调和路由器在 2，图注在 3，评估在 4
- 由实测的规则耗时算出的 max-plus 完成时间；$\max t$ 就是关键路径
- CNN 对每张图像的六个病灶概率（sigmoid，多标签）；模型轴 $m$ 变成每层一个分组卷积的各个组
- DAG 边：病灶概率加上一个槽向量 $S_t$ → 一个语言模型输入向量；$K = 6$ 个软 token 取代写出的标签标头
- 路由器：按数据类型（标头槽或字母）的 one-hot，或对位置特征学习的 softmax（以稠密方式训练，以 top-1 使用）
- 重复的 $x$ ⇒ 求和：MoE 层的合并；每个专家 $Y^x$ 只在分派给它的组上计算
- 微型 GPT 的下一字母 logits（带模型轴的 einsum 注意力，取自 chain_of_thought）
- 标头之后报告字母上的每模型损失（nats）；把 $M$ 个损失相加，让每个模型得到各自的梯度
- 重复的 $n$ ⇒ 求和：从每份生成报告解析回的标签之真阳性；micro $F_1$ 在 $f$ 上把它们合并
labels:
  seeds: 种子数（独立重复）
  steps_cnn: CNN 预训练步数
  steps_lm: 语言模型预训练步数（模板报告）
  steps_con: 连接器步数（CNN 与语言模型冻结）
  steps_ft: 全局微调步数
  steps_router: 可学习路由器步数
  steps_cap: 图注微调步数（第二阶段）
  lr_ft: 微调学习率
  lr_cap: 图注学习率
