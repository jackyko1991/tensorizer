<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A 5 by 5 grid with a glider; the 3 by 3 neighbourhood of one cell is outlined and the kernel K with ones around a central zero is shown, giving the neighbour count N = 3, so the cell is born">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- 5x5 board, 22 px cells, origin (14, 24) -->
    <g stroke="#d1d5db" stroke-width="1" fill="#ffffff">
      <rect x="14" y="24" width="110" height="110"/>
    </g>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="36" y1="24" x2="36" y2="134"/><line x1="58" y1="24" x2="58" y2="134"/>
      <line x1="80" y1="24" x2="80" y2="134"/><line x1="102" y1="24" x2="102" y2="134"/>
      <line x1="14" y1="46" x2="124" y2="46"/><line x1="14" y1="68" x2="124" y2="68"/>
      <line x1="14" y1="90" x2="124" y2="90"/><line x1="14" y1="112" x2="124" y2="112"/>
    </g>
    <!-- glider: (row, col) = (1,2), (2,3), (3,1), (3,2), (3,3) -->
    <g fill="#2563eb">
      <rect x="59" y="47" width="20" height="20"/>
      <rect x="81" y="69" width="20" height="20"/>
      <rect x="37" y="91" width="20" height="20"/>
      <rect x="59" y="91" width="20" height="20"/>
      <rect x="81" y="91" width="20" height="20"/>
    </g>
    <!-- neighbourhood of the dead cell (2, 1) -->
    <rect x="14" y="46" width="66" height="66" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="37" y="69" width="20" height="20" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="14" y="16" font-size="12" fill="#374151">board <tspan font-style="italic">X</tspan></text>
    <!-- kernel K -->
    <text x="150" y="40" font-size="12" fill="#374151">kernel <tspan font-style="italic">K</tspan></text>
    <g font-size="13" text-anchor="middle" fill="#111827">
      <rect x="150" y="48" width="60" height="60" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="160" y="66">1</text><text x="180" y="66">1</text><text x="200" y="66">1</text>
      <text x="160" y="86">1</text><text x="180" y="86" fill="#9ca3af">0</text><text x="200" y="86">1</text>
      <text x="160" y="106">1</text><text x="180" y="106">1</text><text x="200" y="106">1</text>
    </g>
    <path d="M84,80 L144,80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <text x="132" y="130" font-size="13"><tspan font-style="italic">N</tspan> = 3 → born</text>
    <text x="132" y="150" font-size="11" fill="#6b7280">B3 / S23</text>
  </g>
</svg>
