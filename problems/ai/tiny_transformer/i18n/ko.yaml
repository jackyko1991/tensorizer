source_hash: 888a525ecc84
title: 셰익스피어를 쓰는 작은 GPT
summary: 기본 텐서 연산만으로 만든 문자 단위 GPT입니다. 임베딩, einsum으로 작성한 인과적 멀티헤드 셀프 어텐션, LayerNorm, MLP, 잔차 연결로 이루어지며 nn.Transformer는 쓰지 않습니다. 『맥베스』와 『로미오와 줄리엣』으로 약 1분간 학습하면 손실이 $\ln V$($V$개 문자에 대한 균등한 추측)에서부터 떨어지고, 생성된 샘플은 횡설수설에서 단어, 이름, 운문 형태의 줄로 바뀌며, 어텐션 맵은 엄격한 하삼각 형태를 유지합니다.
notes: '구조는 Vaswani et al., "Attention is all you need"(2017)의 구조를 디코더 전용 GPT 형태로, 사전 정규화 블록과 함께 쓴 것입니다: $X \leftarrow X + \mathrm{Attn}(\mathrm{LN}\,X)$, 그다음 $X \leftarrow X + \mathrm{MLP}(\mathrm{LN}\,X)$. 테스트는 동작 원리를 정확히 확인합니다. einsum 어텐션은 PyTorch의 융합 연산 `scaled_dot_product_attention`(`is_causal=True`)과 같고, 위치 $t$ 이후의 문자를 바꿔도 $t$까지의 출력은 하나도 변하지 않으며(마스크), $A$의 각 행의 합은 1이고, 학습 전 손실은 $\ln V$이며, 모델은 배치 하나를 암기할 수 있고, 가중치 수는 $Vd + Td + L(12d^2 + 13d) + 2d + dV + V$입니다. 마스크 덕분에 한 번의 순전파로 한 구간의 $T$개 다음 문자 예측을 모두 동시에 학습하지만, 생성은 한 번에 한 문자씩 해야 합니다. 이렇게 작은 모델(가중치 113 093개, CPU로 약 1분)은 의미가 아니라 철자, 띄어쓰기, 대문자로 시작하는 화자 이름, 줄 바꿈을 배웁니다. 검증 손실은 결국 문자당 약 2 nat에 이릅니다. 히트맵은 "When shall we three meet again?"이라는 줄에서 각 층마다 바로 앞 문자에 가장 많이 주의를 기울이는 헤드를 보여 줍니다. 생물정보학의 단백질 언어 모델은 같은 어텐션을 마스크 없이 사용해 가려진 글자를 채웁니다. 텍스트: The Complete Works of William Shakespeare, Project Gutenberg eBook #100(퍼블릭 도메인)에서 가져온 『맥베스』와 『로미오와 줄리엣』으로, 전자책 머리말과 라이선스는 제거하고 둥근 따옴표는 ASCII로 바꾸었습니다. data/shakespeare.txt에 247 kB. 단계 수를 늘리거나, 모델을 넓히거나,
  온도 0.5와 1.2를 비교해 보세요.'
meanings:
- 문자 id로 나타낸 텍스트의 무작위 구간. 목표는 같은 구간을 왼쪽으로 한 문자 이동한 것입니다
- 토큰 임베딩에 학습되는 위치 임베딩을 더한 것
- 각 토큰 벡터를 채널에 대해 평균 0, 분산 1이 되도록 이동·조정한 뒤 학습되는 배율과 이동을 적용
- '반복된 $c$ ⇒ 합산: 각 헤드의 쿼리 (키와 값도 마찬가지)'
- '대각선과 그 아래는 $0$, 위는 $-\infty$: softmax 이후 한 위치는 뒤에 오는 문자를 볼 수 없습니다'
- 반복된 $k$ ⇒ 합산. 각 행은 앞선 위치 $j \le i$에 대한 확률 분포입니다
- '반복된 $j$, 그다음 $h, k$ ⇒ 합산: 각 위치가 자신의 과거에서 모은 정보로, 잔차 연결을 통해 다시 더해집니다'
- 실제 다음 문자의 $-\log p$ 평균(nat 단위). $\ln V$에서 시작합니다
labels:
  steps: 학습 단계 수
  d_model: 모델 너비 $d$
  heads: 어텐션 헤드 수 $H$
  layers: 트랜스포머 블록 수
  context: 문맥 길이 $T$
  batch: 배치 크기
  lr: 학습률
  temperature: 샘플링 온도
