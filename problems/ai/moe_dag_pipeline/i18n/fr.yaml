source_hash: 2c6e3e6a24cf
title: Un DAG de workflow est un mélange d'experts à routeur fixe
summary: 'Un chiffre MNIST $d$ et un texte de trois mots comme "now plus three" donnent la réponse $y = (d \circ k) \bmod 10$ ; aucune des deux modalités ne suffit seule. Écrit comme un workflow de style Snakemake (encode_image, encode_text, une règle fuse par opération choisie par une fonction d''entrée, classify) et exécuté par le moteur de DAG tensoriel du problème du polygone de Willis, le pipeline calcule exactement ce que calcule une couche de mélange d''experts top-1 lorsque sa matrice de routage $G$ est fixée au choix de la règle. Viennent ensuite les quatre étapes que permet un seul programme tensoriel : un routeur appris, des experts entraînés séparément puis enchaînés, une seule rétropropagation à travers tout le DAG, et une distillation en un petit réseau dense stocké en int8. Une mise en perspective qui relie des résultats connus, pas un nouveau théorème.'
notes: 'Idée. Cette mise en perspective est due à Jacky Ka Long Ko : la construction du workflow du polygone de Willis (medical/cow_workflow_dag) a montré qu''un DAG Snakemake peut être un seul programme tensoriel, et qu''un tel programme ressemble à un mélange d''experts multimodal. Énoncé précisément : un DAG de workflow est un MoE à routeur fixe ; un MoE est un DAG dont les arêtes sont choisies pour chaque entrée. C''est une mise en perspective qui relie des résultats connus, pas un nouveau théorème, et ce problème en construit une petite instance. Équivalence. data/Snakefile contient les règles encode_image, encode_text, fuse (un job par échantillon et par opération, le wildcard $op$), classify et collect ; classify lit son entrée via une fonction d''entrée, `routed`, qui désigne la sortie fuse de l''opération présente dans le texte de l''échantillon. Le moteur analyse le fichier avec le parseur de cow_workflow_dag et construit l''adjacence des jobs à partir de ses blocs de Kronecker
  ; le bloc de l''arête conditionnelle est $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$, de sorte que la matrice de routage $G$ se trouve dans l''adjacence, et seuls les $N$ jobs fuse choisis parmi les $N E$ sont nécessaires (une passe arrière booléenne, comme Snakemake élague les jobs). Exécuté niveau par niveau, un appel groupé par règle, il donne les mêmes logits qu''une couche de type Switch (tenseur de dispatch $D$ par rangs cumulés, tous les experts dans un seul einsum groupé, combinaison) avec $G$ fixée au choix de la règle et des valeurs de porte égales à 1 : identiques bit à bit en float32 et à moins de $4 \times 10^{-15}$ près en float64 sur les 1000 échantillons de test × 2 graines (les produits empilés et les produits par groupe somment dans un ordre différent), avec la même prédiction partout. C''est une identité entre deux écritures d''un même calcul, pas un résultat empirique. Routeur appris. Une porte softmax sur les caractéristiques du texte
  avec routage top-1 et la perte d''équilibrage de charge de Switch ($\alpha = 0.01$), encodeurs gelés, deux variantes côte à côte. Placée devant les propres experts fuse du workflow, la porte seule redécouvre la règle : après les 800 pas par défaut, l''opération $e$ va à l''expert $e$ pour 0.85 ± 0.03 des échantillons de test (précision 0.82 contre 0.92 avec le routeur fixe), et ce chiffre augmente encore (0.95 et 0.90 après 1500 pas lors d''un essai). Apprise conjointement avec des experts neufs, elle n''y parvient pas : le routage ne correspond pas mieux aux opérations que le hasard (0.35 avec la meilleure permutation des experts ; 1/3 signifie aucune relation), les experts restent mélangés et la précision reste à 0.40. Les experts fuse ne voient pas le texte, donc un routage qui ignore l''opération laisse à chaque expert une tâche impossible ; mais au départ aucun expert n''est meilleur sur aucune opération, si bien qu''une porte top-1 ne reçoit aucun signal pour briser la symétrie.
  Du bruit sur la porte, une initialisation de la porte 100× plus grande, un préchauffage dense (soft) de 500 pas et $\alpha = 0.1$ n''y ont rien changé lors d''essais (hors exécution par défaut). Des MoE plus grands entraînent avec succès leurs routeurs à partir de zéro ; ce jouet dit seulement qu''ici la règle fixe ne se redécouvre pas gratuitement. Étapes. (2) Entraînement séparé : chaque expert sur sa propre sous-tâche, l''expert image (un MLP) sur les étiquettes de chiffres (précision de test 0.916), l''expert texte (une couche d''attention en einsum) sur le mot du nombre (1.000), les experts fuse sur la table de 300 entrées à partir d''entrées one-hot (1.000) ; enchaîné à travers le DAG sans entraînement conjoint, le pipeline répond correctement à 0.924 des paires de test (plus que la précision sur les chiffres, car fois 0 ou fois 5 pardonnent certains chiffres erronés). (3) Ajustement fin de bout en bout, une seule rétropropagation à travers toutes les étapes : 0.924, aucun gain ;
  le goulot d''étranglement est l''expert image, et la perte conjointe n''apporte aucune information nouvelle sur les chiffres (les mêmes 3000 images). (4) Un étudiant dense (784 + 45 → 64 → 64 → 10, 57 930 poids, 0.53 des 108 766 du pipeline) distillé à $T = 4$ (perte $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 entropie croisée) : 0.85–0.86, en accord avec son enseignant sur 0.85–0.87 des échantillons et encore en progression à la fin de ses 3000 pas ; int8 par canal : 0.85–0.86, 58.9 kB au lieu de 232 kB (435 kB pour le pipeline). Temps pour les 1000 paires de test sur un seul thread CPU : moteur de DAG 90 ms, le même DAG sous forme d''une couche MoE 19 ms (le moteur construit aussi ses blocs de jobs), étudiant 3.4 ms, étudiant int8 3.5 ms (calculé avec des flottants déquantifiés, donc plus petit mais pas vraiment plus rapide ici), et un appel par job, comme le ferait un ordonnanceur sans démarrage de processus, 900–1000 ms. Ce qui ne s''ensuit pas. Seules les étapes qui sont des programmes
  tensoriels dans un même espace mémoire fusionnent sans copie et transmettent un gradient : les outils à base de fichiers (OpenFOAM, VMTK, la plupart de l''analyse de bio-images) ne le font pas, et un DAG Snakemake de ces outils reste un DAG de processus. L''accélération du polygone de Willis provenait surtout du démarrage de processus et des E/S de fichiers évités pour chaque job, pas du traitement groupé. Et l''entraînement de bout en bout n''aide que si une étape peut apprendre quelque chose que l''entraînement séparé ne lui a pas donné ; ici ce n''était pas le cas. Travaux connexes. Les Neural Module Networks (Andreas et al. 2016) assemblent un réseau par question à partir de modules choisis par un parseur, un DAG choisi pour chaque entrée ; le MoE à porte parcimonieuse (Shazeer et al. 2017) et le Switch Transformer (Fedus et al. 2021, le routage top-1 et la perte d''équilibrage de charge utilisés ici) ; les experts de modalité dans LIMoE (Mustafa et al. 2022) et Uni-MoE (Li et al.
  2024) ; le model stitching (Lenc & Vedaldi 2015 ; Bansal et al. 2021) relie des réseaux entraînés séparément par une interface apprise, comme le fait l''étape 2 via des vecteurs de probabilités ; la distillation de connaissances (Hinton et al. 2015) ; DSPy (Khattab et al. 2023) optimise de bout en bout des pipelines entiers d''appels à des modèles de langage. Pathways de Google (un billet de blog et une vision de 2021) décrit un modèle unique qui fait passer chaque tâche par les parties dont elle a besoin. Données. MNIST (LeCun, Cortes & Burges ; LeCun et al. 1998), licence CC BY-SA 3.0 : 3000 images d''entraînement (300 par chiffre) et 1000 images de test (100 par chiffre), les premières de chaque chiffre dans l''ordre du fichier, fournies en uint8 (0.7 MB, data/mnist_train.npz, data/mnist_test.npz, redistribué sous la même licence ; data/SOURCES.md indique la source, les sommes de contrôle et le traitement). Les textes sont générés : un mot d''opération (plus, minus, times), un mot de
  nombre (zero à nine) et un mot de remplissage (now, then) dans un ordre aléatoire ; les textes de test utilisent une graine fixe. Matériel et limites. Les valeurs fournies proviennent de l''exécution par défaut sur CPU (l''environnement du projet n''a pas ici de version CUDA de PyTorch ; avec environ $10^5$ poids, un GPU n''aiderait pas) : environ 75–150 s d''entraînement et de mesure plus le GIF sur une machine à 6 cœurs chargée. Toutes les graines s''entraînent ensemble sur l''axe des modèles, chacune avec ses propres mini-lots, et chaque graine est tracée. Un jouet avec un seul chiffre et trois opérations : il montre la structure, pas le comportement des grands MoE multimodaux.'
meanings:
- graphe des règles analysé depuis data/Snakefile avec le parseur de medical/cow_workflow_dag, plus la fonction d'entrée `routed` (une arête conditionnelle classify ← fuse)
- 'bloc au niveau des jobs : le produit de Kronecker de cow_workflow_dag ($I$, $\mathbb 1$, $\mathbb 1^\top$ par axe de wildcard sample, op) ; pour l''arête conditionnelle il est masqué par le routeur, de sorte que le job $n$ de classify lit le job $(n, e)$ de fuse si et seulement si $G_{ne} = 1$'
- 'le routeur du workflow : encodage one-hot du mot d''opération, trouvé par une règle (la fonction d''entrée), non appris'
- 'jobs dont dépend la cible, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$ : seulement $N$ des $N E$ jobs fuse'
- 'le moteur : les règles niveau par niveau, chacune en UN appel groupé sur ses jobs nécessaires (fuse : un appel par valeur de son wildcard $op$)'
- échantillon $n$ vers l'emplacement $c$ de l'expert $e$ (son rang parmi les échantillons routés vers lui), comme dans GShard/Switch ; capacité $C$ = plus grand groupe
- tous les experts dans un seul produit groupé ; $m$ est l'axe des modèles (graines), jamais sommé
- 'combinaison : $e$ et $c$ sommés, un seul terme non nul par échantillon, donc avec $g = G$ elle est égale à la sortie du DAG'
- 'routeur appris : softmax d''une porte linéaire sur les caractéristiques du texte ; routage top-1, sortie mise à l''échelle par $p$'
- 'équilibrage de charge de Switch : $f_e$ = fraction routée vers $e$, $P_e$ = probabilité moyenne de la porte ; 1 si équilibré et uniforme, $E$ en cas d''effondrement'
- distillation de Hinton à la température $T$ ; la perte de l'étudiant est $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ entropie croisée sur la vraie réponse
- int8 symétrique par canal de sortie, $s_o = \max_i |W_{io}|/127$ ; stocké en int8 + une échelle float32 par canal
labels:
  seeds: Graines (modèles sur l'axe des modèles)
  split_steps: Pas de l'étape 2 (chaque expert sur sa sous-tâche)
  router_steps: Pas de l'étape 1b (routeur appris)
  global_steps: Pas de l'étape 3 (ajustement fin de bout en bout)
  student_steps: Pas de l'étape 4 (distillation)
  student_hidden: Largeur de l'étudiant $H$
  temperature: Température de distillation $T$
  balance_weight: Poids d'équilibrage de charge $\alpha$
