source_hash: c0b25ec18fe5
title: ホーマン遷移と二楕円遷移
summary: 宇宙機をある円軌道から別の円軌道へ移すには、どれだけの $\Delta v$ が必要か？活力方程式（vis-viva 方程式）$v^2 = \mu(2/r - 1/a)$ によって、2 回噴射のホーマン遷移と 3 回噴射の二楕円遷移のコストを見積もり、近点・遠点での瞬間噴射を含む一つのバッチ化 RK4 積分で、各宇宙機が本当に目標軌道に乗ることを確かめる。
notes: ホーマン遷移は両方の円に接する楕円 $a = (r_1 + r_2)/2$ の半分を飛ぶ：近点で順行方向の噴射 $\Delta v_1$ を行い、$t_H = \pi\sqrt{a^3/\mu}$ 後に遠点で 2 回目の噴射 $\Delta v_2$ を行って円軌道化する。二楕円遷移はまず遠方の半径 $r_b$ まで上昇する。そこでは宇宙機は遅く、小さな噴射で軌道の反対側を $r_2$ まで持ち上げられ、到着時に減速する。所要時間ははるかに長いが、$r_2/r_1 \gtrsim 11.94$ では十分遠い $r_b$ を選べばより安くなり（極限 $r_b \to \infty$ のコストは $(\sqrt2 - 1)(v_{c1} + v_{c2})$）、$r_2/r_1 \approx 15.58$ を超えるとどの $r_b > r_2$ でも安くなる。二つの境界値はいずれも二分法で数値的に求め、2 つ目は autograd による導関数を用いる。既定値は低軌道（高度約 320 km）から静止軌道への遷移で、ホーマン遷移では約 3.9 km/s、約 5.3 時間である。中心天体を太陽にして $r_1 = 1$ AU、$r_2 = 1.524$ AU とすれば地球 → 火星となり、日心系で合計およそ 5.6 km/s、約 259 日である（実行時には常にこのケースも表示される）。実際のミッションでは地球の重力井戸から脱出する必要もあり、惑星の適切な配置を待たなければならない。ここでの軌道は円かつ同一平面上にあり、噴射は瞬間的である。実行では噴射のたびに RK4 積分を分割し、各噴射が正確に近点または遠点で行われるようにしている。
meanings:
- 中心天体の中心に対する宇宙機 $b$ の位置（km）
- 宇宙機 $b$ の速度（km/s）
- $j$ の繰り返し ⇒ 和：距離の二乗 $r_b^2$
- 中心へ向かう逆二乗の引力、$\mu = GM$
- 長半径 $a$ の軌道上、半径 $r$ における速さ。すべての $\Delta v$ はこの量二つの差
- 宇宙機 $b$ の噴射 $k$ の時刻と符号付きの大きさ（$\Delta v < 0$ は減速）
- 速度方向への瞬間噴射。二つの RK4 区間の間で適用
- 噴射の間は保存され、各噴射で次の軌道の $-\mu/2a$ へ跳ぶ
- $r_b = r_2$ での傾き。$r_2/r_1 \approx 15.58$ を超えると負になる
labels:
  body: 中心天体
  r1: 初期半径 $r_1$
  r2: 目標半径 $r_2$
  transfer: 遷移方式
  rb_ratio: 二楕円遷移の中間半径 $r_b / r_2$
