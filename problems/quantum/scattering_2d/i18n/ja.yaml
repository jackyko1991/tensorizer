source_hash: 0456b6169f6d
title: 2次元波束の散乱
summary: 2次元の時間依存シュレーディンガー方程式を、$(N, N)$ 格子上でスプリットステップ・フーリエ法により解く。ガウス波束が2つのスリットのある壁（または円板状の障害物）に当たる。torch.fft.fft2 が、ポテンシャルが対角となる $x$ 空間と、運動エネルギーが対角となる $k$ 空間を行き来する。障壁の後ろの検出スクリーンが時間積分した確率を記録する：1つの粒子の波動関数から形成される干渉パターンである。
notes: 単位 $\hbar = m = 1$、波束のエネルギー $E \approx k_0^2/2$。マスク $M$ がなければどの因子も純粋な位相なので、各ステップは厳密にユニタリでノルムは 1 に保たれる。マスクは端に達した確率を意図的に取り除く（さもなければ周期的な FFT 格子が反対側から戻してしまう）ので、表示されるノルムは後半の時刻で減少する。間隔 $d$ の2つのスリットに対して、距離 $D$ のスクリーン上の縞の間隔は $\lambda = 2\pi/k_0$ として約 $\lambda D/d$ である（スクリーンは遠方場にないので近似にすぎない）。円板を選ぶと、影の中の軸上に明るいポアソン斑点が現れる。画像の色は各フレームで規格化した平方根スケールなので、弱い散乱波も見える。障壁は灰色で描く。
meanings:
- 周期的な2次元格子上の波動関数（第1添字 $x$、第2添字 $y$）
- 障壁：$x \approx 0$ にある2つの開口をもつ高い壁、または円板
- 半ステップのポテンシャル演算子、$x$ 空間で対角
- 1ステップの運動エネルギー演算子、$k$ 空間で対角
- $x$ と $y$ の両方について和：各軸に沿った1次元フーリエ変換
- 端付近での滑らかな減衰、波が回り込まずに出ていくように
- 検出線 $x = x_\text{screen}$ 上の時間積分した確率
labels:
  barrier: 障壁
  k0: 波束の運動量 $k_0$
  slit_sep: スリット間隔 $d$（円板の直径）
  slit_width: スリット幅 $w$
  n_grid: 軸あたりの格子点数
