source_hash: adf3aca0e79d
title: 质子治疗：布拉格峰
summary: 用 RK4 同时对一整批质子能量积分 Bethe–Bloch 阻止本领 $-dE/dz \propto 1/\beta^2$。剂量在每个质子停下前急剧堆积（布拉格峰），而多个能量层的加权和能在肿瘤上形成平坦的剂量，后方几乎没有剂量。
notes: 水的常数：$K = 0.307$ MeV cm²/mol，$Z/A = 0.555$，$I \approx 75$ eV，$\rho = 1$ g/cm³；忽略壳层修正和密度修正。积分得到的射程（150 MeV → 约 15.8 cm）与 NIST PSTAR 相差约 1 %，并符合 Bragg–Kleeman 规则 $R = \alpha E^p$，其中 $p \approx 1.75$。射程歧离（$\sigma \approx 1.2\,\%$ 的 $R$）和束流能散使峰变圆；核反应仅以每厘米 1 % 的初级粒子损失来模拟，因此峰值与入射剂量之比高于真实束流。归一到相同肿瘤剂量的兆伏级 X 射线束（先建成，再按 $e^{-\mu z}$ 衰减）在入射处沉积更多剂量，并继续穿过肿瘤后方；质子则会停下。所有数值均为近似，仅供教学，不可用于临床或治疗计划。
meanings:
- 束流 $b$ 在每个深度步上的动能（RK4，所有束流一起计算）
- Bethe–Bloch $-dE/dz$，单位 MeV/cm，对整批逐元素计算
- 原始剂量：在深度区间 $k$ 中每厘米损失的能量
- 高斯射程歧离 + 能散，各行归一化
- 重复的 $k$ ⇒ 求和：模糊后的布拉格曲线
- 重复的 $k$ ⇒ 求和：由 $K$ 个能量层组成的扩展布拉格峰
- 非负最小二乘（投影梯度法），求平坦的靶区剂量
labels:
  e_min: 最低束流能量
  e_max: 最高束流能量
  n_energies: 扫描中的束流数
  target_start: 肿瘤起始深度
  target_end: 肿瘤终止深度
  n_layers: SOBP 能量层数
  energy_spread: 束流能散 $\sigma_E/E$
  i_ev: 平均激发能 $I$
