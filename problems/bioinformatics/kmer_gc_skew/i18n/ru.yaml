source_hash: 48f29505ec48
title: k-меры, GC-состав и GC-асимметрия
summary: Последовательность ДНК превращается в one-hot тензор $(L, 4)$. Подсчёт всех слов из $k$ букв — один einsum по развёрнутым окнам (одномерная свёртка), GC-состав и GC-асимметрия — суммы по окнам, а минимум кумулятивной асимметрии указывает, где начинается репликация на синтетической кольцевой хромосоме с заданными точкой начала и терминусом.
notes: 'Большинство бактериальных хромосом кольцевые и копируются из единственной точки начала репликации, при этом две репликационные вилки движутся в противоположных направлениях, пока не встретятся в терминусе. Две половины копируются по-разному (одна цепь непрерывно как лидирующая, другая — фрагментами), и за эволюционное время лидирующая цепь склонна накапливать чуть больше G, чем C. Здесь это смещение задано: от точки начала до терминуса G предпочитается с коэффициентом $(1+\text{skew})/(1-\text{skew})$, на другой половине — C. Асимметрия одного окна шумна, но накопленная сумма $S_n$ падает до самой точки начала и растёт до самого терминуса, поэтому её минимум и максимум выделяются, даже когда смещение составляет лишь несколько процентов. Реальные геномы показывают ту же V-образную форму, хотя менее чётко, потому что гены, повторы и перестройки вносят собственный состав. Два участка с низким GC на внутреннем кольце имитируют геномные островки — ДНК, полученную извне, которая часто
  сохраняет иной нуклеотидный состав. Спектр $k$-меров — отправная точка сборки генома и многих сравнений без выравнивания; для этого случайного генома его цвета просто следуют GC-составу. Попробуйте меньшую асимметрию, меньший геном или большее $k$ (больше слов, меньше подсчётов на каждое).'
meanings:
- 'позиция $n$, буква $a$ ∈ (A, C, G, T): 1, где основание — $a$'
- каждое окно из $k$ букв, без копирования памяти
- '$a \cdot 4^{k-1-j}$: слово, прочитанное как число в системе счисления по основанию 4 (AAA = 0, …, TTT = $4^k-1$)'
- 'повторяющиеся $j$ и $a$ ⇒ суммирование: индекс $k$-мера, начинающегося в $n$'
- спектр $k$-меров; подсчёты в сумме дают $L-k+1$
- 'повторяющийся $i$ ⇒ суммирование: число оснований в окне $w$ из $\ell$ оснований, по одному каждые $\Delta = \ell/2$'
- $(n_G + n_C)/\ell$ и $(n_G - n_C)/(n_G + n_C)$
- '$c = (0, -1, +1, 0)$: накопленный счёт G минус C; argmin = точка начала, argmax = терминус'
labels:
  length_kb: Длина генома $L$
  k: Длина слова $k$
  window: Окно $\ell$
  origin: Заданная точка начала (доля генома)
  skew: Смещение цепей (асимметрия)
  gc: GC-состав
  seed: Случайное зерно
