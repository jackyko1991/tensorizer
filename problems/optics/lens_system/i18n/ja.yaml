source_hash: 6345d973de84
title: 光線行列による2枚レンズ系
summary: 近軸光学は線形代数である：自由空間と薄レンズは（高さ、角度）の光線ベクトルに作用する $2\times 2$ 行列である。系全体は光線のバッチに作用する1つの連鎖した行列積であり、2枚目のレンズが1枚目から離れていくにつれて再計算される。
notes: 順序が重要である：光が最初に出会う素子が最も右の因子になる。どの因子も行列式は 1 なので、どんな配置でも $\det M = 1$ である。レンズ1による中間像がちょうどレンズ2の焦点に来たとき（$d = sf_1/(s - f_1) + f_2$）像が無限遠に飛び、反対側から虚像として戻ってくる様子を見よう。
meanings:
- 光線 $r$：$j = 0$ は高さ $h$、$j = 1$ は角度 $\theta$
- 距離 $d$ の伝搬（バッチ化した $d$ は (..., 2, 2) を与える）
- 焦点距離 $f$ の薄レンズ
- 系に素子を1つ連結する（繰り返される $j$ について和）；torch.linalg.multi_dot と同じ
- 物体から各軸上サンプル $z$ までの光線行列
- すべての $z$ でのすべての光線を1回の縮約で
- 高さが出射角によらなくなる位置
labels:
  s: 物体距離
  f1: レンズ1の焦点距離
  f2: レンズ2の焦点距離
  d_start: 初期のレンズ間隔
  d_end: 最終のレンズ間隔
  h0: 物体の高さ
  half_angle: 扇の半角
  n_rays: 扇の光線数
