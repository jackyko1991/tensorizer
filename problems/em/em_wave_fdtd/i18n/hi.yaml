source_hash: 8807e34cb0a8
title: विद्युतचुंबकीय तरंगें (FDTD)
summary: 'मैक्सवेल के दो कर्ल समीकरण Yee ग्रिड पर समय में आगे बढ़ाए जाते हैं। कर्ल को $\varepsilon_{ijk}\,\partial_j F_k$ लिखा जाता है: परिमित अंतरों की एक तालिका जिसका लेवी-सिविटा प्रतीक के साथ एक einsum में संकुचन होता है। बिंदु या रेखा स्रोत से निकली तरंग एक परावैद्युत (dielectric) ब्लॉक से टकराती है, धीमी होती है, मुड़ती है और आंशिक रूप से परावर्तित होती है, जबकि एक अवमंदक सीमा बॉक्स से बाहर जाने वाली तरंग को सोख लेती है।'
notes: 'मात्रक जिनमें $c = \varepsilon_0 = \mu_0 = 1$ और सेल आकार $\Delta x = 1$। $\mathbf E$ और $\mathbf H$ आधे सेल की दूरी पर रहते हैं ($\partial\mathbf E$ के लिए अग्र अंतर, $\partial\mathbf H$ के लिए पश्च अंतर) और बारी-बारी से अद्यतन होते हैं — यही leap-frog Yee योजना है। स्रोत "soft" है: यह $E_z$ में जुड़ता है, इसलिए परावर्तित तरंगें इसके आर-पार निकल जाती हैं। अवशोषक सीमा क्षेत्रों को बस 1 से थोड़े कम गुणक से गुणा करती है जो दीवारों की ओर धीरे-धीरे बढ़ता है; असली कोड इसकी जगह perfectly matched layer (PML) का उपयोग करते हैं। ब्लॉक के अंदर तरंगदैर्ध्य $n = \sqrt{\varepsilon_r}$ गुना छोटा हो जाता है; अभिलंब आपतन पर आयाम का $(1 - n)/(1 + n)$ भाग परावर्तित होता है।'
meanings:
- 'ग्रिड पर क्षेत्र घटक; TM मोड: केवल $E_z$, $H_x$, $H_y$ शून्येतर हैं'
- परिमित अंतरों की तालिका; 2D में पंक्ति $j = z$ शून्य है
- लेवी-सिविटा प्रतीक
- 'दोहराए गए $j, k$ ⇒ योग: हर सेल पर कर्ल'
- 'आपेक्षिक विद्युतशीलता: निर्वात में 1, ब्लॉक में $\varepsilon_\text{block}$ ($n = \sqrt{\varepsilon_r}$)'
- समय चरण $S\,\Delta x/(c\sqrt2)$; $S > 1$ अस्वीकार है क्योंकि योजना अस्थिर हो जाएगी
labels:
  source: स्रोत
  eps_block: ब्लॉक की विद्युतशीलता $\varepsilon_r$
  wavelength: निर्वात तरंगदैर्ध्य
  courant: कूरां संख्या (Courant number) $S$
  t_max: सिमुलेशन समय
