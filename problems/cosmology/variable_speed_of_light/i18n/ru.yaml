title: Переменная скорость света и проблема горизонта
summary: 'Почему реликтовое излучение (CMB) имеет одинаковую температуру во всех направлениях, если в стандартной модели ΛCDM его небо делится примерно на $10^4$ участков, никогда не обменивавшихся сигналом? Интегрирование $\chi_p = \int c\,d\ln a/(aH)$ для пакета вселенных сравнивает три ответа: никакого (ΛCDM), инфляцию ($\sim 60$ e-фолдов сжимающегося хаббловского радиуса) и спекулятивную идею переменной скорости света (VSL) Моффата (Moffat) и Альбрехта–Магейжу (Albrecht–Magueijo), где свет был примерно в $10^{26}$ раз быстрее до фазового перехода. Инфляция — общепринятое объяснение; VSL — спекулятивная альтернатива, которую поддерживает меньшинство.'
notes: 'Параметры Planck 2018 ($H_0 = 67.4$ км/с/Мпк, $\Omega_m = 0.315$, $\Omega_r = 9.1\times10^{-5}$, плоская Вселенная), последнее рассеяние при $a_\mathrm{rec} = 1/1090$. ΛCDM даёт горизонт частиц 14.2 Гпк сегодня, но лишь около 0.28 Гпк в эпоху рекомбинации, поэтому причинно связанный участок охватывает около 1.2°, и на небе их около $10^4$. Свет движется под 45° на конформной диаграмме; прошлые световые конусы двух противоположных точек CMB перекрываются, только если $\chi_p(a_\mathrm{rec}) \ge D$ (расстояние до CMB, 13.9 Гпк). Инфляция достигает этого за $N$ e-фолдов де-ситтеровского расширения, заканчивающегося при $a_*$ (сопутствующий хаббловский радиус сжимается $\propto 1/a$); VSL сохраняет стандартное расширение, но делает $c$ больше в $r$ раз до перехода при $a_*$ — плавной ступеньки шириной $w = 0.1$ e-фолда. Анимация включает оба механизма постепенно. Статус: VSL (Moffat 1993; Albrecht и Magueijo 1999) спекулятивна и является взглядом меньшинства; ей нужна система, в которой
  размерная константа может меняться (измеримы только безразмерные комбинации, такие как $\alpha = e^2/4\pi\varepsilon_0\hbar c$), её предсказания зависят от модели, и у неё нет наблюдательной поддержки. Инфляция — стандартное объяснение, тоже не подтверждённое напрямую (первичные B-моды пока не обнаружены), но согласующееся с измеренным спектром флуктуаций CMB. Ограничения (выводятся в терминал): атомные часы $\dot\alpha/\alpha = (1.0\pm1.1)\times10^{-18}$/год, реактор Окло $|\Delta\alpha/\alpha| \lesssim 10^{-7}$ за 2 млрд лет, CMB $|\Delta\alpha/\alpha| \lesssim 4\times10^{-3}$ в эпоху рекомбинации и GW170817 $-3\times10^{-15} \le (v_\mathrm{gw}-c)/c \le 7\times10^{-16}$. Переход при $a_* \sim 10^{-28}$ обходит их все — именно поэтому его так трудно проверить.'
meanings:
- сетка по $\ln a$ от значений задолго до $a_*$ до сегодняшнего дня
- 'скорость света вселенной (кадра) $m$ при каждом $a$: в $r$ раз больше $c_0$ до $a_*$'
- темп расширения, замороженный на $H(a_*)$ в течение $N$ e-фолдов инфляции
- 'сопутствующий хаббловский радиус: как далеко свет проходит за одно время расширения'
- 'кумулятивная формула трапеций вдоль $a$: сопутствующий горизонт частиц'
- угол одного причинно связанного участка на небе CMB и число участков
labels:
  log10_c_ratio: 'VSL: ранняя скорость света $\log_{10}(c_\mathrm{early}/c_0)$'
  efolds: 'Инфляция: число e-фолдов $N$'
  log10_a_star: Переход / конец инфляции $\log_{10} a_*$
  n_grid: Точки сетки по $\ln a$
