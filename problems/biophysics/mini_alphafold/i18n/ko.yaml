source_hash: 92d9eb39c4ac
title: '축소판 AlphaFold: 거리 지도에서 3D 접힘으로'
summary: 구조 예측기의 두 부분을 흉내 낸 장난감 버전으로, AlphaFold 자체가 아니다. 예측된 거리 분포도(distogram, 구간으로 나눈 불확도를 가진 Cα 쌍 거리)를 선택적으로 자기 주의(self-attention) 블록 하나로 정리한 뒤, "구조 모듈"이 여러 시작점 묶음에서 출발하는 스트레스(stress) 경사 하강법과 고전적 MDS로 이에 맞는 3D 좌표 $x_{ia}$를 찾는다. 결과는 Kabsch SVD로 목표 구조에 겹쳐지고 RMSD와 TM 유사 점수로 평가된다.
notes: 이것은 정신적으로만 AlphaFold이다. 실제 AlphaFold 2는 아미노산 서열과 관련 단백질들의 다중 서열 정렬(MSA)을 읽는데, 함께 진화하는 위치들이 어떤 잔기들이 맞닿는지 암시한다. Evoformer(MSA와 잔기 쌍에 대한 주의 블록 48개, 삼각형 갱신 포함)가 쌍 정보를 구축하고, 구조 모듈은 잔기마다 완전한 골격 좌표계(invariant point attention)와 곁사슬을 배치하며 여러 번의 재순환으로 다듬는다. 이는 Protein Data Bank의 ~170,000개 구조로 훈련되었고 신뢰도(pLDDT)를 출력한다. 여기서 "신경망"은 가짜이다. 거리 분포도는 실제 거리에 거리에 따라 커지는 잡음($\sigma_{ij} \propto d_{ij}$)을 더한 것이며, 마지막 구간을 넘는 쌍은 멀다는 것만 알려져 있다. 주의 블록은 이 지도 하나로 수백 단계 동안 훈련되므로 예측하기보다는 암기한다. 이 블록은 잔기 쌍에 대한 주의가 어떤 모습인지 보여 주며, 출력이 각 잔기를 6차원 공간의 한 점에 놓기 때문에 독립적인 잡음을 맞출 수 없어 잡음을 매끄럽게 한다. 구조 모듈은 정직한 거리 기하학이다. 거리로는 구조와 그 거울상을 구별할 수 없다. MDS와 경사 하강법은 어느 쪽 거울상 이성질체든 돌려주므로, 올바른 손대칭성은 Cα 유사 이면각의 부호(L-아미노산의 오른손 α-나선에서 약 $+50^\circ$)로 고르며 두 RMSD를 모두 출력한다. 일부 시작점은 손대칭성이 서로 다른 나선 두 개를 가진 채 갇히기 때문에 여러 무작위 시작점을 한꺼번에 접고, 스트레스가 가장 낮은 것이 선택된다. 접힘이 무너질 때까지 잡음을 올려 보거나 정제를 꺼 보라.
meanings:
- 잔기 $i$의 Cα 위치, 축 $a$; 목표는 나선 기하로 만든 합성 나선–회전–나선 구조
- 잔기 $i, j$가 거리 구간 $k$에 있을 확률 (64개 구간, 2–22 Å); 훈련된 신경망을 대신한다
- 기대 거리, $k$에 대해 합산; 분산의 역수가 신뢰도 가중치 $w_{ij}$를 준다
- '주의 로짓: 잔기 $i$가 묻고 잔기 $j$가 답한다; $e$에 대해 합산'
- 각 잔기는 다른 잔기들의 가중 혼합을 모은다, $j$에 대해 합산; $b_{ij}$는 $\hat d_{ij}$에서 온 쌍 편향
- $B$개 시작점 묶음의 모형 거리, $a$에 대해 합산
- 가중 불일치, "먼" 쌍은 밀어내기만 하고 결합은 3.8 Å로 유지; 자동 미분과 Adam으로 최소화
- 이중 중심화한 제곱 거리 = 그람 행렬 $x_{ia}x_{ja}$; 상위 3개 고유벡터가 초기 추정을 준다
- 중심화한 두 구조의 공분산, $i$에 대해 합산; 그 SVD가 최적의 고유 회전을 준다
- 겹침 후 오차; TM 유사 점수 $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$, 1 = 동일
labels:
  helix_length: 나선당 잔기 수
  noise: 거리 분포도 잡음 (10 Å에서의 σ)
  refine: 주의 기반 정제
  starts: 무작위 시작점 $B$
  steps: 경사 하강 단계
