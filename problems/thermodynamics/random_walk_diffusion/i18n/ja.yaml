source_hash: 16ad9ff3967d
title: ランダムウォークと拡散
summary: 数千個のブラウン粒子がそれぞれランダムな蹴りを受ける。1つの (time, walker, 2) テンソルとして保持すれば、ランダムウォークは1回の cumsum であり、平均2乗変位 $\langle x_i x_i\rangle$——1回の einsum——は時間に比例して $2dDt$ のように増え、粒子の雲はガウス分布として広がる。
notes: 各ステップは成分あたり分散 $2D\Delta t$ のガウス的な蹴りなので、時間 $t$ 後には各座標の分散は $2Dt$ となり、出発点からの距離の2乗の平均は $d$ 次元で $2dDt$ となる（ここでは $d = 2$）。粒子の添字 $n$ について和をとると、ランダムな雲が滑らかで予測可能な法則に変わる——それが拡散である。粒子数が有限なので、測定した MSD は相対的におよそ $\sqrt{2/N}$ 揺らぐ。シードは固定しているので図は再現可能である。単位は任意（たとえば µm と s）。
meanings:
- ステップ $s$、粒子 $n$、成分 $i$ に対する独立な標準正規分布の蹴り
- 時刻 $t$ における粒子 $n$ の位置：蹴りの累積和
- 繰り返される $n$ と $i$ ⇒ 和をとる：各時刻での平均2乗変位
- 原点を通る MSD 対 $t$ の最小二乗傾きを $2d$ で割ったもの
- 点源からの拡散方程式 $\partial_t\rho = D\,\partial_i\partial_i\rho$ の解
labels:
  n_walkers: 粒子数
  D: 拡散係数 $D$
  t_max: シミュレーション時間
  n_steps: 時間ステップ数
