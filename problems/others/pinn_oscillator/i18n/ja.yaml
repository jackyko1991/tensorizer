source_hash: cf2636b6ae13
title: 物理情報ニューラルネットワーク（PINN）：減衰振動子
summary: 小さなニューラルネットワーク $\hat x(t; w)$ が、区間の最初の 40% にあるわずか 10 個のノイズを含む測定値から、ばねにつながれた減衰する質点の運動を学習します。運動方程式 $m\ddot x + \mu\dot x + kx = 0$ を損失関数に加え、コロケーション点で自動微分により評価すると、普通のネットワークが失敗する領域でも外挿できるようになります。逆問題モードでは、未知の減衰係数 $\mu$ も推定します。
notes: 普通のニューラルネットワークは柔軟な曲線当てはめ器です。測定値だけで訓練すればそれらの点を通過できますが、最後のデータ点より先では何をすべきかを教えるものがなく、予測（破線）はずれていきます。物理情報ニューラルネットワーク（PINN）は 2 つ目の損失項として、データのない所も含め区間全体を覆うコロケーション点 $t_c$ における残差 $r_c = m\hat x'' + \mu\hat x' + k\hat x$ の二乗平均を加えます。導関数はネットワークの入力に関する厳密な導関数で、torch.autograd.grad を create_graph=True で呼んで計算するため、損失をそれらを通して重みへ逆伝播できます。$r_c \to 0$ へ追い込むと、$\hat x$ はいたる所で運動方程式の解になることを強いられます。そしてデータと初期条件 $x(0) = 1$、$\dot x(0) = 0$ が合致する唯一の解を選び出すので、ネットワークは正しく外挿します。物理は欠けているデータを補う正則化項として働きます。逆問題では減衰係数 $\mu$ が未知です。これは訓練可能なパラメータとなり、最適化手法がデータと物理が一致する値を見つけます（いったん行き過ぎてから落ち着く様子に注目）。厳密解は $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$ で、$\delta = \mu/2m$、$\omega = \sqrt{k/m - \delta^2}$ です。実用上の注意：残差は誤差のおよそ $k$ 倍の大きさなので、重み $\lambda \approx 10^{-4}$ でデータ項とのバランスを取ります（大きすぎると、残差がやはりゼロである自明解 $\hat x = 0$ に落ち着いてしまいます）。ネットワークは低い周波数から先に学ぶため、高い周波数（大きな $k$）ほど多くの反復が必要です。ここで順問題を解くのは手法を示すためだけで、ODE ソルバーのほうがはるかに高速です。PINN が真価を発揮するのは、逆問題、まばらでノイズの多いデータ、複雑な形状の領域上の偏微分方程式です。簡略化：質量は固定 $m = 1$、乱数シードは固定、最適化はコサイン減衰学習率の
  Adam（L-BFGS による仕上げなし）。
meanings:
- 入力時刻の 1 つのバッチ：コロケーション点、測定時刻、$t = 0$
- 層 $l$ の訓練可能な重み $w$：サイズ $1 \to 32 \to 32 \to 32 \to 1$
- 繰り返される $j$ ⇒ 前の層のニューロンについて和をとる
- 隠れ層の活性；$\hat x$ が 2 階導関数を持つよう滑らかな活性化関数を使う
- $\dot{\hat x}$ を与える；それに対してもう一度呼ぶと $\ddot{\hat x}$（ネットワークの厳密な導関数、差分近似ではない）
- コロケーション点での ODE 残差：$\hat x$ が物理法則に従う所でゼロ
- データとのずれ、$r_c^2$ の平均、初期条件 $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- 逆問題モード：減衰係数は訓練可能なパラメータが 1 つ増えたもので、重みと一緒に Adam で更新される
labels:
  mode: モード：$\mu$ を学習（逆問題）または既知（順問題）
  k: ばね定数 $k$
  mu: 真の減衰係数 $\mu$
  mu_guess: $\mu$ の初期推定値（逆問題モード）
  n_data: 測定点の数
  data_fraction: 測定がカバーする区間の割合
  noise: 測定ノイズ
  n_colloc: コロケーション点 $t_c$
  log10_lambda: 物理項の重み $\log_{10}\lambda$
  n_iter: 訓練の反復回数
  lr: Adam の学習率
  compare: 物理なしのネットワークも訓練する
