source_hash: 16a2fcec9827
title: 以整數規劃尋找粒子徑跡
summary: 來自一次模擬 HL-LHC 碰撞（TrackML 挑戰賽，CC BY 4.0）的真實擊中點，透過整數線性規劃連接成徑跡：選出曲率與極角一致的擊中點三元組，且每個擊中點最多使用一次。我們的張量 PDLP（帶重啟的原始–對偶混合梯度法，即 OR-Tools 與 cuOpt 內部所用的 LP 方法）在稀疏張量上即時求解 LP 鬆弛，再進行捨入與修復。結果與一個手寫的匈牙利演算法（Kuhn–Munkres）基準，以及 HiGHS、Gurobi 和 scipy 的離線執行結果比較：目標值差距、效率、假徑跡率、官方 TrackML 分數，以及執行時間的標度律 $t \propto N^k$。
notes: '現況: 這是一次工具比較，而非未解決的問題。此 ILP 是一個集合打包問題（一般而言為 NP 困難）；PDLP 是一階 LP 方法，捨入得到的是啟發式整數解，而非經認證的最優解，因此我們一律報告與精確最優解之間的差距。即使沒有精確求解器，PDLP 的對偶界也能給出經認證的上界。方法. 候選線段連接相鄰層上的擊中點，條件是一條來自束流線、$p_T \ge p_{T,\min}$ 的徑跡能夠將它們連起來。三元組透過共用的中間擊中點連接兩條線段，並得分 $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$（只保留 $s_t > 0$）。ILP 選取三元組 $x_t$ 與線段 $y_e$：每個擊中點最多有一條被選中的進入線段和一條離開線段，因此徑跡是鏈。一條被選中的線段在每一側最多延續到一個被選中的三元組，而每條線段的成本為 $\lambda = 0.1$。其 LP 鬆弛（$0 \le x, y \le 1$）由我們的 PDLP（Applegate et al. 2021）求解：採用 Ruiz 縮放的 PDHG、基於 KKT 條件重啟至平均值，以及原始權重更新，以 torch.sparse 撰寫，因此可在 CPU 或 CUDA 上執行。匈牙利基準對每一對層求解一次精確的線性指派（先處理中間一對，再向內與向外，三元組成本依據目前已建成的鏈）。這是一個能在多項式時間內精確求解的二部圖匹配，但它一次只決定一對層，而 ILP 則是全域地權衡整條鏈。這就是它的徑跡會不同的原因。資料. TrackML Particle Tracking Challenge（CERN / Kaggle 2018），訓練事例 1000（200 次堆積碰撞）：Zenodo 紀錄 4730167，doi:10.5281/zenodo.4730167，授權 CC BY 4.0（Salzburger、Innocente、Vlimant、Rousseau et al.）。資料裁切至像素桶部（volume 8，4 層），且 $|\eta| < 1$：11 519 個擊中點、2 452 個粒子及 6% 雜訊，另附官方的逐擊中點權重。離線基準測試（data/solver_benchmark.csv）在 AMD Ryzen
  5 5600G（1 個執行緒）上進行：透過 scipy 1.18.1 呼叫 HiGHS（milp、linprog）、透過 gurobipy 使用有規模限制授權的 Gurobi 13（最多 2000 個變數與 2000 條約束，因此只能做 $\Delta\phi \le 30°$）、scipy 的 linear_sum_assignment，以及我們在 CPU 與 NVIDIA GTX 1080 Ti 上的 PDLP。NVIDIA cuOpt 26.10 已安裝在 WSL 中但無法執行：其核心程式是為計算能力 7.0（Volta）及更新的架構編譯的，而 1080 Ti 為 6.1（cudaErrorNoKernelImageForDevice），因此予以略過，沒有任何數據。引用的當前最佳結果列於 data/trackml_sota.csv。結論. 在全部八個扇區（5° 至 360°，151 至 11 519 個擊中點）上，LP 鬆弛都是緊的：HiGHS 的 LP 最優值與 MILP 最優值相等，誤差在 $10^{-13}$ 以內。我們的 PDLP 加修復每次都達到相同的最優值（差距低於 $10^{-9}$），所選的三元組與 HiGHS 和 Gurobi 完全相同（0 個不同）。這是經驗結果，並無保證：集合打包是 NP 困難的，而此處四層的鏈結構使 LP 保持緊緻。由於分數是連續值，出現完全平手的可能性很低，因此達到最優解的求解器會給出一致的結果。在執行過程中，約三分之一的 PDLP 值是分數值，其中許多接近 $\tfrac12$，對應相互競爭的三元組幾乎平手的情形（例如重疊模組中的雙重擊中）；隨著 PDLP 收斂，它們會逐漸定下來。匈牙利演算法的鏈比最優值低 0 至 2.2%（5 至 651 個三元組不同），且與 scipy 的指派目標值完全一致（這是對我們匈牙利演算法的檢驗）。完整桶部子集（360°）：ILP 求解器的效率為 93.1%、假徑跡率為 13.0%，匈牙利演算法則為 90.9% 與 16.2%；TrackML 分數為 0.495 對 0.482。對可重建粒子而言，完美的徑跡重建器在此可得 0.618；引用的完整事例當前最佳結果為 0.88 至 0.94（Mikado 0.944，耗時 0.56 s）。在 $N \ge 1000$ 個擊中點範圍內的標度律：HiGHS
  MILP $N^{1.14}$、HiGHS LP $N^{1.01}$、我們的 PDLP 在 CPU 上 $N^{0.92}$、在 GPU 上 $N^{0.36}$（在 10 000 個變數時啟動開銷仍佔主導，因此 1080 Ti 目前還不更快）、我們的匈牙利演算法 $N^{2.14}$（最壞情況 $O(n^3)$；稀疏且經篩選的成本使增廣路徑保持很短）、scipy $N^{1.57}$。Gurobi 只有在 860 個擊中點以內才符合其規模限制（在該範圍內為 $N^{1.04}$）。在這些規模下，HiGHS 與 PDLP 一樣快；一階方法要在大得多的 LP 上才划算。在小扇區上，匈牙利演算法找到的粒子略多（30° 時為 97.4% 對 94.8%）：ILP 目標函數只是代理指標，而非物理指標。注意事項. 我們的實例是一個 4 層的桶部扇區，因此徑跡最多只有 4 個擊中點，且沒有端蓋：比挑戰賽的完整事例更容易，也不相同。TrackML 分數的比較僅供參考，並非同等條件下的比較：子集約 40% 的分數權重落在低於 $p_T$ 截斷、或在截斷範圍內少於 3 層的粒子上，而我們的計時只涵蓋十分之一個事例，且不包括讀取資料與建立候選。實際的徑跡重建器（ACTS 以及各實驗自己的程式）使用組合式卡爾曼濾波器，而圖神經網路（Exa.TrkX）是主要的機器學習方法；沒有人會對每個事例執行一次 MILP。'
meanings:
- 4 層像素桶部上的真實 TrackML 擊中點，裁切至一個 $\Delta\phi$ 扇區：即問題規模
- 相鄰層上滿足 $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ 且 $|z_0| \le 150$ mm 的擊中點對，一次處理所有點對
- 通過束流線與兩個擊中點的圓的曲率
- 三元組共用中間擊中點；螺旋線在兩半上具有相同的 $\kappa$ 與 $\theta$，因此 $s_t$ 隨不匹配程度而下降
- 擊中點互斥列（一條進入線段、一條離開線段）與連續性列；重複的 $v$ ⇒ 在每個乘積中加總
- 在經 Ruiz 縮放的 LP 上執行 PDHG，配合平均、重啟與原始權重；每次迭代兩次稀疏矩陣–向量乘法
- 依 LP 值對線段排序，以平行輪次接受無衝突的線段，並修剪成本高於得分的鏈端
- 帶勢函數的 Kuhn–Munkres：每對層一次精確的線性指派，再串接成徑跡
- 官方 TrackML 分數：所屬徑跡包含某粒子 > 50% 擊中點、且 > 50% 擊中點來自該粒子的那些擊中點的權重總和
labels:
  dphi: 扇區寬度 $\Delta\phi$（問題規模）
  pt_min: 最小橫向動量 $p_{T,\min}$
  max_iter: PDLP 最大迭代次數
  digits: PDLP 目標精度 $10^{-k}$，$k$ =
  check: 兩次重啟檢查之間的迭代次數（每次一幀）
