source_hash: e53e4d6ab9fa
title: 'Чёрные дыры Керра–Ньюмена: горизонты, эргосфера и голые сингулярности'
summary: Самая общая чёрная дыра общей теории относительности с электромагнетизмом, с массой $M$, спином $a$ и зарядом $Q$. Для целой пакетной сетки $(M, a, Q)$ код вычисляет горизонты $r_\pm$, эргосферу, увлечение систем отсчёта, а также экваториальные ISCO и фотонные орбиты (производные метрики через autograd). Анимация проводит спин и заряд до экстремальности $a^2 + Q^2 = M^2$ и дальше, где горизонт исчезает и кольцевая сингулярность оказалась бы открытой, что, согласно (недоказанной) гипотезе космической цензуры, природа запрещает.
notes: 'Единицы $G = c = 1$: длины в $GM/c^2$, спин $a = J/(Mc)$, заряд в геометризованных единицах. Установлено (классическая ОТО): метрика Керра–Ньюмена (Kerr–Newman; Newman et al. 1965) решает уравнения Эйнштейна–Максвелла, её горизонты — корни $\Delta$, а эргосфера, где ни один наблюдатель не может оставаться в покое, лежит между $r_+$ и $r_E(\theta)$, касаясь горизонта на полюсах. Внутри неё увлечение систем отсчёта заставляет всё вращаться вместе с дырой: зелёная кривая падает с нулевым моментом импульса и всё равно закручивается. Прямые орбиты прижимаются к дыре: для Керра ISCO смещается от $6M$ при $a = 0$ к $M$ (прямая) и $9M$ (обратная) при $a = M$, что совпадает с Bardeen, Press и Teukolsky (1972), а ISCO экстремальной дыры Райсснера–Нордстрёма (Reissner–Nordström) равна $4M$. При $a^2 + Q^2 > M^2$ формулы всё ещё дают метрику, но без горизонта и с голой кольцевой сингулярностью при $r = 0$, $\theta = \pi/2$ (показана красным). Слабая гипотеза космической цензуры Пенроуза утверждает,
  что гравитационный коллапс никогда её не порождает; в общем случае она не доказана (известные контрпримеры требуют тонко подобранных начальных данных или дополнительных измерений), а попытки перекрутить или перезарядить экстремальную дыру, бросая в неё частицы, по-видимому, проваливаются, если учесть эффекты возмущений второго порядка (Sorce и Wald 2017). У реальных дыр $Q \approx 0$ (заряд быстро нейтрализуется), а измеренные спины (примерно до $0.95$–$0.99\,M$) остаются ниже экстремальности. На экваториальной панели в качестве радиуса используется $r$ Бойера–Линдквиста (Boyer–Lindquist); там $\varphi$ падающей зелёной кривой неограниченно растёт у $r_+$ — это координатный эффект.'
meanings:
- все комбинации массы, спина и заряда одним пакетом, $G = c = 1$
- корни $\Delta = 0$; NaN при $a^2 + Q^2 > M^2$ (голая)
- статический предел $g_{tt} = 0$, broadcasting кадры $\times$ полярные углы
- вращательный блок $(t, \varphi)$ метрики Бойера–Линдквиста
- угловая скорость наблюдателя с нулевым моментом импульса; $\Omega_H = a/(r_+^2 + a^2)$ на горизонте
- производные метрики на радиальной сетке через autograd
- угловая скорость и энергия круговых орбит; ISCO в минимуме $E$, фотонная орбита там, где орбите нужна скорость $c$
- поверхностная гравитация, $T_H = \kappa/2\pi$; ноль для экстремальной дыры
labels:
  angle: Угол смешивания $\psi$ ($0°$ чистый спин, $90°$ чистый заряд)
  chi_max: Развёртка до $\sqrt{a^2 + Q^2}/M$
  frames: Кадры
  grid: Точек сетки на ось в пакетном обзоре $(a, Q)$
