source_hash: a7f6ff1f025f
title: 분산성 물결파
summary: '긴 파동이 짧은 파동보다 빠른 깊은 물 위의 파동묶음: $\omega = \sqrt{g k}$. 각 푸리에 모드는 위상만 돌리므로, 임의 시각의 파동묶음은 FFT 한 번, 곱셈, 역 FFT 한 번이며 모든 시각에 대해 한꺼번에 계산합니다. 마루는 포락선 속력의 두 배로 포락선을 통과해 지나갑니다.'
notes: 선형 깊은 물 중력파(깊이가 파장보다 훨씬 크고, 표면 장력이 없으며, 기울기가 작음). $\omega \propto \sqrt k$이므로 군속도 $d\omega/dk$는 위상 속도 $\omega/k$의 정확히 절반입니다. 빨간 마루가 초록 포락선 봉우리를 앞지르고, 앞쪽에서 사라지고, 뒤쪽에서 태어난 새 마루로 바뀌는 것을 지켜보세요(빨간 점이 파장의 정수배만큼 뒤로 뜁니다). 긴 파동이 더 빨리 진행하므로 파동묶음은 천천히 퍼지고, 앞쪽에는 뒤쪽보다 긴 파동이 옵니다(처프). FFT 때문에 상자는 주기적입니다. 각 모드는 위상만 돌리므로 $\sum|\hat a_k|^2$(파스발 정리에 따른 파동 에너지)이 정확히 보존됩니다.
meanings:
- '복소 파동묶음: 가우스 포락선 곱하기 $e^{ik_0x}$'
- 처음 파동묶음의 푸리에 진폭
- 모든 모드에 대한 깊은 물 분산 관계
- 브로드캐스팅으로 모든 시각의 모든 모드 (정확함, 시간 적분 없음)
- '반복된 $k$ ⇒ 합: 모든 시각에 대해 실공간으로 되돌림'
labels:
  wavelength: 반송파 파장 $2\pi/k_0$
  width: 파동묶음 폭 $\sigma$
  t_max: 시뮬레이션 시간
