source_hash: e1ad81688a05
title: 夫琅禾费衍射：二维傅里叶变换
summary: 在远场，孔径的衍射图样就是其透射函数的二维傅里叶变换。一次调用 torch.fft.fft2 就把方孔、圆孔、双缝和光栅变成各自的远场图样，孔径变大时艾里环随之缩小。
notes: 孔径平面内的长度以尺寸为 $\Delta x$ 的像素计；变换后的频率像素 $(k, l)$ 对应方向 $\sin\theta = \lambda k/(N\Delta x)$。因此圆孔在 $\sin\theta = 1.22\,\lambda/D$ 处的第一暗环距中心 $1.22\,N/D$ 个频率像素（虚线圆）。孔径大则图样小：宽函数的变换是窄的。einsum 形式与 fft2 是同一个变换，只是复杂度为 $O(N^3)$ 而非 $O(N^2\log N)$。
meanings:
- 掩模透射率：1 = 透光，0 = 不透光；行 $a = y$，列 $b = x$
- 离散傅里叶变换矩阵
- 重复的 $a$ 和 $b$ ⇒ 求和：沿 $y$ 和沿 $x$ 各做一次一维变换
- 用快速傅里叶变换做同一变换，零频移到中心
- 远场强度，显示为 $\log_{10}(I/I_{\max})$
- 直径为 $D$ 的圆孔的第一暗环，以频率像素计
labels:
  size_min: 起始孔径尺寸 $D$
  size_max: 最终孔径尺寸 $D$
  frames_per_aperture: 每种孔径形状的帧数
