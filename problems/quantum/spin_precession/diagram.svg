<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Bloch sphere with spin vector s tilted from the vertical, precessing around the static field B0 along z at the Larmor frequency omega">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <circle cx="128" cy="86" r="56" fill="#93c5fd" fill-opacity="0.18" stroke="#374151" stroke-width="1.8"/>
    <path d="M72,86 A56,15 0 0 1 184,86" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M72,86 A56,15 0 0 0 184,86" fill="none" stroke="#374151" stroke-width="1.3" />
    <line x1="128.0" y1="142.0" x2="128.0" y2="24.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M90.5,44.4 A37.5,10 0 0 1 165.5,44.4" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M165.5,44.4 A37.5,10 0 0 1 90.5,44.4" fill="none" stroke="#f59e0b" stroke-width="2" />
    <path d="M114.0,54.4 L124.0,54.4" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-o)"/>
    <line x1="128.0" y1="86.0" x2="160.5" y2="49.4" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-b)"/>
    <circle cx="128" cy="86" r="3" fill="#374151"/>
    <text x="158.451" y="73.3839" font-style="italic" fill="#1e40af">s</text>
    <text x="110" y="72.3839" font-style="italic" fill="#b45309" font-size="13" text-anchor="end">ω</text>
    <line x1="32.0" y1="128.0" x2="32.0" y2="40.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="40" y="52" font-style="italic" fill="#b91c1c">B<tspan font-size="10" dy="3" font-style="normal">0</tspan></text>
    <text x="134" y="28" font-style="italic" fill="#4b5563" font-size="12">z</text>
  </g>
</svg>
