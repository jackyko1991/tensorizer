title: 马尔可夫 Mpemba 效应
summary: 热水会比温水结冰更快吗？对于在格点势中以 Metropolis 速率跳跃的粒子，答案是肯定的。主方程 $\dot p = W p$ 只需对角化一次，用一次 einsum 把每个初始温度投影到最慢模式上，而慢模式振幅 $a_2$ 为零的热起点比更冷的起点以指数级更快的速度弛豫。
notes: 单位：$k_B = 1$，尝试速率为 1。热浴温度为 $T_b$，系统从温度 $T_0$ 的平衡态出发。若跳跃满足细致平衡 $W_{ij}\pi_j = W_{ji}\pi_i$，则 $W$ 相似于一个对称矩阵，因此其所有本征值都是实数且 $\le 0$，其稳态为玻尔兹曼分布 $\pi$。短时间后只剩下最慢模式，$p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$，因此 $\lvert a_2\rvert$ 较小的起点最终更接近平衡，无论其温度如何。由于 $a_2(T_0)$ 不必单调，更热的起点可以超过较温的起点（马尔可夫 Mpemba 效应）。在使 $a_2 = 0$ 的特殊温度 $T^*$ 处，慢模式完全消失，弛豫以更快的速率 $\lambda_3$ 进行（强效应）。在这个势中，这种形状来自势阱之间的竞争。低 $T_0$ 时，深而窄的势阱容纳了大部分概率。中等 $T_0$ 时，宽而浅的势阱凭借熵胜出。高 $T_0$ 时，抬高的平台被填充，因此左侧势阱的份额重新回升，并在 $T^*$ 处越过其平衡值。该理论来自 Lu & Raz（PNAS, 2017）。Kumar & Bechhoefer（Nature, 2020）用光学塑形的双势阱中的胶体小球观察到了该效应，包括强效应版本。Kumar, Chétrite & Bechhoefer（PNAS, 2022）随后观察到了逆效应（反常升温）。最近在囚禁离子实验中也报告了量子类比。这个格点是那些系统的玩具版本。试试提高 $T_b$：约 $1.4$ 以上交叉消失。
meanings:
- 格点 $i$ 的阶梯能量：平台、深而窄的势阱、势垒、宽而浅的势阱
- 链上最近邻为 1，否则为 0
- 跳跃 $j \to i$ 的速率；对角元使每列之和为零
- 每个初始温度 $T_{0,b}$ 下的玻尔兹曼态，一批起点
- 重复的 $j$ ⇒ 求和：所有起点同时计算的主方程
- 对称化矩阵 $\Pi^{-1/2} W \Pi^{1/2}$ 的 eigh；$\lambda_1 = 0$ 为平衡，$\lambda_2$ 为最慢衰减
- 重复的 $i$ ⇒ 求和：每个起点与每个模式的重叠
- 重复的 $k$ ⇒ 求和：每个时刻的精确解
- 到平衡的 Kullback–Leibler 距离，$\sum_i p_i \ln(p_i/\pi_i)$
labels:
  T_bath: 热浴温度 $T_b$
  barrier: 势垒高度 $U_\text{bar}$
  T_hot: 热起点 $T_\text{hot}$
