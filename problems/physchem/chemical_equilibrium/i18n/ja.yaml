source_hash: aa144f7ad9f7
title: 化学平衡とルシャトリエの原理
summary: 反応はどこで止まるのか？$\Delta G^\circ = -RT\ln K$ から、気相反応（$\mathrm{N_2O_4 \rightleftharpoons 2\,NO_2}$ またはハーバー反応 $\mathrm{N_2 + 3H_2 \rightleftharpoons 2NH_3}$）の平衡進行度 $\xi$ を、数百の温度と圧力について $Q(\xi) = K$ の二分法で一度に求め、圧力、温度（ファント・ホッフ）、生成物の添加によるルシャトリエの移動を示す。
notes: $Q$ は混合物が今どこにいるか、$K$ はどこへ行きたいかを表す：$Q < K$ なら反応は正方向に、$Q > K$ なら逆方向に進む。$\ln Q$ は進行度 $\xi$ とともに単調に増加する（生成物がなければ $-\infty$、反応物がなければ $+\infty$）ので、平衡は $\ln Q(\xi) - \ln K$ のただ一つの根であり、二分法はすべての条件についてそれを一度に見つける。ルシャトリエの原理は式から自然に出てくる。圧力：理想気体の活量では $\Delta\nu = \sum_i \nu_i$ として $Q = K_x\,(P/P^\circ)^{\Delta\nu}$ なので、$P$ を上げると気体分子の少ない側が有利になる（$\mathrm{N_2O_4}$ の解離は減り、$\mathrm{NH_3}$ は多くできる）。温度：$\ln K = -\Delta H^\circ/RT + \Delta S^\circ/R$ なので、吸熱反応（$\mathrm{N_2O_4}$：温めると $\mathrm{NO_2}$ の褐色が濃くなる）では $K$ は $T$ とともに増え、発熱反応（アンモニア）では減る。生成物の添加：$Q$ は $K$ を超えて跳ね上がり、生成物の一部が反応物に戻るが、すべてではない。$\mathrm{N_2O_4}$ では結果を手で確かめられる：$K = 4\alpha^2 P/((1-\alpha^2)P^\circ)$ から $\alpha = \sqrt{K/(K + 4P/P^\circ)}$。熱力学データは 298 K における教科書的な近似値（$\mathrm{N_2O_4}$ では $\Delta H^\circ \approx +57.2$ kJ/mol、$\Delta S^\circ \approx +176$ J/(mol K)、アンモニアでは $\approx -92.2$ kJ/mol と $\approx -199$ J/(mol K)）で、$T$ によらず一定とし、気体は理想気体として扱う。どちらの単純化も 700 K、100 bar でのアンモニア収率をいくらか過大評価する（実測ではおよそ 20 % $\mathrm{NH_3}$ で、約 30 % ではない）。ハーバー反応は室温では強く有利だが、そこでは遅すぎる：プラントは鉄触媒を用いて約
  700–750 K、150–300 bar で運転し、収率を速度と引き換えにしている。ハーバー反応で T = 700 K を試してみよう。
meanings:
- 化学量論数：$\mathrm{N_2O_4 \rightleftharpoons 2NO_2}$ では $-1, 2$；アンモニアでは $-1, -3, 2$
- すべての（温度、圧力）の組を一つのバッチ添字 $b$ に平坦化
- 近似的で温度に依存しない $\Delta H^\circ$、$\Delta S^\circ$ による $-\Delta G^\circ/RT$
- 各化学種のモル数；外積で、何も和をとらない
- 全モル数；$j$ について和
- $\ln Q$：化学種の添字 $i$ について和
- どの量も負になってはならない：二分法の区間
- 二分法、すべての条件をまとめて：$\ln Q - \ln K$ が符号を変える半分を残す
- $1/T$ に対する $\ln K$ の傾き
labels:
  reaction: 反応（$\mathrm{N_2O_4}$ またはアンモニア）
  T: 温度 $T$（黒い曲線）
  P: 生成物添加テストの圧力 $P$
  add_product: 添加する生成物
