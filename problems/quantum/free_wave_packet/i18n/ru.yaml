source_hash: 1bc9d739c88e
title: Свободный волновой пакет
summary: 'Для свободной частицы шаги по времени вообще не нужны: в импульсном пространстве уравнение Шрёдингера решается умножением каждой фурье-компоненты на свою фазу $e^{-ik^2t/2}$. Одно БПФ, одно умножение и одно обратное БПФ дают $\psi$ в любой момент — сразу для всех моментов в виде тензора $(T, N)$. Пакет дрейфует с групповой скоростью $k_0$ и расплывается, потому что его разные импульсы движутся с разными скоростями.'
notes: 'Единицы $\hbar = m = 1$. $\sigma$ — стандартное отклонение $\lvert\psi\rvert^2$ (так что $\psi \propto \exp(-(x - x_0)^2/(4\sigma_0^2) + ik_0x)$). Точные результаты: $\langle x\rangle = x_0 + k_0 t$ (групповая скорость $v_g = dE/dk = k$) и $\sigma(t) = \sigma_0\sqrt{1 + (t/(2\sigma_0^2))^2}$: узкий пакет имеет широкий разброс импульсов и поэтому быстро расплывается. Штриховые линии отмечают $\langle x\rangle \pm \sigma(t)$ по этой формуле. Рябь $\operatorname{Re}\psi$ движется с фазовой скоростью $k/2$, вдвое медленнее огибающей. Сетка периодическая, поэтому пакет, ушедший за один край, возвращается с другого.'
meanings:
- гауссиан ширины $\sigma_0$, движущийся с импульсом $k_0$
- 'повторяющийся $x$ ⇒ суммирование: переход к базису плоских волн $e^{ikx}$'
- 'фаза свободной частицы для каждой моды $k$ в каждый момент $t$ (суммирования нет: внешнее произведение)'
- обратно в $x$-пространство, все $T$ снимков за один вызов
- центр и ширина $\lvert\psi\rvert^2$ в каждый момент
labels:
  k0: Импульс пакета $k_0$
  sigma0: Начальная ширина $\sigma_0$
  t_max: Время моделирования
