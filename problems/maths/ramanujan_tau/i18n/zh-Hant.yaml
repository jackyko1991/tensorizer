source_hash: 242e43034f00
title: 拉馬努金的 $\tau(n)$ 與 Sato–Tate 定律
summary: 把判別式模形式 $\Delta(q) = q\prod_n (1-q^n)^{24}$ 展開成張量冪級數，得到拉馬努金的 $\tau(n)$；透過對一批質數取餘數，可精確算到 $n \sim 10^5$–$10^6$。檢驗 $\tau$ 是積性函數並滿足 Hecke 遞推式、$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$、$|\tau(p)| \le 2p^{11/2}$（Deligne 定理，1974），並觀察正規化的值 $\tau(p)/2p^{11/2}$ 逐漸填滿 Sato–Tate 半圓分佈（對 $\Delta$ 而言自 2011 年起已是定理）。程式對這些定理作數值驗證。
notes: 拉馬努金（1916）研究了 $\Delta(q) = q\prod(1-q^n)^{24}$ 的係數 $\tau(n)$（它是唯一的權為 12 的正規化尖點形式），並猜想了三件事：$\tau$ 是積性的；它滿足 $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$；以及 $|\tau(p)| \le 2p^{11/2}$。Mordell 在 1917 年證明了前兩項，這是後來發展為 Hecke 理論的早期例子。這個上界就是 $\Delta$ 的拉馬努金猜想（一般情形稱為 Ramanujan–Petersson 猜想）：Deligne 於 1974 年作為他證明韋伊猜想的推論證明了它，因此它是定理。拉馬努金還證明了同餘式 $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$，它源於 $691$ 整除伯努利數 $B_{12}$ 的分子。記 $\tau(p) = 2p^{11/2}\cos\theta_p$，Sato–Tate 猜想斷言角度 $\theta_p$ 服從 $\frac{2}{\pi}\sin^2\theta\,d\theta$ 分佈，也就是 $x_p = \cos\theta_p$ 服從半圓分佈 $\frac{2}{\pi}\sqrt{1-x^2}$，其各階矩為 $1/4$、$1/8$、$5/64$（卡塔蘭數除以 4 的冪）。對 $\Delta$ 而言，這由 Barnet-Lamb、Geraghty、Harris 與 Taylor（2011）證明。直方圖收斂得很慢，就像獨立抽樣的樣本一樣。Lehmer 猜想（$\tau(n)$ 永不為零）至今仍未解決；它已在遠超此範圍的地方被驗證，程式也沒有找到任何零值。數值方面：$\tau(n)$ 的增長約為 $n^{11/2}$，因此對整個級數做 float64 FFT 的絕對誤差約為最大係數的 $10^{-16}$ 倍，足以淹沒 $\tau(2) = -24$（有測試展示這一點）。因此程式改為同時對十個左右的質數精確計算級數的餘數，每個質數佔張量的一列，再用中國剩餘定理重建。趣味：拉馬努金注意到……（Ramanujan noticed that…）$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$；$1729
  = 1^3 + 12^3 = 9^3 + 10^3$；以及（僅在正則化的意義下）$1 + 2 + 3 + \dots$「$= -1/12$」：這個級數是發散的，$-1/12$ 是解析延拓後的 zeta 函數的值 $\zeta(-1)$。
meanings:
- 雅可比恆等式 $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$：只有 $O(\sqrt N)$ 個非零係數
- 重複的 $j$ ⇒ 求和：把截斷級數的乘積寫成 Toeplitz 矩陣乘以向量，對較小的 $N$ 在 int64 中精確
- 連續平方三次得到 24 次方
- 對 $M$ 個質數模數同時用 FFT 計算同樣的乘積，再四捨五入為精確餘數（每個 $m^2 N \le 2^{42}$）
- 使用平衡位數的中國剩餘定理，使負值還原後仍為負值
- 同時處理所有滿足 $mn \le 600$ 的互質數對 $1 < m < n$
- 每個滿足 $dj \le N$ 的因數對 $(d, j)$ 把 $d^{11}$ 加到 $n = dj$ 上
- 質數處的正規化值，由 Deligne 定理可知落在 $[-1, 1]$ 內
labels:
  n_max: 質數與 $\tau(n)$ 的計算上限 $N$
