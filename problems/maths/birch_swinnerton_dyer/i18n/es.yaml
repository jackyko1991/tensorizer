source_hash: 52a00886e77c
title: 'Birch y Swinnerton-Dyer: contar puntos módulo p'
summary: Contar a la vez los puntos de cinco curvas elípticas de rango 0 a 4 sobre $\mathbb F_p$ para todos los primos hasta $X$, ver cómo los productos $\prod_{p\le X} N_p/p$ crecen como $(\log X)^r$, tal como observaron por primera vez Birch y Swinnerton-Dyer, y calcular $L(E, s)$ en $s = 1$, donde se anula con un orden igual al rango. La conjetura de que esto ocurre siempre está abierta; solo está demostrada para rango analítico 0 y 1.
notes: 'Una curva elíptica $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ sobre $\mathbb Q$ tiene un grupo de puntos racionales finitamente generado $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ (Mordell 1922); el rango $r$ es difícil de calcular. A principios de los años sesenta, Birch y Swinnerton-Dyer contaron puntos módulo primos en el ordenador EDSAC y observaron que $\prod_{p \le X} N_p/p$ crece como $(\log X)^r$: más puntos racionales obligan a que haya más puntos módulo $p$. Conjeturaron que $L(E, s)$, construida a partir de los $a_p$, se anula en $s = 1$ con orden exactamente $r$, con coeficiente principal $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$. Es uno de los problemas del Premio del Milenio del Instituto Clay y está abierto. Lo demostrado: si el rango analítico es 0 o 1, el rango coincide con él y Ш es finito (Gross y Zagier 1986, Kolyvagin 1989), usando la modularidad (Wiles, Taylor–Wiles 1995, Breuil–Conrad–Diamond–Taylor 2001), que es
  lo que permite siquiera prolongar $L(E, s)$ hasta $s = 1$. Para rango analítico $\ge 2$ no se conoce nada general. Las cinco curvas son las de menor conductor con rangos 0 a 4 (11a1, 37a1, 389a1, 5077a1 y 234446a1 en las tablas de Cremona). Aquí: las trazas cumplen la cota de Hasse $|a_p| \le 2\sqrt p$; para 11a1 coinciden con los coeficientes de la forma modular $\eta(q)^2\eta(q^{11})^2$ (comprobado); los signos de la ecuación funcional son $\varepsilon = (-1)^r$; la primera derivada no nula en $s = 1$ es la $r$-ésima para cada curva, y $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$ y $L''''''(E,1)/6 = 1.7318499\ldots$ coinciden con la LMFDB. Para 11a1 la fórmula completa se verifica: $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$. Un cero numérico de una derivada es un indicio, no una prueba de que se anule. Los productos parciales son la heurística original: Goldfeld (1982) demostró que, si de verdad se comportan
  como $C(\log X)^r$, entonces $r$ es el rango analítico y la hipótesis de Riemann se cumple para $L(E, s)$; por tanto, su convergencia es en sí misma conjetural, y lenta. Las pendientes ordenan correctamente los rangos 0 a 3 en $X = 2\times 10^4$, pero la curva de rango 4 sigue quedándose por debajo de su rango en $X = 3\times 10^4$. La distribución de Sato–Tate de $a_p/2\sqrt p$, el semicírculo $\frac{2}{\pi}\sqrt{1-x^2}$, es un teorema para curvas sin multiplicación compleja (Taylor y colaboradores, 2008–2011).'
meanings:
- todas las curvas, todos los primos de un bloque y todos los $x \in \mathbb F_p$ a la vez (Horner, reduciendo módulo $p$ en cada paso)
- símbolo de Legendre a partir de una tabla de cuadrados $y^2 \bmod p$; $\chi = 0$ para $v = 0$
- 'la traza de Frobenius; Hasse: $|a_p| \le 2\sqrt p$'
- los productos parciales para todos los $X$ a la vez (solo primos de buena reducción)
- pendiente sobre $\sqrt{X} \le p \le X$; converge muy lentamente
- coeficientes de Dirichlet por multiplicatividad, una sección con paso fijo por cada potencia de primo $q = p^k$
- '$n$ repetido ⇒ sumado: $F(t)$ en los nodos de Gauss–Legendre $t = e^{u_m}$'
- todas las derivadas en $s = 1$ a la vez; la primera no nula da el rango analítico
labels:
  x_max: Primos hasta $X$
