source_hash: 302fe326211e
title: '튜링 패턴: 그레이–스콧 반응–확산'
summary: 서로 반응하면서 다른 속도로 확산하는 두 화학 물질은 거의 균일한 혼합물을 반점, 줄무늬, 미로 무늬로 바꿀 수 있다. 이는 동물의 털 무늬와 다른 생물학적 패턴이 어떻게 형성되는지에 관한 튜링의 1952년 아이디어이다. 그레이–스콧 모형을 5점 라플라시안 스텐실을 사용한 주기적 격자에서 네 개의 $(F, k)$ 쌍에 대해 하나의 $(2, B, n, n)$ 텐서로 한꺼번에 풀고, 선형 안정성 분석(분산 관계 $\lambda(q)$)으로 진정한 튜링 불안정성이 존재하는 곳을 보여 준다.
notes: 튜링의 통찰은 보통 모든 것을 매끄럽게 하는 확산이, 자가 촉매(여기서는 $v$)가 그것을 제한하는 물질($u$)보다 느리게 퍼질 때 균일 상태를 불안정하게 만들 수 있다는 것이었다. $v$의 작은 혹은 $u$를 소비하며 국소적으로 자라고, 그 주변의 $u$ 고갈은 이웃이 자라지 못하게 막는다. 즉 단거리 활성화와 장거리 억제이다. 선형 안정성 분석은 이를 정확히 한다. 균일 상태 위의 파동 $e^{i\mathbf q\cdot\mathbf x + \lambda t}$는 $J - q^2\,\mathrm{diag}(D_u, D_v)$의 고윳값으로 성장한다. $\lambda(0) < 0$이지만 어떤 $q$ 대역에서 $\lambda(q) > 0$이면, 가장 빠르게 자라는 파장 $2\pi/q_{\max}$가 아주 작은 잡음에서 나타난다. $D_u = D_v$이면 모든 고윳값이 단지 $-Dq^2$만큼 이동하므로 튜링 불안정성은 불가능하다. 확산 비를 1로 놓으면 지도의 파란 영역이 사라진다. 그레이–스콧에서 여기 있는 쌍 중 "Turing" 쌍만 이런 종류이며, 균일 상태에 1 % 잡음을 더한 상태에서 시작한다. 점선은 진폭이 처음에 $e^{\lambda_{\max} t}$처럼 성장하는지 확인한다. 유명한 반점, 줄무늬, 미로(Pearson 1993)는 대부분 유일한 균일 상태가 $u = 1$, $v = 0$인 곳에 존재하는데, 이 상태는 모든 작은 섭동에 대해 안정하다. 그런 패턴은 유한한 씨앗($v$의 작은 사각형 몇 개)이 필요하며, 선형 튜링 불안정성이 아니라 비선형적이고 자기 복제하는 구조이다. 5점 스텐실은 파동을 $q^2 \to (4/h^2)\sin^2(qh/2)$로 보는데, 이는 여러 칸에 걸친 파장에서 $q^2$에 가깝다. 실제 생물학적 예로는 사지의 손가락 간격, 모낭 간격, 물고기 피부의 줄무늬가 있으며, 여기서 활성자와 억제자는 신호 단백질이다.
meanings:
- 쌍 $b$의 공급률과 제거율; 뒤쪽의 1들이 이를 격자 전체로 브로드캐스트한다
- 각 쌍에 대한 칸 $(i, j)$의 기질 및 자가 촉매 농도, $(2, B, n, n)$ 모양의 $y$로 쌓는다
- 네 이웃에서 중심의 네 배를 뺀 값, 주기적 경계에는 torch.roll 사용
- 자가 촉매 단계 $U + 2V \to 3V$, 공급과 제거
- $\Delta t = 1$인 명시적 오일러법, $D\,\Delta t / h^2 < 1/4$인 동안 안정
- $(1, 0)$은 항상; $F \ge 4(F + k)^2$이면 두 개 더
- 균일 상태에서의 선형화된 반응 속도 $\partial R_\alpha / \partial c_\beta$
- $Q$개 파수 묶음에 대한 $M(q)$의 $\operatorname{Re}$가 가장 큰 고윳값
- '$\lambda(0) < 0$이지만 어떤 대역에서 $\lambda(q) > 0$인 상태: 튜링 불안정성'
labels:
  grid: 격자 크기 $n$
  steps: 시간 단계
  ratio: 확산 비 $D_v / D_u$
