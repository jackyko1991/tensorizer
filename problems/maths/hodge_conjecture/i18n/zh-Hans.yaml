title: 霍奇猜想
summary: 用计数来算出霍奇菱形：对费马超曲面 $x_0^d + \dots + x_{n+1}^d = 0$，霍奇数是某个多项式幂次的系数；对复环面与乘积空间，则是外积与卷积。接着，盐田的特征标计数给出有理霍奇类，也就是霍奇猜想断言应来自子簇的那些类。对曲面而言，这就是已证明的莱夫谢茨 $(1,1)$ 定理，曲面上的直线把它具体呈现出来。在更高维度，这个猜想仍未解决；本页只计数这些类。
notes: 在紧凯勒流形上，每个上同调类都会分解成 $(p, q)$ 型的分量：$p$ 个全纯方向与 $q$ 个反全纯方向（霍奇，1941）。数 $h^{p,q}$ 满足霍奇对称 $h^{p,q} = h^{q,p}$ 与塞尔对偶 $h^{p,q} = h^{n-p,n-q}$，左侧每个菱形都通过这两项检验。它们的交错和是欧拉示性数，对 $d$ 次超曲面而言等于 $((1-d)^{n+2} - 1)/d + n + 2$。菱形重现了这个值，也重现了 K3 四次曲面的 $h^{1,1} = 20$、五次三维簇的 $h^{2,1} = 101$ 以及三次四维簇的 $h^{3,1} = 1$。余维数为 $p$ 的子簇 $Z$ 定义一个 $(p, p)$ 型的有理类。霍奇猜想（霍奇 1950；克雷千禧年大奖难题之一）断言：每个有理 $(p, p)$ 类都是这类类的有理线性组合。已证明的部分：$p = 1$ 的情形由莱夫谢茨 $(1,1)$ 定理（1924）给出，因此由硬莱夫谢茨定理得到 $p = n-1$ 的情形。它对维数至多为 3 的阿贝尔簇、单直纹四维簇与三次四维簇（Conte–Murre、Zucker）也成立，并在许多特殊情形下成立，包括许多次数的费马簇（盐田 1979，Ran 1980）。整系数版本是错的（Atiyah–Hirzebruch，1962）。对费马簇，盐田的特征标让有理霍奇类可以被计数，每个伽罗瓦共轭对应一个条件。对曲面而言，这个计数就是皮卡数：$d = 3, 4, 5, 6$ 时为 $7, 20, 37, 86$，而 $\gcd(d, 6) = 1$ 时为 $3(d-1)(d-2) + 1$。曲面上的 $3d^2$ 条直线给出明确的代数类，它们的相交矩阵（其秩与霍奇指标符号差 $(1, \rho - 1)$，在此计算）恰好在 $d \le 4$ 或 $\gcd(d, 6) = 1$ 时在 $\mathbb Q$ 上张成所有代数类。对 $d = 6, 8, 9, 10$ 则需要其他曲线，而莱夫谢茨定理保证它们存在。对费马四维簇，程序会计数霍奇类，但其中每一个是否为代数类，正是猜想本身。现状（2026 年 11 月）：未解决。OpenAI 发布的 AI 生成手稿集（github.com/openai/math，第 032 族）声称证明了每个 CM 阿贝尔簇的有理霍奇猜想，并报告了该命题的
  Lean 形式化。这是一项未经同行评审、由机器生成的声称，尚待数学界验证；即使它正确，也只涵盖一个特殊类别，而非一般的猜想。
meanings:
- 多项式相乘就是系数向量的卷积，重复 $n+2$ 次：费马多项式的雅可比环的单项式基 $x^b$，$0 \le b_i \le d-2$
- 格里菲斯：本原的中间霍奇数就是雅可比环在次数 $(q+1)d - (n+2)$ 的部分
- 复环面：$dz$ 的 $\wedge^p$ 乘以 $d\bar z$ 的 $\wedge^q$
- Künneth 公式：每一对类，加总到格子 $(a + c, b + d)$ 中
- 盐田的特征标：$1 \le a_i \le d-1$，$\sum a_i \equiv 0 \bmod d$；每一个标记本原上同调中的一条直线 $V(a)$
- 重复的 $i$ ⇒ 求和：一次得到每个伽罗瓦共轭 $t\cdot a$ 的霍奇型
- 有理霍奇类：对每个共轭都是 $(\frac n2, \frac n2)$ 型
- 两条直线相交当且仅当它们在 $\mathbb C^4$ 中的四个张成向量线性相关；由伴随公式得 $L^2 = 2-d$
- 直线所张成之格的秩及其符号差（霍奇指标定理：恰有一个正特征值）
labels:
  d_max: 最大次数 $d$
  n_max: 欧拉检验至维数 $n$
  g_max: 环面至维数 $g$
