title: π तंत्रों के ह्यूकेल आण्विक कक्षक
summary: 'एक समतल हाइड्रोकार्बन के π इलेक्ट्रॉन ऐसे हैमिल्टनी में रहते हैं जो बस उसके कार्बन ढाँचे का संलग्नता आव्यूह (adjacency matrix) है, $H = \alpha\mathbb 1 + \beta A$। एक बैच eigh सात अणुओं को एक साथ विकर्णित करता है, एथिलीन से नैफ़्थलीन तक; कक्षकों को भरने से HOMO–LUMO अंतराल, विस्थानीकरण ऊर्जाएँ (बेंज़ीन: $2\beta$, साइक्लोब्यूटाडाईन: $0$) और भरे कक्षकों पर einsum के रूप में कूल्सन बंध कोटि मिलती हैं, और वलय आकार $N = 3, 4, \dots$ ह्यूकेल का $4n + 2$ नियम दिखाते हैं।'
notes: 'Hückel (1931) ने समतलीय संयुग्मित अणु के π इलेक्ट्रॉनों के लिए केवल वही रखा जो मायने रखता है: प्रति कार्बन एक $2p_z$ कक्षक, हर परमाणु पर समान ऊर्जा $\alpha$, बंधित पड़ोसियों के बीच एक हॉपिंग ऊर्जा $\beta$, और कुछ नहीं, कोई अतिव्यापन नहीं। तब हैमिल्टनी $\alpha\mathbb 1 + \beta A$ है जहाँ $A$ अणु का ग्राफ़ है, इसलिए इसके आइगेनमान $\alpha + \beta\lambda$ हैं जहाँ $\lambda$, $A$ के आइगेनमान हैं; चूँकि $\beta < 0$, सबसे अधिक बंधनकारी कक्षक वह है जिसका $\lambda$ सबसे बड़ा है। बेंज़ीन देता है $\alpha + 2\beta$, $\alpha + \beta$ (दो बार), $\alpha - \beta$ (दो बार), $\alpha - 2\beta$; इसके छह इलेक्ट्रॉनों की $E_\pi = 6\alpha + 8\beta$ है, जो तीन पृथक द्विबंधों से $2\beta$ नीचे है। $|\beta| \approx 75$ kJ/mol लेने पर, जो बेंज़ीन की हाइड्रोजनीकरण एन्थैल्पी पर फ़िट किया गया एक मोटा ऊष्मरासायनिक मान है (स्पेक्ट्रमिकी बड़ा $|\beta|$ सुझाती है, इसलिए इसे अनुमानित मानें), यह ऐरोमैटिक स्थायीकरण का प्रसिद्ध $\approx 150$ kJ/mol है। साइक्लोब्यूटाडाईन में दो इलेक्ट्रॉन $\alpha$ पर एक अपभ्रष्ट युग्म
  में बचे रहते हैं: कोई विस्थानीकरण ऊर्जा नहीं, शून्य अंतराल, एक द्विमूलक (diradical), और यह खुली-शृंखला ब्यूटाडाईन से भी कम स्थायी है: प्रतिऐरोमैटिक। $N$ परमाणुओं के वलय के स्तर $\alpha + 2\beta\cos(2\pi k/N)$ हैं, एक निम्नतम स्तर और फिर अपभ्रष्ट युग्म (Frost वृत्त), इसलिए बंद कोश के लिए $2 + 4n$ इलेक्ट्रॉन चाहिए: ह्यूकेल नियम। विषम वलय अपने ऐरोमैटिक आयनों के रूप में दिखाए गए हैं, जैसे साइक्लोपेंटाडाइएनिल ऋणायन और ट्रोपिलियम धनायन। ब्यूटाडाईन के लिए बंध कोटि $P_{ij} = \sum_k n_k C_{ik}C_{jk}$, सिरे के बंधों के लिए $0.894$ और बीच वाले के लिए $0.447$, इसकी छोटी-लंबी-छोटी बंध लंबाइयों से मेल खाती हैं; बेंज़ीन में सभी छह $2/3$ हैं। एकांतर (alternant) हाइड्रोकार्बनों (कोई विषम वलय नहीं) के लिए युग्मन प्रमेय स्पेक्ट्रम को $\alpha$ के परितः सममित और हर π आवेश को शून्य बनाता है। किसी अन्य अणु को चुनकर उसके सीमांत कक्षक देखें: HOMO और LUMO तय करते हैं कि इलेक्ट्रॉनरागी और नाभिकरागी कहाँ आक्रमण करते हैं और, अंतराल के माध्यम से, रंग (लंबी पॉलीईन लंबी तरंगदैर्ध्य पर अवशोषित करती हैं)।'
meanings:
- अणु $b$ के बंधित कार्बनों $i, j$ (एक बंध लंबाई दूर के परमाणु) के लिए $1$, सबसे बड़े $N = 10$ तक भरा गया
- ह्यूकेल आव्यूह; भराई परमाणुओं को बहुत बड़ा विकर्ण मिलता है ताकि उनके नकली कक्षक कभी न भरें
- 'MO ऊर्जाएँ (आरोही: पहले बंधनकारी, क्योंकि $\beta < 0$) और गुणांक, MO $k$ स्तंभ $k$ में'
- प्रति MO 2 इलेक्ट्रॉनों के साथ आउफ़बाउ भराई; आंशिक रूप से भरा अपभ्रष्ट समुच्चय अपने इलेक्ट्रॉन बाँटता है
- 'दोहराया गया $k$ ⇒ योग: कुल π ऊर्जा $E_\pi$'
- प्रत्येक $2(\alpha + \beta)$ वाले पृथक द्विबंधों की तुलना में विस्थानीकरण ऊर्जा
- 'दोहराया गया $k$ ⇒ भरे MO पर योग: बंध पर कूल्सन बंध कोटि, विकर्ण पर π जनसंख्या'
- π आवेश $1 - P_{bii}$; इन एकांतर हाइड्रोकार्बनों के हर परमाणु पर शून्य
- बंद-रूप वलय स्तर, चक्रीय संलग्नता आव्यूह के eigh से जाँचे गए
labels:
  molecule: कक्षक चित्रों के लिए अणु
  ring_max: सबसे बड़ा वलय आकार $N$
  beta: kJ/mol में बदलने के लिए $|\beta|$ (अनुमानित)
