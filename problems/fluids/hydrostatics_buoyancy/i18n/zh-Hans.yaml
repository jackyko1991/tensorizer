source_hash: 7be98e686941
title: 静水压强与浮力
summary: 水箱中的压强随深度线性增加，$p = p_0 + \rho_w g h$。不同密度的方块同时投入水中（一个批量张量）：轻的上下浮动后漂浮，水下部分占比 $\rho_b/\rho_w$；重的沉到底部。
notes: 每个方块是边长为 $s$ 的立方体；浮力 $\rho_w g s^2 d_b$ 等于它排开的水的重量（阿基米德原理），它是压强 $p_0 + \rho_w g h$ 对底面的推力大于对顶面的推力的净效果。漂浮的方块停在浮力与重力平衡的位置，$d_b/s = \rho_b/\rho_w$——冰（$\rho \approx 917$）漂浮时 92 % 在水下。阻力取为与浸没体积成正比的简单线性阻尼；真实阻力更接近二次方，且忽略了真实的水波和附加质量。下沉的方块停在箱底。
meanings:
- 水中的格点，分量 $i \in \{x, z\}$
- 重力矢量 $(0, -g)$
- 重复的 $i$ ⇒ 求和：深度 $h = -z$ 处的 $g\,h$
- 方块 $b$ 底面的高度和速度
- 方块 $b$ 的密度——批量指标
- 浸没深度，介于 0（在空气中）和 $s$（完全浸没）之间
- 单位质量的浮力减重力减阻力
labels:
  n_blocks: 方块数
  rho_min: 最小密度 $\rho_\text{min}$
  rho_max: 最大密度 $\rho_\text{max}$
  size: 方块边长 $s$
  drag: 阻尼 $\gamma$
  t_max: 模拟时长
