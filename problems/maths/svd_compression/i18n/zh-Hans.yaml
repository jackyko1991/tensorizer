source_hash: 7d50d95577a3
title: 用 SVD 压缩图像
summary: 奇异值分解把图像写成秩 1 层 $\sigma_r\,\mathbf u_r\mathbf v_r^T$ 之和，最强的排在最前。只保留 $k$ 层就是最佳的秩 $k$ 近似，其误差恰好等于被舍弃奇异值的能量，而彩色图像是三个矩阵，在一次批量调用中分解。
notes: 存储 $H\times W$ 图像的 $k$ 层需要 $k(H + W + 1)$ 个数，而不是 $HW$ 个，所以压缩比为 $HW / k(H + W + 1)$。Eckart–Young 定理指出，在 Frobenius 范数下没有任何秩 $k$ 矩阵比它更接近 $A$，误差就是被舍弃奇异值的平方和。终端用对几个 $k$ 实际重建的图像检验了这一点。场景中平滑的部分（天空渐变）由前几层捕获，而锐利的边缘、对角线和文字需要很多层。这就是奇异值起初下降很快、随后缓慢衰减的原因，也是 JPEG 改用局部余弦变换的原因。第一层大致是平均亮度分布；后面的层符号交替（红和蓝）以添加细节。图像由程序绘制，因此无需下载任何东西。试试更大的图像或更高的最大秩。
meanings:
- 用 matplotlib 绘制的场景的通道 $c$、行 $i$、列 $j$，取值在 $[0, 1]$ 内
- 重复的 $c$ ⇒ 求和：权重为 $(0.299, 0.587, 0.114)$ 的亮度
- 每个通道一次 SVD，对首个指标 $c$ 批量处理；$R = \min(H, W)$
- 重复的 $r \le k$ ⇒ 求和：前 $k$ 个秩 1 层
- 无重复指标：灰度图像的一个外积层
- 一次算出每个 $k$ 的 Eckart–Young 误差，无需重建任何图像
- 以 dB 为单位的峰值信噪比，均方误差由被舍弃的 $\sigma$ 得到
labels:
  size: 图像尺寸（像素）
  k_max: 显示的最大秩 $k$
  frames: 动画帧数
