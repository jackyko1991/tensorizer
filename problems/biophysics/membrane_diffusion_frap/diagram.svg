<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="FRAP on a membrane patch seen from above: fluorescent molecules everywhere except in a bleached disk of radius w, into which unbleached molecules diffuse with coefficient D">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- membrane patch, top view -->
    <rect x="22" y="18" width="196" height="124" rx="6" fill="#93c5fd" fill-opacity="0.25" stroke="#374151" stroke-width="2"/>
    <text x="120" y="155" font-size="11" fill="#6b7280" text-anchor="middle">membrane patch, top view</text>
    <!-- bleached disk -->
    <circle cx="120" cy="80" r="32" fill="#ffffff" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- fluorescent molecules -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <circle cx="143" cy="33" r="3.5"/> <circle cx="32" cy="116" r="3.5"/> <circle cx="77" cy="51" r="3.5"/>
      <circle cx="209" cy="77" r="3.5"/> <circle cx="181" cy="77" r="3.5"/> <circle cx="144" cy="120" r="3.5"/>
      <circle cx="84" cy="29" r="3.5"/> <circle cx="159" cy="121" r="3.5"/> <circle cx="110" cy="127" r="3.5"/> <circle cx="188" cy="37" r="3.5"/>
      <circle cx="54" cy="49" r="3.5"/> <circle cx="184" cy="133" r="3.5"/> <circle cx="151" cy="44" r="3.5"/> <circle cx="193" cy="87" r="3.5"/>
      <circle cx="46" cy="112" r="3.5"/> <circle cx="104" cy="42" r="3.5"/> <circle cx="83" cy="109" r="3.5"/>
      <circle cx="66" cy="70" r="3.5"/> <circle cx="86" cy="130" r="3.5"/> <circle cx="191" cy="67" r="3.5"/> <circle cx="129" cy="27" r="3.5"/>
      <circle cx="34" cy="93" r="3.5"/> <circle cx="157" cy="106" r="3.5"/> <circle cx="34" cy="33" r="3.5"/> <circle cx="169" cy="29" r="3.5"/>
      <circle cx="175" cy="52" r="3.5"/> <circle cx="71" cy="39" r="3.5"/> <circle cx="175" cy="117" r="3.5"/> <circle cx="197" cy="50" r="3.5"/>
      <circle cx="193" cy="101" r="3.5"/> <circle cx="196" cy="123" r="3.5"/> <circle cx="61" cy="112" r="3.5"/> <circle cx="39" cy="55" r="3.5"/>
      <circle cx="52" cy="33" r="3.5"/> <circle cx="46" cy="80" r="3.5"/>
    </g>
    <!-- bleached (dark) molecules: still there, no longer fluorescent -->
    <g fill="#ffffff" stroke="#9ca3af" stroke-width="1.5">
      <circle cx="97" cy="91" r="3.5"/> <circle cx="113" cy="98" r="3.5"/> <circle cx="131" cy="95" r="3.5"/>
      <circle cx="137" cy="63" r="3.5"/> <circle cx="106" cy="66" r="3.5"/> <circle cx="122" cy="62" r="3.5"/>
    </g>
    <!-- diffusion into the spot -->
    <g stroke="#374151" stroke-width="2" marker-end="url(#arrow)">
      <line x1="58" y1="90" x2="84" y2="85"/>
      <line x1="180" y1="98" x2="155" y2="91"/>
      <line x1="172" y1="50" x2="151" y2="64"/>
    </g>
    <text x="64" y="106" font-style="italic">D</text>
    <!-- bleach radius -->
    <line x1="120" y1="80" x2="152" y2="80" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="120" cy="80" r="2.5" fill="#b45309"/>
    <text x="131" y="76" font-style="italic" fill="#b45309">w</text>
  </g>
</svg>
