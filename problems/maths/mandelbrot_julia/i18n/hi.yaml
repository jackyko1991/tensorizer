source_hash: 88e5f57d0eb4
title: मैंडेलब्रॉट समुच्चय और जूलिया समुच्चय
summary: सम्मिश्र पिक्सेलों के पूरे ग्रिड पर एक साथ $z \mapsto z^2 + c$ की पुनरावृत्ति करें। जिन बिंदुओं की कक्षा परिबद्ध रहती है वे मैंडेलब्रॉट समुच्चय $M$ ($c$ बदलें, $z_0 = 0$ से शुरू करें) या एक भरा जूलिया समुच्चय $K_c$ ($c$ स्थिर रखें, पिक्सेल से शुरू करें) बनाते हैं। एक चिकनी पलायन गणना और अवकलज से दूरी अनुमान चित्र को सीहॉर्स घाटी में ज़ूम के अंत तक तीक्ष्ण रखते हैं, जबकि $c$ के मुख्य कार्डियोइड के चारों ओर चलने पर जूलिया समुच्चय का आकार बदलता है।
notes: '$|z| > 2$ पर पलायन क्यों: यदि $|z| > \max(2, |c|)$ तो $|z^2 + c| \ge |z|^2 - |c| > |z|$, और कक्षा असीमित रूप से बढ़ती है। अतः $|c| > 2$ वाला हर $c$ पहले ही चरण में पलायन करता है, और $M$ चकती $|c| \le 2$ के भीतर है। यहाँ बड़ी बेलआउट त्रिज्या $R = 1000$ उपयोग की गई है क्योंकि यह चिकनी गणना $\nu = n + 1 - \log_2 \ln|z_n|$ को सटीक बनाती है: अनंत के निकट $z \mapsto z^2$ हर चरण में $\ln|z|$ को दोगुना करता है, और $\log_2$ ठीक उसी को उलटता है। मुख्य कार्डियोइड उन $c$ का समुच्चय है जहाँ $z^* = z^{*2} + c$ एक आकर्षक स्थिर बिंदु है, $|2z^*| < 1$; $2z^* = w$ लिखने पर $|w| \le 1$ के साथ $c = w/2 - w^2/4$ मिलता है, और आवर्त-2 बल्ब वह है जहाँ 2-चक्र आकर्षक है, $|4(1+c)| < 1$। ये दो टुकड़े $M$ के कुल क्षेत्रफल $\approx 1.5066$ में से लगभग 1.37 ढकते हैं, और उनके भीतर कोई पिक्सेल कभी पलायन नहीं करता। दूरी अनुमान $d = |z_n|\ln|z_n|/|z''_n|$ विभव $G(c) = \lim 2^{-n}\ln|z_n|$ से $G/|\nabla G|$ के रूप में आता है; समुच्चय के निकट वास्तविक दूरी इसके लगभग 2 के गुणक के भीतर होती है (Koebe चतुर्थांश प्रमेय
  का परिणाम)। जूलिया पैनल $c$ को कार्डियोइड की सीमा पर रखता है, जहाँ स्थिर बिंदु उदासीन है: वहाँ $K_c$ हमेशा संबद्ध है क्योंकि $c \in M$, पर इसका आकार एक कोण से अगले तक पूरी तरह बदल जाता है। हर जूलिया समुच्चय उस $c$ के निकट $M$ जैसा दिखता है, इसीलिए $M$ में ज़ूम करने पर छोटे जूलिया समुच्चय दिखते हैं। लगभग $10^{-13}$ से गहरे ज़ूम को complex128 के 16 अंकों से अधिक चाहिए।'
meanings:
- प्रति पिक्सेल $p$ एक सम्मिश्र संख्या; किसी सूचकांक पर योग नहीं, हर पिक्सेल स्वतंत्र रूप से चलता है
- अभी भी पुनरावृत्ति कर रहे सभी पिक्सेलों के लिए द्विघात प्रतिचित्रण का एक चरण
- 'शृंखला नियम: $M$ के लिए $c'' = 1$ ($c$ में अवकलज), जूलिया समुच्चयों के लिए $c'' = 0$ और $z''_0 = 1$ ($z_0$ में अवकलज)'
- $|z_p| > R$ वाला पहला चरण; पलायित पिक्सेल टेंसरों से हटा दिए जाते हैं, इसलिए काम घटता है
- 'चिकनी (सतत) पलायन गणना: पट्टियों के बीच रंग की सीढ़ियाँ नहीं'
- 'दूरी अनुमान: चौथाई पिक्सेल से कम $d_p$ वाले पिक्सेल गहरे रंग में बनते हैं, जिससे पतले तंतु दिखते हैं'
- मुख्य कार्डियोइड के लिए सटीक परीक्षण (और आवर्त-2 बल्ब के लिए $|c+1| \le \frac14$), $q = (x-\frac14)^2 + y^2$ के साथ
