source_hash: 8bd75af0e44c
title: 放射性衰變
summary: 每個原子核都以相同的每秒機率 $\lambda$ 隨機衰變。把整個原子核網格模擬成一個布林張量——每個原子核每個時間步擲一次硬幣——便重現了平滑的指數律 $N(t) = N_0 e^{-\lambda t}$ 與半衰期 $T_{1/2} = \ln 2/\lambda$。
notes: 指數律描述的是平均值。從 $N_0$ 個原子核開始，時間 $t$ 後的數目服從二項分佈，平均為 $N_0 e^{-\lambda t}$，標準差為 $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$，因此小網格在曲線周圍明顯擾動，大網格則緊貼曲線。每經過一個半衰期，剩下的原子核約有一半消失，不論原本有多少。步長 $\Delta t$ 只需比 $T_{1/2}$ 小；精確的每步機率 $1 - e^{-\lambda\Delta t}$ 使平均值對任何步長都正確。隨機種子固定，因此圖形可重現。
meanings:
- 衰變常數 $\ln 2 / T_{1/2}$
- 原子核 $n$ 尚未衰變時為 True；網格只是繪出 $n$ 的方式
- 每個原子核每步一個均勻亂數
- 在一步 $\Delta t$ 內衰變的機率
- 已衰變的原子核保持衰變
- 對所有原子核求和：數目 $N(t)$
labels:
  n_side: 網格邊長（邊長² 個原子核）
  half_life: 半衰期 $T_{1/2}$
  t_max: 模擬時間
  dt: 時間步長 $\Delta t$
