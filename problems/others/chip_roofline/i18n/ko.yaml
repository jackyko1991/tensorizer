source_hash: 936404bf1075
title: 내 칩의 루프라인 측정하기
summary: 이 코드가 실행되는 기계는 얼마나 빠를까요? 큰 메모리 복사 한 번의 시간을 재서 대역폭 $\beta$를 구하고, $n\times n$ 행렬 곱 $C_{ij} = A_{ik}B_{kj}$를 FP64, FP32, TF32, BF16, FP16으로 재서 각 정밀도의 속도 $\pi$를 구합니다. 그러면 루프라인 $P(I) = \min(\pi, \beta I)$가 어떤 커널은 칩에서 최고 속도로 돌고 어떤 커널은 메모리를 기다리는지 알려 줍니다. 코딩 기법 ▸ 가속 칩셋 에서는 내 결과를 다른 칩들의 사양표 옆에 놓아 보여 줍니다.
notes: 사양표는 최고치를 알려 주고, 측정은 PyTorch가 내 기계에서 실제로 내는 속도를 알려 줍니다. 큰 행렬 곱에서는 보통 최고치의 50–90%입니다. GPU 작업은 비동기이므로 모든 시간 측정은 장치가 끝나기를 기다리고(synchronize), 워밍업 뒤에 여러 번 실행한 값의 중앙값을 씁니다. NVIDIA GPU에서는 FP32 곱을 두 번 측정합니다. 한 번은 진짜 FP32로, 한 번은 TF32 텐서 코어(torch.set_float32_matmul_precision("high"))로 잽니다. 이 설정은 가수 비트를 조용히 속도와 맞바꿉니다. Apple의 GPU 백엔드(MPS)에는 float64가 없어서 거기서는 FP64를 건너뜁니다. 소비자용 GPU는 FP64를 FP32 속도의 작은 일부로만 실행하는데, 이는 물리 계산에서 중요합니다. 더 큰 행렬 크기로 해 보세요. 곱이 연산에 묶일 때까지 속도는 올라가고, 메모리 복사는 대역폭 수준에 머뭅니다.
meanings:
- 큰 복사(읽기 + 쓰기)로 구한 메모리 대역폭, GB/s
- 정밀도 $p$에서 실제로 얻은 행렬 곱 속도, TFLOP/s
- '반복되는 $k$ ⇒ 합: $n^3$번의 곱셈-덧셈'
- '옮긴 바이트당 FLOP: $b$바이트 원소라면 $2n/(3b)$'
- 강도가 $I$인 커널이 도달할 수 있는 최대치
labels:
  matrix_size: 행렬 크기 $n$
  copy_mb: 복사 크기
  repeats: 시간 측정 반복 횟수
