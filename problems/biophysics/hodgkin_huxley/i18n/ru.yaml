title: Потенциал действия Ходжкина–Хаксли
summary: 'Модель гигантского аксона кальмара 1952 года: мембранный конденсатор, разряжаемый натриевыми и калиевыми каналами, чьи воротные переменные $m$, $h$, $n$ открываются и закрываются в зависимости от напряжения. Сорок один аксон, каждый со своей ступенькой тока, интегрируются вместе в одном тензоре $(4, B)$, чтобы найти порог спайка и частоту разрядов как функцию тока.'
notes: 'Ходжкин и Хаксли (Нобелевская премия 1963 года) измерили натриевый и калиевый токи гигантского аксона кальмара методом фиксации потенциала и описали их тремя воротными переменными. Натриевый ток быстро включается через $m^3$ и медленнее выключается через инактивационные ворота $h$; калиевый ток открывается с запаздыванием через $n^4$. Спайк — это гонка между ними: небольшая деполяризация открывает $m$, входящий $\mathrm{Na}^+$ деполяризует мембрану ещё сильнее (положительная обратная связь), и $V$ взлетает к $E_{Na}$; затем $h$ закрывается, $n$ открывается, и $V$ падает обратно и даже уходит ниже уровня покоя (следовая гиперполяризация). При постоянной ступеньке тока модель показывает три режима. Ниже примерно 2.3 µA/cm² мембрана лишь пассивно заряжается. Между этим значением и примерно 6.3 µA/cm² она генерирует один спайк и затем успокаивается, потому что инактивация и калиевый ток удерживают её в новом состоянии покоя. Выше она разряжается повторно, причём частота растёт не от
  нуля, а скачком до примерно 50 Hz: аксон кальмара — нейрон типа II (резонатор), чьё состояние покоя теряет устойчивость в бифуркации Хопфа, в отличие от нейронов типа I, которые могут разряжаться сколь угодно медленно. Затем кривая f–I плавно растёт, примерно до 68 Hz при 10 µA/cm². Функции скоростей имеют устранимые особенности, $0.1(V+40)/(1 - e^{-(V+40)/10})$ конечна при $V = -40$ mV, поэтому код вычисляет их через $x/(1 - e^{-x})$ с безопасным предельным значением. Исходные эксперименты проводились при 6.3 °C; нагрев аксона ускоряет все ворота в $\phi = 3^{(T - 6.3)/10}$ раз, отчего спайки становятся уже, а разряды чаще, пока выше примерно 30 °C аксон не перестаёт возбуждаться вовсе. Упрощения: пространственно фиксированный участок мембраны (без распространения вдоль аксона) и детерминированные каналы.'
meanings:
- стимулирующий ток аксона $b$, ступенька, включаемая в момент 10 ms (µA/cm²)
- мембранный потенциал и воротные переменные $g = (m, h, n)$ каждого аксона
- скорости открывания и закрывания каждых ворот (1/ms), классические аппроксимации для аксона кальмара
- открытая доля канала $k$ = Na, K, утечка
- максимальные проводимости (120, 36, 0.3 mS/cm²) и потенциалы реверсии (50, −77, −54.4 mV)
- полный ионный ток; повторяющийся $k$ ⇒ суммирование по каналам
- 'температурный множитель ($Q_{10} = 3$): каждые ворота ускоряются в 3 раза на каждые 10 °C'
- установившаяся частота разрядов по межспайковым интервалам (Hz)
labels:
  I_max: Наибольший стимул $I_{max}$
  t_end: Время моделирования
  temp: Температура $T$
