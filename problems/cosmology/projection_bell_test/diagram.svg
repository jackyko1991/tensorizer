<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="One shared state Psi in D dimensions sends two particles to Alice and Bob, who measure along directions a and b; in the joint model one race in the full space picks both outcomes at once">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the shared state -->
    <circle cx="120" cy="44" r="26" fill="#93c5fd" fill-opacity="0.4" stroke="#374151" stroke-width="2"/>
    <text x="113" y="49" font-style="italic">Ψ</text>
    <text x="150" y="22" font-style="italic" fill="#374151">D</text>
    <!-- particles to the two parties -->
    <line x1="98" y1="58" x2="48" y2="110" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="142" y1="58" x2="192" y2="110" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- Alice and Bob detectors with setting arrows -->
    <circle cx="44" cy="124" r="14" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="196" cy="124" r="14" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="44" y1="124" x2="44" y2="94" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="196" y1="124" x2="214" y2="99" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="98" font-style="italic" fill="#b91c1c">a</text>
    <text x="216" y="118" font-style="italic" fill="#b91c1c">b</text>
    <!-- the angle between settings -->
    <path d="M100,140 Q120,128 140,140" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="114" y="156" font-style="italic" fill="#b45309">θ</text>
  </g>
</svg>
