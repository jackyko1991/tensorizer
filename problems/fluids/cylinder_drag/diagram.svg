<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Uniform flow U past a cylinder of diameter D in a channel; alternating vortices form a Karman street behind it, and the fluid pushes the cylinder with a drag force F_D downstream and an oscillating lift force F_L">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- channel -->
    <line x1="10" y1="24" x2="230" y2="24" stroke="#374151" stroke-width="2"/>
    <line x1="10" y1="136" x2="230" y2="136" stroke="#374151" stroke-width="2"/>
    <!-- inflow -->
    <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#flow)">
      <line x1="12" y1="46" x2="36" y2="46"/>
      <line x1="12" y1="80" x2="36" y2="80"/>
      <line x1="12" y1="114" x2="36" y2="114"/>
    </g>
    <text x="14" y="66" font-style="italic" fill="#1e40af">U</text>
    <!-- vortex street -->
    <g fill="none" stroke-width="1.6">
      <ellipse cx="124" cy="62" rx="9" ry="7" stroke="#dc2626" stroke-opacity="0.7"/>
      <ellipse cx="154" cy="98" rx="10" ry="8" stroke="#2563eb" stroke-opacity="0.7"/>
      <ellipse cx="186" cy="62" rx="11" ry="8" stroke="#dc2626" stroke-opacity="0.55"/>
      <ellipse cx="214" cy="98" rx="11" ry="8" stroke="#2563eb" stroke-opacity="0.45"/>
    </g>
    <path d="M78,68 Q110,62 130,78 T190,80" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- cylinder -->
    <circle cx="74" cy="80" r="16" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="50" y1="64" x2="50" y2="96" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="46" y1="64" x2="62" y2="64" stroke="#9ca3af" stroke-width="1"/>
    <line x1="46" y1="96" x2="62" y2="96" stroke="#9ca3af" stroke-width="1"/>
    <text x="36" y="102" font-style="italic">D</text>
    <!-- forces -->
    <line x1="92" y1="80" x2="120" y2="80" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="96" y="100" font-style="italic" fill="#b91c1c">F<tspan font-size="10" dy="3" font-style="normal">D</tspan></text>
    <line x1="74" y1="62" x2="74" y2="34" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="80" y="44" font-style="italic" fill="#b45309">F<tspan font-size="10" dy="3" font-style="normal">L</tspan></text>
  </g>
</svg>
