title: 射影競争のベル検定
summary: 推測的な仮説であり、確立された物理ではない：2つのもつれた粒子は1つの共有状態 $\Psi$ であり、それは $D$ 次元にある。各測定は射影であり、その後にステップ1の競争が続く。$\Psi$ 上で結合して、つまり全空間内の1つの事象として実行すると、この競争は量子力学の $E = -\cos\theta$ と CHSH 値 $S = 2\sqrt2$ を正確に与える。各当事者の局所的な隠れ座標上で別々に実行すると、それは $S\leq2$ の局所隠れた変数モデルとなり、抜け穴のないベル検定によって否定される。結果ごとに2つ以上の隠れ次元をもつ競争は Tsirelson 限界を破り、超光速の信号伝達を可能にする。
notes: 射影仮説のステップ5（シリーズの説明を参照）。これは著者による推測的な仮説であり、確立された物理ではない。ステップ1（cosmology/projection_postulate）の公準 P1（射影）と P2（事象）を、もつれに対して検証する。ステップ4（cosmology/projection_singularity_fold）は幾何を、ステップ6（cosmology/projection_telescope_tests）は観測を扱う。共有状態の次元 $D$ は未定のままである：それはパラメータであり、どの結果もそれに依存しない。まず既知の物理から。一重項は $E(a,b) = -a\cdot b = -\cos\theta$ を与える。Bell（1964）および Clauser、Horne、Shimony、Holt（1969）は、任意の局所隠れた変数モデルについて $S\leq2$ を証明したが、量子力学は Tsirelson 限界 $S = 2\sqrt2$ に達する。仮説：共有された $\Psi$ が1つ存在する（P0、P3）。各当事者の測定は射影とステップ1の競争からなり、そこでは $\|P_k\Psi\|^2/E_k$ が最大の結果が起こり、$E_k$ は $m$ 個の隠れた複素座標（$\Psi$ のもの）にあるエネルギーである。(i) 結合モデル：競争は4つの結合結果に対して1回だけ行われ、重みは $\|(P^a_i\otimes P^b_j)\Psi\|^2$ である。3次元では非局所的だが、$D$ 次元では単一の事象である。$m = 1$（ステップ1で生き残った唯一の値）のとき、これは量子力学を正確に再現する：閉じた形の $E = -\cos\theta$ が $10^{-15}$ まで一致し、$\Psi$（$\mathbb C^D$ 内）から出発するモンテカルロも統計誤差の範囲内で一致する。最適な設定で $S = 2\sqrt2$ となり、2000 通りのランダムな設定での最大値はそれを下回り、Alice の周辺分布は Bob の設定に依存しない（信号伝達なし）。(ii) 局所モデル：各当事者は自分の隠れたエネルギーと、源で設定された隠れた方向 $n$ のみに基づいて、すなわち重み $(1\pm a\cdot n)/2$ に基づいて競争する。これは局所隠れた変数モデルなので、$S\leq2$
  が保証される。$m = 1$ は $E = -\cos\theta/3$ を与え（最大 $S\approx0.93$）、$m\to\infty$ は Bell 自身の決定論的モデル $E = -(1-2\theta/\pi)$ であり、ちょうど $S = 2$ に達する。Born 則を超えて：$m\neq1$ の結合競争は量子力学ではない。$m > 1$ では Tsirelson 限界を破る（$S = 3.85$、$m = 3$ のとき。PR ボックスの値 4 に近づく）。部分的にもつれた状態では、Alice の統計が Bob の設定に依存するようになり、これは超光速の信号伝達である（$dS/dm = 1.34$、信号伝達 $\approx0.18\,|m-1|$）。したがって $m = 1$ は、三重スリットのデータだけでなく相対論的因果律からも要求される。データ（data/bell_tests.csv、引用した数値は要旨による）。Hensen et al.（Nature 526, 682, 2015）：1.3 km 離れた NV スピン、$S = 2.42\pm0.20$、$p = 0.039$。彼らの2回目の実験（Sci. Rep. 6, 30289, 2016）：$S = 2.35\pm0.18$。Giustina et al. と Shalm et al.（Phys. Rev. Lett. 115, 250401 and 250402, 2015）：光子、CH–Eberhard 不等式、$p\leq3.74\times10^{-31}$ および $2.3\times10^{-7}$。Rosenfeld et al.（Phys. Rev. Lett. 119, 010402, 2017）：398 m 離れた原子、$S = 2.221\pm0.033$。Storz et al.（Nature 617, 265, 2023）：30 m 離れた超伝導量子ビット、$S = 2.0747\pm0.0033$、2 を 22.6$\sigma$ 上回る。結論：モデル (ii)、そしてそれとともに競争のあらゆる局所版は否定される。モデル (i) はすべての検定と一致するが、それは書き直された量子力学であるからにすぎず、新しい予測は何もしない。ステップ1でまだ許されるずれ（$|m-1|\leq6\times10^{-3}$）は、$S$
  を最大でも $8\times10^{-3}$ しかずらさない。これは Storz の $\sigma_S$ より大きいが、測定された $S$ の値は $2\sqrt2$ を大きく下回っており（可視度 0.73）、未知の可視度がこのようなずれを吸収してしまう。それを見ることができるのは、$E(\theta)$ の形（残差 $\leq1.5\times10^{-3}$）か、直接の信号伝達なし検定（$\leq10^{-3}$）だけである。Wikipedia：ベルの定理、CHSH 不等式。
meanings:
- 単位ベクトル $n$ に沿ったスピン射影演算子。Pauli 行列に対する einsum で構成する
- 各結合結果の重み：量子ビットの添字 $x, y, u, v$ について和をとる
- 相関。結果の符号 $s = (+1, -1)$ について和をとる
- 4つの結果に対する結合競争。$l$ についての和（$l = k$ を除く）は他の結果についての積である。$m = 1$ では $P = w$ となる
- $\Psi$ のサンプルから読み取った隠れブロックのエネルギー。サンプルは $\mathbb C^D$ の球面上で一様
- 源で設定される隠れた方向。$\Psi$ の3つの実座標であり、$S^2$ 上で一様（どの $D$ でも）
- 局所競争：各当事者は自分の重み $(1\pm a\cdot n)/2$ で競争する。共有された $\nu$ について平均をとる
- CHSH 値。4つの項のどれが負号をもつかについて最大化する
labels:
  D: 総次元 $D$（共有状態 $\Psi$ の次元、未定）
  m_max: 結果ごとの隠れ次元数の最大値 $m$
  settings: ランダムな測定設定の数
  trials: 角度ごとの競争事象数（モンテカルロ）
