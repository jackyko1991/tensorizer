source_hash: b6ae9044b340
title: 허블 팽창
summary: '은하들은 척도 인자 $a(t)$에 의해 늘어나는 고정된 공동 좌표 격자 위에 놓여 있습니다. 외적(outer product) 하나 $x_{gi} = a\,q_{gi}$로 모든 은하를 움직이며, 어느 은하를 골라도 다른 은하들은 $v = H d$로 멀어집니다. 격자를 가로지르는 광자도 같은 비율로 늘어납니다: $1 + z = a_\mathrm{obs}/a_\mathrm{emit}$.'
notes: '단위: Mpc, Gyr, km/s/Mpc. 물질 우세(아인슈타인–드 시터) 모형에서는 $a = (t/t_0)^{2/3}$이므로 $H = 2/(3t)$가 시간에 따라 감소하고, 드 시터 모형에서는 $a = e^{H_0 (t - t_0)}$이며 $H$가 일정합니다. 어느 경우든 모든 관측자에게 $v = Hd$가 정확히 성립합니다. 관측자를 옮겨도 파란 점은 중심에서 본 빈 원과 같은 직선 위에 놓입니다. 은하 자체는 공간 속을 움직이지 않으며(고유 속도 없음), 그 사이의 공간이 커집니다. 광자는 한 단계마다 공동 거리 $c\,dt/a$를 지나가며, 먼 은하가 $c$보다 빠르게 멀어지는 것도 허용됩니다. 국소적으로 빛을 앞지르는 것은 없기 때문입니다.'
meanings:
- 은하 $g$의 공동 좌표(변하지 않음)
- 각 시각의 척도 인자, 현재 $a = 1$
- '물리적 위치: 외적이며 합하는 지표 없음'
- '$\dot a/a$: 물질은 $2/(3t)$, 드 시터는 상수'
- 각 은하의 허블 흐름 속도
- 관측자 $o$에서 본 위치(브로드캐스팅 뺄셈)
- '반복된 $g, i$ ⇒ 합: $v$ 대 $d$의 최소제곱 기울기'
- 방출 이후 광자 파장이 늘어난 비율
labels:
  model: 팽창 법칙 $a(t)$
  H0: 현재 허블 상수 $H_0$
  n_grid: 한 변의 은하 수
  spacing: 공동 격자 간격
  observer_x: 관측자 열(격자 칸)
  observer_y: 관측자 행(격자 칸)
  a_start: 시작 척도 인자 $a_\mathrm{emit}$
  a_end: 끝 척도 인자 $a_\mathrm{obs}$
