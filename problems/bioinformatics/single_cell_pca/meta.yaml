title: 'Single-cell RNA-seq: PCA and k-means clustering'
category: bioinformatics
level: advanced
order: 2
summary: >
  A synthetic single-cell experiment: cells of a few types, each switching on its own marker genes, with
  negative-binomial counts and cells sequenced to different depths. We run the standard pipeline as tensor
  operations: normalise to $\log(1 + 10^4 K_{cg}/n_c)$, keep highly variable genes, PCA by SVD, then k-means with
  several restarts in parallel, and score the clusters against the true types with the adjusted Rand index.
animated: true
vector_form: 'X_{cg} = \log\!\Big(1 + 10^4\,\frac{K_{cg}}{n_c}\Big),\qquad \mathbf Z = \mathbf X - \bar{\mathbf X} = \mathbf U\,\boldsymbol\Sigma\,\mathbf V^{\mathsf T},\qquad \min_{\{\boldsymbol\mu_k\}} \sum_c \min_k \lVert \mathbf y_c - \boldsymbol\mu_k\rVert^2'
index_form: 'n_c = K_{cg}\,\mathbb 1_g \qquad y_{cp} = Z_{cg}\,V_{gp} \qquad d_{rck} = y_{cp}y_{cp} - 2\,y_{cp}\,\mu_{rkp} + \mu_{rkp}\mu_{rkp} \qquad \mu_{rkp} = \frac{A_{rck}\,y_{cp}}{A_{rck}\,\mathbb 1_c}'
translation:
  - {symbol: '\mu_{kg}', code: 'type_profiles(G, K, M, fold_change, seed)', shape: '(K, G)', meaning: 'mean expression of gene $g$ in type $k$: a log-normal baseline, times the fold change for the $M$ marker genes of $k$'}
  - {symbol: 'K_{cg}', code: 'poisson(Gamma(1/φ, mean s_c μ_{k(c)g}))', shape: '(C, G)', meaning: 'negative-binomial counts (variance $m + \varphi m^2$); $s_c$ is a log-normal sequencing depth'}
  - {symbol: 'n_c', code: "einsum('cg->c', counts)", shape: '(C,)', meaning: 'library size: total counts of cell $c$, $g$ summed'}
  - {symbol: 'X_{cg}', code: 'log1p(1e4 * counts / n_c[:, None])', shape: '(C, G)', meaning: 'depth-normalised (counts per $10^4$, like CPM) and log-transformed'}
  - {symbol: 'z_g', code: 'hvg_scores(scaled)', shape: '(G,)', meaning: 'dispersion $\mathrm{Var}/\mathrm{Mean}$, standardised within bins of similar mean (bin sums by one-hot einsum)'}
  - {symbol: 'U\Sigma V^{\mathsf T}', code: 'torch.linalg.svd(Z, full_matrices=False)', shape: '(C, H), (H,), (H, H)', meaning: 'PCA of the centred matrix on the $H$ highly variable genes; torch.pca_lowrank gives the same top components'}
  - {symbol: 'y_{cp}', code: "einsum('cg,gp->cp', Z, V)", shape: '(C, P)', meaning: 'PC scores, $g$ summed; $\Sigma_p^2/\sum_q\Sigma_q^2$ is the explained-variance ratio'}
  - {symbol: 'd_{rck}', code: 'sq_distances(y, mu)', shape: '(R, C, K)', meaning: 'squared distance of cell $c$ to centre $k$ of restart $r$; $p$ summed, all $R$ restarts at once'}
  - {symbol: 'A_{rck}', code: 'one_hot(d.argmin(-1), K)', shape: '(R, C, K)', meaning: 'assignment step: each cell joins its nearest centre'}
  - {symbol: '\mu_{rkp}', code: "einsum('rck,cp->rkp', A, y) / einsum('rck->rk', A)", shape: '(R, K, P)', meaning: 'update step: each centre moves to the mean of its cells, $c$ summed'}
  - {symbol: '\mathrm{ARI}', code: 'adjusted_rand_index(pred, truth)', shape: '()', meaning: 'pair-counting agreement from the contingency table $n_{ij}$ (one-hot einsum); 1 = perfect, about 0 = random'}
notes: >
  Each cell yields a few thousand mRNA counts spread over thousands of genes, so most entries are zero and the raw
  counts mostly reflect how deeply a cell was sequenced. Dividing by the library size $n_c$ removes the depth;
  the log tames the huge range of expression levels. Most genes carry only noise, so we keep the genes whose
  variance exceeds what genes of similar mean show: the highly variable genes, enriched in the planted markers. PCA
  then compresses them: with $K$ types the signal lives in about $K-1$ directions, visible as the first
  $K-1$ bars of the scree plot standing above a flat noise floor. k-means alternates two steps, assign each cell to
  its nearest centre and move each centre to the mean of its cells; neither step can increase the inertia
  $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$, so it converges, but only to a local minimum, which is why several
  random starts are run side by side (grey curves) and the best is kept. Because we know the true types, the
  adjusted Rand index scores the result honestly. The optional t-SNE map is a small force layout trained with
  autograd (Student-t similarities, early exaggeration); distances between clusters in such maps mean little.
  Real pipelines (Scanpy, Seurat) add quality control, batch correction and graph-based clustering (Leiden) on a
  nearest-neighbour graph, and real cell types are rarely this clean. Try a smaller fold change, fewer markers or a
  wrong $k$.
params:
  n_cells: {default: 1500, min: 200, max: 4000, step: 100, type: int, label: 'Cells $C$'}
  n_genes: {default: 2000, min: 500, max: 5000, step: 100, type: int, label: 'Genes $G$'}
  n_types: {default: 4, min: 2, max: 6, step: 1, type: int, label: 'True cell types $K$'}
  n_markers: {default: 40, min: 5, max: 100, step: 5, type: int, label: Marker genes per type}
  fold_change: {default: 3.0, min: 1.2, max: 8, step: 0.1, label: Marker fold change}
  dispersion: {default: 0.3, min: 0.05, max: 2, step: 0.05, label: 'Negative-binomial dispersion $\varphi$'}
  depth_spread: {default: 0.5, min: 0, max: 1.2, step: 0.05, label: 'Library-size spread (log-normal $\sigma$)'}
  n_hvg: {default: 200, min: 50, max: 1000, step: 50, type: int, label: Highly variable genes kept}
  n_pcs: {default: 10, min: 2, max: 30, step: 1, type: int, label: Principal components for clustering}
  k: {default: 4, min: 2, max: 8, step: 1, type: int, label: 'Clusters $k$'}
  kmeans_iters: {default: 12, min: 2, max: 40, step: 1, type: int, label: k-means iterations}
  embedding: {default: pca, type: choice, options: [pca, tsne], label: '2D view: PC1–PC2 or t-SNE'}
