title: संपर्क नेटवर्क पर महामारियाँ
summary: एक वास्तविक आमने-सामने के संपर्क नेटवर्क पर SIR और SIS महामारियाँ, जिनमें सैकड़ों यादृच्छिक प्रकोप एक ही बैच टेंसर के रूप में एक साथ चलाए जाते हैं और उनके साथ व्यक्ति-आधारित माध्य-क्षेत्र ODE दिखाया जाता है। कोई प्रकोप केवल देहली $\beta/\gamma > 1/\lambda_{\max}(A)$ से ऊपर ही फैल सकता है, जो आसन्नता आव्यूह के सबसे बड़े आइगेनमान से तय होती है, और स्केल-मुक्त नेटवर्क पर हब्स का टीकाकरण यादृच्छिक टीकाकरण की तुलना में कहीं कम खुराकों में इसे रोक देता है।
notes: 'हर व्यक्ति S, I या R अवस्था में होता है; हर चरण $\Delta t$ में एक संवेदनशील व्यक्ति हर संक्रमित संपर्क से दर $\beta$ पर संक्रमित होता है और एक संक्रमित व्यक्ति दर $\gamma$ पर ठीक होता है (SIS में वह फिर से संवेदनशील हो जाता है)। परीक्षण जाँचते हैं कि लोग केवल वर्गों के बीच स्थानांतरित होते हैं, कि $k$-नियमित ग्राफ़ के लिए $\lambda_{\max} = k$ है, कि देहली के नीचे प्रकोप बुझ जाते हैं, और कि पूर्ण ग्राफ़ पर (हर कोई हर किसी से मिलता है, $R_0 = \beta(N-1)/\gamma$) बड़े प्रकोपों का औसत अंतिम आकार कर्मैक–मैककेंड्रिक (1927) समीकरण $z = 1 - e^{-R_0 z}$ से मेल खाता है ($R_0 = 2$ के लिए $z \approx 0.80$)। देहली $1/\lambda_{\max}$ व्यक्ति-आधारित माध्य क्षेत्र के रैखिकीकरण से आती है; उस ODE के लिए यह सटीक है, पर ODE पड़ोसियों को स्वतंत्र मानता है और संक्रमण को एक ही किनारे पर आगे-पीछे गूँजने देता है, इसलिए इस छोटे, सघन, गुच्छित नेटवर्क पर यह महामारी के आकार को बढ़ा-चढ़ाकर आँकता है। SIR संक्रमण उसी किनारे से सीधे वापस नहीं जा सकता जिससे वह आया था: संदेश-प्रेषण देहली $T = \beta/(\beta + \gamma)
  = 1/\lambda_{NB}$ भी दिखाई गई है, जहाँ $\lambda_{NB}$ गैर-पश्चगामी आव्यूह का प्रमुख आइगेनमान है (Karrer, Newman और Zdeborová 2014)। अनुकारित वक्र सभी रनों का औसत है, जिनमें वे कई रन भी शामिल हैं जो पहले मामले के बाद संयोगवश समाप्त हो जाते हैं, इसलिए यह धीरे-धीरे बढ़ता है। स्केल-मुक्त नेटवर्कों पर $\lambda_{\max}$ सबसे बड़े हब के साथ बढ़ता है, इसलिए देहली बहुत छोटी होती है (Pastor-Satorras और Vespignani 2001), और हब्स को हटाने से $\lambda_{\max}$ तेज़ी से घटता है: कहीं कम खुराकों में सामूहिक प्रतिरक्षा। उसी औसत डिग्री वाले एर्डोश–रेनी नेटवर्क में बड़े हब नहीं होते, इसलिए लक्षित टीकाकरण बहुत कम मदद करता है। डेटा: SocioPatterns "Contacts in a workplace" (फ़्रांस में एक कार्यालय भवन, 2013; 92 लोग, 20-सेकंड की खिड़कियों में आमने-सामने देखे गए 755 जोड़े, यहाँ एकत्रित), M. Génois et al., Network Science 3, 326 (2015), Creative Commons Public Domain Dedication (CC0) के अंतर्गत जारी, www.sociopatterns.org। BA और ER नेटवर्क कृत्रिम हैं। अनुकारित लोग और दरें केवल उदाहरण के लिए हैं, किसी वास्तविक
  बीमारी का मॉडल नहीं।'
meanings:
- 1 यदि व्यक्ति $i$ और $j$ आमने-सामने देखे गए, अन्यथा 0 (सममित, सघन)
- एक साथ चलाई गई $B$ प्राप्तियों में से हर एक में कौन संक्रमित है
- 'दोहराया गया $j$ ⇒ योग: हर व्यक्ति के संक्रमित संपर्कों की संख्या'
- एक चरण $\Delta t$ में किसी संवेदनशील व्यक्ति के संक्रमित होने की संभावना; संक्रमित व्यक्ति संभावना $1 - e^{-\gamma \Delta t}$ से ठीक होते हैं
- व्यक्ति $i$ के संवेदनशील, संक्रमित या ठीक होने की संभावनाएँ, RK4 से समाकलित
- 'सबसे बड़ा आइगेनमान: रैखिकीकृत माध्य क्षेत्र $\dot x = (\beta A - \gamma)x$ तभी बढ़ता है जब $\beta \lambda_{\max} > \gamma$'
- पूर्ण मिश्रण में अंतिम आकार, समीकरण $z = 1 - e^{-R_0 z}$ का मूल (कर्मैक–मैककेंड्रिक)
labels:
  beta_x_lambda: देहली $1/\lambda_{\max}$ की इकाइयों में $\beta/\gamma$
  n_runs: यादृच्छिक प्राप्तियाँ $B$
  n_synthetic: कृत्रिम नेटवर्कों में लोग
  vacc_beta: टीकाकरण तुलना के लिए $\beta/\gamma$
