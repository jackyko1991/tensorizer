source_hash: b20963373157
title: Изображение в тонкой линзе
summary: Формула тонкой линзы говорит, где появляется изображение предмета и каков его размер. Три главных луча строятся сразу для всех положений предмета, пока предмет перемещается из-за $2f$ внутрь фокусного расстояния, и действительное перевёрнутое изображение превращается в мнимое прямое.
notes: 'Расстояния отсчитываются от линзы: предмет находится в $x = -s$, а действительное изображение — в $x = +s''$. Три главных луча: (1) параллельно оси, затем через дальний фокус; (2) прямо через центр; (3) через ближний фокус, затем параллельно оси. Все они следуют из одного правила $\theta'' = \theta - y/f$. Внутри $f$ лучи после линзы расходятся; их штриховые продолжения сходятся в мнимом изображении. При $s = f$ изображение уходит в бесконечность.'
meanings:
- расстояние до предмета в кадре анимации $k$
- расстояние до изображения; отрицательное ⇒ мнимое изображение со стороны предмета
- высота изображения / высота предмета; отрицательное ⇒ перевёрнутое
- наклон главного луча $r \in \{\text{parallel, centre, focal}\}$ до линзы
- где каждый главный луч пересекает линзу
- 'наклон после линзы: каждый луч отклоняется на $-y/f$'
labels:
  f: Фокусное расстояние $f$
  h: Высота предмета $h$
  s_start: Начальное расстояние до предмета
  s_end: Конечное расстояние до предмета
