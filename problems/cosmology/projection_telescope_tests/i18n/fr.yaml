source_hash: c17ad8b19789
title: 'Tests télescopiques de la projection : ondes gravitationnelles, ombres de trous noirs et supernovae'
summary: 'Une hypothèse spéculative, et non de la physique établie, confrontée à des données astronomiques ouvertes. Si la gravité voit plus de $3+1$ dimensions, les ondes gravitationnelles s''affaiblissent plus vite que $1/d$ ; si l''espace-temps courbe est l''ombre d''une projection repliée, un repli situé hors de la sphère de photons agrandirait l''ombre d''un trou noir. GW170817, avec la distance de sa galaxie hôte, donne $D = 4.00^{+0.07}_{-0.25}$ ; les ombres de M87* et de Sgr A* observées par l''EHT n''autorisent un repli qu''à moins d''environ $2.3$ rayons de Schwarzschild ; et les supernovae de Pantheon+ ne permettent pas de distinguer un univers à fuite (DGP) de $\Lambda$CDM. Tout concorde avec la relativité générale en $3+1$ : d''éventuelles dimensions supplémentaires doivent être des dimensions que la gravité ne ressent pas à ces échelles.'
notes: 'Statut : spéculatif. Il s''agit de l''hypothèse personnelle de l''auteur (voir la description de la série), et non de physique établie. Étape 6 de l''hypothèse de la projection, l''étape d''observation. L''étape 1 (cosmology/projection_postulate) a énoncé les postulats et constaté que la règle de Born ne survit que dans le cas indiscernable de la mécanique quantique standard ; les étapes 2 à 5 (projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test) développent P3, P5, P4 et P1-P2. Cette étape ajuste aux données ouvertes les paramètres libres de P4 (la géométrie comme projection pouvant se replier) et de P5 (la gravité a besoin d''un certain $d_G$, ajusté et non supposé), et montre le verdict quel qu''il soit. D''abord la physique connue. En relativité générale à $3+1$ dimensions, l''amplitude (strain) d''une onde gravitationnelle décroît comme $1/d$ ; dans un espace-temps à $D$ dimensions, son énergie se répartit sur une $(D-2)$-sphère
  et $h\propto d^{-(D-2)/2}$. Un détecteur qui suppose $1/d$ en déduit $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$ ($d_* = 1$ Mpc, comme chez Pardo, Fishbach, Holz et Spergel 2018) ou, si la fuite ne commence qu''au-delà d''une échelle d''écrantage $R_c$, $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ (leur forme écrantée, qui n''a de sens que pour $D > 4$). La prédiction de l''hypothèse : si la gravité se répand dans des dimensions supplémentaires à grande distance, $d_{GW} > d_{EM}$ et $D > 4$. Le test (a) : GW170817, une fusion d''étoiles à neutrons avec une contrepartie optique dans NGC 4993. Données : 8078 échantillons a posteriori de la distance de luminosité GW issus de la publication GWTC-1 (data/gw170817_distance.csv ; collaborations LIGO Scientific et Virgo, prior à faible spin, position sur le ciel libre ; GWOSC, licence CC BY 4.0 ; Abbott et al. 2019, PRX 9, 031040). Le prior de l''analyse est $\propto d^2$, donc chaque échantillon est pondéré par $d^{-2}$ et une estimation par
  noyau donne la vraisemblance de $d_{GW}$ (la valeur publiée est $40^{+8}_{-14}$ Mpc, Abbott et al. 2017). Distances EM (data/em_distances.csv, valeurs citées) : fluctuations de brillance de surface $40.7\pm1.4\pm1.9$ Mpc (Cantiello et al. 2018, ApJL 854, L31, la valeur par défaut) et les distances du flot de Hubble utilisées par Pardo et al., $v_H = 3017\pm250$ km/s divisé par $H_0 = 73.24\pm1.74$ (SH0ES) ou $67.74\pm0.46$ km/s/Mpc (Planck). Résultat : $D = 4.00^{+0.07}_{-0.25}$ (68 %, SBF ; l''ajustement par autograd donne $4.00\pm0.11$), $3.98^{+0.09}_{-0.24}$ (SH0ES) et $3.94^{+0.08}_{-0.24}$ (Planck). Pardo et al. ont trouvé $4.02^{+0.07}_{-0.10}$ (SH0ES) et $3.98^{+0.07}_{-0.09}$ (Planck) ; leur erreur inférieure est plus petite parce qu''ils ont fixé la position sur le ciel à celle de la contrepartie et utilisé la distribution a posteriori de $H_0$ de la LVC, tandis que les échantillons fournis ici ont une position sur le ciel libre, de sorte que la dégénérescence distance-inclinaison
  laisse une queue plus longue vers les petites distances. Pour une fuite écrantée, $-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ exclut $R_c$ en dessous de quelques centaines de Mpc pour $D = 5$, $n = 1$ et en dessous d''environ 50-80 Mpc pour $n = 2$ à 5 ; les transitions graduelles ($n(D-4)/2$ petit) sont exclues jusqu''au bord de la grille à $10^4$ Mpc. Pardo et al. citent $R_c\gtrsim 20$ Mpc pour toute raideur, à partir d''une distribution a posteriori plutôt que d''un rapport de vraisemblance. Verdict (a) : la gravité se comporte comme $D = 4.0$ à environ $\pm0.1$ près jusqu''à 40 Mpc ; toute dimension supplémentaire perçue par la gravité est compacte ou écrantée au-delà de ces distances. Le test (b) : les ombres de trous noirs. En Schwarzschild, la sphère de photons est à $r = 3GM/c^2$ et le rayon de l''ombre est $b_c = \sqrt{27}\,GM/c^2$ ; il est calculé ici à la fois comme $\min_r r/\sqrt{f}$ et par tracé de rayons de $u'''' = -u + \tfrac32 u^2$ pour un lot de paramètres d''impact.
  Le spin réduit le rayon équivalent en aire de l''ombre d''au plus 7 % (courbe de Bardeen ; $2(1+\sqrt2)\,GM/c^2$ pour un trou extrémal vu depuis le pôle). Le repli, un choix de modélisation de l''auteur précisé ici : P4 dit qu''une singularité est l''endroit où la projection se replie ; supposons que la géométrie projetée soit celle de Schwarzschild jusqu''à un repli au rayon $r_f$ et que la lumière qui atteint le repli ne revienne jamais. Un repli à l''intérieur de la sphère de photons ($r_f\leq 1.5\,r_s$) laisse l''ombre inchangée ; un repli à l''extérieur fait du bord de l''ombre le rayon qui le frôle, $b = r_f/\sqrt{1 - r_s/r_f}$, donc $\delta = b/b_c - 1 > 0$. Données (data/eht_shadows.csv, valeurs citées) : anneau de M87* $42\pm3$ $\mu$as et $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as (EHT 2019, articles I et VI), contre $3.64\pm0.22$ $\mu$as d''après la dynamique stellaire (Gebhardt et al. 2011, $6.6\pm0.4\times10^9\,M_\odot$ à 17.9 Mpc), donc $\delta = +0.04\pm0.13$ (calculé ici, pas une valeur
  publiée) ; anneau de Sgr A* $51.8\pm2.3$ $\mu$as (EHT 2022, article I) et $\delta = -0.04^{+0.09}_{-0.10}$ (prior Keck) et $-0.08\pm0.09$ (prior VLTI) d''après l''article VI, tableau 2. En prenant $\delta + 2\sigma$ et en laissant le spin masquer jusqu''à 7 %, un repli peut agrandir l''ombre d''au plus 0.37 (M87*), 0.21 (Keck) et 0.17 (VLTI), donc $r_f\leq 2.86$, $2.40$ et $2.28\,r_s$. Verdict (b) : les ombres correspondent à Schwarzschild/Kerr ; un repli au-delà d''environ $2.3\,r_s$ est exclu, mais un repli à l''intérieur de la sphère de photons, là où P4 le placerait naturellement (à l''horizon ou à la singularité centrale), est invisible sur les images d''ombre. Le test (c, facultatif) : les supernovae. Dans un monde-brane DGP, la gravité fuit dans une cinquième dimension au-delà de $r_c$ et l''expansion obéit à $H^2 - H/r_c\propto\rho$ ; l''indice $\alpha$ de Dvali et Turner interpole ($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$ correspond à $\Lambda$CDM, $\alpha
  = 1$ à DGP). Données : la table Pantheon+ de cosmology/cosmological_constant_fit, copiée dans data/pantheon_plus.csv (1466 supernovae, $z > 0.01$, erreurs diagonales ; Scolnic et al. 2022, Brout et al. 2022 ; les fichiers de données Pantheon+ ne portent aucune licence déclarée, les articles sont sous CC BY 4.0). Résultat (priors uniformes, $-1\leq\alpha\leq 1.8$) : $\alpha = 0.44\pm0.71$ ; $\chi^2 = 639.5$ pour $\Lambda$CDM et $638.9$ pour DGP (tous deux bien en dessous du nombre de supernovae, car les erreurs diagonales incluent la diagonale de la covariance). Verdict (c) : les supernovae seules ne peuvent pas distinguer un univers à fuite de $\Lambda$CDM ; c''est la combinaison avec le CMB et les oscillations acoustiques des baryons qui exclut la branche DGP auto-accélérée (par exemple Fang et al. 2008, Phys. Rev. D 78, 103509), qui n''est pas réajustée ici. Verdict global pour P4 et P5 : chaque test est compatible avec la relativité générale à $3+1$ dimensions. L''hypothèse ne survit
  que si les dimensions au-delà de $3+1$ sont des dimensions que la gravité ne ressent pas à ces échelles (compactes, écrantées, ou présentes uniquement dans le secteur quantique des étapes 1 et 5), et si tout repli se trouve à l''intérieur de la sphère de photons. C''est une contrainte, pas un soutien : jusqu''ici, la série n''a pas trouvé de prédiction qui diffère de la physique standard et s''accorde avec les données.'
meanings:
- 8078 échantillons de distance de GW170817 (GWTC-1) ; $w_i = d_i^{-2}$ retire le prior uniforme en volume
- '$i$ répété (échantillons) ⇒ sommé : densité par noyau de $d_{GW}$, une vraisemblance normalisée'
- distance qu'un détecteur déduit lorsque la gravité se répand dans $D_a$ dimensions, pour chaque distance EM $d_j$
- distribution a posteriori de $D$, la distance EM marginalisée ($j$ sommé, méthode des trapèzes)
- 'ajustement par autograd : pas de Newton sur $\log p(D)$, erreur tirée de la dérivée seconde (Laplace)'
- orbites de photons $u = r_s/r$ pour $B$ paramètres d'impact et $F$ rayons de repli à la fois (RK4 en $\varphi$)
- croissance relative de l'ombre due à un repli en $r_f$ (nulle à l'intérieur de la sphère de photons)
- réduction de l'ombre de Kerr (courbe de Bardeen, rayon équivalent en aire) pour les spins $a$ et les inclinaisons
- $\chi^2$ des supernovae pour chaque indice de fuite $\alpha_a$ et $\Omega_{m}$, le décalage ($H_0$, $M$) retiré ; $i$ sommé
labels:
  em_distance: Distance électromagnétique de NGC 4993 utilisée pour le verdict
  D_screen: Dimension $D$ au-delà de l'échelle d'écrantage (fuite écrantée)
  n_screen: Raideur $n$ de la transition d'écrantage
  inc_max_sgra: Plus grande inclinaison de Sgr A* pour la bande de spin
