source_hash: 55836e86a221
title: チューリング機械の一括実行で見る停止問題
summary: '物理ではなく、お楽しみ: 何十万台ものチューリング機械をテンソルとして同時に動かします。全機械の 1 ステップは、gather(各ヘッドの下のテープを読む)、高度なインデックス参照による規則の検索、scatter(書き込み)だけです。2 状態と 3 状態のビジービーバー候補をすべて列挙し、チャンピオン $S(2) = 6$ と $S(3) = 21$ を見つけ、停止問題を実際に体験しましょう。どんなステップ予算を選んでも、まだ決着のつかない機械が残ります。'
notes: 'チューリング (1936) は、任意の機械と入力について停止するかどうかを判定できるプログラムは存在しないことを示しました。対角線論法を一段落で: 機械 $D(M)$ が、自分自身の記述を入力として起動された任意の機械 $M$ について「停止する」か「永遠に動く」かを答えるとします。$D(M)$ を実行してその逆を行う $G$ を作ります。$D$ が「停止する」と言えば永遠にループし、$D$ が「永遠に動く」と言えば停止します。では $G$ に自分自身の記述を与えるとどうなるでしょう。停止するなら $D$ は永遠に動くと言ったはずで、永遠に動くなら $D$ は停止すると言ったはずです。どちらにしても $D$ は間違っているので、$D$ は存在できません。ラドー (1962) はこれをビジービーバーというゲームにしました。空白のテープから始めて停止する $n$ 状態 2 記号の機械のうち、$S(n)$ は最長の実行ステップ数、$\Sigma(n)$ は残す 1 の最大個数です。どちらもあらゆる計算可能関数より速く増大します。$S(n)$ を計算するプログラムがあれば停止問題が解けてしまうからです: 各機械を $S(n)$ ステップ動かし、それまでに止まらなければ永遠に止まりません。既知の値: $S(2) = 6$, $\Sigma(2) = 4$(ラドー)、$S(3) = 21$, $\Sigma(3) = 6$(リンとラドー 1965)、$S(4) = 107$, $\Sigma(4) = 13$(ブレイディ 1983)、そして $S(5) = 47\,176\,870$ は 2024 年に bbchallenge コラボレーションが、他のすべての 5 状態機械が永遠に動くことを Coq で検証した証明によって確定させました。グラフはその難しさを示します: 停止した割合 $f(t)$ は増えてから平らになり、有限の予算では、ゆっくり停止する機械と永遠に動く機械を区別できません。ここでのステップ 21 以降の平坦部は 3 状態の既知の答えです。残りの機械はループすることが証明されているからです。3 状態の正規化: 最初の規則を A0 → 1RB に固定します。これは既知のチャンピオンを含む一般的な選び方です(左右対称性により最初の移動は右としてよく、他の状態の名前は入れ替え可能で、空白テープ上で
  A にとどまる機械は決して停止しません)。また停止規則はすべて 1RH とし、$16^6$ ではなく $13^5 = 371\,293$ 台の機械になります。4 状態も試してみましょう: ランダムなサンプルに 107 ステップのチャンピオンが含まれることはまれです。'
meanings:
- '機械 $b$ の、状態 $q$ と読んだ記号 $r$ に対する規則表: (書く記号 $w$、移動 $m = \pm1$、次の状態 $q''$); 状態 $n$ は停止状態 $H$'
- 機械 $b$ のテープのセル $x$、最初はすべて 0; どのヘッドも端に届かないよう $L = 2t_{\max} + 1$
- ヘッド位置(最初は中央)と現在の状態(最初は $A$)
- すべてのヘッドの下の記号を一度に読む
- '高度なインデックス参照: 各機械が自分の規則を引く'
- 書き込み; その後 $s_b \ne H$ の機械だけが移動し状態を変える(停止した機械は凍結)
- '機械 $b$ が $H$ に入ったステップ、または $-1$: 予算内では未決着'
- '$\tau_b \le t$ となる機械の割合: 単調非減少で、1 未満にとどまる'
- '$x$ の繰り返し ⇒ 和: 停止した機械が残す 1 の個数'
labels:
  states: 状態数 $n$(2 と 3 は全列挙、4 はサンプル)
  budget: ステップ予算 $t_{\max}$
  n_sample: ランダムな 4 状態機械の数
