source_hash: 09cd4df32aa9
title: 'NeRF: объёмный рендеринг нейронного поля излучения'
summary: 'Небольшая MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$ задаёт каждой точке пространства плотность и цвет. Пиксель — это свет, собранный вдоль его луча: стратифицированные выборки $t_s$, затем квадратура $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$ с пропусканием $T_s = e^{-\sum_{s''<s}\sigma_{s''}\delta_{s''}}$, пакетно по лучам × выборкам. Обученная только на фотографиях синтетической сцены, она рендерит отложенный ракурс и карту глубины, а вторая сеть без позиционного кодирования показывает спектральное смещение обычных MLP.'
notes: 'Обучающие данные — $V$ фотографий красной сферы, клетчатого куба и оранжевого шара, полученных аналитической трассировкой лучей с ламбертовым затенением; сеть никогда не видит геометрию, только цвета пикселей и луч каждого пикселя. Каждый шаг Adam берёт случайный пакет лучей из всех обучающих пикселей, рендерит их квадратурой и сравнивает с истинными цветами. Поскольку $w_{rs}$, $T_{rs}$ и цвета — гладкие функции от $\sigma$ и $\mathbf c$, автоматическое дифференцирование переносит ошибку фотографии назад в сеть: плотности растут там, где лучи многих ракурсов сходятся на поверхности. Это видно по карте глубины $\sum_s w_s t_s$ и профилю весов вдоль отмеченного луча: веса стягиваются в пик на истинной поверхности. Позиционное кодирование — ключевой приём. Обычная MLP на $(x, y, z)$ сначала выучивает низкие частоты и очень медленно подгоняет резкие края и мелкую текстуру (спектральное смещение); если вместо этого подать ей $\sin(2^k\pi x), \cos(2^k\pi x)$, она получает высокочастотные
  строительные блоки. За то же число шагов сеть с кодированием (синяя) даёт более чёткие силуэты, примерно вдвое меньшую ошибку глубины и более высокий PSNR на обучающих ракурсах, тогда как обычная (красная) остаётся размытой. На отложенном ракурсе выигрыш меньше: при немногих маленьких ракурсах мелкие детали ограничены лишь слабо, и обе сети ещё далеки от сходимости (настоящие NeRF обучаются часами). Упрощения по сравнению с Mildenhall et al. (ECCV 2020): нет входа направления взгляда (сцена ламбертова, поэтому её цвета не зависят от угла обзора), одна сеть вместо пары грубой + точной с иерархической выборкой, крошечная MLP (3 × 64 вместо 8 × 256), изображения $40\times 40$ и несколько сотен шагов вместо сотен тысяч. Попробуйте $L = 2$ или $L = 10$, меньше выборок $S$ (полосы от грубой квадратуры), больше шагов (шахматный узор появляется только с кодированием) или меньше ракурсов (геометрия становится неоднозначной, и отложенный ракурс ухудшается, хотя обучающие ракурсы всё ещё подгоняются).'
meanings:
- начало и единичное направление луча через каждый из $P$ пикселей каждой камеры
- 'одна случайная глубина в каждом из $S$ равных интервалов $[t_n, t_f]$: новый набор на каждом шаге, так что сеть видит весь луч'
- 'точки выборки: трансляция (broadcasting) по лучам $r$ и выборкам $s$'
- $\sin$ и $\cos$ от $2^k\pi x_i$, $k = 0 \dots L-1$; ничего не суммируется, внешнее произведение
- один слой MLP, применённый ко всем выборкам сразу, суммирование по $g$; ReLU между слоями
- плотность $\ge 0$ и цвет в $(0, 1)$
- длина каждого интервала вдоль луча
- 'пропускание: исключающая кумулятивная сумма оптической толщины $\tau = \sigma\delta$ по $s'' < s$'
- вероятность того, что свет, достигший пикселя, испущен в интервале $s$; $\sum_s w_{rs} \le 1$
- цвет пикселя, суммирование по $s$; оставшееся пропускание показывает белый фон
- 'ожидаемая глубина: те же веса бесплатно дают карту глубины'
labels:
  n_freq: Частоты кодирования $L$
  width: Ширина скрытого слоя $H$
  n_samples: Выборок на луч $S$
  steps: Шаги Adam (на сеть)
  batch: Лучей на шаг
  lr: Скорость обучения Adam
  n_views: Обучающие ракурсы $V$
  resolution: Размер изображения (пиксели)
