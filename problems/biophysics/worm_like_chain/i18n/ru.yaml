source_hash: 230765b6cfcc
title: 'Растяжение ДНК: червеобразная цепь'
summary: Если тянуть молекулу ДНК оптическим пинцетом, она сопротивляется как энтропийная пружина, которая резко ужесточается вблизи полной длины. Закон червеобразной цепи Марко–Сиггиа сравнивается со свободно-сочленённой цепью, а дискретная цепь единичных касательных с изгибной жёсткостью моделируется методом Монте-Карло сразу для целого пакета сил как один тензор $(B, M, N, 3)$. Персистентная длина $P \approx 50$ nm восстанавливается как из корреляций касательных, так и из аппроксимации кривой сила–удлинение.
notes: 'Двухцепочечная молекула ДНК жёсткая на малых масштабах, но гибкая на больших: направление её остова «помнится» на протяжении персистентной длины $P \approx 50$ nm (около 150 пар оснований), а затем забывается. Поэтому её выпрямление стоит энтропии, а не энергии связей. При малой силе отклик линейный, $z/L \approx 2 P F / 3 k_B T$, одинаковый для любого полимера с длиной Куна $b = 2P$; при большой силе червеобразная цепь лишь медленно приближается к полной длине, $1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$, потому что ей нужно разгладить изгибные моды всех длин волн, тогда как свободно-сочленённая цепь из жёстких звеньев выпрямляется гораздо быстрее, $1 - z/L \approx k_B T / F b$. Эксперименты с ДНК фага λ (Смит, Финци и Бустаманте 1992; Бустаманте, Марко, Сиггиа и Смит 1994) следуют червеобразной цепи примерно до 10 pN, где двойная спираль начинает упруго растягиваться, и испытывают перерастяжение около 65 pN; в этой модели нет ни того, ни другого. Формула Марко–Сиггиа — интерполяция
  между двумя пределами, и при промежуточных удлинениях она отличается от точной WLC по силе до примерно 10 %. В моделировании используются сегменты $a = 2.5$ nm, так что жёсткость $K \approx 20.5$; каждый проход Монте-Карло немного поворачивает каждую касательную (Метрополис в локальном поле), а затем поворачивает хвост каждой цепи вокруг случайной оси (pivot-ход). Первая половина проходов — уравновешивание, по второй половине проводится усреднение. При самых малых силах удлинение сильно флуктуирует от цепи к цепи и медленно релаксирует, поэтому эти точки разбросаны. Аппроксимация использует диапазон 0.5–4 pN: формула Марко–Сиггиа решается относительно $P$ в каждой точке, и результаты усредняются в логарифмическом масштабе (наименьшие квадраты по $\log F$). Выше $F \sim K k_B T / a$ дискретность цепи проявляется как немного большее удлинение, чем по непрерывному закону. Экспериментальные данные не включены.'
meanings:
- единичная касательная сегмента $i$ цепи $m$, растягиваемой силой $b$; цепи стартуют как WLC без силы
- $F_0 = 0$ плюс 12 сил от 0.02 до 10 pN; $f_b$ — работа $F a$ в единицах $k_B T$
- изгибная жёсткость $\kappa / k_B T$, выбранная так, что $\coth K - 1/K = e^{-a/P}$, т. е. $K \approx P/a + \tfrac12$
- притяжение двух соседних касательных плюс сила вдоль $z$
- 'повторяющийся $k$ ⇒ суммирование: изменение энергии при повороте одной касательной; чётные и нечётные сегменты двигаются по очереди'
- 'повторяющиеся $i, k$ ⇒ суммирование: полная энергия изгиба, используется для pivot-ходов, поворачивающих целый хвост'
- удлинение вдоль силы, делённое на контурную длину
- корреляция касательных свободной цепи; длина её затухания равна $P$
labels:
  persistence: Персистентная длина $P$
  contour_length: Контурная длина $L$
  chains: Цепей на силу $M$
  sweeps: Проходы Монте-Карло
