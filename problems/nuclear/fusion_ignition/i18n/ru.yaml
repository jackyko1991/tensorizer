source_hash: b05c63a03eb9
title: Зажигание горячего пятна DT в инерциальном синтезе
summary: '0D-модель горячего пятна в центре сжатой дейтерий-тритиевой капсулы. Альфа-частицы из $\mathrm{D + T \to {}^4He + n}$ нагревают его, тормозное излучение и расширение охлаждают, а тепло, уходящее в холодную оболочку, подпитывает горение. Целая сетка начальных температур и поверхностных плотностей $(T_0, \rho R_0)$ интегрируется одним пакетом: выше границы типа Лоусона горячее пятно разгоняется и горит, ниже — гаснет.'
notes: 'Инерциальное удержание сжимает несколько сотен микрограммов DT так быстро, что оно сгорает раньше, чем разлетится. Горячее пятно зажигается, когда производимые им альфа-частицы нагревают его быстрее, чем оно остывает. Это определяют два числа: температура, потому что $\langle\sigma v\rangle$ круто растёт до десятков кэВ, и поверхностная плотность $\rho R$, потому что более толстое горячее пятно останавливает собственные альфа-частицы (пробег альфа-частиц примерно 0.3 г/см² около 10 кэВ) и дольше противостоит расширению. Одно тормозное излучение задаёт идеальную температуру зажигания, около 4.3 кэВ, где $\tfrac14\langle\sigma v\rangle E_\alpha = C_B\sqrt T$. Пунктирная кривая — мгновенный баланс, форма критерия Лоусона для ИТС; затенённая область — то, что находит полное интегрирование, которое учитывает и распространение горения в холодную оболочку. Увеличьте множитель потерь $L$, и граница сдвинется к большим $\rho R$ и более высоким $T$. Научный контекст: 5 декабря 2022 года National
  Ignition Facility сообщила о первом лабораторном эксперименте по синтезу с коэффициентом усиления мишени выше 1 — около 3.15 МДж энергии синтеза из 2.05 МДж лазерного света на мишени (приблизительно; Indirect Drive ICF Collaboration, Phys. Rev. Lett. 132, 065102, 2024) — после достижения горящей плазмы (Zylstra et al., Nature 601, 542, 2022) и выстрела 1.3 МДж в августе 2021 года, превысившего критерий Лоусона для зажигания (Phys. Rev. Lett. 129, 075001, 2022). Коэффициент усиления мишени учитывает только лазерную энергию, достигающую мишени; электроэнергия, затраченная на работу лазеров, гораздо больше. Упрощения: однородное 0D горячее пятно при фиксированной плотности (поэтому доля выгорания завышена — разлёт вызывает только член потерь PdV), иллюстративная формула поглощения альфа-частиц, приближённая спитцеровская теплопроводность ($\ln\Lambda \approx 10$), без запирания излучения, без примеси материала аблятора и равные температуры ионов и электронов.'
meanings:
- каждая точка сетки $b = i\,n_r + j$ — одно горячее пятно; состояние — $(\ln T, \ln\rho R, \varphi)$
- реактивность DT по Bosch–Hale, $\approx 1.14\times10^{-22}$ м³/с при 10 кэВ, максимум $\approx 9\times10^{-22}$ около 65 кэВ
- доля энергии альфа-частиц 3.5 МэВ, остановленная внутри горячего пятна
- тормозное излучение, $C_B = 5.34\times10^{-37}$ Вт м³ кэВ$^{-1/2}$
- работа PdV горячего пятна, расширяющегося со скоростью звука
- спитцеровская теплопроводность в оболочку; возвращается как новая горячая масса (распространение горения)
- правая часть для всех горячих пятен сразу, шаги RK4
- кривая типа Лоусона, где самонагрев равен потерям, пакетной бисекцией
labels:
  density: Плотность горячего пятна $\rho$
  loss: Множитель потерь $L$ (тормозное излучение + PdV)
  rho_r_max: Доступное полное $\rho R$ топлива
  t_end: Моделируемое время
  n_grid: Точек сетки по оси
  t_min: Наименьшая $T_0$
  t_max_init: Наибольшая $T_0$
