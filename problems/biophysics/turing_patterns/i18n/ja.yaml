title: チューリングパターン：Gray–Scott 反応拡散系
summary: 異なる速さで反応し拡散する二つの化学物質は、ほぼ一様な混合物を斑点、縞、迷路に変えることができる。これは動物の毛皮の模様やその他の生物のパターンがどのように形成されるかについての、チューリングの 1952 年のアイデアである。Gray–Scott モデルを周期境界の格子上で 5 点ラプラシアン・ステンシルを用いて、四つの $(F, k)$ の組について一つの $(2, B, n, n)$ テンソルで同時に解き、線形安定性解析（分散関係 $\lambda(q)$）によって真のチューリング不安定性がどこに存在するかを示す。
notes: チューリングの洞察は、通常はすべてをならしてしまう拡散が、自己触媒物質（ここでは $v$）がそれを制限する物質（$u$）よりもゆっくり広がるとき、一様な状態を不安定化しうるということである：$v$ の小さな盛り上がりは $u$ を消費して局所的に成長し、その周囲での $u$ の枯渇が近隣の成長を止める。短距離の活性化と長距離の抑制である。線形安定性解析でこれを厳密にできる。一様状態上の波 $e^{i\mathbf q\cdot\mathbf x + \lambda t}$ は $J - q^2\,\mathrm{diag}(D_u, D_v)$ の固有値で成長する。$\lambda(0) < 0$ だがある帯域の $q$ で $\lambda(q) > 0$ なら、最も速く成長する波長 $2\pi/q_{\max}$ が微小なノイズから現れる。$D_u = D_v$ ではすべての固有値が $-Dq^2$ だけずれるだけなので、チューリング不安定性は起こりえない：拡散比を 1 にするとマップ上の青い領域は消える。Gray–Scott では、ここで扱う組のうち「Turing」だけがこの種類で、一様状態に 1 % のノイズを加えて始める。破線は振幅が最初に $e^{\lambda_{\max} t}$ で成長することを確かめる。有名な斑点、縞、迷路（Pearson 1993）の多くは、唯一の一様状態が $u = 1$、$v = 0$ である領域にあり、その状態はあらゆる小さな摂動に対して安定である。これらのパターンには有限の種（$v$ の小さな正方形をいくつか）が必要で、線形のチューリング不安定性ではなく、非線形で自己複製する構造である。5 点ステンシルは波を $q^2 \to (4/h^2)\sin^2(qh/2)$ と見なし、多数のセルにわたる波長では $q^2$ に近い。実際の生物の例には、四肢の指の間隔、毛包の間隔、魚の皮膚の縞などがあり、そこでは活性化因子と抑制因子はシグナルタンパク質である。
meanings:
- 組 $b$ の供給率と除去率；末尾の 1 で格子全体にブロードキャストする
- 各組のセル $(i, j)$ における基質と自己触媒物質の濃度、形状 $(2, B, n, n)$ の $y$ に積み重ねる
- 四つの隣接セルから中心の 4 倍を引く、周期境界には torch.roll を使う
- 自己触媒反応 $U + 2V \to 3V$、供給、除去
- $\Delta t = 1$ の陽的オイラー法、$D\,\Delta t / h^2 < 1/4$ の間は安定
- $(1, 0)$ は常に存在；$F \ge 4(F + k)^2$ のときさらに二つ
- 一様状態での線形化された反応項 $\partial R_\alpha / \partial c_\beta$
- $Q$ 個の波数のバッチに対する $M(q)$ の最大 $\operatorname{Re}$ 固有値
- $\lambda(0) < 0$ だがある帯域で $\lambda(q) > 0$ となる状態：チューリング不安定性
labels:
  grid: 格子サイズ $n$
  steps: 時間ステップ数
  ratio: 拡散比 $D_v / D_u$
