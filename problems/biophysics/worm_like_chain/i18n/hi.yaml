source_hash: 230765b6cfcc
title: 'DNA को खींचना: कृमि-सदृश श्रृंखला (worm-like chain)'
summary: प्रकाशिक चिमटी (optical tweezers) से DNA अणु को खींचें तो यह एक एन्ट्रॉपिक स्प्रिंग की तरह प्रतिरोध करता है जो पूर्ण लंबाई के पास तेज़ी से कठोर हो जाती है। मार्को–सिग्गिया कृमि-सदृश-श्रृंखला नियम की तुलना एक मुक्त रूप से जुड़ी श्रृंखला (freely jointed chain) से की जाती है, और बंकन कठोरता वाली इकाई स्पर्शरेखाओं की एक विविक्त श्रृंखला को बलों के पूरे बैच के लिए एक साथ, एक $(B, M, N, 3)$ टेंसर के रूप में, मोंटे कार्लो से अनुकारित किया जाता है। स्थायित्व लंबाई (persistence length) $P \approx 50$ nm स्पर्शरेखा सहसंबंधों और बल–विस्तार वक्र के फिट, दोनों से वापस मिलती है।
notes: 'द्वि-रज्जुक DNA अणु छोटे पैमानों पर कठोर पर लंबे पैमानों पर लचीला होता है: इसके बैकबोन की दिशा स्थायित्व लंबाई $P \approx 50$ nm (लगभग 150 क्षार युग्म) तक याद रहती है, फिर भूल जाती है। इसलिए इसे सीधा खींचने में आबंध ऊर्जा नहीं, एन्ट्रॉपी खर्च होती है। कम बल पर प्रतिक्रिया रैखिक है, $z/L \approx 2 P F / 3 k_B T$, कुह्न लंबाई $b = 2P$ वाले किसी भी बहुलक के लिए समान; उच्च बल पर कृमि-सदृश श्रृंखला केवल धीरे-धीरे पूर्ण लंबाई के पास पहुँचती है, $1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$, क्योंकि उसे हर तरंगदैर्ध्य के बंकन मोड सीधे करने होते हैं, जबकि दृढ़ कड़ियों वाली मुक्त रूप से जुड़ी श्रृंखला बहुत तेज़ी से सीधी होती है, $1 - z/L \approx k_B T / F b$। λ-फेज DNA पर प्रयोग (Smith, Finzi और Bustamante 1992; Bustamante, Marko, Siggia और Smith 1994) लगभग 10 pN तक कृमि-सदृश श्रृंखला का अनुसरण करते हैं, जहाँ द्वि-कुंडली प्रत्यास्थ रूप से खिंचने लगती है, और लगभग 65 pN के पास अति-खिंचाव (overstretch) होता है; इस मॉडल में इनमें से कोई नहीं है। मार्को–सिग्गिया सूत्र दो सीमाओं के बीच एक अंतर्वेशन
  है और मध्यवर्ती विस्तार पर सटीक WLC से बल में लगभग 10 % तक भिन्न होता है। अनुकरण $a = 2.5$ nm के खंडों का उपयोग करता है, इसलिए कठोरता $K \approx 20.5$ है; हर मोंटे कार्लो स्वीप हर स्पर्शरेखा को थोड़ा घुमाता है (स्थानीय क्षेत्र पर मेट्रोपोलिस) और फिर हर श्रृंखला की पूँछ को एक यादृच्छिक अक्ष के परितः घुमाता है (पिवट)। स्वीपों का पहला आधा संतुलन-स्थापन है और दूसरे आधे का औसत लिया जाता है। सबसे कम बलों पर विस्तार श्रृंखला-दर-श्रृंखला बहुत उतार-चढ़ाव करता है और धीरे-धीरे शिथिल होता है, इसलिए वे बिंदु बिखरे होते हैं। फिट 0.5–4 pN का उपयोग करता है: हर बिंदु पर मार्को–सिग्गिया को $P$ के लिए हल किया जाता है और लॉग समष्टि में औसत लिया जाता है ($\log F$ में न्यूनतम वर्ग)। $F \sim K k_B T / a$ से ऊपर श्रृंखला की विविक्तता सतत नियम की तुलना में थोड़े अधिक विस्तार के रूप में दिखती है। कोई प्रायोगिक आँकड़े शामिल नहीं हैं।'
meanings:
- बल $b$ से खींची गई श्रृंखला $m$ के खंड $i$ की इकाई स्पर्शरेखा; श्रृंखलाएँ बल-मुक्त WLC के रूप में शुरू होती हैं
- $F_0 = 0$ और 0.02 से 10 pN तक 12 बल; $f_b$ $k_B T$ की इकाइयों में कार्य $F a$ है
- बंकन कठोरता $\kappa / k_B T$ इस प्रकार चुनी गई कि $\coth K - 1/K = e^{-a/P}$, अर्थात $K \approx P/a + \tfrac12$
- दो पड़ोसी स्पर्शरेखाओं का खिंचाव और $z$ के अनुदिश बल
- 'दोहराया गया $k$ ⇒ योग: एक स्पर्शरेखा घुमाने का ऊर्जा परिवर्तन; सम और विषम खंड बारी-बारी से चलते हैं'
- 'दोहराए गए $i, k$ ⇒ योग: कुल बंकन ऊर्जा, पूरी पूँछ घुमाने वाली पिवट चालों के लिए प्रयुक्त'
- बल के अनुदिश विस्तार को कंटूर लंबाई से भाग
- मुक्त श्रृंखला का स्पर्शरेखा सहसंबंध; इसकी क्षय लंबाई $P$ है
labels:
  persistence: स्थायित्व लंबाई $P$
  contour_length: कंटूर लंबाई $L$
  chains: प्रति बल श्रृंखलाएँ $M$
  sweeps: मोंटे कार्लो स्वीप
