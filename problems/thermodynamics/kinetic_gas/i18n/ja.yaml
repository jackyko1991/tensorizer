source_hash: 673b0fc9f634
title: 理想気体の気体分子運動論
summary: 数百個の剛体円板が箱の中を跳ね回る。すべての円板が同じ速さで出発するが、弾性衝突がエネルギーをかき混ぜ、やがて速さはマクスウェル–ボルツマン分布に従うようになる。円板が壁に渡す運動量は理想気体の状態方程式 $PA = NkT$ を再現する。
notes: 換算単位：箱の一辺 1、質量 1、ボルツマン定数 1。対テンソルは $N\times N$ であり、数百個の円板なら問題ない（実際のコードではセルリストを使う）。同じステップで2つの円板に接触した円板は1ステップ待つので、すべての衝突は純粋な2体交換となり、エネルギーは丸め誤差の範囲で保存される。圧力は1回の跳ね返りで渡される運動量 $2m\lvert v_\perp\rvert$ を全期間にわたって合計し、時間 × 壁の長さで割ったものである。円板自身が面積を占めるので、$NkT/A$ より数パーセント大きくなる——これは理想気体からの最初の補正であり、面積占有率 $\eta$ に対しておよそ $(1 + \eta^2/8)/(1 - \eta)^2$ である。
meanings:
- 円板 $a$ の位置、成分 $i \in \{x, y\}$
- 円板 $a$ の速度
- すべての対の変位を一度に、ブロードキャストで
- 繰り返される $i$ ⇒ 和をとる：各対の距離の2乗
- 衝突する $P$ 個の対について、衝突法線に射影した相対速度
- 全運動エネルギー、2次元では $NkT$ に等しい
- 2次元の速さの分布 $(mv/kT)\exp(-mv^2/2kT)$
labels:
  n_particles: 粒子数
  radius: 円板の半径
  speed: 初速
  t_max: シミュレーション時間
