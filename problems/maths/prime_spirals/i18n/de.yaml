title: Primzahlspiralen und die Hardy–Littlewood-Vermutungen
summary: 'Die Primzahlen in einen einzigen booleschen Tensor sieben und sie auf der Ulam- und der Sacks-Spirale zeichnen, wo sie sich auf Linien drängen. Jede Linie ist ein quadratisches Polynom wie Eulers $k^2 + k + 41$, und die Hardy–Littlewood-Vermutungen sagen voraus, wie viele Primzahlen sie enthält. Dasselbe Sieb testet dann ihre Vorhersagen für Primzahlzwillinge und für Goldbach sowie Cramérs Zufallsmodell der Primzahllücken. Es handelt sich um Vermutungen: Das Programm überprüft sie numerisch, es beweist sie nicht.'
notes: 'Ulam (1963) schrieb die ganzen Zahlen auf eine quadratische Spirale und bemerkte, dass sich die Primzahlen entlang von Diagonalen aufreihen; die Sacks-Spirale (1994) setzt $n$ auf den Radius $\sqrt n$ und den Winkel $2\pi\sqrt n$ und zeigt stattdessen Kurven. Jeder diagonale Strahl der Ulam-Spirale enthält die Werte eines quadratischen Polynoms $4k^2 + bk + c$, und auf der bei 41 beginnenden Spirale ist die Hauptdiagonale Eulers $k^2 + k + 41$, prim für $k = 0, \dots, 39$ (bewiesen: Rabinowitsch zeigte, dass $k^2 + k + p$ genau dann für alle $k < p - 1$ prim ist, wenn $\mathbb Q(\sqrt{1 - 4p})$ Klassenzahl eins hat, also $p \in \{2, 3, 5, 11, 17, 41\}$, eine Liste, die Heegner und Stark vervollständigten). Manche Strahlen sind dicht besetzt und andere leer, und zwar wegen der Reste: $f$ hat modulo vieler kleiner Primzahlen keine Nullstellen, wenn seine Diskriminante für sie ein quadratischer Nichtrest ist. Hardy und Littlewood (1923) machten daraus die Vermutung F, die die Bateman–Horn-Vermutung
  (1962) als $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$ neu formuliert. Das Feld oben rechts testet sie an mehreren hundert quadratischen Polynomen gleichzeitig: Mit wachsendem $K$ nähern sich die gemessenen Konstanten den vorhergesagten $C(f)$ (die Diagonale). Von keinem quadratischen Polynom ist auch nur bekannt, dass es unendlich viele Primzahlwerte annimmt: Das ist Landaus viertes Problem (1912) für $n^2 + 1$, weiterhin offen. Für Eulers Polynom geben Hardy und Littlewood das Produkt über die ungeraden Primzahlen $3.3197732$ an; die Bateman–Horn-Konstante enthält den Faktor 2 von $p = 2$ (die Werte sind stets ungerade), sie beträgt also $6.6395$. Die Primzahlzwillingsvermutung mit der Konstante $C_2 = 0.6601618\ldots$ und die Goldbach-Vermutung mit ihrer singulären Reihe beruhen auf derselben Idee für $p$ und $p + 2$ bzw. für $p$ und $N - p$. Das Sieb reproduziert die bekannten Anzahlen $\pi_2(10^6) = 8169$ und $\pi_2(10^7) = 58980$, und Goldbachs Komet fällt auf die Vorhersage zusammen:
  Die Bänder des Kometen sind die singuläre Reihe (grün: $3 \mid N$). Beide Vermutungen sind offen. Goldbach ist für alle geraden Zahlen bis $4 \cdot 10^{18}$ verifiziert (Oliveira e Silva, Herzog und Pardi, 2014); Zhang (2014) sowie die Arbeiten von Polymath und Maynard bewiesen, dass es unendlich viele Primzahllücken von höchstens 246 gibt, und Chen (1973), dass jede große gerade Zahl Summe einer Primzahl und eines Produkts aus höchstens zwei Primzahlen ist. Cramérs Modell (1936) behandelt jedes $n$ mit Wahrscheinlichkeit $1/\ln n$ als prim; es sagt exponentialverteilte Lücken mit Mittelwert $\ln p$ voraus, nahe an dem, was wir sehen, und maximale Lücken der Größe etwa $\ln^2 p$, liegt aber bei der Zwillingsanzahl um genau den Faktor $2C_2 \approx 1.32$ daneben (gepunktete Linie), weil es die Teilbarkeit durch 2, 3, 5, … ignoriert. Maier (1985) zeigte, dass es auch auf andere Weise versagt, und Granville schlug maximale Lücken bis zu $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$ vor.'
meanings:
- 'Sieb des Eratosthenes: ein Slice mit Schrittweite pro Primzahl $p \le \sqrt{n_\text{max}}$'
- Position jeder Zahl auf der Ulam-Spirale auf einmal, aus ihrem Ring $k = \lceil(\sqrt m - 1)/2\rceil$ und ihrem Abstand zur Ecke $(2k+1)^2$
- 'Sacks-Spirale: die Quadrate $k^2$ liegen auf der positiven $x$-Achse'
- die Werte von $F$ quadratischen Polynomen $4k^2 + bk + c$ (den diagonalen Strahlen der Ulam-Spirale) an jedem $k$
- jeden Wert im Sieb nachschlagen; die laufende Summe zählt die Primzahlen auf jedem Strahl
- Nullstellen von $f_i$ modulo $p$ aus dem Euler-Kriterium $(D/p) \equiv D^{(p-1)/2}$, mit $D = b^2 - 4ac$; für $p < 50$ direkt ausprobiert
- 'wiederholtes $p$ ⇒ summiert: das Euler-Produkt als Summe von Logarithmen über die Primzahlen $p < 10^5$'
- 'wiederholtes $m$ ⇒ summiert: die Goldbach-Anzahl als Selbstfaltung, per FFT berechnet'
- Zwillingspaare $(p, p+2)$ mit $p \le x$
- normierte Lücken, verglichen mit dem $e^{-s}$-Gesetz von Cramérs Zufallsmodell
labels:
  side: Seitenlänge der Spirale
  start: Spirale beginnt bei
  log10_x: Zwillinge und Lücken bis $10^n$
  goldbach_max: Goldbach bis $N$
  k_poly: Quadratische Polynome bis $k$
