source_hash: 26b3bf83c6f6
title: A → B → C의 비어–람베르트 스펙트럼
summary: 분광 광도계로 연속 반응 $A \to B \to C$를 추적한다. 혼합물의 스펙트럼은 행렬 곱 $D = l\,E\,c$(파장 × 화학종)이므로, 잡음이 섞인 스펙트럼에서 유사 역행렬 $E^{+}$를 쓴 최소 제곱법으로 농도 변화를 되찾는다. 한 단계가 진행되는 동안 스펙트럼이 움직이지 않는 등흡광점을 보자.
notes: '각 화학종은 농도와 광로 길이에 비례해 빛을 흡수하며($D = \varepsilon\,l\,c$), 혼합물의 흡광도는 단순히 더해진다. 모든 파장과 시간에 대해 한꺼번에 쓰면 이는 행렬 곱 $D_{tw} = l\,E_{ws}c_{ts}$이므로, 파장 수가 화학종 수보다 많으면 농도는 과결정 선형계에서 최소 제곱법으로 구해진다: 유사 역행렬 $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$를 써서 $\hat c = E^{+}D/l$. 이는 순수 스펙트럼들이 뚜렷이 다를 때만 작동한다. 터미널에 출력되는 $E$의 조건수가 잡음이 얼마나 증폭되는지 알려 준다. 반응 속도론 $A \to B \to C$는 선형계 $\dot{\mathbf c} = K\mathbf c$이며 행렬 지수 함수로 정확히 풀린다. $[A]$는 감소하고, $[B]$는 증가했다가 감소하며($t = \ln(k_1/k_2)/(k_1 - k_2)$에서 최대), $[C]$는 증가한다. $K$의 모든 열의 합이 0이므로 $[A] + [B] + [C]$는 일정하다. 등흡광점: $A \to B$만 일어나고 있다면 $[A] + [B]$가 고정된 채 $D = l(\varepsilon_A[A] + \varepsilon_B[B])$이므로, $\varepsilon_A = \varepsilon_B$인 파장에서는 흡광도가 변할 수 없다. 뚜렷한 등흡광점은 깨끗한 두 화학종 전환의 고전적인 징표이다. 여기서는 교차점이 $\varepsilon_A = \varepsilon_B$(초기)에서 $\varepsilon_B = \varepsilon_C$(후기)로 이동하며, 그 사이에는 세 화학종이 공존하므로 흐려진다. $k_2 = 0$으로 완벽한 등흡광점을, $k_2 \approx k_1$로 그것이 사라지는 것을 보자. 스펙트럼은 전형적인 염료 수준의 흡광 계수($\sim 10^4$ L mol$^{-1}$ cm$^{-1}$)를 갖는 합성 가우시안 띠이며, 1 cm 큐벳을 가정한다.'
meanings:
- 300–700 nm, 2 nm 간격
- 각 화학종의 몰 흡광 계수(합성 가우시안 띠, L mol$^{-1}$ cm$^{-1}$)
- $A \to B \to C$의 속도 행렬; 각 열의 합은 0(질량 보존)
- 모든 측정 시각에서의 정확한 농도; $r$ 합산
- '혼합물의 비어–람베르트 법칙: 흡광도가 더해짐, 화학종 $s$ 합산'
- 순수 스펙트럼의 겹침(그람) 행렬; $w$ 합산
- 유사 역행렬; 스펙트럼이 독립이면 torch.linalg.pinv(E)와 같음
- 잡음이 섞인 각 스펙트럼에서 얻은 최소 제곱 농도; $w$ 합산
- 단계 $A \to B$의 등흡광점($B \to C$도 마찬가지)
labels:
  k1: 속도 상수 $k_1$ ($A \to B$)
  k2: 속도 상수 $k_2$ ($B \to C$)
  t_end: 실행 시간
  c0: 초기 농도 $[A]_0$
  noise: 검출기 잡음 $\sigma$ (흡광도)
