title: बर्गर्स समीकरण और आघात (shock) का बनना
summary: 'सबसे सरल अरैखिक तरल समीकरण: तरंग के तेज़ भाग धीमे भागों को पकड़ लेते हैं, प्रोफ़ाइल तीखी होती जाती है और $t^* = 1/\max(-u_0'')$ के निकट एक आघात (shock) बनता है जिसे श्यानता पतला पर चिकना रखती है। अवकलज $N\times N$ आव्यूह हैं, इसलिए PDE प्रति पद एक einsum है, जिसकी जाँच सटीक कोल–हॉफ़ (Cole–Hopf) हल से की जाती है।'
notes: $u\,u_x$ को $(\tfrac12u^2)_x$ (संरक्षण रूप) में लिखने से योजना $\int u\,dx$ को सटीक रूप से संरक्षित रखती है। श्यानता के बिना अभिलक्षणिक रेखाएँ (characteristics) $x = x_0 + u_0(x_0)\,t$ समय $t^* = 1/\max(-u_0')$ पर काटती हैं और हल बहुमानी हो जाता; श्यानता इसके बजाय $\sim\nu/\Delta u$ चौड़ाई का आघात बनाती है। केंद्रीय अंतरों के लिए $|u|\Delta x/\nu \lesssim 2$ चाहिए, इसीलिए 512 बिंदुओं पर $\nu$ बहुत कम नहीं हो सकता। कोल–हॉफ़ रूपांतरण $u = -2\nu\,\partial_x\ln\varphi$ बर्गर्स को ऊष्मा समीकरण में बदल देता है, जिससे धराशायी सटीक वक्र मिलता है। शून्येतर विस्थापन $U_0$ आघात को गतिमान बनाता है।
meanings:
- ग्रिड बिंदु $x_i$ पर वेग (आवर्ती)
- केंद्रीय अंतर $(f_{i+1} - f_{i-1})/2\Delta x$ आव्यूह के रूप में
- द्वितीय अंतर $(f_{i+1} - 2f_i + f_{i-1})/\Delta x^2$
- 'दोहराया गया $j$ ⇒ योग: फ़्लक्स $\tfrac12 u^2$ का अवकलज'
- श्यान पद
- 'संरक्षित: $D$ और $L$ के स्तंभों का योग शून्य है'
- सटीक हल, प्रारंभिक बिंदुओं पर softmax-भारित औसत
labels:
  nu: श्यानता $\nu$
  amplitude: $u_0 = U_0 + A\sin x$ में आयाम $A$
  offset: विस्थापन $U_0$
  t_max: अनुकरण समय
