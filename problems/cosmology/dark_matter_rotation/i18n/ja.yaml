source_hash: 9483d7c492cb
title: 銀河の回転曲線と暗黒物質
summary: 銀河の中心から遠い星やガスは速く回りすぎている：SPARC データベースの実際の回転曲線は、見える質量がケプラー的な減少を予言するところでも平らなままである。全銀河をまとめた 1 回の autograd フィットで 4 つの説明を比べる：バリオンのみ（質量光度比 $\Upsilon$ 付き）、バリオン＋NFW 暗黒物質ハロー、バリオン＋コアをもつ Burkert ハロー、そして単一の加速度 $a_0$ をもつ MOND（動径加速度関係）。暗黒物質は重力から推定されたもので、直接検出されてはいない。
notes: データ：SPARC（Lelli、McGaugh、Schombert 2016、AJ 152, 157）の 6 銀河（NGC 3198、NGC 2403、NGC 6503、DDO 154、UGC 2885、NGC 7814）、ファイル Rotmod_LTG を変更せず data/sparc_rotation_curves.csv にコピー。出典 http://astroweb.cwru.edu/SPARC/ は SPARC 論文の引用を求めている；Zenodo のミラー（doi:10.5281/zenodo.16284118）は CC-BY-4.0 で公開。3.6 μm の質量光度比には $\Upsilon_d = 0.5$、$\Upsilon_b = 0.7$ を中心とする幅 0.1 dex の事前分布を置く（0 にすると無効）。フィットからわかること：妥当な $\Upsilon$ ではバリオンは外側の平らな速度に届かない（DDO 154 は $\Upsilon_d \approx 19$ を必要とし、どんな恒星種族も超える）。したがって見えない質量か修正された力学が必要で、これは Rubin と Ford が 1970 年代に可視光スペクトルで見つけたことである。どちらのハロー形状もよく合い、矮小銀河 DDO 154 はコアを好む（カスプ・コア問題）。単一の $a_0 \approx 1.1\times10^{-10}$ m/s² が驚くほどよく全銀河を記述する、と動径加速度関係は言う。正直な現状：暗黒物質はその重力から推定される（回転曲線、重力レンズ、銀河団、CMB、構造形成）；暗黒物質粒子は直接検出されていない。MOND は 1 パラメータで回転曲線をよく再現するが、銀河団、弾丸銀河団、CMB の音響ピークでは苦しく、広く受け入れられた相対論的版もない。ここでは距離と傾斜角を固定し（誤差は伝播させない）、MOND は最も単純な代数形で用いる。
meanings:
- 銀河 $g$ の半径 $r$ での観測速度と誤差、最長の曲線に合わせて埋めたもの
- 実データ点（1）か埋め草（0）
- 速度の 2 乗は足し合う；$\Upsilon$ は SPARC の円盤とバルジ（$\Upsilon = 1$ で計算）を拡大縮小
- 冷たい暗黒物質シミュレーションによるカスプ型ハロー、$\rho \propto 1/(x(1+x)^2)$
- コア型ハロー、$\rho \propto 1/((1+x)(1+x^2))$
- 全銀河で 1 つの関数と 1 つの $a_0$；ハローなし
- 繰り返す $r$ ⇒ 各銀河の実データ点について和
- 全モデル・全銀河で 1 つのスカラー：1 回の逆伝播ですべての勾配が出る（Adam のあと L-BFGS）
labels:
  iterations: L-BFGS 前の Adam 反復回数
  lr: Adam の学習率
  prior_dex: $\Upsilon$ の事前分布の幅（dex、0 = なし）
