source_hash: 3955d9d3b7d9
title: 미카엘리스–멘텐 효소 반응 속도론
summary: '효소는 기질과 결합하여 복합체를 형성하고 생성물을 내놓는다: $E + S \rightleftharpoons ES \to E + P$. 완전한 질량 작용 방정식을 세 가지 효소와 기질 적정 전체에 대해 하나의 $(4, B, C)$ 텐서로 한꺼번에 풀고, 준정상 상태 속도 법칙 $v = V_{max} S/(K_m + S)$ 및 라인위버–버크 맞춤과 비교한다.'
notes: '질량 작용만으로는 네 개의 연립 상미분방정식이 나온다. 미카엘리스와 멘텐(1913)은 브릭스와 홀데인(1925)의 형태로, 복합체 $ES$가 1초도 안 되는 사이에 쌓인 뒤 천천히만 변한다는 점에 주목했으므로 $d[ES]/dt \approx 0$으로 둘 수 있다. $E + ES = E_0$와 함께 이는 $[ES] = E_0 S/(K_m + S)$와 속도 법칙 $v = k_2 [ES] = V_{max} S/(K_m + S)$를 주며, 여기서 $K_m = (k_{-1} + k_2)/k_1$, $V_{max} = k_2 E_0$이다. 가운데 패널의 점들은 각 시험관의 현재 $(S, k_2 [ES])$를 보여 준다. 초기 급증 후 점들은 점선 곡선 위에 놓이고 기질이 소모됨에 따라 곡선을 따라 미끄러져 내려가는데, 이것이 바로 작동 중인 준정상 상태 근사(QSSA)이다. 축약 모형 $dS/dt = -V_{max} S/(K_m + S)$(주황색 점선)는 정확한 해 $S_0 - S + K_m \ln(S_0/S) = V_{max} t$까지 갖는다. 이 근사는 $E_0 \ll S_0 + K_m$일 때 성립한다. $E_0$를 2 µM으로 올리면 복합체에 갇힌 기질이 더 이상 무시할 수 없기 때문에 완전한 동역학이 QSSA보다 뒤처지는 것을 볼 수 있다. 생화학자들은 여러 $S_0$에서 초기 속도 $v_0$를 측정하고 $1/v_0 = (K_m/V_{max})(1/S_0) + 1/V_{max}$를 직선으로 맞춘다(라인위버–버크, 1934). $y$절편은 $1/V_{max}$이고 $x$절편은 $-1/K_m$이다. 이중 역수 그래프는 낮은 $S_0$에서 오차를 증폭하므로, 잡음이 있는 데이터에는 직접 비선형 맞춤이 더 낫다. 효소 A, B, C는 결합력과 속도를 맞바꾼다. A는 작은 $K_m$을, C는 가장 큰 $k_{cat}$을 가지며, 낮은 기질 농도에서 누가 이기는지는 촉매 효율 $k_{cat}/K_m$이 결정한다. 단순화: 활성 부위 하나, 비가역적 생성물 방출,
  저해 없음, 잘 섞인 부피.'
meanings:
- 효소 $b$의 결합, 해리, 촉매 속도 상수 ($k_2 = k_{cat}$)
- 적정의 초기 기질 농도 $c$ (µM)
- 각 시험관의 자유 효소, 기질, 복합체 $X = ES$, 생성물
- '합산되는 지표 없음: $k_b$가 모든 농도 $c$로 브로드캐스트된다'
- RK4의 우변; $E + X = E_0$와 $S + X + P = S_0$는 일정하게 유지된다
- 미카엘리스 상수(속도가 절반이 되는 기질 농도)와 최대 속도
- 짧은 급증 후 측정한 초기(정상 상태) 속도
- 라인위버–버크 정규 방정식, $A_{ck} = [1/S_c,\ 1]$; 반복된 $c$ ⇒ 합산
- 각 효소의 기울기 $K_m/V_{max}$와 절편 $1/V_{max}$
labels:
  E0: 효소 $E_0$
  t_end: 시뮬레이션 시간
  enzyme: 진행 곡선용 효소
