source_hash: f0ace6f81d9f
title: 'AlphaGo в миниатюре: поиск по дереву на доске го $5\times5$'
summary: 'Одна партия го в игре с самим собой на крошечной доске, ходы в которой выбирает тот же поиск, что использовал AlphaGo: поиск по дереву методом Монте-Карло с правилом PUCT. Сами правила го — тензорные операции: взятие камней и подсчёт очков по площади являются заливками, по одному einsum с матрицей смежности доски на шаг. Каждая новая позиция оценивается целым пакетом случайных партий, сыгранных одновременно. Посмотрите, как число посещений сосредотачивается на ходе, в который верит поиск.'
notes: 'Каждая симуляция спускается по дереву, выбирая максимум PUCT, добавляет одну новую позицию, оценивает её пакетом случайных доигровок (playout) и прибавляет этот результат к каждому ходу на пути. Хорошие ходы набирают посещения, поэтому поиск сосредотачивается там, где это важно, не просматривая каждый вариант. AlphaGo использовал тот же цикл, но заменил равномерное априорное распределение $P_a$ сетью стратегии, а случайные доигровки — сетью оценки, обе обученные на партиях; AlphaGo Zero выучил обе исключительно игрой с самим собой. На $5\times5$ первый ход в центр силён для чёрных; при малом числе симуляций поиск делает заметные ошибки; увеличьте число симуляций, и игра станет точнее, но медленнее. Правила: Тромпа–Тейлора (самоубийство снимает собственную группу, подсчёт по площади) с простой проверкой ко.'
meanings:
- 'пункт $p$ доски: $+1$ чёрные, $-1$ белые, 0 пусто'
- 'доска как граф: 1, когда $p$ и $q$ — соседи по горизонтали или вертикали'
- 'заливка: от пустых пунктов через один цвет находятся группы с дыханием; остальное снимается'
- 'подсчёт по площади: камни плюс пустые пункты, достижимые только этим цветом, чёрные минус белые минус коми $k$'
- $R$ случайных партий, сыгранных как один тензор $(R, n^2)$; средний результат для чёрных; свой глаз никогда не заполняется
- 'PUCT: ценность $Q_a$ плюс бонус исследования, убывающий по мере посещения хода $a$; равномерное априорное $P_a$'
- 'числа посещений после всех симуляций (последний элемент: пас); играется самый посещаемый ход'
