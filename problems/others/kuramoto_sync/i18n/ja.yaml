source_hash: ab1a099d3cd6
title: 蔵本（Kuramoto）モデル：自発的同期
summary: 一斉に光るホタル、共通の板に載せたメトロノーム、ペースメーカー細胞。固有振動数 $\omega_i$ がばらばらな振動子が互いに引き合い、結合 $K$ がしきい値を超えると突然そろいます。複素平均場 $r e^{i\psi} = \frac1N \sum_j e^{i\theta_j}$ によって全対全の和は $O(N)$ の計算になり、結合のバッチ全体を一度に走らせます。秩序変数 $r$ は $K_c = 2/(\pi g(0))$ で立ち上がり、ローレンツ分布の振動数では厳密な Ott–Antonsen 曲線 $r = \sqrt{1 - K_c/K}$ に従います。
notes: Kuramoto（蔵本由紀、1975）はこのモデルを自己無撞着に解き、対称な単峰の振動数密度 $g$ に対して $K_c = 2/(\pi g(0))$ を得ました。その経緯は Strogatz（2000）が語っています。Ott と Antonsen（2008）は、ローレンツ分布 $g(\omega) = (\gamma/\pi)/(\omega^2 + \gamma^2)$ では $N$ 無限大の力学がただ一つの方程式 $\dot r = -\gamma r + \tfrac K2 r(1 - r^2)$ に縮約され、その安定状態が $r = \sqrt{1 - 2\gamma/K}$ であることを証明しました。シミュレーションは $N = 1200$ で約 $0.01$ の精度で一致します。$K_c$ 以下では、$r$ は大きさ $1/\sqrt N$ 程度の有限サイズのゆらぎにすぎません。ガウス分布の振動数ではしきい値はより小さく $K_c = 2\sigma\sqrt{2\pi}/\pi \approx 1.6\,\sigma$ です（緑）。ゆっくりとした掃引（赤）は $K$ の増加とともに曲線をたどります。円は平均場の回転座標系での振動子を $\omega_i$ で色分けして示しています。$|\omega_i|$ が小さいものから先にそろい、速いものは漂い続けます。三つ目のパネルはちょっとしたおまけです。非局所結合と位相遅れ $\alpha = \pi/2 - 0.18$ をもつリング上の同一の振動子は、同期した領域と非同期の領域に分かれます。これは Kuramoto と Battogtokh（2002）が発見し、Abrams と Strogatz（2004）が名付けたキメラ状態です。$\sin(\theta_j - \theta_i)$ が反対称なので、平均位相はちょうど平均振動数で進みます。
meanings:
- 固有振動数。ローレンツ（またはガウス）密度を等確率の $N$ 区間に分け、各区間から一つずつ乱数で選ぶ
- バッチの各メンバーに一つの結合：すべての集団が並列に時間発展する
- 複素平均場。繰り返される $j$ ⇒ 平均をとる。$r = 0$ は非同期、$r = 1$ は完全同期
- 各振動子は平均場だけを感じる：$O(N^2)$ ではなく $O(N)$
- 遅いペアごとの和。参照として残してあり、テストで平均場の形と等しいことを確認する
- ローレンツ分布の振動数に対する $N \to \infty$ での厳密な秩序変数。$K_c = 2\gamma$ より上で $\sqrt{1 - 2\gamma/K}$
- キメラ状態のための、リング上の非局所結合 $(1 + A\cos x)/2\pi$
labels:
  n_oscillators: 振動子の数 $N$
  width: 振動数の広がり $\gamma$（ローレンツ）または $\sigma$（ガウス）
  k_max: 最大の結合 $K$
  n_couplings: バッチ内の結合の個数
  t_relax: 結合ごとの緩和時間
  ramp_time: $K$ のゆっくりとした掃引の時間
  distribution: 掃引で表示する振動数密度
  seed: 乱数シード
