<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Round pipe of radius R: a pressure drop from p1 to p2 drives axial flow u_z(r) with a parabolic profile, zero at the wall and fastest on the axis">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="guide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- pipe -->
    <rect x="20" y="40" width="200" height="80" fill="#93c5fd" fill-opacity="0.3"/>
    <line x1="20" y1="40" x2="220" y2="40" stroke="#374151" stroke-width="3"/>
    <line x1="20" y1="120" x2="220" y2="120" stroke="#374151" stroke-width="3"/>
    <ellipse cx="20" cy="80" rx="8" ry="40" fill="none" stroke="#374151" stroke-width="1.5"/>
    <line x1="14" y1="80" x2="226" y2="80" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- profile -->
    <line x1="100" y1="40" x2="100" y2="120" stroke="#9ca3af" stroke-width="1.2"/>
    <path d="M100,40 Q200,80 100,120" fill="none" stroke="#2563eb" stroke-width="2"/>
    <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#flow)">
      <line x1="100" y1="50" x2="134" y2="50"/>
      <line x1="100" y1="65" x2="139" y2="65"/>
      <line x1="100" y1="80" x2="148" y2="80"/>
      <line x1="100" y1="95" x2="139" y2="95"/>
      <line x1="100" y1="110" x2="134" y2="110"/>
    </g>
    <text x="154" y="72" font-style="italic" fill="#1e40af">u<tspan font-size="10" dy="3" font-style="normal">z</tspan><tspan dy="-3">(r)</tspan></text>
    <!-- radius -->
    <line x1="60" y1="78" x2="60" y2="44" stroke="#6b7280" stroke-width="1.2" marker-end="url(#guide)"/>
    <text x="44" y="64" font-style="italic">R</text>
    <!-- pressure -->
    <text x="30" y="30" font-style="italic" fill="#b91c1c">p<tspan font-size="10" dy="3" font-style="normal">1</tspan></text>
    <text x="196" y="30" font-style="italic" fill="#b91c1c">p<tspan font-size="10" dy="3" font-style="normal">2</tspan></text>
    <line x1="56" y1="24" x2="180" y2="24" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="96" y="144">p<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> &gt; p</tspan><tspan font-size="10" dy="3">2</tspan></text>
  </g>
</svg>
