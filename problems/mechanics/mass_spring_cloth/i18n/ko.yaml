source_hash: 6bb6cb4a204f
title: 질량–용수철 천
summary: 구조, 전단, 굽힘 용수철로 연결된 점질량들의 정사각형 격자를 두 모서리에 고정하고 중력 아래 놓아줍니다. 결합 행렬 $D_{ea}$가 그물망을 텐서로 바꿉니다. einsum 하나로 모든 용수철 벡터를 얻고, 또 하나로 모든 노드에 작용하는 힘을 더합니다.
notes: 대각선 방향의 전단 용수철은 정사각형이 마름모로 찌그러지는 것을 막고, 노드 하나를 건너뛰는 용수철은 천에 약간의 굽힘 강성을 줍니다. 고정된 두 모서리는 단순히 가속도를 0으로 둡니다. 공기 감쇠 $\gamma$가 유일한 손실이므로 총 에너지는 줄어들기만 하고($dE/dt = -m\gamma\lvert\mathbf v\rvert^2$), $\gamma = 0$이면 보존됩니다. 용수철이 뻣뻣하므로 시간 간격은 $\sqrt{m/k}$에 묶입니다. 자기 충돌은 무시합니다. 각 노드의 질량은 10 g이고 격자 간격은 10 cm입니다.
meanings:
- 노드 $a$의 위치; 질량 $N = n^2$개
- '결합 행렬: 용수철 $e$의 양 끝에서 $-1$ / $+1$'
- '반복된 $a$ ⇒ 합: 모든 용수철 방향의 벡터'
- 현재 용수철 길이; $\ell^0_e$는 자연 길이
- '반복된 $e$ ⇒ 합: 노드 $a$에 작용하는 알짜 탄성력'
- 같은 합을 간선 목록에 대한 scatter로 계산
- 운동 + 탄성 + 중력 퍼텐셜 에너지
labels:
  n_side: 한 변의 질량 수
  k: 용수철 상수 $k$
  damping: 공기 감쇠 $\gamma$
  t_max: 시뮬레이션 시간
