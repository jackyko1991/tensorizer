source_hash: 6b976c8609c8
title: 霍奇猜想
summary: 用計數來算出霍奇菱形：對費馬超曲面 $x_0^d + \dots + x_{n+1}^d = 0$，霍奇數是某個多項式冪次的係數；對複環面與乘積空間，則是外積與卷積。接著，塩田的特徵標計數給出有理霍奇類，也就是霍奇猜想斷言應來自子簇的那些類。對曲面而言，這就是已證明的萊夫謝茨 $(1,1)$ 定理，曲面上的直線把它具體呈現出來。在更高維度，這個猜想仍未解決；本頁只計數這些類。
notes: 在緊致凱勒流形上，每個上同調類都會分解成 $(p, q)$ 型的分量：$p$ 個全純方向與 $q$ 個反全純方向（霍奇，1941）。數 $h^{p,q}$ 滿足霍奇對稱 $h^{p,q} = h^{q,p}$ 與塞爾對偶 $h^{p,q} = h^{n-p,n-q}$，左側每個菱形都通過這兩項檢查。它們的交錯和是歐拉示性數，對 $d$ 次超曲面而言等於 $((1-d)^{n+2} - 1)/d + n + 2$。菱形重現了這個值，也重現了 K3 四次曲面的 $h^{1,1} = 20$、五次三維簇的 $h^{2,1} = 101$ 以及三次四維簇的 $h^{3,1} = 1$。餘維數為 $p$ 的子簇 $Z$ 定義一個 $(p, p)$ 型的有理類。霍奇猜想（霍奇 1950；克雷千禧年大獎難題之一）斷言：每個有理 $(p, p)$ 類都是這類類的有理線性組合。已證明的部分：$p = 1$ 的情形由萊夫謝茨 $(1,1)$ 定理（1924）給出，因此由硬萊夫謝茨定理得到 $p = n-1$ 的情形。它對維數至多為 3 的阿貝爾簇、單直紋四維簇與三次四維簇（Conte–Murre、Zucker）也成立，並在許多特殊情形下成立，包括許多次數的費馬簇（塩田 1979，Ran 1980）。整係數版本是錯的（Atiyah–Hirzebruch，1962）。對費馬簇，塩田的特徵標讓有理霍奇類可以被計數，每個伽羅瓦共軛對應一個條件。對曲面而言，這個計數就是皮卡數：$d = 3, 4, 5, 6$ 時為 $7, 20, 37, 86$，而 $\gcd(d, 6) = 1$ 時為 $3(d-1)(d-2) + 1$。曲面上的 $3d^2$ 條直線給出明確的代數類，它們的相交矩陣（其秩與霍奇指標符號差 $(1, \rho - 1)$，在此計算）恰好在 $d \le 4$ 或 $\gcd(d, 6) = 1$ 時於 $\mathbb Q$ 上張成所有代數類。對 $d = 6, 8, 9, 10$ 則需要其他曲線，而萊夫謝茨定理保證它們存在。對費馬四維簇，程式會計數霍奇類，但其中每一個是否為代數類，正是猜想本身。現狀（2026 年 11 月）：未解決。OpenAI 發布的 AI 生成手稿集（github.com/openai/math，第 032 族）聲稱證明了每個 CM 阿貝爾簇的有理霍奇猜想，並報告了該命題的
  Lean 形式化。這是一項未經同儕審查、由機器產生的聲稱，尚待數學界驗證；即使它正確，也只涵蓋一個特殊類別，而非一般的猜想。
meanings:
- 多項式相乘就是係數向量的卷積，重複 $n+2$ 次：費馬多項式的雅可比環的單項式基底 $x^b$，$0 \le b_i \le d-2$
- 格里菲斯：本原的中間霍奇數就是雅可比環在次數 $(q+1)d - (n+2)$ 的部分
- 複環面：$dz$ 的 $\wedge^p$ 乘以 $d\bar z$ 的 $\wedge^q$
- Künneth 公式：每一對類，加總到格子 $(a + c, b + d)$ 中
- 塩田的特徵標：$1 \le a_i \le d-1$，$\sum a_i \equiv 0 \bmod d$；每一個標記本原上同調中的一條直線 $V(a)$
- 重複的 $i$ ⇒ 求和：一次得到每個伽羅瓦共軛 $t\cdot a$ 的霍奇型
- 有理霍奇類：對每個共軛都是 $(\frac n2, \frac n2)$ 型
- 兩條直線相交若且唯若它們在 $\mathbb C^4$ 中的四個張成向量線性相關；由伴隨公式得 $L^2 = 2-d$
- 直線所張成之格的秩及其符號差（霍奇指標定理：恰有一個正特徵值）
labels:
  d_max: 最大次數 $d$
  n_max: 歐拉檢驗至維數 $n$
  g_max: 環面至維數 $g$
