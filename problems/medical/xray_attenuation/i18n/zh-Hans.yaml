source_hash: 9753ed59836b
title: X 射线衰减与图像对比度
summary: X 射线穿过人体时呈指数衰减，$I = I_0\,e^{-\int\mu\,dl}$。由肺、软组织、骨骼和碘造影剂组成的胸部模体用一次 einsum 逐条射线投影，说明为什么骨骼在低能量时特别显眼，以及真实 X 射线管能谱如何随深度硬化。
notes: 在对数空间中投影是可加的：$-\ln(I/I_0)$ 是各材料 $\mu\,L$ 的总和，所以单色图像是材料长度的线性映射。均匀平板每经过一个半值层 $\ln 2/\mu$，射束强度就减半。光电吸收大致按 $Z^3/E^3$ 增长，所以骨骼对比度在 30–50 keV 时很大，在更高能量时减弱；碘在 33 keV 的 K 吸收边以上吸收骤增，这正是它被用作造影剂的原因。真实的 X 射线管发出的是能谱：软光子先被吸收，平均能量上升，有效 $\mu$ 随深度下降（射束硬化）。简化假设：笔直的平行射线、无散射、无探测器响应，以及八个列表能量和取整的 $\mu$ 值。所有数值均为近似，仅供教学，不可用于临床。
meanings:
- one-hot 模体：像素 $(y, x)$ 为材料 $m$ 时取 1
- 射线在像素行 $y$ 内的路径长度
- 重复的 $y$ ⇒ 求和：射线 $x$ 穿过材料 $m$ 的长度
- 材料 $m$ 在能量 $E_e$ 下的线性衰减系数（1/cm）
- 重复的 $m$ ⇒ 求和：每个能量和每条射线的线积分 $\int \mu\, dl$
- X 射线管能谱（Kramers 定律，铝滤过片），$\sum_e S_e = 1$
- 重复的 $e$ ⇒ 求和：多色射束的透射比例
