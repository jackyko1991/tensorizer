<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Slow-roll inflation: a ball (the inflaton field) rolls slowly along the flat plateau of a potential V of phi, inflation ends where epsilon reaches 1 and the field drops into the minimum">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes -->
    <line x1="20" y1="140" x2="232" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#axis)"/>
    <line x1="20" y1="140" x2="20" y2="14" stroke="#374151" stroke-width="2" marker-end="url(#axis)"/>
    <text x="218" y="156" font-style="italic">φ</text>
    <text x="28" y="24" font-style="italic">V</text>
    <!-- plateau potential: flat at large phi, drops to a minimum at small phi -->
    <path d="M36,136 C44,138 52,136 60,120 C70,98 80,60 104,50 C130,42 170,40 226,39" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- end of inflation -->
    <line x1="74" y1="40" x2="74" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="56" y="34" font-size="13" font-style="italic" fill="#b45309">ε = 1</text>
    <!-- the inflaton -->
    <circle cx="176" cy="31" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="164" y1="22" x2="126" y2="22" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="16" font-size="12" fill="#b91c1c">slow roll</text>
    <!-- pivot scales leave the horizon here -->
    <path d="M150,40 L150,140" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="154" y="132" font-size="13" font-style="italic">N</text><text x="164" y="136" font-size="10">*</text>
    <!-- oscillation / reheating -->
    <path d="M40,128 q6,-8 12,0 q6,8 12,0" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>
