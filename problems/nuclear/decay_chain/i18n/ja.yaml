source_hash: 006d4ce1966d
title: 崩壊系列（ベイトマン方程式）
summary: 親核が放射性の娘核に崩壊し、娘核はさらに安定な最終生成物に崩壊する。3つの速度方程式は1つの線形系 $\dot N_i = A_{ij} N_j$ をなし、行列指数関数 $e^{At}$ によってすべての時刻について一度に厳密に解かれ、RK4 で検証される。既定の系列は医療用ジェネレーター $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc である。
notes: $\mathsf A$ の各列の和は0なので、$\sum_i N_i$ は決して変わらない：崩壊のたびに原子核が1つ系列を下る。2核種の場合の厳密解（ベイトマン解）は $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$ である。娘核の寿命の方が短い（$\lambda_2 > \lambda_1$）と放射能が連動する：比 $a_2/a_1$ は $\lambda_2/(\lambda_2-\lambda_1)$ に近づき（過渡平衡）、親核の寿命がはるかに長ければ 1 に近づく（永続平衡、親核の半減期を 1000 h にしてみよう）。娘核の寿命を長くすると平衡は生じない。簡略化：実際には $^{99}$Mo が $^{99m}$Tc を生じるのは崩壊の約 88 % にすぎず、$^{99}$Tc（半減期 211 000 年）は安定として扱う。
meanings:
- $\ln 2/T_i$、安定な最終核では $\lambda_3 = 0$
- 対角に $-\lambda_i$、そのすぐ下に $+\lambda_i$
- 繰り返される $j$ ⇒ 和をとる：RK4 で用いる右辺
- 時刻ごとに1つの行列指数関数、$t$ についてバッチ化
- 初期ベクトルから求めた各時刻の個数
- 放射能：各核種の1時間あたりの崩壊数
labels:
  half_life_parent: 親核の半減期 $T_1$
  half_life_daughter: 娘核の半減期 $T_2$
  t_max: 時間範囲
  rk4_steps: RK4 のステップ数
