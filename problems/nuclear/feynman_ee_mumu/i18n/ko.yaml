source_hash: f068882719e2
title: '파인먼 도형: 디랙 대각합으로 구하는 $e^+e^- \to \mu^+\mu^-$'
summary: 가장 간단한 QED 도형입니다. 전자와 양전자가 소멸하여 가상 광자가 되고, 이 광자가 뮤온 쌍을 만듭니다. 파인먼 규칙은 그림을 진폭으로 바꾸고, 스핀 합은 이를 $4\times4$ 디랙 행렬 $\gamma^\mu$의 대각합으로 바꾸며, 각 대각합은 einsum 하나입니다. 에너지를 훑으면 각분포가 문턱에서의 등방성에서 $1 + \cos^2\theta$로 바뀌고, 산란 단면적이 $4\pi\alpha^2/3s$처럼 줄어드는 것을 볼 수 있습니다.
notes: 도형은 한 번 그리지만 코드는 스피너를 전혀 만들지 않습니다. 스핀에 대해 합하면 $u\bar u$가 $\not p + m$으로 바뀌므로, 계산 전체가 $\gamma$ 행렬의 곱과 대각합이 되고, einsum이 이를 모든 에너지와 각도에 대해 한꺼번에 계산합니다. 결과는 $m_e \to 0$일 때 $\overline{|\mathcal M|^2} = e^4\big[1 + 4m^2/s + (1 - 4m^2/s)\cos^2\theta\big]$입니다. 문턱에서는 느린 뮤온이 등방적으로 나오고, 문턱보다 훨씬 위에서는 광자의 스핀 1과 나선도 보존 때문에 $1 + \cos^2\theta$가 됩니다. 전체 $\sigma$는 $\sqrt s = 2m$에서 가파르게 오른 뒤 $1/s$로 줄어들며, 1 GeV에서 약 $86.8$ nb입니다. PETRA와 LEP의 실제 데이터는 $\sqrt s \approx 30$ GeV까지 이 곡선을 따르는데, 그 근처에서 광자 대신 $Z$ 보손이 들어간 두 번째 도형이 간섭하여 전방–후방 비대칭 $A_{FB}$가 0이 아니게 됩니다. 순수한 QED는 $A_{FB} = 0$을 줍니다. 1975년 SPEAR에서 3.55 GeV 문턱 바로 위에서 발견된 $\tau$ 쌍을 시도해 보세요.
meanings:
- '디랙 행렬: 지표 $\mu$는 시공간 지표, $a, b$는 스피너 지표. $\{\gamma^\mu, \gamma^\nu\} = 2\eta^{\mu\nu}$'
- 민코프스키 계량 diag(1, −1, −1, −1), $\hbar = c = 1$인 단위계
- 모든 에너지 $\sqrt s$와 각도 $\theta$에 대한 질량중심계의 $e^-$, $e^+$, $\ell^-$, $\ell^+$ 사차원 운동량
- '파인먼 슬래시: 스핀 합 $\sum u\bar u = \not p + m$과 $\sum v\bar v = \not p - m$'
- '반복된 $a, b, c, d$ ⇒ 합: 전자선의 대각합(뮤온선에도 같은 함수 사용)'
- '$\eta$로 뮤온 지표를 내리고 축약: 광자 전파 인자가 두 선을 잇는다'
- 선속과 위상 공간 인자. $(\hbar c)^2$는 GeV$^{-2}$를 nb로 변환
- 전체 산란 단면적. $\frac{4\pi\alpha^2}{3s}\beta\,(1 + 2m^2/s)$, $\beta = \sqrt{1 - 4m^2/s}$와 비교
labels:
  final: 나중 상태
  sqrt_s_max: 최고 에너지 $\sqrt s$
