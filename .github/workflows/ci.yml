name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.70.0
          # Use the official binary via authenticated API to avoid anonymous rate-limit 403s.
          pixi-url: https://api.github.com/repos/prefix-dev/pixi/releases/assets/435151918
          pixi-url-headers: '{"Accept":"application/octet-stream","Authorization":"Bearer ${{ github.token }}"}'
          cache: true
      - run: pixi run lint
      # Colab opens the committed notebooks/ — they must match the problem files
      - run: pixi run python scripts/notebooks.py --check
      - run: pixi run pytest -q tests/test_api.py

  # Each problem's test.py (physics checks) + convention/diagram/render smoke tests, one job per topic in parallel.
  physics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic: [mechanics, optics, waves, thermodynamics, em, fluids, quantum, astro, nuclear, physchem, chemistry, medical, biophysics, bioinformatics, maths, graphics, ai, cosmology, others]
    env:
      TENSORIZER_CATEGORIES: ${{ matrix.topic }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.70.0
          # Use the official binary via authenticated API to avoid anonymous rate-limit 403s.
          pixi-url: https://api.github.com/repos/prefix-dev/pixi/releases/assets/435151918
          pixi-url-headers: '{"Accept":"application/octet-stream","Authorization":"Bearer ${{ github.token }}"}'
          cache: true
      - run: pixi run pytest -q problems/${{ matrix.topic }} tests/test_smoke.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.70.0
          # Use the official binary via authenticated API to avoid anonymous rate-limit 403s.
          pixi-url: https://api.github.com/repos/prefix-dev/pixi/releases/assets/435151918
          pixi-url-headers: '{"Accept":"application/octet-stream","Authorization":"Bearer ${{ github.token }}"}'
          cache: true
      - run: pixi run python scripts/build_assets.py --manifest-only
      - run: pixi run web-build
