<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Our three-dimensional space times a compact circle of radius R drawn as a cylinder; a mass M on it; near the mass gravity spreads in all directions, far away only along our space">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- cylinder: our space x along the axis, compact circle around it -->
    <line x1="20" y1="50" x2="220" y2="50" stroke="#374151" stroke-width="2"/>
    <line x1="20" y1="110" x2="220" y2="110" stroke="#374151" stroke-width="2"/>
    <ellipse cx="20" cy="80" rx="10" ry="30" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="220" cy="80" rx="10" ry="30" fill="none" stroke="#374151" stroke-width="2"/>
    <ellipse cx="120" cy="80" rx="10" ry="30" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- radius -->
    <line x1="220" y1="80" x2="220" y2="50" stroke="#f59e0b" stroke-width="2"/>
    <text x="226" y="70" fill="#b45309" font-style="italic">R</text>
    <!-- mass -->
    <circle cx="120" cy="80" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="114" y="104" font-style="italic">M</text>
    <!-- near: radial in all directions -->
    <line x1="112" y1="72" x2="102" y2="60" stroke="#dc2626" stroke-width="1.6" marker-start="url(#arrow)"/>
    <line x1="128" y1="72" x2="138" y2="60" stroke="#dc2626" stroke-width="1.6" marker-start="url(#arrow)"/>
    <!-- far: along our space only -->
    <line x1="45" y1="80" x2="85" y2="80" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="195" y1="80" x2="155" y2="80" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="40" y="140" font-size="13">1/r</text>
    <text x="100" y="140" font-size="13">1/r</text><text x="122" y="132" font-size="10">1+n</text>
    <text x="180" y="140" font-size="13">1/r</text>
    <text x="22" y="32" font-size="13" font-style="italic">x</text>
    <line x1="34" y1="28" x2="74" y2="28" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
