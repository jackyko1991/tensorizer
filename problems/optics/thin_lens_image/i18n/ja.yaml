source_hash: b20963373157
title: 薄レンズによる結像
summary: レンズの公式は、物体の像がどこにどれだけの大きさで現れるかを教えてくれる。物体が $2f$ より外側から焦点距離の内側まで移動する間、すべての物体位置について3本の主要光線を一度に追跡すると、倒立実像が正立虚像に変わる。
notes: 距離はレンズから測る：物体は $x = -s$、実像は $x = +s'$ にある。3本の主要光線は (1) 光軸に平行に入り、反対側の焦点を通る、(2) 中心をまっすぐ通る、(3) 手前の焦点を通り、平行に出る。すべて1つの規則 $\theta' = \theta - y/f$ から導かれる。$f$ の内側では光線はレンズ通過後に発散し、破線の延長が虚像で交わる。$s = f$ では像は無限遠に飛ぶ。
meanings:
- アニメーションのフレーム $k$ における物体距離
- 像距離；負 ⇒ 物体側の虚像
- 像の高さ / 物体の高さ；負 ⇒ 倒立
- レンズ前の主要光線 $r \in \{\text{parallel, centre, focal}\}$ の傾き
- 各主要光線がレンズを横切る位置
- レンズ通過後の傾き：どの光線も $-y/f$ だけ曲げられる
labels:
  f: 焦点距離 $f$
  h: 物体の高さ $h$
  s_start: 開始時の物体距離
  s_end: 最終の物体距離
