source_hash: 4c18d665b55e
title: 为什么物质比反物质多？
summary: 宇宙中每个光子约有 $6\times 10^{-10}$ 个重子，而几乎没有反物质。萨哈罗夫的三个条件说明任何解释都需要什么；轻子生成是主要候选之一：重的马约拉纳中微子衰变成轻子的概率略高于反轻子（CP 不对称 $\varepsilon$），逆衰变会洗掉其中一部分（强度 $K$），而鞍点子（sphaleron）过程把轻子转化为重子。上千个 $(\varepsilon, K)$ 模型的玻尔兹曼方程作为一个批量 ODE 一起求解，并与观测到的 $\eta_B$ 比较。这是一个未解问题。
notes: 观测：由 CMB 得到重子与光子之比 $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$（Planck 2018，$\Omega_bh^2 = 0.0224$），与大爆炸核合成一致，也没有反物质星系的迹象。萨哈罗夫（1967）证明，从对称的宇宙出发，要产生不对称需要（1）重子数破坏、（2）C 与 CP 破坏，以及（3）偏离热平衡。测试直接检验（2）与（3）：$\varepsilon = 0$，或让重中微子保持在平衡态，结果恰好为零；（1）是标准模型的鞍点子过程，在约 130 GeV 以上把 $B - L$ 转换为 $B = \tfrac{28}{79}(B - L)$。夸克的 CP 破坏（CKM 相位）太小，电弱相变又是平滑过渡（crossover），因此仅靠标准模型行不通：需要新物理。轻子生成（Fukugita 与 Yanagida 1986）利用跷跷板机制中的重右手中微子，这一机制也能解释为何轻中微子如此之轻。这个玩具模型只保留最轻的 $N_1$ 的衰变与逆衰变（没有 $\Delta L = 2$ 散射、味效应或热修正），采用 Buchmüller、Di Bari 与 Plümacher（2005）的归一化。弱冲刷（$K \ll 1$）且热初始条件时保留全部不对称（$\kappa_f \to 1$，已检验）；强冲刷（$K \gg 1$）损失大部分，但会忘记初始条件（两种起始方式汇合），而求解器与他们的解析拟合相差约 10% 以内。由 $K = \tilde m_1/m_*$、$m_* \approx 1.08\times10^{-3}$ eV，振荡实验看到的中微子质量（$\approx 0.009$–$0.05$ eV）指向 $K \approx 10$–$50$，此时需要 $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$；Davidson–Ibarra 上限 $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$ 于是要求 $M_1 \gtrsim 10^{10}$ GeV。现状：未解决。轻子生成很有吸引力，且与所有已知结果相容，但尚未证实：重中微子远超出对撞机所能及的范围。间接线索包括无中微子双贝塔衰变（马约拉纳性质）和中微子振荡中的
  CP 破坏（T2K、NOvA，以及之后的 DUNE 与 Hyper-Kamiokande）；电弱重子生成和其他机制仍是替代方案。本页以数值方式探索这些玩具方程，并不宣称不对称就是这样产生的。
meanings:
- $z = M/T$，对数间隔：宇宙冷却时时钟向前走
- CP 不对称沿第一轴、衰变参数沿第二轴排列：一切广播到 $(E, K)$
- $\tfrac38 z^2K_2(z)$：相对论性时每个光子 $3/4$，之后为 $e^{-z}$
- 步长中点处每个哈勃时间内的衰变与逆衰变
- $N_N - N_N^{eq}$：偏离平衡的程度（萨哈罗夫条件 3）
- 线性 ODE 的精确单步因子：即使 $K = 1000$ 也稳定
- 每个模型的 $B - L$ 不对称，每步只用一次张量更新推进
- 鞍点子把 $B - L$ 的 $28/79$ 留为重子；光子数增加 $f = 2387/86$ 倍
- 效率：弱冲刷时为 $1$，强冲刷时约 $\approx 1/(K z_B)$
labels:
  log_eps: 显示的模型：$\log_{10}\varepsilon$
  log_K: 显示的模型：$\log_{10}K$
  initial: 重中微子的初始丰度
  n_eps: $\varepsilon$ 的网格点数
  n_K: $K$ 的网格点数
  steps: $z$ 的积分步数
  z_max: 最终 $z = M/T$
