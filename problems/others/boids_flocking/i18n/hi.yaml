title: 'झुंड व्यवहार: विचेक मॉडल और बॉइड्स'
summary: मैना पक्षी, मछलियों के झुंड और टिड्डियाँ बिना किसी नेता के साथ-साथ चलते हैं। विचेक मॉडल में प्रत्येक पक्षी स्थिर चाल से उड़ता है और अपने पड़ोसियों की औसत दिशा की नकल करता है, साथ में अधिकतम $\eta$ आकार का एक यादृच्छिक कोण जुड़ता है; रेनॉल्ड्स के बॉइड्स में वह पृथक्करण, संरेखण और संसंजन के नियमों से दिशा बदलता है। आवर्ती बॉक्स में पक्षियों के बीच की सभी $N^2$ दूरियाँ एक टेंसर बनाती हैं, और शोर स्तरों का पूरा बैच एक साथ चलाया जाता है ताकि ध्रुवीय क्रम $\varphi$ का क्रम–अव्यवस्था संक्रमण दिखाया जा सके।
notes: 'विचेक और अन्य (1995) ने इस मॉडल को सामूहिक गति की सबसे सरल भौतिकी के रूप में प्रस्तुत किया: संरेखण और शोर। कम शोर पर पक्षी एक दिशा पर सहमत हो जाते हैं ($\varphi \to 1$), $\eta = 2\pi$ पर दिशाएँ यादृच्छिक होती हैं और $\varphi$ केवल $1/\sqrt N$ कोटि का परिमित-आकार शोर होता है। दो विमाओं में यह उल्लेखनीय है, क्योंकि मर्मिन–वैगनर प्रमेय सतत सममिति वाले साम्यावस्था तंत्रों में दीर्घ-परास क्रम को वर्जित करता है; चलते पक्षी इससे बच निकलते हैं क्योंकि उनके पड़ोस लगातार बदलते रहते हैं (टोनर और तू 1995)। बड़े तंत्रों के लिए संक्रमण असतत निकलता है, जिसमें चलती पट्टियाँ बनती हैं (ग्रेगोआर और शाते 2004); इतने छोटे $N$ पर यह सुचारु दिखता है। रेनॉल्ड्स (1987) ने बॉइड्स को कंप्यूटर एनिमेशन के लिए बनाया था। यहाँ उनके तीन नियम ऐसे युग्म-बलों के रूप में लिखे गए हैं जो $i \leftrightarrow j$ में प्रतिसममित हैं, इसलिए चाल के सामान्यीकरण के बिना झुंड का कुल संवेग ठीक-ठीक संरक्षित रहता है (एक परीक्षण इसकी जाँच करता है); फिर स्थिर चाल $v_0$ तक सामान्यीकरण झुंड को एक दिशा चुनने देता है। प्रबल संसंजन से झुंड
  एक घूमती गेंद में सिमट जाता है, इसलिए इसे कमज़ोर रखा गया है। क्रम को आसान बनाने के लिए छोटा बॉक्स (अधिक घनत्व) या बड़ी त्रिज्या आज़माएँ।'
meanings:
- बॉक्स $[0, L)^2$ में $N$ पक्षियों की स्थितियाँ, प्रत्येक शोर स्तर $b$ के लिए एक झुंड
- पक्षी $i$ से पक्षी $j$ की निकटतम आवर्ती प्रति तक विस्थापन; $i \leftrightarrow j$ में प्रतिसममित
- पड़ोसी मैट्रिक्स, दोहराया गया $k$ ⇒ योग; पक्षी $i$ स्वयं को भी गिनता है
- 'दोहराया गया $j$ ⇒ योग: पड़ोसियों की औसत दिशा'
- शोर कोण, $[-\eta/2, \eta/2]$ में समान रूप से वितरित; $\eta = 2\pi$ दिशा को पूरी तरह यादृच्छिक बना देता है
- 'बॉइड्स: पृथक्करण $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$, संरेखण $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$, संसंजन $\sum_j A_{ij}\mathbf d_{ij}$'
- 'ध्रुवीय क्रम: झुंड साथ चले तो 1, दिशाएँ यादृच्छिक हों तो लगभग $1/\sqrt N$'
labels:
  n_birds: पक्षी $N$
  box: बॉक्स की भुजा $L$ (पड़ोस त्रिज्या $R = 1$)
  speed: चाल $v_0$
  eta: दिखाए गए झुंड का शोर $\eta$
  n_noise: बैच में शोर स्तर
  steps: समय चरण
  seed: यादृच्छिक बीज
