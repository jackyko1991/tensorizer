source_hash: 5a26364d7c17
title: 行列力学：はしご演算子によるハイゼンベルクの振動子
summary: 波動関数も格子も使いません：個数基底 $|0\rangle, \dots, |N-1\rangle$ では消滅演算子は行列 $a_{mn} = \sqrt n\,\delta_{m,n-1}$ であり、$X$、$P$、$H = \tfrac12(P^2 + X^2)$ は行列積で得られます。その固有値は $n + \tfrac12$ で、$[X, P] = i$ です。torch.linalg.matrix_exp を使い、演算子 $X(t) = U^\dagger X U$ を動かす（ハイゼンベルク描像）か、状態 $U|\alpha\rangle$ を動かす（シュレディンガー描像）か；どちらも同じ $\langle X\rangle(t)$ を与え、コヒーレント状態はばねにつながれた古典的な質点のように位相空間で円を描きます。
notes: 単位は $\hbar = m = \omega = 1$。これはハイゼンベルク、ボルン、ヨルダンが 1925 年に最初に書いた量子力学です：観測量は行列であり、その積は可換ではありません。$N$ 状態への打ち切りが唯一の近似です。打ち切りは最後の対角成分で $[X, P] = i$ を破り、その成分は $i(1 - N)$ でなければなりません（有限行列の交換子のトレースは 0 だから）。また最後の基底状態のエネルギーを $N - \tfrac12$ ではなく $(N-1)/2$ にします；$N$ より十分低い状態は厳密です。ハイゼンベルク描像では各成分 $X(t)_{mn} = X_{mn}e^{i(E_m - E_n)t}$ がボーア振動数で回転するので、振動子では $X(t) = X\cos t + P\sin t$ となり、行列で書いた古典解そのものです。コヒーレント状態 $|\alpha\rangle$ は $\langle X\rangle(t) = \sqrt2\,\mathrm{Re}(\alpha e^{-it})$ を満たし、半径 $\sqrt2\,\alpha$ で位相空間を回ります。量子調和振動子の格子計算は、まったく異なる表現から同じはしごと同じ振動を与えます。$\lambda > 0$ を試してください：準位はもはや等間隔でなく、ボーア振動数が広がり、波束のデフェージングとともに円は内側へ渦を巻きます。小さな $\lambda$ では、エネルギーは 1 次摂動論 $\lambda\langle n|X^4|n\rangle = \lambda\,\tfrac34(2n^2 + 2n + 1)$ と一致します。
meanings:
- 上側副対角線上の $\sqrt1, \sqrt2, \dots$：$a|n\rangle = \sqrt n\,|n-1\rangle$
- $(a + a^\dagger)/\sqrt2$ と $i(a^\dagger - a)/\sqrt2$、どちらもエルミート
- 繰り返し添字 $k$ ⇒ 和：行列積；最後の成分以外は $a^\dagger a + \tfrac12$ に等しい
- $i\,\delta_{mn}$、ただし角は $i(1 - N)$：有限行列は $[X, P] = i$ を満たせない（トレースが 0）
- $n + \tfrac12$；$\lambda X^4$ を加えると $\approx \lambda\,\tfrac34(2n^2 + 2n + 1)$ だけずれる
- 時間発展演算子 $e^{-iHt}$ を全時刻まとめて計算
- 繰り返し添字 $k, l$ ⇒ 和：ハイゼンベルク描像、演算子が動く
- $e^{-|\alpha|^2/2}\alpha^n/\sqrt{n!}$：ずらした基底状態
- $c(t) = Uc$ のシュレディンガー描像：ハイゼンベルク描像と同じ数値
labels:
  alpha: コヒーレント状態の振幅 $\alpha$
  lam: 非調和性 $\lambda$（$\lambda X^4$ を追加）
  periods: シミュレーション時間
  n_states: 基底の大きさ $N$
