source_hash: 1bc9d739c88e
title: 自由粒子の波束
summary: 自由粒子では時間積分はまったく必要ない：運動量空間では、シュレーディンガー方程式は各フーリエ成分にそれぞれの位相 $e^{-ik^2t/2}$ を掛けるだけで解ける。1回の FFT、1回の掛け算、1回の逆 FFT で任意の時刻の $\psi$ が得られる——$(T, N)$ テンソルとしてすべての時刻について一度に。波束は群速度 $k_0$ で移動し、異なる運動量成分が異なる速さで進むので広がっていく。
notes: 単位 $\hbar = m = 1$。$\sigma$ は $\lvert\psi\rvert^2$ の標準偏差である（したがって $\psi \propto \exp(-(x - x_0)^2/(4\sigma_0^2) + ik_0x)$）。厳密な結果は $\langle x\rangle = x_0 + k_0 t$（群速度 $v_g = dE/dk = k$）と $\sigma(t) = \sigma_0\sqrt{1 + (t/(2\sigma_0^2))^2}$ である：幅の狭い波束は運動量の広がりが大きく、そのため速く広がる。破線はこの公式による $\langle x\rangle \pm \sigma(t)$ を示す。$\operatorname{Re}\psi$ のさざ波は位相速度 $k/2$、すなわち包絡線の半分の速さで動く。格子は周期的なので、一方の端から出た波束は反対側から戻ってくる。
meanings:
- 運動量 $k_0$ で動く幅 $\sigma_0$ のガウス関数
- 繰り返される $x$ ⇒ 和をとる：平面波 $e^{ikx}$ への基底変換
- 各時刻 $t$ における各モード $k$ の自由粒子の位相（和をとる添字なし：外積）
- $x$ 空間に戻す、$T$ 個のスナップショットすべてを1回の呼び出しで
- 各時刻での $\lvert\psi\rvert^2$ の中心と広がり
labels:
  k0: 波束の運動量 $k_0$
  sigma0: 初期幅 $\sigma_0$
  t_max: シミュレーション時間
