title: Particle track finding as an integer program
category: nuclear
level: advanced
order: 9
tags: []
summary: >
  Real hits from a simulated HL-LHC collision (TrackML challenge, CC BY 4.0) are joined into tracks by an integer
  linear program: choose hit triplets with consistent curvature and polar angle, with each hit used at most once. Our
  tensor PDLP (restarted primal–dual hybrid gradient, the LP method inside OR-Tools and cuOpt) solves the LP
  relaxation live on sparse tensors, then rounds and repairs it. It is compared with a hand-written Hungarian
  (Kuhn–Munkres) baseline and with offline runs of HiGHS, Gurobi and scipy: objective gap, efficiency, fake rate,
  the official TrackML score and the wall-time scaling $t \propto N^k$.
animated: true
