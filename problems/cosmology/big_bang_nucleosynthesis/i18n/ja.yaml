source_hash: fcafdb67dc0d
title: ビッグバン元素合成
summary: 最初の 3 分間を硬い反応ネットワークとして解く：中性子と陽子は弱い相互作用の平衡から凍結し、重水素のボトルネックは $T \approx 80$ keV 付近で開き、ほぼすべての中性子が $^4$He に入る。12 の反応が n、p、d、t、$^3$He、$^4$He、$^7$Li、$^7$Be をつなぎ、バリオン・光子比 $\eta$ の一括を陰的 BDF2 法でまとめて積分して Schramm 図を得る。Planck の値 $\eta \approx 6.1\times10^{-10}$ ではヘリウムと重水素は観測と一致するが、リチウムは約 3 倍高く出る：宇宙論的リチウム問題で、いまも未解決である。
notes: 現状：標準ビッグバン元素合成は確立した物理である。$^4$He と D の予言は、宇宙マイクロ波背景放射から独立に測られたバリオン密度で観測と一致し、熱いビッグバン模型の柱の一つである（Alpher、Bethe、Gamow 1948；Wagoner、Fowler、Hoyle 1967）。宇宙論的リチウム問題は未解決：予言される $^7$Li/H は古いハロー星の Spite プラトー（$(1.6\pm0.3)\times10^{-10}$）の約 3 倍で、原子核物理、恒星での破壊、新粒子のいずれもまだ説明できていない。観測値（引用した定数）：$Y_p = 0.245\pm0.003$（PDG の BBN レビュー）、D/H $= (2.527\pm0.030)\times10^{-5}$（Cooke、Pettini、Steidel 2018）。モデル：Smith、Kawano、Malaney（1993）の 12 反応、熱核反応率は JINA REACLIB データベース（Cyburt ら 2010；セット an06、de04、gi17、go17、cd08、db18）、逆反応率は詳細つり合いから。明示した近似：弱反応率は Born 近似（放射補正・有限質量・有限温度の補正なし）、ニュートリノの瞬間的脱結合（3.044 ではなく $N_\mathrm{eff} = N_\nu$）、$^7$Be は $^7$Li、t は $^3$He として数える（後で崩壊）、T9 フィットは $T_9 = 10$ より上で一定。このため $Y_p$ は PRIMAT や PArthENoPE などの精密コード（$0.2470$）より約 2% 低く、D/H は数 % で一致する。$N_\nu = 4$ を試そう：膨張が速くなり、より多くの中性子が凍結して $Y_p$ が約 0.013 増える。これが BBN でニュートリノの種類を数える方法である。
meanings:
- 反応 $r$ が消費・生成する核種 $i$ の個数（12 反応、8 核種）
- 正味の変化；すべての $r$ で $\sum_i A_i S_{ri} = 0$（バリオン数）
- REACLIB フィット：繰り返す $k$（$T_9$ の 7 つの基底関数）⇒ 和、次に同じ反応のセットを足す
- 各 $\eta_b$ の順反応率（$\propto n_b \propto \eta$）と逆反応率（詳細つり合い）
- $\prod_j Y_j^{R_{rj}}$、例えば d + d なら $Y_d^2$
- 繰り返す $r$ ⇒ 反応について和
- ニュートン法のための厳密なヤコビ行列
- $\eta$ の一括全体に対する陰的 BDF2 ステップのニュートン更新 1 回
- Born 近似の弱反応率、中性子寿命 $\tau_n$ で規格化
labels:
  n_eta: 一括内の $\eta$ の個数
  eta10: 強調する $\eta \times 10^{10}$（左図）
  tau_n: 中性子寿命 $\tau_n$
  n_nu: ニュートリノの種類数 $N_\nu$
  n_steps: $\ln T$ での BDF2 ステップ数
