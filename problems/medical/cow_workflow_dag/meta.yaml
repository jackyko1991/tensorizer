  - {symbol: 'M_a^{sr}', code: 'kron_block(axes_r, axes_s, sizes)', shape: '(n_s, n_r)', meaning: 'per wildcard axis $a$ (case, condition): $I$ when both rules carry it (per-case edges $A \otimes I$), $\mathbb 1$ for a broadcast, $\mathbb 1^\top$ for a gather such as the cohort report'}
  - {symbol: 'A', code: 'job_adjacency(A_rule, axes, sizes)', shape: '(J, J)', meaning: '$A_{ij} = 1$ when job $i$ reads an output of job $j$; 50 jobs, 79 edges'}
  - {symbol: '\operatorname{tr}(A^k)', code: 'walk_traces(A), is_nilpotent(A)', shape: '(J,)', meaning: 'closed walks of length $k$; all zero ⇔ $A$ nilpotent ⇔ acyclic'}
  - {symbol: '(I - A)^{-1}', code: 'torch.linalg.inv(I - A), closure(A)', shape: '(J, J)', meaning: 'counts the paths $j \to i$; its 0/1 pattern is the reachability (boolean repeated squaring)'}
