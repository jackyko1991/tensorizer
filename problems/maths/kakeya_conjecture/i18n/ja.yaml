source_hash: a69998e36eef
title: 掛谷予想
summary: 針は、面積がいくらでも小さい集合の中であらゆる方向に回すことができます。この問題ではそのような集合（$2^k$ 個の細い三角形を横にずらしたペロンの木）を作り、その面積を一行ずつ厳密に測ります。続いて $\mathbb R^2$、$\mathbb R^3$、$\mathbb R^4$ 内の $\delta$ チューブの和集合を $\delta$ 立方体で覆い、その次元を見積もります。掛谷予想は、このような集合でもなお完全な次元 $n$ を持つと主張します。これは $n = 2$ で証明され、2025 年からは $n = 3$ でも証明されています。$n \ge 4$ については、これまでの証明はすべて未検証の AI 生成の主張にすぎません。
notes: 掛谷は 1917 年に、長さ 1 の針を一回転させるのに必要な最小の面積を問いました。ベシコビッチ（1919、1928）は、あらゆる方向の単位線分を含む集合の測度が 0 になりうることを発見し、ペロン（1928）はその構成をここに描いた木に簡略化しました。三角形を $2^k$ 本の細片に切り、横にずらします。各細片は自分の方向を保ち、ペロンの操作を一回行うごとに重なりが増えます。面積は $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ を満たし（確認済み）、24 個の値を同時に試して見つけた最良の $\alpha$ により、面積は $\ln k / k$ のように減少します。Córdoba（1977）は平面の掛谷集合の $\delta$ 近傍の面積が少なくとも $c / \log(1/\delta)$ であることを証明したので、この遅い減少は避けられません。また Davies（1971）は、平面のすべての掛谷集合がハウスドルフ次元とミンコフスキー次元 2 を持つことを証明しました。60° ずつ回した 3 本の木はあらゆる方向の単位針を含みます（赤い針が 180° を掃きます）。Pál の技法で各位置をつなぐと、面積がいくらでも小さい集合の中で針を実際に回転させられます。$\mathbb R^n$ では、掛谷集合予想はそのような集合がすべて次元 $n$ を持つと主張します。方向が $\delta$ 分離した半径 $\delta$ のチューブはあまり重なり合えないので、その和集合の体積は $\gtrsim_\varepsilon \delta^{\varepsilon}$ となる、というものです。右のパネルは 2 通りの配置（すべてのチューブが原点を通るものと、中心がランダムなもの）について $\delta$ 立方体を数えます。どちらの場合も $\log(1/\delta)$ に対する $\log N$ の傾きは $n$ に近づきます。予想が正しければそうなるはずです。コンピュータが検証できるのは特定の配置だけで、すべての配置を調べることは決してできません。現状（2026 年 11 月）：$n = 2$ は証明済み（Davies 1971）。$n = 3$ は Hong Wang と Joshua Zahl
  により証明されました（2025 年のプレプリント）。それに先立って Wolff の評価 $(n+2)/2$（1995）と Katz–Łaba–Tao の結果があります。$n \ge 4$ については、査読済みの文献ではこの問題は未解決です。OpenAI が公開した AI 生成の原稿集（github.com/openai/math、ファミリー 074 と 079）は、四次元の場合を、さらに Sogge の局所平滑化予想を通じてすべての次元を主張しています。リポジトリは一部の命題が Lean で形式化されていると述べていますが、これらは査読を経ていない機械生成の主張であり、数学界による確認を待っている段階なので、このページでは証明済みではなく主張として扱います。この予想の重要性は幾何学をはるかに超えています。調和解析のフーリエ制限予想とボホナー–リース予想から導かれるのです。
meanings:
- 頂点 $(0, 1)$、底辺 $[b_i, b_i + w_0]$ を持つ $N = 2^k$ 個の細い三角形で、底辺は $[-1/\sqrt3, 1/\sqrt3]$ を分割します：60° の方向の錐で、各辺は $\ge 1$
- $k$ 回のペロン操作後の横方向のずれを、$A$ 個の $\alpha$ の値について同時に計算します。各回で隣り合う心臓部を接触させ、右側を $(1-\alpha)(c - a)$ だけ左へ押します
- 三角形 $i$ が高さ $y$ の水平線と交わる位置
- 各行の区間を左端で並べ替えます。右端の累積最大値が、すでに覆われた部分を与えます
- 繰り返される $i$ と $y$ ⇒ 和：各行の和集合の厳密な長さを、行について平均します（中点則）
- 立方体 $[-1,1]^n$ の面上の $\delta$ 格子を球面へ押し出したもの：およそ $\delta$ 分離した直線の方向
- 各チューブが通る一辺 $\delta$ の立方体を、チューブに沿って $\delta/2$ ごとにサンプリングします
- 繰り返される $i$ ⇒ 和：立方体ごとに一つの整数キーを割り当てるので、異なる立方体の数は一回のソートで数えられます
- 繰り返される $j$ ⇒ 和：0°、60°、120° 回した木の 3 つのコピーがあらゆる方向を覆います
labels:
  k_max: ペロン操作の回数 $k$（$2^k$ 個の三角形）
  n_max: チューブの次元 $n$ まで
