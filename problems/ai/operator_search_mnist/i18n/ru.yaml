source_hash: efa79cfa67ef
title: 'Поиск операторов на MNIST: тензорный DAG сам записывает своё уравнение классификации'
summary: Могут ли несколько читаемых тензорных операторов, соединённых в DAG, конкурировать со свёрточной сетью (CNN), когда обучающих изображений лишь горстка? Каждое ребро небольшого DAG содержит взвешенную через softmax смесь 23 операторов-кандидатов (Собель, лапласиан, Габор, обучаемый фильтр 3×3, ReLU, $x^2$, пулинг, суммы по строкам, модуль FFT, шаблоны классов, PCA, моменты, линейные и прототипные считывания); поиск DARTS на 1–100 изображениях на цифру выбирает по одному оператору на ребро, и DAG выводится как уравнение LaTeX, в точности воспроизводящее его предсказания. Затем — сравнение по данным и вычислениям с CNN в стиле LeNet и двумя базовыми методами в замкнутой форме, с показом каждого сида.
notes: 'Вопрос. Эта модельная задача принадлежит Jacky Ka Long Ko: попытка обучения ИИ на малых выборках с записью уравнения в виде «белого ящика». CNN против тензорного метода на MNIST; перечислить операторы-кандидаты; позволить тензору, кодирующему DAG, найти лучшие операторы и их соединения; обучить на малых выборках и сравнить, сколько данных и вычислений нужно каждому для одинаковой точности; и записать уравнение классификации найденного DAG. Метод. Изображения имеют размер 14×14 (MNIST, усреднённый по блокам 2×2, чтобы 30 запусков уложились примерно в минуту CPU). Суперсеть — ячейка DARTS (Liu, Simonyan и Yang 2019) с тремя узлами $z_1, z_2, z_3$, на которые подаются все предыдущие узлы через 6 рёбер, каждое — смесь 12 операторов ячейки (ноль, тождество, $x^2$, $|x|$, ReLU, tanh, мягкий порог $S_\lambda$, обучаемый фильтр $3\times 3$, Собель-$x$, Собель-$y$, лапласиан, Габор), затем ребро пулинга (среднее или максимум $2\times 2$), ребро редукции (vec, суммы по строкам, суммы по столбцам,
  низкочастотный модуль FFT, корреляции с шаблонами классов, проекция PCA, моменты изображения) и ребро головы (линейное считывание или 10 прототипов). Архитектура — это тензор $\alpha$ (9 рёбер × 23 оператора) с маской для правила типизации. Поиск: DARTS первого порядка, чередующий шаг по $\theta$ на мини-батче обучающей половины и шаг по $\alpha$ на валидационной половине, с отжигом температуры softmax от 1 до 0.001; DAG сохраняет на каждом ребре оператор argmax (ноль удаляет ребро), наследует обученные $\theta$ и кратко дообучается, сохраняется лучший шаг по валидации. Отступления от DARTS, указанные потому, что они важны: отжиг (как в SNAS и GDAS) и правило argmax закрывают разрыв дискретизации, который в первой пробе стоил до 25 пунктов точности; изображение сохраняется как четвёртый канал выхода ячейки; головы стартуют с ближайшего среднего класса в своём пространстве признаков. CNN (8 и 16 каналов $3\times 3$, max-пулинг, линейный слой: 2698 весов) обучается с Adam на тех же изображениях
  с той же ранней остановкой. Базовые методы не имеют обучаемых параметров: ближайшее среднее класса в пикселях и PCA с последующим LDA со сжатием. Результаты. Тесты проверяют, что каждый оператор равен своей формуле на малом входе, что one-hot смесь — это одиночный оператор, а one-hot суперсеть — дискретный DAG, что дискретизация выбирает argmax, что записанное уравнение, прочитанное обратно только из его LaTeX, даёт в точности предсказания DAG, и что базовые методы совпадают со своими замкнутыми формами. Прилагаемый запуск (CPU, один поток, 3 сида), средняя тестовая точность для $n$ = 1, 5, 10, 50, 100 изображений на цифру: CNN 0.35, 0.53, 0.64, 0.81, 0.85; найденный DAG 0.38, 0.48, 0.52, 0.69, 0.82; PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76; ближайшее среднее класса 0.41, 0.56, 0.64, 0.68, 0.69. Изображений на цифру для достижения 70 %: CNN 18, DAG 52, PCA + LDA 20; для достижения 80 %: CNN 45, DAG 91. Время обучения на запуск: CNN от 0.4 до 1 с, поиск плюс дообучение от 2 до 4 с. Итак,
  честно: начиная примерно с 10 изображений на цифру, CNN требуется меньше данных и меньше вычислений для той же точности; ниже этого лучше всего базовые методы в замкнутой форме, и ни один обучаемый метод их не превосходит; структурированная модель не выиграла при крошечных $n$ (при $n$ = 1 она наравне со средними классов). Почему: поиск идёт на валидационной части, которая сама крошечная, поэтому его выбор зашумлён, а его валидационная функция потерь часто предпочитает суммы по строкам (28 признаков, 290 обучаемых чисел, более спокойная функция потерь), которые классифицируют хуже, чем все пиксели (около 2000 обучаемых чисел); 7 из 15 DAG выбрали суммы по строкам. Как и сообщалось для DARTS, поиск отдаёт предпочтение операторам без параметров: фильтры Собеля занимают большинство рёбер, а обучаемый фильтр появляется в 3 из 15 DAG. Вне прилагаемого запуска более короткие поиски (20 или 40 шагов) выбирали все пиксели и достигали от 0.74 до 0.79 при $n$ = 50 — намёк на то, что более длинный
  поиск переусердствует; это наблюдалось на тестовом наборе, поэтому это наблюдение, а не подобранная настройка. GPU (GTX 1080 Ti) не дал ускорения: время определяют тысячи крошечных ядер, а не арифметика. В results/stages.csv — все числа, в results/equation.tex — все найденные уравнения. Связанные работы. Поиск нейронных архитектур (Zoph и Le 2017) и его дифференцируемая форма DARTS; символьная регрессия, которая ищет формулы вместо сетей (AI Feynman, Udrescu и Tegmark 2020; PySR, Cranmer 2023; генетическое программирование, Koza 1992); LeNet (LeCun et al. 1998) для CNN. Данные: MNIST (LeCun, Cortes и Burges), лицензия CC BY-SA 3.0; data/mnist_subset.npz содержит 1000 изображений обучающего пула и 2000 тестовых (лицензия share-alike распространяется на это подмножество), см. data/SOURCES.md. Попробуйте. Измените show_n, чтобы увидеть DAG, найденный с 1 или 100 изображениями на цифру, увеличьте число шагов поиска или задайте один сид для быстрого запуска.'
meanings:
- 'правило типизации: оператор $o$ может стоять на ребре $e$, только если он отображает форму входа этого ребра в форму его выхода (ячейка: карта → карта, пулинг, редукция: карта → вектор, голова: вектор → логиты)'
- маскированный softmax тензора архитектуры $\alpha$ (рёбра × операторы); температура $T$ падает от 1 до 0.001, так что смесь в итоге становится one-hot
- 'все операторы, которые питает узел, вычисляются один раз для всех его исходящих рёбер: одна свёртка даёт Собель-$x$, Собель-$y$, лапласиан, Габор и обучаемые фильтры $3\times 3$ $K_e$'
- 'повторяющийся $o$ ⇒ суммирование: каждый узел — сумма своих смешанных входящих рёбер; выход ячейки — стек $(x, z_1, z_2, z_3)$'
- признаки редукции $r$ (vec, суммы по строкам/столбцам, $|\mathcal F|$, шаблоны $\langle z, \mu_k\rangle$, PCA $U^\top \mathrm{vec}$, моменты), стандартизованные по обучающим изображениям
- все редукции × головы смешиваются на уровне логитов (длины их признаков различаются); линейная $W\hat f + b$ или прототипы $-e^\tau\lVert \hat f - p_k\rVert^2/D$, обе стартуют с ближайшего среднего класса
- 'DARTS первого порядка: шаги по $\theta$ на обучающем мини-батче, затем шаги по $\alpha$ на валидационном мини-батче'
- 'дискретный DAG, записанный в LaTeX, прочитанный обратно небольшим парсером и вычисленный: в точности те же предсказания, что и у DAG'
labels:
  search_steps: Шаги поиска DARTS (каждый — обновление $\theta$ и $\alpha$)
  retrain_steps: Шаги дообучения дискретного DAG
  cnn_steps: Шаги обучения CNN
  seeds: Сидов на каждый размер обучающей выборки
  batch: Размер мини-батча (сбалансирован по цифрам)
  show_n: Обучающих изображений на цифру у показанного DAG
