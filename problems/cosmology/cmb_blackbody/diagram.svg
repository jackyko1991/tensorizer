<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="CMB spectrum: a horn antenna on a satellite looks at the sky and measures intensity against frequency; the points fall on a Planck curve of temperature T">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes -->
    <line x1="80" y1="140" x2="232" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="140" x2="80" y2="16" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="218" y="156" font-style="italic">ν</text>
    <text x="86" y="24" font-style="italic">I</text><text x="92" y="28" font-size="10" font-style="italic">ν</text>
    <!-- Planck curve -->
    <path d="M80,140 C100,128 112,40 132,40 C152,40 168,112 226,136" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- measured points -->
    <g fill="#111827">
      <circle cx="96" cy="113" r="2.6"/><circle cx="106" cy="80" r="2.6"/><circle cx="116" cy="55" r="2.6"/>
      <circle cx="126" cy="42" r="2.6"/><circle cx="138" cy="42" r="2.6"/><circle cx="150" cy="56" r="2.6"/>
      <circle cx="162" cy="80" r="2.6"/><circle cx="176" cy="104" r="2.6"/><circle cx="192" cy="121" r="2.6"/>
      <circle cx="210" cy="131" r="2.6"/>
    </g>
    <!-- Wien peak -->
    <line x1="132" y1="40" x2="132" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="150" y="32" font-style="italic" fill="#b45309">T</text>
    <!-- horn antenna looking at the sky -->
    <path d="M18,128 L42,128 L54,96 L6,96 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="22" y="128" width="16" height="12" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <path d="M14,84 Q30,70 46,84" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M8,72 Q30,52 52,72" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="18" y="46" font-size="13">sky</text>
  </g>
</svg>
