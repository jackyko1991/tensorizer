source_hash: 695e730c122f
title: 문이 $N$개인 몬티 홀 문제
summary: '자동차가 $N$개의 문 중 하나 뒤에 숨겨져 있습니다. 여러분이 문 하나를 고르면, 자동차의 위치를 아는 진행자가 염소가 있는 문 $N-2$개를 열고 마지막 남은 닫힌 문으로 바꿀 기회를 줍니다. 3부터 1000까지 모든 $N$에 대해 수백만 번의 게임이 하나의 $(B, G)$ 텐서에서 동시에 실행됩니다: 바꾸면 확률 $(N-1)/N$로 이기고(문 세 개일 때 유명한 $2/3$), 유지하면 $1/N$로 이기며, 진행 중인 모든 승률은 이항 오차 범위 안에 머뭅니다.'
notes: '바꾸기는 처음 고른 문이 이미 자동차였을 때만 지는데, 그 확률은 $1/N$입니다; 그 밖의 모든 경우에는 진행자의 선택이 강제되므로, 진행자가 닫아 둔 문에는 그가 연 모든 문의 정보가 담깁니다. 문이 1000개라면 답은 뻔하며, 문이 세 개일 때와 같은 논리입니다. 이 퍼즐은 1990년 메릴린 보스 사반트(Marilyn vos Savant)의 잡지 칼럼으로 유명해졌는데, 당시 수학자를 포함한 많은 독자가 답이 $1/2$라고 주장했습니다. 그 직관은 다른 게임에서는 옳습니다: 아무것도 모르는 진행자를 선택해 보세요. 그는 문을 무작위로 열고 가끔 자동차를 드러냅니다. 그런 게임을 버리면(비율 $2/N$만 남음) 유지와 바꾸기의 승률이 정확히 $1/2$가 되는데, 무작위로 연 문은 여러분의 문에 대해 아무것도 알려 주지 않기 때문입니다. 터미널은 또한 어떤 첫 선택도 특별하지 않음을 확인하며, 테스트에 있는 게임을 하나씩 처리하는 느린 참조 구현이 텐서 버전과 일치합니다.'
meanings:
- 나란히 비교하는 문의 개수들, 3부터 1000까지
- 행 $b$에서 게임 $g$의 자동차 문과 첫 선택, $N_b$개 문에 대해 균등; broadcasting으로 각 행이 자기만의 $N_b$를 가짐
- '진행자가 닫아 두는 문: 여러분이 염소를 골랐다면 반드시 자동차, 자동차를 골랐다면 무작위 문'
- '진행자가 여는 $N-2$개의 문: $p$와 $k$를 제외한 모든 문'
- 유지 시 승리와 바꾸기 시 승리; 모든 게임에서 정확히 하나만 참
- '누적 승리 수를 누적 유효 게임 수로 나눈 값: 매 게임 후의 승률'
- 이항 비율의 $\pm 2\sigma$ 범위, 진행 중인 승률은 약 95 %의 시간 동안 이 안에 머묾
labels:
  n_games: 문 개수당 게임 수 $G$
  max_doors: 최대 문 개수 $N$
  host: 진행자
