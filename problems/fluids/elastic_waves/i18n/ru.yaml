source_hash: 36e54b56debf
title: Упругие P- и S-волны
summary: 'Уравнение Навье–Коши для упругого твёрдого тела. Короткий толчок в одной точке порождает две волны: быструю продольную P-волну (видна в $\nabla\cdot\mathbf u$) и более медленную поперечную S-волну (видна в $\nabla\times\mathbf u$). Оба слагаемых — свёртки одной таблицы вторых производных $\partial_i\partial_j u_k$ — два einsum с разными повторяющимися индексами.'
notes: Единицы с $\rho = 1$ и размером ячейки 1. Шаги по времени — схема «чехарда», $u^{n+1} = 2u^n - u^{n-1} + \Delta t^2\,\ddot u^n$. Взятие дивергенции уравнения даёт волновое уравнение для $\theta = \partial_j u_j$ со скоростью $c_P$; взятие ротора — уравнение для вращения со скоростью $c_S < c_P$; в горных породах $c_P \approx 1.7\,c_S$, поэтому P-волна землетрясения приходит первой, а S-волна — секундами позже. Точечная сила излучает P-волны в основном вдоль силы, а S-волны — в основном поперёк неё, что видно по двум лепестковым картинам. Штриховые окружности — предсказанные фронты $c\,(t - t_0)$, где $t_0$ — пик импульса источника. Поглощающая граница гасит волны до того, как они достигнут края (в реальных кодах используют идеально согласованный слой); коэффициент Пуассона около ½ ($\lambda \gg \mu$) делает $c_P$ большим и вынуждает брать малый шаг по времени.
meanings:
- поле перемещений, компонента $i \in \{x, y\}$ в каждом узле
- все вторые производные центральными разностями
- повторяющийся $j$ (2-я и 3-я позиции) ⇒ градиент дивергенции
- повторяющийся $j$ (1-я и 2-я позиции) ⇒ лапласиан каждой компоненты
- короткий толчок формы «мексиканская шляпа» в центре вдоль одного направления
- изменение объёма (P) и вращение (S)
- шаг «чехарды»; число Куранта $S > 1$ отвергается, так как схема становится неустойчивой
labels:
  lam: Постоянная Ламе $\lambda$
  mu: Модуль сдвига $\mu$
  direction: Направление силы
  courant: Число Куранта $S$
  t_max: Время моделирования
