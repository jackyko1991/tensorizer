title: Поле витков с током (Био–Савар)
summary: Закон Био–Савара превращает провод в сумму коротких отрезков. Векторное произведение $d\mathbf l\times\mathbf r$ — это тензор Леви-Чивиты $\varepsilon_{ijk}$, свёрнутый с двумя векторами, так что один einsum по ($i, j, k$, отрезок) даёт поле всей катушки в каждой точке сетки. Радиус витка увеличивается и уменьшается, а поле в плоскости $x$–$z$ и на оси следует за ним.
notes: Единицы СИ ($\mu_0 = 4\pi\times 10^{-7}$ Тл·м/А), поле показано в мкТл. Витки лежат в горизонтальных плоскостях, поэтому плоскость $x$–$z$ пересекает каждый из них в двух точках (⊙ ток из плоскости рисунка, ⊗ в неё). Катушки Гельмгольца (расстояние $R$, равные токи) создают почти однородное поле между собой; анти-гельмгольцевы катушки (противоположные токи) дают поле, обращающееся в нуль в центре и растущее линейно, — ловушку для холодных атомов. В точках сетки рядом с проводом используется малая длина сглаживания, чтобы поле оставалось конечным.
meanings:
- точка поля $g$ в плоскости $y = 0$
- середина и вектор направления отрезка провода $s$
- от каждого отрезка к каждой точке поля (broadcasting)
- 'символ Леви-Чивиты: векторное произведение как тензор'
- повторяющиеся $j, k$ ⇒ векторное произведение; повторяющийся $s$ ⇒ сумма по проводу
- точное $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$ для каждого витка, для проверки суммы
