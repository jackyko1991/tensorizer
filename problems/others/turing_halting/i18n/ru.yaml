source_hash: 55836e86a221
title: Проблема остановки на пакете машин Тьюринга
summary: 'Не физика, просто для удовольствия: запустите сотни тысяч машин Тьюринга одновременно в виде тензоров. Один шаг каждой машины — это gather (прочитать ленту под каждой головкой), поиск её правила продвинутой индексацией и scatter (записать). Переберите всех кандидатов в «усердные бобры» с 2 и 3 состояниями, найдите чемпионов $S(2) = 6$ и $S(3) = 21$ и посмотрите на проблему остановки в действии: какой бы бюджет шагов вы ни выбрали, часть машин остаётся нерешённой.'
notes: 'Тьюринг (1936) показал, что никакая программа не может для любой машины и любого входа решить, остановится ли она. Диагональный аргумент в одном абзаце: пусть машина $D(M)$ отвечает «остановится» или «работает вечно» для любой машины $M$, запущенной на собственном описании. Построим $G$, которая выполняет $D(M)$ и затем делает обратное: зацикливается навсегда, если $D$ говорит «остановится», и останавливается, если $D$ говорит «работает вечно». Что же делает $G$ на собственном описании? Если она останавливается, то $D$ сказала, что она работает вечно, а если работает вечно, то $D$ сказала, что она остановится. В обоих случаях $D$ ошибается, значит, $D$ не может существовать. Радо (1962) превратил это в игру «усердный бобёр»: среди всех машин с $n$ состояниями и 2 символами, которые, будучи запущены на пустой ленте, останавливаются, $S(n)$ — самая долгая работа, а $\Sigma(n)$ — наибольшее число оставленных единиц. Обе растут быстрее любой вычислимой функции, ведь программа для $S(n)$
  решала бы проблему остановки: запустить каждую машину на $S(n)$ шагов, и если она к тому времени не остановилась, она не остановится никогда. Известные значения: $S(2) = 6$, $\Sigma(2) = 4$ (Радо), $S(3) = 21$, $\Sigma(3) = 6$ (Лин и Радо, 1965), $S(4) = 107$, $\Sigma(4) = 13$ (Брэди, 1983) и $S(5) = 47\,176\,870$, доказанное в 2024 году коллаборацией bbchallenge с проверенным в Coq доказательством того, что все остальные машины с 5 состояниями работают вечно. График показывает, почему это трудно: доля остановившихся $f(t)$ растёт, а затем выходит на плато, и конечный бюджет никогда не отличит медленно останавливающуюся машину от работающей вечно. Здесь плато после шага 21 — известный ответ для 3 состояний, потому что для оставшихся машин доказано, что они зацикливаются. Нормировка для 3 состояний: первое правило зафиксировано как A0 → 1RB — обычный выбор, сохраняющий известных чемпионов (по симметрии лево–право первый ход можно считать вправо, имена остальных состояний взаимозаменяемы,
  а машина, остающаяся в A на пустой ленте, никогда не останавливается), и каждое правило остановки — 1RH; это даёт $13^5 = 371\,293$ машин вместо $16^6$. Попробуйте 4 состояния: случайная выборка редко содержит чемпиона на 107 шагов.'
meanings:
- 'таблица правил машины $b$ для состояния $q$ и прочитанного символа $r$: (записать $w$, сдвинуться на $m = \pm1$, следующее состояние $q''$); состояние $n$ — состояние остановки $H$'
- ячейка $x$ ленты машины $b$, вначале все 0; $L = 2t_{\max} + 1$, чтобы ни одна головка не дошла до конца
- положение головки (вначале в середине) и текущее состояние (вначале $A$)
- прочитать символ под всеми головками сразу
- 'продвинутая индексация: каждая машина находит своё правило'
- записать; затем сдвинуться и сменить состояние, только где $s_b \ne H$ (остановившиеся машины замирают)
- 'шаг, на котором машина $b$ перешла в $H$, или $-1$: не решено в пределах бюджета'
- 'доля машин с $\tau_b \le t$: неубывающая и застрявшая ниже 1'
- 'повторяющийся $x$ ⇒ суммирование: число единиц, оставленных остановившейся машиной'
labels:
  states: Состояния $n$ (2 и 3 полный перебор, 4 выборка)
  budget: Бюджет шагов $t_{\max}$
  n_sample: Случайные машины с 4 состояниями
