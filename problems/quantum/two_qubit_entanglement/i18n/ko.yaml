source_hash: e0abd4c769f3
title: 두 큐비트 얽힘
summary: 두 큐비트를 $(2, 2)$ 텐서 $\psi_{ab}$로 저장합니다. 게이트는 einsum 하나로 적용하는 4차 텐서입니다. 큐비트 1에 아다마르 게이트, 이어서 CNOT을 걸면 $\lvert 00\rangle$이 벨 상태가 됩니다. $\psi_{ab}$의 특잇값 분해가 곧 슈미트 분해이므로 얽힘 엔트로피를 바로 얻습니다. 이어서 쌍은 이징 해밀토니안 아래에서 시간 전개하며, 부분 대각합으로 각 큐비트의 축약 밀도 행렬을 얻습니다. 큐비트가 얽혀 있을 때마다 그 블로흐 벡터는 구 안쪽으로 줄어듭니다.
notes: 단위 $\hbar = 1$. 단일 큐비트 연산자의 텐서곱 $A\otimes B$는 4차 텐서 $A_{ac}B_{bd}$입니다(torch.kron은 행 지표가 $2a + b$인 $4\times 4$ 행렬로 같은 수들을 줍니다). $\psi_{ab}$가 행렬이므로 SVD는 상태를 $\sum_k s_k\lvert u_k\rangle\lvert v_k\rangle$로 씁니다. 이것이 슈미트 분해입니다. 얽힘 엔트로피 $S = -\sum s_k^2\ln s_k^2$는 곱 상태에서 0, 벨 상태에서 $\ln 2$이며, 벨 상태의 축약 상태는 최대 혼합 상태입니다($\rho = I/2$, 블로흐 벡터는 중심). 동시성(concurrence) $C = 2\lvert\det\psi\rvert$는 0(곱 상태)에서 1(최대 얽힘)까지 변합니다. 이징 해밀토니안 아래에서 결합 $J$는 얽힘을 만들고 없애며, 가로 자기장 $h$는 개별 큐비트를 회전시킵니다. $h = 0$이면 벨 상태는 고유 상태이므로 아무것도 변하지 않습니다.
meanings:
- 큐비트 1이 $\lvert a\rangle$, 큐비트 2가 $\lvert b\rangle$에 있을 진폭
- '4차 텐서로 쓴 두 큐비트 게이트: 출력 지표 $a\,b$, 입력 지표 $c\,d$'
- '$c$와 $d$에 대해 합: 게이트 적용'
- 슈미트 계수; 0이 아닌 값이 하나 ⇔ 곱 상태
- 큐비트 2에 대한 부분 대각합 ($b$에 대해 합)
- 텐서곱으로 만든 이징 해밀토니안, eigh를 위해 (4, 4)로 변형
- 큐비트 하나의 블로흐 벡터 $\operatorname{Tr}(\rho\,\sigma_k)$; $\lvert\mathbf r\rvert < 1$이면 혼합 상태
labels:
  initial: 초기 상태 (회로로 만든 벨 상태 또는 $\lvert 00\rangle$)
  J: 이징 결합 $J$
  h: 가로 자기장 $h$
  t_max: 시뮬레이션 시간
