source_hash: 673b0fc9f634
title: 理想气体分子动理论
summary: 数百个硬盘在盒子中来回碰撞。所有圆盘初速大小相同，但弹性碰撞不断重新分配能量，直到速率服从麦克斯韦–玻尔兹曼分布；圆盘传给器壁的动量重现了理想气体状态方程 $PA = NkT$。
notes: 约化单位：盒子边长 1，质量 1，玻尔兹曼常量 1。粒子对张量为 $N\times N$，对几百个圆盘没有问题（实际程序使用元胞列表）。同一步中同时接触另外两个圆盘的圆盘等待一步，因此每次碰撞都是干净的二体交换，能量在舍入误差内守恒。压强是每次反弹传递的动量 $2m\lvert v_\perp\rvert$，对整个运行求和后除以时间 × 器壁长度。结果比 $NkT/A$ 高几个百分点，因为圆盘本身占据面积——这是对理想气体的第一阶修正，对面积分数 $\eta$ 约为 $(1 + \eta^2/8)/(1 - \eta)^2$。
meanings:
- 圆盘 $a$ 的位置，分量 $i \in \{x, y\}$
- 圆盘 $a$ 的速度
- 通过广播一次得到所有两两位移
- 重复的 $i$ ⇒ 求和：每对圆盘的距离平方
- $P$ 对碰撞圆盘的相对速度在碰撞法线上的投影
- 总动能，在二维中等于 $NkT$
- 二维速率分布 $(mv/kT)\exp(-mv^2/2kT)$
labels:
  n_particles: 粒子数
  radius: 圆盘半径
  speed: 初始速率
  t_max: 模拟时长
