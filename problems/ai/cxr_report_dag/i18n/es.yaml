source_hash: 433f576ee66b
title: 'De la radiografía de tórax al informe mediante un tensor DAG: una CNN y un LM diminuto unidos'
summary: 'Un juguete didáctico, no generación de informes clínicos. Una CNN pequeña aprende seis hallazgos a partir de 410 radiografías de tórax del NIH, y un GPT diminuto a nivel de caracteres aprende informes de plantilla ("enlarged heart. pleural effusion. no pneumothorax.") a partir de una cabecera de etiquetas escrita, cada uno por separado. Una sola arista del DAG los une: un conector convierte las probabilidades de hallazgos de la CNN en una cabecera suave, de modo que el LM escribe un informe solo a partir de la imagen. El proceso de entrenamiento es en sí un DAG tensorial (reglas por niveles, camino crítico max-plus, una llamada por lotes por regla sobre todas las semillas), comparado con la misma red entrenada de extremo a extremo con el mismo cómputo, y luego ajustado con 251 textos reales (pie de figura + las frases que citan esa radiografía) de artículos de PubMed Central con licencia abierta (CC BY). La etapa 2 es débil, como cabe esperar con tan pocos pares, y la página lo
  dice.'
notes: 'Qué es esto. Un juguete didáctico, no generación de informes clínicos: modelos diminutos, imágenes de 64×64, unos cientos de etiquetas ruidosas y ningún informe radiológico real. Nada de lo que hay aquí dice nada sobre la precisión clínica. La idea (redes entrenadas por separado, conectadas mediante un tensor DAG, optimizadas globalmente, con todo el proceso controlado a su vez por el tensor DAG) es de Jacky Ka Long Ko; este problema traslada la unión CNN + LM diminuto del problema anterior de esta serie a las radiografías de tórax y a un texto que se lee como un informe (muy breve). Por qué no hay informes reales. Ninguna de las colecciones de informes de libre acceso cumple la regla de licencia usada aquí (abierta, redistribuible, uso comercial permitido): IU X-ray / OpenI (Demner-Fushman et al. 2016) es CC BY-NC-ND; MIMIC-CXR (Johnson et al. 2019), VinDr-CXR y BRAX requieren acceso acreditado con acuerdos de uso de datos; CheXpert y PadChest son solo para investigación. Así que
  la etapa 1 usa informes de plantilla generados en el código a partir de los conjuntos de etiquetas del NIH, lo que la convierte en una clasificación multietiqueta verbalizada como texto, y la etapa 2 usa pies de figura más las frases que citan la figura, tomados de artículos de PubMed Central con CC BY: textos cortos y heterogéneos, escritos para casos clínicos, que a menudo señalan flechas y paneles. Qué es nuevo y qué no. La generación de informes a partir de radiografías de tórax es un campo activo (Jing et al. 2018, R2Gen de Chen et al. 2020); un codificador de imágenes preentrenado unido a un modelo de lenguaje por un pequeño conector aprendido es como están construidos LLaVA (Liu et al. 2023) y BLIP-2 (Li et al. 2023). Lo que aporta este problema es la orquestación: el grafo del modelo y el proceso de entrenamiento los ejecuta el motor de DAG tensorial del problema de flujo de trabajo del polígono de Willis (grafo de reglas analizado desde data/training.smk, grafo de trabajos de
  Kronecker, niveles booleanos, camino crítico max-plus), cada regla es una llamada por lotes sobre las semillas, y el modelo construido con el DAG se compara con un monolito con el mismo cómputo. Datos. NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center; sin restricciones de uso, con atribución): 549 imágenes frontales PA, una por paciente, seis hallazgos (cardiomegalia, derrame, infiltrado, atelectasia, neumotórax, masa o nódulo) o ninguno, como mucho dos por imagen; 410 de entrenamiento, 139 de prueba. Las etiquetas se extrajeron de informes mediante PLN y son ruidosas (alrededor de un 10 % o más erróneas). PMC: 316 figuras de radiografías de tórax de 316 artículos de acceso abierto, todas CC BY (comprobado en la licencia del propio XML del artículo; regla: CC BY, CC BY-SA o CC0, se rechazan NC, ND, otras o ausentes). Los candidatos proceden de los metadatos de ROCOv2 (Rückert et al. 2024), usados solo como índice de PMCID; no se incluye nada de ROCOv2. De 2114 artículos comprobados,
  1575 se aceptaron y 539 se rechazaron por la licencia (todos CC BY-NC). El texto de la etapa 2 es el pie de figura seguido de las frases del mismo artículo que citan la figura (315 de 316 artículos tienen al menos una), solo frases completas, hasta 360 caracteres, el contexto del LM diminuto: mediana de 35 palabras (IQR 26–45) frente a 12 (8–18) para el pie de figura solo. Cada figura y cada texto se acredita en data/ATTRIBUTION.csv; data/SOURCES.md recoge las fuentes, condiciones, recuentos, sumas de verificación y procesamiento. Modelos y el DAG de entrenamiento. CNN: tres convoluciones agrupadas, 41 014 pesos, seis salidas sigmoides (multietiqueta, positivos ponderados según su rareza). LM: un GPT de caracteres de dos capas (d = 32, cuatro cabezas, 40 108 pesos) entrenado con todas las plantillas, con la cabecera de etiquetas escrita como seis letras delante ("ce----", y luego "enlarged heart. pleural effusion."). Conector (2848 pesos): a partir de las seis probabilidades $q$ y un vector
  de ranura $S_t$ genera los $K = 6$ tokens suaves que sustituyen a la cabecera. Niveles: 0 train_cnn ∥ train_lm ∥ train_monolith; 1 train_connector (CNN y LM congelados); 2 global_finetune ∥ train_router; 3 caption_finetune (conector + LM con los textos de PMC, CNN congelada); 4 evaluate. Las pruebas comprueban los niveles y el camino crítico, que el grafo de trabajos es nilpotente, que dos semillas en una misma pila se entrenan exactamente igual que cada una por separado (hasta el redondeo de float32), que la pérdida de un modelo no envía gradiente a los demás, que la etapa del conector solo cambia el conector, y que la capa MoE con el enrutador fijo es igual al cableado del DAG hasta 1e-6, gradientes incluidos. Los informes se escriben de forma voraz (con una caché de clave/valor, probada contra la pasada hacia delante simple) y se vuelven a convertir en etiquetas por palabras clave, con negación ("no pneumothorax."). Resultados de la etapa 1 (2 semillas, 139 imágenes de prueba, medias
  sobre las semillas; results/stages.csv tiene todas las cifras). La CNN sola: AUROC media 0.62 (azar 0.5), micro F1 0.31 con umbral 0.5 (adivinar al azar con la prevalencia de entrenamiento: 0.16). Sus etiquetas escritas como cabecera para el LM solo: micro F1 0.32, así que el LM verbaliza fielmente (0.90 de sus salidas son plantillas bien formadas, incluso para conjuntos de etiquetas que nunca vio). El modelo unido: micro F1 0.22 tras la etapa del conector y 0.20 tras el ajuste global (de 0.15 a 0.25 según ejecuciones y semillas), cada informe una plantilla bien formada, de 0.26 a 0.27 exactamente la plantilla de las etiquetas verdaderas. El monolito, la misma red entrenada de extremo a extremo con los 410 pares imagen–informe con las mismas multiplicaciones-sumas (405 pasos conjuntos), escribe "clear lungs." o "normal chest." para cada imagen: micro F1 0, exacto 0.27 (la proporción de imágenes normales). Así que la cadena del DAG supera claramente al monolito, porque reutiliza la supervisión
  por etiquetas de la CNN y todo el texto de las plantillas, pero no supera a la CNN sola: un informe de plantilla solo puede volver a expresar lo que sabe el clasificador, y el modelo unido, entrenado por verosimilitud, escribe el informe más probable, que se inclina hacia "normal" cuando la imagen es ambigua, mientras que el umbral de la CNN ponderado por rareza favorece la sensibilidad, que $F_1$ premia. El ajuste cambia poco. Arista del DAG = despacho MoE. La capa de entrada como mezcla de expertos (experto de imagen = CNN + conector, experto de texto = embedding de tokens) con $G$ one-hot según el tipo de dato da exactamente las salidas cableadas por el DAG (probado). Un enrutador lineal entrenado como mezcla densa con los expertos congelados, y luego usado en top-1 (enrutar y después ejecutar el experto elegido), envía cada posición al experto de su modalidad (precisión de enrutamiento 1.00 en ambas semillas), de modo que sus informes y puntuaciones son iguales a los del enrutador
  fijo. Resultados de la etapa 2 (65 figuras de PMC reservadas): débiles, como se esperaba. Tras 150 pasos con 251 textos, el modelo escribe "chest x-ray showing" y luego una sopa de letras: BLEU-1 0.05, ROUGE-L 0.06, exhaustividad de palabras clave de hallazgos 0, entropía cruzada en los datos reservados 2.32 nats por letra. Darle la imagen de otra figura no cambia nada (2.32 nats, las mismas puntuaciones): la imagen no se usa. Una referencia ciega que devuelve un texto de entrenamiento fijo puntúa más alto (BLEU-1 0.17, ROUGE-L 0.22). Un LM de caracteres de 40 000 pesos no puede aprender este lenguaje a partir de unos 70 000 caracteres en un minuto de CPU; con los pies de figura recortados a la primera cláusula de una versión anterior (mediana de 6 palabras), ROUGE-L era de alrededor de 0.28, pero esos textos apenas eran frases. La maquinaria del DAG funciona; los datos son demasiado escasos para la etapa 2. Tiempo. En una CPU de escritorio de 6 núcleos, el entrenamiento tarda unos 85
  s cuando la máquina está tranquila, más unos 30 s para el GIF; los tiempos medidos se multiplican por dos o por tres cuando otros trabajos pesados comparten la máquina (la ejecución que se muestra en el GIF y en timings.csv se hizo con esa carga, así que sus segundos son mayores), y la etapa de pies de figura es la más afectada. Con un worker por regla, el camino crítico max-plus es CNN → conector → ajuste → pies de figura → evaluación. El código elige una GPU cuando torch ve una (pixi run -e cuda); el entorno por defecto tiene una compilación de torch para CPU, así que todas las cifras incluidas son de la CPU. Prueba. Más pasos de pies de figura (la etapa 2 mejora despacio), sin ajuste global (0 pasos), menos pasos de la CNN (la CNN limita todo) o una sola semilla para ver cuánto discrepan las semillas.'
meanings:
- la regla $s$ lee lo que escribe la regla $r$; el proceso de entrenamiento analizado desde data/training.smk con el analizador del problema del polígono de Willis
- 'nivel de cada regla: CNN, LM y monolito en el 0, conector en el 1, ajuste y enrutador en el 2, pies de figura en el 3, evaluación en el 4'
- tiempos de finalización max-plus a partir de las duraciones medidas de las reglas; $\max t$ es el camino crítico
- las seis probabilidades de hallazgos de la CNN (sigmoide, multietiqueta) para cada imagen; el eje de modelos $m$ se convierte en los grupos de una convolución agrupada por capa
- 'la arista del DAG: probabilidades de hallazgos más un vector de ranura $S_t$ → un vector de entrada del LM; los $K = 6$ tokens suaves sustituyen a la cabecera de etiquetas escrita'
- 'enrutador: one-hot según el tipo de dato (ranura de cabecera o letra), o un softmax aprendido sobre las características de posición (entrenado denso, usado en top-1)'
- '$x$ repetido ⇒ sumado: la combinación de la capa MoE; cada experto $Y^x$ se calcula solo sobre su grupo asignado'
- logits de la letra siguiente del GPT diminuto (atención con einsum y un eje de modelos, de chain_of_thought)
- pérdida por modelo sobre las letras del informe tras la cabecera (nats); sumar las $M$ pérdidas da a cada modelo su propio gradiente
- '$n$ repetido ⇒ sumado: verdaderos positivos de las etiquetas recuperadas de cada informe escrito; el micro $F_1$ los agrupa sobre $f$'
labels:
  seeds: Semillas (réplicas independientes)
  steps_cnn: Pasos de preentrenamiento de la CNN
  steps_lm: Pasos de preentrenamiento del LM (informes de plantilla)
  steps_con: Pasos del conector (CNN y LM congelados)
  steps_ft: Pasos del ajuste global
  steps_router: Pasos del enrutador aprendido
  steps_cap: Pasos de ajuste con pies de figura (etapa 2)
  lr_ft: Tasa de aprendizaje del ajuste
  lr_cap: Tasa de aprendizaje de los pies de figura
