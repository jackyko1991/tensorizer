<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Chain of thought for parity: the bits b1 to b3, then the scratchpad s1 to s3, each running parity computed from the bit b_k and the previous cell s_(k-1)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the input bits -->
    <g stroke="#1e40af" stroke-width="1.5" fill="#93c5fd">
      <rect x="10" y="112" width="24" height="24" rx="4"/>
      <rect x="38" y="112" width="24" height="24" rx="4"/>
      <rect x="66" y="112" width="24" height="24" rx="4"/>
    </g>
    <g font-family="ui-monospace, monospace" text-anchor="middle">
      <text x="22" y="129">1</text><text x="50" y="129">0</text><text x="78" y="129">1</text>
      <text x="102" y="129">:</text>
    </g>
    <!-- the scratchpad: running parities -->
    <g stroke="#374151" stroke-width="2" fill="#fef3c7">
      <rect x="114" y="112" width="24" height="24" rx="4"/>
      <rect x="142" y="112" width="24" height="24" rx="4"/>
      <rect x="170" y="112" width="24" height="24" rx="4"/>
    </g>
    <g font-family="ui-monospace, monospace" text-anchor="middle">
      <text x="126" y="129">1</text><text x="154" y="129">1</text><text x="182" y="129">0</text>
      <text x="206" y="129">=</text><text x="226" y="129">0</text>
    </g>
    <!-- step k = 2 reads b_2 and s_1 -->
    <path d="M154,110 Q100,52 50,110" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M154,110 Q140,88 126,110" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="154" y1="86" x2="154" y2="106" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="134" y="66" font-style="italic" fill="#b45309">s₂ = s₁ ⊕ b₂</text>
    <!-- labels -->
    <text x="34" y="154" font-style="italic">b</text><text x="42" y="158" font-size="10" font-style="italic">k</text>
    <text x="146" y="154" font-style="italic">s</text><text x="154" y="158" font-size="10" font-style="italic">k</text>
    <text x="214" y="104" font-style="italic">p</text>
    <text x="12" y="30" font-size="13" fill="#374151">scratchpad: one</text>
    <text x="12" y="46" font-size="13" fill="#374151">XOR per token</text>
  </g>
</svg>
