source_hash: 1e3affbcf0e4
title: समतल के रैखिक प्रतिचित्रण
summary: 'एक $2\times 2$ आव्यूह समतल के हर बिंदु को खिसकाता है, और एक einsum हर एनिमेशन फ़्रेम के लिए पूरे ग्रिड, इकाई वृत्त और इकाई वर्ग को एक साथ खिसकाता है। समतल को तत्समक से $A$ तक रूप बदलते देखें: आइगेनसदिश अपनी ही रेखाओं पर रहते हैं, $|\det A|$ क्षेत्रफल को स्केल करता है, ऋणात्मक सारणिक समतल को पलट देता है, और वृत्त एक दीर्घवृत्त बन जाता है जिसके अर्ध-अक्ष विचित्र मान हैं।'
notes: '$A$ के स्तंभ वे स्थान हैं जहाँ आधार सदिश $\mathbf e_1$ (लाल तीर) और $\mathbf e_2$ (हरा तीर) पहुँचते हैं, और हर दूसरा बिंदु रैखिकता से अनुसरण करता है, इसलिए सीधी ग्रिड रेखाएँ सीधी और समांतर रहती हैं। पथ $M(t) = (1-t)I + tA$ पर $A$ का एक आइगेनसदिश $\mathbf v$, आइगेनमान $1 - t + t\lambda$ के साथ $M(t)$ का भी आइगेनसदिश है, इसलिए नारंगी बिंदु अपनी धराशायी रेखाओं पर सरकते हैं जबकि बाक़ी सब घूमता है। इकाई वर्ग (पीला) क्षेत्रफल $|\det A|$ का समांतर चतुर्भुज बन जाता है; यह लाल हो जाता है जब $\det < 0$, जब $\mathbf e_1 \to \mathbf e_2$ दक्षिणावर्त जाता है और समतल दर्पण प्रतिबिंब होता है। परावर्तन को रास्ते में $\det = 0$ से गुज़रना पड़ता है, जहाँ समतल एक रेखा पर दब जाता है। घूर्णन और परावर्तन लंबाइयाँ बनाए रखते हैं, इसलिए $\sigma_1 = \sigma_2 = 1$; अपरूपण (shear) क्षेत्रफल ($\det = 1$) बनाए रखता है पर आकार नहीं। सामान्यतः वृत्त अर्ध-अक्ष $\sigma_1 \ge \sigma_2$, यानी विचित्र मानों, वाले दीर्घवृत्त में जाता है, और $|\det A| = \sigma_1\sigma_2$। गुणनफल गुणा होते हैं: $\det(AB) = \det A\,\det
  B$।'
meanings:
- 'दिखाने के लिए आव्यूह: खिंचाव, अपरूपण, घूर्णन, परावर्तन और एक पलटाव, या आपका अपना'
- 'समतल के बिंदु: ग्रिड रेखाएँ, इकाई वृत्त, इकाई वर्ग'
- तत्समक $\delta_{ij}$ से $A$ तक सीधा पथ, प्रति फ़्रेम एक आव्यूह
- 'दोहराया गया $j$ ⇒ योग: हर बिंदु हर फ़्रेम के आव्यूह से एक साथ खिसकाया गया'
- '$\varepsilon_{12} = 1$, $\varepsilon_{21} = -1$: 2-D लेवी-चिविटा प्रतीक'
- 'दोहराए गए $i, j$ ⇒ योग: इकाई वर्ग के प्रतिबिंब का चिह्नित क्षेत्रफल'
- वृत्त का प्रतिबिंब अर्ध-अक्ष $\sigma_1 \mathbf u_1$ और $\sigma_2 \mathbf u_2$ वाला दीर्घवृत्त है
- आइगेनमान और आइगेनसदिश; घूर्णन के लिए सम्मिश्र, इसलिए कोई रेखा स्थिर नहीं रहती
