title: 以数千个零点看黎曼猜想
summary: 用张量形式的 Riemann–Siegel 公式在临界线上定位 $\zeta$ 的数千个非平凡零点，将其数目与 Riemann–von Mangoldt 定律 $N(T) = \theta(T)/\pi + 1 + S(T)$ 及 Gram 定律比较，把它们的间距和对关联与随机 Hermite（GUE）矩阵比较，并由它们重建素数幂阶梯函数 $\psi(x)$。猜想本身，即每个非平凡零点的实部都是 $\frac12$，至今仍未解决。
notes: 本页补充问题“黎曼 zeta 函数与素数”（maths/zeta_primes）：那里用 Euler–Maclaurin 从头构造 $\zeta$、找出最初的零点并重建 $\pi(x)$；基础知识请先读那一页。这里用更快的 Riemann–Siegel 公式及其修正项 $C_0, C_1, C_2$（$\Psi$ 的导数由 Chebyshev 级数求得），在二十五万个高度上计算 $Z(t)$，找出临界线上低于 $T$ 的每一个零点；在 $t \ge 100$ 时，它与高精度计算（mpmath）的差小于 $10^{-5}$。在 $t = 1000$ 以下它找到 649 个变号，在 5000 以下找到 4520 个，恰好等于带状区域中到这些高度为止的零点总数（用 mpmath 独立计算），因此它们全部位于临界线上；计数函数跟随 $\theta(T)/\pi + 1$，带有一个平均为零的小幅波动 $S(t)$。Gram 定律在大多数 Gram 点成立，首次失效于 $g_{126} \approx 282.45$。展开到平均间距 1 之后，零点之间的互斥与大型随机 Hermite 矩阵（GUE）的特征值完全一样：Montgomery（1973）猜想对关联为 $1 - (\sin \pi u / \pi u)^2$，并在假设黎曼猜想的前提下，对 Fourier 支集在 $(-1, 1)$ 内的测试函数证明了它；Odlyzko 在第 $10^{20}$ 个零点附近的计算以惊人的精度证实了这一点；在本页的低高度上，吻合程度已经很接近。显式公式（von Mangoldt 1895，已证明）把零点转化为素数：每对 $\frac12 \pm i\gamma$ 贡献一个波 $x^{1/2}\cos(\gamma\ln x)$，有了数千个零点，$\psi(x)$ 就成为清晰的阶梯。黎曼猜想，即每个非平凡零点的实部都是 $\frac12$，是克雷千禧年大奖难题之一，至今未解决。它已对高度 $3\times10^{12}$ 以下的所有零点验证过（Platt 与 Trudgian 2021）。带状区域中显示的已证明结果：$\operatorname{Re} s = 1$ 上没有零点（Hadamard、de la Vallée Poussin 1896，等价于素数定理），以及无零点区域
  $\sigma > 1 - 1/(5.558691\ln t)$（Mossinghoff 与 Trudgian 2015），并由函数方程镜像对称。仅属声称、尚未确立：据报道，OpenAI 于 2026 年 10 月在其公开的 AI 生成手稿库 openai/math 中发表了一个声称的结果（我们未核查这些手稿）：$\zeta$ 及每个 Dirichlet $L$ 函数在半平面 $\operatorname{Re} s > 7/8$ 内没有零点，另附一个关于 $\operatorname{Re} s > 11/12$ 的配套论证。这些预印本未经同行评审，也未经独立验证；若正确，一条固定宽度的无零点带状区域将是重大进展，但仍距 $\frac12$ 这条线很远。任何计算都无法证明这个猜想：有限的搜索只能找到线上的零点，或者找到反例。
meanings:
- 重复的 $n$ ⇒ 求和：一次性计算 250 000 个高度的主和，掩码为 $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$
- $\Psi$ 是整函数，但其商式在 $p = \frac14, \frac34$ 处为 $0/0$；用 Chebyshev 拟合消除这一问题
- Riemann–Siegel 修正项：Chebyshev 级数可逐项求导，$c'_{k-1} = c'_{k+1} + 2k\,c_k$
- 在步长 0.02 的网格上找 $Z$ 的变号，再对所有区间同时做 32 步二分
- 零点计数减去其光滑部分；保持很小且平均为 0
- 用 Newton 法一次性求出所有 Gram 点；Gram 定律指 $(-1)^n Z(g_n) > 0$
- 展开后的零点 $x = \theta(\gamma)/\pi + 1$ 与其后 $J = 10$ 个近邻之差，用于对关联
- 每个零点在每个 $x$ 处的贡献，对零点累加：每个高度 $T$ 一行
labels:
  t_max: 高度 $T$
  x_max: 显式公式计算到 $x$
