title: 맥스웰의 도깨비, 실라르드 기관, 란다우어 원리
summary: '도깨비가 브라운 입자가 상자의 어느 절반에 있는지 보고 칸막이를 밀어 입자가 그것을 밀게 하여, 하나의 열저장소에서 일을 뽑아낸다. 과감쇠 랑주뱅 기관 묶음이 계산서를 보여 준다: 일은 비트당 최대 $kT\,I \le kT\ln 2$이고($I$은 잡음 있는 측정의 상호 정보), 비트를 지우는 데 최소 $kT\ln 2$가 들며(란다우어), 정보를 셈에 넣으면 Sagawa–Ueda 등식 $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$이 열역학 제2법칙을 되살린다. 거꾸로 재생하면 경로 확률 비의 로그가 생성된 엔트로피다.'
notes: '단위: $kT = 1$, 이동도 $1$(따라서 $D = 1$), 상자 반폭 $a = 1$, 시간 단위 $a^2/D$. 맥스웰(1867)은 분자를 골라내어 제2법칙을 이기는 존재를 상상했다. 실라르드(1929)는 이를 입자 하나와 비트 하나로 줄였고, 그 가치는 최대 $kT\ln 2$의 일이다. 란다우어(1961)와 베넷(1982)이 역설을 풀었다: 도깨비는 결국 기억을 지워야 하고, 이는 비트당 최소 $kT\ln 2$가 들므로 순환 전체는 제2법칙을 따른다. Sagawa와 Ueda(2010)는 오차가 있는 되먹임에 대해 이를 정량화했다: $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$, 따라서 $\langle W_{ext}\rangle \le kT\langle I\rangle - \langle\Delta F\rangle$. 이는 이런 확률 동역학에 대해 증명된 정리이며, 시뮬레이션은 수치적으로 확인한다. 모형: 벽은 단단한 용수철 $\kappa u^2/2$($\kappa = 500\,kT/a^2$)이므로, 자유 에너지는 $Z$로부터 수치적으로 계산하고 단단한 벽의 값으로 두지 않는다. 칸막이는 뚫을 수 없으므로 각 입자는 자기 쪽 $s$를 유지한다. 랑주뱅 단계는 메트로폴리스 보정(MALA)을 하므로 볼츠만 분포, Jarzynski, Sagawa–Ueda, Crooks가 표본 잡음 안에서 정확히 성립한다. 지우기는 칸막이가 있는 상자에서 시작해 피스톤이 가운데에서 끝나므로, 무른 벽에서도 $\Delta F = kT\ln 2$이 정확하다. 장부는 칸막이를 움직이는 일을 센다. 마지막에 칸막이를 빼면 작은 용수철 에너지가 돌아온다. 실제 데이터(인용 값만, 그림은 재현하지 않음): Bérut 외, Nature 483, 187(2012)과 자세한 판 J. Stat. Mech. P06015(2015)는 광학 이중 우물 속 $2\,\mu$m 실리카 구슬에 저장된 비트를 지웠다. 평균 열은 순환 시간 $\tau$에 따라 $\langle
  Q\rangle = kT\ln 2 + B/\tau$($B = 8.15\,kT\cdot$s)처럼 줄었고, 두 매개변수 맞춤은 점근값 $A = 0.72\,kT$($\pm 0.15\,kT$)을 주어 $kT\ln 2 \approx 0.693\,kT$에 가까웠다. 시뮬레이션한 지우기도 자기 단위로 같은 $1/\tau$ 법칙을 보인다. 시간 반전: 영상의 마지막 부분은 지우기를 거꾸로 재생한다. 각 궤적에 대해, 순방향 확률과 반전 프로토콜 아래 반전 경로 확률의 비의 로그는 $\beta(W - \Delta F)$, 즉 생성된 엔트로피와 같다(Crooks 1999). 그 평균은 양수이고 $\langle e^{-\sigma}\rangle = 1$. 해 볼 것: 더 큰 오류율 $\varepsilon$(정보가 줄고 일도 준다; $\varepsilon = 0.5$이면 아무것도 없다), 또는 더 짧은 $\tau$(소산이 커진다).'
meanings:
- $0$과 $2a$의 무른 상자 벽과 $p$의 칸막이, 입자가 있는 쪽 $s=\pm1$에서 느낀다
- 모든 기관은 칸막이가 가운데 있는 평형 $e^{-V/kT}/Z$에서 시작한다
- 도깨비의 판독, 확률 $\varepsilon$로 틀린다
- '되먹임: 칸막이가 도깨비가 믿는 쪽으로 $2a(1-\varepsilon)$까지 미끄러진다'
- 모든 기관에 대한 오일러–마루야마 제안을 메트로폴리스–헤이스팅스로 받아들여 $e^{-V/kT}$이 정확히 정상 상태가 되게 한다
- $x$을 고정하고 벽이 움직일 때 입자에 해 준 일
- 도깨비가 맞으면 $\ln 2(1-\varepsilon)$, 틀리면 $\ln 2\varepsilon$; 평균은 $I$
- '격자 위 사다리꼴 공식으로 여러 칸막이 위치에 대해: $\Delta F = -kT\ln Z_1/Z_0$'
- 각 단계의 전이 확률과 경계 항으로 얻은 $\ln P_F[x]/P_R[\tilde x]$
labels:
  eps: 도깨비의 측정 오류율 $\varepsilon$
  tau: 되먹임 시간 $\tau$(칸막이 이동, $a^2/D$)
  tau_erase: 가장 느린 지우기 시간($a^2/D$)
  n_engines: 오류율당 기관 수
  seed: 난수 시드
