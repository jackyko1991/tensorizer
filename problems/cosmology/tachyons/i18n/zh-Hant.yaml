source_hash: e3fd71733e91
title: 快子與反電話
summary: 如果一個粒子的質量是虛數，$m^2 < 0$，會怎樣？使用複數張量，$E^2 = p^2 + m^2$ 仍給出實數能量，但這個粒子永遠比光快，而且失去能量時反而加速。對超光速世界線做批次勞侖茲變換，可以找到訊號在發出之前就已抵達的參考系，並閉合托爾曼的反電話迴路。在場論中，$m^2 < 0$ 則代表一個不穩定、會發生凝聚的真空，正如希格斯場那樣。屬推測性內容：從未觀測到任何快子，而 2011 年 OPERA 的「超光速微中子」其實是一條鬆脫的電纜。
notes: 推測性物理：快子是假想粒子。標準模型中沒有任何快子型粒子，也從未有實驗偵測到快子。狹義相對論禁止把有質量的物體加速穿越 $c$，但它本身並不禁止永遠比光快的粒子（Bilaniuk、Deshpande 與 Sudarshan 1962；Feinberg 1967，「快子」一名即由他提出）。代價是因果律。由速度 $u > c$ 的訊號連接的兩個事件是類空間隔的，因此它們的時間先後取決於觀察者：在任何運動速度超過 $c^2/u$ 的參考系中，訊號在發出前就已抵達，並攜帶負能量。Feinberg 的重新詮釋把它解讀為一個沿反方向傳播的正能量反快子，這保住了能量的正定性，卻使「誰發出了訊號」依賴於參考系。利用兩個參考系就得到托爾曼的反電話（1917）：Alice 向以 $\beta$ 遠離的 Bob 發送訊號，Bob 在他自己的參考系中以相同速度回覆。一旦 $\beta > 2u/(1+u^2)$，回覆就會在 Alice 發出訊息之前到達她手中，從而閉合一個因果迴路。在量子場論中，負的 $m^2$ 不是快速粒子，而是一種不穩定性。場從 $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ 的山頂 $\phi = 0$ 滾落到 $\phi = \pm\sqrt{-m^2/\lambda}$（「快子凝聚」，能量降低 $m^4/4\lambda$），那裡存在質量$^2 = 2|m^2|$ 的普通粒子。這正是希格斯場所做的事，面板在帶有類哈伯摩擦的晶格上展示了這一過程。真實數據：2011 年 OPERA 報告 μ 微中子在 730 km 的路程上提早 $60.7 \pm 6.9 \pm 7.4$ ns 抵達，$(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$（arXiv:1109.4897v1）。後來發現原因是一條連接不良的光纖電纜加上時鐘漂移。修正後的結果為 $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$（v4，JHEP 10 (2012) 093），而 ICARUS 測得 $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns（Phys. Lett. B 713 (2012) 17）：兩者都與 $c$ 一致。若把 2011
  年的數值解讀為快子，將需要 $|m| \approx 120$ MeV，那麼超新星 SN1987A 的 10 MeV 微中子就會以約 12 倍的差距跑贏光，而不是在 168 000 年後與光相差僅數小時內抵達（$|v-c|/c \lesssim 2\times10^{-9}$，Longo 1987）。單位：$c = 1$；訊號扇形圖中快子質量 $\mu = 1$。
meanings:
- 複數平方根：當 $p > \mu$ 時為實數，儘管 $m$ 與 $\gamma$ 都是虛數
- 每個觀察者參考系一個勞侖茲變換（$c = 1$）
- 重複的 $b$ ⇒ 求和：同時從每個參考系觀察每個訊號
- 不變量 $m^2 = -\mu^2$，在每個參考系中都相同
- 快度相減：低於 $c$ 時用 $\tanh$，高於時用 $\coth$
- 回覆抵達 Alice 的時刻；$< t_{\mathrm{send}}$ 即閉合因果迴路
- 晶格場從偽真空 $\phi = 0$ 滾落（torch.roll 拉普拉斯算子，速度 Verlet 法）
labels:
  u: 快子訊號速度 $u$
  beta_max: 最快觀察者參考系 $\beta_\mathrm{max}$
  m2: 場的快子質量$^2$ $m^2$
  lam: 自耦合 $\lambda$
  friction: 哈伯摩擦 $\gamma$
