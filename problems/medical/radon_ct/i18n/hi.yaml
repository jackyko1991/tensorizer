title: रेडॉन रूपांतरण और CT पुनर्निर्माण
summary: 'CT स्कैनर हर कोण से क्षीणन मानचित्र के रेखा-समाकल $p(\theta, s)$ दर्ज करता है। शेप–लोगन सिर फ़ैंटम को एक टेंसर को घुमाकर और जोड़कर प्रक्षेपित किया जाता है, और फ़िल्टर्ड बैक-प्रोजेक्शन से फिर बनाया जाता है: फ़ूरिये समष्टि में रैम्प फ़िल्टर $|\nu|$, फिर कोणों पर एक einsum।'
notes: 'हर प्रक्षेप हर कोण के लिए कुल द्रव्यमान $\int p\,ds = \iint f\,dA$ को संरक्षित करता है। कच्चे प्रक्षेपों को वापस फैलाने (साधारण बैक-प्रोजेक्शन) से एक बिंदु $1/r$ प्रभामंडल बन जाता है, इसलिए छवि $f$ का धुंधला रूप होती है; रैम्प फ़िल्टर $|\nu|$ इस धुंधलेपन को ठीक-ठीक पूर्ववत करता है (केंद्रीय-स्लाइस प्रमेय)। बहुत कम कोण धारियाँ देते हैं; कोणों की संख्या बढ़ने पर त्रुटि घटती है जब तक पिक्सेल ग्रिड उसे सीमित न कर दे। शेप–लोगन विंडो उच्च आवृत्ति पर रैम्प को नरम करती है, थोड़ी तीक्ष्णता के बदले कम शोर देती है — इसे शोर चालू करके आज़माइए। सरलीकरण: समांतर-पुंज ज्यामिति, एकवर्णी किरणें, द्विरैखिक अंतर्वेशन, फ़ोटॉन सांख्यिकी के बजाय गाउसी संसूचक शोर। शैक्षिक मॉडल, नैदानिक उपयोग के लिए नहीं।'
meanings:
- 'क्षीणन मानचित्र (संशोधित शेप–लोगन: 10 दीर्घवृत्तों का योग)'
- दूरी $s$, स्थिति $t$, कोण $\theta$ पर किरण के अनुदिश प्रतिचयित छवि
- 'दोहराया गया $t$ ⇒ योग: साइनोग्राम'
- शून्य-पैडेड संसूचक पर रैम्प $|\nu|$ (Ram-Lak), वैकल्पिक रूप से $\mathrm{sinc}(\nu\,\Delta s)$ से गुणित (शेप–लोगन)
- फ़िल्टर किए गए प्रक्षेप
- 'हर प्रक्षेप अपनी किरणों के अनुदिश वापस फैलाया गया: $q_\theta(x\cos\theta + y\sin\theta)$'
- 'दोहराया गया $\theta$ ⇒ योग: बैक-प्रोजेक्शन'
labels:
  n_pixels: छवि आकार $N$
  n_angles: प्रक्षेप कोण
  filter: रैम्प फ़िल्टर विंडो
  noise: संसूचक शोर (अधिकतम का अंश)
