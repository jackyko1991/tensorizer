source_hash: b6ae9044b340
title: 哈勃膨胀
summary: 星系位于固定的共动网格上，网格按尺度因子 $a(t)$ 拉伸。一次外积 $x_{gi} = a\,q_{gi}$ 移动所有星系；从任选的一个星系看，其他星系都以 $v = H d$ 退行。穿越网格的光子被拉伸同样的倍数：$1 + z = a_\mathrm{obs}/a_\mathrm{emit}$。
notes: 单位：Mpc、Gyr 和 km/s/Mpc。在物质主导（爱因斯坦–德西特）模型中 $a = (t/t_0)^{2/3}$，因此 $H = 2/(3t)$ 随时间减小；在德西特模型中 $a = e^{H_0 (t - t_0)}$，$H$ 保持不变。无论哪种情况，$v = Hd$ 对每个观测者都严格成立：移动观测者，蓝点仍落在与从中心看到的空心圆相同的直线上。星系本身并不在空间中运动（没有本动速度）：是它们之间的空间在增长。光子每步走过共动距离 $c\,dt/a$；遥远星系的速度超过 $c$ 是允许的，因为在局域没有任何东西超过光。
meanings:
- 星系 $g$ 的共动坐标（始终不变）
- 各时刻的尺度因子，今天 $a = 1$
- 物理位置：外积，没有指标求和
- $\dot a/a$：物质主导为 $2/(3t)$，德西特为常数
- 每个星系的哈勃流速度
- 从观测者 $o$ 看到的位置（广播相减）
- 重复的 $g, i$ ⇒ 求和：$v$ 对 $d$ 的最小二乘斜率
- 光子波长自发射以来的拉伸
labels:
  model: 膨胀规律 $a(t)$
  H0: 今天的哈勃常数 $H_0$
  n_grid: 每边星系数
  spacing: 共动网格间距
  observer_x: 观测者所在列（网格步数）
  observer_y: 观测者所在行（网格步数）
  a_start: 起始尺度因子 $a_\mathrm{emit}$
  a_end: 终止尺度因子 $a_\mathrm{obs}$
