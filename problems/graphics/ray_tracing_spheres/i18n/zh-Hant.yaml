source_hash: f1078e5d3894
title: 球體的光線追蹤
summary: 一個小巧的 Whitted 式光線追蹤器，每個像素的光線是 $(H\cdot W, 3)$ 張量的一列。以二次公式同時測試所有光線與所有球體，得到一張（光線 $\times$ 球體）表，其 argmin 就是可見表面。包含 Lambert 與 Blinn–Phong 著色、由第二批陰影光線產生的硬陰影、鏡面反彈與棋盤格地板，同時光源或相機環繞場景。
notes: 像素的顏色為 $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$，其中 $m$ 是表面的鏡面比例；反射顏色來自再次追蹤這批反射光線，這就是 Whitted（1980）的遞迴構想。著色模型為 Phong（1975）的模型，搭配 Blinn（1977）的半向量 $\hat{\mathbf h}$。由於 $\hat{\mathbf d}$ 為單位長度，二次式的首項係數為 1，所以只需要 $b$ 與 $q$。次級光線從離表面極小距離 $\varepsilon$ 處出發，否則捨入誤差會使它們打中自己的球（陰影痤瘡）。試試零次反彈以觀看沒有反射的場景、用高光澤度得到小而銳利的高光，或用寬廣的視野。真實的渲染器會加入軟陰影、折射以及每像素多次取樣（路徑追蹤），但批次的「光線對一切」表格保持不變。
meanings:
- 通過像素 $p$ 的光線的起點與單位方向；$d$ 是相機基底中的螢幕點 $(x, y, 1)$，即對基底指標的 einsum
- 球體 $s$ 的球心與半徑
- 重複的 $i$ ⇒ 求和：一次呼叫讓每條光線對每個球體
- 二次式較近的根；在 $b^2 < q$（光線未命中）或交點在後方時為 $\infty$
- 可見表面；地平面 $y = 0$ 是額外的一行，$t = -o_y/d_y$
- 漫反射與鏡面反射因子，在背面截為 0
- 朝向光源的陰影光線：若到達光源前未命中任何球體則為 1，否則為 0
- 重複的 $j$ ⇒ 求和：鏡面反射方向，即下一批光線
