source_hash: 0b86e0abca1f
title: 러더퍼드 산란
summary: 알파 입자 빔을 금 원자핵에 쏩니다. 모든 알파 입자를 배치 텐서 하나에 담아 척력 쿨롱 장 속에서 RK4로 적분하면, 산란각 히스토그램이 러더퍼드의 $1/\sin^4(\theta/2)$ 법칙을 재현합니다. 원자의 양전하가 아주 작은 원자핵에 모여 있다는 증거입니다.
notes: '단위: fm, MeV, 시간은 fm/$c$. 각 경로를 따라 에너지와 각운동량이 보존되므로 $E$와 충돌 매개변수 $b$만으로 편향각 $\theta = 2\arctan(k/2Eb)$가 정해집니다. 정면으로 오는 알파 입자는 $d = k/E$에서 되돌아갑니다(금에 5 MeV일 때 약 45 fm로, 7 fm인 원자핵보다 훨씬 바깥이므로 순수한 쿨롱 법칙이 성립). 빔은 반지름 $b_{\max}$인 원판 위에 균일하게 퍼져 있으므로(무작위이지만 고정 시드), 입체각 속으로 산란되는 수는 (단위 면적당 알파 입자 수) × $d\sigma/d\Omega$입니다. 수백 개 중 하나만 90° 넘어 튕겨 나옵니다. 1909년 가이거와 마스덴을 놀라게 한 결과입니다. 단순화: 원자핵은 고정된 점전하(되튐 없음, 핵력 없음)이고 운동은 비상대론적입니다($v \approx 0.05c$). 각 알파 입자는 30 $d$ 떨어진 곳에서 무한히 먼 곳에서 온 알파 입자와 정확히 같은 에너지와 각운동량으로 출발합니다. 남은 $1/r^2$ 꼬리 힘이 각도를 바꾸는 정도는 1°에 한참 못 미칩니다.'
meanings:
- $Z_\alpha Z e^2/4\pi\varepsilon_0 = 2Z \cdot 1.44$ MeV fm
- 알파 입자 $b$의 위치(fm)와 속도($c$ 단위)
- '반복된 $j$ ⇒ 합: 거리의 제곱 $r_b^2$'
- 빔 전체에 대한 쿨롱 척력을 한 번에
- '2차원 외적: 단위 질량당 각운동량'
- 나가는 속도가 빔 축과 이루는 각
- 러더퍼드 예측, 히스토그램과 비교
labels:
  energy: 알파 입자 에너지 $E$
  z_target: 표적 전하 $Z$
  b_max: 빔 반지름 $b_{\max}$
  n_beam: 빔의 알파 입자 수
  n_steps: RK4 단계 수
