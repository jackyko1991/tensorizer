<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Hawking radiation: a black hole of mass M with horizon radius r_s glows like a black body at temperature T_H, radiating power P and losing mass">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- black hole -->
    <circle cx="100" cy="82" r="34" fill="#111827"/>
    <circle cx="100" cy="82" r="40" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="92" y="88" font-style="italic" fill="#ffffff">M</text>
    <!-- horizon radius -->
    <line x1="100" y1="82" x2="76" y2="58" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="40" y="40" font-style="italic">r<tspan font-size="10" dy="3">s</tspan></text>
    <line x1="52" y1="44" x2="74" y2="56" stroke="#374151" stroke-width="1"/>
    <!-- outgoing thermal radiation (wavy rays) -->
    <g fill="none" stroke="#dc2626" stroke-width="2">
      <path d="M144,82 q5,-6 10,0 t10,0 t10,0 t10,0" marker-end="url(#arrow)"/>
      <path d="M131,52 q7,-3 9,-10 t9,-10 t9,-10" marker-end="url(#arrow)"/>
      <path d="M131,112 q3,7 10,8 t9,9 t9,9" marker-end="url(#arrow)"/>
      <path d="M100,40 q-6,-4 0,-10 t0,-10" marker-end="url(#arrow)"/>
      <path d="M100,124 q6,4 0,10 t0,10" marker-end="url(#arrow)"/>
    </g>
    <text x="196" y="80" font-style="italic" fill="#b91c1c">P</text>
    <text x="168" y="38" font-style="italic" fill="#b45309">T<tspan font-size="10" dy="3">H</tspan></text>
  </g>
</svg>
