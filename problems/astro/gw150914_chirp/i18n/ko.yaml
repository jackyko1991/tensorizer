source_hash: 03516f527daf
title: 'GW150914: 최초의 중력파 처프'
summary: 2015년 9월 14일 핸퍼드와 리빙스턴에서 기록된 실제 LIGO 변형률 데이터 16초. 웰치(Welch) PSD, 백색화(whitening), 대역 통과 필터를 거치면 100배 더 큰 잡음 속에 묻힌 처프가 드러납니다. Q-변환 지도는 그 주파수가 약 150 Hz까지 올라가는 모습을 보여 주고, 한 번의 배치로 필터링한 후뉴턴(post-Newtonian) 인스파이럴 템플릿 뱅크는 처프 질량 약 $30\,M_\odot$에서 정점을 이룹니다. 능선은 autograd로 $\dot f \propto M_c^{5/3} f^{11/3}$에 맞추어 피팅하며, 리빙스턴 신호가 핸퍼드보다 약 7 ms 앞섭니다.
notes: '2015년 9월 14일 09:50:45 UTC, 두 Advanced LIGO 검출기가 약 410 Mpc 떨어진 두 블랙홀의 병합을 기록했습니다(Abbott et al., PRL 116, 061102, 2016). 이는 중력파의 최초 직접 검출입니다. 이 페이지는 공개 데이터로 그 분석의 간소화된 버전을 재현합니다. 30 Hz 이하에서는 원시 변형률이 지진 잡음과 열잡음에 지배되므로, PSD $S_n(f)$를 웰치 방법(4 s 길이의 Hann 창 구간, 50 % 겹침)으로 추정하고 데이터를 $\sqrt{S_n}$로 나눕니다(백색화). 페이지는 백색화된 PSD가 평탄한지, 파르세발 정리가 성립하는지, 모든 템플릿이 $\langle h|h\rangle = 1$을 만족하는지 확인합니다. 템플릿 뱅크는 동일 질량에 대한 2PN 위상의 정상 위상(stationary-phase) 인스파이럴을 사용하며, 수치 상대론에서 동일 질량 병합이 정점에 이르는 주파수인 $f_\mathrm{peak} = 0.36/(2\pi M)$에서 잘라 냅니다(ISCO 주파수에서 자르면 SNR 대부분을 잃습니다). 모든 템플릿과 두 검출기를 한 배치의 FFT로 필터링합니다. 기본값에서 최적 템플릿은 $\mathcal M_c \approx 32\,M_\odot$, SNR은 약 16(H1)과 10(L1)이며, 두 SNR 정점과 H1–(−L1) 상호상관은 핸퍼드가 리빙스턴보다 7–8 ms 늦다는 결과를 줍니다(발표값: 6.9 +0.5/−0.4 ms; L1 팔의 방향 때문에 부호가 뒤집힙니다). Q-지도 능선에 대한 뉴턴 피팅은 더 무거운 $\mathcal M_c \approx 37\,M_\odot$을 주며, 0PN 뱅크도 마찬가지입니다. 후뉴턴 항은 주어진 처프 질량에서 처프를 느리게 만들기 때문에, 뉴턴 모델은 이를 더 무거운 것으로 읽습니다. 정직성 / 주의: 이것은 교육용 분석이며 발표된 분석이 아닙니다. 발표값은 스핀을 포함한 완전한 인스파이럴–병합–링다운 파형, 훨씬 긴 데이터에서 얻은
  PSD, 베이즈 모수 추정으로 얻은 것입니다. 검출기 좌표계에서 $\mathcal M_c \approx 30\,M_\odot$, 네트워크 SNR 24(Abbott et al. 2016)이며, GWTC-1에서는 원천 좌표계 $\mathcal M_c = 28.6^{+1.7}_{-1.5}\,M_\odot$, 질량 $35.6$과 $30.6\,M_\odot$, 거리 440 Mpc입니다. 우리의 SNR이 더 낮은 이유는 템플릿에 병합–링다운과 스핀이 없고, PSD가 신호를 포함한 16 s 데이터만으로 추정되기 때문입니다. 데이터: GWOSC(Gravitational Wave Open Science Center), GW150914 릴리스 GWTC-1-confident v3, 파일 H-H1_GWOSC_4KHZ_R1-1126259447-32 및 이에 해당하는 L1 파일, 출처 gwosc.org/eventapi/json/GWTC-1-confident/GW150914/v3/, CC BY 4.0. GPS 1126259455부터 16 s, 900 Hz 저역 통과 후 2048 Hz로 다운샘플링하여 변형률 × 10⁻²¹ 단위로 data/gw150914_strain.csv에 저장했습니다. GWOSC(Abbott et al., SoftwareX 13, 100658, 2021)와 Abbott et al. 2016을 인용해 주십시오. 수상: 2016년 쇼 상 천문학 부문(드레버, 손, 와이스 — LIGO를 구상하고 설계한 공로), 2016년 기초물리학 특별 브레이크스루상(드레버, 손, 와이스와 LIGO 기여자들), 2017년 노벨 물리학상(와이스, 배리시, 손).'
meanings:
- 검출기 $d \in \{H1, L1\}$의 표본 $n$에서의 변형률, 2048 Hz로 16 s
- '단측 PSD: Hann 창을 씌운 구간 $s$, FFT, $s$에 대해 평균한 $|X|^2$'
- '백색화된 변형률: PSD가 정확한 곳에서는 분산 1의 백색 잡음'
- 폭 $f_q/q$인 가우스 대역 통과 필터의 에너지, 한 배치의 역 FFT
- 처프 질량 $\mathcal M_m$, $\eta = 1/4$에 대한 2PN까지의 정상 위상 인스파이럴 위상
- 병합 정점 주파수에서 잘라 내고 $\langle h|h\rangle = 1$이 되도록 정규화한 뱅크 전체를 한꺼번에
- $4\,\mathrm{Re}\sum_k a_k b_k^*/S_k\,\Delta f$, $k$에 대해 합산
- '역 FFT로 $k$에 대해 합산: 모든 검출기, 템플릿, 시각에 대한 복소 SNR'
- 뉴턴 궤적 $\frac1\pi(5/256\tau)^{3/8}\mathcal M_c^{-5/8}$, Adam으로 능선에 피팅
labels:
  pn_order: 템플릿 위상의 후뉴턴 차수
  cutoff: 템플릿 상한 주파수
  f_low: 템플릿 최저 주파수 $f_\mathrm{low}$
  n_templates: 뱅크의 템플릿 수
  mc_min: 최소 처프 질량 $\mathcal M_c$
  mc_max: 최대 처프 질량 $\mathcal M_c$
  q: 시간-주파수 지도의 Q
  welch_segment: 웰치 구간 길이
