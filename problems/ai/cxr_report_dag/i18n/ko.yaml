source_hash: 433f576ee66b
title: 'DAG 텐서로 흉부 X선에서 판독문까지: CNN과 작은 LM의 결합'
summary: 임상 판독문 생성이 아니라 교육용 장난감입니다. 작은 CNN은 NIH 흉부 X선 410장에서 여섯 가지 소견을 학습하고, 작은 문자 단위 GPT는 써 놓은 라벨 헤더로부터 템플릿 판독문("enlarged heart. pleural effusion. no pneumothorax.")을 학습하며, 둘은 각자 따로 학습됩니다. 하나의 DAG 간선이 둘을 잇습니다. 커넥터가 CNN의 소견 확률을 소프트 헤더로 바꾸어, LM이 이미지만으로 판독문을 쓰게 합니다. 학습 과정 자체도 텐서 DAG이며(레벨별 규칙, max-plus 임계 경로, 규칙마다 시드 전체에 대한 배치 호출 한 번), 같은 계산량으로 종단 간 학습한 같은 네트워크와 비교한 뒤, 공개 라이선스(CC BY) PubMed Central 논문의 실제 텍스트 251개(그림 캡션 + 그 방사선 사진을 인용하는 문장들)로 미세 조정합니다. 이렇게 적은 쌍으로는 예상대로 2단계 결과가 약하며, 이 페이지는 그 사실을 그대로 밝힙니다.
notes: '이것은 무엇인가. 임상 판독문 생성이 아니라 교육용 장난감입니다. 작은 모델, 64×64 이미지, 수백 개의 잡음 섞인 라벨이 전부이고 실제 영상의학 판독문은 없습니다. 여기 있는 어떤 것도 임상적 정확도에 대해 말해 주지 않습니다. 아이디어(네트워크를 따로 학습하고, DAG 텐서로 연결하고, 전역적으로 최적화하며, 전체 과정 자체를 DAG 텐서가 제어함)는 Jacky Ka Long Ko의 것입니다. 이 문제는 이 시리즈의 이전 문제에서 다룬 CNN + 작은 LM 결합을 흉부 방사선 사진과 (아주 짧은) 판독문처럼 읽히는 텍스트로 옮겨 옵니다. 왜 실제 판독문이 없는가. 공개된 판독문 모음 중 어느 것도 여기서 쓰는 라이선스 규칙(공개, 재배포 가능, 상업적 이용 허용)을 통과하지 못합니다. IU X-ray / OpenI (Demner-Fushman et al. 2016)는 CC BY-NC-ND이고, MIMIC-CXR (Johnson et al. 2019), VinDr-CXR, BRAX는 데이터 이용 계약에 따른 자격 인증 접근이 필요하며, CheXpert와 PadChest는 연구용으로만 쓸 수 있습니다. 그래서 1단계는 NIH 라벨 집합으로부터 코드로 생성한 템플릿 판독문을 사용하는데, 이는 문제를 텍스트로 표현된 다중 라벨 분류로 바꿉니다. 2단계는 CC BY PubMed Central 논문의 그림 캡션과 그 그림을 인용하는 문장들을 사용합니다. 증례 보고용으로 쓰인 짧고 이질적인 텍스트로, 화살표나 패널을 가리키는 경우가 많습니다. 무엇이 새롭고 무엇이 그렇지 않은가. 흉부 X선 판독문 생성은 활발한 분야이며(Jing et al. 2018, Chen et al. 2020의 R2Gen), 사전 학습된 이미지 인코더를 작은 학습형 커넥터로 언어 모델에 잇는 방식은 LLaVA (Liu et al. 2023)와 BLIP-2 (Li et al. 2023)가 만들어진 방식입니다. 이 문제가 더하는 것은 오케스트레이션입니다. 모델 그래프와 학습 과정 모두를
  Circle of Willis 워크플로 문제의 텐서 DAG 엔진이 실행하고(data/training.smk에서 파싱한 규칙 그래프, 크로네커 작업 그래프, 불리언 레벨, max-plus 임계 경로), 모든 규칙은 시드 전체에 대한 배치 호출 한 번이며, DAG로 만든 모델을 같은 계산량의 단일 모델(모놀리스)과 비교합니다. 데이터. NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center; 출처 표기 조건으로 이용 제한 없음): 정면 PA 영상 549장, 환자당 한 장, 여섯 가지 소견(심비대, 흉수, 침윤, 무기폐, 기흉, 종괴 또는 결절) 또는 소견 없음, 영상당 최대 두 개; 학습 410장, 테스트 139장. 라벨은 NLP로 판독문에서 추출한 것이라 잡음이 있습니다(약 10 % 이상이 틀림). PMC: 오픈 액세스 논문 316편에서 가져온 흉부 방사선 그림 316개, 모두 CC BY입니다(논문 자체 XML의 라이선스로 확인; 규칙: CC BY, CC BY-SA 또는 CC0, NC, ND, 기타 또는 누락은 거부). 후보는 ROCOv2 메타데이터(Rückert et al. 2024)에서 왔으며, PMCID 색인으로만 사용했고 ROCOv2의 어떤 것도 번들에 포함되지 않습니다. 확인한 논문 2114편 중 1575편이 채택되었고 539편이 라이선스로 거부되었습니다(모두 CC BY-NC). 2단계 텍스트는 캡션 뒤에 같은 논문에서 그 그림을 인용하는 문장들을 붙인 것으로(316편 중 315편에 적어도 하나 있음), 완전한 문장만, 작은 LM의 컨텍스트인 최대 360자까지입니다. 중앙값 35단어(IQR 26–45)로, 캡션만일 때의 12(8–18)와 대비됩니다. 모든 그림과 텍스트의 출처는 data/ATTRIBUTION.csv에 표기되어 있고, data/SOURCES.md에 출처, 이용 조건, 개수, 체크섬, 처리 과정이 있습니다. 모델과 학습 DAG. CNN: 그룹 합성곱 세 개, 가중치 41 014개, 시그모이드 출력
  여섯 개(다중 라벨, 양성은 희소도에 따라 가중). LM: 2층 문자 단위 GPT(d = 32, 헤드 네 개, 가중치 40 108개)로 모든 템플릿에 대해 학습하며, 라벨 헤더를 앞에 여섯 글자로 씁니다("ce----", 그다음 "enlarged heart. pleural effusion."). 커넥터(가중치 2848개): 여섯 확률 $q$와 슬롯 벡터 $S_t$로부터 헤더를 대신하는 $K = 6$개의 소프트 토큰을 만듭니다. 레벨: 0 train_cnn ∥ train_lm ∥ train_monolith; 1 train_connector (CNN과 LM 고정); 2 global_finetune ∥ train_router; 3 caption_finetune (PMC 텍스트로 커넥터 + LM, CNN 고정); 4 evaluate. 테스트는 레벨과 임계 경로, 작업 그래프가 멱영인지, 한 스택에 든 두 시드가 각각 따로일 때와 정확히 똑같이 학습되는지(float32 반올림 범위 내), 한 모델의 손실이 다른 모델에 기울기를 보내지 않는지, 커넥터 단계가 커넥터만 바꾸는지, 고정 라우터를 쓴 MoE 층이 DAG 연결과 1e-6까지(기울기까지) 같은지를 확인합니다. 판독문은 탐욕적으로 생성하고(키/값 캐시 사용, 일반 순전파와 대조해 테스트함) 키워드로 다시 라벨로 파싱하며, 부정("no pneumothorax.")도 처리합니다. 1단계 결과(시드 2개, 테스트 영상 139장, 시드 평균; 모든 수치는 results/stages.csv에 있음). CNN 단독: 평균 AUROC 0.62(우연 수준 0.5), 임계값 0.5에서 micro F1 0.31(학습 유병률로 무작위 추측 시: 0.16). 그 라벨을 헤더로 써서 LM 단독에 주면: micro F1 0.32이므로 LM은 충실하게 텍스트로 옮깁니다(출력의 0.90이 올바른 형식의 템플릿이며, 본 적 없는 라벨 집합에서도 그렇습니다). 결합 모델: 커넥터 단계 후 micro F1 0.22, 전역 미세 조정 후 0.20(실행과
  시드에 따라 0.15에서 0.25), 모든 판독문이 올바른 형식의 템플릿이며 0.26에서 0.27은 정답 라벨의 템플릿과 정확히 일치합니다. 모놀리스, 즉 같은 곱셈-덧셈 수(공동 405스텝)로 410개의 영상–판독문 쌍에 종단 간 학습한 같은 네트워크는 모든 영상에 "clear lungs." 또는 "normal chest."라고 씁니다. micro F1 0, 정확 일치 0.27(정상 영상의 비율). 따라서 DAG 파이프라인은 CNN의 라벨 지도 학습과 모든 템플릿 텍스트를 재사용하므로 모놀리스를 분명히 이기지만, CNN 단독은 이기지 못합니다. 템플릿 판독문은 분류기가 아는 것을 다시 표현할 수 있을 뿐이고, 우도로 학습된 결합 모델은 가장 그럴듯한 판독문을 쓰는데, 영상이 모호하면 "정상" 쪽으로 기웁니다. 반면 CNN의 희소도 가중 임계값은 재현율을 선호하고, $F_1$은 이를 보상합니다. 미세 조정은 거의 아무것도 바꾸지 않습니다. DAG 간선 = MoE 디스패치. 입력층을 전문가 혼합(이미지 전문가 = CNN + 커넥터, 텍스트 전문가 = 토큰 임베딩)으로 보고 $G$를 데이터 유형별 원-핫으로 두면 DAG 연결 출력과 정확히 같아집니다(테스트됨). 전문가를 고정한 채 밀집 혼합으로 학습한 뒤 top-1으로(라우팅 후 선택된 전문가 실행) 사용하는 선형 라우터는 모든 위치를 해당 모달리티의 전문가로 보내므로(두 시드 모두 라우팅 정확도 1.00), 판독문과 점수가 고정 라우터와 같습니다. 2단계 결과(보류된 PMC 그림 65개): 예상대로 약합니다. 텍스트 251개로 150스텝 학습한 후 모델은 "chest x-ray showing"을 쓰고 그 뒤로는 글자 뒤범벅을 씁니다. BLEU-1 0.05, ROUGE-L 0.06, 소견 키워드 재현율 0, 보류 데이터 교차 엔트로피는 글자당 2.32 nats. 다른 그림의 영상을 주어도 아무것도 바뀌지 않습니다(2.32 nats, 같은 점수). 영상이 쓰이지 않는 것입니다. 고정된 학습 텍스트 하나를 돌려주는
  블라인드 기준선이 더 높은 점수를 받습니다(BLEU-1 0.17, ROUGE-L 0.22). 가중치 40 000개의 문자 단위 LM은 CPU 1분 동안 약 70 000자로 이 언어를 배울 수 없습니다. 이전 버전의 첫 절만 쓴 캡션(중앙값 6단어)으로는 ROUGE-L이 약 0.28이었지만, 그 텍스트들은 거의 문장이라 할 수 없었습니다. DAG 기계 장치는 작동하지만, 2단계에는 데이터가 턱없이 적습니다. 시간. 6코어 데스크톱 CPU에서 기계가 한가할 때 학습은 약 85 s 걸리고, 여기에 GIF에 약 30 s가 더해집니다. 다른 무거운 작업이 기계를 함께 쓰면 측정 시간이 두세 배로 늘어나며(GIF와 timings.csv에 나온 실행은 그런 부하 상태에서 이루어졌으므로 초 수가 더 큼), 캡션 단계가 가장 큰 영향을 받습니다. 규칙당 워커 하나일 때 max-plus 임계 경로는 CNN → 커넥터 → 미세 조정 → 캡션 → evaluate입니다. 코드는 torch가 GPU를 인식하면 GPU를 고릅니다(pixi run -e cuda). 기본 환경에는 CPU용 torch 빌드가 있으므로 번들된 모든 수치는 CPU에서 나온 것입니다. 해 보세요. 캡션 스텝 늘리기(2단계는 천천히 좋아짐), 전역 미세 조정 없애기(0스텝), CNN 스텝 줄이기(CNN이 모든 것의 상한을 정함), 또는 시드 하나로 시드 간 차이가 얼마나 되는지 보기.'
meanings:
- 규칙 $s$는 규칙 $r$이 쓴 것을 읽음; Circle of Willis 문제의 파서로 data/training.smk에서 파싱한 학습 과정
- '각 규칙의 레벨: CNN, LM, 모놀리스는 0, 커넥터는 1, 미세 조정과 라우터는 2, 캡션은 3, evaluate는 4'
- 측정한 규칙 소요 시간으로 구한 max-plus 완료 시각; $\max t$가 임계 경로
- 각 영상에 대한 CNN의 여섯 소견 확률(시그모이드, 다중 라벨); 모델 축 $m$은 층마다 그룹 합성곱 하나의 그룹이 됨
- 'DAG 간선: 소견 확률과 슬롯 벡터 $S_t$ → LM 입력 벡터; $K = 6$개의 소프트 토큰이 써 놓은 라벨 헤더를 대신함'
- '라우터: 데이터 유형별 원-핫(헤더 슬롯 또는 글자), 또는 위치 특징에 대한 학습형 softmax(밀집으로 학습, top-1로 사용)'
- '반복된 $x$ ⇒ 합산: MoE 층의 결합; 각 전문가 $Y^x$는 디스패치된 자기 그룹에서만 계산됨'
- 작은 GPT의 다음 글자 로짓(모델 축이 있는 einsum 어텐션, chain_of_thought에서 가져옴)
- 헤더 뒤 판독문 글자에 대한 모델별 손실(nats); $M$개의 손실을 합하면 각 모델이 자기 기울기를 받음
- '반복된 $n$ ⇒ 합산: 작성된 각 판독문에서 다시 파싱한 라벨의 참양성; micro $F_1$은 이를 $f$에 걸쳐 모음'
labels:
  seeds: 시드(독립 반복)
  steps_cnn: CNN 사전 학습 스텝
  steps_lm: LM 사전 학습 스텝(템플릿 판독문)
  steps_con: 커넥터 스텝(CNN과 LM 고정)
  steps_ft: 전역 미세 조정 스텝
  steps_router: 학습형 라우터 스텝
  steps_cap: 캡션 미세 조정 스텝(2단계)
  lr_ft: 미세 조정 학습률
  lr_cap: 캡션 학습률
