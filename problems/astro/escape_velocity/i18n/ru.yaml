source_hash: d40b53524521
title: Вторая космическая скорость
summary: 'Группа ракет стартует с планеты со скоростями около второй космической $v_\mathrm{esc} = \sqrt{2GM/R}$. Знак энергии решает судьбу каждой ракеты: связанные ($E < 0$) падают обратно, несвязанные ($E \ge 0$) не возвращаются никогда.'
notes: 'Единицы: радиус планеты $R = 1$ и $GM = 1$, поэтому $v_\mathrm{esc} = \sqrt 2$ (для Земли 11,2 км/с). Ракеты летят с выключенным двигателем, воздуха нет, планета не вращается. Чуть ниже $v_\mathrm{esc}$ высота наивысшей точки резко растёт как $1/(1 - v^2/v_\mathrm{esc}^2)$, а полёт длится всё дольше. Ровно при $v_\mathrm{esc}$ ракета замедляется бесконечно долго, но так и не останавливается. Наклоните старт, чтобы убедиться, что вторая космическая скорость не зависит от направления (если траектория не задевает планету): важна только энергия. Тёмные звёзды: сожмите планету так, чтобы $v_\mathrm{esc}$ достигла скорости света $c$, и получите $R = 2GM/c^2$. Мичелл (1783) и Лаплас утверждали, что такая звезда была бы невидимой. Общая теория относительности даёт ровно тот же радиус для горизонта чёрной дыры (радиус Шварцшильда, 3 км для Солнца), хотя ньютоновское рассуждение не отражает истинной физики.'
meanings:
- положение ракеты $b$ относительно центра планеты
- скорость ракеты $b$
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния $r_b^2$'
- притяжение планеты
- 'энергия на единицу массы: отрицательная ⇒ связанное состояние'
- скорость, при которой $E = 0$ на поверхности
- '$2GM/c^2$: радиус, при котором $v_\mathrm{esc} = c$'
- $R/(1 - v^2/v_\mathrm{esc}^2)$, наивысшая точка при вертикальном старте
