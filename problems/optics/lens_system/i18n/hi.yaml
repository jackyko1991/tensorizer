title: किरण-स्थानांतरण आव्यूहों से दो-लेंस निकाय
summary: 'उपाक्षीय (paraxial) प्रकाशिकी रैखिक बीजगणित है: मुक्त समष्टि और पतले लेंस (ऊँचाई, कोण) किरण सदिशों पर लगने वाले $2\times 2$ आव्यूह हैं। पूरा निकाय किरणों के एक बैच पर लगाया गया एक शृंखलित आव्यूह गुणनफल है, जिसे दूसरे लेंस के पहले से दूर खिसकने के साथ दोबारा गणना किया जाता है।'
notes: 'क्रम मायने रखता है: प्रकाश जिस अवयव से पहले मिलता है वह सबसे दाहिना गुणक है। हर गुणक का सारणिक 1 है, इसलिए किसी भी व्यवस्था के लिए $\det M = 1$। देखें कि जब लेंस 1 का मध्यवर्ती प्रतिबिंब ठीक लेंस 2 के फोकस बिंदु पर होता है ($d = sf_1/(s - f_1) + f_2$) तो प्रतिबिंब अनंत की ओर भाग जाता है, फिर दूसरी ओर से आभासी प्रतिबिंब के रूप में लौटता है।'
meanings:
- 'किरण $r$: $j = 0$ ऊँचाई $h$, $j = 1$ कोण $\theta$'
- दूरी $d$ पर संचरण (बैच $d$ से (..., 2, 2) मिलता है)
- फोकस दूरी $f$ वाला पतला लेंस
- निकाय में एक और अवयव जोड़ें (दोहराए गए $j$ का योग); torch.linalg.multi_dot के समान
- वस्तु से हर अक्षीय नमूने $z$ तक स्थानांतरण आव्यूह
- एक ही संकुचन में हर $z$ पर हर किरण
- जहाँ ऊँचाई प्रक्षेपण कोण पर निर्भर नहीं रहती
labels:
  s: वस्तु दूरी
  f1: लेंस 1 की फोकस दूरी
  f2: लेंस 2 की फोकस दूरी
  d_start: प्रारंभिक लेंस अंतराल
  d_end: अंतिम लेंस अंतराल
  h0: वस्तु की ऊँचाई
  half_angle: पंखे का अर्ध-कोण
  n_rays: पंखे में किरणें
