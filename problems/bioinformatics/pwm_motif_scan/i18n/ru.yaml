source_hash: 8da6dcc23206
title: 'Позиционная весовая матрица: логотип мотива и сканирование'
summary: Выровненные сайты связывания транскрипционного фактора подсчитываются в матрицу $(m, 4)$, переводятся в частоты с псевдосчётом и в логарифмические отношения шансов относительно фона. Информационное содержание даёт логотип последовательности, а один einsum по развёрнутым окнам оценивает обе цепи длинной последовательности сразу; совпадения отбираются по p-значению, полученному из перемешанных копий последовательности.
notes: 'PWM предполагает, что каждая позиция сайта связывания вносит вклад независимо, поэтому оценка окна — сумма по одному числу на букву: скалярное произведение one-hot окна на $W$. Псевдосчёт $\beta$ не даёт буквам, не встретившимся в нескольких обучающих сайтах, получить оценку $-\infty$; он тем менее важен, чем больше у вас сайтов. Информационное содержание столбца показывает, насколько мотив сужает выбор буквы в нём: от 0 бит (подходит что угодно) до 2 бит (всегда одна и та же буква), а логотип складывает буквы пропорционально $P_{ja}$. Сайты здесь синтетические: 12 п.н. с ядром, напоминающим TATA-бокс (консенсус TATAWAWR, где W = A или T, R = A или G), и двумя фиксированными буквами с каждой стороны, чтобы мотив нёс достаточно бит для обнаружения. Короткий вырожденный мотив сам по себе несёт слишком мало информации: в длинной последовательности случайные окна набирают столько же, сколько настоящие сайты, поэтому реальный TATA-бокс трудно найти по одной лишь PWM. P-значение получается
  из сканирования перемешанных копий последовательности (те же буквы, без мотива); при $2(L-m+1)$ окнах порог $p$ пропускает около $2(L-m+1)\,p$ случайных совпадений, а наименьшее различимое p-значение равно $1/(1 + \#\text{null scores})$. Попробуйте меньше обучающих сайтов, более слабый мотив или более мягкий порог и наблюдайте, как заданные сайты теряются или появляются ложные совпадения.'
meanings:
- обучающий сайт $s$, столбец $j$, буква $a$ ∈ (A, C, G, T)
- 'повторяющийся $s$ ⇒ суммирование: число букв в каждом столбце'
- частоты с псевдосчётом $\beta$; каждая строка в сумме даёт 1, и ни один элемент не равен 0
- 'логарифм отношения шансов относительно фона $q_a$ (биты): > 0 — предпочитается, < 0 — избегается'
- 'повторяющийся $a$ ⇒ суммирование: биты на столбец, от 0 до 2 при равномерном фоне; высота логотипа'
- $t = 0$ — прямая цепь, $t = 1$ — обратный комплемент (столбцы в обратном порядке, A↔T, C↔G)
- каждое окно из $m$ букв длинной последовательности
- 'повторяющиеся $j$, $a$ ⇒ суммирование: обе цепи за один вызов; тот же код оценивает все перемешивания $(R, 2, L-m+1)$'
- доля оценок перемешанных последовательностей, не меньших данной
labels:
  n_train: Обучающие сайты $N$
  strength: Сила мотива (вероятность консенсуса)
  pseudo: Псевдосчёт $\beta$
  length: Длина последовательности $L$
  n_sites: Заданные сайты
  log10_p: Порог p-значения $\log_{10} p$
  shuffles: Перемешанные последовательности $R$
  seed: Случайное зерно
