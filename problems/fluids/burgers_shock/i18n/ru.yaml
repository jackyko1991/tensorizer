title: Уравнение Бюргерса и ударная волна
summary: 'Простейшее нелинейное уравнение гидродинамики: быстрые участки волны догоняют медленные, профиль становится круче, и около $t^* = 1/\max(-u_0'')$ образуется ударная волна, которую вязкость удерживает тонкой, но гладкой. Производные — матрицы $N\times N$, так что каждое слагаемое уравнения — один einsum; результат сверяется с точным решением Коула–Хопфа.'
notes: Запись $u\,u_x$ как $(\tfrac12u^2)_x$ (дивергентная форма) делает так, что схема точно сохраняет $\int u\,dx$. Без вязкости характеристики $x = x_0 + u_0(x_0)\,t$ пересекаются при $t^* = 1/\max(-u_0')$, и решение стало бы многозначным; вязкость же формирует ударную волну ширины $\sim\nu/\Delta u$. Центральные разности требуют $|u|\Delta x/\nu \lesssim 2$, поэтому $\nu$ нельзя сделать слишком малой на 512 точках. Преобразование Коула–Хопфа $u = -2\nu\,\partial_x\ln\varphi$ сводит уравнение Бюргерса к уравнению теплопроводности, что даёт штриховую точную кривую. Ненулевое смещение $U_0$ заставляет ударную волну двигаться.
meanings:
- скорость в точке сетки $x_i$ (периодические условия)
- центральная разность $(f_{i+1} - f_{i-1})/2\Delta x$ в виде матрицы
- вторая разность $(f_{i+1} - 2f_i + f_{i-1})/\Delta x^2$
- 'повторяющийся $j$ ⇒ суммирование: производная потока $\tfrac12 u^2$'
- вязкое слагаемое
- 'сохраняется: суммы столбцов $D$ и $L$ равны нулю'
- точное решение — среднее по начальным точкам с весами softmax
labels:
  nu: Вязкость $\nu$
  amplitude: Амплитуда $A$ в $u_0 = U_0 + A\sin x$
  offset: Смещение $U_0$
  t_max: Время моделирования
