source_hash: 302fe326211e
title: 图灵斑图：Gray–Scott 反应扩散
summary: 两种以不同速度反应和扩散的化学物质，可以把几乎均匀的混合物变成斑点、条纹和迷宫，这是图灵在 1952 年关于动物毛皮花纹及其他生物图案如何形成的设想。在周期性网格上用 5 点拉普拉斯模板，在同一个 $(2, B, n, n)$ 张量中同时求解四组 $(F, k)$ 的 Gray–Scott 模型，并用线性稳定性分析（色散关系 $\lambda(q)$）显示真正的图灵不稳定性出现在哪里。
notes: 图灵的洞见是：通常会把一切抹平的扩散，在自催化物（这里是 $v$）扩散得比限制它的物质（$u$）更慢时，反而可能使均匀态失稳：$v$ 的一个小凸起通过消耗 $u$ 在局部增长，而其周围 $u$ 的耗竭阻止邻近区域增长，即短程激活、长程抑制。线性稳定性分析使这一点变得精确。均匀态上的波 $e^{i\mathbf q\cdot\mathbf x + \lambda t}$ 按 $J - q^2\,\mathrm{diag}(D_u, D_v)$ 的特征值增长；若 $\lambda(0) < 0$ 但对一段 $q$ 有 $\lambda(q) > 0$，则增长最快的波长 $2\pi/q_{\max}$ 会从微小噪声中浮现。当 $D_u = D_v$ 时每个特征值只平移 $-Dq^2$，因此不可能出现图灵不稳定性：把扩散比设为 1，图上的蓝色区域就会消失。在 Gray–Scott 中，这里只有“Turing”这一组属于此类，它从均匀态加 1 % 噪声出发；虚线检验振幅起初是否按 $e^{\lambda_{\max} t}$ 增长。著名的斑点、条纹和迷宫（Pearson 1993）大多位于唯一均匀态为 $u = 1$、$v = 0$ 的区域，该状态对任何小扰动都稳定；这些图案需要有限大小的种子（几个 $v$ 的方块），属于非线性、能自我复制的结构，而不是线性图灵不稳定性。5 点模板看到的波是 $q^2 \to (4/h^2)\sin^2(qh/2)$，对跨越许多格子的波长而言接近 $q^2$。真实的生物例子包括肢体中指（趾）的间距、毛囊间距以及鱼皮条纹，其中的激活子和抑制子是信号蛋白。
meanings:
- 第 $b$ 组的补料率和移除率；末尾的 1 把它们广播到整个网格
- 每组在格子 $(i, j)$ 中的底物和自催化物浓度，堆叠成形状为 $(2, B, n, n)$ 的 $y$
- 四个邻居减去四倍中心，用 torch.roll 处理周期性边界
- 自催化步骤 $U + 2V \to 3V$、补料和移除
- 显式欧拉法，$\Delta t = 1$，在 $D\,\Delta t / h^2 < 1/4$ 时稳定
- $(1, 0)$ 总是存在；当 $F \ge 4(F + k)^2$ 时另有两个
- 均匀态处的线性化动力学 $\partial R_\alpha / \partial c_\beta$
- 对一批 $Q$ 个波数，$M(q)$ 的最大 $\operatorname{Re}$ 特征值
- $\lambda(0) < 0$ 但在一段频带内 $\lambda(q) > 0$ 的状态：图灵不稳定性
labels:
  grid: 网格大小 $n$
  steps: 时间步数
  ratio: 扩散比 $D_v / D_u$
