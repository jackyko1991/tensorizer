notes: >
  Speculative physics: tachyons are hypothetical. Nothing in the Standard Model is a tachyonic particle and no
  experiment has ever detected one. Special relativity forbids accelerating a massive body through $c$, but it does not
  by itself forbid particles that are always faster than light (Bilaniuk, Deshpande and Sudarshan 1962; Feinberg 1967,
  who coined the name). The price is causality. Two events joined by a signal of speed $u > c$ are spacelike-separated,
  so their time order depends on the observer: in any frame moving faster than $c^2/u$ the signal arrives before it is
  sent and carries negative energy. Feinberg's reinterpretation reads that as a positive-energy antitachyon travelling
  the other way, which saves energy positivity but leaves "who sent it" frame-dependent. Using two frames gives
  Tolman's antitelephone (1917): Alice signals Bob, who is receding at $\beta$, and Bob replies at the same speed in his
  own frame. The reply reaches Alice before she sent the message once $\beta > 2u/(1+u^2)$, which closes a
  causal loop. In quantum field theory a negative $m^2$ is not a fast particle but an instability. The field rolls off
  the hilltop $\phi = 0$ of $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ into $\phi = \pm\sqrt{-m^2/\lambda}$ ("tachyon
  condensation", lowering the energy by $m^4/4\lambda$), where ordinary particles of mass$^2 = 2|m^2|$ live. This is
  exactly what the Higgs field does, and the panel shows it on a lattice with Hubble-like friction. Real data: in
  2011 OPERA reported muon neutrinos arriving $60.7 \pm 6.9 \pm 7.4$ ns early over 730 km, $(v-c)/c = (2.48 \pm 0.28
  \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1). The cause turned out to be a badly connected fibre-optic cable plus a clock
  drift. The corrected result is $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ (v4, JHEP 10 (2012) 093), and ICARUS measured
  $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns (Phys. Lett. B 713 (2012) 17): both consistent with $c$. Read as a tachyon, the
  2011 value would need $|m| \approx 120$ MeV, and then the 10 MeV neutrinos of supernova SN1987A would have outrun light
  by a factor of about 12, instead of arriving within hours of it after 168 000 years ($|v-c|/c \lesssim 2\times10^{-9}$,
  Longo 1987). Units: $c = 1$, the tachyon mass $\mu = 1$ for the signal fan.
