title: 'Огрублённое сворачивание белка: модель Го с динамикой Ланжевена'
summary: Небольшой белок со спирально-шпилечной структурой представлен цепочкой бусин, по одной на аминокислоту, которые удерживаются связями и валентными углами и стабилизируются притягивающими нативными контактами (модель Го). Силы — это градиент полной энергии, вычисленный автоматическим дифференцированием, а энергия записана через тензоры попарных расстояний. Динамика Ланжевена прогоняет сразу целый пакет температур и реплик, половина из которых стартует в свёрнутом состоянии, а половина — в развёрнутом; доля нативных контактов $Q(t)$ показывает сворачивание и разворачивание, а её среднее как функция температуры даёт кривую плавления.
notes: 'Модель Го строится по ответу: каждое взаимодействие, существующее в нативной структуре, притягивающее, а всё остальное только отталкивается, поэтому энергетический ландшафт — гладкая воронка, ведущая к нативной укладке. Это карикатура, но полезная: малые белки действительно сворачиваются так, будто их ландшафт минимально фрустрирован, и модели Го воспроизводят скорости сворачивания, переходные состояния и кооперативное плавление многих из них. Единицы приведённые: энергии в $\varepsilon$ (один контакт), температуры в $\varepsilon/k_B$, время в $\tau$. Половина реплик стартует свёрнутой, половина — прямым стержнем; там, где сплошные и штриховые кривые совпадают, прогоны пришли в равновесие, а там, где нет (при низких $T$), развёрнутые цепи кинетически заперты в неправильно свёрнутых состояниях, и для них нужны гораздо более длинные прогоны или обмен репликами. Кривая плавления широкая, потому что белок крошечный; настоящие белки с сотнями контактов плавятся резко. Без двугранного
  члена энергия зависит только от расстояний, поэтому зеркальное отражение нативной укладки имеет точно такую же энергию и $Q$; настоящие модели Го добавляют двугранные потенциалы, чтобы зафиксировать хиральность. Попробуйте изменить трение (оно меняет кинетику, но не равновесную кривую) или число температур.'
meanings:
- бусина $i$ системы $s$; $S = B\cdot R$ температур × реплик
- нативное расстояние пары $p = (i_p, j_p)$, $j - i \ge 3$; $n_p = 1$, если в нативной укладке ближе 8 Å
- все попарные расстояния всех систем в одном тензоре, суммирование по $a$
- связи + углы + нативные ямы 12–10 (минимум $-\varepsilon$ при $r^0_p$) + отталкивание ненативных пар
- силы автоматическим дифференцированием; суммировать по $s$ можно, потому что системы не взаимодействуют
- у каждой системы свой термостат
- толчок, дрейф, трение + шум $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$, дрейф, толчок
- 'доля образованных нативных контактов: 1 — свёрнутая цепь, около 0.4 — развёрнутая (локальные контакты продолжают образовываться)'
- среднее по времени за вторую половину прогона; $T_m$ — там, где оно пересекает ½
labels:
  helix_length: Бусин на спираль
  T_min: Наименьшая температура $T$
  T_max: Наибольшая температура $T$
  temperatures: Температуры $B$
  friction: Трение $\gamma$
  steps: Шаги по времени
