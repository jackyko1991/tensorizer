source_hash: 8b3f5bebfbdf
title: ベロウソフ–ジャボチンスキー振動子（オレゴネーター）
summary: 臭素酸塩、マロン酸、セリウム触媒を入れてかき混ぜたビーカーが、時計のように色を変える。スケーリングした二変数オレゴネーターは硬い（stiff）常微分方程式である。正値性を保つ生成–消滅（Patankar）ステップで化学量論係数 $f$ の一括を同時に積分し、ヤコビ行列のトレースから振動領域を区切る二つのホップ分岐を求め、同じ反応速度論に拡散を加えると、途切れた波が回転するらせんになる。
notes: ベロウソフ–ジャボチンスキー反応（1950 年代に Belousov が発見し、1972 年に Field、Kőrös、Noyes が説明した）は、臭素酸塩でマロン酸を酸化する。臭化物イオンは $\mathrm{HBrO_2}$ の自己触媒的生成を阻害する。臭化物があるうちは反応はゆっくり進むが、使い尽くされると $\mathrm{HBrO_2}$ が爆発的に増えて触媒を酸化し（色の変化）、酸化された触媒が新たな臭化物を作って急増を止める。オレゴネーターはこれを数段階に凝縮し、スケーリングと速い臭化物の消去を経て二本の方程式にする。定数 $\varepsilon \approx 0.04$ と $q \approx 8\times10^{-4}$ は Field–Kőrös–Noyes の速度定数のフィットから得た近似値であり、レシピによって異なり、文献値もまちまちである。$\varepsilon$ と $q$ が小さいため $x$ の方程式は硬い：$x$ は $\varepsilon$ 程度の時間で約千倍に跳ね上がり、その後ヌルクラインの枝に沿ってゆっくり進む。素朴な RK4 で安定に保つには約 $5\times10^{-4}$ の刻みが必要である。$\varepsilon\dot x$ を生成から消滅を引いた形に書き、消滅を陰的に扱えば、どんな刻みでも $x$ は正に保たれ、$\Delta t = 2\times10^{-3}$ で周期を 1 % より良い精度で再現できる。定常状態（二本のヌルクラインの交点）は、N 字形の $\dot x = 0$ 曲線の外側の枝にあれば安定、中央の枝にあれば不安定で、そのまわりをリミットサイクルが取り囲む。$J$ のトレースは二つのホップ点で符号を変え、$q$ が小さいときそれらは $f = 0.5$ と $f = 2.4$ 付近にある。$\varepsilon$ を大きくしてみよう：振動の窓が狭まり、最後には閉じる。かき混ぜない薄い層では触媒はその場にとどまり $\mathrm{HBrO_2}$ が拡散するので、酸化の波が皿の中を伝わる。途切れた波面は自由端で巻き込み、有名な回転らせんになる。その回転周期はバルクの振動より短いので、らせんが媒質全体を支配する。
meanings:
- 反応 $b$ の化学量論係数（還元された触媒あたりに生成する臭化物）、$0.3$ から $3$ まで
- 各反応のスケーリングした $[\mathrm{HBrO_2}]$（自己触媒）と $[\mathrm{Ce^{4+}}]$（酸化された触媒）
- $\varepsilon\dot x = P - Lx$ となる非負の生成項と消滅速度
- Patankar–Euler 法：消滅は陰的、生成は陽的に扱うので、どれほど硬くても $x$ は正のまま
- $x^2 + (f + q - 1)x - q(1 + f) = 0$ の正の根
- 定常状態での線形化した反応速度論 $\partial \dot y_\alpha / \partial y_\beta$
- $\alpha$ の繰り返し ⇒ 和：トレース；その符号変化がホップ分岐を示す
- 相図における N 字形の $\dot x = 0$ 曲線
- 流束ゼロ境界の 5 点ステンシル；2D 媒質では $x$ だけが拡散する
labels:
  f: 相図とらせんの化学量論係数 $f$
  eps: 時間スケール比 $\varepsilon$（近似値）
  t_max: シミュレーション時間
  spiral: 2D らせん波
  grid: 格子サイズ $n$
