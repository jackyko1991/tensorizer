<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Polymerisation: A-B monomers join end to end into chains of length x as the conversion p grows (step growth, top), while in living chain growth an initiator adds one monomer M at a time (bottom)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- step growth: free monomers, each with an A end (dark) and a B end (light) -->
    <g stroke="#1e40af" stroke-width="1.5">
      <circle cx="20" cy="32" r="6" fill="#2563eb"/><circle cx="32" cy="32" r="6" fill="#93c5fd"/>
      <circle cx="26" cy="58" r="6" fill="#2563eb"/><circle cx="38" cy="58" r="6" fill="#93c5fd"/>
      <circle cx="54" cy="42" r="6" fill="#2563eb"/><circle cx="66" cy="42" r="6" fill="#93c5fd"/>
    </g>
    <text x="14" y="18" font-size="12">A–B</text>
    <line x1="80" y1="44" x2="112" y2="44" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="92" y="36" font-style="italic">p</text>
    <!-- a chain of x units -->
    <g stroke="#1e40af" stroke-width="1.5">
      <circle cx="124" cy="44" r="6" fill="#2563eb"/><circle cx="136" cy="44" r="6" fill="#93c5fd"/>
      <circle cx="148" cy="44" r="6" fill="#2563eb"/><circle cx="160" cy="44" r="6" fill="#93c5fd"/>
      <circle cx="172" cy="44" r="6" fill="#2563eb"/><circle cx="184" cy="44" r="6" fill="#93c5fd"/>
      <circle cx="196" cy="44" r="6" fill="#2563eb"/><circle cx="208" cy="44" r="6" fill="#93c5fd"/>
    </g>
    <path d="M118,58 Q166,72 214,58" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="162" y="82" font-style="italic">x</text>
    <!-- living growth: an initiator (star) adds monomers one by one -->
    <line x1="10" y1="98" x2="230" y2="98" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M30,118 l4,8 9,1 -7,6 2,9 -8,-5 -8,5 2,-9 -7,-6 9,-1 z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <g stroke="#1e40af" stroke-width="1.5" fill="#93c5fd">
      <circle cx="54" cy="131" r="6"/><circle cx="66" cy="131" r="6"/><circle cx="78" cy="131" r="6"/><circle cx="90" cy="131" r="6"/>
      <circle cx="152" cy="131" r="6"/>
    </g>
    <line x1="142" y1="131" x2="102" y2="131" stroke="#dc2626" stroke-width="2"/>
    <path d="M102,131 l8,-4 v8 z" fill="#dc2626"/>
    <text x="166" y="136" font-style="italic">M</text>
    <text x="96" y="154" font-size="12" fill="#374151">living: +1 at a time</text>
  </g>
</svg>
