source_hash: a7f6ff1f025f
title: Диспергирующие волны на воде
summary: 'Волновой пакет на глубокой воде, где длинные волны обгоняют короткие: $\omega = \sqrt{g k}$. Каждая фурье-мода просто поворачивает фазу, так что пакет в любой момент — одно БПФ, умножение и одно обратное БПФ, выполненные сразу для всех моментов. Гребни пробегают через огибающую со скоростью вдвое большей, чем у неё.'
notes: 'Линейные гравитационные волны на глубокой воде (глубина намного больше длины волны, без поверхностного натяжения, малая крутизна). Поскольку $\omega \propto \sqrt k$, групповая скорость $d\omega/dk$ ровно вдвое меньше фазовой $\omega/k$: посмотрите, как красный гребень обгоняет зелёный пик огибающей, исчезает на переднем фронте и сменяется новым гребнем, рождённым сзади (красная точка перескакивает назад на целое число длин волн). Длинные волны бегут быстрее, поэтому пакет медленно расплывается, и в его передней части волны длиннее, чем в задней (чирп). БПФ делает область периодической. Поскольку каждая мода лишь поворачивает фазу, $\sum|\hat a_k|^2$ (энергия волны по Парсевалю) сохраняется точно.'
meanings:
- 'комплексный пакет: гауссова огибающая, умноженная на $e^{ik_0x}$'
- фурье-амплитуды начального пакета
- закон дисперсии глубокой воды для каждой моды
- каждая мода в каждый момент через broadcasting (точно, без шагов по времени)
- 'повторяющийся $k$ ⇒ суммирование: обратно в реальное пространство для всех моментов'
labels:
  wavelength: Длина несущей волны $2\pi/k_0$
  width: Ширина пакета $\sigma$
  t_max: Время моделирования
