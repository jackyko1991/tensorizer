source_hash: 7fc4a728d6a3
title: 单应性估计与全景拼接
summary: 同一张平面海报的两张照片之间由一个 $3\times3$ 单应矩阵相联系。每对特征匹配给出两个线性方程。归一化直接线性变换（DLT）用 SVD 求解它们，RANSAC 则把数千个 4 对匹配的假设作为一次批量 SVD 来拟合，以剔除错误匹配。然后把第二个视角变换过来，与第一个视角羽化融合成全景图。
notes: 相机看一个平面时，按 $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$ 把平面上的点映射到像素，因此同一平面的两个视角之间由 $H_2 H_1^{-1}$ 相联系：八个数，因为尺度是任意的。每对匹配确定其中两个，所以处于一般位置的四对匹配就能确定 $H$。更多的匹配由 DLT 按最小二乘的意义组合起来。如果不做 Hartley 归一化，$A$ 的元素会从 1 变化到 $10^4$（像素的平方），SVD 就会损失精度。最小二乘会被错误匹配毁掉：少数几个外点就能让朴素的全景图明显错位。RANSAC（Fischler & Bolles, 1981）则对许多随机最小样本拟合 $H$，保留与最多匹配一致的那个。外点比例为 $\varepsilon$ 时，一个 4 对匹配的样本是干净的概率为 $(1-\varepsilon)^4$，所以理论上几十个样本就够了。这里一次求解数千个，因为批量 SVD 很便宜。内点上的剩余误差与像素噪声相当。方法参照 Hartley & Zisserman, Multiple View Geometry in Computer Vision。实际流程中的匹配来自 SIFT 或 ORB 等特征检测器。
meanings:
- 视角 1 和视角 2 中匹配的像素位置（已知海报点 + 噪声，其中一部分被随机错误匹配替换）
- 重复的 $j$ ⇒ 求和，然后除以第三个分量（射影尺度）
- 平移到质心并缩放到平均距离为 $\sqrt 2$（Hartley 归一化）
- 每对匹配由 $\mathbf x' \times H\mathbf x = 0$ 给出两行，关于九个元素 $h_a$ 是线性的
- 最小奇异值对应的右奇异向量；然后 $H = T'^{-1}\hat H\,T$
- RANSAC 假设：$B$ 个随机 4 对匹配样本，全部由一次形状为 $(B, 8, 9)$ 的批量 SVD 求解
- 每对匹配在每个假设下的重投影误差
- 一致集最大的假设；在其内点上用 DLT 重新拟合
- 逆向变换：每个全景像素查找自己落在视角 2 中的位置；用羽化权重融合
labels:
  matches: 特征匹配数
  outliers: 错误匹配比例
  noise: 像素噪声 $\sigma$
  hypotheses: RANSAC 假设数 $B$
  threshold: 内点阈值 $\tau$
