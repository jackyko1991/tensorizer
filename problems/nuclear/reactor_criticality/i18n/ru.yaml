source_hash: f81a85fc73c6
title: Критичность реактора
summary: Критична ли пластина из делящегося материала? Одногрупповое диффузионное приближение сводит вопрос к обобщённой задаче на собственные значения $M\phi = \tfrac1k F\phi$ на сетке. Степенной метод — многократное вычисление следующего поколения нейтронов — сходится к основной моде потока и коэффициенту размножения $k_{eff}$, а пакетное решение задачи на собственные значения для многих толщин пластины находит критический размер.
notes: '$k$ — отношение числа нейтронов в одном поколении к предыдущему. Каждый шаг степенного метода — одно поколение: высшие пространственные моды уменьшаются на каждом шаге в $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$ раз, поэтому несимметричное начальное распределение релаксирует к симметричной форме $\sin(\pi x/L)$. Тонкая пластина теряет слишком много нейтронов через утечку ($k < 1$); выше критической толщины $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$ цепная реакция нарастает. Одногрупповые константы по умолчанию иллюстрируют реактор на тепловых нейтронах ($k_\infty \approx 1.06$). Упрощения: одна энергетическая группа, однородная голая пластина без отражателя, $L$ измеряется между экстраполированными границами, нет запаздывающих нейтронов и обратных связей — это статический расчёт собственных значений, а не нестационарный.'
meanings:
- внутренние точки; $\phi = 0$ на (экстраполированных) границах пластины
- матрица вторых разностей $(1, -2, 1)/h^2$
- нейтроны, теряемые утечкой и поглощением
- нейтроны, рождающиеся при делении
- 'повторяющийся $j$ ⇒ суммирование: источник деления следующего поколения'
- один шаг степенного метода
- прямое решение, пакетно по $S$ толщинам пластины
labels:
  width: Толщина пластины $L$
  diffusion: Коэффициент диффузии $D$
  sigma_a: Поглощение $\Sigma_a$
  nu_sigma_f: Генерация $\nu\Sigma_f$
  n_iter: Итерации степенного метода
  n_grid: Точки сетки
