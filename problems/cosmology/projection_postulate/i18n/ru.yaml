title: 'Постулат проекции: одно многомерное состояние, много теней'
summary: 'Спекулятивная гипотеза, а не установленная физика: Вселенная — одно состояние $\Psi$ в пространстве очень большого числа измерений $D$, а наблюдатель измеряет его проекцию на немногие из них. Этот шаг формулирует постулаты и проверяет их математику. Видимая доля $\|P\Psi\|^2$ подчиняется распределению Beta$(d, D-d)$, а измерение моделируется как гонка между скрытыми блоками. Одно скрытое комплексное измерение на исход даёт в точности правило Борна; больше измерений дают отклонение, которое исключают опыты с тремя щелями. Пока идея воспроизводит квантовую механику, а не выходит за её пределы.'
notes: 'Статус: спекулятивно. Это собственная гипотеза автора (см. описание серии), а не установленная физика, и ни один эксперимент не отдаёт ей предпочтения перед стандартной квантовой механикой. Этот первый шаг точно записывает постулаты и проверяет математику, на которой они держатся. Постулаты. P0 (одна реальность): Вселенная — единственное состояние $\Psi$ в пространстве размерности $D$, возможно $D\to\infty$. P1 (проекция): наблюдатель видит лишь проекцию $P:\mathbb C^D\to\mathbb C^d$ на $d$-мерное подпространство; измеряемое квантовое состояние — $\psi = P\Psi/\|P\Psi\|$, так что волновая функция — проекция $\Psi$, а не само $\Psi$. P2 (событие): измерение — проекция на один определённый срез времени, выбирающая один исход $k$; веса исходов берутся из $\|P_k\Psi\|^2$, а правило Борна проверяется, а не постулируется. P3 (одна частица): все частицы — проекции одного и того же объекта. P4 (геометрия): искривлённое пространство-время — спроецированная форма плоского вложения большей
  размерности, а сингулярность — место, где проекция складывается (её якобиан теряет ранг). P5 (открытая размерность): квантовым эффектам нужна некоторая минимальная размерность $d_Q$, а гравитации — некоторая $d_G$ внутри $D$; их оценивают или подгоняют, но никогда не задают вручную равными $3+1$. Что вычисляется. (1) Концентрация меры: для $\Psi$, равномерного на сфере в $\mathbb C^D$, $\|P\Psi\|^2\sim$ Beta$(d, D-d)$ со средним $d/D$; это проверяется по среднему, дисперсии и критерию Колмогорова–Смирнова для $D$ от 4 до $D_{max}$; нормированное $\psi$ равномерно на малой сфере при любом $D$. Типичный наблюдатель видит долю нормы $d/D$, которая исчезает при $D\to\infty$. (2) P2 в конкретной форме гонки проекций (модель автора, формализованная здесь): каждый исход $k$ связан со своим блоком из $m$ скрытых комплексных измерений с энергией $E_k = \|h_k\|^2$, и происходит исход с наибольшим $|c_k|^2/E_k$. При $m = 1$ $E_k\sim$ Exp(1), и экспоненциальная гонка даёт в точности $P(k) = |c_k|^2$:
  правило Борна. При $m > 1$ $E_k\sim$ Gamma$(m)$, и самый вероятный исход выигрывает слишком часто; для двух исходов $P_1 = I_{|c_1|^2}(m, m)$, и отклонение растёт с $m$. Вещественные скрытые измерения дают Gamma$(m/2)$: одно вещественное измерение даёт закон арксинуса $\tfrac2\pi\arcsin|c_1|$, два — правило Борна. (3) Подсчёт размерности (P5): гонке нужно $D\geq d + K$ для $K$ исходов; $N$ запутанных двухуровневых систем требуют $D\geq 2^N$, то есть около $10^{3\times10^{79}}$ для $\sim10^{80}$ частиц наблюдаемой Вселенной, что согласуется с $D\to\infty$ из P0. Честно: стандартная квантовая механика уже использует ровно это гильбертово пространство, а частичные следы и проекции — стандартные операции. Пока гипотеза — это переинтерпретация; любая проверяемая новизна должна возникнуть там, где гонка с $m > 1$ или следующий шаг предсказывает что-то иное. Теорема Глисона (1957) уже показывает, что при $d\geq 3$ любое неконтекстуальное приписывание вероятностей на гильбертовом пространстве
  — это правило Борна. (4) Данные: в схеме с тремя щелями (41 ячейка экрана плюс исход «заблокировано», у каждого свой скрытый блок) гонка даёт параметр Соркина $\kappa\approx s\,(a-1)$, где $s$ лежит между 0,56 и 0,74 для 9 разбиений, а скрытый параметр формы равен $a = m$ (комплексные) или $m/2$ (вещественные). Измеренные значения (data/born_rule_tests.csv, цитируемые числа): Sinha и др. (Science 329, 418, 2010) ограничивают $|\kappa|$ значением ниже $10^{-2}$; Park и др. (ЯМР, New J. Phys. 14, 113025, 2012) $\kappa = 0.001\pm0.003$; Kauten и др. (New J. Phys. 19, 033017, 2017, открытый доступ, CC-BY 3.0) $0.0\pm1.6\times10^{-3}$ с объявленными одиночными фотонами, $(1.3\pm1.8)\times10^{-4}$ с ослабленным лазерным светом и $0.0\pm3.1\times10^{-5}$ с классическим светом. При $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ и наименьшем наклоне данные с одиночными фотонами допускают $|a-1|\leq 6\times10^{-3}$, а данные с классическим светом, если каждая регистрация фотона — одна гонка, $|a-1|\leq
  1.1\times10^{-4}$. Гонка с $m = 2$ даёт $\kappa\approx 1$, а одно вещественное скрытое измерение — $\kappa\approx 0.1$; оба варианта исключены; выживает только одно комплексное (два вещественных) скрытое измерение на исход. Это ограничение модели, а не её подтверждение: $m = 1$ — как раз тот случай, который нельзя отличить от стандартной квантовой механики. Связь с $\kappa$ зависит от разбиения исходов, поэтому используется самый осторожный наклон. Следующие шаги серии (здесь не построены): P3 (все частицы как проекции одного объекта), P4 (искривлённое пространство-время как тень плоского вложения: аналитическая 4D-метрика по теореме Жане–Картана локально вкладывается в 10 плоских измерений, решение Шварцшильда — в 6), подгонка $d_G$ для гравитации и поиск предсказания, отличного от стандартной физики.'
meanings:
- доля нормы $\Psi$, которую видит наблюдатель, сразу для всех $D$ (вложенные состояния)
- наблюдаемое состояние, равномерное на единичной сфере в $\mathbb C^d$ при любом $D$
- расстояние Колмогорова–Смирнова до Beta$(d, D-d)$ (неполная бета-функция квадратурой)
- 'энергия скрытого блока $k$ из $m = 1..M$ измерений: Gamma$(m)$ (комплексные) или $2\,$Gamma$(m/2)$ (вещественные)'
- 'гонка проекций: происходит исход с наибольшим $|c_k|^2/E_k$'
- замкнутая форма гонки; сумма по $j$ (без $j = k$) — это произведение по остальным исходам
- 'повторяющийся индекс щели $s$ ⇒ суммирование: амплитуда для каждого набора $S$ открытых щелей'
- трёхпутевой параметр Соркина для модели гонки; $0$ для правила Борна
labels:
  D_max: Наибольшая полная размерность $D$ (пример; расчёт идёт по лестнице до неё)
  d: Размерность подпространства наблюдателя $d$ (пример)
  m_max: Наибольшее число скрытых измерений на исход $m$
  outcomes: Число исходов $K$
  trials: Случайных состояний и событий на случай
