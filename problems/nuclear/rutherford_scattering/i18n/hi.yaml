- 'दोहराया गया $j$ ⇒ योग: दूरी का वर्ग $r_b^2$'
- पूरे पुंज के लिए एक साथ कूलॉम प्रतिकर्षण
- '2D सदिश गुणनफल: प्रति इकाई द्रव्यमान कोणीय संवेग'
- पुंज अक्ष से निर्गामी वेग का कोण
- रदरफ़ोर्ड पूर्वानुमान, हिस्टोग्राम से तुलना
