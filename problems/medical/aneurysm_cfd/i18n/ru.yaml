source_hash: 96c00309dd36
title: 'CFD аневризмы: процесс OpenFOAM + VMTK, перестроенный на тензорах'
summary: Пульсирующий кровоток через реальную внутричерепную аневризму, выделенную из открытого (CC0) TOF-МРА-снимка, по стандартной исследовательской схеме (центральные линии и удлинения потока VMTK, несжимаемый решатель в духе OpenFOAM, затем касательное напряжение на стенке, TAWSS и OSI), где каждый шаг записан тензорными операциями. Решатель проверен на течениях Пуазёйля и Уомерсли и на расчётах OpenFOAM для трубы и для той же сетки аневризмы, центральные линии — по VMTK. Только для обучения, не для клинического применения.
notes: 'Схема работы. Типичное исследование аневризмы сегментирует просвет, очищает его в VMTK (Antiga et al. 2008), решает течение в OpenFOAM (Weller et al. 1998) и обрабатывает касательное напряжение на стенке. Здесь каждый шаг наш, записан на тензорах; код ни одного из двух GPL-проектов не копировался. Шаги VMTK и их замены: vmtksurfacesmoothing, vmtksurfaceremeshing и vmtkflowextensions (-adaptivelength 1 -extensionratio 5) были запущены один раз офлайн для получения STL-файлов; vmtkcenterlines -seedselector profileidlist (диаграмма Вороного, fast marching для $|\nabla T| = 1/R$, обратный ход по наискорейшему спуску) становится solve.centrelines: вписанный радиус $R$ — расстояние от каждого вокселя до стенки, эйкональное уравнение решается повторными min-plus-проходами по графу с 26 соседями (тензорная замена fast marching, со скоростью $R^2$, так как граф — весь просвет, а не уже срединная диаграмма Вороного), и все выходы одновременно идут назад по предшественникам. icoFoam/pimpleFoam
  из OpenFOAM и наш код: lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh'']; phi → u; fvc::div(phi) → divergence; fvm::laplacian(p) и его решение PCG → pressure_matrix и pcg; коррекция давления PISO → project (одна проекция Шорина за шаг); fvm::laplacian(nu, U) → face_laplacian; div(phi,U) → полулагранжев advect; функциональный объект wallShearStress → wss_at. Сетка: кубические воксели STL с фиктивным значением метода погружённой границы на стенке. Геометрия: по умолчанию аневризма из Lausanne TOF-MRA Aneurysm Cohort (Di Noto et al. 2022; OpenNeuro ds003949, CC0), испытуемый 074: вырезка 28 мм вокруг размеченной аневризмы, пороговая сегментация, сетка методом marching cubes, сглаживание и удлинения (data/SOURCES.md); один вход и три выхода. Вариант «synthetic» — наша собственная аневризма бифуркации (CC0). Другие проверенные наборы данных: AneuriskWeb (CC BY-NC) и AneuX (CC BY-NC 4.0) некоммерческие; IntrA и AnXplore не указывают лицензию; у Vascular Model Repository собственная
  исследовательская лицензия; STL фантомов из Киля (CC BY 4.0) — оболочки стенок с очень тонкими ветвями. Вход: аналитическая форма волны, подобная ВСА (среднее 4,58 мл/с, пик/среднее 1,66, Ford et al. 2005, период 1 с), масштабированная по закону Мюррея к радиусу входа, профиль Уомерсли; на выходах нулевое давление. Кровь: ньютоновская, $\nu = 3.5\times10^{-6}$ м²/с, $\rho = 1060$ кг/м³; жёсткие стенки. Невязки (запуск по умолчанию): труба против OpenFOAM v1912 pimpleFoam — скорость на оси L2 1,2 %, фаза −10 мрад, WSS L2 2,5 %; труба против точного решения Уомерсли — L2 0,4 %; центральные линии против VMTK 1.5.0 — среднее расстояние 0,20 мм (0,5 вокселя), максимум 0,5 мм, разница радиусов в среднем 0,12 мм; аневризма против pimpleFoam на нашей собственной воксельной сетке, экспортированной как polyMesh (тот же вход и те же выходы) — |u| на срезе L2 35 %, WSS в пик систолы L2 38 %, TAWSS L2 32 %. Последнее расхождение велико: расчёт с вчетверо меньшим шагом по времени дал то же самое, значит,
  оно вызвано разной обработкой стенки (наши фиктивные значения на гладкой поверхности против ступенчатых граней OpenFOAM), положением выходов и схемами адвекции на грубой сетке, на которой ни один из кодов не сошёлся. Результаты для аневризмы следует читать качественно. Выходы с нулевым давлением к тому же направляют слишком большой расход в самую тонкую ветвь и дают нереалистичный перепад давления. Вывод: кроме GIF, results/aneurysm.pvd — временной ряд ParaView для стенки (WSS, TAWSS, OSI), линий тока и трассеров. Оговорки: грубая учебная симуляция по пороговой сегментации, не для клинического применения. Низкое WSS и высокий OSI в мешке связывают в литературе с ростом и разрывом аневризм, но данные противоречивы и спорны (Meng et al. 2014). Эталоны OpenFOAM и VMTK получены один раз офлайн и никогда не запускаются задачей или её тестами.'
meanings:
- ячейка-владелец и соседняя ячейка каждой грани вокселя, как в списках owner/neighbour OpenFOAM
- нормальная к грани скорость (поток OpenFOAM $\phi_f = u_f h^2$)
- 'два вызова index_add по граням: fvc::div(phi)'
- $-\nabla^2$, собранный по граням (fvm::laplacian); стенки и вход — Нейман, выходы $p = 0$
- сопряжённые градиенты, Якоби плюс поправка на грубых агрегатах
- шесть соседей того же направления; фиктивные значения дают ровно $u = 0$ на стенке
- 'полулагранжев метод: проследить каждую грань назад по потоку и интерполировать (grid_sample)'
- профиль Уомерсли для каждой гармоники $Q(t)$, функции Бесселя $J_0, J_1$ комплексного аргумента
- парабола через $u = 0$ на стенке и отсчёты в $h$, $2h$ вдоль внутренней нормали
- средние по записанному циклу, tau формы (T, V, 3)
- расстояние до стенки = радиус наибольшей вписанной сферы
- пакетные линии тока RK4 по трилинейно интерполированной скорости, стартующие у входа
- min-plus-проход (Беллман–Форд) эйконального уравнения по графу вокселей с 26 соседями
labels:
  geometry: 'Геометрия: реальная (лозаннская TOF-МРА, CC0) или синтетическая'
  voxel: Размер вокселя $h$
  cycles: Число рассчитываемых сердечных циклов (записывается последний)
  dt_ms: Шаг по времени $\Delta t$
  frames: Кадров анимации на цикл
