source_hash: 5c7383dc415a
title: 量子穿隧
summary: 高斯波包撞上矩形位障。含時薛丁格方程式以分步傅立葉法求解：位能在 $x$ 空間是對角算符，動能在 $k$ 空間是對角算符，因此每半個時間步都只是一次逐元素張量乘法，以 torch.fft 在兩個基底間切換。
notes: 單位 $\hbar = m = 1$，波包能量 $E \approx k_0^2/2$。對角算符 $D_{xy} = d_x\,\delta_{xy}$ 作用於 $\psi$ 得 $D_{xy}\psi_y = d_x\psi_x$——不需要矩陣，只需逐元素相乘。Strang 分裂 $P\cdot K\cdot P$ 對 $\Delta t$ 具二階精度且嚴格么正，因此歸一化在捨入誤差內保持為 1。模擬時間自動選擇（$45/k_0$），使波包中心從 $x = -25$ 移動到約 $x = +20$。對 $E < V_0$，古典粒子總會反彈；右側透射的部分就是穿隧。印出作為比較的平面波穿透係數 $T(k_0)$ 忽略了波包的動量分佈（並使用落在網格上的位障寬度）；較寬的波包（較大的 $\sigma_0$）動量較確定，與之更為吻合。
meanings:
- 週期性網格 $x$ 上的波函數
- 半步位能算符：在 $x$ 中為對角，以 psi * P 作用
- 整步動能算符：在 $k$ 中為對角，以 psi_k * K 作用
- 基底轉換 $x \to k$（快速矩陣乘積，從不明確建立）
- 穿透：在位障右側找到粒子的機率
labels:
  k0: 波包動量 $k_0$
  V0: 位障高度 $V_0$
  width: 位障寬度 $a$
  sigma: 波包寬度 $\sigma_0$
