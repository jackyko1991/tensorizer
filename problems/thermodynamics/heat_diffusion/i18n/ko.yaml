source_hash: 2b849cfef0cb
title: 판에서의 열 확산
summary: 푸리에 법칙은 온도 기울기를 열 선속으로 바꾸고, 에너지 보존은 그 선속의 발산을 온도 변화로 바꿉니다. 격자 위에서 두 미분은 모두 작은 합성곱 커널이므로, 한 시간 단계는 판 전체에 대한 conv2d 호출 두 번일 뿐입니다.
notes: 전진 차분과 후진 차분을 합치면 익숙한 5점 라플라시안이 되므로, $\partial_i\partial_i T$는 따로 코딩하지 않습니다. 기울기 커널과 발산 커널을 합성하면 저절로 나옵니다. 양해법은 $\alpha\,dt/dx^2 \le 1/4$일 때만 안정합니다(아래의 "안정성 수"). 디리클레 경계에서는 가장자리가 20 °C 열욕이어서 열이 빠져나갑니다. 노이만(단열) 경계에서는 경계를 지나는 선속이 없으므로 온도가 고르게 되는 동안 총 열량이 보존됩니다. 사인 모드 $\sin(\pi x/L)\sin(\pi y/L)$는 $\exp(-2\pi^2\alpha t/L^2)$로 감쇠합니다.
meanings:
- 모든 격자 칸의 온도 (conv2d를 위한 배치·채널 차원 포함)
- 전진 차분 스텐실, 방향 $i \in \{x, y\}$마다 출력 채널 하나
- '푸리에 법칙: 열 선속, 채널 $i$가 성분'
- '반복된 $i$ ⇒ 합: conv2d가 입력 채널 2개를 더함 — 발산'
- 열 확산도 (m²/s)
- '우변; 전진 오일러: $T \leftarrow T + dt\,\partial_t T$'
labels:
  alpha: 확산도 $\alpha$
  t_max: 시뮬레이션 시간
  n_spots: 뜨거운 점 수
  n_grid: 한 변의 격자 칸 수
  r: 안정성 수 $\alpha\,dt/dx^2$
  boundary: 가장자리
