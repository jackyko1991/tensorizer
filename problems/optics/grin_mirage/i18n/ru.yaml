source_hash: cd1d0cc0a127
title: Мираж над дорогой
summary: Над горячей дорогой воздух разрежен, поэтому его показатель преломления $n(y)$ у земли понижается. Уравнение луча геометрической оптики искривляет свет в сторону большего $n$; интегрирование методом RK4 для веера направлений взгляда показывает, что лучи, направленные на дорогу, загибаются вверх, и глаз видит второе, перевёрнутое изображение далёкого предмета.
notes: 'Лучи прослеживаются в обратном направлении от глаза (ход лучей обратим): каждый луч отвечает на вопрос «что видит глаз, глядя в этом направлении?». Лучи, направленные чуть вниз, загибаются вверх в слое с низким показателем и попадают в предмет снизу, поэтому при меньших углах взгляда видны более высокие части предмета — изображение перевёрнуто. Более крутые лучи упираются в дорогу (серые). Вертикальный масштаб преувеличен примерно в 100 раз: реальные разности показателя $\sim 10^{-5}$, а углы — миллирадианы. Вычисления ведутся в float64, потому что $n\cos\theta$ меняется лишь в 7-м знаке после запятой.'
meanings:
- положение $(x, y)$ луча $r$
- 'оптический вектор направления: единичная касательная, умноженная на $n$'
- показатель преломления, наименьший у горячей поверхности дороги $y = 0$
- 'ненулевая только $y$-компонента: $(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$'
- уравнение луча как система первого порядка, интегрируемая RK4
- 'повторяющийся $j$ ⇒ суммирование: $\lvert\mathbf p\rvert$ должен оставаться равным $n$ (проверка точности)'
- 'закон Снеллиуса для горизонтальных слоёв: сохраняется вдоль каждого луча'
labels:
  delta_n: Падение показателя у дороги $\Delta n$
  scale_height: Толщина горячего слоя $h$
  eye_height: Высота глаза
  distance: Расстояние до предмета
  max_dip: Самый крутой взгляд вниз
  n_rays: Лучей в веере
