source_hash: a69998e36eef
title: 挂谷猜想
summary: 一根针可以在面积任意小的集合内转过所有方向。本题构造这样的集合（Perron 树：$2^k$ 个细三角形，横向平移），并逐行精确计算其面积。接着用 $\delta$ 立方体覆盖 $\mathbb R^2$、$\mathbb R^3$ 与 $\mathbb R^4$ 中 $\delta$ 管的并集，以估计其维数。挂谷猜想断言这样的集合仍具有完整维数 $n$。这在 $n = 2$ 时已证明，自 2025 年起 $n = 3$ 也已证明；对 $n \ge 4$，目前仅有的证明都是未经验证、由 AI 生成的声称。
notes: 挂谷在 1917 年问：要让单位长的针转一圈，最少需要多大的面积？Besicovitch（1919、1928）发现，在每个方向都含有一条单位线段的集合，其测度可以为零；Perron（1928）把构造简化成这里画出的树。把一个三角形切成 $2^k$ 条细片并横向滑动。每条细片保持它的方向，而每做一轮 Perron 步骤，重叠就变大。面积满足 $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$（已检验），而最佳的 $\alpha$（同时尝试 24 个值求得）使面积以 $\ln k / k$ 的速度下降。Córdoba（1977）证明平面上挂谷集的 $\delta$ 邻域面积至少为 $c / \log(1/\delta)$，所以这种缓慢的衰减无法避免；Davies（1971）证明每个平面挂谷集的豪斯多夫维数与闵可夫斯基维数都是 2。三棵相差 60° 的树在每个方向都含有一根单位针（红色的针扫过 180°）；用 Pál 的技巧把各个位置连接起来，就能让针真的在面积任意小的集合内旋转。在 $\mathbb R^n$ 中，挂谷集猜想断言每个这样的集合都有维数 $n$：方向彼此 $\delta$ 分离、半径为 $\delta$ 的管不能重叠太多，所以它们的并集体积 $\gtrsim_\varepsilon \delta^{\varepsilon}$。右侧面板针对两种排列（所有管都通过原点，以及随机中心）计数 $\delta$ 立方体。在每种情形下，$\log N$ 对 $\log(1/\delta)$ 的斜率都趋近 $n$，若猜想为真就必然如此。计算机只能检验特定的排列，永远无法检验所有排列。现状（2026 年 11 月）：$n = 2$ 已证明（Davies 1971）。$n = 3$ 由王虹与 Joshua Zahl 证明（2025 年预印本），在此之前有 Wolff 的界 $(n+2)/2$（1995）以及 Katz–Łaba–Tao 的工作。对 $n \ge 4$，在同行评审的文献中这个问题仍未解决。OpenAI 发布的 AI 生成手稿集（github.com/openai/math，第 074 与 079 族）声称证明了四维情形，并通过 Sogge 的局部光滑化猜想声称证明了所有维数。该仓库表示其中部分命题已在
  Lean 中形式化，但这些都是未经同行评审、由机器生成的声称，仍待数学界检验，因此本页将它们视为声称，而非已证明。这个猜想的重要性远超几何：它可由调和分析中的傅里叶限制猜想与 Bochner–Riesz 猜想推出。
meanings:
- $N = 2^k$ 个细三角形，顶点为 $(0, 1)$，底边 $[b_i, b_i + w_0]$ 分割 $[-1/\sqrt3, 1/\sqrt3]$：一个 60° 的方向锥，每条边 $\ge 1$
- 经过 $k$ 轮 Perron 步骤后的横向平移，同时对 $A$ 个 $\alpha$ 值计算；每一轮让相邻的心部相接，并把右边那个向左推 $(1-\alpha)(c - a)$
- 三角形 $i$ 与高度 $y$ 的水平线相交之处
- 把每一行的区间按左端点排序；右端点的累积最大值给出已被覆盖的部分
- 重复的 $i$ 与 $y$ ⇒ 求和：每一行并集的精确长度，再对各行取平均（中点法则）
- 立方体 $[-1,1]^n$ 各面上的 $\delta$ 网格，投射到球面上：大约 $\delta$ 分离的直线方向
- 每根管经过的边长为 $\delta$ 的立方体，沿管每隔 $\delta/2$ 采样
- 重复的 $i$ ⇒ 求和：每个立方体一个整数键，因此计数不同的立方体只需一次排序
- 重复的 $j$ ⇒ 求和：树转 0°、60°、120° 的三个副本覆盖所有方向
labels:
  k_max: Perron 轮数 $k$（$2^k$ 个三角形）
  n_max: 管至维数 $n$
