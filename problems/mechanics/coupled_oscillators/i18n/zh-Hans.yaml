source_hash: ea8025a41e84
title: 耦合振子与简正模
summary: $N$ 个相同质量的物体用弹簧连接，夹在两面固定墙之间。弹簧构成一个刚度张量 $K_{ij}$，其本征矢就是简正模，运动是各模式的叠加，用一次 einsum 求和。
notes: 由于 $K_{ij}$ 是对称的，eigh 给出实频率和正交归一的模式，因此任何运动都是独立余弦之和，无需时间步进。从单一模式出发，链条将永远保持该形状；拨动一个质量块，能量就沿链条来回传递。解析频率为 $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$。
meanings:
- 质量块 $i$ 偏离平衡位置的位移
- 刚度张量：对角线上为 $2k$，相邻处为 $-k$
- 重复的 $j$ ⇒ 求和：质量块 $i$ 所受的弹簧合力
- 本征值和本征矢（第 $n$ 列）= 简正模
- 重复的 $i$ ⇒ 求和：把初态投影到各模式上
- 重复的 $n$ ⇒ 求和：模式的叠加
labels:
  n_masses: 质量块数
  k: 劲度系数
  m: 质量
  start: 初始位移
  amplitude: 初始振幅
  t_max: 模拟时长
