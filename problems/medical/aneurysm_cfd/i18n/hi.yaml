source_hash: 96c00309dd36
title: 'एन्यूरिज़्म CFD: OpenFOAM + VMTK कार्यप्रवाह, टेंसरों से दोबारा बनाया गया'
summary: एक खुले (CC0) TOF-MRA स्कैन से खंडित एक वास्तविक अंतःकपालीय एन्यूरिज़्म से होकर स्पंदित रक्त प्रवाह, मानक शोध कार्यप्रवाह (VMTK मध्य-रेखाएँ और प्रवाह विस्तार, OpenFOAM जैसा असंपीड्य सॉल्वर, फिर दीवार अपरूपण प्रतिबल, TAWSS और OSI) के अनुसार, जिसमें हर चरण टेंसर संक्रियाओं के रूप में लिखा गया है। सॉल्वर को Poiseuille और Womersley प्रवाह तथा पाइप और उसी एन्यूरिज़्म मेश पर OpenFOAM परिणामों से, और मध्य-रेखाओं को VMTK से जाँचा गया है। केवल शिक्षा के लिए, नैदानिक उपयोग के लिए नहीं।
notes: 'कार्यप्रवाह। एक सामान्य एन्यूरिज़्म अध्ययन ल्यूमेन को खंडित करता है, उसे VMTK (Antiga et al. 2008) से साफ़ करता है, प्रवाह को OpenFOAM (Weller et al. 1998) से हल करता है और दीवार अपरूपण प्रतिबल का पश्च-प्रसंस्करण करता है। यहाँ हर चरण हमारा अपना है, टेंसरों से लिखा गया; दोनों GPL परियोजनाओं में से किसी से कोड नक़ल नहीं किया गया। VMTK चरण और उनके विकल्प: vmtksurfacesmoothing, vmtksurfaceremeshing और vmtkflowextensions (-adaptivelength 1 -extensionratio 5) को STL फ़ाइलें बनाने के लिए एक बार ऑफ़लाइन चलाया गया; vmtkcenterlines -seedselector profileidlist (Voronoi आरेख, $|\nabla T| = 1/R$ पर fast marching, तीव्रतम अवरोहण से पीछे लौटना) solve.centrelines बन जाता है: अंतर्निहित त्रिज्या $R$ हर वॉक्सेल की दीवार से दूरी है, आइकोनल समीकरण को 26-पड़ोसी ग्राफ़ पर बार-बार min-plus स्वीप से हल किया जाता है (fast marching का टेंसर-अनुकूल विकल्प, गति $R^2$ के साथ, क्योंकि ग्राफ़ पूरा ल्यूमेन है, पहले से मध्य-स्थित Voronoi आरेख नहीं), और सभी निकास एक साथ पूर्ववर्तियों के सहारे पीछे लौटते हैं। OpenFOAM
  के icoFoam/pimpleFoam और हमारा कोड: lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh'']; phi → u; fvc::div(phi) → divergence; fvm::laplacian(p) और उसका PCG हल → pressure_matrix और pcg; PISO दाब सुधार → project (हर चरण में एक Chorin प्रक्षेपण); fvm::laplacian(nu, U) → face_laplacian; div(phi,U) → अर्ध-लाग्रांजीय advect; wallShearStress फ़ंक्शन ऑब्जेक्ट → wss_at। मेश: STL के घनाकार वॉक्सेल, दीवार पर निमग्न-सीमा का घोस्ट मान। ज्यामिति: डिफ़ॉल्ट रूप से Lausanne TOF-MRA Aneurysm Cohort (Di Noto et al. 2022; OpenNeuro ds003949, CC0) के विषय 074 का एक एन्यूरिज़्म: चिह्नित एन्यूरिज़्म के चारों ओर 28 mm का हिस्सा, देहली-मान से खंडित, marching cubes से मेश किया गया, चिकना किया गया और बढ़ाया गया (data/SOURCES.md); एक प्रवेश और तीन निकास। विकल्प "synthetic" हमारा अपना द्विशाखन एन्यूरिज़्म (CC0) है। जाँचे गए अन्य डेटासेट: AneuriskWeb (CC BY-NC) और AneuX (CC BY-NC 4.0) गैर-व्यावसायिक हैं; IntrA और AnXplore कोई लाइसेंस नहीं बताते; Vascular Model Repository का अपना शोध लाइसेंस है; कील के
  फैंटम STL (CC BY 4.0) बहुत पतली शाखाओं वाली दीवार-खोलें हैं। अंतर्वाह: विश्लेषणात्मक ICA जैसी तरंग (औसत 4.58 ml/s, शिखर/औसत 1.66, Ford et al. 2005, आवर्तकाल 1 s), Murray के नियम से प्रवेश त्रिज्या के अनुसार मापित, Womersley प्रोफ़ाइल; निकासों पर शून्य दाब। रक्त: न्यूटनी, $\nu = 3.5\times10^{-6}$ m²/s, $\rho = 1060$ kg/m³; कठोर दीवारें। अवशेष (डिफ़ॉल्ट रन): पाइप बनाम OpenFOAM v1912 pimpleFoam, अक्ष वेग L2 1.2 %, कला −10 mrad, WSS L2 2.5 %; पाइप बनाम Womersley का सटीक हल, L2 0.4 %; मध्य-रेखाएँ बनाम VMTK 1.5.0, औसत दूरी 0.20 mm (0.5 वॉक्सेल), अधिकतम 0.5 mm, त्रिज्या अंतर औसतन 0.12 mm; एन्यूरिज़्म बनाम polyMesh के रूप में निर्यात किए गए हमारे अपने वॉक्सेल मेश (वही अंतर्वाह और निकास) पर pimpleFoam, स्लाइस पर |u| L2 35 %, सिस्टोल शिखर पर WSS L2 38 %, TAWSS L2 32 %। यह अंतिम अंतर बड़ा है: चार गुना छोटे समय चरण वाले रन ने वही दिया, इसलिए यह अलग दीवार उपचार (चिकनी सतह पर हमारे घोस्ट मान बनाम OpenFOAM के सीढ़ीनुमा फलक), निकासों की स्थिति और एक मोटे मेश पर अभिवहन योजनाओं से आता है, जिस पर कोई भी
  कोड अभिसरित नहीं है। एन्यूरिज़्म के परिणामों को गुणात्मक मानें। शून्य-दाब निकास सबसे छोटी शाखा में बहुत अधिक प्रवाह भेजते हैं और अवास्तविक दाब-पात देते हैं। आउटपुट: GIF के अलावा, results/aneurysm.pvd दीवार (WSS, TAWSS, OSI), धारारेखाओं और अनुरेखकों की ParaView समय-श्रृंखला है। सावधानियाँ: देहली-मान खंडन पर आधारित एक मोटा, शैक्षिक सिमुलेशन, नैदानिक उपयोग के लिए नहीं। थैली में कम WSS और उच्च OSI को साहित्य में एन्यूरिज़्म की वृद्धि और फटने से जोड़ा जाता है, पर प्रमाण परस्पर विरोधी और विवादित हैं (Meng et al. 2014)। OpenFOAM और VMTK संदर्भ एक बार ऑफ़लाइन बनाए गए थे और समस्या या उसके परीक्षण उन्हें कभी नहीं चलाते।'
meanings:
- हर वॉक्सेल फलक का स्वामी और पड़ोसी सेल, जैसे OpenFOAM की owner/neighbour सूचियों में
- फलक के लंबवत वेग (OpenFOAM का फ़्लक्स $\phi_f = u_f h^2$)
- 'फलकों पर दो index_add कॉल: fvc::div(phi)'
- फलकों से जोड़ा गया $-\nabla^2$ (fvm::laplacian); दीवारें और प्रवेश Neumann, निकास $p = 0$
- संयुग्मी प्रवणता, Jacobi और मोटे समूहों पर सुधार
- एक ही दिशा के छह पड़ोसी; घोस्ट मान दीवार पर ठीक $u = 0$ रखते हैं
- 'अर्ध-लाग्रांजीय: हर फलक को प्रवाह के साथ पीछे ट्रेस करें और अंतर्वेशन करें (grid_sample)'
- $Q(t)$ के हर हार्मोनिक के लिए Womersley प्रोफ़ाइल, सम्मिश्र तर्क के Bessel फलन $J_0, J_1$
- दीवार पर $u = 0$ से और भीतरी अभिलंब के साथ $h$, $2h$ पर नमूनों से गुज़रता परवलय
- रिकॉर्ड किए गए चक्र पर औसत, tau का आकार (T, V, 3)
- दीवार से दूरी = सबसे बड़े अंतर्निहित गोले की त्रिज्या
- त्रि-रैखिक रूप से अंतर्वेशित वेग से होकर बैच में RK4 धारारेखाएँ, प्रवेश पर बोई गईं
- 26-पड़ोसी वॉक्सेल ग्राफ़ पर आइकोनल समीकरण का min-plus (Bellman–Ford) स्वीप
labels:
  geometry: 'ज्यामिति: वास्तविक (लोज़ान TOF-MRA, CC0) या कृत्रिम'
  voxel: वॉक्सेल आकार $h$
  cycles: सिमुलेट किए गए हृदय चक्र (अंतिम रिकॉर्ड होता है)
  dt_ms: समय चरण $\Delta t$
  frames: प्रति चक्र एनिमेशन फ़्रेम
