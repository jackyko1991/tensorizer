source_hash: 5ff140d5db65
title: 搜尋自相似爆破剖面
summary: 如今追捕奇點的方法：寫出 $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$，把偏微分方程化為剖面 $U$ 的方程，其中指數 $\lambda$ 未知，再用高斯–牛頓法把一批候選剖面（每個試探值 $\lambda$ 一個）當作一個張量來訓練。對無黏伯格斯方程，殘差漏斗只在精確值 $\lambda = 1/(2i+2)$ 處塌陷，學到的剖面與經典的 $y = -U - U^{2i+3}$ 吻合。同樣的搜尋用於非局部的科爾多瓦–科爾多瓦–豐特洛斯方程，找到其穩定指數 $\lambda \approx 1.18$。
notes: 本題是 fluids/navier_stokes_blowup 的姊妹篇，後者展示 1983 年的圖景：讓泰勒–格林渦向前演化，看著渦度增長，直到網格跟不上。現代方法跳過時間演化：它假定奇點是自相似的，直接搜尋剖面。把 $u = \tau^\lambda U(y)$ 代入 $u_t + uu_x = 0$ 得到 $-\lambda U + ((1+\lambda)y + U)U' = 0$。把它當作關於 $y(U)$ 的線性常微分方程求解，得到 $y = -U - C\,U^{1+1/\lambda}$，只有當 $1 + 1/\lambda$ 為奇數時才光滑。因此 $\lambda = 1/(2i+2)$，精確剖面為 $y = -U - U^{2i+3}$（以 $U'(0) = -1$ 和 $U(-2) = 1$ 歸一化）。這些是經典結果（Eggers & Fontelos, Singularities, 2015）。$\lambda = 1/2$ 是穩定的、一般的爆破；$1/4, 1/6, \dots$ 需要精細調節的初值。這裡在固定 $\lambda$ 下同時訓練 61 個候選剖面。最佳殘差隨 $\lambda$ 的變化（漏斗）在 $\lambda = 1/2$ 處降到捨入誤差（$\sim10^{-15}$），在 $1/4$ 處降到 $\sim10^{-11}$。兩者之間殘差大得多（在 $\lambda = 0.37$ 處大 $\sim10^{7}$ 倍），因為那裡只存在含非光滑項 $|y|^{1+1/\lambda}$ 的剖面。施加 $U'''(0) = 0$ 會去掉 $1/2$ 處的漏斗，搜尋隨即找到 $1/4$。再加上 $U^{(5)}(0) = 0$ 本應選出 $1/6$，但在此解析度下 $1/6$ 附近的漏斗太平，無法定位：競爭剖面只在 $y^{7}$ 階上有差別，淺的極小值落在 $\lambda \approx 0.19$。殘差無法區分穩定與不穩定：那是時間演化的性質，這裡的不穩定剖面只能透過額外約束得到。剖面是一個譜展開，帶有研究中使用的歸納偏置——緊化座標和輸出整形；研究論文使用帶同樣偏置的物理資訊神經網路（PINN）。高斯–牛頓法是 Wang et al. (2025) 使用的最佳化器。對 $\lambda$ 的梯度步會卡在每個漏斗的尖底，因此用批次的黃金分割搜尋確定
  $\lambda$。CCF 方程 $\theta_t - (H\theta)\theta_x = 0$（表面準地轉方程的一維模型；$H$ 是希爾伯特變換）以渦度形式 $\omega = \theta_x = \Omega(y)/\tau$ 求解。$\Omega$ 用 $\operatorname{Im}(1-iy)^{-s}$、$s = j/(1+\lambda) + m$ 展開，其希爾伯特變換是精確的。預設執行得到 $\lambda \approx 1.18$（殘差 $\sim10^{-4}$）；用更大的基做更長的執行會穩定在 $1.1808$（殘差 $2\times10^{-6}$）。這與 Eggers & Fontelos (Nonlinearity, 2020) 的基態指數 $\approx 1.18$ 一致。Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) 用 PINN 找到第一個不穩定 CCF 剖面 $\lambda_1 \approx 0.6057$。Wang et al. (2025, arXiv 2509.14185) 找到第二個 $\lambda_2 \approx 0.4713$，殘差達到 $10^{-13}$ 左右，接近雙精度。他們還為多孔介質方程和布西內斯克方程找到新的不穩定族，這些是數值候選。不穩定剖面有陡峭的梯度，這個一分鐘的 CPU 搜尋無法分辨，只顯示穩定漏斗。現狀：伯格斯剖面是精確的定理。CCF 的爆破由 Córdoba, Córdoba & Fontelos (Annals, 2005) 證明。神經搜尋找到的剖面在電腦輔助證明把它們變成定理之前都是數值候選，Chen & Hou (2022) 就對帶邊界的軸對稱歐拉方程的侯–羅情形做到了這一點。三維不可壓縮納維–斯托克斯千禧年問題仍未解決，這裡的內容與之沒有直接關係。試試更粗的 $\lambda$ 網格或更少的高斯–牛頓步，看漏斗變模糊。
meanings:
- 這一批：每個候選剖面一個試探指數，全部同時訓練
- 緊化座標 $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$：在 $y = 0$ 處 $r = 1$，當 $|y| \to \infty$ 時 $r \to 0$
- 奇對稱、$U'(0) = -1$ 和遠場 $U \sim y^{\lambda/(1+\lambda)}$ 已內建；$P$ 是關於 $r$ 的切比雪夫級數
- 配點處的剖面方程殘差，加上 $U(2) = -1$ 和光滑性約束
- $R$ 是 $c$ 的二次式，所以雅可比矩陣是精確的（測試中與 autograd 核對）
- 對批次中每個成員做萊文伯格–馬夸特（阻尼高斯–牛頓）步，一次批次求解完成
- $U = -y + c_3y^3 + c_5y^5 + \dots$ 的泰勒係數；令其為零會去掉 $\lambda = 1/2$ 和 $1/4$ 處的漏斗
- CCF 基的精確希爾伯特變換：$(1-iy)^{-s}$ 在上半平面解析
- 確定每個漏斗的底；每個試探值 $\lambda$ 都重新訓練剖面
labels:
  n_lambda: 批次大小：試探指數 $\lambda$
  gn_steps: 每個剖面的高斯–牛頓步數
  ccf_lambda0: CCF 初始指數 $\lambda_0$
