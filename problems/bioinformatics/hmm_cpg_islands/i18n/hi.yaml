title: छिपे मार्कोव मॉडल से CpG द्वीप खोजना
summary: 'एक DNA अनुक्रम अदृश्य रूप से साधारण पृष्ठभूमि और GC-समृद्ध CpG द्वीपों के बीच बदलता है। दो-अवस्था वाला छिपा मार्कोव मॉडल (HMM) उन्हें खोजता है: अग्र–पश्च (forward–backward) हर स्थिति पर द्वीप में होने की प्रायिकता देता है, विटर्बी सबसे अच्छा एकल विभाजन, और बाउम–वेल्च केवल अनुक्रमों से मॉडल सीखता है। अनुक्रम के अनुदिश हर चरण अवस्थाओं पर एक बैच आव्यूह गुणनफल है, जिसे लघुगणकीय स्थान में रखा जाता है। पश्च प्रायिकता को रोपित द्वीपों पर टिकते देखें।'
notes: 'डेटा कृत्रिम है: हर अनुक्रम में यादृच्छिक स्थानों पर 100–300 अक्षरों के द्वीप रोपे गए हैं, जिनके अंदर C और G अधिक हैं। एक अक्षर अवस्था के बारे में लगभग कुछ नहीं बताता, पर शृंखला $A$ अवस्थाओं को टिकाऊ बनाती है, इसलिए अग्र और पश्च पास पूरे खंडों के प्रमाण को जोड़ते हैं। बाउम–वेल्च अपेक्षा–अधिकतमीकरण (EM) है: वर्तमान मॉडल के तहत $\gamma$ और $\xi$ की गणना करें, फिर $E_{k\alpha}$ को हर अवस्था में अपेक्षित अक्षर आवृत्तियों पर और $A_{ij}$ को अपेक्षित स्विच आवृत्तियों पर रखें; संभाविता कभी नहीं घटती। एक अस्पष्ट अनुमान से शुरू करके यह वास्तविक मॉडल (हरी रेखा) के निकट पहुँचता है। वास्तविक CpG द्वीप केवल C और G में नहीं, बल्कि द्विन्यूक्लियोटाइड CG में समृद्ध होते हैं; Durbin et al. इसे 8 अवस्थाओं (A+, C+, G+, T+, A−, …) से मॉडल करते हैं जिनके संक्रमण द्विन्यूक्लियोटाइड आवृत्तियाँ हैं। समस्या को कठिन बनाने के लिए द्वीपों की GC मात्रा घटाएँ।'
meanings:
- अनुक्रम $b$ की स्थिति $t$ पर अक्षर, A, C, G, T पर one-hot
- प्रारंभ, संक्रमण और उत्सर्जन प्रायिकताएँ; अवस्था 0 पृष्ठभूमि, अवस्था 1 द्वीप
- 'दोहराया गया $\alpha$ ⇒ योग: हर अवस्था द्वारा देखे गए अक्षर के उत्सर्जन की संभावना'
- दोहराया गया $i$ ⇒ योग; $\log\alpha$ के रूप में संग्रहीत, सबसे बड़ा पद बाहर निकाला गया (log-sum-exp) ताकि कुछ भी अधःप्रवाहित (underflow) न हो
- 'दोहराया गया $j$ ⇒ योग: अवस्था $i$ दी होने पर शेष अनुक्रम की प्रायिकता'
- पश्च प्रायिकता $P(z_t = k \mid x)$; $\gamma_{bt1}$ नीला वक्र है
- 'विटर्बी: वही पुनरावर्तन, योग के स्थान पर max के साथ, और सबसे अच्छे पथ के लिए पश्च-सूचक'
- 'दोहराए गए $b, t$ ⇒ योग: $i \to j$ स्विचों की अपेक्षित संख्या; बाउम–वेल्च $A_{ij} \propto \xi_{ij}$ रखता है'
labels:
  n_seq: अनुक्रम $B$
