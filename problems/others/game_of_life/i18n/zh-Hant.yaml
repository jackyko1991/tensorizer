source_hash: 1d6c71673889
title: 以摺積表示康威生命遊戲
summary: 這不是物理，純屬好玩：一個由活細胞與死細胞組成的網格，每個細胞都會觀察它的八個鄰居。計算鄰居數就是一次 $3\times3$ 摺積，寫成對展開後區塊的一個 einsum，而誕生／存活規則則是張量之間的比較，因此好幾個棋盤上的每個細胞都同時更新。觀察滑翔機、滑翔機槍與隨機湯。
notes: 只要三個數字（3 個鄰居時誕生、2 或 3 個時存活）就足以產生每 4 代沿對角線移動一格的滑翔機、脈衝星（週期 3）之類的振盪子，以及高斯帕滑翔機槍：它每 30 代發射一架新的滑翔機，因此族群每個週期增加 5。只有 5 個細胞的 $R$ 五格骨牌，在無邊界的網格上會持續變化 1103 代；在有限的棋盤上，邊界會讓這個過程提早結束。隨機湯會逐漸燃盡，變成靜物、閃爍子與逃逸的滑翔機；灰色曲線顯示不同的湯之間，這種衰減有多麼相似。同樣的「展開再 einsum」模式，正是卷積神經網路中一層的計算方式。
meanings:
- 棋盤 $b$ 的細胞 $(i, j)$：1 為活，0 為死
- 細胞周圍為 1、中央為 0：細胞不是自己的鄰居
- 每個細胞 $p$ 周圍的 $3\times3$ 區塊排成一行；棋盤外的細胞視為死亡
- 重複的 $k$ ⇒ 求和：每個細胞的活鄰居數，等同於與 $K$ 做摺積
- B3/S23：恰有 3 個鄰居時誕生，有 2 或 3 個時存活，否則死亡
- 每個棋盤在每一代的族群數量
labels:
  pattern: 初始圖樣
  size: 棋盤大小
