source_hash: 48f29505ec48
title: k-mer、GC 含量と GC スキュー
summary: DNA 配列を one-hot の $(L, 4)$ テンソルにする。$k$ 文字のすべての語を数えるのは展開した窓に対する一つの einsum（1 次元畳み込み）であり、GC 含量と GC スキューは窓和である。累積スキューの最小値は、複製起点と終結点を植え込んだ合成の環状染色体上で、複製が始まる位置を指し示す。
notes: ほとんどの細菌の染色体は環状で、単一の複製起点から複製され、二つの複製フォークが逆方向に進んで終結点で出会う。二つの半分は異なる仕方で複製され（一方の鎖はリーディング鎖として連続的に、もう一方は断片的に）、進化の時間をかけてリーディング鎖は C よりわずかに多く G を蓄積する傾向がある。ここではその偏りを植え込んでいる：起点から終結点までは G が因子 $(1+\text{skew})/(1-\text{skew})$ で優遇され、残りの半分では C が優遇される。一つの窓のスキューはノイズが大きいが、累積和 $S_n$ は起点まで下がり続け、終結点まで上がり続けるので、偏りが数パーセントしかなくてもその最小値と最大値ははっきり目立つ。実際のゲノムも同じ V 字型を示すが、遺伝子、反復配列、再編成がそれぞれ独自の組成を加えるため、それほどきれいではない。内側のリング上の二つの低 GC 区間はゲノムアイランド、すなわち他所から取り込まれ、しばしば異なる塩基組成を保つ DNA を模している。$k$-mer スペクトルはゲノムアセンブリや多くのアラインメントフリー比較の出発点である。このランダムなゲノムでは、その色は単に GC 含量に従う。より小さいスキュー、より小さいゲノム、より大きい $k$（語が増え、それぞれのカウントは減る）を試してみよう。
meanings:
- 位置 $n$、文字 $a$ ∈ (A, C, G, T)：塩基が $a$ のところで 1
- $k$ 文字のすべての窓。メモリをコピーしない
- $a \cdot 4^{k-1-j}$：語を 4 進数として読んだ数（AAA = 0, …, TTT = $4^k-1$）
- $j$ と $a$ の繰り返し ⇒ 和：$n$ から始まる $k$-mer の番号
- $k$-mer スペクトル。カウントの合計は $L-k+1$
- $i$ の繰り返し ⇒ 和：$\ell$ 塩基の窓 $w$ の塩基数。窓は $\Delta = \ell/2$ ごと
- $(n_G + n_C)/\ell$ と $(n_G - n_C)/(n_G + n_C)$
- $c = (0, -1, +1, 0)$：G から C を引いた累積カウント。argmin = 起点、argmax = 終結点
labels:
  length_kb: ゲノム長 $L$
  k: 語長 $k$
  window: 窓 $\ell$
  origin: 植え込む起点（ゲノム上の割合）
  skew: 鎖の偏り（スキュー）
  gc: GC 含量
  seed: 乱数シード
