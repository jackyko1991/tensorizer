source_hash: f068882719e2
title: 'Диаграмма Фейнмана: $e^+e^- \to \mu^+\mu^-$ через следы матриц Дирака'
summary: 'Простейшая диаграмма КЭД: электрон и позитрон аннигилируют в виртуальный фотон, который рождает пару мюонов. Правила Фейнмана превращают картинку в амплитуду, суммирование по спинам превращает её в следы произведений матриц Дирака $\gamma^\mu$ размера $4\times4$, и каждый след — это один einsum. Развёртка по энергии показывает, как угловое распределение меняется от изотропного у порога до $1 + \cos^2\theta$, а сечение падает как $4\pi\alpha^2/3s$.'
notes: 'Диаграмма рисуется один раз, но код никогда не строит спинор: суммирование по спинам заменяет $u\bar u$ на $\not p + m$, так что весь расчёт сводится к произведениям и следам $\gamma$-матриц, которые einsum вычисляет сразу для всех энергий и углов. Результат: $\overline{|\mathcal M|^2} = e^4\big[1 + 4m^2/s + (1 - 4m^2/s)\cos^2\theta\big]$ при $m_e \to 0$: у порога медленные мюоны вылетают изотропно, а далеко выше порога спин фотона, равный 1, и сохранение спиральности дают $1 + \cos^2\theta$. Полное $\sigma$ круто растёт от $\sqrt s = 2m$, а затем падает как $1/s$, примерно $86.8$ нб при 1 ГэВ. Реальные данные PETRA и LEP следуют этой кривой до $\sqrt s \approx 30$ ГэВ, где интерферирует вторая диаграмма с $Z$-бозоном вместо фотона, и асимметрия вперёд–назад $A_{FB}$ становится ненулевой; чистая КЭД даёт $A_{FB} = 0$. Попробуйте пару $\tau$, открытую на SPEAR в 1975 году чуть выше её порога 3.55 ГэВ.'
meanings:
- 'матрицы Дирака: индекс $\mu$ пространственно-временной, $a, b$ — спинорные индексы; $\{\gamma^\mu, \gamma^\nu\} = 2\eta^{\mu\nu}$'
- метрика Минковского diag(1, −1, −1, −1), единицы с $\hbar = c = 1$
- 4-импульсы $e^-$, $e^+$, $\ell^-$, $\ell^+$ в системе центра масс для каждой энергии $\sqrt s$ и угла $\theta$
- '«слэш» Фейнмана: суммы по спинам $\sum u\bar u = \not p + m$ и $\sum v\bar v = \not p - m$'
- 'повторяющиеся $a, b, c, d$ ⇒ суммирование: след электронной линии (та же функция для мюонной линии)'
- 'опустить мюонные индексы с помощью $\eta$ и свернуть: фотонный пропагатор соединяет две линии'
- множители потока и фазового объёма; $(\hbar c)^2$ переводит ГэВ$^{-2}$ в нб
- полное сечение; сравнивается с $\frac{4\pi\alpha^2}{3s}\beta\,(1 + 2m^2/s)$, $\beta = \sqrt{1 - 4m^2/s}$
labels:
  final: Конечное состояние
  sqrt_s_max: Наибольшая энергия $\sqrt s$
