title: आदर्श गैस के चार प्रक्रम
summary: 'एक ही गैस, एक ही अवस्था से शुरू होकर, पाठ्यपुस्तक के चार पथों पर ले जाई जाती है: समतापी, समदाबी, समआयतनिक और रुद्धोष्म। चारों पथ $(V, p)$ नमूनों का एक (process, points, 2) टेंसर हैं, कार्य हर वक्र के नीचे का क्षेत्रफल है जो torch.trapezoid देता है, और ऊष्मागतिकी का प्रथम नियम उसे ऊष्मा में बदलता है।'
notes: 'प्रारंभ: 10 लीटर में 300 K पर 1 mol। समतापी, समदाबी और रुद्धोष्म पथ एक ही अंतिम आयतन तक प्रसारित होते हैं; समआयतनिक पथ $V$ स्थिर रखता है और गैस को तब तक गर्म करता है जब तक दाब उसी अनुपात में न बढ़ जाए। समआयतनिक पर $dV = 0$ होने से torch.trapezoid वहाँ ठीक शून्य कार्य देता है। समतापी पर $\Delta U = 0$ इसलिए $Q = W$; रुद्धोष्म पर $Q = 0$ इसलिए गैस अपना कार्य आंतरिक ऊर्जा से चुकाती है और ठंडी होती है। दाईं ओर के बार चलते योग हैं, जो torch.cumulative_trapezoid से निकाले गए हैं।'
meanings:
- प्रक्रम $c$ (समतापी, समदाबी, समआयतनिक, रुद्धोष्म) के अनुदिश नमूना $k$
- आदर्श गैस नियम, पूरे टेंसर पर अवयव-वार
- 'दोहराया गया $k$ ⇒ योग: हर पथ पर गैस द्वारा किया गया कार्य'
- आंतरिक ऊर्जा केवल ताप पर निर्भर करती है
- 'ऊष्मागतिकी का प्रथम नियम: गैस को दी गई ऊष्मा'
labels:
  ratio: प्रसार अनुपात $V_2/V_1$
  T0: प्रारंभिक ताप
  n: गैस की मात्रा
  gas: गैस
