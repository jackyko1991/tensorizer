source_hash: 9a93d668845a
title: 'अलग-अलग प्रशिक्षित करें, DAG टेंसर से जोड़ें: एक CNN और एक छोटा LM'
summary: 'एक छोटा CNN MNIST अंक सीखता है और एक छोटा अक्षर-स्तरीय GPT "three+two=five." जैसे वाक्य सीखता है, दोनों अपने-अपने स्तर पर अलग-अलग। फिर एक DAG किनारा उन्हें जोड़ता है: एक कनेक्टर CNN की विशेषताओं को सॉफ्ट टोकनों में बदलता है जो पहले शब्द की जगह लेते हैं, जिससे LM "[3 की छवि]+two=" का उत्तर "five" देता है। पूरी प्रशिक्षण प्रक्रिया स्वयं एक टेंसर DAG है (स्तरों पर नियम, एक max-plus क्रिटिकल पाथ, हर नियम के लिए सभी सीड पर एक बैच कॉल), और इसकी तुलना उसी नेटवर्क से की जाती है जिसे समान गणना (गुणा-जोड़) के साथ केवल संयुक्त कार्य पर एंड-टू-एंड प्रशिक्षित किया गया है। जोड़ने वाले किनारे को एक स्थिर राउटर वाली मिक्सचर-ऑफ़-एक्सपर्ट्स (MoE) परत के रूप में भी लिखा गया है, और एक सीखे गए राउटर को परखा जाता है।'
notes: 'विचार। नेटवर्कों को अलग-अलग प्रशिक्षित किया जा सकता है, फिर एक DAG टेंसर के माध्यम से जोड़ा जा सकता है, फिर वैश्विक रूप से अनुकूलित किया जा सकता है, और पूरी प्रक्रिया को स्वयं DAG टेंसर द्वारा नियंत्रित किया जा सकता है। यह विचार Jacky Ka Long Ko का है; यह समस्या इसे एक छोटे CNN और एक छोटे अक्षर-स्तरीय LM पर परखती है, जानबूझकर शुरू से संयुक्त रूप से प्रशिक्षित दृष्टि-भाषा मॉडल के रूप में नहीं, और इसकी तुलना ठीक उसी गैर-DAG विकल्प से करती है। क्या नया है और क्या नहीं। अलग से पूर्व-प्रशिक्षित छवि एनकोडर, एक पूर्व-प्रशिक्षित LM और एक छोटे सीखे गए कनेक्टर से बहु-मोडल मॉडल बनाना वही तरीका है जिससे LLaVA (Liu et al. 2023, LM के टोकन स्पेस में एक रैखिक या MLP प्रक्षेपण) और BLIP-2 (Li et al. 2023, एक फ्रोज़न छवि एनकोडर और एक फ्रोज़न LLM के बीच Q-Former) बनाए जाते हैं; Frozen (Tsimpoukelli et al. 2021) एक छवि को फ्रोज़न LM में सॉफ्ट प्रीफ़िक्स के रूप में देता है, जैसा यहाँ; और मॉडल स्टिचिंग (Lenc और Vedaldi, CVPR 2015, arXiv 2014; Bansal et al. 2021) दो प्रशिक्षित नेटवर्कों को एक छोटी प्रशिक्षण-योग्य
  परत से जोड़ती है। यह समस्या जो जोड़ती है वह है ऑर्केस्ट्रेशन: मॉडल ग्राफ़ और प्रशिक्षण प्रक्रिया दोनों विलिस वृत्त वर्कफ़्लो समस्या के टेंसर DAG इंजन (नियम ग्राफ़, क्रोनेकर जॉब ग्राफ़, बूलियन स्तर, max-plus क्रिटिकल पाथ) द्वारा चलाए जाते हैं, और DAG से बने मॉडल को एक मोनोलिथ के विरुद्ध मापा जाता है। कार्य और मॉडल। एक CNN (दो 5×5 कन्वोल्यूशन, 8474 भार) 3000 MNIST छवियों से दस अंक सीखता है। एक दो-परत GPT (d = 32, चार हेड, 27 543 भार, chain_of_thought से मॉडल अक्ष वाला einsum अटेंशन) 300 वाक्य "a op b = r." सीखता है, जहाँ op +, −, × mod 10 में से है और अंक शब्दों में लिखे गए हैं ("three+two=five.", पहला शब्द 5-अक्षर वाले स्लॉट में दाईं ओर संरेखित)। संयुक्त कार्य a की एक MNIST परीक्षण छवि और पाठ "+two=" देता है; ऑपरेंड शब्द पाठ में नहीं है। DAG किनारा एक कनेक्टर (3808 भार) है: CNN की दस अंक प्रायिकताओं $q$ और एक स्लॉट सदिश $S_t$ से यह $K = 5$ सॉफ्ट टोकन $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$ बनाता है जो LM इनपुट पर ऑपरेंड स्लॉट की जगह लेते हैं। (इसके बजाय CNN की उपांतिम विशेषताएँ देने
  पर परीक्षणों में सीखना कहीं धीमा रहा: 100 कनेक्टर चरणों के बाद लगभग 0.6 के मुकाबले लगभग 0.25 संयुक्त सटीकता।) सटीकता उन परीक्षण उदाहरणों का अनुपात है जिनमें सही प्रीफ़िक्स दिए जाने पर उत्तर के सभी अक्षर और पूर्ण विराम LM की शीर्ष पसंद होते हैं, जो ठीक वही है जो ग्रीडी डिकोडिंग लिखती है। DAG के रूप में प्रशिक्षण प्रक्रिया। data/training.smk नियमों को सूचीबद्ध करता है; इंजन इसे विलिस वृत्त पार्सर से पार्स करता है और स्तर-दर-स्तर चलाता है, हर नियम एक स्टैक किए गए मॉडल अक्ष (सीड × संयुक्त-सेट आकार $n$) पर अपने मॉडलों के लिए एक ही बैच कॉल के रूप में: स्तर 0 train_cnn ∥ train_lm ∥ train_monolith; स्तर 1 train_connector (CNN और LM फ्रोज़न, $I \otimes \mathbb 1$ ब्लॉक द्वारा सीड से (सीड, $n$) पर ब्रॉडकास्ट); स्तर 2 global_finetune (सब कुछ, किनारे के माध्यम से एंड-टू-एंड, 100 गुना छोटी लर्निंग रेट पर) ∥ दो सीखे गए राउटर; स्तर 3 evaluate। 2 सीड और 4 आकारों के साथ: 8 नियम, 45 जॉब, 84 जॉब किनारे, $A$ निलपोटेंट। परीक्षण जाँचते हैं स्तरों को, कि चक्र अस्वीकार किया जाता है, कि एक स्टैक में प्रशिक्षित
  दो सीड वही हानियाँ देते हैं जो प्रत्येक को अकेले प्रशिक्षित करने पर (Adam तत्व-वार है, क्लिपिंग प्रति मॉडल है), और कि एक मॉडल की हानि दूसरों को शून्य ग्रेडिएंट भेजती है। आधार रेखा। मोनोलिथ वही CNN + कनेक्टर + LM (39 825 भार) है, यादृच्छिक रूप से प्रारंभ किया गया और केवल संयुक्त उदाहरणों पर एंड-टू-एंड प्रशिक्षित। इसका बजट प्रति मॉडल गुणा-जोड़ में मिलाया गया है: DAG पाइपलाइन के 150 CNN, 600 LM, 150 कनेक्टर और 80 फ़ाइन-ट्यून चरण (बैच 32) 682 संयुक्त चरणों जितने महँगे हैं, जो मोनोलिथ को मिलते हैं (हर पूर्व-प्रशिक्षण को हर मॉडल के लिए पूरा गिना गया है, हालाँकि DAG में एक पूर्व-प्रशिक्षित CNN और LM $n$ के चारों मानों के लिए काम आते हैं)। परिणाम (2 सीड, 1000 परीक्षण छवियाँ, संयोग स्तर 0.1, CPU)। मल्टीथ्रेडेड फ़्लोट रिडक्शन के कारण दोहराए गए रन कुछ अंकों से भिन्न होते हैं, इसलिए नीचे के आँकड़े चार पूरे रनों पर सीड-औसत की सीमा हैं; संलग्न रन की सटीक संख्याएँ results/stages.csv में हैं। अकेले, CNN परीक्षण अंकों में से 0.89 पढ़ता है और LM पाठ प्रॉम्प्ट में से 0.97 से 0.99 पूरे करता है; CNN का अंक
  पाठ के रूप में लिखकर LM को देने पर 0.88 से 0.89 आता है, जो इस पाइपलाइन की ऊपरी सीमा है। $n$ = 100, 300, 1000, 3000 संयुक्त उदाहरणों के लिए संयुक्त सटीकता: अप्रशिक्षित कनेक्टर लगभग 0.16; कनेक्टर चरण के बाद 0.41–0.47, 0.58–0.63, 0.60–0.69, 0.64–0.68; वैश्विक फ़ाइन-ट्यून के बाद 0.41–0.47, 0.63–0.67, 0.68–0.75, 0.71–0.75; मोनोलिथ 0.14, 0.13–0.15, 0.16–0.17, 0.23। DAG से बना मॉडल हर रन में हर $n$ पर जीतता है, सबसे अधिक वहाँ जहाँ संयुक्त डेटा कम है, और फ़ाइन-ट्यून $n$ = 300 से आगे 0.03 से 0.08 जोड़ता है ($n$ = 100 पर औसतन कुछ नहीं बदलता)। कारण सीधा है: DAG एकल-मोडल डेटा (3000 लेबल किए गए अंक और हर वाक्य) का पुनः उपयोग करता है, जबकि मोनोलिथ को केवल $n$ उत्तर शब्दों से अंक और अंकगणित दोनों खोजने पड़ते हैं, और × अक्सर ऑपरेंड को छिपा देता है (कुछ भी × 0 = 0)। अधिक चरणों या डेटा के साथ मोनोलिथ सुधरेगा (इसकी हानि बजट के अंत में भी घट रही है): यह छोटे बजट की तुलना है, कोई नियम नहीं। DAG किनारा = MoE डिस्पैच। वही इनपुट परत मिक्सचर ऑफ़ एक्सपर्ट्स के रूप में लिखी गई है: एक्सपर्ट img (CNN + कनेक्टर) और
  एक्सपर्ट txt (LM का टोकन एम्बेडिंग), स्थितियों × एक्सपर्ट्स पर एक राउटर $G$, हर एक्सपर्ट उसे भेजी गई स्थितियों पर बैच में चलता है, और संयोजन $X^0 = G_{mntx}Y^x_{mntc}$। जब $G$ डेटा प्रकार (छवि स्लॉट या अक्षर, कोई भी डेटा देखे जाने से पहले ज्ञात, जैसे वर्कफ़्लो अपने वाइल्डकार्ड से नियम चुनता है) के अनुसार वन-हॉट हो, तो MoE आउटपुट DAG-वायर्ड आउटपुट के बराबर 1e-6 तक होता है, और सभी ग्रेडिएंट भी (परीक्षित)। सटीक संबंध: DAG किनारा डेटा प्रकार से तय होने वाले स्थिर राउटर वाला MoE डिस्पैच है; MoE एक DAG है जिसके किनारे हर टोकन के लिए एक सीखा गया राउटर चुनता है। क्या राउटर वह रूटिंग सीख सकता है? हर स्थिति की विशेषताओं (7×7 पूल की गई छवि और वन-हॉट id) पर एक रैखिक राउटर को एक्सपर्ट्स को फ्रोज़न रखकर Switch लोड-संतुलन हानि ($\alpha$ = 0.01) के साथ प्रशिक्षित किया गया। Switch top-1 (केवल चुना गया एक्सपर्ट चलता है, $p$ से स्केल) अविश्वसनीय है: मॉडलों और रनों में इसकी रूटिंग सटीकता 0 से 0.92 तक रही और कार्य सटीकता 0 से लगभग 0.46 तक, क्योंकि न चुने गए एक्सपर्ट को कोई ग्रेडिएंट नहीं मिलता, इसलिए शुरुआती
  गलत चुनाव कभी सुधरता नहीं, और संतुलन हानि 50/50 विभाजन की ओर खींचती है जबकि सही विभाजन 5/17 है। सघन मिश्रण ($G = p$, दोनों एक्सपर्ट हर जगह) के रूप में प्रशिक्षित करके फिर top-1 के रूप में उपयोग करने पर, राउटर हर मॉडल और रन में मोडैलिटी रूटिंग पुनः प्राप्त करता है (0.97 से 0.99 स्थितियाँ) और लगभग 0.35 से 0.65 कार्य सटीकता तक पहुँचता है, स्थिर राउटर से थोड़ा कम क्योंकि $p < 1$ आउटपुट को स्केल करता है। जब सही किनारा डेटा प्रकार से ज्ञात हो, तो उसे स्थिर करना सटीक भी है और सस्ता भी। समय। 6-कोर डेस्कटॉप CPU पर डिफ़ॉल्ट रन मशीन खाली होने पर लगभग 66 s में प्रशिक्षित होता है (अन्य भारी कार्यों के साथ साझा होने पर 2 से 4 मिनट तक), साथ ही GIF के लिए लगभग 15 s: खाली मशीन वाले रन में मोनोलिथ ने 35 s, LM ने 12 s, कनेक्टर ने 4.5 s और फ़ाइन-ट्यून ने 4 s लिए। प्रति नियम एक वर्कर के साथ max-plus क्रिटिकल पाथ मोनोलिथ है, फिर evaluate (39 s); DAG प्रणाली की अपनी शृंखला LM → कनेक्टर → फ़ाइन-ट्यून → evaluate लगभग 24 s लेती है। कोड GPU चुनता है जब torch उसे देखता है; इस परियोजना के वातावरण में torch का CPU
  बिल्ड है, इसलिए हर संलग्न संख्या CPU से है। डेटा। MNIST (Y. LeCun, C. Cortes, C. J. C. Burges), लाइसेंस CC BY-SA 3.0: 3000 प्रशिक्षण और 1000 परीक्षण छवियों का एक संतुलित उपसमुच्चय संलग्न है (data/mnist_subset.npz, 0.7 MB; data/SOURCES.md में स्रोत, चेकसम और प्रसंस्करण हैं)। वाक्य कोड में उत्पन्न किए जाते हैं। आज़माएँ। कम LM चरण (LM की सटीकता हर चीज़ की सीमा तय करती है), बड़ा $\alpha$ (Switch राउटर अधिक ढहता है), कोई फ़ाइन-ट्यून नहीं (0 चरण), या एक सीड यह देखने के लिए कि सीड आपस में कितने असहमत होते हैं।'
meanings:
- नियम $s$ वह पढ़ता है जो नियम $r$ लिखता है; विलिस वृत्त समस्या के पार्सर से data/training.smk से पार्स की गई प्रशिक्षण प्रक्रिया
- 'वाइल्डकार्ड seed और $n$ पर जॉब ग्राफ़: $n$ के बिना नियम हर $n$ पर ब्रॉडकास्ट होता है ($I \otimes \mathbb 1$), evaluate सभी को एकत्र करता है ($\mathbb 1^\top$)'
- 'हर नियम का स्तर: train_cnn, train_lm और मोनोलिथ 0 पर, कनेक्टर 1 पर, फ़ाइन-ट्यून और राउटर 2 पर, evaluate 3 पर'
- मापी गई नियम अवधियों से max-plus समाप्ति समय; $\max t$ क्रिटिकल पाथ है
- हर छवि के लिए CNN की दस अंक प्रायिकताएँ; मॉडल अक्ष $m$ प्रति परत एक समूहित कन्वोल्यूशन के समूह बन जाता है
- 'DAG किनारा: अंक प्रायिकताएँ और एक स्लॉट सदिश $S_t$ → स्थिति $t$ पर एक LM इनपुट सदिश; $K = 5$ सॉफ्ट टोकन छिपे पहले शब्द की जगह लेते हैं'
- 'राउटर: डेटा प्रकार (छवि स्लॉट या अक्षर) के अनुसार वन-हॉट, या स्थिति विशेषताओं पर एक सीखा गया Switch top-1 सॉफ्टमैक्स'
- 'दोहराया गया $x$ ⇒ योग: MoE परत का संयोजन; हर एक्सपर्ट $Y^x$ केवल उसे भेजे गए समूह पर गणना किया जाता है'
- छोटे GPT के अगले-अक्षर लॉजिट (chain_of_thought से मॉडल अक्ष वाला einsum अटेंशन)
- प्रीफ़िक्स के बाद के पाठ पर प्रति-मॉडल हानि (nats); $M$ हानियों का योग हर मॉडल को उसका अपना ग्रेडिएंट देता है
