source_hash: 3434371fc2c6
title: जोन्स आव्यूहों से ध्रुवण
summary: 'प्रकाश का ध्रुवण एक सम्मिश्र 2-सदिश $(E_x, E_y)$ है और हर ध्रुवक या तरंग प्लेट एक सम्मिश्र $2\times 2$ आव्यूह है। प्रकाश एक तरंग प्लेट और फिर एक घूमते ध्रुवक से गुज़रता है: $\mathbf E$-क्षेत्र का दीर्घवृत्त और पारगमित तीव्रता einsum से निकलते हैं, जो मैलस का नियम दोहराते हैं और रैखिक प्रकाश को वृत्तीय में बदलते हैं।'
notes: प्रकाश निवेश कोण पर रैखिकतः ध्रुवित शुरू होता है, तीव्रता $I_0 = 1$। दाईं ओर धराशायी धूसर वक्र मैलस का नियम $I_0\cos^2\theta$ है (बिना तरंग प्लेट); नीला वक्र प्लेट के बाद गुज़रने वाला प्रकाश है। निवेश से 45° पर चतुर्थांश-तरंग प्लेट वृत्तीय प्रकाश बनाती है (समान $\lvert E_x\rvert$ और $\lvert E_y\rvert$, 90° कलांतर), इसलिए ध्रुवक के हर कोण पर $I_0/2$ गुज़रता है। $\alpha$ पर अर्ध-तरंग प्लेट रैखिक प्रकाश को $2\alpha$ घुमाती है। एक अकेला जोन्स सदिश हमेशा पूर्णतः ध्रुवित होता है; अध्रुवित प्रकाश को दो लांबिक निवेशों की तीव्रताओं के औसत से संभाला जाता है (main.py द्वारा छापी गई तीन-ध्रुवक जाँच में प्रयुक्त)।
meanings:
- 'जोन्स सदिश: $E_x$ और $E_y$ के सम्मिश्र आयाम (कलांतर आकृति तय करता है)'
- प्रयोगशाला फ्रेम को अवयव के अपने अक्षों पर घुमाता है
- कोण $\theta$ पर पारगमन अक्ष के अनुदिश क्षेत्र ही रखता है
- 'मंद अक्ष को $\Gamma$ से विलंबित करता है: $\Gamma = \pi/2$ चतुर्थांश-तरंग, $\Gamma = \pi$ अर्ध-तरंग'
- अवयवों की शृंखला (दोहराए गए $j$ का योग); प्रकाश जिससे पहले मिलता है वह दाईं ओर है
- प्रकाश को प्रकाशिकी से गुज़ारें
- 'दोहराया गया $i$ ⇒ योग: तीव्रता'
- 'एक आवर्तकाल में वास्तविक क्षेत्र: यह ध्रुवण दीर्घवृत्त बनाता है'
labels:
  plate: तरंग प्लेट
  plate_angle: प्लेट का तीव्र अक्ष $\alpha$
  input_angle: निवेश ध्रुवण कोण
