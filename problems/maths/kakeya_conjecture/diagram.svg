<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Kakeya needle problem: a unit needle turned through 180 degrees, and a Perron tree, a triangle cut into thin slivers that are slid sideways so they overlap while keeping every direction">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the needle and its half turn -->
    <circle cx="58" cy="82" r="44" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M102,82 A44,44 0 0 0 14,82" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="22" y1="100" x2="94" y2="64" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="64" y="106" font-style="italic">1</text>
    <text x="10" y="150" font-size="13">area → 0 ?</text>
    <!-- Perron tree with 8 slivers -->
    <polygon points="185.2,25.0 132.3,140.0 145.5,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="178.7,25.0 139.0,140.0 152.2,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="168.9,25.0 142.5,140.0 155.7,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="162.5,25.0 149.2,140.0 162.5,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="147.7,25.0 147.7,140.0 160.9,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="141.2,25.0 154.5,140.0 167.7,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="131.5,25.0 157.9,140.0 171.2,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <polygon points="125.0,25.0 164.7,140.0 177.9,140.0" fill="#93c5fd" fill-opacity="0.75" stroke="#1e40af" stroke-width="1"/>
    <line x1="120" y1="140" x2="232" y2="140" stroke="#374151" stroke-width="2"/>
    <text x="128" y="156" font-size="13" font-style="italic">2³ slivers, slid</text>
  </g>
</svg>
