source_hash: 7be98e686941
title: Гидростатика и плавучесть
summary: 'Давление в баке с водой растёт линейно с глубиной, $p = p_0 + \rho_w g h$. Бруски разной плотности бросают в воду одновременно (один пакетный тензор): лёгкие покачиваются и плавают, погрузившись на долю $\rho_b/\rho_w$, тяжёлые тонут и опускаются на дно.'
notes: Каждый брусок — куб со стороной $s$; выталкивающая сила $\rho_w g s^2 d_b$ равна весу вытесненной воды (Архимед) и является равнодействующей давления $p_0 + \rho_w g h$, которое сильнее давит на нижнюю грань, чем на верхнюю. Плавающий брусок устанавливается там, где выталкивающая сила уравновешивает вес, $d_b/s = \rho_b/\rho_w$ — лёд ($\rho \approx 917$) плавает, погрузившись на 92 %. Сопротивление — простое линейное затухание, пропорциональное погружённому объёму; реальное сопротивление ближе к квадратичному, а волны и присоединённая масса не учитываются. Утонувшие бруски лежат на дне.
meanings:
- сетка точек в воде, компонента $i \in \{x, z\}$
- вектор силы тяжести $(0, -g)$
- 'повторяющийся $i$ ⇒ суммирование: $g\,h$ на глубине $h = -z$'
- высота нижней грани и скорость бруска $b$
- плотность бруска $b$ — пакетный индекс
- глубина погружения, от 0 (в воздухе) до $s$ (полностью в воде)
- выталкивающая сила минус вес минус сопротивление, на единицу массы
labels:
  n_blocks: Число брусков
  rho_min: Наименьшая плотность $\rho_\text{min}$
  rho_max: Наибольшая плотность $\rho_\text{max}$
  size: Размер бруска $s$
  drag: Затухание $\gamma$
  t_max: Время моделирования
