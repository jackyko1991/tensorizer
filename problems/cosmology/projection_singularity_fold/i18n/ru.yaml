title: Сингулярности как складки проекции
summary: 'Спекулятивная гипотеза, а не установленная физика: искривлённое пространство-время есть тень поверхности в плоском пространстве более высокой размерности, а сингулярность находится там, где эта тень складывается. Сначала проверяется известная геометрия. Параболоид Фламма и вложение Фронсдала 1959 года всего пространства-времени Шварцшильда в шесть плоских измерений в точности воспроизводят метрику (autograd), а скаляр Кречмана $12r_s^2/r^6$ получается тем же автоматическим дифференцированием. Спроецированные листы складываются с универсальными показателями плотности: $-1/2$ для складки, $-2/3$ для сборки. Внутренняя область в форме складки оставляет внешнюю область в точности шварцшильдовой, так что она скрыта за горизонтом. Ничего из этого нельзя наблюдать напрямую.'
notes: 'Шаг 4 гипотезы проекции (см. описание серии), спекулятивной гипотезы автора, а не установленной физики. Шаг 1 (cosmology/projection_postulate) формулирует постулат P4: искривлённое пространство-время есть спроецированная форма плоского вложения более высокой размерности, а сингулярность находится там, где проекция складывается (её якобиан теряет ранг). Шаг 3 (cosmology/projection_dimension_budget) считает измерения, шаг 5 (cosmology/projection_bell_test) проверяет постулаты измерения, а шаг 6 (cosmology/projection_telescope_tests) рассматривает, что могут проверить телескопы. Число плоских измерений $D$ остаётся открытым: здесь это параметр, и он не входит ни в один результат. Сначала известная геометрия. (a) Фламм (1916): экваториальное сечение $t = $ const, $\theta = \pi/2$ метрики Шварцшильда, изображённое в плоском $\mathbb R^3$, есть параболоид $z = 2\sqrt{r_s(r-r_s)}$, и его индуцированная метрика $dr^2/(1-r_s/r) + r^2d\phi^2$ совпадает с точностью $10^{-16}$. (b) Фронсдал
  (Phys. Rev. 116, 778, 1959) вкладывает всё пространство-время Шварцшильда, в том числе внутри горизонта, в плоское $\mathbb R^{1,5}$. Индуцированная метрика $\eta_{AB}\partial_iz^A\partial_jz^B$, с якобианом, взятым через autograd, совпадает с метрикой Шварцшильда с точностью $10^{-13}$ снаружи и внутри, а также в координатах Крускала через горизонт. Искривлённую 4D-геометрию действительно можно рассматривать как поверхность в плоском пространстве; это опора для P4. Для P4 важны два факта. Вложение имеет полный ранг на горизонте: потеря ранга, видимая в координатах $(t, r)$, исчезает в координатах Крускала. При $r\to0$ оно тоже не складывается; оно уходит на бесконечность, $z^2\approx-2r_s^{3/2} r^{-1/2}$. Кривизна, вычисленная тем же автоматическим дифференцированием (символы Кристоффеля, тензор Римана, свёртки einsum), даёт $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ с точностью $10^{-15}$. Статические приливные собственные значения равны $+r_s/r^3$ (радиальное растяжение) и $-r_s/2r^3$ (боковое
  сжатие), и все они расходятся при $r = 0$. Утверждение P4 в конкретном виде: гладкий лист в плоском $\mathbb R^D$, видимый через проекцию, отбрасывает тень, плотность которой расходится на каустиках складки. Теория катастроф (Том, Арнольд) утверждает, что показатель универсален. Отображение $x = s^n$ даёт $\rho\propto|x|^{1/n-1}$, измеренное как $-0.500$ (складка), $-0.667$ (сборка) и $-0.750$ ($n = 4$). Сфера $S^k$, спроецированная на $\mathbb R^3$, имеет плотность у края $u^{(k-3-1)/2}$, измеренную как $-0.51$, $0.00$, $+0.45$ для $k = 3, 4, 5$ при любом $D$. Итак, для пика плотности нужен лист ровно с таким же числом измерений, как у экрана; более толстый лист даёт гладкую тень. Анимация наклоняет волнистый лист, пока он не сложится, при $a\tan\alpha > 1$. Сравнение с ОТО: придадим массе $M = r_s/2$ плотность тени 3-сферы, $\rho\propto(1-r^2/R^2)^{-1/2}$; это карикатура слабого поля, а не решение уравнений Эйнштейна. Вне $R$ поле в точности равно $r_s/r^3$ (теорема Биркгофа, теорема
  об оболочке), а центр остаётся конечным. Расходимость перемещается на оболочку складки и смягчается до $(R-r)^{-1/2}$ для плотности и приливного поля, а индикатор кривизны $8\sum E^2$ до $(R-r)^{-1}$, вместо $r^{-3}$ и $r^{-6}$ в ОТО. Сам лист сохраняет конечную кривизну $1/R^2$. Вердикт, честно. P4 может оставить неизменной строго проверенную внешнюю геометрию Шварцшильда и менять только внутреннюю область, но именно это делает её непроверяемой: при $R < r_s$ складка находится за горизонтом, и никакой сигнал от неё до нас не доходит. Универсальные показатели новы лишь как описание, поскольку ничто вне горизонта от них не зависит. Складка вне горизонта ($R > r_s$) была бы компактным объектом без горизонта с иными фотонными кольцами и эхом; именно это шаг 6 проверяет по теням чёрных дыр. Контекст: fluids/blowup_profile_search показывает, как сингулярные профили и их показатели изучаются на практике (автомодельный анзац, поиск показателя). Википедия: метрика Шварцшильда, теория катастроф.'
meanings:
- якобиан вложения через автоматическое дифференцирование, по одному на точку выборки $b$
- 'индуцированная метрика: по повторяющимся индексам вложения $A, C$ ведётся суммирование с плоской метрикой $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$'
- дополнительная координата вложения, сумма Гаусса–Лежандра по 64 узлам по $q$ при $\ell = \ln s$, дифференцируемая по $r$; она уходит в $-\infty$ как $r^{-1/2}$
- 'наименьшее сингулярное число: складка отображения находится там, где оно достигает 0 и якобиан теряет ранг'
- символы Кристоффеля из autograd-производной метрики; по $d$ ведётся суммирование
- тензор Римана из второй производной в прямом режиме и двух произведений einsum (суммирование по $e$)
- скаляр Кречмана, суммирование по всем четырём индексам; равен $12r_s^2/r^6$ внутри и вне горизонта
- плотность тени однородного листа при $x = s^n$ (складка $n = 2$, сборка $n = 3$), гистограмма по логарифмическим интервалам
- ньютоновский приливный тензор массы, распределённой как тень 3-сферы радиуса $R$ (карикатура слабого поля)
labels:
  fold_radius: Радиус $R$ оболочки складки
  sheet_amplitude: Амплитуда $a$ волнистого листа
  D: Плоская размерность $D$, вмещающая сферические листы (открыта)
