source_hash: 7be6ce46bf01
title: 黑體輻射
summary: 普朗克定律給出熱輻射在每個波長的能量密度。把溫度行向量對波長列向量廣播，一行程式就建立整張 $(T, \lambda)$ 光譜表；argmax 找出維恩峰值，torch.trapezoid 對光譜積分得到史特凡–波茲曼 $T^4$ 定律。
notes: 波長網格為從 10 nm 到 100 µm 的對數網格，範圍夠寬，缺少的尾端對積分的影響小於 $10^{-5}$；計算以 float64 並使用 expm1 以確保精度。維恩常數 $b \approx 2.898\times 10^{-3}$ m·K 由 argmax 求得，精度受網格解析度限制（約 0.2 %）。曲線顏色取光譜在代表紅、綠、藍的三個波長上的值——這只是真正配色計算的粗略替代，但可看出光芒從橙色經白色變為淡藍色。圖表每格重新縮放：峰值高度按 $T^5$ 增長。陰影帶標示可見光範圍 380–750 nm。
meanings:
- 一批溫度，排成行向量
- 波長網格，排成列向量
- 行向量對列向量廣播，填滿整張表
- 一次求出每條光譜的維恩峰值
- 重複的 $b$ ⇒ 求和：總能量密度，$\propto T_a^4$
- 610、550 與 465 nm 處的普朗克值，歸一化後：粗略的可見顏色
labels:
  T_min: 起始溫度
  T_max: 結束溫度
  n_temps: 溫度數（影格數）
