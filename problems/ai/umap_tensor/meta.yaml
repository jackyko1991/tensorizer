  n_epochs: {default: 500, min: 50, max: 1000, step: 50, type: int, label: 'Layout epochs'}
  neg_rate: {default: 5, min: 1, max: 15, step: 1, type: int, label: 'Negative samples per edge sample'}
  n_mnist: {default: 2500, min: 500, max: 2500, step: 500, type: int, label: 'MNIST images (balanced over digits)'}
  seed: {default: 0, min: 0, max: 9, step: 1, type: int, label: 'Random seed'}
