source_hash: f0ace6f81d9f
title: ミニ AlphaGo：$5\times5$ の碁盤での木探索
summary: 小さな碁盤で自己対局を一局打ち、各手を AlphaGo が用いたのと同じ探索で選ぶ：PUCT 則によるモンテカルロ木探索である。囲碁のルールそのものがテンソル演算になる：石を取ることと地の計算（エリア計算）はどちらも塗りつぶし（フラッドフィル）で、1 ステップごとに碁盤の隣接行列との einsum を一回行う。新しい局面はそれぞれ、同時に打たれる一まとまりのランダム対局で評価される。探索が信じる手に訪問回数が集中していく様子を見てみよう。
notes: 各シミュレーションは PUCT の最大値を選びながら木を下り、新しい局面を一つ加え、それをランダムなプレイアウトのバッチで評価し、その結果を経路上のすべての手に加える。良い手ほど訪問回数を集めるので、探索はすべての変化を調べることなく重要な所に集中する。AlphaGo も同じループを使ったが、一様な事前分布 $P_a$ をポリシーネットワークに、ランダムなプレイアウトをバリューネットワークに置き換え、どちらも棋譜で学習させた。AlphaGo Zero は両方を自己対局だけで学習した。$5\times5$ では天元の初手が黒にとって強力である。シミュレーション回数が少ないと探索は目に見える誤りを犯し、回数を増やすと対局はより鋭くなるが遅くなる。ルール：Tromp–Taylor（自殺手は自分の石の連を取り除く、エリア計算）と簡単なコウの判定。
meanings:
- 碁盤の点 $p$：$+1$ 黒、$-1$ 白、0 空点
- グラフとしての碁盤：$p$ と $q$ が縦または横に隣接するとき 1
- 塗りつぶし：空点からある色を通って広げると、ダメのある連が見つかる。残りは取られる
- エリア計算：石の数とその色だけが到達できる空点の数、黒から白とコミ $k$ を引く
- $R$ 局のランダム対局を一つの $(R, n^2)$ テンソルとして打つ。黒の平均結果。自分の眼は決して埋めない
- PUCT：価値 $Q_a$ に、手 $a$ が訪問されるほど小さくなる探索ボーナスを足したもの。一様な事前分布 $P_a$
- 全シミュレーション後の訪問回数（最後の要素：パス）。最も多く訪問された手を打つ
labels:
  board_size: 碁盤のサイズ $n$
  simulations: 1 手あたりのシミュレーション数
  rollouts: 葉ごとのランダムプレイアウト数 $R$
  c_puct: 探索係数 $c$
  komi: コミ $k$
