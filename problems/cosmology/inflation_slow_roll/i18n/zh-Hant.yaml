source_hash: 157106563a38
title: 慢滾暴脹與 (n_s, r) 平面
summary: 五種暴脹子位勢（$m^2\phi^2$、$\lambda\phi^4$、Starobinsky $R^2$、自然暴脹、四次山頂模型）在單一批次張量中依弗里德曼方程與克萊因–戈登方程演化，以 e 摺數 $N = \ln a$ 作為時鐘。慢滾參數 $\epsilon$、$\eta$ 以及在 $N_* = 50$–$60$ 處的預測 $n_s$ 與 $r$ 以精確背景解驗證，並與 Planck 2018 及 BICEP/Keck 2021 對照：$m^2\phi^2$ 與 $\lambda\phi^4$ 不受青睞，Starobinsky 則落在允許區域內。暴脹是初始條件的主流解釋，但尚未獲得證實：原初 B 模式尚未被探測到。
notes: 單位：約化普朗克質量 $M_\mathrm{pl} = 1$。以 $N = \ln a$ 為時間改寫方程，令 $\psi = d\phi/dN$、$\epsilon_H = \psi^2/2$，可得 $d\psi/dN = -(3-\epsilon_H)(\psi + V'/V)$ 與 $H^2 = V/(3-\epsilon_H)$，因此只有 $V'/V$ 重要，每個位勢都以高度 1 繪出（振幅 $A_s = 2.1\times10^{-9}$ 接著決定能量尺度，以 $V_*^{1/4}$ 列出，多數模型約為 $10^{16}$ GeV）。每個場都從其結束前約 68 個 e 摺處出發，起點由教科書的慢滾計數給出，初速取慢滾速度 $\psi = -V'/V$；測試讓 $m^2\phi^2$ 以截然不同的初速出發，發現它們都在幾個 e 摺內落到同一條曲線上：慢滾是吸引子。暴脹在 $\epsilon_H = 1$ 處結束。預測值計算兩次：由位勢的一階結果（$n_s = 1 - 6\epsilon_V + 2\eta_V$、$r = 16\epsilon_V$，即 × 標記），以及由數值背景的哈伯流參數 $\epsilon_{1,2,3}$ 的二階結果（Stewart and Lyth 1993；Schwarz, Terrero-Escalante and García 2001；即圓點）；兩者相差 $O(\epsilon^2)$，約數個 $10^{-4}$（就 $n_s$ 而言）。此處並未逐模求解完整的 Mukhanov–Sasaki 方程。$N_* = 55$ 時的結果：$m^2\phi^2$ 給出 $n_s \approx 1 - 2/N_*$、$r \approx 8/N_* \approx 0.14$；$\lambda\phi^4$ 給出 $r \approx 0.29$，且 $n_s$ 過紅；Starobinsky 給出 $n_s \approx 0.965$、$r \approx 12/N_*^2 \approx 0.004$；自然暴脹（$f = 7$）給出 $r \approx 0.08$，超出上限；四次山頂模型（$\mu = 15$）落在區域內。觀測區域以方框表示（Planck 2018 $n_s = 0.9649 \pm 0.0042$，68
  %，TT,TE,EE+lowE+lensing；BICEP/Keck 2021 $r_{0.05} < 0.036$，95 %），而非已發表的二維等高線，後者略微傾斜且取決於數據組合。誠實的現況：暴脹解釋了平坦性、視界問題，以及近乎尺度不變、高斯、絕熱的擾動，而且 $n_s < 1$ 在被量測之前就已被預測；但也存在競爭理論（反彈與火劫模型），暴脹子尚未被確認，而確鑿證據——由重力波產生的原初 B 模式偏振——尚未被探測到（BICEP2 在 2014 年的宣稱最終證實是銀河系塵埃）。試著把 $N_*$ 設在 50 到 60 之間（取決於宇宙如何再加熱），或改變 $f$ 與 $\mu$：在 $N_* = 55$ 時自然暴脹永遠進不了方框，因為降低 $f$ 雖使 $r$ 下降，卻讓 $n_s$ 過紅（$f = 5$：$n_s \approx 0.950$、$r \approx 0.04$）。
meanings:
- one-hot 列：場 $b$ 使用位勢 $p$
- 在每個場上計算的五種位勢形狀
- 重複的 $p$ ⇒ 求和：每個場各自的位勢
- 場與 $d\phi/dN$，以 e 摺為步長用 RK4 一同推進
- 背景唯一需要的量：$V$ 的高度被消去
- 以自動微分求 $V'$ 與 $V''$
- $\epsilon_H$ 向上穿過 1 之處，即 $\ddot a$ 變號
- 結束前 $N_*$ 個 e 摺處的哈伯流參數，以一次 gather 取得
- 由精確背景得到的二階預測
labels:
  N_star: 結束前的樞紐 e 摺數 $N_*$
  f: 自然暴脹尺度 $f$
  mu: 山頂寬度 $\mu$
