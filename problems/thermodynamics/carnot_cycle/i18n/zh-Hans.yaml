source_hash: 539b278aa207
title: 理想气体的卡诺循环
summary: 理想气体的两条等温线和两条绝热线，取样为 $(V, p)$ 点的张量。功是 $p$–$V$ 图中围成的面积，用 torch.trapezoid 计算，效率 $W/Q_h$ 恰好等于卡诺极限 $1 - T_c/T_h$。
notes: 热量只在等温过程中穿过边界：吸热 $Q_h = nRT_h\ln(V_2/V_1)$，放热 $Q_c = nRT_c\ln(V_3/V_4)$。由于绝热线把体积比联系起来，$V_3/V_4 = V_2/V_1$，这就是效率只取决于两个温度的原因。压缩过程朝 $V$ 减小方向进行，所以 torch.trapezoid 自动给出负功。在 $T$–$S$ 图中循环是一个矩形，其面积也等于 $W$。体积从 $V_1 = 1$ 升开始。
meanings:
- 循环第 $l$ 段上的第 $k$ 个采样点（$l$ = 高温等温、绝热、低温等温、绝热）
- 等温线，对体积张量逐元素计算
- 通过循环某一顶点的绝热线
- 重复的 $k$ ⇒ 求和：每段过程的功
- 对各段 $l$ 求和：围成的面积
- 沿路径的熵，用于 $T$–$S$ 图
labels:
  T_h: 高温热源 $T_h$
  T_c: 低温热源 $T_c$
  ratio: 膨胀比 $V_2/V_1$
  n: 物质的量
  gas: 气体
