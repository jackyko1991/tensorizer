<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Szilard engine: a box of width 2a with one Brownian particle; a demon reads which half it is in and slides the partition at p to extract work, in contact with a heat bath at temperature T">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- heat bath -->
    <rect x="20" y="118" width="200" height="16" fill="#93c5fd" opacity="0.5"/>
    <text x="196" y="131" font-size="12" font-style="italic">T</text>
    <!-- box -->
    <rect x="30" y="50" width="180" height="68" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="120" y1="50" x2="120" y2="118" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- partition at p, sliding right -->
    <rect x="146" y="50" width="5" height="68" fill="#374151"/>
    <text x="141" y="45" font-style="italic">p</text>
    <line x1="156" y1="84" x2="186" y2="84" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- particle and its random walk -->
    <path d="M70,92 l8,-10 l6,12 l9,-6 l5,9" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <circle cx="98" cy="97" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- the demon's eye and measurement -->
    <ellipse cx="60" cy="24" rx="13" ry="8" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="62" cy="25" r="3.5" fill="#374151"/>
    <line x1="66" y1="33" x2="92" y2="86" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="80" y="25" fill="#b45309" font-style="italic">m</text>
    <!-- width labels -->
    <text x="28" y="152" font-size="12">0</text>
    <text x="112" y="152" font-size="12" font-style="italic">a</text>
    <text x="198" y="152" font-size="12" font-style="italic">2a</text>
  </g>
</svg>
