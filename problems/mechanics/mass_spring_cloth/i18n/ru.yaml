source_hash: 6bb6cb4a204f
title: Ткань из масс и пружин
summary: 'Квадратная сетка точечных масс, соединённых структурными, сдвиговыми и изгибными пружинами, закреплена в двух углах и отпущена под действием силы тяжести. Матрица инцидентности $D_{ea}$ превращает сетку в тензоры: один einsum даёт векторы всех пружин, другой складывает силы на каждом узле.'
notes: Сдвиговые пружины по диагоналям не дают квадратам схлопнуться в ромбы, а пружины через один узел придают ткани изгибную жёсткость. Два закреплённых угла просто получают нулевое ускорение. Сопротивление воздуха $\gamma$ — единственный источник потерь, поэтому полная энергия может только убывать ($dE/dt = -m\gamma\lvert\mathbf v\rvert^2$), а при $\gamma = 0$ сохраняется. Пружины жёсткие, поэтому шаг по времени привязан к $\sqrt{m/k}$. Самопересечения не учитываются. Масса каждого узла 10 г, шаг сетки 10 см.
meanings:
- положение узла $a$; $N = n^2$ масс
- 'матрица инцидентности: $-1$ / $+1$ на двух концах пружины $e$'
- 'повторяющийся $a$ ⇒ суммирование: вектор вдоль каждой пружины'
- текущие длины пружин; $\ell^0_e$ — длины в покое
- 'повторяющийся $e$ ⇒ суммирование: результирующая сила пружин на узел $a$'
- та же сумма в виде scatter по списку рёбер
- кинетическая + упругая + гравитационная энергия
labels:
  n_side: Масс на сторону
  k: Жёсткость пружины $k$
  damping: Сопротивление воздуха $\gamma$
  t_max: Время моделирования
