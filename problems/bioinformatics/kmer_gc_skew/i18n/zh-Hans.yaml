source_hash: 48f29505ec48
title: k-mer、GC 含量与 GC 偏斜
summary: DNA 序列被表示为独热 $(L, 4)$ 张量。统计每个长度为 $k$ 的词只需对展开的窗口做一次 einsum（一维卷积），GC 含量与 GC 偏斜是窗口求和，而累积偏斜的最小值指出复制起始的位置——这里用的是一条植入了起点和终点的合成环状染色体。
notes: 大多数细菌染色体是环状的，从单一复制起点开始复制，两个复制叉沿相反方向前进，直到在终点相遇。两半的复制方式不同（一条链作为前导链连续合成，另一条分段合成），在进化时间尺度上，前导链往往积累略多于 C 的 G。这里植入了这种偏好：从起点到终点，G 以因子 $(1+\text{skew})/(1-\text{skew})$ 受偏好，另一半则偏好 C。单个窗口的偏斜带有噪声，但累积和 $S_n$ 一路下降到起点、一路上升到终点，因此即使偏好只有几个百分点，其最小值和最大值也很突出。真实基因组也呈现同样的 V 形，只是不那么清晰，因为基因、重复序列和重排会带来各自的组成。内环上的两段低 GC 区域模仿基因组岛，即从别处获得、往往保持不同碱基组成的 DNA。$k$-mer 谱是基因组组装以及许多免比对比较的起点；对这个随机基因组，其颜色只是跟随 GC 含量。试试更小的偏斜、更小的基因组或更大的 $k$（词更多，每个词的计数更少）。
meanings:
- 位置 $n$、字母 $a$ ∈ (A, C, G, T)：碱基为 $a$ 处为 1
- 每个 $k$ 个字母的窗口，不复制内存
- $a \cdot 4^{k-1-j}$：把词当作四进制数读取（AAA = 0, …, TTT = $4^k-1$）
- 重复的 $j$ 和 $a$ ⇒ 求和：从 $n$ 开始的 $k$-mer 的索引
- $k$-mer 谱；计数总和为 $L-k+1$
- 重复的 $i$ ⇒ 求和：长 $\ell$ 个碱基的窗口 $w$ 中的碱基计数，每隔 $\Delta = \ell/2$ 一个窗口
- $(n_G + n_C)/\ell$ 与 $(n_G - n_C)/(n_G + n_C)$
- $c = (0, -1, +1, 0)$：G 减 C 的累积计数；argmin = 起点，argmax = 终点
labels:
  length_kb: 基因组长度 $L$
  k: 词长 $k$
  window: 窗口 $\ell$
  origin: 植入的起点（占基因组的比例）
  skew: 链偏好（偏斜）
  gc: GC 含量
  seed: 随机种子
