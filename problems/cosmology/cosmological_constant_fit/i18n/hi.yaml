source_hash: 73d953345169
title: सुपरनोवा से ब्रह्मांडीय स्थिरांक का फ़िट
summary: 'खुले Pantheon+ संकलन के 1466 असली Ia प्रकार के सुपरनोवा को पदार्थ $\Omega_m$, ब्रह्मांडीय स्थिरांक $\Omega_\Lambda$ और वक्रता वाले फ़्रीडमान ब्रह्मांड से फ़िट किया जाता है। एक बैच $\chi^2$ हज़ारों ब्रह्मांडों को हर सुपरनोवा पर एक साथ आँककर $\Omega_m$–$\Omega_\Lambda$ विश्वास-रेखाएँ खींचता है, जबकि Adam और ऑटोग्रैड केवल-पदार्थ ब्रह्मांड से सर्वश्रेष्ठ फ़िट तक चलते हैं। दूर के सुपरनोवा मंद होते ब्रह्मांड की अपेक्षा अधिक धुँधले हैं: $q_0 < 0$, प्रसार त्वरित हो रहा है।'
notes: '1998 में दो टीमों, Supernova Cosmology Project (Perlmutter आदि) और High-z Supernova Search Team (Riess आदि; Schmidt), ने पाया कि दूर के Ia प्रकार के सुपरनोवा, जो मानकीकरण योग्य दीप हैं, मंद होते ब्रह्मांड की अनुमति से अधिक धुँधले दिखते हैं: प्रसार त्वरित हो रहा है, जिसके लिए सामान्य सापेक्षता में ब्रह्मांडीय स्थिरांक $\Lambda$ (डार्क ऊर्जा) जैसी किसी चीज़ की ज़रूरत है। इस खोज को 2011 का भौतिकी नोबेल पुरस्कार मिला। यहाँ वही परीक्षण आज के आँकड़ों पर चलता है। बायाँ पैनल हर दूरी मापांक में से एक खाली, एकसमान फैलते ब्रह्मांड ($\Omega_m = \Omega_\Lambda = 0$) का मापांक घटाकर दिखाता है: केवल-पदार्थ ब्रह्मांड (लाल) दूर के सुपरनोवा को अधिक चमकीला (शून्य से नीचे) बनाता, पर आँकड़े ऊपर हैं। दायाँ पैनल बैच ग्रिड से 1, 2 और 3$\sigma$ क्षेत्र ($\Delta\chi^2 = 2.30, 6.18, 11.83$) दिखाता है, साथ में समतल रेखा, त्वरण और मंदन को अलग करने वाली रेखा $q_0 = 0$, और “बिग बैंग रहित” कोना जहाँ आँकड़ों की सीमा में $E^2$ ऋणात्मक हो जाता है। इन विकर्ण त्रुटियों से फ़िट $\Omega_m \approx 0.30 \pm 0.07$, $\Omega_\Lambda
  \approx 0.57 \pm 0.10$ देता है (समतल: $\Omega_m \approx 0.35 \pm 0.02$), और $\Omega_\Lambda \le 0$ लगभग $5.5\sigma$ पर अस्वीकृत होता है ($\sigma = \sqrt{\Delta\chi^2}$, अस्वीकृत पक्ष के सर्वश्रेष्ठ मॉडल के सापेक्ष)। $H_0$ सुपरनोवा के निरपेक्ष कांतिमान के साथ अपभ्रष्ट है; छपा मान ($\approx 73$ km/s/Mpc) इन $\mu$ में निहित SH0ES सेफ़िड अंशांकन से आता है और कोई स्वतंत्र माप नहीं है (CMB मान $\approx 67$ से “हबल तनाव” एक खुला प्रश्न है)। आँकड़े: Pantheon+ दूरी मापांक (Scolnic et al. 2022, ApJ 938, 113; Brout et al. 2022, ApJ 938, 110), github.com/PantheonPlusSH0ES/DataRelease से (फ़ाइल Pantheon+SH0ES.dat; बिना घोषित लाइसेंस के शोध हेतु जारी, शोधपत्र CC BY 4.0 के तहत खुली पहुँच में हैं; कृपया उन्हें उद्धृत करें)। रखे गए: $z > 0.01$ के लिए zHD, MU_SH0ES और MU_SH0ES_ERR_DIAG, अंशांकन सेफ़िड वाली मेज़बान आकाशगंगाएँ हटाई गईं, प्रति सुपरनोवा एक पंक्ति। आपकी अपनी तालिका भी चलेगी: z, mu, sigma_mu स्तंभों वाली कोई भी CSV (load_distance_moduli देखें)। सरलीकरण: केवल विकर्ण त्रुटियाँ ली गई हैं, Pantheon+
  का पूरा सांख्यिकीय + व्यवस्थित सहप्रसरण नहीं ($\chi^2/\mathrm{dof} \approx 0.44$ दिखाता है कि ये त्रुटियाँ सतर्क हैं, जबकि सहसंबद्ध व्यवस्थित त्रुटियों की उपेक्षा रेखाओं को कुछ आशावादी बना देती है); डार्क ऊर्जा शुद्ध स्थिरांक है ($w = -1$); विकिरण की उपेक्षा की गई है।'
meanings:
- सुपरनोवा $i$ का रक्तविस्थापन, दूरी मापांक और त्रुटि, इन स्तंभों वाली किसी भी CSV से
- उम्मीदवार ब्रह्मांड; $(A,1,1)$ और $(1,B,1)$ के रूप में ब्रॉडकास्ट
- सभी ब्रह्मांडों के लिए हर नोड $z_k$ पर प्रसार दर एक साथ
- अंतिम अक्ष के साथ $1/E$ का संचयी समलंब नियम
- सुपरनोवा रक्तविस्थापनों तक घन हर्मिट अंतर्वेशन (ढाल $1/E$ ज्ञात)
- खुले, समतल या बंद आकाश के लिए $\sinh$, तत्समक या $\sin$
- '$i$ पर योग: हर ब्रह्मांड का सर्वश्रेष्ठ $H_0$ एक विश्लेषणात्मक भारित माध्य है'
- भार $w_i = 1/\sigma_i^2$ के साथ $i$ पर योग
- समाकल से होकर ऑटोग्रैड, Adam और L-BFGS द्वारा प्रयुक्त
- $\chi^2$ की वक्रता से फ़िट प्राचलों का सहप्रसरण
