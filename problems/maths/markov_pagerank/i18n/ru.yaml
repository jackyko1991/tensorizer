source_hash: 9576f7bf38f3
title: Цепи Маркова и PageRank
summary: Случайный пользователь переходит по ссылкам маленькой синтетической паутины и время от времени перескакивает на случайную страницу. Вероятность находиться на каждой странице эволюционирует на одно произведение матрицы на вектор за клик, а её стационарное распределение — это PageRank, найденный здесь степенным методом, через спектральное разложение и с помощью тысяч одновременно моделируемых пользователей.
notes: '$S$ стохастична по столбцам, поэтому переводит векторы вероятностей в векторы вероятностей, но в веб-графе есть страницы без исходящих ссылок и группы страниц, которые запирают пользователя. Висячим страницам даётся равномерный столбец (пользователь вводит случайный адрес), а член телепортации делает каждый элемент $G$ положительным. По теореме Перрона–Фробениуса стационарное распределение тогда единственно, положительно и достигается из любого начального состояния. Каждое другое собственное значение $G$ равно $d$, умноженному на собственное значение $S$, поэтому $|\lambda_2| \le d$, и степенной метод сходится не медленнее $d^k$. Правая панель показывает пакет коэффициентов затухания, решаемых вместе. При $d = 0.85$ (значение, предложенное Брином и Пейджем, 1998) 50 шагов уменьшают ошибку как минимум в $0.85^{50} \approx 3\times10^{-4}$ раз, каким бы ни был размер паутины. Пользователи — оценка той же цепи методом Монте-Карло: их доли следуют за $\mathbf x_k$ с шумом порядка $1/\sqrt
  W$, а усреднение по времени даёт ранги, согласующиеся со степенным методом. Если убрать исправление для висячих страниц, вероятность утекает, как показывает терминал. Попробуйте $d \to 1$, чтобы увидеть, как сходимость замедляется, а ранги скапливаются в замкнутых группах страниц.'
meanings:
- '1, если страница $j$ ссылается на страницу $i$: столбцы — страницы, которые пользователь покидает'
- 'суммирование по $i$: число исходящих ссылок страницы $j$'
- переход по случайной ссылке; висячая страница ($d_j = 0$) получает равномерный столбец $1/N$
- матрица Google для пакета коэффициентов затухания $d_b$; $1 - d$ — вероятность телепортации
- 'повторяющийся $j$ ⇒ суммирование: один шаг степенного метода для всех $d_b$ сразу'
- собственный вектор с собственным значением 1, нормированный на сумму 1; $G$ несимметрична, поэтому eig, а не eigh
- 'модуль второго по величине собственного значения: ошибка уменьшается в это число раз за шаг, и $|\lambda_2| \le d$'
- 'страница каждого из $W$ пользователей: переход по ссылке с вероятностью $d$, иначе телепортация'
labels:
  damping: Коэффициент затухания $d$
  pages: Страницы $N$
  dangling: Висячие страницы
  walkers: Случайные пользователи $W$
  iterations: Шаги
  seed: Зерно графа
