source_hash: 63ac7ba591c6
title: 'Una partícula vista muchas veces: cortar una sola línea de universo'
summary: 'Una hipótesis especulativa, no física establecida: cada electrón es el mismo objeto, una única línea de universo que zigzaguea hacia delante y hacia atrás en el tiempo (el universo de un solo electrón de Wheeler, 1940). Un corte temporal la atraviesa muchas veces: los cruces hacia delante parecen electrones, los cruces hacia atrás, positrones. Este paso corta lotes de líneas de universo aleatorias. Todos los electrones salen exactamente idénticos, y se crean y aniquilan pares en los puntos de retroceso. Pero una línea de universo cerrada cruza cada corte tantas veces hacia atrás como hacia delante, y una abierta añade como mucho una partícula neta, mientras que el universo contiene unos $10^{80}$ bariones y casi nada de antimateria. En su forma más simple, la idea queda descartada.'
notes: 'Estado: especulativo; descartada en su forma más simple. Paso 2 de la hipótesis de proyección (la idea especulativa propia del autor, véase la descripción de la serie; no física establecida), para el postulado P3: todas las partículas son proyecciones de un único objeto. El paso 1 (cosmology/projection_postulate) enunció los postulados; el paso 3 (cosmology/projection_dimension_budget) cuenta las dimensiones que necesitan. Primero la física conocida. En una llamada telefónica en 1940, John Wheeler le sugirió a Richard Feynman que todos los electrones son idénticos porque son un solo electrón, cuya línea de universo va hacia delante y hacia atrás en el tiempo; un tramo hacia atrás es un positrón. Feynman contó la historia en su conferencia Nobel de 1965, junto con su propia objeción: no hay tantos positrones como electrones. Wheeler sugirió que podrían estar escondidos en los protones. La idea de que un positrón es un electrón que va hacia atrás en el tiempo sobrevivió como la imagen
  de Feynman–Stueckelberg de las antipartículas (Feynman, Phys. Rev. 76, 749, 1949), pero el universo de un solo electrón no: en teoría cuántica de campos todos los electrones son idénticos porque son excitaciones de un único campo. Aquí la línea de universo vive en un espacio de $D$ dimensiones ($D$ es un parámetro, nunca fijado en 4); para los cortes solo importa su coordenada temporal, como dice P2. La predicción de la hipótesis: un corte temporal (P2) atraviesa la línea de universo en $N_+$ cruces hacia delante y $N_-$ hacia atrás. Lo que se calcula: lotes de líneas de universo suaves (Fourier aleatorio, $K$ armónicos, amplitudes $\propto k^{-\beta}$) y rugosas (brownianas), cerradas o abiertas, cortadas por $L$ cortes. Los cruces se cuentan mediante una dispersión (scatter) en un arreglo de diferencias y se comprueban frente a una tabla de fuerza bruta. Para un lazo cerrado $N_+ = N_-$ en cada corte; para uno abierto $Q = N_+ - N_-$ es igual a $[t_{end}\geq u] - [t_{start}\geq u]$,
  así que $|Q|\leq 1$ y $N\equiv Q$ (mod 2). Inclinar el corte (un observador en movimiento) no cambia $Q$. El recuento total es igual a $2(\#\text{minima} - \#\text{maxima})$ por debajo del corte, así que los pares nacen en los mínimos de $t(s)$ y mueren en los máximos. El recuento medio de lazos suaves aleatorios sigue la fórmula de Rice. Lo que acierta gratis: cada cruce lee la masa y la carga de la misma línea de universo, así que todos los electrones son exactamente iguales, y los positrones tienen exactamente la carga opuesta y la misma masa (PDG 2024: $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$). La prueba frente a los datos (data/*.csv, números citados): AMS-02 midió la fracción de positrones de los rayos cósmicos $e^+/(e^+ + e^-)$ desde 0.5 GeV hasta 1 TeV (Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0, 74 intervalos a través de la base de datos CRDB): 0.13 a 0.6 GeV, un mínimo de 0.053 cerca de 8 GeV y de 0.15 a 0.16
  por encima de 200 GeV. Así que la asimetría $1 - 2f$ está entre 0.67 y 0.89, frente a $0$ para un lazo cerrado. A escalas cósmicas, la densidad bariónica de Planck 2018 $\Omega_b h^2 = 0.0224$ da $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (véase cosmology/baryon_asymmetry). Con 411 fotones por cm$^3$ en una esfera de radio 46.5 mil millones de años luz, esto da $N_B\approx 9\times10^{79}$ bariones, y la antimateria está ausente (BESS-Polar: antihelio/helio por debajo de $6.9\times10^{-8}$; Cohen, De Rújula y Glashow 1998: ningún dominio de antimateria en el universo visible). Una sola línea de universo da como mucho $|Q|/N = 1/N$, que es $7\times10^{-90}$ cuando $N\approx 1.5\times10^{89}$, frente a $\eta = 6\times10^{-10}$; la carga neta se queda corta por un factor de unos $10^{80}$. Un barrido de los parámetros libres (suave o browniana, cerrada o abierta, de 2 a 32 armónicos, tres rugosidades, unos $3\times10^5$ cortes con $N\geq 2$) no encuentra ninguna configuración que alcance la
  asimetría de AMS-02, y la cota muestra que ninguna puede: con $N\geq 2$ cruces, la mayor asimetría posible es $1/3$ (en $N = 3$). Veredicto: descartada en su forma más simple. Extensiones, cada una una suposición adicional y señalada como tal: (A) una línea de universo abierta añade una partícula neta, no más. (B) Una proyección sesgada, en la que los observadores ven las antipartículas con eficiencia $r$, requiere $r = f/(1-f)$ entre 0.056 y 0.195, variable con la energía, según AMS-02, pero $r < 7\times10^{-8}$ según el antihelio. La antimateria oculta pesaría entonces tanto como los bariones visibles, unos 0.19 de la materia oscura. Es el «escondido en los protones» de Wheeler en forma moderna; necesita un mecanismo, y no se da ninguno. (C) Si el tiempo fuera un círculo, un lazo que diera $w$ vueltas llevaría una carga neta $Q = w$ en cada corte (comprobado), pero $w\approx 10^{80}$ tendría que introducirse a mano, y un tiempo compacto implica curvas temporales cerradas. Ninguna de
  ellas es una predicción. Lo que reviviría la idea es un mecanismo que haga asimétrico el recuento por corte de un único objeto, y esa es la pregunta abierta que este paso deja a la serie. Vía de escape: la versión simple queda descartada, pero una línea de universo equilibrada globalmente, con la antimateria más allá de nuestro horizonte o en un antiuniverso espejo CPT, no lo está. El paso 7 (cosmology/projection_antimatter_universe) enumera los criterios que debe cumplir tal universo de antimateria y contrasta cada uno con los datos.'
meanings:
- '$k$ (armónico) y $c$ (cos, sin) repetidos ⇒ sumados: $B$ líneas de universo aleatorias en $D$ dimensiones; la coordenada 0 es el tiempo'
- cruces hacia delante (partícula) y hacia atrás (antipartícula) de cada corte; la suma sobre los segmentos $s$ es una dispersión en un arreglo de diferencias más una suma acumulada
- carga neta en el corte; igual al número de cruce de los dos extremos, $0$ para un lazo cerrado
- 'el mismo recuento solo a partir de los puntos de retroceso: los mínimos crean pares, los máximos los aniquilan'
- fórmula de Rice con los momentos espectrales $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$
- asimetría de carga de los $e^\pm$ de los rayos cósmicos a partir de la fracción de positrones $f_E$ de AMS-02 a la energía $E$
- número bariónico neto que tendría que llevar una sola línea de universo ($\eta$ de Planck 2018)
labels:
  worldlines: Líneas de universo en el lote $B$
  samples: Muestras a lo largo de cada línea de universo $S$
  modes: Armónicos por coordenada $K$ (con qué frecuencia puede zigzaguear)
  roughness: 'Rugosidad $\beta$: el armónico $k$ tiene amplitud $\propto k^{-\beta}$'
  dims: Dimensiones $D$ del espacio en que vive la línea de universo (libre)
  slices: Cortes temporales $L$
