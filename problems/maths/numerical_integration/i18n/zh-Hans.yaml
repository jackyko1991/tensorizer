source_hash: 9e25d7739db7
title: 数值积分与收敛阶
summary: 梯形法则、辛普森法则和高斯–勒让德求积都是加权和 $\sum_k w_k f(x_k)$，一次 einsum 同时作用于多个被积函数。高斯节点和权重来自一个本征值问题（Golub–Welsch）。在双对数坐标上，误差以斜率 2 和 4 下降，或呈指数下降，直到折点或奇点使高阶精度丧失。
notes: 对光滑的被积函数，梯形法则的误差按 $h^2 \propto N^{-2}$ 下降，辛普森法则按 $N^{-4}$ 下降：$N$ 加倍使误差分别除以 4 和 16。$N$ 个节点的高斯–勒让德求积能精确积分所有次数不超过 $2N - 1$ 的多项式，因此对解析函数其误差呈指数下降，直到达到 $10^{-16}$ 附近的 float64 舍入误差。这些阶来自泰勒展开，因此需要导数存在。对于折点 $|x - a|$，二阶导数是一个尖峰：每个跨越折点的求积规则在那里产生 $O(h^2)$ 的误差，所以辛普森和高斯退回到 2 阶（曲线呈锯齿状，因为折点在其小区间中的位置随 $N$ 变化）。对于 $(1+x)^{\alpha}$，导数在端点处发散：梯形法则和辛普森法则降到 $1 + \alpha$ 阶，而节点向两端聚集的高斯求积降到约 $2 + 2\alpha$ 阶。补救方法是在折点处拆分区间，或做变量替换使被积函数变光滑。试试整数 $\alpha$（多项式），看高斯求积变为精确，或者把折点放在网格节点上（只要 $N$ 是 20 的倍数，$a = 0.3$ 就是节点）：此时梯形法则对两段直线是精确的，误差降到舍入水平。
meanings:
- 等距节点；权重 $h(\tfrac12, 1, \dots, 1, \tfrac12)$ 和 $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- 勒让德递推的三对角矩阵，对角线旁为 $\beta_k = k/\sqrt{4k^2 - 1}$
- 本征值就是高斯–勒让德节点，本征向量在各列中
- 由每个本征向量的第一个分量得到高斯权重；其和为 $\int_{-1}^{1} dx = 2$
- 光滑、折点和端点被积函数在每个节点上的值
- 重复的 $k$ ⇒ 求和：三个积分同时计算
labels:
  n_max: 最大 $N$
  kink: 折点位置 $a$
  alpha: 端点幂次 $\alpha$
