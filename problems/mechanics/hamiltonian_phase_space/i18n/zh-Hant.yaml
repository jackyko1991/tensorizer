source_hash: c92568d7c613
title: 哈密頓力學：相空間與辛積分
summary: 只需寫一次單擺的哈密頓量 $H(q, p)$，再由 torch.autograd 給出哈密頓方程式 $\dot z_a = J_{ab}\,\partial H/\partial z_b$。一整束軌道與一團劉維爾點雲作為同一個張量一起演化，並在許多週期內比較辛蛙跳法、顯式歐拉法與 RK4。
notes: 分界線 $H = mgL$，即 $p = \pm 2mL\sqrt{gL}\cos(q/2)$，把天平動（封閉迴圈）與轉動（從右側離開、再從左側回來的波浪線）分開。在分界線附近週期會無限增長，因此點雲的內緣會超前外緣一圈：點雲被拉成細長的螺旋，但面積保持不變（劉維爾定理）。蛙跳法只有二階精度，但能量誤差永遠有界，因為它精確守恆一個相近的「影子」哈密頓量；RK4 每步準確得多，但誤差會穩定地緩慢累積；顯式歐拉法每步把相空間面積放大約 $1 + \omega^2\Delta t^2$ 倍，因此能量發散。試試更大的 $\Delta t$，或改用簡諧系統，此時點雲只是剛性旋轉。
meanings:
- 相空間點 $b$：角度 $q$ 與角動量 $p$；每條軌道與點雲中的每一點都是一列
- 哈密頓量，唯一需要手動輸入的物理
- 對總和取梯度，讓每個獨立的點得到各自的梯度
- 辛矩陣 $[[0, I], [-I, 0]]$：把梯度旋轉 90°
- 重複的 $c$ ⇒ 求和：同時對所有點寫出哈密頓方程式
- 踢–漂–踢（Störmer–Verlet）：每個子步驟都是剪切變換，因此面積被精確保持
- 顯式歐拉法，作為對照：每一步都會拉伸相空間
- 點雲多邊形的面積；劉維爾定理說它保持不變
labels:
  system: 系統
  m: 質量 $m$
  length: 擺長 $L$
  amplitude: 測試軌道振幅 $q_0$
  n_orbits: 相圖中的軌道數
  dt: 時間步長 $\Delta t$
  t_max: 模擬時間
