<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Left: a classic Hopfield network, five binary neurons s_i, each connected to every other by a symmetric weight W_ij. Right: the modern network, a query xi compared with the stored patterns X, weighted by a softmax with inverse temperature beta, and averaged back into a new state">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- classic: 5 neurons on a pentagon, centre (60, 84), radius 40 -->
    <g stroke="#9ca3af" stroke-width="1.2">
      <line x1="60" y1="44" x2="98" y2="72"/><line x1="60" y1="44" x2="84" y2="116"/><line x1="60" y1="44" x2="36" y2="116"/><line x1="60" y1="44" x2="22" y2="72"/>
      <line x1="98" y1="72" x2="84" y2="116"/><line x1="98" y1="72" x2="36" y2="116"/><line x1="98" y1="72" x2="22" y2="72"/>
      <line x1="84" y1="116" x2="36" y2="116"/><line x1="84" y1="116" x2="22" y2="72"/>
      <line x1="36" y1="116" x2="22" y2="72"/>
    </g>
    <line x1="60" y1="44" x2="98" y2="72" stroke="#f59e0b" stroke-width="2.5"/>
    <g stroke-width="1.5">
      <circle cx="60" cy="44" r="9" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="98" cy="72" r="9" fill="#ffffff" stroke="#374151"/>
      <circle cx="84" cy="116" r="9" fill="#2563eb" stroke="#1e40af"/>
      <circle cx="36" cy="116" r="9" fill="#ffffff" stroke="#374151"/>
      <circle cx="22" cy="72" r="9" fill="#2563eb" stroke="#1e40af"/>
    </g>
    <text x="40" y="34" font-style="italic">s<tspan baseline-shift="sub" font-size="10">i</tspan></text>
    <text x="84" y="50" font-style="italic" fill="#b45309">W<tspan baseline-shift="sub" font-size="10">ij</tspan></text>
    <text x="60" y="148" text-anchor="middle" font-size="11" fill="#6b7280">classic: ±1, Hebb</text>
    <line x1="120" y1="22" x2="120" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- modern: query, patterns, softmax -->
    <rect x="132" y="56" width="12" height="44" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="138" y="116" text-anchor="middle" font-style="italic">ξ</text>
    <g stroke="#374151" stroke-width="1.5" fill="#ffffff">
      <rect x="160" y="40" width="10" height="44"/><rect x="172" y="40" width="10" height="44"/>
      <rect x="184" y="40" width="10" height="44"/><rect x="196" y="40" width="10" height="44"/>
    </g>
    <rect x="184" y="40" width="10" height="44" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="183" y="32" text-anchor="middle" font-style="italic">X</text>
    <!-- softmax weights -->
    <g fill="#f59e0b">
      <rect x="161" y="104" width="8" height="4"/><rect x="173" y="102" width="8" height="6"/>
      <rect x="185" y="88" width="8" height="20"/><rect x="197" y="105" width="8" height="3"/>
    </g>
    <line x1="158" y1="108" x2="208" y2="108" stroke="#374151" stroke-width="1"/>
    <text x="183" y="124" text-anchor="middle" font-size="11" fill="#b45309">softmax(<tspan font-style="italic">β</tspan>·)</text>
    <path d="M146,78 L156,64" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <path d="M210,62 C232,70 232,96 214,100" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <text x="180" y="148" text-anchor="middle" font-size="11" fill="#6b7280">modern: attention</text>
  </g>
</svg>
