source_hash: b6ae9044b340
title: हबल प्रसार
summary: 'आकाशगंगाएँ एक स्थिर सहगामी (comoving) ग्रिड पर स्थित हैं जो स्केल गुणक (scale factor) $a(t)$ से खिंचता है। एक बाह्य गुणनफल $x_{gi} = a\,q_{gi}$ हर आकाशगंगा को खिसकाता है, और आप जिस भी आकाशगंगा को चुनें, उससे बाकी $v = H d$ से दूर जाती हैं। ग्रिड को पार करता फ़ोटॉन उसी गुणक से खिंचता है: $1 + z = a_\mathrm{obs}/a_\mathrm{emit}$।'
notes: 'मात्रक: Mpc, Gyr और km/s/Mpc। द्रव्य-प्रधान (आइंस्टाइन–डी सिटर) मॉडल में $a = (t/t_0)^{2/3}$, अतः $H = 2/(3t)$ समय के साथ घटता है; डी सिटर में $a = e^{H_0 (t - t_0)}$ और $H$ स्थिर रहता है। दोनों में $v = Hd$ हर प्रेक्षक के लिए सटीक रूप से सत्य है: प्रेक्षक को खिसकाएँ, नीले बिंदु फिर भी केंद्र से देखे गए खुले वृत्तों वाली रेखा पर ही आते हैं। आकाशगंगाएँ स्वयं अंतरिक्ष में नहीं चलतीं (कोई विशिष्ट वेग, peculiar velocity, नहीं): उनके बीच का अंतरिक्ष बढ़ता है। फ़ोटॉन प्रति चरण $c\,dt/a$ सहगामी दूरी तय करता है, और दूर की आकाशगंगाओं के लिए $c$ से अधिक चाल अनुमत है, क्योंकि स्थानीय रूप से कुछ भी प्रकाश से आगे नहीं निकलता।'
meanings:
- आकाशगंगा $g$ के सहगामी निर्देशांक (कभी नहीं बदलते)
- हर समय पर स्केल गुणक, आज $a = 1$
- 'भौतिक स्थितियाँ: बाह्य गुणनफल, किसी सूचकांक पर योग नहीं'
- '$\dot a/a$: द्रव्य के लिए $2/(3t)$, डी सिटर के लिए स्थिर'
- हर आकाशगंगा का हबल-प्रवाह वेग
- प्रेक्षक $o$ से देखी गई स्थितियाँ (ब्रॉडकास्ट घटाव)
- 'दोहराए गए $g, i$ ⇒ योग: $v$ बनाम $d$ की न्यूनतम-वर्ग प्रवणता'
- उत्सर्जन के बाद से फ़ोटॉन की तरंगदैर्ध्य का खिंचाव
labels:
  model: प्रसार नियम $a(t)$
  H0: आज का हबल स्थिरांक $H_0$
  n_grid: प्रति भुजा आकाशगंगाएँ
  spacing: सहगामी ग्रिड अंतराल
  observer_x: प्रेक्षक स्तंभ (ग्रिड चरण)
  observer_y: प्रेक्षक पंक्ति (ग्रिड चरण)
  a_start: प्रारंभ में स्केल गुणक $a_\mathrm{emit}$
  a_end: अंत में स्केल गुणक $a_\mathrm{obs}$
