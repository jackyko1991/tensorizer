title: 마르코프 음펨바 효과
summary: 뜨거운 물이 따뜻한 물보다 빨리 얼 수 있을까? 메트로폴리스 전이율로 격자 퍼텐셜 안을 뛰어다니는 입자의 경우 답은 '그렇다'이다. 마스터 방정식 $\dot p = W p$를 한 번 대각화하고, 모든 초기 온도를 einsum 하나로 가장 느린 모드에 투영한다. 느린 모드 진폭 $a_2$가 사라지는 뜨거운 출발점은 더 차가운 출발점보다 지수적으로 빠르게 이완한다.
notes: '단위: $k_B = 1$이고 시도 전이율은 1이다. 열욕은 $T_b$에 있고 계는 온도 $T_0$의 평형에서 출발한다. 도약이 상세 균형 $W_{ij}\pi_j = W_{ji}\pi_i$를 따르면 $W$는 대칭 행렬과 닮음이므로 모든 고윳값이 실수이고 $\le 0$이며, 정상 상태는 볼츠만 분포 $\pi$이다. 잠시 후에는 가장 느린 모드만 남아 $p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$가 되므로, 온도와 상관없이 $\lvert a_2\rvert$가 더 작은 출발점이 평형에 더 가까워진다. $a_2(T_0)$가 단조일 필요가 없으므로 더 뜨거운 출발점이 더 따뜻한 출발점을 추월할 수 있다(마르코프 음펨바 효과). $a_2 = 0$인 특별한 $T^*$에서는 느린 모드가 아예 없어서 이완이 더 빠른 비율 $\lambda_3$로 진행된다(강한 효과). 이 퍼텐셜에서 그 모양은 분지들 사이의 경쟁에서 나온다. 낮은 $T_0$에서는 깊고 좁은 우물이 확률 대부분을 차지한다. 중간 $T_0$에서는 넓고 얕은 우물이 엔트로피 덕분에 이긴다. 높은 $T_0$에서는 높은 고원이 채워져서 왼쪽 분지의 몫이 다시 올라가 $T^*$에서 평형값을 지나친다. 이론은 Lu & Raz(PNAS, 2017)의 것이다. Kumar & Bechhoefer(Nature, 2020)는 광학적으로 만든 이중 우물 퍼텐셜 속 콜로이드 구슬로 강한 형태를 포함한 이 효과를 관찰했다. 이어 Kumar, Chétrite & Bechhoefer(PNAS, 2022)는 역효과(비정상 가열)를 관찰했다. 최근에는 포획 이온 실험에서 양자 유사 현상이 보고되었다. 이 격자는 그런 계들의 장난감 버전이다. $T_b$를 올려 보자. 약 $1.4$ 이상에서는 교차가 사라진다.'
meanings:
- '자리 $i$의 계단식 에너지: 고원, 깊고 좁은 우물, 장벽, 넓고 얕은 우물'
- 사슬 위 최근접 이웃이면 1, 아니면 0
- 도약 $j \to i$의 전이율. 대각 성분은 모든 열의 합을 0으로 만든다
- 각 초기 온도 $T_{0,b}$의 볼츠만 상태, 출발점들의 배치
- '반복된 $j$ ⇒ 합: 모든 출발점에 대한 마스터 방정식을 한꺼번에'
- 대칭화한 $\Pi^{-1/2} W \Pi^{1/2}$의 eigh. $\lambda_1 = 0$은 평형, $\lambda_2$는 가장 느린 감쇠
- '반복된 $i$ ⇒ 합: 각 출발점과 각 모드의 겹침'
- '반복된 $k$ ⇒ 합: 모든 시각에서의 정확한 해'
- 평형까지의 쿨백–라이블러 거리, $\sum_i p_i \ln(p_i/\pi_i)$
labels:
  T_bath: 열욕 온도 $T_b$
  barrier: 장벽 높이 $U_\text{bar}$
  T_hot: 뜨거운 출발 온도 $T_\text{hot}$
