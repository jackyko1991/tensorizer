source_hash: 41a426132182
title: 层级问题：引力泄漏到额外维度
summary: 为什么引力比弱相互作用弱约 $10^{33}$ 倍（$G_F M_{Pl}^2$）？一个推测性的答案：引力扩散到 $n$ 个隐藏的紧致维度中。在 $\mathbb R^3\times T^n$ 上，势以两种方式求和：对质量的镜像求和，以及对 Kaluza–Klein 塔求和，都写成对晶格壳层的一个张量。它在内部按 $1/r^{1+n}$ 衰减，在外部按 $1/r$ 衰减，并带有 Yukawa 尾巴 $\alpha = 2n$、$\lambda = R$。$n = 1..6$ 的 ADD 半径与扭秤和 LHC 的真实限制相比较，而 Randall–Sundrum 翘曲因子 $e^{-\pi k r_c}$ 把 $M_{Pl}$ 变成 TeV。至今没有观测到任何额外维度。
notes: 状态：推测性。层级问题问的是：为什么电弱能标（$v \approx 246$ GeV）远低于普朗克能标（$M_{Pl} \approx 1.22\times10^{19}$ GeV），且 $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$。Arkani-Hamed、Dimopoulos 与 Dvali（ADD，1998）提出只有引力扩散到 $n$ 个尺度介于毫米与飞米之间的紧致维度中，因此引力的真正能标 $M_*$ 可能只有一个 TeV。Randall 与 Sundrum（1999）则提出单一个翘曲维度。至今没有发现任何额外维度。其他提出的答案包括超对称、复合性、relaxion 与人择选择，都尚未确立。计算内容：$\mathbb R^3\times T^n$ 上的一个点质量（半径 $R$ 的圆，单位 $R = G_D M = 1$）。由泊松求和公式，镜像求和与 Kaluza–Klein 求和相等；两者都按壳层 $m = |\mathbf k|^2$ 分组，个数为 $r_n(m)$。图中内部使用镜像求和（$r < R$，远处镜像以积分代替），外部使用 KK 求和。$3+n$ 维空间中的高斯定律确定 $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$。最轻的 KK 能级有 $2n$ 个质量为 $1/R$ 的模，因此在紧致空间外不远处，引力看起来像带 $\alpha = 2n$、$\lambda = R$ 的 Yukawa 修正（环面；其他形状会改变 $\alpha$）。ADD 半径使用 $M_{Pl}^2 = M_*^{n+2}R^n$；不同论文相差 $(2\pi)^n$ 与 $8\pi$ 之类的因子，所以 $R$ 只应视为数量级。数据（以引用数值存于 data/*.csv）：Eöt-Wash 扭秤排除了 $\lambda = 56\,\mu$m 以上的 $|\alpha| = 1$（Kapner 等，PRL 98, 021101, 2007, arXiv:hep-ph/0611184；一个额外维度 $R \le 44\,\mu$m），以及 $38.6\,\mu$m 以上（Lee 等，PRL 124, 101101, 2020, arXiv:2002.11761）。排除曲线本身没有附上。由于它随
  $\lambda$ 递减，任何满足 $\alpha \ge 1$ 且 $\lambda > 38.6\,\mu$m 的点都被排除，这是保守的检验。ATLAS 13 TeV 单喷注搜寻（139 fb$^{-1}$；Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0）对 $n = 2..6$ 排除了低于 11.2、8.5、7.1、6.4 和 5.9 TeV 的 $M_D$（Giudice–Rattazzi–Wells 约定，这里直接与 $M_*$ 比较）。$n = 1$ 需要一个太阳系大小的维度，已被行星轨道排除。Randall–Sundrum：$k r_c \approx 11$–$12$ 使 $\bar M_{Pl}e^{-\pi k r_c}$ 成为一个 TeV；LHC 没有看到它的 Kaluza–Klein 引力子。
meanings:
- Kaluza–Klein 模矢量（绕圆的动量 $\mathbf k/R$）；用来检查壳层个数
- 有多少个 $\mathbf k$ 满足 $|\mathbf k|^2 = m$：theta 级数的 $n$ 次方，用 FFT 卷积计算
- 重复的壳层指标 $m$ ⇒ 求和：质量及其镜像；远处镜像用连续尾项
- 同一个势写成质量为 $\sqrt m/R$ 的 Yukawa 项之塔（泊松求和）
- autograd 计算的场；乘以 $S^{2+n}$（近处）或 $S^2\times T^n$（远处）的面积得到高斯通量
- 在紧致空间外不远处对 $\ln(\phi/\phi_N - 1)$ 做最小二乘；预期 $2n$ 与 $R$
- 同时计算每个 $n$ 和每个基本能标 $M_*$ 的 ADD 半径（广播）
- 普朗克膜与 TeV 膜之间的 Randall–Sundrum 翘曲因子
labels:
  M_star: 打印表格所用的基本能标 $M_*$
  krc: Randall–Sundrum $k r_c$
  m_max: 求和的晶格壳层，$|\mathbf k|^2 \le m_{max}$
