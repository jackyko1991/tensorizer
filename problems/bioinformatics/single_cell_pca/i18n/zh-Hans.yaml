source_hash: f93e7ab544e0
title: 单细胞 RNA-seq：PCA 与 k-means 聚类
summary: 一个合成的单细胞实验：几种类型的细胞，每种开启自己的标记基因，计数服从负二项分布，且细胞的测序深度各不相同。我们以张量运算执行标准流程：归一化为 $\log(1 + 10^4 K_{cg}/n_c)$，保留高变基因，用 SVD 做 PCA，然后并行运行多次随机重启的 k-means，并用调整兰德指数将聚类与真实类型比较评分。
notes: 每个细胞产生几千个 mRNA 计数，分散在数千个基因上，因此大多数元素为零，原始计数主要反映细胞被测序的深度。除以文库大小 $n_c$ 消除深度影响；取对数驯服表达水平的巨大范围。大多数基因只携带噪声，所以我们保留方差超过相近均值基因所示水平的基因：即高变基因，其中富集了植入的标记基因。PCA 再将其压缩：有 $K$ 种类型时，信号大约位于 $K-1$ 个方向上，表现为碎石图中前 $K-1$ 根柱高出平坦的噪声底。k-means 交替执行两步：把每个细胞分配给最近的中心，再把每个中心移到其细胞的均值；两步都不会增加惯量 $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$，所以它会收敛，但只收敛到局部极小，这就是为什么要并排运行多个随机起点（灰色曲线）并保留最好的一个。由于我们知道真实类型，调整兰德指数能诚实地给结果评分。可选的 t-SNE 图是一个用自动微分训练的小型力导向布局（Student-t 相似度、早期夸大）；这类图中簇与簇之间的距离意义不大。真实流程（Scanpy、Seurat）还会加入质量控制、批次校正，以及在最近邻图上基于图的聚类（Leiden），而真实的细胞类型很少这么干净。试试更小的倍数变化、更少的标记基因或错误的 $k$。
meanings:
- 基因 $g$ 在类型 $k$ 中的平均表达：对数正态基线，对 $k$ 的 $M$ 个标记基因再乘以倍数变化
- 负二项计数（方差 $m + \varphi m^2$）；$s_c$ 为对数正态的测序深度
- 文库大小：细胞 $c$ 的总计数，对 $g$ 求和
- 深度归一化（每 $10^4$ 计数，类似 CPM）并取对数
- 离散度 $\mathrm{Var}/\mathrm{Mean}$，在均值相近的分箱内标准化（分箱求和用独热 einsum）
- 对 $H$ 个高变基因上的中心化矩阵做 PCA；torch.pca_lowrank 给出相同的前几个主成分
- 主成分得分，对 $g$ 求和；$\Sigma_p^2/\sum_q\Sigma_q^2$ 为解释方差比
- 细胞 $c$ 到第 $r$ 次重启中心 $k$ 的距离平方；对 $p$ 求和，全部 $R$ 次重启同时计算
- 分配步：每个细胞加入最近的中心
- 更新步：每个中心移到其细胞的均值，对 $c$ 求和
- 由列联表 $n_{ij}$（独热 einsum）计算的配对计数一致性；1 = 完美，约 0 = 随机
labels:
  n_cells: 细胞数 $C$
  n_genes: 基因数 $G$
  n_types: 真实细胞类型数 $K$
  n_markers: 每种类型的标记基因数
  fold_change: 标记基因倍数变化
  dispersion: 负二项离散度 $\varphi$
  depth_spread: 文库大小离散程度（对数正态 $\sigma$）
  n_hvg: 保留的高变基因数
  n_pcs: 用于聚类的主成分数
  k: 簇数 $k$
  kmeans_iters: k-means 迭代次数
  embedding: 二维视图：PC1–PC2 或 t-SNE
