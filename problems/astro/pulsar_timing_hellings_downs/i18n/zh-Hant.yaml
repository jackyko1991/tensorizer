source_hash: 890ee320b06e
title: 脈衝星計時陣列與 Hellings–Downs 曲線
summary: 一片奈赫茲重力波之海輕輕拉伸地球與眾多毫秒脈衝星之間的路徑。由一千道隨機平面波構成的各向同性背景，透過天線響應 $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$（對偏振張量的一次 einsum）推移每顆脈衝星的脈衝。將每一對計時殘差相關並依角度分箱，即可重現 Hellings–Downs 曲線，這個四極指紋正是脈衝星計時陣列在 2023 年報告其證據的訊號。
notes: 重力波會改變光在脈衝星與地球之間的傳播時間，因此脈衝到達時間在數年間漂移數十到數百奈秒。對單一道波，效應透過 $F^{+}$ 與 $F^{\times}$ 取決於幾何；對各向同性背景，對方向平均後留下的相關只取決於兩顆脈衝星之間的夾角。Hellings 與 Downs（ApJL 265, L39, 1983）算出了它：天空上相近的脈衝星相關係數為 $\tfrac12$（每顆脈衝星另一半的功率是它自己不相關的脈衝星項），相距約 $82.5^\circ$ 的一對略呈反相關，相對的脈衝星則再次正相關，為 $\tfrac14$。這個四極形狀是橫向、自旋 2 波的特徵：時鐘誤差會給出單極（$\Gamma = 1$），太陽系星曆誤差則給出偶極（$\Gamma = \cos\zeta$）；兩者都一併擬合以作比較。本頁以兩種方式檢查歸一化：公式對照蒙地卡羅天空積分 $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$，以及天線響應平均 $\langle\sum_A (F^A)^2\rangle = 1/3$。單一片天空會明顯散布在曲線周圍：只有少數主導頻率時，這種「宇宙變異」是真實的，也影響真實的陣列；對許多模擬天空取平均可看到收斂。白雜訊使擬合振幅被稀釋到 1 以下。研究背景：2023 年 6 月，NANOGrav 合作團隊（15 年資料集，Agazie et al., ApJL 951, L8, 2023）報告了具 Hellings–Downs 相關的奈赫茲重力波背景證據（相關性約 3σ，為概略值），同時發表的還有歐洲與印度 PTA（EPTA + InPTA, A&A 2023）、Parkes PTA（Reardon et al., ApJL 951, L6, 2023）與中國 PTA。可能的來源是一群超大質量黑洞雙星，它給出此處使用的 $h_c \propto f^{-2/3}$ 頻譜。簡化：殘差未擬合各脈衝星的自轉減慢（只移除平均值），只有白雜訊，沒有脈衝星特有的紅雜訊，並以簡單的歸一化互相關取代最佳統計量或完整的貝氏分析。
meanings:
- 指向脈衝星 $a$ 的單位向量，在天空上均勻分布
- 第 $m$ 道波的傳播方向與偏振角
- 由橫向座標系 $m, n \perp \hat\Omega$ 建構的 $+$ 與 $\times$ 張量
- 對 $i$ 與 $j$ 求和：地球–脈衝星連線的伸縮
- 天線響應；$\sum_A (F^A)^2$ 的天空平均恰為 $1/3$
- 脈衝星項的相位延遲，$\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- 對 $m$ 與 $A$ 求和：脈衝星 $a$ 在觀測時刻 $t$ 的計時殘差
- 對 $t$ 求和：每一對的相關，以平均自功率歸一化
- 預期相關，$\Gamma(0^+) = \tfrac12$，最小值 $\approx -0.152$ 位於 $\zeta \approx 82.5^\circ$
labels:
  n_pulsars: 脈衝星數 $N$
  n_realisations: 模擬天空數 $K$
  n_waves: 每片天空的平面波數 $M$
  n_freq: 頻率箱 $j/T_{span}$
  span: 觀測時長 $T_{span}$
  n_times: 每顆脈衝星的觀測次數
  noise: 白雜訊 $\sigma$ / 重力波均方根
  n_bins: 角度分箱數
  seed: 隨機種子
