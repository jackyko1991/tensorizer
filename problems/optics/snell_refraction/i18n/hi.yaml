source_hash: 85a6136cffba
title: परतदार माध्यमों में स्नेल का नियम
summary: प्रकाश किरणों का एक पंखा अलग-अलग अपवर्तनांकों वाली तीन परतों को पार करता है। स्नेल के नियम का सदिश रूप एक einsum से हर किरण को एक साथ मोड़ता है, और जहाँ पूर्ण आंतरिक परावर्तन होता है वहाँ दर्पण परावर्तन में बदल जाता है।
notes: 'किरणें $c/n$ चाल से चलती हैं, इसलिए किरणों के सिरों से गुज़रती धराशायी रेखा एक तरंगाग्र है: सघन परतों में यह पीछे रह जाती है। डिफ़ॉल्ट में सबसे निचली परत हवा ($n = 1$) है; उस अंतरापृष्ठ पर क्रांतिक कोण $\arcsin(n_3/n_2)$ से अधिक ढलवाँ किरणें पूर्ण आंतरिक परावर्तित होकर वापस ऊपर जाती हैं। किसी अंतरापृष्ठ को गायब करने के लिए दो अपवर्तनांक बराबर कर दें।'
meanings:
- किरण $r$ की एकक दिशा, घटक $i \in \{x, y\}$
- आपतित किरण की ओर मुख वाला एकक पृष्ठ अभिलंब
- हर किरण जिस अंतरापृष्ठ से टकराती है वहाँ अपवर्तनांक अनुपात $n_1/n_2$
- 'दोहराया गया $j$ ⇒ योग: हर किरण का $\cos\theta_i$'
- अपवर्तित दिशा (अब भी एकक सदिश)
- दर्पण दिशा, जहाँ $1 - \eta^2(1 - c^2) < 0$ (TIR) वहाँ प्रयुक्त
labels:
  n1: ऊपरी परत का अपवर्तनांक $n_1$
  n2: मध्य परत का अपवर्तनांक $n_2$
  n3: निचली परत का अपवर्तनांक $n_3$
  n_rays: पंखे में किरणें
  max_angle: सबसे चौड़ा किरण कोण
  t_max: सिमुलेशन समय
