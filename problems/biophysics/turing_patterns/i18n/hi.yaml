title: 'ट्यूरिंग पैटर्न: ग्रे–स्कॉट अभिक्रिया–विसरण'
summary: दो रसायन जो अभिक्रिया करते हैं और अलग-अलग गति से विसरित होते हैं, लगभग एकसमान मिश्रण को धब्बों, धारियों और भूलभुलैयों में बदल सकते हैं, यह ट्यूरिंग का 1952 का विचार है कि जानवरों की खाल के पैटर्न और अन्य जैविक पैटर्न कैसे बनते हैं। ग्रे–स्कॉट मॉडल को 5-बिंदु लाप्लासियन स्टेंसिल के साथ एक आवर्ती ग्रिड पर चार $(F, k)$ युग्मों के लिए एक साथ, एक $(2, B, n, n)$ टेंसर में हल किया जाता है, और एक रैखिक-स्थिरता विश्लेषण (परिक्षेपण संबंध $\lambda(q)$) दिखाता है कि वास्तविक ट्यूरिंग अस्थिरता कहाँ मौजूद है।
notes: 'ट्यूरिंग की अंतर्दृष्टि यह थी कि विसरण, जो सामान्यतः सब कुछ चिकना करता है, एकसमान अवस्था को अस्थिर कर सकता है जब एक स्वउत्प्रेरक (यहाँ $v$) उसे सीमित करने वाले पदार्थ ($u$) से धीमे फैलता है: $v$ का एक छोटा उभार $u$ को खाकर स्थानीय रूप से बढ़ता है, और उसके चारों ओर $u$ की कमी पड़ोसियों को बढ़ने से रोकती है, यानी लघु-परास सक्रियण और दीर्घ-परास निरोध। रैखिक स्थिरता इसे सटीक बनाती है। एकसमान अवस्था पर एक तरंग $e^{i\mathbf q\cdot\mathbf x + \lambda t}$ $J - q^2\,\mathrm{diag}(D_u, D_v)$ के आइगेनमानों पर बढ़ती है; यदि $\lambda(0) < 0$ पर $q$ के एक पट्ट के लिए $\lambda(q) > 0$, तो सबसे तेज़ तरंगदैर्ध्य $2\pi/q_{\max}$ सूक्ष्म रव से प्रकट होता है। $D_u = D_v$ होने पर हर आइगेनमान बस $-Dq^2$ से खिसकता है, इसलिए कोई ट्यूरिंग अस्थिरता संभव नहीं: विसरण अनुपात को 1 पर रखें और मानचित्र पर नीला क्षेत्र गायब हो जाता है। ग्रे–स्कॉट में यहाँ केवल "Turing" युग्म इस प्रकार का है, और यह अपनी एकसमान अवस्था और 1 % रव से शुरू होता है; धराशायी रेखा जाँचती है कि आयाम पहले $e^{\lambda_{\max} t}$ की तरह बढ़ता
  है। प्रसिद्ध धब्बे, धारियाँ और भूलभुलैयाँ (Pearson 1993) अधिकतर वहाँ रहते हैं जहाँ एकमात्र एकसमान अवस्था $u = 1$, $v = 0$ है, जो हर छोटे विक्षोभ के प्रति स्थिर है; उन पैटर्नों को एक परिमित बीज ($v$ के कुछ वर्ग) की आवश्यकता होती है और वे रैखिक ट्यूरिंग अस्थिरता के बजाय अरैखिक, स्व-प्रतिकृति संरचनाएँ हैं। 5-बिंदु स्टेंसिल एक तरंग को $q^2 \to (4/h^2)\sin^2(qh/2)$ के रूप में देखता है, जो कई कोशिकाओं वाले तरंगदैर्ध्यों के लिए $q^2$ के निकट है। वास्तविक जैविक उदाहरणों में अंगों में अंगुलियों का अंतराल, रोम-कूप अंतराल और मछली की त्वचा की धारियाँ शामिल हैं, जहाँ सक्रियक और निरोधक संकेतन प्रोटीन होते हैं।'
meanings:
- युग्म $b$ की आपूर्ति और निष्कासन दर; पीछे के 1 उन्हें ग्रिड पर प्रसारित करते हैं
- हर युग्म के लिए कोशिका $(i, j)$ में अधःस्तर और स्वउत्प्रेरक की सांद्रता, $(2, B, n, n)$ आकार के $y$ में रखी गई
- चार पड़ोसी घटा केंद्र का चार गुना, आवर्ती किनारों के लिए torch.roll के साथ
- स्वउत्प्रेरक चरण $U + 2V \to 3V$, आपूर्ति और निष्कासन
- $\Delta t = 1$ के साथ स्पष्ट ऑयलर विधि, स्थिर जब तक $D\,\Delta t / h^2 < 1/4$
- $(1, 0)$ हमेशा; दो और जहाँ $F \ge 4(F + k)^2$
- एकसमान अवस्था पर रैखिकीकृत गतिकी $\partial R_\alpha / \partial c_\beta$
- $Q$ तरंग-संख्याओं के बैच के लिए $M(q)$ का सबसे बड़ा $\operatorname{Re}$ आइगेनमान
- '$\lambda(0) < 0$ पर एक पट्ट में $\lambda(q) > 0$ वाली अवस्था: ट्यूरिंग अस्थिरता'
labels:
  grid: ग्रिड आकार $n$
  steps: समय चरण
  ratio: विसरण अनुपात $D_v / D_u$
