source_hash: ee1c00fce805
title: 'Стайное поведение: модель Вичека и боиды'
summary: Скворцы, косяки рыб и саранча движутся вместе без вожака. В модели Вичека каждая птица летит с постоянной скоростью и копирует среднее направление соседей, плюс случайный угол величиной до $\eta$; в боидах Рейнольдса она управляет движением по правилам разделения, выравнивания и сплочённости. Все $N^2$ расстояний между птицами в периодическом ящике образуют один тензор, а целый пакет уровней шума запускается одновременно, чтобы показать переход порядок–беспорядок для полярного порядка $\varphi$.
notes: 'Вичек и др. (1995) предложили эту модель как простейшую физику коллективного движения: выравнивание плюс шум. При слабом шуме птицы договариваются о направлении ($\varphi \to 1$), при $\eta = 2\pi$ направления случайны и $\varphi$ — лишь шум конечного размера порядка $1/\sqrt N$. В двух измерениях это примечательно, поскольку теорема Мермина–Вагнера запрещает дальний порядок в равновесных системах с непрерывной симметрией; движущиеся птицы обходят её, потому что окружения постоянно меняются (Тонер и Ту, 1995). Для больших систем переход оказывается разрывным, с бегущими полосами (Грегуар и Шате, 2004); при таком малом $N$ он выглядит плавным. Рейнольдс (1987) придумал боидов для компьютерной анимации. Здесь три его правила записаны как парные силы, антисимметричные относительно $i \leftrightarrow j$, поэтому без нормировки скорости полный импульс стаи сохраняется точно (это проверяет тест); затем нормировка к постоянной скорости $v_0$ позволяет стае выбрать направление. Сильная сплочённость
  заставляет стаю схлопнуться во вращающийся шар, поэтому её держат слабой. Попробуйте ящик поменьше (выше плотность) или радиус побольше, чтобы облегчить упорядочение.'
meanings:
- положения $N$ птиц в ящике $[0, L)^2$, по одной стае на каждый уровень шума $b$
- смещение от птицы $i$ к ближайшей периодической копии птицы $j$; антисимметрично относительно $i \leftrightarrow j$
- матрица соседей, повторяющийся $k$ ⇒ суммирование; птица $i$ считает и себя
- 'повторяющийся $j$ ⇒ суммирование: среднее направление соседей'
- угол шума, равномерно распределённый в $[-\eta/2, \eta/2]$; при $\eta = 2\pi$ направление полностью случайно
- 'боиды: разделение $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$, выравнивание $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$, сплочённость $\sum_j A_{ij}\mathbf d_{ij}$'
- 'полярный порядок: 1, когда стая движется слаженно, около $1/\sqrt N$, когда направления случайны'
labels:
  n_birds: Птиц $N$
  box: Сторона ящика $L$ (радиус соседства $R = 1$)
  speed: Скорость $v_0$
  eta: Шум $\eta$ показанной стаи
  n_noise: Уровней шума в пакете
  steps: Шагов по времени
  seed: Начальное значение генератора случайных чисел
