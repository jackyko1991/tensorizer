notes: >
  Step 4 of the Projection Hypothesis (see the series description), the author's speculative hypothesis, not
  established physics. Step 1 (cosmology/projection_postulate) states postulate P4: curved spacetime is the projected
  shape of a flat higher-dimensional embedding, and a singularity is where the projection folds (its Jacobian drops
  rank). Step 3 (cosmology/projection_dimension_budget) counts dimensions, step 5 (cosmology/projection_bell_test)
  tests the measurement postulates, and step 6 (cosmology/projection_telescope_tests) looks at what telescopes can
  test. The number of flat dimensions $D$ stays open: it is a parameter here and never enters a result. Known
  geometry first. (a) Flamm (1916): the equatorial slice $t = $ const, $\theta = \pi/2$ of Schwarzschild drawn in flat
  $\mathbb R^3$ is the paraboloid $z = 2\sqrt{r_s(r-r_s)}$, and its induced metric $dr^2/(1-r_s/r) + r^2d\phi^2$
  agrees to $10^{-16}$. (b) Fronsdal (Phys. Rev. 116, 778, 1959) embeds the whole Schwarzschild spacetime, inside the
  horizon too, in flat $\mathbb R^{1,5}$. The induced metric $\eta_{AB}\partial_iz^A\partial_jz^B$, with the
  Jacobian taken by autograd, matches Schwarzschild to $10^{-13}$ outside and inside, and in Kruskal coordinates
  across the horizon. Curved 4D geometry really can be seen as a surface in flat space; this is the anchor for P4.
  Two facts matter for P4. The embedding has full rank at the horizon: the rank drop seen in $(t, r)$ coordinates
  disappears in Kruskal coordinates. At $r\to0$ it does not fold either; it runs off to infinity, $z^2\approx-2r_s^{3/2}
  r^{-1/2}$. The curvature, computed by the same automatic differentiation (Christoffel symbols, Riemann tensor,
  einsum contractions), gives $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ to $10^{-15}$. The static tidal eigenvalues are
  $+r_s/r^3$ (radial stretch) and $-r_s/2r^3$ (sideways squeeze), all diverging at $r = 0$. P4's claim, made
  concrete: a smooth sheet in flat $\mathbb R^D$, seen through a projection, has a shadow whose density diverges at
  fold caustics. Catastrophe theory (Thom, Arnold) says the exponent is universal. The map $x = s^n$ gives
  $\rho\propto|x|^{1/n-1}$, measured as $-0.500$ (fold), $-0.667$ (cusp) and $-0.750$ ($n = 4$). A sphere $S^k$
  projected onto $\mathbb R^3$ has rim density $u^{(k-3-1)/2}$, measured as $-0.51$, $0.00$, $+0.45$ for
  $k = 3, 4, 5$ in any $D$. So a density spike needs a sheet with exactly as many dimensions as the screen; a thicker
  sheet gives a smooth shadow. The animation tilts a wavy sheet until it folds, at $a\tan\alpha > 1$. Comparison
  with GR: give the mass $M = r_s/2$ the density of a 3-sphere's shadow, $\rho\propto(1-r^2/R^2)^{-1/2}$, a weak-field
  caricature, not a solution of Einstein's equations. Outside $R$ the field is exactly $r_s/r^3$ (Birkhoff's theorem,
  the shell theorem), and the centre stays finite. The divergence moves to the fold shell and softens to
  $(R-r)^{-1/2}$ in density and tidal field, and the curvature proxy $8\sum E^2$ to $(R-r)^{-1}$, instead of GR's
  $r^{-3}$ and $r^{-6}$. The sheet itself keeps a finite curvature $1/R^2$. Verdict, honestly. P4 can keep the
  tightly tested exterior Schwarzschild geometry unchanged and change only the interior, but that is exactly what
  makes it untestable: for $R < r_s$ the fold sits behind the horizon, and no signal from it reaches us. The
  universal exponents are new only as a description, since nothing outside the horizon depends on them. A fold
  outside the horizon ($R > r_s$) would be a horizonless compact object with different photon rings and echoes; that
  is what step 6 tests with black-hole shadows. Background: fluids/blowup_profile_search shows how singular profiles
  and their exponents are studied in practice (self-similar ansatz, exponent search). Wikipedia: Schwarzschild
  metric, Catastrophe theory.
