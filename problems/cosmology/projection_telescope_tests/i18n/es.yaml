source_hash: c17ad8b19789
title: 'Pruebas telescópicas de la proyección: ondas gravitacionales, sombras de agujeros negros y supernovas'
summary: 'Una hipótesis especulativa, no física establecida, confrontada con datos astronómicos abiertos. Si la gravedad ve más de $3+1$ dimensiones, las ondas gravitacionales se debilitan más rápido que $1/d$; si el espacio-tiempo curvo es la sombra de una proyección plegada, un pliegue fuera de la esfera de fotones agrandaría la sombra de un agujero negro. GW170817, con la distancia de su galaxia anfitriona, da $D = 4.00^{+0.07}_{-0.25}$; las sombras de M87* y Sgr A* observadas por el EHT solo permiten un pliegue dentro de unos $2.3$ radios de Schwarzschild; y las supernovas de Pantheon+ no pueden distinguir un universo con fuga (DGP) de $\Lambda$CDM. Todo concuerda con la relatividad general en $3+1$: cualquier dimensión adicional debe ser una que la gravedad no perciba a estas escalas.'
notes: 'Estado: especulativo. Es la hipótesis propia del autor (véase la descripción de la serie), no física establecida. Paso 6 de la hipótesis de la proyección, el paso de observación. El paso 1 (cosmology/projection_postulate) enunció los postulados y encontró que la regla de Born solo sobrevive en el caso indistinguible de la mecánica cuántica estándar; los pasos 2 a 5 (projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test) desarrollan P3, P5, P4 y P1-P2. Este paso ajusta a datos abiertos los parámetros libres de P4 (la geometría como una proyección que puede plegarse) y de P5 (la gravedad necesita cierto $d_G$, ajustado, no supuesto), y muestra el veredicto sea cual sea. Primero, la física conocida. En relatividad general en $3+1$ dimensiones, la amplitud (strain) de una onda gravitacional decae como $1/d$; en $D$ dimensiones de espacio-tiempo su energía se reparte sobre una $(D-2)$-esfera y $h\propto d^{-(D-2)/2}$. Un detector que supone
  $1/d$ infiere $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$ ($d_* = 1$ Mpc, como en Pardo, Fishbach, Holz y Spergel 2018) o, si la fuga solo empieza más allá de una escala de apantallamiento $R_c$, $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ (su forma apantallada, con sentido para $D > 4$). La predicción de la hipótesis: si la gravedad se extiende a dimensiones adicionales a grandes distancias, $d_{GW} > d_{EM}$ y $D > 4$. La prueba (a): GW170817, una fusión de estrellas de neutrones con una contrapartida óptica en NGC 4993. Datos: 8078 muestras a posteriori de la distancia de luminosidad GW de la publicación GWTC-1 (data/gw170817_distance.csv; colaboraciones LIGO Scientific y Virgo, prior de espín bajo, posición en el cielo libre; GWOSC, licencia CC BY 4.0; Abbott et al. 2019, PRX 9, 031040). El prior del análisis es $\propto d^2$, así que cada muestra se pondera con $d^{-2}$ y una estimación de densidad por núcleos da la verosimilitud de $d_{GW}$ (el valor publicado es $40^{+8}_{-14}$
  Mpc, Abbott et al. 2017). Distancias EM (data/em_distances.csv, valores citados): fluctuaciones de brillo superficial $40.7\pm1.4\pm1.9$ Mpc (Cantiello et al. 2018, ApJL 854, L31, el valor por defecto) y las distancias del flujo de Hubble que usaron Pardo et al., $v_H = 3017\pm250$ km/s dividido por $H_0 = 73.24\pm1.74$ (SH0ES) o $67.74\pm0.46$ km/s/Mpc (Planck). Resultado: $D = 4.00^{+0.07}_{-0.25}$ (68 %, SBF; el ajuste con autograd da $4.00\pm0.11$), $3.98^{+0.09}_{-0.24}$ (SH0ES) y $3.94^{+0.08}_{-0.24}$ (Planck). Pardo et al. encontraron $4.02^{+0.07}_{-0.10}$ (SH0ES) y $3.98^{+0.07}_{-0.09}$ (Planck); su error inferior es menor porque fijaron la posición en el cielo a la de la contrapartida y usaron la distribución a posteriori de $H_0$ de la LVC, mientras que las muestras incluidas aquí tienen una posición en el cielo libre, de modo que la degeneración distancia-inclinación deja una cola más larga hacia distancias pequeñas. Para una fuga apantallada, $-2\ln[\mathcal L(R_c)/\mathcal
  L_{GR}] > 2.71$ excluye $R_c$ por debajo de unos pocos cientos de Mpc para $D = 5$, $n = 1$ y por debajo de unos 50-80 Mpc para $n = 2$ a 5; las transiciones graduales ($n(D-4)/2$ pequeño) quedan excluidas hasta el borde de la malla en $10^4$ Mpc. Pardo et al. citan $R_c\gtrsim 20$ Mpc para cualquier pendiente, a partir de una distribución a posteriori y no de un cociente de verosimilitudes. Veredicto (a): la gravedad se comporta como $D = 4.0$ con una precisión de aproximadamente $\pm0.1$ hasta 40 Mpc; cualquier dimensión adicional que vea la gravedad es compacta o está apantallada más allá de estas distancias. La prueba (b): sombras de agujeros negros. En Schwarzschild la esfera de fotones está en $r = 3GM/c^2$ y el radio de la sombra es $b_c = \sqrt{27}\,GM/c^2$; aquí se calcula tanto como $\min_r r/\sqrt{f}$ como mediante trazado de rayos de $u'''' = -u + \tfrac32 u^2$ para un lote de parámetros de impacto. El espín reduce el radio equivalente en área de la sombra como mucho un 7 %
  (curva de Bardeen; $2(1+\sqrt2)\,GM/c^2$ para un agujero extremal visto desde el polo). El pliegue, una elección de modelado del autor que aquí se precisa: P4 dice que una singularidad es donde la proyección se pliega; supongamos que la geometría proyectada es la de Schwarzschild hasta un pliegue en el radio $r_f$ y que la luz que alcanza el pliegue nunca regresa. Un pliegue dentro de la esfera de fotones ($r_f\leq 1.5\,r_s$) deja la sombra sin cambios; uno fuera hace que el borde de la sombra sea el rayo que lo roza, $b = r_f/\sqrt{1 - r_s/r_f}$, así que $\delta = b/b_c - 1 > 0$. Datos (data/eht_shadows.csv, valores citados): anillo de M87* $42\pm3$ $\mu$as y $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as (EHT 2019, artículos I y VI), frente a $3.64\pm0.22$ $\mu$as a partir de la dinámica estelar (Gebhardt et al. 2011, $6.6\pm0.4\times10^9\,M_\odot$ a 17.9 Mpc), así que $\delta = +0.04\pm0.13$ (calculado aquí, no es un valor publicado); anillo de Sgr A* $51.8\pm2.3$ $\mu$as (EHT 2022, artículo I) y
  $\delta = -0.04^{+0.09}_{-0.10}$ (prior de Keck) y $-0.08\pm0.09$ (prior del VLTI) del artículo VI, tabla 2. Tomando $\delta + 2\sigma$ y dejando que el espín oculte hasta un 7 %, un pliegue puede agrandar la sombra como mucho 0.37 (M87*), 0.21 (Keck) y 0.17 (VLTI), así que $r_f\leq 2.86$, $2.40$ y $2.28\,r_s$. Veredicto (b): las sombras concuerdan con Schwarzschild/Kerr; un pliegue fuera de unos $2.3\,r_s$ queda excluido, pero un pliegue dentro de la esfera de fotones, donde P4 lo situaría de forma natural (en el horizonte o en la singularidad central), es invisible en las imágenes de sombras. La prueba (c, opcional): supernovas. En un mundo brana DGP la gravedad se fuga a una quinta dimensión más allá de $r_c$ y la expansión obedece $H^2 - H/r_c\propto\rho$; el índice $\alpha$ de Dvali y Turner interpola ($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$ es $\Lambda$CDM, $\alpha = 1$ DGP). Datos: la tabla Pantheon+ de cosmology/cosmological_constant_fit, copiada en data/pantheon_plus.csv
  (1466 supernovas, $z > 0.01$, errores diagonales; Scolnic et al. 2022, Brout et al. 2022; los archivos de datos de Pantheon+ no indican ninguna licencia, los artículos están bajo CC BY 4.0). Resultado (priors uniformes, $-1\leq\alpha\leq 1.8$): $\alpha = 0.44\pm0.71$; $\chi^2 = 639.5$ para $\Lambda$CDM y $638.9$ para DGP (ambos muy por debajo del número de supernovas porque los errores diagonales incluyen la diagonal de la covarianza). Veredicto (c): las supernovas por sí solas no pueden distinguir un universo con fuga de $\Lambda$CDM; es la combinación con el CMB y las oscilaciones acústicas de bariones lo que descarta la rama DGP autoacelerada (p. ej., Fang et al. 2008, Phys. Rev. D 78, 103509), que aquí no se vuelve a ajustar. Veredicto global para P4 y P5: todas las pruebas son compatibles con la relatividad general en $3+1$ dimensiones. La hipótesis solo sobrevive si las dimensiones más allá de $3+1$ son unas que la gravedad no percibe a estas escalas (compactas, apantalladas o presentes
  solo en el sector cuántico de los pasos 1 y 5), y si cualquier pliegue está dentro de la esfera de fotones. Eso es una restricción, no un respaldo: hasta ahora la serie no ha encontrado una predicción que difiera de la física estándar y concuerde con los datos.'
meanings:
- 8078 muestras de distancia de GW170817 (GWTC-1); $w_i = d_i^{-2}$ elimina el prior uniforme en volumen
- '$i$ repetido (muestras) ⇒ sumado: densidad por núcleos de $d_{GW}$, una verosimilitud normalizada'
- distancia que infiere un detector cuando la gravedad se extiende a $D_a$ dimensiones, para cada distancia EM $d_j$
- distribución a posteriori de $D$, con la distancia EM marginalizada ($j$ sumado, regla del trapecio)
- 'ajuste con autograd: pasos de Newton sobre $\log p(D)$, error a partir de la segunda derivada (Laplace)'
- órbitas de fotones $u = r_s/r$ para $B$ parámetros de impacto y $F$ radios de pliegue a la vez (RK4 en $\varphi$)
- crecimiento relativo de la sombra por un pliegue en $r_f$ (cero dentro de la esfera de fotones)
- reducción de la sombra de Kerr (curva de Bardeen, radio equivalente en área) para espines $a$ e inclinaciones
- $\chi^2$ de las supernovas para cada índice de fuga $\alpha_a$ y $\Omega_{m}$, con el desplazamiento ($H_0$, $M$) eliminado; $i$ sumado
labels:
  em_distance: Distancia electromagnética a NGC 4993 usada para el veredicto
  D_screen: Dimensión $D$ más allá de la escala de apantallamiento (fuga apantallada)
  n_screen: Pendiente $n$ de la transición de apantallamiento
  inc_max_sgra: Mayor inclinación de Sgr A* para la banda de espín
