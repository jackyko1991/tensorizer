source_hash: f68c4a9fe179
title: 水槽の排水（トリチェリ）
summary: 水はトリチェリの速さ $\sqrt{2gh}$ で穴から流れ出るので、水位ははじめ速く、終わりはゆっくり下がる。穴の大きさの異なる水槽を1つのバッチ化したテンソルとしてまとめて積分し、厳密解 $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$ と比較する。
notes: トリチェリの定理は、自由表面（$A \gg a$ なので静止）と噴流（ともに大気圧）の間のベルヌーイの定理から導かれる。実際の穴では噴流が穴の面積の約 60 % まで縮む（縮流）ので、実際の水槽はよりゆっくり排水される：$a$ に流量係数 $C_d \approx 0.6$ を掛ける。穴の直径を2倍にすると排水時間は4分の1になる。初期水位を2倍にしても $\sqrt2$ 倍にしかならない。落下する噴流は加速するにつれて細くなる——これも連続の式である。
meanings:
- 水槽 $b$ の水位の時間変化
- 水槽 $b$ の穴の面積——バッチの添字
- 各水槽の断面積
- トリチェリの流出速度
- RK4 で積分する右辺
- 繰り返し添字なし ⇒ 外積：すべての時刻とすべての穴の組
labels:
  n_tanks: 水槽の数
  d_min: 最小の穴の直径
  d_max: 最大の穴の直径
  tank_diameter: 水槽の直径 $D$
  h0: 初期水位 $h_0$
