source_hash: e3fd71733e91
title: Les tachyons et l'antitéléphone
summary: 'Et si une particule avait une masse imaginaire, $m^2 < 0$ ? Avec des tenseurs complexes, $E^2 = p^2 + m^2$ donne encore des énergies réelles, mais la particule va toujours plus vite que la lumière et accélère à mesure qu''elle perd de l''énergie. Des transformations de Lorentz en lot appliquées à des lignes d''univers supraluminiques trouvent des référentiels où le signal arrive avant d''être émis, et referment la boucle de l''antitéléphone de Tolman. En théorie des champs, $m^2 < 0$ signifie plutôt un vide instable qui se condense, comme le fait le champ de Higgs. Spéculatif : aucun tachyon n''a jamais été observé, et les « neutrinos plus rapides que la lumière » d''OPERA en 2011 étaient dus à un câble mal branché.'
notes: 'Physique spéculative : les tachyons sont hypothétiques. Aucune particule du Modèle standard n''est tachyonique et aucune expérience n''en a jamais détecté. La relativité restreinte interdit d''accélérer un corps massif au-delà de $c$, mais elle n''interdit pas à elle seule des particules qui vont toujours plus vite que la lumière (Bilaniuk, Deshpande et Sudarshan 1962 ; Feinberg 1967, qui a inventé le nom). Le prix à payer est la causalité. Deux événements reliés par un signal de vitesse $u > c$ sont séparés par un intervalle de genre espace, si bien que leur ordre temporel dépend de l''observateur : dans tout référentiel se déplaçant plus vite que $c^2/u$, le signal arrive avant d''être émis et transporte une énergie négative. La réinterprétation de Feinberg y voit un antitachyon d''énergie positive voyageant en sens inverse, ce qui sauve la positivité de l''énergie mais laisse la question « qui l''a envoyé ? » dépendre du référentiel. Avec deux référentiels, on obtient l''antitéléphone
  de Tolman (1917) : Alice envoie un signal à Bob, qui s''éloigne à $\beta$, et Bob répond à la même vitesse dans son propre référentiel. La réponse atteint Alice avant qu''elle n''ait envoyé son message dès que $\beta > 2u/(1+u^2)$, ce qui referme une boucle causale. En théorie quantique des champs, un $m^2$ négatif n''est pas une particule rapide mais une instabilité. Le champ dévale le sommet $\phi = 0$ de $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ jusqu''en $\phi = \pm\sqrt{-m^2/\lambda}$ (« condensation tachyonique », qui abaisse l''énergie de $m^4/4\lambda$), où vivent des particules ordinaires de masse$^2 = 2|m^2|$. C''est exactement ce que fait le champ de Higgs, et le panneau le montre sur un réseau avec un frottement de type Hubble. Données réelles : en 2011, OPERA a annoncé des neutrinos muoniques arrivant avec $60.7 \pm 6.9 \pm 7.4$ ns d''avance sur 730 km, soit $(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1). La cause s''est révélée être un câble
  à fibre optique mal connecté, plus une dérive d''horloge. Le résultat corrigé est $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ (v4, JHEP 10 (2012) 093), et ICARUS a mesuré $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns (Phys. Lett. B 713 (2012) 17) : tous deux compatibles avec $c$. Interprétée comme un tachyon, la valeur de 2011 exigerait $|m| \approx 120$ MeV, et les neutrinos de 10 MeV de la supernova SN1987A auraient alors devancé la lumière d''un facteur d''environ 12, au lieu d''arriver à quelques heures près après 168 000 ans ($|v-c|/c \lesssim 2\times10^{-9}$, Longo 1987). Unités : $c = 1$, masse du tachyon $\mu = 1$ pour l''éventail de signaux.'
meanings:
- 'racine carrée complexe : réelle lorsque $p > \mu$, bien que $m$ et $\gamma$ soient tous deux imaginaires'
- une transformation de Lorentz par référentiel d'observateur ($c = 1$)
- '$b$ répété ⇒ sommé : chaque signal vu depuis chaque référentiel d''un seul coup'
- l'invariant $m^2 = -\mu^2$, identique dans tous les référentiels
- 'les rapidités se soustraient : $\tanh$ en dessous de $c$, $\coth$ au-dessus'
- instant où la réponse atteint Alice ; $< t_{\mathrm{send}}$ referme une boucle causale
- champ sur réseau dévalant le faux vide $\phi = 0$ (laplacien par torch.roll, Verlet vitesse)
labels:
  u: Vitesse du signal tachyonique $u$
  beta_max: Référentiel d'observateur le plus rapide $\beta_\mathrm{max}$
  m2: Masse$^2$ tachyonique du champ $m^2$
  lam: Auto-couplage $\lambda$
  friction: Frottement de Hubble $\gamma$
