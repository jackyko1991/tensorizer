source_hash: 006d4ce1966d
title: 衰變鏈（Bateman 方程式）
summary: 母核衰變成具放射性的子核，子核再衰變成穩定的終產物。三條速率方程式構成一個線性系統 $\dot N_i = A_{ij} N_j$，以矩陣指數 $e^{At}$ 一次對所有時刻精確求解，並與 RK4 比對。預設的衰變鏈是醫用發生器 $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc。
notes: $\mathsf A$ 的每一行總和為零，因此 $\sum_i N_i$ 永不改變：每次衰變都把一個原子核沿鏈往下移。對兩個成員，精確（Bateman）解為 $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$。當子核壽命較短（$\lambda_2 > \lambda_1$）時，兩者的活度會鎖定在一起：比值 $a_2/a_1$ 趨近 $\lambda_2/(\lambda_2-\lambda_1)$（暫時平衡）；當母核壽命長得多時則趨近 1（長期平衡，試試母核半衰期 1000 h）。若讓子核壽命較長，則不會形成平衡。簡化：$^{99}$Mo 實際上只有約 88 % 的衰變產生 $^{99m}$Tc，而 $^{99}$Tc（半衰期 211 000 年）視為穩定。
meanings:
- $\ln 2/T_i$，穩定終產物的 $\lambda_3 = 0$
- 對角線為 $-\lambda_i$，其正下方為 $+\lambda_i$
- 重複的 $j$ ⇒ 求和：RK4 使用的右端項
- 每個時刻一個矩陣指數，沿 $t$ 批次計算
- 由初始向量得到各時刻的數量
- 活度：每個成員每小時的衰變數
labels:
  half_life_parent: 母核半衰期 $T_1$
  half_life_daughter: 子核半衰期 $T_2$
  t_max: 時間範圍
  rk4_steps: RK4 步數
