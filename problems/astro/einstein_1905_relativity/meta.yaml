notes: >
  This is one of Einstein's four 1905 "miracle year" papers — two of them, in fact: "On the electrodynamics of moving bodies" (June) and
  "Does the inertia of a body depend upon its energy content?" (September). The others are the light-quantum paper (quantum: Photoelectric effect
  and light quanta) and Brownian motion (thermodynamics: Random walk and diffusion). For relativity as geometry see Special relativity:
  Minkowski diagrams (astro), for the field tensor the Lorentz boost of $F^{\mu\nu}$ (em), and for collisions Four-momentum and two-body
  decay (nuclear). Units $c = 1$, mirror spacing $D = 1$. Einstein's mass argument: a body at rest emits $L/2$ forwards and $L/2$ backwards;
  in a frame moving at $v$ the light carries $\gamma L$, more than $L$, and energy conservation in both frames forces the body's kinetic
  energy to drop by $L(\gamma - 1)$, exactly what a mass $L/c^2$ would carry (he kept only the low-speed term $\tfrac12 (L/c^2)v^2$).
  Atomic masses are AME2020. Real data (data/frisch_smith_1963_muons.csv): D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963),
  doi:10.1119/1.1969508 — muons slowed to the same energy, $563 \pm 10$ per hour at 1917 m on Mt Washington and $408 \pm 9$ per hour at
  sea level (published measurement values; Wikipedia's summary rounds the latter to 412). The flight takes about 6.4 μs, almost three
  muon lifetimes of 2.2 μs, so without time dilation only about 30 per hour would arrive; the counts give the muon clock 0.71 μs and
  $\gamma \approx 9.1 \pm 0.8$ (the paper, with its measured decay curve: $8.8 \pm 0.8$). The prediction from the speeds integrates the
  slowdown from $\beta \approx 0.995$ to $\approx 0.989$ through the air (ionisation loss $dE/dx$, isothermal atmosphere): about 8.4,
  as in the paper. Rossi and Hall (1941) first showed the effect with cosmic-ray muons at Echo Lake and Denver.
