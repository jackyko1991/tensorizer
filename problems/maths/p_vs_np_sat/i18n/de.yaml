source_hash: bed4e5f065d8
title: P vs NP und der Phasenübergang von 3-SAT
summary: 'Ist jedes Problem, dessen Lösungen leicht zu überprüfen sind, auch leicht zu lösen? Das ist die Frage P vs NP, offen seit 1971. Zufälliges 3-SAT macht die Asymmetrie greifbar: Eine vorgeschlagene Belegung zu prüfen kostet ein Gather und zwei Reduktionen, während die erschöpfende Suche alle $2^n$ Belegungen auf einmal als einen einzigen gepackten Bit-Tensor auswertet, dessen Größe sich mit jeder Variablen verdoppelt. Variiert man das Verhältnis $\alpha$ von Klauseln zu Variablen, zeigt sich der Erfüllbarkeits-Phasenübergang nahe $\alpha_c \approx 4.27$, und der Suchaufwand erreicht innerhalb des Übergangsfensters sein Maximum.'
notes: 'P vs NP fragt, ob jedes Entscheidungsproblem, dessen Ja-Antworten Zertifikate besitzen, die sich in Polynomialzeit prüfen lassen (die Klasse NP), auch in Polynomialzeit gelöst werden kann (die Klasse P). Cook (1971) und Levin (1973) bewiesen, dass das Erfüllbarkeitsproblem NP-vollständig ist: Ein Polynomialzeit-Algorithmus für 3-SAT ergäbe einen für jedes Problem in NP. Ob es einen gibt, ist unbekannt. Die meisten Forschenden erwarten P $\ne$ NP, doch es gibt keinen Beweis, und bekannte Barrieren (Relativierung, natürliche Beweise, Algebrisierung) schließen ganze Familien von Beweisstrategien aus. Die Frage ist eines der sieben Millennium-Preisprobleme des Clay-Instituts und offen. Dieses Programm beweist nichts darüber: Die erschöpfende Suche ist lediglich der naheliegende Algorithmus, und die besten bekannten 3-SAT-Algorithmen sind weiterhin exponentiell (etwa $1.307^n$ für PPSZ). Was es zeigt, ist die Asymmetrie. Der Verifizierer besteht aus einem Gather plus einem ODER und einem
  UND, also Aufwand $O(M)$. Die Suche baut die vollständige Wahrheitstabelle auf, ein Bit pro Belegung, 32 pro Ganzzahl gepackt, sodass der Tensor $2^n$ Bits hat und seine Laufzeit sich mit jeder Variablen verdoppelt (unten rechts; bei kleinem $n$ dominieren feste Gemeinkosten). Zufälliges 3-SAT mit $M = \alpha n$ Klauseln hat eine scharfe Schwelle: Friedgut (1999) bewies, dass der Übergang für $n \to \infty$ scharf wird, die statistische Physik (Mézard, Parisi und Zecchina 2002) sagt $\alpha_c \approx 4.267$ voraus, und Ding, Sly und Sun (2015) bewiesen die vorhergesagte Schwelle für $k$-SAT mit großem $k$. Für $k = 3$ ist der Wert 4.267 weiterhin eine Vermutung; bewiesen ist, dass Zufallsformeln unterhalb von $\alpha = 3.52$ mit hoher Wahrscheinlichkeit erfüllbar und oberhalb von 4.49 unerfüllbar sind. Bei kleinem $n$ liegt der 50-%-Durchgang oberhalb von 4.27 und wandert mit wachsendem $n$ nach unten (Finite-Size-Skalierung). Die Tests prüfen, dass der Verifizierer auf jeder Belegung
  mit der Brute-Force-Auswertung übereinstimmt, dass eine Klausel genau $1/8$ aller Belegungen ausschließt, dass die mittlere Anzahl der Lösungen dem ersten Moment $2^n (7/8)^M$ entspricht, dass $P_{\mathrm{sat}}$ monoton ist und nahe der Schwelle einbricht und dass das Fenster mit $n$ schmaler wird. Das Feld zum Suchaufwand zählt die Knoten einer Tiefensuche mit Backtracking, die $x_0, x_1, \ldots$ der Reihe nach festlegt und zurückgeht, sobald eine vollständig belegte Klausel falsch ist. Unterhalb der Schwelle findet sie schnell eine Lösung, weit oberhalb beschneiden kurze Widersprüche den Baum früh, und die schwersten Formeln liegen im Übergangsfenster (für diese einfache Suche bei $n = 16$ nahe $\alpha \approx 5$; Solver mit Unit-Propagation haben ihr Maximum nahe 4.3). Probieren Sie mehr Variablen, um die Kurven schärfer werden zu sehen, oder mehr Formeln für glattere Kurven.'
meanings:
- $B$ Formeln mit $M$ Klauseln aus je 3 verschiedenen Variablen, jede mit Wahrscheinlichkeit $\frac12$ negiert
- alle Literale aller Formeln in einem einzigen Gather
- 'der Verifizierer: $3M$ Nachschlagevorgänge, polynomial in $n$'
- Wahrheitstabelle von $x_j$ über alle $2^n$ Belegungen, 32 Belegungen pro Ganzzahl
- eine Klausel, ausgewertet auf allen $2^n$ Belegungen mit bitweisem ODER (XOR mit lauter Einsen negiert)
- UND über die Klauseln nacheinander; Ebene $d$ sammelt nur Klauseln, deren Variablen unter den ersten $d$ liegen, was den Backtracking-Baum ergibt
- verschachtelte Formeln (Präfixe einer einzigen Klauselliste) liefern alle $\alpha = M/n$ in einem Durchgang und machen $P_{\mathrm{sat}}$ monoton nicht wachsend
labels:
  n_max: Variablen $n$ (größte Größe)
  instances: Formeln pro Größe
