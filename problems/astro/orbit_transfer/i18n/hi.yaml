source_hash: c0b25ec18fe5
title: होमान और द्वि-दीर्घवृत्तीय कक्षा स्थानांतरण
summary: किसी अंतरिक्ष यान को एक वृत्ताकार कक्षा से दूसरी में ले जाने के लिए कितना $\Delta v$ चाहिए? विस-वाइवा (vis-viva) समीकरण $v^2 = \mu(2/r - 1/a)$ दो-दहन वाले होमान (Hohmann) स्थानांतरण और तीन-दहन वाले द्वि-दीर्घवृत्तीय (bi-elliptic) स्थानांतरण की लागत बताता है, और एप्सिस बिंदुओं (apsides) पर आवेगी दहनों के साथ एक बैच RK4 समाकलन जाँचता है कि हर यान वास्तव में लक्ष्य कक्षा पर पहुँचता है।
notes: 'होमान स्थानांतरण उस दीर्घवृत्त का आधा भाग तय करता है जो दोनों वृत्तों को छूता है, $a = (r_1 + r_2)/2$: पेरियाप्सिस (periapsis) पर एक अग्रगामी दहन $\Delta v_1$ और एपोएप्सिस (apoapsis) पर कक्षा को वृत्ताकार बनाने के लिए दूसरा दहन $\Delta v_2$, समय $t_H = \pi\sqrt{a^3/\mu}$ के बाद। द्वि-दीर्घवृत्तीय स्थानांतरण पहले एक दूर की त्रिज्या $r_b$ तक चढ़ता है, जहाँ यान धीमा होता है और एक छोटा दहन कक्षा के दूसरे सिरे को $r_2$ तक उठा देता है, फिर पहुँचने पर ब्रेक लगाता है। इसमें बहुत अधिक समय लगता है, पर $r_2/r_1 \gtrsim 11.94$ के लिए पर्याप्त दूर का $r_b$ इसे सस्ता बना देता है (सीमा $r_b \to \infty$ की लागत $(\sqrt2 - 1)(v_{c1} + v_{c2})$ है), और $r_2/r_1 \approx 15.58$ से ऊपर हर $r_b > r_2$ सस्ता होता है। दोनों संक्रमण बिंदु द्विभाजन (bisection) से संख्यात्मक रूप से मिलते हैं, दूसरा autograd अवकलज के साथ। डिफ़ॉल्ट निम्न पृथ्वी कक्षा (लगभग 320 km ऊँचाई) से भूस्थिर कक्षा तक है: होमान द्वारा लगभग 3.9 km/s और 5.3 h। पृथ्वी → मंगल के लिए सूर्य को $r_1 = 1$ AU और $r_2 = 1.524$ AU के साथ चुनें: कुल
  मिलाकर सूर्यकेंद्रीय रूप से लगभग 5.6 km/s और लगभग 259 दिन (रन यह स्थिति हमेशा छापता है)। वास्तविक मिशनों को पृथ्वी के गुरुत्व कूप से भी बाहर निकलना पड़ता है और ग्रहों की सही स्थिति की प्रतीक्षा करनी पड़ती है; यहाँ कक्षाएँ वृत्ताकार और समतलीय हैं और दहन तात्क्षणिक हैं। रन हर दहन पर RK4 समाकलन को विभाजित करता है ताकि हर दहन ठीक किसी एप्सिस बिंदु पर हो।'
meanings:
- पिंड के केंद्र के सापेक्ष यान $b$ की स्थिति, km में
- यान $b$ का वेग, km/s में
- 'दोहराया गया $j$ ⇒ योग: वर्ग दूरी $r_b^2$'
- केंद्र की ओर व्युत्क्रम-वर्ग खिंचाव, $\mu = GM$
- अर्ध-दीर्घ अक्ष $a$ वाली कक्षा पर त्रिज्या $r$ पर चाल; हर $\Delta v$ ऐसी दो चालों का अंतर है
- यान $b$ के दहन $k$ का समय और चिह्नित परिमाण ($\Delta v < 0$ ब्रेक लगाता है)
- वेग की दिशा में आवेगी दहन, दो RK4 खंडों के बीच लगाया गया
- दहनों के बीच संरक्षित; हर दहन इसे अगली कक्षा के $-\mu/2a$ पर कूदा देता है
- $r_b = r_2$ पर ढाल; $r_2/r_1 \approx 15.58$ से ऊपर यह ऋणात्मक हो जाती है
labels:
  body: केंद्रीय पिंड
  r1: प्रारंभिक त्रिज्या $r_1$
  r2: लक्ष्य त्रिज्या $r_2$
  transfer: स्थानांतरण
  rb_ratio: द्वि-दीर्घवृत्तीय मध्यवर्ती त्रिज्या $r_b / r_2$
