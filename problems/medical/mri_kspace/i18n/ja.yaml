source_hash: 3ad16fadfd42
title: MRI の k 空間：勾配磁場とフーリエ変換による画像化
summary: 勾配磁場によって各画素が固有の歳差位相をもつので、コイルは画像のフーリエ変換を記録する：$s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$、ただし $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$。エンコード行列の einsum として書くと FFT に一致する。k 空間を1ラインずつ埋めて逆変換すると画像が鮮明になっていく。ラインを間引くと画像が折り返し（エイリアシング）、中心だけを残すとギブスリンギングを伴ってぼやける。
notes: 1ラインおき（$R = 2$）にすると撮像視野が半分になる：ゼロ埋めした画像は厳密に $\tfrac12[\rho(p) + \rho(p + N/2)]$ であり、$\mathrm{FOV}/2$ だけずれて回り込んだコピーが重なる。中心のラインだけを残すと DC 成分は保たれるので全強度は保存されるが、エッジが失われる：画像はぼやけてリンギング（ギブス）が生じる。正則化再構成では、中心のラインから推定した頭部マスクの外側の信号にペナルティを課して、画像の各列について小さな最小二乗問題を解く。ランダムな間引きの誤差は少し減らせるが、折り返した2つのコピーがともに頭部内に入る規則的なエイリアシングは取り除けない。実際のスキャナーでは複数のコイル（パラレルイメージング）やスパース性の事前分布（圧縮センシング）を加える。ファントムは古典的な Shepp–Logan 頭部ファントムであり、説明用で、臨床には使用できない。
meanings:
- プロトン密度画像：画素の行 $p$（位相エンコード方向）、列 $r$（読み出し方向）
- 勾配磁場の積分 $\tfrac{\gamma}{2\pi}\int G\,dt$ として得られる k 空間の位置。刻みは $\Delta k = 1/\mathrm{FOV}$
- k 空間ライン $u$ における画素 $p$ の位相 $e^{-2\pi i\,up/N}$。2次元の行列 $E_{kx}$ は $E_{up}E_{vr}$ に分解される
- 繰り返される $p, r$ ⇒ 和をとる：測定される k 空間信号。fft2(rho) と一致する
- サンプリングマスク：取得した位相エンコードラインで 1
- ゼロ埋め再構成
- 画像の列 $r$ ごとのチホノフ正則化最小二乗法。頭部の外側の信号にペナルティを課す
labels:
  size: 画像サイズ $N$
  R: 間引き係数 $R$（$R$ ラインごとに1本）
  lowpass: 残す k 空間の中心の割合
  random_frac: ランダムに残すラインの割合
  lam: チホノフの重み $\lambda$
  n_frames: 充填のフレーム数
