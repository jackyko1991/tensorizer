source_hash: 955b219d37d6
title: 깁스 에너지 최소화에 의한 화학 평형
summary: 메테인–공기 불꽃에서는 무엇이 나올까? 고정된 $T$와 $P$에서 생성물은 모든 원소의 보존 $A_{ij} n_j = b_i$를 만족하면서 깁스 에너지 $G = \sum_j n_j \mu_j$가 가장 낮은 곳에 자리 잡는다. 배치 뉴턴법(RAND 방법)이 10개 화학종을 넓은 온도 범위에서 동시에 풀어, 기체가 뜨거워질수록 CO₂와 H₂O가 CO, H₂, OH, H, O로 분해되는 모습을 보여 주고 단열 불꽃 온도를 찾는다.
notes: '왜 $G$를 최소화할까? 일정한 $T$와 $P$에서 열역학 제2법칙에 따르면 닫힌계는 깁스 에너지를 낮추는 방향으로만 변할 수 있으므로, 평형은 모든 원자를 보존하는 범위에서 $G$의 최저점, 즉 제약 조건이 있는 최소화 문제이다. 원소마다 하나씩인 라그랑주 승수 $\pi_i$를 쓰면 조건은 $\mu_j/RT = \sum_i \pi_i A_{ij}$이다. 각 화학종의 화학 퍼텐셜은 그 원자들의 "원소 퍼텐셜"의 합이다. 이는 반응마다 하나씩인 평형 상수 목록을 모든 화학종에 대한 하나의 최적화로 바꾸며, NASA CEA, STANJAN, Cantera 같은 코드가 불꽃, 로켓 배기, 대기를 계산하는 방식이다. 여기서 쓰는 풀이법은 Gordon–McBride 형식의 RAND 방법(NASA RP-1311)이다. $\ln n_j$에 대한 뉴턴법을 $\pi_i$와 $\Delta\ln n_{tot}$에 대한 작은 $(E{+}1)\times(E{+}1)$ 계로 줄이고, 주요 화학종이 한 단계에 최대 $e^2$배까지만 변하도록 단계를 제한한다. 로그로 계산하므로 몰분율 $10^{-30}$인 미량 화학종도 양수이고 정확하게 유지된다. 콘솔은 두 가지 최적성 검사(원소 균형과 $\mu_j/RT = \pi_i A_{ij}$, 둘 다 기계 정밀도 수준)와 자동 미분 검사(torch로 $G/RT$를 미분하면 $\pi_i A_{ij}$가 나옴)를 출력한다. 볼 점: 약 1500 K 아래에서 생성물은 CO₂, H₂O, N₂뿐이며(희박하면 O₂도), 2000 K 위에서는 해리된다(CO₂ → CO + ½O₂, H₂O → OH + ½H₂, 그다음 원자로). 엔트로피 항 $-T\,S$가 결합 엔탈피를 이기기 때문이다. 해리는 열을 흡수하므로 평형 불꽃은 생성물이 그대로 남은 경우(오른쪽 아래)보다 약 100 K 차갑고, 가장 뜨거운 불꽃은 화학량론보다 약간 연료 과잉 쪽에서 탄다. $P$를 높이면 르 샤틀리에 원리를 볼 수 있다. 분자 수가 적은 쪽이 유리해지므로 해리가 억제된다.
  데이터: $\Delta_f H^\circ$(298 K)와 $S^\circ$(298 K)는 NIST-JANAF 표에서 반올림한 값이다. 열용량은 $T$의 함수로 표에 나온 값이 아니라 예시용 상수(대략 298–2000 K의 평균 $c_p$)이므로 조성은 반정량적이다. 이 모형은 1 bar의 화학량론 메테인–공기에 대해 $T_{ad} \approx 2260$ K를 주는데, 정확한 열화학으로는 약 2225 K이다. 단순화: 이상 기체, 응축상 없음(그을음이나 액체 물 없음), 생성물에 CH₄나 다른 탄화수소 없음, 그리고 평형만 고려함. 실제 불꽃에서는 열역학이 아니라 반응 속도론이 CO와 NO를 동결시킨다.'
meanings:
- 화학종 $j$(CO₂, H₂O, CO, H₂, O₂, N₂, OH, H, O, NO)에 들어 있는 원소 $i$(C, H, O, N)의 원자 수
- CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂)로 공급된 원자, 당량비 $\varphi$마다 한 행
- '배치: 각 온도는 독립된 최소화 문제이며 함께 풂'
- $\Delta_f H^\circ$, $S^\circ$, 상수 $c_p$로부터 얻은 $[H_j(T) - T S_j(T)]/RT$
- '반복된 $j$ ⇒ 합산: 각 혼합물의 깁스 에너지'
- 존재하는 각 원소의 원자 수; 해에서는 $b_i$와 같음
- '$j$ 합산: 뉴턴 행렬, 행마다 가중된 $A\,\mathrm{diag}(n)\,A^{\mathsf T}$'
- 온도마다 작은 $(E{+}1)\times(E{+}1)$ 계 하나, 한 번의 호출로 모두 풂
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$, $i$ 합산; NASA CEA처럼 감쇠
- '자동 미분 검사: 최소점에서 $\pi_{bi}A_{ij}$와 같음(라그랑주 조건)'
- '생성물 엔탈피; 반응물 엔탈피와 같아질 때까지 $T$에 대해 이분법: $T_{ad}$'
labels:
  phi: 당량비 $\varphi$ (연료 / 화학량론 연료)
  P_bar: 압력 $P$
  T_max: 온도 범위의 최고 온도
