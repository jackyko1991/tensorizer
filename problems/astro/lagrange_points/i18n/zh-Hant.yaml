source_hash: 28d4b810cb16
title: 限制性三體問題的拉格朗日點
summary: 恆星與行星互相繞轉；在它們的旋轉座標系中，測試粒子受到重力、離心力與科氏力，後兩者以 $\varepsilon_{ijk}$ 表示。對 $\nabla\Phi_\mathrm{eff} = 0$ 使用牛頓法（梯度與 Hessian 由 autograd 求得），一次找出全部五個拉格朗日點；被推離 L4 的粒子則描出蝌蚪形與馬蹄形軌道。
notes: 單位：兩者間距為 1，$G(M_1 + M_2) = 1$，因此這對天體每 $2\pi$ 轉一圈。行星的質量分率為 $\mu$，測試粒子輕到不會擾動任一天體。L1、L2、L3 位於通過兩天體的直線上，是 $\Phi_\mathrm{eff}$ 的鞍點；L4、L5 與兩天體構成正三角形，是 $\Phi_\mathrm{eff}$ 的極大值，但當 $\mu < 0.0385$ 時科氏力使它們穩定。這就是木星的特洛伊小行星聚集在其前後 60° 的原因。推得愈大，小蝌蚪環就變成大蝌蚪環，最後成為也繞過 L3 的馬蹄形軌道。若 $\mu$ 大於 0.0385，粒子便會漂走。
meanings:
- 測試粒子 $b$ 在旋轉座標系中的位置
- 恆星位於 $(-\mu, 0, 0)$，行星位於 $(1-\mu, 0, 0)$
- 重複的 $s$ ⇒ 求和：兩天體的重力
- 用於外積的 Levi-Civita 符號
- 科氏加速度，$\boldsymbol\Omega = \hat{\mathbf z}$
- 以 autograd 在五個點求梯度
- 以 autograd 求 Hessian：牛頓步是一次批次 linalg.solve
- $-2\Phi_\mathrm{eff} - \dot x_i\dot x_i$，守恆量
labels:
  mu: 行星質量分率 $\mu$
  nudge: 沿軌道離 L4 的最大推移
  t_max: 模擬時間
  dt: 時間步長
