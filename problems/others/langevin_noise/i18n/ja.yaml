source_hash: fa6ec3302fec
title: ノイズとランジュバン方程式
summary: 調和トラップ中のブラウン粒子は、周りの分子からランダムに叩かれます。ランジュバン方程式はこのノイズ項 $\sqrt{2\gamma k_BT}\,dW$ をニュートンの法則に加えます。 Euler–Maruyama 法で粒子のアンサンブル全体を一つのバッチテンソルとして同時に進めると、位置の広がりはボルツマン分布 $N(0, k_BT/k)$ に落ち着きます（エネルギー等分配）。
notes: 摩擦だけなら、ニュートンの法則では粒子はトラップの底で止まってしまいます（太い赤の曲線）。しかし流体中の実際の粒子は決して止まりません。分子があらゆる方向から衝突し、そのランダムな力がランジュバン方程式のノイズ項（誤差項）です。その大きさは自由には選べません。揺動散逸定理がそれを $\sqrt{2\gamma k_BT}$ に固定します。摩擦 $\gamma$ を生む同じ衝突が粒子を叩くので、アンサンブルは温度 $T$ で平衡に達し、 $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$（エネルギー等分配）、位置は $N(0, k_BT/k)$ に従って分布します。ウィーナー増分 $dW$ の分散は $dt$ です。有限の刻みでは $\sqrt{\Delta t}\,\xi$（$\xi \sim N(0,1)$）となり、1ステップあたりの速度の衝撃の分散は $2\gamma k_BT\Delta t/m^2$ です。もしノイズを $\Delta t$ に比例させると、刻みを小さくすると消えてしまいます。ランダムな衝撃はランダムウォークのように足し合わされるので、その広がりは $\sqrt{t}$ のように増えます。方程式が線形なので、アンサンブル平均 $\langle x\rangle$ はノイズのない減衰振動子に正確に従います（赤の上の黒い破線）が、個々の軌道はさまよいます。 $T = 0$（純粋な減衰振動子）、大きな $\gamma$ と小さな $m$（過減衰ブラウン運動：$\langle x^2\rangle$ は振動せずに速さ $2k/\gamma$ で緩和）、あるいは小さな $\gamma$（平衡へのゆっくりした接近）を試してみてください。簡略化：$k_B = 1$ の換算単位、1次元、白色（無相関）ノイズ、そして平衡分散に $O(\Delta t)$ の偏りが残る1次のスキーム。
meanings:
- ステップ $n$ における粒子 $b$ の位置と速度：アンサンブル全体が一つのバッチ
- ノイズテンソル、1ステップに1行：独立な標準正規乱数（固定シード）
- 1ステップあたりのランダムな衝撃の大きさ。$\Delta t$ ではなく $\sqrt{\Delta t}$ に比例する
- 決定論的な加速度：摩擦とばね
- Euler–Maruyama ステップ。位置は新しい速度を使う（シンプレクティック Euler）
- アンサンブル平均：繰り返された $b$ ⇒ 粒子について和をとる
- 平衡での $\langle x^2\rangle$ と $\langle v^2\rangle$：$\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$
labels:
  temperature: 温度 $k_BT$
  gamma: 摩擦 $\gamma$
  k: ばね定数 $k$
  m: 質量 $m$
  n_particles: 粒子数 $B$
  t_max: 時間 $t_{max}$
