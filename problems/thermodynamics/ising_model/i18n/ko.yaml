source_hash: f24d1ad2823c
title: 2차원 이징 모형
summary: 이웃과 나란히 정렬하려는 $\pm 1$ 스핀들의 격자. 모든 자리의 이웃 합은 십자 모양 커널을 쓴 conv2d 하나이며, 체커보드 메트로폴리스 갱신으로 격자의 절반을 병렬로 뒤집습니다. 임계 온도 아래에서는 자기 구역이 커져 자석이 정렬되고, 그 위에서는 스핀이 무질서하게 남습니다.
notes: '단위: $J = k_B = 1$이므로 $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$입니다. 배치에서 세 격자가 나란히 돌아갑니다: 선택한 $T$, $T_c$, 그리고 $T = 3.5$. 모두 무작위 스핀(무한대 온도)에서 시작해 갑자기 냉각됩니다. 모든 자리를 한꺼번에 갱신하면 틀립니다. 이웃들이 낡은 값을 바탕으로 뒤집히기 때문입니다. 하지만 체커보드의 한 색 자리는 다른 색 자리와만 맞닿으므로 각 절반은 병렬로 갱신할 수 있습니다. 낮은 $T$로 급랭하면 두 개의 줄무늬 구역에 오랫동안 갇힐 수 있는데, 주기적 격자 위 동역학의 실제 특징입니다. 유한한 격자에서는 $T_c$ 위에서도 $\lvert m\rvert$가 정확히 0이 아니며, $T_c$ 근처에서는 크게 요동합니다(임계 감속). $E/N$은 $-2$(완전한 정렬)에서 0까지 변합니다.'
meanings:
- 행 $i$, 열 $j$의 스핀 $\pm 1$ — $B$개 온도의 배치 (1은 conv2d 채널)
- 가장 가까운 이웃 넷을 고르는 합성곱 커널
- '반복된 $k, l$ ⇒ 합: 이웃 합, 주기적 가장자리'
- 각 스핀을 단독으로 뒤집는 비용
- '반복된 $i, j$ ⇒ 합: 결합 에너지의 두 배 (모든 결합을 양 끝에서 봄)'
- 격자마다 온도 하나, 자리들에 브로드캐스팅
labels:
  T: 온도 $T$
  L: 격자 크기 $L$
  n_sweeps: 몬테카를로 스윕 수
