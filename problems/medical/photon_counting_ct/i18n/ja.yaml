source_hash: e03f3730cc96
title: フォトンカウンティング CT と物質弁別
summary: フォトンカウンティング検出器はすべての X 線光子をエネルギービンに振り分けるので、各レイは一つではなく複数のベール–ランベルト測定 $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$ を与える。バッチ化した最尤推定（autograd による勾配、フィッシャースコアリングのステップ）により、各レイのポアソンカウントを水、骨、ヨウ素の線積分に変換する。フィルター補正逆投影で物質マップと仮想単色 X 線画像を作り、従来のスキャナーでは同一に見えるヨウ素と骨を区別する。
notes: フォトンカウンティング検出器（テルル化カドミウムまたはシリコン）は単一光子を検出し、各パルスの高さを複数の閾値と比較するので、各エネルギービンのカウントは独立したベール–ランベルト測定になる。最初のフォトンカウンティング CT スキャナーは 2021 年に米国 FDA の承認を受け、それ以来スペクトルイメージング、より鮮明な分解能、より低い電子ノイズが研究から臨床へと移ってきた。三つの物質には少なくとも三つのビンが必要である：水と骨は主に光電効果によって異なり、ヨウ素は 33.2 keV に K 吸収端を加えるので、35 keV 付近の閾値が役立つ（25、50、75 keV の設定を試してみよう）。骨インサートは 10 mg/mL のヨウ素インサートとエネルギー加重減弱が等しくなるまで希釈してあるので、従来画像では両者が同じに見える。物質マップは両者を区別する。仮想単色 X 線画像 $\mu_m(E)a_m$ は低エネルギーでヨウ素のコントラストを高め、従来画像に見られるビームハードニングによるカッピングがない。三物質弁別はノイズを増幅する（基底の減弱曲線がほぼ平行なため）ので、ヨウ素の誤差は $1/\sqrt{N_0}$ でしか減らず、中程度の線量ではピクセルあたり数 mg/mL になる。臨床システムではしばしば二つの基底物質、ノイズ除去、逐次近似再構成を用いる。単純化：平行ビーム、ガウス型のエネルギー分解能を除いて理想的な検出器（電荷共有、パイルアップ、K エスケープなし）、散乱なし、丸めた減弱係数表。教育用モデルであり、臨床用ではない。
meanings:
- ピクセルあたりの基底量：水の割合、骨の割合、ヨウ素（mg/mL）
- 各基底マップのラドン変換：レイ $r = (\theta, s)$ に沿った水の cm、骨の cm、ヨウ素の mg/cm²
- 1 keV グリッド上の各基底物質の減弱（XCOM、両対数補間、ヨウ素の K 吸収端は 33.2 keV）
- フィルター後の管球スペクトル。エネルギー $E_e$ の光子がビン $b$ で数えられる確率（ガウス型エネルギー分解能）
- ビンごとのベール–ランベルト：$m$、続いて $e$ の繰り返し ⇒ 和。カウントは $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$
- ポアソン負の対数尤度の勾配。レイは独立なので、一回の逆伝播で各レイがそれぞれの勾配を得る
- フィッシャー情報量、$b$ の繰り返し ⇒ 和。$J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- レイごとに一回の $3\times 3$ 求解をバッチで：フィッシャースコアリング（ニュートン法的）ステップ
- 再構成した基底マップから得るエネルギー $E$ での仮想単色 X 線画像。HU で表示
labels:
  kvp: 管電圧
  dose: レイあたりの光子数 $N_0$
  thresholds: エネルギー閾値（keV）
  sigma_kev: エネルギー分解能 $\sigma$
  n_pixels: 画像サイズ $N$
  n_angles: 投影角度数
