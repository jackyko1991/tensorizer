source_hash: b1957b563a0a
title: ग्रहों की गति के केप्लर नियम
summary: 'विभिन्न कक्षा आकारों और उत्केंद्रताओं वाले ग्रह न्यूटन के व्युत्क्रम-वर्ग गुरुत्व के अंतर्गत एक तारे की परिक्रमा करते हैं। एक बैच RK4 समाकलन केप्लर के तीनों नियम दिखाता है: तारा एक नाभि पर रखे दीर्घवृत्त, समान समय में समान क्षेत्रफल, और $T^2 \propto a^3$।'
notes: 'मात्रक AU, वर्ष और सौर द्रव्यमान हैं, अतः $GM_\odot = 4\pi^2$ और केप्लर का तीसरा नियम सीधे $T^2 = a^3$ बन जाता है। हर ग्रह उपसौर (perihelion) से वाइस-वाइवा (vis-viva) चाल $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$ के साथ शुरू होता है। सबसे उत्केंद्र कक्षा की छायांकित फाँकें प्रत्येक समान समय $T/12$ लेती हैं: तारे के पास छोटी और चौड़ी, दूर लंबी और पतली, पर क्षेत्रफल सदा समान, क्योंकि $dA/dt = L/2$ और $L$ संरक्षित है। आवर्तकाल अनुकरण से $2\pi$ घूमने के समय के रूप में मापा जाता है। तारे को स्थिर माना गया है (उसका द्रव्यमान ग्रहों से बहुत अधिक है) और ग्रह एक-दूसरे को नहीं खींचते।'
meanings:
- तारे के सापेक्ष ग्रह $b$ की स्थिति, $i \in \{x, y\}$
- ग्रह $b$ का वेग
- 'दोहराया गया $j$ ⇒ योग: दूरी का वर्ग $r_b^2$'
- तारे की ओर व्युत्क्रम-वर्ग खिंचाव
- 2D लेवी-चिविटा प्रतीक, $\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- प्रति इकाई द्रव्यमान कोणीय संवेग; $dA/dt = L_b/2$ स्थिर है
- $\tfrac12 v^2 - GM/r$; इससे $a = -GM/2E$ मिलता है
labels:
  n_planets: ग्रह
  e_max: सबसे बड़ी उत्केंद्रता $e$
  t_max: अनुकरण समय
  dt: समय चरण
