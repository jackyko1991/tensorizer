source_hash: 695e730c122f
title: $N$ दरवाज़ों वाली मॉन्टी हॉल पहेली
summary: '$N$ दरवाज़ों में से एक के पीछे एक कार छिपी है। आप एक चुनते हैं; मेज़बान, जो जानता है कि कार कहाँ है, बकरियों वाले $N-2$ दरवाज़े खोलता है और आपको आख़िरी बंद दरवाज़ा देता है। 3 से 1000 तक हर $N$ के लिए लाखों खेल एक ही $(B, G)$ टेंसर में एक साथ चलते हैं: बदलने पर जीत की प्रायिकता $(N-1)/N$ है (तीन दरवाज़ों के लिए प्रसिद्ध $2/3$), टिके रहने पर $1/N$, और हर चालू जीत दर अपने द्विपद त्रुटि बैंड के भीतर रहती है।'
notes: 'बदलना तभी हारता है जब आपका पहला चुनाव पहले से ही कार हो, जिसकी प्रायिकता $1/N$ है; बाकी हर बार मेज़बान का चुनाव मजबूर होता है, इसलिए जो दरवाज़ा वह बंद छोड़ता है उसमें उसके खोले सभी दरवाज़ों की जानकारी होती है। 1000 दरवाज़ों के साथ उत्तर स्पष्ट है, और तर्क वही है जो तीन के साथ। यह पहेली मैरिलिन वॉस सावंत (Marilyn vos Savant) के 1990 के पत्रिका स्तंभ से प्रसिद्ध हुई, जब गणितज्ञों सहित कई पाठकों ने ज़ोर दिया कि उत्तर $1/2$ है। वह अंतर्ज्ञान एक अलग खेल के लिए सही है: अनजान मेज़बान चुनें, जो दरवाज़े यादृच्छिक रूप से खोलता है और कभी-कभी कार दिखा देता है। ऐसे खेलों को हटा देने पर (केवल $2/N$ अंश बचता है) टिके रहना और बदलना ठीक $1/2$ पर रह जाते हैं, क्योंकि यादृच्छिक रूप से खोला गया दरवाज़ा आपके दरवाज़े के बारे में कुछ नहीं बताता। टर्मिनल यह भी जाँचता है कि कोई भी पहला चुनाव विशेष नहीं है, और परीक्षणों में एक धीमा, खेल-दर-खेल संदर्भ टेंसर संस्करण से मेल खाता है।'
meanings:
- साथ-साथ तुलना की गई दरवाज़ों की संख्याएँ, 3 से 1000 तक
- पंक्ति $b$ में खेल $g$ का कार वाला दरवाज़ा और पहला चुनाव, $N_b$ दरवाज़ों पर एकसमान; broadcasting हर पंक्ति को उसका अपना $N_b$ देता है
- 'वह दरवाज़ा जो मेज़बान बंद छोड़ता है: आपके बकरी चुनने पर अनिवार्य रूप से कार, आपके कार चुनने पर कोई यादृच्छिक दरवाज़ा'
- 'मेज़बान द्वारा खोले गए $N-2$ दरवाज़े: $p$ और $k$ को छोड़कर हर दरवाज़ा'
- टिके रहने की जीत और बदलने की जीत; हर खेल में इनमें से ठीक एक सत्य है
- 'संचयी जीतें बटा संचयी वैध खेल: हर खेल के बाद जीत दर'
- द्विपद अनुपात का $\pm 2\sigma$ बैंड, जिसके भीतर चालू दर लगभग 95 % समय रहती है
labels:
  n_games: प्रति दरवाज़ा संख्या खेल $G$
  max_doors: दरवाज़ों की सबसे बड़ी संख्या $N$
  host: मेज़बान
