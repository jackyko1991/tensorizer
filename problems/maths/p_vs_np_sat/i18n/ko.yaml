source_hash: bed4e5f065d8
title: P vs NP와 3-SAT 상전이
summary: 해를 확인하기 쉬운 문제는 모두 풀기도 쉬울까요? 이것이 1971년부터 미해결인 P vs NP 문제입니다. 무작위 3-SAT은 이 비대칭을 구체적으로 보여 줍니다. 제시된 할당을 확인하는 데는 gather 한 번과 축약 두 번이면 되지만, 전수 탐색은 $2^n$ 개의 할당 전부를 하나의 압축 비트 텐서로 한꺼번에 계산하며, 그 크기는 변수가 하나 늘 때마다 두 배가 됩니다. 절/변수 비율 $\alpha$ 를 바꿔 가면 $\alpha_c \approx 4.27$ 근처의 충족 가능성 상전이와 전이 구간 안에서 최고조에 이르는 탐색 비용을 볼 수 있습니다.
notes: P vs NP는 '예' 답에 대해 다항 시간에 검증할 수 있는 증명서가 있는 모든 결정 문제(클래스 NP)를 다항 시간에 풀 수도 있는지(클래스 P)를 묻습니다. 쿡(1971)과 레빈(1973)은 충족 가능성 문제가 NP-완전임을 증명했습니다. 즉 3-SAT에 대한 다항 시간 알고리즘이 있으면 NP의 모든 문제에 대한 다항 시간 알고리즘이 생깁니다. 그런 알고리즘이 존재하는지는 알려져 있지 않습니다. 대부분의 연구자는 P $\ne$ NP라고 예상하지만 증명은 없으며, 알려진 장벽들(상대화, 자연 증명, 대수화)은 증명 전략의 여러 계열 전체를 배제합니다. 이 문제는 일곱 개의 클레이 밀레니엄 상 문제 중 하나이며 미해결입니다. 이 프로그램은 이에 대해 아무것도 증명하지 않습니다. 전수 탐색은 그저 가장 뻔한 알고리즘일 뿐이며, 가장 좋은 것으로 알려진 3-SAT 알고리즘도 여전히 지수 시간입니다(PPSZ의 경우 약 $1.307^n$). 이 프로그램이 보여 주는 것은 비대칭입니다. 검증기는 gather 한 번과 OR, AND로 이루어지며 작업량은 $O(M)$ 입니다. 탐색은 할당마다 1비트씩, 정수 하나에 32개씩 채운 전체 진리표를 만들기 때문에 텐서는 $2^n$ 비트이고 시간은 변수가 하나 늘 때마다 두 배가 됩니다(오른쪽 아래; $n$ 이 작을 때는 고정 오버헤드가 지배적). 절이 $M = \alpha n$ 개인 무작위 3-SAT에는 날카로운 임계점이 있습니다. 프리드구트(1999)는 $n \to \infty$ 일 때 전이가 날카로워짐을 증명했고, 통계물리학(메자르, 파리시, 체키나 2002)은 $\alpha_c \approx 4.267$ 을 예측하며, 딩, 슬라이, 쑨(2015)은 큰 $k$ 에 대한 $k$-SAT에서 예측된 임계값을 증명했습니다. $k = 3$ 에 대해서는 4.267이라는 값이 여전히 추측입니다. 증명된 것은 무작위 논리식이 $\alpha = 3.52$ 아래에서는 높은 확률로 충족 가능하고 4.49 위에서는 충족 불가능하다는 것뿐입니다.
  $n$ 이 작을 때 50% 교차점은 4.27보다 위에 있으며 $n$ 이 커질수록 아래로 내려옵니다(유한 크기 스케일링). 테스트는 검증기가 모든 할당에서 전수 계산과 일치하는지, 절 하나가 전체 할당의 정확히 $1/8$ 을 제거하는지, 평균 해의 개수가 1차 모멘트 $2^n (7/8)^M$ 와 같은지, $P_{\mathrm{sat}}$ 가 단조이며 임계점 근처에서 급락하는지, 그리고 전이 구간이 $n$ 에 따라 좁아지는지를 확인합니다. 탐색 비용 패널은 $x_0, x_1, \ldots$ 를 차례로 고정하고 완전히 할당된 절이 거짓이 되는 즉시 되돌아가는 깊이 우선 백트래킹 탐색의 노드 수를 셉니다. 임계점 아래에서는 해를 빠르게 찾고, 임계점보다 훨씬 위에서는 짧은 모순이 트리를 일찍 가지치기하며, 가장 어려운 논리식은 전이 구간에 있습니다(이 단순한 탐색에서는 $n = 16$ 일 때 $\alpha \approx 5$ 근처; 단위 전파를 쓰는 솔버는 4.3 근처에서 최고조). 변수를 늘려 곡선이 날카로워지는 것을 보거나, 논리식 수를 늘려 더 매끄러운 곡선을 얻어 보세요.
meanings:
- 서로 다른 3개의 변수로 된 절 $M$ 개를 가진 논리식 $B$ 개, 각 변수는 확률 $\frac12$ 로 부정됨
- 모든 논리식의 모든 리터럴을 gather 한 번으로
- '검증기: $3M$ 번의 조회, $n$ 에 대해 다항식'
- 모든 $2^n$ 개 할당에 대한 $x_j$ 의 진리표, 정수 하나에 할당 32개
- 모든 $2^n$ 개 할당에서 비트 OR로 평가한 절 하나(모두 1인 값과의 XOR이 부정)
- 절을 하나씩 AND; 수준 $d$ 는 변수가 모두 처음 $d$ 개 안에 있는 절만 모으며, 이것이 백트래킹 트리를 줌
- 중첩된 논리식(하나의 절 목록의 접두부)은 한 번의 패스로 모든 $\alpha = M/n$ 을 주고 $P_{\mathrm{sat}}$ 를 비증가로 만듦
labels:
  n_max: 변수 $n$ (최대 크기)
  instances: 크기별 논리식 수
  seed: 난수 시드
