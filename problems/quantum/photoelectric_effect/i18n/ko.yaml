source_hash: 786f22a93dbf
title: 광전 효과와 광양자
summary: '아인슈타인의 1905년 광양자 논문: 진동수 $\nu$인 빛은 에너지 $h\nu$의 덩어리로 도착하며, 덩어리 하나가 전자 하나를 운동 에너지 $K = h\nu - \phi - \varepsilon$로 떼어 낸다. 광자 × 진동수 × 세기의 묶음은 문턱 진동수 $\nu_0 = \phi/h$, 세기와 무관한 저지 전위 $eV_s = h\nu - \phi$, 그리고 시간 지연이 없음을 보여 준다 — 모두 고전적 파동 그림과 어긋난다. 밀리컨의 1916년 나트륨 측정값에 대한 직선 피팅으로 플랑크 상수를 되찾는다.'
notes: '이것은 아인슈타인의 1905년 ''기적의 해'' 논문 네 편 중 하나다: 광양자와 광전 효과(이 문제; 1921년 노벨상, "특히 광전 효과의 법칙을 발견한 공로로"), 브라운 운동(thermodynamics: 무작위 걷기와 확산), 그리고 $E = mc^2$을 포함한 특수 상대성이론(astro: 아인슈타인 1905: 움직이는 물체와 $E = mc^2$). 파동 그림은 세 가지 면에서 실패한다: 어떤 진동수에서도 방출이 일어나고, 운동 에너지가 세기에 따라 커지며, 약한 빛에서는 몇 분의 지연이 생긴다고 예측한다(원자가 $S = 10$ mW/m²에서 $\phi$를 모으는 경우). 그러나 실험은 날카로운 문턱, 세기와 무관한 $V_s$, 측정 가능한 지연 없음(3 ns 미만, Lawrence와 Beams 1928)을 보인다. 더 밝은 빛은 광자가 더 많다는 뜻일 뿐이므로 전류는 커지지만 $V_s$는 움직이지 않는다. 빨간 사각형은 진공에서 깎아 낸 나트륨 표면에 대한 밀리컨의 1916년 저지 전위다(R. A. Millikan, Phys. Rev. 7, 355 (1916), 수은 스펙트럼선 네 개, 로스킬레 대학교 연습 문제집에 표로 실린 논문 값을 data/millikan_1916_sodium.csv로 옮겨 적음; 1916년 출판물, 퍼블릭 도메인). 밀리컨은 아인슈타인의 방정식을 반박하려 했으나 오히려 확인했다. 그의 기울기는 오늘날의 정확한 값 $6.62607015\times10^{-34}$ J s와 약 0.3 % 이내로 $h$를 준다. 절편 약 1.8 eV는 깨끗한 나트륨의 일함수(2.3 eV)가 아니다: 장치의 접촉 전위가 포함되어 있고, 표면은 아마 오염되었을 것이다(D. Lloyd, Am. J. Phys. 2015). 시뮬레이션의 금속은 이상화되어 있다(깊이가 평평한 띠, 각도 없음, 온도 없음): 직선 $eV_s = h\nu - \phi$는 정확하지만 전류 곡선의 모양은 개략적일 뿐이다.'
meanings:
- 빛의 진동수, 단위 $10^{14}$ Hz
- '광자 $n$을 흡수하는 전자의 깊이, $[0, 3]$ eV에서 균등 분포 ($i$: 세기)'
- '한 번의 브로드캐스트: 모든 진동수와 세기의 모든 광자를 한꺼번에; $K \le 0$ ⇒ 방출 없음'
- '저지 전압 $V$를 넘어서는 전자: 광전류'
- '저지 전위: 가장 빠른 전자; 모든 세기 $i$에서 같다'
- '밀리컨의 점들을 지나는 직선: 기울기 $a = h/e$, 절편 $b = -\phi/e$'
- '파동 그림: 복사 조도 $S$에서 원자 하나의 면적 $A$로 $\phi$를 흡수하는 데 걸리는 시간'
labels:
  phi: 일함수 $\phi$
  irradiance: 복사 조도 $S$ (파동 그림의 지연용)
  n_photons: 세기 1에서 노출당 광자 수
