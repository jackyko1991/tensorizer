source_hash: 9483d7c492cb
title: 星系旋转曲线与暗物质
summary: 远离星系中心的恒星与气体转得太快：SPARC 数据库的真实旋转曲线在可见质量预测开普勒式下降的地方仍保持平坦。一次批量 autograd 拟合同时处理所有星系，比较四种解释：只有重子（带质光比 $\Upsilon$）、重子加 NFW 暗物质晕、重子加有核心的 Burkert 晕，以及只用单一加速度 $a_0$ 的 MOND（径向加速度关系）。暗物质是由引力推断的，并未被直接探测到。
notes: 数据：SPARC（Lelli、McGaugh 与 Schombert 2016，AJ 152, 157）中的六个星系（NGC 3198、NGC 2403、NGC 6503、DDO 154、UGC 2885、NGC 7814），文件 Rotmod_LTG，原样复制到 data/sparc_rotation_curves.csv。来源 http://astroweb.cwru.edu/SPARC/，要求引用 SPARC 论文；Zenodo 上的镜像（doi:10.5281/zenodo.16284118）以 CC-BY-4.0 发布。3.6 μm 的质光比带有宽 0.1 dex 的先验，中心为 $\Upsilon_d = 0.5$、$\Upsilon_b = 0.7$（把先验设为 0 即可关闭）。拟合显示：没有任何合理的 $\Upsilon$ 能让重子达到外围平坦的速度（DDO 154 需要 $\Upsilon_d \approx 19$，远超任何恒星族群），所以需要看不见的质量或修改的动力学，正如 Rubin 与 Ford 在 1970 年代用光学光谱发现的。两种晕的形状都拟合得很好；矮星系 DDO 154 偏好有核心的晕（尖峰–核心问题）。单一的 $a_0 \approx 1.1\times10^{-10}$ m/s² 出奇地好地描述所有星系，正如径向加速度关系所说。诚实的现状：暗物质是由其引力推断的（旋转曲线、引力透镜、星系团、宇宙微波背景、结构形成）；尚未直接探测到任何暗物质粒子。MOND 用一个参数就能很好地拟合旋转曲线，但在星系团、子弹星系团与宇宙微波背景声学峰上遇到困难，也没有公认的相对论版本。此处距离与倾角固定（其误差未传递），MOND 采用最简单的代数形式。
meanings:
- 星系 $g$ 在半径 $r$ 的观测速度与误差，补齐到最长的曲线
- 真实数据点（1）或补齐（0）
- 速度平方相加；$\Upsilon$ 缩放 SPARC 的盘与核球（以 $\Upsilon = 1$ 计算）
- 冷暗物质模拟得到的尖峰晕，$\rho \propto 1/(x(1+x)^2)$
- 有核心的晕，$\rho \propto 1/((1+x)(1+x^2))$
- 所有星系共用一个函数与一个 $a_0$；没有晕
- 重复的 $r$ ⇒ 对每个星系的真实数据点求和
- 所有模型与星系合成一个标量：一次反向传播得到所有梯度（先 Adam，再 L-BFGS）
labels:
  iterations: L-BFGS 之前的 Adam 迭代次数
  lr: Adam 学习率
  prior_dex: $\Upsilon$ 先验的宽度（dex，0 = 不用）
