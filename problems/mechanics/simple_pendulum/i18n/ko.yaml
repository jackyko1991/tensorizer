source_hash: a761e752552d
title: 작은 각을 넘어선 단진자
summary: 여러 진폭에 대한 완전한 비선형 진자 방정식을 한꺼번에 풉니다. 모든 진자는 배치 텐서 하나에 들어 있으며, 각각을 학교에서 배우는 작은 각 근사의 코사인과 비교합니다.
notes: 작은 진동에서는 $\sin\theta \approx \theta$이고 모든 진자의 주기는 $2\pi\sqrt{L/g}$로 같습니다. 진폭이 크면 더 오래 걸립니다. 정확한 주기는 완전 타원 적분 $K$를 써서 $4\sqrt{L/g}\,K(\sin(\theta_0/2))$이며, 90°에서 약 18% 깁니다. 진폭이 큰 진자가 점선으로 그린 작은 각 짝보다 뒤처지는 것을 지켜보세요.
meanings:
- 연직선에서 잰 진자 $b$의 각
- 진자 $b$의 각속도
- '우변: 모든 진자에 대해 한꺼번에 $-(g/L)\sin\theta$'
- '작은 각 해: 외적이며 합하는 지표 없음'
- 단위 질량당 에너지 $\tfrac12L^2\omega^2 + gL(1 - \cos\theta)$, 보존량
labels:
  length: 줄 길이 $L$
  g: 중력 가속도 $g$
  n_pendulums: 진자 수
  max_amplitude: 최대 진폭
  t_max: 시뮬레이션 시간
