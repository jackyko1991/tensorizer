source_hash: 4e46f39a529c
title: '푸리에 신경 연산자: 버거스 방정식의 해 연산자 학습'
summary: 푸리에 신경 연산자(FNO)는 방정식 하나를 푸는 대신, 스펙트럼 솔버가 만든 데이터 쌍으로부터 점성 버거스 방정식 $u_t + u\,u_x = \nu\,u_{xx}$ 의 사상 $u_0(x) \mapsto u(x, T)$ 전체를 학습합니다. 핵심 층은 스펙트럼 합성곱입니다. 푸리에 변환을 하고, 복소 가중치 $R_{iok}$ 로 모드마다 채널을 섞고, 가장 낮은 $m$ 개의 모드만 남긴 뒤, 다시 역변환합니다. 가중치가 푸리에 모드 위에 정의되어 있으므로, 학습된 모델은 학습 때보다 더 촘촘한 격자에서도 동작합니다.
notes: '학습 데이터는 쌍 $(u_0, u(\cdot, T))$ 입니다. 무작위의 매끄러운 초기 조건(진폭이 $1/k$ 처럼 줄어드는 푸리에 모드 $k \le 5$ 의 합)과 그 해를 유사 스펙트럼 솔버로 256개 점에서 계산하고, 학습용으로 64개 점으로 솎아 냅니다. 신경망은 방정식을 전혀 보지 않고 솔버의 데이터만 봅니다. 텐서의 핵심은 스펙트럼 합성곱입니다. rfft 후에 각 샘플 $b$ 의 각 채널 $i$ 는 푸리에 계수 $\hat v_{bik}$ 가 되고, einsum(''bik,iok->bok'') 은 입력 채널 $i$ 에 대해 합을 하지만 파수 $k$ 는 자유 첨자로 남겨 두므로, 각 모드는 자신만의 $C\times C$ 복소 행렬 $R_{\cdot\cdot k}$ 를 가집니다. 이것은 전역적이고 학습되는 커널과의 합성곱이며, 푸리에 공간에서 곱으로 계산됩니다. 더 높은 모드 $k \ge m$ 은 잘려 나가고, 국소 경로 $W_{oi}v_{bix}$ 와 비선형 함수 $\sigma$ 가 세부를 되살립니다. $R_{iok}$, $W_{oi}$, $P$, $Q$ 어디에도 격자점 수가 들어 있지 않으므로, 학습된 연산자는 $2m$ 개보다 많은 점을 가진 어떤 격자에서도 동작합니다. 오른쪽 아래 패널은 ''같은'' 가중치를 256개 점에 적용합니다(제로샷 초해상도). 대상은 파면이 가장 가파른 테스트 사례입니다. 64개 점에서의 예측(점)은 256개 점의 곡선 위에 놓입니다. 이 이산화 불변성은 근사적입니다. $\sigma$ 가 만드는 고조파가 격자마다 다르게 에일리어싱되기 때문입니다. 그래도 256개 점에서의 오차는 64개 점에서의 오차와 같습니다. 정확도를 제한하는 것은 격자가 아니라 모델입니다. 충격파에 가까운 해는 $m$ 보다 높은 모드가 필요하며 가장 어려운 사례입니다. 이 주제의 PINN 과 비교해 보세요. PINN 은 방정식을 손실 함수에 넣어 ''하나의'' 문제를 풀며, 초기 조건이 바뀔 때마다 다시 학습해야 합니다. 신경 연산자는 솔버
  데이터로부터 한 계열의 문제 전체를 학습하고, 그 뒤 새 예측은 각각 한 번의 순전파면 됩니다. 콘솔에는 이 순전파와 솔버의 시간 비교가 출력됩니다. 여기서는 수십 배 빠르지만, 1차원 버거스 방정식에서는 솔버 자체가 이미 저렴하고 데이터 생성과 학습 비용이 훨씬 큽니다. 신경 연산자는 시뮬레이션 한 번에 몇 시간이 걸리고(기상, 난류, 다공성 매질 유동) 많은 질의가 필요한 경우에 가치가 있으며, 학습한 데이터 분포 안에서만 유효합니다. 모드 수 $m$ 을 줄이거나, 학습 세트를 작게 하거나, $\nu$ 를 크게(해가 더 매끄러워 학습이 쉬움) 해 보세요. 단순화: 출력 시각 $T$ 는 하나, 고정된 난수 시드, 격자 위치는 단순한 입력 채널로 주고 패딩은 하지 않음(어차피 영역이 주기적임).'
meanings:
- '입력 함수: 샘플 $b$ 의 $N$ 개 격자점 각각에서의 $u_0$ 와 위치'
- '올리기(lift): $f$ 에 대해 합, 각 점에서 2개의 특징이 $C$ 개의 채널이 됨'
- 각 채널 $i$, 파수 $k$ 의 복소 푸리에 계수
- '복소 가중치, 남기는 모드 $k < m$ 마다 $C\times C$ 행렬 하나: $N$ 에 의존하지 않음'
- '반복되는 $i$ ⇒ 합; $k$ 는 합하지 않음: 각 모드를 따로 섞음'
- '절단: 가장 낮은 $m$ 개의 푸리에 모드만 스펙트럼 합성곱을 통과'
- '임의의 개수 $N$ 의 격자점으로 되돌림: 해상도는 여기서 정해짐'
- 국소 경로, 모든 점에서 같은 $C\times C$ 행렬; $\sigma$ = GELU
- 점별 2층 사영, $C$ 개 채널에서 예측값 $u(x, T)$ 로
- '샘플별 상대 $L^2$ 오차를 배치에 대해 평균: Adam 이 최소화하는 손실'
- '데이터: 유사 스펙트럼 솔버, 적분 인자 RK4 와 2/3 에일리어싱 제거 규칙, 모든 샘플을 한 번에 계산'
labels:
  nu: 점성 계수 $\nu$
  t_final: 출력 시각 $T$
  n_train: 학습 샘플 수(초기 조건)
  modes: 남기는 푸리에 모드 수 $m$
  width: 채널 수 $C$
  epochs: 학습 에포크 수
  lr: Adam 학습률
