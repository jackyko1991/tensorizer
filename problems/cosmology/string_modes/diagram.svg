<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A closed string loop vibrating with right- and left-moving waves, and an open string with free ends, parametrised by sigma">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- closed string: a wavy loop around a dashed circle -->
    <circle cx="70" cy="78" r="42" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M112,78 C112,90 104,96 103,104 C100,114 88,114 82,119 C72,124 62,116 52,117 C40,117 36,104 30,98 C24,88 32,78 28,68 C26,56 38,50 42,44 C50,34 62,40 72,36 C84,34 90,42 98,46 C108,52 106,64 112,78 z" fill="#93c5fd" fill-opacity="0.35" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="112" cy="78" r="4" fill="#dc2626"/>
    <text x="116" y="74" font-style="italic" fill="#b91c1c">σ = 0</text>
    <!-- right- and left-moving waves -->
    <path d="M60,26 A54,54 0 0 1 104,40" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M36,128 A54,54 0 0 0 78,134" fill="none" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow)"/>
    <text x="40" y="22" font-style="italic" fill="#b91c1c">α</text>
    <text x="82" y="150" font-style="italic" fill="#b91c1c">α̃</text>
    <!-- open string with free ends -->
    <path d="M150,110 C162,80 172,130 186,96 C198,68 206,118 222,86" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="150" cy="110" r="4" fill="#1e40af"/>
    <circle cx="222" cy="86" r="4" fill="#1e40af"/>
    <text x="138" y="130" font-style="italic">0</text>
    <text x="216" y="76" font-style="italic">π</text>
    <path d="M150,140 L222,140" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="156" font-style="italic" fill="#b45309">σ</text>
  </g>
</svg>
