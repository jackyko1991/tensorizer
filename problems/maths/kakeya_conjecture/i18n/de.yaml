source_hash: a69998e36eef
title: Die Kakeya-Vermutung
summary: Eine Nadel lässt sich innerhalb einer Menge mit beliebig kleinem Flächeninhalt in jede Richtung drehen. Dieses Problem konstruiert eine solche Menge (Perrons Baum aus $2^k$ schmalen, seitlich verschobenen Dreiecken) und misst ihren Flächeninhalt exakt, Zeile für Zeile. Anschließend überdeckt es Vereinigungen von $\delta$-Röhren in $\mathbb R^2$, $\mathbb R^3$ und $\mathbb R^4$ mit $\delta$-Würfeln, um ihre Dimension abzuschätzen. Die Kakeya-Vermutung besagt, dass solche Mengen trotzdem die volle Dimension $n$ haben. Das ist für $n = 2$ bewiesen und seit 2025 für $n = 3$; für $n \ge 4$ gibt es bisher nur unbestätigte, KI-generierte Beweisbehauptungen.
notes: 'Kakeya fragte 1917 nach der kleinsten Fläche, in der sich eine Nadel der Länge eins umdrehen lässt. Besicovitch (1919, 1928) fand heraus, dass eine Menge, die in jeder Richtung eine Einheitsstrecke enthält, Maß null haben kann, und Perron (1928) vereinfachte die Konstruktion zu dem hier gezeichneten Baum. Man zerschneidet ein Dreieck in $2^k$ Splitter und verschiebt sie seitlich. Jeder Splitter behält seine Richtungen, und mit jeder Runde von Perrons Schritt wächst die Überlappung. Der Flächeninhalt erfüllt $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ (überprüft), und das beste $\alpha$, gefunden durch gleichzeitiges Ausprobieren von 24 Werten, lässt ihn wie $\ln k / k$ fallen. Córdoba (1977) bewies, dass die $\delta$-Umgebung einer Kakeya-Menge in der Ebene mindestens den Flächeninhalt $c / \log(1/\delta)$ hat, sodass dieser langsame Abfall unvermeidlich ist, und Davies (1971) bewies, dass jede ebene Kakeya-Menge Hausdorff- und Minkowski-Dimension 2 hat. Drei um 60° gedrehte
  Bäume enthalten in jeder Richtung eine Einheitsnadel (die rote Nadel überstreicht 180°); verbindet man die Positionen mit Páls Trick, kann sich die Nadel tatsächlich innerhalb einer Menge mit beliebig kleinem Flächeninhalt drehen. In $\mathbb R^n$ besagt die Kakeya-Mengen-Vermutung, dass jede solche Menge die Dimension $n$ hat: Röhren vom Radius $\delta$ in $\delta$-separierten Richtungen können sich nicht stark überlappen, daher hat ihre Vereinigung ein Volumen $\gtrsim_\varepsilon \delta^{\varepsilon}$. Die rechten Felder zählen $\delta$-Würfel für zwei Anordnungen (alle Röhren durch den Ursprung und zufällige Mittelpunkte). Die Steigung von $\log N$ gegen $\log(1/\delta)$ nähert sich in beiden Fällen $n$, wie es sein muss, falls die Vermutung stimmt. Ein Computer kann nur bestimmte Anordnungen testen, niemals alle. Stand (November 2026): $n = 2$ bewiesen (Davies 1971). $n = 3$ bewiesen von Hong Wang und Joshua Zahl (Preprint 2025), nach Wolffs Schranke $(n+2)/2$ (1995) und Katz–Łaba–Tao.
  Für $n \ge 4$ ist das Problem in der begutachteten Literatur offen. Die von OpenAI veröffentlichte Sammlung KI-generierter Manuskripte (github.com/openai/math, Familien 074 und 079) beansprucht den vierdimensionalen Fall und, über Sogges Vermutung zur lokalen Glättung, jede Dimension. Laut Repository wurden einige der Aussagen in Lean formalisiert, doch es handelt sich um nicht begutachtete, maschinell erzeugte Behauptungen, die noch auf die Überprüfung durch die mathematische Gemeinschaft warten; diese Seite behandelt sie daher als behauptet, nicht als bewiesen. Die Vermutung ist weit über die Geometrie hinaus bedeutsam: Sie folgt aus der Fourier-Restriktionsvermutung und der Bochner–Riesz-Vermutung der harmonischen Analysis.'
meanings:
- 'die $N = 2^k$ schmalen Dreiecke mit Spitze $(0, 1)$ und Grundseiten $[b_i, b_i + w_0]$, die $[-1/\sqrt3, 1/\sqrt3]$ aufteilen: ein Richtungskegel von 60°, jede Seite $\ge 1$'
- horizontale Verschiebungen nach $k$ Perron-Runden, für $A$ Werte von $\alpha$ gleichzeitig; jede Runde lässt benachbarte Kerne sich berühren und schiebt den rechten um $(1-\alpha)(c - a)$ nach links
- wo Dreieck $i$ die horizontale Gerade auf der Höhe $y$ schneidet
- die Intervalle jeder Zeile nach ihrem linken Ende sortieren; das laufende Maximum der rechten Enden gibt an, was bereits überdeckt ist
- 'wiederholte $i$ und $y$ ⇒ summiert: die exakte Länge der Vereinigung jeder Zeile, gemittelt über die Zeilen (Mittelpunktsregel)'
- 'ein $\delta$-Gitter auf den Seitenflächen des Würfels $[-1,1]^n$, auf die Sphäre projiziert: ungefähr $\delta$-separierte Geradenrichtungen'
- die Würfel der Seitenlänge $\delta$, die jede Röhre trifft, abgetastet alle $\delta/2$ entlang der Röhre
- 'wiederholtes $i$ ⇒ summiert: ein ganzzahliger Schlüssel pro Würfel, sodass das Zählen verschiedener Würfel eine einzige Sortierung ist'
- 'wiederholtes $j$ ⇒ summiert: drei um 0°, 60° und 120° gedrehte Kopien des Baums überdecken jede Richtung'
labels:
  k_max: Perron-Runden $k$ ($2^k$ Dreiecke)
  n_max: Röhren bis Dimension $n$
