source_hash: 176bf5bc914e
title: 分子的圖神經網路（訊息傳遞）
summary: 分子是一張圖，而訊息傳遞神經網路只是對其鄰接矩陣做的幾次 einsum：每個原子反覆加總鄰居的狀態 $s_{mic} = A_{mij}h_{mjc}$，分子的預測則是對原子求和。訓練它預測隨機共軛碳氫化合物的休克爾 π 電子能量後，無論原子如何編號，它都給出相同答案，而且在比任何訓練分子都大的分子上依然有效，而直接以鄰接矩陣為輸入的普通 MLP 則會失敗。
notes: 數據刻意採用合成的，以便確切知道正確答案。每個「分子」都是隨機的省略氫碳骨架（每個碳最多三個鄰居的樹，再閉合出一些五員環與六員環）：是圖論玩具，而非經整理的真實化合物集合。其標籤是休克爾 π 電子能量：取 $H = \alpha + \beta A$，每個碳一個 π 電子，填入 $A$ 本徵值 $\lambda_k$ 最高的軌域，$E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$，而網路只從圖學習 $y = \sum_k o_k\lambda_k$。它從未看過任何本徵值。這裡的張量課題是：圖神經網路只需要一個新運算，即對鄰接的 einsum $A_{mij}h_{mjc}$，它同時對每個分子中每個原子的鄰居狀態求和。所有權重一次只作用於一個原子，原子之間只透過 $A$ 與最後的求和結合，因此模型在構造上就具有置換不變性，且同一組權重適用於任何大小的分子。終端展示了這兩項性質：重新標記原子使 GNN 輸出改變約 $10^{-6}$（float32 捨入誤差），而 MLP 輸出改變達 $|\beta|$ 的整數倍；在有 11–16 個碳、比任何訓練分子都大的分子上，MLP 從未在其輸入的額外列中見過任何東西而失敗，GNN 的誤差卻幾乎沒有增加。與「數鍵」基準 $aN + bN_{bonds} + c$ 比較：π 能量幾乎是可加的（每個碳約 $1.2|\beta|$），GNN 真正的工作是分支、環與奇數電子帶來的修正，在這方面它大約把誤差減半。四輪訊息只能傳到四個鍵外，因此取決於整個共軛系統的效應（芳香性、4n 環）只能近似地學到。這是 Gilmer 等人（ICML 2017）的訊息傳遞神經網路（MPNN）框架，他們證明許多早期的分子圖網路都符合此模式，並以 QM9 分子的 DFT 性質訓練它們。此家族的模型（SchNet、DimeNet，以及也使用三維幾何的等變網路如 NequIP 或 MACE）如今廣泛用於預測分子性質與擬合原子間位能，但它們的好壞取決於訓練數據，遇到不同於訓練數據的化學時可能失敗。試試 1 層（只有最近鄰）、更少的訓練分子，或更窄的網路。
meanings:
- 分子 $m$ 碳骨架的鄰接矩陣，以零填補到 $N = 16$ 個原子
- 原子特徵：碳鄰居數（1、2 或 3）的 one-hot 編碼
- 目標：$A$ 的佔據休克爾本徵值（eigvalsh），以 $|\beta|$ 為單位的 π 能量
- 對 $f$ 求和：把每個原子嵌入 $C$ 個通道
- 重複的 $j$ ⇒ 對原子 $i$ 的鄰居求和：訊息
- 對 $c$ 求和：每個分子的每個原子用同一組權重
- 學到的每原子能量（分子上的顏色）
- 對真實原子的 $i$ 求和：具尺寸廣延性且與原子順序無關
- 重新標記原子：GNN 輸出在浮點精度內不變
- 基準：以 256 個攤平鄰接元素為輸入的固定大小網路
labels:
  n_train: 訓練分子數
  epochs: 訓練回合數
  width: 通道數 $C$
  layers: 訊息傳遞層數 $L$
  lr: Adam 學習率
