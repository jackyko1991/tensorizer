<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Brownian particle of mass m in a parabolic trap, held by a spring of stiffness k, slowed by friction gamma v and kicked by random molecular forces xi">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- parabolic trap potential U = k x^2 / 2 -->
    <path d="M40,40 Q120,200 200,40" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="120" y1="34" x2="120" y2="130" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="24" y="28" font-size="13" fill="#374151">U = ½ k x²</text>
    <!-- spring from the trap centre to the particle -->
    <path d="M120,92 l3,-5 l5,10 l5,-10 l5,10 l3,-5" fill="none" stroke="#374151" stroke-width="1.5"/>
    <text x="124" y="80" font-style="italic">k</text>
    <!-- molecules of the fluid -->
    <g fill="#93c5fd">
      <circle cx="150" cy="56" r="3"/><circle cx="190" cy="92" r="3"/><circle cx="176" cy="122" r="3"/>
      <circle cx="62" cy="96" r="3"/><circle cx="84" cy="70" r="3"/><circle cx="96" cy="140" r="3"/><circle cx="70" cy="128" r="3"/>
    </g>
    <!-- random kicks -->
    <g stroke="#dc2626" stroke-width="1.5">
      <line x1="150" y1="60" x2="151" y2="74" marker-end="url(#arrow)"/>
      <line x1="186" y1="92" x2="168" y2="92" marker-end="url(#arrow)"/>
    </g>
    <text x="192" y="110" font-style="italic" fill="#b91c1c">ξ</text>
    <!-- particle -->
    <circle cx="152" cy="92" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="147.5" y="96.5" font-size="11" fill="#ffffff" font-style="italic">m</text>
    <!-- velocity along the wall and friction opposing it -->
    <line x1="163" y1="78" x2="180" y2="61" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-v)"/>
    <text x="186" y="70" font-style="italic" fill="#b45309">v</text>
    <line x1="168" y1="108" x2="154" y2="122" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="132" y="140" font-style="italic" fill="#b91c1c">−γv</text>
  </g>
</svg>
