source_hash: 3ad16fadfd42
title: MRI k 空間：以梯度與傅立葉轉換成像
summary: 磁場梯度讓每個像素擁有自己的進動相位，因此線圈記錄到的是影像的傅立葉轉換：$s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$，其中 $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$。寫成編碼矩陣的 einsum，它就等於 FFT。逐行填滿 k 空間再反轉換，可以看到影像逐漸清晰；跳過某些行會讓影像摺疊（混疊），只保留中心則會模糊並出現吉布斯振鈴。
notes: 每隔一行取樣（$R = 2$）會使視野減半：補零影像恰好是 $\tfrac12[\rho(p) + \rho(p + N/2)]$，即平移 $\mathrm{FOV}/2$ 並繞回的副本。只保留中心幾行會保留直流項，因此總強度不變，卻失去邊緣：影像模糊並出現振鈴（吉布斯現象）。正則化重建對每一行影像欄解一個小型最小平方問題，並懲罰位於頭部遮罩之外的訊號（遮罩由中心幾行估計）；它讓隨機取樣的誤差略為降低，但當摺疊的兩個副本都落在頭部內時，無法消除規則混疊。實際的掃描儀會加入多個線圈（平行成像）或稀疏性先驗（壓縮感知）。假體是經典的 Shepp–Logan 頭部模型；僅供示意，不可用於臨床。
meanings:
- 質子密度影像：像素列 $p$（相位編碼方向），欄 $r$（讀出方向）
- k 空間位置是梯度的累積積分 $\tfrac{\gamma}{2\pi}\int G\,dt$；步長 $\Delta k = 1/\mathrm{FOV}$
- 像素 $p$ 在 k 空間第 $u$ 行的相位 $e^{-2\pi i\,up/N}$；二維矩陣 $E_{kx}$ 可分解為 $E_{up}E_{vr}$
- 重複的 $p, r$ ⇒ 求和：量測到的 k 空間訊號，與 fft2(rho) 完全相同
- 取樣遮罩：已擷取的相位編碼行為 1
- 補零重建
- 對每一欄 $r$ 做 Tikhonov 最小平方，懲罰頭部以外的訊號
labels:
  size: 影像大小 $N$
  R: 跳行因子 $R$（每 $R$ 行取一行）
  lowpass: 保留的 k 空間中心比例
  random_frac: 隨機保留的行比例
  lam: Tikhonov 權重 $\lambda$
  n_frames: 填充影格數
