source_hash: 125d78b166e3
title: 粗粒化蛋白質摺疊：以朗之萬動力學模擬 Gō 模型
summary: 將一個小型螺旋髮夾蛋白表示為一串珠子，每個胺基酸一顆，由鍵與鍵角相連，並由具吸引力的天然接觸穩定（Gō 模型）。力是總能量的自動微分梯度，能量以成對距離張量寫出。朗之萬動力學同時模擬一整批溫度與複本，一半從摺疊態出發、一半從展開態出發；天然接觸分率 $Q(t)$ 顯示摺疊與展開，其對溫度的平均即為熔解曲線。
notes: Gō 模型是由答案建構的：天然結構中存在的每個交互作用都具吸引力，其他一切只有排斥，因此能量地景是一個通往天然摺疊的平滑漏斗。這是一種誇張的簡化，但很有用：小型蛋白質確實像能量地景挫折極小那樣摺疊，而 Gō 模型能重現其中許多蛋白質的摺疊速率、過渡態與協同熔解。採用約化單位：能量以 $\varepsilon$（一個接觸）計，溫度以 $\varepsilon/k_B$ 計，時間以 $\tau$ 計。一半複本從摺疊態出發，一半從直桿出發；實線與虛線一致之處表示模擬已達平衡，不一致之處（低 $T$）表示展開的鏈被動力學困在錯誤摺疊態中，需要更長的模擬或複本交換。由於蛋白質極小，熔解曲線很寬；具有數百個接觸的真實蛋白質會急遽熔解。沒有二面角項時能量只依賴距離，因此天然摺疊的鏡像具有完全相同的能量與 $Q$；真實的 Gō 模型會加入二面角位能來固定手性。試著改變摩擦係數（它改變動力學但不改變平衡曲線）或溫度數目。
meanings:
- 系統 $s$ 的珠子 $i$；$S = B\cdot R$ 個溫度 × 複本
- 成對 $p = (i_p, j_p)$ 的天然距離，$j - i \ge 3$；若在天然摺疊中距離小於 8 Å，則 $n_p = 1$
- 所有系統的全部成對距離置於同一張量，對 $a$ 求和
- 鍵 + 鍵角 + 12–10 天然位能井（在 $r^0_p$ 處最小值為 $-\varepsilon$）+ 非天然成對的排斥
- 以自動微分求力；對 $s$ 求和沒有問題，因為各系統互不作用
- 每個系統有自己的熱浴
- 踢、漂移、摩擦 + 雜訊 $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$、漂移、踢
- 已形成的天然接觸比例：摺疊時為 1，展開鏈約為 0.4（局部接觸仍會持續形成）
- 對模擬後半段的時間平均；$T_m$ 為其穿越 ½ 之處
labels:
  helix_length: 每段螺旋的珠子數
  T_min: 最低溫度 $T$
  T_max: 最高溫度 $T$
  temperatures: 溫度數 $B$
  friction: 摩擦係數 $\gamma$
  steps: 時間步數
