source_hash: 2c6e3e6a24cf
title: 워크플로 DAG는 라우터가 고정된 전문가 혼합이다
summary: 'MNIST 숫자 $d$와 "now plus three" 같은 세 단어 텍스트가 답 $y = (d \circ k) \bmod 10$을 정하며, 어느 한 모달리티만으로는 충분하지 않다. 이 파이프라인을 Snakemake 스타일의 워크플로(encode_image, encode_text, 입력 함수가 고르는 연산마다 하나씩의 fuse 규칙, classify)로 쓰고 윌리스 고리(Circle of Willis) 문제의 텐서 DAG 엔진으로 실행하면, 라우터 행렬 $G$를 규칙의 선택으로 고정한 top-1 전문가 혼합 층이 계산하는 것과 정확히 같은 것을 계산한다. 이어서 하나의 텐서 프로그램이 허용하는 네 단계를 다룬다: 학습된 라우터, 따로 학습한 뒤 연결한 전문가들, DAG 전체를 통과하는 한 번의 역전파, 그리고 int8로 저장되는 작은 밀집 신경망 하나로의 증류. 알려진 결과들을 연결하는 관점이지, 새로운 정리가 아니다.'
notes: '아이디어. 이 관점은 Jacky Ka Long Ko의 것이다: 윌리스 고리 워크플로(medical/cow_workflow_dag)를 만들면서 Snakemake DAG가 하나의 텐서 프로그램이 될 수 있고, 그런 프로그램은 멀티모달 전문가 혼합처럼 보인다는 점이 드러났다. 정확히 말하면, 워크플로 DAG는 라우터가 고정된 MoE이고, MoE는 입력마다 간선이 선택되는 DAG이다. 이는 알려진 결과들을 연결하는 관점이지 새로운 정리가 아니며, 이 문제는 그 작은 사례 하나를 만든다. 동등성. data/Snakefile에는 규칙 encode_image, encode_text, fuse(샘플마다, 연산마다 작업 하나; 와일드카드 $op$), classify, collect가 있다. classify는 입력 함수 `routed`를 통해 입력을 읽는데, 이 함수는 샘플 텍스트에 있는 연산의 fuse 출력을 지정한다. 엔진은 cow_workflow_dag의 파서로 파일을 파싱하고 크로네커 블록으로부터 작업 인접 행렬을 만든다. 조건부 간선의 블록은 $(I_N \otimes \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$이므로 라우터 행렬 $G$가 인접 행렬 안에 들어 있고, $N E$개의 fuse 작업 중 선택된 $N$개만 필요하다(Snakemake가 작업을 가지치기하는 것과 같은 불리언 역방향 패스). 레벨별로, 규칙마다 배치 호출 한 번씩 실행하면, $G$를 규칙의 선택으로 고정하고 게이트 값을 1로 둔 Switch 스타일 층(누적 순위에 의한 디스패치 텐서 $D$, 모든 전문가를 하나의 배치 einsum으로 계산, 결합)과 같은 로짓을 낸다: 1000개 테스트 샘플 전부 × 시드 2개에서 float32로는 비트 단위로 동일하고 float64로는 $4 \times 10^{-15}$ 이내이며(쌓은 곱과 그룹별 곱은 합산 순서가 다르다), 예측은 모든 곳에서 같다. 이는 하나의 계산을 쓰는 두 방식
  사이의 항등식이지, 경험적 발견이 아니다. 학습된 라우터. 텍스트 특징 위의 softmax 게이트에 top-1 라우팅과 Switch 부하 균형 손실($\alpha = 0.01$)을 쓰고, 인코더는 고정하며, 두 변형을 나란히 비교한다. 워크플로 자체의 fuse 전문가들 앞에서는 게이트만으로 규칙을 재발견한다: 기본 800 스텝 후 테스트 샘플의 0.85 ± 0.03에서 연산 $e$가 전문가 $e$로 가며(정확도 0.82, 고정 라우터는 0.92), 이 값은 아직 오르는 중이다(시험 실행에서 1500 스텝 후 0.95와 0.90). 새 전문가들과 함께 학습하면 그렇지 않다: 라우팅이 연산과 일치하는 정도는 우연보다 낫지 않고(최적의 전문가 순열로 0.35; 1/3은 관계가 없음을 뜻한다), 전문가들은 섞인 채로 남으며 정확도는 0.40에 머문다. fuse 전문가들은 텍스트를 보지 못하므로, 연산을 무시하는 라우팅은 각 전문가에게 불가능한 과제를 남긴다. 그런데 처음에는 어떤 전문가도 어떤 연산에서 더 낫지 않으므로 top-1 게이트는 대칭을 깨뜨릴 신호를 받지 못한다. 게이트 노이즈, 100× 더 큰 게이트 초기화, 500 스텝의 밀집(소프트) 워밍업, $\alpha = 0.1$도 시험 실행에서 이를 바꾸지 못했다(기본 실행에는 포함되지 않음). 더 큰 MoE들은 라우터를 처음부터 성공적으로 학습시킨다. 이 장난감 예제가 말해 주는 것은 여기서는 고정된 규칙이 저절로 재발견되지 않는다는 것뿐이다. 단계. (2) 분리 학습: 각 전문가를 자기 하위 과제에 학습시킨다. 이미지 전문가(MLP)는 숫자 레이블에(테스트 정확도 0.916), 텍스트 전문가(einsum 어텐션 층 하나)는 수 단어에(1.000), fuse 전문가들은 one-hot 입력으로 300개 항목의 표에(1.000). 공동 학습 없이 DAG로 연결하면 파이프라인은 테스트 쌍의 0.924에 정답을 낸다(0을 곱하거나 5를 곱하는 경우 일부 틀린 숫자가 용서되므로 숫자 정확도보다 높다). (3) 종단 간
  미세 조정, 즉 모든 단계를 통과하는 한 번의 역전파: 0.924, 향상 없음. 병목은 이미지 전문가이며, 공동 손실은 숫자에 대한 새 정보를 가져오지 않는다(같은 3000장의 이미지). (4) 밀집 학생 모델(784 + 45 → 64 → 64 → 10, 가중치 57 930개, 파이프라인 108 766개의 0.53)을 $T = 4$에서 증류(손실 $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 교차 엔트로피): 0.85–0.86이며, 샘플의 0.85–0.87에서 교사와 일치하고 3000 스텝이 끝날 때도 여전히 개선되고 있다. 채널별 int8: 0.85–0.86, 232 kB 대신 58.9 kB(파이프라인은 435 kB). CPU 스레드 하나에서 1000개 테스트 쌍에 걸린 시간: DAG 엔진 90 ms, 같은 DAG를 MoE 층 하나로 계산하면 19 ms(엔진은 작업 블록도 만든다), 학생 3.4 ms, int8 학생 3.5 ms(역양자화된 부동소수점으로 계산하므로 더 작지만 여기서 실제로 더 빠르지는 않다), 그리고 스케줄러가 프로세스 시작 비용 없이 실행하듯 작업마다 호출 한 번씩 하면 900–1000 ms. 따라 나오지 않는 것. 하나의 메모리 공간 안의 텐서 프로그램인 단계들만이 복사 없이 융합되고 그래디언트를 전달한다. 파일 기반 도구(OpenFOAM, VMTK, 바이오이미지 분석의 대부분)는 그렇지 않으며, 그것들로 이루어진 Snakemake DAG는 프로세스들의 DAG로 남는다. 윌리스 고리 문제의 속도 향상은 주로 작업별 프로세스 시작과 파일 I/O를 피한 데서 왔지, 배치 처리에서 온 것이 아니다. 그리고 종단 간 학습은 분리 학습이 주지 못한 무언가를 어떤 단계가 배울 수 있을 때만 도움이 된다. 여기서는 그렇지 않았다. 관련 연구. Neural Module Networks(Andreas et al. 2016)는 파서가 고른 모듈들로 질문마다 신경망을 조립하는데, 이는 입력마다 선택되는 DAG이다. 희소 게이트 MoE(Shazeer
  et al. 2017)와 Switch Transformer(Fedus et al. 2021, 여기서 쓰는 top-1 라우팅과 부하 균형 손실). LIMoE(Mustafa et al. 2022)와 Uni-MoE(Li et al. 2024)의 모달리티 전문가. 모델 스티칭(Lenc & Vedaldi 2015; Bansal et al. 2021)은 따로 학습된 신경망들을 학습된 인터페이스로 잇는데, 단계 2가 확률 벡터를 통해 하는 일과 같다. 지식 증류(Hinton et al. 2015). DSPy(Khattab et al. 2023)는 언어 모델 호출로 이루어진 파이프라인 전체를 종단 간으로 최적화한다. Google의 Pathways(2021년 블로그 글이자 비전)는 각 과제를 그 과제에 필요한 부분들로 라우팅하는 하나의 모델을 기술한다. 데이터. MNIST(LeCun, Cortes & Burges; LeCun et al. 1998), 라이선스 CC BY-SA 3.0: 훈련 이미지 3000장(숫자당 300장)과 테스트 이미지 1000장(숫자당 100장)으로, 각 숫자에서 파일 순서상 처음 나오는 이미지들이며 uint8로 동봉되어 있다(0.7 MB, data/mnist_train.npz, data/mnist_test.npz, 같은 라이선스로 재배포; 출처, 체크섬, 처리 과정은 data/SOURCES.md에 있다). 텍스트는 생성된다: 연산 단어 하나(plus, minus, times), 수 단어 하나(zero부터 nine까지), 채움말 하나(now, then)를 무작위 순서로 배치한다. 테스트 텍스트는 고정된 시드를 쓴다. 장치와 한계. 동봉된 수치는 CPU에서의 기본 실행 결과다(이 프로젝트 환경에는 여기서 CUDA 빌드 PyTorch가 없으며, 가중치가 약 $10^5$개인 규모에서는 GPU가 도움이 되지 않을 것이다): 바쁜 6코어 머신에서 학습과 측정에 약 75–150 s, 여기에 GIF 생성이 더해진다. 모든 시드는 모델 축 위에서 함께, 각자 자기 미니배치로
  학습되며, 모든 시드를 그래프에 그린다. 숫자 하나와 연산 세 개로 된 장난감 예제다: 구조를 보여 줄 뿐, 큰 멀티모달 MoE가 어떻게 동작하는지를 보여 주지는 않는다.'
meanings:
- data/Snakefile에서 medical/cow_workflow_dag의 파서로 파싱한 규칙 그래프와 입력 함수 `routed`(조건부 간선 classify ← fuse)
- '작업 수준 블록: cow_workflow_dag의 크로네커 곱(와일드카드 축 sample, op마다 $I$, $\mathbb 1$, $\mathbb 1^\top$); 조건부 간선에서는 라우터로 마스킹되므로, classify의 작업 $n$은 $G_{ne} = 1$일 때 그리고 그때에만 fuse의 작업 $(n, e)$를 읽는다'
- '워크플로의 라우터: 연산 단어의 one-hot으로, 학습된 것이 아니라 규칙(입력 함수)이 찾은 것'
- '타깃이 의존하는 작업들, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$: $N E$개의 fuse 작업 중 $N$개뿐'
- '엔진: 규칙을 레벨별로, 각 규칙은 필요한 작업들에 대한 배치 호출 단 한 번(fuse: 와일드카드 $op$의 값마다 호출 한 번)'
- 샘플 $n$을 전문가 $e$의 슬롯 $c$로(그 전문가로 라우팅된 샘플들 중 그 샘플의 순위), GShard/Switch에서와 같이; 용량 $C$ = 가장 큰 그룹
- 모든 전문가를 하나의 배치 곱으로; $m$은 모델(시드) 축이며 결코 합산되지 않는다
- '결합: $e$와 $c$에 대해 합산하며 샘플마다 0이 아닌 항은 하나뿐이므로, $g = G$이면 DAG 출력과 같다'
- '학습된 라우터: 텍스트 특징 위 선형 게이트의 softmax; top-1 라우팅, 출력은 $p$로 스케일링'
- 'Switch 부하 균형: $f_e$ = $e$로 라우팅된 비율, $P_e$ = 평균 게이트 확률; 균형 잡히고 균등하면 1, 붕괴되면 $E$'
- 온도 $T$에서의 Hinton 증류; 학생 손실은 $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ × 정답에 대한 교차 엔트로피
- 출력 채널별 대칭 int8, $s_o = \max_i |W_{io}|/127$; int8 + 채널당 float32 스케일 하나로 저장
labels:
  seeds: 시드(모델 축 위의 모델들)
  split_steps: 단계 2 스텝 수(각 전문가를 자기 하위 과제에)
  router_steps: 단계 1b 스텝 수(학습된 라우터)
  global_steps: 단계 3 스텝 수(종단 간 미세 조정)
  student_steps: 단계 4 스텝 수(증류)
  student_hidden: 학생 모델 너비 $H$
  temperature: 증류 온도 $T$
  balance_weight: 부하 균형 가중치 $\alpha$
