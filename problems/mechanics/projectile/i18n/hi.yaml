source_hash: bb811720bfea
title: वायु प्रतिरोध सहित प्रक्षेप्य
summary: द्विघाती वायु प्रतिरोध वाली गेंद के लिए न्यूटन का दूसरा नियम। कई प्रक्षेपण कोणों को एक बैच टेंसर में रखकर एक साथ हल किया जाता है, इसलिए एक ही einsum हर प्रक्षेप पथ संभालता है।
notes: 'बैच सूचकांक $b$ भौतिकी नहीं है: यह वह टेंसर तरकीब है जिससे PyTorch एक बार में $B$ प्रक्षेप्य हल करता है। प्रतिरोध शून्य करने पर पाठ्यपुस्तक वाला परवलय मिलता है, जिसकी अधिकतम परास 45° पर होती है।'
meanings:
- गेंद $b$ की स्थिति, घटक $i \in \{x, z\}$
- गेंद $b$ का वेग
- गुरुत्व सदिश $(0, -9.81)$
- 'दोहराया गया $j$ ⇒ योग: हर गेंद की चाल का वर्ग'
- ODE का दायाँ पक्ष
labels:
  v0: प्रक्षेपण चाल
  drag: प्रतिरोध $c/m$
  n_angles: प्रक्षेपण कोण
  t_max: सिमुलेशन समय
