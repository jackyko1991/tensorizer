source_hash: 5c7383dc415a
title: 量子隧穿
summary: 高斯波包射到矩形势垒上。含时薛定谔方程用分步傅里叶法求解：势能在 $x$ 空间中是对角算符，动能在 $k$ 空间中是对角算符，所以时间步的每一半都只是逐元素的张量乘法，由 torch.fft 在两个基之间切换。
notes: 单位 $\hbar = m = 1$，波包能量 $E \approx k_0^2/2$。对角算符 $D_{xy} = d_x\,\delta_{xy}$ 作用于 $\psi$ 即 $D_{xy}\psi_y = d_x\psi_x$——无需矩阵，只需逐元素相乘。Strang 分裂 $P\cdot K\cdot P$ 对 $\Delta t$ 具有二阶精度且严格幺正，所以归一化在舍入误差内保持为 1。模拟时长自动选取（$45/k_0$），使波包中心从 $x = -25$ 运动到约 $x = +20$。当 $E < V_0$ 时，经典粒子总会被弹回；右侧透射的部分就是隧穿。为对比而打印的平面波透射系数 $T(k_0)$ 忽略了波包的动量分布（并使用落在网格上的势垒宽度）；更宽的波包（更大的 $\sigma_0$）动量更确定，与之吻合得更好。
meanings:
- 周期网格 $x$ 上的波函数
- 半步势能算符：在 $x$ 中为对角，以 psi * P 作用
- 整步动能算符：在 $k$ 中为对角，以 psi_k * K 作用
- 基变换 $x \to k$（快速矩阵乘积，从不显式构造）
- 透射：在势垒右侧找到粒子的概率
labels:
  k0: 波包动量 $k_0$
  V0: 势垒高度 $V_0$
  width: 势垒宽度 $a$
  sigma: 波包宽度 $\sigma_0$
