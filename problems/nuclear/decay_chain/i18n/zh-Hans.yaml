source_hash: 006d4ce1966d
title: 衰变链（贝特曼方程）
summary: 母核衰变为放射性子核，子核再衰变为稳定的终产物。三个速率方程构成一个线性方程组 $\dot N_i = A_{ij} N_j$，用矩阵指数 $e^{At}$ 对所有时刻一次精确求解，并与 RK4 对照。默认衰变链是医用发生器 $^{99}$Mo → $^{99m}$Tc → $^{99}$Tc。
notes: $\mathsf A$ 的每列之和为零，因此 $\sum_i N_i$ 始终不变：每次衰变都把一个原子核沿链向下移动一位。对两个成员，精确（贝特曼）解为 $N_2 = N_1(0)\,\frac{\lambda_1}{\lambda_2 - \lambda_1}\,(e^{-\lambda_1 t} - e^{-\lambda_2 t})$。当子核寿命较短（$\lambda_2 > \lambda_1$）时，两者活度锁定：比值 $a_2/a_1$ 趋于 $\lambda_2/(\lambda_2-\lambda_1)$（暂时平衡）；当母核寿命长得多时趋于 1（久期平衡，可试试母核半衰期取 1000 h）。若子核寿命较长，则不会形成平衡。简化：实际上 $^{99}$Mo 只有约 88 % 的衰变生成 $^{99m}$Tc，且 $^{99}$Tc（半衰期 211 000 年）被视为稳定。
meanings:
- $\ln 2/T_i$，稳定终产物 $\lambda_3 = 0$
- 对角线上为 $-\lambda_i$，紧下方为 $+\lambda_i$
- 重复的 $j$ ⇒ 求和：RK4 使用的右端项
- 每个时刻一个矩阵指数，对 $t$ 批量计算
- 由初始矢量得到每个时刻的核数
- 活度：各成员每小时的衰变数
labels:
  half_life_parent: 母核半衰期 $T_1$
  half_life_daughter: 子核半衰期 $T_2$
  t_max: 时间跨度
  rk4_steps: RK4 步数
