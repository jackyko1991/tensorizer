source_hash: 2633dfd2d254
title: Encontrar el bosón de Higgs en datos reales de difotones
summary: 'Unos 95 000 pares de fotones procedentes de 10 fb$^{-1}$ de colisiones reales de ATLAS a 13 TeV (ATLAS Open Data, CC0) se agrupan en intervalos de masa difotónica $m_{\gamma\gamma}$ y se ajustan con autograd: un fondo suave y decreciente más un pico de Higgs estrecho. El cociente de verosimilitud perfilada da $m_H$, la intensidad de la señal $\mu$ y la significancia local $Z = \sqrt{q_0}$; un lote de experimentos simulados solo con fondo muestra el efecto de mirar en otro lugar (look-elsewhere), y el potencial de sombrero mexicano $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ convierte la masa medida en el autoacoplamiento del Higgs $\lambda = m_H^2/2v^2$.'
notes: 'En julio de 2012, ATLAS y CMS anunciaron un nuevo bosón cerca de 125 GeV, observado sobre todo en dos canales: dos fotones y cuatro leptones. El Premio Nobel de Física de 2013 fue para Englert y Higgs por el mecanismo que confirmó. Aquí se rehace el canal de fotones con datos reales. El Higgs no puede desintegrarse directamente en fotones (no tienen masa), solo a través de lazos de bosones W y quarks top, así que se trata de una desintegración rara ($\mathcal B \approx 0.23\%$) sobre un enorme fondo suave de pares de fotones ordinarios. Con los 10 fb$^{-1}$ de este archivo, el resultado es $m_H \approx 124.2 \pm 1.0$ GeV (PDG 2024: $125.20 \pm 0.11$), $\mu \approx 1.0 \pm 0.4$ (la tasa del Modelo Estándar) y una significancia local de unos $2.7\sigma$ (se esperaban unos $3.4\sigma$). Es un exceso, no un descubrimiento: los descubrimientos de 2012 usaron varias categorías de sucesos, ambos canales y ambos experimentos para superar $5\sigma$. El barrido es también una advertencia útil:
  en esta pequeña muestra, una fluctuación del fondo cerca de 143 GeV es casi tan grande ($2.6\sigma$ local) como el Higgs real a 124 GeV. Este es el efecto de mirar en otro lugar. Es probable que aparezca un bulto en algún punto de una ventana amplia, así que los experimentos simulados estiman con qué frecuencia el fondo por sí solo produce uno: alrededor del 13 % de los barridos solo con fondo superan en algún punto el exceso de 125 GeV, y la fórmula de cruces de Gross–Vitells da un valor p global cercano a 0,1. Los experimentos simulados solo con fondo a masa fija siguen $\tfrac12\delta(0) + \tfrac12\chi^2_1$ (Wilks/Chernoff), y por eso $Z = \sqrt{q_0}$. El sombrero mexicano: con $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV obtenido de la vida media del muon, la masa medida fija $\lambda = m_H^2/2v^2 \approx 0.13$; la oscilación radial alrededor del anillo de vacíos es el bosón de Higgs, y la dirección plana a lo largo del anillo se convierte en la componente longitudinal de los W y Z. Datos:
  ATLAS Open Data 13 TeV, publicación de 2020, muestras GamGam (CERN Open Data Portal, registro 15006, doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS, licencia CC0; periodos de datos 2016 A–D). Selección como en el notebook divulgativo de ATLAS H → γγ: disparador de fotones, dos fotones aislados de calidad «tight» con $p_T > 40$ y 30 GeV, $|\eta| < 2.37$ fuera de 1,37–1,52. La columna sm_signal es la simulación de ATLAS correspondiente (ggF, VBF, WH, ZH, ttH a 125 GeV) ponderada a 10 fb$^{-1}$, que da $N_{SM} \approx 406$ sucesos y la anchura del pico. Simplificaciones: una sola categoría inclusiva, un pico gaussiano (el real tiene colas, por eso la anchura ajustada de unos 2,3 GeV es mayor que la resolución del núcleo), sin incertidumbres sistemáticas, y un fondo exponencial-polinómico (pruebe con el grado para ver la sensibilidad a señales espurias).'
meanings:
- recuentos reales de difotones por intervalo de 0,5 GeV; sirve cualquier CSV con m_low, m_high, events
- potencias de la masa reescalada $x \in [0, 1]$; el fondo es $\exp(X\theta)$
- pico gaussiano integrado sobre cada intervalo (erf), anchura $\sigma$ ajustada a la simulación de ATLAS
- verosimilitud de Poisson de cada histograma, minimizada con Adam + L-BFGS mediante autograd
- '$n$ repetido ⇒ sumado: el scoring de Fisher ajusta cada experimento simulado × cada masa a la vez'
- cociente de verosimilitud perfilada, 0 cuando la señal ajustada es negativa
- errores en $m_H$ y $\mu$ a partir de la curvatura de $-\ln L$
- 'potencial a lo largo de tres rayos $\phi = r\,e^{i\alpha}$ del plano complejo: la misma curva para cada fase, un anillo de vacíos en $|\phi| = v/\sqrt2$'
labels:
  m_min: Inicio de la ventana de ajuste
  m_max: Fin de la ventana de ajuste
  degree: Grado del polinomio de fondo en el exponente
  m_start: Masa inicial del ajuste
  scan_step: Paso del barrido en masa
  n_toys: Experimentos simulados solo con fondo
