source_hash: aa144f7ad9f7
title: 화학 평형과 르 샤틀리에 원리
summary: 반응은 어디서 멈출까? $\Delta G^\circ = -RT\ln K$로부터 기체 반응($\mathrm{N_2O_4 \rightleftharpoons 2\,NO_2}$ 또는 하버 반응 $\mathrm{N_2 + 3H_2 \rightleftharpoons 2NH_3}$)의 평형 진행도 $\xi$를 $Q(\xi) = K$에 대한 이분법으로 수백 개의 온도와 압력에서 한꺼번에 구하고, 압력, 온도(반트 호프), 생성물 첨가에 따른 르 샤틀리에 이동을 보여 준다.
notes: '$Q$는 혼합물이 지금 어디에 있는지를, $K$는 어디에 있고 싶어 하는지를 나타낸다. $Q < K$이면 반응이 정방향으로, $Q > K$이면 역방향으로 진행한다. $\ln Q$는 진행도 $\xi$와 함께 꾸준히 증가하므로(생성물이 없을 때 $-\infty$에서 반응물이 없을 때 $+\infty$까지), 평형은 $\ln Q(\xi) - \ln K$의 유일한 근이며, 이분법이 모든 조건에 대해 한꺼번에 그것을 찾는다. 르 샤틀리에 원리는 공식에서 저절로 나온다. 압력: 이상 기체 활동도에서 $Q = K_x\,(P/P^\circ)^{\Delta\nu}$이고 $\Delta\nu = \sum_i \nu_i$이므로, $P$를 높이면 기체 분자 수가 적은 쪽이 유리해진다($\mathrm{N_2O_4}$는 덜 해리되고, $\mathrm{NH_3}$는 더 많이 생긴다). 온도: $\ln K = -\Delta H^\circ/RT + \Delta S^\circ/R$이므로, 흡열 반응에서는 $K$가 $T$와 함께 커지고($\mathrm{N_2O_4}$: 데우면 갈색 $\mathrm{NO_2}$의 색이 짙어진다) 발열 반응에서는 작아진다(암모니아). 생성물 첨가: $Q$가 $K$ 위로 뛰어오르고 생성물의 일부가 반응물로 되돌아가지만 전부는 아니다. $\mathrm{N_2O_4}$의 결과는 손으로 확인할 수 있다. $K = 4\alpha^2 P/((1-\alpha^2)P^\circ)$에서 $\alpha = \sqrt{K/(K + 4P/P^\circ)}$이다. 열역학 데이터는 298 K의 대략적인 교과서 값이며($\mathrm{N_2O_4}$는 $\Delta H^\circ \approx +57.2$ kJ/mol, $\Delta S^\circ \approx +176$ J/(mol K); 암모니아는 $\approx -92.2$ kJ/mol과 $\approx -199$ J/(mol K)), $T$에 대해 일정하다고 보고 기체는 이상 기체로 다룬다. 두 단순화 모두 700 K, 100
  bar에서 암모니아 수득률을 다소 과대평가한다(측정값: 약 30 %가 아니라 대략 20 % $\mathrm{NH_3}$). 하버 반응은 실온에서 크게 유리하지만 그곳에서는 너무 느리다. 공장은 철 촉매를 써서 약 700–750 K, 150–300 bar에서 가동하며, 수득률을 속도와 맞바꾼다. 하버 반응으로 T = 700 K를 시도해 보자.'
meanings:
- '화학량론 수: $\mathrm{N_2O_4 \rightleftharpoons 2NO_2}$는 $-1, 2$; 암모니아는 $-1, -3, 2$'
- 모든 (온도, 압력) 쌍을 하나의 배치 첨자 $b$로 평탄화
- 근사적이고 온도에 무관한 $\Delta H^\circ$, $\Delta S^\circ$로 계산한 $-\Delta G^\circ/RT$
- 각 화학종의 몰수; 외적, 아무것도 합산하지 않음
- 전체 몰수; $j$ 합산
- '$\ln Q$: 화학종 첨자 $i$를 합산'
- '어떤 양도 음수가 되면 안 됨: 이분법의 구간'
- '모든 조건을 함께 이분법: $\ln Q - \ln K$의 부호가 바뀌는 쪽 절반을 유지'
- $1/T$에 대한 $\ln K$의 기울기
labels:
  reaction: 반응 ($\mathrm{N_2O_4}$ 또는 암모니아)
  T: 온도 $T$ (검은 곡선)
  P: 생성물 첨가 실험의 압력 $P$
  add_product: 첨가한 생성물
