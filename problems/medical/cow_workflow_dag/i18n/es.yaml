source_hash: 4e5cb68f190c
title: 'El poder de la orquestación de flujos de trabajo: una cohorte del polígono de Willis como DAG tensorial'
summary: 'Un estudio vascular es una cadena de pasos (segmentar la ARM, extraer el grafo de líneas centrales, medir los vasos, situar las entradas y salidas, resolver el flujo, elaborar el informe), cada uno ya un programa tensorial, así que el flujo de trabajo que orquesta Snakemake también puede ser un tensor. Sobre seis estudios de ARM abiertos (CC0) de TopCoW del polígono de Willis, el mismo Snakefile se ejecuta con Snakemake (sin conexión) y con un motor de DAG tensorial: el grafo de tareas es una suma de productos de Kronecker, sus niveles, su ruta crítica y el conjunto a reejecutar son iteraciones matriz–vector, y los resultados coinciden tarea por tarea. Después, el tiempo ahorrado, de dónde sale, y lo que un DAG de ficheros no puede dar: un gradiente a través de todo el pipeline. Solo con fines educativos, no para uso clínico.'
notes: 'Idea. El planteamiento, el poder de la orquestación de flujos de trabajo, es de Jacky Ko, a partir de su trabajo en HPC y su doctorado sobre pipelines vasculares: si cada etapa del pipeline es un programa tensorial, el DAG que planifica un gestor de flujos de trabajo también puede serlo. Este problema lo construye y lo mide. Flujo de trabajo. data/Snakefile tiene ocho reglas (segment, centreline, measure, boundaries, flow, report, cohort, all) y dos wildcards: el caso (seis estudios) y la condición (ambas entradas de la ICA abiertas, o la ICA izquierda cerrada). El shell de cada regla ejecuta workflow.py, que llama para un caso a la misma función tensorial que el motor tensorial llama una sola vez para todos los casos. Snakemake 9.27.1 lo ejecutó sin conexión en WSL2 (en su propio entorno, nunca parte de este proyecto) y sus salidas se incluyen como referencia en data/snakemake: el DAG de tareas (--dag), la lista de tareas del dry-run, el conjunto a reejecutar tras cambiar una entrada,
  --summary, las horas de inicio y fin de cada tarea, y la tabla de cohorte que escribieron sus tareas. Los tests comprueban que el motor tensorial tiene las mismas 50 tareas y 79 aristas, que los órdenes de Snakemake respetan nuestra $A$ y dan nuestros niveles, que el conjunto a reejecutar es el mismo y que la tabla de cohorte es idéntica hasta los 9 dígitos escritos. Un detalle sobre las reejecuciones: hacer touch a una entrada no hizo que Snakemake reejecutara nada, porque para ficheros pequeños compara sumas de verificación; la referencia cambia los bytes del fichero (mismos arrays), y entonces se reejecutan 10 tareas, como predice $x = s \lor Rs$. Tiempo. En la ejecución incluida, Snakemake tardó 118 s con 1 núcleo, 43 s con 6 y 27 s con 12 (una ejecución anterior en una máquina menos cargada: 79, 23 y 22 s); el motor tensorial hace el mismo trabajo en unos 5 a 10 s en un solo hilo. La contabilidad honesta: cada tarea de Snakemake es un proceso nuevo que arranca Python e importa torch
  y el módulo de la tarea (unos 1,8 s, data/snakemake/startup.csv, es decir, unos 88 s de los 115 s de tiempo sumado de las tareas), lee y escribe ficheros .npz y debe planificarse; el motor tensorial paga eso una sola vez. El procesamiento por lotes en sí aporta poco en una CPU aquí (procesar los casos uno a uno en el mismo proceso tarda más o menos lo mismo, a veces menos), así que la ganancia viene del arranque y de los ficheros, y se reduce cuando cada tarea es una resolución pesada en GPU que eclipsa el arranque. Ninguna planificación en $c$ núcleos mejora $\max(\mathrm{CP}, W/c)$, la ruta crítica de la iteración max-plus y el trabajo total entre $c$, y las ejecuciones medidas lo respetan; encontrar la mejor planificación es NP-difícil en general (la planificación por listas de Graham queda dentro de $W/c + \mathrm{CP}$). Gradiente. Un DAG de ficheros pasa números, no derivadas. El umbral suave hace diferenciables la segmentación, los radios y el flujo, de modo que $\partial s_{\mathrm{L\,MCA}}/\partial\theta$
  (la fracción del flujo de salida por la MCA izquierda) se obtiene para cada caso con una sola pasada hacia atrás y coincide con diferencias finitas centradas, que a Snakemake le costarían dos ejecuciones completas adicionales. El grafo de líneas centrales (topología) y la máscara de componentes conexas se mantienen fijos. Pipeline. Segmentación: umbral suave $\sigma((I - \theta)/w)$ de la intensidad TOF normalizada, máscara dura $I > \theta$ sin los componentes de menos de 64 vóxeles, Dice frente a la máscara de TopCoW de entre 0,86 y 0,91. Líneas centrales: a partir de las etiquetas de vasos de TopCoW, uniones donde se encuentran vasos etiquetados (contactos a menos de 3,5 mm fusionados; solo cuentan los pares anatómicos, así que dos A2 que discurren juntas no forman una), un extremo libre por vaso terminal (su vóxel más lejano mediante una eikonal min-plus con tiempo de recorrido $\ell/R^2$, recentrado), y el camino centrado más corto entre nodos consecutivos (como en el sustituto tensorial
  de VMTK del problema del aneurisma). Medición: cada vóxel cercano a los vasos etiquetados se asigna al punto de línea central más próximo, así que el radio de una arista es $\sqrt{V_e/(\pi L_e)}$ a partir del volumen suave; asimetría $2(r_R - r_L)/(r_R + r_L)$ por vaso; un indicador de estenosis donde el perfil de radio suavizado cae por debajo de la mitad de su mediana (en estos controles sanos, tales indicadores son artefactos de segmentación). Condiciones de contorno, como en Venova: entradas en los extremos libres de las ICA y de la arteria basilar, salidas en los extremos de las MCA, ACA y PCA; los extremos de las Pcom y de la Acom nunca son contornos. Flujo: un modelo estacionario de orden reducido, conductancia de Poiseuille por arista, $P$ = 90 mmHg en las entradas abiertas, cada salida drenada a 0 Pa a través de una carga de Murray $g_k \propto r_k^3$ ajustada para que una red sin resistencia transporte 10 ml/s; una sola resolución lineal por lotes. La prueba de colaterales cierra
  la ICA izquierda: donde una Acom o una Pcom es permeable, el hemisferio izquierdo sigue perfundido. Simplificaciones: sangre newtoniana, tubos rectos rígidos, sin pulsatilidad, sin flujo 3D (el problema del aneurisma hace CFD 3D en un vaso), radios por umbral en vóxeles de 0,5 mm, presiones y flujos del orden de los de la literatura. Datos. TopCoW 2024, subconjunto MRA_Lausanne (Zenodo 10.5281/zenodo.15692630, licencia CC0): 20 estudios TOF-ARM de controles sanos con etiquetas del polígono de Willis. Se incluyen seis casos como recortes de 96×80×48 a 0,5 mm (imagen y etiquetas, menos de 1 MB en total); data/SOURCES.md recoge el procesamiento y las citas (Yang et al., el reto TopCoW; Di Noto et al. 2022, la cohorte de Lausana). No se usa la versión principal de TopCoW (su licencia restringe el uso comercial). Resultados. Además del GIF hay dos resultados 3D. results/centreline.pvd es la anatomía: la superficie de segmentación de cada caso (marching tetrahedra) y su grafo de líneas centrales,
  ambos coloreados según el radio del vaso. results/flow.pvd es el flujo de la red de Poiseuille 1D a lo largo de 11 pasos en los que la ICA izquierda se estrecha: el paso de tiempo es la gravedad de la estenosis s, la fracción del diámetro de la luz perdida (0 abierta, 1 cerrada). Sus capas son la superficie del vaso coloreada según el esfuerzo cortante en la pared $\tau_w = 4\mu|Q|/(\pi r^3)$ de la arista de línea central más próxima (la presión como segundo array), las líneas de corriente y las partículas (ambas coloreadas según la velocidad), y los discos de entrada y salida con flechas. Aquí no hay CFD 3D: las líneas de corriente son el flujo axial idealizado del modelo 1D, líneas paralelas a la línea central de cada vaso a $\rho = 0, 0.35, 0.7$ de su radio con la velocidad de Hagen-Poiseuille $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$; no hay flujo secundario y se interrumpen en las uniones. Cada paso es un estado estacionario; las partículas solo avanzan a lo largo de sus líneas de
  corriente un pseudotiempo fijo de 4 ms por paso (volviendo al inicio de su vaso al llegar al final) para mostrar las velocidades. La estenosis es un segmento de Poiseuille de 10 mm en serie con la entrada, de modo que su conductancia cae como $(1 - s)^4$; s = 0 y s = 1 son exactamente las dos condiciones del workflow, y los pasos intermedios los ejecuta solo el motor tensorial (una resolución por lotes por paso). results/stenosis_sweep.csv da el flujo de entrada de la ICA izquierda y la fracción de la MCA izquierda por paso y caso; results/timings.csv, results/equivalence.csv y results/cohort.csv contienen las demás cifras.'
meanings:
- la regla $s$ lee un patrón de fichero que escribe la regla $r$; extraído del propio Snakefile incluido
- 'por eje de wildcard $a$ (caso, condición): $I$ cuando ambas reglas lo llevan (aristas por caso $A \otimes I$), $\mathbb 1$ para una difusión, $\mathbb 1^\top$ para una agrupación como el informe de cohorte'
- $A_{ij} = 1$ cuando la tarea $i$ lee una salida de la tarea $j$; 50 tareas, 79 aristas
- caminos cerrados de longitud $k$; todos nulos ⇔ $A$ nilpotente ⇔ acíclico
- cuenta los caminos $j \to i$; su patrón 0/1 es la alcanzabilidad (cuadrado booleano repetido)
- 'nivel topológico por iteración booleana matriz–vector: una tarea está lista cuando $A\,\neg\mathrm{done} = 0$ en su fila'
- tiempos de finalización más tempranos, un punto fijo max-plus (tropical); $\max_i t_i$ es la ruta crítica
- tareas a reejecutar después de que las tareas de $s$ (lectoras de un fichero modificado) quedaran obsoletas
- segmentación suave, diferenciable respecto al umbral $\theta$ (uno por caso)
- 'eikonal min-plus sobre el grafo de vóxeles de todos los vasos de todos los casos a la vez: extremos libres y líneas centrales'
- radio de arista a partir del volumen suave de los vóxeles más próximos a su línea central
- Kirchhoff con conductancias de Poiseuille $G_e$ y cargas de salida de Murray $g_k$, una sola resolución por lotes; filas de Dirichlet $p = P$ en las entradas abiertas
- la fracción de flujo de la MCA izquierda diferenciada a través del flujo, la medición y la segmentación, todos los casos en una sola pasada hacia atrás
labels:
  threshold: Umbral de segmentación $\theta$ sobre la intensidad normalizada
  cores: Núcleos $c$ en la cota $\max(\mathrm{CP}, W/c)$
