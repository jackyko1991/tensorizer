source_hash: fb9eaaef3d46
title: 3D ガウシアンスプラッティング
summary: シーンを数百個の色付き半透明 3D ガウス分布で表します。それぞれを透視変換のヤコビアンでカメラに投影し $\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$、スプラットを奥行き順に並べて手前から奥へアルファ合成し $C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$、Adam で各平均・スケール・回転・色・不透明度を合成シーンの写真に当てはめます。学習に使わない視点で、ガウス分布が学習画像だけでなく 3D 形状を学んだことを確かめます。
notes: 正解データは 3 つの球と 1 つの立方体で、ランバート陰影付きで解析的にレイキャストし、シーンを囲む 2 つのリング上の 12 台のカメラで撮影します（$64\times 64$ px）。その間の別の高さにある 13 台目のカメラは学習に使いません。ガウス分布は立方体内のランダムな位置から、灰色で薄く、ランダムな向きで始まります。Adam の各ステップでは学習視点を 1 つ上のパイプライン全体でレンダリングし、L1 写真誤差を各平均・対数スケール・四元数・色・不透明度へ逆伝播します。テンソルの教訓は共分散の代数です。$\Sigma = RSS^{\mathsf T}R^{\mathsf T}$ は最適化手法が何をしても有効な（対称正定値の）共分散のままであり、投影は線形ではないので、各ガウス分布は局所線形化 $J$ を通して写されます。2D スプラット $\Sigma' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$ は einsum の連鎖です。楕円パネルは学習に使わない視点でのこれらの $1\sigma$ 楕円を描きます。高密度化（簡略版）：50 ステップごとに（最初の 70% の間）、中心が最大の勾配を受けたガウス分布を、軸を 1.6 で縮めて $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$ にある 2 つのコピーに分割し、ほぼ透明なガウス分布（$o < 0.05$）を再利用するので $M$ は一定のままです。論文ではビュー空間の勾配を使って複製と分割を行い、枝刈りし、不透明度をリセットし、数百万個のガウス分布にまで増やします。Kerbl et al. (SIGGRAPH 2023) との違いはほかにもあります：球面調和関数の代わりに一定の色（シーンはランバート面）、Structure from Motion の点群の代わりにランダムな初期値、D-SSIM 項のない L1 損失、そしてすべてのスプラットをすべての画素で評価する密なラスタライザ（本物は GPU 上でスプラットを $16\times 16$ のタイルに振り分け、遠いものを飛ばします）。画像が小さいのはこのためです。学習に使わない視点の PSNR は学習 PSNR を少し下回ります。一度も見ていない視点はガウス分布をあまり拘束しないからです。視点を減らす（学習外の視点が劣化する）、L2
  損失、高密度化オフ、ガウス分布やステップを増やす（エッジが鋭くなる）などを試してください。
meanings:
- 四元数から作るガウス分布 $m$ の回転。内部で正規化するので、どんな 4 つの数でも有効な回転になる
- 3D 共分散、$j$ について和をとる。どんなパラメータでも対称正定値、$s = e^{\log s}$
- 各カメラ座標系でのすべてのガウス分布の中心（x 右、y 下、z = 奥行き）
- 中心を画素座標へピンホール投影
- $\partial\mu'_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$：投影の局所線形化
- 各スプラットの 2D 共分散、$j, k$ について和をとる。$JW = $ einsum('vmai,vij->vmaj')、さらに 0.3 px² のローパス
- 二次形式 $d^{\mathsf T}\Sigma'^{-1}d$ を画素の 6 つの単項式 $\varphi = (u^2, 2uv, v^2, u, v, 1)$ で展開：行列積 1 回
- スプラット $m$ が画素 $p$ をどれだけ覆うか。$o_m = \sigma(\text{logit})$
- カメラごとの奥行き順。大きな $(V, M, P)$ テンソルを作る前に、ガウス分布ごとの小さなテンソルを並べ替える
- 透過率：$m$ より手前のスプラットを通過した後に残る光。$m$ に沿って非増加
- 手前から奥への合成、$m$ について和をとる。通り抜けた光は白い背景 $b$ を見せる
- 各ステップでランダムに選んだ学習視点 1 つでの平均絶対画素誤差。Adam が $14M$ 個の数すべてを更新する
labels:
  n_gaussians: ガウス分布の数 $M$
  iterations: Adam ステップ数
  lr: Adam 学習率（平均。他はスケーリング）
  loss: 写真損失
  densify: 分割による高密度化
  n_views: 学習視点数 $V$
  resolution: 画像サイズ（画素）
