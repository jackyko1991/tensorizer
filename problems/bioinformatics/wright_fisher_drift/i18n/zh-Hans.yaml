title: Hardy–Weinberg 平衡与 Wright–Fisher 遗传漂变
summary: 随机交配给出 Hardy–Weinberg 基因型频率 $p^2, 2pq, q^2$；每代随机抽取 $2N$ 个基因拷贝使等位基因频率发生漂变。数千个群体作为一个（重复, 世代）二项抽样张量同时演化，可选加入选择 $s$，并与杂合度的 $(1-1/2N)^t$ 以及固定概率的 $1/2N$ 和 Kimura 公式比较。
notes: Hardy–Weinberg 定律指出，无论亲代基因型如何，一轮随机交配就把等位基因频率 $p$ 变为基因型频率 $p^2, 2pq, q^2$；图中的点是由两个随机配子构成的 $N$ 个个体，散布在这些曲线周围。只有在无限大群体中等位基因频率才保持不变。有 $2N$ 个拷贝时，每一代都是上一代的二项抽样，因此 $p$ 做随机游走，直到到达 0（等位基因丢失）或 1（等位基因固定）。随机挑选的两个拷贝以概率 $1/2N$ 来自同一个亲代拷贝，因此期望杂合度 $2pq$ 每代按因子 $1 - 1/2N$ 缩小；小群体中漂变更快。一个新的中性突变起初是 $2N$ 个拷贝中的一个；由于最终 $2N$ 个拷贝中的某一个将成为所有拷贝的祖先，它被固定的概率为 $1/2N$。有选择时适用 Kimura 的扩散结果：$4Ns \gg 1$ 的有利等位基因被固定的概率接近 $2s$，仍远非必然；而当 $|4Ns| \lesssim 1$ 时，轻微有害的等位基因也可能因漂变而被固定。这里的 $N$ 是理想化的群体大小（恒定、随机交配、无突变或迁移）；真实群体用更小的有效群体大小 $N_e$ 描述。
meanings:
- 重复群体 $r$ 在第 $t$ 代中等位基因 A 的频率
- 选择之后：A 拷贝被传递的频率是 $1+s$ 倍
- 下一代 $2N$ 个拷贝中 A 的数目：每个群体一次抽样，全部同时进行
- 随机交配下的基因型频率 AA、Aa、aa
- 每个由两个随机配子构成的 $N$ 个个体，按基因型计数（点）
- 对 $r$ 求和：$2pq$ 的均值，与 $H_0(1-1/2N)^t$ 比较
- 对每个 $s$，单个新拷贝（$p_0 = 1/2N$）被固定的群体比例
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$，当 $s = 0$ 时等于 $p_0 = 1/2N$
labels:
  N: 群体大小 $N$（二倍体）
  p0: 初始频率 $p_0$
  s: 选择系数 $s$
  generations: 世代数 $G$
  replicates: 群体数 $R$
  fix_replicates: 每个 $s$ 的群体数（固定）
  seed: 随机种子
