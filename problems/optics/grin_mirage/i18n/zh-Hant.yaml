source_hash: cd1d0cc0a127
title: 由光線方程式看路面海市蜃樓
summary: 炎熱路面上方的空氣較稀薄，因此折射率 $n(y)$ 在地面附近下降。幾何光學的光線方程式使光朝 $n$ 較高處彎曲；以 RK4 對一扇形的觀看方向積分，可見瞄向路面的光線往上彎回，因此眼睛會看到遠方物體的第二個倒立像。
notes: 光線從眼睛反向追蹤（光路可逆）：每條光線回答「眼睛朝這個方向看時看到什麼？」。稍微向下的光線在低折射率層中向上彎，從下方擊中物體，因此觀看角度愈低，看到的是物體愈高的部分——像是倒立的。更陡的光線則抵達路面（灰色）。垂直尺度放大約 100 倍：真實的折射率差約為 $\sim 10^{-5}$，角度為毫弧度量級。計算使用 float64，因為 $n\cos\theta$ 只在小數第 7 位才改變。
meanings:
- 光線 $r$ 的位置 $(x, y)$
- 光學方向向量：單位切向量乘以 $n$
- 折射率，在炎熱路面 $y = 0$ 處最低
- 只有 $y$ 分量不為零：$(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$
- 寫成一階系統的光線方程式，以 RK4 推進
- 重複的 $j$ ⇒ 求和：$\lvert\mathbf p\rvert$ 必須保持等於 $n$（精度檢查）
- 水平分層的司乃耳定律：沿每條光線守恆
labels:
  delta_n: 路面處折射率降幅 $\Delta n$
  scale_height: 熱空氣層厚度 $h$
  eye_height: 眼睛高度
  distance: 到物體的距離
  max_dip: 最陡的向下視角
  n_rays: 扇形光線數
