<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Causal self-attention: each character attends only to itself and earlier characters, then the model predicts the next character">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- input characters -->
    <g stroke="#1e40af" stroke-width="1.5" fill="#93c5fd">
      <rect x="22" y="118" width="30" height="26" rx="4"/>
      <rect x="66" y="118" width="30" height="26" rx="4"/>
      <rect x="110" y="118" width="30" height="26" rx="4"/>
      <rect x="154" y="118" width="30" height="26" rx="4"/>
    </g>
    <g font-family="ui-monospace, monospace" text-anchor="middle">
      <text x="37" y="136">W</text><text x="81" y="136">h</text><text x="125" y="136">e</text><text x="169" y="136">n</text>
    </g>
    <!-- attention from position 3 (e) to itself and the past -->
    <g fill="none" stroke="#2563eb" stroke-width="2">
      <path d="M125,116 Q81,70 37,116"/>
      <path d="M125,116 Q103,86 81,116"/>
      <path d="M125,116 Q125,96 125,116"/>
    </g>
    <!-- masked future link -->
    <path d="M125,116 Q147,86 169,116" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="160" y="96" font-size="16" fill="#dc2626">✕</text>
    <text x="52" y="78" font-style="italic" fill="#1e40af">A</text>
    <text x="61" y="83" font-size="10" font-style="italic" fill="#1e40af">ij</text>
    <!-- prediction -->
    <rect x="104" y="26" width="42" height="26" rx="4" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="125" y="44" text-anchor="middle" font-family="ui-monospace, monospace">n?</text>
    <line x1="125" y1="98" x2="125" y2="56" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="196" y="44" font-style="italic" fill="#b45309">p(t₄)</text>
    <text x="196" y="136" font-style="italic">t</text>
    <text x="203" y="140" font-size="10" font-style="italic">i</text>
  </g>
</svg>
