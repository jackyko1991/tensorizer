title: Оболочечная модель ядра
summary: Нуклоны независимо движутся в яме Вудса–Саксона. Решение радиального уравнения Шрёдингера для каждого канала $(l, j)$ как одного пакета конечно-разностных гамильтонианов и постепенное включение спин-орбитального взаимодействия приводят к тому, что магические числа 2, 8, 20, 28, 50, 82, 126 — числа нуклонов особо стабильных ядер — проявляются как самые большие щели в схеме уровней.
notes: 'Без спин-орбитального взаимодействия уровни группируются, как у трёхмерного гармонического осциллятора, и щели приходятся на 2, 8, 20 и 40 нуклонов (плоское дно ямы Вудса–Саксона также отщепляет 58, 92 и 138). Спин-орбитальное слагаемое понижает $j = l + \tfrac12$ и повышает $j = l - \tfrac12$ на величину, растущую с $l$, поэтому партнёр с большим $j$ каждой осцилляторной оболочки (1f7/2, 1g9/2, 1h11/2, 1i13/2) опускается в нижележащую оболочку — объяснение Майер и Йенсена (1949) чисел 28, 50, 82 и 126. Параметры по умолчанию соответствуют нейтронам в ²⁰⁸Pb: $V_0 = 51 - 33(N-Z)/A \approx 44$ МэВ, $r_0 = 1.27$ фм, $a = 0.67$ фм. Упрощения: одна фиксированная яма для всех уровней (без самосогласования и спаривания), без кулоновского слагаемого (так что это нейтронные уровни) и ящик размером 18 фм, поэтому показаны только связанные уровни.'
meanings:
- внутренние точки сетки; $u = 0$ при $r = 0$ и на краю ящика
- конечно-разностная $d^2/dr^2$
- все каналы $(l, j = l \pm \tfrac12)$ до $l = 8$
- $+l/2$ для $j = l+\tfrac12$, $-(l+1)/2$ для $j = l-\tfrac12$
- яма + спин-орбита + центробежный член через einsum('k,i->ki')
- по одному гамильтониану на канал, собранные в стек
- пакетно по $k$; оставляем связанные уровни $E < 0$
- 'число нуклонов при заполнении до каждого уровня по порядку: магические числа стоят у больших щелей'
labels:
  v_so: Конечная сила спин-орбиты $V_{so}$
  v0: Глубина ямы $V_0$
  mass_number: Массовое число $A$ (задаёт $R = r_0 A^{1/3}$)
  diffuseness: Диффузность поверхности $a$
  n_grid: Точки сетки
