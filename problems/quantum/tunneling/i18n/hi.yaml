source_hash: 5c7383dc415a
title: क्वांटम सुरंगन
summary: 'एक गाउसीय तरंग पैकेट एक आयताकार अवरोध से टकराता है। समय-आश्रित श्रोडिंगर समीकरण split-step फ़ूरिये विधि से हल होता है: विभव $x$-समष्टि में विकर्ण संकारक है और गतिज ऊर्जा $k$-समष्टि में विकर्ण संकारक, इसलिए समय चरण का हर आधा भाग बस एक अवयववार टेंसर गुणन है, और torch.fft दोनों आधारों के बीच बदलता है।'
notes: मात्रक $\hbar = m = 1$, पैकेट ऊर्जा $E \approx k_0^2/2$। $\psi$ पर कार्य करता विकर्ण संकारक $D_{xy} = d_x\,\delta_{xy}$, $D_{xy}\psi_y = d_x\psi_x$ है — आव्यूह की आवश्यकता नहीं, बस अवयववार गुणन। स्ट्रैंग विभाजन $P\cdot K\cdot P$, $\Delta t$ में द्वितीय-कोटि सटीक और ठीक ऐकिक है, इसलिए मानक पूर्णांकन त्रुटि तक 1 रहता है। अनुकरण समय स्वतः चुना जाता है ($45/k_0$) ताकि पैकेट केंद्र $x = -25$ से लगभग $x = +20$ तक जाए। $E < V_0$ के लिए शास्त्रीय कण सदा वापस लौटता; दाईं ओर पारगमित पुंज सुरंगन है। तुलना के लिए छपा समतल-तरंग पारगमन गुणांक $T(k_0)$ पैकेट के संवेग फैलाव की उपेक्षा करता है (और ग्रिड पर पड़ी अवरोध चौड़ाई प्रयोग करता है); चौड़ा पैकेट (बड़ा $\sigma_0$) तीक्ष्ण संवेग रखता है और उससे अधिक निकटता से मेल खाता है।
meanings:
- आवर्ती ग्रिड $x$ पर तरंग फलन
- 'अर्ध-चरण विभव संकारक: $x$ में विकर्ण, psi * P के रूप में लागू'
- 'पूर्ण-चरण गतिज संकारक: $k$ में विकर्ण, psi_k * K के रूप में लागू'
- आधार परिवर्तन $x \to k$ (एक तेज़ आव्यूह गुणन, कभी स्पष्ट रूप से नहीं बनाया जाता)
- 'पारगमन: अवरोध के दाईं ओर पाई गई प्रायिकता'
labels:
  k0: पैकेट संवेग $k_0$
  V0: अवरोध ऊँचाई $V_0$
  width: अवरोध चौड़ाई $a$
  sigma: पैकेट चौड़ाई $\sigma_0$
