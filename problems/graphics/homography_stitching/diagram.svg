<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two cameras above a flat poster. A point on the poster projects to x in the first image and x prime in the second; the homography H maps one image onto the other">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the planar poster -->
    <polygon points="20,150 220,150 190,104 50,104" fill="#93c5fd" fill-opacity="0.5" stroke="#374151" stroke-width="2"/>
    <g fill="#1e40af">
      <circle cx="70" cy="132" r="2.5"/><circle cx="96" cy="116" r="2.5"/><circle cx="150" cy="138" r="2.5"/>
      <circle cx="172" cy="114" r="2.5"/><circle cx="198" cy="140" r="2.5"/>
    </g>
    <circle cx="122" cy="128" r="3.5" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <!-- camera 1: centre (44, 22), image plane segment -->
    <polygon points="44,22 30,52 74,52" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="24" y1="52" x2="80" y2="52" stroke="#374151" stroke-width="2"/>
    <circle cx="44" cy="22" r="3" fill="#374151"/>
    <!-- camera 2 -->
    <polygon points="196,22 166,52 210,52" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="160" y1="52" x2="216" y2="52" stroke="#374151" stroke-width="2"/>
    <circle cx="196" cy="22" r="3" fill="#374151"/>
    <!-- rays from the poster point to both camera centres -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="122" y1="128" x2="44" y2="22"/><line x1="122" y1="128" x2="196" y2="22"/>
    </g>
    <!-- image points: where the rays cross the image planes -->
    <circle cx="66" cy="52" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <circle cx="174" cy="52" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <text x="60" y="70" font-style="italic" fill="#b45309">x</text>
    <text x="170" y="70" font-style="italic" fill="#b45309">x′</text>
    <!-- the homography between the images -->
    <path d="M78,38 Q120,10 160,38" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#flow)"/>
    <text x="113" y="18" font-style="italic" fill="#b45309">H</text>
    <text x="203" y="117" font-size="11" fill="#374151">plane</text>
  </g>
</svg>
