source_hash: aa144f7ad9f7
title: Химическое равновесие и принцип Ле Шателье
summary: Где останавливается реакция? Из $\Delta G^\circ = -RT\ln K$ равновесная степень протекания $\xi$ газовой реакции ($\mathrm{N_2O_4 \rightleftharpoons 2\,NO_2}$ или реакции Габера $\mathrm{N_2 + 3H_2 \rightleftharpoons 2NH_3}$) находится сразу для сотен температур и давлений бисекцией по $Q(\xi) = K$, показывая смещения по Ле Шателье при изменении давления, температуры (Вант-Гофф) и добавлении продукта.
notes: '$Q$ показывает, где смесь находится, $K$ — где она хочет быть: если $Q < K$, реакция идёт вперёд, если $Q > K$ — назад. Поскольку $\ln Q$ монотонно растёт со степенью протекания $\xi$ (от $-\infty$ без продуктов до $+\infty$ без реагентов), равновесие — единственный корень $\ln Q(\xi) - \ln K$, и бисекция находит его сразу для всех условий. Принцип Ле Шателье вытекает из формулы. Давление: при активностях идеального газа $Q = K_x\,(P/P^\circ)^{\Delta\nu}$, где $\Delta\nu = \sum_i \nu_i$, поэтому повышение $P$ благоприятствует стороне с меньшим числом молекул газа ($\mathrm{N_2O_4}$ диссоциирует меньше, образуется больше $\mathrm{NH_3}$). Температура: $\ln K = -\Delta H^\circ/RT + \Delta S^\circ/R$, поэтому $K$ растёт с $T$ для эндотермической реакции ($\mathrm{N_2O_4}$: бурый цвет $\mathrm{NO_2}$ при нагревании густеет) и падает для экзотермической (аммиак). Добавленный продукт: $Q$ скачком становится больше $K$, и часть продукта превращается обратно в реагенты, но не весь. Для $\mathrm{N_2O_4}$
  результат можно проверить вручную: $K = 4\alpha^2 P/((1-\alpha^2)P^\circ)$ даёт $\alpha = \sqrt{K/(K + 4P/P^\circ)}$. Термодинамические данные — приближённые справочные значения при 298 K ($\Delta H^\circ \approx +57.2$ kJ/mol, $\Delta S^\circ \approx +176$ J/(mol K) для $\mathrm{N_2O_4}$; $\approx -92.2$ kJ/mol и $\approx -199$ J/(mol K) для аммиака), считаемые не зависящими от $T$, а газы — идеальными; оба упрощения несколько завышают выход аммиака при 700 K и 100 бар (измерено: примерно 20 % $\mathrm{NH_3}$, а не около 30 %). Реакция Габера сильно выгодна при комнатной температуре, но идёт там слишком медленно: установки работают при примерно 700–750 K и 150–300 бар с железным катализатором, жертвуя выходом ради скорости. Попробуйте T = 700 K с реакцией Габера.'
meanings:
- 'стехиометрические числа: $-1, 2$ для $\mathrm{N_2O_4 \rightleftharpoons 2NO_2}$; $-1, -3, 2$ для аммиака'
- каждая пара (температура, давление) развёрнута в один пакетный индекс $b$
- $-\Delta G^\circ/RT$ с приближёнными, не зависящими от температуры $\Delta H^\circ$, $\Delta S^\circ$
- моли каждого вещества; внешнее произведение, ничего не суммируется
- общее число молей; суммирование по $j$
- '$\ln Q$: индекс вещества $i$ суммируется'
- 'ни одно количество не может стать отрицательным: интервал для бисекции'
- 'бисекция, все условия вместе: оставляется половина, где $\ln Q - \ln K$ меняет знак'
- наклон $\ln K$ в зависимости от $1/T$
labels:
  reaction: Реакция ($\mathrm{N_2O_4}$ или аммиак)
  T: Температура $T$ (чёрная кривая)
  P: Давление $P$ для теста с добавлением продукта
  add_product: Добавленный продукт
