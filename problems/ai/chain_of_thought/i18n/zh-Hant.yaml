source_hash: 71b446fca9cd
title: 為什麼思維鏈能幫助 Transformer
summary: '$n$ 個位元的奇偶性是累積 XOR，本質上是循序任務。相同的微型 Transformer（手寫 einsum 注意力，所有模型堆疊在同一個模型軸上並在一次執行中訓練）以兩種格式學習它：直接作答 "$b_1 \dots b_n = p$"，或先寫出累積奇偶性 "$b_1 \dots b_n : s_1 \dots s_n = p$"。在相同權重與步數下，草稿紙模型在 $n = 4$ 到 $10$ 時答對 98–100% 的測試位元串，而直接模型只能擬合 $n = 4$，之後處於或低於隨機水準；注意力顯示出雙 token 規則 $s_k = s_{k-1} \oplus b_k$。這是該機制的玩具模型，並不代表大型語言模型如何推理。'
notes: '現狀：所示效應已經確立。對於必須立即作答的固定深度 Transformer，奇偶性是教科書式的難題。Li, Liu, Zhou 和 Ma（ICLR 2024, arXiv 2402.12875）證明，沒有中間步驟的常數深度 Transformer 僅限於淺層平行電路（在他們的精度假設下類似 $\mathrm{TC}^0$），而 $T$ 步思維鏈使其能夠模擬規模為 $T$ 的循序電路。Nye 等人（2021, arXiv 2112.00114）訓練 Transformer 寫出中間結果的「草稿紙」（scratchpad），並看到它們解決了長加法與程式追蹤等多步任務；Wei 等人（2022, arXiv 2201.11903）為大型語言模型的思維鏈提示（chain-of-thought prompting）命名。 方法：一個 $n$ 位元的串要麼直接寫成 "$b_1 \dots b_n = p$"，要麼連同其累積奇偶性寫成 "$b_1 \dots b_n : s_1 \dots s_n = p$"。每個模型都是同一個 2 層、$d = 64$、4 頭的解碼器（即 `tiny_transformer` 的程式碼，在每個 einsum 中加入模型軸 $m$），以 AdamW 用相同步數、相同的位元串批次訓練；CoT 模型每個串讀入約兩倍的 token，並在其中間 token 上接受訓練，這正是草稿紙帶來的額外幫助。所有模型（$n$ × 格式 × 種子）以及長度泛化模型都在一次執行中訓練：它們的權重堆疊在首軸上，梯度裁剪按模型分別進行，因此彼此從不互相影響（有測試對此進行檢查）。 資料：當 $n \ge 8$ 時，$2^n$ 個串中有四分之一（最多 1024 個）被保留，從不參與訓練；當 $n = 4$ 和 $6$ 時，串太少，無法保留，因此這些準確率（圖中以星號標記）衡量的是擬合而非泛化。測試時，CoT 模型逐個 token 貪婪地寫出自己的草稿紙，只對其最終答案評分。 結論：在預設執行中（2 個種子，數字輸出在終端機），(a) CoT 模型在 $n = 4, 6, 8, 10$ 時答對 0.98 到 1.00 的測試串；直接模型能擬合 $n = 4$ 的 16 個串（1.00），但在 $n = 6, 8, 10$ 時僅得 0.53、0.27 和 0.53。對於
  $n = 8$ 時低於隨機水準的得分，一個合理的解釋（此處未檢驗）是，保留的串與其訓練鄰居只差一個位元，因此奇偶性相反，而在鄰居之間內插的模型就會答錯。(b) 兩種格式的長度泛化都失敗：在 $1 \le n \le 8$ 上訓練的模型在 $n = 12$ 和 $16$ 時得分為 0.46 到 0.51，因為超過 19 的位置從未訓練過，而且在這裡使用的 CoT 版面中，位元 $b_k$ 位於需要它的格子之前 $n + 1$ 個位置，這一偏移隨 $n$ 變化；混合長度訓練的 CoT 模型在步數預算內掌握了 $n = 4$（1.00），卻連 $n = 8$ 都未掌握（0.56）。(c) 在 $k$ 步後清空草稿紙，對任意 $k < n$ 答案都會降到隨機水準：答案是從最後一個格子複製的，所以全部計算都存在於寫出的 token 中。(d) 在 $n = 8$ 的 CoT 模型中，每一步 $k$ 都有某個頭把寫出 $s_k$ 的查詢的 0.5 到 0.8 的注意力放在 $b_k$ 上，而均勻注意力僅為 0.08（單一個頭在各步上的平均值為 0.48；各頭分擔不同的步）。規則的另一個輸入 $s_{k-1}$ 就是查詢 token 本身，它經由殘差流到達輸出，因此學到的規則是局部的，每步兩個 token。 局限：這是展示機制的玩具模型，並不代表大型語言模型如何推理。它無法說明大型模型寫出的步驟是否忠實於實際產生其答案的計算；這是一個懸而未決的研究問題。結果隨種子和步數預算而變化，因此每個種子都會繪出。可以嘗試更多步數、把 $n$ 提高到 16，或只用一層。'
meanings:
- 每個前綴的累積奇偶性：草稿紙的目標，且 $p = s_n$
- 直接格式或 CoT 格式的位元串，以 token id $0, 1, :, =, \_$ 表示；以空白填充，使同一 $n$ 的所有模型共用一個張量
- token 嵌入加上可學習的位置嵌入，每個模型 $m$ 有自己的表
- 重複的 $c$ ⇒ 求和；模型下標 $m$ 不求和，因此 $M$ 個獨立的 Transformer 在一次乘積中執行
- 因果注意力：每一列都是位置 $j \le i$ 上的機率分布
- 訓練哪些下一個 token：僅 $p$（直接），或 $s_1 \dots s_n$、「=」和 $p$（CoT）
- $-\log p$ 在模型 $m$ 所訓練 token 上的平均值（nat）；最小化它們的總和，且每一項只作用於自身的權重
- 測試時，模型自己寫出草稿紙，每次前向傳遞一個 token，寫完後作答
labels:
  steps: 訓練步數
  lengths: 實驗 (a) 的位元串長度 $n$
  seeds: 每個模型的種子數
  d_model: 模型寬度 $d$
  heads: 注意力頭數 $H$
  layers: Transformer 區塊數
  batch: 每步的位元串數
  lr: 學習率
