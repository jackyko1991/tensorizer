title: लैटिस पर यांग–मिल्स और द्रव्यमान अंतराल
summary: 'क्ले मिलेनियम प्रॉब्लम चार विमाओं में द्रव्यमान अंतराल $\Delta > 0$ वाले एक कठोर (rigorous) क्वांटम यांग–मिल्स सिद्धांत की माँग करता है; यह अभी अनसुलझा है। विल्सन (Wilson) का लैटिस गेज सिद्धांत इस प्रश्न को परिकलनीय बनाता है: इकाई क्वाटर्नियन के रूप में संग्रहीत लिंक $U_\mu(x) \in SU(2)$ (या $U(1)$) को मेट्रोपोलिस (Metropolis) एल्गोरिद्म द्वारा युग्मन स्थिरांकों $\beta$ के पूरे बैच के लिए एक साथ अद्यतन किया जाता है। विल्सन लूप परिरोध (confinement) का क्षेत्रफल नियम दिखाते हैं, प्लैकेट यथार्थ द्विविमीय बेसल अनुपात और प्रबल-युग्मन श्रेणी से मेल खाता है, और ग्लूबॉल सहसंबंधक लैटिस पर द्रव्यमान का अनुमान देता है।'
notes: 'स्थिति: अनसुलझा। क्ले प्रॉब्लम (जैफ़ और विटन का आधिकारिक विवरण) माँग करता है कि किसी भी कॉम्पैक्ट सरल गेज समूह के लिए $\mathbb R^4$ पर ऐसा क्वांटम यांग–मिल्स सिद्धांत रचा जाए जो वाइटमैन या ऑस्टरवाल्डर–श्रेडर जैसे अभिगृहीतों को संतुष्ट करे, और सिद्ध किया जाए कि इसके स्पेक्ट्रम में निर्वात के ऊपर अंतराल $\Delta > 0$ है। $SU(3)$ के लैटिस सिमुलेशन उचित संदेह से परे लगभग $1.7$ GeV पर सबसे हल्का ग्लूबॉल और परिरोध (रैखिक विभव, मापा गया स्ट्रिंग तनाव) दिखाते हैं, पर परिमित लैटिस अंतराल पर संख्यात्मक साक्ष्य प्रमाण नहीं है। यह पृष्ठ उसी ढाँचे में खिलौना-आकार पर काम करता है। 2D में सिद्धांत यथार्थतः हल करने योग्य है: हर प्लैकेट स्वतंत्र है, $U(1)$ के लिए $\langle\frac12\mathrm{Tr}P\rangle = I_1(\beta)/I_0(\beta)$ और $SU(2)$ के लिए $I_2(\beta)/I_1(\beta)$, तथा $W(R,T) = u^{RT}$ यथार्थतः (एक परीक्षण)। प्रबल युग्मन (छोटे $\beta$) पर कैरेक्टर प्रसार किसी भी विमा में वही अग्रणी मान और स्ट्रिंग तनाव $\sigma = -\ln u$ वाला क्षेत्रफल नियम देता है: वहाँ परिरोध सिद्ध है (ऑस्टरवाल्डर–ज़ाइलर 1978), और
  त्रिविमीय कॉम्पैक्ट $U(1)$ के लिए हर $\beta$ पर भी (गेपफ़र्ट–मैक 1982)। कठिन भाग 4D में दुर्बल युग्मन $\beta \to \infty$ तक निरंतरता है, जहाँ लैटिस अंतराल शून्य की ओर जाता है; अनंतस्पर्शी स्वतंत्रता (ग्रॉस, विल्ज़ेक और पॉलित्ज़र, नोबेल पुरस्कार 2004) बताती है कि सातत्य सीमा वहीं है। क्रॉयत्ज़ अनुपात $\chi(R,R)$ लूपों के अनुपातों से $\sigma$ का अनुमान लगाते हैं ताकि परिधि पद निरस्त हो जाएँ। ग्लूबॉल संकारक एक समय-खंड पर स्थानिक प्लैकेटों का योग है; इसका संबद्ध सहसंबंधक $e^{-m\Delta}$ की तरह घटता है, और प्रबल युग्मन पर दो प्लैकेटों को जोड़ने वाली सबसे छोटी सतह $4\Delta$ फलकों की एक नली होती है, जिससे $a\,m \approx -4\ln u$ मिलता है। बड़े $\beta$ पर लैटिस इकाइयों में द्रव्यमान घटता है और बड़े लैटिस, स्मीयरिंग और कहीं अधिक स्वीप चाहिए; 4D $U(1)$ में $\beta \approx 1.01$ के पास एक विपरिरोध (deconfining) संक्रमण है और उसके ऊपर कोई द्रव्यमान अंतराल नहीं, इसीलिए समस्या अनाबेली समूहों के लिए कही गई है। चरण $\propto 1/\sqrt{\beta}$ वाला मेट्रोपोलिस स्वीकृति दर को लगभग आधा रखता है; त्रुटियाँ 20 जैकनाइफ़
  बिन से निकाली जाती हैं।'
meanings:
- बैच के हर युग्मन स्थिरांक $\beta_b$ के लिए प्रति लिंक एक इकाई क्वाटर्नियन; $U(1)$ उपसमूह $(\cos\theta, 0, 0, \sin\theta)$ है
- समूह नियम; दोहराए गए $i, j$ ⇒ योग (सदिश गुणनफल)
- 'आवर्ती लैटिस पर पड़ोसी: हर साइट के सभी प्लैकेट एक साथ'
- सबसे छोटा विल्सन लूप; $\frac12\mathrm{Tr}(ab) = a_0b_0 - a_kb_k$
- '$2(D-1)$ स्टेपलों का योग: $S$ का वह भाग जिसमें $U_\mu(x)$ है, $-\beta\frac12\mathrm{Tr}(U_\mu A_\mu)$ है'
- एक दिशा और एक चेकरबोर्ड समता के सभी लिंकों पर एक साथ मेट्रोपोलिस (इनमें कोई स्टेपल साझा नहीं होता)
- $R\times T$ आयतों के चारों ओर लिंक रेखाओं के गुणनफल, साइटों, तलों और अभिविन्यासों पर औसत
- '$I_1/I_0$ $U(1)$ के लिए, $I_2/I_1$ $SU(2)$ के लिए: 2D में यथार्थ $\langle\frac12\mathrm{Tr}P\rangle$, किसी भी $D$ में अग्रणी कोटि'
- स्थानिक-प्लैकेट संकारक का $\ln C(\Delta)/C(\Delta+1)$, जैकनाइफ़ त्रुटियों सहित
