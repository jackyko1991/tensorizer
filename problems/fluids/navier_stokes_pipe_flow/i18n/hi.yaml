title: नेवियर–स्टोक्स पाइप प्रवाह
summary: 'पूर्ण असंपीड्य नेवियर–स्टोक्स समीकरण, एक गोल पाइप में पानी पर लागू जिसे अचानक दाब प्रवणता से धकेला जाता है। अक्षीय प्रवाह के लिए अरैखिक पद ठीक-ठीक लुप्त हो जाता है और एक त्रिज्य विसरण समीकरण बचता है: संवेग no-slip दीवार से अंदर फैलता है और प्रोफ़ाइल $R^2/\nu$ के कुछ गुना समय में हेगन–पॉइज़ुई परवलय में बदल जाती है।'
notes: 'यह नेवियर–स्टोक्स के दुर्लभ सटीक हलों में से एक है: प्रवाह समांतर होने से $(\mathbf u\cdot\nabla)\mathbf u = 0$ और केवल दाब प्रवणता और श्यानता बचती हैं। स्थायी हेगन–पॉइज़ुई प्रवाह में $u_z = G(R^2 - r^2)/4\mu$, प्रवाह दर $Q = \pi G R^4/8\mu$ (प्रसिद्ध $R^4$ नियम) और दीवार अपरूपण प्रतिबल $\tau_w = GR/2$ है — प्रति इकाई लंबाई बल संतुलन $G\,\pi R^2 = \tau_w\,2\pi R$। प्रारंभ इसकी ओर $e^{-\lambda_1^2\nu t/R^2}$ की तरह पहुँचता है, जहाँ $\lambda_1 = 2.405$ ($J_0$ का पहला शून्य), अतः $t \approx 0.6\,R^2/\nu$ तक प्रोफ़ाइल परवलय से कुछ प्रतिशत के भीतर होती है। आरंभ में कोर एक प्लग की तरह चलता है और केवल दीवार के पास का तरल कर्षण अनुभव करता है — रंजक रेखाएँ देखें। हल स्तरीय (laminar) है; लगभग 2000 से ऊपर की रेनॉल्ड्स संख्या पर वास्तविक पाइप प्रवाह विक्षुब्ध (turbulent) हो जाता है।'
meanings:
- केवल $u_z \ne 0$ और $\partial_z u_z = 0$, अतः अभिवहन पद ठीक शून्य है
- 'सांतत्य स्वतः संतुष्ट: $u_z$ पाइप के अनुदिश नहीं बदलता'
- अक्ष ($i = 0$) से दीवार ($i = N$) तक त्रिज्य बिंदु
- अक्षीय वेग $u_z(r_i)$; दीवार पर $u_N = 0$ (no slip)
- $\tfrac1r\partial_r(r\partial_r\,\cdot)$ आव्यूह के रूप में, अक्ष पर $r \to 0$ सीमा $2\partial_r^2$
- 'दोहराया गया $j$ ⇒ योग: श्यान पद $\nu\nabla^2 u_z$'
- चालक दाब प्रवणता, Pa/m में
- आयतन प्रवाह दर; स्थायी मान $\pi G R^4/8\mu$
- दीवार पर प्रति क्षेत्रफल कर्षण; स्थायी मान $GR/2$
labels:
  G: दाब प्रवणता $G$
  R: पाइप त्रिज्या $R$
  nu: शुद्धगतिक श्यानता $\nu$
  t_max: $R^2/\nu$ के मात्रकों में अनुकरण समय
