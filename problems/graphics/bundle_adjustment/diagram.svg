<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Bundle adjustment: three cameras with poses R and t observe the same 3D points X_p; in one image the measured point and the reprojected point differ by the reprojection error r">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- rays from the points to the camera centres -->
    <g stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3">
      <line x1="104" y1="38" x2="34" y2="128"/>
      <line x1="136" y1="30" x2="34" y2="128"/>
      <line x1="104" y1="38" x2="120" y2="140"/>
      <line x1="136" y1="30" x2="120" y2="140"/>
      <line x1="150" y1="56" x2="120" y2="140"/>
      <line x1="136" y1="30" x2="206" y2="128"/>
      <line x1="150" y1="56" x2="206" y2="128"/>
      <line x1="120" y1="58" x2="206" y2="128"/>
    </g>
    <!-- the 3D points -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.2">
      <circle cx="104" cy="38" r="4.5"/>
      <circle cx="136" cy="30" r="4.5"/>
      <circle cx="150" cy="56" r="4.5"/>
      <circle cx="120" cy="58" r="4.5"/>
      <circle cx="90" cy="60" r="4.5"/>
    </g>
    <text x="162" y="34" font-style="italic">X</text>
    <text x="173" y="38" font-size="10" font-style="italic">p</text>
    <!-- three cameras: centre (dot) and image plane (line) -->
    <g stroke="#374151" stroke-width="2" fill="#374151">
      <circle cx="34" cy="128" r="3.5"/>
      <line x1="38" y1="96" x2="64" y2="116"/>
      <circle cx="120" cy="140" r="3.5"/>
      <line x1="100" y1="114" x2="140" y2="114"/>
      <circle cx="206" cy="128" r="3.5"/>
      <line x1="176" y1="116" x2="202" y2="96"/>
    </g>
    <text x="8" y="152" font-style="italic">R, t</text>
    <!-- reprojection error in the middle camera: measured (dark) vs reprojected (hollow) -->
    <circle cx="117" cy="114" r="3" fill="#374151"/>
    <circle cx="137" cy="114" r="3.5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="118" y1="123" x2="135" y2="123" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="142" y="134" font-style="italic" fill="#b91c1c">r</text>
    <text x="88" y="108" font-style="italic">ũ</text>
  </g>
</svg>
