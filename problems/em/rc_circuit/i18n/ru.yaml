source_hash: 6cf1e64854dc
title: Зарядка конденсатора (RC-цепь)
summary: Конденсатор, заряжающийся через резистор, подчиняется уравнению $dV/dt = (V_s - V)/(RC)$. Несколько цепей с разными сопротивлениями собраны в один тензор напряжений, так что один шаг Рунге–Кутты продвигает их все. Переключите источник на прямоугольные импульсы, чтобы увидеть зарядку и разрядку конденсаторов.
notes: 'Единицы: $R$ в кОм и $C$ в мФ, так что $\tau = RC$ получается в секундах, а $I$ — в мА. Через одну постоянную времени конденсатор заряжается до 63 % напряжения источника, через $5\tau$ — практически полностью. При зарядке от батареи источник отдаёт энергию $CV_s^2$: ровно половина запасается в конденсаторе, а другая половина переходит в тепло в $R$ — при любом значении $R$.'
meanings:
- напряжение на конденсаторе $b$ (по одному элементу на цепь)
- сопротивление цепи $b$
- ёмкость, одинаковая во всех цепях
- напряжение источника, общее для всех цепей (broadcast по $b$)
- 'поэлементно: индекс $b$ стоит по одному разу с каждой стороны, суммирования нет'
- ток через каждый резистор
- энергия, запасённая в каждом конденсаторе
labels:
  V_s: Напряжение источника
  C: Ёмкость
  R_min: Наименьшее сопротивление
  R_max: Наибольшее сопротивление
  n_circuits: Цепи
  source: Источник
  period: Период прямоугольных импульсов
  t_max: Время моделирования
