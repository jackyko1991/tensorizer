source_hash: 492f2e3f4bf6
title: 'ПЭТ: аннигиляция позитронов и реконструкция изображения'
summary: Радиофармпрепарат, например ФДГ, испускает позитроны; каждый аннигилирует с электроном, рождая два фотона по 511 кэВ, разлетающихся в противоположные стороны. Пакет смоделированных распадов прослеживается до кольца детекторов, каждое совпадение заносится в синограмму по своей линии отклика, а изображение восстанавливается методом MLEM, $\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$, где весь сканер — одна системная матрица $A$, а каждая итерация — два умножения матрицы на вектор.
notes: 'Два фотона летят в противоположные стороны, поэтому распад произошёл где-то на прямой, соединяющей два одновременно сработавших детектора: на линии отклика (LOR). Миллионы таких линий образуют синограмму (каждая точка тела рисует в ней синусоиду в координатах $(\theta, s)$). MLEM считает отсчёты пуассоновскими со средним $\bar y = A\lambda + r$ и поднимается по логарифму правдоподобия $\sum_b y_b \log \bar y_b - \bar y_b$: каждая итерация проецирует текущее изображение, сравнивает с данными и обратно проецирует отношение. Изображение никогда не становится отрицательным, полное число отсчётов сохраняется ($\sum_b (A\lambda)_b = \sum_b y_b$ без фона), а правдоподобие никогда не убывает. Первые итерации гладкие, последующие резче, но усиливают пуассоновский шум, поэтому ошибка сначала падает, а потом снова растёт (при значениях по умолчанию минимум около 50 итераций; попробуйте 150 итераций или меньше распадов, чтобы увидеть рост): клинические сканеры останавливаются раньше (или используют
  подмножества OSEM и постфильтр). FBP фильтрует каждую проекцию рамп-фильтром и выполняет обратное проецирование за один шаг; это быстро, но шумнее, и значения могут быть отрицательными. Фотоны, проходящие через тело, ослабляются в $e^{-\int \mu\, dl}$ раз, где $\mu \approx 0.096$ см$^{-1}$ для воды при 511 кэВ; этот множитель зависит только от LOR, а не от места распада на ней, поэтому он включён в $A$. Упрощения: только 2D, гауссов пробег позитрона (средний пробег у F-18 около 0,6 мм, у Ga-68 около 3 мм, так что он скрыт пикселями 6 мм, если его не увеличить), без неколлинеарности фотонов, идеальные кристаллы (конец каждой LOR ставится в случайную точку сработавшего кристалла) без глубины взаимодействия и мёртвого времени, а также известный гладкий фон случайных и рассеянных совпадений. Все значения приблизительные и предназначены только для обучения, не для клинического применения.'
meanings:
- места распадов, выбранные по карте активности (горячие очаги распадаются чаще)
- 'точка аннигиляции: позитрон сначала пролетает около миллиметра'
- два фотона $p = 1, 2$ в противоположных направлениях, по $511$ кэВ каждый
- 'где каждый фотон достигает кольца: решить $|a + t u| = R$ при $t > 0$'
- 'синограмма: зарегистрированные совпадения на каждую линию отклика $(\theta, s)$'
- вероятность того, что распад в пикселе $j$ будет засчитан в бин $b$ (с учётом ослабления)
- 'повторяющийся $j$ ⇒ суммирование: прямая проекция плюс случайные/рассеянные совпадения'
- 'повторяющийся $b$ ⇒ суммирование: обратная проекция вдоль каждой LOR'
- 'мультипликативное обновление: остаётся положительным и сохраняет полное число отсчётов'
