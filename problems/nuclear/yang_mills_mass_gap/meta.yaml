notes: >
  Status: open. The Clay problem (Jaffe and Witten's official description) asks to construct quantum Yang–Mills theory on
  $\mathbb R^4$ for any compact simple gauge group satisfying axioms such as those of Wightman or Osterwalder–Schrader, and
  to prove that its spectrum has a gap $\Delta > 0$ above the vacuum. Lattice simulations of $SU(3)$ give a lightest
  glueball near $1.7$ GeV and confinement (a linear potential, measured string tension) beyond reasonable doubt, but
  numerical evidence at finite lattice spacing is not a proof. This page works in the same framework at toy size. In 2D
  the theory is exactly solvable: every plaquette is independent, $\langle\frac12\mathrm{Tr}P\rangle = I_1(\beta)/I_0(\beta)$ for
  $U(1)$ and $I_2(\beta)/I_1(\beta)$ for $SU(2)$, and $W(R,T) = u^{RT}$ exactly (a test). At strong coupling (small $\beta$) the
  character expansion gives the same leading values in any dimension and an area law with string tension
  $\sigma = -\ln u$: confinement is proven there (Osterwalder–Seiler 1978), and also for 3D compact $U(1)$ at every $\beta$
  (Göpfert–Mack 1982). The hard part is continuity to weak coupling $\beta \to \infty$ in 4D, where the lattice spacing goes to
  zero; asymptotic freedom (Gross, Wilczek and Politzer, Nobel Prize 2004) says that is where the continuum limit lies. Creutz ratios $\chi(R,R)$ estimate $\sigma$ from ratios of loops so that perimeter terms cancel. The glueball operator
  is the sum of spatial plaquettes on a time slice; its connected correlator decays as $e^{-m\Delta}$, and at strong coupling
  the smallest surface joining two plaquettes is a tube of $4\Delta$ faces, giving $a\,m \approx -4\ln u$. At larger $\beta$ the
  mass in lattice units falls and needs bigger lattices, smearing and many more sweeps; 4D $U(1)$ has a deconfining transition
  near $\beta \approx 1.01$ and no mass gap above it, which is why the problem is stated for non-abelian groups. Metropolis
  with a step $\propto 1/\sqrt{\beta}$ keeps the acceptance near one half; errors use 20 jackknife bins.
params:
  group: {default: SU(2), type: choice, options: [SU(2), U(1)], label: Gauge group}
  dim: {default: 3, min: 2, max: 4, step: 1, type: int, label: 'Dimension $D$'}
  size: {default: 8, min: 4, max: 12, step: 2, type: int, label: 'Lattice size $L$ (sites per side)'}
  beta: {default: 2.0, min: 0.2, max: 4.0, step: 0.1, label: 'Coupling $\beta$ for loops and glueball'}
  sweeps: {default: 600, min: 100, max: 5000, step: 100, type: int, label: Monte Carlo sweeps}
