source_hash: 890ee320b06e
title: パルサータイミングアレイと Hellings–Downs 曲線
summary: ナノヘルツ重力波の海が、地球と多数のミリ秒パルサーを結ぶ経路をわずかに伸び縮みさせる。千個のランダムな平面波から作った等方的な背景放射が、アンテナパターン $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$（偏極テンソルに対する一つの einsum）を通して各パルサーのパルス到着時刻をずらす。すべてのタイミング残差の組の相関をとり角度ごとにビン分けすると Hellings–Downs 曲線が得られる。これは四重極的な指紋であり、2023 年にパルサータイミングアレイがその証拠を報告した。
notes: 重力波はパルサーと地球の間の光の伝播時間を変えるため、パルスの到着時刻は数年のうちに数十から数百ナノ秒ずれる。単一の波では、その効果は $F^{+}$ と $F^{\times}$ を通して幾何配置に依存する。等方的な背景では方向について平均すると、二つのパルサー間の角度だけに依存する相関が残る。Hellings と Downs（ApJL 265, L39, 1983）はこれを計算した：天球上で近いパルサーどうしの相関は $\tfrac12$（各パルサーのパワーの残り半分は相関のない自身のパルサー項）、約 $82.5^\circ$ 離れた組はわずかに負の相関をもち、正反対のパルサーどうしは再び $\tfrac14$ の正の相関をもつ。この四重極的な形は、横波でスピン 2 の波の特徴である。時計の誤差なら単極子（$\Gamma = 1$）、太陽系暦の誤差なら双極子（$\Gamma = \cos\zeta$）を与えるので、比較のため両者もフィットする。このページは規格化を二通りで確かめる：公式をモンテカルロによる天球積分 $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$ と比べること、そしてアンテナパターンの平均 $\langle\sum_A (F^A)^2\rangle = 1/3$ である。一つの天球では点が曲線の周りにかなりばらつく：支配的な周波数が少ないとき、この「宇宙分散」は実在し、実際のアレイにも影響する。多数のシミュレーション天球を平均すると収束の様子がわかる。フィットした振幅は白色雑音によって 1 より小さく薄められる。研究の背景：2023 年 6 月、NANOGrav Collaboration（15 年データセット、Agazie et al., ApJL 951, L8, 2023）は Hellings–Downs 相関をもつナノヘルツ重力波背景の証拠を報告した（相関についておよそ 3σ、概算）。同時に欧州・インドの PTA（EPTA + InPTA, A&A 2023）、Parkes PTA（Reardon et al., ApJL 951, L6, 2023）、中国の PTA も報告している。有力な起源は超大質量ブラックホール連星の集団であり、ここで用いる $h_c \propto f^{-2/3}$
  スペクトルを与える。単純化：残差は各パルサーのスピンダウンに対してフィットしていない（平均のみ除去）、白色雑音のみでパルサー固有の赤色雑音はなく、最適統計量や完全なベイズ解析の代わりに単純な規格化相互相関を用いる。
meanings:
- パルサー $a$ への単位ベクトル。天球上で一様
- 波 $m$ の伝播方向と偏極角
- 横方向の基底 $m, n \perp \hat\Omega$ から作る $+$ と $\times$ のテンソル
- $i$ と $j$ について和：地球–パルサー間の視線の伸び
- アンテナパターン。$\sum_A (F^A)^2$ の天球平均はちょうど $1/3$
- パルサー項の位相遅れ、$\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- $m$ と $A$ について和：時刻 $t$ におけるパルサー $a$ のタイミング残差
- $t$ について和：すべての組の相関。平均自己パワーで規格化
- 期待される相関。$\Gamma(0^+) = \tfrac12$、$\zeta \approx 82.5^\circ$ で最小値 $\approx -0.152$
labels:
  n_pulsars: パルサー数 $N$
  n_realisations: シミュレーション天球数 $K$
  n_waves: 天球あたりの平面波数 $M$
  n_freq: 周波数ビン $j/T_{span}$
  span: 観測期間 $T_{span}$
  n_times: パルサーあたりの観測時点数
  noise: 白色雑音 $\sigma$ / 重力波 rms
  n_bins: 角度ビン数
  seed: 乱数シード
