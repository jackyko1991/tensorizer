source_hash: 31a92e6ff86f
title: '일반 상대성 이론: 블랙홀 주위의 궤도와 낙하'
summary: 슈바르츠실트 계량에서의 측지선. 크리스토펠 기호는 $g_{\mu\nu}(x)$로부터 자동 미분으로 구하고 einsum으로 축약한다. 속박 궤도는 닫히지 않고 세차 운동하며, 유효 퍼텐셜에는 최내곽 안정 원궤도(ISCO)가 $6GM/c^2$에, 광자구가 $3GM/c^2$에 나타난다. 지름 방향 낙하는 유한한 고유 시간 안에 사건의 지평선에 도달하지만, 멀리 있는 시계는 멈춘 듯 얼어붙는다.
notes: '단위: $G = c = M = 1$이므로 길이는 $GM/c^2$ 단위(태양 질량당 1.5 km)이고 사건의 지평선은 $r_s = 2$에 있다. 궤도는 근점에서 출발하며, 반통경 $p$와 이심률 $e$인 궤도의 정확한 슈바르츠실트 에너지 $E$와 각운동량 $L$을 사용한다. 고유 시간 $\tau$에 대해 RK4로 적분한다. 같은 $p$와 $e$를 가진 회색 뉴턴 타원은 닫힌다. 근일점 이동은 $p$가 클 때 $6\pi GM/(c^2 p)$에 가까워지며(수성은 100년당 43″), 블랙홀 가까이에서는 훨씬 커진다. 속박 궤도는 $p > 6 + 2e$일 때만 존재한다. ISCO($r = 6$) 안쪽에서는 원궤도가 불안정하고, $r = 3$에서는 빛조차 원을 그리며 돌 수 있다. 낙하 그림(오른쪽 아래)에서 떨어지는 시계는 약 $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$(유한) 후에 지평선에 도달하지만, 슈바르츠실트 시간 $t$로 보면 낙하가 점점 느려져 $r = 2$에서 얼어붙는다. 계산은 이 좌표가 무너지기 시작하는 $r = 2.1$에서 멈춘다.'
meanings:
- 각 측지선 위의 사건 $(t, r, \theta, \varphi)$, $G = c = M = 1$
- 4-속도 $dx^\mu/d\tau$
- 슈바르츠실트 계량, 부호수 $(-, +, +, +)$
- 역계량
- autograd로 구한 계량의 도함수, 미분 첨자는 마지막
- 반복되는 $\sigma$ ⇒ 합산 ($z$ = 배치)
- 반복되는 $\alpha, \beta$ ⇒ 합산
- 질량이 있는 입자는 $= -1$, 적분 검증
labels:
  p: 반통경 $p$
  e: 이심률 $e$
  n_orbits: 시뮬레이션할 공전 수
  dt: 고유 시간 간격 $\Delta\tau$
  r_infall: 낙하 시작 위치(정지 상태)
