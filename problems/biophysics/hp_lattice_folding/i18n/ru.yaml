source_hash: a25b37200a6c
title: Сворачивание решёточного белка в HP-модели
summary: 'Простейшая модель белка, которая всё ещё сворачивается: цепь из гидрофобных (H) и полярных (P) остатков на квадратной решётке, где каждый контакт H–H между остатками, не являющимися соседями по цепи, понижает энергию на единицу. Множество реплик эталонной 20-остаточной последовательности сворачиваются одновременно методом Монте-Карло с алгоритмом Метрополиса, ходами-протяжками (pull moves) и коленчатыми ходами, пока температура понижается, а карта контактов получается из одного тензора попарных расстояний формы $(R, N, N)$.'
notes: 'Белки сворачиваются во многом потому, что гидрофобные боковые цепи прячутся от воды в компактном ядре. HP-модель (Дилл, 1985) оставляет только это: контакт H–H стоит $-\varepsilon$, ничто другое не учитывается, а цепь — самоизбегающее блуждание на решётке. Даже так поиск наименьшей энергии NP-труден, а число конформаций растёт как $2.64^N$. Последовательность по умолчанию HPHPPHHPHPPHPHHPPHPH — классический 20-остаточный эталон Унгера и Моулта (1993) с основным состоянием $E = -9$; у остальных известные минимумы $-9$, $-8$ и $-14$. На каждом шаге каждая реплика выбирает один остаток и пробует ход-протяжку (Леш, Митценмахер и Уайтсайдс, 2003: остаток прыгает в свободный угол и тянет за собой соседей по цепи, пока цепь снова не станет связной; на концах это поворачивает последний остаток, а в простейшем случае это переворот угла) или коленчатый ход (U-образная пара переворачивается). Предложение, разрывающее связь или помещающее два остатка в один узел, отвергается; в остальных случаях
  решает правило Метрополиса. Высокая температура позволяет цепям исследовать пространство, медленное охлаждение — улечься в компактные укладки с H-ядром и P-остатками на поверхности. Энергия $E$ обновляется на $\Delta E$ каждого принятого хода и в тестах сверяется с полным пересчётом. Ходы-протяжки — не строго симметричные предложения, поэтому прогон является оптимизатором, а не точным тепловым семплером. Попробуйте 36-остаточную последовательность: ей нужно больше шагов или реплик, а доля реплик, достигших основного состояния, показывает, насколько изрезан её энергетический ландшафт.'
meanings:
- решёточная координата $k$ остатка $i$ в реплике $r$; каждая реплика стартует прямым стержнем
- 1 для H, 0 для P
- 'повторяющийся $k$ ⇒ суммирование: пакетная матрица Грама; вместе с квадратами норм она даёт $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$'
- соседи по решётке, не являющиеся соседями по цепи
- 'повторяющиеся $i$ и $j$ ⇒ суммирование: контакты H–H, каждый посчитан дважды, отсюда $\tfrac12$'
- связи длины 1 и никаких двух остатков в одном узле, иначе ход отвергается
- 'расписание отжига: $T$ убывает геометрически, шаг за шагом'
- 'правило Метрополиса: вниз всегда, вверх с вероятностью $e^{-\Delta E/T}$'
labels:
