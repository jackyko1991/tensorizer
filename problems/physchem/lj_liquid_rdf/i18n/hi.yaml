title: 'लेनार्ड-जोन्स तरल: आण्विक गतिकी और त्रिज्य वितरण फलन'
summary: 'आवर्ती बॉक्स में लेनार्ड-जोन्स विभव से अन्योन्यक्रिया करते पाँच सौ परमाणु, वेग वर्ले (velocity Verlet) से समाकलित। सभी युग्म सदिश न्यूनतम-प्रतिबिंब परिपाटी के साथ एक ब्रॉडकास्ट टेंसर में रहते हैं, और तीन अवस्था बिंदु (गैस, त्रिक बिंदु के पास द्रव और संपीडित ठोस) एक बैच के रूप में चलते हैं। एक बेरेंडसेन थर्मोस्टैट तापमान तय करता है, फिर ऊर्जा-संरक्षी NVE रन आता है, और युग्म दूरियों के आयतचित्र $g(r)$ देते हैं: गैस के लिए समतल, द्रव के लिए अवमंदित कोश, ठोस के लिए तीक्ष्ण जालक शिखर। वायरियल दाब देता है।'
notes: 'समानीत इकाइयाँ: लंबाइयाँ $\sigma$ में, ऊर्जाएँ $\varepsilon$ में, द्रव्यमान 1, $T^* = k_BT/\varepsilon$, समय $\tau = \sigma\sqrt{m/\varepsilon}$; आर्गन के लिए $\sigma = 3.4$ Å, $\varepsilon/k_B = 120$ K, इसलिए द्रव अवस्था बिंदु लगभग 86 K है। यह वही अनुकरण है जो Rahman ने 1964 में द्रव आर्गन के लिए चलाया था (Phys. Rev. 136, A405), Verlet द्वारा 1967 में प्रस्तुत समाकलक और $g(r)$ विश्लेषण के साथ (Phys. Rev. 159, 98)। विभव को $r_c = 2.5\sigma$ पर काटा और वहाँ शून्य पर खिसकाया गया है ताकि ऊर्जा सतत रहे; दाब को मानक पूँछ सुधार $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$ मिलता है, जो कटऑफ़ के पार $g = 1$ मानता है। बेरेंडसेन थर्मोस्टैट वेगों को लक्ष्य तापमान की ओर पुनःस्केल करता है; यह सटीक विहित (canonical) उतार-चढ़ाव उत्पन्न नहीं करता, इसलिए इसे केवल साम्यीकरण के लिए उपयोग किया जाता है, और माप एक साधारण NVE रन से आते हैं, जहाँ समतल ऊर्जा रेखा समाकलक की जाँच करती है। गैस और द्रव गर्म से शुरू होते हैं ताकि जालक पिघल जाए। द्रव $g(r)$ का पहला शिखर विभव न्यूनतम $2^{1/6}\sigma$ के
  पास है, बाद के कोश अवमंदित हैं और लगभग $3\sigma$ तक $g \to 1$; ठोस fcc शिखर बनाए रखता है। गैस के लिए दाब की तुलना आदर्श गैस से और द्वितीय-वायरियल सुधार $P = \rho T(1 + B_2\rho)$ से की जाती है, $B_2$ संख्यात्मक रूप से समाकलित। रन छोटे हैं (कुछ $\tau$), इसलिए औसतों में कुछ प्रतिशत का सांख्यिकीय रव है। पूर्ण युग्म टेंसर की लागत प्रति चरण $O(N^2)$ है; उत्पादन कोड लाखों परमाणुओं तक पहुँचने के लिए सेल या पड़ोसी सूचियाँ उपयोग करते हैं।'
meanings:
- समानीत इकाइयों में गैस $(0.05, 1.5)$, द्रव $(0.84, 0.72)$, ठोस $(1.10, 0.60)$
- fcc जालक पर आरंभ, $N = 4n^3$ परमाणु, बॉक्स $L_s = (N/\rho_s)^{1/3}$
- ब्रॉडकास्टिंग से हर युग्म सदिश एक साथ, फिर निकटतम प्रतिबिंब पर लपेटा गया
- दोहराया गया $a$ ⇒ योग
- $-u^{\prime}(r)/r$, विकर्ण पर और $r_c = 2.5\sigma$ के पार शून्य
- दोहराया गया $j$ ⇒ योग; $d_{saji} = -d_{saij}$ न्यूटन का तीसरा नियम मुफ़्त में देता है
- 'अर्ध किक, ड्रिफ़्ट (बॉक्स में लपेटा गया), नए बल, अर्ध किक: काल-उत्क्रमणीय और ऊर्जा-संरक्षी'
- केवल साम्यीकरण के दौरान बेरेंडसेन थर्मोस्टैट
- $\rho T + W/3V$ और $r_c$ के पार युग्मों के लिए पूँछ सुधार
- प्रति कोश युग्मों को आदर्श-गैस गणना $\tfrac12 N\rho\,4\pi r^2\Delta r$ से भाग
