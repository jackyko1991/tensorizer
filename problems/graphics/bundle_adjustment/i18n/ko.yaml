source_hash: a99f4b65ce2b
title: '번들 조정: 레벤버그–마쿼트법으로 푸는 움직임 기반 구조 복원'
summary: 여러 카메라가 같은 3D 점들을 픽셀 잡음과 함께 촬영한다. 대략적인 자세(축-각 회전 $\boldsymbol\omega_c$, 평행 이동 $\mathbf t_c$)와 대략적인 점 $\mathbf X_p$에서 출발해, 번들 조정은 전체 재투영 오차 $\tfrac12\sum_{c,p}\lVert\pi(R_c\mathbf X_p + \mathbf t_c) - \tilde{\mathbf u}_{cp}\rVert^2$를 레벤버그–마쿼트법(Levenberg–Marquardt)으로 최소화한다. 야코비안은 자동 미분으로 얻고, 정규 방정식 $J^{\mathsf T}J\,\Delta = -J^{\mathsf T}\mathbf r$는 슈어 보수(Schur complement)를 통해 풀며, 7개의 게이지 자유도를 고정하면 해가 유일해진다.
notes: '데이터는 합성 데이터다. 점들은 반지름 1인 구 안에 있고, 카메라들은 5단위 떨어진 호 위에 있으며(초점 거리 1000 px, $640\times 640$ 이미지), 모든 점이 모든 카메라에 보이고, 픽셀 잡음은 가우스 분포 $\sigma$를 따른다. 시작점은 모든 회전을 몇 도씩, 모든 평행 이동과 점을 장면 크기의 일부만큼 흐트러뜨리므로 처음 재투영 오차는 수십 픽셀이다. 게이지 자유도: 장면 전체를 모든 카메라와 함께 이동·회전·확대해도 어떤 이미지도 변하지 않으므로, $E$에는 같은 최솟값을 갖는 7차원 골짜기가 있고 $J^{\mathsf T}J$는 0인 고윳값을 7개 갖는다(콘솔에 출력되며, 가장 큰 고윳값의 약 $10^{-16}$이다). 카메라 0(숫자 6개)과 카메라 1의 $x$ 방향 평행 이동(스케일)을 고정하면 영공간이 제거된다. $J^{\mathsf T}J$가 최대 계수가 되고 각 단계가 잘 정의된다. 이 값들은 참값으로 고정하므로 결과를 참값과 직접 비교할 수 있다. 각 반복은 잔차를 선형화하고 $\mathbf r(\boldsymbol\theta + \Delta) \approx \mathbf r + J\Delta$, 감쇠된 정규 방정식을 푼다. 야코비안은 torch.func.jacrev, 즉 모든 잔차에 대해 벡터화된 자동 미분으로 만들어지므로 실수하기 쉬운 손 계산 미분이 필요 없다. 슈어 보수는 희소성(화살표 모양의 $J^{\mathsf T}J$ 패널)을 활용한다. 점들을 먼저 소거하면 카메라 크기만 한 계만 남으며, 실제 번들 조정기가 수백만 개의 점을 다룰 수 있는 이유가 바로 이것이다. 여기서 조밀한 풀이와 슈어 풀이는 약 $10^{-12}$까지 같은 단계를 준다. 최적점에서 RMS 재투영 오차는 잡음 하한 $\sigma\sqrt{1 - n/m}$와 같고(맞춘 미지수 하나하나가 잡음을 조금씩 흡수한다), 잔차 히스토그램은 잡음 분포와 일치한다. 더 설명할 것이 남아 있지 않다는 뜻이다. 남은 점과 카메라 오차는 최적화기가
  아니라 잡음과 기하 배치가 결정한다. 참고 문헌: B. Triggs, P. McLauchlan, R. Hartley and A. Fitzgibbon, "Bundle Adjustment — A Modern Synthesis" (Vision Algorithms: Theory and Practice, 1999). 단순화: 이상치 없음(실제 시스템은 강건 손실을 쓴다), 렌즈 왜곡 없음, 모든 점이 모든 카메라에 보임, 야코비안을 조밀하게 저장. 시작 섭동을 키워 보거나(그러면 LM에 더 강한 감쇠가 필요하거나 잘못된 최솟값에 빠진다), 잡음을 늘리거나, 카메라를 2대만 써 보자.'
meanings:
- '카메라 자세: 축-각 회전(방향 = 축, 길이 = 각도)과 평행 이동, 따라서 $x_{\rm cam} = R\mathbf X + \mathbf t$'
- 로드리게스 공식 $I + \sin\theta\,K + (1-\cos\theta)K^2$; 회전마다 숫자 3개, 강제할 제약 없음
- 모든 카메라 좌표계에서의 모든 점, $j$에 대해 합
- 픽셀 단위 재투영 오차; $r_m$, $m = (c, p, a)$로 펼침
- '자유 미지수: 모든 자세와 점에서 게이지 숫자 7개(카메라 0과 카메라 1의 $t_x$)를 뺀 것'
- 역방향 자동 미분으로 구한 야코비안, 행마다 벡터화된 역전파 한 번
- 가우스–뉴턴 행렬 $H = J^{\mathsf T}J$와 기울기 $J^{\mathsf T}\mathbf r$, $m$에 대해 합
- 카메라 | 점 블록; 잔차 하나는 카메라 하나와 점 하나에만 닿으므로 $V$는 블록 대각 행렬
- '슈어 보수(축소 카메라 계): $P$개의 작은 $3\times 3$ 역행렬, 그다음 작은 풀이 한 번'
- '역대입: 각 점은 독립적으로 갱신'
- '레벤버그–마쿼트 감쇠: 성공한 단계 뒤에는 3으로 나누고, 실패한 단계 뒤에는 4를 곱함'
labels:
  n_cameras: 카메라 수 $C$
  n_points: 점 수 $P$
  noise: 픽셀 잡음 $\sigma$
  init_rot: 시작 회전 오차
  init_noise: 시작 평행 이동 및 점 오차
  iterations: LM 반복 횟수
  solver: 정규 방정식 풀이기
