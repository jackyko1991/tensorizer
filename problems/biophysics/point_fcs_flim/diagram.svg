<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Confocal FCS with lifetime detection: a pulsed laser is reflected by a dichroic mirror into the objective, which focuses it to an elongated ellipsoidal volume of waists w0 and z0 where fluorescent molecules diffuse; their emission passes the dichroic and a pinhole to a single-photon detector with TCSPC timing">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- pulsed laser, beam down to the dichroic and left into the objective -->
    <rect x="118" y="8" width="24" height="16" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="148" y="21" font-size="11" fill="#b45309">pulsed laser</text>
    <rect x="125" y="24" width="10" height="56" fill="#f59e0b" opacity="0.35"/>
    <polygon points="70,66 130,72 130,88 70,94" fill="#f59e0b" opacity="0.25"/>
    <!-- emission back through the dichroic, focused onto the pinhole, on to the detector -->
    <polygon points="130,70 180,79 180,81 130,90" fill="#93c5fd" opacity="0.8"/>
    <polygon points="180,79 200,72 200,88 180,81" fill="#93c5fd" opacity="0.8"/>
    <!-- dichroic mirror -->
    <line x1="118" y1="94" x2="142" y2="66" stroke="#374151" stroke-width="2"/>
    <!-- objective lens and focused cone -->
    <polygon points="70,66 34,80 70,94" fill="#f59e0b" opacity="0.2"/>
    <ellipse cx="70" cy="80" rx="5" ry="18" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <!-- focal ellipsoid with diffusing molecules -->
    <ellipse cx="34" cy="80" rx="20" ry="6" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M8,104 l6,-5 l-2,-6 l7,-3 l5,-8" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="24" cy="82" r="3.5" fill="#2563eb" stroke="#1e40af"/>
    <circle cx="52" cy="62" r="3.5" fill="#dc2626" stroke="#991b1b"/>
    <circle cx="10" cy="64" r="3.5" fill="#2563eb" stroke="#1e40af"/>
    <circle cx="48" cy="104" r="3.5" fill="#dc2626" stroke="#991b1b"/>
    <!-- waists: z0 along the beam, w0 across it -->
    <line x1="14" y1="96" x2="54" y2="96" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="28" y="114" font-style="italic">z<tspan font-size="10" dy="3" font-style="normal">0</tspan></text>
    <line x1="34" y1="74" x2="34" y2="56" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="28" y="50" font-style="italic">w<tspan font-size="10" dy="3" font-style="normal">0</tspan></text>
    <!-- pinhole -->
    <line x1="180" y1="60" x2="180" y2="77" stroke="#374151" stroke-width="3"/>
    <line x1="180" y1="83" x2="180" y2="100" stroke="#374151" stroke-width="3"/>
    <text x="180" y="54" font-size="11" fill="#374151" text-anchor="middle">pinhole</text>
    <!-- single-photon detector with TCSPC timing -->
    <rect x="200" y="68" width="32" height="24" rx="2" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="216" y="84" font-size="10" fill="#ffffff" text-anchor="middle">SPAD</text>
    <line x1="190" y1="148" x2="234" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="192" y1="150" x2="192" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M194,146 L197,114 C202,130 212,142 230,145" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="152" y="134" font-size="11" fill="#374151">TCSPC</text>
  </g>
</svg>
