source_hash: 52a00886e77c
title: 'बर्च और स्विनर्टन-डायर: मॉड p बिंदुओं की गिनती'
summary: रैंक 0 से 4 तक के पाँच दीर्घवृत्तीय वक्रों के $\mathbb F_p$ पर बिंदु $X$ तक की हर अभाज्य संख्या के लिए एक साथ गिनिए, देखिए कि गुणनफल $\prod_{p\le X} N_p/p$ किस तरह $(\log X)^r$ की तरह बढ़ते हैं, जैसा बर्च और स्विनर्टन-डायर ने सबसे पहले देखा था, और $s = 1$ पर $L(E, s)$ की गणना कीजिए, जहाँ यह रैंक के बराबर कोटि से शून्य होता है। यह अनुमान कि ऐसा हमेशा होता है, अभी भी अनसुलझा है; यह केवल विश्लेषणात्मक रैंक 0 और 1 के लिए सिद्ध है।
notes: '$\mathbb Q$ पर एक दीर्घवृत्तीय वक्र $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ के परिमेय बिंदुओं का समूह परिमित रूप से जनित होता है, $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ (मॉर्डेल 1922); रैंक $r$ की गणना कठिन है। 1960 के दशक की शुरुआत में बर्च और स्विनर्टन-डायर ने EDSAC कंप्यूटर पर अभाज्य संख्याओं के मॉड्यूलो बिंदु गिने और देखा कि $\prod_{p \le X} N_p/p$ लगभग $(\log X)^r$ की तरह बढ़ता है: अधिक परिमेय बिंदु होने पर मॉड $p$ बिंदु भी अधिक होते हैं। उन्होंने अनुमान लगाया कि $a_p$ से बना $L(E, s)$, $s = 1$ पर ठीक $r$ कोटि से शून्य होता है, और उसका अग्रणी गुणांक $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$ है। यह क्ले मिलेनियम पुरस्कार की समस्याओं में से एक है और अनसुलझी है। सिद्ध: यदि विश्लेषणात्मक रैंक 0 या 1 है, तो रैंक उसके बराबर है और Ш परिमित है (ग्रॉस और ज़ागियर 1986, कोलिवागिन 1989); इसमें मॉड्यूलरता (वाइल्स, टेलर–वाइल्स 1995, ब्रुई–कॉनरैड–डायमंड–टेलर 2001) का उपयोग होता है, और इसी के कारण $L(E, s)$ का $s = 1$ तक विस्तार संभव ही होता
  है। विश्लेषणात्मक रैंक $\ge 2$ के लिए कोई सामान्य परिणाम ज्ञात नहीं है। ये पाँच वक्र रैंक 0 से 4 तक के सबसे छोटे कंडक्टर वाले वक्र हैं (क्रेमोना की तालिकाओं में 11a1, 37a1, 389a1, 5077a1 और 234446a1)। यहाँ: ट्रेस हासे की सीमा $|a_p| \le 2\sqrt p$ का पालन करते हैं; 11a1 के लिए वे मॉड्यूलर रूप $\eta(q)^2\eta(q^{11})^2$ के गुणांकों के बराबर हैं (परीक्षित); मूल संख्याएँ $\varepsilon = (-1)^r$ हैं; हर वक्र के लिए $s = 1$ पर पहला अशून्य अवकलज $r$-वाँ है, और $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$ तथा $L''''''(E,1)/6 = 1.7318499\ldots$ LMFDB से मेल खाते हैं। 11a1 के लिए पूरा सूत्र सही निकलता है: $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$। किसी अवकलज का संख्यात्मक रूप से शून्य होना साक्ष्य है, इस बात का प्रमाण नहीं कि वह सचमुच शून्य है। आंशिक गुणनफल मूल अनुमानी तर्क हैं: गोल्डफेल्ड (1982) ने दिखाया कि यदि वे सचमुच $C(\log X)^r$ की तरह व्यवहार करते हैं तो $r$ विश्लेषणात्मक रैंक है और $L(E, s)$ के लिए रीमान परिकल्पना
  सत्य है, इसलिए उनका अभिसरण स्वयं एक अनुमान है और धीमा है। ढलान $X = 2\times 10^4$ तक रैंक 0 से 3 को सही क्रम में रख देते हैं, लेकिन रैंक-4 वक्र $X = 3\times 10^4$ पर भी अपनी रैंक से पीछे रहता है। $a_p/2\sqrt p$ का सातो–टेट वितरण, यानी अर्धवृत्त $\frac{2}{\pi}\sqrt{1-x^2}$, सम्मिश्र गुणन रहित वक्रों के लिए एक प्रमेय है (टेलर और सहयोगी, 2008–2011)।'
meanings:
- हर वक्र, ब्लॉक की हर अभाज्य संख्या और हर $x \in \mathbb F_p$ एक साथ (हॉर्नर विधि, हर चरण पर मॉड $p$ घटाया गया)
- वर्गों $y^2 \bmod p$ की तालिका से लेजांड्र प्रतीक; $v = 0$ के लिए $\chi = 0$
- 'फ्रोबेनियस ट्रेस; हासे: $|a_p| \le 2\sqrt p$'
- हर $X$ के लिए आंशिक गुणनफल एक साथ (केवल अच्छी अभाज्य संख्याएँ)
- $\sqrt{X} \le p \le X$ पर ढलान; बहुत धीरे अभिसरित होता है
- गुणनात्मकता से डिरिक्ले गुणांक, हर अभाज्य घात $q = p^k$ के लिए एक स्ट्राइड वाला स्लाइस
- 'दोहराया गया $n$ ⇒ योग: गाउस–लेजांड्र नोड्स $t = e^{u_m}$ पर $F(t)$'
- $s = 1$ पर सभी अवकलज एक साथ; पहला अशून्य अवकलज विश्लेषणात्मक रैंक देता है
labels:
  x_max: $X$ तक की अभाज्य संख्याएँ
