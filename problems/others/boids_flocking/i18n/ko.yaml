source_hash: ee1c00fce805
title: '무리 짓기: 비첵 모형과 보이드'
summary: 찌르레기, 물고기 떼, 메뚜기는 지도자 없이 함께 움직입니다. 비첵 모형에서 각 새는 일정한 속력으로 날며 이웃들의 평균 방향을 따라 하고, 여기에 크기가 최대 $\eta$인 무작위 각도가 더해집니다. 레이놀즈의 보이드에서는 분리, 정렬, 응집 규칙에 따라 방향을 바꿉니다. 주기적 상자 안의 새 사이 거리 $N^2$개 전체가 하나의 텐서를 이루고, 여러 잡음 수준을 한 배치로 동시에 실행하여 극성 질서 $\varphi$의 질서–무질서 전이를 보여 줍니다.
notes: 비첵 등(1995)은 집단 운동의 가장 단순한 물리, 즉 정렬과 잡음으로 이 모형을 제안했습니다. 잡음이 작으면 새들은 한 방향에 합의하고($\varphi \to 1$), $\eta = 2\pi$에서는 방향이 무작위여서 $\varphi$는 크기 $1/\sqrt N$ 정도의 유한 크기 잡음일 뿐입니다. 2차원에서 이것은 놀라운 일인데, 머민–바그너 정리가 연속 대칭을 가진 평형계에서 장거리 질서를 금지하기 때문입니다. 움직이는 새들은 이웃이 계속 바뀌기 때문에 이 제약을 벗어납니다(토너와 투, 1995). 큰 계에서는 전이가 불연속적이며 이동하는 띠가 나타나는 것으로 밝혀졌습니다(그레구아르와 샤테, 2004). 이처럼 작은 $N$에서는 매끄럽게 보입니다. 레이놀즈(1987)는 컴퓨터 애니메이션을 위해 보이드를 만들었습니다. 여기서는 그의 세 규칙을 $i \leftrightarrow j$에 대해 반대칭인 쌍 힘으로 썼기 때문에, 속력 정규화가 없으면 무리의 전체 운동량이 정확히 보존됩니다(테스트로 확인). 그다음 일정한 속력 $v_0$으로 정규화하면 무리가 방향을 고를 수 있게 됩니다. 응집이 강하면 무리가 회전하는 공 모양으로 뭉쳐 버리므로 약하게 유지합니다. 질서를 더 쉽게 만들려면 상자를 작게(밀도를 높게) 하거나 반경을 크게 해 보세요.
meanings:
- 상자 $[0, L)^2$ 안 $N$마리 새의 위치, 잡음 수준 $b$마다 무리 하나
- 새 $i$에서 새 $j$의 가장 가까운 주기적 복제본까지의 변위; $i \leftrightarrow j$에 대해 반대칭
- 이웃 행렬, 반복되는 $k$ ⇒ 합산; 새 $i$는 자기 자신도 셈
- '반복되는 $j$ ⇒ 합산: 이웃들의 평균 방향'
- 잡음 각도, $[-\eta/2, \eta/2]$에서 균등 분포; $\eta = 2\pi$이면 방향이 완전히 무작위
- '보이드: 분리 $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$, 정렬 $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$, 응집 $\sum_j A_{ij}\mathbf d_{ij}$'
- '극성 질서: 무리가 함께 움직이면 1, 방향이 무작위이면 약 $1/\sqrt N$'
labels:
  n_birds: 새의 수 $N$
  box: 상자 한 변 $L$ (이웃 반경 $R = 1$)
  speed: 속력 $v_0$
  eta: 표시된 무리의 잡음 $\eta$
  n_noise: 배치 내 잡음 수준의 수
  steps: 시간 단계 수
  seed: 난수 시드
