title: हॉजकिन–हक्सले क्रिया विभव
summary: 'स्क्विड के विशाल अक्षतंतु (giant axon) का 1952 का मॉडल: एक झिल्ली संधारित्र जिसे सोडियम और पोटैशियम चैनल अनावेशित करते हैं, जिनके द्वार (gates) $m$, $h$, $n$ वोल्टेज के साथ खुलते और बंद होते हैं। इकतालीस अक्षतंतु, प्रत्येक एक अलग धारा चरण से चालित, एक $(4, B)$ टेंसर में साथ-साथ समाकलित किए जाते हैं ताकि स्पाइक देहली और धारा के विरुद्ध फायरिंग दर ज्ञात हो सके।'
notes: 'हॉजकिन और हक्सले (नोबेल पुरस्कार 1963) ने वोल्टेज क्लैम्प से स्क्विड विशाल अक्षतंतु की सोडियम और पोटैशियम धाराएँ मापीं और उन्हें तीन द्वारों से फिट किया। सोडियम धारा $m^3$ के माध्यम से तेज़ी से चालू होती है और निष्क्रियण द्वार $h$ के माध्यम से धीरे-धीरे बंद होती है; पोटैशियम धारा $n^4$ के माध्यम से देर से खुलती है। स्पाइक उनके बीच की दौड़ है: एक छोटा विध्रुवण $m$ को खोलता है, अंदर आता $\mathrm{Na}^+$ और विध्रुवित करता है (धनात्मक पुनर्भरण) और $V$ तेज़ी से $E_{Na}$ की ओर बढ़ता है; फिर $h$ बंद होता है और $n$ खुलता है, और $V$ वापस गिरता है और विश्राम स्तर से नीचे भी चला जाता है। स्थिर धारा चरण के साथ मॉडल तीन व्यवस्थाएँ दिखाता है। लगभग 2.3 µA/cm² से नीचे झिल्ली केवल निष्क्रिय रूप से आवेशित होती है। उसके और लगभग 6.3 µA/cm² के बीच यह एक ही स्पाइक देती है और फिर स्थिर हो जाती है, क्योंकि निष्क्रियण और पोटैशियम धारा इसे एक नए विश्राम पर रोक लेते हैं। उससे ऊपर यह बार-बार फायर करती है, और दर शून्य से शुरू नहीं होती बल्कि लगभग 50 Hz पर उछलती है: स्क्विड अक्षतंतु एक टाइप II (अनुनादक) न्यूरॉन
  है जिसकी विश्राम अवस्था हॉप्फ़ द्विभाजन (Hopf bifurcation) में स्थिरता खो देती है, टाइप I न्यूरॉनों के विपरीत जो मनमाने ढंग से धीमी गति से फायर कर सकते हैं। फिर f–I वक्र धीरे-धीरे बढ़ता है, 10 µA/cm² पर लगभग 68 Hz तक। दर फलनों में हटाने योग्य विचित्रताएँ (removable singularities) हैं, $0.1(V+40)/(1 - e^{-(V+40)/10})$ $V = -40$ mV पर परिमित है, इसलिए कोड उन्हें सुरक्षित सीमा के साथ $x/(1 - e^{-x})$ के माध्यम से गणना करता है। मूल प्रयोग 6.3 °C पर किए गए थे; अक्षतंतु को गर्म करने से हर द्वार $\phi = 3^{(T - 6.3)/10}$ गुना तेज़ हो जाता है, जिससे स्पाइक संकरे और फायरिंग तेज़ हो जाती है, जब तक कि लगभग 30 °C से ऊपर अक्षतंतु बिल्कुल फायर करना बंद नहीं कर देता। सरलीकरण: अंतरिक्ष-क्लैम्प किया गया झिल्ली खंड (अक्षतंतु के साथ कोई प्रसार नहीं) और नियतात्मक चैनल।'
meanings:
- अक्षतंतु $b$ की उद्दीपन धारा, 10 ms पर चालू होने वाला चरण (µA/cm²)
