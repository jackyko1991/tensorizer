source_hash: 890ee320b06e
title: पल्सर टाइमिंग ऐरे और हेलिंग्स–डाउन्स वक्र
summary: नैनोहर्ट्ज़ गुरुत्वीय तरंगों का एक सागर पृथ्वी और कई मिलीसेकंड पल्सरों के बीच के पथों को हल्का-सा खींचता है। एक हज़ार यादृच्छिक समतल तरंगों से बना एक समदैशिक पृष्ठभूमि हर पल्सर की टिक-टिक को ऐंटेना पैटर्न $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$ के माध्यम से खिसकाती है, जो ध्रुवण टेंसरों पर एक einsum है। टाइमिंग अवशेषों के हर युग्म का सहसंबंध निकालकर और कोण के अनुसार बिन बनाकर हेलिंग्स–डाउन्स वक्र मिलता है, वह चतुर्ध्रुवी छाप जिसके प्रमाण पल्सर टाइमिंग ऐरे ने 2023 में बताए।
notes: 'गुरुत्वीय तरंग पल्सर और पृथ्वी के बीच प्रकाश के यात्रा-समय को बदल देती है, इसलिए वर्षों में स्पंदों के आगमन-समय दसियों से सैकड़ों नैनोसेकंड तक खिसकते हैं। एक तरंग के लिए प्रभाव ज्यामिति पर $F^{+}$ और $F^{\times}$ के माध्यम से निर्भर करता है; समदैशिक पृष्ठभूमि के लिए दिशाओं पर औसत लेने पर ऐसा सहसंबंध बचता है जो केवल दो पल्सरों के बीच के कोण पर निर्भर है। Hellings and Downs (ApJL 265, L39, 1983) ने इसकी गणना की: आकाश में पास-पास के पल्सर $\tfrac12$ से सहसंबद्ध हैं (हर पल्सर की शक्ति का दूसरा आधा उसका अपना असहसंबद्ध पल्सर पद है), लगभग $82.5^\circ$ दूर के युग्म थोड़े प्रति-सहसंबद्ध हैं, और विपरीत पल्सर फिर से $\tfrac14$ से धनात्मक रूप से सहसंबद्ध हैं। चतुर्ध्रुवी आकार अनुप्रस्थ, स्पिन-2 तरंग का चिह्न है: घड़ी की त्रुटि एकध्रुव ($\Gamma = 1$) देती और सौर-मंडल पंचांग (ephemeris) की त्रुटि द्विध्रुव ($\Gamma = \cos\zeta$); तुलना के लिए दोनों फ़िट किए जाते हैं। पृष्ठ सामान्यीकरण को दो तरह जाँचता है: सूत्र की तुलना मोंटे कार्लो आकाश समाकल $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$
  से, और ऐंटेना-पैटर्न औसत $\langle\sum_A (F^A)^2\rangle = 1/3$। एक आकाश वक्र के चारों ओर स्पष्ट रूप से बिखरता है: केवल कुछ प्रभावी आवृत्तियों के साथ यह "कॉस्मिक प्रसरण" (cosmic variance) वास्तविक है और वास्तविक ऐरे को भी प्रभावित करता है; कई अनुकारित आकाशों का औसत अभिसरण दिखाता है। फ़िट किया गया आयाम श्वेत रव (white noise) के कारण 1 से नीचे तनु हो जाता है। शोध संदर्भ: जून 2023 में NANOGrav सहयोग (15-वर्षीय डेटा सेट, Agazie et al., ApJL 951, L8, 2023) ने हेलिंग्स–डाउन्स सहसंबंधों वाली नैनोहर्ट्ज़ गुरुत्वीय-तरंग पृष्ठभूमि के प्रमाण बताए (सहसंबंधों के लिए लगभग 3σ, अनुमानित), साथ ही यूरोपीय और भारतीय PTA (EPTA + InPTA, A&A 2023), Parkes PTA (Reardon et al., ApJL 951, L6, 2023) और चीनी PTA ने भी। संभावित स्रोत अतिविशाल श्याम-विवर युग्मों की एक आबादी है, जो यहाँ प्रयुक्त $h_c \propto f^{-2/3}$ स्पेक्ट्रम देती है। सरलीकरण: अवशेषों को हर पल्सर के घूर्णन-मंदन (spin-down) के लिए फ़िट नहीं किया गया (केवल माध्य हटाया गया), केवल श्वेत रव, पल्सर-विशिष्ट लाल रव नहीं, और इष्टतम सांख्यिकी या पूर्ण बेज़ियन
  विश्लेषण के बजाय एक सरल सामान्यीकृत अन्योन्य-सहसंबंध।'
meanings:
- पल्सर $a$ की ओर इकाई सदिश, आकाश पर एकसमान
- तरंग $m$ की संचरण दिशा और ध्रुवण कोण
- अनुप्रस्थ ढाँचे $m, n \perp \hat\Omega$ से बने $+$ और $\times$ टेंसर
- '$i$ और $j$ पर योग: पृथ्वी–पल्सर रेखा का खिंचाव'
- ऐंटेना पैटर्न; $\sum_A (F^A)^2$ का आकाश-औसत ठीक $1/3$ है
- पल्सर पद का कला-विलंब, $\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- '$m$ और $A$ पर योग: युग $t$ पर पल्सर $a$ का टाइमिंग अवशेष'
- '$t$ पर योग: हर युग्म का सहसंबंध, माध्य स्व-शक्ति से सामान्यीकृत'
- अपेक्षित सहसंबंध, $\Gamma(0^+) = \tfrac12$, न्यूनतम $\approx -0.152$ जब $\zeta \approx 82.5^\circ$
