title: शोर और लैंजेविन समीकरण
summary: हार्मोनिक ट्रैप में एक ब्राउनियन कण को आसपास के अणु बेतरतीब ढंग से धक्के देते हैं। लैंजेविन समीकरण न्यूटन के नियम में यह शोर पद, $\sqrt{2\gamma k_BT}\,dW$, जोड़ता है; Euler–Maruyama विधि कणों के पूरे समूह (ensemble) को एक ही बैच टेंसर में एक साथ आगे बढ़ाती है, और स्थितियों का फैलाव बोल्ट्ज़मान वितरण $N(0, k_BT/k)$ पर आ टिकता है (समविभाजन)।
notes: 'केवल घर्षण होने पर न्यूटन का नियम कण को ट्रैप की तली में रोक देता (मोटा लाल वक्र)। लेकिन तरल में असली कण कभी नहीं रुकते: अणु उन्हें हर ओर से टकराते हैं, और यही यादृच्छिक बल लैंजेविन समीकरण का शोर पद, या त्रुटि पद, है। इसका आकार मनमाना नहीं है। उतार-चढ़ाव–क्षय (fluctuation–dissipation) प्रमेय इसे $\sqrt{2\gamma k_BT}$ पर तय करता है: वही टक्करें जो घर्षण $\gamma$ पैदा करती हैं, कण को धक्का भी देती हैं, और समूह तापमान $T$ पर संतुलन में आता है: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$ (समविभाजन), और स्थितियाँ $N(0, k_BT/k)$ के अनुसार वितरित होती हैं। वीनर वृद्धि $dW$ का प्रसरण $dt$ है; एक सीमित चरण में यह $\sqrt{\Delta t}\,\xi$ बन जाती है, जहाँ $\xi \sim N(0,1)$, और प्रति चरण वेग के धक्के का प्रसरण $2\gamma k_BT\Delta t/m^2$ है। यदि शोर को $\Delta t$ के अनुपात में रखा जाता, तो चरण छोटा करने पर वह गायब हो जाता: यादृच्छिक धक्के एक यादृच्छिक चाल (random walk) की तरह जुड़ते हैं, इसलिए उनका फैलाव $\sqrt{t}$ की तरह बढ़ता है। समीकरण रैखिक है, इसलिए समूह
  माध्य $\langle x\rangle$ ठीक-ठीक शोर-रहित अवमंदित दोलक का अनुसरण करता है (लाल पर काली डैश रेखा), जबकि हर अलग प्रक्षेपवक्र भटकता है। आज़माएँ: $T = 0$ (शुद्ध अवमंदित दोलक), बड़ा $\gamma$ और छोटा $m$ (अति-अवमंदित ब्राउनियन गति: $\langle x^2\rangle$ बिना दोलन के दर $2k/\gamma$ से शिथिल होता है), या छोटा $\gamma$ (संतुलन की ओर धीमी पहुँच)। सरलीकरण: $k_B = 1$ वाली घटी हुई इकाइयाँ, एक आयाम, श्वेत (असहसंबद्ध) शोर, और एक प्रथम-कोटि योजना जिसके संतुलन प्रसरणों में $O(\Delta t)$ का पूर्वाग्रह रहता है।'
meanings:
- 'चरण $n$ पर कण $b$ की स्थिति और वेग: पूरा समूह एक बैच है'
- 'शोर टेंसर, प्रति चरण एक पंक्ति: स्वतंत्र मानक सामान्य संख्याएँ (स्थिर seed)'
- प्रति चरण यादृच्छिक धक्के का आकार; यह $\sqrt{\Delta t}$ के अनुपात में बदलता है, $\Delta t$ के नहीं
- 'निर्धारणात्मक त्वरण: घर्षण और स्प्रिंग'
- Euler–Maruyama चरण; स्थिति नए वेग का उपयोग करती है (सिम्प्लेक्टिक Euler)
- 'समूह माध्य: दोहराया गया $b$ ⇒ कणों पर योग'
- 'संतुलन पर $\langle x^2\rangle$ और $\langle v^2\rangle$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$'
labels:
  temperature: तापमान $k_BT$
  gamma: घर्षण $\gamma$
  k: कठोरता $k$
  m: द्रव्यमान $m$
  n_particles: कणों की संख्या $B$
  t_max: अवधि $t_{max}$
