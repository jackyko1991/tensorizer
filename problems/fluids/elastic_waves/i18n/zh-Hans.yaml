source_hash: 36e54b56debf
title: 弹性 P 波与 S 波
summary: 弹性固体的纳维–柯西方程。在一点上的短暂推力发出两种波：快速的压缩 P 波（体现在 $\nabla\cdot\mathbf u$ 中）和较慢的剪切 S 波（体现在 $\nabla\times\mathbf u$ 中）。两项都是同一张二阶导数表 $\partial_i\partial_j u_k$ 的缩并——两次 einsum，重复指标不同。
notes: 取 $\rho = 1$、网格尺寸为 1 的单位。时间推进采用蛙跳格式 $u^{n+1} = 2u^n - u^{n-1} + \Delta t^2\,\ddot u^n$。对方程取散度得到 $\theta = \partial_j u_j$ 的波动方程，波速为 $c_P$；取旋度得到转动的波动方程，波速 $c_S < c_P$——在岩石中 $c_P \approx 1.7\,c_S$，这就是地震的 P 波先到、S 波几秒后才到的原因。点力辐射的 P 波主要沿力的方向，S 波主要垂直于力，如两种瓣状图样所示。虚线圆是预言的波前 $c\,(t - t_0)$，$t_0$ 为源子波的峰值时刻。阻尼边界在波到达边缘之前将其吸收（实际程序使用完美匹配层）；泊松比接近 ½（$\lambda \gg \mu$）会使 $c_P$ 很大，迫使时间步长很小。
meanings:
- 位移场，每个节点上的分量 $i \in \{x, y\}$
- 用中心差分求所有二阶导数
- 重复的 $j$（第 2 和第 3 位）⇒ 散度的梯度
- 重复的 $j$（第 1 和第 2 位）⇒ 每个分量的拉普拉斯
- 在中心沿某一方向施加的短暂墨西哥帽形推力
- 体积变化（P）和转动（S）
- 蛙跳步；库朗数 $S > 1$ 会被拒绝，因为格式会发散
labels:
  lam: 拉梅常数 $\lambda$
  mu: 剪切模量 $\mu$
  direction: 力的方向
  courant: 库朗数 $S$
  t_max: 模拟时长
