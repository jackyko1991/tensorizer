source_hash: cd1d0cc0a127
title: 光線方程式による逃げ水
summary: 熱い路面の上では空気が薄く、屈折率 $n(y)$ は地面近くで小さくなる。幾何光学の光線方程式は光を $n$ の大きい方へ曲げる。視線方向の扇について RK4 で積分すると、路面に向かった光線が上へ曲がり戻るので、目には遠くの物体の倒立した第2の像が見える。
notes: 光線は目から逆向きに追跡する（光路は可逆）：各光線は「この方向を見たとき目には何が見えるか」に答える。わずかに下向きの光線は低屈折率層で上へ曲がり、物体に下から当たる。そのため視線が低いほど物体の高い部分が見える——像は倒立する。より急な光線は路面（灰色）に達する。縦方向の縮尺は約100倍に誇張している：実際の屈折率差は $\sim 10^{-5}$ で、角度はミリラジアンである。$n\cos\theta$ は小数第7位でしか変化しないので、計算には float64 を用いる。
meanings:
- 光線 $r$ の位置 $(x, y)$
- 光学的方向ベクトル：単位接ベクトル × $n$
- 屈折率、熱い路面 $y = 0$ で最小
- $y$ 成分のみ非零：$(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$
- 1階の連立方程式としての光線方程式、RK4 で時間発展
- 繰り返される $j$ ⇒ 和をとる：$\lvert\mathbf p\rvert$ は $n$ に等しく保たれるべき（精度の確認）
- 水平な層に対するスネルの法則：各光線に沿って保存
labels:
  delta_n: 路面での屈折率低下 $\Delta n$
  scale_height: 高温層の厚さ $h$
  eye_height: 目の高さ
  distance: 物体までの距離
  max_dip: 最も急な下向き視線
  n_rays: 扇の光線数
