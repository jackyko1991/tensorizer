title: 为什么思维链能帮助 Transformer
summary: '$n$ 个比特的奇偶性是累积 XOR，本质上是串行任务。相同的微型 Transformer（手写 einsum 注意力，所有模型堆叠在同一个模型轴上并在一次运行中训练）以两种格式学习它：直接作答 "$b_1 \dots b_n = p$"，或先写出累积奇偶性 "$b_1 \dots b_n : s_1 \dots s_n = p$"。在相同权重和步数下，草稿纸模型在 $n = 4$ 到 $10$ 时答对 98–100% 的测试比特串，而直接模型只能拟合 $n = 4$，之后处于或低于随机水平；注意力显示出双 token 规则 $s_k = s_{k-1} \oplus b_k$。这是该机制的玩具模型，并不代表大语言模型如何推理。'
notes: '现状：所示效应已经确立。对于必须立即作答的固定深度 Transformer，奇偶性是教科书式的难题。Li, Liu, Zhou 和 Ma（ICLR 2024, arXiv 2402.12875）证明，没有中间步骤的常数深度 Transformer 仅限于浅层并行电路（在他们的精度假设下类似 $\mathrm{TC}^0$），而 $T$ 步思维链使其能够模拟规模为 $T$ 的串行电路。Nye 等人（2021, arXiv 2112.00114）训练 Transformer 写出中间结果的“草稿纸”（scratchpad），并看到它们解决了长加法和程序追踪等多步任务；Wei 等人（2022, arXiv 2201.11903）为大语言模型的思维链提示（chain-of-thought prompting）命名。 方法：一个 $n$ 比特的串要么直接写成 "$b_1 \dots b_n = p$"，要么连同其累积奇偶性写成 "$b_1 \dots b_n : s_1 \dots s_n = p$"。每个模型都是同一个 2 层、$d = 64$、4 头的解码器（即 `tiny_transformer` 的代码，在每个 einsum 中加入模型轴 $m$），用 AdamW 以相同步数、相同的比特串批次训练；CoT 模型每个串读入约两倍的 token，并在其中间 token 上接受训练，这正是草稿纸带来的额外帮助。所有模型（$n$ × 格式 × 种子）以及长度泛化模型都在一次运行中训练：它们的权重堆叠在首轴上，梯度裁剪按模型分别进行，因此彼此从不相互影响（有测试对此进行检查）。 数据：当 $n \ge 8$ 时，$2^n$ 个串中有四分之一（最多 1024 个）被留出，从不参与训练；当 $n = 4$ 和 $6$ 时，串太少，无法留出，因此这些准确率（图中以星号标记）衡量的是拟合而非泛化。测试时，CoT 模型逐个 token 贪心地写出自己的草稿纸，只对其最终答案评分。 结论：在默认运行中（2 个种子，数字打印在终端），(a) CoT 模型在 $n = 4, 6, 8, 10$ 时答对 0.98 到 1.00 的测试串；直接模型能拟合 $n = 4$ 的 16 个串（1.00），但在 $n = 6, 8, 10$ 时仅得 0.53、0.27 和 0.53。对于 $n
  = 8$ 时低于随机水平的得分，一个合理的解释（此处未检验）是，留出的串与其训练近邻只差一个比特，因此奇偶性相反，而在近邻之间插值的模型就会答错。(b) 两种格式的长度泛化都失败：在 $1 \le n \le 8$ 上训练的模型在 $n = 12$ 和 $16$ 时得分为 0.46 到 0.51，因为超过 19 的位置从未训练过，而且在这里使用的 CoT 布局中，比特 $b_k$ 位于需要它的单元之前 $n + 1$ 个位置，这一偏移随 $n$ 变化；混合长度训练的 CoT 模型在步数预算内掌握了 $n = 4$（1.00），却连 $n = 8$ 都未掌握（0.56）。(c) 在 $k$ 步后清空草稿纸，对任意 $k < n$ 答案都会降到随机水平：答案是从最后一个单元复制的，所以全部计算都存在于写出的 token 中。(d) 在 $n = 8$ 的 CoT 模型中，每一步 $k$ 都有某个头把写出 $s_k$ 的查询的 0.5 到 0.8 的注意力放在 $b_k$ 上，而均匀注意力仅为 0.08（单个头在各步上的平均值为 0.48；各头分担不同的步）。规则的另一个输入 $s_{k-1}$ 就是查询 token 本身，它通过残差流到达输出，因此学到的规则是局部的，每步两个 token。 局限：这是展示机制的玩具模型，并不代表大语言模型如何推理。它无法说明大模型写出的步骤是否忠实于实际产生其答案的计算；这是一个悬而未决的研究问题。结果随种子和步数预算而变化，因此每个种子都会绘出。可以尝试更多步数、把 $n$ 提高到 16，或只用一层。'
meanings:
- 每个前缀的累积奇偶性：草稿纸的目标，且 $p = s_n$
- 直接格式或 CoT 格式的比特串，以 token id $0, 1, :, =, \_$ 表示；用空白填充，使同一 $n$ 的所有模型共享一个张量
- token 嵌入加上可学习的位置嵌入，每个模型 $m$ 有自己的表
- 重复的 $c$ ⇒ 求和；模型下标 $m$ 不求和，因此 $M$ 个独立的 Transformer 在一次乘积中运行
- 因果注意力：每一行都是位置 $j \le i$ 上的概率分布
- 训练哪些下一个 token：仅 $p$（直接），或 $s_1 \dots s_n$、“=” 和 $p$（CoT）
- $-\log p$ 在模型 $m$ 所训练 token 上的平均值（nat）；最小化它们的总和，且每一项只作用于自身的权重
- 测试时，模型自己写出草稿纸，每次前向传播一个 token，写完后作答
labels:
  steps: 训练步数
  lengths: 实验 (a) 的比特串长度 $n$
  seeds: 每个模型的种子数
  d_model: 模型宽度 $d$
  heads: 注意力头数 $H$
  layers: Transformer 块数
  batch: 每步的比特串数
  lr: 学习率
