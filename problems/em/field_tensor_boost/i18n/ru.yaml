source_hash: c4a4275e3bd7
title: Лоренцев буст тензора поля
summary: В теории относительности $\mathbf E$ и $\mathbf B$ — не отдельные векторы, а шесть компонент одного антисимметричного тензора $4\times 4$ $F^{\mu\nu}$. Лоренцев буст преобразует его одной матрицей $\Lambda$ на каждый индекс, $F' = \Lambda F\Lambda^{\mathsf T}$, что записывается одним einsum. Изменение скорости буста показывает, как электрическое и магнитное поля перетекают друг в друга, тогда как $F_{\mu\nu}F^{\mu\nu}$ и $\mathbf E\cdot\mathbf B$ остаются неизменными.
notes: Единицы с $c = 1$, сигнатура метрики $(+, -, -, -)$. Буст направлен вдоль $x$, поэтому $E_x$ и $B_x$ не меняются; смешиваются только поперечные компоненты. Для чисто электрического поля ($\mathbf B = 0$) движущийся наблюдатель видит магнитное поле $\mathbf B' = -\gamma\,\boldsymbol\beta\times\mathbf E$. Оба лоренцевых инварианта остаются постоянными на всём диапазоне.
meanings:
- антисимметричный тензор поля, $\mu, \nu \in \{t, x, y, z\}$
- метрика Минковского $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$
- буст вдоль $x$ для каждой из $S$ скоростей $\beta$
- 'повторяющиеся $\alpha$ и $\beta$ ⇒ суммирование: по одной $\Lambda$ на каждый индекс $F$'
- индексы опущены метрикой
- инвариант $2(B^2 - E^2)$
- инвариант $-4\,\mathbf E\cdot\mathbf B$ через дуальный тензор $\tfrac12\varepsilon^{\mu\nu\rho\sigma}F_{\rho\sigma}$
labels:
  Ex: $E_x$
  Ey: $E_y$
  Ez: $E_z$
  Bx: $B_x$
  By: $B_y$
  Bz: $B_z$
  beta_max: Конечная скорость буста $\beta = v/c$
