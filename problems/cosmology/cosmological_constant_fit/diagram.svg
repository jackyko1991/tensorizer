<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A Type Ia supernova in a distant galaxy at redshift z; its light travels to an observer on Earth, arriving fainter than expected because the expansion is accelerated by the cosmological constant">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- observer -->
    <circle cx="28" cy="100" r="10" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <line x1="22" y1="88" x2="38" y2="74" stroke="#374151" stroke-width="3"/>
    <!-- distant galaxy with supernova -->
    <ellipse cx="200" cy="60" rx="26" ry="11" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5" transform="rotate(-20 200 60)"/>
    <circle cx="200" cy="60" r="4" fill="#2563eb"/>
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="212" y1="44" x2="222" y2="34"/><line x1="216" y1="50" x2="230" y2="48"/><line x1="208" y1="40" x2="208" y2="27"/>
    </g>
    <circle cx="212" cy="46" r="4" fill="#f59e0b"/>
    <!-- light path, stretched -->
    <path d="M190,70 q-8,6 -16,0 t-16,0 t-18,1 t-20,1 t-22,3 t-24,4 t-26,6 t-28,8" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- distance -->
    <line x1="30" y1="135" x2="200" y2="135" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="104" y="152" font-style="italic">d</text><text x="113" y="156" font-size="10" font-style="italic">L</text>
    <text x="214" y="88" font-style="italic">z</text>
    <!-- accelerated expansion -->
    <line x1="150" y1="22" x2="196" y2="22" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="140" y1="22" x2="94" y2="22" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="139" y="15" font-style="italic" fill="#b91c1c">Λ</text>
    <text x="14" y="128" font-size="12">Earth</text>
  </g>
</svg>
