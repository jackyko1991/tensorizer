source_hash: fdbefecc20a0
title: 圓柱繞流：阻力與渦旋脫落
summary: 以晶格波茲曼法（D2Q9）模擬圓柱繞流。分佈函數 $f_{xyi}$ 朝以 einsum 構成的平衡態碰撞，並以 torch.roll 遷移；圓柱所受的力來自每個從其表面反彈的分佈函數所交出的動量。當 Re ≈ 47 以上時，尾流變成卡門渦街：阻力脈動，升力左右擺盪。
notes: 晶格單位：節點間距與時間步長為 1，圓柱直徑 $D = 10$，入流 $U = 0.12$；黏滯係數 $\nu = UD/\mathrm{Re}$ 決定鬆弛時間 $\tau = 3\nu + \tfrac12$。當 $U$ 遠低於晶格聲速 $1/\sqrt3$ 時，此模型重現 Navier–Stokes 方程式。入口為固定平衡態，出口複製其鄰點，上下為週期性邊界（一排間距為 $H$ 的圓柱），圓柱使用全程反彈邊界，以階梯近似圓形。動量交換力計入每個撞上圓柱的分佈函數：它反向，因此交出 $2 f_i\mathbf e_i$。由於通道狹窄（$D/H \approx 0.18$），阻力高於 Re = 100 時自由流的 $C_D \approx 1.4$，脫落也稍快（$St \approx 0.16$–$0.2$）。前幾百步是聲學啟動暫態；請從後半段讀取平均值。開始時的微小側向擾動會使脫落更早發生。
meanings:
- 分佈函數：節點 $(x, y)$ 上以晶格速度 $i$ 運動的流體
- D2Q9 速度（靜止、4 個軸向、4 個對角）與權重
- 密度：對 $i$ 求和
- 重複的 $i$ ⇒ 求和：動量密度
- 速度在各晶格方向上的投影
- 遷移：把每個分佈函數移動一個連結
- 分佈函數從流體遷移進圓柱處為 1
- 動量交換：圓柱所受的力（反彈使每次撞擊反向）
labels:
  re: 雷諾數 $UD/\nu$
  steps: 晶格時間步數
