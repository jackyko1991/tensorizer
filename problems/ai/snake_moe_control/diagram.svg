<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Snake on a grid seen by a CNN; a router G sends each game to one of K expert networks, whose action logits are combined into left, straight or right">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- the board: 6 × 6 grid -->
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <line x1="22" y1="30" x2="22" y2="102"/><line x1="34" y1="30" x2="34" y2="102"/><line x1="46" y1="30" x2="46" y2="102"/>
      <line x1="58" y1="30" x2="58" y2="102"/><line x1="70" y1="30" x2="70" y2="102"/>
      <line x1="10" y1="42" x2="82" y2="42"/><line x1="10" y1="54" x2="82" y2="54"/><line x1="10" y1="66" x2="82" y2="66"/>
      <line x1="10" y1="78" x2="82" y2="78"/><line x1="10" y1="90" x2="82" y2="90"/>
    </g>
    <rect x="10" y="30" width="72" height="72" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- snake body and head -->
    <rect x="23" y="79" width="10" height="10" fill="#93c5fd" stroke="#1e40af"/>
    <rect x="35" y="79" width="10" height="10" fill="#93c5fd" stroke="#1e40af"/>
    <rect x="47" y="79" width="10" height="10" fill="#93c5fd" stroke="#1e40af"/>
    <rect x="47" y="67" width="10" height="10" fill="#2563eb" stroke="#1e40af"/>
    <!-- food -->
    <rect x="61" y="35" width="6" height="6" fill="#dc2626"/>
    <text x="14" y="120">board</text>
    <!-- CNN -->
    <line x1="84" y1="66" x2="98" y2="66" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M100,46 L118,54 L118,78 L100,86 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="96" y="104">CNN</text>
    <!-- router -->
    <line x1="120" y1="66" x2="132" y2="66" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="142" cy="66" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="137" y="71" font-style="italic" fill="#b45309">G</text>
    <!-- experts -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="151" y1="62" x2="166" y2="28"/><line x1="151" y1="70" x2="166" y2="104"/><line x1="151" y1="68" x2="166" y2="80"/>
    </g>
    <line x1="151" y1="64" x2="165" y2="54" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="166" y="20" width="26" height="16" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="166" y="46" width="26" height="16" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="166" y="72" width="26" height="16" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="166" y="98" width="26" height="16" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="168" y="132" font-style="italic">K</text>
    <text x="178" y="132">experts</text>
    <!-- combine to actions -->
    <line x1="193" y1="54" x2="208" y2="66" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="212" y="52" font-size="16">←</text>
    <text x="214" y="72" font-size="16">↑</text>
    <text x="212" y="92" font-size="16">→</text>
  </g>
</svg>
