source_hash: 909629a494c2
title: チャップマン機構とオゾン層
summary: 太陽光に駆動される O、O₂、O₃ の間の四つの反応がオゾン層を作る。$3\times4$ の化学量論行列を用いた反応ネットワーク $\dot c = S\,r(c)$ として書き、この硬い系を後退オイラー法とニュートン法で全高度について一度に積分する。日の出から数世紀後まで：O と O₃ は数秒で入れ替わり、奇数酸素が落ち着くには数日から数世紀かかり、定常状態は高度 30 km 付近でピークをとる。
notes: Sydney Chapman（1930）は四つの反応でオゾン層を説明した。242 nm より短い紫外線が $\mathrm{O_2}$ を分解し（1）、各 O 原子はすぐに第三体 $\mathrm M$ にエネルギーを運び去らせながら $\mathrm{O_2}$ と結合する（2）。オゾンは紫外線と可視光を吸収して再び分解し（3）、これが地表を守る仕組みだが、これは「奇数酸素」$\mathrm O_x = \mathrm O + \mathrm{O_3}$ を壊さない。それを壊すのは $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$（4）だけである。反応（2）と（3）は O と $\mathrm{O_3}$ をミリ秒から数分で循環させ、（1）と（4）は成層圏上部では数日、下部では数十年以上かけて総量を決める：時間スケールが $10^{14}$ も離れた硬い系であり、陽的な刻みでは数十億ステップが必要だが、後退オイラー法（どんな $\Delta t$ でも安定）は $\log t$ で等間隔の 300 ステップで済む。$S$ の各列は酸素原子を保存し、後退オイラー法はこのような線形不変量を厳密に保つ。二組の釣り合いから $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$ が得られる：下に行くほど空気（とともに $[\mathrm{O_2}]^{3/2}$）は指数関数的に濃くなる一方、$\mathrm{O_2}$ を分解する光は使い尽くされ、その積は斜め方向の $\mathrm{O_2}$ 光学的厚さが約 3 になるところでピークをとる。速度定数 $k_2$、$k_4$ は JPL 評価値（近似値）である。光分解速度は分子ごとに一つの有効バンドを用いた例示的なパラメータによるもので、太陽スペクトル全体にわたる積分の代用であり、太陽は常に照っているとしている。高度約 18 km より下では奇数酸素の寿命が最も長い計算時間さえ超えるので、それらの高度は決して落ち着かない。実際の大気では風がそこへオゾンを運ぶ。チャップマン化学だけではオゾンが多すぎる（ここではピークが $8\times10^{12}$ cm$^{-3}$ 付近、15
  km より上で約 380 DU であるのに対し、観測では 20–25 km 付近で約 $5\times10^{12}$ cm$^{-3}$、300 DU）。欠けている消失過程は触媒サイクル $\mathrm X + \mathrm{O_3} \to \mathrm{XO} + \mathrm{O_2}$、$\mathrm{XO} + \mathrm O \to \mathrm X + \mathrm{O_2}$ で、触媒一つあたり反応（4）を何度も繰り返す：NOₓ（Crutzen、1970）と、CFC 由来の塩素（Molina と Rowland、1974）であり、オゾンホールとモントリオール議定書の背後にある化学である（1995 年ノーベル賞）。
meanings:
- 高度 $a$ における $\mathrm O$、$\mathrm{O_2}$、$\mathrm{O_3}$ の数密度（cm$^{-3}$）
- 反応 $r$ によって生成される化学種 $s$ の正味の分子数；列 1 は $\mathrm{O_2} \to 2\,\mathrm O$ に対する $(2, -1, 0)$
- $s$ の繰り返し ⇒ 和：各反応で生成される酸素原子数、すべてゼロ
- 四つの反応の質量作用速度
- $r$ の繰り返し ⇒ 和：$dc/dt$
- ネットワークのヤコビ行列、$r$ の繰り返しについて和
- 後退オイラーステップのニュートン更新一回分、高度ごとに $3\times3$ の求解
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$ と $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$（JPL、近似値）
- 上空の $\mathrm{O_2}$ と $\mathrm{O_3}$ の柱で減衰した光分解速度（例示的な一バンドモデル）
- $[\mathrm O]$ についての二次方程式から得られる厳密なチャップマン定常状態
labels:
  sza: 太陽天頂角
  log10_t_end: 計算時間 $\log_{10}(t/\mathrm{s})$
  levels: 高度レベル数
