<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Simple pendulum: bob on a string of length L at angle theta from the vertical, pulled down by gravity">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- ceiling -->
    <line x1="70" y1="20" x2="170" y2="20" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="76" y1="20" x2="68" y2="12"/><line x1="90" y1="20" x2="82" y2="12"/><line x1="104" y1="20" x2="96" y2="12"/>
      <line x1="118" y1="20" x2="110" y2="12"/><line x1="132" y1="20" x2="124" y2="12"/><line x1="146" y1="20" x2="138" y2="12"/>
      <line x1="160" y1="20" x2="152" y2="12"/>
    </g>
    <!-- swing path and vertical reference -->
    <path d="M72.5,102.3 A95,95 0 0 0 167.5,102.3" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="120" y1="20" x2="120" y2="128" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- angle -->
    <path d="M120,52 A32,32 0 0 0 136,47.7" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="124" y="70" font-style="italic" fill="#b45309">θ</text>
    <!-- string and bob -->
    <line x1="120" y1="20" x2="167.5" y2="102.3" stroke="#374151" stroke-width="2"/>
    <text x="150" y="56" font-style="italic">L</text>
    <circle cx="120" cy="20" r="3" fill="#374151"/>
    <circle cx="167.5" cy="102.3" r="11" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="163" y="107" font-size="11" fill="#ffffff" font-style="italic">m</text>
    <!-- gravity -->
    <line x1="167.5" y1="116" x2="167.5" y2="146" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="174" y="142" font-style="italic" fill="#b91c1c">g</text>
  </g>
</svg>
