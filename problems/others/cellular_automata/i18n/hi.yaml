title: सभी 256 प्राथमिक सेल्युलर ऑटोमेटा, और Lenia
summary: 'कोशिकाओं की एक पंक्ति जिसमें हर नई कोशिका स्वयं पर और अपने दो पड़ोसियों पर निर्भर करती है: तीन बिट एक कोड $k \in \{0, \dots, 7\}$ बनाते हैं और बाइनरी में लिखी नियम संख्या ही लुकअप तालिका है। सभी 256 नियम एक ही $(256, W)$ टेंसर के रूप में चलते हैं, जिसे एक ही gather से आगे बढ़ाया जाता है: नियम 90 सिएरपिंस्की त्रिभुज बनाता है, नियम 30 यादृच्छिक दिखता है, नियम 110 परस्पर क्रिया करती संरचनाएँ बनाता है और नियम 184 यातायात चलाता है। एक सतत संबंधी, Lenia, तालिका की जगह एक चिकना वलय कर्नेल रखता है और एक सरकते हुए जीव को विकसित करता है।'
notes: 'वोल्फ्राम (Wolfram) ने प्राथमिक नियमों को चार वर्गों में बाँटा: (1) सब कुछ मर जाता है या भर जाता है, (2) स्थिर या आवर्ती पैटर्न, (3) अव्यवस्था (कैओस), जैसे नियम 30, जिसका केंद्रीय स्तंभ लंबे समय तक यादृच्छिक संख्या जनरेटर के रूप में इस्तेमाल हुआ, और (4) जटिल, दीर्घजीवी, परस्पर क्रिया करती संरचनाएँ, जैसे नियम 110, जिसके बारे में मैथ्यू कुक (Matthew Cook) ने सिद्ध किया (2004 में प्रकाशित) कि वह ट्यूरिंग पूर्ण है। मोज़ेक 151 कोशिकाओं के वलय पर 600 चरणों के बाद एक मोटे स्वचालित परीक्षण से हर नियम को रंगता है: एकसमान, किसी खिसकाव तक आवर्ती, या कोई आवर्त नहीं मिला। अंतिम समूह में वर्ग 3 और 4 मिले हुए हैं, और उन्हें अलग करने की कोई सटीक परिभाषा नहीं है। नियम 90 पड़ोसियों को mod 2 जोड़ता है, इसलिए एक कोशिका से शुरू करने पर यह mod 2 पास्कल त्रिभुज है, और नियम 184 सबसे सरल यातायात मॉडल है: यदि आगे की कोशिका खाली हो तो कार दाईं ओर बढ़ती है, इसलिए कारों की संख्या संरक्षित रहती है। गेम ऑफ़ लाइफ़ (2D, $3\times3$ गिनती, एक नियम) के विपरीत, यहाँ हर नियम एक साथ चलता है। Lenia (बर्ट चैन, Bert Chan,
  2019) स्थान, समय और अवस्थाओं को सतत बनाता है; Orbium, इसका क्लासिक ग्लाइडर, Lenia के साथ प्रकाशित कोशिका तालिका (MIT लाइसेंस) से शुरू होता है और चलते समय अपना द्रव्यमान बनाए रखता है, जो एक सॉलिटॉन-जैसे पैटर्न का उदाहरण है जिसे कोई संरक्षण नियम लागू नहीं करता।'
meanings:
- 'नियम संख्या $r$ का बिट $k$: जब पड़ोस कोड $k$ हो तब नई अवस्था'
- वलय पर कोशिका $i$ के आसपास की बाईं, केंद्रीय और दाईं कोशिका
- 'दोहराया गया $j$ ⇒ योग: 3-बिट पड़ोस कोड $4\,\text{left} + 2\,\text{centre} + \text{right}$'
- एक लुकअप हर नियम को एक साथ आगे बढ़ाता है
- किसी नियम का बाएँ-दाएँ दर्पण प्रतिबिंब और 0/1 पूरक; 256 नियम 88 सममिति वर्ग बनाते हैं
- त्रिज्या $R = 13$ का चिकना वलय, योग 1 पर सामान्यीकृत
- आवर्ती ग्रिड पर कनवल्शन, फूरियर रूपांतरों के गुणनफल के रूप में
- जहाँ $U \approx \mu$ हो वहाँ वृद्धि, बाकी जगह क्षय, $1/T$ के चरणों में
