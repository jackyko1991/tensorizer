<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A complex variety X containing a subvariety Z; the class of Z lands in the middle (p,p) cell of the Hodge diamond, here the diamond 1, 0 0, 1 20 1, 0 0, 1 of a K3 surface">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the variety X with a subvariety Z -->
    <path d="M14,92 C10,52 46,30 74,40 C100,48 108,78 96,104 C84,130 40,134 22,118 C16,112 15,102 14,92 Z" fill="#93c5fd" fill-opacity="0.5" stroke="#374151" stroke-width="2"/>
    <path d="M28,98 C42,70 64,96 86,66" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="22" y="62" font-style="italic">X</text>
    <text x="70" y="96" font-style="italic" fill="#1e40af">Z</text>
    <!-- class map -->
    <line x1="100" y1="80" x2="134" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="102" y="72" font-size="13" fill="#b91c1c">[<tspan font-style="italic">Z</tspan>]</text>
    <!-- Hodge diamond of a K3 surface, cell spacing 20 px, centre (190, 80) -->
    <g font-size="12" text-anchor="middle">
      <g fill="#ffffff" stroke="#9ca3af" stroke-width="1">
        <rect x="181" y="31" width="18" height="18" transform="rotate(45 190 40)"/>
        <rect x="161" y="51" width="18" height="18" transform="rotate(45 170 60)"/>
        <rect x="201" y="51" width="18" height="18" transform="rotate(45 210 60)"/>
        <rect x="141" y="71" width="18" height="18" transform="rotate(45 150 80)"/>
        <rect x="221" y="71" width="18" height="18" transform="rotate(45 230 80)"/>
        <rect x="161" y="91" width="18" height="18" transform="rotate(45 170 100)"/>
        <rect x="201" y="91" width="18" height="18" transform="rotate(45 210 100)"/>
        <rect x="181" y="111" width="18" height="18" transform="rotate(45 190 120)"/>
      </g>
      <rect x="181" y="71" width="18" height="18" transform="rotate(45 190 80)" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
      <text x="190" y="44">1</text>
      <text x="170" y="64">0</text><text x="210" y="64">0</text>
      <text x="150" y="84">1</text><text x="190" y="84" font-weight="bold">20</text><text x="230" y="84">1</text>
      <text x="170" y="104">0</text><text x="210" y="104">0</text>
      <text x="190" y="124">1</text>
    </g>
    <text x="168" y="152" font-size="13" font-style="italic" fill="#b45309">h<tspan dy="-5" font-size="10">1,1</tspan></text>
  </g>
</svg>
