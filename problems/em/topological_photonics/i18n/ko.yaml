title: 홀데인 격자 위의 위상 광자학
summary: 복소 차근접 이웃 결합을 갖는 결합 광공진기의 벌집 배열, 즉 광자 홀데인 모형이다. $k$-격자 전체에서의 $2\times 2$ 블로흐 해밀토니언으로부터 후쿠이–하쓰가이–스즈키 링크 방법(링크 변수에 대한 einsum)으로 천 수를 구한다. 지그재그 리본은 간극을 가로지르는 가장자리 상태를 보여 주며, 유한한 조각의 가장자리에 입사한 빛은 홈을 돌아 한 방향으로 흐르지만, 자명한 격자에서는 지나가지 못한다.
notes: '단위: 결합 $t_1 = 1$이고 공진기 간격은 1이다. $E$는 원래 공진 주파수로부터의 이조(detuning)이며, 도파로 배열에서는 시간 $t$가 전파 거리가 된다. 위상은 $\phi = \pi/2$로 고정한다. $\lvert M\rvert < 3\sqrt3\,t_2\lvert\sin\phi\rvert$이면 격자는 위상적이며 $C = \pm1$이다. 비교용 격자는 그 두 배의 질량을 써서 $C = 0$이다. 후쿠이–하쓰가이–스즈키 방법(J. Phys. Soc. Jpn., 2005)은 거친 격자에서도 정확한 정수를 준다. 그러면 벌크–경계 대응이 $\lvert C\rvert$개의 일방향 가장자리 채널을 보장한다. 입력 빛은 아래 가장자리 옆의 점광원으로, 벌크 간극 안의 주파수로 필터링되어 있다. 빛은 홈을 돌아 흐르는데, 산란되어 들어갈 역방향 상태가 없기 때문이다. 자명한 격자에서는 같은 빛이 그냥 벌크로 퍼진다. 이 모형은 Haldane의 것이다(PRL, 1988). Haldane & Raghu(PRL, 2008)가 그 광자 버전을 제안했고, Wang, Chong, Joannopoulos & Soljačić(Nature, 2009)이 자기광학 광자 결정에서 일방향 마이크로파 가장자리 상태를 관측했다. Rechtsman et al.(Nature, 2013)은 나선형 도파로로 플로케 버전을 만들었다. 이어 위상 절연체 레이저가 나왔고(Bandres et al., Science, 2018), Ozawa et al.(Rev. Mod. Phys., 2019)이 이 분야를 개관한다. 자기장이 필요 없는 밸리 홀 광자 결정을 포함한 최근 연구는 이 아이디어를 온칩 통신 및 테라헤르츠 도파로로 확장한다. $M$을 임계값 이상으로 올려 보자. $C$가 0으로 떨어지고, 가장자리 상태가 띠에서 떨어져 나가며, 빛이 더 이상 홈을 돌아가지 못한다.'
meanings:
- 조각의 공진기 $i$에서의 복소 장 진폭
- 결합 $t_1$, $t_2 e^{-i\nu_{ij}\phi}$와 이조 $\pm M$, 그리고 무질서
- $k\cdot\delta_n$은 격자 위의 모든 $k$에 대해 좌표 $i$에 대한 einsum이다. $\delta_n$, $b_n$은 결합 벡터
- '반복된 $\mu$ ⇒ 합: 모든 $k$에서의 블로흐 해밀토니언'
- 아래 띠의 고유벡터(위상은 임의적)
- '반복된 $a$ ⇒ 합: 이웃한 $k$ 점 사이의 링크 변수'
- '네 링크로 이루어진 고리의 위상: 베리 플럭스, 게이지 불변'
- '반복된 $a, b, c$ ⇒ 합: 연속 베리 곡률, 도함수는 autograd로'
- 격자(위상적 및 자명한)마다 eigh 한 번으로 구한 $e^{-iHt}\psi_0$
labels:
  t2: 차근접 결합 $t_2$
  mass: 부격자 이조 $M$
  disorder: 무작위 이조 세기 $W$
  defect_radius: 홈 반지름 $R$
