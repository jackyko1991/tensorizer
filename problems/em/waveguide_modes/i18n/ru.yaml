source_hash: 9c89c68f4f20
title: Моды прямоугольного волновода
summary: 'Какие конфигурации поля могут распространяться по полой металлической трубе? Каждая мода — решение двумерного уравнения Гельмгольца $(\partial_i\partial_i + k_c^2)\psi = 0$ на поперечном сечении: условия Дирихле на стенках для TM, Неймана — для TE. Дискретный лапласиан собирается через torch.kron, а torch.linalg.eigh сразу выдаёт все моды и критические частоты.'
notes: По умолчанию размер соответствует стандартному волноводу X-диапазона WR-90 (2,286 см × 1,016 см), у которого критическая частота моды $\text{TE}_{10}$ равна 6,56 ГГц. Мода распространяется только выше своей критической частоты, с $\beta = \sqrt{(\omega/c)^2 - k_c^2}$. TE- и TM-моды с одинаковыми $(m, n \ge 1)$ имеют общую критическую частоту. Постоянное TE-решение ($k_c = 0$) не переносит волну и отбрасывается. Конечные разности второго порядка дают $k_c$ с точностью около процента при разрешении по умолчанию.
meanings:
- $E_z$ (TM) или $H_z$ (TE) в точке сетки $(x_a, y_b)$
- 'те же значения, вытянутые в вектор: $m = a\cdot N_y + b$'
- одномерная $\partial^2$ с граничным условием, встроенным в угловые элементы
- двумерный лапласиан $\partial_i\partial_i$ ($i$ суммируется по $x, y$)
- 'собственные значения и ортонормированные собственные векторы: критические частоты и формы мод'
- $\pi\sqrt{(m/a)^2 + (n/b)^2}$ для проверки чисел
labels:
  a: Ширина $a$
  b: Высота $b$
  n_modes: Моды
  n_grid: Точек сетки поперёк $b$
