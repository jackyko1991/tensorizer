source_hash: 63ee714594c5
title: 伯格斯方程与激波形成
summary: 最简单的非线性流体方程：波的快速部分追上慢速部分，波形变陡，在 $t^* = 1/\max(-u_0')$ 附近形成激波，黏性使激波保持很薄但光滑。导数是 $N\times N$ 矩阵，因此偏微分方程的每一项都是一次 einsum，并与精确的 Cole–Hopf 解比较。
notes: 把 $u\,u_x$ 写成 $(\tfrac12u^2)_x$（守恒形式）使格式严格守恒 $\int u\,dx$。没有黏性时，特征线 $x = x_0 + u_0(x_0)\,t$ 在 $t^* = 1/\max(-u_0')$ 相交，解将变为多值；有黏性时则形成宽度 $\sim\nu/\Delta u$ 的激波。中心差分要求 $|u|\Delta x/\nu \lesssim 2$，因此在 512 个点上 $\nu$ 不能取得太小。Cole–Hopf 变换 $u = -2\nu\,\partial_x\ln\varphi$ 把伯格斯方程化为热传导方程，给出虚线所示的精确解。非零偏移 $U_0$ 使激波移动。
meanings:
- 格点 $x_i$ 处的速度（周期边界）
- 中心差分 $(f_{i+1} - f_{i-1})/2\Delta x$ 的矩阵形式
- 二阶差分 $(f_{i+1} - 2f_i + f_{i-1})/\Delta x^2$
- 重复的 $j$ ⇒ 求和：通量 $\tfrac12 u^2$ 的导数
- 黏性项
- 守恒：$D$ 和 $L$ 的每列之和为零
- 精确解，对起点的 softmax 加权平均
labels:
  nu: 黏度 $\nu$
  amplitude: $u_0 = U_0 + A\sin x$ 中的振幅 $A$
  offset: 偏移 $U_0$
  t_max: 模拟时长
