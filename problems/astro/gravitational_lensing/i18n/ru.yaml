source_hash: e3dd0dc823a1
title: Гравитационное линзирование чёрной дырой
summary: 'Лучи света, проходящие мимо чёрной дыры, — изотропные геодезические, которые прослеживаются сразу для целого веера прицельных параметров: далёкие лучи отклоняются на $4GM/(c^2 b)$, лучи внутри $\sqrt{27}\,GM/c^2$ падают в дыру. На небе уравнение линзы одной тензорной операцией отображает каждый пиксель обратно в плоскость источника, так что звезда, проходящая за дырой, превращается в две дуги, кольцо Эйнштейна и пик усиления.'
notes: 'Панель лучей: единицы $G = c = M = 1$; пунктирная окружность — фотонная сфера ($r = 3M$), а лучи с $b < \sqrt{27}\,M \approx 5.2\,M$ заканчиваются в дыре, поэтому тень чёрной дыры в 2,6 раза больше радиуса её горизонта. Лучи чуть снаружи могут сделать петлю, прежде чем уйти. Панель неба: точечная масса в приближении тонкой линзы в единицах радиуса Эйнштейна (около миллисекунды дуги для звёздной чёрной дыры в нашей Галактике, поэтому микролинзирование наблюдается как увеличение яркости, а не как разрешённые изображения). Линзирование сохраняет поверхностную яркость, поэтому изображение — это просто источник, вычисленный в $\beta(\theta)$; дополнительный свет возникает из-за растяжения изображений. Конечный размер источника ограничивает усиление вблизи точного совмещения, где точечный источник дал бы $\mu \to \infty$.'
meanings:
- $1/r$ вдоль луча $b$, начиная с 0 (бесконечность) при $du/d\varphi = 1/b$
- уравнение орбиты изотропной геодезической, RK4 по $\varphi$ для всех лучей
- угол выхода минус $\pi$; NaN при захвате
- угол пикселя $p$ на небе, в единицах $\theta_E$
- повторяющийся $j$ ⇒ суммирование
- куда смотрит каждый пиксель в плоскости источника
- линзированное изображение для каждого кадра $f$ через broadcasting
- 'усиление: отношение полных потоков'
labels:
