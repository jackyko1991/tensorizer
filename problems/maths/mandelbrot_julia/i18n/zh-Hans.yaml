source_hash: 88e5f57d0eb4
title: 曼德博集合与朱利亚集合
summary: 在整个复数像素网格上同时迭代 $z \mapsto z^2 + c$。轨道保持有界的点构成曼德博集合 $M$（改变 $c$，从 $z_0 = 0$ 出发）或填充朱利亚集合 $K_c$（固定 $c$，从像素出发）。平滑逃逸计数和由导数得到的距离估计，使图像在一路放大到海马谷时依然清晰，而朱利亚集合随着 $c$ 沿主心形线行走不断改变形状。
notes: 为什么在 $|z| > 2$ 时判定逃逸：若 $|z| > \max(2, |c|)$，则 $|z^2 + c| \ge |z|^2 - |c| > |z|$，轨道无界增长。因此每个 $|c| > 2$ 的 $c$ 在第一步就逃逸，$M$ 位于圆盘 $|c| \le 2$ 内。这里使用更大的逃逸半径 $R = 1000$，因为它使平滑计数 $\nu = n + 1 - \log_2 \ln|z_n|$ 更准确：在无穷远附近 $z \mapsto z^2$ 每步使 $\ln|z|$ 加倍，而 $\log_2$ 恰好抵消这一点。主心形线是使 $z^* = z^{*2} + c$ 为吸引不动点（$|2z^*| < 1$）的 $c$ 的集合；令 $2z^* = w$ 得 $c = w/2 - w^2/4$，$|w| \le 1$，而周期 2 球茎是 2-周期吸引的区域，$|4(1+c)| < 1$。这两部分覆盖了 $M$ 总面积 $\approx 1.5066$ 中的约 1.37，其中的像素永远不会逃逸。距离估计 $d = |z_n|\ln|z_n|/|z'_n|$ 来自势函数 $G(c) = \lim 2^{-n}\ln|z_n|$，即 $G/|\nabla G|$；在集合附近，真实距离与它相差大约 2 倍以内（这是 Koebe 四分之一定理的推论）。朱利亚面板让 $c$ 保持在心形线边缘，那里的不动点是中性的：由于 $c \in M$，$K_c$ 在那里总是连通的，但其形状从一个角度到下一个角度完全不同。每个朱利亚集合看起来都像该 $c$ 附近的 $M$，这就是放大 $M$ 时会看到小朱利亚集合的原因。比约 $10^{-13}$ 更深的放大需要超过 complex128 的 16 位有效数字。
meanings:
- 每个像素 $p$ 一个复数；不对任何指标求和，每个像素独立运行
- 对所有仍在迭代的像素执行一步二次映射
- 链式法则：对 $M$ 取 $c' = 1$（对 $c$ 求导），对朱利亚集合取 $c' = 0$ 和 $z'_0 = 1$（对 $z_0$ 求导）
- 首次满足 $|z_p| > R$ 的步数；已逃逸的像素从张量中移除，因此工作量逐渐减少
- 平滑（连续）逃逸计数：色带之间没有颜色阶跃
- 距离估计：$d_p$ 小于四分之一像素的像素画成深色，从而显现出细丝
- 主心形线的精确判定（周期 2 球茎为 $|c+1| \le \frac14$），其中 $q = (x-\frac14)^2 + y^2$
labels:
  target: 放大目标
  zoom_decades: 放大深度（10 的幂次）
  resolution: 每边像素数
  max_iter: 初始迭代次数（每个数量级 +150）
  frames: 帧数
