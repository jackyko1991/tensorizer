title: 합성곱으로 보는 콘웨이의 라이프 게임
summary: '물리는 아니고 그냥 재미로: 살아 있는 세포와 죽은 세포로 이루어진 격자에서 각 세포는 주변의 이웃 8개를 살핀다. 이웃을 세는 것은 $3\times3$ 합성곱이며, 펼친 패치에 대한 하나의 einsum으로 쓸 수 있고, 탄생/생존 규칙은 텐서 비교이므로 여러 보드의 모든 세포가 동시에 갱신된다. 글라이더, 글라이더 총, 무작위 수프를 관찰해 보자.'
notes: 세 개의 숫자(3이면 탄생, 2 또는 3이면 생존)만으로도 4세대마다 대각선으로 한 칸씩 이동하는 글라이더, 펄서(주기 3) 같은 진동자, 그리고 고스퍼 글라이더 총이 생겨난다. 글라이더 총은 30세대마다 새 글라이더를 발사하므로 개체 수가 주기마다 5씩 늘어난다. 세포가 5개뿐인 $R$-펜토미노는 무한한 격자에서 1103세대 동안 계속 변한다. 유한한 보드에서는 가장자리가 이를 일찍 끊어 버린다. 무작위 수프는 타서 사그라들며 정물, 깜빡이, 그리고 빠져나가는 글라이더만 남긴다. 회색 곡선은 이 감쇠가 수프마다 얼마나 비슷한지 보여 준다. 같은 '펼치고 einsum' 패턴이 바로 합성곱 신경망 층을 계산하는 방식이다.
meanings:
- '보드 $b$의 세포 $(i, j)$: 1은 삶, 0은 죽음'
- '세포 주위는 1, 가운데는 0: 세포는 자기 자신의 이웃이 아니다'
- 각 세포 $p$ 주위의 $3\times3$ 패치를 열로 펼친 것; 보드 밖의 세포는 죽은 것으로 센다
- '반복된 $k$ ⇒ 합산: 각 세포의 살아 있는 이웃 수, $K$와의 합성곱과 같다'
- 'B3/S23: 이웃이 정확히 3개면 탄생, 2개 또는 3개면 생존, 그 밖에는 죽음'
- 각 세대에서 각 보드의 개체 수
