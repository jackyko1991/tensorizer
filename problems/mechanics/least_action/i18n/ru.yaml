source_hash: 31fa57e56a24
title: 'Принцип наименьшего действия: поиск траектории градиентным спуском'
summary: Разбейте траекторию на точки $q_n$ с закреплёнными концами, запишите действие $S = \sum_n L\,\Delta t$ одним тензорным выражением, и пусть autograd с оптимизатором скатывают пакет неверных догадок вниз, пока $\partial S/\partial q_n = 0$. Они приходят к параболе брошенного мяча или синусоиде осциллятора.
notes: 'Здесь природа не интегрирует вперёд шаг за шагом: вся траектория подстраивается сразу, зная, где она должна начаться и закончиться. Условие $\partial S/\partial q_n = 0$ даёт $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 = -V''(q_n)$ — дискретное уравнение Эйлера–Лагранжа, которое в точности совпадает со схемой Верле; для постоянной силы тяжести оно воспроизводит параболу с точностью до ошибок округления, для осциллятора — до $O(\Delta t^2)$. На самом деле это принцип стационарного действия: для осциллятора наименьшее собственное значение гессиана примерно равно $m\Delta t\,(\pi^2/T^2 - \omega^2)$, поэтому, как только $T$ превышает полпериода $\pi/\omega$, истинная траектория становится седловой точкой $S$, градиентный спуск ушёл бы прочь, и код переключается на шаги Ньютона $x \leftarrow x - \alpha H^{-1}\nabla S$, которые находят любую стационарную точку. Плавные длинные волны релаксируют медленнее всего (наименьшие собственные значения гессиана); короткие исчезают за несколько итераций.'
meanings:
- пробная траектория $b$ в момент $t_n = n\,\Delta t$; $q_{b0}$ и $q_{bN}$ закреплены
- '$-1$ на диагонали, $+1$ справа от неё: $(Dq)_n = q_{n+1} - q_n$'
- 'повторяющийся $k$ ⇒ суммирование: скорость на каждом шаге каждой траектории'
- кинетическая минус потенциальная энергия, суммированная по шагам; $V$ берётся на левом конце каждого шага
- градиент по свободным внутренним точкам; траектории независимы, поэтому одного обратного прохода хватает для всех
- градиентный спуск с моментом, $\eta = 0.8\,\Delta t/m$
- 'гессиан: трёхдиагональный, $2m/\Delta t - V''''\Delta t$ на диагонали и $-m/\Delta t$ рядом с ней'
- дискретное уравнение Эйлера–Лагранжа $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 + V'(q_n)$, схема Верле; $\partial S/\partial q_n = -\Delta t\,r_n$
