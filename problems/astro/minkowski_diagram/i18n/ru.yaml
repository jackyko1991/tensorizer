source_hash: 8adb8e4369f3
title: 'СТО: диаграммы Минковского'
summary: 'События — это 2-векторы $x^\mu = (t, x)$, а смена инерциальной системы отсчёта — одна матрица $\Lambda^\mu{}_\nu$, применяемая ко всем ним через einsum. Близнец летит к звезде и обратно: диаграммы в домашней и в бустированной системах показывают наклонённые линии одновременности, инвариантный световой конус и часы путешественника, отсчитывающие $\int\sqrt{1 - v^2}\,dt$ — меньше, чем у близнеца-домоседа.'
notes: 'Единицы: годы и световые годы, поэтому $c = 1$, а световые лучи — штриховые линии под 45°. Путешественник летит со скоростью $v$ к звезде на расстоянии $L$, мгновенно разворачивается и летит обратно. Янтарная линия — множество событий, которые путешественник считает «сейчас»: на пути туда она наклонена на $v$, а при развороте проносится через мировую линию домоседа — туда и уходят «пропавшие» годы домоседа. Парадокс несимметричен, потому что только путешественник меняет инерциальную систему. Задайте буст правой панели равным $v$, чтобы оказаться в системе путешественника на пути туда, или $-v$ — на обратном пути. Световой конус сохраняет форму в любой системе.'
meanings:
- событие $(t, x)$, $\mu \in \{0, 1\}$, $c = 1$
- метрика Минковского $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- 'повторяющийся $\nu$ ⇒ суммирование: все события мировой линии или сетки бустируются сразу'
- квадрат интервала, одинаковый во всех системах
- накопленная сумма $\sqrt{-\Delta s^2}$ вдоль мировой линии
- равно $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$
labels:
  v: Скорость путешественника $v/c$
  distance: Расстояние до звезды $L$
  beta_view: Буст правой панели $\beta$
