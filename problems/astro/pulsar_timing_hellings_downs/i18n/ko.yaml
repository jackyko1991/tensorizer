source_hash: 890ee320b06e
title: 펄서 타이밍 배열과 헬링스–다운스 곡선
summary: 나노헤르츠 중력파의 바다가 지구와 수많은 밀리초 펄서 사이의 경로를 살짝 늘였다 줄인다. 무작위 평면파 천 개로 만든 등방성 배경이 안테나 패턴 $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$를 통해 각 펄서의 펄스 도착 시각을 이동시키며, 이는 편광 텐서에 대한 einsum 하나로 계산된다. 모든 펄서 쌍의 타이밍 잔차를 상관시키고 각도별로 묶으면 헬링스–다운스 곡선이 복원된다. 이 사중극자 지문에 대한 증거를 펄서 타이밍 배열들이 2023년에 보고했다.
notes: '중력파는 펄서와 지구 사이 빛의 이동 시간을 바꾸므로, 펄스 도착 시각이 수년에 걸쳐 수십~수백 나노초 어긋난다. 단일 파동의 경우 효과는 $F^{+}$와 $F^{\times}$를 통해 기하에 의존하지만, 등방성 배경에서는 방향에 대해 평균하면 두 펄서 사이의 각도에만 의존하는 상관이 남는다. Hellings와 Downs(ApJL 265, L39, 1983)가 이를 계산했다. 하늘에서 가까운 펄서는 $\tfrac12$만큼 상관되고(각 펄서 파워의 나머지 절반은 상관되지 않는 펄서 항이다), 약 $82.5^\circ$ 떨어진 쌍은 약하게 반상관되며, 정반대편 펄서는 다시 $\tfrac14$만큼 양의 상관을 갖는다. 사중극자 모양은 횡파이자 스핀 2인 파동의 특징이다. 시계 오차는 단극자($\Gamma = 1$), 태양계 천체력 오차는 쌍극자($\Gamma = \cos\zeta$)를 주며, 비교를 위해 둘 다 피팅한다. 이 페이지는 정규화를 두 가지로 확인한다. 공식을 몬테카를로 천구 적분 $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$와 비교하고, 안테나 패턴 평균 $\langle\sum_A (F^A)^2\rangle = 1/3$을 확인한다. 하늘 하나만으로는 곡선 주위로 눈에 띄게 흩어진다. 지배적인 주파수가 몇 개뿐이면 이 "우주 분산"은 실제로 존재하며 실제 배열에도 영향을 준다. 시뮬레이션한 하늘 여러 개를 평균하면 수렴이 보인다. 피팅된 진폭은 백색 잡음 때문에 1보다 작게 희석된다. 연구 배경: 2023년 6월 NANOGrav 협력단(15년 데이터, Agazie et al., ApJL 951, L8, 2023)이 헬링스–다운스 상관을 갖는 나노헤르츠 중력파 배경의 증거(상관에 대해 대략 3σ, 근삿값)를 보고했고, 유럽과 인도의 PTA(EPTA + InPTA, A&A 2023), 파크스 PTA(Reardon et al., ApJL 951, L6, 2023), 중국 PTA도 함께 보고했다. 가장 유력한
  원천은 초대질량 블랙홀 쌍성의 집단으로, 여기서 쓰는 $h_c \propto f^{-2/3}$ 스펙트럼을 준다. 단순화: 잔차에서 각 펄서의 스핀다운을 피팅하지 않고(평균만 제거), 백색 잡음만 있으며 펄서별 적색 잡음은 없고, 최적 통계량이나 완전한 베이즈 분석 대신 단순 정규화 교차상관을 쓴다.'
meanings:
- 펄서 $a$를 향하는 단위 벡터, 천구에 균일하게 분포
- 파동 $m$의 전파 방향과 편광각
- 횡방향 기준틀 $m, n \perp \hat\Omega$로 만든 $+$와 $\times$ 텐서
- '$i$와 $j$에 대해 합: 지구–펄서 선의 늘어남'
- 안테나 패턴. $\sum_A (F^A)^2$의 천구 평균은 정확히 $1/3$
- 펄서 항의 위상 지연, $\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- '$m$과 $A$에 대해 합: 관측 시점 $t$에서 펄서 $a$의 타이밍 잔차'
- '$t$에 대해 합: 모든 쌍의 상관, 평균 자기 파워로 정규화'
- 기대 상관, $\Gamma(0^+) = \tfrac12$, 최솟값 $\approx -0.152$ ($\zeta \approx 82.5^\circ$에서)
