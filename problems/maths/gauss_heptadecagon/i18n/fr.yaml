title: Le 17-gone de Gauss à la règle et au compas
summary: 'En 1796, un mois avant ses 19 ans, Gauss découvre que le 17-gone régulier se trace à la règle et au compas : le premier nouveau polygone constructible depuis les Grecs. Les racines 17-ièmes de l''unité, regroupées en périodes de Gauss, résolvent une chaîne d''équations du second degré. Cette chaîne écrit $\cos(2\pi/17)$ avec des racines carrées seulement. La construction de Richmond (1893) trace ensuite le polygone pas à pas, avec des intersections de droites et de cercles écrites comme opérations tensorielles. Une grille montre quels $n$-gones sont constructibles (théorème de Gauss–Wantzel). Tout ici est des mathématiques classiques démontrées.'
notes: 'Gauss trouve le 17-gone le 30 mars 1796, juste avant ses 19 ans, et c''est, dit-on, ce qui le décide à choisir les mathématiques plutôt que la philologie. Il publie la théorie dans la dernière section des Disquisitiones Arithmeticae (1801). L''idée : les 16 racines non triviales $\zeta^k$ sont permutées cycliquement par $k \mapsto 3k \bmod 17$, car 3 est une racine primitive. En sommant une racine sur deux dans cet ordre cyclique, on obtient deux périodes de 8 termes avec $\eta_0 + \eta_1 = -1$ et $\eta_0\eta_1 = -4$, donc $\eta_{0,1} = (-1 \pm \sqrt{17})/2$. En coupant encore en deux, on obtient des périodes de 4, 2 et 1 termes. Chaque paire est la paire de racines d''une équation du second degré dont les coefficients sont des périodes du niveau au-dessus, car les sous-groupes ont pour ordres $16 \to 8 \to 4 \to 2 \to 1$, toutes des puissances de 2. Les périodes de 2 termes sont $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$, donc quatre racines carrées donnent la formule de Gauss. Le
  programme vérifie chaque relation quadratique avec des coefficients entiers exacts, reconstruit chaque période avec des racines carrées seulement, et compare la formule fermée à `torch.cos` (et à sympy avec 60 chiffres quand il est installé). Toute racine primitive (3, 5, 6, 7, 10, 11, 12, 14) donne le même arbre dans un autre ordre. Une racine carrée est une opération à la règle et au compas, donc le polygone est constructible. H. W. Richmond (1893) a donné une recette courte sur le cercle unité. On prend $OJ = OB/4$ sur le rayon vertical. On place $E$ sur le diamètre avec $\angle OJE = \tfrac14\angle OJP_0$ (deux bissections d''angle), et $F$ avec $\angle EJF = 45°$. Le cercle de diamètre $FP_0$ coupe $OB$ en $K$. Le cercle de centre $E$ passant par $K$ coupe le diamètre en $N_3 = \cos(6\pi/17)$ et $N_5 = \cos(10\pi/17)$, et les perpendiculaires en ces points donnent $P_3$ et $P_5$. Ici, chaque étape trace vraiment une droite par deux points ou un cercle de centre donné passant par un
  autre point. Chaque nouveau point est une intersection droite–droite, droite–cercle ou cercle–cercle, et les autres sommets sont reportés avec des cercles : de centre $P_k$ passant par $P_{k-1}$, et de centre $P_0$ passant par $P_k$ pour l''image miroir. Les 55 étapes placent les 17 sommets à environ $10^{-15}$ de $e^{2\pi i k/17}$ en float64 ; passez en float32 pour voir l''arrondi grimper vers $10^{-6}$. Gauss a énoncé que le $n$-gone est constructible quand $n = 2^k p_1 \cdots p_r$ avec des nombres premiers de Fermat distincts $p_i = 2^{2^j} + 1$. Wantzel (1837) a démontré qu''aucun autre $n$ ne convient, ce qui a aussi réglé la trisection de l''angle et la duplication du cube. C''est équivalent au fait que l''indicatrice d''Euler $\varphi(n)$ soit une puissance de 2, et la grille vérifie les deux tests jusqu''à $n$. Les seuls nombres premiers de Fermat connus sont 3, 5, 17, 257 et 65537. Richelot a publié le 257-gone en 1832, et J. G. Hermes a passé une dizaine d''années sur le 65537-gone,
  achevé en 1894 et conservé à Göttingen. Gauss aurait demandé un 17-gone sur sa tombe ; le tailleur de pierre aurait refusé parce qu''il ressemblerait à un cercle. Le monument de Gauss à Brunswick porte à la place une étoile à 17 branches.'
meanings:
- les racines 17-ièmes de l'unité, les sommets du 17-gone dans le plan complexe
- 'les exposants dans l''ordre des puissances d''une racine primitive, $g = 3$ : 1, 3, 9, 10, 13, …'
- 'quelles positions de l''ordre cyclique forment la période $i$ au niveau $m$ : une sur $2^m$'
- '$j$ répété ⇒ sommé : toutes les périodes de Gauss des cinq niveaux (longueurs 16, 8, 4, 2, 1) d''un coup'
- le produit de deux périodes sœurs est une somme de $\zeta^{a+b}$ ; compter les exposants donne des entiers constants sur les périodes du niveau parent
- '$k$ répété ⇒ sommé : le terme constant de chaque équation du second degré, tiré du niveau au-dessus'
- 'une racine carrée par niveau : $16 \to 8 \to 4 \to 2 \to 1$ ; le niveau 3 contient $2\cos(2\pi k/17)$'
- 'les trois gestes de la règle et du compas en formules tensorielles : un système $2\times 2$ par produits vectoriels, une équation du second degré en $t$, et l''axe radical de deux cercles'
- l'indicatrice d'Euler par un crible ; constructible exactement quand $\varphi(n)$ est une puissance de 2, testé par $x \,\&\, (x-1) = 0$
- 'la partie impaire doit diviser $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$ : un produit de nombres premiers de Fermat distincts'
labels:
  generator: Racine primitive $g$ pour l'ordre cyclique
  precision: Précision de la construction
  n_max: Grille de constructibilité jusqu'à $n$
