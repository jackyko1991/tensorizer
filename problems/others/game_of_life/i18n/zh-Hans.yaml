source_hash: 1d6c71673889
title: 用卷积表示康威生命游戏
summary: 这不是物理，纯属好玩：一个由活细胞和死细胞组成的网格，每个细胞都会观察它的八个邻居。统计邻居数就是一次 $3\times3$ 卷积，写成对展开后图块的一个 einsum，而诞生/存活规则则是张量之间的比较，因此多个棋盘上的每个细胞都同时更新。观察滑翔机、滑翔机枪和随机汤。
notes: 只需三个数字（3 个邻居时诞生、2 或 3 个时存活）就足以产生每 4 代沿对角线移动一格的滑翔机、脉冲星（周期 3）之类的振荡器，以及高斯帕滑翔机枪：它每 30 代发射一架新的滑翔机，因此种群每个周期增加 5。只有 5 个细胞的 $R$ 五连块，在无边界的网格上会持续变化 1103 代；在有限的棋盘上，边界会让这一过程提前结束。随机汤会逐渐燃尽，变成静物、闪烁器和逃逸的滑翔机；灰色曲线显示不同的汤之间，这种衰减有多么相似。同样的“展开再 einsum”模式，正是卷积神经网络中一层的计算方式。
meanings:
- 棋盘 $b$ 的细胞 $(i, j)$：1 为活，0 为死
- 细胞周围为 1、中心为 0：细胞不是自己的邻居
- 每个细胞 $p$ 周围的 $3\times3$ 图块排成一列；棋盘外的细胞视为死亡
- 重复的 $k$ ⇒ 求和：每个细胞的活邻居数，等同于与 $K$ 做卷积
- B3/S23：恰有 3 个邻居时诞生，有 2 或 3 个时存活，否则死亡
- 每个棋盘在每一代的种群数量
labels:
  pattern: 初始图案
  size: 棋盘大小
  generations: 代数
  n_boards: 随机棋盘数 $B$
  density: 随机填充密度
