title: आपेक्षिकीय स्ट्रिंग के मोड और T-द्वैतता
summary: 'प्रकाश-शंकु गेज में नांबू–गोटो (Nambu–Goto) स्ट्रिंग 24 मुक्त अनुप्रस्थ तरंगें है। एक बैच मोड-योग कंपन करती बंद या खुली स्ट्रिंग बनाता है; इसके मोडों में ऊर्जा स्तर $N$ है, जो $\alpha'' M^2 = N - 1$ (खुली) या $4(N-1)$ (बंद) के रूप में क्वांटीकृत है, और $1, 24, 324, 3200, \dots$ अवस्थाएँ घात श्रेणी $\prod (1-q^n)^{-24}$ से पढ़ी जाती हैं। त्रिज्या $R$ के वृत्त पर बंद स्ट्रिंग का स्पेक्ट्रम $R \leftrightarrow \alpha''/R$ के तहत अपरिवर्तित रहता है: T-द्वैतता। स्ट्रिंग सिद्धांत एक ढाँचा है जिसकी कोई प्रत्यक्ष प्रायोगिक पुष्टि नहीं है।'
notes: 'इकाइयाँ $\alpha'' = 1$। स्थिति: स्ट्रिंग सिद्धांत क्वांटम गुरुत्व के लिए गणितीय रूप से सुसंगत उम्मीदवार ढाँचा है, पर इसके पक्ष में कोई प्रत्यक्ष प्रायोगिक प्रमाण नहीं है; यहाँ कुछ भी परखी गई भविष्यवाणी नहीं है। जो दिखाया गया है वह बोसॉनिक स्ट्रिंग का मानक पाठ्यपुस्तक गणित है (Goddard–Goldstone–Rebbi–Thorn 1973; Polchinski, String Theory vol. 1): प्रकाश-शंकु क्वांटीकरण केवल $D = 26$ में सुसंगत है, अंतःखंड $a = 1$ के साथ, जिससे $N = 0$ पर एक टैकियॉन ($M^2 < 0$, लाल), खुली स्ट्रिंग के लिए $N = 1$ पर एक द्रव्यमानहीन सदिश, और बंद स्ट्रिंग के लिए $N = \tilde N = 1$ पर ग्रेविटॉन, B-क्षेत्र और डाइलेटॉन बचते हैं। सुपरस्ट्रिंग (D = 10) टैकियॉन को हटा देती हैं। बनाई गई स्ट्रिंग एक शास्त्रीय विन्यास है जिसकी दोलक ऊर्जा स्तर $N$ के बराबर है (मोड $n$ का प्रत्येक क्वांटम $n$ इकाइयाँ ले जाता है); बंद स्ट्रिंग के लिए दाएँ और बाएँ गतिमान मोड $N = \tilde N$ के साथ चुने जाते हैं (स्तर मिलान, $\int \dot X\cdot X''\,d\sigma = 0$), और स्ट्रिंग अपने विराम फ़्रेम में है, इसलिए प्रकाश-शंकु निर्देशांक $X^-$
  नहीं बनाया जाता। T-द्वैतता पैनल त्रिज्या बदलने पर कुछ अवस्थाओं के द्रव्यमानों का अनुसरण करता है: संवेग अवस्थाएँ ($n/R$) और वाइंडिंग अवस्थाएँ ($wR/\alpha''$) $R \to \alpha''/R$ के तहत अदला-बदली करती हैं, और स्व-द्वैत त्रिज्या $R = \sqrt{\alpha''}$ पर अतिरिक्त अवस्थाएँ द्रव्यमानहीन हो जाती हैं। शीर्षक जाँचता है कि पूरा छाँटा गया स्पेक्ट्रम, बहुलताओं सहित, $R$ और $\alpha''/R$ पर समान है।'
meanings:
- 24 अनुप्रस्थ दिशाओं $i$ में से 3 में दाएँ और बाएँ गतिमान मोड $n$ के सम्मिश्र आयाम
- प्रत्येक वर्ल्डशीट बिंदु पर हर मोड की कला $e^{-in(\tau-\sigma)}$ (ब्रॉडकास्ट)
- 'दोहराया गया मोड सूचकांक $n$ ⇒ योग: हर $\tau$ और $\sigma$ पर स्ट्रिंग का आकार'
- ऊर्जा घनत्व; $\sigma$ पर समाकलित करने से स्तर $N$ मिलता है (पार्सेवल)
- 'ब्रॉडकास्ट विभाज्यता मास्क से भाजक योग: $\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$'
- छाँटी गई घात श्रेणियाँ निम्न-त्रिकोणीय टोप्लित्ज़ आव्यूहों की तरह गुणा होती हैं, इसलिए श्रेणी का $\exp$ एक आव्यूह घातांक है
- हर त्रिज्या $R_b$ पर सभी स्तर-मिलित अवस्थाओं $N-\tilde N = nw$ के द्रव्यमान एक साथ
labels:
