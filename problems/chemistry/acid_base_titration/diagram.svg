<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Titration setup: a burette of NaOH drips a volume V into a flask holding a volume V0 of acid, while a pH meter with an electrode in the flask reads the pH">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- burette with NaOH -->
    <rect x="128" y="8" width="14" height="74" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <rect x="129" y="24" width="12" height="57" fill="#93c5fd"/>
    <g stroke="#374151" stroke-width="1">
      <line x1="128" y1="30" x2="134" y2="30"/><line x1="128" y1="42" x2="134" y2="42"/><line x1="128" y1="54" x2="134" y2="54"/>
      <line x1="128" y1="66" x2="134" y2="66"/><line x1="128" y1="78" x2="134" y2="78"/>
    </g>
    <path d="M128,82 L135,94 L142,82" fill="#93c5fd" stroke="#374151" stroke-width="2"/>
    <rect x="124" y="85" width="22" height="4" rx="1.5" fill="#374151"/>
    <circle cx="136" cy="101" r="2.6" fill="#2563eb"/>
    <text x="148" y="40">NaOH</text>
    <text x="148" y="58" font-style="italic">V</text>
    <!-- flask with acid -->
    <path d="M128,108 V120 L104,150 H166 L142,120 V108" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <path d="M113,139 L157,139 L166,150 H104 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
    <text x="172" y="148">acid <tspan font-style="italic">V</tspan><tspan font-size="10" dy="3">0</tspan></text>
    <!-- pH electrode and meter -->
    <line x1="130" y1="104" x2="130" y2="143" stroke="#374151" stroke-width="3"/>
    <circle cx="130" cy="144" r="2.5" fill="#f59e0b"/>
    <path d="M130,104 C128,92 100,84 74,84" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="18" y="64" width="56" height="40" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <rect x="25" y="71" width="42" height="18" rx="2" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
    <text x="46" y="85" text-anchor="middle" font-size="12" fill="#1e3a8a">7.00</text>
    <text x="46" y="122" text-anchor="middle" fill="#b45309">pH</text>
  </g>
</svg>
