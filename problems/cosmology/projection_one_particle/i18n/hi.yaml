title: 'एक कण, अनेक बार दिखा: एक ही विश्व-रेखा को काटना'
summary: 'यह एक अनुमानात्मक परिकल्पना है, स्थापित भौतिकी नहीं: हर इलेक्ट्रॉन एक ही वस्तु है, एक विश्व-रेखा जो समय में आगे-पीछे टेढ़ी-मेढ़ी चलती है (व्हीलर का 1940 का एक-इलेक्ट्रॉन ब्रह्मांड)। एक समय-खंड इसे कई बार काटता है: आगे की ओर के प्रतिच्छेदन इलेक्ट्रॉन जैसे दिखते हैं, पीछे की ओर के पॉज़िट्रॉन जैसे। यह चरण यादृच्छिक विश्व-रेखाओं के समूहों को काटता है। सभी इलेक्ट्रॉन ठीक एक जैसे निकलते हैं, और मोड़ बिंदुओं पर युग्म बनते और विलोपित होते हैं। पर एक बंद विश्व-रेखा हर खंड को जितनी बार आगे काटती है उतनी ही बार पीछे, और एक खुली रेखा अधिकतम एक शुद्ध कण जोड़ती है, जबकि ब्रह्मांड में लगभग $10^{80}$ बैरियॉन हैं और लगभग कोई प्रतिद्रव्य नहीं। अपने सरलतम रूप में यह विचार खारिज है।'
notes: 'स्थिति: अनुमानात्मक; सरलतम रूप में खारिज। प्रक्षेपण परिकल्पना का चरण 2 (लेखक का अपना अनुमानात्मक विचार, शृंखला का विवरण देखें; स्थापित भौतिकी नहीं), अभिधारणा P3 के लिए: सभी कण एक ही वस्तु के प्रक्षेपण हैं। चरण 1 (cosmology/projection_postulate) ने अभिधारणाएँ लिखीं; चरण 3 (cosmology/projection_dimension_budget) उनके लिए आवश्यक विमाएँ गिनता है। पहले ज्ञात भौतिकी। 1940 में एक टेलीफ़ोन वार्ता में जॉन व्हीलर ने रिचर्ड फ़ाइनमैन को सुझाया कि सभी इलेक्ट्रॉन एक जैसे हैं क्योंकि वे एक ही इलेक्ट्रॉन हैं, जिसकी विश्व-रेखा समय में आगे और पीछे चलती है; पीछे की ओर का हिस्सा पॉज़िट्रॉन है। फ़ाइनमैन ने यह कहानी अपने 1965 के नोबेल व्याख्यान में अपनी आपत्ति के साथ सुनाई: पॉज़िट्रॉन इलेक्ट्रॉनों जितने नहीं हैं। व्हीलर ने सुझाया कि वे प्रोटॉनों में छिपे हो सकते हैं। यह विचार कि पॉज़िट्रॉन समय में पीछे जाता इलेक्ट्रॉन है, प्रतिकणों के फ़ाइनमैन–श्टुकेलबर्ग चित्र के रूप में बचा रहा (Feynman, Phys. Rev. 76, 749, 1949), पर एक-इलेक्ट्रॉन ब्रह्मांड नहीं बचा: क्वांटम क्षेत्र सिद्धांत में सभी इलेक्ट्रॉन एक जैसे
  हैं क्योंकि वे एक ही क्षेत्र के उत्तेजन हैं। यहाँ विश्व-रेखा $D$ विमाओं वाले स्थान में रहती है ($D$ एक प्राचल है, कभी 4 पर तय नहीं); खंडों के लिए केवल इसका समय निर्देशांक मायने रखता है, जैसा P2 कहता है। परिकल्पना की भविष्यवाणी: एक समय-खंड (P2) विश्व-रेखा को $N_+$ आगे और $N_-$ पीछे के प्रतिच्छेदनों पर काटता है। क्या गणना की गई: चिकनी (यादृच्छिक फ़ूरिए, $K$ हार्मोनिक, आयाम $\propto k^{-\beta}$) और खुरदरी (ब्राउनी) विश्व-रेखाओं के समूह, बंद या खुले, जिन्हें $L$ खंड काटते हैं। प्रतिच्छेदनों को एक अंतर-सरणी में scatter द्वारा गिना जाता है और पूर्ण-गणना तालिका से जाँचा जाता है। बंद लूप के लिए हर खंड पर $N_+ = N_-$; खुले के लिए $Q = N_+ - N_-$ बराबर है $[t_{end}\geq u] - [t_{start}\geq u]$ के, इसलिए $|Q|\leq 1$ और $N\equiv Q$ (mod 2)। खंड को झुकाना (एक गतिशील प्रेक्षक) $Q$ को नहीं बदलता। कुल गिनती खंड के नीचे $2(\#\text{minima} - \#\text{maxima})$ के बराबर है, इसलिए युग्म $t(s)$ के निम्निष्ठों पर जन्म लेते हैं और उच्चिष्ठों पर समाप्त होते हैं। यादृच्छिक चिकने लूपों की माध्य गिनती राइस सूत्र का
  पालन करती है। जो मुफ़्त में सही मिलता है: हर प्रतिच्छेदन उसी विश्व-रेखा का द्रव्यमान और आवेश पढ़ता है, इसलिए सभी इलेक्ट्रॉन ठीक एक जैसे हैं, और पॉज़िट्रॉनों का आवेश ठीक विपरीत और द्रव्यमान वही है (PDG 2024: $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$)। आँकड़ों से परीक्षण (data/*.csv, उद्धृत संख्याएँ): AMS-02 ने कॉस्मिक-किरण पॉज़िट्रॉन अंश $e^+/(e^+ + e^-)$ को 0.5 GeV से 1 TeV तक मापा (Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0, CRDB डेटाबेस के माध्यम से 74 बिन): 0.6 GeV पर 0.13, 8 GeV के पास न्यूनतम 0.053 और 200 GeV से ऊपर 0.15 से 0.16। अतः विषमता $1 - 2f$ 0.67 और 0.89 के बीच है, जबकि बंद लूप के लिए $0$। ब्रह्मांडीय पैमाने पर Planck 2018 का बैरियॉन घनत्व $\Omega_b h^2 = 0.0224$ से $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ मिलता है (cosmology/baryon_asymmetry देखें)। 46.5 अरब प्रकाश-वर्ष त्रिज्या के गोले में प्रति cm$^3$ 411 फ़ोटॉन के साथ यह $N_B\approx 9\times10^{79}$ बैरियॉन है, और प्रतिद्रव्य अनुपस्थित है (BESS-Polar:
  प्रति-हीलियम/हीलियम $6.9\times10^{-8}$ से नीचे; Cohen, De Rújula and Glashow 1998: दृश्य ब्रह्मांड में कोई प्रतिद्रव्य क्षेत्र नहीं)। एक विश्व-रेखा अधिकतम $|Q|/N = 1/N$ देती है, जो $N\approx 1.5\times10^{89}$ होने पर $7\times10^{-90}$ है, जबकि $\eta = 6\times10^{-10}$; शुद्ध आवेश लगभग $10^{80}$ के गुणक से कम पड़ता है। खुले प्राचलों पर एक सर्वेक्षण (चिकनी या ब्राउनी, बंद या खुली, 2 से 32 हार्मोनिक, तीन खुरदरापन, $N\geq 2$ वाले लगभग $3\times10^5$ खंड) कोई ऐसा विन्यास नहीं पाता जो AMS-02 विषमता तक पहुँचे, और सीमा दिखाती है कि कोई पहुँच भी नहीं सकता: $N\geq 2$ प्रतिच्छेदनों के साथ सबसे बड़ी संभव विषमता $1/3$ है ($N = 3$ पर)। निर्णय: सरलतम रूप में खारिज। विस्तार, हर एक अतिरिक्त धारणा है और उसी रूप में चिह्नित है: (A) एक खुली विश्व-रेखा एक शुद्ध कण जोड़ती है, उससे अधिक नहीं। (B) एक पक्षपाती प्रक्षेपण, जिसमें प्रेक्षक प्रतिकणों को दक्षता $r$ से देखते हैं, को AMS-02 से 0.056 और 0.195 के बीच ऊर्जा के साथ बदलता $r = f/(1-f)$ चाहिए, पर प्रति-हीलियम से $r < 7\times10^{-8}$। तब छिपे प्रतिद्रव्य का
  भार दृश्य बैरियॉनों जितना होगा, यानी डार्क मैटर का लगभग 0.19। यह आधुनिक रूप में व्हीलर का ''प्रोटॉनों में छिपे'' है; इसके लिए एक तंत्र चाहिए, और कोई नहीं दिया गया। (C) यदि समय एक वृत्त होता, तो $w$ बार लिपटा लूप हर खंड पर शुद्ध आवेश $Q = w$ रखता (जाँचा गया), पर $w\approx 10^{80}$ हाथ से डालना पड़ता, और संहत समय का अर्थ है बंद समयसम वक्र। इनमें से कोई भी भविष्यवाणी नहीं है। इस विचार को पुनर्जीवित करने के लिए एक ऐसा तंत्र चाहिए जो एक ही वस्तु की खंड-गिनती को विषम बना दे, और यही वह खुला प्रश्न है जो यह चरण शृंखला के लिए छोड़ता है। बच निकलने का रास्ता: सरल रूप खारिज हो चुका है, लेकिन एक विश्व-रेखा जो समग्र रूप से संतुलित हो, जिसमें प्रतिद्रव्य हमारे क्षितिज के पार या किसी CPT-दर्पण प्रति-ब्रह्मांड में हो, खारिज नहीं हुई है। चरण 7 (cosmology/projection_antimatter_universe) ऐसे प्रतिद्रव्य ब्रह्मांड को पूरी करनी होने वाली कसौटियाँ सूचीबद्ध करता है और प्रत्येक को आँकड़ों से जाँचता है।'
meanings:
- 'दोहराए गए $k$ (हार्मोनिक) और $c$ (cos, sin) ⇒ योग: $D$ विमाओं में $B$ यादृच्छिक विश्व-रेखाएँ; निर्देशांक 0 समय है'
- हर खंड के आगे (कण) और पीछे (प्रतिकण) के प्रतिच्छेदन; खंडांशों $s$ पर योग एक अंतर-सरणी में scatter और फिर संचयी योग है
- खंड पर शुद्ध आवेश; दोनों सिरों की प्रतिच्छेदन संख्या के बराबर, बंद लूप के लिए $0$
- 'केवल मोड़ बिंदुओं से वही गिनती: निम्निष्ठ युग्म बनाते हैं, उच्चिष्ठ उन्हें विलोपित करते हैं'
- स्पेक्ट्रमी आघूर्णों $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$ के साथ राइस सूत्र
- ऊर्जा $E$ पर AMS-02 पॉज़िट्रॉन अंश $f_E$ से कॉस्मिक-किरण $e^\pm$ की आवेश विषमता
- शुद्ध बैरियॉन संख्या जो एक विश्व-रेखा को वहन करनी होगी ($\eta$ Planck 2018 से)
