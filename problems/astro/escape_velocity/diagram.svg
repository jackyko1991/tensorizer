<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Escape velocity: a rocket launched straight up from a planet of mass M and radius R with speed v, pulled back by gravity g">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- planet: only its top shows -->
    <path d="M30,160 A90,90 0 0 1 210,160 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
    <circle cx="120" cy="160" r="3" fill="#374151"/>
    <!-- radius -->
    <line x1="120" y1="160" x2="183.6" y2="96.4" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="155" y="140" font-style="italic">R</text>
    <text x="96" y="150" font-style="italic" fill="#1e40af">M</text>
    <!-- path straight up -->
    <line x1="120" y1="70" x2="120" y2="12" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- rocket -->
    <path d="M114,66 L114,48 L120,38 L126,48 L126,66 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- launch velocity up, gravity down -->
    <line x1="134" y1="58" x2="134" y2="22" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="32" font-style="italic" fill="#b91c1c">v</text>
    <line x1="104" y1="40" x2="104" y2="62" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="90" y="56" font-style="italic" fill="#b91c1c">g</text>
  </g>
</svg>
