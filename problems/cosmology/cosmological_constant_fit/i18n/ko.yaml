source_hash: 73d953345169
title: 초신성으로 우주상수 피팅하기
summary: '공개된 Pantheon+ 목록의 실제 Ia형 초신성 1466개를 물질 $\Omega_m$, 우주상수 $\Omega_\Lambda$, 곡률을 가진 프리드만 우주로 피팅합니다. 하나의 배치 $\chi^2$가 수천 개 우주를 모든 초신성에서 한꺼번에 계산해 $\Omega_m$–$\Omega_\Lambda$ 신뢰 등고선을 그리고, Adam과 자동미분은 물질만 있는 우주에서 최적 피팅까지 나아갑니다. 먼 초신성은 감속하는 우주에서보다 어둡습니다: $q_0 < 0$, 팽창이 가속하고 있습니다.'
notes: '1998년 두 팀, 초신성 우주론 프로젝트(Perlmutter 등)와 고적색편이 초신성 탐색팀(Riess 등; Schmidt)은 표준화할 수 있는 촛불인 먼 Ia형 초신성이 감속하는 우주가 허용하는 것보다 어둡게 보인다는 것을 발견했습니다: 팽창이 가속하고 있으며, 일반상대론에서는 이를 위해 우주상수 $\Lambda$(암흑 에너지) 같은 것이 필요합니다. 이 발견으로 2011년 노벨 물리학상이 수여되었습니다. 여기서는 같은 검사를 오늘날의 데이터로 합니다. 왼쪽 패널은 각 거리 지수에서 텅 빈 채 등속 팽창하는 우주($\Omega_m = \Omega_\Lambda = 0$)의 값을 뺀 것입니다: 물질만 있는 우주(빨강)라면 먼 초신성이 더 밝을 것(0 아래)이지만, 데이터는 그 위에 있습니다. 오른쪽 패널은 배치 격자에서 얻은 1, 2, 3$\sigma$ 영역($\Delta\chi^2 = 2.30, 6.18, 11.83$)과 함께, 평탄선, 가속과 감속을 나누는 직선 $q_0 = 0$, 데이터 범위 안에서 $E^2$가 음수가 되는 ''빅뱅 없음'' 모서리를 보여 줍니다. 이 대각 오차로 피팅하면 $\Omega_m \approx 0.30 \pm 0.07$, $\Omega_\Lambda \approx 0.57 \pm 0.10$(평탄: $\Omega_m \approx 0.35 \pm 0.02$)이며, $\Omega_\Lambda \le 0$은 약 $5.5\sigma$로 기각됩니다($\sigma = \sqrt{\Delta\chi^2}$, 기각되는 쪽의 최적 모형과 비교). $H_0$는 초신성의 절대등급과 겹쳐(축퇴되어) 있고, 출력되는 값($\approx 73$ km/s/Mpc)은 이 $\mu$에 들어 있는 SH0ES 세페이드 보정에서 온 것이라 독립적인 측정이 아닙니다(CMB 값 $\approx 67$과의 ''허블 긴장''은 미해결 문제입니다). 데이터: Pantheon+ 거리 지수(Scolnic et al. 2022, ApJ 938, 113; Brout
  et al. 2022, ApJ 938, 110), github.com/PantheonPlusSH0ES/DataRelease에서 가져옴(파일 Pantheon+SH0ES.dat; 연구용으로 라이선스 표기 없이 공개, 논문은 CC BY 4.0 오픈 액세스; 인용해 주세요). $z > 0.01$에 대해 zHD, MU_SH0ES, MU_SH0ES_ERR_DIAG를 남기고, 보정용 세페이드의 모은하는 빼고, 초신성마다 한 행으로 했습니다. 자신의 표도 쓸 수 있습니다: z, mu, sigma_mu 열을 가진 어떤 CSV든 됩니다(load_distance_moduli 참조). 단순화: 대각 오차만 쓰고 Pantheon+의 통계 + 계통 전체 공분산은 쓰지 않습니다($\chi^2/\mathrm{dof} \approx 0.44$는 이 오차가 보수적임을 보여 주지만, 상관된 계통 오차를 무시하면 등고선이 다소 낙관적이 됩니다). 암흑 에너지는 순수한 상수($w = -1$)이며 복사는 무시합니다.'
meanings:
- 초신성 $i$의 적색편이, 거리 지수, 오차. 이 열을 가진 어떤 CSV에서도 읽음
- 후보 우주; $(A,1,1)$과 $(1,B,1)$로 브로드캐스트
- 모든 우주에 대해 각 마디 $z_k$에서의 팽창률을 한 번에
- 마지막 축을 따라 $1/E$의 누적 사다리꼴 적분
- 초신성 적색편이로의 3차 에르미트 보간(기울기 $1/E$를 앎)
- 열린, 평탄한, 닫힌 공간에 대해 $\sinh$, 항등, $\sin$
- '$i$에 대해 합: 각 우주의 최적 $H_0$는 해석적인 가중 평균'
- 가중치 $w_i = 1/\sigma_i^2$로 $i$에 대해 합
- 적분을 거치는 자동미분, Adam과 L-BFGS가 사용
- $\chi^2$의 곡률로부터 얻는 피팅 매개변수의 공분산
labels:
  geometry: Adam 피팅의 기하
  start_Om: Adam 시작값 $\Omega_m$
  start_OL: Adam 시작값 $\Omega_\Lambda$
  steps: Adam 반복 횟수
  lr: Adam 학습률
  grid: 축당 격자점 수($\chi^2$ 등고선)
  z_min: 최소 적색편이 $z_\mathrm{min}$
