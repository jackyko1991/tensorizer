  m2: {default: -1.0, min: -4.0, max: -0.1, step: 0.1, label: 'Tachyonic mass$^2$ of the field $m^2$'}
  lam: {default: 1.0, min: 0.1, max: 5.0, step: 0.1, label: 'Self-coupling $\lambda$'}
