title: Charging a capacitor (RC circuit)
category: em
level: beginner
order: 3
summary: >
  A capacitor charging through a resistor obeys $dV/dt = (V_s - V)/(RC)$. Several circuits with different resistances
  are stacked into one tensor of voltages, so a single Runge–Kutta step advances all of them. Switch the source to a
  square wave to watch the capacitors charge and discharge.
animated: true
vector_form: 'V_s = R\,I + V,\qquad I = C\,\frac{dV}{dt}\;\;\Rightarrow\;\;\frac{dV}{dt} = \frac{V_s - V}{RC}'
index_form: '\dot V_b = \frac{V_s - V_b}{R_b\,C},\qquad I_b = \frac{V_s - V_b}{R_b},\qquad U_b = \tfrac12\,C\,V_b^2'
translation:
  - {symbol: 'V_b', code: 'V', shape: '(B,)', meaning: 'voltage across capacitor $b$ (one entry per circuit)'}
  - {symbol: 'R_b', code: 'R', shape: '(B,)', meaning: 'resistance of circuit $b$'}
  - {symbol: 'C', code: 'C', shape: 'scalar', meaning: 'capacitance, the same in every circuit'}
  - {symbol: 'V_s(t)', code: 'source(t, V0, shape, period)', shape: 'scalar', meaning: 'source voltage, shared by all circuits (broadcast over $b$)'}
  - {symbol: '\dot V_b', code: '(Vs - V) / (R * C)', shape: '(B,)', meaning: 'element-wise: index $b$ appears once on each side, nothing is summed'}
  - {symbol: 'I_b', code: 'current(V, Vs, R)', shape: '(T, B)', meaning: 'current through each resistor'}
  - {symbol: 'U_b', code: 'stored_energy(V, C)', shape: '(B,)', meaning: 'energy stored in each capacitor'}
notes: >
  Units: $R$ in kΩ and $C$ in mF, so $\tau = RC$ comes out in seconds and $I$ in mA. After one time constant the capacitor
  holds 63 % of the source voltage, after $5\tau$ it is practically full. While charging from a battery the source
  delivers $CV_s^2$ of energy: exactly half ends up in the capacitor, the other half is turned into heat in $R$ —
  whatever the value of $R$.
params:
  V_s: {default: 5.0, min: 1, max: 12, step: 0.5, label: Source voltage, unit: V}
  C: {default: 1.0, min: 0.1, max: 5, step: 0.1, label: Capacitance, unit: mF}
  R_min: {default: 0.5, min: 0.1, max: 5, step: 0.1, label: Smallest resistance, unit: kΩ}
  R_max: {default: 4.0, min: 0.5, max: 10, step: 0.5, label: Largest resistance, unit: kΩ}
  n_circuits: {default: 4, min: 1, max: 6, step: 1, type: int, label: Circuits}
  source: {default: step, type: choice, options: [step, square], label: Source}
  period: {default: 12.0, min: 2, max: 30, step: 1, label: Square-wave period, unit: s}
  t_max: {default: 20.0, min: 2, max: 60, step: 1, label: Simulated time, unit: s}
