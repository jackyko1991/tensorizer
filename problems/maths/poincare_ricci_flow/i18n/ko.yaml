source_hash: 51ed4214e669
title: 푸앵카레 추측과 리치 흐름
summary: '증명됨: 모든 닫힌 단순 연결 3차원 다양체는 3차원 구면입니다(페렐만 2002–03, 해밀턴의 리치 흐름 프로그램을 완성). 리치 흐름 $\partial_t g = -2\,\mathrm{Ric}$는 열이 온도를 고르게 하듯 계량을 매끄럽게 합니다. 여기서는 울퉁불퉁한 2차원 구면들의 배치를 둥글게 만들고(가우스–보네 $\int K\,dA = 4\pi$가 반올림 오차 수준까지 성립), 아령 모양 3차원 구면의 목을 유한 시간 안에 조여 끊습니다: 이것이 바로 페렐만의 수술이 잘라내는 특이점이며, 그 뒤 각 조각은 둥글게 됩니다.'
notes: '상태: 증명됨. 푸앵카레는 1904년에, 모든 고리를 한 점으로 줄일 수 있는 닫힌 3차원 다양체가 반드시 3차원 구면이어야 하는지를 물었습니다. 해밀턴은 1982년에 리치 흐름을 도입하고, 양의 리치 곡률을 갖는 3차원 다양체가 둥근 계량으로 흘러감을 증명했습니다. 2차원에서는 구면 위의 모든 계량이 둥글게 되며(해밀턴 1988, 차우 1991), 울퉁불퉁한 구면들이 이를 보여 줍니다: $K$의 퍼짐은 0으로 감소하고 $\int K\,dA = 4\pi$와 넓이는 고정됩니다. $l = 1$ 조화 함수는 둥근 구면의 등각 운동이어서 감쇠하지 않지만, 모양을 바꾸지는 않습니다. 3차원에서는 흐름에 특이점이 생길 수 있습니다. 목이 충분히 가는 회전 대칭 아령에 대해 앵거넌트와 크노프(2004)는 목 조임(neckpinch)을 증명했습니다: 목은 원기둥 $S^2 \times \mathbb R$처럼 줄어들어 $\psi_\mathrm{neck}^2 \approx 2(T - t)$가 되고, 양쪽 구근 부분은 크게 남습니다. 페렐만의 논문들(arXiv 2002–03)은 3차원의 모든 특이점을 통제하고(국소 붕괴 없음, 표준 근방), 목을 잘라 뚜껑을 씌우는 수술을 동반한 리치 흐름을 정의했으며, 단순 연결 다양체에서는 흐름이 유한 시간 안에 소멸하고 각 조각이 사라지기 직전에 둥근 구면이 됨을 보여, 그 다양체가 3차원 구면이었음을 밝혔습니다. 이 증명은 클라이너–롯, 모건–톈, 차오–주에 의해 자세히 검증되었으며, 페렐만은 2006년 필즈상과 2010년 클레이 밀레니엄 상을 거절했습니다. 수치 기법: 곡면은 극각 방향의 유한 체적 격자를 사용하므로 이산 가우스–보네가 정확히 성립합니다. 3차원 구면은 극에서 정칙인 등각 형식으로 쓰였고(호 길이 형식은 그곳에서 $\psi \to 0$으로 나누어 불안정함), 목이 가늘어질수록 구근 부분이 극 쪽으로 압축되므로 셀을 극 쪽에 조밀하게 배치합니다. 흐름은 목 반지름이 $0.05$일 때 멈추며, 이때 구근 부분은 아직
  분해됩니다. 여기의 수술은 페렐만의 구성을 단순화한 그림일 뿐입니다. 굵은 목($\varepsilon \gtrsim 0.5$)을 시도해 보세요: 조여 끊기지 않고 구면 전체가 둥글게 됩니다.'
meanings:
- 각 울퉁불퉁한 구면 $b$의 등각 인자, 계량 $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$, 셀 $i$에서
- '반복되는 $j$ ⇒ 합산: 둥근 구면의 플럭스 형식 라플라시안; 그 플럭스는 극에서 0이 됨'
- 등각 계량의 가우스 곡률; 곡면 위의 리치 흐름은 $\partial_t g = -2Kg$
- '전체 곡률: 모든 계량에 대해 정확히 $4\pi$(이산 가우스–보네), 매 단계의 검사'
- 정규화된 흐름의 평균 곡률 목표값; 각 넓이를 고정시킴
- 3차원 구면 $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$의 단면 곡률 $-\psi_{ss}/\psi$와 $(1-\psi_s^2)/\psi^2$, 여기서 $\psi = e^u\sin x$
- 계량을 등각 형식으로 유지하는 미분동형(게이지) 항; 좌표를 바꿀 뿐 기하는 바꾸지 않음
- 가장 작은 $S^2$ 단면의 반지름; $\psi_\mathrm{neck}^2$는 조임이 일어날 때까지 대략 원기둥 비율 $2$로 감소함
- 곡률이 큰 목을 잘라내고 단면 곡선에 접하는 둥근 뚜껑을 붙임(페렐만 수술의 단순화된 그림)
labels:
  neck: 아령의 초기 목 반지름 $\varepsilon$
  t_surface: 곡면의 흐름 시간
  cells: 격자 셀 수 $N$
