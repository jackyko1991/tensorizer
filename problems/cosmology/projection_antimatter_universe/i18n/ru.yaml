title: Где может быть антиматерия? Критерии антиматериальной Вселенной
summary: Спекулятивная гипотеза, а не установленная физика. Шаг 2 показал, что одна мировая линия, пересекающая каждый срез времени, даёт поровну материи и антиматерии, тогда как мы видим около $10^{80}$ барионов и никакой антиматерии. Путь к спасению — мировая линия, сбалансированная глобально, с антиматерией где-то далеко или в зеркальной Вселенной. Этот шаг перечисляет, каким условиям должна удовлетворять такая антиматериальная Вселенная, и проверяет каждый критерий по данным. В космических лучах нет антиядер, а от скоплений галактик нет аннигиляционного гамма-излучения. Домены должны быть не меньше горизонта, около 16 Gpc. Случайная мировая линия фантастически маловероятна. Остаётся CPT-симметричная Вселенная Бойла, Финна и Турока, чьи предсказания (безмассовое легчайшее нейтрино, $r = 0$) пока согласуются с данными и могут не подтвердиться.
notes: 'Статус: спекулятивно. Это собственная гипотеза автора (см. описание серии), а не установленная физика. Шаг 7 гипотезы проекции, теоретический шаг для постулата P3 (все частицы — проекции одного объекта). Шаг 1 (cosmology/projection_postulate) сформулировал постулаты. Шаг 2 (cosmology/projection_one_particle) исключил простейшую форму P3: замкнутая мировая линия пересекает каждый срез времени вперёд (материя) столько же раз, сколько назад (антиматерия), открытая добавляет не больше одной частицы в итоге, а во Вселенной около $9\times10^{79}$ барионов и нет антиматерии. Шаги 3–6 (projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests) проверили P5, P4 и P1-P2. Этот шаг идёт по пути спасения, указанному в шаге 2. Мировая линия сбалансирована глобально, а антиматерия находится за нашим горизонтом или в антивселенной. Вопрос в том, каким условиям должна удовлетворять такая антиматериальная Вселенная, чтобы согласовываться с постулатами,
  и удовлетворяет ли она им. Сначала известная физика. Условия Сахарова (1967) объясняют избыток материи нарушением барионного числа, нарушением C и CP и отклонением от равновесия. Они предсказывают Вселенную, всюду состоящую из материи, с $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (Planck 2018, $\Omega_b h^2 = 0.0224$). Альтернатива — симметричная Вселенная с раздельными областями материи и антиматерии — изучалась с 1960-х годов (Альвен и Клейн, Омнес). Steigman (ARA&A 14, 339, 1976) сделал обзор проверок, а Cohen, De Rújula and Glashow (ApJ 495, 539, 1998) закрыли вопрос о доменах внутри видимой Вселенной. Все данные взяты из data/antimatter_criteria.csv, где собраны цитируемые числа с их источниками. Число измерений $D$, в котором живёт мировая линия, — параметр. Входит только её временная координата, поэтому ни один результат не зависит от $D$. Критерий 1: поблизости нет примешанной антиматерии. BESS-Polar не нашёл ни одного ядра антигелия среди примерно 48 миллионов ядер гелия. Предел
  на уровне 95% — антигелий/гелий $< 6.9\times10^{-8}$ для спектра, подобного гелиевому, и $1.0\times10^{-7}$ без этого предположения (Abe et al., PRL 108, 131301, 2012). AMS-02 не опубликовал ни одного обнаружения антиядра. Гамма-излучение: в горячем газе скопления доля антипротонов $f$ аннигилирует с темпом $f\,n_p^2\langle\sigma v\rangle$, где $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s (выбор по порядку величины). Каждая аннигиляция даёт 2.1 фотона выше 100 MeV в используемом здесь спектре распада пионов. Для скопления Волосы Вероники (Coma; бета-модель, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$) и предела Fermi-LAT $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016) это даёт $f < 9\times10^{-8}$. Выполнено: любая антиматерия должна находиться вне скоплений и за пределами досягаемости космических лучей, которые удерживаются в пределах десятков Mpc. Критерий 2: внутри нашего горизонта нет доменов. Если бы
  домены материи и антиматерии сопутствующего размера $d$ соприкасались, аннигиляция на их стенках после рекомбинации была бы неизбежна. Модель здесь — упрощённая версия аргумента Коэна, Де Рухулы и Глэшоу. Площадь стенок на единицу объёма равна $3/d$ для кубов со стороной $d$ ($n/d$ в $n$ измерениях, проверено), а барионы втекают в стенки со скоростью, в $\kappa$ раз превышающей скорость звука в газе. Температура газа следует за температурой CMB до $z\approx150$, а затем газ остывает адиабатически. Каждая аннигиляция даёт 3 фотона от распада нейтральных пионов. Фотоны претерпевают красное смещение до сегодняшнего дня, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$, и этот интеграл сверяется с замкнутой формулой. Аннигиляция учитывается от рекомбинации ($z_{max} = 1000$) до $z = 20$. Как и у CDG, более поздние эпохи опущены, потому что они зависят от формирования структур; их учёт только увеличил бы поток. Поток в точности $\propto 1/d$ (проверено). Он сравнивается с фоном COMPTEL,
  $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ от 0.8 до 30 MeV (Kappadath et al. 1996), и с изотропным фоном Fermi-LAT ($7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ выше 100 MeV, индекс 2.32, обрезание 279 GeV; Ackermann et al., ApJ 799, 86, 2015). Фотоны с $z\sim20$-$300$ приходят с энергиями от 1 до 10 MeV, где предел задаёт COMPTEL. Результат: предсказание превышает данные в 160 раз для $d = 100$ Mpc, в 16 раз для 1 Gpc и в 1.6 раза для 10 Gpc. Минимальный размер домена $d_{min}\approx16$ Gpc (при 8.5 MeV, $\kappa = 1$), что больше радиуса наблюдаемой Вселенной 14.3 Gpc. CDG пришли к тому же выводу: домен материи должен составлять почти всю видимую Вселенную. Это игрушечная модель, и $d_{min}$ масштабируется с $\kappa$. CDG утверждают, что нагрев от аннигиляции ускоряет приток, а это усиливает ограничение. Ограничено: любая антиматерия должна находиться за нашим горизонтом, где ни один телескоп не может её проверить. Критерий 3: тонкая
  подстройка. Предположим, что антиматерия находится за горизонтом на том же срезе и ничто её не упорядочивает. Тогда сбалансированная случайная мировая линия даёт нашей области суммарный заряд порядка $\sqrt M$ при $M$ пересечениях. Дисперсия суммарного заряда равна $M$, или $M(T-M)/(T-1)$, когда полное число из $T$ пересечений сбалансировано (оба случая проверены). Вероятность большого избытка следует функции скорости Крамера, $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$, что сверяется с точным биномиальным хвостом. Сегодня мы видим $N_B\approx9\times10^{79}$ барионов и никакой антиматерии, поэтому все пересечения должны иметь один и тот же знак: $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$. Если же понимать это как избыток в ранней Вселенной, $9\times10^{79}$ среди примерно $1.5\times10^{89}$ пар (по одной на фотон), то $\log_{10}P\approx-1.2\times10^{70}$. Без механизма сбалансированная мировая линия не проходит. Механизмом должно было бы быть граничное условие, коррелирующее знаки
  всех пересечений в нашей области: симметрия, а не флуктуация. Критерий 4: CPT-симметричная Вселенная. Boyle, Finn and Turok (PRL 121, 251301, 2018) предполагают, что Вселенная после Большого взрыва — это CPT-зеркальное отражение Вселенной до него, так что пара в целом не нарушает CPT-симметрию. Далее следует сопоставление P3 с этой моделью, предложенное автором. Мировая линия, пересекающая $t = 0$, — это материя на нашей стороне. Наблюдатели в зеркале имеют противоположную стрелу времени, поэтому тот же участок они видят как антиматерию. Оговорка, доказанная в шаге 2, по-прежнему действует: на любом полном срезе одна непрерывная мировая линия имеет $|Q|\leq1$, поэтому одно лишь зеркало не помогает. Сопоставление работает, если мировая линия делает обороты через Большой взрыв и через будущую границу, а два конца конформного времени склеены. Это дополнительное предположение сверх опубликованной модели — расширение C из шага 2 в новом месте. Петля, делающая $w$ оборотов, даёт $+w$ на каждом
  срезе нашей стороны и $-w$ на каждом зеркальном срезе, если считывать со стрелой времени самого зеркала. Сумма равна нулю (проверено). Избыток теперь — топологическое целое число, а не флуктуация, хотя $w\approx10^{80}$ по-прежнему задаётся вручную. Опубликованные предсказания модели (из аннотации статьи Бойла, Финна и Турока), проверенные по цитируемым числам: (a) Легчайшее нейтрино безмассово. С расщеплениями NuFIT 6.0 ($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, $\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ для нормального, $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ для обратного упорядочения) это фиксирует $\Sigma m_\nu = 0.0588$ eV (нормальное упорядочение масс нейтрино) или $0.0989$ eV (обратное), а также $m_\beta = 0.009$ или $0.049$ eV. KATRIN ограничивает $m_\beta$ сверху значениями 0.8 eV (Nature Physics 18, 160, 2022) и 0.45 eV (Science 388, 180, 2025), что намного выше обоих значений. Planck 2018 даёт $\Sigma m_\nu < 0.12$ eV, что допускает оба варианта. DESI 2024 ($<
  0.072$ eV) и DESI DR2 ($< 0.064$ eV, $\Lambda$CDM) исключают обратный случай и допускают нормальный. DESI DR2 также отмечает напряжение с нижней границей из осцилляций, и безмассовое легчайшее нейтрино — это случай с наименьшим напряжением. (b) Тёмная материя — стабильное правое нейтрино с массой $4.8\times10^8$ GeV. Это далеко за пределами возможностей любого коллайдера и не даёт сигнала в экспериментах по прямому детектированию, поэтому сейчас это проверить нельзя. (c) Первичных гравитационных волн нет, поэтому $r = 0$. BICEP/Keck даёт $r < 0.036$ (95%, PRL 127, 151301, 2021), что согласуется. Настоящая проверка — $\sigma(r)\sim10^{-3}$: это была цель CMB-S4 (проект был остановлен в июле 2025 года), а теперь — LiteBIRD и Simons Observatory. Итоговая таблица. (1) Поблизости ничего не примешано: требуется; выполнено. Одно-единственное ядро антигелия или аннигиляционное гамма-излучение от скопления опровергли бы это. (2) Внутри горизонта нет доменов: требуется; ограничено ($d\gtrsim16$
  Gpc). Избыток MeV-фона или искажение CMB от более близких стенок опровергли бы это; за горизонтом это непроверяемо. (3) Отсутствие тонкой подстройки: требуется; для случайной мировой линии не выполняется ($\log_{10}P\sim-10^{70}$ до $-10^{79}$), и только механизм снимает проблему. (4a) Легчайшее нейтрино безмассово: ограничено, пока согласуется. Измеренная легчайшая масса больше нуля опровергнет это, например $\Sigma m_\nu$ явно выше 0.0588 eV при нормальном упорядочении. (4b) Тёмная материя из тяжёлых правых нейтрино: сейчас непроверяемо. Отождествление тёмной материи с чем-то иным опровергло бы это. (4c) $r = 0$: согласуется. Первичные B-моды с $r\gg10^{-3}$ опровергли бы это. Итог: расширенный P3 выживает лишь как одна мировая линия, сбалансированная через CPT-зеркальную Вселенную и делающая обороты через Большой взрыв. В этой форме он наследует фальсифицируемые предсказания. Ненулевая масса легчайшего нейтрино или первичные B-моды с $r\gg0$ опровергли бы сопоставление с CPT-зеркалом.
  Предыдущие шаги либо воспроизводили стандартную физику, либо сталкивались с данными, которые гипотеза могла поглотить. Это первый шаг в серии с проверкой, которая может не пройти.'
meanings:
- 'повторяющееся $z$ ⇒ суммирование: интенсивность диффузного гамма-излучения сегодня для каждого размера домена $d$ и энергии фотона $E$'
- 'аннигиляции на сопутствующий cm$^3$ в секунду на стенках: площадь стенок на единицу объёма $3/d$, умноженная на приток $n_b v$'
- фотоны на MeV от одной аннигиляции при испущенной энергии; повторяющееся $j$ (энергия пиона) ⇒ суммирование
- наименьший размер домена, допускаемый фонами COMPTEL и Fermi-LAT (поток в точности $\propto 1/d$)
- наибольшая доля антипротонов в газе скопления Волосы Вероники (Coma) по пределу потока Fermi-LAT
- суммарный заряд $M$ пересечений со случайными знаками; его дисперсия равна $M$
- вероятность того, что случайная мировая линия даёт нашей области суммарный заряд $Q$ из $M$ пересечений (функция скорости Крамера)
- суммарный заряд на наших срезах и на их CPT-образах, каждый считывается со своей стрелой времени; повторяющееся $s$ (сегмент) ⇒ суммирование
- сумма масс нейтрино по легчайшей массе $m_l$ и расщеплениям NuFIT
labels:
  dims: Размерность $D$ пространства, в котором живёт мировая линия (открытый параметр)
  speed_factor: Скорость притока в стенки $\kappa$ в единицах скорости звука в газе
  z_max: Красное смещение $z_{max}$, с которого начинается аннигиляция на стенках (рекомбинация)
  winding: Число оборотов $w$ мировой линии через Большой взрыв
