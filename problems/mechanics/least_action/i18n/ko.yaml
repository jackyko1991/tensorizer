source_hash: 31fa57e56a24
title: '최소 작용의 원리: 경사 하강법으로 경로 찾기'
summary: 양 끝이 고정된 경로를 점 $q_n$들로 쪼개고, 작용 $S = \sum_n L\,\Delta t$를 하나의 텐서 식으로 쓴 뒤, autograd와 옵티마이저가 틀린 추측들의 배치를 $\partial S/\partial q_n = 0$이 될 때까지 내리막으로 미끄러뜨리게 합니다. 추측들은 던진 공의 포물선이나 진동자의 사인 곡선에 안착합니다.
notes: 여기서 자연은 한 단계씩 앞으로 적분하지 않습니다. 어디서 시작해서 어디서 끝나야 하는지 알고서 경로 전체를 한꺼번에 조정합니다. $\partial S/\partial q_n = 0$으로 놓으면 이산 오일러–라그랑주 방정식 $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 = -V'(q_n)$을 얻는데, 이는 베를레 방법과 정확히 같습니다. 균일한 중력에서는 반올림 오차 수준까지 포물선을 재현하고, 진동자에서는 $O(\Delta t^2)$까지 재현합니다. 이 원리는 사실 정상 작용의 원리입니다. 진동자의 경우 헤세 행렬의 가장 작은 고윳값이 약 $m\Delta t\,(\pi^2/T^2 - \omega^2)$이므로, $T$가 반주기 $\pi/\omega$를 넘으면 참 경로는 $S$의 안장점이 되어 경사 하강법은 발산합니다. 그래서 코드는 어떤 정상점이든 찾아내는 뉴턴 단계 $x \leftarrow x - \alpha H^{-1}\nabla S$로 전환합니다. 매끄럽고 긴 흔들림이 가장 느리게 이완하고(가장 작은 헤세 고윳값), 짧은 흔들림은 몇 번의 반복 안에 사라집니다.
meanings:
- 시각 $t_n = n\,\Delta t$에서의 시험 경로 $b$. $q_{b0}$와 $q_{bN}$은 고정
- '대각선에 $-1$, 그 오른쪽에 $+1$: $(Dq)_n = q_{n+1} - q_n$'
- '반복된 $k$ ⇒ 합: 모든 경로의 모든 단계에서의 속도'
- 운동 에너지 빼기 퍼텐셜 에너지를 단계별로 합한 것. $V$는 각 단계의 왼쪽 끝에서 계산
- 자유로운 내부 점들에 대한 기울기. 경로들이 독립이므로 역전파 한 번으로 모두 처리
- 모멘텀이 있는 경사 하강법, $\eta = 0.8\,\Delta t/m$
- '헤세 행렬: 삼중대각 행렬로, 대각선에 $2m/\Delta t - V''''\Delta t$, 그 옆에 $-m/\Delta t$'
- 이산 오일러–라그랑주 방정식 $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 + V'(q_n)$, 곧 베를레 방법. $\partial S/\partial q_n = -\Delta t\,r_n$
labels:
  system: 계
  method: 방법
  T: 전체 시간 $T$
  omega: 진동자 진동수 $\omega$
  q_start: 시작점 $q_0$
  q_end: 끝점 $q_N$
  n_steps: 시간 단계 수 $N$
  n_paths: 시험 경로 수
  wiggle: 시험 경로의 흔들림
  n_iter: 반복 횟수
