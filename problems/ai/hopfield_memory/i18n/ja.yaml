title: Hopfield ネットワーク：古典的および現代的な連想記憶
summary: 壊れた、あるいは半分隠れた版から絵を補完する記憶。古典的な Hopfield ネットワークは 2 値パターンをヘッブ則の重み $W_{ij}$ に蓄え、エネルギーの坂を下っていく。ランダムなパターンは最大でおよそ $0.138\,N$ 個しか保持できず、相関のあるパターンではそれよりずっと少ない。Ramsauer ら（2020）の現代的な連続 Hopfield ネットワークはパターンそのものを保持し、$\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$ で更新する。これはトランスフォーマーのアテンションそのものであり、古典的ネットワークが混同してしまう漫画の顔を 1 ステップで取り出す。
notes: これらの顔は誰かの画像ではない：どれも数個の乱数（頭の形、目、眼鏡、眉、鼻、口の曲がり具合、髪、耳）からコードが描いたもので、著作権のあるキャラクターや写真は一切使っていない。各クエリでは顔の下側 40 % を隠し、残りのピクセルの 5 % を反転させる。ランダムなパターンに対する古典的ネットワークの限界 $\alpha_c \approx 0.138$ は、Amit、Gutfreund、Sompolinsky（1985）がスピングラスの手法で計算したもので、1 ステップのビット誤り率はガウス型クロストーク則 $\Phi(-1/\sqrt\alpha)$ に従う（どちらもテストで確認している）。顔どうしは強く相関している（輪郭と大量の白紙部分を共有している）ため、古典的ネットワークは $0.138$ よりはるかに低い負荷ですでに顔を混同し、複数の顔の混合状態に落ち込む。現代的ネットワークのエネルギーには log-sum-exp 項があり、Ramsauer らは、それが更新のたびに減少すること、通常は 1 回の更新で十分であること、よく分離したパターンに対しては容量が $N$ とともに指数的に増えることを証明した。その更新は、蓄えたパターンをキーとバリューとするトランスフォーマーのアテンションと完全に一致する。$\beta$ を小さくすると、1 つの顔ではなく複数の顔の準安定な平均が見られる。このアイデアは論文に付随するブログ記事に従ったもので、そこで使われた漫画の画像の代わりに手続き的に生成した顔を用いている。
meanings:
- パターン $\mu$：手続き的に描いた漫画の顔、インクが $+1$、紙が $-1$、$N = 32 \times 32$ ピクセル
- ヘッブ則。繰り返される $\mu$ ⇒ 和をとる；蓄える顔の数ごとにネットワーク $f$ を 1 つ用意し、対角成分は 0
- 繰り返される $j$ ⇒ 和をとる：各ネットワーク・各クエリでニューロン $i$ に働く場；$s_i$ はその符号をとる
- エネルギー；1 ニューロンずつの更新では決して増えない
- 繰り返される $n$ ⇒ 和をとる：クエリと各記憶パターンとの類似度を $\beta$ で鋭くしたもの
- 繰り返される $\mu$ ⇒ 和をとる：新しい状態はパターンの重み付き平均で、$\beta$ が大きいと 1 つのパターンになる
- 想起の質：顔が完全に復元されると 1
labels:
  n_faces: 蓄える顔の最大数 $P$
  beta: 逆温度 $\beta$
  mask: 各顔の隠す割合
  noise: 反転するピクセル
  sweeps: 古典的更新のスイープ回数
  n_random: 容量曲線のニューロン数 $N$
