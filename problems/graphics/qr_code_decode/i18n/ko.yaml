source_hash: 56bd5dd35d76
title: 사진에서 QR 코드 읽기
summary: 버전 1–3 QR 코드를 처음부터 만들고(파인더, 타이밍, 정렬 패턴, BCH 형식 비트, 벌점으로 고른 마스크, GF(256) 위의 리드–솔로몬), 무작위 호모그래피, 흐림, 잡음, 고르지 않은 조명, 그리고 위를 가린 엄지손가락과 함께 촬영한 다음, 텐서 파이프라인으로 다시 읽어 낸다. 적응형 임계값, 1:1:3:1:1 파인더를 위한 정합 필터, DLT 호모그래피와 grid_sample, 그리고 $\mathrm{GF}(2^8)$ 산술을 테이블 조회(gather)로 수행하는 BCH 및 리드–솔로몬 복호화다.
notes: 'ZXing 같은 실제 판독기도 같은 개요를 따른다. 국소 임계값으로 이진화하고, 행을 훑어 파인더의 1:1:3:1:1 런 패턴을 찾은 뒤 열과 대각선 방향으로 확인하고, 직각을 이루는 파인더 세 개를 고르고, 그 간격에서 모듈 크기와 버전을 추정하고, 아핀 추측이 가리키는 위치 근처에서 정렬 패턴을 찾고, 원근 변환을 맞추고, 격자를 샘플링한 다음, 형식 정보와 리드–솔로몬 층을 복호화한다. 여기서는 또한 알려진 모듈(파인더, 타이밍, 정렬, 여백)과 이미지의 상관을 grid_sample로 최대화하여 호모그래피를 다듬고, 템플릿이 가장 잘 맞는 버전을 고른다. 네 가지 오류 정정 수준 L, M, Q, H는 코드워드의 대략 7, 15, 25, 30 %를 복구한다. ECC 바이트가 $T$개이면 블록 하나는 미지의 바이트 오류를 $\lfloor T/2 \rfloor$개 정정한다(위치를 안다면, 즉 소거라면 두 배). 심볼의 비율 $f$를 덮는 얼룩은 코드워드의 $f$보다 많은 부분에 닿는다. 모든 바이트가 $2\times4$ 모듈 블록이기 때문이며, 그래서 성공 곡선은 그 백분율보다 아래로 떨어진다. 마스크는 데이터 모듈에만 적용되고 $M \oplus M = 0$이므로 마스크 해제도 같은 XOR이다. 인코더는 8개 마스크를 하나의 배치로 모두 시도하고 벌점이 가장 낮은 것을 남긴다(런, $2\times2$ 블록, 파인더와 비슷한 모양, 어두운 모듈 균형). 검증: 리드–솔로몬 인코더는 ISO/IEC 18004의 풀이 예제(''01234567''을 버전 1-M으로)의 ECC 바이트를 재현하고, 형식 워드는 표준의 표와 일치한다. 나머지는 왕복 변환과 0 신드롬으로 검사한다. 단순화: 바이트 모드만, 버전 1–3만(정렬 패턴 하나, 버전 정보 블록 없음), 거울상 심볼 없음, 소거 복호화 없음. 버전 1에는 정렬 패턴이 없으므로 강한 원근에 가장 취약하다. 참고 문헌: ISO/IEC 18004 (QR code symbology); I. S. Reed and
  G. Solomon, Polynomial codes over certain finite fields, J. SIAM 8 (1960) 300–304.'
meanings:
- 테이블 조회 두 번으로 계산하는 GF(256) 곱; $\alpha = 2$는 $x^8+x^4+x^3+x^2+1$ (0x11D)을 법으로 0이 아닌 255개 바이트를 모두 생성; $\oplus$는 XOR
- '합하는 인덱스 $i$에 대한 XOR: 8개 비트 평면 각각을 2를 법으로 더함'
- '체계적 리드–솔로몬: $G$의 $i$번째 행은 $x^{T+k-1-i} \bmod g(x)$이므로 ECC 바이트는 데이터에 대해 선형'
- $\alpha^j$에서 평가한 블록 다항식; 코드워드일 때 정확히 모두 0
- 벌러캠프–매시(Berlekamp–Massey)로 구한 오류 위치 다항식(torch.where로 배치 처리), 모든 위치에 대한 Chien 탐색으로 구한 근, 크기 $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$ (Forney)
- 생성자 0x537, XOR 0x5412인 BCH(15,5); 32개 코드워드 중 가장 가까운 것으로 비트 오류를 3개까지 정정
- '픽셀이 자신의 $31\times31$ 박스 평균(conv2d)에서 $c$를 뺀 값보다 낮으면 어두움: 고르지 않은 조명을 따라감'
- 행과 열을 따라 11개 스케일 $s$에서 1:1:3:1:1 분포를 찾는 정합 필터 $K^s$; 봉우리가 파인더 중심(대각선 방향으로도 확인)
- '파인더 중심 3개 + 정렬 패턴(버전 1: 평행사변형의 꼭짓점)으로 DLT/SVD, 그다음 알려진 모든 모듈과의 일치도에 대한 경사 상승으로 다듬음'
- 모듈 $(i, j)$를 그 안의 $3\times3$ 점에서 읽음; 그다음 마스크 해제(XOR, 대합)하고 지그재그 순서로 읽음
labels:
  message: 메시지
  version: 최소 버전(메시지가 들어가지 않으면 올림)
  ecc: 오류 정정 수준
  perspective: 원근 강도(꼭짓점 이동 / 변 길이)
  occlusion: 심볼이 가려진 비율
  noise: 픽셀 잡음 $\sigma$
