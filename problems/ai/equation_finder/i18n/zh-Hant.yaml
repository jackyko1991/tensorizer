title: 方程式搜尋器：寫出資料背後支配方程式的張量 AI
summary: 給它場資料，它會以 LaTeX 傳回定律。候選項目庫（$1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$）以有限差分、Savitzky–Golay 濾波器或弱形式建立，再由逐次閾值嶺迴歸（PDE-FIND）保留少數能解釋 $\partial_t u$ 的項。它從模擬資料中還原 Lorenz 系統、熱方程、黏性 Burgers 方程，以及由 Yee FDTD 模擬得到的 Maxwell 方程組（$c$ 的誤差為 0.2 %，弱形式為 0.03 %），並找出隱藏在項目庫中的 $\nabla\cdot\mathbf B = 0$；雜訊研究則顯示每種導數估計方法在何處失效。
notes: 構想。這是 Jacky Ka Long Ko 的「自動物理方程式搜尋器」：一個小型張量 AI，觀察場資料並以 LaTeX 寫出支配它的方程式（SINDy / PDE-FIND 方法）。它延續 MNIST 上的算子搜尋，那次的結論是「手寫數字沒有支配方程式」；這裡的資料來自定律，所以有東西可找。架構分為三個模組：(1) 去雜訊平滑器，(2) einsum / 有限差分導數引擎，(3) 稀疏算子迴歸。這裡 (2) 與 (3) 已完成，(1) 是 Savitzky–Golay 平滑器（不需要神經網路）。方法。每個候選項都是場的單項式的導數 $D^\alpha(\prod_g u_g^{p_g})$：Lorenz 系統用最高 3 次的 20 個單項式，一維方程用 13 項 $D^d(u^p)$（$p, d \le 3$），Maxwell 用 17 項（場本身、其 $x$ 與 $y$ 導數、其拉普拉斯算子、幾個乘積）。建立線性系統 $\partial_t u = \Theta\xi$ 有三種方式：中央有限差分（fd）；Savitzky–Golay（sg：先在 7 個樣本上做三次平滑，再在 9 個樣本上做四次導數擬合），兩者都是逐軸的一維摺積；以及弱形式（weak SINDy，Messenger and Bortz 2021），將方程式對凸塊函數 $(1-s^2)^{10}$ 積分，並以分部積分把所有導數移到凸塊函數上，每軸一次張量縮並。接著在單位範數的欄上執行 STRidge（Rudy et al. 2017）：嶺迴歸、把小於 $\tau$ 的係數全部歸零、重新擬合、重複；對 3 種嶺強度掃描 41 個閾值，保留的模型是驗證誤差在最佳值 5 %（+ $10^{-3}$）以內、且項數最少者。較大的嶺強度對 Maxwell 很重要：由於 $\nabla\cdot\mathbf B = 0$，欄 $\partial_x B_x$ 與 $\partial_y B_y$ 幾乎反向，嶺太弱時迴歸會在 $E_z$ 方程中加入 $2200\,\nabla\cdot\mathbf B$。係數以最小平方法在保留的項上重新擬合，± 由對列的 bootstrap 求得；這個 ± 僅是統計誤差，不包含導數估計的偏差，因此往往遠小於真實誤差。另一種迴歸是 operator_search_mnist
  的 DARTS 式鬆弛：$\xi = \sigma(\alpha/T)\,w$ 加上閘門懲罰，溫度從 1 退火至 0.01。資料全部在此模擬：8 條 Lorenz 軌跡（RK4）；10 cm 週期性細棒上的熱方程，以 Fourier 模態求精確解（$D$ = 0.2 cm²/s）；$2\pi$ m 上的黏性 Burgers 方程，以 Cole–Hopf 變換求精確解（$\nu$ = 0.1 m²/s）；週期性 6.4 cm 箱中的 Maxwell 方程，由 Yee FDTD 模擬（TM 模態，0.5 mm 網格，Courant 數 0.5），並像實際量測一樣取樣（所有場內插到相同的點與時間）。雜訊：高斯雜訊，為各場標準差的 0、0.1、1 和 5 %。結果。測試檢查：核與弱形式在微積分上應精確之處確實精確；資料符合其定律（熱核、Cole–Hopf、Yee 將 $\nabla\cdot\mathbf B = 0$ 維持在捨入誤差內，並使能量守恆在 0.2 % 以內）；STRidge 能精確還原植入的稀疏向量；每個目標都能從乾淨資料還原；寫出的 LaTeX 經剖析器讀回後能重現擬合的模型。隨附的執行結果（乾淨資料、有限差分）：Lorenz $\sigma$ = 9.9987、$\rho$ = 27.989、$\beta$ = 2.6662；熱方程 $D$ = 0.20023 cm²/s；Burgers $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$；Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$，$c$ = 29.92 cm/ns（真值 29.98），以及係數 0.996 的 $\partial_t \mathbf B = -\nabla\times\mathbf E$。弱形式準確得多（精確資料上誤差為 $10^{-8}$；Maxwell 上為 0.03 %，這是 Yee 格式本身的數值色散，而非搜尋器的誤差）。Maxwell 項目庫的最小奇異向量為 $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$，其奇異值比下一個小 220 倍：資料揭示 $\nabla\cdot\mathbf B = 0$ 是一條隱含定律。雜訊（是否找到正確的項？）：有限差分在熱方程與
  Burgers 上從 0.1 % 雜訊起失敗，在 Lorenz 上從 1 % 起失敗，只有 Maxwell 能撐過 5 %（係數誤差 25 %）；Savitzky–Golay 在所有情況都撐過 0.1 %，只有 Maxwell 撐過 5 %；弱形式在熱方程、Burgers 與 Maxwell 上於所有雜訊等級都找到正確的項（5 % 雜訊下係數誤差分別為 7 %、6 % 和 0.1 %），Lorenz 則到 1 % 為止（5 % 時會在 $\dot y$ 中加入兩個極小的虛假項）。退火閘門在 Burgers 與 Maxwell 上與弱形式 STRidge 一致，但在所有雜訊等級、所有嘗試過的懲罰（$10^{-6}$ 至 $10^{-3}$）下都漏掉 Lorenz $\dot y$ 的 $-y$ 項：$25.5\,x - 0.95\,xz$ 吸收了它，這是鬆弛法無法離開的局部極小值；它們在熱方程 5 % 雜訊時也會失敗。用從第一個快照找到的方程重新模擬，可將熱方程與 Burgers 資料重現至 $3\times 10^{-4}$，Maxwell 至 3 %；Lorenz 在 5 個時間單位後偏差 3 %，因為混沌會放大 0.01 % 的係數誤差。results/noise_study.csv 與 results/equations.tex 存有所有數值與方程式；每個目標各有一個 GIF（以 Maxwell 為主），另有 results/summary.png。結論。搜尋器能從乾淨、取樣充足的資料中還原已知的方程形式，使用弱形式時還能容忍實際程度的雜訊；最先失效的是導數估計，而非迴歸。它只能找到項目庫中有的項，需要量測到正確的變數，而且發現的方程式只是假說：沒有獨立驗證，它不會發現新的物理（或生理）。它也不是大型語言模型的替代品；這是不同的任務（把定律擬合到資料上，而非產生文字）。相關研究。SINDy（Brunton, Proctor and Kutz 2016）、PDE-FIND 與 STRidge（Rudy et al. 2017）、weak SINDy（Messenger and Bortz 2021）；以遺傳程式設計進行的符號迴歸（Schmidt and Lipson 2009）與 AI Feynman（Udrescu and Tegmark 2020）；Yee
  格式（Yee 1966）。動手試試。減少 bootstrap 重抽樣次數以加快執行，增加閘門步數看鬆弛法能否逃出 Lorenz 的局部極小值（到 4000 步仍未逃出），或使用較粗的 Yee 網格。
meanings:
- 項目庫：第 $k$ 欄是每個內部網格點 $n$ 上的候選項 $D^\alpha(\prod_g u_g^{p_g})$，例如 $u u_x = \tfrac12\partial_x(u^2)$、$\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$
- 導數引擎：沿單一軸的一維摺積；中央差分，或先做三次平滑後的 Savitzky–Golay（在 $2m+1$ 個樣本上的 $p$ 次最小平方多項式）
- 弱形式：對 $x$ 與 $t$ 求和；導數作用在平滑的凸塊函數 $\phi(s) = (1-s^2)^{10}$ 上，從不作用在含雜訊的資料上
- 對每個方程 $f$ 在其保留的項上一次批次求解嶺迴歸；STRidge 將 $|\hat\xi_k| < \tau$ 歸零並重新擬合
- 閾值掃描：保留驗證誤差在最佳值 5 %（+ $10^{-3}$）以內、且項數最少的模型
- DARTS 式的替代方法：$\xi = \sigma(\alpha/T)\, w$ 加上閘門懲罰，溫度從 1 退火至 0.01
- bootstrap：將 $B$ 次列重抽樣表示為多項分布權重，所有擬合在一次批次求解中完成
- 寫出的 LaTeX 經剖析器讀回：在印出的精度內重現擬合的模型
labels:
  bootstrap: 用於估計各係數 ± 的 bootstrap 重抽樣次數
  gate_steps: 退火閘門搜尋的 Adam 步數
  maxwell_grid: Maxwell 模擬的 Yee 網格（$n \times n$ 個 0.5 mm 網格）
