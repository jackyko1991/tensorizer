title: マクスウェルの悪魔、シラードのエンジン、ランダウアーの原理
summary: 悪魔がブラウン粒子が箱のどちら半分にいるかを見て、仕切りを滑らせて粒子に押させ、単一の熱浴から仕事を取り出す。過減衰 Langevin エンジンの集団が勘定を示す：仕事は 1 ビットあたり最大 $kT\,I \le kT\ln 2$（$I$ は雑音のある測定の相互情報量）、ビットの消去には少なくとも $kT\ln 2$ かかり（ランダウアー）、情報を数に入れれば Sagawa–Ueda 等式 $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$ が第二法則を回復する。逆再生すると、経路確率の比の対数が生成されたエントロピーになる。
notes: 単位：$kT = 1$、移動度 $1$（よって $D = 1$）、箱の半幅 $a = 1$、時間は $a^2/D$ 単位。マクスウェル（1867）は分子を選り分けて第二法則を破る存在を想像した。シラード（1929）はそれを一つの粒子と一ビットに還元し、その価値は最大 $kT\ln 2$ の仕事である。ランダウアー（1961）とベネット（1982）がパラドックスを解いた：悪魔はいずれ記憶を消去しなければならず、それには 1 ビットあたり少なくとも $kT\ln 2$ かかるので、サイクル全体は第二法則に従う。Sagawa と Ueda（2010）は誤差のあるフィードバックについてこれを定量化した：$\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$、よって $\langle W_{ext}\rangle \le kT\langle I\rangle - \langle\Delta F\rangle$。これらはこの種の確率力学について証明された定理であり、シミュレーションは数値的に確かめる。モデル：壁は硬いばね $\kappa u^2/2$（$\kappa = 500\,kT/a^2$）なので、自由エネルギーは $Z$ から数値的に計算し、硬い壁の値にはしない。仕切りは通り抜けられないので、各粒子は自分の側 $s$ を保つ。Langevin ステップは Metropolis 補正（MALA）されているので、ボルツマン分布、Jarzynski、Sagawa–Ueda、Crooks はサンプリング雑音の範囲で厳密に成り立つ。消去は仕切られた箱から始まりピストンが中央で終わるので、柔らかい壁でも $\Delta F = kT\ln 2$ が厳密になる。帳簿は仕切りを動かす仕事を数える。最後に仕切りを抜くと、その小さなばねエネルギーが戻る。実データ（引用値のみ、図は再現しない）：Bérut ら, Nature 483, 187（2012）と詳細版 J. Stat. Mech. P06015（2015）は、光学的二重井戸の中の $2\,\mu$m のシリカビーズに蓄えた 1 ビットを消去した。平均の熱はサイクル時間 $\tau$ とともに $\langle Q\rangle = kT\ln 2 + B/\tau$（$B = 8.15\,kT\cdot$s）のように減り、2
  パラメータのフィットでは漸近値 $A = 0.72\,kT$（$\pm 0.15\,kT$）で、$kT\ln 2 \approx 0.693\,kT$ に近い。シミュレーションの消去も独自の単位で同じ $1/\tau$ 則を示す。時間反転：動画の最後の部分は消去を逆再生する。各軌跡について、その順方向の確率と、逆プロトコルのもとでの逆経路の確率の比の対数は $\beta(W - \Delta F)$、すなわち生成されたエントロピーに等しい（Crooks 1999）。その平均は正で、$\langle e^{-\sigma}\rangle = 1$。試してみよう：より大きな誤り率 $\varepsilon$（情報が減り仕事も減る；$\varepsilon = 0.5$ では何も得られない）、またはより短い $\tau$（散逸が増える）。
meanings:
- $0$ と $2a$ にある柔らかい箱の壁と $p$ にある仕切り。粒子がいる側 $s=\pm1$ から感じる
- 各エンジンは仕切りが中央にある平衡状態 $e^{-V/kT}/Z$ から始まる
- 悪魔の読み取り。確率 $\varepsilon$ で誤る
- フィードバック：仕切りは悪魔が信じる側に $2a(1-\varepsilon)$ まで滑る
- 全エンジン同時の Euler–Maruyama 提案を Metropolis–Hastings で受理し、$e^{-V/kT}$ を厳密に定常にする
- $x$ を固定して壁が動くときに粒子にされる仕事
- 悪魔が正しければ $\ln 2(1-\varepsilon)$、誤れば $\ln 2\varepsilon$；平均は $I$
- 格子上の台形公式で仕切り位置の集団について：$\Delta F = -kT\ln Z_1/Z_0$
- 各ステップの遷移確率と境界項から得る $\ln P_F[x]/P_R[\tilde x]$
labels:
  eps: 悪魔の測定誤り率 $\varepsilon$
  tau: フィードバック時間 $\tau$（仕切りの移動、$a^2/D$）
  tau_erase: 最も遅い消去時間（$a^2/D$）
  n_engines: 誤り率ごとのエンジン数
  seed: 乱数シード
