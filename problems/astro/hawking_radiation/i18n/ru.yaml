source_hash: 7a350e6eef20
title: Излучение Хокинга и испарение чёрных дыр
summary: 'Чёрная дыра светится как чёрное тело при температуре Хокинга $T_H = \hbar c^3/(8\pi G M k_B)$. Одна операция broadcasting вычисляет закон Планка сразу для многих масс и длин волн, а RK4 интегрирует потерю массы $dM/dt = -\alpha/M^2$: дыра сжимается, нагревается и заканчивает вспышкой через $t \propto M^3$.'
notes: 'Всюду единицы СИ. Чёрная дыра солнечной массы имеет температуру $6\times10^{-8}$ K, гораздо ниже 2,7 K реликтового излучения, поэтому реальные астрофизические чёрные дыры поглощают больше, чем излучают. Испаряются лишь крошечные (первичные) дыры: дыра массой около $2\times10^{11}$ kg, возникшая при Большом взрыве, как раз сейчас должна заканчивать испарение. Модель учитывает только фотоны и считает горизонт идеальным чёрным телом площадью $4\pi r_s^2$; реальные дыры излучают также нейтрино, гравитоны, а при достаточно высокой температуре и более тяжёлые частицы, что сокращает время жизни, а факторы серого тела меняют форму спектра. Шаг по времени выбирается так, чтобы каждый шаг RK4 расходовал фиксированную долю оставшейся массы; анимация идёт равными шагами по $\log M$, так что последние кадры охватывают крошечный промежуток времени. Радиус горизонта нарисован как $M^{0.35}$, чтобы он оставался видимым.'
meanings:
- 'батч масс чёрных дыр (кг): Солнце, Земля, …, анимируемая дыра'
- температура Хокинга, поэлементно
- логарифмическая сетка длин волн
- спектр Планка через broadcasting T[:, None] против lam[None, :]
- закон Вина $b/T_H$
- мощность излучения горизонта по Стефану–Больцману
- $-P/c^2$, интегрируется методом RK4
- аналитическое время жизни, сравнивается с интегрированием
labels:
  log10_mass: Начальная масса $\log_{10}(M_0/\mathrm{kg})$
  burn_fraction: Доля массы, сгорающая за шаг RK4
