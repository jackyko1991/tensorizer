source_hash: c221614fc472
title: 黑洞附近的意大利面化
summary: 一圈粒子落向恒星级黑洞。圆环上引力的差异就是潮汐张量 $T_{ij} = -\partial_i\partial_j\Phi$，分别由公式和 autograd 黑塞矩阵求得。它沿径向拉伸圆环（$+2GM/r^3$），在横向压缩圆环（两个方向各 $-GM/r^3$）：这就是意大利面化，它会在潮汐半径以内把真实物体撕裂。
notes: 单位：$G = c = 1$，长度以 $GM/c^2$ 计，因此视界位于 $r_s = 2$（10 倍太阳质量的黑洞为 30 km）。环上粒子彼此不吸引：蓝点遵循精确的牛顿引力，红色曲线遵循线性规律 $\ddot\xi_i = T_{ij}\xi_j$，两者一致，直到圆环相对 $r$ 不再很小。橙色圆标出一个与圆环同样大小、质量为 $m$、靠自身引力维系的物体被撕裂的位置。对恒星级黑洞，该半径远在视界之外，所以落入的恒星（或宇航员）在穿过视界之前就被撕碎；对超大质量黑洞，它可能位于视界之内。这里的引力是牛顿引力；值得注意的是，在广义相对论中，径向下落观测者的潮汐张量具有完全相同的本征值 $(2, -1, -1)\,GM/r^3$。模拟在到达视界之前停止。
meanings:
- 圆环中心的位置（黑洞位于原点）
- 环上粒子 $b$ 相对中心的位移
- 外积，没有指标求和
- 由公式得到的潮汐张量
- 同一张量，作为 autograd 黑塞矩阵
- 重复的 $j$ ⇒ 求和：线性潮汐加速度
- 真空中 $= -\nabla^2\Phi = 0$
- 自引力物体的潮汐（洛希）半径
labels:
  r0: 起始距离
  r_stop: 下落停止位置
  ring_radius: 圆环半径
  n_particles: 环上粒子数
  mass_ratio: 用于 $r_t$ 的物体质量 $m/M$
  n_steps: RK4 步数
