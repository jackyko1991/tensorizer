<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A CNN reads a chest radiograph, a connector turns its six finding probabilities into a soft label header for a tiny language model, which writes a short report; below, the training DAG: CNN and LM trained side by side, then the connector, the global fine-tune and the caption stage">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- the radiograph: dark film, two lungs, a heart shadow -->
    <rect x="6" y="10" width="34" height="38" rx="2" fill="#374151" stroke="#374151" stroke-width="2"/>
    <ellipse cx="16" cy="28" rx="6" ry="12" fill="#9ca3af"/>
    <ellipse cx="30" cy="28" rx="6" ry="12" fill="#9ca3af"/>
    <ellipse cx="25" cy="36" rx="6" ry="5" fill="#e5e7eb"/>
    <!-- CNN -->
    <path d="M46,14 L72,20 L72,38 L46,44 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="48" y="33" font-size="11">CNN</text>
    <!-- connector: the DAG edge -->
    <line x1="74" y1="29" x2="92" y2="29" stroke="#dc2626" stroke-width="2.5" marker-end="url(#red)"/>
    <text x="66" y="58" font-size="11" fill="#b91c1c">connector</text>
    <!-- LM input row: six soft header tokens, then the report -->
    <g stroke="#b45309" stroke-width="1.2" fill="#f59e0b">
      <rect x="96" y="23" width="6" height="12" rx="1.5"/><rect x="104" y="23" width="6" height="12" rx="1.5"/>
      <rect x="112" y="23" width="6" height="12" rx="1.5"/><rect x="120" y="23" width="6" height="12" rx="1.5"/>
      <rect x="128" y="23" width="6" height="12" rx="1.5"/><rect x="136" y="23" width="6" height="12" rx="1.5"/>
    </g>
    <text x="146" y="34" font-size="12">&gt;</text>
    <rect x="92" y="8" width="66" height="34" rx="4" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="118" y="20" font-size="11">LM</text>
    <line x1="160" y1="29" x2="170" y2="29" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="172" y="26" font-size="11" font-style="italic">enlarged</text>
    <text x="172" y="39" font-size="11" font-style="italic">heart.</text>
    <!-- training DAG -->
    <line x1="6" y1="68" x2="234" y2="68" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g stroke="#1e40af" stroke-width="1.5" fill="#93c5fd">
      <rect x="6" y="78" width="40" height="18" rx="4"/><rect x="6" y="116" width="40" height="18" rx="4"/>
      <rect x="62" y="97" width="54" height="18" rx="4"/><rect x="126" y="97" width="50" height="18" rx="4"/>
      <rect x="186" y="97" width="48" height="18" rx="4"/>
    </g>
    <text x="12" y="91" font-size="11">CNN</text><text x="16" y="129" font-size="11">LM</text>
    <text x="64" y="110" font-size="10">connector</text><text x="129" y="110" font-size="10">fine-tune</text>
    <text x="189" y="110" font-size="10">captions</text>
    <line x1="46" y1="88" x2="60" y2="101" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g stroke="#dc2626" stroke-width="2" marker-end="url(#red)">
      <line x1="46" y1="124" x2="60" y2="111"/><line x1="116" y1="106" x2="124" y2="106"/>
      <line x1="176" y1="106" x2="184" y2="106"/>
    </g>
    <text x="6" y="152" font-size="11" fill="#6b7280">NIH labels · templates · PMC CC BY captions</text>
  </g>
</svg>
