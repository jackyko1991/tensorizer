source_hash: dc1d9350a90f
title: Туннелирование в двойной яме
summary: 'Частица в симметричном потенциале с двумя ямами. torch.linalg.eigh показывает, что два нижних состояния образуют близкую пару: чётное и нечётное, расщеплённые крошечной энергией туннелирования $\Delta E$. Их сумма — частица, находящаяся в левой яме; по мере расхождения относительных фаз она туннелирует в правую яму и обратно с периодом $2\pi/\Delta E$, хотя её энергия ниже барьера.'
notes: 'Единицы $\hbar = m = 1$. Энергии дублета лежат ниже вершины барьера $V_0$, поэтому классически частица не смогла бы его пересечь. Когда участвуют только два состояния, $\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$ (с точностью до общей фазы): при $t = 0$ это $(\varphi_0 + \varphi_1)$ слева, а при $t = \pi/\Delta E$ — $(\varphi_0 - \varphi_1)$ справа. $P_L(t) = \cos^2(\Delta E\,t/2)$ выполняется с точностью до малого перекрытия каждого состояния с «чужой» ямой. $\Delta E$ убывает примерно экспоненциально с высотой и шириной барьера (множитель ВКБ $e^{-\int\kappa\,dx}$), так что чуть более высокий барьер колоссально замедляет туннелирование — время моделирования измеряется в периодах туннелирования $2\pi/\Delta E$, чтобы анимация всегда показывала целые осцилляции.'
meanings:
- 'потенциал четвёртой степени: минимумы при $x = \pm a$, барьер $V_0$ при $x = 0$'
- кинетическая часть $-\tfrac12\,D2$ плюс $V$ на диагонали
- энергии и состояния; $\varphi_0$ чётное, $\varphi_1$ нечётное, $\Delta E = E_1 - E_0$
- '$(1, 1, 0, 0, \dots)/\sqrt2$: равная смесь дублета, локализованная слева'
- 'повторяющийся $n$ ⇒ суммирование: точная эволюция в собственном базисе'
- ступенчатая функция, выделяющая левую половину; $P_L$ суммирует по $x$
labels:
  V0: Высота барьера $V_0$
  a: Положение ям $a$ (минимумы в $\pm a$)
  periods: Время моделирования
  n_grid: Точки сетки
