source_hash: 92d9eb39c4ac
title: 'AlphaFold в миниатюре: от карты расстояний к 3D-укладке'
summary: Игрушечная версия двух половин предсказателя структуры, а не сам AlphaFold. Предсказанная дистограмма (попарные расстояния между Cα с разбитой на интервалы неопределённостью) при желании очищается одним блоком самовнимания (self-attention), затем «структурный модуль» находит 3D-координаты $x_{ia}$, которые ей соответствуют, — градиентным спуском по функции напряжения (stress) из пакета стартовых точек и классическим MDS. Результат совмещается с целевой структурой с помощью SVD по Кабшу и оценивается по RMSD и TM-подобной оценке.
notes: 'Это AlphaFold только по духу. Настоящий AlphaFold 2 читает аминокислотную последовательность и множественное выравнивание (MSA) родственных белков, в котором коэволюционирующие позиции подсказывают, какие остатки соприкасаются; его Evoformer (48 блоков внимания по MSA и по парам остатков, с треугольными обновлениями) строит картину пар; а его структурный модуль размещает для каждого остатка полную систему отсчёта остова (invariant point attention) и боковые цепи, уточняя их за несколько циклов рециркуляции. Он был обучен на ~170,000 структурах из Protein Data Bank и выдаёт оценку достоверности (pLDDT). Здесь «нейросеть» подделана: дистограмма — это истинные расстояния плюс шум, растущий с расстоянием ($\sigma_{ij} \propto d_{ij}$), а о парах за последним интервалом известно лишь, что они далеко. Блок внимания обучается несколько сотен шагов на этой одной карте, поэтому он запоминает, а не предсказывает; он показывает, как выглядит внимание по парам остатков, а поскольку его выход
  помещает каждый остаток в точку 6-мерного пространства, он не может подогнать независимый шум и поэтому сглаживает его. Структурный модуль — честная дистанционная геометрия. Расстояния не отличают структуру от её зеркального отражения: MDS и градиентный спуск возвращают любой из энантиомеров, поэтому правильная хиральность выбирается по знаку псевдодвугранных углов Cα (около $+50^\circ$ в правой α-спирали из L-аминокислот), и печатаются оба RMSD. Несколько случайных стартов сворачиваются одновременно, потому что некоторые застревают с одной спиралью каждой хиральности; побеждает наименьшее напряжение. Попробуйте увеличивать шум, пока укладка не разрушится, или выключить уточнение.'
meanings:
- положение Cα остатка $i$, ось $a$; целевая структура — синтетическая спираль–поворот–спираль, построенная по геометрии спирали
- вероятность того, что остатки $i, j$ находятся в интервале расстояний $k$ (64 интервала, 2–22 Å); заменяет обученную нейросеть
- ожидаемое расстояние, суммирование по $k$; обратная дисперсия даёт вес достоверности $w_{ij}$
- 'логиты внимания: остаток $i$ спрашивает, остаток $j$ отвечает; суммирование по $e$'
- каждый остаток собирает взвешенную смесь остальных, суммирование по $j$; $b_{ij}$ — парное смещение из $\hat d_{ij}$
- модельные расстояния для пакета из $B$ стартов, суммирование по $a$
- взвешенное рассогласование, «далёкие» пары только расталкиваются, связи удерживаются на 3.8 Å; минимизируется с Adam через автоматическое дифференцирование
- дважды центрированные квадраты расстояний = матрица Грама $x_{ia}x_{ja}$; её 3 старших собственных вектора дают начальное приближение
- ковариация двух центрированных структур, суммирование по $i$; её SVD даёт наилучший собственный поворот
- ошибка после совмещения; TM-подобная оценка $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$, 1 = идентичны
labels:
  helix_length: Остатков на спираль
  noise: Шум дистограммы (σ при 10 Å)
  refine: Уточнение вниманием
  starts: Случайные старты $B$
  steps: Шаги градиентного спуска
