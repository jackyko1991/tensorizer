source_hash: 3af965e9bb1a
title: 'टेंसर समस्या के रूप में UMAP: MNIST पर kNN ग्राफ़, फ़ज़ी सेट और बल-आधारित लेआउट'
summary: 'UMAP, वह आयाम-न्यूनीकरण विधि जो 784-पिक्सेल MNIST अंकों को 2D नक्शे के रूप में दिखाती है, पूरी तरह टेंसर संक्रियाओं में लिखी गई है: एक दूरी मैट्रिक्स और topk से सटीक kNN ग्राफ़, एक द्विभाजन (bisection) जो हर बिंदु की बैंडविड्थ $\sigma_i$ एक साथ खोजता है, फ़ज़ी संघ $P + P^\top - P\circ P^\top$, ग्राफ़ लाप्लासियन से स्पेक्ट्रल प्रारंभ, और हर epoch में पूरी किनारा-सूची पर लगाए गए आकर्षी और प्रतिकर्षी बल (हाथ से, और फिर autograd से)। 2500 अंकों और एक Swiss roll पर यह trustworthiness, पड़ोसी recall और अंक सटीकता में umap-learn लाइब्रेरी के बराबर है, और PCA से बहुत आगे।'
notes: 'प्रश्न। “UMAP को केवल एक टेंसर समस्या के रूप में” Jacky Ka Long Ko का अनुरोध है: UMAP (Uniform Manifold Approximation and Projection; McInnes, Healy और Melville 2018) को लें, जो आमतौर पर numba लूपों वाली umap-learn लाइब्रेरी से चलाया जाता है, हर चरण को बैच टेंसर संक्रियाओं के रूप में लिखें, और फिर जाँचें कि परिणाम उतना ही अच्छा है। विधि, टेंसरों के रूप में (D आयामों में N बिंदु)। 1. kNN ग्राफ़: (N, N) वर्ग दूरियाँ $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$ (एक einsum), पंक्ति-खंडों में गणना की गई, फिर topk से (N, k) दूरियाँ और सूचकांक मिलते हैं; सटीक, जैसे umap-learn 4096 बिंदुओं से कम पर होता है (उससे ऊपर वह अनुमानित nearest-neighbour descent पर चला जाता है)। 2. फ़ज़ी सिम्प्लिशियल सेट: $\rho_i$ निकटतम अन्य बिंदु की दूरी है; $\sigma_i$ द्विभाजन से $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ को हल करता है, सभी N अंतराल एक साथ आधे किए जाते हैं (64 बार, जब तक ऊपरी सीमा अज्ञात हो तब तक पहले एक दोगुना-करने का चरण); सदस्यताएँ एक सघन (N, N) मैट्रिक्स $P$ में बिखेरी
  जाती हैं और फ़ज़ी संघ $W = P + P^\top - P\circ P^\top$ से सममित की जाती हैं (कुछ हज़ार बिंदुओं पर सघन ठीक है; बड़े पैमाने पर विरल COO टेंसर में वही सूत्र लगता है)। 3. निम्न-आयामी समानता $q = 1/(1 + a d^{2b})$, जिसमें $a$ और $b$ को 2-पैरामीटर Gauss–Newton न्यूनतम-वर्ग फ़िट से min_dist के अनुसार फ़िट किया जाता है; प्रारंभ: सघन torch.linalg.eigh से सामान्यीकृत लाप्लासियन $I - D^{-1/2} W D^{-1/2}$ के दो सबसे निचले अतुच्छ (non-trivial) eigenvectors (एक कोर पर 2500 बिंदुओं के लिए लगभग 4 s; umap-learn एक विरल solver का उपयोग करता है; यदि eigh विफल हो तो कोड यादृच्छिक प्रारंभ पर लौट आता है)। 4. लेआउट: 500 epochs; भार $w_{ij}$ वाला किनारा हर $\max w / w_{ij}$ epochs में एक बार सक्रिय होता है (umap-learn का शेड्यूल, अगले सैंपल epochs के (E,) टेंसर के रूप में रखा गया); हर सक्रिय किनारा अपने दोनों सिरों को आकर्षित करता है और 5 यादृच्छिक नकारात्मक नमूने लेता है जो उसके शीर्ष को प्रतिकर्षित करते हैं; epoch के सभी बल एक साथ गणना किए जाते हैं और index_add_ से प्रति बिंदु जोड़े जाते हैं (एक समकालिक अद्यतन,
  जबकि umap-learn बिंदुओं को किनारा-दर-किनारा खिसकाता है)। autograd के साथ वही लूप: सैंपल किए गए cross-entropy का ग्रेडिएंट, जोड़ने के बाद क्लिप किया गया। 5. मेट्रिक्स, सभी टेंसर संक्रियाएँ, $k$ = 10 के साथ: रैंक मैट्रिक्स (argsort का argsort) से trustworthiness और continuity (Venna और Kaski 2001), kNN recall, और 2D लेआउट में leave-one-out 10-NN अंक सटीकता; रैखिक आधार-रेखा के रूप में SVD द्वारा PCA। डेटा। MNIST (LeCun, Cortes और Burges), लाइसेंस CC BY-SA 3.0: data/mnist_subset.npz में हर अंक की पहली 250 प्रशिक्षण छवियाँ हैं (2500 छवियाँ, uint8; share-alike लाइसेंस इस उपसमुच्चय पर लागू होता है), देखें data/SOURCES.md। Swiss roll (1500 बिंदु, scikit-learn के make_swiss_roll की तरह, थोड़े शोर के साथ) कोड में बनाया जाता है, इसलिए इसके सही समतल निर्देशांक (चाप-लंबाई, ऊँचाई) ज्ञात हैं। umap-learn संदर्भ (umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42) एक अस्थायी वातावरण में data/make_reference.py द्वारा एक बार ऑफ़लाइन गणना किया गया था; केवल इसके 2D निर्देशांक और मेट्रिक्स साथ में दिए गए
  हैं। परिणाम (संलग्न रन, CPU, एक थ्रेड)। MNIST, 2500 अंक: trustworthiness / continuity / 10-NN recall / 10-NN अंक सटीकता = हाथ से लिखे बलों के साथ 0.957 / 0.963 / 0.39 / 0.887, autograd के साथ 0.960 / 0.963 / 0.40 / 0.898, umap-learn के लिए 0.963 / 0.963 / 0.40 / 0.896, और PCA के लिए 0.740 / 0.913 / 0.07 / 0.414। Swiss roll: trustworthiness 0.999 (umap-learn 0.999, PCA 0.943), और सही समतल निर्देशांकों के सापेक्ष 0.999, जिसमें सही 10 निकटतम पड़ोसियों में से 76 % बने रहते हैं (umap-learn 77 %, PCA 28 %)। संलग्न umap-learn लेआउट पर हमारी trustworthiness scikit-learn के मान से $2\times 10^{-4}$ तक मेल खाती है (परीक्षित), और $a$, $b$ umap-learn के मानों के बराबर हैं। MNIST पर कुल समय: बलों के साथ 11 s (0.5 s ग्राफ़, 4 s eigh, 7 s लेआउट), autograd के साथ 15 s, umap-learn के लिए 14 s (दूसरी कॉल, एक थ्रेड; numba संकलन सहित इसकी पहली कॉल में 28 s लगे)। सर्वोत्तम घूर्णन, परावर्तन और स्केल (Procrustes) के बाद, हमारा MNIST लेआउट umap-learn के लेआउट से 0.05 की disparity से भिन्न है (0 = समान आकार, 1
  = असंबंधित); वही अंक-समूह उन्हीं स्थानों पर हैं। निष्कर्ष और सीमाएँ। UMAP एक टेंसर समस्या है: ग्राफ़ निर्माण, बैंडविड्थ खोज, फ़ज़ी संघ, स्पेक्ट्रल प्रारंभ और बल-आधारित लेआउट सभी बैच टेंसर संक्रियाएँ हैं, और परिणाम यहाँ के हर मेट्रिक पर संदर्भ जितना ही अच्छा है। क्या भिन्न है: लेआउट की तुलना मेट्रिक्स से की जाती है, कभी निर्देशांकों से नहीं, क्योंकि UMAP लेआउट केवल घूर्णन, परावर्तन और नकारात्मक सैंपलिंग की यादृच्छिकता तक ही परिभाषित होते हैं (दूसरा seed समूहों को इधर-उधर कर देता है); 4096 बिंदुओं से ऊपर umap-learn का kNN अनुमानित हो जाता है जबकि हमारा सटीक रहता है (और उसकी लागत $O(N^2)$ है); हमारे सघन $N\times N$ मैट्रिक्स और eigh इस संस्करण को लगभग $10^4$ बिंदुओं तक सीमित करते हैं (खंड, विरल टेंसर और एक पुनरावृत्त eigensolver यह सीमा हटा देंगे); समकालिक अद्यतन के कारण शुरुआती epochs गर्म गैस जैसे दिखते हैं (सीखने की दर लगभग 1 है और हर बिंदु को अपने सारे धक्के एक साथ मिलते हैं), फिर लेआउट ठंडा होता है। Swiss roll हर स्थानीय पड़ोस को बनाए रखता है पर एक साफ़ चादर के रूप में नहीं खुलता: यह
  पट्टियों में फट जाता है, जैसा umap-learn में भी होता है, जो UMAP और t-SNE का एक ज्ञात गुण है। अंक सटीकता इस बात का माप है कि नक्शा उन वर्गों को कितनी अच्छी तरह अलग करता है जिन्हें उसने कभी नहीं देखा; यह कोई वर्गीकारक नहीं है। BLAS बिल्ड और थ्रेड संख्या के अनुसार परिणाम कुछ हज़ारवें भाग तक बदलते हैं। संबंधित कार्य। t-SNE (van der Maaten और Hinton 2008) ने 2D में भारी-पूँछ वाले kernel के साथ पड़ोसी प्रायिकताओं के मिलान का ढाँचा स्थापित किया; UMAP उसकी सामान्यीकृत प्रायिकताओं को फ़ज़ी सदस्यताओं से और उसके पूर्ण प्रतिकर्षण को नकारात्मक सैंपलिंग से (जैसे word2vec में) बदलता है, इसीलिए यह बड़े पैमाने पर चलता है। Laplacian eigenmaps (Belkin और Niyogi 2003) स्पेक्ट्रल प्रारंभ देते हैं। आज़माएँ। कम पड़ोसी (5) से अधिक और छोटे समूह बनते हैं; min_dist लगभग 0.9 होने पर बिंदु ढीले-ढाले रहते हैं; कम epochs अधूरा लेआउट दिखाते हैं; दूसरा seed नक्शे को घुमाता और फेरबदल करता है जबकि मेट्रिक्स वही रहते हैं।'
meanings:
- $k$ निकटतम बिंदुओं की दूरियाँ (स्वयं बिंदु पहले), $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$ (दोहराया गया $d$ ⇒ योग) और topk से; सटीक, पंक्ति-खंड मेमोरी को $O(BN)$ पर रखते हैं
- $\rho_i$ = निकटतम अन्य बिंदु की दूरी; $\sigma_i$ सभी बिंदुओं के लिए एक साथ एक अंतराल-टेंसर को 64 बार आधा करके, ताकि $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$
- 'दिशात्मक सदस्यता: निकटतम पड़ोसी के लिए 1, उससे आगे दूरी के साथ घटती हुई, kNN सूची के बाहर 0'
- 'दोनों दिशाओं का फ़ज़ी संघ (प्रायिकतात्मक OR): सममित, $[0, 1]$ में; इसके अशून्य अवयव किनारा-सूची $(i_e, j_e)$ हैं, 2500 अंकों के लिए $E$ ≈ 50 000'
- '$1/(1 + a x^{2b})$ का Gauss–Newton फ़िट, min_dist से नीचे 1 और उससे ऊपर $e^{-(x - \mathrm{min\_dist})}$ पर: min_dist = 0.1 के लिए $a$ = 1.577, $b$ = 0.895'
- 'स्पेक्ट्रल प्रारंभ: सामान्यीकृत ग्राफ़ लाप्लासियन के दो सबसे निचले अतुच्छ eigenvectors, $[0, 10]$ में स्केल किए गए'
- सभी सैंपल किए गए किनारों $(i, j)$ और प्रति किनारा 5 यादृच्छिक नकारात्मक नमूनों $s$ के बल, एक scatter-add में प्रति बिंदु जोड़े गए; हर पद $\pm 4$ पर क्लिप; सीखने की दर $\alpha = 1 - \mathrm{epoch}/n$
- 'सैंपल किए गए loss $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$ पर autograd से वही चरण: हाथ से लिखे बलों के बराबर (परीक्षित)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, रैंक $r$ argsort के argsort से; continuity में $x$ और $y$ की अदला-बदली होती है
labels:
  n_neighbors: पड़ोसी $k$ (स्वयं बिंदु सहित)
  min_dist: लेआउट में न्यूनतम दूरी
  n_epochs: लेआउट epochs
  neg_rate: प्रति किनारा-नमूना नकारात्मक नमूने
  n_mnist: MNIST छवियाँ (अंकों में संतुलित)
  seed: यादृच्छिक seed
