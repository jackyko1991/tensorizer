source_hash: d32c883229aa
title: समतल और वक्र दर्पणों से परावर्तन
summary: 'परावर्तन का नियम एक सदिश सूत्र के रूप में: किरण की दिशा का वह भाग उलट दें जो पृष्ठ अभिलंब के अनुदिश है। एक लैंप से निकली किरणें समतल दर्पण से टकराकर लौटती हैं, और समांतर किरणें अवतल दर्पण से टकराकर उसके फोकस बिंदु $F = R/2$ के पास एकत्र होती हैं।'
notes: 'सूत्र केवल $\mathbf n$ के अनुदिश $\mathbf d$ के घटक को उलटता है, इसलिए आपतन कोण अपने आप परावर्तन कोण के बराबर हो जाता है। धराशायी रेखाएँ परावर्तित किरणों को समतल दर्पण के पीछे बढ़ाती हैं: वे सब लैंप के आभासी प्रतिबिंब पर मिलती हैं। अवतल दर्पण के लिए केवल अक्ष के पास की किरणें (उपाक्षीय किरणें) $F = R/2$ से गुज़रती हैं; दूर की किरणें अक्ष को दर्पण के अधिक पास काटती हैं (गोलीय विपथन)।'
meanings:
- आपतित किरण $r$ की एकक दिशा, घटक $i \in \{x, y\}$
- जहाँ किरण $r$ टकराती है वहाँ दर्पण का एकक अभिलंब
- 'दोहराया गया $j$ ⇒ योग: प्रति किरण एक अदिश गुणनफल (${}= -\cos\theta_i$)'
- परावर्तित दिशा, अब भी एकक सदिश
- वक्र दर्पण का अभिलंब उसके केंद्र $c$ की ओर इंगित करता है
labels:
  radius: दर्पण की वक्रता त्रिज्या $R$
  n_rays: प्रति दर्पण किरणें
  aperture: सबसे ऊँची किरण ($R$ का अंश)
