source_hash: 0fd4a04dbd76
title: Камера-обскура
summary: 'Как трёхмерная сцена становится двумерным изображением: матрицы модели, вида и проекции $4\times4$ действуют на однородные координаты, а затем перспективное деление и область просмотра дают пиксели. Все вершины каркасного объекта проецируются сразу одним einsum, пока камера облетает сцену. Сравните перспективную проекцию с ортографической и с долли-зумом, посмотрите, как параллельные линии сходятся в точках схода, и запишите ту же камеру как $K[R\,|\,\mathbf t]$.'
notes: 'Четвёртая координата делает камеру линейной: перенос становится столбцом матрицы, а перспектива, которая делит на глубину, — матрицей, копирующей глубину в $\tilde x_4$, за которой в конце следует одно деление. Точки с $w = 0$ — направления; их образы — точки схода, а все горизонтальные направления исчезают на горизонте, который лежит выше центра изображения, когда камера смотрит вниз. У ортографической камеры $\tilde x_4 = 1$, поэтому у неё нет точек схода и далёкие объекты не уменьшаются, как в инженерных чертежах и многих стратегических играх. Долли-зум («эффект Вертиго») меняет поле зрения, одновременно перемещая камеру так, что $d\,\tan(\text{fov}/2)$ остаётся постоянным: объект сохраняет размер, но пол позади него растягивается. Библиотеки компьютерного зрения используют $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$ с осью $z$, направленной вперёд; графические API используют $P V M$ с осью $z$, направленной назад; они отличаются лишь отражением осей $y$ и $z$, и терминал
  проверяет, что они дают одинаковые пиксели.'
meanings:
- вершина $v$ в однородных координатах $(x, y, z, 1)$; рёбра — пары индексов $(E, 2)$
- 'объект → мир: масштабирование, поворот вокруг $y$, затем перенос (4-й столбец)'
- 'мир → камера: строки — оси камеры, перенос $-R\,\mathbf e$'
- 'камера → пространство отсечения; её последняя строка копирует $-z$ в $\tilde x_4$ (ортографическая: $\tilde x_4 = 1$)'
- 'повторяющиеся $j, k, l$ ⇒ суммирование: каждая вершина через все три матрицы одним вызовом'
- перспективное деление на $\tilde x_4$, затем область просмотра; строки изображения отсчитываются вниз
- фокусное расстояние $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$ и главная точка; жёсткое движение мир → камера
- 'бесконечно удалённая точка $(\hat{\mathbf d}, 0)$ теряет перенос: все прямые вдоль $\hat{\mathbf d}$ сходятся в ней'
