source_hash: 107eff242684
title: 高斯的尺規正十七邊形
summary: 1796 年，在 19 歲生日前一個月，高斯發現正十七邊形可以用尺規作出：這是自古希臘以來第一個新的可作正多邊形。17 次單位根分組成高斯週期後，依次解一串二次方程。這串方程只用平方根寫出 $\cos(2\pi/17)$。隨後，Richmond 1893 年的作圖法一步步畫出多邊形，直線與圓的交點都寫成張量運算。一張網格顯示哪些正 $n$ 邊形可作（高斯–旺策爾定理）。這裡的一切都是已證明的經典數學。
notes: 高斯在 1796 年 3 月 30 日、19 歲生日前不久發現了正十七邊形，據說正是這件事讓他選擇了數學而不是語文學。他在《算術研究》（Disquisitiones Arithmeticae，1801）的最後一節發表了這一理論。思路是：因為 3 是原根，16 個非平凡根 $\zeta^k$ 在 $k \mapsto 3k \bmod 17$ 下被循環置換。按這個循環順序每隔一個根求和，得到兩個 8 項週期，滿足 $\eta_0 + \eta_1 = -1$ 和 $\eta_0\eta_1 = -4$，所以 $\eta_{0,1} = (-1 \pm \sqrt{17})/2$。再對半分，得到 4 項、2 項和 1 項的週期。每一對都是一個二次方程的兩根，方程係數是上一層的週期，因為子群的階是 $16 \to 8 \to 4 \to 2 \to 1$，全是 2 的冪。2 項週期就是 $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$，所以四次開平方就給出高斯公式。程式用精確的整數係數檢查每個二次關係，只用平方根重建每個週期，並把閉式公式與 `torch.cos` 比較（安裝了 sympy 時還做 60 位精度檢查）。任何原根（3、5、6、7、10、11、12、14）都給出同一棵樹，只是順序不同。平方根是尺規運算，所以多邊形可作。H. W. Richmond（1893）在單位圓上給出一個簡短的作法。在豎直半徑上取 $OJ = OB/4$。在直徑上取 $E$ 使 $\angle OJE = \tfrac14\angle OJP_0$（兩次平分角），再取 $F$ 使 $\angle EJF = 45°$。以 $FP_0$ 為直徑的圓交 $OB$ 於 $K$。以 $E$ 為圓心、過 $K$ 的圓交直徑於 $N_3 = \cos(6\pi/17)$ 和 $N_5 = \cos(10\pi/17)$，在這兩點作垂線得到 $P_3$ 和 $P_5$。這裡每一步都真的畫一條過兩點的直線，或一個以某點為圓心、過另一點的圓。每個新點都是直線–直線、直線–圓或圓–圓的交點，其餘頂點用圓依次截取：以 $P_k$ 為圓心過 $P_{k-1}$，以及以 $P_0$ 為圓心過 $P_k$ 得到鏡像點。55 步在 float64 下把全部 17 個頂點放在離
  $e^{2\pi i k/17}$ 約 $10^{-15}$ 的位置；換成 float32 可以看到捨入誤差增大到約 $10^{-6}$。高斯指出，當 $n = 2^k p_1 \cdots p_r$ 且 $p_i = 2^{2^j} + 1$ 為互不相同的費馬質數時，正 $n$ 邊形可作。旺策爾（1837）證明了其他 $n$ 都不行，這也解決了三等分角和倍立方問題。這等價於歐拉函數 $\varphi(n)$ 是 2 的冪，網格把兩種判別都檢查到 $n$。已知的費馬質數只有 3、5、17、257 和 65537。Richelot 在 1832 年發表了正 257 邊形，J. G. Hermes 花了約十年完成正 65537 邊形，於 1894 年完成，手稿保存在哥廷根。據說高斯希望在墓碑上刻一個正十七邊形，石匠據說拒絕了，因為它看起來會像一個圓。布倫瑞克的高斯紀念碑上刻的是一顆十七角星。
meanings:
- 17 次單位根，即複平面上正十七邊形的頂點
- 按原根冪次排列的指數，$g = 3$：1, 3, 9, 10, 13, …
- 循環順序中哪些位置組成第 $m$ 層的週期 $i$：每隔 $2^m$ 個取一個
- 重複的 $j$ ⇒ 求和：一次算出全部五層（長度 16, 8, 4, 2, 1）的高斯週期
- 兩個兄弟週期的乘積是 $\zeta^{a+b}$ 之和；統計指數得到在父層週期上取常值的整數
- 重複的 $k$ ⇒ 求和：由上一層得到每個二次方程的常數項
- 每層一次開平方：$16 \to 8 \to 4 \to 2 \to 1$；第 3 層就是 $2\cos(2\pi k/17)$
- 三種尺規操作寫成張量公式：用叉積解 $2\times 2$ 方程組、關於 $t$ 的二次方程，以及兩圓的根軸
- 用篩法求歐拉函數；當且僅當 $\varphi(n)$ 是 2 的冪時可作，用 $x \,\&\, (x-1) = 0$ 檢驗
- 奇數部分必須整除 $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$：即互不相同的費馬質數之積
labels:
  generator: 循環順序所用的原根 $g$
  precision: 作圖精度
  n_max: 可作性網格上限 $n$
