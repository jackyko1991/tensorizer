source_hash: a8a725d373c7
title: Заряды в полях E и B
summary: 'Сила Лоренца, действующая на группу заряженных частиц в скрещённых электрическом и магнитном полях. Векторное произведение записано через тензор Леви-Чивиты $\varepsilon_{ijk}$, так что один einsum даёт магнитную силу для каждой частицы: каждая закручивается по циклотронной спирали, а весь рой дрейфует вдоль $\mathbf E\times\mathbf B$.'
notes: Единицы безразмерные ($q$, $m$, $E$, $B$ порядка единицы). При $\mathbf E = 0$ каждая частица вращается с циклотронной частотой $\omega = \lvert q\rvert B/m$ по окружности радиуса $mv_\perp/(\lvert q\rvert B)$; положительные и отрицательные заряды вращаются в противоположные стороны. Добавление $\mathbf E\perp\mathbf B$ заставляет каждый ведущий центр дрейфовать со скоростью $\mathbf E\times\mathbf B/B^2$, не зависящей от заряда и массы.
meanings:
- положение частицы $b$, компонента $i \in \{x, y, z\}$
- скорость частицы $b$
- заряд и масса каждой частицы
- 'однородные поля: $\mathbf E$ вдоль $y$, $\mathbf B$ вдоль $z$'
- $+1$ для чётных перестановок $(x, y, z)$, $-1$ для нечётных, 0 при повторе индекса
- 'повторяющиеся $j$ и $k$ ⇒ суммирование: векторное произведение $\mathbf v\times\mathbf B$'
- скорость дрейфа $\mathbf E\times\mathbf B$, одинаковая для всех зарядов
labels:
  B: Магнитное поле $B_z$
  E: Электрическое поле $E_y$
  v_par: Начальная скорость вдоль $\mathbf B$
  n_particles: Частицы
  t_max: Время моделирования
