source_hash: 160447300c99
title: MRI：T1 與 T2 弛豫及影像對比
summary: 射頻脈衝之後，每種組織的磁化向量以時間常數 $T_1$ 沿磁場方向恢復，其橫向分量則以 $T_2$ 衰減。把自旋回波訊號寫成一個以（組織、$TR$、$TE$）為指標的張量，再與卡通大腦的組織標籤圖縮並，就能看出 $TR$ 與 $TE$ 的選擇如何讓影像成為 T1、PD 或 T2 加權。
notes: 短 $TR$ 加短 $TE$ 得到 T1 加權：脂肪與白質明亮，腦脊髓液（CSF）暗，因為它的長 $T_1$ 還來不及恢復。長 $TR$ 配短 $TE$ 去除了 $T_1$ 因子，留下質子密度（PD）加權。長 $TR$ 加長 $TE$ 得到 T2 加權：$T_2$ 極長的 CSF 成為最亮的組織。這個簡單公式忽略了重聚焦脈衝對 $M_z$ 的影響，並假設 $TR \gg TE$。每張影像都以自身最亮的像素調整窗寬，就像掃描儀的顯示一樣。組織參數是 1.5 T 下的粗略教科書數值，僅供教學，不可用於臨床。試著調整短、長 $TR$/$TE$，觀察灰質與白質的對比如何翻轉。
meanings:
- $S = 5$ 種組織的弛豫時間與質子密度（1.5 T 下的近似值）
- 縱向恢復，在組織 $s$ 與時間 $t$ 上廣播
- 每種組織的橫向衰減
- 每種組織、重複時間 $TR_a$ 與回波時間 $TE_b$ 的自旋回波訊號（沒有指標被求和）
- one-hot 標籤圖：哪種組織填滿像素 $(x, y)$
- 重複的 $s$ ⇒ 求和：每組 $(TR, TE)$ 對應的影像
- $M_0(1 - 2e^{-t/T_1})$ 穿過零點的反轉時間，用來抑制脂肪（STIR）或 CSF（FLAIR）
labels:
  tr_short: 短重複時間 $TR$
  tr_long: 長重複時間 $TR$
  te_short: 短回波時間 $TE$
  te_long: 長回波時間 $TE$
  size: 假體大小
  n_frames: 動畫影格數
