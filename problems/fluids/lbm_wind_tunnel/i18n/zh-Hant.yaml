source_hash: 7dfc00ae0203
title: 數位風洞：STL 飛機周圍的三維晶格波茲曼方法
summary: 一個仿照 OpenLB 函式庫風格的小型三維風洞：把模型飛機的 STL 檔讀入三角形張量，在所有格點上一次以射線投射完成體素化，依攻角傾斜後放進 D3Q19 晶格波茲曼流動中，採用 TRT 或 MRT 碰撞、可選的 Smagorinsky LES 以及物體上的反彈（bounce-back）。阻力與升力由動量交換求得；流線（批次 RK4）與示蹤粒子呈現流動。一個球的算例把求解器與 OpenLB 本身的預先計算結果比對，並顯示殘差。
notes: 晶格單位：格點間距與時間步長為 1，來流 $U = 0.08$（馬赫數 0.14），黏度 $\nu = UL/\mathrm{Re}$，其中 $L$ 為以格點計的物體長度，$\tau = 3\nu + \tfrac12$。飛機在 $80\times 36\times 26$ 的晶格中飛行，$L = 32$（機身長度；翼展 28 個格點），可選的 NACA 0012 機翼用 $72\times 24\times 24$（弦長 20）。兩個 STL 檔都是為本問題產生的（見 data/SOURCES.md）：一架敦實的模型飛機（迴轉體機身、後掠 NACA 0018 主翼、水平與垂直尾翼），各部件在連接處重疊，所以體素化統計的是環繞數（帶符號的穿越次數），而不是單純的射線奇偶性；以及一個橫跨整個週期寬度的機翼，即無限翼展（把 $C_L$ 與 $2\pi\alpha$ 比較）。係數採用俯視投影面積。邊界：垂直於來流方向週期（飛機陣列），體素化物體上用半程反彈；solve.simulate 也提供移動地面與自由滑移頂面。沒有入口與出口，而是讓最後 16 個格點作為 fringe 區，在流動於 $x = 0$ 重新進入之前把它拉回來流狀態；速度在 300 步內升高（早期 $C_D$ 的隆起是加速空氣所需的壓力梯度），動畫從這之後開始。TRT 使用「魔法」參數 $\Lambda = 3/16$，MRT 使用 d'Humières 等 (2002) 的 D3Q19 鬆弛率，Smagorinsky 常數 $C_s = 0.17$。在預設的 Re = 1000（$\tau \approx 0.508$）下，純 TRT 在這個粗網格上會發散，LES 讓它保持穩定：試試關掉 LES。8° 時的結果：飛機 $C_D \approx 0.39$，$C_L \approx 0.12$；機翼 $C_L \approx 0.31$，對照 $2\pi\alpha = 0.88$。升力偏小，是因為機翼只有 1–3 個格子厚、Re 處於層流，而且上下的週期鏡像像一疊雙翼機：這些只是方法的示範，不是預測。驗證（物體 sphere_openlb）：Re = 20 的球（$D = 10$，$80\times 40\times 40$，BGK，平衡入口）與在同一晶格上離線執行一次的 OpenLB 1.7（data/openlb_reference_*.csv）比較：$C_D$
  3.360 對 3.378（−0.5 %）；中截面 $u_x$：相對 L2 0.8 %，L∞ 1.1 %，最大 $|\Delta u|/U$ 1.3 %。剩餘差異來自邊界格式（OpenLB 使用內插速度與壓力邊界，並持續被聲波激盪，$C_D$ 波動 ±5 %）以及全程與半程反彈的區別；碰撞算子（BGK）與解析度相同。兩者都高於 Schiller–Naumann 值 2.61，因為這個球並不自由：OpenLB 在 $160\times 60\times 60$ 的盒子裡給出 3.04，按相同比例取 $D = 20$ 給出 3.21。OpenLB 只作為預先計算的參考；這裡沒有使用它的任何（GPL）程式碼。驗證在同一次執行中緊接飛機之後即時計算（參數 validate，預設開啟；2000 步），並顯示在殘差面板中。
meanings:
- 分布函數：格點 $(x, y, z)$ 處以晶格速度 $i$ 運動的流體
- D3Q19 速度（靜止、6 個面、12 條稜）、權重與相反方向
- STL 三角形：三角形 $t$、頂點 $v$、座標 $a$
- 沿 $+x$ 的射線的帶符號穿越次數（環繞數）為正即為內部；所有射線 × 所有三角形，然後 searchsorted
- 重複的 $a$ ⇒ 求和：沿每個晶格方向的速度
- 重複的 $i$ ⇒ 求和：動量密度
- MRT：非平衡矩，各自以自己的速率 $s_k$ 鬆弛
- 非平衡動量通量；其大小決定 Smagorinsky 渦黏度 $\nu_t$
- 遷移：把每個分布函數移動一個連結
- 分布函數從流體格點朝物體離開處為 1（反彈即遮罩交換）
- 動量交換：作用在物體上的力，對其邊界連結求和
labels:
  body: 物體（data/ 中的 STL；sphere_openlb = OpenLB 驗證算例）
  re: 雷諾數 $UL/\nu$（物體長度 $L$）
  collision: 碰撞算子
  les: Smagorinsky LES
  pitch: 攻角（飛機與機翼）
  steps: 晶格時間步數
  validate: 同時執行 OpenLB 球體驗證（殘差面板）
