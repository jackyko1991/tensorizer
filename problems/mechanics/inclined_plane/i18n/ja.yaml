source_hash: b7086dad7034
title: 摩擦のある斜面上の物体
summary: 物体に働く重力、垂直抗力、摩擦力を、einsum による射影で各斜面の斜面方向と法線方向の単位ベクトルに分解する。傾斜角の異なる斜面のバッチで、静止摩擦の限界 $\tan\theta = \mu_s$ を示す。
notes: 静止摩擦力は必要なだけの大きさ（最大 $\mu_s N$ まで）をとるので、$\tan\theta \le \mu_s$ である限り静かに放した物体はそのまま止まっている。滑り出すと動摩擦力 $\mu_k N$（$\mu_k \le \mu_s$）に切り替わり、加速度は一定となるので、物体が下端に達するまで距離は $\tfrac12 at^2$ で増える。物体は質点として扱う：転倒も転がりもしない。
meanings:
- 斜面 $b$ の斜面下向きの単位ベクトル $(\cos\theta, -\sin\theta)$
- 斜面 $b$ の単位法線ベクトル $(\sin\theta, \cos\theta)$
- 重力ベクトル $(0, -g)$
- 繰り返し添字 ⇒ 和をとる：重力の斜面に垂直な成分
- 単位質量あたりの垂直抗力、重力の斜面に向かう成分を打ち消す
- 物体を止めておけるなら静止摩擦、そうでなければ動摩擦 $\mu_k N$
- 斜面方向の加速度：$g(\sin\theta - \mu_k\cos\theta)$ または 0
labels:
  mu_static: 静止摩擦係数 $\mu_s$
  mu_kinetic: 動摩擦係数 $\mu_k$（$\le \mu_s$）
  n_ramps: 斜面の数
  min_angle: 最小角度
  max_angle: 最大角度
  ramp_length: 斜面の長さ
  g: 重力加速度 $g$
  t_max: シミュレーション時間
