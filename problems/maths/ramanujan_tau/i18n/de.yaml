source_hash: 242e43034f00
title: Ramanujans $\tau(n)$ und das Sato–Tate-Gesetz
summary: Entwickle die Diskriminanten-Modulform $\Delta(q) = q\prod_n (1-q^n)^{24}$ als Tensor-Potenzreihe, um Ramanujans $\tau(n)$ zu erhalten, exakt bis $n \sim 10^5$–$10^6$ über Reste modulo einer Reihe von Primzahlen. Prüfe, dass $\tau$ multiplikativ ist und der Hecke-Rekursion gehorcht, dass $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, dass $|\tau(p)| \le 2p^{11/2}$ (Satz von Deligne, 1974), und sieh zu, wie die normierten Werte $\tau(p)/2p^{11/2}$ den Sato–Tate-Halbkreis füllen (für $\Delta$ ein Satz seit 2011). Das Programm überprüft diese Sätze numerisch.
notes: 'Ramanujan (1916) untersuchte die Koeffizienten $\tau(n)$ von $\Delta(q) = q\prod(1-q^n)^{24}$, der eindeutigen normierten Spitzenform vom Gewicht 12, und vermutete dreierlei: $\tau$ ist multiplikativ, es erfüllt $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$, und $|\tau(p)| \le 2p^{11/2}$. Mordell bewies die ersten beiden 1917, ein früher Fall dessen, was später zur Hecke-Theorie wurde. Die Schranke ist die Ramanujan-Vermutung für $\Delta$ (allgemein Ramanujan–Petersson): Deligne bewies sie 1974 als Folgerung aus seinem Beweis der Weil-Vermutungen, sie ist also ein Satz. Ramanujan bewies außerdem die Kongruenz $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, die daher rührt, dass $691$ den Zähler der Bernoulli-Zahl $B_{12}$ teilt. Schreibt man $\tau(p) = 2p^{11/2}\cos\theta_p$, so besagt die Sato–Tate-Vermutung, dass die Winkel $\theta_p$ der Verteilung $\frac{2}{\pi}\sin^2\theta\,d\theta$ folgen, d. h. $x_p = \cos\theta_p$ folgt dem Halbkreis $\frac{2}{\pi}\sqrt{1-x^2}$ mit
  den Momenten $1/4$, $1/8$, $5/64$ (Catalan-Zahlen geteilt durch Potenzen von 4). Für $\Delta$ wurde dies von Barnet-Lamb, Geraghty, Harris und Taylor (2011) bewiesen. Das Histogramm konvergiert langsam, wie eine Stichprobe unabhängiger Ziehungen. Lehmers Vermutung, dass $\tau(n)$ niemals null ist, ist noch offen; sie wurde weit über diesen Bereich hinaus überprüft, und auch das Programm findet keine Nullstelle. Numerik: $\tau(n)$ wächst wie $n^{11/2}$, daher hat eine float64-FFT der gesamten Reihe einen absoluten Fehler von etwa $10^{-16}$ mal dem größten Koeffizienten, was $\tau(2) = -24$ völlig überdeckt (ein Test zeigt es). Stattdessen wird die Reihe exakt modulo etwa zehn Primzahlen gleichzeitig berechnet, je eine Tensorzeile, und mit dem chinesischen Restsatz wieder zusammengesetzt. Zum Schmunzeln: Ramanujan bemerkte, dass… („Ramanujan noticed that…“) $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$; dass $1729 = 1^3 + 12^3 = 9^3 + 10^3$; und, nur in einem regularisierten Sinn, dass $1
  + 2 + 3 + \dots$ „$= -1/12$“: Die Reihe divergiert, und $-1/12$ ist der Wert $\zeta(-1)$ der analytisch fortgesetzten Zetafunktion.'
meanings:
- 'Jacobis Identität $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$: nur $O(\sqrt N)$ von null verschiedene Koeffizienten'
- 'wiederholtes $j$ ⇒ summiert: ein abgeschnittenes Reihenprodukt als Toeplitz-Matrix mal Vektor, exakt in int64 für kleines $N$'
- dreimaliges Quadrieren ergibt die 24. Potenz
- dieselben Produkte per FFT für $M$ Primzahlmoduln gleichzeitig, gerundet auf exakte Reste (jeweils $m^2 N \le 2^{42}$)
- chinesischer Restsatz mit balancierten Ziffern, damit negative Werte negativ herauskommen
- alle teilerfremden Paare $1 < m < n$ mit $mn \le 600$ gleichzeitig
- jedes Teilerpaar $(d, j)$ mit $dj \le N$ addiert $d^{11}$ zu $n = dj$
- normierte Werte an den Primzahlen, nach dem Satz von Deligne in $[-1, 1]$
labels:
  n_max: Primzahlen und $\tau(n)$ bis $N$
