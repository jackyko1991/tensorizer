source_hash: bd0f5adb6f78
title: autograd によるラグランジアンからの運動方程式
summary: ラグランジアン $L = T - V$ だけを入力し、torch.autograd にオイラー–ラグランジュ方程式を導かせる：ヘッシアン $\partial^2L/\partial\dot q_i\partial\dot q_j$ が質量行列であり、1回の線形求解で $\ddot q$ が得られる。ばね振り子（弾性振り子）に適用する。
notes: ばね振り子の運動方程式は一切手で書いていない：ラグランジアンを変えれば力学もそれに従う。ここで $H = \operatorname{diag}(m, mr^2)$ は $r$ に依存し、$C$ にはコリオリ力のような結合項 $2mr\dot\theta$ が含まれる。既定の $k \approx 3mg/\ell_0$ ではばねの振動数が振り子の振動数の約2倍（2:1 共鳴）なので、エネルギーが伸縮振動と振り子運動の間を行き来する。同じコードは任意個の座標で動く。代償は1ステップあたり数回の追加の逆伝播である。
meanings:
- 一般化座標 $(r, \theta)$：ばねの長さと角度
- 一般化速度
- 手で入力する唯一の物理
- 1階微分；$p_i = \partial L/\partial\dot q_i$ は正準運動量
- 質量行列と混合2階微分の第 $i$ 行
- 繰り返される $k$ ⇒ 和をとる
- 加速度について解いたオイラー–ラグランジュ方程式
- エネルギー関数、これも autograd で計算；保存量
labels:
  m: 質量 $m$
  k: ばね定数 $k$
  rest_length: 自然長 $\ell_0$
  r0: 初期の長さ $r_0$
  theta0: 初期角度 $\theta_0$
  t_max: シミュレーション時間
