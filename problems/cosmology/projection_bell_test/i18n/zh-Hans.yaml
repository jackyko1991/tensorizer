title: 投影竞赛的贝尔检验
summary: 这是一个推测性的假说，并非已确立的物理：两个纠缠粒子是同一个共享态 $\Psi$，存在于 $D$ 维中；每次测量都是一次投影，接着进行第 1 步的竞赛。若在 $\Psi$ 上联合执行，作为完整空间中的单一事件，这个竞赛恰好给出量子力学的 $E = -\cos\theta$ 与 CHSH 值 $S = 2\sqrt2$。若分别在各方的局域隐藏坐标上执行，它就是一个 $S\leq2$ 的局域隐变量模型，而无漏洞贝尔检验已将其排除。每个结果拥有多于一个隐藏维度的竞赛会打破 Tsirelson 界限，并允许超光速信号传递。
notes: 投影假说的第 5 步（见系列说明），这是作者的推测性假说，并非已确立的物理。它在纠缠上检验第 1 步（cosmology/projection_postulate）的公设 P1（投影）与 P2（事件）。第 4 步（cosmology/projection_singularity_fold）处理几何，第 6 步（cosmology/projection_telescope_tests）处理观测。共享态的维度 $D$ 保持开放：它是一个参数，没有任何结果依赖于它。先看已知的物理。单态给出 $E(a,b) = -a\cdot b = -\cos\theta$。Bell（1964）以及 Clauser、Horne、Shimony 与 Holt（1969）证明了任何局域隐变量模型都满足 $S\leq2$，而量子力学可达到 Tsirelson 界限 $S = 2\sqrt2$。假说内容：存在一个共享的 $\Psi$（P0、P3）；各方的测量是一次投影加上第 1 步的竞赛，其中 $\|P_k\Psi\|^2/E_k$ 最大的结果会发生，而 $E_k$ 是 $m$ 个隐藏复坐标（属于 $\Psi$）中的能量。(i) 联合模型：竞赛在四个联合结果上只执行一次，权重为 $\|(P^a_i\otimes P^b_j)\Psi\|^2$。它在三维中是非局域的，在 $D$ 维中则是单一事件。当 $m = 1$（第 1 步留下的唯一可行值）时，它精确重现量子力学：闭式解的 $E = -\cos\theta$ 精确到 $10^{-15}$，而从 $\Psi$（位于 $\mathbb C^D$ 中）出发的蒙特卡罗模拟在统计误差内吻合。在最佳设定下 $S = 2\sqrt2$，2000 组随机设定上的最大值都低于此值，且 Alice 的边际分布不依赖于 Bob 的设定（无信号传递）。(ii) 局域模型：各方只在自己的隐藏能量以及在源头设定的隐藏方向 $n$ 上进行竞赛，也就是在权重 $(1\pm a\cdot n)/2$ 上。这是一个局域隐变量模型，因此 $S\leq2$ 必然成立。$m = 1$ 给出 $E = -\cos\theta/3$（最大 $S\approx0.93$），而 $m\to\infty$ 就是 Bell 本人的确定性模型 $E = -(1-2\theta/\pi)$，恰好达到
  $S = 2$。超越 Born 规则：$m\neq1$ 的联合竞赛不是量子力学。当 $m > 1$ 时它打破 Tsirelson 界限（$S = 3.85$ 于 $m = 3$，趋向 PR 盒的值 4）。对于部分纠缠态，它会让 Alice 的统计依赖于 Bob 的设定，这就是超光速信号传递（$dS/dm = 1.34$，信号传递量 $\approx0.18\,|m-1|$）。因此，$m = 1$ 既是相对论因果性的要求，也是三缝实验数据的要求。数据（data/bell_tests.csv，引用的数值取自摘要）。Hensen et al.（Nature 526, 682, 2015）：相距 1.3 km 的 NV 自旋，$S = 2.42\pm0.20$，$p = 0.039$。他们的第二次实验（Sci. Rep. 6, 30289, 2016）：$S = 2.35\pm0.18$。Giustina et al. 与 Shalm et al.（Phys. Rev. Lett. 115, 250401 and 250402, 2015）：光子，CH–Eberhard 不等式，$p\leq3.74\times10^{-31}$ 与 $2.3\times10^{-7}$。Rosenfeld et al.（Phys. Rev. Lett. 119, 010402, 2017）：相距 398 m 的原子，$S = 2.221\pm0.033$。Storz et al.（Nature 617, 265, 2023）：相距 30 m 的超导量子比特，$S = 2.0747\pm0.0033$，比 2 高出 22.6$\sigma$。结论：模型 (ii)，连同竞赛的所有局域版本，都已被排除。模型 (i) 与所有检验一致，但这只是因为它是改写过的量子力学；它没有做出任何新预测。第 1 步仍然允许的偏差（$|m-1|\leq6\times10^{-3}$）最多只会使 $S$ 偏移 $8\times10^{-3}$。这大于 Storz 的 $\sigma_S$，但实测的 $S$ 值远低于 $2\sqrt2$（可见度 0.73），而未知的可见度会吸收这样的偏移。只有 $E(\theta)$ 的形状（残差 $\leq1.5\times10^{-3}$）或直接的无信号传递检验（$\leq10^{-3}$）才可能看到它。维基百科：贝尔定理、CHSH
  不等式。
meanings:
- 沿单位向量 $n$ 的自旋投影算子，以对 Pauli 矩阵的 einsum 构建
- 每个联合结果的权重：对量子比特指标 $x, y, u, v$ 求和
- 关联函数，对结果符号 $s = (+1, -1)$ 求和
- 四个结果上的联合竞赛；对 $l$ 的求和（扣除 $l = k$）即对其他结果的乘积；$m = 1$ 给出 $P = w$
- 从 $\Psi$ 的样本中读出的隐藏区块能量，样本在 $\mathbb C^D$ 的球面上均匀分布
- 在源头设定的隐藏方向，即 $\Psi$ 的三个实坐标：在 $S^2$ 上均匀分布，对任何 $D$ 皆然
- 局域竞赛：各方在自己的权重 $(1\pm a\cdot n)/2$ 上竞赛；对共享的 $\nu$ 取平均
- CHSH 值，对四项中哪一项带负号取最大值
labels:
  D: 总维度 $D$（共享态 $\Psi$ 的维度，开放）
  m_max: 每个结果的最大隐藏维度数 $m$
  settings: 随机测量设定数
  trials: 每个角度的竞赛事件数（蒙特卡罗）
