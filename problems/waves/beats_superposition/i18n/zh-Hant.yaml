source_hash: 2765022e4b7f
title: 拍與群速度
summary: 把兩個（或更多）頻率相近的正弦波相加。所有波放在一個以波 $s$、時間 $n$ 與位置 $j$ 為指標的張量中；對 $s$ 作一次 einsum 便將它們疊加。在固定點上可聽到頻率為 $|f_1 - f_2|$ 的拍；在空間中，載波波峰以相速度移動，包絡則以群速度移動。
notes: 對兩個波，$\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$：在緩慢包絡內有一個平均頻率的快速載波。響度 $|{\rm envelope}|$ 每秒達到峰值 $|f_1 - f_2|$ 次，即拍頻。對色散關係 $\omega = c_0 k_0 (k/k_0)^p$，群速度是相速度的 $p$ 倍：弦上的聲波兩者相等（$p = 1$），深水波為一半（$p = \tfrac12$），毛細漣漪為一倍半（$p = \tfrac32$）。紅點以 $v_p$ 跟著波峰，綠點以 $v_g$ 跟著包絡峰值。多於兩個波時，拍會變成孤立的波群。
meanings:
- 波 $s$ 的角頻率與波數，由色散關係 $\omega \propto k^p$ 聯繫
- 計算波的位置與時刻
- 以廣播求每個波在每個時刻與位置的相位
- 重複的 $s$ ⇒ 求和：疊加
- 包絡：相量和的長度
labels:
  f1: 頻率 $f_1$
  f2: 頻率 $f_2$
  n_waves: 波數（從 f1 分佈到 f2）
  dispersion: 色散 $p$ = 1、½、3/2
  t_max: 模擬時間
