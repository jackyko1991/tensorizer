title: Шум и уравнение Ланжевена
summary: Броуновская частица в гармонической ловушке получает случайные толчки от окружающих молекул. Уравнение Ланжевена добавляет к закону Ньютона этот шумовой член, $\sqrt{2\gamma k_BT}\,dW$; метод Эйлера–Маруямы продвигает сразу целый ансамбль частиц в одном пакетном тензоре, и разброс координат приходит к распределению Больцмана $N(0, k_BT/k)$ (равнораспределение).
notes: 'С одним лишь трением закон Ньютона оставил бы частицу в покое на дне ловушки (жирная красная кривая). Настоящие частицы в жидкости никогда не останавливаются: молекулы бьют их со всех сторон, и эта случайная сила и есть шумовой член, или член ошибки, уравнения Ланжевена. Его величина не произвольна. Флуктуационно-диссипационная теорема фиксирует её как $\sqrt{2\gamma k_BT}$: те же столкновения, что создают трение $\gamma$, толкают и частицу, и ансамбль приходит в равновесие при температуре $T$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$ (равнораспределение), а координаты распределены как $N(0, k_BT/k)$. Винеровское приращение $dW$ имеет дисперсию $dt$; на конечном шаге оно превращается в $\sqrt{\Delta t}\,\xi$ с $\xi \sim N(0,1)$, а толчок скорости за шаг имеет дисперсию $2\gamma k_BT\Delta t/m^2$. Если бы шум масштабировался как $\Delta t$, он исчезал бы при уменьшении шага: случайные толчки складываются как случайное блуждание, поэтому их разброс
  растёт как $\sqrt{t}$. Так как уравнение линейно, среднее по ансамблю $\langle x\rangle$ в точности следует бесшумному затухающему осциллятору (чёрный пунктир на красном), тогда как каждая отдельная траектория блуждает. Попробуйте $T = 0$ (чистый затухающий осциллятор), большое $\gamma$ при малой $m$ (передемпфированное броуновское движение: $\langle x^2\rangle$ релаксирует со скоростью $2k/\gamma$ без колебаний) или малое $\gamma$ (медленный выход на равновесие). Упрощения: приведённые единицы с $k_B = 1$, одно измерение, белый (некоррелированный) шум и схема первого порядка, у которой равновесные дисперсии смещены на $O(\Delta t)$.'
meanings:
- 'координата и скорость частицы $b$ на шаге $n$: весь ансамбль — один пакет'
- 'тензор шума, по строке на шаг: независимые стандартные нормальные числа (фиксированное зерно)'
- величина случайного толчка за шаг; она масштабируется как $\sqrt{\Delta t}$, а не как $\Delta t$
- 'детерминированное ускорение: трение плюс пружина'
- шаг Эйлера–Маруямы; координата использует новую скорость (симплектический Эйлер)
- 'среднее по ансамблю: повторённый $b$ ⇒ сумма по частицам'
- 'равновесные $\langle x^2\rangle$ и $\langle v^2\rangle$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$'
labels:
  temperature: Температура $k_BT$
  gamma: Трение $\gamma$
  k: Жёсткость $k$
  m: Масса $m$
  n_particles: Число частиц $B$
  t_max: Длительность $t_{max}$
