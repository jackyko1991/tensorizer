source_hash: e272fe98f3be
title: 小型 CNN 找出 DNA 結合模體
summary: 一組隨機 DNA 序列中，有一半帶有一份轉錄因子結合位點的簡併拷貝。單層一維卷積網路 $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$ 加上最大池化，以 autograd 與 Adam 學會區分它們；將其讀回為序列標誌（sequence logo）時，最重要的濾波器會變成植入的模體。
notes: 轉錄因子會在找到一個短而略有變化的字詞（其模體）處結合 DNA，此模體通常以位置權重矩陣（PWM）概括。用 PWM 掃描序列正是 one-hot 序列與 $w \times 4$ 濾波器的一維卷積，這也是卷積網路適合基因體學的原因：第一層濾波器是模體偵測器，而最大池化使答案與位點位置無關。這裡沒有任何東西告訴網路模體是什麼：它只看到標籤，梯度下降把它最有用的濾波器塑造成植入的字詞（看看標誌如何從雜訊中變得清晰）。虛線是確實知道模體的參考：用真實 PWM 掃描。由於植入的位點是簡併的，而隨機 DNA 有時看起來也像位點，即使如此也無法達到 100%，訓練後的網路最終接近它。只使用正股，且背景均勻；真實模型還會掃描反向互補序列，並須處理 GC 含量、重複序列與帶雜訊的實驗標籤。這是 DeepBind（2015）背後的想法，它從蛋白質結合實驗中學習模體；Basset、Basenji 與 Enformer 等模型堆疊更多層（及注意力機制），從 100 kb 的序列預測染色質與表現量。這個玩具只重現第一層的概念。試試較弱的模體、較短的模體（E-box，CACGTG，較常隨機出現）或較少濾波器。
meanings:
- 植入的位置權重矩陣：共識鹼基的機率為「強度」，其餘三者平分剩下的機率
- 序列 $n$ 在位置 $l$ 的鹼基為 $b \in$ {A, C, G, T}；若植入了位點，標籤 $y_n = 1$
- 每個 $w$ 個鹼基的視窗（是視圖，不複製），$P = \ell - w + 1$
- 可訓練濾波器：每個鹼基與位置一個分數，形狀與 PWM 相同
- 卷積：對 $k, b$ 求和，在每個位置 $p$ 為濾波器 $f$ 評分
- 全域最大池化：任何位置的最佳匹配，所以位點可位於任何位置
- logit，對 $f$ 求和；以二元交叉熵、autograd 與 Adam 訓練（小批次 100）
- 如 DeepBind 般轉回模體：對每條分數超過最高分一半（$\kappa_{nf} = 1$）的正序列取其最佳視窗 $p^*_{nf}$ 平均，對 $n$ 求和
- 以位元表示的資訊量：標誌在位置 $k$ 的堆疊高度
- 學得矩陣與植入矩陣在最佳平移下的相關；1 = 完全相同
labels:
  motif: 植入模體：NF-κB、AP-1 或 E-box
  strength: 共識鹼基的機率
  n_seq: 序列數（80% 訓練／20% 測試）
  length: 序列長度 $\ell$
  n_filters: 濾波器數 $F$
  width: 濾波器寬度 $w$
  epochs: 訓練回合數
  lr: Adam 學習率
