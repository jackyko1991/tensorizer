title: Спектры Бугера–Ламберта–Бера для A → B → C
summary: Спектрофотометр отслеживает последовательную реакцию $A \to B \to C$. Спектр смеси — матричное произведение $D = l\,E\,c$ (длины волн × вещества), поэтому профили концентраций восстанавливаются из зашумлённых спектров методом наименьших квадратов с псевдообратной матрицей $E^{+}$. Наблюдайте изосбестические точки, где спектры остаются на месте, пока идёт одна стадия.
notes: 'Каждое вещество поглощает свет пропорционально своей концентрации и длине оптического пути, $D = \varepsilon\,l\,c$, а оптические плотности смеси просто складываются. Записанное сразу для всех длин волн и моментов времени, это матричное произведение $D_{tw} = l\,E_{ws}c_{ts}$, поэтому при числе длин волн больше числа веществ концентрации следуют из переопределённой линейной системы, решаемой методом наименьших квадратов: $\hat c = E^{+}D/l$ с псевдообратной матрицей $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$. Это работает, только когда спектры чистых веществ явно различаются; число обусловленности $E$, выводимое в терминале, говорит, насколько усиливается шум. Кинетика $A \to B \to C$ — линейная система $\dot{\mathbf c} = K\mathbf c$, решаемая точно с помощью матричной экспоненты: $[A]$ убывает, $[B]$ растёт и падает (максимум при $t = \ln(k_1/k_2)/(k_1 - k_2)$), а $[C]$ растёт, тогда как $[A] + [B] + [C]$ остаётся постоянной, потому что каждый столбец $K$ в сумме даёт ноль. Изосбестические
  точки: если идёт только $A \to B$, то $D = l(\varepsilon_A[A] + \varepsilon_B[B])$ при фиксированной $[A] + [B]$, поэтому на длине волны, где $\varepsilon_A = \varepsilon_B$, оптическая плотность не может меняться. Чёткая изосбестическая точка — классический признак чистого превращения двух веществ; здесь пересечение смещается от $\varepsilon_A = \varepsilon_B$ (вначале) к $\varepsilon_B = \varepsilon_C$ (в конце), а в промежутке размывается, потому что сосуществуют три вещества. Задайте $k_2 = 0$, чтобы увидеть идеальную изосбестическую точку, или $k_2 \approx k_1$, чтобы увидеть, как она исчезает. Спектры — синтетические гауссовы полосы с типичными для красителей коэффициентами поглощения ($\sim 10^4$ L mol$^{-1}$ cm$^{-1}$) в кювете 1 см.'
meanings:
- 300–700 нм с шагом 2 нм
- молярный коэффициент поглощения каждого вещества (синтетические гауссовы полосы, L mol$^{-1}$ cm$^{-1}$)
- матрица скоростей $A \to B \to C$; каждый столбец в сумме даёт 0 (баланс массы)
- точные концентрации в каждый момент отбора; суммирование по $r$
- 'закон Бугера–Ламберта–Бера для смеси: оптические плотности складываются, суммирование по веществам $s$'
- матрица перекрывания (Грама) спектров чистых веществ; суммирование по $w$
- псевдообратная матрица; равна torch.linalg.pinv(E), когда спектры независимы
- концентрации методом наименьших квадратов из каждого зашумлённого спектра; суммирование по $w$
- изосбестическая точка стадии $A \to B$ (аналогично $B \to C$)
labels:
  k1: Константа скорости $k_1$ ($A \to B$)
  k2: Константа скорости $k_2$ ($B \to C$)
  t_end: Время опыта
  c0: Начальная $[A]_0$
  noise: Шум детектора $\sigma$ (оптическая плотность)
