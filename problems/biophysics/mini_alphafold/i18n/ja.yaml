source_hash: 92d9eb39c4ac
title: ミニチュア版 AlphaFold：距離マップから 3D 構造へ
summary: 構造予測器の二つの部分のおもちゃ版であり、AlphaFold そのものではない。予測された距離分布マップ（distogram：ビン分けされた不確かさ付きのペア Cα 距離）を、必要に応じて一つの自己注意ブロックで整え、次に「構造モジュール」が、複数の初期値のバッチに対するストレスの勾配降下法と古典的多次元尺度構成法（MDS）によって、それに合う 3D 座標 $x_{ia}$ を求める。結果は Kabsch の SVD でターゲットに重ね合わせ、RMSD と TM 風スコアで評価する。
notes: これは精神において AlphaFold であるにすぎない。本物の AlphaFold 2 はアミノ酸配列と、関連タンパク質の多重配列アラインメント（MSA）を読み込む。MSA で共進化する位置は、どの残基が接しているかを示唆する。その Evoformer（MSA と残基ペアに対する注意を行い、三角更新を含む 48 ブロック）がペアの描像を作り、構造モジュールが残基ごとに完全な主鎖フレーム（不変点注意）と側鎖を配置し、数回のリサイクルで精密化する。タンパク質データバンク（PDB）の約 170,000 構造で学習され、信頼度（pLDDT）を出力する。ここでは「ネットワーク」は偽物である：距離分布マップは真の距離に距離とともに大きくなるノイズ（$\sigma_{ij} \propto d_{ij}$）を加えたもので、最後のビンを超えるペアは遠いことしかわからない。注意ブロックはこの 1 枚のマップで数百ステップ学習するだけなので、予測ではなく記憶している。残基ペアに対する注意がどのようなものかを示すもので、その読み出しは各残基を 6 次元空間の一点に置くため独立なノイズにはフィットできず、ノイズを平滑化する。構造モジュールは正真正銘の距離幾何学である。距離では構造とその鏡像を区別できない：MDS と勾配降下法はどちらの鏡像体も返すので、Cα 擬二面角の符号で正しい掌性を選び（L-アミノ酸の右巻き α ヘリックスでは約 $+50^\circ$）、両方の RMSD を表示する。初期値によっては二つのヘリックスの巻き方向が逆のまま行き詰まるので、複数のランダムな初期値を同時に折りたたみ、ストレスが最小のものを採用する。ノイズを上げて構造が崩れるまで試したり、精密化をオフにしたりしてみよう。
meanings:
- 残基 $i$ の Cα 位置、軸 $a$；ターゲットはヘリックスの幾何から作った合成のヘリックス–ターン–ヘリックス
- 残基 $i, j$ が距離ビン $k$ に入る確率（64 ビン、2–22 Å）；学習済みネットワークの代わり
- 期待距離、$k$ について和；分散の逆数が信頼度の重み $w_{ij}$ を与える
- 注意のロジット：残基 $i$ が問い、残基 $j$ が答える；$e$ について和
- 各残基がほかの残基の重み付き混合を集める、$j$ について和；$b_{ij}$ は $\hat d_{ij}$ からのペアバイアス
- $B$ 個の初期値のバッチのモデル距離、$a$ について和
- 重み付きの不一致、「遠い」ペアは押し離すだけ、結合は 3.8 Å に保持；自動微分を用いて Adam で最小化
- 二重中心化した二乗距離 = グラム行列 $x_{ia}x_{ja}$；上位 3 つの固有ベクトルが初期推定を与える
- 中心化した二つの構造の共分散、$i$ について和；その SVD が最適な真の回転を与える
- 重ね合わせ後の誤差；TM 風スコア $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$、1 = 同一
labels:
  helix_length: ヘリックスあたりの残基数
  noise: 距離分布マップのノイズ（10 Å での σ）
  refine: 注意による精密化
  starts: ランダム初期値の数 $B$
  steps: 勾配ステップ数
