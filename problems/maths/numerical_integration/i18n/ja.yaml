source_hash: 9e25d7739db7
title: 数値積分と収束次数
summary: 台形則、シンプソン則、ガウス–ルジャンドル求積はいずれも重み付き和 $\sum_k w_k f(x_k)$ であり、多数の被積分関数について一つの einsum で一度に計算できる。ガウスの節点と重みは固有値問題（Golub–Welsch）から得られる。両対数グラフでは誤差は傾き 2 と 4 で、あるいは指数関数的に減少するが、折れ目や特異点があると高次の収束が失われる。
notes: 滑らかな被積分関数では、台形則の誤差は $h^2 \propto N^{-2}$、シンプソン則は $N^{-4}$ のように減る：$N$ を倍にすると誤差は 1/4 と 1/16 になる。$N$ 節点のガウス–ルジャンドル求積は $2N - 1$ 次までのすべての多項式を厳密に積分するので、解析関数に対しては誤差が指数関数的に減り、$10^{-16}$ 付近の float64 の丸め誤差に達する。これらの次数はテイラー展開から来るので、導関数を必要とする。折れ目 $|x - a|$ があると二階導関数はスパイクになる：折れ目をまたぐどの公式もそこで $O(h^2)$ の誤差を生むので、シンプソンとガウスは 2 次に落ちる（折れ目がパネル内のどこに来るかが $N$ によって変わるので、曲線はギザギザになる）。$(1+x)^{\alpha}$ では端点で導関数が発散する：台形則とシンプソン則は $1 + \alpha$ 次に、節点が両端に集まるガウスは約 $2 + 2\alpha$ 次に落ちる。対策は、折れ目で区間を分けるか、被積分関数が滑らかになるよう変数変換することである。整数の $\alpha$（多項式）を試すとガウスが厳密になり、折れ目を格子点上に置くと（$N$ が 20 の倍数なら $a = 0.3$ は格子点）台形則は二つの直線部分に対して厳密になり、丸め誤差まで下がる。
meanings:
- 等間隔の節点；重み $h(\tfrac12, 1, \dots, 1, \tfrac12)$ と $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- ルジャンドル漸化式の三重対角行列、対角の隣に $\beta_k = k/\sqrt{4k^2 - 1}$
- 固有値がガウス–ルジャンドルの節点、固有ベクトルは列に
- 各固有ベクトルの第一成分から得たガウスの重み；和は $\int_{-1}^{1} dx = 2$
- 各節点での滑らか、折れ目、端点の被積分関数
- $k$ の繰り返し ⇒ 和：三つの積分を一度に
labels:
  n_max: 最大の $N$
  kink: 折れ目の位置 $a$
  alpha: 端点のべき $\alpha$
