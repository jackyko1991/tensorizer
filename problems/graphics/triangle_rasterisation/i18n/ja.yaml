source_hash: e60c88b1723d
title: z バッファによる三角形のラスタライズ
summary: ゲームが 3D を描く方法です：三角形メッシュを画面に投影し、すべての（画素, 三角形）の組の重心座標の重みを一度に計算します。三角形についての min 縮約が z バッファです。同じ重みでフラット、グーロー、フォンのシェーディングとテクスチャ参照を行います。テクスチャ座標を $\lambda$（アフィン）ではなく $\lambda/z$（透視補正）で補間することで、市松模様の床がまっすぐに保たれます。
notes: 重心座標の重みは符号付き面積です：$\lambda_k$ は角 $k$ の向かいにある小三角形の面積を全体の面積で割ったものなので、3 つの和は 1 になり、内部ではちょうどすべてが正になります。ここではすべての画素とすべての三角形について一度に計算します。これは GPU がハードウェアで行うことの総当たり版です。画素をタイルに分けることで $(P, T, 3)$ テンソルを数百万要素以下に抑えます。実際のラスタライザは各三角形のバウンディングボックスだけを調べます。スクリーン空間の面積の符号から背面カリングもただで得られます：閉じたメッシュの約半分は向こうを向いています。三角形上の奥行きは画面上で線形ではありませんが $1/z$ は線形なので、z バッファの判定も補間するすべての属性も重み $\lambda_k/z_k$ を使います。床は三角形 2 つだけなので、アフィン補間（PlayStation 1 風）では市松模様の線が目に見えて曲がりますが、透視補正版はまっすぐに保ちます。フラットシェーディングではすべての面が見えます。グーローは角でライティングして明るさを補間するので、鏡面ハイライトがにじみます。フォンは法線を補間して画素ごとにライティングするので、ハイライトが鋭く保たれます。
meanings:
- メッシュの頂点と床の 4 隅。面 $(T, 3)$ はそれらを指す添字
- $j$ が繰り返し ⇒ 和をとる：メッシュを回す（フレームごとに回転 1 つ）
- 三角形 $t$ の角 $k$ の画面位置と奥行き（ピンホールカメラ $f\,(x, y)/z$）
- $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$ の半分。$A_t \le 0$ ⇒ 背面なのでカリング
- すべての三角形でのすべての画素の重心座標の重み。メモリを抑えるため画素のタイル単位で計算
- $k$ が繰り返し ⇒ 和をとる：画面上で線形に変化するのは $1/z$
- z バッファ：画素ごとに覆っている最も近い三角形（外側の画素は $+\infty$）
- テクスチャ座標、法線、位置、グーローの明るさを重み $\lambda/z$ で補間
- アフィン補間：正面を向いた三角形では正しく、傾いた三角形では誤り
labels:
  mesh: メッシュ
  resolution: 画像サイズ
  frames: 1 回転あたりのフレーム数
  tilt: $x$ 軸まわりの傾き
