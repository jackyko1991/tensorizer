title: 接触ネットワーク上の感染症
summary: 実際の対面接触ネットワーク上での SIR・SIS 感染症モデルです。数百回の確率的なアウトブレイクを1つのバッチテンソルとして同時に実行し、個体ベースの平均場 ODE と並べて表示します。アウトブレイクが広がるのは、隣接行列の最大固有値で決まるしきい値 $\beta/\gamma > 1/\lambda_{\max}(A)$ を超えたときだけです。スケールフリーネットワークでは、ハブにワクチンを接種すれば、ランダムな接種よりはるかに少ない回数で流行を止められます。
notes: 各人は S、I、R のいずれかの状態にあります。各ステップ $\Delta t$ で、感受性者は感染した接触者それぞれから率 $\beta$ で感染し、感染者は率 $\gamma$ で回復します（SIS では再び感受性者に戻ります）。テストでは次のことを確認しています。人はコンパートメント間を移動するだけであること、$k$-正則グラフでは $\lambda_{\max} = k$ となること、しきい値未満ではアウトブレイクが立ち消えになること、そして完全グラフ（全員が全員と接触し、$R_0 = \beta(N-1)/\gamma$）では大規模アウトブレイクの平均最終規模が Kermack–McKendrick（1927）の方程式 $z = 1 - e^{-R_0 z}$ に一致すること（$R_0 = 2$ で $z \approx 0.80$）。しきい値 $1/\lambda_{\max}$ は個体ベースの平均場を線形化して得られます。この ODE に対しては厳密ですが、ODE は隣人どうしを独立とみなし、感染が同じ辺を行き来して反響することを許すので、この小さく密でクラスター化したネットワークでは流行の規模を過大評価します。SIR の感染は、来たばかりの辺をそのまま戻ることはできません。そこで、メッセージパッシングのしきい値 $T = \beta/(\beta + \gamma) = 1/\lambda_{NB}$ も描いています。$\lambda_{NB}$ は非後退行列の最大固有値です（Karrer、Newman、Zdeborová 2014）。シミュレーション曲線は全試行の平均で、最初の症例の後に偶然途絶えた多くの試行も含むため、緩やかに立ち上がります。スケールフリーネットワークでは $\lambda_{\max}$ が最大のハブとともに大きくなるので、しきい値はごく小さくなります（Pastor-Satorras と Vespignani 2001）。ハブを取り除くと $\lambda_{\max}$ は急速に下がり、はるかに少ない接種回数で集団免疫に達します。平均次数が同じ Erdős–Rényi ネットワークには大きなハブがないので、狙いを定めた接種の効果はずっと小さくなります。データ：SocioPatterns「Contacts in a workplace」（フランスのオフィスビル、2013
  年。92 人、20 秒の時間窓で観測された対面接触 755 組を、ここでは集計して使用）、M. Génois et al., Network Science 3, 326 (2015)。Creative Commons パブリックドメイン提供（CC0）の下で公開、www.sociopatterns.org。BA と ER のネットワークは合成です。シミュレーション上の人や率は例示であり、実在するいかなる疾患のモデルでもありません。
meanings:
- 人 $i$ と $j$ が対面で観測されれば 1、そうでなければ 0（対称、密）
- 同時に実行する $B$ 個の実現それぞれで誰が感染しているか
- 繰り返される $j$ ⇒ 和をとる：各人の感染した接触者の数
- 感受性者が1ステップ $\Delta t$ の間に感染する確率。感染者は確率 $1 - e^{-\gamma \Delta t}$ で回復する
- 人 $i$ が感受性・感染・回復の各状態にある確率。RK4 で積分する
- 最大固有値：線形化した平均場 $\dot x = (\beta A - \gamma)x$ は $\beta \lambda_{\max} > \gamma$ のときにだけ成長する
- よく混ざった集団での最終規模。$z = 1 - e^{-R_0 z}$ の根（Kermack–McKendrick）
labels:
  beta_x_lambda: しきい値 $1/\lambda_{\max}$ を単位とした $\beta/\gamma$
  n_runs: 確率的な実現の数 $B$
  n_synthetic: 合成ネットワークの人数
  vacc_beta: ワクチン比較に用いる $\beta/\gamma$
