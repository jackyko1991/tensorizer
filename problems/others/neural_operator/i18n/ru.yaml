title: 'Фурье-нейрооператор: обучение оператора решения уравнения Бюргерса'
summary: 'Вместо того чтобы решать одно уравнение, фурье-нейрооператор (FNO) учит всё отображение $u_0(x) \mapsto u(x, T)$ вязкого уравнения Бюргерса $u_t + u\,u_x = \nu\,u_{xx}$ по парам, полученным спектральным решателем. Его ключевой слой — спектральная свёртка: преобразование Фурье, смешивание каналов отдельно для каждой моды с комплексными весами $R_{iok}$, сохранение только $m$ самых низких мод, обратное преобразование. Поскольку веса заданы на фурье-модах, обученная модель работает и на более мелкой сетке, чем та, на которой её обучали.'
notes: 'Обучающие данные — пары $(u_0, u(\cdot, T))$: случайные гладкие начальные условия (суммы фурье-мод $k \le 5$ с амплитудами, убывающими как $1/k$) и их решения, вычисленные на 256 точках псевдоспектральным решателем и прореженные до 64 точек для обучения. Сеть никогда не видит уравнения, только данные решателя. Тензорный урок — спектральная свёртка: после rfft каждый канал $i$ каждого образца $b$ превращается в фурье-коэффициенты $\hat v_{bik}$, а einsum(''bik,iok->bok'') суммирует по входному каналу $i$, но оставляет волновое число $k$ свободным индексом, так что каждая мода получает свою комплексную матрицу $C\times C$ $R_{\cdot\cdot k}$. Это свёртка с глобальным обучаемым ядром, вычисляемая как произведение в фурье-пространстве. Более высокие моды $k \ge m$ отсекаются; локальный путь $W_{oi}v_{bix}$ и нелинейность $\sigma$ возвращают мелкие детали. Ничто в $R_{iok}$, $W_{oi}$, $P$ или $Q$ не зависит от числа узлов сетки, поэтому обученный оператор работает на любой сетке, где больше
  $2m$ точек: правая нижняя панель подаёт ТЕ ЖЕ веса на 256 точек (сверхразрешение без дообучения) для тестового случая с самым крутым фронтом. Предсказания на 64 точках (кружки) лежат на кривой для 256 точек: эта инвариантность к дискретизации приближённая, потому что $\sigma$ порождает гармоники, которые на разных сетках по-разному накладываются (алиасинг), но ошибка на 256 точках равна ошибке на 64 точках. Точность ограничивает модель, а не сетка: почти-ударные волны требуют мод выше $m$ и являются самыми трудными случаями. Сравните с PINN в этой теме: PINN решает ОДНУ задачу, помещая уравнение в функцию потерь, и должна переобучаться для каждого нового начального условия; нейрооператор учит целое семейство задач по данным решателя, после чего каждое новое предсказание — один прямой проход. Консоль печатает время этого прямого прохода в сравнении с решателем: здесь в десятки раз быстрее, но для одномерного уравнения Бюргерса решатель и так дешёв, а генерация данных и обучение стоят гораздо
  дороже. Нейрооператоры окупаются там, где одна симуляция занимает часы (погода, турбулентность, течение в пористых средах) и нужно много запросов, и только внутри распределения, на котором их обучали. Попробуйте меньше мод $m$, меньшую обучающую выборку или большее $\nu$ (решения глаже, учить легче). Упрощения: один выходной момент времени $T$, фиксированное зерно, положение на сетке как обычный входной канал и без дополнения (padding) — область всё равно периодическая.'
meanings:
- 'входная функция: $u_0$ и координата в каждом из $N$ узлов сетки образца $b$'
- 'подъём: суммирование по $f$, 2 признака становятся $C$ каналами в каждой точке'
- комплексные фурье-коэффициенты каждого канала $i$, волновое число $k$
- 'комплексные веса, одна матрица $C\times C$ на каждую сохранённую моду $k < m$: они не зависят от $N$'
- 'повторяющийся $i$ ⇒ суммирование; по $k$ НЕ суммируется: каждая мода смешивается отдельно'
- 'усечение: только $m$ самых низких фурье-мод проходят через спектральную свёртку'
- 'обратно на любое число $N$ узлов сетки: именно здесь выбирается разрешение'
- локальный путь, одна и та же матрица $C\times C$ в каждой точке; $\sigma$ = GELU
- поточечная двухслойная проекция из $C$ каналов в предсказание $u(x, T)$
- 'относительная ошибка $L^2$ для каждого образца, усреднённая по батчу: функция потерь, которую минимизирует Adam'
- 'данные: псевдоспектральный решатель, RK4 с интегрирующим множителем и правилом 2/3 против алиасинга, все образцы сразу'
labels:
  nu: Вязкость $\nu$
  t_final: Выходное время $T$
  n_train: Обучающие образцы (начальные условия)
  modes: Сохраняемые фурье-моды $m$
  width: Каналы $C$
  epochs: Эпохи обучения
  lr: Скорость обучения Adam
