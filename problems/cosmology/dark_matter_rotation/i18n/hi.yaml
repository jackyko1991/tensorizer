title: आकाशगंगा घूर्णन वक्र और डार्क मैटर
summary: 'आकाशगंगा के केंद्र से दूर तारे और गैस बहुत तेज़ घूमते हैं: SPARC डेटाबेस के वास्तविक घूर्णन वक्र वहाँ भी सपाट रहते हैं जहाँ दृश्य द्रव्यमान केप्लरीय गिरावट की भविष्यवाणी करता है। सभी आकाशगंगाओं पर एक साथ एक बैच autograd फ़िट चार व्याख्याओं की तुलना करता है: केवल बैरियॉन (द्रव्यमान-दीप्ति अनुपात $\Upsilon$ के साथ), बैरियॉन और NFW डार्क मैटर हेलो, बैरियॉन और कोर वाला Burkert हेलो, और एक ही त्वरण $a_0$ वाला MOND (त्रिज्य त्वरण संबंध)। डार्क मैटर गुरुत्व से अनुमानित है, सीधे पकड़ा नहीं गया।'
notes: 'डेटा: SPARC (Lelli, McGaugh और Schombert 2016, AJ 152, 157) से छह आकाशगंगाएँ (NGC 3198, NGC 2403, NGC 6503, DDO 154, UGC 2885, NGC 7814), फ़ाइल Rotmod_LTG, बिना बदलाव data/sparc_rotation_curves.csv में कॉपी की गई। स्रोत http://astroweb.cwru.edu/SPARC/, जो SPARC शोधपत्र का उद्धरण माँगता है; Zenodo पर एक दर्पण (doi:10.5281/zenodo.16284118) CC-BY-4.0 के अंतर्गत जारी है। 3.6 μm पर द्रव्यमान-दीप्ति अनुपातों पर $\Upsilon_d = 0.5$, $\Upsilon_b = 0.7$ के आसपास 0.1 dex का पूर्व-वितरण है (बंद करने के लिए इसे 0 करें)। फ़िट क्या दिखाता है: कोई भी उचित $\Upsilon$ बैरियॉन को बाहरी सपाट वेगों तक नहीं पहुँचा पाता (DDO 154 को $\Upsilon_d \approx 19$ चाहिए, जो किसी भी तारकीय समष्टि से बहुत अधिक है), इसलिए अदृश्य द्रव्यमान या संशोधित गतिकी चाहिए, जैसा Rubin और Ford ने 1970 के दशक में प्रकाशीय स्पेक्ट्रा से पाया। दोनों हेलो आकार अच्छे बैठते हैं; बौनी आकाशगंगा DDO 154 कोर पसंद करती है (कस्प-कोर समस्या)। एक ही $a_0 \approx 1.1\times10^{-10}$ m/s² आश्चर्यजनक रूप से सभी आकाशगंगाओं का अच्छा वर्णन करता है,
  जैसा त्रिज्य त्वरण संबंध कहता है। ईमानदार स्थिति: डार्क मैटर उसके गुरुत्व से अनुमानित है (घूर्णन वक्र, लेंसिंग, गुच्छ, CMB, संरचना निर्माण); कोई डार्क मैटर कण सीधे नहीं पकड़ा गया। MOND एक प्राचल से घूर्णन वक्र अच्छी तरह फ़िट करता है पर आकाशगंगा गुच्छों, बुलेट गुच्छ और CMB के ध्वनिक शिखरों में कठिनाई पाता है, और इसका कोई सर्वमान्य सापेक्षिक रूप नहीं है। यहाँ दूरियाँ और झुकाव स्थिर हैं (उनकी त्रुटियाँ आगे नहीं बढ़ाई गईं), और MOND अपने सबसे सरल बीजीय रूप में लगाया गया है।'
meanings:
- आकाशगंगा $g$ के त्रिज्या $r$ पर प्रेक्षित वेग और त्रुटियाँ, सबसे लंबे वक्र तक भरी हुई
- वास्तविक डेटा बिंदु (1) या भराव (0)
- वेगों के वर्ग जुड़ते हैं; $\Upsilon$ SPARC डिस्क और उभार (जो $\Upsilon = 1$ के लिए गणित हैं) का पैमाना बदलता है
- शीतल डार्क मैटर सिमुलेशन का नुकीला हेलो, $\rho \propto 1/(x(1+x)^2)$
- कोर वाला हेलो, $\rho \propto 1/((1+x)(1+x^2))$
- सभी आकाशगंगाओं के लिए एक फलन और एक $a_0$; कोई हेलो नहीं
- दोहराया $r$ ⇒ हर आकाशगंगा के वास्तविक बिंदुओं पर योग
- 'सभी मॉडलों और आकाशगंगाओं के लिए एक अदिश: एक पश्च-पास सभी ग्रेडिएंट देता है (पहले Adam, फिर L-BFGS)'
labels:
  iterations: L-BFGS से पहले Adam पुनरावृत्तियाँ
  lr: Adam अधिगम दर
  prior_dex: $\Upsilon$ पूर्व-वितरण की चौड़ाई (dex, 0 = कोई नहीं)
