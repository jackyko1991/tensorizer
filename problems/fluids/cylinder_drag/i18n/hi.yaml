title: 'बेलन के पार प्रवाह: कर्षण और भँवर निर्मोचन'
summary: 'बेलन के पार प्रवाह का लैटिस बोल्ट्ज़मान (D2Q9) अनुकरण। समष्टियाँ (populations) $f_{xyi}$ einsum से बने साम्य की ओर संघट्ट करती हैं और torch.roll से प्रवाहित होती हैं; बेलन पर बल उससे टकराकर लौटने वाली हर समष्टि द्वारा सौंपे गए संवेग से आता है। Re ≈ 47 से ऊपर पश्च-प्रवाह (wake) कार्मान भँवर पथ (Kármán vortex street) बन जाता है: कर्षण स्पंदित होता है और उत्थापक बल (lift) एक ओर से दूसरी ओर झूलता है।'
notes: 'लैटिस मात्रक: नोड अंतराल और समय चरण 1, बेलन व्यास $D = 10$, अंतर्प्रवाह $U = 0.12$; श्यानता $\nu = UD/\mathrm{Re}$ विश्रांति काल $\tau = 3\nu + \tfrac12$ तय करती है। मॉडल नेवियर–स्टोक्स को तब पुनः उत्पन्न करता है जब $U$ लैटिस ध्वनि चाल $1/\sqrt3$ से काफ़ी कम हो। अंतर्प्रवाह एक स्थिर साम्य है, बहिर्प्रवाह अपने पड़ोसी की नकल करता है, ऊपर और नीचे आवर्ती हैं (अंतराल $H$ पर बेलनों की एक पंक्ति), और बेलन पूर्ण बाउंस-बैक (full-way bounce-back) का उपयोग करता है, जो वृत्त का सीढ़ीनुमा सन्निकटन है। संवेग-विनिमय बल बेलन से टकराने वाली हर समष्टि को गिनता है: वह उलट जाती है, इसलिए $2 f_i\mathbf e_i$ सौंपती है। चैनल संकरा होने ($D/H \approx 0.18$) के कारण Re = 100 पर कर्षण मुक्त-धारा $C_D \approx 1.4$ से अधिक है, और निर्मोचन थोड़ा तेज़ ($St \approx 0.16$–$0.2$)। पहले कुछ सौ चरण ध्वनिक प्रारंभिक क्षणिका हैं; औसत दूसरे आधे भाग से पढ़ें। शुरुआत में एक छोटा पार्श्व धक्का निर्मोचन जल्दी शुरू करता है।'
