source_hash: 2633dfd2d254
title: 実際の二光子データでヒッグス粒子を見つける
summary: 実際の 13 TeV ATLAS 衝突 10 fb$^{-1}$ 分（ATLAS Open Data、CC0）から得た約 95 000 組の光子対を二光子質量 $m_{\gamma\gamma}$ でビン分けし、autograd でフィットします：滑らかに減少するバックグラウンドと幅の狭いヒッグスピークの和です。プロファイル尤度比から $m_H$、信号強度 $\mu$、局所有意度 $Z = \sqrt{q_0}$ が得られ、バックグラウンドのみのトイ実験のバッチが look-elsewhere 効果を示します。さらにメキシカンハット型ポテンシャル $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ により、測定された質量がヒッグス自己結合 $\lambda = m_H^2/2v^2$ に変換されます。
notes: 2012 年 7 月、ATLAS と CMS は 125 GeV 付近に新しいボソンを発見したと発表しました。とりわけ二つのチャンネル、二光子と四レプトンで見られました。2013 年のノーベル物理学賞は、この発見が裏付けたメカニズムに対して Englert と Higgs に授与されました。ここでは光子チャンネルを実データでやり直します。ヒッグス粒子は光子に直接崩壊できない（光子は質量ゼロ）ため、W ボソンとトップクォークのループを介してのみ崩壊します。したがってこれは稀な崩壊（$\mathcal B \approx 0.23\%$）で、通常の光子対による巨大で滑らかなバックグラウンドの上に乗っています。このファイルの 10 fb$^{-1}$ では、結果は $m_H \approx 124.2 \pm 1.0$ GeV（PDG 2024：$125.20 \pm 0.11$）、$\mu \approx 1.0 \pm 0.4$（標準模型の生成率）、局所有意度は約 $2.7\sigma$（期待値は約 $3.4\sigma$）です。これは超過であって発見ではありません：2012 年の発見では、$5\sigma$ を超えるために複数の事象カテゴリー、両方のチャンネル、両方の実験が使われました。このスキャンは有益な警告にもなります：この小さなサンプルでは、143 GeV 付近のバックグラウンドのゆらぎが、124 GeV の本物のヒッグスとほぼ同じ大きさ（局所 $2.6\sigma$）になっています。これが look-elsewhere 効果です。広い窓のどこかに山が現れるのはよくあることなので、トイ実験でバックグラウンドだけからどのくらいの頻度で山が生じるかを見積もります：バックグラウンドのみのスキャンの約 13% が、どこかで 125 GeV の超過を上回り、Gross–Vitells の上方交差公式は 0.1 近くの大域 p 値を与えます。質量を固定したバックグラウンドのみのトイは $\tfrac12\delta(0) + \tfrac12\chi^2_1$ に従います（Wilks/Chernoff）。これが $Z = \sqrt{q_0}$ となる理由です。メキシカンハット：ミューオンの寿命から $v = (\sqrt2 G_F)^{-1/2} = 246.2$
  GeV が得られるので、測定された質量により $\lambda = m_H^2/2v^2 \approx 0.13$ が決まります。真空の輪のまわりの動径方向の揺れがヒッグス粒子であり、輪に沿った平坦な方向は縦偏極の W と Z になります。データ：ATLAS Open Data 13 TeV、2020 年リリース、GamGam サンプル（CERN Open Data Portal レコード 15006、doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS、ライセンス CC0；2016 年データ期間 A–D）。選別は ATLAS のアウトリーチ用 H → γγ ノートブックと同じです：光子トリガー、$p_T > 40$ および 30 GeV の tight で孤立した光子二つ、$|\eta| < 2.37$ かつ 1.37–1.52 の外側。sm_signal 列は対応する ATLAS シミュレーション（ggF、VBF、WH、ZH、ttH、125 GeV）を 10 fb$^{-1}$ に重み付けしたもので、$N_{SM} \approx 406$ 事象とピーク幅を与えます。簡略化：単一の包括的カテゴリー、ガウス型ピーク（実際のピークには裾があり、そのためフィットされた幅約 2.3 GeV はコア分解能より大きい）、系統誤差なし、指数多項式型バックグラウンド（次数を変えて偽信号への感度を試してみてください）。
meanings:
- 0.5 GeV ビンごとの実際の二光子カウント；m_low、m_high、events 列をもつ任意の CSV が使える
- スケールした質量 $x \in [0, 1]$ のべき；バックグラウンドは $\exp(X\theta)$
- 各ビンで積分したガウス型ピーク（erf）、幅 $\sigma$ は ATLAS シミュレーションにフィット
- 各ヒストグラムのポアソン尤度、autograd を通じて Adam + L-BFGS で最小化
- 繰り返される $n$ ⇒ 和をとる：Fisher scoring ですべてのトイ × すべての質量を一度にフィット
- プロファイル尤度比、フィットされた信号が負のときは 0
- $-\ln L$ の曲率から求めた $m_H$ と $\mu$ の誤差
- 複素平面の三本の半直線 $\phi = r\,e^{i\alpha}$ に沿ったポテンシャル：どの位相でも同じ曲線で、$|\phi| = v/\sqrt2$ に真空の輪がある
labels:
  m_min: フィット窓の始点
  m_max: フィット窓の終点
  degree: 指数部のバックグラウンド多項式の次数
  m_start: フィットの初期質量
  scan_step: 質量スキャンの刻み幅
  n_toys: バックグラウンドのみのトイ実験
