source_hash: d32c883229aa
title: 平面鏡と曲面鏡による反射
summary: 反射の法則を1つのベクトル公式で書く：光線の方向のうち面の法線方向を向く成分を反転させる。ランプからの光線は平面鏡で跳ね返り、平行光線は凹面鏡で跳ね返って焦点 $F = R/2$ 付近に集まる。
notes: 公式は $\mathbf d$ の $\mathbf n$ 方向成分だけを反転させるので、入射角と反射角は自動的に等しくなる。破線は平面鏡の裏側に反射光線を延長したもので、すべてランプの虚像で交わる。凹面鏡では軸に近い光線（近軸光線）だけが $F = R/2$ を通る。外側の光線は鏡により近い位置で軸と交わる（球面収差）。
meanings:
- 入射光線 $r$ の単位方向ベクトル、成分 $i \in \{x, y\}$
- 光線 $r$ が当たる点での鏡の単位法線
- 繰り返される $j$ ⇒ 和をとる：光線ごとに1つの内積（${}= -\cos\theta_i$）
- 反射方向、単位ベクトルのまま
- 曲面鏡の法線はその中心 $c$ を向く
labels:
  radius: 鏡の曲率半径 $R$
  n_rays: 鏡あたりの光線数
  aperture: 最も高い光線（$R$ に対する割合）
