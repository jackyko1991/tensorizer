title: 'Vom Thoraxröntgenbild zum Befund per DAG-Tensor: ein CNN und ein winziges LM zusammengefügt'
summary: 'Ein Lehrspielzeug, keine klinische Befunderstellung. Ein kleines CNN lernt sechs Befunde aus 410 NIH-Thoraxröntgenbildern, und ein winziges zeichenbasiertes GPT lernt Vorlagenbefunde ("enlarged heart. pleural effusion. no pneumothorax.") aus einem geschriebenen Label-Header, jedes für sich. Eine einzige DAG-Kante verbindet sie: Ein Konnektor macht aus den Befundwahrscheinlichkeiten des CNN einen weichen Header, sodass das LM allein aus dem Bild einen Befund schreibt. Der Trainingsprozess ist selbst ein Tensor-DAG (Regeln auf Ebenen, kritischer Pfad in Max-Plus, ein gebündelter Aufruf pro Regel über alle Seeds), verglichen mit demselben Netz, Ende-zu-Ende mit demselben Rechenaufwand trainiert, und anschließend auf 251 echten Texten (Abbildungsunterschrift + die Sätze, die dieses Röntgenbild zitieren) aus offen lizenzierten (CC BY) PubMed-Central-Artikeln feinabgestimmt. Stufe 2 ist schwach, wie bei so wenigen Paaren zu erwarten, und die Seite sagt das auch.'
notes: 'Was das ist. Ein Lehrspielzeug, keine klinische Befunderstellung: winzige Modelle, 64×64-Bilder, einige hundert verrauschte Labels und keine echten Radiologiebefunde. Nichts hier sagt etwas über klinische Genauigkeit aus. Die Idee (getrennt trainierte Netze, über einen DAG-Tensor verbunden, global optimiert, wobei der ganze Prozess selbst vom DAG-Tensor gesteuert wird) stammt von Jacky Ka Long Ko; dieses Problem überträgt das Zusammenfügen von CNN + winzigem LM aus dem vorigen Problem dieser Reihe auf Thoraxröntgenbilder und einen Text, der sich wie ein (sehr kurzer) Befund liest. Warum keine echten Befunde. Keine der frei verfügbaren Befundsammlungen erfüllt die hier verwendete Lizenzregel (offen, weiterverbreitbar, kommerzielle Nutzung erlaubt): IU X-ray / OpenI (Demner-Fushman et al. 2016) steht unter CC BY-NC-ND; MIMIC-CXR (Johnson et al. 2019), VinDr-CXR und BRAX erfordern einen akkreditierten Zugang mit Datennutzungsvereinbarung; CheXpert und PadChest sind nur für die Forschung.
  Stufe 1 verwendet daher Vorlagenbefunde, die im Code aus den NIH-Labelmengen erzeugt werden, was sie zu einer als Text verbalisierten Multi-Label-Klassifikation macht, und Stufe 2 verwendet Abbildungsunterschriften plus die Sätze, die die Abbildung zitieren, aus CC-BY-Artikeln von PubMed Central: kurze, heterogene Texte, für Fallberichte geschrieben, die oft auf Pfeile und Teilbilder verweisen. Was neu ist und was nicht. Befunderstellung aus Thoraxröntgenbildern ist ein aktives Forschungsfeld (Jing et al. 2018, R2Gen von Chen et al. 2020); ein vortrainierter Bildencoder, der über einen kleinen gelernten Konnektor mit einem Sprachmodell verbunden ist, ist der Aufbau von LLaVA (Liu et al. 2023) und BLIP-2 (Li et al. 2023). Was dieses Problem hinzufügt, ist die Orchestrierung: Der Modellgraph und der Trainingsprozess werden beide von der Tensor-DAG-Engine des Circle-of-Willis-Workflow-Problems ausgeführt (Regelgraph aus data/training.smk geparst, Kronecker-Jobgraph, boolesche Ebenen, kritischer
  Pfad in Max-Plus), jede Regel ein gebündelter Aufruf über die Seeds, und das per DAG gebaute Modell wird an einem Monolithen mit demselben Rechenaufwand gemessen. Daten. NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center; keine Nutzungsbeschränkungen, mit Namensnennung): 549 frontale PA-Bilder, eines pro Patient, sechs Befunde (Kardiomegalie, Erguss, Infiltrat, Atelektase, Pneumothorax, Raumforderung oder Knoten) oder keiner, höchstens zwei pro Bild; 410 zum Training, 139 zum Test. Die Labels wurden per NLP aus Befunden gewonnen und sind verrauscht (etwa 10 % oder mehr falsch). PMC: 316 Abbildungen von Thoraxröntgenbildern aus 316 Open-Access-Artikeln, jede unter CC BY (geprüft in der Lizenz im artikeleigenen XML; Regel: CC BY, CC BY-SA oder CC0, Ablehnung von NC, ND, sonstigen oder fehlenden). Die Kandidaten stammen aus den ROCOv2-Metadaten (Rückert et al. 2024), nur als Index von PMCIDs genutzt; nichts aus ROCOv2 ist beigefügt. Von 2114 geprüften Artikeln wurden 1575 angenommen
  und 539 wegen der Lizenz abgelehnt (alle CC BY-NC). Der Text der Stufe 2 ist die Unterschrift, gefolgt von den Sätzen desselben Artikels, die die Abbildung zitieren (315 von 316 Artikeln haben mindestens einen), nur ganze Sätze, bis zu 360 Zeichen, der Kontext des winzigen LM: Median 35 Wörter (IQR 26–45) gegenüber 12 (8–18) für die Unterschrift allein. Jede Abbildung und jeder Text ist in data/ATTRIBUTION.csv nachgewiesen; data/SOURCES.md enthält Quellen, Bedingungen, Anzahlen, Prüfsummen und Verarbeitung. Modelle und der Trainings-DAG. CNN: drei gruppierte Faltungen, 41 014 Gewichte, sechs Sigmoid-Ausgänge (Multi-Label, Positive nach ihrer Seltenheit gewichtet). LM: ein zweischichtiges Zeichen-GPT (d = 32, vier Köpfe, 40 108 Gewichte), auf jeder Vorlage trainiert, mit dem Label-Header als sechs Buchstaben vorneweg ("ce----", dann "enlarged heart. pleural effusion."). Konnektor (2848 Gewichte): Aus den sechs Wahrscheinlichkeiten $q$ und einem Slot-Vektor $S_t$ erzeugt er die $K = 6$ weichen
  Tokens, die den Header ersetzen. Ebenen: 0 train_cnn ∥ train_lm ∥ train_monolith; 1 train_connector (CNN und LM eingefroren); 2 global_finetune ∥ train_router; 3 caption_finetune (Konnektor + LM auf den PMC-Texten, CNN eingefroren); 4 evaluate. Die Tests prüfen die Ebenen und den kritischen Pfad, dass der Jobgraph nilpotent ist, dass zwei Seeds in einem Stapel genau so trainieren wie jeder allein (bis auf float32-Rundung), dass der Verlust eines Modells keinen Gradienten an die anderen schickt, dass die Konnektorstufe nur den Konnektor ändert und dass die MoE-Schicht mit festem Router der DAG-Verdrahtung bis auf 1e-6 gleicht, auch in den Gradienten. Befunde werden gierig geschrieben (mit einem Key/Value-Cache, gegen den einfachen Vorwärtsdurchlauf getestet) und per Schlüsselwörtern in Labels zurückgelesen, mit Negation ("no pneumothorax."). Ergebnisse der Stufe 1 (2 Seeds, 139 Testbilder, Mittel über die Seeds; results/stages.csv enthält alle Zahlen). Das CNN allein: mittlere AUROC 0.62
  (Zufall 0.5), Micro-F1 0.31 bei Schwelle 0.5 (zufälliges Raten mit der Trainingsprävalenz: 0.16). Seine Labels als Header für das LM allein geschrieben: Micro-F1 0.32, das LM verbalisiert also getreu (0.90 seiner Ausgaben sind wohlgeformte Vorlagen, selbst für Labelmengen, die es nie gesehen hat). Das zusammengefügte Modell: Micro-F1 0.22 nach der Konnektorstufe und 0.20 nach dem globalen Feintuning (0.15 bis 0.25 über Läufe und Seeds), jeder Befund eine wohlgeformte Vorlage, 0.26 bis 0.27 genau die Vorlage der wahren Labels. Der Monolith, dasselbe Netz Ende-zu-Ende auf den 410 Bild-Befund-Paaren mit denselben Multiplikations-Additionen trainiert (405 gemeinsame Schritte), schreibt für jedes Bild "clear lungs." oder "normal chest.": Micro-F1 0, exakt 0.27 (der Anteil normaler Bilder). Die DAG-Pipeline schlägt den Monolithen also klar, weil sie die Labelüberwachung des CNN und den ganzen Vorlagentext wiederverwendet, aber sie schlägt nicht das CNN allein: Ein Vorlagenbefund kann nur wiedergeben,
  was der Klassifikator weiß, und das zusammengefügte Modell, per Likelihood trainiert, schreibt den wahrscheinlichsten Befund, der bei mehrdeutigem Bild zu "normal" neigt, während die seltenheitsgewichtete Schwelle des CNN die Sensitivität begünstigt, die $F_1$ belohnt. Das Feintuning ändert wenig. DAG-Kante = MoE-Dispatch. Die Eingabeschicht als Mixture of Experts (Bildexperte = CNN + Konnektor, Textexperte = Token-Embedding) mit $G$ one-hot nach Datentyp liefert genau die DAG-verdrahteten Ausgaben (getestet). Ein linearer Router, als dichte Mischung mit eingefrorenen Experten trainiert und dann top-1 verwendet (routen, dann den gewählten Experten ausführen), schickt jede Position zum Experten ihrer Modalität (Routing-Genauigkeit 1.00 bei beiden Seeds), sodass seine Befunde und Werte denen des festen Routers gleichen. Ergebnisse der Stufe 2 (65 zurückgehaltene PMC-Abbildungen): schwach, wie erwartet. Nach 150 Schritten auf 251 Texten schreibt das Modell "chest x-ray showing" und dann Buchstabensalat:
  BLEU-1 0.05, ROUGE-L 0.06, Recall der Befund-Schlüsselwörter 0, Kreuzentropie auf den zurückgehaltenen Daten 2.32 nats pro Buchstabe. Gibt man ihm das Bild einer anderen Abbildung, ändert sich nichts (2.32 nats, dieselben Werte): Das Bild wird nicht genutzt. Eine blinde Baseline, die einen festen Trainingstext zurückgibt, erzielt höhere Werte (BLEU-1 0.17, ROUGE-L 0.22). Ein Zeichen-LM mit 40 000 Gewichten kann diese Sprache nicht aus etwa 70 000 Zeichen in einer CPU-Minute lernen; mit den auf den ersten Teilsatz gekürzten Unterschriften einer früheren Version (Median 6 Wörter) lag ROUGE-L bei etwa 0.28, aber diese Texte waren kaum Sätze. Die DAG-Maschinerie funktioniert; die Daten sind für Stufe 2 viel zu wenige. Zeit. Auf einer Desktop-CPU mit 6 Kernen dauert das Training etwa 85 s, wenn der Rechner ruhig ist, plus etwa 30 s für das GIF; die gemessenen Zeiten werden zwei- bis dreimal so lang, wenn andere schwere Jobs den Rechner teilen (der im GIF und in timings.csv gezeigte Lauf entstand
  unter solcher Last, daher sind seine Sekundenwerte größer), wobei die Unterschriftenstufe am stärksten betroffen ist. Mit einem Worker pro Regel ist der kritische Max-Plus-Pfad CNN → Konnektor → Feintuning → Unterschriften → Auswertung. Der Code wählt eine GPU, wenn torch eine sieht (pixi run -e cuda); die Standardumgebung hat einen CPU-Build von torch, daher stammen alle beigefügten Zahlen von der CPU. Ausprobieren. Mehr Unterschriftenschritte (Stufe 2 verbessert sich langsam), kein globales Feintuning (0 Schritte), weniger CNN-Schritte (das CNN begrenzt alles) oder ein einziger Seed, um zu sehen, wie stark die Seeds voneinander abweichen.'
meanings:
- Regel $s$ liest, was Regel $r$ schreibt; der Trainingsprozess, aus data/training.smk mit dem Parser des Circle-of-Willis-Problems geparst
- 'Ebene jeder Regel: CNN, LM und Monolith auf 0, Konnektor auf 1, Feintuning und Router auf 2, Unterschriften auf 3, Auswertung auf 4'
- Max-Plus-Endzeiten aus den gemessenen Regeldauern; $\max t$ ist der kritische Pfad
- die sechs Befundwahrscheinlichkeiten des CNN (Sigmoid, Multi-Label) für jedes Bild; die Modellachse $m$ wird zu den Gruppen einer gruppierten Faltung pro Schicht
- 'die DAG-Kante: Befundwahrscheinlichkeiten plus ein Slot-Vektor $S_t$ → ein LM-Eingabevektor; die $K = 6$ weichen Tokens ersetzen den geschriebenen Label-Header'
- 'Router: one-hot nach Datentyp (Header-Slot oder Buchstabe) oder ein gelernter Softmax über die Positionsmerkmale (dicht trainiert, top-1 verwendet)'
- 'wiederholtes $x$ ⇒ summiert: das Kombinieren der MoE-Schicht; jeder Experte $Y^x$ wird nur auf seiner zugewiesenen Gruppe berechnet'
- Logits des nächsten Buchstabens des winzigen GPT (einsum-Attention mit Modellachse, aus chain_of_thought)
- Verlust pro Modell auf den Befundbuchstaben nach dem Header (nats); die Summe der $M$ Verluste gibt jedem Modell seinen eigenen Gradienten
- 'wiederholtes $n$ ⇒ summiert: richtig Positive der aus jedem geschriebenen Befund zurückgelesenen Labels; Micro-$F_1$ fasst sie über $f$ zusammen'
labels:
  seeds: Seeds (unabhängige Replikate)
  steps_cnn: CNN-Vortrainingsschritte
  steps_lm: LM-Vortrainingsschritte (Vorlagenbefunde)
  steps_con: Konnektorschritte (CNN und LM eingefroren)
  steps_ft: Schritte des globalen Feintunings
  steps_router: Schritte des gelernten Routers
  steps_cap: Feintuning-Schritte auf Unterschriften (Stufe 2)
  lr_ft: Lernrate des Feintunings
  lr_cap: Lernrate der Unterschriftenstufe
