<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Left: the critical strip 0 &lt; Re s &lt; 1 with many zeros on the critical line Re s = 1/2 and narrow zero-free bands next to Re s = 0 and 1. Right: the real function Z(t) oscillating, its sign changes marking zeros gamma, with Gram points g between them.">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- critical strip, sigma from 0 (x=14) to 1 (x=74) -->
    <rect x="14" y="10" width="60" height="130" fill="#93c5fd" fill-opacity="0.35"/>
    <path d="M14,10 L20,10 Q17,90 14,140 Z" fill="#16a34a" fill-opacity="0.35"/>
    <path d="M74,10 L68,10 Q71,90 74,140 Z" fill="#16a34a" fill-opacity="0.35"/>
    <line x1="14" y1="140" x2="14" y2="8" stroke="#374151" stroke-width="2"/>
    <line x1="74" y1="140" x2="74" y2="8" stroke="#374151" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="8" y1="140" x2="84" y2="140" stroke="#374151" stroke-width="2"/>
    <line x1="44" y1="140" x2="44" y2="8" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="0.8">
      <circle cx="44" cy="124" r="2.6"/><circle cx="44" cy="113" r="2.6"/><circle cx="44" cy="105" r="2.6"/>
      <circle cx="44" cy="95" r="2.6"/><circle cx="44" cy="89" r="2.6"/><circle cx="44" cy="80" r="2.6"/>
      <circle cx="44" cy="73" r="2.6"/><circle cx="44" cy="66" r="2.6"/><circle cx="44" cy="58" r="2.6"/>
      <circle cx="44" cy="53" r="2.6"/><circle cx="44" cy="45" r="2.6"/><circle cx="44" cy="38" r="2.6"/>
      <circle cx="44" cy="31" r="2.6"/><circle cx="44" cy="25" r="2.6"/><circle cx="44" cy="18" r="2.6"/>
    </g>
    <text x="10" y="155" font-size="12" fill="#374151">0</text>
    <text x="40" y="155" font-size="12" fill="#374151">½</text>
    <text x="71" y="155" font-size="12" fill="#374151">1</text>
    <!-- Z(t) on the right, t running upwards to match the strip -->
    <line x1="160" y1="140" x2="160" y2="8" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M160,140 C190,132 190,120 160,113 C130,107 132,100 160,95 C176,92 176,86 160,80 C146,76 148,70 160,66 C182,62 182,55 160,53 C140,50 140,40 160,38 C186,35 186,27 160,25 C150,23 150,20 160,18" fill="none" stroke="#374151" stroke-width="2"/>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="0.8">
      <circle cx="160" cy="113" r="3"/><circle cx="160" cy="95" r="3"/><circle cx="160" cy="80" r="3"/>
      <circle cx="160" cy="66" r="3"/><circle cx="160" cy="53" r="3"/><circle cx="160" cy="38" r="3"/><circle cx="160" cy="25" r="3"/>
    </g>
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="154" y1="104" x2="166" y2="104"/><line x1="154" y1="87" x2="166" y2="87"/><line x1="154" y1="73" x2="166" y2="73"/>
      <line x1="154" y1="59" x2="166" y2="59"/><line x1="154" y1="45" x2="166" y2="45"/>
    </g>
    <line x1="52" y1="80" x2="148" y2="80" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="192" y="130" font-style="italic">Z(t)</text>
    <text x="170" y="100" font-size="12" font-style="italic" fill="#1e40af">γ</text>
    <text x="134" y="77" font-size="12" font-style="italic" fill="#b45309">g</text>
    <text x="200" y="22" font-style="italic">t</text>
  </g>
</svg>
