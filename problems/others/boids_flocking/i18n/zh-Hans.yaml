source_hash: ee1c00fce805
title: 集群行为：Vicsek 模型与 boids
summary: 椋鸟、鱼群和蝗虫都能在没有领袖的情况下集体移动。在 Vicsek 模型中，每只鸟以恒定速率飞行，并模仿邻居的平均方向，再加上最大幅度为 $\eta$ 的随机角度；在 Reynolds 的 boids 中，每只鸟则按分离、对齐和聚合三条规则转向。周期性盒子中全部 $N^2$ 个鸟与鸟之间的距离构成一个张量，整批噪声强度同时运行，以展示极序参量 $\varphi$ 的有序–无序相变。
notes: Vicsek 等人（1995）提出该模型，作为集体运动最简单的物理描述：对齐加上噪声。噪声低时，鸟群会达成一致方向（$\varphi \to 1$）；当 $\eta = 2\pi$ 时方向完全随机，$\varphi$ 只剩下量级为 $1/\sqrt N$ 的有限尺寸噪声。这在二维中相当了不起，因为 Mermin–Wagner 定理禁止具有连续对称性的平衡系统出现长程有序；运动中的鸟群能够绕开这一定理，是因为邻居关系不断变化（Toner 与 Tu 1995）。对于大系统，相变其实是不连续的，并会出现行进带（Grégoire 与 Chaté 2004）；但在这里的小 $N$ 下看起来是平滑的。Reynolds（1987）为计算机动画编写了 boids。这里他的三条规则被写成对 $i \leftrightarrow j$ 反对称的成对力，因此若不做速率归一化，鸟群的总动量会精确守恒（有测试检验这一点）；归一化到恒定速率 $v_0$ 后，鸟群才能自行选择方向。聚合力太强会让鸟群塌缩成一个旋转的球，所以把它设得较弱。可以试试更小的盒子（更高密度）或更大的半径，让有序更容易出现。
meanings:
- 盒子 $[0, L)^2$ 中 $N$ 只鸟的位置，每个噪声强度 $b$ 对应一个鸟群
- 从鸟 $i$ 到鸟 $j$ 最近周期像的位移；对 $i \leftrightarrow j$ 反对称
- 邻居矩阵，重复的 $k$ ⇒ 求和；鸟 $i$ 也把自己算在内
- 重复的 $j$ ⇒ 求和：邻居的平均方向
- 噪声角度，在 $[-\eta/2, \eta/2]$ 中均匀分布；$\eta = 2\pi$ 使方向完全随机
- boids：分离 $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$、对齐 $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$、聚合 $\sum_j A_{ij}\mathbf d_{ij}$
- 极序参量：鸟群一致移动时为 1，方向随机时约为 $1/\sqrt N$
labels:
  n_birds: 鸟的数量 $N$
  box: 盒子边长 $L$（邻居半径 $R = 1$）
  speed: 速率 $v_0$
  eta: 所显示鸟群的噪声 $\eta$
  n_noise: 批次中的噪声强度个数
  steps: 时间步数
  seed: 随机种子
