source_hash: 79a2f1fd310e
title: Der kosmische Mikrowellenhintergrund als perfekter Schwarzer Körper (COBE FIRAS)
summary: Das FIRAS-Instrument von COBE hat den kosmischen Mikrowellenhintergrund bei 43 Frequenzen gemessen und den perfektesten Schwarzen Körper gefunden, der je beobachtet wurde. Ein Stapel von vier Modellen (Plancksches Gesetz allein, mit einem Bose–Einstein-Potential $\mu$, mit einer Compton-$y$-Verzerrung, mit beiden) wird in einem einzigen Tensor an die echte FIRAS-Tabelle angepasst, die Jacobi-Matrix liefert Autograd. Die Anpassung ergibt $T \approx 2.725$ K mit $\chi^2 \approx 45$ bei 42 Freiheitsgraden, Residuen unter $10^{-4}$ des Maximums, Verzerrungen verträglich mit null ($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$) und aus $T$ etwa 411 Photonen pro cm³.
notes: '1990 verglich FIRAS (das Far-Infrared Absolute Spectrophotometer auf COBE der NASA) den Himmel mit einem externen Schwarzkörper-Kalibrator und fand keinen Unterschied; das endgültige Spektrum (Fixsen et al. 1996) weicht um weniger als 50 Millionstel des Maximums von einer Planck-Kurve ab. John Mather und George Smoot teilten sich den Nobelpreis für Physik 2006 „für ihre Entdeckung der Schwarzkörperform und der Anisotropie der kosmischen Mikrowellenhintergrundstrahlung“. Ein so perfekter Schwarzer Körper bedeutet, dass das frühe Universum heiß, dicht und im thermischen Gleichgewicht war: Energie, die nach der Rotverschiebung $z \sim 2\times10^6$ freigesetzt wurde, hätte ein chemisches Potential $\mu$ (Bose–Einstein-Spektrum, $z \gtrsim 2\times10^5$) oder eine Compton-$y$-Verzerrung hinterlassen (heiße Elektronen, die Photonen Energie zuführen, $z \lesssim 5\times10^4$; dieselbe Form wie der Sunyaev–Zel''dovich-Effekt, mit Nullstelle bei $x = 3.83$ bzw. 217 GHz, und sie erhält die
  Photonenzahl). Unsere Anpassung mit nur den diagonalen Fehlern ergibt 95-%-Grenzen von etwa $|\mu| < 7\times10^{-5}$ und $|y| < 6\times10^{-6}$; die veröffentlichten FIRAS-Grenzen, $|\mu| < 9\times10^{-5}$ und $|y| < 1.5\times10^{-5}$, sind weiter, weil sie die volle korrelierte Kovarianz verwenden und systematische Unsicherheiten (Kalibrierung und galaktische Emission) einschließen. Die Temperatur ist mit Vorsicht zu lesen: Statistisch legt die Anpassung $T$ auf etwa $10^{-5}$ K fest, doch die absolute Skala stammt aus der Thermometrie des Kalibrators, und die LAMBDA-Tabelle schreibt das Spektrum als Schwarzen Körper von 2.725 K plus die veröffentlichten Residuen, sodass $T = 2.725$ K eingebaut ist; der beste absolute Wert ist heute $2.72548 \pm 0.00057$ K (Fixsen 2009). Aus $T$ folgen $n_\gamma \approx 411$ cm$^{-3}$ und $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$. In der Animation zeigt das linke Feld, wie die Anpassung vom Startwert aus konvergiert (Fehlerbalken 400-fach vergrößert,
  wie in der berühmten Abbildung, sonst unsichtbar); das rechte Feld zoomt dann in die Residuen in Einheiten von $10^{-4}$ des Maximums, zusammen mit den Formen, die ein $\mu$ oder $y$ an unserer 95-%-Grenze nach erneuter Anpassung von $T$ hinterlassen würde. Daten: Tabelle 4 von D. J. Fixsen et al., ApJ 473, 576 (1996), aus dem LAMBDA-Archiv der NASA (https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt), gemeinfrei, beigelegt als data/firas_monopole.csv.'
meanings:
- die 43 FIRAS-Wellenzahlen (cm$^{-1}$), Intensitäten und $1\sigma$-Fehler (MJy/sr)
- eine Zeile $(T, \mu, y)$ pro Modell $b$ des Stapels
- $h\nu/kT$ durch Broadcasting von $(B,1)$ gegen $(F,)$
- Bose–Einstein-Besetzung plus der Kompaneets-$y$-Term, mal $2hc\tilde\nu^3$
- 'Autograd von $\sum_b I_{bf}$: Die Zeilen sind unabhängig, daher liefert ein Aufruf die Jacobi-Matrix jedes Modells'
- 'wiederholtes $f$ ⇒ summiert: die Fisher-Matrix; ihre Inverse ist die Kovarianz'
- ein Levenberg–Marquardt-Schritt für alle Modelle gleichzeitig
- Anpassungsgüte pro Modell
labels:
  T_init: Startwert für $T$
  steps: Levenberg–Marquardt-Schritte
