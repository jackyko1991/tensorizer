title: ¿Dónde podría estar la antimateria? Criterios para un universo de antimateria
summary: Una hipótesis especulativa, no física establecida. El paso 2 mostró que una sola línea de universo que cruza cada corte temporal da tanta materia como antimateria, mientras que observamos unos $10^{80}$ bariones y nada de antimateria. La salida es una línea de universo equilibrada globalmente, con la antimateria muy lejos o en un universo espejo. Este paso enumera lo que tal universo de antimateria debe cumplir y contrasta cada criterio con los datos. No hay antinúcleos en los rayos cósmicos ni rayos gamma de aniquilación procedentes de cúmulos. Los dominios deben ser al menos tan grandes como el horizonte, unos 16 Gpc. Una línea de universo aleatoria es fantásticamente improbable. Queda el universo simétrico CPT de Boyle, Finn y Turok, cuyas predicciones (un neutrino más ligero sin masa, $r = 0$) concuerdan hasta ahora con los datos y podrían fallar.
notes: 'Estado: especulativo. Es la hipótesis propia del autor (véase la descripción de la serie), no física establecida. Paso 7 de la hipótesis de proyección, un paso teórico para el postulado P3 (todas las partículas son proyecciones de un único objeto). El paso 1 (cosmology/projection_postulate) enunció los postulados. El paso 2 (cosmology/projection_one_particle) descartó la forma más simple de P3: una línea de universo cerrada cruza cada corte temporal tantas veces hacia delante (materia) como hacia atrás (antimateria), una abierta añade como mucho una partícula neta, y el universo contiene unos $9\times10^{79}$ bariones y nada de antimateria. Los pasos 3 a 6 (projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests) pusieron a prueba P5, P4 y P1-P2. Este paso toma la salida del paso 2. La línea de universo está equilibrada globalmente, y la antimateria se encuentra más allá de nuestro horizonte o en un antiuniverso. La pregunta es qué
  debe cumplir tal universo de antimateria para concordar con los postulados, y si lo cumple. Primero, la física conocida. Las condiciones de Sájarov (1967) explican un exceso de materia mediante la violación del número bariónico, la violación de C y de CP y el alejamiento del equilibrio. Predicen un universo hecho de materia en todas partes, con $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (Planck 2018, $\Omega_b h^2 = 0.0224$). La alternativa, un universo simétrico con regiones separadas de materia y antimateria, se estudió a partir de los años sesenta (Alfvén y Klein, Omnès). Steigman (ARA&A 14, 339, 1976) revisó las pruebas, y Cohen, De Rújula y Glashow (ApJ 495, 539, 1998) cerraron el caso de los dominios dentro del universo visible. Todos los datos proceden de data/antimatter_criteria.csv, que contiene números citados con sus fuentes. El número de dimensiones $D$ en las que vive la línea de universo es un parámetro. Solo interviene su coordenada temporal, así que ningún resultado depende
  de $D$. Criterio 1: nada de antimateria mezclada en las cercanías. BESS-Polar no encontró antihelio entre unos 48 millones de núcleos de helio. El límite al 95 % es antihelio/helio $< 6.9\times10^{-8}$ para un espectro similar al del helio y $1.0\times10^{-7}$ sin esa suposición (Abe et al., PRL 108, 131301, 2012). AMS-02 no ha publicado ninguna detección de antinúcleos. Rayos gamma: en el gas caliente de un cúmulo, una fracción de antiprotones $f$ se aniquila a la tasa $f\,n_p^2\langle\sigma v\rangle$, con $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s (una elección de orden de magnitud). Cada aniquilación da 2.1 fotones por encima de 100 MeV en el espectro de desintegración de piones usado aquí. Para el cúmulo de Coma (modelo beta, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$) y el límite de Fermi-LAT $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016), esto da $f < 9\times10^{-8}$. Satisfecho: cualquier antimateria
  debe estar fuera de los cúmulos y fuera del alcance de los rayos cósmicos, que están confinados a decenas de Mpc. Criterio 2: ningún dominio dentro de nuestro horizonte. Si dominios de materia y antimateria de tamaño comóvil $d$ estuvieran en contacto, la aniquilación en sus paredes sería inevitable después de la recombinación. El modelo aquí es la versión simple del argumento de Cohen, De Rújula y Glashow. El área de pared por unidad de volumen es $3/d$ para cubos de lado $d$ ($n/d$ en $n$ dimensiones, comprobado), y los bariones fluyen hacia las paredes a $\kappa$ veces la velocidad del sonido del gas. El gas sigue la temperatura del CMB hasta $z\approx150$ y después se enfría adiabáticamente. Cada aniquilación da 3 fotones procedentes de la desintegración de piones neutros. Los fotones se desplazan al rojo hasta hoy, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$, y esa integral se comprueba frente a una forma cerrada. La aniquilación se cuenta desde la recombinación ($z_{max}
  = 1000$) hasta $z = 20$. Como en CDG, las épocas posteriores se dejan fuera porque dependen de la formación de estructuras; incluirlas solo aumentaría el flujo. El flujo es exactamente $\propto 1/d$ (comprobado). Se compara con el fondo de COMPTEL, $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ de 0.8 a 30 MeV (Kappadath et al. 1996), y con el fondo isótropo de Fermi-LAT ($7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ por encima de 100 MeV, índice 2.32, corte en 279 GeV; Ackermann et al., ApJ 799, 86, 2015). Los fotones de $z\sim20$-$300$ llegan entre 1 y 10 MeV, donde COMPTEL fija el límite. Resultado: la predicción supera los datos en un factor 160 para $d = 100$ Mpc, 16 para 1 Gpc y 1.6 para 10 Gpc. El tamaño mínimo de dominio es $d_{min}\approx16$ Gpc (a 8.5 MeV, $\kappa = 1$), mayor que el radio de 14.3 Gpc del universo observable. CDG llegaron a la misma conclusión: el dominio de materia debe ser casi todo el universo visible. Es un modelo
  de juguete, y $d_{min}$ escala con $\kappa$. CDG argumentan que el calentamiento por aniquilación acelera el flujo entrante, lo que refuerza la cota. Restringido: cualquier antimateria debe estar más allá de nuestro horizonte, donde ningún telescopio puede ponerla a prueba. Criterio 3: ajuste fino. Supongamos que la antimateria está más allá del horizonte en el mismo corte y que nada la ordena. Una línea de universo aleatoria equilibrada da entonces a nuestra región una carga neta del orden de $\sqrt M$ para $M$ cruces. La varianza de la carga neta es igual a $M$, o a $M(T-M)/(T-1)$ cuando el total de $T$ cruces está equilibrado (ambos comprobados). La probabilidad de un exceso grande sigue la función de tasa de Cramér, $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$, comprobada frente a la cola binomial exacta. Hoy vemos $N_B\approx9\times10^{79}$ bariones y nada de antimateria, así que cada cruce debe tener el mismo signo: $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$. Si se interpreta
  en cambio como el exceso del universo primitivo de $9\times10^{79}$ entre unos $1.5\times10^{89}$ pares (uno por fotón), es $\log_{10}P\approx-1.2\times10^{70}$. Sin un mecanismo, la línea de universo equilibrada fracasa. El mecanismo tendría que ser una condición de contorno que correlacione los signos de todos los cruces en nuestra región: una simetría, no una fluctuación. Criterio 4: el universo simétrico CPT. Boyle, Finn y Turok (PRL 121, 251301, 2018) proponen que el universo posterior al Big Bang es la imagen especular CPT de un universo anterior a él, de modo que el par en su conjunto no viola CPT. A continuación, la alineación del autor entre P3 y este modelo. Una línea de universo que cruza $t = 0$ es materia de nuestro lado. Los observadores del espejo tienen la flecha del tiempo opuesta, así que ven el mismo tramo como antimateria. La salvedad demostrada en el paso 2 sigue vigente: en cualquier corte completo, una línea de universo continua tiene $|Q|\leq1$, así que el espejo
  por sí solo no ayuda. La alineación funciona si la línea de universo se enrolla a través del Big Bang y a través de la frontera futura, con los dos extremos del tiempo conforme pegados entre sí. Es una suposición adicional más allá del modelo publicado, y la extensión C del paso 2 en un lugar nuevo. Un lazo que se enrolla $w$ veces se lee $+w$ en cada corte de nuestro lado y $-w$ en cada corte espejo, leído con la flecha propia del espejo. El total es cero (comprobado). El exceso es ahora un entero topológico, no una fluctuación, aunque $w\approx10^{80}$ sigue introduciéndose a mano. Las predicciones publicadas del modelo (del resumen de Boyle, Finn y Turok), contrastadas con números citados: (a) El neutrino más ligero no tiene masa. Con las diferencias de NuFIT 6.0 ($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, $\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ normal, $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ invertido), esto fija $\Sigma m_\nu = 0.0588$ eV (ordenamiento normal) o $0.0989$
  eV (invertido), y $m_\beta = 0.009$ o $0.049$ eV. KATRIN acota $m_\beta$ por debajo de 0.8 eV (Nature Physics 18, 160, 2022) y de 0.45 eV (Science 388, 180, 2025), muy por encima de ambos valores. Planck 2018 da $\Sigma m_\nu < 0.12$ eV, lo que permite ambos. DESI 2024 ($< 0.072$ eV) y DESI DR2 ($< 0.064$ eV, $\Lambda$CDM) excluyen el caso invertido y permiten el normal. DESI DR2 señala además una tensión con el mínimo de las oscilaciones, y un neutrino más ligero sin masa es el caso con menos tensión. (b) La materia oscura es un neutrino dextrógiro estable de masa $4.8\times10^8$ GeV. Eso está muy por encima de cualquier colisionador y no da ninguna señal de detección directa, así que no puede ponerse a prueba ahora. (c) No hay ondas gravitacionales primordiales, así que $r = 0$. BICEP/Keck da $r < 0.036$ (95 %, PRL 127, 151301, 2021), lo cual es compatible. La prueba real es $\sigma(r)\sim10^{-3}$: el objetivo de CMB-S4 (el proyecto se detuvo en julio de 2025), y ahora de LiteBIRD y
  del Simons Observatory. Tabla de veredictos. (1) Nada mezclado en las cercanías: requerido; satisfecho. Un solo núcleo de antihelio o rayos gamma de aniquilación procedentes de un cúmulo lo falsarían. (2) Ningún dominio dentro del horizonte: requerido; restringido ($d\gtrsim16$ Gpc). Un exceso en el fondo de MeV o una distorsión del CMB debida a paredes más cercanas lo falsarían; más allá del horizonte es imposible de verificar. (3) Sin ajuste fino: requerido; falla para una línea de universo aleatoria ($\log_{10}P\sim-10^{70}$ a $-10^{79}$), y solo un mecanismo elimina el problema. (4a) Neutrino más ligero sin masa: restringido, compatible hasta ahora. Una masa medida del más ligero mayor que cero lo falsa, por ejemplo $\Sigma m_\nu$ claramente por encima de 0.0588 eV en ordenamiento normal. (4b) Materia oscura de neutrinos dextrógiros pesados: imposible de verificar ahora. Que la materia oscura se identificara como otra cosa lo falsaría. (4c) $r = 0$: compatible. Modos B primordiales
  con $r\gg10^{-3}$ lo falsarían. Conclusión: el P3 extendido solo sobrevive como una línea de universo equilibrada a través de un universo espejo CPT, enrollándose a través del Big Bang. En esa forma hereda predicciones falsables. Una masa no nula del neutrino más ligero, o modos B primordiales con $r\gg0$, falsarían la alineación con el espejo CPT. Los pasos anteriores o bien reproducían la física estándar, o bien se encontraban con datos que la hipótesis podía absorber. Este es el primer paso de la serie con una prueba que podría fallar.'
meanings:
- '$z$ repetido ⇒ sumado: intensidad difusa de rayos gamma hoy para cada tamaño de dominio $d$ y energía de fotón $E$'
- 'aniquilaciones por cm$^3$ comóvil y por segundo en las paredes: área de pared por unidad de volumen $3/d$ por el flujo entrante $n_b v$'
- fotones por MeV de una aniquilación a la energía emitida; $j$ (energía del pion) repetido ⇒ sumado
- tamaño de dominio más pequeño que permiten los fondos de COMPTEL y Fermi-LAT (el flujo es exactamente $\propto 1/d$)
- mayor fracción de antiprotones en el gas del cúmulo de Coma, a partir del límite de flujo de Fermi-LAT
- carga neta de $M$ cruces con signos aleatorios; su varianza es $M$
- probabilidad de que una línea de universo aleatoria dé a nuestra región una carga neta $Q$ de $M$ cruces (función de tasa de Cramér)
- carga neta en nuestros cortes y en sus imágenes CPT, cada una leída con su propia flecha del tiempo; $s$ (segmento) repetido ⇒ sumado
- suma de las masas de los neutrinos a partir de la masa más ligera $m_l$ y las diferencias de NuFIT
labels:
  dims: Dimensiones $D$ del espacio en el que vive la línea de universo (libre)
  speed_factor: Velocidad de entrada en las paredes $\kappa$, en unidades de la velocidad del sonido del gas
  z_max: Desplazamiento al rojo $z_{max}$ en el que empieza la aniquilación en las paredes (recombinación)
  winding: Número de enrollamiento $w$ de la línea de universo a través del Big Bang
