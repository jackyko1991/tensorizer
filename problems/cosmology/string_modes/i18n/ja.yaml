source_hash: 49928f544229
title: 相対論的な弦のモードと T 双対性
summary: 光円錐ゲージでの Nambu–Goto 弦は 24 個の自由な横波である。バッチ化した一回のモード和で、振動する閉弦または開弦を描く。そのモードのエネルギーがレベル $N$ であり、$\alpha' M^2 = N - 1$（開弦）または $4(N-1)$（閉弦）と量子化され、状態数 $1, 24, 324, 3200, \dots$ はべき級数 $\prod (1-q^n)^{-24}$ から読み取れる。半径 $R$ の円上では、閉弦のスペクトルは $R \leftrightarrow \alpha'/R$ で不変である：これが T 双対性である。弦理論は直接的な実験的確認のない理論的枠組みである。
notes: 単位 $\alpha' = 1$。現状：弦理論は数学的に無矛盾な量子重力の候補となる枠組みだが、それを支持する直接的な実験的証拠はない。ここに示すものに、検証済みの予言は一つもない。示しているのはボソン弦の標準的な教科書の数学である（Goddard–Goldstone–Rebbi–Thorn 1973；Polchinski、String Theory 第 1 巻）：光円錐量子化は $D = 26$、切片 $a = 1$ のときにのみ無矛盾であり、$N = 0$ にタキオン（$M^2 < 0$、赤）、開弦では $N = 1$ に質量ゼロのベクトル、閉弦では $N = \tilde N = 1$ に重力子、B 場、ディラトンが現れる。超弦（D = 10）ではタキオンが取り除かれる。描かれた弦は、振動子エネルギーがレベル $N$ に等しい古典的配位である（モード $n$ の各量子は $n$ 単位を運ぶ）。閉弦では右向きと左向きのモードを $N = \tilde N$ となるよう選び（レベル・マッチング、$\int \dot X\cdot X'\,d\sigma = 0$）、弦は静止系にあるので光円錐座標 $X^-$ は描かない。T 双対性パネルは、半径の変化に伴ういくつかの状態の質量を追う：運動量状態（$n/R$）と巻き付き状態（$wR/\alpha'$）は $R \to \alpha'/R$ で入れ替わり、自己双対半径 $R = \sqrt{\alpha'}$ では追加の状態が質量ゼロになる。タイトルでは、打ち切ったスペクトル全体が縮退度も含めて $R$ と $\alpha'/R$ で同一であることを確認する。
meanings:
- 24 個の横方向 $i$ のうち 3 方向における右向き・左向きモード $n$ の複素振幅
- 各世界面点での各モードの位相 $e^{-in(\tau-\sigma)}$（ブロードキャスト）
- 繰り返されるモード添字 $n$ ⇒ 和をとる：各 $\tau$ と $\sigma$ での弦の形
- エネルギー密度。$\sigma$ で積分するとレベル $N$ を与える（Parseval）
- ブロードキャストした整除マスクから得る約数和：$\log\prod(1-q^n)^{-1} = \sum_m \sigma_1(m) q^m/m$
- 打ち切ったべき級数は下三角 Toeplitz 行列のように掛け算されるので、級数の $\exp$ は行列指数関数になる
- レベル・マッチングを満たすすべての状態 $N-\tilde N = nw$ の質量を、すべての半径 $R_b$ で一度に計算
labels:
  string: 弦の種類
  mode_a: 右向きモード $n$（開弦：第 1 モード）
  mode_b: 左向きモード $\tilde n$（開弦：第 2 モード）
  n_points: 弦に沿った点の数 $\sigma$
  n_levels: 表示する質量レベル数
  R_max: 掃引での最大の円半径 $R/\sqrt{\alpha'}$
