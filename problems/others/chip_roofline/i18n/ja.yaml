source_hash: 936404bf1075
title: チップのルーフラインを測る
summary: このコードが動いているマシンはどれくらい速いでしょうか。大きなメモリコピーの時間を測って帯域幅 $\beta$ を求め、$n\times n$ 行列積 $C_{ij} = A_{ik}B_{kj}$ を FP64、FP32、TF32、BF16、FP16 で測って各精度の演算速度 $\pi$ を求めます。するとルーフライン $P(I) = \min(\pi, \beta I)$ から、どのカーネルがチップの全速力で動き、どのカーネルがメモリ待ちになるかがわかります。コーディング技法 ▸ チップ では、あなたの結果をほかのチップの仕様表と並べて表示します。
notes: 仕様表に載っているのはピーク値です。測定すると、PyTorch があなたのマシンで実際に出せる速度がわかります。大きな行列積ではふつうピークの 50–90% です。GPU の処理は非同期なので、どの計時もデバイスの完了を待ち（synchronize）、ウォームアップの後で何回か実行した中央値を取ります。NVIDIA GPU では FP32 の行列積を 2 回測ります。1 回は本来の FP32 で、もう 1 回は TF32 テンソルコア（torch.set_float32_matmul_precision("high")）で測ります。この設定は、仮数部のビットを黙って速度と引き換えにします。Apple の GPU バックエンド（MPS）には float64 がないため、そこでは FP64 を飛ばします。一般向け GPU の FP64 速度は FP32 のごく一部しかなく、これは物理計算では重要です。行列サイズを大きくしてみましょう。行列積が演算律速になるまで速度は上がり続け、メモリコピーは帯域幅のあたりにとどまります。
meanings:
- 大きなコピー（読み込み + 書き込み）から求めたメモリ帯域幅、GB/s
- 精度 $p$ で実際に得られた行列積の速度、TFLOP/s
- 繰り返される $k$ ⇒ 和を取る：$n^3$ 回の積和
- 移動 1 バイトあたりの FLOP：$b$ バイトの要素なら $2n/(3b)$
- 演算強度 $I$ のカーネルが到達できる上限
labels:
  matrix_size: 行列サイズ $n$
  copy_mb: コピーサイズ
  repeats: 計時の繰り返し回数
