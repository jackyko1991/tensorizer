source_hash: 278f16a6d4b6
title: 愛因斯坦 1905：運動物體與 $E = mc^2$
summary: 沿著愛因斯坦本人在 1905 年兩篇相對論論文中的思路前進。從兩條公設出發——所有慣性參考系中物理定律相同、光速恆為 $c$——一批光鐘顯示：運動的時間變慢 $\gamma$ 倍，尺縮短為 $1/\gamma$，同時性取決於觀察者，速度相加永遠不會超過 $c$。質能論文（物體放出光能 $L$ 時失去質量 $L/c^2$）以 He-4 的質量虧損與 $e^+e^-$ 湮滅來驗證；再以 Frisch 與 Smith 1963 年在華盛頓山與海平面量得的緲子計數作擬合，得到 $\gamma \approx 9$。
notes: 這是愛因斯坦 1905 年四篇「奇蹟年」論文之一——其實是其中兩篇：〈論動體的電動力學〉（六月）與〈物體的慣性與其所含能量有關嗎？〉（九月）。另外兩篇是光量子論文（量子：光電效應與光量子）與布朗運動（熱力學：隨機漫步與擴散）。把相對論當作幾何來看，請見狹義相對論：閔考斯基圖與勞侖茲變換（天文）；場張量部分見 $F^{\mu\nu}$ 的勞侖茲變換（電磁）；碰撞部分見四維動量與二體衰變（核與粒子）。單位取 $c = 1$，鏡間距 $D = 1$。愛因斯坦的質量論證：靜止物體向前放出 $L/2$、向後放出 $L/2$；在以 $v$ 運動的參考系中，光帶走 $\gamma L$，比 $L$ 多，而兩個參考系中的能量守恆迫使物體的動能減少 $L(\gamma - 1)$，正好是質量 $L/c^2$ 所攜帶的動能（他只保留了低速項 $\tfrac12 (L/c^2)v^2$）。原子質量取自 AME2020。真實數據（data/frisch_smith_1963_muons.csv）：D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508——減速到相同能量的緲子，在華盛頓山 1917 m 處為每小時 $563 \pm 10$ 個，在海平面為每小時 $408 \pm 9$ 個（論文公布的測量值；維基百科的摘要把後者四捨五入為 412）。飛行約需 6.4 μs，幾乎是緲子壽命 2.2 μs 的三倍，所以若沒有時間膨脹，每小時只會有約 30 個抵達；計數給出緲子自身時鐘經過 0.71 μs，$\gamma \approx 9.1 \pm 0.8$（論文配合其量得的衰變曲線得到 $8.8 \pm 0.8$）。由速度出發的預測，對穿越大氣時從 $\beta \approx 0.995$ 減速到 $\approx 0.989$ 的過程積分（游離損失 $dE/dx$，等溫大氣）：約 8.4，與論文一致。Rossi 與 Hall（1941）最早在 Echo Lake 與丹佛以宇宙線緲子顯示了這個效應。
meanings:
- 時刻 $t$ 時時鐘 $b$ 的光子：水平速度 $\beta_b$，鉛直速度 $\sqrt{1-\beta_b^2}$，因此恆為 $c$
- 一次滴答需時 $\gamma\cdot 2D/c$；滴答次數由鋸齒路徑數出
- 一批沿 $x$ 方向的勞侖茲變換，$\eta = \operatorname{diag}(-1, 1, 1, 1)$
- 重複的 $\nu$ ⇒ 求和：每個參考系中的每個事件；火車上的閃光得到 $\Delta t' = -\gamma\beta\Delta x$
- 時空間隔，在每次勞侖茲變換下不變
- 從運動參考系看到的兩道光脈衝：合計 $\gamma L$，因此 $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$
- 質量虧損 × 931.494 MeV/u（He-4：28.30 MeV）
- 對兩個緲子計數率的 $\chi^2(\gamma)$ 以 autograd 做牛頓迭代
labels:
  beta_fast: 最快時鐘的速度 $\beta$
  n_clocks: 光鐘數目
  dEdx: 緲子在空氣中的能量損失 $dE/dx$
