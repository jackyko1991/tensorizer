source_hash: 7dfc00ae0203
title: デジタル風洞：STL 飛行機まわりの 3D 格子ボルツマン法
summary: OpenLB ライブラリ風の小さな 3D 風洞です。模型飛行機の STL ファイルを三角形テンソルに読み込み、すべての格子点で一度にレイキャストでボクセル化し、迎え角をつけて、TRT または MRT 衝突、任意の Smagorinsky LES、物体上のバウンスバックを備えた D3Q19 格子ボルツマン流れに置きます。抗力と揚力は運動量交換から求め、流線（一括 RK4）とトレーサー粒子が流れを示します。球のケースで OpenLB 自身の事前計算と照合し、残差を表示します。
notes: 格子単位：格子間隔と時間刻みは 1、一様流 $U = 0.08$（マッハ 0.14）、粘性 $\nu = UL/\mathrm{Re}$（$L$ は格子点単位の物体長さ）、$\tau = 3\nu + \tfrac12$。飛行機は $80\times 36\times 26$ の格子で $L = 32$（胴体長、翼幅 28 格子点）、任意の NACA 0012 翼は $72\times 24\times 24$（翼弦 20）。両 STL ファイルはこの問題のために生成しました（data/SOURCES.md を参照）：ずんぐりした模型飛行機（回転体の胴体、後退角つき NACA 0018 主翼、水平・垂直尾翼）で、部品が接合部で重なるため、ボクセル化は単純なレイの偶奇ではなく回転数（符号付き交差）を数えます。もう一つは周期幅全体にわたる翼で、無限翼になります（$C_L$ を $2\pi\alpha$ と比べてください）。係数は平面形面積（上から見た物体）を使います。境界：流れに垂直な方向は周期的（飛行機の格子）、ボクセル化した物体には中間点バウンスバック。solve.simulate には移動床と滑り天井もあります。流入口と流出口の代わりに最後の 16 格子点を fringe 領域とし、流れが $x = 0$ に再流入する前に一様流へ戻します。速度は 300 ステップで立ち上げ（最初の $C_D$ のこぶは空気を加速する圧力勾配）、アニメーションはその後から始まります。TRT は「マジック」$\Lambda = 3/16$、MRT は d'Humières ら (2002) の D3Q19 緩和率、Smagorinsky 定数は $C_s = 0.17$。既定の Re = 1000（$\tau \approx 0.508$）では、この粗い格子上で素の TRT は発散し、LES が安定に保ちます：LES を切ってみてください。8° での結果：飛行機 $C_D \approx 0.39$、$C_L \approx 0.12$；翼 $C_L \approx 0.31$（$2\pi\alpha = 0.88$ に対し）。揚力が小さいのは、翼の厚さが 1〜3 セルしかなく、Re が層流域で、上下の周期像が複葉機の積み重ねのように働くためです：これは手法の例示であり予測ではありません。検証（物体
  sphere_openlb）：Re = 20 の球（$D = 10$、$80\times 40\times 40$、BGK、平衡流入）を、同じ格子でオフラインで一度計算した OpenLB 1.7（data/openlb_reference_*.csv）と比較：$C_D$ 3.360 対 3.378（−0.5 %）、中央断面の $u_x$：相対 L2 0.8 %、L∞ 1.1 %、最大 $|\Delta u|/U$ 1.3 %。残りの差は境界スキーム（OpenLB は補間型の速度・圧力境界を使い、音波で振動し続け $C_D$ が ±5 % 揺れる）と、全格子対中間点バウンスバックの違いによるもので、衝突演算子（BGK）と解像度は同じです。どちらも Schiller–Naumann の値 2.61 より大きいのは、この球が自由ではないからです：OpenLB で $160\times 60\times 60$ の箱では 3.04、同じ比率で $D = 20$ にすると 3.21。OpenLB は事前計算した参照としてのみ使い、その（GPL の）コードはここでは一切使っていません。 検証は同じ実行の中で飛行機の後にその場で計算され（パラメータ validate、既定でオン、2000 ステップ）、残差パネルに表示されます。
meanings:
- 分布関数：格子点 $(x, y, z)$ で格子速度 $i$ で動く流体
- D3Q19 の速度（静止、6 面、12 辺）、重み、逆向きの方向
- STL の三角形：三角形 $t$、頂点 $v$、座標 $a$
- $+x$ 方向のレイの符号付き交差（回転数）が正なら内部；全レイ × 全三角形、その後 searchsorted
- $a$ の繰り返し ⇒ 和：各格子方向に沿った速度
- $i$ の繰り返し ⇒ 和：運動量密度
- MRT：非平衡モーメント、それぞれ固有の緩和率 $s_k$ で緩和
- 非平衡運動量流束；その大きさが Smagorinsky の渦粘性 $\nu_t$ を決める
- ストリーミング：各分布関数を 1 リンク移動
- 流体点から物体へ向かう分布関数がある所で 1（バウンスバックはマスク付きの入れ替え）
- 運動量交換：物体にはたらく力、境界リンクについて和
labels:
  body: 物体（data/ の STL；sphere_openlb は OpenLB 検証ケース）
  re: レイノルズ数 $UL/\nu$（物体長さ $L$）
  collision: 衝突演算子
  les: Smagorinsky LES
  pitch: 迎え角（飛行機と翼）
  steps: 格子時間ステップ数
  validate: OpenLB の球による検証も実行（残差パネル）
