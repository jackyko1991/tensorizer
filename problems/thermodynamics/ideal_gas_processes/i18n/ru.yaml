title: Четыре процесса идеального газа
summary: 'Один и тот же газ из одного начального состояния проводится по четырём хрестоматийным путям: изотермическому, изобарному, изохорному и адиабатному. Все четыре пути — один тензор (процесс, точки, 2) из точек $(V, p)$, работа — площадь под каждой кривой из torch.trapezoid, а первое начало превращает её в теплоту.'
notes: 'Начало: 1 моль при 300 К в 10 литрах. Изотермический, изобарный и адиабатный пути расширяют газ до одного и того же конечного объёма; изохорный путь сохраняет $V$ постоянным и нагревает газ, пока давление не вырастет в то же число раз. Поскольку на изохоре $dV = 0$, torch.trapezoid возвращает там ровно нулевую работу. На изотерме $\Delta U = 0$, поэтому $Q = W$; на адиабате $Q = 0$, так что газ оплачивает работу внутренней энергией и остывает. Столбики справа — нарастающие итоги, вычисленные через torch.cumulative_trapezoid.'
meanings:
- точка $k$ вдоль процесса $c$ (изотермический, изобарный, изохорный, адиабатный)
- уравнение состояния идеального газа, поэлементно на всём тензоре
- 'повторяющийся $k$ ⇒ суммирование: работа газа на каждом пути'
- внутренняя энергия зависит только от температуры
- 'первое начало термодинамики: теплота, подведённая к газу'
labels:
  ratio: Степень расширения $V_2/V_1$
  T0: Начальная температура
  n: Количество газа
  gas: Газ
