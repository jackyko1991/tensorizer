source_hash: e03f3730cc96
title: 광자 계수 CT와 물질 분해
summary: 광자 계수 검출기는 X선 광자 하나하나를 에너지 구간으로 분류하므로, 각 광선은 하나가 아니라 여러 개의 비어–람베르트 측정 $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$을 준다. 배치 최대가능도 피팅(autograd 기울기, 피셔 스코어링 단계)이 모든 광선의 푸아송 계수를 물, 뼈, 요오드의 선적분으로 바꾸고, 필터 역투영으로 물질 지도와 가상 단색 영상을 만들며, 기존 스캐너에서는 똑같이 보이는 요오드와 뼈를 분리한다.
notes: '광자 계수 검출기(텔루르화 카드뮴 또는 실리콘)는 광자를 하나씩 기록하고 각 펄스 높이를 여러 문턱값과 비교하므로, 각 에너지 구간의 계수는 별개의 비어–람베르트 측정이다. 최초의 광자 계수 CT 스캐너는 2021년 미국 FDA의 승인을 받았고, 이후 분광 영상, 더 선명한 해상도, 더 낮은 전자 잡음이 연구에서 임상으로 옮겨 왔다. 물질 세 가지에는 최소 세 개의 구간이 필요하다. 물과 뼈는 주로 광전 효과를 통해 차이가 나고, 요오드는 33.2 keV의 K-흡수단을 더하므로 35 keV 근처의 문턱값이 도움이 된다(25, 50, 75 keV 설정을 시도해 보자). 뼈 삽입물은 10 mg/mL 요오드 삽입물과 에너지 가중 감쇠가 같아질 때까지 희석되어 있으므로, 기존 영상에서는 둘이 똑같이 보인다. 물질 지도는 둘을 구별한다. 가상 단색 영상 $\mu_m(E)a_m$은 낮은 에너지에서 요오드 대조도를 높이고, 기존 영상에 보이는 빔 경화 컵 모양 인공물이 없다. 세 물질 분해는 잡음을 증폭하므로(기저 감쇠 곡선이 거의 평행하다) 요오드 오차는 $1/\sqrt{N_0}$로만 줄어들며, 중간 선량에서 픽셀당 수 mg/mL이다. 임상 시스템은 흔히 기저 물질 두 개, 잡음 제거, 반복 재구성을 사용한다. 단순화: 평행 빔, 가우스 에너지 분해능을 제외하면 이상적인 검출기(전하 공유, 파일업, K-탈출 없음), 산란 없음, 반올림한 감쇠 표. 교육용 모형이며 임상용이 아니다.'
meanings:
- '픽셀당 기저 물질 양: 물 분율, 뼈 분율, 요오드(mg/mL)'
- '각 기저 지도의 라돈 변환: 광선 $r = (\theta, s)$을 따른 물(cm), 뼈(cm), 요오드(mg/cm²)'
- 1 keV 격자 위 각 기저 물질의 감쇠(XCOM, 로그-로그 보간, 요오드 K-흡수단 33.2 keV)
- 필터를 거친 관 스펙트럼. 에너지 $E_e$인 광자가 구간 $b$에서 계수될 확률(가우스 에너지 분해능)
- '구간별 비어–람베르트: 반복된 $m$, 그다음 $e$ ⇒ 합. 계수는 $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$'
- 푸아송 음의 로그 가능도의 기울기. 광선들은 독립이므로 역전파 한 번으로 모든 광선이 각자의 기울기를 얻는다
- 피셔 정보, 반복된 $b$ ⇒ 합. $J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- '광선당 $3\times 3$ 풀이 하나, 배치로: 피셔 스코어링(뉴턴과 유사한) 단계'
- 재구성된 기저 지도로 만든 에너지 $E$의 가상 단색 영상, HU로 표시
labels:
  kvp: 관 전압
  dose: 광선당 광자 수 $N_0$
  thresholds: 에너지 문턱값(keV)
  sigma_kev: 에너지 분해능 $\sigma$
  n_pixels: 영상 크기 $N$
  n_angles: 투영 각도 수
