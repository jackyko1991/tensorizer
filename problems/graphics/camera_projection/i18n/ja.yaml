source_hash: 0fd4a04dbd76
title: ピンホールカメラ
summary: 3D シーンが 2D 画像になる仕組み：モデル、ビュー、射影の $4\times4$ 行列が同次座標に作用し、透視除算とビューポート変換でピクセルが得られる。カメラが周回する間、ワイヤーフレーム物体のすべての頂点を一つの einsum で一度に射影する。透視投影と平行投影、ドリーズームを比較し、平行線が消失点で交わる様子を見て、同じカメラを $K[R\,|\,\mathbf t]$ として書く。
notes: 第 4 の座標こそがカメラを線形にする：平行移動は行列の列になり、奥行きで割る透視投影は、奥行きを $\tilde x_4$ にコピーする行列と最後の一回の除算になる。$w = 0$ の点は方向であり、その像が消失点である。すべての水平方向は地平線上で消失し、カメラが見下ろしているとき地平線は画像中心より上にある。平行投影カメラは $\tilde x_4 = 1$ なので消失点をもたず、遠くの物体も小さくならない。製図や多くのストラテジーゲームと同じである。ドリーズーム（「めまいショット」）は $d\,\tan(\text{fov}/2)$ が一定になるようカメラを動かしながら視野角を変える：物体の大きさは変わらないが、その背後の床が引き伸ばされる。コンピュータビジョンのライブラリは $z$ を前向きにとって $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$ を使い、グラフィックス API は $z$ を後ろ向きにとって $P V M$ を使う。両者の違いは $y$ 軸と $z$ 軸を反転させるだけであり、ターミナルで同じピクセルが得られることを確認している。
meanings:
- 同次座標 $(x, y, z, 1)$ での頂点 $v$；辺は添字の対 $(E, 2)$
- 物体 → ワールド：スケーリング、$y$ 軸まわりの回転、そして平行移動（第 4 列）
- ワールド → カメラ：行はカメラの軸、平行移動は $-R\,\mathbf e$
- カメラ → クリップ空間；最終行は $-z$ を $\tilde x_4$ にコピーする（平行投影：$\tilde x_4 = 1$）
- $j, k, l$ の繰り返し ⇒ 和：一回の呼び出しですべての頂点に三つの行列を作用させる
- $\tilde x_4$ による透視除算、次にビューポート変換；画像の行は下向きに数える
- 焦点距離 $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$ と主点；ワールド → カメラの剛体運動
- 無限遠点 $(\hat{\mathbf d}, 0)$ は平行移動を失う：$\hat{\mathbf d}$ 方向のすべての直線がそこで交わる
labels:
  shape: 物体
  yaw: 物体の回転（モデル行列）
  fov: 視野角
  distance: カメラ距離
  height_cam: カメラの高さ
  width: 画像の幅
  height: 画像の高さ
  frames: 一周あたりのフレーム数
