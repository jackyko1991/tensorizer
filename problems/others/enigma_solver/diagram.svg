<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Enigma signal path: a pressed key sends current through the plugboard S, the right, middle and left rotors R1, R2, R3 to the reflector U, which sends it back through the rotors and the plugboard to a lamp">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- rotation axis of the rotors -->
    <line x1="80" y1="80" x2="196" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- plugboard -->
    <rect x="50" y="28" width="20" height="104" rx="3" fill="#93c5fd" stroke="#374151" stroke-width="2"/>
    <text x="60" y="85" text-anchor="middle" font-style="italic">S</text>
    <!-- rotors: right (fast) R1, middle R2, left (slow) R3 -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.5">
      <rect x="86" y="24" width="24" height="112" rx="4"/>
      <rect x="120" y="24" width="24" height="112" rx="4"/>
      <rect x="154" y="24" width="24" height="112" rx="4"/>
    </g>
    <g fill="#ffffff" font-style="italic" text-anchor="middle">
      <text x="98" y="85">R<tspan font-size="10" dy="3">1</tspan></text>
      <text x="132" y="85">R<tspan font-size="10" dy="3">2</tspan></text>
      <text x="166" y="85">R<tspan font-size="10" dy="3">3</tspan></text>
    </g>
    <!-- reflector -->
    <path d="M190,28 L204,28 A30,52 0 0 1 204,132 L190,132 Z" fill="#93c5fd" stroke="#374151" stroke-width="2"/>
    <text x="223" y="85" text-anchor="middle" font-style="italic">U</text>
    <!-- current: key → S → R1 → R2 → R3 → U (amber), back U → R3 → R2 → R1 → S → lamp (red) -->
    <path d="M32,112 L82,112" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#fwd)"/>
    <path d="M82,112 L198,112" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M198,112 Q226,80 198,48" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M198,48 L34,48" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#back)"/>
    <!-- key and lamp -->
    <circle cx="20" cy="112" r="11" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="20" y="117" text-anchor="middle" font-size="12">A</text>
    <text x="20" y="144" text-anchor="middle" font-size="11" fill="#6b7280">key</text>
    <circle cx="20" cy="48" r="11" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="53" text-anchor="middle" font-size="12">B</text>
    <text x="20" y="26" text-anchor="middle" font-size="11" fill="#6b7280">lamp</text>
  </g>
</svg>
