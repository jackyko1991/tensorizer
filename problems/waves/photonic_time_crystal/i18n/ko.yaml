source_hash: 60f8bd39a854
title: 광자 시간 결정과 시간 반사
summary: 유전율 $\varepsilon(t)$가 공간이 아니라 시간에 따라 변하는 매질 속의 빛. $\varepsilon$이 갑자기 뛰면 펄스가 새로운 주파수의 전진파와 시간 반사된 후진파로 갈라진다. 주기적 변조는 운동량 $k$에 띠 간극을 열고, 그 안에서 파동은 지수적으로 성장한다. 각 푸리에 모드는 독립적인 $2\times 2$ 문제이므로 모든 $k$를 하나의 배치로 풀고, 플로케 띠는 배치 eigvals 호출 한 번으로 얻는다.
notes: '공간과 시간의 역할을 바꾸면 익숙한 광학이 뒤집힌다. 공간의 보통 경계면에서는 주파수가 보존되고 파수가 바뀌지만, 매질 전체가 한꺼번에 $\varepsilon_1$에서 $\varepsilon_2$로 바뀌는 시간 경계면에서는 파수 $k$가 보존되고 주파수가 $\omega_2 = \omega_1 n_1/n_2$로 뛴다. 전하나 전류가 나타나지 않으므로 ($E$와 $H$가 아니라) $D$와 $B$가 연속으로 유지되며, 이로부터 시간 프레넬 계수 $D_f = \tfrac12(1 + n_2/n_1)$와 $D_b = \tfrac12(1 - n_2/n_1)$가 나온다(Morgenthaler, 1958). 펄스의 일부는 방향을 돌려 거꾸로 달리는데, 이것이 시간 반사다. 매질을 바꾸는 것이 장에 일을 하므로 에너지는 보존되지 않는다. 시간 반사와 광대역 주파수 변환은 시간에 따라 전환되는 전송선 메타물질에서 마이크로파로 관측되었다(Moussa et al., Nature Physics 2023). 주기적 변조 $\varepsilon(t) = \varepsilon_0(1 + \alpha\cos\Omega t)$는 각 모드를 매개변수 진동자 $\ddot D_k + (k^2/\varepsilon)D_k = 0$(마티외형 방정식)으로 만든다. $k/n_0 = \Omega/2$ 근처에서 전진파와 후진파가 공명적으로 결합한다. 준주파수가 $\Omega/2$에 고정되고 허수부를 얻는데, 이것이 (주파수가 아니라) 운동량의 띠 간극이며, $\alpha$의 1차까지 경계는 $k \approx \tfrac{n_0\Omega}{2}(1 \mp \alpha/4)$, 최대 성장률은 $\approx \alpha\Omega/8$이다. $k \approx n_0\Omega$에서 훨씬 좁은 두 번째 간극이 $\alpha^2$ 차수에서 나타난다. 애니메이션에서는 펄스 스펙트럼 중 간극 안의 부분만 성장한다. 이것이 광자 시간 결정의 아이디어다(Galiffi et al., "Photonics of
  time-varying media", Advanced Photonics 2022에서 개관). 광학 주파수에서는 필요한 변조 깊이와 속도에 도달하기가 매우 어려워서, 지금까지의 실험은 주로 마이크로파와 라디오 주파수에서 이루어진다. 단순화: 1D의 무손실·무분산 매질, $\mu = 1$, 순간적인 도약, 외부에서 부과한 변조(성장 에너지는 펌프에서 온다).'
meanings:
- 푸리에 진폭. 매질이 $x$에 대해 균일하므로 $k$가 보존되고 각 모드는 독립적으로 진화한다
- 파수마다 $2\times 2$ 생성자 하나
- 반복된 $b$ ⇒ 합. 같은 줄이 모노드로미 행렬 $(K, 2, 2)$도 진화시킨다
- $D$와 $B$의 연속성에서 나온 전진/후진 진폭 $\tfrac12(1 \pm n_2/n_1)$
- 한 주기에 걸친 전파자, 단위 행렬에 RK4를 적용하여 구함
- 배치 호출 한 번으로 모든 $k$에 대한 플로케 승수. $\det M = 1$이므로 $\lambda_+\lambda_- = 1$
- '준주파수: 띠 안에서는 실수, 운동량 간극에서는 $\operatorname{Im}\omega > 0$(성장)'
labels:
  eps2: 도약 후 유전율 $\varepsilon_2$
  alpha: 변조 깊이 $\alpha$
  omega: 변조 주파수 $\Omega$
  t_max: 시뮬레이션 시간
