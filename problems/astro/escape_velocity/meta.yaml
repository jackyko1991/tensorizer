title: Escape velocity
category: astro
level: beginner
order: 2
summary: >
  A batch of rockets leaves a planet with speeds around the escape speed $v_\mathrm{esc} = \sqrt{2GM/R}$.
  The sign of the energy decides each rocket's fate: bound rockets ($E < 0$) fall back, unbound ones ($E \ge 0$) never return.
animated: true
vector_form: '\ddot{\mathbf r} = -\frac{GM}{r^3}\,\mathbf r,\qquad E = \tfrac12 v^2 - \frac{GM}{r},\qquad v_\mathrm{esc} = \sqrt{\frac{2GM}{R}}'
index_form: '\ddot x_{bi} = -GM\,(x_{bj}x_{bj})^{-3/2}\,x_{bi},\qquad E_b = \tfrac12\,v_{bi}v_{bi} - GM\,(x_{bj}x_{bj})^{-1/2}'
translation:
  - {symbol: 'x_{bi}', code: 'y[:, 0, :]', shape: '(B, 2)', meaning: 'position of rocket $b$ from the planet''s centre'}
  - {symbol: 'v_{bi}', code: 'y[:, 1, :]', shape: '(B, 2)', meaning: 'velocity of rocket $b$'}
  - {symbol: 'x_{bj}x_{bj}', code: "einsum('bj,bj->b', x, x)", shape: '(B,)', meaning: 'repeated $j$ ⇒ summed: squared distance $r_b^2$'}
  - {symbol: '\ddot x_{bi}', code: 'acceleration(x, GM)', shape: '(B, 2)', meaning: 'gravity of the planet'}
  - {symbol: 'E_b', code: 'energy(y, GM)', shape: '(B,)', meaning: 'energy per unit mass: negative ⇒ bound'}
  - {symbol: 'v_\mathrm{esc}', code: 'escape_speed(GM, R)', shape: '()', meaning: 'speed with $E = 0$ at the surface'}
  - {symbol: 'R_s', code: 'dark_star_radius(GM, c)', shape: '()', meaning: '$2GM/c^2$: radius at which $v_\mathrm{esc} = c$'}
  - {symbol: 'r_\mathrm{max}', code: 'max_radius(v, GM, R)', shape: '(B,)', meaning: '$R/(1 - v^2/v_\mathrm{esc}^2)$, highest point of a vertical launch'}
notes: >
  Units: planet radius $R = 1$ and $GM = 1$, so $v_\mathrm{esc} = \sqrt 2$ (for the Earth, 11.2 km/s). The rockets coast with the engine off,
  there is no air, and the planet does not rotate. Just below $v_\mathrm{esc}$ the highest point shoots up as $1/(1 - v^2/v_\mathrm{esc}^2)$, and
  the trip takes longer and longer. Exactly at $v_\mathrm{esc}$ the rocket slows down forever but never stops. Tilt the launches to see
  that the escape speed does not depend on direction (as long as the path does not hit the planet): only the energy matters.
  Dark stars: squeeze the planet until $v_\mathrm{esc}$ reaches the speed of light $c$ and you get $R = 2GM/c^2$. Michell (1783) and Laplace
  argued that such a star would be invisible. General relativity gives exactly the same radius for the horizon of a black hole
  (the Schwarzschild radius, 3 km for the Sun), although the Newtonian reasoning behind it is not the real story.
params:
  n_rockets: {default: 8, min: 1, max: 12, step: 1, type: int, label: Rockets}
  f_min: {default: 0.6, min: 0.1, max: 1.0, step: 0.05, label: 'Slowest launch $v/v_\mathrm{esc}$'}
  f_max: {default: 1.3, min: 0.5, max: 2.0, step: 0.05, label: 'Fastest launch $v/v_\mathrm{esc}$'}
  tilt: {default: 0.0, min: 0.0, max: 60.0, step: 5, label: Tilt from vertical, unit: °}
  t_max: {default: 30.0, min: 5, max: 80, step: 5, label: Simulated time, unit: '$\sqrt{R^3/GM}$'}
  dt: {default: 0.01, min: 0.002, max: 0.05, step: 0.002, label: Time step, unit: '$\sqrt{R^3/GM}$'}
