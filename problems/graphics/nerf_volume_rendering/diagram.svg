<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="NeRF volume rendering: a ray from the camera origin o in direction d passes through a density field; samples t_i along the ray are weighted by w_i, which peak where the ray enters the dense region">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- density field: a soft blob, denser towards the middle -->
    <circle cx="160" cy="62" r="42" fill="#93c5fd" fill-opacity="0.35"/>
    <circle cx="160" cy="62" r="30" fill="#93c5fd" fill-opacity="0.6"/>
    <circle cx="160" cy="62" r="18" fill="#2563eb" fill-opacity="0.75" stroke="#1e40af" stroke-width="1.5"/>
    <text x="190" y="28" font-style="italic">σ, c</text>
    <!-- camera and image plane -->
    <rect x="8" y="54" width="16" height="16" rx="2" fill="#374151"/>
    <path d="M24,62 L40,50 M24,62 L40,74" fill="none" stroke="#374151" stroke-width="1.5"/>
    <line x1="40" y1="48" x2="40" y2="76" stroke="#374151" stroke-width="2"/>
    <text x="12" y="90" font-style="italic">o</text>
    <!-- the ray -->
    <line x1="24" y1="62" x2="232" y2="62" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="44" y1="62" x2="70" y2="62" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="52" y="54" font-style="italic" fill="#b91c1c">d</text>
    <!-- stratified samples: hollow in empty space, filled inside the density -->
    <g stroke="#374151" stroke-width="1.2">
      <circle cx="84" cy="62" r="2.5" fill="#ffffff"/>
      <circle cx="101" cy="62" r="2.5" fill="#ffffff"/>
      <circle cx="115" cy="62" r="2.5" fill="#ffffff"/>
      <circle cx="129" cy="62" r="2.5" fill="#2563eb"/>
      <circle cx="146" cy="62" r="2.5" fill="#2563eb"/>
      <circle cx="160" cy="62" r="2.5" fill="#2563eb"/>
      <circle cx="177" cy="62" r="2.5" fill="#2563eb"/>
      <circle cx="191" cy="62" r="2.5" fill="#ffffff"/>
      <circle cx="207" cy="62" r="2.5" fill="#ffffff"/>
      <circle cx="222" cy="62" r="2.5" fill="#ffffff"/>
    </g>
    <!-- quadrature weights w_i = T_i (1 - exp(-sigma_i delta_i)) under each sample -->
    <line x1="76" y1="146" x2="232" y2="146" stroke="#374151" stroke-width="2"/>
    <g fill="#f59e0b" stroke="#b45309" stroke-width="1">
      <rect x="125" y="128" width="8" height="18"/>
      <rect x="142" y="108" width="8" height="38"/>
      <rect x="156" y="132" width="8" height="14"/>
      <rect x="173" y="141" width="8" height="5"/>
    </g>
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 2">
      <line x1="129" y1="66" x2="129" y2="126"/>
      <line x1="146" y1="66" x2="146" y2="106"/>
    </g>
    <text x="84" y="128" font-style="italic" fill="#b45309">w</text>
    <text x="95" y="132" font-size="10" font-style="italic" fill="#b45309">i</text>
    <text x="196" y="138" font-style="italic">t</text>
  </g>
</svg>
