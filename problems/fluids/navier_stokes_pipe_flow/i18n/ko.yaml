source_hash: db9343501d33
title: 나비에–스토크스 관 흐름
summary: 비압축성 나비에–스토크스 방정식 전체를, 갑자기 압력 기울기를 받은 원형 관 속의 물에 적용합니다. 축 방향 흐름에서는 비선형 항이 정확히 사라지고 반지름 방향 확산 방정식만 남습니다. 운동량이 미끄럼 없는 벽에서부터 퍼져 들어가며, 속도 분포는 $R^2/\nu$의 몇 배 안에 하겐–푸아죄유 포물선으로 자랍니다.
notes: 나비에–스토크스 방정식의 드문 정확한 해 가운데 하나입니다. 흐름이 평행하므로 $(\mathbf u\cdot\nabla)\mathbf u = 0$이고 압력 기울기와 점성만 남습니다. 정상 하겐–푸아죄유 흐름은 $u_z = G(R^2 - r^2)/4\mu$, 유량 $Q = \pi G R^4/8\mu$(유명한 $R^4$ 법칙), 벽 전단 응력 $\tau_w = GR/2$를 가집니다. 단위 길이당 힘의 평형 $G\,\pi R^2 = \tau_w\,2\pi R$입니다. 시작 과정은 $e^{-\lambda_1^2\nu t/R^2}$ ($\lambda_1 = 2.405$, $J_0$의 첫 번째 영점)처럼 접근하므로 $t \approx 0.6\,R^2/\nu$이면 속도 분포가 포물선과 몇 % 이내로 같아집니다. 초기에는 중심부가 마개처럼 함께 움직이고 벽 근처 유체만 저항을 느낍니다. 염료 선을 지켜보세요. 이 해는 층류이며, 레이놀즈 수가 약 2000을 넘으면 실제 관 흐름은 난류가 됩니다.
meanings:
- $u_z \ne 0$만 있고 $\partial_z u_z = 0$이므로 이류 항은 정확히 0
- '연속 방정식은 자동으로 성립: $u_z$는 관을 따라 변하지 않음'
- 축($i = 0$)에서 벽($i = N$)까지의 반지름 방향 점들
- 축 방향 속도 $u_z(r_i)$; 벽에서 $u_N = 0$ (미끄럼 없음)
- 행렬로 쓴 $\tfrac1r\partial_r(r\partial_r\,\cdot)$, 축에서는 $r \to 0$ 극한 $2\partial_r^2$
- '반복된 $j$ ⇒ 합: 점성 항 $\nu\nabla^2 u_z$'
- 흐름을 일으키는 압력 기울기 (Pa/m)
- 부피 유량; 정상값 $\pi G R^4/8\mu$
- 벽에 작용하는 단위 면적당 항력; 정상값 $GR/2$
labels:
  G: 압력 기울기 $G$
  R: 관 반지름 $R$
  nu: 운동 점성 계수 $\nu$
  t_max: 시뮬레이션 시간($R^2/\nu$ 단위)
