title: MNIST 上的算子搜尋：張量 DAG 自行寫出分類方程式
summary: 當訓練影像只有寥寥幾張時，少數幾個可讀的張量算子連接成 DAG，能否與 CNN 一較高下？小型 DAG 的每條邊上都是 23 個候選算子（Sobel、拉普拉斯、Gabor、可學習的 3×3 濾波器、ReLU、$x^2$、池化、列和、FFT 幅值、類別模板、PCA、矩、線性與原型讀出）經 softmax 加權的混合；以每個數字 1 到 100 張影像進行 DARTS 搜尋，為每條邊挑選一個算子，並把 DAG 輸出為一條能精確重現其預測的 LaTeX 方程式。接著與 LeNet 風格的 CNN 及兩個閉式基準比較所需的資料量與計算量，並列出每個種子的結果。
notes: 問題。這個玩具問題出自 Jacky Ka Long Ko：嘗試以白箱方式寫出方程式的小批次 AI 訓練。在 MNIST 上比較 CNN 與張量方法；列出候選張量算子；讓一個編碼 DAG 的張量找出最佳算子及其連接方式；以小批次訓練，比較兩者達到相同準確率所需的資料量與計算量；並寫出所找到 DAG 的分類方程式。方法。影像為 14×14（將 MNIST 以 2×2 區塊平均，使 30 次執行能在約一分鐘的 CPU 時間內完成）。超網路是一個 DARTS 單元（Liu, Simonyan and Yang 2019），其中三個節點 $z_1, z_2, z_3$ 透過 6 條邊接收所有前面節點的輸入，每條邊都是 12 個單元算子（零、恆等、$x^2$、$|x|$、ReLU、tanh、軟閾值 $S_\lambda$、可學習的 $3\times 3$ 濾波器、Sobel-$x$、Sobel-$y$、拉普拉斯、Gabor）的混合；之後接一條池化邊（平均或最大 $2\times 2$）、一條化約邊（vec、列和、行和、低頻 FFT 幅值、類別模板相關、PCA 投影、影像矩）以及一條輸出頭邊（線性讀出或 10 個原型）。架構即張量 $\alpha$（9 條邊 × 23 個算子），並帶有一個對應型別規則的遮罩。搜尋：一階 DARTS，在訓練半數資料的小批次上做 $\theta$ 步與在驗證半數資料上做 $\alpha$ 步交替進行，softmax 溫度從 1 退火至 0.001；DAG 保留每條邊的 argmax 算子（零代表移除該邊），繼承已訓練的 $\theta$ 並短暫微調，保留驗證表現最佳的步驟。與 DARTS 的差異很重要，故在此說明：退火（如 SNAS 與 GDAS）與 argmax 規則彌補了離散化落差，而在第一次嘗試中這個落差造成最多 25 個百分點的準確率損失；影像被保留為單元輸出的第四個通道；各輸出頭從其特徵空間中的最近類別平均開始。CNN（$3\times 3$ 的 8 與 16 個通道、最大池化、一個線性層：2698 個權重）以 Adam 在相同影像上、使用相同的提前停止進行訓練。基準沒有任何可學習參數：像素空間中的最近類別平均，以及 PCA 後接收縮 LDA。結果。測試檢查：每個算子在小輸入上等於其公式；one-hot 混合即為單一算子，one-hot
  超網路即為離散 DAG；離散化選取 argmax；寫出的方程式僅從其 LaTeX 讀回後，給出與 DAG 完全相同的預測；以及基準等於其閉式解。隨附的執行（CPU、單執行緒、3 個種子）中，每個數字 $n$ = 1, 5, 10, 50, 100 張影像時的平均測試準確率：CNN 0.35, 0.53, 0.64, 0.81, 0.85；搜尋所得 DAG 0.38, 0.48, 0.52, 0.69, 0.82；PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76；最近類別平均 0.41, 0.56, 0.64, 0.68, 0.69。達到 70 % 所需的每個數字影像數：CNN 18、DAG 52、PCA + LDA 20；達到 80 %：CNN 45、DAG 91。每次執行的訓練時間：CNN 0.4 至 1 s，搜尋加微調 2 至 4 s。因此，老實說：從每個數字約 10 張影像起，CNN 達到相同準確率所需的資料與計算都更少；低於此數時，閉式基準最好，沒有任何學習器能勝過它們；結構化模型在極小的 $n$ 下並未勝出（在 $n$ = 1 時與類別平均打平）。原因：搜尋所用的驗證集本身就極小，因此其選擇充滿雜訊，而且其驗證損失常偏好列和（28 個特徵、290 個可學習數值、較平穩的損失），但列和的分類效果比全部像素（約 2000 個可學習數值）差；15 個 DAG 中有 7 個選了列和。正如 DARTS 的文獻所報告，搜尋偏好無參數算子：Sobel 濾波器佔據大多數邊，可學習的濾波器只出現在 15 個 DAG 中的 3 個。在隨附執行之外，較短的搜尋（20 或 40 步）選擇了全部像素，並在 $n$ = 50 時達到 0.74 至 0.79，暗示較長的搜尋會過度定案；這是在測試集上看到的，因此只是觀察，而非調校過的設定。GPU（GTX 1080 Ti）沒有帶來加速：決定時間的是數以千計的小核心，而非算術運算。results/stages.csv 包含所有數字，results/equation.tex 包含所找到的每條方程式。相關研究。神經架構搜尋（Zoph and Le 2017）及其可微分形式 DARTS；搜尋公式而非網路的符號迴歸（AI Feynman, Udrescu and Tegmark 2020；PySR, Cranmer 2023；遺傳規劃,
  Koza 1992）；CNN 部分參考 LeNet（LeCun et al. 1998）。資料：MNIST（LeCun, Cortes and Burges），授權 CC BY-SA 3.0；data/mnist_subset.npz 含 1000 張訓練池影像與 2000 張測試影像（相同方式分享授權適用於此子集），見 data/SOURCES.md。動手試試。更改 show_n 以查看用每個數字 1 張或 100 張影像找到的 DAG，增加搜尋步數，或只用一個種子快速執行。
meanings:
- 型別規則：算子 $o$ 只有在能把邊 $e$ 的輸入形狀映射到其輸出形狀時，才能放在該邊上（單元：映射圖 → 映射圖、池化、化約：映射圖 → 向量、輸出頭：向量 → logits）
- 架構張量 $\alpha$（邊 × 算子）的遮罩 softmax；溫度 $T$ 從 1 降至 0.001，使混合最終成為 one-hot
- 節點所饋入的每個算子，對其所有輸出邊只計算一次：一次卷積即得到 Sobel-$x$、Sobel-$y$、拉普拉斯、Gabor 以及可學習的 $3\times 3$ 濾波器 $K_e$
- 重複的 $o$ ⇒ 求和：每個節點是其混合輸入邊的總和；單元輸出為堆疊 $(x, z_1, z_2, z_3)$
- 化約 $r$ 的特徵（vec、列和／行和、$|\mathcal F|$、模板 $\langle z, \mu_k\rangle$、PCA $U^\top \mathrm{vec}$、矩），以訓練影像標準化
- 所有化約 × 輸出頭在 logit 層級混合（其特徵長度不同）；線性 $W\hat f + b$ 或原型 $-e^\tau\lVert \hat f - p_k\rVert^2/D$，兩者皆從最近類別平均開始
- 一階 DARTS：在訓練小批次上做 $\theta$ 步，接著在驗證小批次上做 $\alpha$ 步
- 以 LaTeX 寫出的離散 DAG，經小型解析器讀回並求值：預測與 DAG 完全相同
labels:
  search_steps: DARTS 搜尋步數（每步各更新一次 $\theta$ 與 $\alpha$）
  retrain_steps: 離散 DAG 的微調步數
  cnn_steps: CNN 訓練步數
  seeds: 每種訓練集大小的種子數
  batch: 小批次大小（各數字均衡）
  show_n: 所顯示 DAG 的每個數字訓練影像數
