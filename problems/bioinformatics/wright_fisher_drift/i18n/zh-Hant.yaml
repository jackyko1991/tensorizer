source_hash: a1a35d304051
title: Hardy–Weinberg 與 Wright–Fisher 遺傳漂變
summary: 隨機交配給出 Hardy–Weinberg 基因型頻率 $p^2, 2pq, q^2$；每代隨機抽樣 $2N$ 份基因拷貝使對偶基因頻率漂變。數千個族群以一個（重複族群, 世代）的二項抽樣張量同時演化，可選擇加入天擇 $s$，並與異型合子度的 $(1-1/2N)^t$ 以及固定機率的 $1/2N$ 與 Kimura 公式比較。
notes: Hardy–Weinberg 定律指出，一輪隨機交配就把對偶基因頻率 $p$ 轉為基因型頻率 $p^2, 2pq, q^2$，不論親代的基因型為何；圖中的點是由兩個隨機配子構成的 $N$ 個個體，散布在這些曲線周圍。只有在無限族群中，對偶基因頻率才會保持不變。有 $2N$ 份拷貝時，每一代都是前一代的二項樣本，所以 $p$ 做隨機漫步，直到碰到 0（對偶基因流失）或 1（對偶基因固定）。隨機挑出的兩份拷貝共享同一親代拷貝的機率為 $1/2N$，所以預期異型合子度 $2pq$ 每代縮小 $1 - 1/2N$ 倍；小族群中漂變更快。新的中性突變起初是 $2N$ 份中的一份；由於最終 $2N$ 份中的某一份會成為所有拷貝的祖先，它被固定的機率是 $1/2N$。有天擇時適用 Kimura 的擴散結果：$4Ns \gg 1$ 的有利對偶基因被固定的機率接近 $2s$，仍遠非必然；而當 $|4Ns| \lesssim 1$ 時，輕微有害的對偶基因也可能因漂變而固定。此處 $N$ 是理想化的族群大小（恆定、隨機交配、無突變或遷移）；真實族群則以較小的有效族群大小 $N_e$ 描述。
meanings:
- 重複族群 $r$ 在第 $t$ 代的對偶基因 A 頻率
- 天擇之後：A 拷貝被傳遞的頻率是 $1+s$ 倍
- 下一代 $2N$ 份拷貝中 A 的數目：每個族群一次抽樣，全部同時進行
- 隨機交配下的基因型頻率 AA、Aa、aa
- 各由兩個隨機配子構成的 $N$ 個個體，依基因型計數（點）
- 對 $r$ 求和：平均 $2pq$，與 $H_0(1-1/2N)^t$ 比較
- 對每個 $s$，單一新拷貝（$p_0 = 1/2N$）被固定的族群比例
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$，當 $s = 0$ 時等於 $p_0 = 1/2N$
labels:
  N: 族群大小 $N$（二倍體）
  p0: 起始頻率 $p_0$
  s: 天擇係數 $s$
  generations: 世代數 $G$
  replicates: 族群數 $R$
  fix_replicates: 每個 $s$ 的族群數（固定）
  seed: 隨機種子
