source_hash: b740fafad36e
title: 나비에–스토크스 정칙성과 폭발 후보
summary: 클레이 밀레니엄 문제는 매끄러운 3차원 비압축성 흐름이 영원히 매끄럽게 유지되는지를 묻습니다. 토러스 위의 의사 스펙트럼(pseudo-spectral) 솔버가 오일러 방정식($\nu = 0$)과 두 가지 점성에 대해 테일러–그린(Taylor–Green) 소용돌이를 하나의 FFT 배치로 실행하며, 최대 와도, 엔스트로피, 그리고 어떤 폭발에서든 반드시 발산해야 하는 빌–가토–마즈다 적분 $\int\|\omega\|_\infty dt$를 추적합니다. 소용돌이 늘어남(vortex stretching) 때문에 오일러 와도는 격자가 더 이상 분해할 수 없을 때까지 커지고, 점성은 이를 억제합니다. 이것은 예시일 뿐 증명이 아닙니다.
notes: '클레이 문제(페퍼먼의 공식 설명)는 $\nu > 0$일 때 네 가지 명제 중 하나를 요구합니다: $\mathbb R^3$ 위(A) 또는 토러스 $\mathbb T^3$ 위(B)의 전역 매끄러운 해의 존재, 혹은 $\mathbb R^3$ 위(C) 또는 $\mathbb T^3$ 위(D)의 해의 붕괴. GitHub의 openai/NavierStokesAndEuler 저장소는 외력이 있는 나비에–스토크스 방정식의 $\mathbb R^3$ 및 $\mathbb T^3$ 위 붕괴(대안 C와 D)와, 매끄럽고 콤팩트 지지를 갖는 초기 자료에서 출발한 외력 없는 오일러 방정식의 유한 시간 폭발에 대한 Lean 4 기계 검증 증명과 관련 논문을 담고 있다고 밝히고 있습니다. 이는 아직 수학계와 클레이 연구소의 평가를 기다리고 있는 최근의 주장이며, 이 페이지는 상금 문제를 해결된 것으로 취급하지 않습니다. 오일러 방정식의 경우, 매끄러운 해의 유한 시간 특이점은 경계가 있는 루오–호우(2014)의 축대칭 계산과 이후의 컴퓨터 보조 증명(천–호우)에 의해 뒷받침되었고, 엘긴디(2021)는 $C^{1,\alpha}$ 자료에 대한 폭발을 증명했습니다. 여기의 시뮬레이션은 그 연구들이 다루는 양들을 보여 줄 뿐입니다. 테일러–그린 소용돌이 $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$는 고전적인 시험 문제입니다(Brachet 외, 1983): 소용돌이 늘어남이 이를 얇은 판으로 가파르게 만들고, 엔스트로피가 증가하며, 에너지 스펙트럼이 평평해집니다. 스펙트럼의 꼬리는 $e^{-2\delta k}$처럼 감소합니다. 폭발이 일어나려면 해석성 띠 $\delta(t)$가 유한 시간 안에 0에 도달해야 하지만, Brachet은 그것이 지수적으로만 줄어드는 것을 발견했습니다. $\delta\,k_\max < 1$이 되면 오일러 계산은 분해능이 부족해집니다(음영 영역): 절단된 계는 여전히 에너지를 정확히 보존하지만, 그 이후의
  $\|\omega\|_\infty$ 증가는 격자의 인공물이지 특이점의 증거가 아닙니다. 점성이 있으면 에너지는 $dE/dt = -2\nu\Omega$를 따르고(반올림 오차 수준까지 확인), 엔스트로피는 최고점에 도달한 뒤 감소합니다. 2차원 테일러–그린 소용돌이는 정확한 해 $e^{-2\nu t}$이고, 3차원의 경우 $p_0 = \frac1{16}(\cos 2x + \cos 2y)(\cos 2z + 2)$로부터 초기 가속도가 알려져 있습니다: 둘 다 시험용입니다. 더 큰 $N$을 사용해 분해 가능한 시간을 더 늦춰 보세요.'
meanings:
- 토러스 $[0, 2\pi)^3$ 위에서 각 실행 $b$(각각 하나의 점성)의 속도 푸리에 계수
- 레비-치비타 텐서를 이용한 회전(curl); 반복되는 $j, l$ ⇒ 합산
- 회전 형식의 비선형 항, 실공간에서 계산(의사 스펙트럼)
- '르레 사영: 기울기 부분을 제거하므로 압력은 전혀 계산하지 않으며 $k_i\hat u_i = 0$'
- 이차 항이 에일리어싱을 일으킬 모드를 버림; $k_\max = N/3$
- 운동 에너지 $\frac12\langle|\mathbf u|^2\rangle$와 엔스트로피 $\frac12\langle|\boldsymbol\omega|^2\rangle$
- '빌–가토–마즈다 판정법: 매끄러운 해는 이 적분이 $T^*$에서 발산할 때에만 그 시점에서 붕괴할 수 있음'
- $E(k) \propto k^{-3}e^{-2\delta k}$ 피팅; 진짜 특이점은 $\delta \to 0$을 필요로 하며, 격자는 $\delta\,k_\max \gtrsim 1$인 동안에만 흐름을 분해함
labels:
  n: 격자 $N^3$
  nu: 점성 $\nu$ (실행 $0$, $\nu$, $2\nu$)
  t_max: 시뮬레이션 시간
