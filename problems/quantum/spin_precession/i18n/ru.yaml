source_hash: 5f40ce6b88de
title: Прецессия спина и осцилляции Раби
summary: Спин $\tfrac12$ в магнитном поле. Гамильтониан — свёртка вектора поля с тензором Паули $\sigma_{kab}$, состояние эволюционирует под действием матричной экспоненты $U = \exp(-iH\Delta t)$, а вектор Блоха $s_k = \langle\psi\vert\sigma_k\vert\psi\rangle$ — ещё один einsum. Постоянное поле заставляет спин прецессировать с ларморовой частотой; слабое резонансное поперечное поле медленно переворачивает его (осцилляции Раби).
notes: 'Единицы $\hbar = 1$. При $B_1 = 0$ спин прецессирует вокруг $z$ с ларморовой частотой $\omega = \gamma B_0$, и $\lvert\mathbf s\rvert = 1$ всегда, поскольку $U$ унитарна. При $B_1 > 0$ с накачкой на $\omega \approx \gamma B_0$ спин по спирали переходит от северного полюса к южному и обратно: во вращающейся вместе с накачкой системе важна лишь сонаправленно вращающаяся половина линейной накачки, что даёт частоту Раби $\Omega = \gamma B_1/2$ (приближение вращающейся волны). Расстройте накачку, и переворот станет неполным. Матрицы Паули подчиняются $\sigma_i\sigma_j = \delta_{ij}I + i\,\varepsilon_{ijk}\sigma_k$.'
meanings:
- 'тензор Паули: $k \in \{x, y, z\}$ выбирает матрицу, $a, b$ — спинорные индексы'
- постоянное $B_0$ вдоль $z$ плюс необязательное $B_1\cos(\omega t)$ вдоль $x$
- 'повторяющийся $k$ ⇒ суммирование: $\mathbf B\cdot\boldsymbol\sigma$ как матрица $2\times 2$ (пакетно по $t$ как tk,kab->tab)'
- пропагатор на один шаг, унитарный
- 'вектор Блоха: суммирование по $a$ и $b$'
labels:
  B0: Постоянное поле $B_0$ (вдоль $z$)
  B1: Амплитуда накачки $B_1$ (вдоль $x$)
  drive_freq: Частота накачки $\omega$
  gamma: Гиромагнитное отношение $\gamma$
  theta0: Начальный наклон от $z$
  t_max: Время моделирования
