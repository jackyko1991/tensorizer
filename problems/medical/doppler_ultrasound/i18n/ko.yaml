source_hash: 2cd1c41299f8
title: '도플러 초음파: 혈류 측정'
summary: 초음파 탐촉자는 적혈구에서 돌아오는 에코를 듣습니다. 움직이는 적혈구는 각각 에코의 주파수를 $f_D = 2 f_0 v \cos\theta / c$만큼 이동시키며, 박동하는 동맥 속 수백 개의 적혈구를 하나의 페이저 배치로 한꺼번에 시뮬레이션합니다. 단시간 푸리에 변환(STFT)은 합쳐진 에코를 초음파 장비가 보여 주는 도플러 스펙트로그램, 즉 심장 주기 동안의 혈류 속도 분포로 바꿉니다.
notes: '계수 2는 주파수 이동이 두 번 일어나기 때문입니다. 움직이는 적혈구가 이동된 파동을 받고, 움직이면서 그것을 다시 내보냅니다. 빔 방향의 속도 성분만 의미가 있으므로 $\theta = 90°$에서는 이동이 전혀 없습니다. 장비는 검사자에게 각도를 입력받아 $v = f_D c / (2 f_0 \cos\theta)$를 계산하는데, 약 60°를 넘으면 매우 부정확해집니다. 기본값($f_0 = 5$ MHz, $\theta = 60°$, 최고 1 m/s)에서 수축기 주파수 이동은 약 3.2 kHz로 가청 범위에 있으며, 그래서 도플러 장비는 신호를 소리로도 들려줍니다. 층류에서는 속도 분포가 포물선 모양입니다. 벽 근처의 적혈구는 거의 움직이지 않고 중심축이 가장 빠릅니다. 단면에서 같은 넓이에는 같은 수의 적혈구가 있으므로 0에서 $v_{\max}$ 사이의 모든 속도가 똑같이 흔하고, 스펙트럼은 평평한 띠("채워진" 창)가 되며 평균 주파수는 정확히 최댓값의 절반입니다. 교란되거나 협착된 흐름은 반대로 스펙트럼을 넓힙니다. 펄스 도플러는 펄스마다 한 번 에코를 샘플링하므로 나이퀴스트 정리에 따라 $|f_D| < \mathrm{PRF}/2$만 측정할 수 있습니다. PRF를 낮추거나 속도를 높이면 수축기 최고점이 음의 쪽으로 넘어갑니다(앨리어싱). 실제 장비는 빠른 제트에는 높은 PRF가, 깊은 혈관에는 낮은 PRF가 필요합니다. 다음 펄스를 보내기 전에 각 펄스가 돌아와야 하기 때문입니다. 단순화: 샘플 볼륨이 혈관 전체를 덮고, 빔은 균일하며, IQ 신호를 기저대역에서 직접 시뮬레이션하고, 벽 필터나 조직 클러터는 없습니다. 모든 값은 근사치이며 교육용일 뿐 임상용이 아닙니다.'
meanings:
- '두 번의 심장 박동 동안의 중심축 속도: 수축기 최고점, 짧은 역류, 느린 이완기 흐름'
- '무작위 적혈구: 혈관 내 반지름, 에코의 위상과 세기'
- '포물선(층류) 분포 곱하기 파형: 외적, 합하는 지표 없음'
- 각 펄스에서 각 적혈구의 도플러 이동 $2 f_0 v \cos\theta / c$
- '반복된 $n$ ⇒ 합: 수신 에코, 펄스마다 복소(IQ) 샘플 하나, 간격 $\Delta t = 1/\mathrm{PRF}$'
- '스펙트로그램: 시간 창 $k$에서 주파수 $f$의 파워'
- 펄스 도플러는 $f$를 $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$ 안으로 접힌 값으로만 봄
labels:
  f0: 송신 주파수 $f_0$
  theta: 빔–혈류 각도 $\theta$
  v_peak: 수축기 최고 속도
  prf: 펄스 반복 주파수 PRF
  heart_rate: 심박수
  n_scatterers: 시뮬레이션할 적혈구 수
