source_hash: 0fd4a04dbd76
title: 針孔相機
summary: 三維場景如何變成二維影像：模型、視圖與投影三個 $4\times4$ 矩陣作用於齊次座標，再經透視除法與視埠轉換得到像素。在相機環繞時，以一次 einsum 同時投影線框物體的所有頂點。比較透視投影與正交投影以及推軌變焦，看平行線在消失點交會，並把同一台相機寫成 $K[R\,|\,\mathbf t]$。
notes: 第 4 個座標讓相機成為線性的：平移變成矩陣的一行，而除以深度的透視則變成把深度複製到 $\tilde x_4$ 的矩陣，最後再做一次除法。$w = 0$ 的點是方向；它們的影像就是消失點，所有水平方向都消失在地平線上，當相機向下看時，地平線位於影像中心上方。正交相機的 $\tilde x_4 = 1$，因此沒有消失點，遠處物體也不會縮小，就像工程圖與許多策略遊戲。推軌變焦（「迷魂記效應」）在移動相機的同時改變視野，使 $d\,\tan(\text{fov}/2)$ 保持不變：物體大小不變，但其後方的地板被拉伸。電腦視覺函式庫使用 $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$，$z$ 朝前；圖形 API 使用 $P V M$，$z$ 朝後；兩者只差在翻轉 $y$ 與 $z$ 軸，終端會檢查它們給出相同的像素。
meanings:
- 齊次座標 $(x, y, z, 1)$ 中的頂點 $v$；邊是索引對 $(E, 2)$
- 物體 → 世界：縮放、繞 $y$ 旋轉，再平移（第 4 行）
- 世界 → 相機：各列為相機座標軸，平移為 $-R\,\mathbf e$
- 相機 → 裁剪空間；其最後一列把 $-z$ 複製到 $\tilde x_4$（正交：$\tilde x_4 = 1$）
- 重複的 $j, k, l$ ⇒ 求和：一次呼叫讓每個頂點通過全部三個矩陣
- 除以 $\tilde x_4$ 的透視除法，再做視埠轉換；影像列由上往下數
- 焦距 $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$ 與主點；世界 → 相機的剛體運動
- 無窮遠點 $(\hat{\mathbf d}, 0)$ 不受平移影響：所有沿 $\hat{\mathbf d}$ 的直線都在此交會
labels:
  shape: 物體
  yaw: 物體旋轉（模型矩陣）
  fov: 視野
  distance: 相機距離
  height_cam: 相機高度
  width: 影像寬度
  height: 影像高度
  frames: 每圈幀數
