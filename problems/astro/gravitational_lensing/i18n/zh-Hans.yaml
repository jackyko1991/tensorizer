source_hash: e3dd0dc823a1
title: 黑洞的引力透镜效应
summary: 掠过黑洞的光线是零测地线，一次即可追踪一整扇不同瞄准距离的光线：远处的光线偏折 $4GM/(c^2 b)$，位于 $\sqrt{27}\,GM/c^2$ 以内的光线则会落入。在天空上，透镜方程用单个张量运算把每个像素映射回源平面，因此从黑洞后方经过的恒星会变成两道弧、一个爱因斯坦环和一个放大率尖峰。
notes: 光线图：单位 $G = c = M = 1$；虚线圆是光子球（$r = 3M$），$b < \sqrt{27}\,M \approx 5.2\,M$ 的光线最终落入黑洞，这就是黑洞投下的阴影为其视界半径 2.6 倍的原因。刚好在外侧的光线可能先绕一圈再逃逸。天空图：以爱因斯坦半径为单位的薄透镜点质量（对银河系中的恒星级黑洞约为一毫角秒，因此微引力透镜表现为增亮，而不是可分辨的像）。引力透镜保持面亮度不变，所以像就是在 $\beta(\theta)$ 处取值的光源；多出来的光来自像被拉伸。在接近完全对齐时，有限的光源大小限制了放大率，而点光源会给出 $\mu \to \infty$。
meanings:
- 沿光线 $b$ 的 $1/r$，从 0（无穷远）出发，$du/d\varphi = 1/b$
- 零测地线轨道方程，对所有光线用 RK4 对 $\varphi$ 积分
- 出射角减去 $\pi$；被俘获则为 NaN
- 像素 $p$ 的天空角度，以 $\theta_E$ 为单位
- 重复的 $j$ ⇒ 求和
- 每个像素在源平面上对应的位置
- 通过广播求每一帧 $f$ 的透镜像
- 放大率：总通量之比
labels:
  b_min: 最小瞄准距离 $b$
  b_max: 最大瞄准距离 $b$
  n_rays: 光线数
  impact: 光源相对透镜的偏移 $u$
  source_radius: 光源半径
  n_pixels: 每边天空像素数
