source_hash: 55836e86a221
title: 튜링 기계 묶음으로 보는 정지 문제
summary: '물리가 아니라 재미로: 수십만 대의 튜링 기계를 텐서로 한꺼번에 실행합니다. 모든 기계의 한 스텝은 gather(각 헤드 아래의 테이프 읽기), 고급 인덱싱으로 규칙 찾기, scatter(쓰기)뿐입니다. 2상태와 3상태 비지 비버 후보를 모두 열거하고, 챔피언 $S(2) = 6$과 $S(3) = 21$을 찾고, 정지 문제를 직접 확인해 보세요. 어떤 스텝 예산을 고르든 아직 판정되지 않은 기계가 남습니다.'
notes: '튜링(1936)은 모든 기계와 입력에 대해 그것이 멈추는지를 판정하는 프로그램이 존재하지 않음을 보였습니다. 대각선 논법을 한 문단으로: 기계 $D(M)$이 자기 자신의 기술을 입력으로 시작한 모든 기계 $M$에 대해 “멈춘다” 또는 “영원히 돈다”를 답한다고 합시다. $D(M)$을 실행한 뒤 그 반대로 행동하는 $G$를 만듭니다. $D$가 “멈춘다”고 하면 영원히 반복하고, $D$가 “영원히 돈다”고 하면 멈춥니다. 이제 $G$에 자기 자신의 기술을 주면 어떻게 될까요? 멈춘다면 $D$는 영원히 돈다고 말한 것이고, 영원히 돈다면 $D$는 멈춘다고 말한 것입니다. 어느 쪽이든 $D$는 틀렸으므로 $D$는 존재할 수 없습니다. 라도(1962)는 이것을 비지 비버라는 게임으로 바꾸었습니다. 빈 테이프에서 시작해 멈추는 모든 $n$상태 2기호 기계 가운데 $S(n)$은 가장 긴 실행 스텝 수, $\Sigma(n)$은 남기는 1의 최대 개수입니다. 둘 다 어떤 계산 가능 함수보다 빠르게 증가합니다. $S(n)$을 계산하는 프로그램이 있다면 정지 문제를 풀 수 있기 때문입니다: 각 기계를 $S(n)$ 스텝 실행하고, 그때까지 멈추지 않으면 영원히 멈추지 않습니다. 알려진 값: $S(2) = 6$, $\Sigma(2) = 4$ (라도), $S(3) = 21$, $\Sigma(3) = 6$ (린과 라도 1965), $S(4) = 107$, $\Sigma(4) = 13$ (브래디 1983), 그리고 $S(5) = 47\,176\,870$은 2024년 bbchallenge 협업이 다른 모든 5상태 기계가 영원히 돈다는 것을 Coq로 검증한 증명으로 확정했습니다. 그래프는 왜 어려운지를 보여 줍니다: 멈춘 비율 $f(t)$는 올라갔다가 평평해지고, 유한한 예산으로는 느리게 멈추는 기계와 영원히 도는 기계를 결코 구별할 수 없습니다. 여기서 스텝 21 이후의 평탄 구간은 3상태에 대한 알려진 답입니다. 남은 기계들이 반복한다는 것이 증명되었기 때문입니다. 3상태 정규화:
  첫 규칙을 A0 → 1RB로 고정합니다. 알려진 챔피언을 유지하는 흔한 선택입니다(좌우 대칭으로 첫 이동은 오른쪽으로 둘 수 있고, 다른 상태의 이름은 서로 바꿀 수 있으며, 빈 테이프에서 A에 머무는 기계는 결코 멈추지 않습니다). 또한 모든 정지 규칙은 1RH로 두어 $16^6$ 대신 $13^5 = 371\,293$개의 기계가 됩니다. 4상태도 시도해 보세요: 무작위 표본에 107스텝 챔피언이 들어 있는 경우는 드뭅니다.'
meanings:
- '상태 $q$와 읽은 기호 $r$에 대한 기계 $b$의 규칙표: (쓸 기호 $w$, 이동 $m = \pm1$, 다음 상태 $q''$); 상태 $n$은 정지 상태 $H$'
- 기계 $b$의 테이프 칸 $x$, 처음에는 모두 0; 어떤 헤드도 끝에 닿지 않도록 $L = 2t_{\max} + 1$
- 헤드 위치(처음에는 가운데)와 현재 상태(처음에는 $A$)
- 모든 헤드 아래의 기호를 한꺼번에 읽기
- '고급 인덱싱: 각 기계가 자기 규칙을 찾음'
- 쓰기; 그다음 $s_b \ne H$인 곳에서만 이동하고 상태를 바꿈(멈춘 기계는 고정)
- '기계 $b$가 $H$에 들어간 스텝, 또는 $-1$: 예산 안에서 미판정'
- '$\tau_b \le t$인 기계의 비율: 감소하지 않으며 1 아래에 머묾'
- '반복된 $x$ ⇒ 합: 멈춘 기계가 남기는 1의 개수'
labels:
  states: 상태 수 $n$ (2와 3은 전수, 4는 표본)
  budget: 스텝 예산 $t_{\max}$
  n_sample: 무작위 4상태 기계 수
