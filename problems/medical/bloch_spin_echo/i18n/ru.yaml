source_hash: 2ee80d9bf824
title: Уравнения Блоха и спиновое эхо
summary: 'Уравнение Блоха — это векторное произведение $\varepsilon_{ijk} M_j \Omega_k$ плюс релаксация. Сотни изохромат с немного различающимися частотами расстройки $\Delta\omega_n$ продвигаются вместе одним пакетным шагом RK4: после 90°-импульса они расходятся веером и сигнал затухает с $T_2^*$, затем 180°-импульс в момент $TE/2$ заставляет их снова сфокусироваться в эхо в момент $TE$, высота которого убывает только с истинным $T_2$.'
notes: 'Время измеряется в мс, частоты — в рад/мс. Каждая изохромата по отдельности сохраняет $\lvert\mathbf M\rvert$ (не считая релаксации), но среднее по ансамблю теряет фазовую когерентность: при лоренцевом разбросе спад свободной индукции следует $e^{-t/T_2^*}$, где $1/T_2^* = 1/T_2 + 1/T_2^{\prime}$. 180°-импульс отражает каждую фазу, поэтому спины, ушедшие вперёд, теперь отстают, и все снова выстраиваются в момент $TE$; это компенсирует статическую неоднородность, но не случайные потери $T_2$, так что высоты эха следуют $e^{-TE/T_2}$. Несколько перефокусирующих импульсов (последовательность CPMG, 180° вокруг $y$) дают ряд эхо-сигналов, по которому определяется $T_2$. Импульсы — короткие прямоугольные «жёсткие» импульсы, рассчитываемые тем же уравнением Блоха; спины с большой расстройкой перефокусируются неидеально. Значения иллюстративные, только для обучения, не для клинического применения. Попробуйте гауссов разброс, больший $T_2^{\prime}$ или одно эхо.'
meanings:
- намагниченность изохроматы $n$, компонента $i \in \{x, y, z\}$, во вращающейся системе отсчёта
- 'символ Леви-Чивиты: векторное произведение, в точности как в силе Лоренца'
- '$\gamma\mathbf B$ во вращающейся системе: РЧ-поле $\omega_1$ в плоскости $xy$ во время импульса, расстройка $\Delta\omega_n$ вдоль $z$'
- 'повторяющиеся $j, k$ ⇒ суммирование: прецессия $\mathbf M\times\boldsymbol\Omega$ каждой изохроматы'
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$; свёртывается с $M_{nj} - M^0_j$ по $j$
- разброс частот прецессии из-за неоднородности поля, ширина $1/T_2^{\prime}$
- 'то, что видит приёмная катушка: средняя поперечная намагниченность, суммированная по $n$'
labels:
  T1: Продольная релаксация $T_1$
  T2: Поперечная релаксация $T_2$
  t2_prime: Время неоднородности $T_2^{\prime}$
  TE: Время эха $TE$
  n_echoes: Число эхо-сигналов (180°-импульсов)
  n_spins: Изохроматы
  spread: Форма линии расстройки
