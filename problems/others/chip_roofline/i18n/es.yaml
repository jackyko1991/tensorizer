source_hash: 3c8cc50504ae
title: Mide el roofline de tu chip
summary: ¿Qué tan rápida es la máquina en la que se ejecuta esto? Cronometra una copia grande de memoria para obtener el ancho de banda $\beta$, y un producto de matrices $n\times n$ $C_{ij} = A_{ik}B_{kj}$ en FP64, FP32, TF32, BF16 y FP16 para obtener la tasa $\pi$ de cada precisión; el roofline $P(I) = \min(\pi, \beta I)$ indica entonces qué kernels ejecuta tu chip a toda velocidad y cuáles esperan a la memoria. Técnicas de programación ▸ Chipsets de aceleración coloca tu resultado junto a las hojas de especificaciones de otros chips.
notes: 'Las hojas de especificaciones dan picos; una medición da lo que PyTorch obtiene de verdad en tu máquina, normalmente el 50–90% del pico en un producto de matrices grande. El trabajo en la GPU es asíncrono, así que cada medición de tiempo espera a que el dispositivo termine (synchronize) y toma la mediana de varias ejecuciones tras un calentamiento. En las GPU de NVIDIA el producto FP32 se mide dos veces: una en FP32 real y otra con los núcleos tensoriales TF32 (torch.set_float32_matmul_precision("high")), el ajuste que cambia en silencio bits de mantisa por velocidad. El backend de GPU de Apple (MPS) no tiene float64, así que allí se omite FP64; las GPU de consumo ejecutan FP64 a una pequeña fracción de su tasa FP32, algo que importa en física. Prueba un tamaño de matriz mayor: la tasa sube hasta que el producto queda limitado por el cómputo, mientras la copia de memoria se mantiene en el ancho de banda.'
meanings:
- ancho de banda de memoria de una copia grande (lectura + escritura), GB/s
- tasa alcanzada del producto de matrices en precisión $p$, TFLOP/s
- '$k$ repetido ⇒ sumado: $n^3$ multiplicaciones-sumas'
- 'FLOP por byte movido: $2n/(3b)$ para elementos de $b$ bytes'
- lo máximo que puede alcanzar un kernel de intensidad $I$
labels:
  matrix_size: Tamaño de matriz $n$
  copy_mb: Tamaño de la copia
  repeats: Repeticiones cronometradas
