title: Реликтовое излучение как идеальное чёрное тело (COBE FIRAS)
summary: Прибор FIRAS спутника COBE измерил космическое микроволновое фоновое излучение на 43 частотах и обнаружил самое совершенное чёрное тело из когда-либо наблюдавшихся. Пакет из четырёх моделей (только закон Планка, с химическим потенциалом Бозе–Эйнштейна $\mu$, с комптоновским $y$-искажением, с обоими) подгоняется к реальной таблице FIRAS в одном тензоре, а якобиан вычисляется автоматическим дифференцированием. Подгонка даёт $T \approx 2.725$ K при $\chi^2 \approx 45$ на 42 степени свободы, остатки меньше $10^{-4}$ от пика, искажения, совместимые с нулём ($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$), а из $T$ — около 411 фотонов на см³.
notes: 'В 1990 году FIRAS (Far-Infrared Absolute Spectrophotometer — абсолютный спектрофотометр дальнего ИК-диапазона на спутнике NASA COBE) сравнил небо с внешним калибратором-чёрным телом и не нашёл разницы; итоговый спектр (Fixsen et al. 1996) отклоняется от кривой Планка менее чем на 50 миллионных долей от пика. Джон Мазер и Джордж Смут разделили Нобелевскую премию по физике 2006 года «за открытие чернотельной формы и анизотропии космического микроволнового фонового излучения». Столь совершенное чёрное тело означает, что ранняя Вселенная была горячей, плотной и находилась в тепловом равновесии: энергия, выделившаяся после красного смещения $z \sim 2\times10^6$, оставила бы химический потенциал $\mu$ (спектр Бозе–Эйнштейна, $z \gtrsim 2\times10^5$) или комптоновское $y$-искажение (горячие электроны повышают энергию фотонов, $z \lesssim 5\times10^4$; та же форма, что у эффекта Сюняева–Зельдовича, с нулём при $x = 3.83$, или 217 GHz, и с сохранением числа фотонов). Наша подгонка, использующая
  только диагональные ошибки, даёт 95 %-ные ограничения примерно $|\mu| < 7\times10^{-5}$ и $|y| < 6\times10^{-6}$; опубликованные ограничения FIRAS, $|\mu| < 9\times10^{-5}$ и $|y| < 1.5\times10^{-5}$, шире, потому что в них используется полная корреляционная ковариация и учтены систематические (калибровочные и галактические) неопределённости. К температуре следует относиться осторожно: статистически подгонка фиксирует $T$ с точностью около $10^{-5}$ K, но абсолютная шкала задаётся термометрией калибратора, а таблица LAMBDA записывает спектр как чёрное тело 2.725 K плюс опубликованные остатки, так что $T = 2.725$ K заложено изначально; лучшее абсолютное значение на сегодня — $2.72548 \pm 0.00057$ K (Fixsen 2009). Из $T$ следуют $n_\gamma \approx 411$ cm$^{-3}$ и $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$. В анимации левая панель показывает сходимость подгонки от начального приближения (планки погрешностей увеличены в 400 раз, как на знаменитом графике, иначе их не видно); затем правая
  панель увеличивает остатки в единицах $10^{-4}$ от пика вместе с формами, которые оставили бы $\mu$ или $y$ на нашем 95 %-ном пределе после повторной подгонки $T$. Данные: Table 4 из D. J. Fixsen et al., ApJ 473, 576 (1996), из архива NASA LAMBDA (https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt), общественное достояние, прилагаются как data/firas_monopole.csv.'
meanings:
- 43 волновых числа FIRAS (cm$^{-1}$), интенсивности и ошибки $1\sigma$ (MJy/sr)
- одна строка $(T, \mu, y)$ на каждую модель $b$ пакета
- $h\nu/kT$ с помощью broadcasting $(B,1)$ против $(F,)$
- заселённость Бозе–Эйнштейна плюс член $y$ Компанейца, умноженные на $2hc\tilde\nu^3$
- 'автодифференцирование $\sum_b I_{bf}$: строки независимы, поэтому один вызов даёт якобиан каждой модели'
- 'повторяющийся $f$ ⇒ суммирование: матрица Фишера; её обратная — ковариация'
- один шаг Левенберга–Марквардта сразу для всех моделей
- качество подгонки для каждой модели
labels:
  T_init: Начальное приближение для $T$
  steps: Шаги Левенберга–Марквардта
