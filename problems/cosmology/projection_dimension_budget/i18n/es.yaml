source_hash: b577c14eb932
title: ¿Cuántas dimensiones? El presupuesto de la hipótesis de proyección
summary: 'Una hipótesis especulativa, no física establecida: ¿cuántas dimensiones ocultas necesita la idea de proyección, y cuántas permiten los experimentos? El lado cuántico, según el paso 1, necesita una dimensión compleja oculta por resultado y $2^N$ para $N$ partículas entrelazadas, pero estas viven en el espacio de Hilbert y no tienen por qué ser direcciones del espacio. En el lado de la gravedad, $n$ dimensiones compactas de radio $R$ cambian la ley de Newton por debajo de $R$. Las balanzas de torsión, el LHC y las cotas de supernovas y estrellas de neutrones llenan un mapa $(n, R)$ cota a cota. Todo $n$ sobrevive, pero solo si $R$ es pequeño: por debajo de 38.6 μm para $n = 1$ y de $2\times10^{-10}$ m para $n = 2$. Restringida, no descartada.'
notes: 'Estado: especulativo; restringida, no descartada. Paso 3 de la hipótesis de proyección (la idea especulativa propia del autor, véase la descripción de la serie; no física establecida), para el postulado P5: los efectos cuánticos necesitan cierto número $d_Q$ de dimensiones y la gravedad cierto número $d_G$, estimados, nunca fijados a mano. El paso 1 (cosmology/projection_postulate) encontró que la carrera de proyección necesita exactamente una dimensión compleja oculta por resultado; el paso 2 (cosmology/projection_one_particle) cortó una línea de universo; el paso 4 (cosmology/projection_singularity_fold) trata las singularidades como pliegues de la proyección. No se supone ningún $n$: el mapa recorre de $n = 0$ a $n_{max}$ y $R$ desde la longitud de Planck hasta 1 m. Primero la física conocida. (a) Lado cuántico: la carrera reproduce la regla de Born con $d + K$ dimensiones para $K$ resultados, y $N$ sistemas de dos niveles entrelazados necesitan un espacio de Hilbert de dimensión
  $2^N$; la mecánica cuántica estándar usa el mismo espacio, y sus dimensiones no son direcciones del espacio. Si se leyeran como direcciones espaciales, $N$ qubits necesitarían $2^{N+1} - 3$ dimensiones reales adicionales (5 para un par de Bell), un número que cambiaría cada vez que unas partículas se entrelazan, algo que ninguna variedad espacial fija hace. (b) Lado gravitatorio: en $3 + n$ dimensiones espaciales la ley de Gauss da una atracción $G_D M/r^{n+2}$ (comprobada mediante flujos calculados con autograd a través de $S^{n+2}$ para $n = 0..6$). Si las $n$ dimensiones son círculos de radio $R$, la suma de imágenes convierte esto en la ley de Newton $G_4 M/r^2$ con $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ más allá de $R$ (comprobado para $n = 1, 2, 3$). Justo fuera, el primer nivel de gravitones de Kaluza–Klein da un término de Yukawa con $\alpha = 8n/3$ ($16/3$ para un 2-toro, como en la revisión del PDG) y $\lambda = R$. La relación ADD de Arkani-Hamed, Dimopoulos y Dvali (1998), en
  la convención $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$ que usan el PDG y los experimentos del LHC, reproduce los números del PDG: $R = 30$ μm, $n = 2$ da $M_D = 4.0$ TeV, y $M_D = 1$ TeV requiere $10^{12}$ m, 0.5 mm, ..., 0.1 MeV$^{-1}$ para $n = 1..6$. Cotas (data/gravity_bounds.csv, números citados; las filas de torsión y del LHC son las incluidas en cosmology/hierarchy_extra_dimensions, citadas de nuevo). Las balanzas de torsión de Eöt-Wash excluyen $|\alpha| = 1$ por encima de 56 μm (Kapner et al., PRL 98, 021101, 2007) y por encima de 38.6 μm (Lee et al., PRL 124, 101101, 2020); como $\alpha\geq 1$ para todo $n$, $R > 38.6$ μm queda excluido para todo $n\geq 1$ (conservador: la curva medida sigue bajando a mayores $\lambda$). Para $n = 2$, Tan et al. (PRL 116, 131101, 2016) dan $R < 30$ μm. La búsqueda de monojets de ATLAS (PRD 103, 112006, 2021, CC-BY 4.0) da $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV para $n = 2..6$. El enfriamiento de SN1987A da $M_D > 27$ (2.4) TeV para $n = 2$ (3) (Hanhart
  et al., PLB 509, 1, 2001), y el calentamiento de estrellas de neutrones por gravitones KK atrapados da $M_D > 1700$ (76) TeV (Hannestad y Raffelt, PRD 67, 125008, 2003), ambas tal como se citan en la revisión del PDG 2024. Cada cota se convierte en una máscara booleana sobre la malla $(n, R)$, y unos puntos de prueba se comprueban frente a respuestas calculadas a mano. Resultado: $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, estrellas de neutrones), $2.6\times10^{-12}$ m ($n = 3$), y los radios del LHC para $n = 4..6$ ($5\times10^{-13}$ a $2.5\times10^{-15}$ m). Para $n\geq 7$ solo se incluye la cota de torsión; los límites del LHC se debilitan lentamente con $n$ y, extrapolados (no se hace aquí), empujarían $R$ hacia $1/M_D\sim 10^{-20}$ m. ADD con $M_D = 1$ TeV, la solución original del problema de la jerarquía, queda excluido para $n = 1..6$. El presupuesto: mínimo $n = 0$, porque la gravedad no necesita ninguna dimensión espacial adicional y las dimensiones cuánticas
  ocultas no tienen por qué ser espaciales; ningún máximo, porque los datos permiten cualquier $n$ si $R < R_{max}(n)$. Qué lectura adopta la hipótesis: la lectura de espacio de Hilbert para P1 y P2 (las dimensiones ocultas son dimensiones del espacio de estados, así que $D_Q\geq 2^N$ no es una restricción sobre el espacio), y la lectura geométrica para P4 y P5 (dimensiones de inmersión; si la gravedad puede propagarse en ellas, deben ser compactas y menores que $R_{max}(n)$; de lo contrario son coordenadas de la inmersión, no lugares a los que se pueda ir). Veredicto: restringida, no descartada, y sin ninguna predicción nueva: la hipótesis solo se volvería contrastable si fijara $n$ y $R$ cerca de estas cotas.'
meanings:
- '$i$ repetido ⇒ sumado: la atracción hacia fuera en puntos aleatorios de $S^{n+2}$ (autograd); el flujo es el mismo a cualquier radio'
- 'la masa y sus imágenes alrededor de los $n$ círculos, sumadas sobre el índice de imagen $I$: $1/r^{n+2}$ dentro, $G_4/r^2$ fuera'
- 'mayor radio que permite una cota citada: $\lambda_{max}$ para las balanzas de torsión, el radio ADD en $M_D = M_b$ para los límites de colisionadores y astrofísicos'
- un mapa booleano por familia de cotas, difundido (broadcast) sobre toda la malla
- 'el presupuesto de dimensiones: las dimensiones compactas solo se permiten por debajo de este radio'
- escala fundamental de la gravedad para $n$ dimensiones de radio $R$ (convención de Giudice–Rattazzi–Wells, la que usa el PDG)
- dimensión del espacio de Hilbert $2^N$ que necesitan $N$ qubits entrelazados (paso 1)
labels:
  n_max: Mayor número de dimensiones adicionales $n$ en el mapa (se recorren todos los $n$ desde 0)
  R_points: Radios en el mapa, espaciados logarítmicamente desde la longitud de Planck hasta 1 m
  M_star: Escala fundamental $M_D$ para la línea ADD
  qubits: Qubits entrelazados $N$ para el recuento cuántico
