source_hash: 6140ba04c201
title: Бернулли и трубка Вентури
summary: Вода, текущая по сужающейся трубе, должна ускоряться, чтобы переносить тот же расход ($A u = Q$), и по закону Бернулли её давление в горловине падает. Площадь, скорость и давление — тензоры вдоль оси трубы; группа частиц-трассеров показывает ускорение.
notes: 'Течение считается одномерным: скорость однородна по каждому сечению, трение не учитывается, поэтому закон Бернулли здесь выполняется точно. Трассеры на фиксированной доле местного радиуса следуют за стенкой. Манометры — открытые трубки, высота столба жидкости в которых $h = p/(\rho g)$ растёт с местным избыточным давлением. Измерение $p_1 - p_2$ даёт расход $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$ — так работает расходомер Вентури. Если давление в горловине опускается ниже атмосферного, в реальном течении возникла бы кавитация; здесь вместо этого выводится предупреждение.'
meanings:
- точки вдоль оси трубы, индекс $k$
- площадь сечения в каждой точке оси
- 'непрерывность: через каждое сечение проходит один и тот же объём в секунду'
- 'Бернулли: быстрее течение ⇒ ниже давление'
- положения группы трассеров, продвигаемых RK4
- объёмный расход $A_1 u_1$ в м³/с
labels:
  u1: Скорость на входе $u_1$
  area_ratio: Отношение площадей $A_1/A_2$
  p1: Избыточное давление на входе $p_1$
  t_max: Время моделирования
