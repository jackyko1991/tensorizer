<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="HCl molecule: a small hydrogen atom bonded by a spring to a large chlorine atom, stretching along the bond with length r and rotating about the centre of mass with angular momentum J, absorbing infrared light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- rotation about the centre of mass -->
    <ellipse cx="148" cy="84" rx="90" ry="30" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M88,106 A90,30 0 0 0 212,107" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#turn)"/>
    <text x="216" y="130" font-style="italic" fill="#b45309">J</text>
    <!-- bond as a spring -->
    <path d="M60,84 l6,-8 l8,16 l8,-16 l8,16 l8,-16 l8,16 l8,-16 l8,16 l8,-16 l8,16 l4,-8" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- atoms -->
    <circle cx="52" cy="84" r="9" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="47" y="89" font-size="12" fill="#1e40af">H</text>
    <circle cx="164" cy="84" r="22" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="153" y="89" font-size="13" fill="#ffffff">Cl</text>
    <circle cx="148" cy="84" r="2.5" fill="#374151"/>
    <!-- vibration: the bond stretches -->
    <line x1="44" y1="60" x2="20" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="60" y1="60" x2="84" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="44" y="48" font-style="italic" fill="#b91c1c">v</text>
    <!-- bond length -->
    <line x1="52" y1="132" x2="164" y2="132" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="52" y1="126" x2="52" y2="138" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="164" y1="126" x2="164" y2="138" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="104" y="150" font-style="italic">r</text>
    <!-- infrared photon -->
    <path d="M150,22 q5,-8 10,0 t10,0 t10,0 t10,0 t10,0" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="200" y1="22" x2="212" y2="22" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="106" y="27" font-size="13" fill="#b91c1c">IR <tspan font-style="italic">hν</tspan></text>
  </g>
</svg>
