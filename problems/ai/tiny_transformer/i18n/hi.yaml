title: एक छोटा GPT शेक्सपियर लिखता है
summary: 'मूल टेंसर संक्रियाओं से बना एक अक्षर-स्तरीय GPT: एम्बेडिंग, einsum में लिखा गया कारणात्मक मल्टी-हेड सेल्फ़-अटेंशन, LayerNorm, एक MLP और अवशिष्ट संयोजन, कोई nn.Transformer नहीं। मैकबेथ और रोमियो एंड जूलियट पर लगभग एक मिनट प्रशिक्षण के बाद इसका लॉस $\ln V$ ($V$ अक्षरों पर एकसमान अनुमान) से गिरता है और इसके नमूने निरर्थक अक्षरों से शब्दों, नामों और पद्य जैसी पंक्तियों में बदल जाते हैं, जबकि अटेंशन मानचित्र पूरी तरह निम्न-त्रिकोणीय बने रहते हैं।'
notes: 'संरचना Vaswani et al., "Attention is all you need" (2017) की है, केवल-डिकोडर GPT रूप में, प्री-नॉर्म ब्लॉकों के साथ: $X \leftarrow X + \mathrm{Attn}(\mathrm{LN}\,X)$, फिर $X \leftarrow X + \mathrm{MLP}(\mathrm{LN}\,X)$। परीक्षण कार्यप्रणाली को ठीक-ठीक जाँचते हैं: einsum अटेंशन PyTorch के संयुक्त `scaled_dot_product_attention` के बराबर है जब `is_causal=True` हो; स्थिति $t$ के बाद के अक्षर बदलने से $t$ तक का कोई भी आउटपुट नहीं बदलता (मास्क); $A$ की पंक्तियों का योग 1 है; अप्रशिक्षित लॉस $\ln V$ है; मॉडल एक बैच को याद कर सकता है; और भारों की संख्या $Vd + Td + L(12d^2 + 13d) + 2d + dV + V$ है। मास्क के कारण एक फ़ॉरवर्ड पास किसी खिड़की की सभी $T$ अगले-अक्षर भविष्यवाणियों को एक साथ प्रशिक्षित करता है, जबकि जनन एक-एक अक्षर करके ही चलना चाहिए। इतना छोटा मॉडल (113 093 भार, CPU पर लगभग एक मिनट) वर्तनी, रिक्त स्थान, बड़े अक्षर से शुरू होने वाले वक्ताओं के नाम और पंक्ति-विराम सीखता है, अर्थ नहीं; वैलिडेशन लॉस अंत में प्रति अक्षर लगभग 2 नैट पर पहुँचता है। हीटमैप हर परत के लिए वह हेड दिखाते हैं
  जो पंक्ति "When shall we three meet again?" पर पिछले अक्षर पर सबसे अधिक ध्यान देता है। जैवसूचना-विज्ञान का प्रोटीन भाषा मॉडल छिपे अक्षरों को भरने के लिए यही अटेंशन बिना मास्क के उपयोग करता है। पाठ: The Complete Works of William Shakespeare, Project Gutenberg eBook #100 (सार्वजनिक डोमेन) से मैकबेथ और रोमियो एंड जूलियट, ई-बुक का शीर्षलेख और लाइसेंस हटाकर, घुमावदार उद्धरण चिह्नों को ASCII में बदलकर; data/shakespeare.txt में 247 kB। अधिक चरण, चौड़ा मॉडल, या तापमान 0.5 बनाम 1.2 आज़माइए।'
meanings:
- अक्षर id के रूप में पाठ की यादृच्छिक खिड़कियाँ; लक्ष्य वही खिड़कियाँ हैं जो एक अक्षर बाईं ओर खिसकाई गई हैं
- टोकन एम्बेडिंग और सीखी गई स्थिति एम्बेडिंग का योग
- हर टोकन सदिश को उसके चैनलों पर माध्य 0 पर खिसकाकर प्रसरण 1 पर मापित किया जाता है, फिर एक सीखा गया पैमाना और विस्थापन लगाया जाता है
- 'दोहराया गया $c$ ⇒ योग: हर हेड की क्वेरी (कुंजियाँ और मान भी इसी तरह)'
- 'विकर्ण पर और उसके नीचे $0$, उसके ऊपर $-\infty$: softmax के बाद कोई स्थिति बाद के अक्षरों को नहीं देख सकती'
- दोहराया गया $k$ ⇒ योग; हर पंक्ति पहले की स्थितियों $j \le i$ पर एक प्रायिकता बंटन है
- 'दोहराया गया $j$, फिर $h, k$ ⇒ योग: हर स्थिति अपने अतीत से जो एकत्र करती है, वह अवशिष्ट संयोजन से वापस जोड़ा जाता है'
- वास्तविक अगले अक्षर का माध्य $-\log p$ नैट में; यह $\ln V$ से शुरू होता है
