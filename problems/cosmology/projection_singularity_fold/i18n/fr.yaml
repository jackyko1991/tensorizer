source_hash: c27c115f2935
title: Les singularités comme plis d'une projection
summary: 'Une hypothèse spéculative, pas de la physique établie : l''espace-temps courbe est l''ombre d''une surface dans un espace plat de dimension supérieure, et une singularité est l''endroit où cette ombre se plie. La géométrie connue est vérifiée d''abord. Le paraboloïde de Flamm et le plongement de Fronsdal (1959) de tout l''espace-temps de Schwarzschild dans six dimensions plates redonnent exactement la métrique (autograd), et le scalaire de Kretschmann $12r_s^2/r^6$ sort de la même différentiation automatique. Les nappes projetées se plient avec des exposants de densité universels : $-1/2$ pour un pli, $-2/3$ pour une fronce. Un intérieur en forme de pli laisse l''extérieur exactement de Schwarzschild, si bien qu''il se cache derrière l''horizon. Rien ici ne peut être observé directement.'
notes: 'Étape 4 de l''hypothèse de projection (voir la description de la série), l''hypothèse spéculative de l''auteur, pas de la physique établie. L''étape 1 (cosmology/projection_postulate) énonce le postulat P4 : l''espace-temps courbe est la forme projetée d''un plongement plat de dimension supérieure, et une singularité est l''endroit où la projection se plie (son jacobien perd du rang). L''étape 3 (cosmology/projection_dimension_budget) compte les dimensions, l''étape 5 (cosmology/projection_bell_test) teste les postulats de mesure, et l''étape 6 (cosmology/projection_telescope_tests) examine ce que les télescopes peuvent tester. Le nombre de dimensions plates $D$ reste ouvert : c''est ici un paramètre et il n''entre dans aucun résultat. D''abord la géométrie connue. (a) Flamm (1916) : la tranche équatoriale $t = $ const, $\theta = \pi/2$ de Schwarzschild dessinée dans $\mathbb R^3$ plat est le paraboloïde $z = 2\sqrt{r_s(r-r_s)}$, et sa métrique induite $dr^2/(1-r_s/r) + r^2d\phi^2$
  concorde à $10^{-16}$ près. (b) Fronsdal (Phys. Rev. 116, 778, 1959) plonge tout l''espace-temps de Schwarzschild, y compris l''intérieur de l''horizon, dans $\mathbb R^{1,5}$ plat. La métrique induite $\eta_{AB}\partial_iz^A\partial_jz^B$, avec le jacobien calculé par autograd, coïncide avec Schwarzschild à $10^{-13}$ près à l''extérieur et à l''intérieur, ainsi qu''en coordonnées de Kruskal à travers l''horizon. Une géométrie courbe en 4D peut réellement être vue comme une surface dans un espace plat ; c''est le point d''ancrage de P4. Deux faits comptent pour P4. Le plongement est de rang plein à l''horizon : la perte de rang observée en coordonnées $(t, r)$ disparaît en coordonnées de Kruskal. En $r\to0$, il ne se plie pas non plus ; il part à l''infini, $z^2\approx-2r_s^{3/2} r^{-1/2}$. La courbure, calculée par la même différentiation automatique (symboles de Christoffel, tenseur de Riemann, contractions einsum), donne $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ à $10^{-15}$ près. Les valeurs
  propres de marée statiques sont $+r_s/r^3$ (étirement radial) et $-r_s/2r^3$ (compression latérale), toutes divergentes en $r = 0$. L''affirmation de P4, rendue concrète : une nappe lisse dans $\mathbb R^D$ plat, vue à travers une projection, a une ombre dont la densité diverge sur les caustiques de pli. La théorie des catastrophes (Thom, Arnold) dit que l''exposant est universel. L''application $x = s^n$ donne $\rho\propto|x|^{1/n-1}$, mesuré à $-0.500$ (pli), $-0.667$ (fronce) et $-0.750$ ($n = 4$). Une sphère $S^k$ projetée sur $\mathbb R^3$ a une densité au bord $u^{(k-3-1)/2}$, mesurée à $-0.51$, $0.00$, $+0.45$ pour $k = 3, 4, 5$ quel que soit $D$. Ainsi, un pic de densité exige une nappe ayant exactement autant de dimensions que l''écran ; une nappe plus épaisse donne une ombre lisse. L''animation incline une nappe ondulée jusqu''à ce qu''elle se plie, pour $a\tan\alpha > 1$. Comparaison avec la RG : on donne à la masse $M = r_s/2$ la densité de l''ombre d''une 3-sphère, $\rho\propto(1-r^2/R^2)^{-1/2}$,
  une caricature en champ faible, pas une solution des équations d''Einstein. Hors de $R$, le champ vaut exactement $r_s/r^3$ (théorème de Birkhoff, théorème de la coquille), et le centre reste fini. La divergence se déplace vers la coquille de pli et s''adoucit en $(R-r)^{-1/2}$ pour la densité et le champ de marée, et l''indicateur de courbure $8\sum E^2$ en $(R-r)^{-1}$, au lieu de $r^{-3}$ et $r^{-6}$ en RG. La nappe elle-même conserve une courbure finie $1/R^2$. Verdict, en toute honnêteté. P4 peut conserver inchangée la géométrie extérieure de Schwarzschild, très finement testée, et ne modifier que l''intérieur, mais c''est précisément ce qui la rend intestable : pour $R < r_s$, le pli se trouve derrière l''horizon, et aucun signal provenant de lui ne nous parvient. Les exposants universels ne sont nouveaux qu''en tant que description, puisque rien à l''extérieur de l''horizon n''en dépend. Un pli à l''extérieur de l''horizon ($R > r_s$) serait un objet compact sans horizon, avec des
  anneaux de photons et des échos différents ; c''est ce que l''étape 6 teste avec les ombres de trous noirs. Contexte : fluids/blowup_profile_search montre comment les profils singuliers et leurs exposants sont étudiés en pratique (ansatz autosimilaire, recherche d''exposant). Wikipédia : métrique de Schwarzschild, théorie des catastrophes.'
meanings:
- jacobien du plongement par différentiation automatique, un par point d'échantillon $b$
- 'métrique induite : les indices de plongement répétés $A, C$ sont sommés avec la métrique plate $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$'
- la coordonnée de plongement supplémentaire, une somme de Gauss–Legendre à 64 nœuds sur $q$ en $\ell = \ln s$, différentiable en $r$ ; elle tend vers $-\infty$ comme $r^{-1/2}$
- 'plus petite valeur singulière : un pli de l''application est l''endroit où elle atteint 0 et où le jacobien perd du rang'
- symboles de Christoffel à partir de la dérivée autograd de la métrique ; $d$ est sommé
- tenseur de Riemann à partir d'une seconde dérivée en mode direct et de deux produits einsum ($e$ sommé)
- scalaire de Kretschmann, les quatre indices sommés ; égal à $12r_s^2/r^6$ à l'intérieur et à l'extérieur de l'horizon
- densité de l'ombre d'une nappe uniforme sous $x = s^n$ (pli $n = 2$, fronce $n = 3$), histogramme sur des intervalles logarithmiques
- tenseur de marée newtonien d'une masse répartie comme l'ombre d'une 3-sphère de rayon $R$ (caricature en champ faible)
labels:
  fold_radius: Rayon $R$ de la coquille de pli
  sheet_amplitude: Amplitude $a$ de la nappe ondulée
  D: Dimension plate $D$ contenant les nappes sphériques (ouverte)
  samples: Points échantillonnés sur chaque nappe
