source_hash: 9b626f6fbe35
title: 수용체–리간드 결합 ($k_{\mathrm{on}}$, $k_{\mathrm{off}}$)
summary: 면역 수용체(T 세포 수용체나 항체)는 표적을 얼마나 강하게, 얼마나 오래 붙잡을까? 결합 속도 상수 $k_{on}$과 해리 속도 상수 $k_{off}$를 갖는 질량 작용 동역학을 여러 수용체 변이체와 리간드 농도 적정 전체에 대해 하나의 $(B, C)$ 텐서로 동시에 풀고, SPR 방식의 센서그램과 결합 등온선을 나란히 보여 준다.
notes: '결합하려면 자유 수용체와 자유 리간드가 만나야 하므로 속도는 $k_{on} R L$이고, 해리는 각 복합체에서 독립적으로 일어나 속도는 $k_{off} C$이다. 평형에서는 둘이 균형을 이루며 결합 분율은 $\theta = L/(L + K_D)$, 여기서 $K_D = k_{off}/k_{on}$이다. $L = K_D$일 때 수용체의 절반이 점유된다(각 등온선의 눈금 표시). 빈 수용체에서 시작하면 평형으로의 접근은 지수적이며 $C(t) = C_{eq}(1 - e^{-k_{obs} t})$, $k_{obs} = k_{on} L + k_{off}$이다. SPR(표면 플라즈몬 공명) 장비는 이를 이용해 $k_{on}$을 측정한다. 완충액으로 세척한 뒤 복합체는 $e^{-k_{off} t}$로 감소하고 반감기는 $t_{1/2} = \ln 2 / k_{off}$, 즉 체류 시간이다. 변이체들은 현실적인 범위를 포괄한다. T 세포 수용체는 펩타이드–MHC에 약하게 결합하고($K_D \sim 1$–$10\,\mu$M, 체류 시간은 수 초), 항체는 강하게 결합한다($K_D \sim 0.1$ nM, 체류 시간은 수 시간). 등온선 위의 점을 보자. 낮은 농도에서는 $k_{obs} \approx k_{off}$가 작아서 세척이 시작될 때 항체가 아직 평형에 도달하지 못한다. 왜 T 세포에게 $k_{off}$가 그토록 중요할까? 동역학적 교정(kinetic proofreading) 모형에서 결합한 TCR은 세포를 활성화하기 전에 여러 신호 전달 단계(인산화)를 거쳐야 하며, 그 전에 리간드가 떨어지면 모든 것이 초기화된다. 이 단계들보다 오래 유지되는 복합체가 훨씬 더 신호를 보내기 쉬우므로, T 세포는 점유율만이 아니라 체류 시간 $1/k_{off}$를 읽어 친화도가 조금만 다른 자기 펩타이드와 외래 펩타이드를 구별할 수 있다. 단순화: 수용체당 결합 부위는 하나(결합력 효과나 재결합 없음), 용액은 잘 섞여 있고 물질 전달 제한은 없다. 리간드 고갈을 켜면 각 복합체가
  닫힌 부피에서 리간드를 하나씩 제거하며, 평형은 $L/(L + K_D)$ 대신 이차방정식의 해를 따른다.'
meanings:
- 수용체 변이체 $b$의 속도 상수(약한 / 중간 / 높은 친화도 TCR, 항체)
- 적정의 리간드 농도 $c$(nM); 마지막 값이 센서그램용
- 각 변이체와 농도에서의 자유 수용체와 복합체
- '자유 리간드: $L_c$, 고갈을 고려하면 $L_c - C_{bc}$'
- '합산하는 첨자 없음: $k_b$를 모든 농도 $c$로 브로드캐스팅'
- RK4의 우변; $R$과 $C$는 $\mp J$만큼 변하므로 $R + C = R_T$
- '해리 상수: 수용체의 절반을 결합시키는 리간드 농도'
- 평형 점유율(점선 등온선)
labels:
  log10_L: 센서그램 리간드 $\log_{10}(L/\mu\mathrm{M})$
  t_assoc: 결합 시간
  t_dissoc: 해리 시간
  depletion: 리간드 고갈
  R_T: 수용체 농도 $R_T$
