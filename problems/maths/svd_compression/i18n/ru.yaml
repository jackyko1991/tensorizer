source_hash: 7d50d95577a3
title: Сжатие изображений с помощью SVD
summary: Сингулярное разложение записывает изображение как сумму слоёв ранга 1 $\sigma_r\,\mathbf u_r\mathbf v_r^T$, начиная с самого сильного. Сохранение только $k$ слоёв даёт наилучшее приближение ранга $k$, его ошибка в точности равна энергии отброшенных сингулярных значений, а цветное изображение — это три матрицы, разложенные одним пакетным вызовом.
notes: Хранение $k$ слоёв изображения $H\times W$ требует $k(H + W + 1)$ чисел вместо $HW$, так что коэффициент сжатия равен $HW / k(H + W + 1)$. Теорема Эккарта–Янга утверждает, что никакая матрица ранга $k$ не ближе к $A$ по норме Фробениуса, а ошибка равна сумме квадратов отброшенных сингулярных значений. Терминал проверяет это на изображениях, реально восстановленных для нескольких $k$. Гладкие части сцены (градиент неба) захватываются первыми несколькими слоями, тогда как резким краям, диагоналям и тексту нужно много слоёв. Поэтому сингулярные значения сначала падают быстро, а затем медленно затухают, и поэтому JPEG использует вместо этого локальные косинусные преобразования. Первый слой — примерно профиль средней яркости; последующие слои чередуются по знаку (красный и синий), добавляя детали. Изображение рисуется процедурно, так что ничего не загружается. Попробуйте изображение побольше или более высокий максимальный ранг.
meanings:
- канал $c$, строка $i$, столбец $j$ сцены, нарисованной matplotlib, значения в $[0, 1]$
- 'повторяющийся $c$ ⇒ суммирование: яркость с весами $(0.299, 0.587, 0.114)$'
- одно SVD на канал, пакетно по ведущему индексу $c$; $R = \min(H, W)$
- 'повторяющийся $r \le k$ ⇒ суммирование: первые $k$ слоёв ранга 1'
- 'нет повторяющегося индекса: один слой-внешнее произведение серого изображения'
- ошибка Эккарта–Янга для всех $k$ сразу, без восстановления какого-либо изображения
- пиковое отношение сигнал/шум в дБ, со среднеквадратичной ошибкой из отброшенных $\sigma$
labels:
  size: Размер изображения (пиксели)
  k_max: Наибольший показываемый ранг $k$
  frames: Кадры анимации
