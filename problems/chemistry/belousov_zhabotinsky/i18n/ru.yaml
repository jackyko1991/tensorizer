title: Осциллятор Белоусова–Жаботинского (орегонатор)
summary: Перемешиваемый стакан с броматом, малоновой кислотой и цериевым катализатором меняет цвет, как часы. Масштабированный двухпеременный орегонатор — жёсткая система ОДУ; положительный шаг «образование–расход» (схема Патанкара) интегрирует сразу целый пакет стехиометрических факторов $f$, след якобиана находит две бифуркации Хопфа, ограничивающие колебания, а та же кинетика с диффузией превращает разорванную волну во вращающуюся спираль.
notes: 'Реакция Белоусова–Жаботинского (открыта Белоусовым в 1950-х, объяснена Филдом, Кёрёшем и Нойесом в 1972 году) окисляет малоновую кислоту броматом. Бромид-ионы подавляют автокаталитическое образование $\mathrm{HBrO_2}$; пока бромид присутствует, реакция ползёт, а когда он израсходован, $\mathrm{HBrO_2}$ взрывообразно нарастает и окисляет катализатор (смена цвета), после чего окисленный катализатор производит новый бромид, который гасит вспышку. Орегонатор сводит это к нескольким стадиям, а после масштабирования и исключения быстрого бромида — к двум уравнениям. Константы $\varepsilon \approx 0.04$ и $q \approx 8\times10^{-4}$ — приближённые значения из подгонки констант скорости Филда–Кёрёша–Нойеса; рецептуры различаются, как и опубликованные значения. Поскольку $\varepsilon$ и $q$ малы, уравнение для $x$ жёсткое: $x$ скачком меняется примерно в тысячу раз за время порядка $\varepsilon$, а затем медленно ползёт вдоль ветви своей нуль-клины. Обычному RK4 для устойчивости нужны шаги
  около $5\times10^{-4}$; если записать $\varepsilon\dot x$ как образование минус расход и брать расход неявно, $x$ остаётся положительным при любом шаге, а $\Delta t = 2\times10^{-3}$ даёт период с точностью лучше 1 %. Стационарное состояние (пересечение двух нуль-клин) устойчиво, когда оно лежит на внешней ветви N-образной кривой $\dot x = 0$, и неустойчиво на средней ветви, где его окружает предельный цикл; след $J$ меняет знак в двух точках Хопфа, около $f = 0.5$ и $f = 2.4$ при малых $q$. Попробуйте большее $\varepsilon$: окно сужается и в конце концов закрывается. В неперемешиваемом тонком слое катализатор неподвижен, а $\mathrm{HBrO_2}$ диффундирует, поэтому по чашке бежит волна окисления; разорванный фронт волны закручивается на свободном конце в знаменитую вращающуюся спираль, период вращения которой короче объёмных колебаний, так что она захватывает всю среду.'
meanings:
- стехиометрический фактор (бромид, образующийся на один восстановленный катализатор) реакции $b$, от $0.3$ до $3$
- масштабированные $[\mathrm{HBrO_2}]$ (автокатализатор) и $[\mathrm{Ce^{4+}}]$ (окисленный катализатор) каждой реакции
- неотрицательные скорости образования и расхода, $\varepsilon\dot x = P - Lx$
- 'Патанкар–Эйлер: расход неявно, образование явно, поэтому $x$ остаётся положительным при любой жёсткости'
- положительный корень $x^2 + (f + q - 1)x - q(1 + f) = 0$
- линеаризованная кинетика $\partial \dot y_\alpha / \partial y_\beta$ в стационарном состоянии
- 'повторяющийся $\alpha$ ⇒ суммирование: след; смена его знака отмечает бифуркацию Хопфа'
- N-образная кривая $\dot x = 0$ фазового портрета
- 5-точечный шаблон с непроницаемыми границами; в двумерной среде диффундирует только $x$
labels:
  f: Стехиометрический фактор $f$ для фазового портрета и спирали
  eps: Отношение временных масштабов $\varepsilon$ (приближённое)
  t_max: Время моделирования
  spiral: Двумерная спиральная волна
  grid: Размер сетки $n$
