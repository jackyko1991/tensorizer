source_hash: 7be98e686941
title: 静水圧と浮力
summary: 水槽内の圧力は深さとともに線形に増加する：$p = p_0 + \rho_w g h$。密度の異なるブロックを一度に（1つのバッチ化したテンソルとして）投入する。軽いものは上下に揺れながら、体積の $\rho_b/\rho_w$ を水中に沈めて浮かび、重いものは底まで沈む。
notes: 各ブロックは一辺 $s$ の立方体である。浮力 $\rho_w g s^2 d_b$ は押しのけた水の重さ（アルキメデスの原理）であり、圧力 $p_0 + \rho_w g h$ が上面より下面をより強く押すことの正味の結果である。浮かぶブロックは浮力と重力がつり合う位置 $d_b/s = \rho_b/\rho_w$ に落ち着く——氷（$\rho \approx 917$）は 92 % を水中に沈めて浮かぶ。抵抗は浸水体積に比例する単純な線形減衰とする。実際の抵抗は2乗則に近く、実際の波や付加質量は無視している。沈んだブロックは底に静止する。
meanings:
- 水中の格子点、成分 $i \in \{x, z\}$
- 重力ベクトル $(0, -g)$
- 繰り返される $i$ ⇒ 和をとる：深さ $h = -z$ における $g\,h$
- ブロック $b$ の下面の高さと速度
- ブロック $b$ の密度——バッチの添字
- 浸水深さ、0（空気中）から $s$（完全に水中）の間
- 単位質量あたりの浮力 − 重力 − 抵抗
labels:
  n_blocks: ブロック数
  rho_min: 最小密度 $\rho_\text{min}$
  rho_max: 最大密度 $\rho_\text{max}$
  size: ブロックの大きさ $s$
  drag: 減衰 $\gamma$
  t_max: シミュレーション時間
