source_hash: 4d0cdb4cbe20
title: 전류 고리의 자기장 (비오–사바르)
summary: 비오–사바르 법칙은 도선을 짧은 선분들의 합으로 바꿉니다. 외적 $d\mathbf l\times\mathbf r$는 레비치비타 텐서 $\varepsilon_{ijk}$를 두 벡터와 축약한 것이므로, ($i, j, k$, 선분)에 대한 einsum 하나로 모든 격자점에서 코일 전체의 자기장을 얻습니다. 고리 반지름이 커졌다 작아졌다 하는 동안 $x$–$z$ 평면과 축 위의 자기장이 따라 변합니다.
notes: SI 단위($\mu_0 = 4\pi\times 10^{-7}$ T·m/A)이며 자기장은 μT로 표시합니다. 고리들은 수평면에 놓여 있으므로 $x$–$z$ 평면은 각 고리와 두 점에서 만납니다(⊙ 지면에서 나오는 전류, ⊗ 들어가는 전류). 헬름홀츠 코일(간격 $R$, 같은 전류)은 그 사이에 거의 균일한 자기장을 만들고, 반헬름홀츠 코일(반대 전류)은 중심에서 0이고 선형으로 커지는 자기장을 만듭니다. 이는 냉각 원자 포획에 쓰이는 트랩입니다. 도선 가까운 격자점에는 작은 완화 길이(softening length)를 써서 자기장이 유한하게 유지되도록 합니다.
meanings:
- 평면 $y = 0$ 위의 장점(field point) $g$
- 도선 선분 $s$의 중점과 방향 벡터
- 모든 선분에서 모든 장점까지(브로드캐스팅)
- '레비치비타 기호: 텐서로 쓴 외적'
- 반복된 $j, k$ ⇒ 외적; 반복된 $s$ ⇒ 도선 전체에 대한 합
- 고리당 정확한 값 $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$, 합 검증용
