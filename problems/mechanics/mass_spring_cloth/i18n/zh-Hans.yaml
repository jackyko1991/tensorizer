source_hash: 6bb6cb4a204f
title: 质点–弹簧布料
summary: 由结构弹簧、剪切弹簧和弯曲弹簧连接的正方形质点网格，两角固定，在重力下释放。关联矩阵 $D_{ea}$ 把网格变成张量：一次 einsum 给出所有弹簧矢量，另一次把每个节点受的力加起来。
notes: 沿对角线的剪切弹簧防止正方形塌成菱形，跳过一个节点的弹簧赋予布料一定的抗弯刚度。两个固定角的加速度直接设为零。空气阻尼 $\gamma$ 是唯一的耗散，所以总能量只能减少（$dE/dt = -m\gamma\lvert\mathbf v\rvert^2$），$\gamma = 0$ 时守恒。弹簧很硬，因此时间步长受 $\sqrt{m/k}$ 限制。忽略自碰撞。每个节点质量 10 g，网格间距 10 cm。
meanings:
- 节点 $a$ 的位置；共 $N = n^2$ 个质点
- 关联矩阵：弹簧 $e$ 两端分别为 $-1$ / $+1$
- 重复的 $a$ ⇒ 求和：沿每根弹簧的矢量
- 当前弹簧长度；$\ell^0_e$ 为原长
- 重复的 $e$ ⇒ 求和：节点 $a$ 所受的弹簧合力
- 同一求和写成对边列表的 scatter
- 动能 + 弹性势能 + 重力势能
labels:
  n_side: 每边质点数
  k: 劲度系数 $k$
  damping: 空气阻尼 $\gamma$
  t_max: 模拟时长
