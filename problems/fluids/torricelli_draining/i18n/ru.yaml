source_hash: f68c4a9fe179
title: Вытекание из бака (Торричелли)
summary: Вода вытекает из отверстия со скоростью Торричелли $\sqrt{2gh}$, поэтому уровень сначала падает быстро, а под конец медленно. Баки с отверстиями разного размера интегрируются вместе как один пакетный тензор и сравниваются с точным решением $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$.
notes: 'Закон Торричелли следует из уравнения Бернулли между свободной поверхностью (в покое, так как $A \gg a$) и струёй, обе при атмосферном давлении. Реальные отверстия сжимают струю примерно до 60 % площади отверстия (vena contracta), поэтому реальные баки опорожняются медленнее: умножьте $a$ на коэффициент расхода $C_d \approx 0.6$. Удвоение диаметра отверстия уменьшает время вытекания вчетверо; удвоение начальной высоты увеличивает его лишь в $\sqrt2$ раз. Падающая струя сужается по мере ускорения — снова уравнение непрерывности.'
meanings:
- уровень воды в баке $b$ во времени
- площадь отверстия бака $b$ — пакетный индекс
- площадь сечения каждого бака
- скорость истечения по Торричелли
- правая часть, интегрируемая RK4
- 'нет повторяющихся индексов ⇒ внешнее произведение: каждое время с каждым отверстием'
labels:
