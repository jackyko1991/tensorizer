title: 'PET: पॉज़िट्रॉन विलोपन और प्रतिबिंब पुनर्निर्माण'
summary: FDG जैसा ट्रेसर पॉज़िट्रॉन उत्सर्जित करता है; हर पॉज़िट्रॉन एक इलेक्ट्रॉन के साथ विलोपित होकर 511 keV के दो फ़ोटॉन बनाता है जो एक-दूसरे की उल्टी दिशा में उड़ते हैं। सिम्युलेट किए गए क्षयों के एक बैच को डिटेक्टर रिंग तक ट्रैक किया जाता है, हर संयोग (coincidence) को उसकी लाइन ऑफ़ रिस्पॉन्स के अनुसार साइनोग्राम में रखा जाता है, और प्रतिबिंब MLEM से पुनर्निर्मित होता है, $\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$, जहाँ पूरा स्कैनर एक सिस्टम मैट्रिक्स $A$ है और हर पुनरावृत्ति दो मैट्रिक्स–सदिश गुणनफल है।
notes: 'दोनों फ़ोटॉन उल्टी दिशाओं में जाते हैं, इसलिए क्षय उन दो डिटेक्टरों को जोड़ने वाली रेखा पर कहीं हुआ है जो एक साथ प्रतिक्रिया देते हैं: यही लाइन ऑफ़ रिस्पॉन्स (LOR) है। लाखों LOR इकट्ठा करने पर साइनोग्राम मिलता है (शरीर का हर बिंदु $(\theta, s)$ में एक साइन वक्र बनाता है)। MLEM गणनाओं को माध्य $\bar y = A\lambda + r$ वाले पॉइसॉन वितरण की तरह मानता है और लॉग-संभाविता $\sum_b y_b \log \bar y_b - \bar y_b$ पर चढ़ता है: हर पुनरावृत्ति मौजूदा प्रतिबिंब का अग्र-प्रक्षेपण करती है, डेटा से तुलना करती है, और अनुपात का पश्च-प्रक्षेपण करती है। प्रतिबिंब कभी ऋणात्मक नहीं होता, कुल गणना संरक्षित रहती है (पृष्ठभूमि न हो तो $\sum_b (A\lambda)_b = \sum_b y_b$), और संभाविता कभी घटती नहीं। शुरुआती पुनरावृत्तियाँ चिकनी होती हैं; बाद वाली अधिक तीखी पर पॉइसॉन शोर बढ़ाती हैं, इसलिए त्रुटि पहले घटती है और फिर बढ़ती है (डिफ़ॉल्ट मानों पर न्यूनतम लगभग 50 पुनरावृत्तियों पर है; वृद्धि देखने के लिए 150 पुनरावृत्तियाँ या कम क्षय आज़माइए): नैदानिक स्कैनर जल्दी रुक जाते हैं (या OSEM उपसमुच्चय और पोस्ट-फ़िल्टर इस्तेमाल
  करते हैं)। FBP हर प्रक्षेपण को रैंप फ़िल्टर से छानकर एक ही चरण में पश्च-प्रक्षेपण करता है; यह तेज़ है पर अधिक शोरयुक्त है और ऋणात्मक भी हो सकता है। शरीर से गुज़रते फ़ोटॉन $e^{-\int \mu\, dl}$ से क्षीण होते हैं, 511 keV पर पानी के लिए $\mu \approx 0.096$ cm$^{-1}$; यह गुणक केवल LOR पर निर्भर करता है, इस पर नहीं कि क्षय रेखा पर कहाँ हुआ, इसलिए इसे $A$ में शामिल कर दिया जाता है। सरलीकरण: केवल 2D, गाउसीय पॉज़िट्रॉन परास (F-18 का औसत परास लगभग 0.6 mm, Ga-68 का लगभग 3 mm, इसलिए जब तक बढ़ाया न जाए यह 6 mm पिक्सेलों में छिपा रहता है), फ़ोटॉन की असमरेखता नहीं, आदर्श क्रिस्टल (हर LOR का सिरा प्रतिक्रिया देने वाले क्रिस्टल के किसी यादृच्छिक बिंदु पर रखा जाता है) जिनमें अन्योन्यक्रिया की गहराई या डेड टाइम नहीं, और रैंडम व प्रकीर्णन की ज्ञात चिकनी पृष्ठभूमि। सभी मान अनुमानित हैं और केवल शिक्षा के लिए हैं, नैदानिक उपयोग के लिए नहीं।'
meanings:
- सक्रियता मानचित्र से चुने गए क्षय स्थान (हॉट घाव अधिक बार क्षय होते हैं)
- 'विलोपन बिंदु: पॉज़िट्रॉन पहले लगभग एक मिलीमीटर चलता है'
- उल्टी दिशाओं में दो फ़ोटॉन $p = 1, 2$, हर एक $511$ keV
- 'हर फ़ोटॉन रिंग पर कहाँ पहुँचता है: $t > 0$ के लिए $|a + t u| = R$ हल करें'
- 'साइनोग्राम: हर लाइन ऑफ़ रिस्पॉन्स $(\theta, s)$ पर पकड़े गए संयोग'
- पिक्सेल $j$ में हुए क्षय के बिन $b$ में गिने जाने की प्रायिकता (क्षीणन सहित)
- 'दोहराया $j$ ⇒ योग: अग्र-प्रक्षेपण और रैंडम/प्रकीर्णन'
- 'दोहराया $b$ ⇒ योग: हर LOR के साथ पश्च-प्रक्षेपण'
- 'गुणात्मक अद्यतन: धनात्मक रहता है और कुल गणना संरक्षित रखता है'
