source_hash: 242e43034f00
title: 拉马努金的 $\tau(n)$ 与 Sato–Tate 定律
summary: 把判别式模形式 $\Delta(q) = q\prod_n (1-q^n)^{24}$ 展开成张量幂级数，得到拉马努金的 $\tau(n)$；通过对一批素数取余数，可精确算到 $n \sim 10^5$–$10^6$。检验 $\tau$ 是积性函数并满足 Hecke 递推式、$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$、$|\tau(p)| \le 2p^{11/2}$（Deligne 定理，1974），并观察归一化的值 $\tau(p)/2p^{11/2}$ 逐渐填满 Sato–Tate 半圆分布（对 $\Delta$ 而言自 2011 年起已是定理）。程序对这些定理做数值验证。
notes: 拉马努金（1916）研究了 $\Delta(q) = q\prod(1-q^n)^{24}$ 的系数 $\tau(n)$（它是唯一的权为 12 的归一化尖点形式），并猜想了三件事：$\tau$ 是积性的；它满足 $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$；以及 $|\tau(p)| \le 2p^{11/2}$。Mordell 在 1917 年证明了前两项，这是后来发展为 Hecke 理论的早期例子。这个上界就是 $\Delta$ 的拉马努金猜想（一般情形称为 Ramanujan–Petersson 猜想）：Deligne 于 1974 年作为他证明韦伊猜想的推论证明了它，因此它是定理。拉马努金还证明了同余式 $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$，它源于 $691$ 整除伯努利数 $B_{12}$ 的分子。记 $\tau(p) = 2p^{11/2}\cos\theta_p$，Sato–Tate 猜想断言角度 $\theta_p$ 服从 $\frac{2}{\pi}\sin^2\theta\,d\theta$ 分布，也就是 $x_p = \cos\theta_p$ 服从半圆分布 $\frac{2}{\pi}\sqrt{1-x^2}$，其各阶矩为 $1/4$、$1/8$、$5/64$（卡塔兰数除以 4 的幂）。对 $\Delta$ 而言，这由 Barnet-Lamb、Geraghty、Harris 与 Taylor（2011）证明。直方图收敛得很慢，就像独立抽样的样本一样。Lehmer 猜想（$\tau(n)$ 永不为零）至今仍未解决；它已在远超此范围的地方被验证，程序也没有找到任何零值。数值方面：$\tau(n)$ 的增长约为 $n^{11/2}$，因此对整个级数做 float64 FFT 的绝对误差约为最大系数的 $10^{-16}$ 倍，足以淹没 $\tau(2) = -24$（有测试展示这一点）。因此程序改为同时对十个左右的素数精确计算级数的余数，每个素数占张量的一行，再用中国剩余定理重建。趣味：拉马努金注意到……（Ramanujan noticed that…）$\tau(n) \equiv \sigma_{11}(n) \pmod{691}$；$1729
  = 1^3 + 12^3 = 9^3 + 10^3$；以及（仅在正则化的意义下）$1 + 2 + 3 + \dots$“$= -1/12$”：这个级数是发散的，$-1/12$ 是解析延拓后的 zeta 函数的值 $\zeta(-1)$。
meanings:
- 雅可比恒等式 $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$：只有 $O(\sqrt N)$ 个非零系数
- 重复的 $j$ ⇒ 求和：把截断级数的乘积写成 Toeplitz 矩阵乘以向量，对较小的 $N$ 在 int64 中精确
- 连续平方三次得到 24 次方
- 对 $M$ 个素数模数同时用 FFT 计算同样的乘积，再四舍五入为精确余数（每个 $m^2 N \le 2^{42}$）
- 使用平衡数位的中国剩余定理，使负值还原后仍为负值
- 同时处理所有满足 $mn \le 600$ 的互素数对 $1 < m < n$
- 每个满足 $dj \le N$ 的因数对 $(d, j)$ 把 $d^{11}$ 加到 $n = dj$ 上
- 素数处的归一化值，由 Deligne 定理可知落在 $[-1, 1]$ 内
labels:
  n_max: 素数与 $\tau(n)$ 的计算上限 $N$
