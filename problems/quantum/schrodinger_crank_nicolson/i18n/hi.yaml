source_hash: d9c269ec5e13
title: 'श्रोडिंगर समीकरण: Crank–Nicolson समय-चरण'
summary: समय-आश्रित श्रोडिंगर समीकरण $i\,\partial_t\psi = H\psi$ को ग्रिड पर अंतर्निहित (implicit) Crank–Nicolson योजना $(I + \tfrac{i\Delta t}{2}H)\,\psi^{n+1} = (I - \tfrac{i\Delta t}{2}H)\,\psi^n$ से आगे बढ़ाया जाता है। बाईं ओर के मैट्रिक्स का LU गुणनखंड केवल एक बार होता है, और फिर हर चरण एक सस्ता torch.linalg.lu_solve है जो तीन तरंग पैकेटों ($\psi_{xb}$ के स्तंभों) को एक साथ हल करता है। यह चरण ठीक-ठीक ऐकिक (unitary) है, इसलिए मानक 1 बना रहता है, जबकि उसी $\Delta t$ के साथ स्पष्ट Euler विधि विस्फोटित हो जाती है।
notes: 'इकाइयाँ $\hbar = m = 1$। यह क्यों काम करता है: $U = (I + \tfrac{i\Delta t}{2}H)^{-1}(I - \tfrac{i\Delta t}{2}H)$ हर्मिटी मैट्रिक्स $H$ का Cayley रूपांतरण है। ऊर्जा $E$ वाले आइगेनसदिश पर यह $(1 - iE\Delta t/2)/(1 + iE\Delta t/2)$ से गुणा करता है, जिसका मापांक ठीक 1 है, इसलिए किसी भी $\Delta t$ के लिए $U$ ऐकिक है: न वृद्धि, न क्षय; और चूँकि $U$, $H$ का फलन है, $\langle H\rangle$ भी संरक्षित रहता है। इसकी कला $2\arctan(E\Delta t/2)$ सटीक $E\Delta t$ से प्रति चरण केवल $\mathcal O(E^3\Delta t^3)$ तक भिन्न है, इसलिए योजना द्वितीय-कोटि की सटीक है, और अंतर्निहित होने के कारण किसी भी $\Delta t$ के लिए स्थिर है (बड़े चरण केवल कम सटीक होते हैं, कभी अस्थिर नहीं)। इसके विपरीत स्पष्ट Euler विधि $1 - iE\Delta t$ से गुणा करती है, जिसका मापांक $\sqrt{1 + E^2\Delta t^2} > 1$ है; $E \sim 2/dx^2$ वाले कठोर ग्रिड मोड कुछ दर्जन चरणों में विस्फोटित हो जाते हैं (लाल वक्र)। तीनों पैकेटों के आयाम अलग हैं; अधिक कठोर $g\,x^4$ स्प्रिंग बड़े पैकेट को तेज़ झुलाती है, और चूँकि उसके ऊर्जा स्तर अब समान दूरी पर नहीं
  हैं, वह विकलित (dephase) होता है — फैलता है और अपना आकार खो देता है — जबकि छोटा पैकेट अनावर्तिता को मुश्किल से महसूस करता है। $g = 0$ आज़माएँ: तीनों आवर्तकाल $2\pi$ के साथ साथ-साथ झूलते हैं और कभी नहीं फैलते (संबद्ध अवस्थाएँ)। क्वांटम सुरंगन के split-step FFT से तुलना करें, जो दूसरी ऐकिक द्वितीय-कोटि योजना है।'
meanings:
- 'अनावर्ती कूप $\tfrac12x^2 + g\,x^4$: दोलन का आवर्तकाल आयाम पर निर्भर करता है'
- गतिज भाग $-\tfrac12\,D2$ और विकर्ण पर $V$; बॉक्स के किनारों पर दीवारें
- प्रत्येक स्तंभ $b$ में एक गाउसीय पैकेट, $x_{0,b}$ से विराम अवस्था में छोड़ा गया
- $I \pm \tfrac{i\Delta t}{2}H$, लूप से पहले एक बार बनाए गए
- एक बार गुणनखंड करें ($\mathcal O(N^3)$); फिर हर चरण की लागत केवल $\mathcal O(N^2)$
- 'दोहराया गया $y$ ⇒ योग: दायाँ पक्ष, फिर सभी स्तंभों के लिए दो त्रिकोणीय हल'
- 'तुलना के लिए स्पष्ट Euler: हर आइगेन-घटक प्रति चरण $\sqrt{1 + E^2\Delta t^2}$ गुना बढ़ता है'
- 'दोहराए गए $x, y$ ⇒ योग: हर पैकेट की ऊर्जा, ठीक-ठीक संरक्षित'
labels:
  g: चतुर्घाती प्रबलता $g$
  x0: सबसे बड़ी आरंभिक स्थिति $x_0$
  t_max: सिम्युलेटेड समय
  dt: समय-चरण $\Delta t$
  n_grid: ग्रिड बिंदु
