title: 'UMAP как тензорная задача: kNN-граф, нечёткие множества и силовая раскладка на MNIST'
summary: 'UMAP — метод понижения размерности, который рисует 784-пиксельные цифры MNIST в виде двумерной карты, — записан целиком через тензорные операции: точный kNN-граф из одной матрицы расстояний и topk, бисекция, находящая ширину ядра $\sigma_i$ сразу для всех точек, нечёткое объединение $P + P^\top - P\circ P^\top$, спектральная инициализация по лапласиану графа, а также силы притяжения и отталкивания, применяемые ко всему списку рёбер за эпоху (вручную и ещё раз через autograd). На 2500 цифрах и «швейцарском рулете» он не уступает библиотеке umap-learn по trustworthiness, полноте соседей и точности распознавания цифр и намного опережает PCA.'
notes: 'Вопрос. «UMAP как просто тензорная задача» — запрос Jacky Ka Long Ko: взять UMAP (Uniform Manifold Approximation and Projection; McInnes, Healy и Melville 2018), который обычно запускают через библиотеку umap-learn с её циклами на numba, записать каждый шаг как пакетные тензорные операции и проверить, что результат не хуже. Метод в тензорах (N точек в D измерениях). 1. kNN-граф: (N, N) квадратов расстояний $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$ (einsum), вычисляемых блоками строк, затем topk даёт (N, k) расстояний и индексов; точно, как и umap-learn при числе точек меньше 4096 (выше он переходит на приближённый спуск по ближайшим соседям). 2. Нечёткое симплициальное множество: $\rho_i$ — расстояние до ближайшей другой точки; $\sigma_i$ решает $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ бисекцией, все N интервалов делятся пополам одновременно (64 раза, сначала фаза удвоения, пока верхняя граница неизвестна); степени принадлежности разносятся в плотную (N,
  N) матрицу $P$ и симметризуются нечётким объединением $W = P + P^\top - P\circ P^\top$ (при нескольких тысячах точек плотная матрица допустима; в масштабе та же формула работает с разреженным COO-тензором). 3. Сходство в низкой размерности $q = 1/(1 + a d^{2b})$, где $a$ и $b$ подгоняются к min_dist двухпараметрическим методом наименьших квадратов Гаусса–Ньютона; инициализация: два наименьших нетривиальных собственных вектора нормированного лапласиана $I - D^{-1/2} W D^{-1/2}$ из плотного torch.linalg.eigh (около 4 с для 2500 точек на одном ядре; umap-learn использует разреженный решатель; если eigh не сходится, код переходит к случайной инициализации). 4. Раскладка: 500 эпох; ребро веса $w_{ij}$ активно раз в $\max w / w_{ij}$ эпох (расписание umap-learn, хранимое как (E,)-тензор эпох следующей выборки); каждое активное ребро притягивает свои концы и выбирает 5 случайных отрицательных примеров, отталкивающих его начало; все силы эпохи вычисляются разом и суммируются по точкам через index_add_
  (синхронное обновление, тогда как umap-learn двигает точки ребро за ребром). Тот же цикл с autograd: градиент выборочной перекрёстной энтропии, обрезанный после суммирования. 5. Метрики, все — тензорные операции при $k$ = 10: trustworthiness и continuity (Venna и Kaski 2001) по матрицам рангов (argsort от argsort), полнота kNN и точность классификации цифр 10-NN с исключением по одному в двумерной раскладке; PCA через SVD как линейный базовый уровень. Данные. MNIST (LeCun, Cortes и Burges), лицензия CC BY-SA 3.0: data/mnist_subset.npz содержит первые 250 обучающих изображений каждой цифры (2500 изображений, uint8; лицензия share-alike распространяется на это подмножество), см. data/SOURCES.md. «Швейцарский рулет» (1500 точек, как в make_swiss_roll из scikit-learn, с небольшим шумом) генерируется в коде, поэтому его истинные плоские координаты (длина дуги, высота) известны. Эталон umap-learn (umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42) был один раз вычислен офлайн во временном
  окружении скриптом data/make_reference.py; в комплект входят только его двумерные координаты и метрики. Результаты (прилагаемый запуск, CPU, один поток). MNIST, 2500 цифр: trustworthiness / continuity / полнота 10-NN / точность 10-NN по цифрам = 0.957 / 0.963 / 0.39 / 0.887 с силами, написанными вручную, 0.960 / 0.963 / 0.40 / 0.898 с autograd, 0.963 / 0.963 / 0.40 / 0.896 у umap-learn и 0.740 / 0.913 / 0.07 / 0.414 у PCA. «Швейцарский рулет»: trustworthiness 0.999 (umap-learn 0.999, PCA 0.943), а относительно истинных плоских координат 0.999 при сохранении 76 % истинных 10 ближайших соседей (umap-learn 77 %, PCA 28 %). Наша trustworthiness также совпадает со значением scikit-learn с точностью до $2\times 10^{-4}$ на прилагаемых раскладках umap-learn (проверено тестом), а $a$, $b$ совпадают со значениями umap-learn. Время выполнения на MNIST: 11 с с силами (0.5 с граф, 4 с eigh, 7 с раскладка), 15 с с autograd, 14 с у umap-learn (второй вызов, один поток; первый вызов с компиляцией numba
  занял 28 с). После наилучшего поворота, отражения и масштабирования (Procrustes) наша раскладка MNIST отличается от раскладки umap-learn на disparity 0.05 (0 = та же форма, 1 = никакой связи); одни и те же кластеры цифр находятся на одних и тех же местах. Вывод и ограничения. UMAP — тензорная задача: построение графа, поиск ширины ядра, нечёткое объединение, спектральная инициализация и силовая раскладка — всё это пакетные тензорные операции, и результат не уступает эталону ни по одной из приведённых метрик. Отличия: раскладки сравниваются по метрикам, а не по координатам, поскольку раскладки UMAP определены лишь с точностью до поворота, отражения и случайности отрицательной выборки (другое зерно переставляет кластеры); выше 4096 точек kNN в umap-learn становится приближённым, а наш остаётся точным (и стоит $O(N^2)$); плотные $N\times N$ матрицы и eigh ограничивают эту версию примерно $10^4$ точками (блоки, разреженные тензоры и итерационный решатель собственных значений сняли бы это ограничение);
  из-за синхронного обновления ранние эпохи похожи на горячий газ (скорость обучения близка к 1, и каждая точка получает все свои толчки разом), пока раскладка не остынет. «Швейцарский рулет» сохраняет все локальные окрестности, но не разворачивается в один чистый лист: он рвётся на полосы, как и в umap-learn, — известная особенность UMAP и t-SNE. Точность по цифрам — мера того, насколько хорошо карта разделяет классы, которых она никогда не видела, а не классификатор. Результаты меняются на несколько тысячных в зависимости от сборки BLAS и числа потоков. Связанные работы. t-SNE (van der Maaten и Hinton 2008) задал схему сопоставления вероятностей соседства с помощью ядра с тяжёлыми хвостами в 2D; UMAP заменяет его нормированные вероятности нечёткими степенями принадлежности, а полное отталкивание — отрицательной выборкой (как в word2vec), благодаря чему и масштабируется. Лапласовы собственные отображения (Belkin и Niyogi 2003) дают спектральную инициализацию. Попробуйте. Меньше соседей
  (5) — больше мелких кластеров; min_dist около 0.9 размещает точки свободнее; меньше эпох показывает незавершённую раскладку; другое зерно поворачивает и перетасовывает карту, а метрики остаются прежними.'
meanings:
- расстояния до $k$ ближайших точек (сама точка первой), из $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$ (повторяющийся $d$ ⇒ суммирование) и topk; точно, блоки строк удерживают память на уровне $O(BN)$
- $\rho_i$ = расстояние до ближайшей другой точки; $\sigma_i$ — 64 делениями пополам одного тензора интервалов сразу для всех точек, так что $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$
- 'направленная принадлежность: 1 для ближайшего соседа, убывает с расстоянием дальше него, 0 вне списка kNN'
- 'нечёткое объединение (вероятностное ИЛИ) двух направлений: симметрично, в $[0, 1]$; его ненулевые элементы — список рёбер $(i_e, j_e)$, $E$ ≈ 50 000 для 2500 цифр'
- 'подгонка Гаусса–Ньютона $1/(1 + a x^{2b})$ к 1 ниже min_dist и к $e^{-(x - \mathrm{min\_dist})}$ выше: $a$ = 1.577, $b$ = 0.895 при min_dist = 0.1'
- 'спектральная инициализация: два наименьших нетривиальных собственных вектора нормированного лапласиана графа, масштабированные в $[0, 10]$'
- силы всех выбранных рёбер $(i, j)$ и 5 случайных отрицательных примеров $s$ на ребро, суммированные по точкам одним scatter-add; каждое слагаемое обрезано до $\pm 4$; скорость обучения $\alpha = 1 - \mathrm{epoch}/n$
- 'тот же шаг через autograd по выборочной функции потерь $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$: совпадает с силами, написанными вручную (проверено тестом)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, ранги $r$ — из argsort от argsort; continuity меняет местами $x$ и $y$
labels:
  n_neighbors: Число соседей $k$ (включая саму точку)
  min_dist: Минимальное расстояние в раскладке
  n_epochs: Эпохи раскладки
  neg_rate: Отрицательных примеров на выборку ребра
  n_mnist: Изображения MNIST (поровну по цифрам)
  seed: Случайное зерно
