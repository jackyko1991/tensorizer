<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Thin converging lens: an upright object arrow outside the focal length F forms a real, inverted image arrow on the far side; three principal rays meet at the image tip">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <line x1="12" y1="84" x2="228" y2="84" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M120,26 A243.8,243.8 0 0 1 120,142 A243.8,243.8 0 0 1 120,26 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5" fill-opacity="0.8"/>
    <path d="M38,54 L120,54 L226,133.5" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M38,54 L226,122.8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M38,54 L120,112.6 L226,112.6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="38" y1="84" x2="38" y2="54" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <line x1="198.1" y1="84" x2="198.1" y2="112.6" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <circle cx="80" cy="84" r="3" fill="#374151"/>
    <circle cx="160" cy="84" r="3" fill="#374151"/>
    <text x="64" y="100">F</text>
    <text x="164" y="77">F′</text>
  </g>
</svg>
