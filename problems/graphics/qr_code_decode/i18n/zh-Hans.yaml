source_hash: 56bd5dd35d76
title: 从照片中读取二维码
summary: 从零构建一个版本 1–3 的二维码（定位图案、定时图案和校正图案，BCH 格式位，按罚分选择的掩模，GF(256) 上的里德–所罗门码），用随机单应、模糊、噪声、不均匀光照和一根挡住它的拇指来“拍照”，再用张量流水线把它读回来：自适应阈值，针对 1:1:3:1:1 定位图案的匹配滤波，DLT 单应与 grid_sample，以及 BCH 和里德–所罗门解码，其中 $\mathrm{GF}(2^8)$ 运算实现为查表 gather。
notes: ZXing 等实际的读码器遵循同样的思路：用局部阈值二值化，逐行扫描定位图案的 1:1:3:1:1 游程模式并在列和对角线方向确认，挑出构成直角的三个定位图案，根据它们的间距估计模块尺寸和版本，在仿射猜测给出的位置附近寻找校正图案，拟合透视变换，采样网格，然后解码格式层和里德–所罗门层。这里还通过 grid_sample 最大化已知模块（定位图案、定时图案、校正图案、静区）与图像的相关性来精修单应，版本则取模板拟合最好的那个。L、M、Q、H 四个纠错等级大约能恢复 7、15、25 和 30 % 的码字：有 $T$ 个纠错字节的块能纠正 $\lfloor T/2 \rfloor$ 个未知的字节错误（如果错误位置已知，即作为擦除，则能纠正两倍）。覆盖符号面积比例为 $f$ 的遮挡块会命中超过 $f$ 的码字，因为每个字节是一个 $2\times4$ 的模块块，所以成功率曲线会低于这些百分比。掩模只作用于数据模块，且 $M \oplus M = 0$，所以去掩模就是同样的异或；编码器把全部 8 种掩模作为一个批次尝试，保留罚分最低的那个（游程、$2\times2$ 块、类似定位图案的结构、深色比例）。验证：里德–所罗门编码器复现了 ISO/IEC 18004 中示例（'01234567'，版本 1-M）的纠错字节，格式字也与标准中的表一致；其余部分通过往返测试和零伴随式检验。简化：仅支持字节模式，版本 1–3（一个校正图案，没有版本信息块），不支持镜像符号，不做擦除解码。版本 1 没有校正图案，所以强透视对它的影响最大。参考文献：ISO/IEC 18004（QR 码符号规范）；I. S. Reed and G. Solomon, Polynomial codes over certain finite fields, J. SIAM 8 (1960) 300–304。
meanings:
- GF(256) 乘积实现为两次查表 gather；$\alpha = 2$ 以 $x^8+x^4+x^3+x^2+1$（0x11D）为模生成全部 255 个非零字节；$\oplus$ 为异或
- 对求和指标 $i$ 做异或：把 8 个位平面逐一按模 2 相加
- 系统里德–所罗门码：$G$ 的第 $i$ 行为 $x^{T+k-1-i} \bmod g(x)$，因此纠错字节关于数据是线性的
- 在 $\alpha^j$ 处求值的块多项式；当且仅当是码字时全为零
- 用 Berlekamp–Massey 求错误定位多项式（用 torch.where 批量化），用 Chien 搜索在所有位置上求根，错误值 $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$（Forney）
- BCH(15,5)，生成多项式 0x537，异或 0x5412；取 32 个码字中最近的一个，最多纠正 3 位错误
- 像素低于其 $31\times31$ 方框均值（conv2d）减去 $c$ 时为深色：能跟随不均匀光照
- 沿行和列在 11 个尺度 $s$ 上针对 1:1:3:1:1 轮廓的匹配滤波器 $K^s$；峰值即定位图案中心（还会沿对角线检查）
- 由 3 个定位图案中心 + 校正图案（版本 1：平行四边形的角点）做 DLT/SVD，然后通过对所有已知模块拟合度的梯度上升进行精修
- 模块 $(i, j)$ 在其内部 $3\times3$ 个点处读取；然后去掩模（异或，一种对合）并按之字形顺序读取
labels:
  message: 消息
  version: 最小版本（消息放不下时会自动提高）
  ecc: 纠错等级
  perspective: 透视强度（角点位移 / 边长）
  occlusion: 符号被遮挡的比例
  noise: 像素噪声 $\sigma$
