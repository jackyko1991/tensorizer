<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Point cloud registration: two scanners see different sides of an object; scan B, moved by an unknown rigid motion R, t, is aligned onto scan A">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- object outline -->
    <ellipse cx="78" cy="88" rx="38" ry="26" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- scanner A (left) and its visible side: points -->
    <rect x="8" y="30" width="16" height="11" rx="2" fill="#374151"/>
    <line x1="24" y1="38" x2="46" y2="66" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="8" y="24" font-style="italic">A</text>
    <g fill="#2563eb">
      <circle cx="41" cy="92" r="2.4"/><circle cx="43" cy="80" r="2.4"/><circle cx="49" cy="71" r="2.4"/>
      <circle cx="58" cy="65" r="2.4"/><circle cx="69" cy="62" r="2.4"/><circle cx="80" cy="62" r="2.4"/>
      <circle cx="46" cy="102" r="2.4"/>
    </g>
    <!-- scanner B view of the other side, drawn moved away by (R, t) -->
    <rect x="214" y="30" width="16" height="11" rx="2" fill="#374151"/>
    <text x="216" y="24" font-style="italic">B</text>
    <g fill="#dc2626" transform="translate(150 40) rotate(-25)">
      <circle cx="0" cy="62" r="2.4"/><circle cx="11" cy="62" r="2.4"/><circle cx="22" cy="65" r="2.4"/>
      <circle cx="31" cy="71" r="2.4"/><circle cx="37" cy="80" r="2.4"/><circle cx="39" cy="92" r="2.4"/>
      <circle cx="34" cy="102" r="2.4"/>
    </g>
    <!-- overlap highlight and the unknown motion -->
    <circle cx="80" cy="62" r="7" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M150,130 Q120,150 92,122" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="104" y="156" font-style="italic" fill="#b91c1c">R, t</text>
    <!-- a normal -->
    <line x1="49" y1="71" x2="36" y2="58" stroke="#1e40af" stroke-width="1.5"/>
    <text x="22" y="62" font-style="italic" fill="#1e40af">n</text>
  </g>
</svg>
