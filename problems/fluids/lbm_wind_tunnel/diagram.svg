<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Digital wind tunnel: uniform flow U enters a lattice box from the left and passes a model airplane pitched up by the angle of attack alpha; a fringe zone at the right end restores the free stream; the airplane feels drag F_D along the flow and lift F_L upwards">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- lattice box -->
    <rect x="10" y="20" width="220" height="116" fill="none" stroke="#374151" stroke-width="2"/>
    <g fill="#9ca3af">
      <circle cx="24" cy="34" r="1.3"/><circle cx="38" cy="34" r="1.3"/><circle cx="24" cy="48" r="1.3"/><circle cx="38" cy="48" r="1.3"/>
      <circle cx="24" cy="108" r="1.3"/><circle cx="38" cy="108" r="1.3"/><circle cx="24" cy="122" r="1.3"/><circle cx="38" cy="122" r="1.3"/>
    </g>
    <!-- fringe zone -->
    <rect x="198" y="21" width="31" height="114" fill="#93c5fd" fill-opacity="0.35" stroke="none"/>
    <!-- inflow -->
    <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#flow)">
      <line x1="14" y1="64" x2="38" y2="64"/>
      <line x1="14" y1="96" x2="38" y2="96"/>
    </g>
    <text x="16" y="86" font-style="italic" fill="#1e40af">U</text>
    <!-- streamline -->
    <path d="M40,58 C80,52 120,48 160,54 C178,57 190,62 198,66" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- airplane, side view, pitched nose-up -->
    <g transform="rotate(8 120 84)">
      <path d="M62,84 Q66,76 80,76 L162,79 L178,72 L184,72 L180,84 L168,88 L80,92 Q66,92 62,84 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
      <path d="M102,85 L136,85 L130,90 L104,90 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
      <path d="M160,82 L180,82 L178,85 L162,85 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
      <line x1="56" y1="84" x2="196" y2="84" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    </g>
    <line x1="50" y1="84" x2="120" y2="84" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M70,84 A50,50 0 0 1 70.5,77" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="52" y="78" font-style="italic" fill="#b45309">α</text>
    <!-- forces -->
    <line x1="130" y1="98" x2="160" y2="98" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="134" y="116" font-style="italic" fill="#b91c1c">F<tspan font-size="10" dy="3" font-style="normal">D</tspan></text>
    <line x1="118" y1="72" x2="118" y2="40" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="124" y="46" font-style="italic" fill="#b91c1c">F<tspan font-size="10" dy="3" font-style="normal">L</tspan></text>
  </g>
</svg>
