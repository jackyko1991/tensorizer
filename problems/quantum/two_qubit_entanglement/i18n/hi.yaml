source_hash: e0abd4c769f3
title: दो-क्यूबिट उलझाव (entanglement)
summary: 'दो क्यूबिट $(2, 2)$ टेंसर $\psi_{ab}$ के रूप में संग्रहीत। गेट रैंक-4 टेंसर हैं जो एक einsum से लगाए जाते हैं: क्यूबिट 1 पर हैडामार्ड और उसके बाद CNOT, $\lvert 00\rangle$ को बेल अवस्था में बदल देते हैं। $\psi_{ab}$ का विचित्र मान वियोजन (SVD) ही श्मिट वियोजन है, जो सीधे उलझाव एन्ट्रॉपी देता है। फिर युग्म आइसिंग हैमिल्टनियन के अंतर्गत विकसित होता है; आंशिक ट्रेस हर क्यूबिट का अपचयित घनत्व आव्यूह देते हैं, जिसका ब्लॉख सदिश क्यूबिटों के उलझे होने पर गोले के भीतर सिकुड़ जाता है।'
notes: 'मात्रक $\hbar = 1$। एकल-क्यूबिट संकारकों का टेंसर गुणनफल $A\otimes B$ रैंक-4 टेंसर $A_{ac}B_{bd}$ है (torch.kron यही संख्याएँ पंक्ति सूचकांक $2a + b$ वाले $4\times 4$ आव्यूह के रूप में देता है)। चूँकि $\psi_{ab}$ एक आव्यूह है, उसका SVD अवस्था को $\sum_k s_k\lvert u_k\rangle\lvert v_k\rangle$ के रूप में लिखता है: श्मिट वियोजन। उलझाव एन्ट्रॉपी $S = -\sum s_k^2\ln s_k^2$ गुणनफल अवस्था के लिए 0 और बेल अवस्था के लिए $\ln 2$ है, जिसकी अपचयित अवस्थाएँ अधिकतम मिश्रित हैं ($\rho = I/2$, ब्लॉख सदिश केंद्र पर)। संगामिता (concurrence) $C = 2\lvert\det\psi\rvert$, 0 (गुणनफल) से 1 (अधिकतम उलझा) तक जाती है। आइसिंग हैमिल्टनियन के अंतर्गत युग्मन $J$ उलझाव बनाता और नष्ट करता है जबकि अनुप्रस्थ क्षेत्र $h$ अलग-अलग क्यूबिटों को घुमाता है; $h = 0$ के साथ बेल अवस्था एक आइगेन-अवस्था है और कुछ नहीं बदलता।'
meanings:
- क्यूबिट 1 के $\lvert a\rangle$ में और क्यूबिट 2 के $\lvert b\rangle$ में होने का आयाम
- 'रैंक-4 टेंसर के रूप में दो-क्यूबिट गेट: निर्गत सूचकांक $a\,b$, निवेश सूचकांक $c\,d$'
- '$c$ और $d$ पर योग: गेट लगाना'
- श्मिट गुणांक; केवल एक शून्येतर मान ⇔ गुणनफल अवस्था
- क्यूबिट 2 पर आंशिक ट्रेस ($b$ पर योग)
- टेंसर गुणनफलों से बना आइसिंग हैमिल्टनियन, eigh के लिए (4, 4) में पुनर्व्यवस्थित
- एक क्यूबिट का ब्लॉख सदिश $\operatorname{Tr}(\rho\,\sigma_k)$; $\lvert\mathbf r\rvert < 1$ का अर्थ मिश्रित
labels:
  initial: प्रारंभिक अवस्था (परिपथ से बेल या $\lvert 00\rangle$)
  J: आइसिंग युग्मन $J$
  h: अनुप्रस्थ क्षेत्र $h$
  t_max: अनुकरण समय
