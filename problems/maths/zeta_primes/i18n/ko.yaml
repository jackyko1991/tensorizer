source_hash: ba1aea4b5f9d
title: 리만 제타 함수와 소수
summary: 임계선 $\operatorname{Re} s = \frac12$ 위에서 수천 개의 높이에 대해 $\zeta(s)$를 한꺼번에 계산하고, 실함수 $Z(t)$의 부호 변화로 첫 비자명 영점들을 찾으며, 불리언 텐서 체로 소수를 센다. 그런 다음 리만의 명시 공식이 영점들로부터 계단 함수 $\pi(x)$를 재구성한다. 영점 하나마다 파동 하나가 더해지며, 영점이 많을수록 매끄러운 곡선이 소수에서의 계단으로 날카로워진다.
notes: '급수 $\sum n^{-s}$는 $\operatorname{Re} s > 1$에서만 수렴한다. 오일러–매클로린 공식은 꼬리를 적분과 베르누이 보정으로 바꾸어, $\zeta$를 극점 $s = 1$을 제외한 평면 전체로 해석적으로 연장한다. 임계선 위에서 $Z(t) = e^{i\theta(t)}\zeta(\frac12 + it)$는 실수이므로, $Z$의 부호 변화는 그 사이에 영점이 있음을 증명한다. 계산한 영점은 발표된 값 $14.134725\ldots$, $21.022040\ldots$, $25.010858\ldots$와 약 $10^{-9}$까지 일치하고, 높이 $T$ 아래에서 찾은 개수는 리만–폰 망골트 공식 $N(T) \approx \theta(T)/\pi + 1$과 일치하는데, 이는 빠뜨린 영점이 없다는 검증이다. 비교를 위해 더 빠른 리만–지겔 공식(주합과 첫 번째 보정)도 보여 준다. 그 오차는 첫 영점들에서 이미 $10^{-3}$에서 $10^{-2}$에 불과하고 $t$가 커질수록 줄어든다. 소수 정리는 $\pi(x) \sim x/\ln x$라고 말하지만 $\operatorname{li}(x)$가 훨씬 가깝고, 리만의 $R(x) = \sum_n \frac{\mu(n)}{n}\operatorname{li}(x^{1/n})$는 더욱 가깝다(가운데 패널; 그람 급수로 계산). 리만(1859)은 남은 오차가 전적으로 영점들에 의해 운반됨을 보였다. $J(x) = \sum_{p^m \le x} \frac1m$은 $\operatorname{li}(x) - \sum_\rho \operatorname{li}(x^\rho) - \ln 2 + \int_x^\infty \frac{dt}{t(t^2-1)\ln t}$와 같으며(1895년 폰 망골트가 증명), 뫼비우스 반전으로 $\pi(x)$를 얻는다. 영점 쌍 $\rho = \frac12 \pm i\gamma$마다 크기 약 $\sqrt{x}/(\gamma\ln x)$, $\ln x$에 대한 진동수 $\gamma$의
  파동이 더해진다. 합을 자르면 각 계단 근처에 깁스 현상 같은 물결이 남는다. 리만 가설은 모든 비자명 영점($0 < \operatorname{Re} s < 1$인 모든 영점)의 실수부가 정확히 $\frac12$라는 것이다. 이는 증명되지 않았다. $10^{12}$개가 넘는 영점에 대해 컴퓨터로 확인되었고, 오차 한계 $\pi(x) = \operatorname{li}(x) + O(\sqrt{x}\ln x)$와 동치이다(von Koch, 1901). 이 프로그램은 임계선 위의 영점만 찾을 뿐, 선 밖의 영점을 배제할 수는 없다. 더 읽을거리: H. M. Edwards, Riemann''s Zeta Function (1974).'
meanings:
- 임계선 위의 많은 높이 $t$를 한꺼번에
- '반복된 $n$ ⇒ 합산: 디리클레 급수의 처음 $N-1$개 항'
- 베르누이 수를 쓴 오일러–매클로린 보정; $(s)_{2k-1} = s(s+1)\cdots(s+2k-2)$. 모든 $s \ne 1$에서 유효
- $\zeta(\frac12 + it)$와 같은 영점을 갖는 실함수; $\theta(t)$는 점근 급수로 계산
- 간격 0.01 격자에서 $Z$의 부호 변화를 찾은 뒤, 모든 구간에 대해 한꺼번에 이분법 48단계
- '에라토스테네스의 체: 소수 $p \le \sqrt{x}$마다 간격 슬라이스 하나; $\pi(x)$는 그 누적합'
- 모든 $x$에서의 모든 영점; 켤레 영점을 함께 묶으면 $2\,\mathrm{Re}$
- '모든 $K$에 대한 근사를 한꺼번에: 행마다 프레임 하나'
- 뫼비우스 함수; $J(y) = 0$이므로 $n$에 대한 합은 $x^{1/n} < 2$에서 멈춤
labels:
  n_zeros: 사용한 영점 수 $K$
  x_explicit: 명시 공식의 범위 $x$
  log10_x: 체의 범위 $10^n$
