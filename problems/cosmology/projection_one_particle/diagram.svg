<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="One worldline zig-zags back and forth in time t; a time slice cuts it three times: two forward crossings are electrons, one backward crossing is a positron; the turning points are pair creation and annihilation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes -->
    <line x1="22" y1="148" x2="22" y2="12" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="22" y1="148" x2="228" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="8" y="22" font-style="italic">t</text>
    <text x="218" y="140" font-style="italic">x</text>
    <!-- the worldline: forward (blue) up, backward (red) down, forward up -->
    <path d="M48,140 C60,100 70,70 90,40" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M90,40 C108,20 118,30 122,60 C126,90 132,118 148,124" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M148,124 C166,128 176,90 200,22" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- time slice -->
    <line x1="30" y1="84" x2="222" y2="84" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- crossings -->
    <circle cx="70" cy="84" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="125" cy="84" r="5" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <circle cx="180" cy="84" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="52" y="76" fill="#1e40af">e⁻</text>
    <text x="130" y="78" fill="#b91c1c">e⁺</text>
    <text x="186" y="100" fill="#1e40af">e⁻</text>
    <!-- turning points -->
    <circle cx="104" cy="28" r="3.5" fill="#111827"/>
    <circle cx="150" cy="125" r="3.5" fill="#16a34a"/>
  </g>
</svg>
