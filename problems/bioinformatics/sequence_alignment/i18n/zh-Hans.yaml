source_hash: b944848791a5
title: 序列比对：张量更新的波前
summary: 用动态规划对 DNA 序列做 Needleman–Wunsch（全局）与 Smith–Waterman（局部）比对。表中每个单元格只需要其左、上和对角线邻居，因此整条反对角线 $i + j = d$ 可以在一次张量更新中填满，并同时处理一批序列对。看波前扫过整张表，然后回溯读出最优比对。
notes: 全局比对强制两条序列首尾对齐；局部比对增加了选项 0，因此糟糕的区段会被直接舍弃，报告的是任意位置得分最高的片段（这里是植入随机背景中的基序）。回溯从终点单元格往回走，每一步判断三个选项中哪一个产生了存储的值，并在空位内部于 $H$、$E$、$F$ 三张表之间切换。代价仍是 $O(nm)$ 个单元格，但只需 $n + m - 1$ 个顺序步骤：这种反对角线并行正是 GPU 与 SIMD 比对程序的工作方式。试试提高突变率，或令 $g_o > g_e$，以偏好少数长空位而不是许多短空位。蛋白质用 $20\times20$ 矩阵（如 BLOSUM62）代替 $W$；其他一切不变。
meanings:
- 序列对 $b$ 中第一条序列的第 $i$ 个字母与第二条序列的第 $j$ 个字母，对 A、C、G、T 独热编码
- 字母 $\alpha$ 与 $\beta$ 比对的得分：对角线上为匹配，其余为错配
- 重复的 $\alpha, \beta$ ⇒ 求和：每一种可能字母配对的得分
- 长 $k$ 个字母的空位代价为 $g_o + (k-1)\,g_e$（仿射）；$g_o = g_e$ 为线性空位
- 反对角线 $d$ 上的所有单元格；它们只依赖于对角线 $d-1$ 和 $d-2$
- 每条对角线一次张量更新：以匹配、$a$ 中的空位、$c$ 中的空位结尾的最佳得分
- 全局得分在角落单元格，局部得分在最佳单元格；超出各自长度的填充被忽略
labels:
  mode: 比对方式（全局 = Needleman–Wunsch，局部 = Smith–Waterman）
  length: 序列长度 $L$
  n_pairs: 批次中的序列对数 $B$
  mutation: 每位点突变率
  match: 匹配得分
  mismatch: 错配得分
  gap_open: 空位开启 $g_o$
  gap_extend: 空位延伸 $g_e$
