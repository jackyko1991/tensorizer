title: रिपल टैंक में व्यतिकरण
summary: पानी की सतह पर दो डिपर एक साथ ऊपर-नीचे होते हैं और वृत्ताकार लहरें भेजते हैं। 2D तरंग समीकरण को $3\times3$ संवलन कर्नेल (conv2d) के रूप में लाप्लासियन से आगे बढ़ाया जाता है, एक अवमंदक सीमा बाहर जाती तरंगों को सोख लेती है, और व्यतिकरण पैटर्न स्थिर निस्पंद रेखाओं में स्थिर हो जाता है जहाँ पथांतर अर्ध-विषम संख्या गुणा तरंगदैर्ध्य होता है।
notes: 'मात्रक: सेल आकार $h = 1$, तरंग चाल $c = 1$। समय में leap-frog, अवमंदन पद केंद्रित, इसलिए चरण स्पष्ट (explicit) है। निस्पंद रेखा के अनुदिश एक स्रोत की लहर हमेशा दूसरे स्रोत की लहर से आधा आवर्तकाल बाद पहुँचती है, इसलिए वे एक-दूसरे को निरस्त करती हैं; धराशायी वक्र अतिपरवलय $|r_1 - r_2| = (m + \tfrac12)\lambda$ हैं, जो स्रोतों से पर्याप्त दूर दाएँ पैनल की काली रेखाओं से मेल खाते हैं। स्रोतों को $\lambda$ से अधिक दूर करने पर और निस्पंद रेखाएँ जुड़ती हैं। सीमा एक मोटा अवशोषक (घर्षण परत) है, perfectly matched layer नहीं, इसलिए थोड़ा परावर्तन बचा रहता है। दायाँ पैनल $u^2$ का चलता माध्य दिखाता है; पहले कुछ आवर्तकाल क्षणिक हैं जब तक तरंगें टैंक को भरती हैं।'
meanings:
- ग्रिड सेल $(a, b)$ पर सतह की ऊँचाई
- पाँच-बिंदु लाप्लासियन कर्नेल, ऑफ़सेट $\alpha, \beta \in \{-1, 0, 1\}$
- 'दोहराए गए $\alpha, \beta$ ⇒ योग: कर्नेल ग्रिड पर खिसकता है'
- अंदर शून्य, अवशोषक सीमा में धीरे-धीरे बढ़ता
- समान कला में दोलन करते दो छोटे गाउसीय स्रोत
- $1/\sqrt2$ से ऊपर कूरां संख्या अस्वीकार है (योजना अस्थिर हो जाएगी)
- 'लगभग एक आवर्तकाल पर $u^2$ का चलता औसत: काली रेखाएँ निस्पंद हैं'
labels:
  wavelength: तरंगदैर्ध्य $\lambda$
  separation: स्रोत पृथक्करण $d$
  courant: कूरां संख्या $c\,\Delta t/h$
  t_max: सिमुलेशन समय
