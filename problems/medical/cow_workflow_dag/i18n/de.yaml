source_hash: 4e5cb68f190c
title: 'Die Stärke der Workflow-Orchestrierung: eine Circle-of-Willis-Kohorte als Tensor-DAG'
summary: 'Eine Gefäßstudie ist eine Kette von Schritten (MRA segmentieren, Mittelliniengraph extrahieren, Gefäße vermessen, Ein- und Auslässe setzen, Strömung lösen, Bericht erstellen), von denen jeder bereits ein Tensorprogramm ist; also kann auch der Workflow, den Snakemake orchestriert, ein Tensor sein. Auf sechs offenen (CC0) TopCoW-MRA-Aufnahmen des Circle of Willis wird dasselbe Snakefile von Snakemake (offline) und von einer Tensor-DAG-Engine ausgeführt: Der Jobgraph ist eine Summe von Kronecker-Produkten, seine Ebenen, der kritische Pfad und die Menge der neu auszuführenden Jobs sind Matrix–Vektor-Iterationen, und die Ergebnisse stimmen Job für Job überein. Danach: die gesparte Zeit, woher sie kommt, und was ein Datei-DAG nicht liefern kann: einen Gradienten durch die gesamte Pipeline. Nur zu Lehrzwecken, nicht für den klinischen Einsatz.'
notes: 'Idee. Die Rahmung, die Stärke der Workflow-Orchestrierung, stammt von Jacky Ko, aus seiner HPC- und Promotionsarbeit an Gefäß-Pipelines: Wenn jede Stufe der Pipeline ein Tensorprogramm ist, kann auch der DAG, den ein Workflow-Manager plant, eines sein. Dieses Problem baut das auf und misst es. Workflow. data/Snakefile hat acht Regeln (segment, centreline, measure, boundaries, flow, report, cohort, all) und zwei Wildcards: den Fall (sechs Aufnahmen) und die Bedingung (beide ICA-Einlässe offen oder die linke ICA verschlossen). Die Shell jeder Regel führt workflow.py aus, das für einen Fall dieselbe Tensorfunktion aufruft, die die Tensor-Engine einmal für alle Fälle aufruft. Snakemake 9.27.1 lief offline unter WSL2 (in einer eigenen Umgebung, nie Teil dieses Projekts), und seine Ausgaben liegen als Referenzen in data/snakemake bei: der Job-DAG (--dag), die Jobliste des Dry-Runs, die Menge der neu auszuführenden Jobs nach Änderung einer Eingabe, --summary, Start- und Endzeiten jedes
  Jobs sowie die Kohortentabelle, die seine Jobs geschrieben haben. Die Tests prüfen, dass die Tensor-Engine dieselben 50 Jobs und 79 Kanten hat, dass die Reihenfolgen von Snakemake unser $A$ respektieren und unsere Ebenen ergeben, dass die Menge der neu auszuführenden Jobs gleich ist und dass die Kohortentabelle auf die 9 geschriebenen Stellen identisch ist. Ein Detail zu Neuausführungen: Ein touch auf eine Eingabe ließ Snakemake nichts neu ausführen, weil es bei kleinen Dateien Prüfsummen vergleicht; die Referenz ändert die Bytes der Datei (gleiche Arrays), und dann laufen 10 Jobs neu, wie $x = s \lor Rs$ vorhersagt. Zeit. Im mitgelieferten Lauf brauchte Snakemake 118 s auf 1 Kern, 43 s auf 6 und 27 s auf 12 (ein früherer Lauf auf einer weniger ausgelasteten Maschine: 79, 23 und 22 s); die Tensor-Engine erledigt dieselbe Arbeit in etwa 5 bis 10 s auf einem Thread. Die ehrliche Abrechnung: Jeder Snakemake-Job ist ein neuer Prozess, der Python startet und torch sowie das Jobmodul importiert
  (etwa 1,8 s, data/snakemake/startup.csv, also etwa 88 s der 115 s summierter Jobzeit), .npz-Dateien liest und schreibt und eingeplant werden muss; die Tensor-Engine zahlt das einmal. Das Batching selbst bringt hier auf einer CPU wenig (die Fälle einzeln im selben Prozess zu rechnen dauert etwa genauso lange, manchmal kürzer); der Gewinn kommt also vom Start und von den Dateien und schrumpft, wenn jeder Job ein schwerer GPU-gebundener Löser ist, der den Start in den Schatten stellt. Kein Zeitplan auf $c$ Kernen ist besser als $\max(\mathrm{CP}, W/c)$, der kritische Pfad aus der Max-Plus-Iteration bzw. die Gesamtarbeit geteilt durch $c$, und die gemessenen Läufe halten das ein; den besten Zeitplan zu finden ist im Allgemeinen NP-schwer (Grahams List Scheduling bleibt innerhalb von $W/c + \mathrm{CP}$). Gradient. Ein Datei-DAG reicht Zahlen weiter, keine Ableitungen. Der weiche Schwellenwert macht Segmentierung, Radien und Strömung differenzierbar, sodass $\partial s_{\mathrm{L\,MCA}}/\partial\theta$
  (der Anteil der linken MCA am Ausstrom) für jeden Fall aus einem einzigen Rückwärtsdurchlauf kommt und mit zentralen finiten Differenzen übereinstimmt, die Snakemake zwei zusätzliche vollständige Läufe kosten würden. Der Mittelliniengraph (Topologie) und die Maske der Zusammenhangskomponenten bleiben fest. Pipeline. Segmentierung: weicher Schwellenwert $\sigma((I - \theta)/w)$ der normierten TOF-Intensität, harte Maske $I > \theta$ ohne Komponenten unter 64 Voxeln, Dice gegenüber der TopCoW-Maske etwa 0,86 bis 0,91. Mittellinien: aus den TopCoW-Gefäßlabels Knoten dort, wo gelabelte Gefäße aufeinandertreffen (Kontakte innerhalb von 3,5 mm zusammengeführt; nur anatomische Paare zählen, zwei nebeneinander verlaufende A2 also nicht), ein freies Ende pro terminalem Gefäß (sein entferntester Voxel per Min-Plus-Eikonal mit Laufzeit $\ell/R^2$, neu zentriert) und der kürzeste zentrierte Pfad zwischen aufeinanderfolgenden Knoten (wie im Tensor-Ersatz für VMTK im Aneurysma-Problem). Vermessung:
  Jedes Voxel nahe den gelabelten Gefäßen wird dem nächsten Mittellinienpunkt zugeordnet, sodass der Radius einer Kante $\sqrt{V_e/(\pi L_e)}$ aus dem weichen Volumen ist; Asymmetrie $2(r_R - r_L)/(r_R + r_L)$ pro Gefäß; ein Stenose-Flag dort, wo das geglättete Radiusprofil unter die Hälfte seines Medians fällt (bei diesen gesunden Kontrollen sind solche Flags Segmentierungsartefakte). Randbedingungen wie in Venova: Einlässe an den freien Enden der ICAs und der A. basilaris, Auslässe an den Enden von MCA, ACA und PCA; Enden von Pcom und Acom sind nie Ränder. Strömung: ein stationäres Modell reduzierter Ordnung, Poiseuille-Leitwert pro Kante, $P$ = 90 mmHg an den offenen Einlässen, jeder Auslass über eine Murray-Last $g_k \propto r_k^3$ auf 0 Pa abgeleitet, so abgestimmt, dass ein widerstandsfreies Netz 10 ml/s führen würde; ein einziger gebatchter linearer Löser. Der Kollateraltest verschließt die linke ICA: Wo eine Acom oder Pcom offen ist, bleibt die linke Hemisphäre perfundiert. Vereinfacht:
  newtonsches Blut, starre gerade Röhren, keine Pulsatilität, keine 3D-Strömung (das Aneurysma-Problem macht 3D-CFD an einem Gefäß), Schwellenwert-Radien auf 0,5-mm-Voxeln, Drücke und Flüsse in der Größenordnung der Literatur. Daten. TopCoW 2024, Teilmenge MRA_Lausanne (Zenodo 10.5281/zenodo.15692630, Lizenz CC0): 20 TOF-MRA-Aufnahmen gesunder Kontrollen mit Circle-of-Willis-Labels. Sechs Fälle liegen als 96×80×48-Ausschnitte mit 0,5 mm bei (Bild und Labels, insgesamt unter 1 MB); data/SOURCES.md enthält die Verarbeitung und die Zitate (Yang et al., die TopCoW-Challenge; Di Noto et al. 2022, die Lausanner Kohorte). Die Haupt-Release von TopCoW wird nicht verwendet (ihre Lizenz schränkt die kommerzielle Nutzung ein). Ergebnisse. Neben dem GIF gibt es zwei 3D-Ergebnisse. results/centreline.pvd ist die Anatomie: die Segmentierungsoberfläche jedes Falls (Marching Tetrahedra) und ihr Mittelliniengraph, beide eingefärbt nach dem Gefäßradius. results/flow.pvd ist die Strömung des 1D-Poiseuille-Netzwerks
  über 11 Schritte, in denen sich die linke ICA verengt: Der Zeitschritt ist der Stenosegrad s, der Anteil des verlorenen Lumendurchmessers (0 offen, 1 verschlossen). Seine Ebenen sind die Gefäßoberfläche, eingefärbt nach der Wandschubspannung $\tau_w = 4\mu|Q|/(\pi r^3)$ der nächsten Mittellinienkante (der Druck als zweites Array), die Stromlinien und die Partikel (beide nach Geschwindigkeit eingefärbt) sowie die Ein- und Auslassscheiben mit Pfeilen. Hier gibt es keine 3D-CFD: Die Stromlinien sind die idealisierte axiale Strömung des 1D-Modells, Linien parallel zur Mittellinie jedes Gefäßes bei $\rho = 0, 0.35, 0.7$ seines Radius mit der Hagen-Poiseuille-Geschwindigkeit $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$; es gibt keine Sekundärströmung, und an den Verzweigungen brechen sie ab. Jeder Schritt ist ein stationärer Zustand; die Partikel rücken entlang ihrer Stromlinien nur um eine feste Pseudozeit von 4 ms pro Schritt vor (und beginnen am Ende wieder am Anfang ihres Gefäßes), um die Geschwindigkeiten
  zu zeigen. Die Stenose ist ein 10 mm langes Poiseuille-Segment in Reihe mit dem Einlass, sodass ihr Leitwert wie $(1 - s)^4$ fällt; s = 0 und s = 1 sind genau die beiden Bedingungen des Workflows, und die Schritte dazwischen rechnet nur die Tensor-Engine (ein gebündelter Lösungsschritt pro Schritt). results/stenosis_sweep.csv enthält den Zufluss der linken ICA und den Anteil der linken MCA pro Schritt und Fall; results/timings.csv, results/equivalence.csv und results/cohort.csv enthalten die übrigen Zahlen.'
meanings:
- Regel $s$ liest ein Dateimuster, das Regel $r$ schreibt; direkt aus dem mitgelieferten Snakefile geparst
- 'pro Wildcard-Achse $a$ (Fall, Bedingung): $I$, wenn beide Regeln sie tragen (Kanten pro Fall $A \otimes I$), $\mathbb 1$ für ein Broadcast, $\mathbb 1^\top$ für ein Sammeln wie den Kohortenbericht'
- $A_{ij} = 1$, wenn Job $i$ eine Ausgabe von Job $j$ liest; 50 Jobs, 79 Kanten
- geschlossene Wege der Länge $k$; alle null ⇔ $A$ nilpotent ⇔ azyklisch
- zählt die Pfade $j \to i$; sein 0/1-Muster ist die Erreichbarkeit (boolesches wiederholtes Quadrieren)
- 'topologische Ebene per boolescher Matrix–Vektor-Iteration: ein Job ist bereit, wenn $A\,\neg\mathrm{done} = 0$ in seiner Zeile gilt'
- früheste Endzeiten, ein Max-Plus-(tropischer) Fixpunkt; $\max_i t_i$ ist der kritische Pfad
- neu auszuführende Jobs, nachdem die Jobs in $s$ (Leser einer geänderten Datei) veraltet sind
- weiche Segmentierung, differenzierbar im Schwellenwert $\theta$ (einer pro Fall)
- 'Min-Plus-Eikonal auf dem Voxelgraphen aller Gefäße aller Fälle zugleich: freie Enden und Mittellinien'
- Kantenradius aus dem weichen Volumen der Voxel, die seiner Mittellinie am nächsten liegen
- Kirchhoff mit Poiseuille-Leitwerten $G_e$ und Murray-Auslasslasten $g_k$, ein gebatchter Löser; Dirichlet-Zeilen $p = P$ an den offenen Einlässen
- der Flussanteil der linken MCA, differenziert durch Strömung, Vermessung und Segmentierung, alle Fälle in einem Rückwärtsdurchlauf
labels:
  threshold: Segmentierungsschwelle $\theta$ auf der normierten Intensität
  cores: Kerne $c$ in der Schranke $\max(\mathrm{CP}, W/c)$
