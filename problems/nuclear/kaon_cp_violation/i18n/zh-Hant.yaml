source_hash: ebe74e0d5d26
title: 中性 K 介子中的時間反演與 CPT
summary: 中性 K 介子是一個會振盪並衰變的二態系統（$K^0$、$\bar K^0$），因此它在一個非厄米的 $2\times 2$ 哈密頓量 $H = M - i\Gamma/2$ 下演化。以 PDG 數值構建，並對一批世界在所有時刻同時取指數，它展示了以 $\Delta m$ 振盪的奇異數、破壞 CP 的 $\pi\pi$ 干涉，以及 CPLEAR 的時間反演檢驗：$K^0 \to \bar K^0$ 與 $\bar K^0 \to K^0$ 相差 $A_T \approx 4\,\mathrm{Re}\,\varepsilon \approx 6.5\times 10^{-3}$，而 CPT 使 $K^0$ 與 $\bar K^0$ 的質量與壽命保持相等。
notes: C（電荷共軛）交換粒子與反粒子，P（宇稱）使空間成鏡像，T 使時間反向。CPT 定理（Lüders、Pauli、Schwinger）指出，任何局域、勞侖茲不變的量子場論在三者聯合作用下都是對稱的，因此粒子與其反粒子的質量與壽命完全相等。1964 年，Christenson、Cronin、Fitch 與 Turlay 觀察到長壽命的 $K_L$ 衰變為兩個 π 介子，而這是 CP 所禁止的：CP 被破壞，其程度為 $|\varepsilon| \approx 2.2\times 10^{-3}$（1980 年諾貝爾獎頒給 Cronin 與 Fitch）。若 CPT 成立，CP 破壞也就意味著 T 破壞，而 CERN 的 CPLEAR 於 1998 年直接觀察到了它：從已標記的 $K^0$ 與 $\bar K^0$ 出發，並以半輕子衰變標記衰變時的奇異數，發現 $\bar K^0 \to K^0$ 比 $K^0 \to \bar K^0$ 略微頻繁，$\langle A_T\rangle = (6.6 \pm 1.3 \pm 1.0)\times 10^{-3}$（將其解讀為 T 破壞，前提是假設 $\Delta S = \Delta Q$ 規則成立，且衰變中沒有 CPT 破壞）。這裡 $H$ 由其本徵態構建，因此 CP 參數 $\varepsilon$ 與 CPT 參數 $\delta$ 都是可調旋鈕：當 $\delta = 0$ 時，$H_{11} = H_{22}$（質量與壽命相等），$P(K^0\to K^0) = P(\bar K^0\to\bar K^0)$，且 $A_T$ 是一個位於 $(|p/q|^2 - |q/p|^2)/(|p/q|^2 + |q/p|^2) \approx 4\,\mathrm{Re}\,\varepsilon$ 的平坦平台；非零的 $\mathrm{Re}\,\delta$ 會使 $A_{CPT} = [P(\bar K^0\to\bar K^0) - P(K^0\to K^0)]/[\ldots]$ 在數個 $\tau_S$ 後攀升至 $4\,\mathrm{Re}\,\delta$（CPLEAR 發現 $\mathrm{Re}\,\delta$ 在 $10^{-4}$ 的精度上與零一致）。底部面板展示 $K_S$ 與
  $K_L$ 衰變之間經典的 $\pi^+\pi^-$ 干涉，在 $12\,\tau_S$ 附近最大，由此可測得 $|\eta_{+-}|$ 與 $\phi_{+-}$。么正性以 Bell–Steinberger 關係 $(i\Delta m + \bar\Gamma)\langle K_S|K_L\rangle = \sum_f A_S^* A_L$ 檢驗；在 $\pi\pi$ 主導下，測得的 $\eta_{+-}$ 可將 $\mathrm{Re}\,\varepsilon$ 預測到 0.2% 的精度。數值：PDG 2024（$\tau_S = 0.8954\times10^{-10}$ s、$\tau_L = 5.116\times10^{-8}$ s、$\Delta m = 0.5293\times10^{10}\,\hbar$/s、$|\varepsilon| = 2.228\times 10^{-3}$、$\phi_\varepsilon = 43.52°$、$|\eta_{+-}| = 2.232\times10^{-3}$）；CPLEAR, Phys. Lett. B 444 (1998) 43。簡化之處：忽略直接 CP 破壞（$\varepsilon'$，為 $\varepsilon$ 的 $10^{-3}$），因此 $\eta_{+-} = \varepsilon$；半輕子標記被理想化為完美的奇異數測量；且不考慮物質中的再生。
meanings:
- 各行 $K_S \propto (1+\varepsilon_S, 1-\varepsilon_S)$、$K_L \propto (1+\varepsilon_L, -(1-\varepsilon_L))$，其中 $\varepsilon_{S,L} = \varepsilon \pm \delta$
- $\mp\Delta m/2 - i\Gamma_{S,L}/2$，以 $\hbar/\tau_S$ 為單位（共同質量只是一個全域相位）
- 重複的 $i$ ⇒ 求和：每個世界一個有效哈密頓量
- 每個時刻的 $e^{-iHt}$，並以 matrix_exp 核對
- 生成時為 $b$ 的 K 介子被觀測為 $a$ 的機率（$0 = K^0$，$1 = \bar K^0$）
- 厄米且 $\ge 0$：么正性，即 Bell–Steinberger 關係
- 滿足 $a\cdot K_S = 1$、$a\cdot K_L = \eta_{+-}$ 的列向量
- 重複的 $x$ ⇒ 求和：生成時為 $K^0$ 或 $\bar K^0$ 的束流的 $\pi^+\pi^-$ 衰變率
labels:
  eps_abs: $|\varepsilon|$
  eps_phase: 相位 $\phi_\varepsilon$
  re_delta: CPT 破壞 $\mathrm{Re}\,\delta$
  dm: 質量差 $\Delta m$
  t_max: 時間窗口 $t_\mathrm{max}$
