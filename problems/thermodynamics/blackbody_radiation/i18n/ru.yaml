source_hash: 7be6ce46bf01
title: Излучение чёрного тела
summary: Закон Планка даёт плотность энергии теплового излучения на каждой длине волны. Broadcasting столбца температур против строки длин волн строит всю таблицу спектров $(T, \lambda)$ в одну строку кода; argmax находит пик Вина, а torch.trapezoid интегрирует спектр, давая закон Стефана–Больцмана $T^4$.
notes: 'Сетка длин волн логарифмическая от 10 нм до 100 мкм — достаточно широкая, чтобы отброшенные хвосты меняли интеграл меньше чем на $10^{-5}$; вычисления ведутся в float64 с expm1 для точности. Постоянная Вина $b \approx 2.898\times 10^{-3}$ м·К получается из argmax с точностью до разрешения сетки (около 0,2 %). Цвет кривой берётся из спектра на трёх длинах волн, представляющих красный, зелёный и синий, — грубая замена настоящему колориметрическому расчёту, но она показывает, как свечение переходит от оранжевого через белый к бледно-голубому. График перемасштабируется в каждом кадре: высота пика растёт как $T^5$. Закрашенная полоса отмечает видимый диапазон 380–750 нм.'
meanings:
- набор температур в виде столбца
- сетка длин волн в виде строки
- broadcasting столбца против строки заполняет всю таблицу
- пик Вина сразу для всех спектров
- 'повторяющийся $b$ ⇒ суммирование: полная плотность энергии, $\propto T_a^4$'
- 'Планк на 610, 550 и 465 нм, нормированный: приблизительный видимый цвет'
labels:
  T_min: Начальная температура
  T_max: Конечная температура
  n_temps: Температуры (кадры)
