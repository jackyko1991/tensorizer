title: 정수 계획법으로 입자 궤적 찾기
summary: 시뮬레이션된 HL-LHC 충돌(TrackML 챌린지, CC BY 4.0)의 실제 히트를 정수 선형 계획법으로 궤적에 연결합니다. 곡률과 극각이 일관된 히트 삼중항을 고르되, 각 히트는 최대 한 번만 사용합니다. 우리의 텐서 PDLP(재시작 원시–쌍대 하이브리드 경사법, OR-Tools와 cuOpt 내부에서 쓰이는 LP 방법)가 희소 텐서 위에서 LP 완화를 실시간으로 풀고, 이를 반올림한 뒤 보정합니다. 이를 직접 작성한 헝가리안(Kuhn–Munkres) 기준선 및 HiGHS, Gurobi, scipy의 오프라인 실행과 비교합니다. 비교 항목은 목적함수 격차, 효율, 가짜 궤적 비율, 공식 TrackML 점수, 그리고 실행 시간의 스케일링 $t \propto N^k$입니다.
notes: '상태: 이것은 도구 비교이지 미해결 문제가 아닙니다. 이 ILP는 집합 패킹 문제(일반적으로 NP-난해)입니다. PDLP는 1차 LP 방법이며, 반올림으로 얻는 것은 휴리스틱 정수해이지 최적성이 인증된 해가 아닙니다. 따라서 정확한 최적해와의 격차를 항상 보고합니다. PDLP의 쌍대 한계는 정확한 솔버 없이도 인증된 상한을 제공합니다. 방법. 후보 세그먼트는 빔라인에서 나온 $p_T \ge p_{T,\min}$인 궤적이 연결할 수 있는 인접 층의 히트들을 잇습니다. 삼중항은 공유된 가운데 히트를 통해 두 세그먼트를 잇고, 점수 $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$를 받습니다($s_t > 0$인 것만 유지). ILP는 삼중항 $x_t$와 세그먼트 $y_e$를 고릅니다. 각 히트에는 선택된 들어오는 세그먼트와 나가는 세그먼트가 각각 최대 하나이므로 궤적은 사슬이 됩니다. 선택된 세그먼트는 양쪽 각각에서 최대 하나의 선택된 삼중항으로 이어지며, 모든 세그먼트는 비용 $\lambda = 0.1$을 가집니다. 그 LP 완화($0 \le x, y \le 1$)는 우리의 PDLP(Applegate et al. 2021)로 풉니다. Ruiz 스케일링을 적용한 PDHG에 KKT 조건 기반의 평균으로의 재시작과 원시 가중치 갱신을 더한 것으로, torch.sparse로 작성되어 CPU나 CUDA에서 실행됩니다. 헝가리안 기준선은 층 쌍마다 정확한 선형 할당 문제를 한 번씩 풉니다(가운데 쌍을 먼저, 그다음 안쪽과 바깥쪽으로, 삼중항 비용은 지금까지 만들어진 사슬을 기준으로 함). 이는 다항 시간에 정확히 풀리는 이분 매칭이지만, 한 번에 한 층 쌍씩만 결정하는 반면 ILP는 사슬 전체를 전역적으로 저울질합니다. 그래서 궤적이 달라집니다. 데이터. TrackML Particle Tracking Challenge(CERN / Kaggle 2018), 훈련 이벤트 1000(파일업
  충돌 200회): Zenodo 레코드 4730167, doi:10.5281/zenodo.4730167, 라이선스 CC BY 4.0(Salzburger, Innocente, Vlimant, Rousseau et al.). 픽셀 배럴(volume 8, 4개 층)과 $|\eta| < 1$로 잘라냈으며, 히트 11 519개, 입자 2 452개, 노이즈 6%이고 공식 히트별 가중치가 포함됩니다. 오프라인 벤치마크(data/solver_benchmark.csv)는 AMD Ryzen 5 5600G(스레드 1개)에서 수행했습니다. scipy 1.18.1을 통한 HiGHS(milp, linprog), 크기 제한 라이선스로 gurobipy를 통한 Gurobi 13(변수와 제약 조건 각각 최대 2000개이므로 $\Delta\phi \le 30°$만 가능), scipy의 linear_sum_assignment, 그리고 CPU와 NVIDIA GTX 1080 Ti에서의 우리 PDLP입니다. NVIDIA cuOpt 26.10은 WSL에 설치했으나 실행되지 않았습니다. 그 커널은 계산 능력 7.0(Volta) 이상용으로 빌드되었고 1080 Ti는 6.1이기 때문입니다(cudaErrorNoKernelImageForDevice). 그래서 cuOpt는 제외했으며 수치가 없습니다. 인용한 최신 기술 수준의 결과는 data/trackml_sota.csv에 있습니다. 결론. 여덟 개의 웨지 모두(5°에서 360°, 히트 151개에서 11 519개)에서 LP 완화는 타이트했습니다. HiGHS의 LP 최적값은 MILP 최적값과 $10^{-13}$ 이내로 같습니다. 우리의 PDLP와 보정은 매번 같은 최적값에 도달했고(격차 $10^{-9}$ 미만), 고른 삼중항도 HiGHS와 Gurobi가 고른 것과 정확히 같았습니다(차이 0개). 이것은 경험적 결과이지 보장된 것이 아닙니다. 집합 패킹은 NP-난해이며, 여기서는 4개 층의 사슬 구조가 LP를 타이트하게 유지합니다. 점수가 연속값이라 정확한 동점은 거의
  일어나지 않으므로, 최적값에 도달한 솔버들은 서로 일치합니다. 실행 도중에는 PDLP 값의 약 3분의 1이 분수값이며, 그중 다수는 경쟁하는 삼중항이 거의 동점인 곳(예를 들어 겹치는 모듈의 이중 히트)에서 $\tfrac12$ 근처에 있습니다. 이 값들은 PDLP가 수렴하면서 자리를 잡습니다. 헝가리안 사슬은 최적값보다 0에서 2.2% 낮으며(삼중항 5개에서 651개가 다름), scipy의 할당 목적함수 값과 정확히 일치합니다(우리 헝가리안 구현의 검증). 배럴 전체 부분집합(360°): ILP 솔버의 효율 93.1%, 가짜 궤적 비율 13.0%에 비해 헝가리안은 90.9%와 16.2%이고, TrackML 점수는 0.495 대 0.482입니다. 재구성 가능한 입자를 완벽하게 추적하는 트래커라면 여기서 0.618을 얻습니다. 인용한 전체 이벤트 기준 최신 기술 수준은 0.88에서 0.94입니다(Mikado 0.56 s에 0.944). $N \ge 1000$ 히트에서의 스케일링: HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, 우리 PDLP는 CPU에서 $N^{0.92}$, GPU에서 $N^{0.36}$(10 000개 변수에서도 실행 시작 오버헤드가 여전히 지배적이어서 1080 Ti가 아직 더 빠르지 않음), 우리 헝가리안 $N^{2.14}$(최악의 경우 $O(n^3)$; 희소하고 걸러진 비용 덕분에 증가 경로가 짧게 유지됨), scipy $N^{1.57}$. Gurobi는 히트 860개까지만 크기 제한에 들어맞습니다(그 범위에서 $N^{1.04}$). 이 크기에서는 HiGHS가 PDLP만큼 빠르며, 1차 방법은 훨씬 더 큰 LP에서 진가를 발휘합니다. 작은 웨지에서는 헝가리안이 입자를 약간 더 많이 찾습니다(30°에서 97.4% 대 94.8%). ILP 목적함수는 대리 지표일 뿐 물리적 평가 지표가 아닙니다. 주의사항. 우리 인스턴스는 4개 층의 배럴 웨지이므로 궤적의 히트는 최대 4개이고 엔드캡이 없습니다. 챌린지의 전체 이벤트보다
  쉽고 성격도 다릅니다. TrackML 점수 비교는 참고용이지 동일 조건 비교가 아닙니다. 부분집합 점수 가중치의 약 40%는 $p_T$ 컷 미만이거나 컷 안에서 3개 층 미만을 지나는 입자에 있으며, 우리의 시간은 이벤트의 10분의 1만 다루고 데이터 읽기와 후보 생성은 포함하지 않습니다. 실제 트래커(ACTS 및 각 실험 자체의 트래커)는 조합적 칼만 필터를 사용하며, 그래프 신경망(Exa.TrkX)이 주요 머신러닝 접근법입니다. 이벤트마다 MILP를 돌리는 사람은 없습니다.'
meanings:
- '4개 픽셀 배럴 층 위의 실제 TrackML 히트를 $\Delta\phi$ 웨지로 잘라낸 것: 문제 크기'
- 인접 층에서 $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ 및 $|z_0| \le 150$ mm를 만족하는 히트 쌍, 모든 쌍을 한 번에 처리
- 빔라인과 두 히트를 지나는 원의 곡률
- 삼중항은 가운데 히트를 공유함. 나선은 양쪽 절반에서 같은 $\kappa$와 $\theta$를 가지므로 $s_t$는 불일치에 따라 감소
- 히트 배타성 행(들어오는 세그먼트 하나, 나가는 세그먼트 하나)과 연속성 행. $v$ 반복 ⇒ 모든 곱에서 합산
- Ruiz 스케일링한 LP 위의 PDHG에 평균화, 재시작, 원시 가중치를 결합. 반복당 희소 행렬–벡터 곱 2회
- 세그먼트를 LP 값으로 순위를 매기고, 충돌 없는 것을 병렬 라운드로 받아들이며, 점수보다 비용이 큰 사슬 끝을 잘라냄
- '포텐셜을 사용한 Kuhn–Munkres: 층 쌍마다 정확한 선형 할당을 한 번 수행하고 이를 이어 궤적으로 만듦'
- '공식 TrackML 점수: 한 입자 히트의 > 50%를 포함하고 히트의 > 50%가 그 입자의 것인 궤적 위 히트들의 가중치 합'
labels:
  dphi: 웨지 폭 $\Delta\phi$ (문제 크기)
  pt_min: 최소 횡운동량 $p_{T,\min}$
  max_iter: PDLP 최대 반복 횟수
  digits: PDLP 목표 정확도 $10^{-k}$, $k$ =
  check: 재시작 검사 사이의 반복 횟수 (각 1프레임)
