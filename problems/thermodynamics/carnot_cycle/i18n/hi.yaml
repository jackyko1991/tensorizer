source_hash: 539b278aa207
title: आदर्श गैस का कार्नो चक्र
summary: आदर्श गैस के दो समतापी और दो रुद्धोष्म वक्र, $(V, p)$ बिंदुओं के टेंसर के रूप में नमूनित। कार्य $p$–$V$ आरेख में घिरा क्षेत्रफल है, जो torch.trapezoid से निकाला जाता है, और दक्षता $W/Q_h$ ठीक कार्नो सीमा $1 - T_c/T_h$ पर आती है।
notes: 'ऊष्मा केवल समतापी प्रक्रमों पर सीमा पार करती है: $Q_h = nRT_h\ln(V_2/V_1)$ अंदर, $Q_c = nRT_c\ln(V_3/V_4)$ बाहर। चूँकि रुद्धोष्म वक्र आयतन अनुपातों को जोड़ते हैं, $V_3/V_4 = V_2/V_1$, इसीलिए दक्षता केवल दोनों तापों पर निर्भर करती है। संपीडन चरण छोटे $V$ की ओर चलते हैं, इसलिए torch.trapezoid उन्हें अपने आप ऋणात्मक कार्य देता है। $T$–$S$ आरेख में चक्र एक आयत है और उसका क्षेत्रफल भी $W$ है। आयतन $V_1 = 1$ लीटर से शुरू होते हैं।'
meanings:
- चक्र के चरण $l$ पर नमूना $k$ ($l$ = गर्म समतापी, रुद्धोष्म, ठंडा समतापी, रुद्धोष्म)
- समतापी वक्र, आयतनों के टेंसर पर अवयव-वार
- चक्र के एक कोने से गुज़रता रुद्धोष्म वक्र
- 'दोहराया गया $k$ ⇒ योग: हर चरण पर कार्य'
- 'चरणों $l$ पर योग: घिरा क्षेत्रफल'
- पथ के अनुदिश एन्ट्रॉपी, $T$–$S$ आरेख के लिए
labels:
  T_h: गर्म भंडार $T_h$
  T_c: ठंडा भंडार $T_c$
  ratio: प्रसार अनुपात $V_2/V_1$
  n: गैस की मात्रा
  gas: गैस
