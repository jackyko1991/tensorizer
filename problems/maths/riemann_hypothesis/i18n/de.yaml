source_hash: a175ef505737
title: Die Riemannsche Vermutung in Tausenden von Nullstellen
summary: Tausende nichttriviale Nullstellen von $\zeta$ auf der kritischen Geraden mit der Riemann–Siegel-Formel in Tensorform lokalisieren, sie mit dem Riemann–von-Mangoldt-Gesetz $N(T) = \theta(T)/\pi + 1 + S(T)$ und dem Gramschen Gesetz abgleichen, ihre Abstände und Paarkorrelation mit zufälligen hermiteschen Matrizen (GUE) vergleichen und aus ihnen die Primzahlpotenz-Treppe $\psi(x)$ rekonstruieren. Die Vermutung selbst, dass jede nichttriviale Nullstelle den Realteil $\frac12$ hat, ist weiterhin offen.
notes: 'Diese Seite ergänzt das Problem „Die Riemannsche Zetafunktion und die Primzahlen“ (maths/zeta_primes), das $\zeta$ von Grund auf mit Euler–Maclaurin aufbaut, die ersten Nullstellen findet und $\pi(x)$ rekonstruiert; lesen Sie es zuerst für die Grundlagen. Hier wertet die schnellere Riemann–Siegel-Formel mit ihren Korrekturen $C_0, C_1, C_2$ (Ableitungen von $\Psi$ aus einer Tschebyschow-Reihe) $Z(t)$ an einer Viertelmillion Höhen aus und findet jede Nullstelle auf der kritischen Geraden unterhalb von $T$; für $t \ge 100$ stimmt sie mit einer hochgenauen Auswertung (mpmath) auf besser als $10^{-5}$ überein. Unterhalb von $t = 1000$ findet sie 649 Vorzeichenwechsel und unterhalb von 5000 deren 4520, genau die Gesamtzahl der Nullstellen im Streifen bis zu diesen Höhen (unabhängig mit mpmath berechnet), also liegen alle auf der Geraden; die Zählfunktion folgt $\theta(T)/\pi + 1$ mit einer kleinen Schwankung $S(t)$, die im Mittel null ist. Das Gramsche Gesetz gilt an den meisten Gram-Punkten
  und versagt erstmals bei $g_{126} \approx 282.45$. Nach Normierung auf mittleren Abstand 1 stoßen sich die Nullstellen genau wie die Eigenwerte großer zufälliger hermitescher Matrizen (GUE) ab: Montgomery (1973) vermutete die Paarkorrelation $1 - (\sin \pi u / \pi u)^2$ und bewies sie unter Annahme der Riemannschen Vermutung für Testfunktionen mit Fourier-Träger in $(-1, 1)$, und Odlyzkos Rechnungen nahe der $10^{20}$-ten Nullstelle bestätigen sie eindrucksvoll; schon bei den geringen Höhen hier ist die Übereinstimmung gut. Die explizite Formel (von Mangoldt 1895, bewiesen) verwandelt die Nullstellen in die Primzahlen: Jedes Paar $\frac12 \pm i\gamma$ fügt eine Welle $x^{1/2}\cos(\gamma\ln x)$ hinzu, und mit Tausenden von Nullstellen wird $\psi(x)$ zu einer scharfen Treppe. Die Riemannsche Vermutung, dass jede nichttriviale Nullstelle den Realteil $\frac12$ hat, ist eines der Millennium-Preisprobleme des Clay-Instituts und offen. Sie wurde für alle Nullstellen bis zur Höhe $3\times10^{12}$
  verifiziert (Platt und Trudgian 2021). Im Streifen dargestellte bewiesene Resultate: keine Nullstellen auf $\operatorname{Re} s = 1$ (Hadamard, de la Vallée Poussin 1896, äquivalent zum Primzahlsatz) und das nullstellenfreie Gebiet $\sigma > 1 - 1/(5.558691\ln t)$ (Mossinghoff und Trudgian 2015), gespiegelt durch die Funktionalgleichung. Behauptet, nicht gesichert: Im Oktober 2026 veröffentlichte OpenAI (laut Berichten; wir haben die Manuskripte nicht geprüft) in seinem öffentlichen Repository openai/math mit KI-generierten Manuskripten eine behauptete nullstellenfreie Halbebene $\operatorname{Re} s > 7/8$ für $\zeta$ und jede Dirichletsche $L$-Funktion, zusammen mit einem Begleitargument für $\operatorname{Re} s > 11/12$. Diese Preprints sind nicht begutachtet und wurden nicht unabhängig verifiziert; wären sie korrekt, wäre ein nullstellenfreier Streifen fester Breite ein großer Fortschritt, aber immer noch weit von der Geraden $\frac12$ entfernt. Keine Rechnung kann die Vermutung beweisen:
  Eine endliche Suche kann nur Nullstellen auf der Geraden finden oder ein Gegenbeispiel.'
meanings:
- 'wiederholtes $n$ ⇒ summiert: die Hauptsumme für 250 000 Höhen auf einmal, maskiert auf $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$'
- $\Psi$ ist ganz, aber der Quotient ist $0/0$ bei $p = \frac14, \frac34$; eine Tschebyschow-Anpassung beseitigt das
- 'die Riemann–Siegel-Korrekturen: Eine Tschebyschow-Reihe lässt sich gliedweise ableiten, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- Vorzeichenwechsel von $Z$ auf einem Gitter mit Schrittweite 0.02, dann 32 Bisektionsschritte auf allen Einschlussintervallen auf einmal
- Nullstellenanzahl minus ihr glatter Anteil; bleibt klein und hat Mittelwert 0
- alle Gram-Punkte per Newton-Verfahren auf einmal; das Gramsche Gesetz besagt $(-1)^n Z(g_n) > 0$
- Differenzen normierter Nullstellen $x = \theta(\gamma)/\pi + 1$ zu den nächsten $J = 10$ Nachbarn, für die Paarkorrelation
- 'jede Nullstelle an jedem $x$, über die Nullstellen aufsummiert: eine Zeile pro Höhe $T$'
labels:
  t_max: Höhe $T$
  x_max: Explizite Formel bis $x$
