source_hash: b05c63a03eb9
title: DT 고온점의 관성 핵융합 점화
summary: 내파된 중수소–삼중수소 캡슐 중심에 있는 고온점의 0D 모형. $\mathrm{D + T \to {}^4He + n}$에서 나온 알파 입자가 이를 가열하고, 제동 복사와 팽창이 냉각하며, 차가운 껍질로 빠져나가는 열은 연소를 키운다. 초기 온도와 면밀도 $(T_0, \rho R_0)$의 격자 전체를 하나의 배치로 적분한다. 로슨형 경계 위에서는 고온점이 폭주하여 연소하고, 아래에서는 꺼진다.
notes: '관성 가둠은 수백 마이크로그램의 DT를 매우 빠르게 압축하여 흩어지기 전에 연소시킨다. 고온점은 스스로 만든 알파 입자가 냉각보다 빠르게 가열할 때 점화된다. 두 수가 이를 결정한다. 하나는 온도로, $\langle\sigma v\rangle$이 수십 keV까지 가파르게 증가하기 때문이다. 다른 하나는 면밀도 $\rho R$로, 더 두꺼운 고온점은 자신의 알파 입자를 멈추고(10 keV 근처에서 알파 비정은 대략 0.3 g/cm²) 팽창에 맞서 더 오래 버티기 때문이다. 제동 복사만으로 이상 점화 온도가 정해지며, 약 4.3 keV에서 $\tfrac14\langle\sigma v\rangle E_\alpha = C_B\sqrt T$가 된다. 점선 곡선은 순간 균형, 즉 로슨 기준의 ICF 형태이고, 음영 영역은 차가운 껍질로의 연소 전파까지 고려한 전체 적분의 결과다. 손실 배율 $L$을 올리면 경계가 더 큰 $\rho R$과 더 높은 $T$로 이동한다. 연구 배경: 2022년 12월 5일 미국 국립 점화 시설(NIF)은 타깃 이득이 1을 넘는 최초의 실험실 핵융합 실험을 보고했다. 타깃에 도달한 레이저 에너지 2.05 MJ에서 약 3.15 MJ의 핵융합 에너지가 나왔다(근삿값; Indirect Drive ICF Collaboration, Phys. Rev. Lett. 132, 065102, 2024). 그 전에 연소 플라스마에 도달했고(Zylstra et al., Nature 601, 542, 2022), 2021년 8월에는 1.3 MJ 샷이 점화에 대한 로슨 기준을 넘어섰다(Phys. Rev. Lett. 129, 075001, 2022). 타깃 이득은 타깃에 도달한 레이저 에너지만 센다. 레이저를 구동하는 데 쓰인 전기는 훨씬 더 많다. 단순화: 고정된 밀도의 균일한 0D 고온점(따라서 연소율이 과대평가된다 — PdV 손실 항 말고는 해체시키는 것이 없다), 설명용 알파 에너지 침착 공식, 근사적 스피처 전도도($\ln\Lambda \approx
  10$), 복사 가둠 없음, 애블레이터 물질 혼합 없음, 이온과 전자의 온도는 같다.'
meanings:
- 모든 격자점 $b = i\,n_r + j$가 하나의 고온점이다. 상태는 $(\ln T, \ln\rho R, \varphi)$
- 보시–헤일 DT 반응도, 10 keV에서 $\approx 1.14\times10^{-22}$ m³/s, 65 keV 근처에서 최대 $\approx 9\times10^{-22}$
- 3.5 MeV 알파 에너지 중 고온점 안에서 멈추는 비율
- 제동 복사, $C_B = 5.34\times10^{-37}$ W m³ keV$^{-1/2}$
- 음속으로 팽창하는 고온점의 PdV 일
- 껍질로의 스피처 전도. 새로운 고온 질량으로 재활용된다(연소 전파)
- 모든 고온점에 대한 우변을 한꺼번에, RK4로 진행
- 자가 가열이 손실과 같아지는 로슨형 곡선, 배치 이분법으로
labels:
  density: 고온점 밀도 $\rho$
  loss: 손실 배율 $L$(제동 복사 + PdV)
  rho_r_max: 사용 가능한 총 연료 $\rho R$
  t_end: 시뮬레이션 시간
  n_grid: 축당 격자점 수
  t_min: 최저 $T_0$
  t_max_init: 최고 $T_0$
