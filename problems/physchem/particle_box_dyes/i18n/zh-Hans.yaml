source_hash: 07db7a3fd274
title: 箱中粒子与染料的颜色
summary: 为什么共轭链越长的分子吸收的光越红？菁染料的 $\pi$ 电子沿链自由运动，就像长度为 $L$ 的一维箱中的粒子。把能级 $E_n \propto n^2/L^2$ 两两填满，得到 HOMO→LUMO 能隙 $\Delta E = h^2(N+1)/8m_eL^2$，并对整个同系列同时预测 $\lambda_{max}$；用 torch.linalg.eigh 对角化的批量有限差分哈密顿量重现了解析能级。
notes: Kuhn 的自由电子模型（1948）把共轭链的 $\pi$ 电子视为箱中的独立粒子。在菁染料 $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$ 中，正电荷由两个氮原子共享，因此链上所有键几乎等长（约 $l = 0.139$ nm），平底势箱是一个很好的近似。有 $2k + 2$ 个键、$N = 2k + 4$ 个电子，势箱在每个氮原子外各伸出一个键长，$L = (2k + 4)l$，$\lambda_{max} = 8m_ec\,L^2/h(N + 1)$ 随 $k$ 几乎线性增长：模型预测每增加一个 CH=CH 单元约增加 125 nm，而红色方块（最简单菁染料的舍入实测值）约增加 100 nm。这是经典的本科实验：记录几种链长递增的菁染料的可见光谱，然后用 $\lambda_{max}$ 拟合势箱长度或末端延伸。数值求解器给出相同的能级，误差小于 $10^{-3}$（其误差按 $(n\,\Delta x)^2$ 下降），而且它能做公式做不到的事：加入势能。多烯具有交替的双键和单键；在普通势箱中它们的预测 $\lambda_{max}$ 会远远延伸到红外区，而真实的多烯会趋于平稳（β-胡萝卜素有 11 个 C=C，吸收约在 450 nm）。选择多烯系列并把 $V_{alt}$ 提高到 1–2 eV：周期势打开一个对长链仍保持有限的能隙，这就是能带隙的一维雏形。色块显示白光减去以每个 $\lambda_{max}$ 为中心的高斯吸收带后的颜色；吸收黄光的染料看起来是蓝色，只吸收紫外光的则看起来无色。
meanings:
- 系列中分子 $b$ 的 π 电子数和共轭键数
- 势箱长度：所有键加上每个末端原子外的一个键长
- 解析能级；不对任何指标求和，是 $n^2$ 与 $1/L^2$ 的外积
- HOMO $n = N/2$ 到 LUMO $n = N/2 + 1$，以及被吸收的波长
- 每个势箱的内部网格点；壁上 $\psi = 0$
- 每个分子一个有限差分哈密顿量，堆叠在一起
- 重复的 $j$ ⇒ 求和；eigh 在一次调用中对角化整个批次
- 重复的 $w$ ⇒ 对可见波长求和：吸收后剩下的颜色
labels:
  series: 同系列
  n_max: 最长链（增加的 CH=CH 单元数）
  bond: 键长 $l$
  end: 每个末端原子外的势箱延伸（键数）
  V_alt: 键长交替势 $V_{alt}$
  n_points: 网格点数 $M$
