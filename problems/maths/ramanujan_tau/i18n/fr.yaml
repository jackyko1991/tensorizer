source_hash: 242e43034f00
title: La fonction $\tau(n)$ de Ramanujan et la loi de Sato–Tate
summary: Développez la forme modulaire discriminant $\Delta(q) = q\prod_n (1-q^n)^{24}$ en série entière tensorielle pour obtenir la fonction $\tau(n)$ de Ramanujan, exactement jusqu'à $n \sim 10^5$–$10^6$ grâce aux résidus modulo un lot de nombres premiers. Vérifiez que $\tau$ est multiplicative et obéit à la récurrence de Hecke, que $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, que $|\tau(p)| \le 2p^{11/2}$ (théorème de Deligne, 1974), et regardez les valeurs normalisées $\tau(p)/2p^{11/2}$ remplir le demi-cercle de Sato–Tate (un théorème pour $\Delta$ depuis 2011). Le programme vérifie ces théorèmes numériquement.
notes: 'Ramanujan (1916) a étudié les coefficients $\tau(n)$ de $\Delta(q) = q\prod(1-q^n)^{24}$, l''unique forme parabolique normalisée de poids 12, et a conjecturé trois choses : $\tau$ est multiplicative, elle vérifie $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$, et $|\tau(p)| \le 2p^{11/2}$. Mordell a démontré les deux premières en 1917, un cas précurseur de ce qui deviendrait la théorie de Hecke. La borne est la conjecture de Ramanujan pour $\Delta$ (Ramanujan–Petersson en général) : Deligne l''a démontrée en 1974 comme conséquence de sa preuve des conjectures de Weil ; c''est donc un théorème. Ramanujan a aussi démontré la congruence $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, qui provient du fait que $691$ divise le numérateur du nombre de Bernoulli $B_{12}$. En écrivant $\tau(p) = 2p^{11/2}\cos\theta_p$, la conjecture de Sato–Tate affirme que les angles $\theta_p$ suivent la loi $\frac{2}{\pi}\sin^2\theta\,d\theta$, c''est-à-dire que $x_p = \cos\theta_p$ suit le demi-cercle
  $\frac{2}{\pi}\sqrt{1-x^2}$, de moments $1/4$, $1/8$, $5/64$ (nombres de Catalan divisés par des puissances de 4). Pour $\Delta$, elle a été démontrée par Barnet-Lamb, Geraghty, Harris et Taylor (2011). L''histogramme converge lentement, comme un échantillon de tirages indépendants. La conjecture de Lehmer, selon laquelle $\tau(n)$ ne s''annule jamais, est toujours ouverte ; elle a été vérifiée bien au-delà de cet intervalle, et le programme ne trouve pas non plus de zéro. Numérique : $\tau(n)$ croît comme $n^{11/2}$, donc une FFT float64 de toute la série a une erreur absolue d''environ $10^{-16}$ fois le plus grand coefficient, ce qui noie $\tau(2) = -24$ (un test le montre). À la place, la série est calculée exactement modulo une dizaine de nombres premiers à la fois, une ligne de tenseur pour chacun, puis reconstruite par le théorème des restes chinois. Pour rire : Ramanujan a remarqué que… (« Ramanujan noticed that… ») $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$ ; que $1729 = 1^3 +
  12^3 = 9^3 + 10^3$ ; et, seulement en un sens régularisé, que $1 + 2 + 3 + \dots$ « $= -1/12$ » : la série diverge, et $-1/12$ est la valeur $\zeta(-1)$ de la fonction zêta prolongée analytiquement.'
meanings:
- 'identité de Jacobi $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$ : seulement $O(\sqrt N)$ coefficients non nuls'
- '$j$ répété ⇒ sommé : un produit de séries tronquées vu comme une matrice de Toeplitz fois un vecteur, exact en int64 pour $N$ petit'
- trois élévations au carré donnent la puissance 24
- les mêmes produits par FFT pour $M$ modules premiers à la fois, arrondis en résidus exacts (chaque $m^2 N \le 2^{42}$)
- théorème des restes chinois avec chiffres équilibrés, pour que les valeurs négatives ressortent négatives
- tous les couples premiers entre eux $1 < m < n$ avec $mn \le 600$ à la fois
- chaque couple de diviseurs $(d, j)$ avec $dj \le N$ ajoute $d^{11}$ à $n = dj$
- valeurs normalisées aux nombres premiers, dans $[-1, 1]$ par le théorème de Deligne
labels:
  n_max: Nombres premiers et $\tau(n)$ jusqu'à $N$
