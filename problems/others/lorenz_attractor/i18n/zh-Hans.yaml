source_hash: 8944aa9bc162
title: 洛伦兹吸引子与蝴蝶效应
summary: 来自对流模型的三个耦合方程永不停歇，也永不重复。把它写成线性部分 $A_{ij}x_j$ 加上用三阶张量表示的二次部分 $Q_{ijk}x_j x_k$，一次 einsum 就能推进一整批彼此相距不到 $10^{-6}$ 的轨道；它们以最大李雅普诺夫指数 $\lambda \approx 0.9$ 决定的速率指数分离，直到铺满整只蝴蝶。
notes: 洛伦兹（1963）把一个从下方加热的流体模型简化为三个数：$x$ 是对流卷的强度，$y$ 和 $z$ 描述温度分布。当 $\sigma = 10$、$\rho = 28$、$\beta = 8/3$ 时，运动绕着两个不动点 $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$ 之一旋转，然后不可预测地跳到另一侧翅膀。相邻轨道按 $e^{\lambda t}$ 分离，$\lambda \approx 0.906$：$10^{-6}$ 的误差在大约 $15$ 个时间单位后增长到吸引子的大小，这就是预报存在极限的原因（蝴蝶效应）。与此同时，任何状态体积都按 $e^{-(\sigma+1+\beta)t}$ 收缩，于是轨道挤到一个薄薄的分形集合上：奇异吸引子。张量形式让结构一目了然：$A$ 包含全部线性耦合，而全部非线性只是 $Q$ 的两个分量。计算前，先把一条从 $(1, 1, 1)$ 出发的轨道积分 $10$ 个时间单位，使小球从吸引子上出发；这里固定步长 $0.005$ 的 RK4 已足够精确。试试 $\rho < 1$：原点变得稳定，所有轨道都衰减到原点；当 $1 < \rho < 24.74$ 时它们螺旋落入 $C_+$ 或 $C_-$；在 $\rho = 28$ 附近及以上，混沌重新出现。
meanings:
- 轨道 $b$ 的状态 $(x, y, z)$
- 线性部分：各行为 $(-\sigma, \sigma, 0)$、$(\rho, -1, 0)$、$(0, 0, -\beta)$
- 二次部分，一个只有两个非零分量的三阶张量：$\dot y$ 中的 $-xz$ 和 $\dot z$ 中的 $+xy$
- 重复的 $j$ ⇒ 求和
- 重复的 $j$ 和 $k$ ⇒ 求和：产生混沌的非线性
- 雅可比矩阵的迹：状态体积以恒定速率 $\sigma + 1 + \beta$ 收缩
- 各轨道到其平均值的均方根距离
- 离散度从 $10\,s(0)$ 增长到 $1$ 期间 $\ln s$ 随 $t$ 的斜率
labels:
  sigma: 普朗特数 $\sigma$
  rho: 瑞利数 $\rho$
  beta: 几何因子 $\beta$
  t_max: 模拟时间
  log10_radius: 初始球半径 $\log_{10} r$
  n_traj: 轨道数
