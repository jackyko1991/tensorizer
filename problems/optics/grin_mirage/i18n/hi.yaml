title: किरण समीकरण से सड़क की मरीचिका
summary: गर्म सड़क के ऊपर हवा विरल होती है, इसलिए उसका अपवर्तनांक $n(y)$ ज़मीन के पास घट जाता है। ज्यामितीय प्रकाशिकी का किरण समीकरण प्रकाश को अधिक $n$ की ओर मोड़ता है; देखने की दिशाओं के एक पंखे के लिए इसे RK4 से समाकलित करने पर सड़क की ओर जाती किरणें वापस ऊपर मुड़ती दिखती हैं, इसलिए आँख को दूर की वस्तु का दूसरा, उलटा प्रतिबिंब दिखता है।
notes: 'किरणें आँख से पीछे की ओर अनुरेखित की जाती हैं (प्रकाश पथ उत्क्रमणीय हैं): हर किरण बताती है कि "इस दिशा में देखने पर आँख क्या देखती है?"। थोड़ी नीचे की ओर जाती किरणें कम अपवर्तनांक वाली परत में ऊपर मुड़ती हैं और वस्तु से नीचे की ओर से मिलती हैं, इसलिए निचले कोण वस्तु के ऊपरी भाग दिखाते हैं — प्रतिबिंब उलटा है। अधिक ढलवाँ किरणें सड़क (धूसर) तक पहुँच जाती हैं। ऊर्ध्वाधर पैमाना लगभग 100× बढ़ाया गया है: वास्तविक अपवर्तनांक अंतर $\sim 10^{-5}$ हैं और कोण मिलीरेडियन में हैं। गणनाएँ float64 में हैं क्योंकि $n\cos\theta$ केवल 7वें दशमलव स्थान पर बदलता है।'
meanings:
- किरण $r$ की स्थिति $(x, y)$
- 'प्रकाशिक दिशा सदिश: एकक स्पर्शरेखा गुणा $n$'
- अपवर्तनांक, गर्म सड़क की सतह $y = 0$ पर न्यूनतम
- 'केवल $y$-घटक शून्येतर है: $(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$'
- प्रथम-कोटि निकाय के रूप में किरण समीकरण, RK4 से आगे बढ़ाया गया
- 'दोहराया गया $j$ ⇒ योग: $\lvert\mathbf p\rvert$ को $n$ के बराबर रहना चाहिए (सटीकता जाँच)'
- 'क्षैतिज परतों के लिए स्नेल का नियम: हर किरण के अनुदिश संरक्षित'
labels:
  delta_n: सड़क पर अपवर्तनांक में गिरावट $\Delta n$
  scale_height: गर्म परत की मोटाई $h$
  eye_height: आँख की ऊँचाई
  distance: वस्तु की दूरी
  max_dip: सबसे ढलवाँ नीचे की दृष्टि
  n_rays: पंखे में किरणें
