title: ट्यूरिंग मशीनों के एक बैच से हॉल्टिंग समस्या
summary: 'भौतिकी नहीं, बस मज़े के लिए: लाखों ट्यूरिंग मशीनों को एक साथ टेंसर के रूप में चलाइए। हर मशीन का एक कदम है एक gather (हर हेड के नीचे का टेप पढ़ना), एडवांस्ड इंडेक्सिंग से उसका नियम ढूँढना और एक scatter (लिखना)। 2 और 3 अवस्थाओं वाले सभी बिज़ी बीवर उम्मीदवारों को गिनिए, चैंपियन $S(2) = 6$ और $S(3) = 21$ खोजिए, और हॉल्टिंग समस्या को काम करते देखिए: आप कदमों का कोई भी बजट चुनें, कुछ मशीनें अनिर्णीत ही रहती हैं।'
notes: 'ट्यूरिंग (1936) ने दिखाया कि कोई भी प्रोग्राम हर मशीन और हर इनपुट के लिए यह तय नहीं कर सकता कि वह रुकेगी या नहीं। एक अनुच्छेद में विकर्ण तर्क: मान लीजिए एक मशीन $D(M)$ हर उस मशीन $M$ के लिए, जिसे उसके अपने विवरण पर चलाया गया हो, “रुकेगी” या “हमेशा चलेगी” बता देती है। एक $G$ बनाइए जो $D(M)$ चलाए और फिर उल्टा करे: अगर $D$ कहे “रुकेगी” तो हमेशा लूप में चलती रहे, और अगर $D$ कहे “हमेशा चलेगी” तो रुक जाए। अब पूछिए कि $G$ अपने ही विवरण पर क्या करती है: अगर वह रुकती है, तो $D$ ने कहा था कि वह हमेशा चलेगी, और अगर वह हमेशा चलती है, तो $D$ ने कहा था कि वह रुकेगी। दोनों ही स्थितियों में $D$ ग़लत है, इसलिए $D$ का अस्तित्व नहीं हो सकता। राडो (1962) ने इसे एक खेल बना दिया, बिज़ी बीवर: ख़ाली टेप पर शुरू होकर रुकने वाली सभी $n$-अवस्था, 2-प्रतीक मशीनों में $S(n)$ सबसे लंबा चलना है और $\Sigma(n)$ पीछे छोड़े गए 1 की सबसे बड़ी संख्या। दोनों किसी भी गणनीय फलन से तेज़ बढ़ते हैं, क्योंकि $S(n)$ का प्रोग्राम हॉल्टिंग तय कर देता: हर मशीन को $S(n)$ कदम चलाइए, और अगर तब तक नहीं रुकी तो कभी नहीं रुकेगी। ज्ञात
  मान: $S(2) = 6$, $\Sigma(2) = 4$ (राडो), $S(3) = 21$, $\Sigma(3) = 6$ (लिन और राडो 1965), $S(4) = 107$, $\Sigma(4) = 13$ (ब्रैडी 1983), और $S(5) = 47\,176\,870$, जिसे 2024 में bbchallenge सहयोग ने Coq से सत्यापित प्रमाण के साथ सिद्ध किया कि बाक़ी हर 5-अवस्था मशीन हमेशा चलती है। प्लॉट दिखाता है कि यह कठिन क्यों है: रुकी मशीनों का अंश $f(t)$ बढ़ता है और फिर सपाट हो जाता है, और कोई सीमित बजट धीरे-धीरे रुकने वाली मशीन को हमेशा चलने वाली मशीन से अलग नहीं कर सकता। यहाँ कदम 21 के बाद का पठार 3 अवस्थाओं का ज्ञात उत्तर है, क्योंकि बची हुई मशीनों के बारे में सिद्ध किया जा चुका है कि वे लूप में चलती हैं। 3 अवस्थाओं के लिए सामान्यीकरण: पहला नियम A0 → 1RB पर तय है, जो एक आम चुनाव है और ज्ञात चैंपियनों को बनाए रखता है (बाएँ–दाएँ सममिति से पहली चाल दाईं ओर मानी जा सकती है, बाक़ी अवस्थाओं के नाम आपस में बदले जा सकते हैं, और ख़ाली टेप पर A में ही रहने वाली मशीन कभी नहीं रुकती), और हर रुकने का नियम 1RH है, जिससे $16^6$ की जगह $13^5 = 371\,293$ मशीनें बनती हैं। 4 अवस्थाएँ आज़माइए: किसी यादृच्छिक नमूने में
  107-कदम वाला चैंपियन शायद ही कभी होता है।'
meanings:
- 'अवस्था $q$ और पढ़े गए प्रतीक $r$ के लिए मशीन $b$ की नियम तालिका: (लिखो $w$, चलो $m = \pm1$, अगली अवस्था $q''$); अवस्था $n$ रुकने की अवस्था $H$ है'
- मशीन $b$ के टेप का खाना $x$, शुरुआत में सब 0; $L = 2t_{\max} + 1$ ताकि कोई हेड सिरे तक न पहुँचे
- हेड की स्थिति (शुरू में बीच में) और मौजूदा अवस्था (शुरू में $A$)
- सभी हेड के नीचे का प्रतीक एक साथ पढ़ना
- 'एडवांस्ड इंडेक्सिंग: हर मशीन अपना नियम ढूँढती है'
- लिखना; फिर चलना और अवस्था बदलना, केवल जहाँ $s_b \ne H$ (रुकी मशीनें जम जाती हैं)
- 'वह कदम जिस पर मशीन $b$ ने $H$ में प्रवेश किया, या $-1$: बजट के भीतर अनिर्णीत'
- '$\tau_b \le t$ वाली मशीनों का अंश: घटता नहीं, और 1 से नीचे अटका रहता है'
- 'दोहराया गया $x$ ⇒ योग: रुकी मशीन द्वारा छोड़े गए 1 की संख्या'
labels:
  states: अवस्थाएँ $n$ (2 और 3 पूरी गिनती, 4 नमूना)
  budget: कदमों का बजट $t_{\max}$
  n_sample: यादृच्छिक 4-अवस्था मशीनें
