source_hash: d29dc3e384c1
title: '죽은 별의 재점화: 갈색왜성, 신성, X선 폭발, 블랙홀'
summary: 항성 잔해에 새로운 기체가 공급되면 어떤 일이 일어날까요? 질량이 약 $0.075\,M_\odot$ 를 넘어선 갈색왜성은 수소를 태워 별이 될 수 있고, 백색왜성은 강착된 수소 껍질에 점화하여 고전 신성이 되며, 중성자별은 강착된 H/He 를 몇 시간마다 섬광처럼 태워 I형 X선 폭발을 일으킵니다. 블랙홀은 표면이 없으므로 아무것도 점화되지 않고, 에딩턴(Eddington) 한계까지 빛을 낼 뿐입니다. 하나의 배치 텐서 모델(Lane–Emden 폴리트로프, 축퇴된 상태 방정식, 자동 미분을 이용한 단일 구역 껍질 점화)이 모든 잔해와 모든 질량에 대한 임계 강착 질량을 한 번에 구합니다.
notes: '정확한 결과: Lane–Emden 상수, 찬드라세카르(Chandrasekhar) 질량($\mu_e = 2$ 일 때 $1.456\,M_\odot$), 에딩턴(Eddington) 광도($M_\odot$ 당 $1.26\times10^{38}$ erg/s), ISCO 효율($5.7\%$ 에서 $42\%$). 나머지는 모두 크기 정도(order-of-magnitude) 모델입니다. (1) 갈색왜성: 수축하는 $n = 3/2$ 폴리트로프가 도달하는 최고 온도 $T_{\max} \propto M^{4/3}$ 를 $3\times10^5$ K(Gyr 에 걸친 느린 중수소 연소) 및 $3\times10^6$ K(수소)와 비교합니다. 모델은 약 $14\,M_J$ 와 $0.074\,M_\odot$ 를 주며, 이는 진화 모델의 한계값인 약 $13\,M_J$(Spiegel et al. 2011)와 $0.07$–$0.08\,M_\odot$(Burrows et al. 2001)에 가깝습니다. 이것은 필요조건일 뿐입니다. 오래되고 차가운 갈색왜성이 한계를 넘더라도 점화하려면 강착(압축)에 의한 가열이 함께 필요합니다. (2) 신성: 점화 질량은 $10^{-7}$ 에서 $10^{-3}\,M_\odot$ 까지이며, 백색왜성이 무거울수록, 강착이 빠를수록 작아집니다. 이는 Yaron et al. (2005)의 신성 격자와 같은 경향이지만, 일치는 몇 배 이내에 그칩니다(열전도, 혼합, 차폐 효과는 생략). 신성은 아마도 강착된 양 이상을 방출하므로, 백색왜성이 $M_{\rm Ch}$ 까지 성장해 Ia형 초신성으로 폭발할 수 있는지(단일 축퇴성 경로)는 논쟁 중입니다. (3) X선 폭발: 점화 기둥 밀도는 $10^8$ g/cm² 근처, 재발 시간은 몇 시간으로 관측과 일치합니다(Galloway and Keek 2021). 그램당 중력 에너지는 핵에너지의 약 40배입니다($\alpha$). 폭발을 일으키는 바로 그 강착이 중성자별의 자전을 빠르게 합니다. 약 $0.04\,M_\odot$
  이면 오래된 펄서가 밀리초 펄서로 재생(리사이클)됩니다. (4) 블랙홀: 표면이 없으니 섬광도 없습니다.'
meanings:
- '항목마다 하나의 강착 잔해: 백색왜성(질량 $\times$ 강착률)과 중성자별(연료 $\times$ 강착률)'
- 강착층의 기둥 밀도, g/cm²; 압력 $P = g y$
- 이상 이온 + 부분 축퇴 전자의 상태 방정식을 배치 이분법으로 역산
- 복사 평형 바닥 온도, 고정점 반복($\kappa$, $\rho$ 는 $T$ 에 의존)
- '얇은 껍질 불안정성: 가열이 냉각보다 $T$ 에 따라 더 빨리 증가 ⇒ 폭주'
- '임계 강착 질량: 신성 또는 X선 폭발'
- 모든 반지름을 거쳐 수축하는 $n = 3/2$ 폴리트로프; $r$ 에 대한 최댓값 ⇒ 갈색왜성 한계
- '$n = 1, 3/2, 3$ 에 대한 Lane–Emden 방정식을 한 번에: 상수 $\omega_3$, $\rho_c/\bar\rho$, $P_c$'
- '블랙홀: 강착에 의한 빛만 존재, $\eta = 1 - E_{\rm ISCO}$'
