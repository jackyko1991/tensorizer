<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two in-phase point sources a distance d apart send out circular ripples; a point P is at distances r1 and r2 from them, and a nodal line bends away between them">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- tank wall -->
    <rect x="8" y="8" width="224" height="144" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- ripples from both sources -->
    <g fill="none" stroke="#93c5fd" stroke-width="1.5">
      <path d="M68,118 A22,22 0 0 1 112,118"/><path d="M46,118 A44,44 0 0 1 134,118"/><path d="M24,118 A66,66 0 0 1 156,118"/>
      <path d="M128,118 A22,22 0 0 1 172,118"/><path d="M106,118 A44,44 0 0 1 194,118"/><path d="M84,118 A66,66 0 0 1 216,118"/>
    </g>
    <!-- a nodal line: |r1 - r2| = lambda / 2 -->
    <path d="M125,118 Q128,70 146,16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- distances to a point P -->
    <line x1="90" y1="118" x2="190" y2="34" stroke="#374151" stroke-width="1.5"/>
    <line x1="150" y1="118" x2="190" y2="34" stroke="#374151" stroke-width="1.5"/>
    <circle cx="190" cy="34" r="3.5" fill="#374151"/>
    <text x="196" y="30" font-style="italic">P</text>
    <text x="116" y="78" font-style="italic">r₁</text>
    <text x="176" y="84" font-style="italic">r₂</text>
    <!-- sources -->
    <circle cx="90" cy="118" r="5.5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="150" cy="118" r="5.5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="92" y1="136" x2="148" y2="136" stroke="#6b7280" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="116" y="150" font-style="italic">d</text>
  </g>
</svg>
