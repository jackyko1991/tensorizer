title: 17-угольник Гаусса циркулем и линейкой
summary: В 1796 году, за месяц до своего 19-летия, Гаусс обнаружил, что правильный 17-угольник можно построить циркулем и линейкой — первый новый построимый многоугольник со времён древних греков. Корни 17-й степени из единицы, сгруппированные в гауссовы периоды, решают цепочку квадратных уравнений. Эта цепочка записывает $\cos(2\pi/17)$ одними квадратными корнями. Затем построение Ричмонда (1893) рисует многоугольник шаг за шагом, а пересечения прямых и окружностей записаны как тензорные операции. Сетка показывает, какие $n$-угольники построимы (теорема Гаусса–Ванцеля). Всё здесь — доказанная классическая математика.
notes: 'Гаусс нашёл 17-угольник 30 марта 1796 года, незадолго до своего 19-летия, и, как говорят, именно это заставило его выбрать математику, а не филологию. Теорию он опубликовал в последнем разделе «Арифметических исследований» (Disquisitiones Arithmeticae, 1801). Идея: 16 нетривиальных корней $\zeta^k$ циклически переставляются отображением $k \mapsto 3k \bmod 17$, потому что 3 — первообразный корень. Если сложить каждый второй корень в этом циклическом порядке, получатся два периода по 8 слагаемых с $\eta_0 + \eta_1 = -1$ и $\eta_0\eta_1 = -4$, так что $\eta_{0,1} = (-1 \pm \sqrt{17})/2$. Дальнейшее деление пополам даёт периоды из 4, 2 и 1 слагаемых. Каждая пара — это пара корней квадратного уравнения, коэффициенты которого — периоды уровнем выше, потому что подгруппы имеют порядки $16 \to 8 \to 4 \to 2 \to 1$, все степени двойки. Периоды из 2 слагаемых равны $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$, так что четыре квадратных корня дают формулу Гаусса. Программа проверяет каждое квадратное
  соотношение с точными целыми коэффициентами, восстанавливает каждый период одними квадратными корнями и сравнивает замкнутую формулу с `torch.cos` (и с sympy с точностью 60 знаков, если он установлен). Любой первообразный корень (3, 5, 6, 7, 10, 11, 12, 14) даёт то же дерево в другом порядке. Квадратный корень — операция циркулем и линейкой, поэтому многоугольник построим. Г. У. Ричмонд (1893) дал короткий рецепт на единичной окружности. Берём $OJ = OB/4$ на вертикальном радиусе. Ставим $E$ на диаметре так, что $\angle OJE = \tfrac14\angle OJP_0$ (два деления угла пополам), и $F$ так, что $\angle EJF = 45°$. Окружность на диаметре $FP_0$ пересекает $OB$ в точке $K$. Окружность с центром $E$ через $K$ пересекает диаметр в точках $N_3 = \cos(6\pi/17)$ и $N_5 = \cos(10\pi/17)$, а перпендикуляры в них дают $P_3$ и $P_5$. Здесь каждый шаг действительно проводит прямую через две точки или окружность с центром в одной точке через другую. Каждая новая точка — пересечение прямая–прямая, прямая–окружность
  или окружность–окружность, а остальные вершины откладываются окружностями: с центром $P_k$ через $P_{k-1}$ и с центром $P_0$ через $P_k$ для зеркального образа. 55 шагов ставят все 17 вершин с точностью около $10^{-15}$ к $e^{2\pi i k/17}$ во float64; переключитесь на float32, чтобы увидеть, как ошибка округления растёт примерно до $10^{-6}$. Гаусс утверждал, что $n$-угольник построим, когда $n = 2^k p_1 \cdots p_r$ с различными простыми Ферма $p_i = 2^{2^j} + 1$. Ванцель (1837) доказал, что никакое другое $n$ не подходит, чем заодно решил вопросы о трисекции угла и удвоении куба. Это равносильно тому, что функция Эйлера $\varphi(n)$ — степень двойки, и сетка проверяет оба признака до $n$. Известны только простые Ферма 3, 5, 17, 257 и 65537. Ришело опубликовал 257-угольник в 1832 году, а И. Г. Гермес около десяти лет работал над 65537-угольником, закончил его в 1894 году; рукопись хранится в Гёттингене. Говорят, Гаусс просил высечь 17-угольник на своём надгробии, но каменотёс якобы отказался:
  тот выглядел бы как круг. На памятнике Гауссу в Брауншвейге вместо этого изображена 17-конечная звезда.'
meanings:
- корни 17-й степени из единицы — вершины 17-угольника на комплексной плоскости
- 'показатели в порядке степеней первообразного корня, $g = 3$: 1, 3, 9, 10, 13, …'
- 'какие позиции циклического порядка образуют период $i$ на уровне $m$: каждая $2^m$-я'
- 'повторяющийся $j$ ⇒ суммирование: все гауссовы периоды всех пяти уровней (длины 16, 8, 4, 2, 1) сразу'
- произведение двух периодов-«братьев» — сумма $\zeta^{a+b}$; подсчёт показателей даёт целые числа, постоянные на периодах родительского уровня
- 'повторяющийся $k$ ⇒ суммирование: свободный член каждого квадратного уравнения из уровня выше'
- 'один квадратный корень на уровень: $16 \to 8 \to 4 \to 2 \to 1$; на уровне 3 лежат $2\cos(2\pi k/17)$'
- 'три хода циркулем и линейкой как тензорные формулы: система $2\times 2$ через векторные произведения, квадратное уравнение по $t$ и радикальная ось двух окружностей'
- функция Эйлера решетом; построим ровно тогда, когда $\varphi(n)$ — степень двойки, проверка $x \,\&\, (x-1) = 0$
- 'нечётная часть должна делить $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$: произведение различных простых Ферма'
labels:
  generator: Первообразный корень $g$ для циклического порядка
  precision: Точность построения
  n_max: Сетка построимости до $n$
