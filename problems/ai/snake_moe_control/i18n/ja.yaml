source_hash: 099100757a12
title: CNN と混合エキスパート制御器でプレイするスネークゲーム
summary: 2 つの部分からなるゲームプレイエージェント：盤面を見る小さな CNN と、行動を選ぶ制御ネットワークで、後者はここでは混合エキスパートであり、そのルーターが各ゲームを $K$ 個の小さなエキスパートネットワークのいずれかに送る。ゲームは $10 \times 10$ グリッド上のスネークで、すべてテンソルで書かれているため、ゲームのバッチを 1 ステップで一斉に進められる。制御器はプランニングを行う教師（幅優先探索と塗りつぶし、これらもテンソル演算）を模倣して学習する。重み予算が同じ 4 つの制御器を比較する：密な混合、Switch の top-1 ルーター、密に学習したルーターを top-1 で使うもの、そして 1 つの素の MLP である。続いてルーティングをゲーム状態と照らし合わせて測定し、各エキスパートが何のために使われているのか（そもそも使い分けがあるのか）を調べる。4 つとも 1 ゲームあたり約 20 個の餌を食べ、ランダム方策の 0.2 個に対して教師のスコアの 3 分の 2 に達する。この規模では素の MLP もどの混合モデルにも劣らない。
notes: 着想。Jacky Ka Long Ko が、知覚を担う CNN と混合エキスパートのルーティングを持つ制御ネットワークからなるゲームプレイエージェントを提案し、とりわけテンソルによるルーティング部分を求めた。本問題ではスネークでその小さな版を作る。スネークは汎用的なグリッドゲームで、ここでは一から書いている（独自のピクセル表現、素材は使わない）。ゲーム。$N \times N$ の盤面（$N = 10$）上の $B$ 個のゲームが 1 組のテンソルをなす。盤面は各胴体マスの年齢（そのマスが再び空くまでの手数：頭の年齢 = 長さ、尾は 1）を保持するので、全ゲームの 1 手は数個のテンソル演算で済む：相対行動 $a$（左、直進、右）に対し、頭は新しい向き $d' = (d + a - 1) \bmod 4$ で $\mathbf x + \Delta_{d'}$ へ進む。壁または年齢 $> 1$ のマスに当たるとゲーム終了（尾のマスは離れていくので空いている）。餌がなければすべての年齢が 1 減り、餌があれば蛇は尾を残して 1 マス伸びる。新しい餌は、シード付きの $N^2$ 個の一様乱数のうち最大の値を持つ空きマスに置かれるので、決して胴体の上には出ない。餌を食べずに $N^2$ 手経過したとき、または蛇が盤面を埋め尽くしたときにもゲームは終わる。テスト：壁および自分自身への衝突、空く尾のマス、1 マスの伸長、餌が決して胴体上に出ないこと、年齢が常にちょうど $\ell, \ell - 1, \dots, 1$ であること、そして同じ乱数を与えたときバッチ化したステップがゲームごとの素の Python ループと一致すること。エージェント。知覚は CNN（8 チャネルの 3×3 畳み込み、16 チャネルでストライド 2 の 3×3 畳み込み、$F = 64$ 個の特徴への線形層；重みは 84 472 個）で、入力は頭を中心とし進行方向を上に向けた視野の 4 つのプレーン：壁、胴体、年齢/長さ（どのマスが先に空くか）、餌である。この座標系では 3 つの相対行動は常に中心の同じ 3 つの隣接マスになる（ある行動が致命的であるのは、その隣接マスが壁か空かない胴体マスであるときに限ることをテストで確認する）。制御は $K = 4$ 個のエキスパートの混合で、各エキスパートは行動ロジットを出す
  MLP $64 \to 32 \to 3$ であり、その前に softmax ルーター $p = \mathrm{softmax}(W^G \mathbf h + b^G)$ がある：重みは 8976 個。ルーティング層は moe_dag_pipeline のものをそのままインポートしている：ディスパッチテンソルが各ゲームを担当エキスパートのバッファに入れ（GShard や Switch と同様に累積順位による）、全エキスパートを 1 回のバッチ化した einsum で実行し、結合の einsum でロジットを戻す。厳密な検査：固定した one-hot ルーターでは、この層は各ゲームのエキスパートを単独で実行した結果と一致する（$10^{-6}$ 以内）。一様な密ルーターはエキスパートの平均を与え、ルーターの各行の和は 1 であり、既知のケースでの負荷分散損失の値（均衡時 1、崩壊時 $K$、手計算の例で 1.1）も確認する。同じ予算の 4 つの制御器：(a) 密な混合 $z = \sum_k p_k f_k$（すべてのエキスパートがすべてのゲームを処理）。(b) Switch top-1、最も確率の高いエキスパートだけを実行し、そのロジットを $p_k$ 倍する。(c) (a) の密に学習したモデルを追加学習なしで top-1 ルーティングで実行。(d) 1 つの MLP $64 \to 132 \to 3$（重み 8979 個、混合モデルと同じ）。(a) と (b) にはいずれも $\alpha = 0.01$ の Switch 負荷分散損失を加える。各変種にシードは 2 つあり、シード $s$ はどの変種でも同じ CNN とエキスパートの重みから始まる。学習する 6 モデルはすべて 1 本のモデル軸（CNN のグループ畳み込み）を共有し、それぞれが自分のミニバッチを使う。教師と学習。教師は同じテンソルで書かれたプランナーである：空きマス上の反復緩和による幅優先探索（$\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$）と、同じループ内で行う塗りつぶしで、各空き領域にその中で最小のマス番号をラベル付けする。教師は決して致命的な手を打たず、空き領域に蛇が収まる手を優先し、次に餌への最短経路、その次に大きい領域を選ぶ。その距離場は教科書通りのキューによる
  BFS とテストで一致する。学習は行動クローニング（Pomerleau 1989）である：教師の手に対する交差エントロピーを、192 回の教師ゲームから得た 54 040 状態で、1 モデルあたり 128 状態 × 600 ステップの AdamW で最小化し、360 ステップ後に DAgger（Ross et al. 2011）を 1 ラウンド行う：生徒がそれぞれ 48 ゲームをプレイし、到達した 38 267 状態に教師がラベルを付け、両方で学習を続ける。強化学習によるファインチューニングは行わない。深層 Q 学習（Mnih et al. 2015）は報酬だけからこうしたゲームを学ぶ古典的な方法だが、CPU でははるかに時間がかかる。結果（既定の実行、全方策が共有する 128 回の評価ゲーム：同じ初期状態と同じ餌の系列、最大 300 手）。1 ゲームあたりに食べた餌のゲーム平均、括弧内は 2 つのシード：ランダム 0.16（15 手で死亡）；(a) 密 20.7（20.9, 20.4）；(b) Switch 20.4（21.1, 19.6）；(c) 密→top-1 18.1（18.4, 17.8）；(d) 単一モデル 21.7（21.8, 21.6）；教師 31.0（平均で 300 手中 287 手生存、生徒は 147–179 手）。生徒は学習状態の 95–96 % で教師と一致するのに、スコアは 3 分の 1 低い：小さな誤りが 1 ゲームの間に積み重なるためで、行動クローニングによくある弱点である。遅いテストで、学習済み方策がランダムに明確な差で勝つことを確認する。ルーティング（専門化でない場合も示す）。密ルーターは 4 つのエキスパートをすべて使う（負荷 0.16–0.38）。最もよく追従しているのは行動そのものである：ルーティング先のエキスパートと制御器の行動との相互情報量は 0.51 と 0.56 bit（4 エキスパートで可能な最大は 2 bit）。シード 1 では、1 つのエキスパートが左折と右折のほぼすべて、および前方に空きマスがない状態のほぼすべてを引き受け、残り 3 つが直進を分担する。前方の空きマス数は 0.20–0.28 bit、餌までの距離は 0.08–0.12、胴体の長さは 0.02–0.13（短い蛇から長い蛇へのドリフトはシード 1
  のみ）を持つ。つまりエキスパートは何をするか（曲がるか進み続けるか）で分かれており、餌を追う対尾を避けるといった戦略で分かれているのではない。エキスパートの出力が行動を決めるので、この分担は部分的に構造上組み込まれている。Switch ルーターは負荷分散損失があるにもかかわらず崩壊した：シード 1 は状態の 85 % を 1 つのエキスパートに、15 % を 2 つ目に送り、シード 2 では 73 % と 26 % で、どちらも 2 つのエキスパートが未使用である。moe_dag_pipeline で見られた対称性の破れの難しさが、ここでは崩壊として現れる。スコア上の損失はない。共有の CNN（重みの大部分を持つ）と組めば、1 つのエキスパートだけで 4 つと同じくらいうまくプレイできるからである。密に学習したルーターを top-1 で実行した (c) は密なルーティングを保つ（行動との相互情報量 0.60 と 0.67 bit）が、1 ゲームあたり餌を 2.6 個失う：密モデルはエキスパートを混ぜ合わせており、完全には分離できない。成り立つこと、成り立たないこと。厳密：バッチ化したゲームは参照ループと一致し、固定ルーターでのルーティング層はゲームごとのエキスパート呼び出しと一致し、一様ルーターでの密な混合はエキスパート平均である。1 つの盤面サイズと 2 つのシードで測定したこと：模倣によってどの制御器も教師の約 3 分の 2 に達し、同じ重み数の素の MLP に勝つ混合モデルはない（MLP は両シードで 1 ゲームあたり約 1 個リードしているが、シード 2 つでは小さな差である）。混合エキスパートが効果を発揮するのは、多数のエキスパートが 1 つの入力で使える量をはるかに超える重みを持つときである。仕事の大半を担う CNN の後ろに置いた 4 エキスパートの制御器は、ルーティングを実演するものであって、その利点を示すものではない。関連研究。局所エキスパートの適応的混合（Jacobs、Jordan、Nowlan、Hinton 1991）は、各事例を競合する複数のエキスパートの 1 つに割り当てるゲートを導入した。スパースゲート付き MoE 層（Shazeer et al. 2017）と Switch Transformer（Fedus et al. 2021、ここで使う
  top-1 ルーティングと負荷分散損失）がそれを大規模化した。深層 Q ネットワーク（Mnih et al. 2015）は CNN と報酬だけでピクセルから Atari のゲームを学習した。ALVINN（Pomerleau 1989）は人間の運転を模倣して車両を操舵し、行動クローニングの起源となった。DAgger（Ross、Gordon、Bagnell 2011）は学習者自身が訪れた状態にラベルを付けることで、その誤りの累積を解消する。デバイスと制約。既定は CPU：負荷の高い 6 コアのマシンで教師・学習・評価に約 80 s（教師ゲーム 6.6 s、DAgger 6.0 s、学習 53 s、評価 16 s）、GIF にさらに約 30 s かかる。GPU（pixi run -e cuda）は CNN を高速化するが、教師の多数の小さな探索は速くならない。GIF は (c) を示す。そのルーターは全エキスパートを使い、1 ゲームにつきちょうど 1 つを実行する。routing.png は 3 つのルーティング変種すべてを示し、routing.csv と scores.csv に数値が入っている。
meanings:
- ゲーム $b$ の盤面：0 = 空き、それ以外はその胴体マスが再び空くまでの手数（頭 = 長さ $\ell_b$、尾 = 1）
- 全 $B$ ゲームが一斉に動く。相対行動 $a_b$（左、直進、右）に対し $d'_b = (d_b + a_b - 1) \bmod 4$。壁または年齢 $> 1$ のマスに当たるとゲーム終了（年齢 1 の尾のマスは離れていく）
- 餌を食べた後、シード付き一様乱数 $u_{brc}$ が最大の空きマス：決して胴体上にはない
- CNN が見るもの：壁、胴体、年齢/長さ、餌。頭を中心に進行方向を上に向けているので、3 つの行動は常に同じ 3 つの隣接マスになる
- CNN の特徴。モデル軸 $m$（変種 × シード）は各層 1 つのグループ畳み込みのグループになる
- ルーター：$K$ 個のエキスパートに対する softmax、各行の和は 1
- ゲーム $b$ をエキスパート $k$ のスロット $s$ へ（そこにルーティングされたゲームの中での順位）、moe_dag_pipeline からインポート
- 全エキスパートを 1 回のバッチ積で計算し、それぞれが自分のゲームバッファを処理する：3 つの行動ロジット
- 結合。密の場合：$z = p_{mbk} y_{mkba}$ で、すべてのエキスパートがすべてのゲームを処理
- Switch の負荷分散、$K \sum_k f_k P_k$：均衡時 1、崩壊時 $K$
- 教師：致命的な手を打たず、次に空き領域（塗りつぶし）に蛇が収まる手、次に餌への最短経路（テンソルの反復緩和による幅優先探索）
labels:
  grid: 盤面サイズ $N$（マス）
  seeds: 変種あたりのシード数
  experts: エキスパート数 $K$
  steps: 学習ステップ数
  balance_weight: 負荷分散の重み $\alpha$
  dagger: DAgger ラウンド（1 = オン）
  eval_games: 評価ゲーム数
