title: टैकियॉन और एंटीटेलीफ़ोन
summary: 'क्या हो यदि किसी कण का द्रव्यमान काल्पनिक हो, $m^2 < 0$? सम्मिश्र टेंसरों के साथ $E^2 = p^2 + m^2$ अब भी वास्तविक ऊर्जाएँ देता है, पर कण हमेशा प्रकाश से तेज़ चलता है और ऊर्जा खोने पर और तेज़ हो जाता है। अतिप्रकाशीय विश्व-रेखाओं के बैच लोरेंत्ज़ बूस्ट ऐसे निर्देश-तंत्र खोजते हैं जिनमें संकेत भेजे जाने से पहले पहुँच जाता है, और टॉलमैन के एंटीटेलीफ़ोन का लूप बंद कर देते हैं। क्षेत्र सिद्धांत में $m^2 < 0$ का अर्थ इसके बजाय एक अस्थिर निर्वात है जो संघनित होता है, जैसा हिग्स क्षेत्र करता है। यह काल्पनिक (speculative) है: कोई भी टैकियॉन कभी देखा नहीं गया, और 2011 के OPERA के “प्रकाश से तेज़ न्यूट्रिनो” एक ढीले केबल का परिणाम थे।'
notes: 'काल्पनिक भौतिकी: टैकियॉन परिकल्पित कण हैं। मानक मॉडल में कुछ भी टैकियॉनी कण नहीं है और किसी भी प्रयोग ने कभी कोई टैकियॉन नहीं पकड़ा। विशेष सापेक्षता किसी द्रव्यमान वाले पिंड को $c$ के पार त्वरित करने से रोकती है, पर अपने आप में उन कणों को नहीं रोकती जो हमेशा प्रकाश से तेज़ हों (Bilaniuk, Deshpande और Sudarshan 1962; Feinberg 1967, जिन्होंने यह नाम गढ़ा)। इसकी क़ीमत कार्य-कारण संबंध है। $u > c$ गति वाले संकेत से जुड़ी दो घटनाएँ आकाशवत् रूप से पृथक होती हैं, इसलिए उनका समय-क्रम प्रेक्षक पर निर्भर करता है: $c^2/u$ से तेज़ चलने वाले किसी भी निर्देश-तंत्र में संकेत भेजे जाने से पहले पहुँचता है और ऋणात्मक ऊर्जा ले जाता है। Feinberg की पुनर्व्याख्या इसे उलटी दिशा में चलते धनात्मक ऊर्जा वाले एंटीटैकियॉन के रूप में पढ़ती है, जो ऊर्जा की धनात्मकता को बचा लेती है पर “किसने भेजा” को निर्देश-तंत्र पर निर्भर छोड़ देती है। दो निर्देश-तंत्रों का उपयोग टॉलमैन का एंटीटेलीफ़ोन (1917) देता है: ऐलिस $\beta$ से दूर जा रहे बॉब को संकेत भेजती है, और बॉब अपने निर्देश-तंत्र में उसी गति से उत्तर देता है। जैसे
  ही $\beta > 2u/(1+u^2)$ होता है, उत्तर ऐलिस तक उसके संदेश भेजने से पहले पहुँच जाता है, जिससे एक कारणात्मक लूप बंद हो जाता है। क्वांटम क्षेत्र सिद्धांत में ऋणात्मक $m^2$ कोई तेज़ कण नहीं बल्कि एक अस्थिरता है। क्षेत्र $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ की पहाड़ी की चोटी $\phi = 0$ से लुढ़ककर $\phi = \pm\sqrt{-m^2/\lambda}$ में आ जाता है (“टैकियॉन संघनन”, जो ऊर्जा को $m^4/4\lambda$ से घटाता है), जहाँ द्रव्यमान$^2 = 2|m^2|$ वाले सामान्य कण रहते हैं। हिग्स क्षेत्र ठीक यही करता है, और पैनल इसे हबल-जैसे घर्षण वाली जालक पर दिखाता है। वास्तविक डेटा: 2011 में OPERA ने बताया कि म्यूऑन न्यूट्रिनो 730 km की दूरी पर $60.7 \pm 6.9 \pm 7.4$ ns पहले पहुँचे, $(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1)। कारण एक ठीक से न जुड़ा फ़ाइबर-ऑप्टिक केबल और घड़ी का विचलन निकला। संशोधित परिणाम $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ है (v4, JHEP 10 (2012) 093), और ICARUS ने $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns मापा (Phys. Lett. B 713 (2012) 17): दोनों $c$ के अनुरूप हैं।
  यदि 2011 के मान को टैकियॉन माना जाए तो $|m| \approx 120$ MeV की आवश्यकता होगी, और तब सुपरनोवा SN1987A के 10 MeV न्यूट्रिनो 168 000 वर्षों की यात्रा के बाद प्रकाश से कुछ ही घंटों के भीतर पहुँचने के बजाय प्रकाश से लगभग 12 गुना आगे निकल जाते ($|v-c|/c \lesssim 2\times10^{-9}$, Longo 1987)। इकाइयाँ: $c = 1$, संकेत-पंखे के लिए टैकियॉन द्रव्यमान $\mu = 1$।'
meanings:
- 'सम्मिश्र वर्गमूल: $p > \mu$ होने पर वास्तविक, भले ही $m$ और $\gamma$ दोनों काल्पनिक हों'
- हर प्रेक्षक निर्देश-तंत्र के लिए एक लोरेंत्ज़ बूस्ट ($c = 1$)
- 'दोहराया गया $b$ ⇒ योग: हर संकेत को हर निर्देश-तंत्र से एक साथ देखा जाता है'
- निश्चर $m^2 = -\mu^2$, हर निर्देश-तंत्र में समान
- 'रैपिडिटी घटती हैं: $c$ से नीचे $\tanh$, ऊपर $\coth$'
- जब उत्तर ऐलिस तक पहुँचता है; $< t_{\mathrm{send}}$ एक कारणात्मक लूप बंद करता है
- मिथ्या निर्वात $\phi = 0$ से लुढ़कता जालक क्षेत्र (torch.roll लाप्लासियन, वेग Verlet)
labels:
  u: टैकियॉन संकेत की गति $u$
  beta_max: सबसे तेज़ प्रेक्षक निर्देश-तंत्र $\beta_\mathrm{max}$
  m2: क्षेत्र का टैकियॉनी द्रव्यमान$^2$ $m^2$
  lam: स्व-युग्मन $\lambda$
  friction: हबल घर्षण $\gamma$
