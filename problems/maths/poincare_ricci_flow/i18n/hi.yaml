title: पॉइनकेयर अनुमान और रिच्ची प्रवाह
summary: 'सिद्ध: हर बंद, सरल रूप से संबद्ध (simply connected) 3-मैनिफ़ोल्ड 3-गोला है (पेरेलमैन 2002–03, हैमिल्टन के रिच्ची प्रवाह कार्यक्रम को पूरा करते हुए)। रिच्ची प्रवाह $\partial_t g = -2\,\mathrm{Ric}$ मीट्रिक को वैसे ही चिकना करता है जैसे ऊष्मा तापमान को समान करती है। यहाँ यह ऊबड़-खाबड़ 2-गोलों के एक बैच को गोल बनाता है (गाउस–बोने $\int K\,dA = 4\pi$ राउंड-ऑफ़ त्रुटि तक सही रहता है), और डम्बल के आकार वाले 3-गोले की गर्दन को परिमित समय में भींच देता है: यही वह विलक्षणता है जिसे पेरेलमैन की सर्जरी काटकर निकालती है, जिसके बाद हर टुकड़ा गोल हो जाता है।'
notes: 'स्थिति: सिद्ध। पॉइनकेयर ने 1904 में पूछा था कि क्या ऐसा बंद 3-मैनिफ़ोल्ड, जिसमें हर लूप को सिकोड़कर एक बिंदु बनाया जा सकता है, अनिवार्य रूप से 3-गोला है। हैमिल्टन ने 1982 में रिच्ची प्रवाह प्रस्तुत किया और सिद्ध किया कि धनात्मक रिच्ची वक्रता वाला 3-मैनिफ़ोल्ड प्रवाहित होकर गोल मीट्रिक बन जाता है; दो विमाओं में गोले पर हर मीट्रिक गोल हो जाता है (हैमिल्टन 1988, चाउ 1991), जिसे ऊबड़-खाबड़ गोले दिखाते हैं: $K$ का फैलाव शून्य तक घटता है जबकि $\int K\,dA = 4\pi$ और क्षेत्रफल स्थिर रहते हैं। $l = 1$ हार्मोनिक गोल गोले की अनुकोण (conformal) गतियाँ हैं और क्षीण नहीं होते, पर वे आकार नहीं बदलते। तीन विमाओं में प्रवाह में विलक्षणताएँ विकसित हो सकती हैं। पर्याप्त पतली गर्दन वाले घूर्णन-सममित डम्बल के लिए एंजेनेंट और क्नॉफ़ (2004) ने नेकपिंच सिद्ध किया: गर्दन एक बेलन $S^2 \times \mathbb R$ की तरह सिकुड़ती है, $\psi_\mathrm{neck}^2 \approx 2(T - t)$, जबकि दोनों गोलाकार सिरे बड़े बने रहते हैं। पेरेलमैन के शोधपत्रों (arXiv 2002–03) ने तीन विमाओं में सभी विलक्षणताओं को नियंत्रित किया (कोई स्थानीय
  संकुचन नहीं, कैनॉनिकल पड़ोस), सर्जरी सहित रिच्ची प्रवाह परिभाषित किया जो गर्दनों को काटकर उन पर ढक्कन लगाता है, और दिखाया कि सरल रूप से संबद्ध मैनिफ़ोल्ड के लिए प्रवाह परिमित समय में विलुप्त हो जाता है, और हर टुकड़ा मिटने से ठीक पहले गोल गोला होता है, अतः मैनिफ़ोल्ड 3-गोला था। प्रमाण की विस्तार से जाँच क्लाइनर–लॉट, मॉर्गन–तियान और काओ–झू ने की; पेरेलमैन ने 2006 का फ़ील्ड्स पदक और 2010 का क्ले मिलेनियम पुरस्कार अस्वीकार कर दिया। यहाँ की संख्यात्मक विधि: सतहें ध्रुवीय कोण में परिमित-आयतन ग्रिड का उपयोग करती हैं, इसलिए विविक्त गाउस–बोने यथार्थ है। 3-गोला अनुकोण रूप में लिखा गया है, जो ध्रुवों पर नियमित है (चाप-लंबाई वाला रूप वहाँ $\psi \to 0$ से भाग देता है और अस्थिर है), और सेल ध्रुवों की ओर सघन रखे गए हैं क्योंकि गर्दन पतली होने पर गोलाकार सिरे वहीं दबते हैं; प्रवाह गर्दन की त्रिज्या $0.05$ पर रुक जाता है, जहाँ सिरे अभी भी विभेदित हैं। यहाँ की सर्जरी पेरेलमैन की रचना का केवल एक सरल चित्रण है। मोटी गर्दन ($\varepsilon \gtrsim 0.5$) आज़माएँ: वह नहीं भिंचती, और पूरा गोला गोल हो जाता है।'
meanings:
- हर ऊबड़-खाबड़ गोले $b$ का अनुकोण गुणक, मीट्रिक $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$, सेल $i$ पर
- 'दोहराया गया $j$ ⇒ योग: गोल गोले का फ़्लक्स-रूप लाप्लासियन; इसके फ़्लक्स ध्रुवों पर शून्य हो जाते हैं'
- अनुकोण मीट्रिक की गाउसीय वक्रता; सतह पर रिच्ची प्रवाह $\partial_t g = -2Kg$ है
- 'कुल वक्रता: हर मीट्रिक के लिए ठीक $4\pi$ (विविक्त गाउस–बोने), हर चरण पर एक जाँच'
- सामान्यीकृत प्रवाह का माध्य वक्रता लक्ष्य; यह हर क्षेत्रफल को स्थिर रखता है
- 3-गोले $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$ की खंडीय वक्रताएँ, $-\psi_{ss}/\psi$ और $(1-\psi_s^2)/\psi^2$, जहाँ $\psi = e^u\sin x$
- एक भिन्नरूपता (गेज) पद जो मीट्रिक को अनुकोण रूप में रखता है; यह निर्देशांक बदलता है, ज्यामिति नहीं
- सबसे छोटे $S^2$ अनुप्रस्थ-काट की त्रिज्या; $\psi_\mathrm{neck}^2$ भिंचने तक लगभग बेलन की दर $2$ से घटता है
- उच्च वक्रता वाली गर्दन को काटकर प्रोफ़ाइल को स्पर्श करता गोल ढक्कन जोड़ना (पेरेलमैन की सर्जरी का सरल चित्रण)
labels:
  neck: डम्बल की प्रारंभिक गर्दन त्रिज्या $\varepsilon$
  t_surface: सतहों के लिए प्रवाह समय
  cells: ग्रिड सेल $N$
