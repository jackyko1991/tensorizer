source_hash: a7f6ff1f025f
title: 分散性の水の波
summary: 長い波が短い波を追い越す深水上の波束：$\omega = \sqrt{g k}$。各フーリエモードは位相を回すだけなので、任意の時刻の波束は1回の FFT、掛け算、1回の逆 FFT で得られ、すべての時刻について一度に計算できる。山は包絡線の中をその2倍の速さで通り抜ける。
notes: 線形の深水重力波（水深が波長よりはるかに大きく、表面張力なし、傾きが小さい）。$\omega \propto \sqrt k$ なので、群速度 $d\omega/dk$ は位相速度 $\omega/k$ のちょうど半分である：赤い山が緑の包絡線のピークを追い越し、前方で消え、後方で生まれた新しい山に置き換わる様子を見よう（赤い点は波長の整数倍だけ後ろへ跳ぶ）。長い波ほど速く進むので、波束はゆっくり広がり、前方は後方より波長が長くなる（チャープ）。FFT により箱は周期的になる。各モードは位相を回すだけなので、$\sum|\hat a_k|^2$（パーセバルの等式による波のエネルギー）は厳密に保存される。
meanings:
- 複素波束：ガウス包絡線 × $e^{ik_0x}$
- 初期波束のフーリエ振幅
- 各モードに対する深水波の分散関係
- ブロードキャストによる、すべての時刻での各モード（厳密、時間積分なし）
- 繰り返される $k$ ⇒ 和をとる：すべての時刻について実空間に戻す
labels:
  wavelength: 搬送波の波長 $2\pi/k_0$
  width: 波束の幅 $\sigma$
  t_max: シミュレーション時間
