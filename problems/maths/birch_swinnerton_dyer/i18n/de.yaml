source_hash: 52a00886e77c
title: 'Birch und Swinnerton-Dyer: Punkte modulo p zählen'
summary: Die Punkte von fünf elliptischen Kurven vom Rang 0 bis 4 über $\mathbb F_p$ für alle Primzahlen bis $X$ auf einmal zählen, zusehen, wie die Produkte $\prod_{p\le X} N_p/p$ wie $(\log X)^r$ wachsen, wie es Birch und Swinnerton-Dyer zuerst beobachteten, und $L(E, s)$ bei $s = 1$ berechnen, wo sie von einer Ordnung gleich dem Rang verschwindet. Die Vermutung, dass dies immer so ist, ist offen; bewiesen ist sie nur für analytischen Rang 0 und 1.
notes: 'Eine elliptische Kurve $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ über $\mathbb Q$ hat eine endlich erzeugte Gruppe rationaler Punkte $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ (Mordell 1922); der Rang $r$ ist schwer zu berechnen. Anfang der 1960er-Jahre zählten Birch und Swinnerton-Dyer auf dem Rechner EDSAC Punkte modulo Primzahlen und bemerkten, dass $\prod_{p \le X} N_p/p$ wie $(\log X)^r$ wächst: Mehr rationale Punkte erzwingen mehr Punkte modulo $p$. Sie vermuteten, dass die aus den $a_p$ gebildete Funktion $L(E, s)$ bei $s = 1$ von genau der Ordnung $r$ verschwindet, mit dem Leitkoeffizienten $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$. Es ist eines der Millennium-Preisprobleme des Clay-Instituts und offen. Bewiesen ist: Ist der analytische Rang 0 oder 1, so stimmt der Rang mit ihm überein und Ш ist endlich (Gross und Zagier 1986, Kolyvagin 1989), unter Verwendung der Modularität (Wiles, Taylor–Wiles 1995, Breuil–Conrad–Diamond–Taylor
  2001), die überhaupt erst die Fortsetzung von $L(E, s)$ bis $s = 1$ ermöglicht. Für analytischen Rang $\ge 2$ ist nichts Allgemeines bekannt. Die fünf Kurven sind die Kurven kleinsten Führers mit Rang 0 bis 4 (11a1, 37a1, 389a1, 5077a1 und 234446a1 in Cremonas Tabellen). Hier: Die Spuren erfüllen die Hasse-Schranke $|a_p| \le 2\sqrt p$; für 11a1 stimmen sie mit den Koeffizienten der Modulform $\eta(q)^2\eta(q^{11})^2$ überein (getestet); die Vorzeichen der Funktionalgleichung sind $\varepsilon = (-1)^r$; die erste nicht verschwindende Ableitung bei $s = 1$ ist für jede Kurve die $r$-te, und $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$ und $L''''''(E,1)/6 = 1.7318499\ldots$ stimmen mit der LMFDB überein. Für 11a1 geht die vollständige Formel auf: $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$. Eine numerische Nullstelle einer Ableitung ist ein Indiz, kein Beweis, dass sie verschwindet. Die Partialprodukte sind die
  ursprüngliche Heuristik: Goldfeld (1982) zeigte, dass $r$ der analytische Rang ist und die Riemannsche Vermutung für $L(E, s)$ gilt, falls sie sich tatsächlich wie $C(\log X)^r$ verhalten; ihre Konvergenz ist also selbst vermutet und langsam. Die Steigungen ordnen die Ränge 0 bis 3 bei $X = 2\times 10^4$ richtig, doch die Kurve vom Rang 4 bleibt bei $X = 3\times 10^4$ noch hinter ihrem Rang zurück. Die Sato–Tate-Verteilung von $a_p/2\sqrt p$, der Halbkreis $\frac{2}{\pi}\sqrt{1-x^2}$, ist für Kurven ohne komplexe Multiplikation ein Satz (Taylor und Mitarbeiter, 2008–2011).'
meanings:
- alle Kurven, alle Primzahlen eines Blocks und alle $x \in \mathbb F_p$ auf einmal (Horner, in jedem Schritt modulo $p$ reduziert)
- Legendre-Symbol aus einer Tabelle der Quadrate $y^2 \bmod p$; $\chi = 0$ für $v = 0$
- 'die Frobenius-Spur; Hasse: $|a_p| \le 2\sqrt p$'
- die Partialprodukte für alle $X$ auf einmal (nur gute Primzahlen)
- Steigung über $\sqrt{X} \le p \le X$; konvergiert sehr langsam
- Dirichlet-Koeffizienten über Multiplikativität, ein Schnitt mit fester Schrittweite pro Primzahlpotenz $q = p^k$
- 'wiederholtes $n$ ⇒ summiert: $F(t)$ an den Gauß–Legendre-Knoten $t = e^{u_m}$'
- alle Ableitungen bei $s = 1$ auf einmal; die erste von null verschiedene liefert den analytischen Rang
labels:
  x_max: Primzahlen bis $X$
