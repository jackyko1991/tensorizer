source_hash: a88c161966b6
title: 蒙特卡洛：用随机飞镖估计 $\pi$
summary: 向单位正方形随机投掷飞镖，数一数有多少落在四分之一圆内：这个比例会趋近 $\pi/4$。许多独立实验在一个 $(B, N)$ 张量中并排进行，展示蒙特卡洛的根本定律：误差只以 $1/\sqrt N$ 的速度缩小。布丰投针则提供第二种、来自 18 世纪的估计。
notes: 每个估计平均而言都正确但带有噪声，而噪声只以 $1/\sqrt N$ 下降：多一位正确数字需要一百倍的飞镖。这个速率与维度无关，因此蒙特卡洛是多变量积分的首选方法，从中子输运、伊辛模型到期权定价与医学剂量学中的光子路径皆是如此。灰色曲线是单次实验：每条都在游走，但都停留在 $\sigma_N$ 所定的带状范围内。固定的随机种子让每次运行都可复现；试着增加实验次数，看看离散程度如何更贴近理论。
meanings:
- 实验 $b$ 的第 $n$ 支飞镖、坐标 $i$，在 $[0, 1)$ 上均匀分布
- 重复的 $i$ ⇒ 求和：到角落的距离平方；飞镖落在四分之一圆内时为 1
- 累积和除以 $n$：每支飞镖之后、每个实验的估计值
- 各实验间的离散程度；理论值 $\sqrt{\pi(4-\pi)/n}$ 来自二项分布方差
- 布丰投针：以概率 $2\ell/(\pi d)$ 与直线相交，故 $\hat\pi = 2\ell N/(d\,\text{crossings})$
labels:
  n_darts: 每次实验的飞镖数 $N$
  n_experiments: 实验次数 $B$
  needle_length: 针长 $\ell/d$
