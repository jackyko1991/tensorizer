title: 'GW150914: the first gravitational-wave chirp'
category: astro
level: advanced
order: 7
tags: [shaw:2016, nobel:physics:2017, breakthrough:physics:2016]
summary: >
  Sixteen seconds of real LIGO strain from Hanford and Livingston, 14 September 2015. A Welch PSD, whitening and a
  band-pass bring out a chirp buried under noise a hundred times louder. A Q-transform map shows its frequency
  sweeping up to about 150 Hz, and a template bank of post-Newtonian inspirals, filtered in one batch, peaks at a
  chirp mass near $30\,M_\odot$. The ridge is fitted by autograd with $\dot f \propto M_c^{5/3} f^{11/3}$, and the
  Livingston signal leads Hanford's by about 7 ms.
animated: true
vector_form: '\frac{df}{dt} = \frac{96}{5}\,\pi^{8/3}\Big(\frac{G\mathcal M_c}{c^3}\Big)^{5/3} f^{11/3},\qquad \rho(t) = \Big|\,4\int_0^\infty \frac{\tilde d(f)\,\tilde h^*(f)}{S_n(f)}\,e^{2\pi i f t}\,df\,\Big|,\qquad \langle h|h\rangle = 1'
index_form: 'S_{dk} = \frac{2}{f_s\,w_nw_n}\,\big\langle |X_{dsk}|^2\big\rangle_s,\qquad \tilde h_{mk} = f_k^{-7/6}\,e^{-i(\Psi_{mk} - \pi/4)},\qquad z_{dmt} = 4\,\Delta f\sum_k \frac{\tilde d_{dk}\,\tilde h^*_{mk}}{S_{dk}}\,e^{2\pi i f_k t},\qquad \rho_{dm} = \max_t |z_{dmt}|'
