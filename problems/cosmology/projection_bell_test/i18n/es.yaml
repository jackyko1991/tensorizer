source_hash: 3a74544d7716
title: Pruebas de Bell de la carrera de proyección
summary: 'Una hipótesis especulativa, no física establecida: dos partículas entrelazadas son un único estado compartido $\Psi$ en $D$ dimensiones, y cada medición es una proyección seguida de la carrera del paso 1. Ejecutada conjuntamente sobre $\Psi$, como un único evento en el espacio completo, la carrera da exactamente el resultado cuántico $E = -\cos\theta$ y el valor CHSH $S = 2\sqrt2$. Ejecutada por separado sobre las coordenadas ocultas locales de cada parte, es un modelo de variables ocultas locales con $S\leq2$, que las pruebas de Bell sin lagunas descartan. Una carrera con más de una dimensión oculta por resultado viola la cota de Tsirelson y permite señales más rápidas que la luz.'
notes: 'Paso 5 de la hipótesis de proyección (véase la descripción de la serie), la hipótesis especulativa del autor, no física establecida. Pone a prueba los postulados P1 (proyección) y P2 (evento) del paso 1 (cosmology/projection_postulate) con el entrelazamiento. El paso 4 (cosmology/projection_singularity_fold) trata la geometría, y el paso 6 (cosmology/projection_telescope_tests) las observaciones. La dimensión $D$ del estado compartido queda abierta: es un parámetro, y ningún resultado depende de ella. Primero, la física conocida. El singlete da $E(a,b) = -a\cdot b = -\cos\theta$. Bell (1964) y Clauser, Horne, Shimony y Holt (1969) demostraron $S\leq2$ para cualquier modelo de variables ocultas locales, mientras que la mecánica cuántica alcanza la cota de Tsirelson $S = 2\sqrt2$. La hipótesis: hay un único $\Psi$ compartido (P0, P3); la medición de cada parte es una proyección más la carrera del paso 1, en la que ocurre el resultado con el mayor $\|P_k\Psi\|^2/E_k$, y $E_k$ es la
  energía en $m$ coordenadas complejas ocultas de $\Psi$. (i) Modelo conjunto: la carrera se ejecuta una sola vez sobre los cuatro resultados conjuntos, con pesos $\|(P^a_i\otimes P^b_j)\Psi\|^2$. No local en 3D, es un único evento en $D$ dimensiones. Con $m = 1$ (el único valor que el paso 1 dejó vivo) reproduce exactamente la mecánica cuántica: $E = -\cos\theta$ en forma cerrada hasta $10^{-15}$, y un Monte Carlo a partir de $\Psi$ en $\mathbb C^D$ dentro de la estadística. $S = 2\sqrt2$ en los ajustes óptimos, el máximo sobre 2000 ajustes aleatorios queda por debajo, y las marginales de Alice no dependen del ajuste de Bob (sin señalización). (ii) Modelo local: cada parte corre solo sobre sus propias energías ocultas y una dirección oculta $n$ fijada en la fuente, es decir, sobre los pesos $(1\pm a\cdot n)/2$. Es un modelo de variables ocultas locales, así que $S\leq2$ está garantizado. $m = 1$ da $E = -\cos\theta/3$ (máx $S\approx0.93$), y $m\to\infty$ es el propio modelo determinista
  de Bell $E = -(1-2\theta/\pi)$, que alcanza exactamente $S = 2$. Más allá de Born: una carrera conjunta con $m\neq1$ no es mecánica cuántica. Para $m > 1$ viola la cota de Tsirelson ($S = 3.85$ en $m = 3$, tendiendo al valor 4 de la caja PR). Para un estado parcialmente entrelazado hace que la estadística de Alice dependa del ajuste de Bob, lo cual es señalización más rápida que la luz ($dS/dm = 1.34$, señalización $\approx0.18\,|m-1|$). Así que $m = 1$ lo exige la causalidad relativista además de los datos de triple rendija. Datos (data/bell_tests.csv, cifras citadas de los resúmenes). Hensen et al. (Nature 526, 682, 2015): espines NV separados 1.3 km, $S = 2.42\pm0.20$, $p = 0.039$. Su segunda serie (Sci. Rep. 6, 30289, 2016): $S = 2.35\pm0.18$. Giustina et al. y Shalm et al. (Phys. Rev. Lett. 115, 250401 y 250402, 2015): fotones, desigualdad de CH–Eberhard, $p\leq3.74\times10^{-31}$ y $2.3\times10^{-7}$. Rosenfeld et al. (Phys. Rev. Lett. 119, 010402, 2017): átomos separados 398 m,
  $S = 2.221\pm0.033$. Storz et al. (Nature 617, 265, 2023): cúbits superconductores separados 30 m, $S = 2.0747\pm0.0033$, 22.6$\sigma$ por encima de 2. Veredicto: el modelo (ii), y con él toda versión local de la carrera, queda descartado. El modelo (i) concuerda con todas las pruebas, pero solo porque es la mecánica cuántica reescrita; no hace ninguna predicción nueva. La desviación que el paso 1 aún permite ($|m-1|\leq6\times10^{-3}$) desplazaría $S$ como mucho $8\times10^{-3}$. Eso es más que el $\sigma_S$ de Storz, pero los valores medidos de $S$ quedan muy por debajo de $2\sqrt2$ (visibilidad 0.73), y una visibilidad desconocida absorbe ese desplazamiento. Solo la forma de $E(\theta)$ (residuo $\leq1.5\times10^{-3}$) o una prueba directa de no señalización ($\leq10^{-3}$) podría detectarlo. Wikipedia: teorema de Bell, desigualdad CHSH.'
meanings:
- proyectores de espín a lo largo de vectores unitarios $n$, construidos con un einsum sobre las matrices de Pauli
- 'peso de cada resultado conjunto: se suman los índices de cúbit $x, y, u, v$'
- correlación, sumando los signos de resultado $s = (+1, -1)$
- la carrera conjunta sobre los cuatro resultados; la suma sobre $l$ (excepto $l = k$) es el producto sobre los demás resultados; $m = 1$ da $P = w$
- energías de los bloques ocultos leídas de muestras de $\Psi$ uniformes en la esfera de $\mathbb C^D$
- 'dirección oculta fijada en la fuente, tres coordenadas reales de $\Psi$: uniforme en $S^2$ para cualquier $D$'
- 'carreras locales: cada parte corre sobre sus propios pesos $(1\pm a\cdot n)/2$; se promedia sobre el $\nu$ compartido'
- valor CHSH, maximizado sobre cuál de los cuatro términos lleva el signo menos
labels:
  D: Dimensión total $D$ del estado compartido $\Psi$ (abierta)
  m_max: Mayor número de dimensiones ocultas por resultado $m$
  settings: Ajustes de medición aleatorios
  trials: Eventos de carrera por ángulo (Monte Carlo)
