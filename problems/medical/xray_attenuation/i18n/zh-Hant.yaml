source_hash: 9753ed59836b
title: X 射線衰減與影像對比
summary: X 射線穿過人體時呈指數衰減，$I = I_0\,e^{-\int\mu\,dl}$。由肺、軟組織、骨骼與碘顯影劑組成的胸腔假體以一次 einsum 逐條射線投影，說明為什麼骨骼在低能量時特別顯眼，以及真實 X 光管能譜如何隨深度硬化。
notes: 在對數空間中投影是可加的：$-\ln(I/I_0)$ 是各材料 $\mu\,L$ 的總和，所以單色影像是材料長度的線性映射。均勻平板每經過一個半值層 $\ln 2/\mu$，射束強度就減半。光電吸收大致按 $Z^3/E^3$ 增長，所以骨骼對比在 30–50 keV 時很大，在更高能量時減弱；碘在 33 keV 的 K 吸收邊以上吸收驟增，這正是它被用作顯影劑的原因。真實的 X 光管發出的是能譜：軟光子先被吸收，平均能量上升，有效 $\mu$ 隨深度下降（射束硬化）。簡化假設：筆直的平行射線、無散射、無檢測器響應，以及八個列表能量與取整的 $\mu$ 值。所有數值皆為近似，僅供教學，不可用於臨床。
meanings:
- one-hot 假體：像素 $(y, x)$ 為材料 $m$ 時取 1
- 射線在像素列 $y$ 內的路徑長
- 重複的 $y$ ⇒ 求和：射線 $x$ 穿過材料 $m$ 的長度
- 材料 $m$ 在能量 $E_e$ 下的線性衰減係數（1/cm）
- 重複的 $m$ ⇒ 求和：每個能量與每條射線的線積分 $\int \mu\, dl$
- X 光管能譜（Kramers 定律，鋁濾片），$\sum_e S_e = 1$
- 重複的 $e$ ⇒ 求和：多色射束的穿透比例
