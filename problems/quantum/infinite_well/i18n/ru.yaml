source_hash: f581627e3195
title: Частица в ящике
summary: Стационарное уравнение Шрёдингера на сетке становится матричной задачей на собственные значения $H_{ij}\psi_j = E\psi_i$. torch.linalg.eigh даёт стационарные состояния, а их суперпозиция эволюционирует, если приписать каждому фазу $e^{-iE_n t}$ и просуммировать через einsum.
notes: Единицы $\hbar = m = 1$. Точные энергии $E_n = n^2\pi^2/(2L^2)$; сетка воспроизводит нижние из них с точностью до малой доли процента. Каждое собственное состояние лишь набирает фазу, поэтому $\lvert c_n\rvert$ и норма не меняются — колыхание $\lvert\psi\rvert^2$ есть чистая интерференция состояний. Через время возрождения $T = 4L^2/\pi$ все фазы $e^{-iE_n t}$ снова равны 1, и начальное состояние точно восстанавливается. Бледные штриховые кривые — нижние стационарные состояния $\varphi_n(x)$.
meanings:
- 'матрица гамильтониана $-\tfrac12\,D2$ на $N$ внутренних точках сетки (стенки: $\psi = 0$)'
- 'конечно-разностная $d^2/dx^2$: $(\psi_{x-1} - 2\psi_x + \psi_{x+1})/dx^2$'
- энергии и собственные векторы (столбец $n$ — состояние $n$)
- проекция начального состояния на собственный базис (повторяющийся $x$ ⇒ суммирование)
- 'повторяющийся $n$ ⇒ суммирование: восстановление $\psi$ из компонент с фазами'
