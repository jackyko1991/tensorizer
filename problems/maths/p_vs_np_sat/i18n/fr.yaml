title: P vs NP et la transition de phase de 3-SAT
summary: 'Tout problème dont les solutions sont faciles à vérifier est-il aussi facile à résoudre ? C''est la question P vs NP, ouverte depuis 1971. Le 3-SAT aléatoire rend l''asymétrie concrète : vérifier une affectation proposée se résume à une collecte (gather) et deux réductions, tandis que la recherche exhaustive évalue les $2^n$ affectations d''un coup sous forme d''un unique tenseur de bits compactés, dont la taille double à chaque variable. Faire varier le rapport clauses/variables $\alpha$ révèle la transition de phase de satisfaisabilité vers $\alpha_c \approx 4.27$ et un coût de recherche maximal à l''intérieur de la fenêtre de transition.'
notes: 'P vs NP demande si tout problème de décision dont les réponses positives possèdent des certificats vérifiables en temps polynomial (la classe NP) peut aussi être résolu en temps polynomial (la classe P). Cook (1971) et Levin (1973) ont démontré que la satisfaisabilité est NP-complète : un algorithme polynomial pour 3-SAT en fournirait un pour tout problème de NP. On ignore s''il en existe un. La plupart des chercheurs s''attendent à P $\ne$ NP, mais il n''y a aucune preuve, et des barrières connues (relativisation, preuves naturelles, algébrisation) excluent des familles entières de stratégies de preuve. La question fait partie des sept problèmes du prix du millénaire de l''Institut Clay et reste ouverte. Ce programme ne démontre rien à son sujet : la recherche exhaustive n''est que l''algorithme évident, et les meilleurs algorithmes connus pour 3-SAT restent exponentiels (environ $1.307^n$ pour PPSZ). Ce qu''il montre, c''est l''asymétrie. Le vérificateur se réduit à une collecte
  plus un OU et un ET, soit un travail en $O(M)$. La recherche construit la table de vérité complète, un bit par affectation, 32 par entier, de sorte que le tenseur compte $2^n$ bits et que son temps double à chaque variable (en bas à droite ; pour de petits $n$, les coûts fixes dominent). Le 3-SAT aléatoire avec $M = \alpha n$ clauses présente un seuil abrupt : Friedgut (1999) a démontré que la transition devient abrupte lorsque $n \to \infty$, la physique statistique (Mézard, Parisi et Zecchina 2002) prédit $\alpha_c \approx 4.267$, et Ding, Sly et Sun (2015) ont démontré le seuil prédit pour $k$-SAT avec $k$ grand. Pour $k = 3$, la valeur 4.267 reste une conjecture ; ce qui est démontré, c''est que les formules aléatoires sont satisfaisables avec grande probabilité en dessous de $\alpha = 3.52$ et insatisfaisables au-dessus de 4.49. Pour de petits $n$, le passage à 50 % se situe au-dessus de 4.27 et descend lorsque $n$ augmente (effets de taille finie). Les tests vérifient que le vérificateur
  concorde avec la force brute sur chaque affectation, qu''une clause élimine exactement $1/8$ de toutes les affectations, que le nombre moyen de solutions est égal au premier moment $2^n (7/8)^M$, que $P_{\mathrm{sat}}$ est monotone et s''effondre près du seuil, et que la fenêtre se rétrécit avec $n$. Le panneau du coût de recherche compte les nœuds d''une recherche en profondeur avec retour arrière qui fixe $x_0, x_1, \ldots$ successivement et revient en arrière dès qu''une clause entièrement affectée est fausse. En dessous du seuil, elle trouve vite une solution ; bien au-dessus, de courtes contradictions élaguent l''arbre tôt ; et les formules les plus difficiles se trouvent dans la fenêtre de transition (pour cette recherche simple à $n = 16$, vers $\alpha \approx 5$ ; les solveurs avec propagation unitaire culminent vers 4.3). Essayez davantage de variables pour voir les courbes s''affiner, ou davantage de formules pour des courbes plus lisses.'
meanings:
- $B$ formules de $M$ clauses portant sur 3 variables distinctes, chacune niée avec probabilité $\frac12$
- tous les littéraux de toutes les formules en une seule collecte
- 'le vérificateur : $3M$ consultations, polynomial en $n$'
- table de vérité de $x_j$ sur les $2^n$ affectations, 32 affectations par entier
- une clause évaluée sur les $2^n$ affectations par OU bit à bit (un XOR avec des uns partout réalise la négation)
- ET des clauses une à une ; le niveau $d$ ne retient que les clauses dont les variables figurent parmi les $d$ premières, ce qui donne l'arbre de retour arrière
- des formules emboîtées (préfixes d'une même liste de clauses) donnent tous les $\alpha = M/n$ en une passe et rendent $P_{\mathrm{sat}}$ décroissante au sens large
labels:
  n_max: Variables $n$ (taille maximale)
  instances: Formules par taille
  seed: Graine aléatoire
