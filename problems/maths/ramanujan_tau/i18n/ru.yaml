title: Функция Рамануджана $\tau(n)$ и закон Сато–Тейта
summary: Разложите модулярную форму-дискриминант $\Delta(q) = q\prod_n (1-q^n)^{24}$ в тензорный степенной ряд и получите функцию Рамануджана $\tau(n)$ — точно до $n \sim 10^5$–$10^6$ через вычеты по набору простых модулей. Проверьте, что $\tau$ мультипликативна и подчиняется рекурсии Гекке, что $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, что $|\tau(p)| \le 2p^{11/2}$ (теорема Делиня, 1974), и посмотрите, как нормированные значения $\tau(p)/2p^{11/2}$ заполняют полукруг Сато–Тейта (для $\Delta$ это теорема с 2011 года). Программа проверяет эти теоремы численно.
notes: 'Рамануджан (1916) изучал коэффициенты $\tau(n)$ формы $\Delta(q) = q\prod(1-q^n)^{24}$ — единственной нормированной параболической формы веса 12 — и высказал три гипотезы: $\tau$ мультипликативна, удовлетворяет соотношению $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$, и $|\tau(p)| \le 2p^{11/2}$. Морделл доказал первые две в 1917 году — это был ранний пример того, что позже стало теорией Гекке. Оценка — это гипотеза Рамануджана для $\Delta$ (в общем случае гипотеза Рамануджана–Петерссона): Делинь доказал её в 1974 году как следствие своего доказательства гипотез Вейля, так что это теорема. Рамануджан также доказал сравнение $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, которое возникает из того, что $691$ делит числитель числа Бернулли $B_{12}$. Если записать $\tau(p) = 2p^{11/2}\cos\theta_p$, то гипотеза Сато–Тейта утверждает, что углы $\theta_p$ распределены по закону $\frac{2}{\pi}\sin^2\theta\,d\theta$, то есть $x_p = \cos\theta_p$ следует полукругу $\frac{2}{\pi}\sqrt{1-x^2}$
  с моментами $1/4$, $1/8$, $5/64$ (числа Каталана, делённые на степени 4). Для $\Delta$ это доказали Барнет-Лэмб, Джерати, Харрис и Тейлор (2011). Гистограмма сходится медленно, как выборка независимых испытаний. Гипотеза Лемера о том, что $\tau(n)$ никогда не равна нулю, по-прежнему открыта; она проверена далеко за пределами этого диапазона, и программа тоже не находит ни одного нуля. Численные детали: $\tau(n)$ растёт как $n^{11/2}$, поэтому БПФ всего ряда в float64 имеет абсолютную погрешность около $10^{-16}$, умноженного на наибольший коэффициент, что полностью заглушает $\tau(2) = -24$ (это показывает тест). Вместо этого ряд вычисляется точно сразу по модулю примерно десяти простых чисел, по одной строке тензора на каждое, и восстанавливается по китайской теореме об остатках. Шутка: Рамануджан заметил, что… (Ramanujan noticed that…) $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$; что $1729 = 1^3 + 12^3 = 9^3 + 10^3$; и, лишь в регуляризованном смысле, что $1 + 2 + 3 + \dots$ «$= -1/12$»:
  ряд расходится, а $-1/12$ — это значение $\zeta(-1)$ аналитически продолженной дзета-функции.'
meanings:
- 'тождество Якоби $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$: лишь $O(\sqrt N)$ ненулевых коэффициентов'
- 'повторяющийся $j$ ⇒ суммирование: произведение усечённых рядов как тёплицева матрица, умноженная на вектор, точно в int64 при малых $N$'
- три возведения в квадрат дают 24-ю степень
- те же произведения через БПФ сразу для $M$ простых модулей, с округлением до точных вычетов (каждое $m^2 N \le 2^{42}$)
- китайская теорема об остатках со сбалансированными цифрами, чтобы отрицательные значения получались отрицательными
- все взаимно простые пары $1 < m < n$ с $mn \le 600$ сразу
- каждая пара делителей $(d, j)$ с $dj \le N$ добавляет $d^{11}$ к $n = dj$
- нормированные значения в простых числах, лежащие в $[-1, 1]$ по теореме Делиня
labels:
  n_max: Простые числа и $\tau(n)$ до $N$
