title: बॉक्स में कण
summary: ग्रिड पर समय-स्वतंत्र श्रोडिंगर समीकरण एक आव्यूह आइगेनमान समस्या $H_{ij}\psi_j = E\psi_i$ बन जाता है। torch.linalg.eigh स्थिर अवस्थाएँ देता है, और उनका अध्यारोपण हर एक के साथ कला $e^{-iE_n t}$ जोड़कर और einsum से योग करके विकसित होता है।
notes: मात्रक $\hbar = m = 1$। सटीक ऊर्जाएँ $E_n = n^2\pi^2/(2L^2)$ हैं; ग्रिड निम्नतम ऊर्जाओं को एक प्रतिशत के छोटे अंश तक पुनः उत्पन्न करता है। हर आइगेन-अवस्था केवल एक कला प्राप्त करती है, इसलिए $\lvert c_n\rvert$ और मानक (norm) कभी नहीं बदलते — $\lvert\psi\rvert^2$ का डोलना अवस्थाओं के बीच शुद्ध व्यतिकरण है। पुनरुद्भव काल (revival time) $T = 4L^2/\pi$ के बाद हर कला $e^{-iE_n t}$ फिर 1 हो जाती है और प्रारंभिक अवस्था ठीक-ठीक लौट आती है। हल्के धराशायी वक्र निम्नतम स्थिर अवस्थाएँ $\varphi_n(x)$ हैं।
meanings:
- '$N$ आंतरिक ग्रिड बिंदुओं पर हैमिल्टनियन आव्यूह $-\tfrac12\,D2$ (दीवारें: $\psi = 0$)'
- 'परिमित-अंतर $d^2/dx^2$: $(\psi_{x-1} - 2\psi_x + \psi_{x+1})/dx^2$'
- ऊर्जाएँ और आइगेन-सदिश (स्तंभ $n$ अवस्था $n$ है)
- प्रारंभिक अवस्था का आइगेन-आधार पर प्रक्षेपण (दोहराया गया $x$ ⇒ योग)
- 'दोहराया गया $n$ ⇒ योग: कला-युक्त घटकों से $\psi$ का पुनर्निर्माण'
labels:
  initial: प्रारंभिक अवस्था
