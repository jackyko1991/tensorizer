title: 整数計画法による粒子飛跡の探索
summary: シミュレーションされた HL-LHC 衝突（TrackML チャレンジ、CC BY 4.0）の実際のヒットを、整数線形計画によって飛跡へとつなぎます。曲率と極角が整合するヒットの三つ組を選び、各ヒットは高々 1 回しか使いません。私たちのテンソル版 PDLP（リスタート付き主双対ハイブリッド勾配法。OR-Tools と cuOpt の内部で使われている LP 手法）が疎テンソル上で LP 緩和をライブで解き、その後丸めと修復を行います。これを手書きのハンガリアン法（Kuhn–Munkres）のベースライン、および HiGHS、Gurobi、scipy のオフライン実行と比較します。比較項目は目的関数値のギャップ、効率、偽飛跡率、公式 TrackML スコア、そして実行時間のスケーリング $t \propto N^k$ です。
notes: '位置づけ: これはツールの比較であり、未解決問題ではありません。この ILP は集合パッキング問題（一般には NP 困難）です。PDLP は一次の LP 手法であり、丸めによって得られるのはヒューリスティックな整数解で、最適性が保証された解ではありません。そのため、厳密な最適解とのギャップを常に報告します。PDLP の双対界は、厳密ソルバーがなくても保証付きの上界を与えます。手法. 候補セグメントは、ビームラインから出た $p_T \ge p_{T,\min}$ の飛跡が結び得る、隣接層上のヒット同士をつなぎます。三つ組は共有する中間ヒットを介して 2 つのセグメントをつなぎ、スコア $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ を持ちます（$s_t > 0$ のものだけを残します）。ILP は三つ組 $x_t$ とセグメント $y_e$ を選びます。各ヒットに入る選択セグメントと出る選択セグメントはそれぞれ高々 1 本なので、飛跡は鎖になります。選ばれたセグメントは各側で高々 1 つの選ばれた三つ組へと続き、各セグメントにはコスト $\lambda = 0.1$ がかかります。その LP 緩和（$0 \le x, y \le 1$）は私たちの PDLP（Applegate et al. 2021）で解きます。Ruiz スケーリング付きの PDHG に、KKT 条件に基づく平均へのリスタートと主重みの更新を組み合わせたもので、torch.sparse で書かれているため CPU でも CUDA でも動きます。ハンガリアン法のベースラインは、層のペアごとに厳密な線形割当問題を 1 回ずつ解きます（まず中央のペア、次に内側と外側へ。三つ組のコストはそこまでに作られた鎖に基づきます）。これは多項式時間で厳密に解ける二部マッチングですが、一度に 1 つの層ペアしか決めないのに対し、ILP は鎖全体を大域的に評価します。そのため飛跡が異なるのです。データ. TrackML Particle Tracking Challenge（CERN / Kaggle 2018）の訓練イベント 1000（パイルアップ衝突 200 回）。Zenodo レコード 4730167、doi:10.5281/zenodo.4730167、ライセンス
  CC BY 4.0（Salzburger、Innocente、Vlimant、Rousseau et al.）。ピクセルバレル（volume 8、4 層）かつ $|\eta| < 1$ に絞り込んでおり、11 519 ヒット、2 452 粒子、ノイズ 6% で、公式のヒットごとの重みも含みます。オフラインのベンチマーク（data/solver_benchmark.csv）は AMD Ryzen 5 5600G（1 スレッド）上で実施しました。scipy 1.18.1 経由の HiGHS（milp、linprog）、サイズ制限付きライセンスで gurobipy 経由の Gurobi 13（変数・制約とも最大 2000 なので $\Delta\phi \le 30°$ のみ）、scipy の linear_sum_assignment、そして CPU と NVIDIA GTX 1080 Ti 上の私たちの PDLP です。NVIDIA cuOpt 26.10 は WSL にインストールしましたが実行できませんでした。そのカーネルは計算能力 7.0（Volta）以降向けにビルドされており、1080 Ti は 6.1 だからです（cudaErrorNoKernelImageForDevice）。そのため cuOpt は除外し、数値はありません。引用した最先端の結果は data/trackml_sota.csv にあります。結論. 8 つのウェッジすべて（5° から 360°、151 から 11 519 ヒット）で LP 緩和はタイトでした。HiGHS の LP 最適値は MILP 最適値と $10^{-13}$ の精度で一致します。私たちの PDLP と修復は毎回同じ最適値に到達し（ギャップは $10^{-9}$ 未満）、選んだ三つ組は HiGHS と Gurobi が選んだものと完全に同じでした（相違 0）。これは経験的な結果であり保証ではありません。集合パッキングは NP 困難であり、ここでは 4 層の鎖構造が LP をタイトに保っているのです。スコアが連続値なので厳密な同点はまず起こらず、最適値に達したソルバー同士は一致します。実行の途中では PDLP の値のおよそ 3 分の 1 が分数値で、その多くは競合する三つ組がほぼ同点となる箇所（例えば重なり合うモジュール内の二重ヒット）で
  $\tfrac12$ 付近にあります。これらは PDLP が収束するにつれて落ち着きます。ハンガリアン法の鎖は最適値より 0 から 2.2% 低く（5 から 651 個の三つ組が異なる）、scipy の割当目的関数値と完全に一致します（私たちのハンガリアン法の検証）。バレル全体の部分集合（360°）では、ILP ソルバーの効率 93.1%、偽飛跡率 13.0% に対し、ハンガリアン法は 90.9% と 16.2%、TrackML スコアは 0.495 対 0.482 です。再構成可能な粒子を完璧に追跡するトラッカーならここで 0.618 になります。引用したイベント全体での最先端は 0.88 から 0.94 です（Mikado は 0.56 s で 0.944）。$N \ge 1000$ ヒットでのスケーリングは、HiGHS MILP $N^{1.14}$、HiGHS LP $N^{1.01}$、私たちの PDLP は CPU で $N^{0.92}$、GPU で $N^{0.36}$（10 000 変数でもまだ起動オーバーヘッドが支配的なので、1080 Ti はまだ速くありません）、私たちのハンガリアン法 $N^{2.14}$（最悪の場合 $O(n^3)$。疎でゲートされたコストにより増加道が短く保たれます）、scipy $N^{1.57}$ です。Gurobi がサイズ制限に収まるのは 860 ヒットまでです（その範囲で $N^{1.04}$）。この規模では HiGHS は PDLP と同等の速さで、一次法が有利になるのはずっと大きな LP です。小さなウェッジではハンガリアン法の方がわずかに多くの粒子を見つけます（30° で 97.4% 対 94.8%）。ILP の目的関数は代理指標であり、物理的な評価指標ではないのです。注意点. 私たちのインスタンスは 4 層のバレルのウェッジなので、飛跡のヒットは高々 4 個でエンドキャップもありません。チャレンジのイベント全体より易しく、性質も異なります。TrackML スコアの比較はあくまで目安であり、同条件の比較ではありません。部分集合のスコア重みの約 40% は、$p_T$ カットを下回る粒子や、カット内で 3 層未満しか通らない粒子に乗っています。また私たちの時間は 10 分の 1 イベント分であり、読み込みと候補の構築は含みません。実際のトラッカー（ACTS
  や各実験独自のもの）は組合せ的カルマンフィルタを使い、グラフニューラルネットワーク（Exa.TrkX）が主要な機械学習のアプローチです。イベントごとに MILP を解く人はいません。'
meanings:
- 4 層のピクセルバレル上の実際の TrackML ヒットを $\Delta\phi$ のウェッジに絞り込んだもの：問題の規模
- 隣接層上のヒットのペアで、$|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ かつ $|z_0| \le 150$ mm を満たすもの。全ペアを一度に処理
- ビームラインと両方のヒットを通る円の曲率
- 三つ組は中間ヒットを共有する。らせんは両半分で同じ $\kappa$ と $\theta$ を持つので、$s_t$ はそのずれとともに下がる
- ヒットの排他性の行（入るセグメント 1 本、出るセグメント 1 本）と連続性の行。$v$ の繰り返し ⇒ すべての積で和をとる
- Ruiz スケーリングした LP 上の PDHG に平均化、リスタート、主重みを組み合わせる。1 反復あたり疎行列–ベクトル積 2 回
- セグメントを LP 値で順位付けし、衝突のないものを並列ラウンドで採用し、スコアよりコストが大きい鎖の端を刈り込む
- ポテンシャル付き Kuhn–Munkres：層ペアごとに厳密な線形割当を 1 回行い、それらをつないで飛跡にする
- 公式 TrackML スコア：ある粒子のヒットの > 50% を含み、かつ > 50% がその粒子のヒットである飛跡上のヒットの重みの総和
labels:
  dphi: ウェッジ幅 $\Delta\phi$（問題の規模）
  pt_min: 最小横運動量 $p_{T,\min}$
  max_iter: PDLP の最大反復回数
  digits: PDLP の目標精度 $10^{-k}$、$k$ =
  check: リスタート判定の間隔となる反復回数（各 1 フレーム）
