title: धीमी-लुढ़कन स्फीति और (n_s, r) तल
summary: 'पाँच इन्फ़्लेटॉन विभव ($m^2\phi^2$, $\lambda\phi^4$, स्टारोबिंस्की $R^2$, प्राकृतिक स्फीति, एक चतुर्घाती हिलटॉप) एक ही बैच टेंसर में फ़्रीडमान और क्लाइन–गॉर्डन समीकरणों के अनुसार लुढ़कते हैं, जिसमें e-फ़ोल्ड की संख्या $N = \ln a$ घड़ी का काम करती है। धीमी-लुढ़कन प्राचल $\epsilon$, $\eta$ और $N_* = 50$–$60$ पर पूर्वानुमान $n_s$ और $r$ को सटीक पृष्ठभूमि हल से जाँचा जाता है और Planck 2018 तथा BICEP/Keck 2021 के सामने रखा जाता है: $m^2\phi^2$ और $\lambda\phi^4$ अस्वीकृत होते हैं, स्टारोबिंस्की भीतर आता है। स्फीति प्रारंभिक स्थितियों की प्रमुख व्याख्या है, पर इसकी पुष्टि नहीं हुई है: आदिम B-मोड अभी तक संसूचित नहीं हुए हैं।'
notes: 'इकाइयाँ: समानीत प्लांक द्रव्यमान $M_\mathrm{pl} = 1$। समीकरणों को $N = \ln a$ को समय मानकर, $\psi = d\phi/dN$ और $\epsilon_H = \psi^2/2$ के साथ लिखने पर $d\psi/dN = -(3-\epsilon_H)(\psi + V''/V)$ और $H^2 = V/(3-\epsilon_H)$ मिलते हैं, इसलिए केवल $V''/V$ मायने रखता है और हर विभव को ऊँचाई 1 के साथ खींचा जाता है (फिर आयाम $A_s = 2.1\times10^{-9}$ ऊर्जा पैमाना तय करता है, जो $V_*^{1/4}$ के रूप में मुद्रित होता है, अधिकांश मॉडलों के लिए लगभग $10^{16}$ GeV)। हर क्षेत्र अपने अंत से लगभग 68 e-फ़ोल्ड पहले, पाठ्यपुस्तकीय धीमी-लुढ़कन गणना से तय बिंदु पर, धीमी-लुढ़कन वेग $\psi = -V''/V$ के साथ शुरू होता है; परीक्षण $m^2\phi^2$ को बहुत भिन्न वेगों से शुरू करता है और पाता है कि सभी कुछ e-फ़ोल्ड के भीतर एक ही वक्र पर आ जाते हैं: धीमी लुढ़कन एक आकर्षक (attractor) है। स्फीति वहाँ समाप्त होती है जहाँ $\epsilon_H = 1$। पूर्वानुमान दो बार निकाले जाते हैं: विभव से प्रथम कोटि में ($n_s = 1 - 6\epsilon_V + 2\eta_V$, $r = 16\epsilon_V$, × चिह्न) और संख्यात्मक पृष्ठभूमि के हबल-प्रवाह प्राचलों $\epsilon_{1,2,3}$
  से द्वितीय कोटि में (Stewart and Lyth 1993; Schwarz, Terrero-Escalante and García 2001; बिंदु); ये $O(\epsilon^2)$ से भिन्न होते हैं, $n_s$ में कुछ $10^{-4}$। पूर्ण मोड-दर-मोड मुखानोव–सासाकी हल यहाँ नहीं किया गया है। $N_* = 55$ पर परिणाम: $m^2\phi^2$ देता है $n_s \approx 1 - 2/N_*$, $r \approx 8/N_* \approx 0.14$; $\lambda\phi^4$ देता है $r \approx 0.29$ और बहुत अधिक लाल $n_s$; स्टारोबिंस्की देता है $n_s \approx 0.965$, $r \approx 12/N_*^2 \approx 0.004$; प्राकृतिक स्फीति ($f = 7$) देती है $r \approx 0.08$, सीमा से ऊपर; चतुर्घाती हिलटॉप ($\mu = 15$) भीतर आता है। प्रेक्षणात्मक क्षेत्र एक बॉक्स के रूप में दिखाया गया है (Planck 2018 $n_s = 0.9649 \pm 0.0042$, 68 % पर, TT,TE,EE+lowE+lensing; BICEP/Keck 2021 $r_{0.05} < 0.036$, 95 % पर), न कि प्रकाशित द्वि-आयामी कंटूर, जो थोड़े झुके हुए हैं और डेटा संयोजन पर निर्भर करते हैं। ईमानदार स्थिति: स्फीति समतलता, क्षितिज समस्या और लगभग पैमाना-अपरिवर्ती, गाउसीय, रुद्धोष्म उतार-चढ़ाव की व्याख्या करती है, और $n_s < 1$ का पूर्वानुमान मापे जाने से पहले
  किया गया था; लेकिन प्रतिद्वंद्वी विचार भी हैं (बाउंसिंग और एक्पायरोटिक मॉडल), इन्फ़्लेटॉन की पहचान नहीं हुई है, और निर्णायक प्रमाण, गुरुत्वीय तरंगों से आदिम B-मोड ध्रुवण, संसूचित नहीं हुआ है (BICEP2 का 2014 का दावा आकाशगंगीय धूल निकला)। $N_*$ को 50 और 60 के बीच आज़माएँ (यह इस पर निर्भर करता है कि ब्रह्मांड का पुनःतापन कैसे हुआ), या $f$ और $\mu$ बदलें: $N_* = 55$ पर प्राकृतिक स्फीति कभी बॉक्स तक नहीं पहुँचती, क्योंकि $f$ घटाने से $r$ नीचे आता है पर $n_s$ बहुत अधिक लाल हो जाता है ($f = 5$: $n_s \approx 0.950$, $r \approx 0.04$)।'
meanings:
- 'वन-हॉट पंक्ति: क्षेत्र $b$ विभव $p$ का उपयोग करता है'
- हर क्षेत्र पर मूल्यांकित पाँच विभव आकार
- 'दोहराया गया $p$ ⇒ योग: हर क्षेत्र का अपना विभव'
- क्षेत्र और $d\phi/dN$, e-फ़ोल्ड में RK4 द्वारा साथ-साथ आगे बढ़ाए गए
- 'पृष्ठभूमि को केवल इसी की आवश्यकता है: $V$ की ऊँचाई निरस्त हो जाती है'
- ऑटोग्रैड से $V'$ और $V''$
- जहाँ $\epsilon_H$ 1 को पार करता है, अर्थात $\ddot a$ का चिह्न बदलता है
- अंत से $N_*$ e-फ़ोल्ड पहले हबल-प्रवाह प्राचल, एक ही gather से
- सटीक पृष्ठभूमि से द्वितीय-कोटि पूर्वानुमान
labels:
  N_star: अंत से पहले पिवट e-फ़ोल्ड $N_*$
  f: प्राकृतिक स्फीति पैमाना $f$
  mu: हिलटॉप चौड़ाई $\mu$
