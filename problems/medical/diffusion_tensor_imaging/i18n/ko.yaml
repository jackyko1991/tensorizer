source_hash: 27367fbd090e
title: '확산 텐서 영상: 신경 섬유 지도 그리기'
summary: 물은 축삭을 가로지르는 방향보다 축삭을 따라 더 빨리 확산하므로, 각 복셀에는 확산 텐서 $D_{ij}$가 있습니다. 스테이스칼–태너 신호 $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$는 복셀과 경사 방향에 대한 einsum 하나입니다. 로그 신호를 배치 최소제곱으로 맞추면 $D_{ij}$가 복원되고, 그 고유분해로 평균 확산도, 분획 이방성, 섬유 방향을 얻으며, RK2로 그 방향을 따라가면 신경 다발이 추적됩니다(트랙토그래피).
notes: 확산도는 $10^{-3}\,\mathrm{mm^2/s}$, $b$는 $\mathrm{s/mm^2}$ 단위입니다. 다발에서는 대략 $\lambda_\parallel = 1.7$, $\lambda_\perp = 0.3$(FA ≈ 0.8), 자유수(뇌척수액)는 3.0, 회색질은 0.8입니다. 교육용 근삿값이며 임상용이 아닙니다. 잡음은 라이스 분포(복소 신호의 크기)를 따르므로, 잡음이 있는 피팅은 등방성 영역에서 FA를 과대평가합니다. 두 다발이 교차하는 곳에서는 텐서 하나가 그 평균, 즉 FA가 낮은 납작한(평면형) 텐서만 나타낼 수 있어서, 그곳으로 들어온 경로는 멈추거나 다른 다발로 잘못 꺾일 수 있습니다. 이는 다중 섬유 모델이 해결하려는 DTI의 고전적 한계입니다. 각 타원은 피팅된 텐서의 평면 내 모양을 보여 줍니다. 유선은 시드 점에서 출발해 쌍선형 보간된 텐서장의 주 고유벡터를 중점(RK2) 규칙으로 따라가다가 FA가 0.2 아래로 떨어지면 멈춥니다. 잡음을 늘리거나, 경사 방향 수를 줄이거나, $b$를 줄여 보세요.
meanings:
- 반구 위에 퍼진 단위 확산 경사 방향
- '각 복셀의 참 확산 텐서: 다발 $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$, 등방성인 뇌척수액과 회색질'
- '반복된 $i, j$ ⇒ 합: 각 복셀과 각 방향의 확산 강조 신호'
- 행 $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$. 그러면 $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$
- 텐서의 서로 다른 여섯 성분을 모든 복셀에 대해 한꺼번에 최소제곱 피팅
- 고윳값과 고유벡터. 가장 큰 고윳값의 고유벡터가 섬유 방향을 가리킴
- 평균 확산도(대각합/3)와 분획 이방성(0은 등방성, 1은 단일 방향)
labels:
  b: 확산 강조 $b$
  n_dirs: 경사 방향 수
  noise: 잡음 수준 $\sigma/S_0$
  size: 한 변의 복셀 수
