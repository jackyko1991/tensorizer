source_hash: 3a74544d7716
title: Bell-Tests des Projektionswettlaufs
summary: 'Eine spekulative Hypothese, keine etablierte Physik: Zwei verschränkte Teilchen sind ein einziger gemeinsamer Zustand $\Psi$ in $D$ Dimensionen, und jede Messung ist eine Projektion, gefolgt vom Wettlauf aus Schritt 1. Gemeinsam auf $\Psi$ ausgeführt, als ein einziges Ereignis im vollen Raum, liefert der Wettlauf exakt das quantenmechanische $E = -\cos\theta$ und den CHSH-Wert $S = 2\sqrt2$. Getrennt auf den lokalen verborgenen Koordinaten jeder Partei ausgeführt, ist er ein lokales Modell verborgener Variablen mit $S\leq2$, das schlupflochfreie Bell-Tests ausschließen. Ein Wettlauf mit mehr als einer verborgenen Dimension pro Ergebnis verletzt die Tsirelson-Schranke und erlaubt überlichtschnelle Signalübertragung.'
notes: 'Schritt 5 der Projektionshypothese (siehe die Beschreibung der Serie), der spekulativen Hypothese des Autors, keine etablierte Physik. Er prüft die Postulate P1 (Projektion) und P2 (Ereignis) aus Schritt 1 (cosmology/projection_postulate) an der Verschränkung. Schritt 4 (cosmology/projection_singularity_fold) behandelt die Geometrie, Schritt 6 (cosmology/projection_telescope_tests) die Beobachtungen. Die Dimension $D$ des gemeinsamen Zustands bleibt offen: Sie ist ein Parameter, und kein Ergebnis hängt von ihr ab. Zuerst die bekannte Physik. Das Singulett liefert $E(a,b) = -a\cdot b = -\cos\theta$. Bell (1964) sowie Clauser, Horne, Shimony und Holt (1969) bewiesen $S\leq2$ für jedes lokale Modell verborgener Variablen, während die Quantenmechanik die Tsirelson-Schranke $S = 2\sqrt2$ erreicht. Die Hypothese: Es gibt ein einziges gemeinsames $\Psi$ (P0, P3); die Messung jeder Partei ist eine Projektion plus der Wettlauf aus Schritt 1, bei dem das Ergebnis mit dem größten $\|P_k\Psi\|^2/E_k$
  eintritt und $E_k$ die Energie in $m$ verborgenen komplexen Koordinaten von $\Psi$ ist. (i) Gemeinsames Modell: Der Wettlauf läuft einmal über die vier gemeinsamen Ergebnisse, mit den Gewichten $\|(P^a_i\otimes P^b_j)\Psi\|^2$. In 3D nichtlokal, ist er ein einziges Ereignis in $D$ Dimensionen. Mit $m = 1$ (dem einzigen Wert, den Schritt 1 übrig gelassen hat) reproduziert er die Quantenmechanik exakt: $E = -\cos\theta$ in geschlossener Form auf $10^{-15}$ genau, und ein Monte Carlo aus $\Psi$ in $\mathbb C^D$ innerhalb der Statistik. $S = 2\sqrt2$ bei den optimalen Einstellungen, das Maximum über 2000 zufällige Einstellungen bleibt darunter, und Alices Randverteilungen hängen nicht von Bobs Einstellung ab (keine Signalübertragung). (ii) Lokales Modell: Jede Partei führt den Wettlauf nur auf ihren eigenen verborgenen Energien und einer an der Quelle festgelegten verborgenen Richtung $n$ aus, d. h. auf den Gewichten $(1\pm a\cdot n)/2$. Das ist ein lokales Modell verborgener Variablen, also
  ist $S\leq2$ garantiert. $m = 1$ ergibt $E = -\cos\theta/3$ (max $S\approx0.93$), und $m\to\infty$ ist Bells eigenes deterministisches Modell $E = -(1-2\theta/\pi)$, das genau $S = 2$ erreicht. Jenseits von Born: Ein gemeinsamer Wettlauf mit $m\neq1$ ist keine Quantenmechanik. Für $m > 1$ verletzt er die Tsirelson-Schranke ($S = 3.85$ bei $m = 3$, gegen den PR-Box-Wert 4 strebend). Für einen teilweise verschränkten Zustand lässt er Alices Statistik von Bobs Einstellung abhängen, was überlichtschnelle Signalübertragung ist ($dS/dm = 1.34$, Signal $\approx0.18\,|m-1|$). Also wird $m = 1$ sowohl von der relativistischen Kausalität als auch von den Dreifachspalt-Daten verlangt. Daten (data/bell_tests.csv, zitierte Zahlen aus den Abstracts). Hensen et al. (Nature 526, 682, 2015): NV-Spins in 1.3 km Abstand, $S = 2.42\pm0.20$, $p = 0.039$. Ihr zweiter Durchlauf (Sci. Rep. 6, 30289, 2016): $S = 2.35\pm0.18$. Giustina et al. und Shalm et al. (Phys. Rev. Lett. 115, 250401 und 250402, 2015): Photonen,
  CH–Eberhard-Ungleichung, $p\leq3.74\times10^{-31}$ und $2.3\times10^{-7}$. Rosenfeld et al. (Phys. Rev. Lett. 119, 010402, 2017): Atome in 398 m Abstand, $S = 2.221\pm0.033$. Storz et al. (Nature 617, 265, 2023): supraleitende Qubits in 30 m Abstand, $S = 2.0747\pm0.0033$, 22.6$\sigma$ über 2. Urteil: Modell (ii) und mit ihm jede lokale Version des Wettlaufs ist ausgeschlossen. Modell (i) stimmt mit jedem Test überein, aber nur, weil es umgeschriebene Quantenmechanik ist; es macht keine neue Vorhersage. Die von Schritt 1 noch erlaubte Abweichung ($|m-1|\leq6\times10^{-3}$) würde $S$ um höchstens $8\times10^{-3}$ verschieben. Das ist mehr als Storz'' $\sigma_S$, aber gemessene $S$-Werte liegen deutlich unter $2\sqrt2$ (Sichtbarkeit 0.73), und eine unbekannte Sichtbarkeit schluckt eine solche Verschiebung. Nur die Form von $E(\theta)$ (Residuum $\leq1.5\times10^{-3}$) oder ein direkter Test auf fehlende Signalübertragung ($\leq10^{-3}$) könnte sie sehen. Wikipedia: Bellsches Theorem, CHSH-Ungleichung.'
meanings:
- Spinprojektoren entlang der Einheitsvektoren $n$, gebaut mit einem einsum über die Pauli-Matrizen
- 'Gewicht jedes gemeinsamen Ergebnisses: Über die Qubit-Indizes $x, y, u, v$ wird summiert'
- Korrelation, über die Ergebnisvorzeichen $s = (+1, -1)$ summiert
- der gemeinsame Wettlauf über die vier Ergebnisse; die Summe über $l$ (ohne $l = k$) ist das Produkt über die anderen Ergebnisse; $m = 1$ ergibt $P = w$
- Energien der verborgenen Blöcke, abgelesen aus Stichproben von $\Psi$, gleichverteilt auf der Sphäre von $\mathbb C^D$
- 'an der Quelle festgelegte verborgene Richtung, drei reelle Koordinaten von $\Psi$: gleichverteilt auf $S^2$ für jedes $D$'
- 'lokale Wettläufe: Jede Partei läuft auf ihren eigenen Gewichten $(1\pm a\cdot n)/2$; über das gemeinsame $\nu$ wird gemittelt'
- CHSH-Wert, maximiert darüber, welcher der vier Terme das Minuszeichen trägt
labels:
  D: Gesamtdimension $D$ des gemeinsamen Zustands $\Psi$ (offen)
  m_max: Größte Anzahl verborgener Dimensionen pro Ergebnis $m$
  settings: Zufällige Messeinstellungen
  trials: Wettlaufereignisse pro Winkel (Monte Carlo)
