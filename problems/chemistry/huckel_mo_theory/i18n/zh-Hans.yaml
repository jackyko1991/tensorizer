title: π 体系的休克尔分子轨道
summary: 平面烃的 π 电子所处的哈密顿量就是其碳骨架的邻接矩阵，$H = \alpha\mathbb 1 + \beta A$。一次批量 eigh 同时对角化七个分子，从乙烯到萘；填充轨道即可得到 HOMO–LUMO 能隙、离域能（苯：$2\beta$，环丁二烯：$0$），以及作为对占据轨道的 einsum 的 Coulson 键级，而环大小 $N = 3, 4, \dots$ 则展示了休克尔 $4n + 2$ 规则。
notes: Hückel（1931）只保留了对平面共轭分子的 π 电子重要的部分：每个碳一个 $2p_z$ 轨道，每个原子上能量都为 $\alpha$，相邻成键原子之间有跃迁能 $\beta$，其余一概忽略，也不考虑重叠。于是哈密顿量为 $\alpha\mathbb 1 + \beta A$，其中 $A$ 是分子的图，因此其本征值为 $\alpha + \beta\lambda$，$\lambda$ 为 $A$ 的本征值；由于 $\beta < 0$，成键性最强的轨道是 $\lambda$ 最大的那个。苯给出 $\alpha + 2\beta$、$\alpha + \beta$（两重）、$\alpha - \beta$（两重）、$\alpha - 2\beta$；其六个电子的 $E_\pi = 6\alpha + 8\beta$，比三个孤立双键低 $2\beta$。取 $|\beta| \approx 75$ kJ/mol（根据苯的氢化焓拟合的粗略热化学值；光谱学给出的 $|\beta|$ 更大，因此请视为近似值），这就是著名的约 $\approx 150$ kJ/mol 芳香稳定化能。环丁二烯有两个电子剩在 $\alpha$ 处的简并轨道对中：没有离域能，能隙为零，是双自由基，甚至比开链丁二烯更不稳定：反芳香性。对 $N$ 个原子的环，能级为 $\alpha + 2\beta\cos(2\pi k/N)$，一个最低能级，然后是简并对（Frost 圆），所以闭壳层需要 $2 + 4n$ 个电子：休克尔规则。奇数环以其芳香离子形式显示，例如环戊二烯基负离子和草鎓正离子。丁二烯的键级 $P_{ij} = \sum_k n_k C_{ik}C_{jk}$，两端键为 $0.894$，中间键为 $0.447$，与其短–长–短的键长相符；苯的六个键都是 $2/3$。对交替烃（无奇数环），配对定理使能谱关于 $\alpha$ 对称，并且每个 π 电荷都为零。选择另一个分子查看其前线轨道：HOMO 和 LUMO 决定亲电试剂和亲核试剂进攻的位置，并通过能隙决定颜色（更长的多烯吸收更长的波长）。
meanings:
- 分子 $b$ 中成键碳 $i, j$（相距一个键长的原子）为 $1$，填充到最大的 $N = 10$
- 休克尔矩阵；填充原子取极大的对角元，使其虚假轨道永不被填充
- MO 能量（升序：先成键轨道，因为 $\beta < 0$）和系数，MO $k$ 在第 $k$ 列
- 按构造原理每个 MO 填 2 个电子；部分填充的简并组平分其电子
- 重复的 $k$ ⇒ 求和：总 π 能量 $E_\pi$
- 相对于每个 $2(\alpha + \beta)$ 的孤立双键的离域能
- 重复的 $k$ ⇒ 对占据 MO 求和：键上为 Coulson 键级，对角线上为 π 布居
- π 电荷 $1 - P_{bii}$；在这些交替烃的每个原子上都为零
- 环能级的解析式，与环状邻接矩阵的 eigh 结果对照检验
labels:
  molecule: 轨道图所用分子
  ring_max: 最大环大小 $N$
  beta: 换算为 kJ/mol 所用的 $|\beta|$（近似）
