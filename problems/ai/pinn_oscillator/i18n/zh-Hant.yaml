title: 物理資訊神經網路（PINN）：阻尼振子
summary: 一個小型神經網路 $\hat x(t; w)$ 僅憑區間前 40% 內的十個含雜訊量測值，學習彈簧上阻尼質量的運動。把運動方程式 $m\ddot x + \mu\dot x + kx = 0$ 加進損失函數，並以自動微分在配置點（collocation points）上求值，就能讓網路在普通神經網路失敗之處正確外插；在反問題模式下，它還能推得未知的阻尼 $\mu$。
notes: 普通的神經網路是靈活的曲線擬合器：只用量測值訓練時，它能穿過這些點，但在最後一個資料點之後，沒有任何東西告訴它該怎麼做，所以它的預測（虛線）會逐漸偏離。物理資訊神經網路（PINN）加入第二個損失項：在涵蓋整個區間（包括沒有資料之處）的配置點 $t_c$ 上，殘差 $r_c = m\hat x'' + \mu\hat x' + k\hat x$ 的均方值。這些導數是網路對其輸入的精確導數，由 torch.autograd.grad 搭配 create_graph=True 計算，使損失能經由它們反向傳播到權重。驅使 $r_c \to 0$ 會迫使 $\hat x$ 在各處都是運動方程式的解；資料與初始條件 $x(0) = 1$、$\dot x(0) = 0$ 再從中挑出唯一相符的解，因此網路能正確外插。物理在這裡扮演正則化的角色，彌補缺失的資料。在反問題中，阻尼 $\mu$ 是未知的：它成為一個可訓練參數，最佳化器會找出讓資料與物理一致的值（注意它先過衝、再穩定下來）。精確解為 $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$，其中 $\delta = \mu/2m$、$\omega = \sqrt{k/m - \delta^2}$。實務要點：殘差的量級約為 $k$ 乘以誤差，因此用權重 $\lambda \approx 10^{-4}$ 讓它與資料項取得平衡（太大時網路會停在平凡解 $\hat x = 0$，它的殘差同樣為零）；較高的頻率（較大的 $k$）需要更多迭代，因為神經網路會先學會低頻。這裡求解正問題只是為了說明方法：ODE 求解器會快得多。PINN 真正划算的場合是反問題、稀疏且含雜訊的資料，以及形狀不規則區域上的偏微分方程式。簡化：固定質量 $m = 1$、固定隨機種子，以及使用餘弦衰減學習率的 Adam（沒有 L-BFGS 精修）。
meanings:
- 一批輸入時間：配置點、量測時間與 $t = 0$
- 第 $l$ 層的可訓練權重 $w$：各層大小 $1 \to 32 \to 32 \to 32 \to 1$
- 重複的 $j$ ⇒ 對前一層的神經元求和
- 隱藏層激活值；使用平滑的激活函數，使 $\hat x$ 具有二階導數
- 給出 $\dot{\hat x}$；對它再呼叫一次即得 $\ddot{\hat x}$（網路的精確導數，不用有限差分）
- 配置點上的 ODE 殘差：當 $\hat x$ 滿足物理定律時為零
- 資料誤差、$r_c^2$ 的平均值，以及初始條件 $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- 反問題模式：阻尼成為多出來的一個可訓練參數，與權重一起由 Adam 更新
labels:
  mode: 模式：學習 $\mu$（反問題）或已知（正問題）
  k: 彈簧常數 $k$
  mu: 真實阻尼 $\mu$
  mu_guess: $\mu$ 的初始猜測（反問題模式）
  n_data: 量測點數量
  data_fraction: 量測涵蓋區間的比例
  noise: 量測雜訊
  n_colloc: 配置點 $t_c$
  log10_lambda: 物理權重 $\log_{10}\lambda$
  n_iter: 訓練迭代次數
  lr: Adam 學習率
  compare: 同時訓練一個不含物理的網路
