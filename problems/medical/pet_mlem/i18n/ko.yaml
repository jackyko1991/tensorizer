source_hash: 492f2e3f4bf6
title: 'PET: 양전자 소멸과 영상 재구성'
summary: 'FDG 같은 추적자는 양전자를 방출하고, 각 양전자는 전자와 소멸하여 서로 반대 방향으로 날아가는 511 keV 광자 두 개를 만듭니다. 시뮬레이션한 붕괴 배치를 검출기 링까지 추적하고, 각 동시 계수를 반응선(LOR)에 따라 사이노그램에 모은 뒤 MLEM으로 영상을 재구성합니다: $\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$. 스캐너 전체가 하나의 시스템 행렬 $A$이고, 각 반복은 행렬–벡터 곱 두 번입니다.'
notes: '두 광자는 반대 방향으로 날아가므로, 붕괴는 동시에 반응한 두 검출기를 잇는 직선 위 어딘가에서 일어났습니다. 이것이 반응선(LOR)입니다. 수백만 개를 모으면 사이노그램이 됩니다(몸속 각 점은 $(\theta, s)$에서 사인 곡선을 그립니다). MLEM은 계수를 평균 $\bar y = A\lambda + r$인 푸아송 분포로 보고 로그 가능도 $\sum_b y_b \log \bar y_b - \bar y_b$를 올라갑니다. 각 반복은 현재 영상을 정투영하고, 데이터와 비교한 뒤, 그 비를 역투영합니다. 영상은 결코 음수가 되지 않고, 총 계수를 보존하며(배경이 없으면 $\sum_b (A\lambda)_b = \sum_b y_b$), 가능도는 절대 감소하지 않습니다. 초기 반복은 매끄럽고 나중 반복은 더 선명하지만 푸아송 잡음을 증폭하므로, 오차는 먼저 줄었다가 다시 커집니다(기본값에서는 최솟값이 약 50번째 반복 근처입니다. 150번 반복하거나 붕괴 수를 줄여 상승을 확인해 보세요). 임상 스캐너는 일찍 멈춥니다(또는 OSEM 부분집합과 후처리 필터를 씁니다). FBP는 각 투영을 램프 필터로 거른 뒤 한 번에 역투영합니다. 빠르지만 잡음이 더 많고 음수가 나올 수 있습니다. 몸을 지나는 광자는 $e^{-\int \mu\, dl}$만큼 감쇠하며, 511 keV에서 물의 $\mu \approx 0.096$ cm$^{-1}$입니다. 이 인자는 LOR에만 의존하고 붕괴가 그 위 어디서 일어났는지와는 무관하므로 $A$에 포함됩니다. 단순화: 2D만, 가우스형 양전자 비정(F-18의 평균 비정은 약 0.6 mm, Ga-68은 약 3 mm이므로 값을 키우지 않으면 6 mm 픽셀에 가려짐), 광자 비공선성 없음, 이상적인 결정(각 LOR 끝점은 반응한 결정 안의 무작위 위치에 둠)에 상호작용 깊이나 불감 시간 없음, 그리고 알려진 매끄러운 무작위·산란 배경을 가정합니다. 모든 값은 근사치이며 교육용일 뿐 임상용이 아닙니다.'
meanings:
- 방사능 분포에서 뽑은 붕괴 위치(고섭취 병변일수록 더 자주 붕괴)
- '소멸 지점: 양전자는 먼저 약 1 mm를 이동'
- 반대 방향의 두 광자 $p = 1, 2$, 각각 $511$ keV
- '각 광자가 링에 닿는 위치: $t > 0$에 대해 $|a + t u| = R$을 풂'
- '사이노그램: 반응선 $(\theta, s)$마다 검출된 동시 계수'
- 픽셀 $j$의 붕괴가 빈 $b$에서 계수될 확률(감쇠 포함)
- '반복된 $j$ ⇒ 합: 정투영에 무작위/산란을 더한 값'
- '반복된 $b$ ⇒ 합: 각 LOR을 따라 역투영'
- '곱셈형 갱신: 양수를 유지하고 총 계수를 보존'
labels:
  kilo_decays: 시뮬레이션할 붕괴 수(천)
  n_iter: MLEM 반복 횟수
  positron_range: 양전자 비정 $\sigma_+$
  attenuation: 체내 감쇠
  background: 무작위 + 산란 비율
  grid: 영상 격자 $n \times n$
  n_detectors: 링의 검출기 결정 수
