source_hash: 8bd75af0e44c
title: Радиоактивный распад
summary: Каждое ядро распадается случайно с одинаковой вероятностью в секунду $\lambda$. Моделирование целой сетки ядер как одного булева тензора — одно подбрасывание монеты на ядро за шаг — воспроизводит гладкий экспоненциальный закон $N(t) = N_0 e^{-\lambda t}$ и период полураспада $T_{1/2} = \ln 2/\lambda$.
notes: Экспоненциальный закон — утверждение о средних. При $N_0$ ядрах число оставшихся через время $t$ распределено биномиально со средним $N_0 e^{-\lambda t}$ и стандартным отклонением $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$, поэтому маленькая сетка заметно колеблется вокруг кривой, а большая следует ей точно. За каждый период полураспада исчезает примерно половина оставшихся ядер, сколько бы их ни было. Шаг $\Delta t$ должен быть лишь мал по сравнению с $T_{1/2}$; точная вероятность за шаг $1 - e^{-\lambda\Delta t}$ делает среднее правильным при любом шаге. Зерно генератора случайных чисел фиксировано, так что картина воспроизводима.
meanings:
- постоянная распада $\ln 2 / T_{1/2}$
- True, пока ядро $n$ не распалось; сетка — лишь способ нарисовать $n$
- одно равномерное случайное число на ядро за шаг
- вероятность распада за один шаг $\Delta t$
- распавшееся ядро остаётся распавшимся
- 'сумма по всем ядрам: число $N(t)$'
labels:
  n_side: Сторона сетки (side² ядер)
  half_life: Период полураспада $T_{1/2}$
  t_max: Время моделирования
  dt: Шаг по времени $\Delta t$
