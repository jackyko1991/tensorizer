source_hash: 4e5cb68f190c
title: ワークフロー・オーケストレーションの力：テンソル DAG としての Willis 動脈輪コホート
summary: 血管研究は一連のステップ（MRA のセグメンテーション、中心線グラフの抽出、血管の計測、流入口・流出口の配置、流れの求解、レポート）であり、各ステップはすでにテンソルプログラムなので、Snakemake がオーケストレーションするワークフローもテンソルにできる。Willis 動脈輪の公開（CC0）TopCoW MRA スキャン 6 例で、同じ Snakefile を Snakemake（オフライン）とテンソル DAG エンジンで実行する：ジョブグラフはクロネッカー積の和であり、そのレベル、クリティカルパス、再実行集合は行列–ベクトル反復で得られ、結果はジョブ単位で一致する。さらに、短縮された時間とその由来、そしてファイル DAG には与えられないもの――パイプライン全体を通した勾配――を示す。教育目的のみ、臨床使用不可。
notes: 着想。ワークフロー・オーケストレーションの力という捉え方は Jacky Ko によるもので、血管解析パイプラインに関する彼の HPC と博士研究から生まれた。パイプラインの各段階がテンソルプログラムなら、ワークフローマネージャがスケジュールする DAG もテンソルにできる。本問題はそれを構築し、測定する。ワークフロー。data/Snakefile には 8 つのルール（segment、centreline、measure、boundaries、flow、report、cohort、all）と 2 つのワイルドカードがある：症例（6 スキャン）と条件（両 ICA 流入口が開放、または左 ICA 閉塞）。各ルールの shell は workflow.py を実行し、テンソルエンジンが全症例に対して一度に呼ぶのと同じテンソル関数を 1 症例について呼び出す。Snakemake 9.27.1 は WSL2 上でオフライン実行され（専用環境で、本プロジェクトには含まれない）、その出力は参照として data/snakemake に同梱されている：ジョブ DAG（--dag）、ドライランのジョブ一覧、入力を 1 つ変更した後の再実行集合、--summary、ジョブごとの開始・終了時刻、そしてジョブが書き出したコホート表。テストでは、テンソルエンジンが同じ 50 ジョブと 79 辺を持つこと、Snakemake の実行順序が我々の $A$ を尊重し我々のレベルを与えること、再実行集合が同じであること、コホート表が書き出された 9 桁まで一致することを確認する。再実行についての補足：入力に touch しても Snakemake は何も再実行しなかった。小さなファイルではチェックサムを比較するためである。参照ではファイルのバイト列を変更し（配列は同じ）、すると $x = s \lor Rs$ の予測どおり 10 ジョブが再実行される。時間。同梱の実行では Snakemake は 1 コアで 118 s、6 コアで 43 s、12 コアで 27 s を要した（より負荷の低いマシンでの以前の実行では 79、23、22 s）。テンソルエンジンは同じ処理を 1 スレッドで約 5〜10 s で行う。正直な内訳：Snakemake の各ジョブは新しいプロセスで、Python を起動して
  torch とジョブモジュールを import し（約 1.8 s、data/snakemake/startup.csv、つまり合計ジョブ時間 115 s のうち約 88 s）、.npz ファイルを読み書きし、スケジュールされる。テンソルエンジンはその代償を一度だけ払う。ここでは CPU 上でのバッチ化自体の効果は小さく（症例を 1 つずつプロセス内で実行してもほぼ同じ時間で、時にはより短い）、利得は起動とファイルから来ており、各ジョブが起動時間を圧倒する重い GPU 律速の求解であれば縮小する。$c$ コア上のどのスケジュールも $\max(\mathrm{CP}, W/c)$、すなわち max-plus 反復によるクリティカルパスと総仕事量の $c$ 分の 1 を下回れず、実測もこれを満たす。最適スケジュールを求めることは一般に NP 困難である（Graham のリストスケジューリングは $W/c + \mathrm{CP}$ 以内）。勾配。ファイル DAG は数値を渡すが、導関数は渡さない。ソフト閾値によりセグメンテーション、半径、流れが微分可能になるため、$\partial s_{\mathrm{L\,MCA}}/\partial\theta$（流出量に占める左 MCA の割合）は 1 回の逆伝播で全症例について得られ、中心差分と一致する。中心差分なら Snakemake でさらに 2 回の全実行が必要になる。中心線グラフ（トポロジー）と連結成分マスクは固定する。パイプライン。セグメント：正規化 TOF 強度のソフト閾値 $\sigma((I - \theta)/w)$、ハードマスク $I > \theta$ から 64 ボクセル未満の成分を除去、TopCoW マスクに対する Dice は約 0.86〜0.91。中心線：TopCoW の血管ラベルから、ラベル付き血管が出会う分岐点（3.5 mm 以内の接触は統合。解剖学的な組のみ数えるので、並走する 2 本の A2 は数えない）、終末血管ごとの自由端（移動時間 $\ell/R^2$ の min-plus アイコナールで最も遠いボクセルを再中心化）、そして隣接ノード間の最短の中心化経路（動脈瘤問題における VMTK のテンソル代替と同様）。計測：ラベル付き血管近傍の各ボクセルを最も近い中心線点に割り当て、辺の半径をソフト体積から
  $\sqrt{V_e/(\pi L_e)}$ とする。血管ごとの非対称性 $2(r_R - r_L)/(r_R + r_L)$。平滑化した半径プロファイルが中央値の半分を下回る箇所に狭窄フラグ（これらの健常対照ではそのようなフラグはセグメンテーションのアーチファクト）。境界は Venova と同様：流入口は ICA と脳底動脈の自由端、流出口は MCA、ACA、PCA の端。Pcom と Acom の端は決して境界にしない。流れ：低次元の定常モデル。辺ごとに Poiseuille コンダクタンス、開放流入口で $P$ = 90 mmHg、各流出口は Murray 負荷 $g_k \propto r_k^3$ を通じて 0 Pa へ排出され、抵抗のないネットワークなら 10 ml/s を流すよう調整。バッチ化した線形求解は 1 回。側副路テストでは左 ICA を閉塞する：Acom または Pcom が開存していれば左半球は灌流され続ける。簡略化：ニュートン流体としての血液、剛体の直管、拍動なし、3D 流れなし（動脈瘤問題では 1 本の血管で 3D CFD を行う）、0.5 mm ボクセルでの閾値半径、文献オーダーの圧と流量。データ。TopCoW 2024、MRA_Lausanne サブセット（Zenodo 10.5281/zenodo.15692630、ライセンス CC0）：Willis 動脈輪ラベル付きの健常対照 TOF-MRA 20 スキャン。6 症例を 0.5 mm の 96×80×48 クロップとして同梱（画像とラベル、合計 1 MB 未満）。data/SOURCES.md に処理手順と引用（Yang et al.、TopCoW チャレンジ；Di Noto et al. 2022、Lausanne コホート）がある。TopCoW の本リリースは使用しない（ライセンスが商用利用を制限するため）。結果。GIF に加えて、3D の結果が 2 つある。results/centreline.pvd は解剖：各症例のセグメンテーション表面（マーチングテトラヘドラ）とその中心線グラフで、どちらも血管半径で着色している。results/flow.pvd は 1D Poiseuille ネットワークの流れで、左 ICA が狭くなっていく 11 ステップにわたる：タイムステップは狭窄度
  s、すなわち失われた内腔直径の割合（0 が開存、1 が閉塞）。レイヤーは、最も近い中心線エッジの壁面せん断応力 $\tau_w = 4\mu|Q|/(\pi r^3)$ で着色した血管表面（圧は 2 つ目の配列）、流線と粒子（どちらも速さで着色）、矢印付きの流入口・流出口ディスクである。ここに 3D CFD はない：流線は 1D モデルの理想化された軸方向流れで、各血管の中心線に平行で半径の $\rho = 0, 0.35, 0.7$ の位置を通る線であり、速さは Hagen–Poiseuille の $u = 2U(1 - \rho^2)$、$U = |Q|/(\pi r^2)$ で与える。二次流れはなく、分岐部では途切れる。各ステップは定常状態であり、粒子は速さを見せるためだけに、ステップごとに固定の擬似時間 4 ms だけ流線に沿って進む（血管の終端を越えると始端に戻る）。狭窄は流入口と直列の長さ 10 mm の Poiseuille 区間としてモデル化するので、そのコンダクタンスは $(1 - s)^4$ に比例して下がる。s = 0 と s = 1 はちょうどワークフローの 2 つの条件で、その間のステップはテンソルエンジンだけが実行する（ステップごとに 1 回のバッチ求解）。results/stenosis_sweep.csv にはステップと症例ごとの左 ICA 流入量と左 MCA の分配率がある。その他の数値は results/timings.csv、results/equivalence.csv、results/cohort.csv にある。
meanings:
- ルール $s$ がルール $r$ の書き出すファイルパターンを読む。同梱の Snakefile そのものから解析
- ワイルドカード軸 $a$（症例、条件）ごとに：両ルールがその軸を持つときは $I$（症例ごとの辺 $A \otimes I$）、ブロードキャストには $\mathbb 1$、コホートレポートのような集約には $\mathbb 1^\top$
- ジョブ $i$ がジョブ $j$ の出力を読むとき $A_{ij} = 1$。50 ジョブ、79 辺
- 長さ $k$ の閉路。すべてゼロ ⇔ $A$ が冪零 ⇔ 非巡回
- 経路 $j \to i$ の数を数える。その 0/1 パターンが到達可能性（ブール反復二乗）
- ブール行列–ベクトル反復によるトポロジカルレベル：その行で $A\,\neg\mathrm{done} = 0$ のときジョブは実行可能
- 最早終了時刻、max-plus（トロピカル）不動点。$\max_i t_i$ がクリティカルパス
- $s$ 内のジョブ（変更されたファイルを読むジョブ）が古くなった後に再実行すべきジョブ
- ソフトセグメンテーション、閾値 $\theta$（症例ごとに 1 つ）について微分可能
- 全症例の全血管のボクセルグラフ上で一度に行う min-plus アイコナール：自由端と中心線
- 中心線に最も近いボクセルのソフト体積から求める辺の半径
- Poiseuille コンダクタンス $G_e$ と Murray 流出口負荷 $g_k$ による Kirchhoff 方程式、バッチ化した求解 1 回。開放流入口では Dirichlet 行 $p = P$
- 流れ、計測、セグメンテーションを通して微分した左 MCA の流量割合、全症例を 1 回の逆伝播で
labels:
  threshold: 正規化強度に対するセグメンテーション閾値 $\theta$
  cores: 上界 $\max(\mathrm{CP}, W/c)$ におけるコア数 $c$
