source_hash: 230765b6cfcc
title: 拉伸 DNA：蠕蟲狀鏈
summary: 以光鉗拉一條 DNA 分子，它會像一個熵彈簧那樣抵抗，並在接近全長時急遽變硬。將 Marko–Siggia 蠕蟲狀鏈定律與自由連接鏈比較，並以蒙地卡羅模擬一條具彎曲剛度、由單位切向量構成的離散鏈，一次處理一整批力，作為單一 $(B, M, N, 3)$ 張量。持續長度 $P \approx 50$ nm 可同時從切向量相關性與力–伸長曲線的擬合中取回。
notes: 雙股 DNA 分子在短尺度上僵硬、在長尺度上柔軟：其主鏈方向在持續長度 $P \approx 50$ nm（約 150 個鹼基對）內被記住，之後便被遺忘。因此把它拉直要付出的是熵，而非鍵能。低力時反應為線性，$z/L \approx 2 P F / 3 k_B T$，對任何 Kuhn 長度 $b = 2P$ 的高分子都相同；高力時蠕蟲狀鏈只緩慢地趨近全長，$1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$，因為它必須熨平所有波長的彎曲模態，而由剛性連桿組成的自由連接鏈則拉直得快得多，$1 - z/L \approx k_B T / F b$。對 λ 噬菌體 DNA 的實驗（Smith、Finzi 與 Bustamante 1992；Bustamante、Marko、Siggia 與 Smith 1994）在約 10 pN 以下符合蠕蟲狀鏈，超過後雙螺旋開始彈性伸長，並在約 65 pN 附近過度拉伸；本模型兩者皆無。Marko–Siggia 公式是兩個極限之間的內插，在中等伸長時與精確 WLC 的力相差最多約 10 %。模擬使用 $a = 2.5$ nm 的鏈段，因此剛度為 $K \approx 20.5$；每次蒙地卡羅掃描先將每個切向量稍微轉動（對局部場做 Metropolis），再將每條鏈的尾端繞隨機軸旋轉（樞軸移動）。前半的掃描用於平衡，後半用於平均。在最低的力下，伸長量在各鏈之間劇烈漲落且鬆弛緩慢，因此這些點較為分散。擬合使用 0.5–4 pN：在每一點以 Marko–Siggia 解出 $P$，再於對數空間中平均（對 $\log F$ 做最小平方）。在 $F \sim K k_B T / a$ 以上，鏈的離散性會顯現為比連續定律稍大的伸長。不含任何實驗數據。
meanings:
- 受力 $b$ 拉伸的鏈 $m$ 中鏈段 $i$ 的單位切向量；各鏈從無外力的 WLC 出發
- $F_0 = 0$ 加上 0.02 到 10 pN 的 12 個力；$f_b$ 是以 $k_B T$ 為單位的功 $F a$
- 彎曲剛度 $\kappa / k_B T$，選取使 $\coth K - 1/K = e^{-a/P}$，即 $K \approx P/a + \tfrac12$
- 兩個相鄰切向量的拉力加上沿 $z$ 的外力
- 重複的 $k$ ⇒ 求和：轉動一個切向量的能量變化；偶數與奇數鏈段輪流移動
- 重複的 $i, k$ ⇒ 求和：總彎曲能，用於轉動整段尾端的樞軸移動
- 沿外力方向的伸長除以輪廓長度
- 無外力鏈的切向量相關性；其衰減長度為 $P$
labels:
  persistence: 持續長度 $P$
  contour_length: 輪廓長度 $L$
  chains: 每個力的鏈數 $M$
  sweeps: 蒙地卡羅掃描次數
