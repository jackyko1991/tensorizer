source_hash: e1ad81688a05
title: 2차원 푸리에 변환으로 보는 프라운호퍼 회절
summary: 원거리장에서 구멍의 회절 무늬는 그 투과 함수의 2차원 푸리에 변환입니다. torch.fft.fft2 한 번 호출로 정사각형, 원형 구멍, 이중 슬릿, 격자를 각각의 원거리장 무늬로 바꾸며, 구멍이 커질수록 에어리 고리가 작아집니다.
notes: 구멍 평면의 길이는 크기 $\Delta x$인 픽셀 단위이며, 변환의 진동수 픽셀 $(k, l)$은 방향 $\sin\theta = \lambda k/(N\Delta x)$에 대응합니다. 따라서 원형 구멍의 첫 번째 어두운 고리 $\sin\theta = 1.22\,\lambda/D$는 중심에서 $1.22\,N/D$ 진동수 픽셀 떨어져 있습니다(점선 원). 큰 구멍은 작은 무늬를 줍니다. 넓은 함수의 변환은 좁습니다. einsum 형태는 fft2와 같은 변환이지만, $O(N^2\log N)$ 대신 $O(N^3)$입니다.
meanings:
- '마스크의 투과율: 1 = 열림, 0 = 불투명; 행 $a = y$, 열 $b = x$'
- 이산 푸리에 변환 행렬
- '반복된 $a$와 $b$ ⇒ 합: $y$ 방향 1차원 변환과 $x$ 방향 1차원 변환'
- 고속 푸리에 변환으로 구한 같은 변환, 진동수 0을 중앙으로 이동
- 원거리장 세기, $\log_{10}(I/I_{\max})$로 표시
- 지름 $D$인 원형 구멍의 첫 번째 어두운 고리, 진동수 픽셀 단위
labels:
  size_min: 처음 구멍 크기 $D$
  size_max: 최종 구멍 크기 $D$
  frames_per_aperture: 구멍 모양당 프레임 수
