title: k-mer, GC मात्रा और GC विषमता
summary: एक DNA अनुक्रम one-hot $(L, 4)$ टेंसर बन जाता है। $k$ अक्षरों के हर शब्द की गिनती खोली गई खिड़कियों पर एक einsum है (एक 1-D संवलन), GC मात्रा और GC विषमता (skew) खिड़की-योग हैं, और संचयी विषमता का न्यूनतम बताता है कि रोपित उद्गम और समापन (terminus) वाले एक कृत्रिम वृत्ताकार गुणसूत्र पर प्रतिकृतीयन कहाँ से शुरू होता है।
notes: 'अधिकांश जीवाणु गुणसूत्र वृत्ताकार होते हैं और प्रतिकृतीयन के एक ही उद्गम से कॉपी होते हैं, जिसमें दो प्रतिकृतीयन फ़ोर्क विपरीत दिशाओं में चलते हैं जब तक वे समापन पर नहीं मिलते। दोनों आधे अलग-अलग तरह कॉपी होते हैं (एक रज्जुक अग्रणी रज्जुक के रूप में लगातार, दूसरा टुकड़ों में), और विकासवादी समय में अग्रणी रज्जुक C की तुलना में थोड़ा अधिक G इकट्ठा करने की प्रवृत्ति रखता है। यहाँ वह झुकाव रोपा गया है: उद्गम से समापन तक G को गुणक $(1+\text{skew})/(1-\text{skew})$ से वरीयता मिलती है, दूसरे आधे पर C को। एक खिड़की की विषमता रवयुक्त है, पर चलता योग $S_n$ उद्गम तक लगातार गिरता है और समापन तक लगातार चढ़ता है, इसलिए उसका न्यूनतम और अधिकतम तब भी उभरते हैं जब झुकाव केवल कुछ प्रतिशत हो। वास्तविक जीनोम वही V आकार दिखाते हैं, हालाँकि कम साफ़, क्योंकि जीन, पुनरावृत्तियाँ और पुनर्व्यवस्थाएँ अपनी संरचना जोड़ती हैं। भीतरी वलय पर दो निम्न-GC खंड जीनोमिक द्वीपों की नकल करते हैं, कहीं और से लिया गया DNA जो अक्सर अलग क्षार संरचना बनाए रखता है। $k$-mer स्पेक्ट्रम जीनोम संयोजन (assembly) और कई संरेखण-मुक्त
  तुलनाओं का प्रारंभिक बिंदु है; इस यादृच्छिक जीनोम के लिए इसके रंग बस GC मात्रा का अनुसरण करते हैं। छोटी विषमता, छोटा जीनोम या बड़ा $k$ (अधिक शब्द, हर एक की कम गिनती) आज़माएँ।'
meanings:
- 'स्थिति $n$, अक्षर $a$ ∈ (A, C, G, T): जहाँ क्षार $a$ है वहाँ 1'
- $k$ अक्षरों की हर खिड़की, मेमोरी कॉपी किए बिना
- '$a \cdot 4^{k-1-j}$: शब्द को आधार 4 की संख्या के रूप में पढ़ा गया (AAA = 0, …, TTT = $4^k-1$)'
- 'दोहराए गए $j$ और $a$ ⇒ योग: $n$ पर शुरू होने वाले $k$-mer का सूचकांक'
- $k$-mer स्पेक्ट्रम; गिनतियों का योग $L-k+1$ है
- 'दोहराया गया $i$ ⇒ योग: $\ell$ क्षारों की खिड़की $w$ में क्षार गिनतियाँ, हर $\Delta = \ell/2$ पर एक'
- $(n_G + n_C)/\ell$ और $(n_G - n_C)/(n_G + n_C)$
- '$c = (0, -1, +1, 0)$: G घटा C की चलती गिनती; argmin = उद्गम, argmax = समापन'
labels:
  length_kb: जीनोम लंबाई $L$
  k: शब्द लंबाई $k$
  window: खिड़की $\ell$
  origin: रोपित उद्गम (जीनोम का अंश)
  skew: रज्जुक झुकाव (विषमता)
  gc: GC मात्रा
  seed: यादृच्छिक बीज (seed)
