source_hash: 786f22a93dbf
title: 光电效应与光量子
summary: 爱因斯坦 1905 年的光量子论文：频率为 $\nu$ 的光以能量 $h\nu$ 的能量包到达，一个能量包释放一个电子，其动能为 $K = h\nu - \phi - \varepsilon$。一批“光子 × 频率 × 强度”显示出阈值 $\nu_0 = \phi/h$、与强度无关的遏止电压 $eV_s = h\nu - \phi$，以及毫无时间延迟——全都与经典波动图像相违。用直线拟合 Millikan 1916 年的钠测量数据，便重新得到普朗克常数。
notes: 这是爱因斯坦 1905 年四篇“奇迹年”论文之一：光量子与光电效应（本题；1921 年诺贝尔奖，“特别是因为他发现了光电效应定律”）、布朗运动（热力学：随机行走与扩散），以及含 $E = mc^2$ 的狭义相对论（天体物理：爱因斯坦 1905：运动物体与 $E = mc^2$）。波动图像在三方面失败：它预言任何频率都会发射电子、动能随强度增加，以及弱光需延迟数分钟（一个原子从 $S = 10$ mW/m² 收集 $\phi$）——而实验显示有明确的阈值、$V_s$ 与强度无关，且没有可测得的延迟（低于 3 ns，Lawrence 与 Beams 1928）。更亮的光只意味着更多光子，所以电流增加，但 $V_s$ 不变。红色方块是 Millikan 1916 年对真空中切出的钠表面所测得的遏止电压（R. A. Millikan, Phys. Rev. 7, 355 (1916)，四条汞谱线，依罗斯基勒大学一份习题集中所列的论文数值转录于 data/millikan_1916_sodium.csv；1916 年出版，属公有领域）。Millikan 原本想推翻爱因斯坦的方程，结果却证实了它；他的斜率给出的 $h$ 与今天的精确值 $6.62607015\times10^{-34}$ J s 相差约 0.3 % 以内。截距约 1.8 eV，并非洁净钠的逸出功（2.3 eV）：它包含仪器的接触电势，而且表面很可能受到了污染（D. Lloyd, Am. J. Phys. 2015）。模拟的金属是理想化的（深度均匀分布的平坦能带，不考虑角度与温度）：直线 $eV_s = h\nu - \phi$ 是精确的，电流曲线的形状只是示意。
meanings:
- 光的频率，单位 $10^{14}$ Hz
- 吸收光子 $n$ 的电子所在深度，在 $[0, 3]$ eV 上均匀分布（$i$：强度）
- 一次广播：所有频率与强度的每个光子同时计算；$K \le 0$ ⇒ 不发射
- 能爬过减速电压 $V$ 的电子：光电流
- 遏止电压：最快的电子；对每个强度 $i$ 都相同
- 通过 Millikan 数据点的直线：斜率 $a = h/e$，截距 $b = -\phi/e$
- 波动图像：在辐照度 $S$ 下，以一个原子的面积 $A$ 吸收足够 $\phi$ 所需的时间
labels:
  phi: 逸出功 $\phi$
  irradiance: 辐照度 $S$（用于波动图像的延迟）
  n_photons: 强度为 1 时每次曝光的光子数
