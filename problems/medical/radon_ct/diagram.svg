<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="CT gantry: source and detector rotate around the head at angle theta; parallel rays at offset s give the projection p(theta, s)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- gantry ring -->
    <circle cx="100" cy="80" r="66" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- head phantom -->
    <ellipse cx="100" cy="80" rx="26" ry="34" fill="#93c5fd" stroke="#374151" stroke-width="2"/>
    <ellipse cx="92" cy="80" rx="5" ry="11" fill="#ffffff" stroke="#1e40af" stroke-width="1"/>
    <ellipse cx="108" cy="80" rx="5" ry="11" fill="#ffffff" stroke="#1e40af" stroke-width="1"/>
    <!-- rotated frame: source at lower left, detector at upper right (rays at 45 degrees) -->
    <g transform="rotate(45 100 80)">
      <rect x="62" y="140" width="76" height="9" rx="2" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
      <rect x="62" y="10" width="76" height="9" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
      <g stroke="#dc2626" stroke-width="1.3" opacity="0.8">
        <line x1="74" y1="138" x2="74" y2="22" marker-end="url(#arrow)"/>
        <line x1="100" y1="138" x2="100" y2="22" marker-end="url(#arrow)"/>
        <line x1="126" y1="138" x2="126" y2="22" marker-end="url(#arrow)"/>
      </g>
      <!-- offset s along the detector -->
      <line x1="100" y1="4" x2="126" y2="4" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <text x="170" y="34" font-style="italic" fill="#b45309">s</text>
    <!-- angle theta from the vertical -->
    <line x1="100" y1="80" x2="100" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M100,124 A44,44 0 0 1 68.9,111.1" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="105" y="142" font-style="italic" fill="#b45309">θ</text>
    <text x="170" y="82" font-style="italic">p(θ, s)</text>
  </g>
</svg>
