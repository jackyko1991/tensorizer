title: 이상 기체의 네 가지 과정
summary: 같은 상태에서 출발한 같은 기체를 교과서의 네 경로, 즉 등온, 등압, 등적, 단열 과정을 따라 변화시킵니다. 네 경로 모두 $(V, p)$ 표본의 (과정, 점, 2) 텐서 하나이며, 일은 torch.trapezoid로 구한 각 곡선 아래 넓이이고, 열역학 제1법칙이 이를 열로 바꿉니다.
notes: '시작: 300 K, 10 리터의 1 mol. 등온, 등압, 단열 경로는 같은 최종 부피까지 팽창합니다. 등적 경로는 $V$를 고정한 채 압력이 같은 비율로 커질 때까지 기체를 가열합니다. 등적 과정에서는 $dV = 0$이므로 torch.trapezoid가 정확히 0인 일을 돌려줍니다. 등온 과정에서는 $\Delta U = 0$이므로 $Q = W$이고, 단열 과정에서는 $Q = 0$이므로 기체는 내부 에너지로 일을 치르고 식습니다. 오른쪽 막대는 torch.cumulative_trapezoid로 계산한 누적값입니다.'
meanings:
- 과정 $c$(등온, 등압, 등적, 단열)를 따른 표본 $k$
- 이상 기체 법칙, 텐서 전체에 원소별로
- '반복된 $k$ ⇒ 합: 각 경로에서 기체가 한 일'
- 내부 에너지는 온도에만 의존
- '열역학 제1법칙: 기체에 더해진 열'
labels:
  ratio: 팽창비 $V_2/V_1$
  T0: 처음 온도
  n: 기체의 양
  gas: 기체
