source_hash: 35a326f71a76
title: संवलन के रूप में छवि फ़िल्टरिंग
summary: एक प्रक्रियात्मक रूप से बनाई गई परीक्षण छवि पर एक छोटा कर्नेल सरकाकर उसे धुँधला करें, तीक्ष्ण करें और किनारे खोजें। हर रैखिक फ़िल्टर खोली गई (unfolded) पिक्सेल खिड़कियों पर एक संकुचन $O_p = K_k P_{kp}$ है, conv2d के समान; गाउसीय दो 1D पासों में विभाजित होता है, और संवलन प्रमेय इसे फ़ूरिये रूपांतरणों के गुणनफल में बदल देता है। बॉक्स और गाउसीय धुँधलापन, सोबेल किनारे, गाउसीय का लाप्लासियन, अनशार्प मास्किंग, और नमक-मिर्च रव पर माध्यिका बनाम गाउसीय।
notes: 'बॉक्स फ़िल्टर की आवृत्ति अनुक्रिया एक sinc है जिसकी लहरें ऋणात्मक जाती हैं, इसलिए यह सूक्ष्म विवरण को गुज़रने देता है, उसमें से कुछ उलटे चिह्न के साथ (chirp की धारियाँ मिटती हैं और लौट आती हैं); गाउसीय की अनुक्रिया एक और गाउसीय है जो सहजता से शून्य तक गिरती है। गति के लिए पृथक्करणीयता मायने रखती है: एक $(2r+1)^2$ कर्नेल को प्रति पिक्सेल $(2r+1)^2$ गुणन चाहिए, दो 1D पासों को केवल $2(2r+1)$। Sobel (1968) अवकलज को समतलन के साथ जोड़ता है; गाउसीय का लाप्लासियन वहाँ अनुक्रिया देता है जहाँ द्वितीय अवकलज शून्य को पार करता है, और Canny (1986) उन्हीं समतलित प्रवणताओं पर पतलापन और शैथिल्य (hysteresis) जोड़कर बनाता है। अनशार्प मास्किंग $\alpha(I - G * I)$ वापस जोड़ता है, एक उच्च-पारक बढ़ावा जो रव को भी बढ़ाता है। माध्यिका रैखिक नहीं है, इसलिए उसका कोई कर्नेल और कोई आवृत्ति अनुक्रिया नहीं है, पर यह पृथक नमक-मिर्च पिक्सेल हटा देती है जिन्हें गाउसीय केवल फैला देता है (टर्मिनल में PSNR की तुलना करें)। हर संवलनी न्यूरल नेटवर्क परत सीखे गए कर्नेलों के साथ यही unfold-और-संकुचन संक्रिया है।'
meanings:
- 'पिक्सेल $(i, j)$ का धूसर स्तर: एक प्रवणता, एक चकती, एक वर्ग, एक त्रिभुज और एक chirp, साथ में रव'
- फ़िल्टर भार, हर पिक्सेल के लिए समान
- दोहराए गए $a, b$ ⇒ खिड़की पर योग (एक सहसंबंध, जिसे PyTorch संवलन कहता है)
- पिक्सेल $p$ के चारों ओर की खिड़की एक स्तंभ के रूप में, $k = (a, b)$
- 'दोहराया गया $k$ ⇒ योग: वही फ़िल्टर एक einsum के रूप में'
- 2D गाउसीय एक बाह्य गुणनफल है, इसलिए यह एक पंक्ति पास और एक स्तंभ पास के रूप में चल सकता है
- 'Sobel: आर-पार $[1, 2, 1]$ समतलन गुणा अनुदिश $[-1, 0, 1]$ अंतर'
- 'संवलन प्रमेय: फ़ूरिये समष्टि में बिंदुवार गुणनफल, wrap-around भराई वाले conv2d के बराबर'
labels:
  size: छवि आकार
