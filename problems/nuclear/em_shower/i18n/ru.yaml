source_hash: 24c72b95c811
title: Электромагнитный ливень
summary: 'Электрон высокой энергии, попадая в блок свинца, запускает каскад: электроны излучают фотоны, фотоны превращаются в электрон-позитронные пары, и на каждом шаге энергия делится пополам, пока не упадёт до критической. Модель Гайтлера моделируется как ветвящийся процесс на тензорах — каждая частица — строка, каждое деление — две новые строки — и предсказывает максимум ливня $N_{max} \approx E_0/E_c$ на глубине $t_{max} \approx \ln(E_0/E_c)/\ln 2$.'
notes: 'Глубина измеряется в радиационных длинах $X_0$ (0,56 см в свинце), $E_c$ — критическая энергия, около 7,4 МэВ в свинце. Удвоение прекращается, когда дочерние частицы оказались бы ниже $E_c$, поэтому максимум около $E_0/E_c$ частиц достигается примерно через $\log_2(E_0/E_c)$ радиационных длин: глубина ливня растёт с энергией лишь логарифмически, поэтому калориметры могут быть компактными. В режиме фиксированной длины каждая частица делится ровно через одну $X_0$, так что целое поколение движется синхронно, и число частиц растёт ступеньками. Стохастический режим (штриховая кривая показывает другой режим для сравнения) разыгрывает каждую точку взаимодействия случайно (фотоны проходят в среднем $\tfrac97 X_0$): поколения размываются по глубине, давая более низкий, широкий и длинный профиль, как у реальных ливней, а баланс энергии остаётся точным. Поперечное расплывание лишь иллюстративно (угловой толчок $\propto E_c/E$). Упрощения модели Гайтлера: равное деление энергии, нет ионизационных
  потерь выше $E_c$, частица ниже порога отдаёт всю энергию сразу, нет комптоновского рассеяния и фотоэффекта. Зерно генератора фиксировано.'
meanings:
- энергия (МэВ) и тип (1 = e±, 0 = γ) каждой летящей частицы; P меняется по мере роста ливня
- 'стохастический режим: $1 - e^{-\Delta t/\lambda}$, $\lambda = X_0$ (e±) или $\tfrac97 X_0$ (γ)'
- 'булева маска: кто размножается, остальные отдают энергию'
- e → e + γ и γ → e + e, как две склеенные половины
- число летящих частиц на каждой глубине
- энергия, выделенная частицами ниже критической энергии
labels:
  e0: Первичная энергия $E_0$
  e_crit: Критическая энергия $E_c$
  mode: Длина деления
