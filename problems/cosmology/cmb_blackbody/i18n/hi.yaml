source_hash: 79a2f1fd310e
title: एक आदर्श कृष्णिका के रूप में CMB (COBE FIRAS)
summary: COBE के FIRAS उपकरण ने कॉस्मिक माइक्रोवेव बैकग्राउंड को 43 आवृत्तियों पर मापा और अब तक देखी गई सबसे आदर्श कृष्णिका पाई। चार मॉडलों का एक बैच (केवल प्लांक नियम, बोस–आइंस्टीन रासायनिक विभव $\mu$ के साथ, कॉम्पटन $y$-विकृति के साथ, दोनों के साथ) एक ही टेंसर में वास्तविक FIRAS तालिका पर फ़िट किया जाता है, और जैकोबियन ऑटोग्रैड से मिलता है। फ़िट से 42 स्वातंत्र्य कोटियों के लिए $\chi^2 \approx 45$ के साथ $T \approx 2.725$ K मिलता है, अवशिष्ट शिखर के $10^{-4}$ से कम हैं, विकृतियाँ शून्य के अनुरूप हैं ($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$), और $T$ से प्रति cm³ लगभग 411 फ़ोटॉन मिलते हैं।
notes: '1990 में FIRAS (NASA के COBE पर लगा Far-Infrared Absolute Spectrophotometer, यानी सुदूर-अवरक्त निरपेक्ष स्पेक्ट्रोफ़ोटोमीटर) ने आकाश की तुलना एक बाहरी कृष्णिका अंशशोधक से की और कोई अंतर नहीं पाया; अंतिम स्पेक्ट्रम (Fixsen et al. 1996) प्लांक वक्र से शिखर के प्रति दस लाख 50 भागों से भी कम विचलित होता है। जॉन माथर और जॉर्ज स्मूट ने 2006 का भौतिकी का नोबेल पुरस्कार साझा किया "कॉस्मिक माइक्रोवेव बैकग्राउंड विकिरण के कृष्णिका स्वरूप और विषमदैशिकता की खोज के लिए"। इतनी आदर्श कृष्णिका का अर्थ है कि प्रारंभिक ब्रह्मांड गर्म, सघन और तापीय साम्यावस्था में था: रेडशिफ़्ट $z \sim 2\times10^6$ के बाद मुक्त हुई ऊर्जा या तो एक रासायनिक विभव $\mu$ (बोस–आइंस्टीन स्पेक्ट्रम, $z \gtrsim 2\times10^5$) छोड़ जाती या एक कॉम्पटन $y$-विकृति (गर्म इलेक्ट्रॉन फ़ोटॉनों की ऊर्जा बढ़ाते हैं, $z \lesssim 5\times10^4$; इसका आकार सुन्याएव–ज़ेल्दोविच प्रभाव जैसा ही है, जिसका शून्य $x = 3.83$ यानी 217 GHz पर है, और यह फ़ोटॉन संख्या संरक्षित रखती है)। केवल विकर्ण त्रुटियों वाला हमारा फ़िट लगभग $|\mu| < 7\times10^{-5}$
  और $|y| < 6\times10^{-6}$ की 95 % सीमाएँ देता है; प्रकाशित FIRAS सीमाएँ, $|\mu| < 9\times10^{-5}$ और $|y| < 1.5\times10^{-5}$, अधिक चौड़ी हैं क्योंकि वे पूर्ण सहसंबद्ध सहप्रसरण का उपयोग करती हैं और व्यवस्थित (अंशशोधन और आकाशगंगीय) अनिश्चितताओं को शामिल करती हैं। तापमान को सावधानी से पढ़ें: फ़िट सांख्यिकीय रूप से $T$ को लगभग $10^{-5}$ K तक निर्धारित करता है, लेकिन निरपेक्ष पैमाना अंशशोधक के तापमापन से आता है, और LAMBDA तालिका स्पेक्ट्रम को 2.725 K कृष्णिका और प्रकाशित अवशिष्टों के योग के रूप में लिखती है, इसलिए $T = 2.725$ K पहले से निहित है; आज का सर्वोत्तम निरपेक्ष मान $2.72548 \pm 0.00057$ K (Fixsen 2009) है। $T$ से $n_\gamma \approx 411$ cm$^{-3}$ और $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$ प्राप्त होते हैं। एनिमेशन में बायाँ पैनल प्रारंभिक अनुमान से फ़िट का अभिसरण दिखाता है (त्रुटि-दंड प्रसिद्ध आलेख की तरह 400 गुना बड़े किए गए हैं, अन्यथा वे दिखाई नहीं देते); फिर दायाँ पैनल शिखर के $10^{-4}$ की इकाइयों में अवशिष्टों को ज़ूम करता है, साथ में वे आकार भी जो हमारी 95 % सीमा पर $\mu$
  या $y$ $T$ को दोबारा फ़िट करने के बाद छोड़ते। डेटा: D. J. Fixsen et al., ApJ 473, 576 (1996) की Table 4, NASA के LAMBDA संग्रह से (https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt), सार्वजनिक डोमेन, data/firas_monopole.csv के रूप में शामिल।'
meanings:
- 43 FIRAS तरंग-संख्याएँ (cm$^{-1}$), तीव्रताएँ और $1\sigma$ त्रुटियाँ (MJy/sr)
- बैच के प्रत्येक मॉडल $b$ के लिए एक पंक्ति $(T, \mu, y)$
- $(B,1)$ को $(F,)$ के विरुद्ध ब्रॉडकास्ट करके $h\nu/kT$
- बोस–आइंस्टीन अधिभोग और कोम्पानेयेत्स $y$ पद, गुणा $2hc\tilde\nu^3$
- '$\sum_b I_{bf}$ का ऑटोग्रैड: पंक्तियाँ स्वतंत्र हैं, इसलिए एक ही कॉल हर मॉडल का जैकोबियन देती है'
- 'दोहराया गया $f$ ⇒ योग: फ़िशर मैट्रिक्स; इसका व्युत्क्रम सहप्रसरण है'
- सभी मॉडलों के लिए एक साथ लेवेनबर्ग–मार्क्वार्ट का एक चरण
- प्रत्येक मॉडल के लिए फ़िट की गुणवत्ता
labels:
  T_init: $T$ का प्रारंभिक अनुमान
  steps: लेवेनबर्ग–मार्क्वार्ट चरण
