title: 'Hardy–Weinberg and Wright–Fisher genetic drift'
category: bioinformatics
level: beginner
order: 3
summary: >
  Random mating gives the Hardy–Weinberg genotype frequencies $p^2, 2pq, q^2$; random sampling of $2N$ gene copies
  each generation makes allele frequencies drift. Thousands of populations evolve at once as one
  (replicates, generations) tensor of binomial draws, optionally with selection $s$, and are compared with
  $(1-1/2N)^t$ for heterozygosity and with $1/2N$ and Kimura's formula for fixation.
animated: true
vector_form: 'f_{AA}, f_{Aa}, f_{aa} = p^2,\ 2pq,\ q^2,\qquad 2N\,p_{t+1} \sim \mathrm{Bin}\!\Big(2N,\ \frac{p_t(1+s)}{1+s\,p_t}\Big),\qquad \mathbb E[H_t] = H_0\Big(1-\frac{1}{2N}\Big)^t,\qquad u(p_0) = \frac{1-e^{-4Nsp_0}}{1-e^{-4Ns}}'
index_form: 'G_{rg} = \big(p_r^2,\ 2p_rq_r,\ q_r^2\big)_g \qquad p''_{rt} = \frac{p_{rt}(1+s)}{1+s\,p_{rt}} \qquad p_{r,t+1} = \frac{K_{rt}}{2N},\ \ K_{rt}\sim\mathrm{Bin}(2N, p''_{rt}) \qquad \bar H_t = \frac1R\sum_r 2p_{rt}q_{rt}'
translation:
  - {symbol: 'p_{rt}', code: 'simulate(p0, N, s, G, gen)', shape: '(R, G+1)', meaning: 'frequency of allele A in replicate population $r$ at generation $t$'}
  - {symbol: "p'_{rt}", code: 'select(p, s)', shape: '(R,)', meaning: 'after selection: A copies are passed on $1+s$ times as often'}
  - {symbol: 'K_{rt}', code: 'torch.binomial(2N, p_sel)', shape: '(R,)', meaning: 'number of A among the $2N$ copies of the next generation: one draw per population, all at once'}
  - {symbol: 'G_{rg}', code: 'hardy_weinberg(p)', shape: '(…, 3)', meaning: 'genotype frequencies AA, Aa, aa under random mating'}
  - {symbol: 'G^{\mathrm{obs}}_{rtg}', code: 'sample_genotypes(p, N, gen)', shape: '(K, G+1, 3)', meaning: '$N$ individuals made of two random gametes each, counted by genotype (dots)'}
  - {symbol: '\bar H_t', code: 'heterozygosity(p).mean(dim=0)', shape: '(G+1,)', meaning: 'sum over $r$: mean $2pq$, compared with $H_0(1-1/2N)^t$'}
  - {symbol: 'u(s)', code: '(p_final == 1).mean(dim=1)', shape: '(S,)', meaning: 'fraction of populations where a single new copy ($p_0 = 1/2N$) was fixed, for each $s$'}
  - {symbol: 'u_{\mathrm{Kimura}}', code: 'kimura_fixation(1/2N, N, s)', shape: '(S,)', meaning: '$(1-e^{-4Nsp_0})/(1-e^{-4Ns})$, equal to $p_0 = 1/2N$ when $s = 0$'}
notes: >
  Hardy–Weinberg says that one round of random mating turns allele frequency $p$ into genotype frequencies
  $p^2, 2pq, q^2$, whatever the genotypes of the parents were; the dots are $N$ individuals built from two random
  gametes and scatter around those curves. Allele frequencies stay put only in an infinite population. With $2N$
  copies each generation is a binomial sample of the previous one, so $p$ performs a random walk until it hits
  0 (allele lost) or 1 (allele fixed). Two copies picked at random share a parent copy with probability $1/2N$, so
  the expected heterozygosity $2pq$ shrinks by the factor $1 - 1/2N$ per generation; drift is faster in small
  populations. A new neutral mutation starts as one copy out of $2N$; since in the end one of the $2N$ copies will be
  the ancestor of all, its chance of fixation is $1/2N$. With selection Kimura's diffusion result applies: a
  beneficial allele with $4Ns \gg 1$ is fixed with probability close to $2s$, still far from certain, and a mildly
  harmful one can be fixed by drift when $|4Ns| \lesssim 1$. Here $N$ is the idealised population size (constant,
  random mating, no mutation or migration); real populations are described by a smaller effective size $N_e$.
params:
  N: {default: 50, min: 5, max: 300, step: 5, type: int, label: 'Population size $N$ (diploid)'}
  p0: {default: 0.5, min: 0.05, max: 0.95, step: 0.05, label: 'Starting frequency $p_0$'}
  s: {default: 0.0, min: -0.05, max: 0.1, step: 0.005, label: 'Selection coefficient $s$'}
  generations: {default: 200, min: 20, max: 1000, step: 20, type: int, label: 'Generations $G$'}
  replicates: {default: 2000, min: 100, max: 20000, step: 100, type: int, label: 'Populations $R$'}
  fix_replicates: {default: 20000, min: 1000, max: 100000, step: 1000, type: int, label: 'Populations per $s$ (fixation)'}
  seed: {default: 0, min: 0, max: 1000, step: 1, type: int, label: Random seed}
