  - {symbol: 'z_n', code: 'z_grid(z_max, n)', shape: '(T,)', meaning: '$z = M/T$, log-spaced: the clock runs as the universe cools'}
  - {symbol: '\varepsilon_e,\ K_k', code: 'parameter_grid(...)', shape: '(E, 1), (1, K)', meaning: 'CP asymmetry as a column, decay parameter as a row: everything broadcasts to $(E, K)$'}
  - {symbol: 'N_N^{eq}', code: 'n_eq(z)', shape: '(T,)', meaning: '$\tfrac38 z^2K_2(z)$: $3/4$ per photon while relativistic, then $e^{-z}$'}
  - {symbol: 'D_k,\ W_k', code: 'decay_rate(z, K), washout(z, K)', shape: '(1, K)', meaning: 'decays and inverse decays per Hubble time at the step midpoint'}
