title: ホッジ予想
summary: ホッジ・ダイヤモンドを数え上げで計算します。フェルマー超曲面 $x_0^d + \dots + x_{n+1}^d = 0$ ではホッジ数はある多項式のべきの係数になり、複素トーラスや直積では外積と畳み込みになります。次に塩田の指標の数え上げにより有理ホッジ類、つまりホッジ予想が部分多様体から来るはずだと主張する類が得られます。曲面の場合、これは証明済みのレフシェッツの $(1,1)$ 定理であり、曲面上の直線がそれを具体的に示します。高次元ではこの予想は未解決です。このページは類を数えるだけです。
notes: コンパクト・ケーラー多様体上では、すべてのコホモロジー類が $(p, q)$ 型の成分に分解します。$p$ は正則方向、$q$ は反正則方向の数です（ホッジ、1941）。数 $h^{p,q}$ はホッジ対称性 $h^{p,q} = h^{q,p}$ とセール双対性 $h^{p,q} = h^{n-p,n-q}$ を満たし、左のダイヤモンドはどれも両方のチェックを通ります。その交代和はオイラー標数であり、$d$ 次超曲面では $((1-d)^{n+2} - 1)/d + n + 2$ に等しくなります。ダイヤモンドはこの値を再現し、さらに K3 四次曲面の $h^{1,1} = 20$、五次三次元多様体の $h^{2,1} = 101$、三次四次元多様体の $h^{3,1} = 1$ も再現します。余次元 $p$ の部分多様体 $Z$ は $(p, p)$ 型の有理類を定めます。ホッジ予想（ホッジ 1950、クレイ数学研究所のミレニアム懸賞問題の一つ）は、すべての有理 $(p, p)$ 類がこのような類の有理線形結合であると主張します。証明されていること：$p = 1$ はレフシェッツの $(1,1)$ 定理（1924）により成り立ち、したがって強レフシェッツ定理により $p = n-1$ も成り立ちます。また次元 3 以下のアーベル多様体、単線織的四次元多様体と三次四次元多様体（Conte–Murre、Zucker）でも成り立ち、多くの次数のフェルマー多様体（塩田 1979、Ran 1980）を含む多くの特殊な場合にも成り立ちます。整数係数版は偽です（Atiyah–Hirzebruch、1962）。フェルマー多様体では、塩田の指標によって有理ホッジ類が数えられるようになり、ガロア共役ごとに一つの条件が課されます。曲面ではこの数はピカール数です。$d = 3, 4, 5, 6$ に対して $7, 20, 37, 86$、$\gcd(d, 6) = 1$ のときは $3(d-1)(d-2) + 1$ です。曲面上の $3d^2$ 本の直線は具体的な代数的類を与え、その交点行列（階数とホッジ指数の符号数 $(1, \rho - 1)$ をここで計算）が $\mathbb Q$ 上でそれらすべてを張るのは、ちょうど $d \le 4$ または $\gcd(d, 6)
  = 1$ のときです。$d = 6, 8, 9, 10$ では他の曲線が必要ですが、それらはレフシェッツの定理により存在します。フェルマー四次元多様体ではプログラムがホッジ類を数えますが、その一つ一つが代数的かどうかこそが予想そのものです。現状（2026 年 11 月）：未解決。OpenAI が公開した AI 生成の原稿集（github.com/openai/math、ファミリー 032）は、すべての CM アーベル多様体に対する有理ホッジ予想を主張し、その命題の Lean による形式化を報告しています。これは査読を経ていない機械生成の主張であり、数学界による検証を待っています。たとえ正しくても、それは特別なクラスを扱うものであって、一般の予想ではありません。
meanings:
- 多項式の積は係数ベクトルの畳み込みであり、これを $n+2$ 回繰り返します：フェルマー多項式のヤコビ環の単項式基底 $x^b$、$0 \le b_i \le d-2$
- グリフィス：原始的な中間ホッジ数はヤコビ環の次数 $(q+1)d - (n+2)$ の部分です
- 複素トーラス：$dz$ の $\wedge^p$ と $d\bar z$ の $\wedge^q$ の積
- キュネット：すべての類の組を、セル $(a + c, b + d)$ に足し込みます
- 塩田の指標：$1 \le a_i \le d-1$、$\sum a_i \equiv 0 \bmod d$。それぞれが原始コホモロジーの直線 $V(a)$ のラベルになります
- 繰り返される $i$ ⇒ 和：すべてのガロア共役 $t\cdot a$ のホッジ型を一度に
- 有理ホッジ類：すべての共役について $(\frac n2, \frac n2)$ 型
- 2 本の直線が交わるのは、$\mathbb C^4$ 内でそれらを張る 4 つのベクトルが一次従属であるとき、かつそのときに限ります。随伴公式により $L^2 = 2-d$
- 直線が張る格子の階数とその符号数（ホッジ指数定理：正の固有値はちょうど一つ）
labels:
  d_max: 最大次数 $d$
  n_max: オイラー検査の次元 $n$ まで
  g_max: トーラスの次元 $g$ まで
