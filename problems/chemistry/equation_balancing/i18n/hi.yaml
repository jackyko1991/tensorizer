title: रासायनिक समीकरणों का संतुलन (शून्य समष्टि)
summary: 'किसी समीकरण को संतुलित करने का अर्थ है ऐसे गुणांक $\nu_s$ खोजना जो हर तत्व और आवेश को संरक्षित रखें। आव्यूह के रूप में यह $M\nu = 0$ है: गुणांक तत्व–स्पीशीज़ आव्यूह की शून्य समष्टि (null space) हैं। एक बैच SVD सात अभिक्रियाओं को एक साथ हल करता है, मेथेन दहन से अम्ल में परमैंगनेट तक, और उस एक को पहचानता है जिसका संतुलन अद्वितीय नहीं है।'
notes: 'हर तत्व अज्ञात गुणांकों में एक रैखिक समीकरण देता है, इसलिए $S$ स्पीशीज़ और $E$ तत्व एक $E\times S$ तंत्र $M\nu = 0$ देते हैं। सामान्यतः $M$ की कोटि (rank) $S-1$ होती है और हल एक रेखा बनाते हैं: संतुलित समीकरण एक सामान्य गुणक तक अद्वितीय है। SVD इस रेखा को विचित्र मान 0 (अंतिम वाला) के दाएँ विचित्र सदिश के रूप में पाता है; उसके सबसे छोटे घटक से भाग देकर और गुणक $k = 1, 2, \dots$ आज़माकर सबसे छोटी पूर्ण संख्याएँ मिलती हैं, जैसे $\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$। आयनों के लिए आवेश बस एक और पंक्ति है: उसके बिना $\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$ की शून्य समष्टि 2D होगी, और उसके साथ परिचित $1{:}5{:}8 \rightarrow 1{:}5{:}4$ रेडॉक्स समीकरण निकल आता है। परॉक्साइड उदाहरण $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$ के दो शून्य विचित्र मान हैं: इसमें दो स्वतंत्र अभिक्रियाएँ छिपी हैं ($2\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$ और $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$),
  और उनका कोई भी धनात्मक मिश्रण भी संतुलित है। केवल बीजगणित एक को नहीं चुन सकता; वास्तविक अनुपात रसायन (गतिकी, परिस्थितियाँ) तय करता है। कोड 2D शून्य समष्टि में एक गुणांक को शून्य रखकर मिली आधार अभिक्रियाएँ दिखाता है। tensors.py में `REACTIONS` में जोड़कर अपनी अभिक्रिया आज़माएँ; पार्सर ''Ca3(PO4)2'' या ''Fe^3+'' जैसे कोष्ठक और आवेश पढ़ता है।'
meanings:
- अभिक्रिया $r$ की स्पीशीज़ $s$ में तत्व $e$ के परमाणु; पंक्ति q आवेश है (छोटे सूत्र पार्सर से)
- अभिकारक के लिए $+1$, उत्पाद के लिए $-1$
- 'किसी सूचकांक पर योग नहीं: हर स्तंभ चिह्नित है'
- सभी अभिक्रियाएँ भरकर एक टेंसर में; अप्रयुक्त स्तंभ $\nu_s = 0$ पर स्थिर
- बैच SVD; विचित्र मान घटते क्रम में
- 'कितने विचित्र मान शून्य होते हैं: 1 → अद्वितीय संतुलन, 2 → दो स्वतंत्र अभिक्रियाएँ'
- अंतिम विचित्र सदिश, स्केल किया गया ताकि सबसे छोटा घटक 1 हो, फिर पहले $k_r$ से जो पूर्ण संख्याएँ दे
- 'दोहराया गया $s$ ⇒ योग: बने $e$ के परमाणु; हर तत्व और आवेश के लिए शून्य'
labels:
  show: आव्यूह के रूप में दिखाई गई अभिक्रिया
  max_scale: आज़माया गया सबसे बड़ा गुणक $k$
