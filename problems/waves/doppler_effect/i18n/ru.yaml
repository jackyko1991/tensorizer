source_hash: 698c7a054398
title: Эффект Доплера и конус Маха
summary: Источник, движущийся со скоростью $v_s$, испускает по одному круговому волновому фронту за период. Каждый фронт — строка тензора (время испускания, точка испускания), так что его радиус в любой момент — одно вычитание. Впереди фронты сгущаются, позади расходятся; выше скорости звука они складываются в конус Маха.
notes: 'Слышимая частота — это просто число фронтов, приходящих за секунду: впереди источника фронты испущены ближе друг к другу, поэтому $f'' = f\,c/(c - v_s)$; позади $f'' = f\,c/(c + v_s)$. Слушатели размещены на линии движения, где эти формулы точны. При $v_s > c$ (число Маха $M = v_s/c > 1$) источник обгоняет собственный звук: все фронты касаются двух прямых — конуса Маха с полууглом $\mu$, где $\sin\mu = 1/M$. Тогда слушатель впереди ничего не слышит, пока не пройдёт конус, а фронты приходят в обратном порядке. Скорость звука $c = 340$ м/с; движется только источник, воздух неподвижен.'
meanings:
- один волновой фронт каждый период $1/f$
- где находился источник, когда испустил фронт $e$
- радиус каждого фронта в момент $t$ (нуль, если ещё не испущен)
- слушатели впереди и позади источника
- 'повторяющийся $i$ ⇒ суммирование: квадрат расстояния от каждой точки испускания до каждого слушателя'
- когда фронт $e$ достигает слушателя $o$
labels:
  mach: Число Маха $v_s/c$
  f: Частота источника $f$ (нарисованные фронты)
  t_max: Время моделирования
