title: Уравнение Нернста и экранирование Дебая–Хюккеля
summary: 'Напряжение элемента Даниэля, Zn | Zn²⁺ ‖ Cu²⁺ | Cu, подчиняется уравнению Нернста, вычисляемому здесь как одна сетка $(T, Q)$ температур и отношений концентраций. Реальные ионы менее активны, чем подсказывает их концентрация: каждый окружён облаком противоположного заряда толщиной $\kappa^{-1}$. Линеаризованное уравнение Пуассона–Больцмана вокруг иона решается на радиальной сетке как пакетная линейная система, совпадает с аналитическим потенциалом Юкавы и воспроизводит коэффициенты активности Дебая–Хюккеля, сдвигающие ЭДС.'
notes: 'В элементе Даниэля цинк окисляется, а ионы меди восстанавливаются, $\mathrm{Zn + Cu^{2+} \to Zn^{2+} + Cu}$, с $n = 2$ электронами и $E^\circ \approx 1.10$ V (здесь фиксировано, поскольку её собственное изменение с температурой мало). Каждое десятикратное изменение $Q$ сдвигает ЭДС на $\ln 10\,RT/nF$, что составляет 29.6 mV при 25 °C, и наклон растёт пропорционально $T$. Уравнение Нернста использует активности $a = \gamma m$, а не моляльности. Дебай и Хюккель вычислили $\gamma$, позволив остальным ионам распределиться в потенциале $\varphi$ центрального иона с больцмановскими весами и линеаризовав: $\nabla^2\varphi = \kappa^2\varphi$. Его решение — экранированный кулоновский потенциал (потенциал Юкавы), спадающий на дебаевской длине $\kappa^{-1} \approx 0.304\,\mathrm{nm}/\sqrt{I}$ в воде при 25 °C. Численный решатель записывает радиальное уравнение для $u = r\varphi$ как трёхдиагональную систему с теоремой Гаусса на поверхности иона и $\varphi = 0$ на расстоянии двенадцати дебаевских
  длин и согласуется с аналитической формой примерно до $10^{-4}$. Энергия иона в потенциале собственного облака равна $kT\ln\gamma$, что даёт в точности расширенный закон; при $I \to 0$ он переходит в предельный закон $\log_{10}\gamma = -Az^2\sqrt I$ с $A \approx 0.51$. Каждый полуэлемент — отдельный раствор сульфата 2:2 ($I = 4m$), поэтому изменение $m(\mathrm{Zn^{2+}})$ меняет $\gamma_{Zn}$, тогда как $\gamma_{Cu}$ остаётся неизменным, и ЭДС отклоняется от идеального значения Нернста на несколько милливольт. Коэффициенты активности отдельных ионов нельзя измерить сами по себе (измерим только средний $\gamma_\pm$), а выше $I \approx 0.01$ ионная ассоциация и специфические взаимодействия в сульфатах 2:2 делают даже расширенный закон качественным. Размер иона $a \approx 0.5$ nm — типичное значение для гидратированного иона.'
meanings:
- пакет температур элемента и отношений реакции
- 'индекс не суммируется: каждый наклон встречается с каждым отношением'
- ионная сила $I = mz^2$ варьируемого полуэлемента ZnSO₄ и обратная дебаевская длина
- расширенный закон; $a \to 0$ даёт предельный закон $-Az^2\sqrt I$
- сетка от поверхности иона $a$ до $a + 12\,\kappa_c^{-1}$, по одной на концентрацию
- $u^{\prime\prime} - \kappa^2u = 0$ при $u = r\varphi$; строка 0 — теорема Гаусса при $r = a$
- повторяющийся $j$ ⇒ суммирование; одно плотное решение на концентрацию, пакетно
- 'энергия иона в собственном облаке: воспроизводит расширенный закон Дебая–Хюккеля'
labels:
