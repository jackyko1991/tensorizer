source_hash: 695e730c122f
title: $N$ 枚の扉のモンティ・ホール問題
summary: $N$ 枚の扉のうち 1 枚の後ろに車が隠されている。あなたが 1 枚を選ぶと、車の場所を知っている司会者がヤギのいる扉を $N-2$ 枚開け、残る閉じた扉への変更を持ちかける。3 から 1000 までのすべての $N$ について、数百万回のゲームを一つの $(B, G)$ テンソルで同時に行う：変更すると確率 $(N-1)/N$ で勝ち（扉 3 枚なら有名な $2/3$）、変更しないと $1/N$ で勝つ。そして累積勝率はどれも二項分布の誤差帯の中にとどまる。
notes: 変更して負けるのは、最初に選んだ扉がすでに車だった場合だけで、それは確率 $1/N$ で起こる。それ以外のときは司会者の選択が強制されるので、彼が閉じたまま残した扉は、彼が開けたすべての扉の情報を担っている。扉が 1000 枚なら答えは明らかで、その論証は扉 3 枚の場合とまったく同じである。このパズルは Marilyn vos Savant の 1990 年の雑誌コラムで有名になり、そのとき数学者を含む多くの読者が答えは $1/2$ だと主張した。その直感は別のゲームでは正しい：何も知らない司会者を選ぶと、彼はランダムに扉を開け、ときには車を見せてしまう。そうしたゲームを捨てると（残るのは割合 $2/N$ だけ）、変更しない場合も変更する場合もちょうど $1/2$ になる。ランダムに開けられた扉は、あなたの扉について何も語らないからである。ターミナルでは最初の選択に特別なものがないことも確認しており、テストでは 1 ゲームずつ進める低速な参照実装がテンソル版と一致する。
meanings:
- 並べて比較する扉の数、3 から 1000 まで
- 行 $b$ のゲーム $g$ における車の扉と最初の選択、$N_b$ 枚の扉上で一様；ブロードキャストにより各行がそれぞれの $N_b$ を持つ
- 司会者が閉じたまま残す扉：あなたがヤギを選んだときは必ず車の扉、車を選んだときはランダムな扉
- 司会者が開ける $N-2$ 枚の扉：$p$ と $k$ 以外のすべての扉
- 変更しない場合の勝ちと変更した場合の勝ち；どのゲームでもちょうど一方が成り立つ
- 累積勝利数を累積有効ゲーム数で割ったもの：各ゲーム後の勝率
- 二項比率の $\pm 2\sigma$ 帯。累積勝率はおよそ 95 % の時間この中にとどまる
labels:
  n_games: 扉の枚数ごとのゲーム数 $G$
  max_doors: 扉の最大枚数 $N$
  host: 司会者
