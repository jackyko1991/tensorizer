source_hash: 8da6dcc23206
title: '위치 가중 행렬: 모티프 로고와 스캔'
summary: 정렬된 전사 인자 결합 부위를 세어 $(m, 4)$ 행렬로 만들고, 의사 계수를 더해 빈도로, 배경에 대한 로그 오즈 점수로 바꾼다. 정보량은 서열 로고를 주며, 펼친 창에 대한 einsum 하나로 긴 서열의 두 가닥을 한 번에 점수화한다. 적중은 서열을 섞은 사본에서 얻은 p-값으로 판정한다.
notes: PWM은 결합 부위의 각 위치가 독립적으로 기여한다고 가정하므로, 창의 점수는 글자마다 하나씩인 수의 합, 즉 원-핫 창과 $W$의 내적이다. 의사 계수 $\beta$는 적은 학습 부위에서 한 번도 보지 못한 글자가 $-\infty$ 점수를 받지 않게 하며, 부위가 많을수록 덜 중요해진다. 한 열의 정보량은 모티프가 그 자리의 글자를 얼마나 좁히는지를 나타내며, 0비트(아무 글자나 가능)에서 2비트(항상 같은 글자)까지다. 로고는 글자를 $P_{ja}$에 비례하여 쌓는다. 여기서 부위는 합성이다. TATA 박스를 닮은 코어(합의 서열 TATAWAWR, W = A 또는 T, R = A 또는 G)와 양쪽에 고정된 글자 두 개씩으로 이루어진 12 bp로, 모티프가 찾을 수 있을 만큼 충분한 비트를 갖게 했다. 짧고 축퇴된 모티프만으로는 정보가 너무 적다. 긴 서열에서는 무작위 창이 실제 부위만큼 높은 점수를 받는데, 그래서 실제 TATA 박스를 PWM만으로 찾기가 어렵다. p-값은 서열을 섞은 사본(같은 글자, 모티프 없음)을 스캔해서 얻는다. 창이 $2(L-m+1)$개이면 $p$에서 자를 때 무작위 적중이 약 $2(L-m+1)\,p$개 통과하며, 구별할 수 있는 가장 작은 p-값은 $1/(1 + \#\text{null scores})$이다. 더 적은 학습 부위, 더 약한 모티프, 또는 더 느슨한 기준을 시도하여 심은 부위가 사라지거나 거짓 적중이 나타나는 것을 보자.
meanings:
- 학습 부위 $s$, 열 $j$, 글자 $a$ ∈ (A, C, G, T)
- '반복된 $s$ ⇒ 합: 모든 열의 글자 수'
- 의사 계수 $\beta$를 더한 빈도. 각 행의 합은 1이고 0인 항목은 없다
- '배경 $q_a$에 대한 로그 오즈(비트): > 0이면 선호, < 0이면 회피'
- '반복된 $a$ ⇒ 합: 열당 비트, 균일 배경에서 0과 2 사이. 로고의 높이'
- $t = 0$은 정방향 가닥, $t = 1$은 역상보 가닥(열 순서 반전, A↔T, C↔G)
- 긴 서열에서 길이 $m$인 모든 창
- '반복된 $j$, $a$ ⇒ 합: 두 가닥을 한 번의 호출로. 같은 코드가 모든 섞은 서열 $(R, 2, L-m+1)$도 점수화한다'
- 섞은 서열 점수 중 이 값 이상인 것의 비율
labels:
  n_train: 학습 부위 수 $N$
  strength: 모티프 세기(합의 염기의 확률)
  pseudo: 의사 계수 $\beta$
  length: 서열 길이 $L$
  n_sites: 심은 부위 수
  log10_p: p-값 기준 $\log_{10} p$
  shuffles: 섞은 서열 수 $R$
  seed: 난수 시드
