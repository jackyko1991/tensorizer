index_form: '\sum_{e\in\mathrm{out}(h)} y_e \le 1,\quad \sum_{e\in\mathrm{in}(h)} y_e \le 1,\quad \sum_{t:\,e_1(t)=e} x_t \le y_e,\quad \sum_{t:\,e_2(t)=e} x_t \le y_e,\qquad g_v = A_{mv}w_m - c_v,\qquad r_m = A_{mv}(2z^{k+1}_v - z^k_v) - b_m'
