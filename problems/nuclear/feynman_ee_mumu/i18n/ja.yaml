source_hash: f068882719e2
title: ファインマン図：ディラックトレースから求める $e^+e^- \to \mu^+\mu^-$
summary: 最も簡単な QED のファインマン図：電子と陽電子が対消滅して仮想光子になり、それがミューオン対を生成する。ファインマン則がこの図を振幅に変え、スピン和がそれを $4\times4$ のディラック行列 $\gamma^\mu$ のトレースに変える。各トレースは1回の einsum である。エネルギーを掃引すると、角度分布が閾値での等方的な形から $1 + \cos^2\theta$ へと変わり、断面積が $4\pi\alpha^2/3s$ のように減少する様子がわかる。
notes: 図は一度描くだけだが、コードはスピノルを一切作らない：スピンについて和をとると $u\bar u$ が $\not p + m$ に置き換わるので、計算全体は $\gamma$ 行列の積とトレースだけになり、einsum がすべてのエネルギーと角度について一度に行う。$m_e \to 0$ では結果は $\overline{|\mathcal M|^2} = e^4\big[1 + 4m^2/s + (1 - 4m^2/s)\cos^2\theta\big]$ となる：閾値では遅いミューオンが等方的に出てくるが、閾値よりはるかに上では光子のスピン 1 とヘリシティ保存により $1 + \cos^2\theta$ となる。全断面積 $\sigma$ は $\sqrt s = 2m$ から急激に立ち上がり、その後 $1/s$ のように減少し、1 GeV で約 $86.8$ nb である。PETRA と LEP の実データは $\sqrt s \approx 30$ GeV までこの曲線に従うが、そこでは光子の代わりに $Z$ ボソンを含む2つ目の図が干渉し、前後方非対称度 $A_{FB}$ がゼロでなくなる。純粋な QED では $A_{FB} = 0$ である。1975 年に SPEAR で 3.55 GeV の閾値のすぐ上で発見された $\tau$ 対も試してみよう。
meanings:
- ディラック行列：添字 $\mu$ は時空の添字、$a, b$ はスピノルの添字。$\{\gamma^\mu, \gamma^\nu\} = 2\eta^{\mu\nu}$
- ミンコフスキー計量 diag(1, −1, −1, −1)、$\hbar = c = 1$ の単位系
- 各エネルギー $\sqrt s$ と角度 $\theta$ における $e^-$、$e^+$、$\ell^-$、$\ell^+$ の重心系4元運動量
- ファインマンのスラッシュ記法：スピン和 $\sum u\bar u = \not p + m$ と $\sum v\bar v = \not p - m$
- 繰り返される $a, b, c, d$ ⇒ 和をとる：電子線のトレース（ミューオン線にも同じ関数を使う）
- $\eta$ でミューオンの添字を下げて縮約する：光子の伝播関数が2本の線をつなぐ
- フラックス因子と位相空間因子。$(\hbar c)^2$ で GeV$^{-2}$ を nb に換算する
- 全断面積。$\frac{4\pi\alpha^2}{3s}\beta\,(1 + 2m^2/s)$、$\beta = \sqrt{1 - 4m^2/s}$ と比較する
labels:
  final: 終状態
  sqrt_s_max: 最高エネルギー $\sqrt s$
