source_hash: 28a44bb1dca2
title: 'Sgr A* wiegen: die Bahn des Sterns S2'
summary: 'Der Stern S2 umkreist das Zentrum der Milchstraße alle 16 Jahre und kommt dabei bis auf 120 AE an eine unsichtbare Masse heran. Eine Kepler-Bahn, bei der die Kepler-Gleichung durch vektorisierte Newton-Iterationen gelöst wird, wird an 25 Jahre echter Positionen und Radialgeschwindigkeiten angepasst. Levenberg–Marquardt mit Jacobi-Matrizen aus Autograd startet gleichzeitig von 64 zufälligen Startpunkten und findet ein Schwarzes Loch von etwa $4.3\times 10^6\,M_\odot$ bei $R_0 \approx 8.3$ kpc. Anschließend sagt die Anpassung die beiden relativistischen Effekte voraus, die GRAVITY später nachwies: etwa 200 km/s Rotverschiebung im Perizentrum und $12''$ Präzession pro Umlauf.'
notes: 'Seit Anfang der 1990er-Jahre verfolgen zwei Teams unter der Leitung von Reinhard Genzel (MPE, ESO-Teleskope) und Andrea Ghez (UCLA, Keck) Sterne in der zentralen Bogensekunde der Galaxis. S2 ist der hellste Stern mit kurzer Umlaufbahn. Seine 16-jährige Ellipse legt die eingeschlossene Masse in einem Volumen fest, das zu klein ist für irgendetwas anderes als ein Schwarzes Loch. Die Positionen liefern die Winkelgröße und die Periode der Bahn, die Radialgeschwindigkeiten (Doppler-Verschiebungen von Spektrallinien) ihre wahre Größe in km. Zusammen ergeben sie die Entfernung $R_0$ und, über das dritte Keplersche Gesetz, die Masse. Das Modell hat 8 Parameter: sechs Bahnelemente plus $M$ und $R_0$ (die Periode folgt aus $P^2 = 4\pi^2(aR_0)^3/GM$). Die Anpassung verwendet Levenberg–Marquardt mit Jacobi-Matrizen aus Autograd, gleichzeitig von vielen zufälligen Startbahnen aus gestartet. Viele davon landen in lokalen Minima, weshalb ein Batch von Starts nötig ist; das beste $\chi^2$ wird behalten.
  Die Kepler-Gleichung wird durch Newton-Iterationen auf abgekoppelten (detached) Tensoren gelöst, gefolgt von einem letzten Schritt im Rechengraphen, sodass Autograd die exakte implizite Ableitung sieht. Ergebnis mit den Standardwerten: $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ kpc, $P \approx 16.03$ Jahre, $e \approx 0.884$, mit $\chi^2 \approx 336$ für 334 Datenpunkte. Veröffentlichte Werte: $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ und $8.32 \pm 0.07 \pm 0.14$ kpc aus 17 Sternen (Gillessen et al. 2017). Die Anpassung sagt dann zwei relativistische Effekte voraus, die sie selbst nicht enthält. Im Perizentrum (120 AE, 7700 km/s, 2.6 % von $c$) addieren gravitative Rotverschiebung und transversaler Doppler-Effekt etwa 200 km/s; GRAVITY maß nach dem Perizentrum im Mai 2018 $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ dieses ART-Werts (GRAVITY Collaboration 2018). Die Bahn präzediert außerdem um $6\pi GM/(c^2a(1-e^2)) \approx 12''$ pro
  Umlauf, gemessen als $f_{SP} = 1.10 \pm 0.19$ des ART-Werts (GRAVITY Collaboration 2020). Dies sind zitierte Nachweise, nicht aus diesen Daten berechnet: Die Tabelle von 2016 endet vor dem Perizentrum von 2018. Vereinfachungen: eine reine Kepler-Bahn, ohne Rømer-Verzögerung (Lichtlaufzeit über die Bahn, etwa 8 Tage), ohne relativistische Terme und ohne Drift des Bezugssystems (die Arbeit passt 5 zusätzliche Bezugssystem-Parameter an). Daten: Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), Tabelle 5 der S2-Daten aus dem VizieR/CDS-Katalog J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030), verwendet mit Quellenangabe gemäß den Nutzungsbedingungen des CDS. Preise: Shaw-Preis für Astronomie 2008 (Genzel), Crafoord-Preis für Astronomie 2012 (Genzel und Ghez) und Nobelpreis für Physik 2020 (zur Hälfte an Genzel und Ghez, für die Entdeckung eines supermassereichen kompakten Objekts im Zentrum unserer Galaxis).'
meanings:
- 'eine Bahn pro Start: $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- exzentrische Anomalie per Newton-Iterationen, für alle Bahnen und Epochen gleichzeitig
- Bahnebene → (Nord, Ost, Sichtlinie), mit einsum aufgebaut
- 'Summe über $j$: Position von S2 in AE; geteilt durch $R_0$ ergibt das mas am Himmel'
- 'Geschwindigkeit entlang der Sichtlinie in km/s: Sie legt $R_0$ fest'
- (Modell − Daten)/$\sigma$ für 145 RA-, 145 Dec- und 44 Geschwindigkeitswerte
- Autograd im Vorwärtsmodus, per vmap über die 8 Parameterrichtungen
- ein Levenberg–Marquardt-Schritt für alle Starts gleichzeitig
- '$6\pi GM/(c^2a(1-e^2))$: Schwarzschild-Präzession, $\approx 12''$ für S2'
