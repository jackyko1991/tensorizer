source_hash: 35a326f71a76
title: 作为卷积的图像滤波
summary: 在程序生成的测试图像上滑动一个小卷积核，实现模糊、锐化和边缘检测。每个线性滤波器都是对展开的像素窗口做一次缩并 $O_p = K_k P_{kp}$，与 conv2d 相同；高斯核可分解为两次一维滤波，卷积定理则把它变成傅里叶变换的乘积。包括方框模糊和高斯模糊、Sobel 边缘、高斯–拉普拉斯、反锐化掩模，以及在椒盐噪声上中值滤波与高斯滤波的对比。
notes: 方框滤波器的频率响应是一个带有负值波纹的 sinc 函数，所以它会让细节通过，其中一部分符号还被翻转（啁啾的条纹先消失又重新出现）；高斯滤波器的响应是另一个高斯函数，平滑地降到零。可分离性对速度很重要：$(2r+1)^2$ 的卷积核每个像素需要 $(2r+1)^2$ 次乘法，两次一维滤波只需 $2(2r+1)$ 次。Sobel（1968）把求导与平滑结合起来；高斯–拉普拉斯在二阶导数过零处响应，Canny（1986）在同样的平滑梯度基础上加入细化和滞后阈值。反锐化掩模加回 $\alpha(I - G * I)$，这是一种高通增强，同时也会放大噪声。中值滤波不是线性的，因此没有卷积核，也没有频率响应，但它能去除孤立的椒盐像素，而高斯滤波只会把它们抹开（比较终端中的 PSNR）。每个卷积神经网络层都是同样的展开再缩并运算，只是卷积核是学出来的。
meanings:
- 像素 $(i, j)$ 的灰度：一个渐变、一个圆盘、一个正方形、一个三角形和一个啁啾，外加噪声
- 滤波器权重，对每个像素都相同
- 重复的 $a, b$ ⇒ 对窗口求和（是相关运算，PyTorch 称之为卷积）
- 像素 $p$ 周围的窗口作为一列，$k = (a, b)$
- 重复的 $k$ ⇒ 求和：同一个滤波器写成一次 einsum
- 二维高斯是外积，因此可以分成一次行滤波和一次列滤波
- Sobel：横向的 $[1, 2, 1]$ 平滑乘以纵向的 $[-1, 0, 1]$ 差分
- 卷积定理：傅里叶空间中的逐点乘积，等同于使用环绕填充的 conv2d
labels:
  size: 图像尺寸
  sigma: 高斯宽度 $\sigma$
  box: 方框尺寸
  amount: 锐化强度 $\alpha$
  noise: 高斯噪声 $\sigma_n$
  salt_pepper: 椒盐噪声比例
  median: 中值窗口
