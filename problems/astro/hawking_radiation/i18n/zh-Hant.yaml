source_hash: 7a350e6eef20
title: 霍金輻射與黑洞蒸發
summary: 黑洞像黑體一樣以霍金溫度 $T_H = \hbar c^3/(8\pi G M k_B)$ 發光。一次廣播即可同時計算多個質量與波長的普朗克定律，並以 RK4 積分質量損失 $dM/dt = -\alpha/M^2$：黑洞縮小、變熱，最後在 $t \propto M^3$ 之後以爆發告終。
notes: 全程使用 SI 單位。一個太陽質量的黑洞溫度為 $6\times10^{-8}$ K，遠低於 2.7 K 的微波背景，因此真實的天文黑洞吸收多於發射。只有極小的（原初）黑洞會蒸發：大爆炸時形成、質量約 $2\times10^{11}$ kg 的黑洞如今正要蒸發完畢。此模型只計光子，並把視界視為面積 $4\pi r_s^2$ 的理想黑體；真實黑洞還會放出微中子、重力子，夠熱時還有更重的粒子，使壽命縮短，而灰體因子會改變光譜形狀。時間步長的選取使每個 RK4 步驟消耗剩餘質量的固定比例；動畫以 $\log M$ 的等步長前進，因此最後幾格只涵蓋極短的時間。視界半徑以 $M^{0.35}$ 繪製，以保持可見。
meanings:
- 一批黑洞質量（kg）：太陽、地球……以及動畫中的黑洞
- 霍金溫度，逐元素計算
- 對數間隔的波長網格
- 以 T[:, None] 對 lam[None, :] 廣播求普朗克譜
- 維恩定律 $b/T_H$
- 視界的史特凡–波茲曼輻射功率
- $-P/c^2$，以 RK4 積分
- 解析壽命，與積分結果比較
labels:
  log10_mass: 初始質量 $\log_{10}(M_0/\mathrm{kg})$
  burn_fraction: 每個 RK4 步驟消耗的質量比例
