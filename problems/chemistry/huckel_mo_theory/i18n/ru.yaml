title: Молекулярные орбитали Хюккеля для π-систем
summary: 'π-электроны плоского углеводорода живут в гамильтониане, который есть просто матрица смежности его углеродного скелета, $H = \alpha\mathbb 1 + \beta A$. Один пакетный eigh диагонализует сразу семь молекул, от этилена до нафталина; заполнение орбиталей даёт щели HOMO–LUMO, энергии делокализации (бензол: $2\beta$, циклобутадиен: $0$) и порядки связей по Коулсону как einsum по занятым орбиталям, а размеры циклов $N = 3, 4, \dots$ демонстрируют правило Хюккеля $4n + 2$.'
notes: 'Хюккель (1931) оставил только то, что важно для π-электронов плоской сопряжённой молекулы: одну $2p_z$-орбиталь на атом углерода, одинаковую энергию $\alpha$ на каждом атоме, энергию перескока $\beta$ между связанными соседями, больше ничего и никакого перекрывания. Тогда гамильтониан равен $\alpha\mathbb 1 + \beta A$, где $A$ — граф молекулы, так что его собственные значения равны $\alpha + \beta\lambda$ с $\lambda$ собственными значениями $A$; поскольку $\beta < 0$, наиболее связывающая орбиталь — с наибольшим $\lambda$. Бензол даёт $\alpha + 2\beta$, $\alpha + \beta$ (дважды), $\alpha - \beta$ (дважды), $\alpha - 2\beta$; у его шести электронов $E_\pi = 6\alpha + 8\beta$, что на $2\beta$ ниже трёх изолированных двойных связей. При $|\beta| \approx 75$ kJ/mol — грубом термохимическом значении, подогнанном к энтальпии гидрирования бензола (спектроскопия указывает на большее $|\beta|$, так что считайте его приближённым), — это знаменитые $\approx 150$ kJ/mol ароматической стабилизации.
  У циклобутадиена два электрона остаются на вырожденной паре при $\alpha$: нет энергии делокализации, нулевая щель, бирадикал, и он даже менее устойчив, чем бутадиен с открытой цепью: антиароматичность. Для цикла из $N$ атомов уровни равны $\alpha + 2\beta\cos(2\pi k/N)$: один нижний уровень, а затем вырожденные пары (круг Фроста), поэтому замкнутая оболочка требует $2 + 4n$ электронов: правило Хюккеля. Нечётные циклы показаны в виде их ароматических ионов, таких как циклопентадиенил-анион и катион тропилия. Порядки связей $P_{ij} = \sum_k n_k C_{ik}C_{jk}$ для бутадиена — $0.894$ для концевых связей и $0.447$ для средней — соответствуют его чередованию длин связей «короткая–длинная–короткая»; в бензоле все шесть равны $2/3$. Для альтернантных углеводородов (без нечётных циклов) теорема о парности делает спектр симметричным относительно $\alpha$, а все π-заряды нулевыми. Выберите другую молекулу, чтобы увидеть её граничные орбитали: HOMO и LUMO определяют, куда атакуют электрофилы и нуклеофилы,
  а через щель — цвет (более длинные полиены поглощают на более длинных волнах).'
meanings:
- $1$ для связанных атомов углерода $i, j$ молекулы $b$ (атомы на расстоянии одной длины связи), дополнено до наибольшего $N = 10$
- матрица Хюккеля; атомы-заполнители получают огромный диагональный элемент, чтобы их фиктивные орбитали никогда не заполнялись
- 'энергии МО (по возрастанию: сначала связывающие, так как $\beta < 0$) и коэффициенты, МО $k$ в столбце $k$'
- заполнение по принципу Ауфбау по 2 электрона на МО; частично заполненный вырожденный набор делит свои электроны
- 'повторяющийся $k$ ⇒ суммирование: полная π-энергия $E_\pi$'
- энергия делокализации относительно изолированных двойных связей по $2(\alpha + \beta)$ каждая
- 'повторяющийся $k$ ⇒ суммирование по занятым МО: порядок связи по Коулсону на связи, π-заселённость на диагонали'
- π-заряд $1 - P_{bii}$; ноль на каждом атоме этих альтернантных углеводородов
- уровни цикла в замкнутой форме, проверенные через eigh циклической матрицы смежности
labels:
  molecule: Молекула для изображений орбиталей
  ring_max: Наибольший размер цикла $N$
  beta: $|\beta|$ для перевода в kJ/mol (приближённо)
