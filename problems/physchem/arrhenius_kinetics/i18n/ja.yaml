source_hash: 65c4646e64b8
title: 速度式とアレニウスプロット
summary: 反応はどれほど速く進み、温かくなるとどれだけ速くなるのか？0 次、1 次、2 次の速度式を、$k(T) = A\,e^{-E_a/RT}$ として六つの温度について一つの $(O, T)$ テンソルで一度に積分する。そしてノイズを含む合成実験から、反応次数（$[A]$、$\ln[A]$、$1/[A]$ のどのプロットが直線か？）と活性化エネルギー（$1/T$ に対する $\ln k$ の最小二乗直線）を明らかにする。
notes: 各速度式には、適切な変数で直線になる積分形がある：$[A] = [A]_0 - kt$（0 次）、$\ln[A] = \ln[A]_0 - kt$（1 次）、$1/[A] = 1/[A]_0 + kt$（2 次）。そこで化学者は三つすべてをプロットし、最もまっすぐなもの（$R^2$ が最も 1 に近いもの）を採用する。その傾きが $\mp k$ である。第二の判定法は半減期を使う：$t_{1/2} \propto [A]_0^{1-n}$ なので、$[A]_0/2$ から $[A]_0/4$ までの時間は最初の半減期の $2^{n-1}$ 倍（短い、等しい、二倍）であり、$n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$ が得られる。いくつかの温度で実験を繰り返すと $k(T)$ が得られ、$1/T$ に対する $\ln k$ のアレニウスプロットは傾き $-E_a/R$ の直線になる。$E_a = 75$ kJ/mol では、290 K から 300 K に温めると反応はおよそ 2.8 倍速くなる。「10 K ごとに二倍」という昔の経験則は、室温付近で $E_a \approx 50$ kJ/mol に相当する。各実験は A の 90 % が反応するまで追跡するので、低温の実験は高温よりずっと長くかかる（凡例を参照）。左のプロットは各実験の時間に対する割合を使い、六つすべてを一つの軸に収めている。これはどのプロットが直線になるかを変えない。データは合成である（架空の反応、固定シードのガウスノイズ）。$\ln$ や $1/x$ をとると、後半の希薄な点のノイズが拡大される（$\sigma/[A]$ と $\sigma/[A]^2$）ので、各点を $(dg/d[A])^{-2}$、すなわち $1$、$[A]^2$、$[A]^4$ で重み付けし、$[A]_0$ の 2 % 未満の点は除外する。ノイズを大きくすると $R^2$ 判定の決め手が弱まり、温度範囲を狭めると $E_a$ の誤差が大きくなる様子が見える。
meanings:
- $T_{min}$ と $T_{max}$ の間の六つの温度（K）
- 反応次数 $0, 1, 2$、並べて積分する
- アレニウスの速度定数、単位は $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$
- 各実験の速度；どの添字についても和をとらず、$k_t$ は次数方向にブロードキャストされる
- 各実験は転化率 90 % まで、それぞれの時計 $t = \tau\,t_{end}$ で追跡する
- RK4 の軌跡、テストで厳密な積分形と比較する
- $t$ に対する三つのプロット；正しい次数だけが直線になる
- 直線フィットの計画行列
- 正規方程式の行列；$s$（標本）について和；重み $w_s = (dg/d[A])^{-2}$、$w_s = 0$ で $[A]_0$ の 2 % 未満の点を除く
- 切片と傾き、すべてのプロットと温度について一度に
- アレニウス直線：傾き $-E_a/R$、切片 $\ln A$
labels:
  Ea: 活性化エネルギー $E_a$
  log10_A: 頻度因子 $\log_{10} A$
  order: 測定する反応の次数
  T_min: 最低温度 $T_{min}$
  T_max: 最高温度 $T_{max}$
  noise: 測定ノイズ $\sigma$
