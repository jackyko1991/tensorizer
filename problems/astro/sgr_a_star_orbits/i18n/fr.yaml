source_hash: 28a44bb1dca2
title: 'Peser Sgr A* : l''orbite de l''étoile S2'
summary: 'L''étoile S2 fait le tour du centre de la Voie lactée en 16 ans et passe à moins de 120 UA d''une masse invisible. Une orbite képlérienne, dont l''équation de Kepler est résolue par des itérations de Newton vectorisées, est ajustée sur 25 ans de positions et de vitesses radiales réelles. Levenberg–Marquardt, avec des jacobiennes calculées par autograd, part de 64 points de départ aléatoires à la fois et retrouve un trou noir d''environ $4.3\times 10^6\,M_\odot$ à $R_0 \approx 8.3$ kpc. L''ajustement prédit ensuite les deux effets relativistes détectés plus tard par GRAVITY : environ 200 km/s de décalage vers le rouge au péricentre et $12''$ de précession par orbite.'
notes: 'Depuis le début des années 1990, deux équipes, dirigées par Reinhard Genzel (MPE, télescopes de l''ESO) et Andrea Ghez (UCLA, Keck), suivent les étoiles de la seconde d''arc centrale de la Galaxie. S2 est l''étoile la plus brillante à orbite courte. Son ellipse de 16 ans fixe la masse enfermée dans un volume trop petit pour contenir autre chose qu''un trou noir. Les positions donnent la taille angulaire et la période de l''orbite, et les vitesses radiales (décalages Doppler des raies spectrales) sa taille réelle en km. Ensemble, elles fournissent la distance $R_0$ et, via la troisième loi de Kepler, la masse. Le modèle a 8 paramètres : six éléments orbitaux plus $M$ et $R_0$ (la période découle de $P^2 = 4\pi^2(aR_0)^3/GM$). L''ajustement utilise Levenberg–Marquardt avec des jacobiennes obtenues par autograd, lancé simultanément depuis de nombreuses orbites de départ aléatoires. Beaucoup tombent dans des minima locaux, d''où la nécessité d''un lot de départs, et l''on garde le meilleur
  $\chi^2$. L''équation de Kepler est résolue par des itérations de Newton sur des tenseurs détachés, puis par une dernière étape enregistrée dans le graphe de calcul, de sorte qu''autograd voit la dérivée implicite exacte. Résultat avec les valeurs par défaut : $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ kpc, $P \approx 16.03$ ans, $e \approx 0.884$, avec $\chi^2 \approx 336$ pour 334 données. Valeurs publiées : $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ et $8.32 \pm 0.07 \pm 0.14$ kpc à partir de 17 étoiles (Gillessen et al. 2017). L''ajustement prédit ensuite deux effets relativistes qu''il n''inclut pas. Au péricentre (120 UA, 7700 km/s, 2.6 % de $c$), le décalage gravitationnel vers le rouge et l''effet Doppler transverse ajoutent environ 200 km/s ; GRAVITY a mesuré $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ de cette valeur de la RG après le péricentre de mai 2018 (GRAVITY Collaboration 2018). L''orbite précesse aussi de $6\pi GM/(c^2a(1-e^2))
  \approx 12''$ par révolution, mesuré à $f_{SP} = 1.10 \pm 0.19$ fois la valeur de la RG (GRAVITY Collaboration 2020). Ce sont des détections citées, non calculées à partir de ces données : la table de 2016 s''arrête avant le péricentre de 2018. Simplifications : une orbite de Kepler pure, sans retard de Rømer (temps de trajet de la lumière à travers l''orbite, environ 8 jours), sans termes relativistes et sans dérive du référentiel (l''article ajuste 5 paramètres de référentiel supplémentaires). Données : Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), table 5 des données de S2 tirée du catalogue VizieR/CDS J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030), utilisée avec citation selon les conditions d''utilisation du CDS. Prix : Prix Shaw d''astronomie 2008 (Genzel), prix Crafoord d''astronomie 2012 (Genzel et Ghez) et prix Nobel de physique 2020 (moitié à Genzel et Ghez, pour la découverte d''un objet compact supermassif au centre de notre galaxie).'
meanings:
- 'une orbite par départ : $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- anomalie excentrique par itérations de Newton, pour toutes les orbites et époques à la fois
- plan orbital → (nord, est, ligne de visée), construit avec einsum
- 'somme sur $j$ : position de S2 en UA ; divisée par $R_0$, elle donne des mas sur le ciel'
- 'vitesse le long de la ligne de visée en km/s : c''est elle qui fixe $R_0$'
- (modèle − données)/$\sigma$ pour 145 RA, 145 Dec et 44 vitesses
- autograd en mode direct, vectorisé (vmap) sur les 8 directions de paramètres
- une étape de Levenberg–Marquardt pour tous les départs à la fois
- '$6\pi GM/(c^2a(1-e^2))$ : précession de Schwarzschild, $\approx 12''$ pour S2'
