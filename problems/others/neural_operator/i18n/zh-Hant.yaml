source_hash: 4e46f39a529c
title: 傅立葉神經算子：學習伯格斯方程式的解算子
summary: 傅立葉神經算子（FNO）不是只解一個方程式，而是從頻譜求解器產生的資料對中，學習黏性伯格斯方程式 $u_t + u\,u_x = \nu\,u_{xx}$ 的整個映射 $u_0(x) \mapsto u(x, T)$。它的核心層是頻譜卷積：做傅立葉轉換，用複數權重 $R_{iok}$ 逐一模態地混合通道，只保留最低的 $m$ 個模態，再轉換回來。由於權重定義在傅立葉模態上，訓練好的模型也能在比訓練時更細的網格上執行。
notes: 訓練資料是資料對 $(u_0, u(\cdot, T))$：隨機的平滑初始條件（傅立葉模態 $k \le 5$ 的和，振幅按 $1/k$ 遞減）及其解，由擬頻譜求解器在 256 個點上計算，再降採樣為 64 個點用於訓練。網路從未看過方程式，只看過求解器的資料。張量的重點是頻譜卷積：rfft 之後，每個樣本 $b$ 的每個通道 $i$ 變成傅立葉係數 $\hat v_{bik}$，而 einsum('bik,iok->bok') 對輸入通道 $i$ 求和，但把波數 $k$ 保留為自由指標，因此每個模態都有自己的 $C\times C$ 複數矩陣 $R_{\cdot\cdot k}$。這是一個以全域、可學習核進行的卷積，在傅立葉空間中以乘積計算。較高的模態 $k \ge m$ 被截斷；局部路徑 $W_{oi}v_{bix}$ 與非線性函數 $\sigma$ 再把細節補回來。$R_{iok}$、$W_{oi}$、$P$ 與 $Q$ 都與網格點數無關，所以訓練好的算子可以在任何多於 $2m$ 個點的網格上執行：右下方的面板把「同一組」權重套用到 256 個點上（零樣本超解析度），對象是波前最陡的測試案例。64 點的預測（圓點）落在 256 點的曲線上：這種離散化不變性只是近似的，因為 $\sigma$ 會產生諧波，在不同網格上的混疊不同，但 256 點上的誤差與 64 點上的誤差相同。限制精度的是模型而不是網格：接近震波的解需要高於 $m$ 的模態，是最難的案例。和本主題中的 PINN 比較：PINN 把方程式放進損失函數來解「一個」問題，每換一個初始條件都必須重新訓練；神經算子則從求解器資料學習一整族問題，之後每個新預測只需要一次前向傳遞。終端機會印出這次前向傳遞與求解器的時間比較：這裡快了數十倍，但對一維伯格斯方程式而言，求解器本來就很便宜，產生資料與訓練的成本遠高得多。神經算子的價值在於單次模擬就要數小時（天氣、紊流、多孔介質流）且需要大量查詢的情況，而且只在其訓練資料的分佈範圍內有效。試試更少的模態 $m$、更小的訓練集，或更大的 $\nu$（解更平滑，更容易學）。簡化之處：只有一個輸出時間 $T$、固定的亂數種子、把網格位置當作普通的輸入通道，且不做填補（反正定義域是週期性的）。
meanings:
- 輸入函數：樣本 $b$ 在 $N$ 個網格點上的 $u_0$ 與位置
- 提升：對 $f$ 求和，在每個點上把 2 個特徵變成 $C$ 個通道
- 每個通道 $i$、波數 $k$ 的複數傅立葉係數
- 複數權重，每個保留的模態 $k < m$ 各有一個 $C\times C$ 矩陣：與 $N$ 無關
- 重複的 $i$ ⇒ 求和；$k$ 不求和：每個模態分別混合
- 截斷：只有最低的 $m$ 個傅立葉模態通過頻譜卷積
- 回到任意 $N$ 個網格點：解析度就是在這裡決定的
- 局部路徑，每個點都用同一個 $C\times C$ 矩陣；$\sigma$ = GELU
- 逐點的兩層投影，從 $C$ 個通道得到預測的 $u(x, T)$
- 每個樣本的相對 $L^2$ 誤差，對批次取平均：Adam 最小化的損失函數
- 資料：擬頻譜求解器，積分因子 RK4 搭配 2/3 去混疊規則，所有樣本一次計算
labels:
  nu: 黏滯係數 $\nu$
  t_final: 輸出時間 $T$
  n_train: 訓練樣本數（初始條件）
  modes: 保留的傅立葉模態數 $m$
  width: 通道數 $C$
  epochs: 訓練回合數
  lr: Adam 學習率
