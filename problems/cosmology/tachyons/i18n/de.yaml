source_hash: e3fd71733e91
title: Tachyonen und das Antitelefon
summary: 'Was wäre, wenn ein Teilchen eine imaginäre Masse hätte, $m^2 < 0$? Mit komplexen Tensoren liefert $E^2 = p^2 + m^2$ weiterhin reelle Energien, doch das Teilchen ist stets schneller als das Licht und wird schneller, während es Energie verliert. Gebündelte Lorentz-Boosts überlichtschneller Weltlinien finden Bezugssysteme, in denen das Signal ankommt, bevor es gesendet wird, und schließen Tolmans Antitelefon-Schleife. In der Feldtheorie bedeutet $m^2 < 0$ dagegen ein instabiles Vakuum, das kondensiert, wie es das Higgs-Feld tut. Spekulativ: Noch nie wurde ein Tachyon beobachtet, und die „überlichtschnellen Neutrinos“ von OPERA aus dem Jahr 2011 gingen auf ein lockeres Kabel zurück.'
notes: 'Spekulative Physik: Tachyonen sind hypothetisch. Kein Teilchen des Standardmodells ist tachyonisch, und kein Experiment hat je eines nachgewiesen. Die spezielle Relativitätstheorie verbietet, einen massiven Körper über $c$ hinaus zu beschleunigen, aber sie verbietet für sich genommen keine Teilchen, die stets schneller als das Licht sind (Bilaniuk, Deshpande und Sudarshan 1962; Feinberg 1967, der den Namen prägte). Der Preis ist die Kausalität. Zwei Ereignisse, die durch ein Signal der Geschwindigkeit $u > c$ verbunden sind, sind raumartig getrennt, sodass ihre zeitliche Reihenfolge vom Beobachter abhängt: In jedem Bezugssystem, das sich schneller als $c^2/u$ bewegt, kommt das Signal an, bevor es gesendet wird, und trägt negative Energie. Feinbergs Uminterpretation deutet das als Antitachyon positiver Energie, das in die Gegenrichtung läuft; das rettet die Positivität der Energie, lässt aber „wer es gesendet hat“ vom Bezugssystem abhängen. Mit zwei Bezugssystemen erhält man Tolmans
  Antitelefon (1917): Alice sendet ein Signal an Bob, der sich mit $\beta$ entfernt, und Bob antwortet mit derselben Geschwindigkeit in seinem eigenen Bezugssystem. Die Antwort erreicht Alice, bevor sie die Nachricht abgeschickt hat, sobald $\beta > 2u/(1+u^2)$ gilt, womit sich eine Kausalschleife schließt. In der Quantenfeldtheorie ist ein negatives $m^2$ kein schnelles Teilchen, sondern eine Instabilität. Das Feld rollt vom Hügel $\phi = 0$ von $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ hinab nach $\phi = \pm\sqrt{-m^2/\lambda}$ („Tachyonenkondensation“, die die Energie um $m^4/4\lambda$ absenkt), wo gewöhnliche Teilchen mit Masse$^2 = 2|m^2|$ leben. Genau das tut das Higgs-Feld, und das Panel zeigt es auf einem Gitter mit Hubble-artiger Reibung. Echte Daten: 2011 meldete OPERA Myon-Neutrinos, die auf 730 km um $60.7 \pm 6.9 \pm 7.4$ ns zu früh ankamen, $(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1). Als Ursache erwies sich ein schlecht angeschlossenes Glasfaserkabel
  plus eine Uhrendrift. Das korrigierte Ergebnis lautet $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ (v4, JHEP 10 (2012) 093), und ICARUS maß $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns (Phys. Lett. B 713 (2012) 17): beide mit $c$ verträglich. Als Tachyon gedeutet, würde der Wert von 2011 $|m| \approx 120$ MeV erfordern, und dann hätten die 10-MeV-Neutrinos der Supernova SN1987A das Licht um einen Faktor von etwa 12 überholt, statt nach 168 000 Jahren innerhalb weniger Stunden nach ihm anzukommen ($|v-c|/c \lesssim 2\times10^{-9}$, Longo 1987). Einheiten: $c = 1$, Tachyonenmasse $\mu = 1$ für den Signalfächer.'
meanings:
- 'komplexe Quadratwurzel: reell für $p > \mu$, obwohl $m$ und $\gamma$ beide imaginär sind'
- ein Lorentz-Boost pro Beobachter-Bezugssystem ($c = 1$)
- 'wiederholtes $b$ ⇒ summiert: jedes Signal aus jedem Bezugssystem auf einmal gesehen'
- die Invariante $m^2 = -\mu^2$, in jedem Bezugssystem gleich
- 'Rapiditäten subtrahieren sich: $\tanh$ unterhalb von $c$, $\coth$ oberhalb'
- wann die Antwort Alice erreicht; $< t_{\mathrm{send}}$ schließt eine Kausalschleife
- Gitterfeld, das vom falschen Vakuum $\phi = 0$ hinabrollt (torch.roll-Laplace-Operator, Geschwindigkeits-Verlet)
labels:
  u: Geschwindigkeit des Tachyonensignals $u$
  beta_max: Schnellstes Beobachter-Bezugssystem $\beta_\mathrm{max}$
  m2: Tachyonische Masse$^2$ des Feldes $m^2$
  lam: Selbstkopplung $\lambda$
  friction: Hubble-Reibung $\gamma$
