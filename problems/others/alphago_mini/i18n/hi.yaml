title: 'लघु AlphaGo: $5\times5$ गो बोर्ड पर ट्री सर्च'
summary: 'एक छोटे बोर्ड पर गो का एक सेल्फ-प्ले खेल, जिसकी हर चाल उसी खोज से चुनी जाती है जिसका उपयोग AlphaGo ने किया था: PUCT नियम के साथ मोंटे कार्लो ट्री सर्च। गो के नियम स्वयं टेंसर संक्रियाएँ हैं: कैप्चर और क्षेत्र-आधारित गणना दोनों फ्लड फ़िल हैं, हर चरण में बोर्ड के आसन्नता आव्यूह के साथ एक einsum। हर नई स्थिति का मूल्यांकन एक साथ खेले गए यादृच्छिक खेलों के पूरे बैच से होता है। देखिए कि विज़िट गणनाएँ उस चाल पर कैसे केंद्रित होती हैं जिस पर खोज भरोसा करती है।'
notes: 'हर सिमुलेशन PUCT अधिकतम चुनते हुए ट्री में नीचे उतरता है, एक नई स्थिति जोड़ता है, उसे यादृच्छिक प्लेआउट के बैच से अंक देता है और वह परिणाम पथ की हर चाल में जोड़ देता है। अच्छी चालें विज़िट जमा करती हैं, इसलिए खोज हर लाइन को देखे बिना वहीं केंद्रित होती है जहाँ ज़रूरी है। AlphaGo ने यही लूप इस्तेमाल किया, लेकिन समान प्रायर $P_a$ की जगह पॉलिसी नेटवर्क और यादृच्छिक प्लेआउट की जगह वैल्यू नेटवर्क रखा, दोनों खेलों पर प्रशिक्षित; AlphaGo Zero ने दोनों को केवल सेल्फ-प्ले से सीखा। $5\times5$ पर केंद्र से शुरुआत काले के लिए मज़बूत है, और कम सिमुलेशन पर खोज स्पष्ट गलतियाँ करती है; सिमुलेशन बढ़ाइए तो खेल अधिक सटीक पर धीमा हो जाता है। नियम: Tromp–Taylor (आत्मघाती चाल अपना ही समूह हटा देती है, क्षेत्र-आधारित गणना) एक सरल को जाँच के साथ।'
meanings:
- 'बोर्ड का बिंदु $p$: $+1$ काला, $-1$ सफ़ेद, 0 खाली'
- 'बोर्ड एक ग्राफ़ के रूप में: 1 जब $p$ और $q$ क्षैतिज या ऊर्ध्वाधर पड़ोसी हों'
- 'फ्लड फ़िल: खाली बिंदुओं से एक रंग के रास्ते लिबर्टी वाले समूह मिलते हैं; बाकी कैप्चर हो जाते हैं'
- 'क्षेत्र-आधारित गणना: पत्थर और वे खाली बिंदु जिन तक केवल वही रंग पहुँच सकता है, काला घटा सफ़ेद घटा कोमी $k$'
- $R$ यादृच्छिक खेल एक $(R, n^2)$ टेंसर के रूप में खेले गए; काले का औसत परिणाम; अपनी आँख कभी नहीं भरी जाती
- 'PUCT: मान $Q_a$ और एक अन्वेषण बोनस जो चाल $a$ के विज़िट होने पर घटता है; समान प्रायर $P_a$'
- 'सभी सिमुलेशन के बाद विज़िट गणनाएँ (अंतिम प्रविष्टि: पास); सबसे अधिक विज़िट की गई चाल खेली जाती है'
