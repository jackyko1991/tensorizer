source_hash: 1f16a1cee568
title: 質數螺旋與哈代–李特爾伍德猜想
summary: 把質數篩進一個布林張量，再畫在烏拉姆螺旋與薩克斯螺旋上，質數會聚集在一條條線上。每條線都是一個二次式，例如歐拉的 $k^2 + k + 41$，而哈代–李特爾伍德猜想預測它含有多少質數。接著用同一個篩法檢驗他們對孿生質數與哥德巴赫問題的預測，以及克拉梅爾的質數間隙隨機模型。這些都是猜想：程式以數值方式檢驗它們，並沒有證明它們。
notes: 烏拉姆（1963）把整數寫在正方形螺旋上，注意到質數沿著對角線排列；薩克斯螺旋（1994）把 $n$ 放在半徑 $\sqrt n$、角度 $2\pi\sqrt n$ 處，呈現的則是曲線。烏拉姆螺旋的每條對角射線都承載一個二次式 $4k^2 + bk + c$ 的值；在從 41 開始的螺旋上，主對角線就是歐拉的 $k^2 + k + 41$，它在 $k = 0, \dots, 39$ 時都是質數（已證明：Rabinowitsch 證明了 $k^2 + k + p$ 對所有 $k < p - 1$ 都是質數，若且唯若 $\mathbb Q(\sqrt{1 - 4p})$ 的類數為一，所以 $p \in \{2, 3, 5, 11, 17, 41\}$，這個列表由 Heegner 與 Stark 完成）。有些射線很稠密、有些卻是空的，原因在於剩餘：當判別式對許多小質數都是非剩餘時，$f$ 對這些質數取模就沒有根。哈代與李特爾伍德（1923）把這個想法寫成猜想 F，而 Bateman–Horn 猜想（1962）將它重述為 $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$。右上方面板一次在數百個二次式上檢驗它：隨著 $K$ 增大，量得的常數趨近預測的 $C(f)$（對角線）。目前甚至還不知道有任何一個二次式能取到無窮多個質數值：對 $n^2 + 1$ 而言，這就是朗道第四問題（1912），至今仍未解決。對歐拉的多項式，哈代與李特爾伍德引用的是對奇質數的乘積 $3.3197732$；Bateman–Horn 常數包含來自 $p = 2$ 的因子 2（這些值永遠是奇數），所以它是 $6.6395$。常數為 $C_2 = 0.6601618\ldots$ 的孿生質數猜想，以及帶有奇異級數的哥德巴赫猜想，是同一個想法分別用於 $p$ 與 $p + 2$、以及 $p$ 與 $N - p$。篩法重現了已知的計數 $\pi_2(10^6) = 8169$ 與 $\pi_2(10^7) = 58980$，而哥德巴赫彗星會塌縮到預測上：彗星的各條帶就是奇異級數（綠色：$3 \mid N$）。這兩個猜想都仍未解決。哥德巴赫猜想已對所有不超過 $4 \cdot 10^{18}$ 的偶數驗證（Oliveira e Silva、Herzog 與 Pardi，2014）；張益唐（2014）以及
  Polymath 與 Maynard 的工作證明了存在無窮多個不超過 246 的質數間隙，而陳景潤（1973）證明了每個充分大的偶數都是一個質數加上至多兩個質數的乘積。克拉梅爾模型（1936）把每個 $n$ 視為以機率 $1/\ln n$ 為質數；它預測間隙呈指數分布、平均值為 $\ln p$，與我們觀察到的相近，最大間隙約為 $\ln^2 p$，但它對孿生質數個數的預測恰好差了因子 $2C_2 \approx 1.32$（虛線），因為它忽略了被 2、3、5、… 整除的情況。Maier（1985）證明它在其他方面也會失效，而 Granville 提出最大間隙可達 $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$。
meanings:
- 埃拉托斯特尼篩法：每個質數 $p \le \sqrt{n_\text{max}}$ 做一次跨步切片
- 一次求出每個數在烏拉姆螺旋上的位置，依據它所在的環 $k = \lceil(\sqrt m - 1)/2\rceil$ 以及它到角落 $(2k+1)^2$ 的距離
- 薩克斯螺旋：平方數 $k^2$ 落在正 $x$ 軸上
- $F$ 個二次式 $4k^2 + bk + c$（烏拉姆螺旋的對角射線）在每個 $k$ 的值
- 在篩中查每個值；累加和計數每條射線上的質數
- 由歐拉判別法 $(D/p) \equiv D^{(p-1)/2}$（其中 $D = b^2 - 4ac$）求 $f_i$ 模 $p$ 的根；對 $p < 50$ 則直接嘗試
- 重複的 $p$ ⇒ 求和：歐拉乘積寫成對質數 $p < 10^5$ 的對數和
- 重複的 $m$ ⇒ 求和：哥德巴赫計數寫成自卷積，以 FFT 計算
- 滿足 $p \le x$ 的孿生質數對 $(p, p+2)$
- 正規化的間隙，與克拉梅爾隨機模型的 $e^{-s}$ 定律比較
