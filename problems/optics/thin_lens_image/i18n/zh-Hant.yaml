source_hash: b20963373157
title: 薄透鏡成像
summary: 薄透鏡方程式告訴我們物體的像出現在哪裡、有多大。對每個物體位置同時追蹤三條主光線，物體從 $2f$ 之外走到焦距之內，實像、倒立像隨之變成虛像、正立像。
notes: 距離從透鏡起算：物體位於 $x = -s$，實像位於 $x = +s'$。三條主光線為：(1) 平行於光軸入射，再通過遠側焦點；(2) 直接穿過中心；(3) 通過近側焦點，再平行射出。它們都來自同一條規則 $\theta' = \theta - y/f$。物體在 $f$ 之內時，光線在透鏡後發散；虛線延長線交於虛像。在 $s = f$ 時像跑到無窮遠。
meanings:
- 動畫第 $k$ 格的物距
- 像距；為負 ⇒ 位於物體同側的虛像
- 像高 / 物高；為負 ⇒ 倒立
- 主光線 $r \in \{\text{parallel, centre, focal}\}$ 在透鏡前的斜率
- 各主光線穿過透鏡的位置
- 透鏡後的斜率：每條光線都偏折 $-y/f$
labels:
  f: 焦距 $f$
  h: 物高 $h$
  s_start: 起始物距
  s_end: 最終物距
