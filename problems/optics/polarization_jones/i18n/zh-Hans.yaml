source_hash: 3434371fc2c6
title: 用琼斯矩阵描述偏振
summary: 光的偏振是一个复二维矢量 $(E_x, E_y)$，每个偏振片或波片都是一个复 $2\times 2$ 矩阵。光先通过波片再通过旋转的偏振片：$\mathbf E$ 场椭圆和透射强度由 einsum 得到，重现马吕斯定律，并把线偏振光变为圆偏振光。
notes: 光起初以输入角线偏振，强度 $I_0 = 1$。右图灰色虚线是马吕斯定律 $I_0\cos^2\theta$（无波片）；蓝色曲线是经过波片后的透射强度。与输入方向成 45° 的四分之一波片产生圆偏振光（$\lvert E_x\rvert$ 与 $\lvert E_y\rvert$ 相等，相位差 90°），因此偏振片在任何角度都透过 $I_0/2$。处于 $\alpha$ 的半波片使线偏振光旋转 $2\alpha$。单个琼斯矢量总是完全偏振的；自然光通过对两个正交输入的强度取平均来处理（main.py 打印的三偏振片检验就用了这一方法）。
meanings:
- 琼斯矢量：$E_x$ 和 $E_y$ 的复振幅（相位差决定形状）
- 把实验室坐标系转到元件自身的轴上
- 只保留沿角度为 $\theta$ 的透振方向的场
- 使慢轴延迟 $\Gamma$：$\Gamma = \pi/2$ 为四分之一波片，$\Gamma = \pi$ 为半波片
- 串接元件（对重复的 $j$ 求和）；光最先遇到的元件在右边
- 让光通过光学系统
- 重复的 $i$ ⇒ 求和：强度
- 一个周期内的实电场：描出偏振椭圆
labels:
  plate: 波片
  plate_angle: 波片快轴 $\alpha$
  input_angle: 输入偏振角
