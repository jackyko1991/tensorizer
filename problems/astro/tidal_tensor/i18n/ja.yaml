source_hash: c221614fc472
title: ブラックホール近傍のスパゲッティ化
summary: 粒子のリングが恒星質量ブラックホールに向かって落下する。リングにわたる重力の差が潮汐テンソル $T_{ij} = -\partial_i\partial_j\Phi$ であり、公式からと autograd のヘッシアンとして計算する。潮汐テンソルはリングを動径方向に引き伸ばし（$+2GM/r^3$）、横方向に押しつぶす（$-GM/r^3$ が2つ）：スパゲッティ化であり、潮汐半径の内側では実際の物体を引き裂く。
notes: 単位：$G = c = 1$、長さは $GM/c^2$ 単位なので、事象の地平面は $r_s = 2$ にある（太陽質量の10倍のブラックホールで 30 km）。リングの粒子どうしは引き合わない：青い点は厳密なニュートン重力に、赤い曲線は線形の法則 $\ddot\xi_i = T_{ij}\xi_j$ に従い、リングが $r$ に比べて小さいとみなせなくなるまで両者は一致する。オレンジ色の円は、リングと同じ大きさで質量 $m$ をもち自己重力でまとまっている物体が引き裂かれる位置を示す。恒星質量ブラックホールではその半径は地平面よりはるかに外側にあるので、落下する恒星（や宇宙飛行士）は地平面を越える前にずたずたにされる。超大質量ブラックホールでは地平面の内側にあることもある。ここでの重力はニュートン重力である。驚くべきことに、一般相対性理論において動径方向に落下する観測者の潮汐テンソルは、まったく同じ固有値 $(2, -1, -1)\,GM/r^3$ をもつ。計算は地平面の手前で止まる。
meanings:
- リング中心の位置（ブラックホールは原点）
- リング粒子 $b$ の中心からの変位
- 外積、和をとる添字なし
- 公式による潮汐テンソル
- autograd のヘッシアンとしての同じテンソル
- 繰り返される $j$ ⇒ 和をとる：線形の潮汐加速度
- 真空中では $= -\nabla^2\Phi = 0$
- 自己重力天体の潮汐（ロッシュ）半径
labels:
  r0: 開始距離
  r_stop: 落下を止める距離
  ring_radius: リングの半径
  n_particles: リングの粒子数
  mass_ratio: $r_t$ のための物体質量 $m/M$
  n_steps: RK4 のステップ数
