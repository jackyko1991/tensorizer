  - {symbol: '(ab)_k = a_0b_k + b_0a_k + \varepsilon_{kij}a_ib_j', code: 'qmul(a, b)', shape: '(..., 4)', meaning: 'the group law; repeated $i, j$ ⇒ summed (cross product)'}
  - {symbol: 'U(x+\hat\mu)', code: 'torch.roll(U, -1, dims=1 + mu)', shape: '(B, L, …, L, 4)', meaning: 'neighbour on the periodic lattice: every plaquette of every site at once'}
  - {symbol: '\tfrac12\mathrm{Tr}\,P_{\mu\nu}', code: 'plaquettes(links)', shape: '(B, D(D-1)/2, L, …, L)', meaning: 'the smallest Wilson loop; $\frac12\mathrm{Tr}(ab) = a_0b_0 - a_kb_k$'}
  - {symbol: 'A_\mu(x)', code: 'staple(links, mu)', shape: '(B, L, …, L, 4)', meaning: 'sum of the $2(D-1)$ staples: the part of $S$ that contains $U_\mu(x)$ is $-\beta\frac12\mathrm{Tr}(U_\mu A_\mu)$'}
