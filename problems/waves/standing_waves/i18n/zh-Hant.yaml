source_hash: 902cc4c799f5
title: 弦上的駐波
summary: 兩端固定的弦上的一維波動方程式。二階導數變成矩陣（有限差分模板 $D_{ij}$），因此一次 einsum 就能同時推進多條弦上的每個點：前幾個諧波與一條撥動的弦。
notes: 第 1 到 $n$ 列從單一諧波 $\sin(n\pi x/L)$ 的形狀開始，只在原地以 $f_n = nc/2L$ 起伏：這就是駐波。撥動的弦（三角形）是許多諧波之和，因此其折角分成兩部分跑向兩端，翻轉後再回來。經過一個基頻週期 $2L/c$ 後，每個形狀都回到起點。時間步長滿足 Courant 條件 $c\,\Delta t \le \Delta x$；能量 $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$（每單位線密度）保持不變，因為沒有任何東西阻尼這條弦。
meanings:
- 弦 $b$ 在內部格點 $i$ 的位移（兩個固定端不計入）
- 二階導數矩陣：對角線為 $-2$，相鄰為 $1$
- 重複的 $j$ ⇒ 求和：每條弦的 $\partial_x^2 u$
- 時間上的中央差分（蛙跳法）
- $D$ 的特徵值給出 $\omega_n^2 = -c^2\lambda_n$：即諧波
labels:
  n_harmonics: 顯示的諧波數
  pluck_at: 撥弦位置 $x_p/L$
  c: 波速 $c$
  L: 弦長 $L$
  n_points: 格點數
  periods: 模擬的基頻週期數
