source_hash: 51ed4214e669
title: ポアンカレ予想とリッチフロー
summary: 証明済み：閉じた単連結 3 次元多様体はすべて 3 次元球面である（Perelman 2002–03、Hamilton のリッチフロー計画を完成）。リッチフロー $\partial_t g = -2\,\mathrm{Ric}$ は、熱が温度をならすように計量をならす。ここではでこぼこした 2 次元球面のバッチを丸くし（Gauss–Bonnet $\int K\,dA = 4\pi$ は丸め誤差の範囲で成立）、ダンベル形の 3 次元球面のくびれを有限時間でつぶす（ネックピンチ）。これこそ Perelman の手術が切り取る特異点であり、その後それぞれの部分は丸くなる。
notes: 状態：証明済み。ポアンカレは 1904 年、すべてのループが 1 点に縮められる閉 3 次元多様体は 3 次元球面でなければならないかと問うた。Hamilton は 1982 年にリッチフローを導入し、正のリッチ曲率をもつ 3 次元多様体が丸い計量へ流れることを証明した。2 次元では球面上のあらゆる計量が丸くなり（Hamilton 1988、Chow 1991）、でこぼこ球面がそれを示している：$K$ のばらつきはゼロへ減衰し、$\int K\,dA = 4\pi$ と面積は一定に保たれる。$l = 1$ の調和関数は丸い球面の共形運動であり減衰しないが、形は変えない。3 次元ではフローが特異点を生じうる。くびれが十分細い回転対称なダンベルについて、Angenent と Knopf（2004）はネックピンチを証明した：くびれは円柱 $S^2 \times \mathbb R$ のように縮み、$\psi_\mathrm{neck}^2 \approx 2(T - t)$ となる一方、両端の球状部は大きいままである。Perelman の論文（arXiv 2002–03）は 3 次元のすべての特異点を制御し（局所的崩壊がないこと、標準近傍）、くびれを切ってキャップをかぶせる手術付きリッチフローを定義し、単連結多様体ではフローが有限時間で消滅し、各部分は消える直前に丸い球面になることを示した。よってその多様体は 3 次元球面であった。証明は Kleiner–Lott、Morgan–Tian、Cao–Zhu によって詳細に検証された。Perelman は 2006 年のフィールズ賞と 2010 年のクレイ・ミレニアム賞を辞退した。数値計算について：曲面は極角方向に有限体積格子を用いるので、離散 Gauss–Bonnet は厳密に成り立つ。3 次元球面は共形形式で書かれ、これは極で正則である（弧長形式ではそこで $\psi \to 0$ で割ることになり不安定）。くびれが細るにつれ両端の球状部が極付近に押し込まれるため、セルは極に向かって密に配置されている。くびれの半径が $0.05$ になったところでフローを止める。この時点では球状部はまだ解像されている。ここでの手術は Perelman の構成を戯画化したものにすぎない。太いくびれ（$\varepsilon \gtrsim
  0.5$）を試すと、ピンチは起こらず球面全体が丸くなる。
meanings:
- 各でこぼこ球面 $b$ のセル $i$ における共形因子。計量は $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$
- 繰り返す $j$ ⇒ 和をとる：丸い球面のフラックス形式ラプラシアン。フラックスは極でゼロになる
- 共形計量のガウス曲率。曲面上のリッチフローは $\partial_t g = -2Kg$
- 全曲率：どの計量でもちょうど $4\pi$（離散 Gauss–Bonnet）で、毎ステップのチェックになる
- 正規化フローの平均曲率の目標値。各面積を一定に保つ
- 3 次元球面 $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$ の断面曲率 $-\psi_{ss}/\psi$ と $(1-\psi_s^2)/\psi^2$（$\psi = e^u\sin x$）
- 計量を共形形式に保つ微分同相（ゲージ）項。座標を変えるだけで幾何は変えない
- 最小の $S^2$ 断面の半径。$\psi_\mathrm{neck}^2$ はピンチまでほぼ円柱の速さ $2$ で減少する
- 曲率の大きいくびれを切り取り、断面形状に接する丸いキャップを貼り付ける（Perelman の手術の戯画）
labels:
  neck: ダンベルのくびれの初期半径 $\varepsilon$
  t_surface: 曲面のフロー時間
  cells: 格子セル数 $N$
