source_hash: ebc73dcb492e
title: 256 個すべての基本セル・オートマトンと Lenia
summary: セルが一列に並び、新しい各セルは自分自身と左右の 2 つの隣接セルで決まる：この 3 ビットがコード $k \in \{0, \dots, 7\}$ をなし、ルール番号を 2 進数で書いたものがそのまま参照表になる。256 個のルールすべてを一つの $(256, W)$ テンソルとして、1 回の gather で同時に進める：ルール 90 はシェルピンスキーの三角形を描き、ルール 30 はランダムに見え、ルール 110 は相互作用する構造を作り、ルール 184 は車の流れを動かす。連続版の Lenia は参照表を滑らかなリング状カーネルに置き換え、滑走する生き物を育てる。
notes: Wolfram は基本ルールを 4 つのクラスに分類した：(1) すべてが死滅するか埋め尽くされる、(2) 静止または周期的なパターン、(3) カオス（例えばルール 30。その中央列は長く乱数生成器として使われた）、(4) 複雑で長寿命の相互作用する構造（例えばルール 110。Matthew Cook がチューリング完全であることを証明し、2004 年に発表した）。モザイクでは、151 セルのリング上で 600 ステップ後に行う大まかな自動判定で各ルールを色分けしている：一様、シフトを除いて周期的、または周期が見つからない。最後のグループにはクラス 3 と 4 が混在しており、両者を区別する厳密な定義は存在しない。ルール 90 は隣接セルを mod 2 で足し合わせるので、1 つのセルから始めると mod 2 のパスカルの三角形になる。ルール 184 は最も単純な交通モデルで、前のセルが空いていれば車が右へ進むため、車の数が保存される。ライフゲーム（2 次元、$3\times3$ の計数、ルールは 1 つ）と違い、ここではすべてのルールが同時に動く。Lenia（Bert Chan、2019）は空間・時間・状態をすべて連続にしたもので、その代表的なグライダー Orbium は Lenia とともに公開されたセル表（MIT ライセンス）から始まり、移動しながら質量を保つ。これは、どの保存則にも強制されていないのにソリトンのように振る舞うパターンの一例である。
meanings:
- ルール番号 $r$ のビット $k$：近傍コードが $k$ のときの新しい状態
- リング上のセル $i$ の左・中央・右のセル
- 繰り返される $j$ ⇒ 和をとる：3 ビットの近傍コード $4\,\text{left} + 2\,\text{centre} + \text{right}$
- 1 回の参照ですべてのルールを同時に進める
- ルールの左右反転と 0/1 反転；256 個のルールは 88 個の対称性クラスに分かれる
- 半径 $R = 13$ の滑らかなリング、総和が 1 になるよう正規化
- 周期的格子上の畳み込みをフーリエ変換の積として計算
- $U \approx \mu$ のところで成長し、それ以外では減衰する。刻み幅は $1/T$
labels:
  rule: あなたのルール $r$（最初のパネル）
  start: あなたのルールの初期状態
  width: 列の幅 $W$
  generations: 世代数
  density: ランダム初期状態の密度
  lenia_size: Lenia の世界 $S$
  lenia_steps: Lenia のステップ数
