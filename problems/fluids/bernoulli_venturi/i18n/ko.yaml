source_hash: 6140ba04c201
title: 베르누이 법칙과 벤투리관
summary: 좁아지는 관을 흐르는 물은 같은 유량을 나르기 위해 빨라져야 하고($A u = Q$), 베르누이 법칙에 따라 목 부분에서 압력이 떨어집니다. 단면적, 속도, 압력은 관 축 방향의 텐서이며, 여러 추적 입자가 빨라지는 모습을 보여 줍니다.
notes: 흐름은 1차원으로 다룹니다. 각 단면에서 속도가 균일하고 마찰을 무시하므로 여기서는 베르누이 법칙이 정확히 성립합니다. 국소 반지름의 일정 비율 위치에 있는 추적 입자는 벽을 따라갑니다. 압력계는 열린 관이며, 액주 높이 $h = p/(\rho g)$가 국소 계기 압력에 따라 높아집니다. $p_1 - p_2$를 재면 유량 $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$를 얻습니다. 이것이 벤투리 유량계의 원리입니다. 목 부분의 압력이 대기압보다 낮아지면 실제 흐름에서는 공동 현상이 생길 수 있으며, 여기서는 대신 경고를 출력합니다.
meanings:
- 관 축을 따른 점들, 지표 $k$
- 각 축 위치에서의 단면적
- '연속 방정식: 모든 단면을 초당 같은 부피가 지나감'
- '베르누이: 흐름이 빠를수록 ⇒ 압력이 낮음'
- RK4로 움직이는 추적 입자들의 위치
- 부피 유량 $A_1 u_1$ (m³/s)
labels:
  u1: 입구 속력 $u_1$
  area_ratio: 단면적 비 $A_1/A_2$
  p1: 입구 계기 압력 $p_1$
  t_max: 시뮬레이션 시간
