source_hash: 293708490c35
title: Контакты в белке по коэволюции (DCA)
summary: 'Остатки, соприкасающиеся в свёрнутом белке, мутируют согласованно в ходе эволюции. Мы сворачиваем модельный белок на кубической решётке, задаём связи $J_{ij}(a,b)$ на его контактах, выбираем множественное выравнивание последовательностей из модели Поттса сэмплированием Гиббса, а затем восстанавливаем контакты только по выравниванию: парная статистика через one-hot einsum, прямые связи через DCA в приближении среднего поля $J \approx -C^{-1}$ (или псевдоправдоподобие с autograd) и фробениусова оценка с поправкой APC, сверенная с истинной картой контактов.'
notes: 'Почему это работает? Если остаток $i$ меняет размер или заряд, соприкасающийся с ним остаток $j$ часто тоже должен измениться, иначе белок свернётся неправильно. На множестве родственных последовательностей это оставляет корреляцию между столбцами $i$ и $j$ выравнивания. Но корреляции транзитивны: если $i$ касается $j$, а $j$ касается $k$, то $i$ и $k$ тоже коррелируют, не соприкасаясь. Анализ прямых связей (DCA) подгоняет глобальную модель — модель Поттса ($q$-состояний модель Изинга), связи $J_{ij}$ которой объясняют все корреляции сразу, так что косвенные объясняются без собственных связей. В приближении среднего поля связи — это просто минус обратная ковариационная матрица (как частные корреляции); максимизация псевдоправдоподобия вместо этого подгоняет $P(s_i\mid\text{rest})$ для каждого столбца и обычно точнее на реальных семействах. Анимация наращивает выравнивание с 20 последовательностей до всех: DCA (верхний треугольник) улучшается с глубиной, а простая ковариация (нижний
  треугольник) застревает, потому что её ложные срабатывания — косвенные пары. Здесь данные действительно получены из модели Поттса с известными контактами, поэтому точность — честная оценка. Реальные выравнивания сложнее: несколько букв заменяют 20 аминокислот плюс пропуск, последовательности связаны филогенией (реальный DCA понижает вес почти дубликатов), и сигнал оставляют лишь некоторые контакты. Коэволюция лежит в основе современного предсказания структуры: контакты типа plmDCA питали ранние методы глубокого обучения, а AlphaFold 2 принимает MSA как основной вход и с помощью внимания учится собственному, гораздо более богатому способу его использования. Эта модель показывает статистическую идею, стоящую за этим входом, а не то, как работает AlphaFold. Попробуйте более слабую связь, меньше последовательностей или больше букв $q$.'
meanings:
- змеевидная цепь, заполняющая ящик $X\times Y\times Z$; контакт — соседи по решётке, отстоящие вдоль цепи не менее чем на 3
- '«истинная» модель: случайные поля и случайные блоки связей $q\times q$ только там, где $\mathcal C_{ij} = 1$'
- 'локальное поле: суммирование по $j, b$ по всем остальным столбцам и буквам последовательности $n$'
- 'шахматный Гиббс: контакты соединяют противоположные цвета, поэтому половина позиций пересэмплируется одновременно во всех $N$ цепях'
- выравнивание как one-hot тензор
- 'суммирование по $n$: одиночные и парные частоты; сумма $f_{iajb}$ по $b$ возвращает $f_{ia}$'
- связная корреляция после подмешивания псевдосчёта $\lambda$ равномерных частот
- 'DCA в приближении среднего поля: обращение квадратной ковариации размера $L(q-1)$; последняя буква — опорное состояние'
- 'альтернатива с псевдоправдоподобием: максимизация по $h, J$ методом Adam со штрафом $L_2$'
- сила связи пары, суммирование по $a, b$, в калибровке с нулевой суммой $J^z$
- 'поправка на среднее произведение (APC): убирает фон каждого столбца, так что строки и столбцы имеют среднее 0'
labels:
  fold: Решёточная укладка (размер ящика)
  q: Букв на столбец $q$
  coupling: Сила заданной связи $\sigma_J$
  n_seq: Последовательностей в MSA $N$
  sweeps: Проходов Гиббса на последовательность
  pseudocount: Псевдосчёт $\lambda$
  method: 'Вывод: DCA среднего поля или псевдоправдоподобие'
  plm_iters: Шаги Adam для псевдоправдоподобия
