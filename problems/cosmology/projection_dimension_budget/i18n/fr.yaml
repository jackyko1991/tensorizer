source_hash: b577c14eb932
title: Combien de dimensions ? Le budget de l'hypothèse de projection
summary: 'Une hypothèse spéculative, pas de la physique établie : de combien de dimensions cachées l''idée de projection a-t-elle besoin, et combien les expériences en permettent-elles ? Le côté quantique, d''après l''étape 1, demande une dimension complexe cachée par issue et $2^N$ pour $N$ particules intriquées, mais celles-ci vivent dans l''espace de Hilbert et n''ont pas besoin d''être des directions de l''espace. Du côté de la gravité, $n$ dimensions compactes de rayon $R$ modifient la loi de Newton en dessous de $R$. Balances de torsion, LHC, et contraintes issues des supernovae et des étoiles à neutrons remplissent une carte $(n, R)$ contrainte par contrainte. Toute valeur de $n$ survit, mais seulement si $R$ est petit : moins de 38.6 μm pour $n = 1$ et $2\times10^{-10}$ m pour $n = 2$. Contrainte, pas exclue.'
notes: 'Statut : spéculatif ; contrainte, pas exclue. Étape 3 de l''hypothèse de projection (l''idée spéculative personnelle de l''auteur, voir la description de la série ; pas de la physique établie), pour le postulat P5 : les effets quantiques demandent un certain nombre $d_Q$ de dimensions et la gravité un certain nombre $d_G$, estimés, jamais fixés à la main. L''étape 1 (cosmology/projection_postulate) a trouvé que la course de projection demande exactement une dimension complexe cachée par issue ; l''étape 2 (cosmology/projection_one_particle) a découpé une ligne d''univers ; l''étape 4 (cosmology/projection_singularity_fold) traite les singularités comme des plis de la projection. Aucun $n$ n''est supposé : la carte parcourt $n = 0$ à $n_{max}$ et $R$ de la longueur de Planck à 1 m. D''abord la physique connue. (a) Côté quantique : la course reproduit la règle de Born avec $d + K$ dimensions pour $K$ issues, et $N$ systèmes à deux niveaux intriqués demandent un espace de Hilbert de
  dimension $2^N$ ; la mécanique quantique standard utilise le même espace, et ses dimensions ne sont pas des directions de l''espace. Si on les lisait comme des directions spatiales, $N$ qubits demanderaient $2^{N+1} - 3$ dimensions réelles supplémentaires (5 pour une paire de Bell), un nombre qui changerait chaque fois que des particules s''intriquent, ce qu''aucune variété spatiale fixe ne fait. (b) Côté gravité : en $3 + n$ dimensions d''espace, la loi de Gauss donne une attraction $G_D M/r^{n+2}$ (vérifiée par des flux calculés par autograd à travers $S^{n+2}$ pour $n = 0..6$). Si les $n$ dimensions sont des cercles de rayon $R$, la somme sur les images transforme ceci en la loi de Newton $G_4 M/r^2$ avec $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ au-delà de $R$ (vérifié pour $n = 1, 2, 3$). Juste au-delà, le premier niveau de gravitons de Kaluza–Klein donne un terme de Yukawa avec $\alpha = 8n/3$ ($16/3$ pour un 2-tore, comme dans la revue du PDG) et $\lambda = R$. La relation ADD d''Arkani-Hamed,
  Dimopoulos et Dvali (1998), dans la convention $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$ utilisée par le PDG et les expériences du LHC, reproduit les nombres du PDG : $R = 30$ μm, $n = 2$ donne $M_D = 4.0$ TeV, et $M_D = 1$ TeV demande $10^{12}$ m, 0.5 mm, ..., 0.1 MeV$^{-1}$ pour $n = 1..6$. Contraintes (data/gravity_bounds.csv, nombres cités ; les lignes torsion et LHC sont celles fournies dans cosmology/hierarchy_extra_dimensions, citées à nouveau). Les balances de torsion d''Eöt-Wash excluent $|\alpha| = 1$ au-dessus de 56 μm (Kapner et al., PRL 98, 021101, 2007) et au-dessus de 38.6 μm (Lee et al., PRL 124, 101101, 2020) ; comme $\alpha\geq 1$ pour tout $n$, $R > 38.6$ μm est exclu pour tout $n\geq 1$ (conservateur : la courbe mesurée continue de descendre aux plus grands $\lambda$). Pour $n = 2$, Tan et al. (PRL 116, 131101, 2016) donnent $R < 30$ μm. La recherche monojet d''ATLAS (PRD 103, 112006, 2021, CC-BY 4.0) donne $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV pour $n = 2..6$. Le refroidissement
  de SN1987A donne $M_D > 27$ (2.4) TeV pour $n = 2$ (3) (Hanhart et al., PLB 509, 1, 2001), et le chauffage des étoiles à neutrons par des gravitons KK piégés donne $M_D > 1700$ (76) TeV (Hannestad et Raffelt, PRD 67, 125008, 2003), tous deux tels que cités dans la revue du PDG 2024. Chaque contrainte devient un masque booléen sur la grille $(n, R)$, et des points tests sont vérifiés contre des réponses calculées à la main. Résultat : $R_{max} = 38.6$ μm ($n = 1$), $1.7\times10^{-10}$ m ($n = 2$, étoiles à neutrons), $2.6\times10^{-12}$ m ($n = 3$), et les rayons du LHC pour $n = 4..6$ ($5\times10^{-13}$ à $2.5\times10^{-15}$ m). Pour $n\geq 7$, seule la contrainte de torsion est fournie ; les limites du LHC s''affaiblissent lentement avec $n$ et, extrapolées (non fait ici), pousseraient $R$ vers $1/M_D\sim 10^{-20}$ m. ADD avec $M_D = 1$ TeV, la solution originale du problème de la hiérarchie, est exclu pour $n = 1..6$. Le budget : minimum $n = 0$, car la gravité n''a besoin d''aucune
  dimension spatiale supplémentaire et les dimensions quantiques cachées n''ont pas besoin d''être spatiales ; aucun maximum, car les données permettent tout $n$ si $R < R_{max}(n)$. Quelle lecture l''hypothèse adopte : la lecture espace de Hilbert pour P1 et P2 (les dimensions cachées sont des dimensions de l''espace des états, donc $D_Q\geq 2^N$ n''est pas une contrainte sur l''espace), et la lecture géométrique pour P4 et P5 (dimensions de plongement ; si la gravité peut s''y propager, elles doivent être compactes et inférieures à $R_{max}(n)$, sinon ce sont des coordonnées du plongement, pas des lieux où l''on peut aller). Verdict : contrainte, pas exclue, et aucune nouvelle prédiction : l''hypothèse ne deviendrait testable que si elle fixait $n$ et $R$ près de ces contraintes.'
meanings:
- '$i$ répété ⇒ sommé : l''attraction vers l''extérieur en des points aléatoires de $S^{n+2}$ (autograd) ; le flux est le même à tout rayon'
- 'la masse et ses images autour des $n$ cercles, sommées sur l''indice d''image $I$ : $1/r^{n+2}$ à l''intérieur, $G_4/r^2$ à l''extérieur'
- 'plus grand rayon permis par une contrainte citée : $\lambda_{max}$ pour les balances de torsion, le rayon ADD à $M_D = M_b$ pour les limites des collisionneurs et astrophysiques'
- une carte booléenne par famille de contraintes, diffusée sur toute la grille
- 'le budget de dimensions : les dimensions compactes ne sont permises qu''en dessous de ce rayon'
- échelle fondamentale de la gravité pour $n$ dimensions de rayon $R$ (convention de Giudice–Rattazzi–Wells, celle qu'utilise le PDG)
- dimension de l'espace de Hilbert $2^N$ dont ont besoin $N$ qubits intriqués (étape 1)
labels:
  n_max: Plus grand nombre de dimensions supplémentaires $n$ sur la carte (tous les $n$ depuis 0 sont parcourus)
  R_points: Rayons sur la carte, espacés logarithmiquement de la longueur de Planck à 1 m
  M_star: Échelle fondamentale $M_D$ pour la droite ADD
  qubits: Qubits intriqués $N$ pour le décompte quantique
