source_hash: b1b7792277b6
title: 可変光速と地平線問題
summary: 標準的な ΛCDM では CMB の空は互いに信号を交換したことのない約 $10^4$ 個の領域に分かれるのに、なぜどの方向でも温度が同じなのか？宇宙のバッチについて $\chi_p = \int c\,d\ln a/(aH)$ を積分し、三つの答えを比較する：解決なし（ΛCDM）、インフレーション（ハッブル半径が縮む $\sim 60$ e-fold）、そして Moffat と Albrecht–Magueijo による推測的な可変光速（VSL）のアイデアで、相転移の前には光が約 $10^{26}$ 倍速かったとするものである。インフレーションが主流の説明であり、VSL は少数派の推測的な代替案である。
notes: Planck 2018 パラメータ（$H_0 = 67.4$ km/s/Mpc、$\Omega_m = 0.315$、$\Omega_r = 9.1\times10^{-5}$、平坦）、最終散乱は $a_\mathrm{rec} = 1/1090$。ΛCDM では現在の粒子地平線は 14.2 Gpc だが、再結合時には約 0.28 Gpc しかないため、一つの因果領域は約 1.2° に広がり、空にはそれが約 $10^4$ 個ある。共形図では光は 45° で進む。CMB 上の正反対の二点の過去光円錐が重なるのは $\chi_p(a_\mathrm{rec}) \ge D$（CMB までの距離、13.9 Gpc）のときだけである。インフレーションは $a_*$ で終わる $N$ e-fold のド・ジッター膨張によってこれを実現する（共動ハッブル半径は $\propto 1/a$ で縮む）。VSL は標準的な膨張を保ったまま、$a_*$ での転移の前に $c$ を $r$ 倍にする。転移は幅 $w = 0.1$ e-fold の滑らかな段差である。アニメーションでは両者を徐々にオンにする。現状：VSL（Moffat 1993；Albrecht と Magueijo 1999）は推測的で少数派の見解である。次元をもつ定数が変化しうる枠組みを必要とし（測定可能なのは $\alpha = e^2/4\pi\varepsilon_0\hbar c$ のような無次元の組み合わせだけ）、その予言はモデル依存であり、観測的な裏付けはない。インフレーションは標準的な説明であり、やはり直接には確認されていない（原始 B モードはまだ未検出）が、測定された CMB ゆらぎのスペクトルと整合する。制限（ターミナルに表示）：原子時計 $\dot\alpha/\alpha = (1.0\pm1.1)\times10^{-18}$/年、オクロ天然原子炉 2 Gyr にわたり $|\Delta\alpha/\alpha| \lesssim 10^{-7}$、CMB 再結合時 $|\Delta\alpha/\alpha| \lesssim 4\times10^{-3}$、そして GW170817 $-3\times10^{-15} \le (v_\mathrm{gw}-c)/c \le 7\times10^{-16}$。$a_*
  \sim 10^{-28}$ での転移はこれらすべてを回避するが、それこそが検証が非常に難しい理由でもある。
meanings:
- $a_*$ よりはるか以前から現在までの $\ln a$ 上の格子
- 各 $a$ における宇宙（フレーム）$m$ の光速：$a_*$ 以前は $c_0$ の $r$ 倍
- 膨張率。$N$ e-fold のインフレーション中は $H(a_*)$ に固定
- 共動ハッブル半径：一膨張時間に光が進める距離
- $a$ に沿った累積台形積分：共動粒子地平線
- CMB の空における一つの因果領域の角度と領域の数
labels:
  log10_c_ratio: VSL：初期の光速 $\log_{10}(c_\mathrm{early}/c_0)$
  efolds: インフレーション：e-fold 数 $N$
  log10_a_star: 転移／インフレーション終了 $\log_{10} a_*$
  n_grid: $\ln a$ 上の格子点数
