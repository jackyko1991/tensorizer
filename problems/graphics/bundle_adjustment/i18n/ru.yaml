source_hash: a99f4b65ce2b
title: 'Уравнивание связок: структура из движения методом Левенберга–Марквардта'
summary: Несколько камер фотографируют одни и те же 3D-точки с пиксельным шумом. Начиная с грубых поз (вращения в форме ось–угол $\boldsymbol\omega_c$, сдвиги $\mathbf t_c$) и грубых точек $\mathbf X_p$, уравнивание связок минимизирует суммарную ошибку перепроецирования $\tfrac12\sum_{c,p}\lVert\pi(R_c\mathbf X_p + \mathbf t_c) - \tilde{\mathbf u}_{cp}\rVert^2$ методом Левенберга–Марквардта. Якобиан даёт автоматическое дифференцирование, нормальные уравнения $J^{\mathsf T}J\,\Delta = -J^{\mathsf T}\mathbf r$ решаются через дополнение Шура, а фиксация 7 калибровочных степеней свободы делает решение единственным.
notes: 'Данные синтетические: точки в шаре радиуса 1, камеры на дуге на расстоянии 5 единиц (фокусное расстояние 1000 пикс., изображение $640\times 640$), каждую точку видит каждая камера, гауссов пиксельный шум $\sigma$. Начальное приближение поворачивает каждое вращение на несколько градусов и сдвигает каждую трансляцию и точку на долю размера сцены, так что первые ошибки перепроецирования составляют десятки пикселей. Калибровочная свобода: если сдвинуть, повернуть или масштабировать всю сцену вместе со всеми камерами, ни одно изображение не изменится, поэтому у $E$ есть 7-мерная долина равных минимумов, а у $J^{\mathsf T}J$ — 7 нулевых собственных значений (консоль их печатает, около $10^{-16}$ от наибольшего). Фиксация камеры 0 (6 чисел) и $x$-сдвига камеры 1 (масштаб) убирает ядро: $J^{\mathsf T}J$ становится полного ранга, и шаги определены корректно. Мы фиксируем их на истинных значениях, так что результат можно напрямую сравнить с истиной. Каждая итерация линеаризует невязки, $\mathbf
  r(\boldsymbol\theta + \Delta) \approx \mathbf r + J\Delta$, и решает демпфированные нормальные уравнения; якобиан строится функцией torch.func.jacrev, т. е. автоматическим дифференцированием, векторизованным по всем невязкам, что избавляет от ручного вывода, чреватого ошибками. Дополнение Шура использует разреженность (стреловидная панель $J^{\mathsf T}J$): если сначала исключить точки, остаётся система размером лишь с число камер, поэтому настоящие системы уравнивания связок справляются с миллионами точек. Здесь плотное решение и решение через Шура дают один и тот же шаг с точностью около $10^{-12}$. В оптимуме среднеквадратичная ошибка перепроецирования равна уровню шума $\sigma\sqrt{1 - n/m}$ (каждое подогнанное неизвестное поглощает немного шума), а гистограмма невязок совпадает с распределением шума: объяснять больше нечего. Оставшиеся ошибки точек и камер определяются шумом и геометрией, а не оптимизатором. Источник: B. Triggs, P. McLauchlan, R. Hartley and A. Fitzgibbon, "Bundle
  Adjustment — A Modern Synthesis" (Vision Algorithms: Theory and Practice, 1999). Упрощения: нет выбросов (реальные системы используют робастную функцию потерь), нет дисторсии объектива, все точки видны во всех камерах, якобиан хранится плотно. Попробуйте большее начальное возмущение (тогда LM нужно больше демпфирования, или он попадает в неправильный минимум), больше шума или всего 2 камеры.'
meanings:
- 'поза камеры: вращение в форме ось–угол (направление = ось, длина = угол) и сдвиг, так что $x_{\rm cam} = R\mathbf X + \mathbf t$'
- формула Родрига $I + \sin\theta\,K + (1-\cos\theta)K^2$; три числа на вращение, никаких ограничений соблюдать не нужно
- каждая точка в системе координат каждой камеры, суммирование по $j$
- ошибка перепроецирования в пикселях; развёрнута в $r_m$, $m = (c, p, a)$
- 'свободные неизвестные: все позы и точки минус 7 калибровочных чисел (камера 0 и $t_x$ камеры 1)'
- якобиан через автоматическое дифференцирование в обратном режиме, один векторизованный обратный проход на строку
- матрица Гаусса–Ньютона $H = J^{\mathsf T}J$ и градиент $J^{\mathsf T}\mathbf r$, суммирование по $m$
- блоки камеры | точки; невязка затрагивает одну камеру и одну точку, поэтому $V$ блочно-диагональна
- 'дополнение Шура (редуцированная система камер): $P$ крошечных обращений $3\times 3$, затем одно небольшое решение'
- 'обратная подстановка: каждая точка обновляется отдельно'
- 'демпфирование Левенберга–Марквардта: делится на 3 после удачного шага, умножается на 4 после неудачного'
labels:
  n_cameras: Камеры $C$
  n_points: Точки $P$
  noise: Пиксельный шум $\sigma$
  init_rot: Начальная ошибка вращения
  init_noise: Начальная ошибка сдвигов и точек
  iterations: Итерации LM
  solver: Решатель нормальных уравнений
