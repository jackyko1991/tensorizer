title: Напряжения, деформации и круг Мора
summary: Механика сплошной среды для упругой пластины. Закон Гука — тензор жёсткости 4-го ранга $C_{ijkl}$, построенный из постоянных Ламе с помощью einsum; нагружение (растяжение, затем сдвиг) деформирует пластину, деформация получается из градиента поля перемещений, а главные напряжения — из eigh; они изображаются эллипсом напряжений и кругом Мора.
notes: 'Пластина тонкая, её грани свободны, поэтому $\sigma_{zz} = 0$ (плоское напряжённое состояние) — но она всё же утончается: $\varepsilon_{zz} = -\nu(\sigma_{xx} + \sigma_{yy})/E$. На одноосной половине нагружения можно прочитать модуль Юнга $E = \sigma_{xx}/\varepsilon_{xx} = \mu(3\lambda + 2\mu)/(\lambda + \mu)$ и коэффициент Пуассона $\nu = -\varepsilon_{yy}/\varepsilon_{xx} = \lambda/2(\lambda + \mu)$. Добавление сдвига поворачивает главные оси от $x$ и $y$; на круге Мора точки $(\sigma_{xx}, \tau_{xy})$ и $(\sigma_{yy}, -\tau_{xy})$ — концы диаметра, а круг пересекает ось в главных напряжениях. Радиус равен максимальному касательному напряжению в плоскости, которое определяет текучесть пластичных металлов (критерий Треска). Перемещения очень малы и на рисунке преувеличены.'
meanings:
- три внешних произведения $\delta$ через einsum; 81 элемент, лишь 2 независимые постоянные
- 'обратный к $C$ на симметричных тензорах: $\varepsilon = S:\sigma$ (pinv матрицы 9×9)'
- перемещение каждой материальной точки
- градиент перемещений конечными разностями (torch.gradient)
- симметричная часть градиента перемещений
- 'повторяющиеся $k, l$ ⇒ суммирование: закон Гука'
- главные напряжения и их направления
labels:
  E: Модуль Юнга $E$
  poisson: Коэффициент Пуассона $\nu$
  sigma_max: Конечное растяжение $\sigma_{xx}$
  tau_max: Конечный сдвиг $\tau_{xy}$
