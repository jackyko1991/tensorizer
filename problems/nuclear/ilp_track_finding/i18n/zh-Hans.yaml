source_hash: 16a2fcec9827
title: 用整数规划寻找粒子径迹
summary: 来自一次模拟 HL-LHC 碰撞（TrackML 挑战赛，CC BY 4.0）的真实击中点，通过整数线性规划连接成径迹：选出曲率和极角一致的击中点三元组，且每个击中点最多使用一次。我们的张量 PDLP（带重启的原始–对偶混合梯度法，即 OR-Tools 和 cuOpt 内部使用的 LP 方法）在稀疏张量上实时求解 LP 松弛，再进行舍入和修复。结果与一个手写的匈牙利算法（Kuhn–Munkres）基准，以及 HiGHS、Gurobi 和 scipy 的离线运行结果进行比较：目标值差距、效率、假径迹率、官方 TrackML 分数，以及运行时间的标度律 $t \propto N^k$。
notes: '现状: 这是一次工具比较，而不是未解决的问题。该 ILP 是一个集合打包问题（一般而言是 NP 难的）；PDLP 是一阶 LP 方法，舍入得到的是启发式整数解，而非经过认证的最优解，因此我们始终报告与精确最优解之间的差距。即使没有精确求解器，PDLP 的对偶界也能给出经过认证的上界。方法. 候选线段连接相邻层上的击中点，条件是一条来自束流线、$p_T \ge p_{T,\min}$ 的径迹能够将它们连起来。三元组通过共享的中间击中点连接两条线段，并得分 $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$（只保留 $s_t > 0$）。ILP 选取三元组 $x_t$ 和线段 $y_e$：每个击中点最多有一条被选中的进入线段和一条离开线段，因此径迹是链。一条被选中的线段在每一侧最多延续到一个被选中的三元组，而每条线段的代价为 $\lambda = 0.1$。其 LP 松弛（$0 \le x, y \le 1$）由我们的 PDLP（Applegate et al. 2021）求解：采用 Ruiz 缩放的 PDHG、基于 KKT 条件重启到平均值，以及原始权重更新，用 torch.sparse 编写，因此可以在 CPU 或 CUDA 上运行。匈牙利基准对每一对层求解一次精确的线性指派（先处理中间一对，再向内和向外，三元组代价依据目前已建成的链）。这是一个可在多项式时间内精确求解的二部图匹配，但它一次只决定一对层，而 ILP 则全局地权衡整条链。这就是它的径迹会不同的原因。数据. TrackML Particle Tracking Challenge（CERN / Kaggle 2018），训练事例 1000（200 次堆积碰撞）：Zenodo 记录 4730167，doi:10.5281/zenodo.4730167，许可证 CC BY 4.0（Salzburger、Innocente、Vlimant、Rousseau et al.）。数据裁剪到像素桶部（volume 8，4 层），且 $|\eta| < 1$：11 519 个击中点、2 452 个粒子和 6% 噪声，另附官方的逐击中点权重。离线基准测试（data/solver_benchmark.csv）在 AMD
  Ryzen 5 5600G（1 个线程）上进行：通过 scipy 1.18.1 调用 HiGHS（milp、linprog）、通过 gurobipy 使用有规模限制许可证的 Gurobi 13（最多 2000 个变量和 2000 个约束，因此只能做 $\Delta\phi \le 30°$）、scipy 的 linear_sum_assignment，以及我们在 CPU 和 NVIDIA GTX 1080 Ti 上的 PDLP。NVIDIA cuOpt 26.10 已安装在 WSL 中但无法运行：其内核是为计算能力 7.0（Volta）及更新的架构编译的，而 1080 Ti 为 6.1（cudaErrorNoKernelImageForDevice），因此予以跳过，没有任何数据。引用的当前最佳结果列于 data/trackml_sota.csv。结论. 在全部八个扇区（5° 到 360°，151 到 11 519 个击中点）上，LP 松弛都是紧的：HiGHS 的 LP 最优值与 MILP 最优值相等，误差在 $10^{-13}$ 以内。我们的 PDLP 加修复每次都达到相同的最优值（差距低于 $10^{-9}$），所选三元组与 HiGHS 和 Gurobi 完全相同（0 个不同）。这是经验结果，并无保证：集合打包是 NP 难的，而这里四层的链结构使 LP 保持紧致。由于分数是连续值，出现完全平局的可能性很低，因此达到最优解的求解器会给出一致的结果。在运行过程中，约三分之一的 PDLP 值是分数值，其中许多接近 $\tfrac12$，对应相互竞争的三元组几乎打平的情形（例如重叠模块中的双重击中）；随着 PDLP 收敛，它们会逐渐稳定下来。匈牙利算法的链比最优值低 0 到 2.2%（5 到 651 个三元组不同），且与 scipy 的指派目标值完全一致（这是对我们匈牙利算法的检验）。完整桶部子集（360°）：ILP 求解器的效率为 93.1%、假径迹率为 13.0%，匈牙利算法则为 90.9% 和 16.2%；TrackML 分数为 0.495 对 0.482。对可重建粒子而言，完美的径迹重建器在这里可得 0.618；引用的完整事例当前最佳结果为 0.88 到 0.94（Mikado 0.944，耗时 0.56 s）。在 $N \ge 1000$ 个击中点范围内的标度律：HiGHS
  MILP $N^{1.14}$、HiGHS LP $N^{1.01}$、我们的 PDLP 在 CPU 上 $N^{0.92}$、在 GPU 上 $N^{0.36}$（在 10 000 个变量时启动开销仍占主导，因此 1080 Ti 目前还不更快）、我们的匈牙利算法 $N^{2.14}$（最坏情况 $O(n^3)$；稀疏且经过筛选的代价使增广路径保持很短）、scipy $N^{1.57}$。Gurobi 只有在 860 个击中点以内才符合其规模限制（在该范围内为 $N^{1.04}$）。在这些规模下，HiGHS 与 PDLP 一样快；一阶方法要在大得多的 LP 上才划算。在小扇区上，匈牙利算法找到的粒子略多（30° 时为 97.4% 对 94.8%）：ILP 目标函数只是代理指标，而不是物理指标。注意事项. 我们的实例是一个 4 层的桶部扇区，因此径迹最多只有 4 个击中点，且没有端盖：比挑战赛的完整事例更容易，也不相同。TrackML 分数的比较仅供参考，并非同等条件下的比较：子集约 40% 的分数权重落在低于 $p_T$ 截断、或在截断范围内少于 3 层的粒子上，而我们的计时只覆盖十分之一个事例，且不包括读取数据和构建候选。实际的径迹重建器（ACTS 以及各实验自己的程序）使用组合式卡尔曼滤波器，而图神经网络（Exa.TrkX）是主要的机器学习方法；没有人会对每个事例运行一次 MILP。'
meanings:
- 4 层像素桶部上的真实 TrackML 击中点，裁剪到一个 $\Delta\phi$ 扇区：即问题规模
- 相邻层上满足 $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ 且 $|z_0| \le 150$ mm 的击中点对，一次处理所有点对
- 经过束流线和两个击中点的圆的曲率
- 三元组共享中间击中点；螺旋线在两半上具有相同的 $\kappa$ 和 $\theta$，因此 $s_t$ 随不匹配程度而下降
- 击中点互斥行（一条进入线段、一条离开线段）和连续性行；重复的 $v$ ⇒ 在每个乘积中求和
- 在经 Ruiz 缩放的 LP 上运行 PDHG，配合平均、重启和原始权重；每次迭代两次稀疏矩阵–向量乘法
- 按 LP 值对线段排序，以并行轮次接受无冲突的线段，并修剪代价高于得分的链端
- 带势函数的 Kuhn–Munkres：每对层一次精确的线性指派，再串接成径迹
- 官方 TrackML 分数：所属径迹包含某粒子 > 50% 击中点、且 > 50% 击中点来自该粒子的那些击中点的权重之和
labels:
  dphi: 扇区宽度 $\Delta\phi$（问题规模）
  pt_min: 最小横向动量 $p_{T,\min}$
  max_iter: PDLP 最大迭代次数
  digits: PDLP 目标精度 $10^{-k}$，$k$ =
  check: 两次重启检查之间的迭代次数（每次一帧）
