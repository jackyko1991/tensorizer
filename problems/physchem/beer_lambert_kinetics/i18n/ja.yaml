source_hash: 26b3bf83c6f6
title: A → B → C のランベルト–ベールスペクトル
summary: 分光光度計で逐次反応 $A \to B \to C$ を追跡する。混合物のスペクトルは行列積 $D = l\,E\,c$（波長 × 化学種）なので、ノイズを含むスペクトルから擬似逆行列 $E^{+}$ を用いた最小二乗法で濃度プロファイルが復元できる。一つの段階が進む間スペクトルが動かない等吸収点に注目しよう。
notes: 各化学種は濃度と光路長に比例して光を吸収し、$D = \varepsilon\,l\,c$、混合物の吸光度は単純に足し合わさる。すべての波長と時刻について一度に書けば行列積 $D_{tw} = l\,E_{ws}c_{ts}$ となるので、化学種より波長が多ければ濃度は過剰決定の線形系から最小二乗法で求まる：$\hat c = E^{+}D/l$、擬似逆行列は $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$。これは純粋なスペクトルが明確に異なる場合にのみうまくいく。ターミナルに表示される $E$ の条件数がノイズの増幅の程度を示す。反応速度論 $A \to B \to C$ は線形系 $\dot{\mathbf c} = K\mathbf c$ であり、行列指数関数で厳密に解ける：$[A]$ は減衰し、$[B]$ は増えてから減り（$t = \ln(k_1/k_2)/(k_1 - k_2)$ でピーク）、$[C]$ は増える。$K$ の各列の和はゼロなので $[A] + [B] + [C]$ は一定に保たれる。等吸収点：$A \to B$ だけが起きているなら、$[A] + [B]$ が一定のもとで $D = l(\varepsilon_A[A] + \varepsilon_B[B])$ なので、$\varepsilon_A = \varepsilon_B$ となる波長では吸光度は変化しえない。鋭い等吸収点は、きれいな二成分変換の古典的な兆候である。ここでは交点が $\varepsilon_A = \varepsilon_B$（初期）から $\varepsilon_B = \varepsilon_C$（後期）へ移り、その間は三つの化学種が共存するためぼやける。$k_2 = 0$ にすると完全な等吸収点が、$k_2 \approx k_1$ にするとそれが消える様子が見える。スペクトルは典型的な色素程度のモル吸光係数（$\sim 10^4$ L mol$^{-1}$ cm$^{-1}$）をもつ合成ガウスバンドで、1 cm セルを想定している。
meanings:
- 300–700 nm、2 nm 刻み
- 各化学種のモル吸光係数（合成ガウスバンド、L mol$^{-1}$ cm$^{-1}$）
- $A \to B \to C$ の速度行列；各列の和は 0（物質収支）
- 各サンプリング時刻での厳密な濃度；$r$ について和
- 混合物のランベルト–ベール則：吸光度は足し合わさり、化学種 $s$ について和
- 純粋スペクトルの重なり（グラム）行列；$w$ について和
- 擬似逆行列；スペクトルが独立なら torch.linalg.pinv(E) に等しい
- ノイズを含む各スペクトルから最小二乗法で求めた濃度；$w$ について和
- 段階 $A \to B$ の等吸収点（$B \to C$ も同様）
labels:
  k1: 速度定数 $k_1$（$A \to B$）
  k2: 速度定数 $k_2$（$B \to C$）
  t_end: 測定時間
  c0: 初期濃度 $[A]_0$
  noise: 検出器ノイズ $\sigma$（吸光度）
