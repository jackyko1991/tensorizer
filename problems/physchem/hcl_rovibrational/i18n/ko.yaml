source_hash: dda111a1c11f
title: HCl의 진동–회전 스펙트럼
summary: HCl의 적외선 띠는 선들의 빗이다. 분자는 진동하고(비조화 진동자) 회전하며(돌면서 늘어나는 회전자), 각 선은 $\Delta J = \pm 1$인 $v = 0 \to 1$ 전이이다. 두 염소 동위원소의 P 가지와 R 가지가 하나의 배치 $(I, J)$ 격자로 나오며, 온도를 올려 가며 볼츠만 세기를 계산한다. 그런 다음 조합 차이 최소 제곱 맞춤으로 선들로부터 $B_e$, $\alpha_e$, $\nu_0$를 되찾는다.
notes: '상수는 H³⁵Cl의 대략적인 문헌값이다: $\omega_e \approx 2991$, $\omega_ex_e \approx 52.8$, $B_e \approx 10.59$, $\alpha_e \approx 0.31$, $D_e \approx 5\times10^{-4}$ cm⁻¹. 띠 원점 $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹에는 선이 없다. HCl처럼 $\Sigma$ 상태에는 $\Delta J = 0$(Q) 가지가 없기 때문이다. R(0)과 P(1) 사이의 간격은 약 $4B$이다. $B_1 < B_0$이므로(진동하는 결합은 평균적으로 더 길다) R 선들은 높은 $J$로 갈수록 몰리고 P 선들은 벌어진다. 각 선은 이중선이며, H³⁷Cl은 약 2 cm⁻¹ 아래에 3분의 1의 세기로 놓인다(자연 존재비 76 : 24). 모든 상수가 환산 질량의 거듭제곱에 비례하므로 이동량은 $|\nu - \nu_0|$와 함께 커진다. 기체가 데워지면 볼츠만 인자 $(2J+1)e^{-hcF(J)/kT}$의 최댓값이 더 높은 $J$로 이동하고 두 가지가 벌어진다(각 프레임은 가장 강한 선에 맞춰 스케일된다). 조합 차이는 두 상태를 분리하는 분광학자의 요령이다. R(J−1)과 P(J+1)은 같은 위 준위에서 끝나므로 그 차이는 $v = 0$에만 의존하고, R(J)와 P(J)는 같은 아래 준위에서 시작하므로 그 차이는 $v = 1$에만 의존한다. $J^2 + J + 1$에 대한 $\Delta_2F/(4J+2)$의 직선 맞춤은 $B_v$(절편)와 $D$(기울기)를 주며, 그로부터 $\alpha_e = B_0 - B_1$과 $B_e = B_0 + \alpha_e/2$를 얻는다. 측정 잡음을 더해 상수가 얼마나 잘 살아남는지 보자. 이에 해당하는 모스 퍼텐셜 우물 깊이는 $\omega_e^2/4\omega_ex_e$이다. 단순화: 허먼–월리스 세기 보정 없음, 모든 선에 같은 로렌츠 폭, 흡수에 $\tilde\nu$ 가중치
  없음.'
meanings:
- 대략적인 H³⁵Cl 상수, $\rho = \sqrt{\mu_{35}/\mu_{37}}$로 H³⁷Cl에 맞게 스케일
- 준위 $v$의 회전 항; 합산하는 첨자 없음, 외적
- 두 동위원소 분자의 모든 선을 하나의 격자에; $J$는 아래 준위
- 가열 과정의 각 온도에서 준위 $J$의 볼츠만 분포
- 존재비 × 분포 × 횐–런던 인자; P(0)은 정확히 0
- '반복된 $\ell$ ⇒ 모든 선에 대해 합산: 선폭이 넓어진 스펙트럼'
- 아래($s=0$)와 위($s=1$) 상태에 대해 $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$
- '반복된 $n$ ⇒ 합산: 모든 동위원소 분자와 상태에 대한 최소 제곱 $B_v$와 $D$'
labels:
  T: 최종 온도 $T$
  J_max: 가장 높은 아래 준위 $J_{max}$
  fwhm: 선폭 (FWHM)
  noise: 측정한 선의 잡음
