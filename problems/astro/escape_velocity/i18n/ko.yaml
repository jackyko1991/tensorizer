source_hash: d40b53524521
title: 탈출 속도
summary: 여러 대의 로켓이 탈출 속도 $v_\mathrm{esc} = \sqrt{2GM/R}$ 부근의 속력으로 행성을 떠납니다. 각 로켓의 운명은 에너지의 부호가 결정합니다. 속박된 로켓($E < 0$)은 다시 떨어지고, 속박되지 않은 로켓($E \ge 0$)은 결코 돌아오지 않습니다.
notes: '단위: 행성 반지름 $R = 1$, $GM = 1$이므로 $v_\mathrm{esc} = \sqrt 2$입니다(지구의 경우 11.2 km/s). 로켓은 엔진을 끈 채 관성으로 날아가며, 공기는 없고 행성은 자전하지 않습니다. $v_\mathrm{esc}$ 바로 아래에서는 최고점이 $1/(1 - v^2/v_\mathrm{esc}^2)$처럼 급격히 높아지고 비행 시간도 점점 길어집니다. 정확히 $v_\mathrm{esc}$이면 로켓은 영원히 느려지지만 결코 멈추지 않습니다. 발사 방향을 기울여 보면 (경로가 행성에 부딪히지 않는 한) 탈출 속도가 방향과 무관함을 알 수 있습니다. 중요한 것은 에너지뿐입니다. 어두운 별: 행성을 압축해 $v_\mathrm{esc}$가 광속 $c$에 이르면 $R = 2GM/c^2$가 됩니다. 미첼(1783)과 라플라스는 이런 별이 보이지 않을 것이라고 주장했습니다. 일반 상대성 이론은 블랙홀 사건의 지평선에 대해 정확히 같은 반지름(슈바르츠실트 반지름, 태양의 경우 3 km)을 주지만, 그 뒤의 뉴턴식 논리가 실제 물리는 아닙니다.'
meanings:
- 행성 중심에서 본 로켓 $b$의 위치
- 로켓 $b$의 속도
- '반복된 $j$ ⇒ 합: 거리의 제곱 $r_b^2$'
- 행성의 중력
- '단위 질량당 에너지: 음수 ⇒ 속박'
- 표면에서 $E = 0$이 되는 속력
- '$2GM/c^2$: $v_\mathrm{esc} = c$가 되는 반지름'
- $R/(1 - v^2/v_\mathrm{esc}^2)$, 수직 발사 시 최고점
labels:
  n_rockets: 로켓 수
  f_min: 가장 느린 발사 $v/v_\mathrm{esc}$
  f_max: 가장 빠른 발사 $v/v_\mathrm{esc}$
  tilt: 수직에서 기운 각
  t_max: 시뮬레이션 시간
  dt: 시간 간격
