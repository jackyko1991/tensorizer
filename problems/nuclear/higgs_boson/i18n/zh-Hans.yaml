source_hash: 2633dfd2d254
title: 在真实双光子数据中寻找希格斯玻色子
summary: 来自 10 fb$^{-1}$ 真实 13 TeV ATLAS 碰撞（ATLAS Open Data，CC0）的约 95 000 对光子，按双光子质量 $m_{\gamma\gamma}$ 分箱，并用 autograd 拟合：平滑下降的本底加上一个窄的希格斯峰。轮廓似然比给出 $m_H$、信号强度 $\mu$ 与局部显著性 $Z = \sqrt{q_0}$；一批仅含本底的模拟实验展示了“别处效应”（look-elsewhere effect）；墨西哥帽势 $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ 则把测得的质量转换为希格斯自耦合 $\lambda = m_H^2/2v^2$。
notes: 2012 年 7 月，ATLAS 与 CMS 宣布在 125 GeV 附近发现一个新的玻色子，主要见于两个通道：双光子与四轻子。2013 年诺贝尔物理学奖授予 Englert 与 Higgs，表彰这一发现所证实的机制。这里用真实数据重做光子通道。希格斯粒子无法直接衰变为光子（光子无质量），只能通过 W 玻色子与顶夸克的圈图，因此这是一种稀有衰变（$\mathcal B \approx 0.23\%$），叠加在由普通光子对构成的巨大平滑本底之上。以本文件中的 10 fb$^{-1}$，结果为 $m_H \approx 124.2 \pm 1.0$ GeV（PDG 2024：$125.20 \pm 0.11$）、$\mu \approx 1.0 \pm 0.4$（标准模型的产生率），局部显著性约 $2.7\sigma$（预期约 $3.4\sigma$）。这是一个超出，而非发现：2012 年的发现动用了多个事例类别、两个通道与两个实验，才超过 $5\sigma$。这次扫描也是一个有用的警示：在这个小样本中，143 GeV 附近的一个本底涨落几乎一样大（局部 $2.6\sigma$），与 124 GeV 处真正的希格斯粒子相当。这就是别处效应。在宽广的窗口中某处出现一个凸起是很可能的，因此模拟实验估计仅靠本底产生凸起的频率：约 13% 的纯本底扫描会在某处超过 125 GeV 的超出，而 Gross–Vitells 上穿公式给出接近 0.1 的全局 p 值。在固定质量下，纯本底模拟实验服从 $\tfrac12\delta(0) + \tfrac12\chi^2_1$（Wilks/Chernoff），这就是 $Z = \sqrt{q_0}$ 的原因。墨西哥帽：由 μ 子寿命得到 $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV，测得的质量便确定 $\lambda = m_H^2/2v^2 \approx 0.13$；围绕真空环的径向振动就是希格斯玻色子，而沿环的平坦方向则成为纵向的 W 与 Z。数据：ATLAS Open Data 13 TeV，2020 年发布，GamGam 样本（CERN Open Data Portal 记录 15006，doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS，许可 CC0；2016
  年数据时段 A–D）。筛选方式与 ATLAS 科普用 H → γγ 笔记本相同：光子触发，两个紧（tight）且孤立的光子，$p_T > 40$ 与 30 GeV，$|\eta| < 2.37$ 且不在 1.37–1.52 范围内。sm_signal 列是对应的 ATLAS 模拟（ggF、VBF、WH、ZH、ttH，125 GeV），加权至 10 fb$^{-1}$，给出 $N_{SM} \approx 406$ 个事例及峰宽。简化之处：单一遍举类别、高斯峰（真实的峰有尾部，这就是拟合宽度约 2.3 GeV 大于核心分辨率的原因）、不含系统不确定度，以及指数多项式本底（可尝试改变次数，以观察伪信号敏感度）。
meanings:
- 每个 0.5 GeV 分箱的真实双光子计数；任何含 m_low、m_high、events 列的 CSV 都可使用
- 缩放质量 $x \in [0, 1]$ 的幂次；本底为 $\exp(X\theta)$
- 在每个分箱上积分的高斯峰（erf），宽度 $\sigma$ 由 ATLAS 模拟拟合
- 每个直方图的泊松似然，通过 autograd 用 Adam + L-BFGS 最小化
- 重复的 $n$ ⇒ 求和：Fisher scoring 同时拟合每个模拟实验 × 每个质量
- 轮廓似然比，当拟合信号为负时为 0
- $m_H$ 与 $\mu$ 的误差，由 $-\ln L$ 的曲率得出
- 沿复平面上三条射线 $\phi = r\,e^{i\alpha}$ 的势：每个相位都是同一条曲线，在 $|\phi| = v/\sqrt2$ 处形成真空环
labels:
  m_min: 拟合窗口起点
  m_max: 拟合窗口终点
  degree: 指数中本底多项式的次数
  m_start: 拟合的起始质量
  scan_step: 质量扫描步长
  n_toys: 纯本底模拟实验
