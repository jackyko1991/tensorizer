source_hash: db9343501d33
title: ナビエ–ストークス方程式による円管流
summary: 非圧縮ナビエ–ストークス方程式を、圧力勾配で急に押し出された円管内の水に適用する。軸方向の流れでは非線形項が厳密に消え、半径方向の拡散方程式が残る：運動量は滑りなしの壁から内側へ広がり、速度分布は $R^2/\nu$ の数倍の時間でハーゲン–ポアズイユの放物線に成長する。
notes: これはナビエ–ストークス方程式の数少ない厳密解の1つである：流れが平行なので $(\mathbf u\cdot\nabla)\mathbf u = 0$ となり、圧力勾配と粘性だけが残る。定常なハーゲン–ポアズイユ流は $u_z = G(R^2 - r^2)/4\mu$、流量 $Q = \pi G R^4/8\mu$（有名な $R^4$ 則）、壁面せん断応力 $\tau_w = GR/2$ をもつ——単位長さあたりの力のつり合い $G\,\pi R^2 = \tau_w\,2\pi R$ である。立ち上がりは $\lambda_1 = 2.405$（$J_0$ の最初の零点）として $e^{-\lambda_1^2\nu t/R^2}$ のように近づくので、$t \approx 0.6\,R^2/\nu$ で分布は放物線から数パーセント以内になる。初期には中心部は栓のように一体で動き、壁付近の流体だけが抵抗を感じる——染料の線に注目しよう。解は層流である。レイノルズ数が約 2000 を超えると実際の円管流は乱流になる。
meanings:
- $u_z \ne 0$ のみかつ $\partial_z u_z = 0$ なので、移流項は厳密に0
- 連続の式は自動的に成り立つ：$u_z$ は管に沿って変化しない
- 軸（$i = 0$）から壁（$i = N$）までの半径方向の点
- 軸方向速度 $u_z(r_i)$；壁での値 $u_N = 0$（滑りなし）
- 行列としての $\tfrac1r\partial_r(r\partial_r\,\cdot)$、軸上では $r \to 0$ の極限 $2\partial_r^2$
- 繰り返される $j$ ⇒ 和をとる：粘性項 $\nu\nabla^2 u_z$
- 駆動圧力勾配（Pa/m）
- 体積流量；定常値 $\pi G R^4/8\mu$
- 壁に働く単位面積あたりの抵抗；定常値 $GR/2$
labels:
  G: 圧力勾配 $G$
  R: 管の半径 $R$
  nu: 動粘性係数 $\nu$
  t_max: シミュレーション時間（$R^2/\nu$ 単位）
