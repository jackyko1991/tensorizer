title: 工作流编排的力量：把 Willis 环队列研究变成张量 DAG
summary: 一项血管研究是一连串步骤（分割 MRA、提取中心线图、测量血管、设置入口和出口、求解血流、生成报告），每一步本身已是张量程序，因此由 Snakemake 编排的工作流也可以是张量。在六例开放（CC0）的 TopCoW Willis 环 MRA 扫描上，同一份 Snakefile 分别由 Snakemake（离线）和张量 DAG 引擎运行：任务图是 Kronecker 积之和，其层级、关键路径和重跑集合都是矩阵–向量迭代，结果逐个任务一致。随后说明节省了多少时间、来自何处，以及文件 DAG 无法提供的东西：贯穿整条流水线的梯度。仅供教学，不可用于临床。
notes: 构想。“工作流编排的力量”这一提法出自 Jacky Ko，源于他在血管分析流水线上的 HPC 与博士研究：如果流水线的每个阶段都是张量程序，那么工作流管理器所调度的 DAG 也可以是张量。本问题将其实现并加以测量。工作流。data/Snakefile 有八条规则（segment、centreline、measure、boundaries、flow、report、cohort、all）和两个通配符：病例（六例扫描）和条件（两侧 ICA 入口均开放，或左侧 ICA 闭塞）。每条规则的 shell 运行 workflow.py，它对单个病例调用的张量函数，正是张量引擎对所有病例一次调用的同一个函数。Snakemake 9.27.1 在 WSL2 中离线运行（使用其自身环境，从不属于本项目），其输出作为参考数据收录于 data/snakemake：任务 DAG（--dag）、dry-run 任务列表、某一输入改变后的重跑集合、--summary、每个任务的开始和结束时间，以及其任务写出的队列表格。测试检查：张量引擎具有相同的 50 个任务和 79 条边，Snakemake 的执行顺序符合我们的 $A$ 并给出我们的层级，重跑集合相同，且队列表格在写出的 9 位数字上完全一致。关于重跑的一个细节：touch 某个输入并不会让 Snakemake 重跑任何东西，因为对小文件它比较的是校验和；参考数据改变了文件的字节（数组不变），此时有 10 个任务重跑，正如 $x = s \lor Rs$ 所预测。时间。在收录的运行中，Snakemake 在 1 个核上耗时 118 s，6 个核 43 s，12 个核 27 s（较早一次在较空闲机器上的运行：79、23 和 22 s）；张量引擎用单线程约 5 到 10 s 完成相同工作。如实核算：每个 Snakemake 任务都是一个新进程，需要启动 Python 并导入 torch 和任务模块（约 1.8 s，见 data/snakemake/startup.csv，因此在 115 s 的任务时间总和中约占 88 s），读写 .npz 文件，并等待调度；张量引擎只付出一次这些开销。批处理本身在此 CPU 上帮助不大（在同一进程中逐个运行病例耗时相近，有时更短），因此收益来自启动和文件，而当每个任务都是远超启动开销的大型 GPU 求解时，收益就会缩小。在
  $c$ 个核上，没有任何调度能优于 $\max(\mathrm{CP}, W/c)$，即由 max-plus 迭代得到的关键路径与总工作量除以 $c$ 二者的较大值，实测运行均满足此界；一般而言，寻找最优调度是 NP-hard 问题（Graham 的列表调度不超过 $W/c + \mathrm{CP}$）。梯度。文件 DAG 传递的是数值，而不是导数。软阈值使分割、半径和血流都可微，因此 $\partial s_{\mathrm{L\,MCA}}/\partial\theta$（左侧 MCA 占流出量的比例）只需一次反向传播即可得到每个病例的值，并与中心有限差分一致，而后者需要 Snakemake 额外完整运行两次。中心线图（拓扑）和连通分量掩膜保持固定。流水线。分割：对归一化的 TOF 强度取软阈值 $\sigma((I - \theta)/w)$，硬掩膜为 $I > \theta$ 并去除小于 64 个体素的连通分量，与 TopCoW 掩膜的 Dice 约为 0.86 到 0.91。中心线：根据 TopCoW 血管标签，在标记血管相接处设置分叉节点（3.5 mm 内的接触予以合并；只计入解剖学上的配对，因此两条并行的 A2 不算），每条末端血管设一个自由端（用行进时间为 $\ell/R^2$ 的 min-plus eikonal 求其最远体素，再重新居中），并在相邻节点之间取最短的居中路径（与动脉瘤问题中用张量替代 VMTK 的做法相同）。测量：标记血管附近的每个体素归属于最近的中心线点，因此一条边的半径由软体积得到，为 $\sqrt{V_e/(\pi L_e)}$；每条血管的不对称度为 $2(r_R - r_L)/(r_R + r_L)$；平滑后的半径曲线低于其中位数一半之处标记为狭窄（在这些健康对照中，此类标记属于分割伪影）。边界，与 Venova 相同：入口位于 ICA 和基底动脉的自由端，出口位于 MCA、ACA 和 PCA 末端；Pcom 和 Acom 末端从不作为边界。血流：降阶稳态模型，每条边采用 Poiseuille 流导，开放入口处 $P$ = 90 mmHg，每个出口经 Murray 负载 $g_k \propto r_k^3$ 引流至 0 Pa，负载经调整使无阻力网络可承载 10 ml/s；一次批量线性求解。侧支循环测试关闭左侧 ICA：若
  Acom 或 Pcom 通畅，左半球仍保持灌注。简化之处：牛顿流体血液、刚性直管、无搏动、无 3D 流动（动脉瘤问题对单根血管做 3D CFD）、半径由 0.5 mm 体素上的阈值求得、压力和流量取文献量级。数据。TopCoW 2024 的 MRA_Lausanne 子集（Zenodo 10.5281/zenodo.15692630，许可 CC0）：20 例带 Willis 环标签的健康对照 TOF-MRA 扫描。其中六个病例以 0.5 mm、96×80×48 的裁剪收录（图像和标签，合计不到 1 MB）；data/SOURCES.md 记录了处理过程和引用文献（Yang 等，TopCoW 挑战赛；Di Noto 等 2022，Lausanne 队列）。未使用 TopCoW 主发布版本（其许可限制商业用途）。结果。除 GIF 外，还有两个 3D 结果。results/centreline.pvd 是解剖结构：每个病例的分割表面（marching tetrahedra）及其中心线图，两者都按血管半径着色。results/flow.pvd 是一维 Poiseuille 网络的血流，共 11 个时间步，左侧 ICA 逐步狭窄：时间步即狭窄程度 s，也就是管腔直径损失的比例（0 为通畅，1 为闭塞）。它的图层是：按最近中心线边的壁面切应力 $\tau_w = 4\mu|Q|/(\pi r^3)$ 着色的血管表面（压力作为第二个数组）；流线和粒子（都按速度着色）；以及带箭头的入口和出口圆盘。这里没有三维 CFD：流线是一维模型的理想化轴向流动，即平行于每条血管中心线、位于其半径 $\rho = 0, 0.35, 0.7$ 处的线，速度为 Hagen–Poiseuille 速度 $u = 2U(1 - \rho^2)$，$U = |Q|/(\pi r^2)$；没有二次流，并且在分叉处断开。每个时间步都是一个稳态；粒子每步只沿流线前进固定的 4 ms 伪时间（越过血管末端后回到起点），仅用于显示速度。狭窄以一段与入口串联的 10 mm Poiseuille 管段建模，因此其传导率按 $(1 - s)^4$ 下降；s = 0 和 s = 1 正是工作流的两种条件，其间的步骤仅由张量引擎运行（每步一次批量求解）。results/stenosis_sweep.csv 给出每个时间步和病例的左侧
  ICA 流入量和左侧 MCA 占比；其他数值保存在 results/timings.csv、results/equivalence.csv 和 results/cohort.csv 中。
meanings:
- 规则 $s$ 读取规则 $r$ 写出的文件模式；直接从收录的 Snakefile 解析得到
- 对每个通配符轴 $a$（病例、条件）：两条规则都带有该轴时为 $I$（每病例的边 $A \otimes I$），广播时为 $\mathbb 1$，汇总（如队列报告）时为 $\mathbb 1^\top$
- 任务 $i$ 读取任务 $j$ 的输出时 $A_{ij} = 1$；50 个任务、79 条边
- 长度为 $k$ 的闭合路径；全为零 ⇔ $A$ 幂零 ⇔ 无环
- 统计路径 $j \to i$ 的数目；其 0/1 模式即可达性（布尔重复平方）
- 用布尔矩阵–向量迭代求拓扑层级：当其所在行中 $A\,\neg\mathrm{done} = 0$ 时任务即可运行
- 最早完成时间，即 max-plus（热带）不动点；$\max_i t_i$ 为关键路径
- $s$ 中的任务（被改动文件的读取者）过期后需要重跑的任务
- 软分割，对阈值 $\theta$（每病例一个）可微
- 在所有病例全部血管的体素图上一次运行 min-plus eikonal：求自由端和中心线
- 由离其中心线最近的体素的软体积求得边的半径
- 以 Poiseuille 流导 $G_e$ 和 Murray 出口负载 $g_k$ 建立 Kirchhoff 方程，一次批量求解；开放入口处为 Dirichlet 行 $p = P$
- 左侧 MCA 血流比例经由血流、测量和分割求导，所有病例在一次反向传播中完成
labels:
  threshold: 归一化强度上的分割阈值 $\theta$
  cores: 界 $\max(\mathrm{CP}, W/c)$ 中的核数 $c$
