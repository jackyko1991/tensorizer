source_hash: f68c4a9fe179
title: 水槽排水（托里切利）
summary: 水以托里切利速率 $\sqrt{2gh}$ 從孔口流出，因此水位起初下降快、最後下降慢。孔徑不同的水槽合成一個批次張量一起積分，並與精確解 $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$ 比較。
notes: 托里切利定律可由自由液面（因 $A \gg a$ 而近乎靜止）與噴流之間的白努利定律推得，兩處都是大氣壓。真實孔口會使噴流收縮到孔面積的約 60 %（縮流），所以真實水槽排得較慢：把 $a$ 乘上流量係數 $C_d \approx 0.6$。孔徑加倍，排水時間變為四分之一；初始高度加倍，時間只乘上 $\sqrt2$。下落的噴流在加速時變細——又是連續方程式。
meanings:
- 水槽 $b$ 的水位隨時間變化
- 水槽 $b$ 的孔面積——即批次指標
- 每個水槽的截面積
- 托里切利流出速率
- 以 RK4 積分的右端項
- 沒有重複指標 ⇒ 外積：每個時刻配每個孔
labels:
  n_tanks: 水槽數
  d_min: 最小孔徑
  d_max: 最大孔徑
  tank_diameter: 水槽直徑 $D$
  h0: 初始水位 $h_0$
