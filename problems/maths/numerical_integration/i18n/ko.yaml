source_hash: 9e25d7739db7
title: 수치 적분과 수렴 차수
summary: 사다리꼴 공식, 심프슨 공식, 가우스–르장드르 구적법은 모두 가중합 $\sum_k w_k f(x_k)$이며, 여러 피적분 함수에 대한 einsum 하나로 계산된다. 가우스 절점과 가중치는 고유값 문제(Golub–Welsch)에서 나온다. 로그–로그 축에서 오차는 기울기 2와 4로, 또는 지수적으로 줄어들다가, 꺾인 점이나 특이점이 높은 차수를 빼앗는다.
notes: 매끄러운 피적분 함수에서 사다리꼴 공식의 오차는 $h^2 \propto N^{-2}$처럼, 심프슨 공식은 $N^{-4}$처럼 줄어든다. $N$을 두 배로 하면 오차가 각각 4와 16으로 나뉜다. 절점 $N$개의 가우스–르장드르는 차수 $2N - 1$ 이하의 모든 다항식을 정확히 적분하므로, 해석 함수에 대해서는 오차가 $10^{-16}$ 근처의 float64 반올림 오차에 닿을 때까지 지수적으로 떨어진다. 이 차수들은 테일러 전개에서 나오므로 도함수가 필요하다. 꺾인 점 $|x - a|$가 있으면 이계 도함수는 스파이크가 된다. 꺾인 점을 걸치는 모든 공식은 그곳에서 $O(h^2)$의 오차를 내므로 심프슨과 가우스도 차수 2로 떨어진다(꺾인 점이 패널 안 어디에 놓이는지가 $N$에 따라 바뀌어 곡선이 들쭉날쭉하다). $(1+x)^{\alpha}$에서는 끝점에서 도함수가 발산한다. 사다리꼴과 심프슨 공식은 차수 $1 + \alpha$로, 절점이 끝 쪽으로 몰리는 가우스는 약 $2 + 2\alpha$로 떨어진다. 해결책은 꺾인 점에서 구간을 나누거나 피적분 함수가 매끄러워지도록 변수를 바꾸는 것이다. 정수 $\alpha$(다항식)를 시도해 가우스가 정확해지는 것을 보거나, 꺾인 점을 격자 절점 위에 놓아 보자($N$이 20의 배수일 때마다 $a = 0.3$이 절점이 된다). 그러면 사다리꼴 공식은 두 직선 조각에 대해 정확해져 반올림 오차 수준으로 떨어진다.
meanings:
- 등간격 절점; 가중치 $h(\tfrac12, 1, \dots, 1, \tfrac12)$와 $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- 르장드르 점화식의 삼중 대각 행렬, 대각 옆에 $\beta_k = k/\sqrt{4k^2 - 1}$
- 고유값은 가우스–르장드르 절점, 고유 벡터는 열에
- 각 고유 벡터의 첫 성분에서 얻은 가우스 가중치; 합은 $\int_{-1}^{1} dx = 2$
- 모든 절점에서의 매끄러운, 꺾인, 끝점 특이 피적분 함수
- '반복된 $k$ ⇒ 합산: 세 적분을 한꺼번에'
labels:
  n_max: 최대 $N$
  kink: 꺾인 점 위치 $a$
  alpha: 끝점 거듭제곱 $\alpha$
