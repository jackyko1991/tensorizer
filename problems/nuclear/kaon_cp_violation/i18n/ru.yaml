title: Обращение времени и CPT на нейтральных каонах
summary: 'Нейтральный каон — двухуровневая система ($K^0$, $\bar K^0$), которая осциллирует и распадается, поэтому её эволюция описывается неэрмитовым гамильтонианом $2\times 2$ $H = M - i\Gamma/2$. Построенный из значений PDG и экспоненцированный для пакета миров во все моменты времени сразу, он показывает осцилляции странности с частотой $\Delta m$, CP-нарушающую интерференцию $\pi\pi$ и проверку обращения времени CPLEAR: $K^0 \to \bar K^0$ и $\bar K^0 \to K^0$ различаются на $A_T \approx 4\,\mathrm{Re}\,\varepsilon \approx 6.5\times 10^{-3}$, тогда как CPT сохраняет равенство масс и времён жизни $K^0$ и $\bar K^0$.'
notes: 'C (зарядовое сопряжение) меняет местами частицы и античастицы, P (чётность) отражает пространство, а T обращает время. Теорема CPT (Людерс, Паули, Швингер) утверждает, что любая локальная лоренц-инвариантная квантовая теория поля симметрична относительно всех трёх преобразований вместе, поэтому частица и её античастица имеют в точности равные массы и времена жизни. В 1964 году Кристенсон, Кронин, Фитч и Тёрлей наблюдали распад долгоживущего $K_L$ на два пиона, запрещённый CP: CP нарушается на уровне $|\varepsilon| \approx 2.2\times 10^{-3}$ (Нобелевская премия 1980 года Кронину и Фитчу). Если CPT выполняется, нарушение CP означает и нарушение T, и CPLEAR в CERN наблюдал его напрямую в 1998 году: начиная с помеченных $K^0$ и $\bar K^0$ и определяя странность в момент распада по полулептонным распадам, переход $\bar K^0 \to K^0$ происходит чуть чаще, чем $K^0 \to \bar K^0$, $\langle A_T\rangle = (6.6 \pm 1.3 \pm 1.0)\times 10^{-3}$ (интерпретация как нарушения T предполагает правило
  $\Delta S = \Delta Q$ и отсутствие нарушения CPT в распадах). Здесь $H$ строится из своих собственных состояний, поэтому CP-параметр $\varepsilon$ и CPT-параметр $\delta$ являются регуляторами: при $\delta = 0$ имеем $H_{11} = H_{22}$ (равные массы и времена жизни), $P(K^0\to K^0) = P(\bar K^0\to\bar K^0)$, а $A_T$ — плоское плато на уровне $(|p/q|^2 - |q/p|^2)/(|p/q|^2 + |q/p|^2) \approx 4\,\mathrm{Re}\,\varepsilon$; ненулевое $\mathrm{Re}\,\delta$ заставляет $A_{CPT} = [P(\bar K^0\to\bar K^0) - P(K^0\to K^0)]/[\ldots]$ подниматься до $4\,\mathrm{Re}\,\delta$ через несколько $\tau_S$ (CPLEAR нашёл $\mathrm{Re}\,\delta$ согласующимся с нулём на уровне $10^{-4}$). Нижняя панель показывает классическую интерференцию $\pi^+\pi^-$ между распадами $K_S$ и $K_L$, наибольшую вблизи $12\,\tau_S$, по которой измеряют $|\eta_{+-}|$ и $\phi_{+-}$. Унитарность проверяется соотношением Белла–Штейнбергера $(i\Delta m + \bar\Gamma)\langle K_S|K_L\rangle = \sum_f A_S^* A_L$; при доминировании $\pi\pi$
  измеренное $\eta_{+-}$ предсказывает $\mathrm{Re}\,\varepsilon$ с точностью 0.2%. Значения: PDG 2024 ($\tau_S = 0.8954\times10^{-10}$ s, $\tau_L = 5.116\times10^{-8}$ s, $\Delta m = 0.5293\times10^{10}\,\hbar$/s, $|\varepsilon| = 2.228\times 10^{-3}$, $\phi_\varepsilon = 43.52°$, $|\eta_{+-}| = 2.232\times10^{-3}$); CPLEAR, Phys. Lett. B 444 (1998) 43. Упрощения: прямое нарушение CP ($\varepsilon''$, $10^{-3}$ от $\varepsilon$) не учитывается, так что $\eta_{+-} = \varepsilon$; полулептонная маркировка идеализирована как точное измерение странности; регенерация в веществе отсутствует.'
meanings:
- столбцы $K_S \propto (1+\varepsilon_S, 1-\varepsilon_S)$, $K_L \propto (1+\varepsilon_L, -(1-\varepsilon_L))$ при $\varepsilon_{S,L} = \varepsilon \pm \delta$
- $\mp\Delta m/2 - i\Gamma_{S,L}/2$ в единицах $\hbar/\tau_S$ (общая масса — глобальная фаза)
- 'повторяющийся $i$ ⇒ суммирование: один эффективный гамильтониан на мир'
- $e^{-iHt}$ в каждый момент времени, проверено с помощью matrix_exp
- вероятность того, что каон, рождённый как $b$, будет обнаружен как $a$ ($0 = K^0$, $1 = \bar K^0$)
- 'эрмитова и $\ge 0$: унитарность, соотношение Белла–Штейнбергера'
- вектор-строка с $a\cdot K_S = 1$, $a\cdot K_L = \eta_{+-}$
- 'повторяющийся $x$ ⇒ суммирование: скорость распада $\pi^+\pi^-$ пучка, рождённого как $K^0$ или $\bar K^0$'
labels:
  eps_abs: $|\varepsilon|$
  eps_phase: Фаза $\phi_\varepsilon$
  re_delta: Нарушение CPT $\mathrm{Re}\,\delta$
  dm: Разность масс $\Delta m$
  t_max: Временное окно $t_\mathrm{max}$
