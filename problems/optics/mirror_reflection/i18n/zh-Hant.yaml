source_hash: d32c883229aa
title: 平面鏡與曲面鏡的反射
summary: 把反射定律寫成一條向量公式：把光線方向中沿表面法線的分量反向。燈發出的光線從平面鏡反彈，平行光線則從凹面鏡反彈並聚集在焦點 $F = R/2$ 附近。
notes: 公式只反轉 $\mathbf d$ 沿 $\mathbf n$ 的分量，因此入射角自動等於反射角。虛線把反射光線延伸到平面鏡後方：它們全部交於燈的虛像。對凹面鏡而言，只有靠近光軸的光線（近軸光線）會通過 $F = R/2$；較外側的光線在更靠近鏡面處與光軸相交（球面像差）。
meanings:
- 入射光線 $r$ 的單位方向，分量 $i \in \{x, y\}$
- 光線 $r$ 擊中處的鏡面單位法向量
- 重複的 $j$ ⇒ 求和：每條光線一個內積（${}= -\cos\theta_i$）
- 反射方向，仍為單位向量
- 曲面鏡的法向量指向其曲率中心 $c$
labels:
  radius: 鏡面曲率半徑 $R$
  n_rays: 每面鏡子的光線數
  aperture: 最高光線（$R$ 的比例）
