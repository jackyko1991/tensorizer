source_hash: 1e3affbcf0e4
title: 平面の線形写像
summary: $2\times 2$ 行列は平面のすべての点を動かし、一つの einsum で格子全体、単位円、単位正方形を全アニメーションフレームについて一度に動かす。平面が単位行列から $A$ へと変形していく様子を見よう：固有ベクトルは自分の直線上にとどまり、$|\det A|$ は面積を拡大し、負の行列式は平面を裏返し、円は特異値を半軸とする楕円になる。
notes: $A$ の列は基底ベクトル $\mathbf e_1$（赤い矢印）と $\mathbf e_2$（緑の矢印）の行き先であり、他のすべての点は線形性に従うので、まっすぐな格子線はまっすぐで平行なままである。経路 $M(t) = (1-t)I + tA$ に沿って、$A$ の固有ベクトル $\mathbf v$ は固有値 $1 - t + t\lambda$ をもつ $M(t)$ の固有ベクトルでもあるので、オレンジの点は破線に沿って滑り、他のすべては回転する。単位正方形（黄色）は面積 $|\det A|$ の平行四辺形になる。$\det < 0$ のとき、すなわち $\mathbf e_1 \to \mathbf e_2$ が時計回りで平面が鏡像になったとき、赤くなる。鏡映は途中で必ず $\det = 0$ を通り、そこで平面は直線に押しつぶされる。回転と鏡映は長さを保つので $\sigma_1 = \sigma_2 = 1$。せん断は面積を保つ（$\det = 1$）が形は保たない。一般に円は半軸 $\sigma_1 \ge \sigma_2$（特異値）の楕円に移り、$|\det A| = \sigma_1\sigma_2$ である。積は掛け算になる：$\det(AB) = \det A\,\det B$。
meanings:
- 表示する行列：伸張、せん断、回転、鏡映、反転、または自分で指定したもの
- 平面上の点：格子線、単位円、単位正方形
- 単位行列 $\delta_{ij}$ から $A$ へのまっすぐな経路、フレームごとに一つの行列
- $j$ の繰り返し ⇒ 和：すべての点を各フレームの行列で一度に動かす
- $\varepsilon_{12} = 1$、$\varepsilon_{21} = -1$：2 次元のレヴィ–チヴィタ記号
- $i, j$ の繰り返し ⇒ 和：単位正方形の像の符号付き面積
- 円の像は半軸 $\sigma_1 \mathbf u_1$ と $\sigma_2 \mathbf u_2$ の楕円
- 固有値と固有ベクトル；回転では複素数になるので、どの直線も動かずにはいない
labels:
  matrix: 行列
  a11: カスタム $A_{11}$
  a12: カスタム $A_{12}$
  a21: カスタム $A_{21}$
  a22: カスタム $A_{22}$
  grid_lines: 方向あたりの格子線数
