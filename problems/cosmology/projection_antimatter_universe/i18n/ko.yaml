title: 반물질은 어디에 있을 수 있는가? 반물질 우주의 기준
summary: 확립된 물리가 아닌 추측성 가설이다. 2단계에서는 모든 시간 조각을 가로지르는 하나의 세계선이 물질과 반물질을 같은 양만큼 주는 반면, 우리는 약 $10^{80}$ 개의 바리온을 보고 반물질은 전혀 보지 못한다는 것을 발견했다. 빠져나갈 길은 전역적으로 균형을 이루는 세계선으로, 반물질이 멀리 떨어져 있거나 거울 우주에 있는 경우다. 이 단계는 그러한 반물질 우주가 만족해야 할 조건을 나열하고 각 기준을 데이터로 검증한다. 우주선(cosmic ray)에는 반원자핵이 없고, 은하단에서 나오는 소멸 감마선도 없다. 도메인은 적어도 지평선만큼, 약 16 Gpc 이상이어야 한다. 무작위 세계선은 터무니없을 만큼 일어나기 어렵다. 남는 것은 Boyle, Finn, Turok 의 CPT 대칭 우주로, 그 예측(가장 가벼운 중성미자의 질량이 0, $r = 0$)은 지금까지 데이터와 일치하며, 틀린 것으로 판명될 수도 있다.
notes: '상태: 추측성. 이것은 저자 자신의 가설이며(시리즈 설명 참조), 확립된 물리가 아니다. 사영 가설의 7단계로, 공준 P3(모든 입자는 하나의 대상의 사영이다)에 대한 이론 단계이다. 1단계(cosmology/projection_postulate)는 공준을 진술했다. 2단계(cosmology/projection_one_particle)는 P3 의 가장 단순한 형태를 배제했다. 닫힌 세계선은 모든 시간 조각을 앞으로(물질) 지나는 횟수만큼 뒤로(반물질) 지나고, 열린 세계선은 많아야 하나의 순입자를 더할 뿐인데, 우주에는 약 $9\times10^{79}$ 개의 바리온이 있고 반물질은 없다. 3~6단계(projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests)는 P5, P4, P1-P2 를 검증했다. 이 단계는 2단계가 제시한 탈출로를 택한다. 세계선은 전역적으로 균형을 이루고, 반물질은 우리의 지평선 너머나 반우주에 있다. 문제는 그러한 반물질 우주가 공준과 일치하려면 무엇을 만족해야 하는지, 그리고 실제로 그것을 만족하는지이다. 먼저 알려진 물리. 사하로프 조건(1967)은 물질의 과잉을 바리온 수 위반, C 및 CP 위반, 그리고 평형으로부터의 이탈로 설명한다. 이 조건들은 어디서나 물질로 이루어진 우주를 예측하며, $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ 이다(Planck 2018, $\Omega_b h^2 = 0.0224$). 대안, 즉 물질 영역과 반물질 영역이 분리된 대칭 우주는 1960년대부터 연구되었다(Alfvén 과 Klein, Omnès). Steigman (ARA&A 14, 339, 1976)은 그 검증들을 검토했고, Cohen, De Rújula and Glashow (ApJ 495, 539, 1998)는 가시 우주 내부의 도메인에 대한 논의를 종결지었다. 모든 데이터는
  data/antimatter_criteria.csv 에서 가져오며, 이 파일에는 인용된 수치가 출처와 함께 담겨 있다. 세계선이 존재하는 차원의 수 $D$ 는 매개변수이다. 그 시간 좌표만 관여하므로 어떤 결과도 $D$ 에 의존하지 않는다. 기준 1: 근처에 섞여 있는 반물질이 없다. BESS-Polar 는 약 4800만 개의 헬륨 원자핵 가운데 반헬륨을 하나도 발견하지 못했다. 95% 한계는 헬륨과 같은 스펙트럼을 가정하면 반헬륨/헬륨 $< 6.9\times10^{-8}$ 이고, 그 가정 없이는 $1.0\times10^{-7}$ 이다(Abe et al., PRL 108, 131301, 2012). AMS-02 는 반원자핵 검출을 발표한 적이 없다. 감마선: 은하단의 뜨거운 기체에서 반양성자 비율 $f$ 는 $f\,n_p^2\langle\sigma v\rangle$ 의 비율로 소멸하며, $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s 이다(크기 정도 수준의 선택). 각 소멸은 여기서 사용하는 파이온 붕괴 스펙트럼에서 100 MeV 이상의 광자 2.1 개를 낸다. 코마 은하단(베타 모형, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$)과 Fermi-LAT 한계 $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016)에 대해 이는 $f < 9\times10^{-8}$ 을 준다. 충족됨: 어떤 반물질이든 은하단 밖에 있어야 하고, 수십 Mpc 안에 갇혀 있는 우주선이 닿지 않는 곳에 있어야 한다. 기준 2: 우리의 지평선 안에 도메인이 없다. 공동 이동 크기 $d$ 의 물질 도메인과 반물질 도메인이 맞닿아 있다면, 재결합 이후 그 벽에서의 소멸은 피할 수 없을 것이다. 여기서의 모형은 Cohen, De Rújula, Glashow
  논증의 단순한 버전이다. 단위 부피당 벽 면적은 한 변이 $d$ 인 정육면체에 대해 $3/d$ 이고($n$ 차원에서는 $n/d$, 검증됨), 바리온은 기체 음속의 $\kappa$ 배 속도로 벽으로 흘러든다. 기체는 $z\approx150$ 까지 CMB 온도를 따르고 그 후 단열적으로 식는다. 각 소멸은 중성 파이온 붕괴로 광자 3 개를 낸다. 광자는 오늘날까지 적색편이되며, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$ 이고, 이 적분은 닫힌 형태의 식과 대조하여 확인된다. 소멸은 재결합($z_{max} = 1000$)부터 $z = 20$ 까지 계산된다. CDG 에서와 같이 그 이후의 시기는 구조 형성에 의존하므로 제외한다. 이를 포함하면 플럭스가 더 높아질 뿐이다. 플럭스는 정확히 $\propto 1/d$ 이다(검증됨). 이것을 0.8 에서 30 MeV 까지의 COMPTEL 배경 $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ (Kappadath et al. 1996), 그리고 Fermi-LAT 등방성 배경(100 MeV 이상에서 $7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$, 지수 2.32, 차단 279 GeV; Ackermann et al., ApJ 799, 86, 2015)과 비교한다. $z\sim20$-$300$ 에서 온 광자는 1 에서 10 MeV 로 도착하며, 그 영역에서는 COMPTEL 이 한계를 정한다. 결과: 예측은 $d = 100$ Mpc 에서 데이터를 160 배, 1 Gpc 에서 16 배, 10 Gpc 에서 1.6 배 초과한다. 최소 도메인 크기는 $d_{min}\approx16$ Gpc (8.5 MeV, $\kappa = 1$ 에서)로, 관측 가능한 우주의 반지름 14.3 Gpc 보다 크다. CDG 도 같은 결론에 도달했다. 물질
  도메인은 거의 가시 우주 전체여야 한다. 이것은 장난감 모형이며, $d_{min}$ 은 $\kappa$ 에 따라 달라진다. CDG 는 소멸에 의한 가열이 유입을 가속하여 한계를 더 강화한다고 주장한다. 제약됨: 어떤 반물질이든 우리의 지평선 너머, 어떤 망원경도 검증할 수 없는 곳에 있어야 한다. 기준 3: 미세 조정. 반물질이 같은 조각 위에서 지평선 너머에 있고 아무것도 그것을 배열하지 않는다고 하자. 그러면 균형 잡힌 무작위 세계선은 $M$ 번의 교차에 대해 우리 영역에 $\sqrt M$ 정도의 순전하를 준다. 순전하의 분산은 $M$ 이고, 총 $T$ 번의 교차가 균형을 이룰 때는 $M(T-M)/(T-1)$ 이다(둘 다 검증됨). 큰 과잉이 생길 확률은 크라메르 비율 함수 $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$ 를 따르며, 이는 정확한 이항 꼬리와 대조하여 확인된다. 오늘날 우리는 $N_B\approx9\times10^{79}$ 개의 바리온을 보고 반물질은 보지 못하므로, 모든 교차는 같은 부호여야 한다: $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$. 대신 약 $1.5\times10^{89}$ 개의 쌍(광자당 하나) 가운데 $9\times10^{79}$ 이라는 초기 우주의 과잉으로 읽으면 $\log_{10}P\approx-1.2\times10^{70}$ 이다. 메커니즘이 없으면 균형 잡힌 세계선은 실패한다. 그 메커니즘은 우리 영역의 모든 교차의 부호를 상관시키는 경계 조건, 즉 요동이 아니라 대칭이어야 할 것이다. 기준 4: CPT 대칭 우주. Boyle, Finn and Turok (PRL 121, 251301, 2018)은 빅뱅 이후의 우주가 그 이전 우주의 CPT 거울상이며, 따라서 그 쌍 전체로는 CPT 대칭을 위반하지 않는다고 제안한다. 다음은 P3 를 이 모형에 맞춘 저자의 정렬이다. $t = 0$ 을 가로지르는 세계선은 우리 쪽에서는 물질이다. 거울 속의
  관측자들은 반대 방향의 시간의 화살을 가지므로, 같은 구간을 반물질로 본다. 2단계에서 증명한 단서는 여전히 적용된다. 임의의 완전한 조각에서 하나의 연속된 세계선은 $|Q|\leq1$ 을 가지므로, 거울만으로는 도움이 되지 않는다. 이 정렬은 세계선이 빅뱅과 미래 경계를 관통하며 감기고, 공형 시간의 두 끝이 붙어 있을 때 작동한다. 이것은 발표된 모형을 넘어서는 추가 가정이며, 2단계의 확장 C 가 새로운 자리에 나타난 것이다. $w$ 번 감긴 고리는 우리 쪽의 모든 조각에서 $+w$ 로 읽히고, 모든 거울 조각에서는 거울 자신의 화살로 읽을 때 $-w$ 로 읽힌다. 합은 0 이다(검증됨). 과잉은 이제 요동이 아니라 위상적 정수이지만, $w\approx10^{80}$ 은 여전히 손으로 넣어야 한다. 모형의 발표된 예측(Boyle, Finn, Turok 논문 초록에서)을 인용된 수치로 검증한다. (a) 가장 가벼운 중성미자는 질량이 없다. NuFIT 6.0 의 질량 분리($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, 정상 순서 $\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$, 역전 순서 $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$)를 쓰면 이는 $\Sigma m_\nu = 0.0588$ eV (정상 질량 순서) 또는 $0.0989$ eV (역전 질량 순서), 그리고 $m_\beta = 0.009$ 또는 $0.049$ eV 를 정한다. KATRIN 은 $m_\beta$ 를 0.8 eV (Nature Physics 18, 160, 2022)와 0.45 eV (Science 388, 180, 2025) 미만으로 제한하며, 이는 두 값보다 훨씬 위이다. Planck 2018 은 $\Sigma m_\nu < 0.12$ eV 를 주며, 이는 둘 다 허용한다. DESI 2024 ($< 0.072$ eV)와 DESI DR2 ($< 0.064$ eV, $\Lambda$CDM)는
  역전의 경우를 배제하고 정상의 경우를 허용한다. DESI DR2 는 또한 진동 실험이 주는 하한과의 긴장을 지적하며, 가장 가벼운 중성미자의 질량이 0 인 경우가 긴장이 가장 적은 경우이다. (b) 암흑물질은 질량 $4.8\times10^8$ GeV 의 안정한 오른손잡이 중성미자이다. 이는 어떤 충돌기의 도달 범위도 훨씬 넘어서고 직접 검출 신호도 주지 않으므로, 현재로서는 검증할 수 없다. (c) 원시 중력파가 없으므로 $r = 0$ 이다. BICEP/Keck 은 $r < 0.036$ (95%, PRL 127, 151301, 2021)을 주며, 이는 일관된다. 진짜 검증은 $\sigma(r)\sim10^{-3}$ 이다. 이는 CMB-S4 의 목표였고(이 프로젝트는 2025년 7월에 중단되었다), 이제는 LiteBIRD 와 Simons Observatory 가 맡는다. 판정 표. (1) 근처에 섞인 것이 없음: 필수; 충족됨. 반헬륨 원자핵 단 하나, 또는 은하단에서 나오는 소멸 감마선이 이를 반증할 것이다. (2) 지평선 안에 도메인이 없음: 필수; 제약됨($d\gtrsim16$ Gpc). MeV 배경의 초과나 더 가까운 벽으로 인한 CMB 왜곡이 이를 반증할 것이다. 지평선 너머에서는 검증 불가능하다. (3) 미세 조정되지 않음: 필수; 무작위 세계선에 대해서는 실패하며($\log_{10}P\sim-10^{70}$ 에서 $-10^{79}$ 까지), 메커니즘만이 이 문제를 제거한다. (4a) 가장 가벼운 중성미자의 질량이 0: 제약됨, 지금까지 일관됨. 0 보다 큰 가장 가벼운 질량이 측정되면 이를 반증한다. 예를 들어 정상 질량 순서에서 $\Sigma m_\nu$ 가 0.0588 eV 보다 분명히 큰 경우이다. (4b) 무거운 오른손잡이 중성미자 암흑물질: 현재 검증 불가능. 암흑물질이 다른 것으로 밝혀지면 이를 반증할 것이다. (4c) $r = 0$: 일관됨. $r\gg10^{-3}$ 인 원시 B 모드가 이를 반증할 것이다. 결론: 확장된 P3 는 CPT
  거울 우주에 걸쳐 균형을 이루며 빅뱅을 관통해 감기는 하나의 세계선으로서만 살아남는다. 그 형태에서 P3 는 반증 가능한 예측을 물려받는다. 0 이 아닌 가장 가벼운 중성미자 질량, 또는 $r\gg0$ 인 원시 B 모드는 CPT 거울 정렬을 반증할 것이다. 이전 단계들은 표준 물리를 재현하거나, 가설이 흡수할 수 있는 데이터를 만났을 뿐이다. 이것은 시리즈에서 실패할 수 있는 검증을 가진 첫 번째 단계이다.'
meanings:
- '반복된 $z$ ⇒ 합산: 모든 도메인 크기 $d$ 와 광자 에너지 $E$ 에 대한 오늘날의 확산 감마선 세기'
- '벽에서 공동 이동 cm$^3$ 당 초당 소멸 수: 단위 부피당 벽 면적 $3/d$ 곱하기 유입 $n_b v$'
- 방출 에너지에서 한 번의 소멸로 나오는 MeV 당 광자 수; 반복된 $j$ (파이온 에너지) ⇒ 합산
- COMPTEL 과 Fermi-LAT 배경이 허용하는 가장 작은 도메인 크기(플럭스는 정확히 $\propto 1/d$)
- Fermi-LAT 플럭스 한계로부터 얻은, 코마 은하단 기체 속 반양성자 비율의 최댓값
- 무작위 부호를 가진 $M$ 번 교차의 순전하; 그 분산은 $M$
- 무작위 세계선이 $M$ 번의 교차 중에서 우리 영역에 순전하 $Q$ 를 줄 확률(크라메르 비율 함수)
- 우리 조각과 그 CPT 상에서의 순전하, 각각 자신의 시간의 화살로 읽음; 반복된 $s$ (구간) ⇒ 합산
- 가장 가벼운 질량 $m_l$ 과 NuFIT 질량 분리로부터 구한 중성미자 질량의 합
labels:
  dims: 세계선이 존재하는 공간의 차원 $D$ (열린 매개변수)
  speed_factor: 벽으로의 유입 속도 $\kappa$, 기체 음속 단위
  z_max: 벽에서의 소멸이 시작되는 적색편이 $z_{max}$ (재결합)
  winding: 빅뱅을 관통하는 세계선의 감김수 $w$
