source_hash: 3955d9d3b7d9
title: 米氏酵素動力學（Michaelis–Menten）
summary: 酵素與受質結合形成複合物，再釋放產物：$E + S \rightleftharpoons ES \to E + P$。在單一 $(4, B, C)$ 張量中同時求解三種酵素與整組受質滴定的完整質量作用方程式，並與準穩態速率律 $v = V_{max} S/(K_m + S)$ 及 Lineweaver–Burk 擬合比較。
notes: 單靠質量作用就得到四個耦合的常微分方程。Michaelis 與 Menten（1913），以 Briggs 與 Haldane（1925）的形式，注意到複合物 $ES$ 在不到一秒內就累積起來，之後只緩慢變化，因此可令 $d[ES]/dt \approx 0$。配合 $E + ES = E_0$ 可得 $[ES] = E_0 S/(K_m + S)$ 以及速率律 $v = k_2 [ES] = V_{max} S/(K_m + S)$，其中 $K_m = (k_{-1} + k_2)/k_1$、$V_{max} = k_2 E_0$。中間面板的點顯示每支試管目前的 $(S, k_2 [ES])$：爆發期之後它們落在虛線曲線上，並隨受質消耗沿曲線下滑，這正是準穩態近似（QSSA）的作用。簡化模型 $dS/dt = -V_{max} S/(K_m + S)$（橙色虛線）甚至有精確解 $S_0 - S + K_m \ln(S_0/S) = V_{max} t$。此近似在 $E_0 \ll S_0 + K_m$ 時成立；把 $E_0$ 提高到 2 µM，可以看到完整動力學落後於 QSSA，因為鎖在複合物中的受質已不可忽略。生化學家在多個 $S_0$ 下量測初速度 $v_0$，並擬合 $1/v_0 = (K_m/V_{max})(1/S_0) + 1/V_{max}$，這是一條直線（Lineweaver–Burk，1934）：$y$ 截距為 $1/V_{max}$，$x$ 截距為 $-1/K_m$。雙倒數圖會放大低 $S_0$ 處的誤差，因此資料有雜訊時直接做非線性擬合較好。酵素 A、B、C 在結合與速度之間取捨：A 的 $K_m$ 小，C 的 $k_{cat}$ 最大；催化效率 $k_{cat}/K_m$ 決定在低受質濃度下誰勝出。簡化：單一活性位、產物釋放不可逆、無抑制作用，且體積均勻混合。
meanings:
- 酵素 $b$ 的結合、解離與催化速率常數（$k_2 = k_{cat}$）
- 滴定的起始受質濃度 $c$（µM）
- 每支試管中的游離酵素、受質、複合物 $X = ES$ 與產物
- 不對任何指標求和：$k_b$ 廣播到每個濃度 $c$
- RK4 的右端項；$E + X = E_0$ 與 $S + X + P = S_0$ 保持不變
- 米氏常數（達半速率的受質濃度）與最大速率
- 初（穩態）速度，於短暫爆發期後量測
- Lineweaver–Burk 正規方程，$A_{ck} = [1/S_c,\ 1]$；重複的 $c$ ⇒ 求和
- 每種酵素的斜率 $K_m/V_{max}$ 與截距 $1/V_{max}$
labels:
  E0: 酵素 $E_0$
  t_end: 模擬時間
  enzyme: 進程曲線所用的酵素
