title: 2D Ising model
category: thermodynamics
level: advanced
order: 2
tags: [nobel:physics:1982]
summary: >
  A lattice of $\pm 1$ spins that prefer to align with their neighbours. The neighbour sum of every site is one conv2d
  with a cross-shaped kernel, and a checkerboard Metropolis update flips half the lattice in parallel. Below the
  critical temperature domains grow until the magnet orders; above it the spins stay disordered.
animated: true
vector_form: 'E = -J\sum_{\langle ij,kl\rangle} s_{ij}\,s_{kl},\qquad P(\text{flip}) = \min\!\big(1,\ e^{-\Delta E / k_B T}\big),\qquad \Delta E_{ij} = 2J\,s_{ij}\,h_{ij}'
index_form: 'h_{ij} = K_{kl}\,s_{i+k,\,j+l},\qquad E = -\tfrac{J}{2}\,s_{ij}\,h_{ij},\qquad m = \tfrac{1}{N}\textstyle\sum_{ij} s_{ij}'
translation:
  - {symbol: 's_{ij}', code: 's', shape: '(B, 1, L, L)', meaning: 'spin $\pm 1$ at row $i$, column $j$ — for a batch of $B$ temperatures (the 1 is the conv2d channel)'}
  - {symbol: 'K_{kl}', code: '[[0, 1, 0], [1, 0, 1], [0, 1, 0]]', shape: '(1, 1, 3, 3)', meaning: 'convolution kernel picking the four nearest neighbours'}
  - {symbol: 'h_{ij}', code: "conv2d(pad(s, mode='circular'), K)", shape: '(B, 1, L, L)', meaning: 'repeated $k, l$ ⇒ summed: neighbour sum, periodic edges'}
  - {symbol: '\Delta E_{ij}', code: '2 * J * s * h', shape: '(B, 1, L, L)', meaning: 'cost of flipping each spin on its own'}
  - {symbol: 's_{ij}h_{ij}', code: "einsum('bcij,bcij->b', s, h)", shape: '(B,)', meaning: 'repeated $i, j$ ⇒ summed: twice the bond energy (every bond is seen from both ends)'}
  - {symbol: 'T_b', code: 'T[:, None, None, None]', shape: '(B, 1, 1, 1)', meaning: 'one temperature per lattice, broadcast over the sites'}
notes: >
  Units: $J = k_B = 1$, so $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$. Three lattices run side by side in the batch: the chosen $T$, $T_c$
  and $T = 3.5$. All start from random spins (infinite temperature) and are suddenly cooled. Updating every site at once
  would be wrong — neighbours would flip based on stale values — but sites of one checkerboard colour only touch the
  other colour, so each half can be updated in parallel. A quench to low $T$ may get stuck for a long time in two
  stripe-shaped domains, a real feature of the dynamics on a periodic lattice. On a finite lattice $\lvert m\rvert$ is not exactly
  zero above $T_c$, and near $T_c$ it fluctuates strongly (critical slowing down). $E/N$ runs from $-2$ (perfect order) to 0.
params:
  T: {default: 1.8, min: 0.5, max: 4.0, step: 0.05, label: 'Temperature $T$', unit: J/k_B}
  L: {default: 96, min: 16, max: 256, step: 16, type: int, label: 'Lattice size $L$'}
  n_sweeps: {default: 400, min: 20, max: 2000, step: 20, type: int, label: Monte Carlo sweeps}
