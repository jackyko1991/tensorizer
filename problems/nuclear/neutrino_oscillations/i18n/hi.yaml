title: न्यूट्रिनो दोलन
summary: न्यूट्रिनो एक निश्चित फ़्लेवर ($\nu_e, \nu_\mu, \nu_\tau$) में बनते हैं पर थोड़ी भिन्न कलाओं वाली तीन द्रव्यमान अवस्थाओं के रूप में चलते हैं। PMNS मिश्रण आव्यूह और द्रव्यमान सूचकांक पर एक सम्मिश्र einsum, बेसलाइनों के पूरे ग्रिड के लिए हर फ़्लेवर परिवर्तन की प्रायिकता देते हैं, और दिखाते हैं कि $\nu_\mu$ पुंज उड़ते हुए $\nu_\tau$ और $\nu_e$ में बदलता है।
notes: '$U$ ऐकिक (unitary) है, इसलिए हर दूरी पर $\sum_\beta P(\alpha\to\beta) = 1$: न्यूट्रिनो फ़्लेवर बदलते हैं पर कोई खोता नहीं। केवल दो फ़्लेवरों के साथ सूत्र $P = \sin^2 2\theta\,\sin^2(1.267\,\Delta m^2 L/E)$ बन जाता है। यहाँ बड़ा $\Delta m^2_{31}$ तेज़ "वायुमंडलीय" दोलन देता है (पहला $\nu_\mu$ गर्त $L/E \approx 500$ km/GeV के निकट, अधिकतर $\nu_\tau$ में क्योंकि $\theta_{23} \approx 45°$) और छोटा $\Delta m^2_{21}$ धीमा "सौर" दोलन ($15\,000$ km/GeV के निकट)। नीचे के बिंदु नमूना न्यूट्रिनो हैं: हर एक वह फ़्लेवर दिखाता है जो उसकी दूरी पर रखा संसूचक दर्ज करेगा, परिकलित प्रायिकताओं से चुना गया (स्थिर seed)। सरलीकरण: केवल निर्वात दोलन — पृथ्वी या सूर्य के भीतर MSW द्रव्य प्रभाव छोड़ दिया गया है — और सामान्य द्रव्यमान क्रम (normal ordering)। डिफ़ॉल्ट प्राचल वर्तमान वैश्विक फ़िट के निकट हैं। $\nu_\mu \to \nu_e$ पुंज के लिए $\delta_{CP}$ = 0 बनाम 270° आज़माएँ।'
meanings:
- फ़्लेवर $\alpha$ × द्रव्यमान अवस्था $i$; einsum('ab,bc,ci->ai') से तीन घूर्णनों का गुणनफल
- केवल अंतर $\Delta m^2_{21}, \Delta m^2_{31}$ मायने रखते हैं; $m_1^2 = 0$
- km में लघुगणकीय अंतराल वाली दूरियाँ
- हर बेसलाइन पर हर द्रव्यमान अवस्था की कला (eV², km, GeV में $2.534\,m^2 L/E$)
- 'दोहराया गया $i$ ⇒ योग: तीनों द्रव्यमान अवस्थाएँ व्यतिकरण करती हैं'
- हर बेसलाइन पर सभी नौ संक्रमण प्रायिकताएँ
labels:
  energy: न्यूट्रिनो ऊर्जा $E$
  l_max: सबसे लंबी बेसलाइन $L_{\max}$
  flavour: जन्म के समय फ़्लेवर
  theta12: $\theta_{12}$
  theta13: $\theta_{13}$
  theta23: $\theta_{23}$
  delta_cp: $\delta_{CP}$
  dm21: $\Delta m^2_{21}$
  dm31: $\Delta m^2_{31}$
