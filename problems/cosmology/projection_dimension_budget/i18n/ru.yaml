source_hash: b577c14eb932
title: Сколько измерений? Бюджет гипотезы проекции
summary: 'Спекулятивная гипотеза, а не установленная физика: сколько скрытых измерений нужно идее проекции и сколько допускают эксперименты? Квантовая сторона, по шагу 1, требует одного скрытого комплексного измерения на исход и $2^N$ для $N$ запутанных частиц, но они живут в гильбертовом пространстве и не обязаны быть направлениями в пространстве. Со стороны гравитации $n$ компактных измерений радиуса $R$ меняют закон Ньютона на расстояниях меньше $R$. Крутильные весы, LHC, а также ограничения от сверхновых и нейтронных звёзд заполняют карту $(n, R)$ ограничение за ограничением. Выживает любое $n$, но только при малом $R$: меньше 38.6 мкм для $n = 1$ и $2\times10^{-10}$ м для $n = 2$. Ограничено, но не исключено.'
notes: 'Статус: спекулятивно; ограничено, но не исключено. Шаг 3 гипотезы проекции (собственная спекулятивная идея автора, см. описание серии; не установленная физика), для постулата P5: квантовым эффектам нужно некоторое число измерений $d_Q$, а гравитации — $d_G$; они оцениваются, а не задаются вручную. Шаг 1 (cosmology/projection_postulate) показал, что гонке проекции нужно ровно одно скрытое комплексное измерение на исход; шаг 2 (cosmology/projection_one_particle) нарезал одну мировую линию; шаг 4 (cosmology/projection_singularity_fold) рассматривает сингулярности как складки проекции. Никакое $n$ не предполагается: карта перебирает от $n = 0$ до $n_{max}$ и $R$ от планковской длины до 1 м. Сначала известная физика. (a) Квантовая сторона: гонка воспроизводит правило Борна с $d + K$ измерениями для $K$ исходов, а $N$ запутанных двухуровневых систем требуют гильбертова пространства размерности $2^N$; стандартная квантовая механика использует то же пространство, и его измерения не являются
  направлениями в пространстве. Если считать их пространственными направлениями, то $N$ кубитам потребовалось бы $2^{N+1} - 3$ дополнительных вещественных измерений (5 для пары Белла) — число, которое менялось бы всякий раз, когда частицы запутываются, чего не делает ни одно фиксированное пространственное многообразие. (b) Сторона гравитации: в $3 + n$ пространственных измерениях закон Гаусса даёт притяжение $G_D M/r^{n+2}$ (проверено потоками через $S^{n+2}$ с помощью autograd для $n = 0..6$). Если $n$ измерений — окружности радиуса $R$, сумма по изображениям превращает это в ньютоновское $G_4 M/r^2$ с $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$ за пределами $R$ (проверено для $n = 1, 2, 3$). Чуть дальше первый уровень гравитонов Калуцы–Клейна даёт юкавский член с $\alpha = 8n/3$ ($16/3$ для 2-тора, как в обзоре PDG) и $\lambda = R$. Соотношение ADD Аркани-Хамеда, Димопулоса и Двали (1998) в соглашении $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$, принятом PDG и экспериментами LHC, воспроизводит числа PDG:
  $R = 30$ мкм, $n = 2$ даёт $M_D = 4.0$ ТэВ, а $M_D = 1$ ТэВ требует $10^{12}$ м, 0.5 мм, ..., 0.1 MeV$^{-1}$ для $n = 1..6$. Ограничения (data/gravity_bounds.csv, цитируемые числа; строки для крутильных весов и LHC — те же, что в cosmology/hierarchy_extra_dimensions, цитируются повторно). Крутильные весы Eöt-Wash исключают $|\alpha| = 1$ выше 56 мкм (Kapner et al., PRL 98, 021101, 2007) и выше 38.6 мкм (Lee et al., PRL 124, 101101, 2020); поскольку $\alpha\geq 1$ для любого $n$, $R > 38.6$ мкм исключено для всех $n\geq 1$ (консервативно: измеренная кривая продолжает падать при больших $\lambda$). Для $n = 2$ Tan et al. (PRL 116, 131101, 2016) дают $R < 30$ мкм. Поиск монострун ATLAS (PRD 103, 112006, 2021, CC-BY 4.0) даёт $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ ТэВ для $n = 2..6$. Остывание SN1987A даёт $M_D > 27$ (2.4) ТэВ для $n = 2$ (3) (Hanhart et al., PLB 509, 1, 2001), а нагрев нейтронных звёзд захваченными KK-гравитонами даёт $M_D > 1700$ (76) ТэВ (Hannestad and Raffelt, PRD 67, 125008,
  2003), оба по обзору PDG 2024. Каждое ограничение становится булевой маской на сетке $(n, R)$, а тестовые точки сверяются с ответами, посчитанными вручную. Результат: $R_{max} = 38.6$ мкм ($n = 1$), $1.7\times10^{-10}$ м ($n = 2$, нейтронные звёзды), $2.6\times10^{-12}$ м ($n = 3$) и радиусы LHC для $n = 4..6$ (от $5\times10^{-13}$ до $2.5\times10^{-15}$ м). Для $n\geq 7$ включено только ограничение от крутильных весов; пределы LHC медленно ослабевают с ростом $n$ и при экстраполяции (здесь не выполнялась) сдвинули бы $R$ к $1/M_D\sim 10^{-20}$ м. ADD с $M_D = 1$ ТэВ, исходное решение проблемы иерархии, исключено для $n = 1..6$. Бюджет: минимум $n = 0$, потому что гравитации не нужно дополнительного пространственного измерения, а квантовые скрытые измерения не обязаны быть пространственными; максимума нет, потому что данные допускают любое $n$ при $R < R_{max}(n)$. Какое прочтение принимает гипотеза: гильбертово прочтение для P1 и P2 (скрытые измерения — измерения пространства состояний,
  так что $D_Q\geq 2^N$ не ограничивает пространство) и геометрическое прочтение для P4 и P5 (измерения вложения; если гравитация может в них проникать, они должны быть компактными и меньше $R_{max}(n)$, иначе это координаты вложения, а не места, куда можно попасть). Вердикт: ограничено, но не исключено, и нового предсказания нет: гипотеза стала бы проверяемой, только если бы фиксировала $n$ и $R$ вблизи этих ограничений.'
meanings:
- 'повторяющийся $i$ ⇒ суммирование: направленное наружу притяжение в случайных точках $S^{n+2}$ (autograd); поток одинаков на любом радиусе'
- 'масса и её изображения вокруг $n$ окружностей, суммированные по индексу изображения $I$: $1/r^{n+2}$ внутри, $G_4/r^2$ снаружи'
- 'наибольший радиус, допускаемый одним цитируемым ограничением: $\lambda_{max}$ для крутильных весов, радиус ADD при $M_D = M_b$ для коллайдерных и астрофизических пределов'
- одна булева карта на каждое семейство ограничений, транслируемая на всю сетку
- 'бюджет измерений: компактные измерения допустимы только ниже этого радиуса'
- фундаментальный масштаб гравитации для $n$ измерений радиуса $R$ (соглашение Джудиче–Раттацци–Уэллса, как в PDG)
- размерность гильбертова пространства $2^N$, нужная $N$ запутанным кубитам (шаг 1)
labels:
  n_max: Наибольшее число дополнительных измерений $n$ на карте (перебираются все $n$ от 0)
  R_points: Радиусы на карте, логарифмически распределённые от планковской длины до 1 м
  M_star: Фундаментальный масштаб $M_D$ для линии ADD
  qubits: Запутанные кубиты $N$ для квантового подсчёта
