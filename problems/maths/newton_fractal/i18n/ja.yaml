source_hash: aac1f92f727e
title: ニュートンフラクタル
summary: ニュートン法 $z \leftarrow z - p(z)/p'(z)$ を複素平面のすべてのピクセルについて一つの複素テンソルとして一度に実行する。各ピクセルを到達した根で色分けすると吸引域が描かれ、その境界はフラクタルになる。一方、根の近くでは誤差がステップごとに二乗される。
notes: 単根 $r$ のまわりで $p$ を展開すると $e_{k+1} \approx \frac{p''(r)}{2p'(r)}\,e_k^2$ となる：正しい桁数がステップごとに倍になり、右のパネルでは対数目盛り上の放物線として現れる（$z^3 - 1$ では定数はちょうど 1）。根から遠いところではニュートン法はカオス的である。$p'(z) = 0$ となる臨界点の近くでは、$z$ のわずかな違いが次の反復点を平面のどこへでも飛ばすので、あらゆるスケールに全体像の複製が現れる。根が三つ以上ある多項式の吸引域は一つの境界、ニュートン写像のジュリア集合を共有する：一つの吸引域の境界点はすべての吸引域の境界点である（和田の性質）。ターミナルは、$3\times3$ 近傍にすべての色をもつ境界ピクセルの数を、全体表示とズーム後について数える。その割合はどのスケールでもほぼ同じである。$z^3 - 2z + 2$ を試してみよう。0 付近の出発点は吸引的周期軌道 $0 \to 1 \to 0$ に落ち込み、決して根に到達しない（灰色の領域）。格子全体が一つの複素テンソルなので、一つの einsum ですべてのピクセルを更新する。
meanings:
- ピクセル $p = (h, w)$ ごとに一つの出発点：$z = x_w + i\,y_h$
- 定数項から順の多項式の係数、例：$z^3 - 1 \to (-1, 0, 0, 1)$
- 各ピクセルのべき $1, z, z^2, \dots$、累積積で作る
- $k$ の繰り返し ⇒ 和：すべてのピクセルでの $p(z)$
- $p'(z)$ の係数：微分でべきが一つ下がる
- 根、コンパニオン行列の固有値として
- 各ピクセルから各根までの距離；$j$ についての最小値が吸引域のラベルを与える
- 倍精度の一つの出発点：比は $|p''(r)/2p'(r)|$ に近づく
labels:
  polynomial: 多項式 $p(z)$
  pixels: 一辺のピクセル数
  extent: 表示範囲の半幅
  iterations: ニュートン法のステップ数
  zoom: ズーム倍率
  tol: 収束判定の許容誤差 $|z - r|$
