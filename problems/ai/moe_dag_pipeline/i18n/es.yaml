source_hash: 2c6e3e6a24cf
title: Un DAG de workflow es una mezcla de expertos con un enrutador fijo
summary: 'Un dígito de MNIST $d$ y un texto de tres palabras como "now plus three" dan la respuesta $y = (d \circ k) \bmod 10$; ninguna de las dos modalidades basta por sí sola. Escrito como un workflow al estilo de Snakemake (encode_image, encode_text, una regla fuse por operación elegida por una función de entrada, classify) y ejecutado por el motor de DAG tensorial del problema del polígono de Willis, el pipeline calcula exactamente lo que calcula una capa de mezcla de expertos top-1 cuando su matriz de enrutamiento $G$ se fija a la elección de la regla. Después, las cuatro etapas que permite un único programa tensorial: un enrutador aprendido, expertos entrenados por separado y encadenados, una sola pasada hacia atrás por todo el DAG y la destilación en una pequeña red densa almacenada en int8. Un enfoque que conecta resultados conocidos, no un teorema nuevo.'
notes: 'Idea. El enfoque es de Jacky Ka Long Ko: construir el workflow del polígono de Willis (medical/cow_workflow_dag) mostró que un DAG de Snakemake puede ser un único programa tensorial, y que tal programa se parece a una mezcla de expertos multimodal. Dicho con precisión: un DAG de workflow es un MoE con un enrutador fijo; un MoE es un DAG cuyas aristas se eligen para cada entrada. Es un enfoque que conecta resultados conocidos, no un teorema nuevo, y este problema construye una pequeña instancia de él. Equivalencia. data/Snakefile tiene las reglas encode_image, encode_text, fuse (un job por muestra y por operación, el wildcard $op$), classify y collect; classify lee su entrada mediante una función de entrada, `routed`, que nombra la salida de fuse de la operación que aparece en el texto de la muestra. El motor analiza el archivo con el parser de cow_workflow_dag y construye la adyacencia de jobs a partir de sus bloques de Kronecker; el bloque de la arista condicional es $(I_N \otimes
  \mathbb 1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$, de modo que la matriz de enrutamiento $G$ está dentro de la adyacencia, y solo se necesitan los $N$ jobs de fuse elegidos de entre los $N E$ (una pasada hacia atrás booleana, igual que Snakemake poda jobs). Ejecutado nivel a nivel, una llamada por lotes por regla, da los mismos logits que una capa al estilo de Switch (tensor de despacho $D$ mediante rangos acumulados, todos los expertos en un único einsum por lotes, combinación) con $G$ fijada a la elección de la regla y valores de compuerta 1: idénticos bit a bit en float32 y dentro de $4 \times 10^{-15}$ en float64 en las 1000 muestras de prueba × 2 semillas (los productos apilados y los productos por grupo suman en distinto orden), con la misma predicción en todos los casos. Es una identidad entre dos formas de escribir un mismo cálculo, no un hallazgo empírico. Enrutador aprendido. Una compuerta softmax sobre las características del texto con enrutamiento top-1 y la pérdida
  de equilibrio de carga de Switch ($\alpha = 0.01$), codificadores congelados, dos variantes en paralelo. Delante de los propios expertos fuse del workflow, la compuerta sola redescubre la regla: tras los 800 pasos por defecto, la operación $e$ va al experto $e$ en 0.85 ± 0.03 de las muestras de prueba (exactitud 0.82 frente a 0.92 con el enrutador fijo), y sigue subiendo (0.95 y 0.90 tras 1500 pasos en una ejecución de prueba). Aprendida junto con expertos nuevos, no lo consigue: el enrutamiento no coincide con las operaciones mejor que el azar (0.35 con la mejor permutación de expertos; 1/3 significa ninguna relación), los expertos siguen mezclados y la exactitud se queda en 0.40. Los expertos fuse no ven el texto, así que un enrutamiento que ignora la operación deja a cada experto una tarea imposible; pero al principio ningún experto es mejor en ninguna operación, por lo que una compuerta top-1 no recibe ninguna señal para romper la simetría. Ruido en la compuerta, una inicialización
  de la compuerta 100× mayor, un calentamiento denso (suave) de 500 pasos y $\alpha = 0.1$ no cambiaron esto en ejecuciones de prueba (no forman parte de la ejecución por defecto). Los MoE más grandes entrenan sus enrutadores desde cero con éxito; este juguete solo dice que aquí la regla fija no se redescubre gratis. Etapas. (2) Entrenamiento separado: cada experto en su propia subtarea, el experto de imagen (un MLP) en las etiquetas de dígitos (exactitud de prueba 0.916), el experto de texto (una capa de atención con einsum) en la palabra del número (1.000), los expertos fuse en la tabla de 300 entradas a partir de entradas one-hot (1.000); encadenado a través del DAG sin entrenamiento conjunto, el pipeline acierta 0.924 de los pares de prueba (más que la exactitud en dígitos, porque por 0 o por 5 perdonan algunos dígitos erróneos). (3) Ajuste fino de extremo a extremo, una sola pasada hacia atrás por todas las etapas: 0.924, sin ganancia; el cuello de botella es el experto de imagen, y
  la pérdida conjunta no aporta información nueva sobre los dígitos (las mismas 3000 imágenes). (4) Un estudiante denso (784 + 45 → 64 → 64 → 10, 57 930 pesos, 0.53 de los 108 766 del pipeline) destilado a $T = 4$ (pérdida $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 entropía cruzada): 0.85–0.86, coincide con su maestro en 0.85–0.87 de las muestras y sigue mejorando al final de sus 3000 pasos; int8 por canal: 0.85–0.86, 58.9 kB en lugar de 232 kB (435 kB para el pipeline). Tiempos para los 1000 pares de prueba en un hilo de CPU: motor de DAG 90 ms, el mismo DAG como una capa MoE 19 ms (el motor además construye sus bloques de jobs), estudiante 3.4 ms, estudiante int8 3.5 ms (calculado con flotantes descuantizados, así que más pequeño pero aquí no realmente más rápido), y una llamada por job, como lo ejecutaría un planificador sin arranque de procesos, 900–1000 ms. Lo que no se sigue. Solo las etapas que son programas tensoriales en un mismo espacio de memoria se fusionan sin copia y transmiten
  un gradiente: las herramientas basadas en archivos (OpenFOAM, VMTK, la mayor parte del análisis de bioimagen) no lo hacen, y un DAG de Snakemake formado por ellas sigue siendo un DAG de procesos. La aceleración del polígono de Willis vino sobre todo del arranque de procesos y la E/S de archivos evitados en cada job, no del procesamiento por lotes. Y el entrenamiento de extremo a extremo solo ayuda cuando una etapa puede aprender algo que el entrenamiento separado no le dio; aquí no fue así. Trabajos relacionados. Las Neural Module Networks (Andreas et al. 2016) ensamblan una red por pregunta a partir de módulos elegidos por un parser, un DAG elegido para cada entrada; el MoE con compuerta dispersa (Shazeer et al. 2017) y el Switch Transformer (Fedus et al. 2021, el enrutamiento top-1 y la pérdida de equilibrio de carga usados aquí); expertos de modalidad en LIMoE (Mustafa et al. 2022) y Uni-MoE (Li et al. 2024); el model stitching (Lenc & Vedaldi 2015; Bansal et al. 2021) une redes entrenadas
  por separado mediante una interfaz aprendida, como hace la etapa 2 mediante vectores de probabilidad; la destilación de conocimiento (Hinton et al. 2015); DSPy (Khattab et al. 2023) optimiza de extremo a extremo pipelines completos de llamadas a modelos de lenguaje. Pathways de Google (una entrada de blog y una visión de 2021) describe un único modelo que dirige cada tarea por las partes que necesita. Datos. MNIST (LeCun, Cortes & Burges; LeCun et al. 1998), licencia CC BY-SA 3.0: 3000 imágenes de entrenamiento (300 por dígito) y 1000 imágenes de prueba (100 por dígito), las primeras de cada dígito en el orden del archivo, incluidas como uint8 (0.7 MB, data/mnist_train.npz, data/mnist_test.npz, redistribuido bajo la misma licencia; data/SOURCES.md contiene la fuente, las sumas de verificación y el procesamiento). Los textos se generan: una palabra de operación (plus, minus, times), una palabra de número (zero a nine) y una palabra de relleno (now, then) en orden aleatorio; los textos de
  prueba usan una semilla fija. Dispositivo y límites. Los valores incluidos proceden de la ejecución por defecto en una CPU (el entorno del proyecto no tiene aquí una versión de PyTorch con CUDA; con unos $10^5$ pesos una GPU no ayudaría): unos 75–150 s de entrenamiento y medición más el GIF en una máquina de 6 núcleos ocupada. Todas las semillas se entrenan juntas en el eje de modelos, cada una con sus propios minilotes, y se representa cada semilla. Un juguete con un dígito y tres operaciones: muestra la estructura, no cómo se comportan los grandes MoE multimodales.'
meanings:
- grafo de reglas analizado desde data/Snakefile con el parser de medical/cow_workflow_dag, más la función de entrada `routed` (una arista condicional classify ← fuse)
- 'bloque a nivel de jobs: el producto de Kronecker de cow_workflow_dag ($I$, $\mathbb 1$, $\mathbb 1^\top$ por eje de wildcard sample, op); para la arista condicional lo enmascara el enrutador, de modo que el job $n$ de classify lee el job $(n, e)$ de fuse si y solo si $G_{ne} = 1$'
- 'el enrutador del workflow: codificación one-hot de la palabra de operación, hallada por una regla (la función de entrada), no aprendida'
- 'jobs de los que depende el objetivo, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$: solo $N$ de los $N E$ jobs de fuse'
- 'el motor: las reglas nivel a nivel, cada una en UNA llamada por lotes sobre sus jobs necesarios (fuse: una llamada por valor de su wildcard $op$)'
- muestra $n$ a la posición $c$ del experto $e$ (su rango entre las muestras enrutadas allí), como en GShard/Switch; capacidad $C$ = grupo más grande
- todos los expertos en un único producto por lotes; $m$ es el eje de modelos (semillas), nunca se suma
- 'combinación: $e$ y $c$ sumados, un único término no nulo por muestra, así que con $g = G$ es igual a la salida del DAG'
- 'enrutador aprendido: softmax de una compuerta lineal sobre las características del texto; enrutamiento top-1, salida escalada por $p$'
- 'equilibrio de carga de Switch: $f_e$ = fracción enrutada a $e$, $P_e$ = probabilidad media de la compuerta; 1 si está equilibrado y es uniforme, $E$ si colapsa'
- destilación de Hinton a temperatura $T$; la pérdida del estudiante es $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ entropía cruzada con la respuesta verdadera
- int8 simétrico por canal de salida, $s_o = \max_i |W_{io}|/127$; almacenado como int8 + una escala float32 por canal
labels:
  seeds: Semillas (modelos en el eje de modelos)
  split_steps: Pasos de la etapa 2 (cada experto en su subtarea)
  router_steps: Pasos de la etapa 1b (enrutador aprendido)
  global_steps: Pasos de la etapa 3 (ajuste fino de extremo a extremo)
  student_steps: Pasos de la etapa 4 (destilación)
  student_hidden: Anchura del estudiante $H$
  temperature: Temperatura de destilación $T$
  balance_weight: Peso de equilibrio de carga $\alpha$
