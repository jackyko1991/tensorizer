title: Трассировка путей методом Монте-Карло в корнелльской комнате
summary: 'Фотореалистичный рендеринг решает уравнение рендеринга методом Монте-Карло. Каждый луч камеры для каждой выборки трассируется одним пакетом через комнату из плоскостей и сфер: отскоки с косинусным весом, теневой луч к площадному источнику света в каждой точке попадания и русская рулетка для завершения путей. Посмотрите, как шум падает как $1/\sqrt{N}$, а красная и зелёная стены отбрасывают цвет на белые — это передаёт только глобальное освещение.'
notes: 'Уравнение рендеринга для диффузной (ламбертовой) поверхности гласит, что свет, покидающий точку, — это её излучение плюс отражённая доля $\rho$ всего падающего света. Падающий свет, в свою очередь, — это исходящий свет других поверхностей, так что интеграл рекурсивен. Трассировщик путей заменяет его случайными путями. Выборка с косинусным весом ($p = \cos\theta/\pi$) сокращает BRDF и косинус, так что пропускная способность пути просто получает множитель $\rho$ на каждый отскок. В каждой точке попадания теневой луч к случайной точке источника добавляет прямой свет (оценка следующего события), что гораздо менее шумно, чем ждать, пока отскок случайно попадёт в маленький источник. Только свет от первого попадания даёт изображение с одним прямым освещением. Каждый следующий отскок добавляет непрямой свет: мягкую подсветку в тенях, более яркий потолок и красное и зелёное цветовое просачивание. Тест «печи» в наборе тестов проверяет оценку. Закрытая комната, все стены которой излучают $L_e$
  и отражают $\rho$, должна всюду иметь яркость $L_e/(1-\rho)$. С косинусной выборкой это получается с нулевой дисперсией. Ошибка падает как $1/\sqrt N$, потому что каждый пиксель — среднее $N$ независимых выборок. Уменьшение шума вдвое стоит вчетверо больше выборок, поэтому производственные рендереры используют шумоподавители.'
meanings:
- 'начало и направление луча $r = (s, p)$: $N$ сдвинутых выборок для каждого из $P$ пикселей, один пакет'
- плоскость $p$ задаётся $n_{pi} x_i = d_p$, обрезанная ограничивающим параллелепипедом; источник света — маленькая плоскость
- расстояние от каждого луча до каждой плоскости; повторяющиеся $i$, $j$ ⇒ суммирование
- корни $\lvert o + t\omega - c\rvert^2 = r^2$ для каждого луча и сферы
- 'ближайшее попадание вдоль каждого луча: какой примитив, где и его нормаль'
- 'следующее направление: равномерная точка в круге, поднятая на полусферу; $f\cos\theta/p = \rho$'
- 'пропускная способность пути: какая часть света, найденного на отскоке $k$, достигает камеры'
- 'оценка следующего события: теневой луч к случайной точке $y$ на площадном источнике'
- 'русская рулетка: случайно завершать тусклые пути, но перевзвешивать выжившие, так что среднее не меняется'
- 'цвет пикселя: среднее по индексу выборки $s$'
