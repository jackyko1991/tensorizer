source_hash: 3b3a390c2f31
title: フーリエ級数とギブズ現象
summary: 正弦波から組み立てた矩形波、のこぎり波、三角波。係数は一つの einsum（数値積分で、$4/(\pi n)$ などと照合）であり、各部分和は基底行列の最初の $N$ 列との一つの行列積 $S_N = B\,c$ である。振動が不連続点に集まっていく一方で、行き過ぎ量は跳びの約 9% にとどまる様子を見よう。
notes: 厳密な係数は、矩形波で奇数 $n$ に対し $b_n = 4/(\pi n)$、のこぎり波で $2(-1)^{n+1}/(\pi n)$、三角波で奇数 $n$ に対し $\pm 8/(\pi^2 n^2)$ であり、数値積分は約 $10^{-6}$ の精度でこれらと一致する。不連続点の近くで部分和は行き過ぎる。$N$ が増えると山は不連続点に近づく（幅は $1/N$ のように縮む）が、その高さはゼロではなく跳びの $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$ 倍に近づく：$-1$ から $1$ への矩形波ではピークは $1.179$ 付近にとどまる。これがギブズ現象である。それでも級数は平均収束する：パーセバルの等式により $\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$ なので、$L^2$ 誤差の二乗は欠けている $b_n^2$ の和である。係数が $1/n$ のように減る（跳びがある）と誤差は $\propto 1/N$ となる。三角波には折れ目しかなく、係数は $1/n^2$、誤差は $1/N^3$ のように減る。滑らかな関数ほど速く収束する。粗い格子（小さな $X$）にすると数値係数がずれていく様子が見える。
meanings:
- $(-\pi, \pi)$ 上の $X$ 個の等しいセルの中点とその幅 $h$：積分の重み
- $x_j$ で標本化した波形 $w$（矩形波、のこぎり波、三角波）
- 基底行列：列 $n$ は格子上の $\sin(n x)$
- $j$ の繰り返し ⇒ 和：積分 $b_n$ を格子上の重み付き和として
- $n$ の繰り返し ⇒ 和：$N$ 個の高調波による部分和、行列積
- $d = F - S$ とした $L^2$ 誤差の二乗；$j$ の繰り返し ⇒ 和
labels:
  n_max: 高調波の最大数 $N$
  n_x: 格子点数 $X$
