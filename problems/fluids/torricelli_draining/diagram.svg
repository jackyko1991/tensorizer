<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Tank of cross-section A filled to height h drains through a small hole of area a in its floor; the jet leaves at speed v equal to the square root of 2 g h">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="guide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- water and tank -->
    <rect x="60" y="44" width="110" height="68" fill="#93c5fd" fill-opacity="0.55"/>
    <line x1="60" y1="44" x2="170" y2="44" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M60,14 V112 H109 M121,112 H170 V14" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- jet -->
    <path d="M109,112 Q112,130 112.5,156 L117.5,156 Q118,130 121,112 Z" fill="#60a5fa"/>
    <!-- surface falls -->
    <line x1="150" y1="30" x2="150" y2="52" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- height -->
    <line x1="40" y1="46" x2="40" y2="110" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#guide)" marker-end="url(#guide)"/>
    <text x="26" y="84" font-style="italic">h</text>
    <text x="76" y="34" font-style="italic">A</text>
    <text x="96" y="128" font-style="italic">a</text>
    <line x1="132" y1="118" x2="132" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="138" y="142" font-style="italic" fill="#b91c1c">v = √2gh</text>
  </g>
</svg>
