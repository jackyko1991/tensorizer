source_hash: c0b25ec18fe5
title: 霍曼轉移與雙橢圓軌道轉移
summary: 把太空船從一條圓軌道送到另一條需要多少 $\Delta v$？活力公式 $v^2 = \mu(2/r - 1/a)$ 為兩次點火的霍曼轉移與三次點火的雙橢圓轉移計價，再以一次批次 RK4 積分、在拱點施加脈衝點火，檢查每艘太空船是否真的抵達目標軌道。
notes: 霍曼轉移沿著與兩個圓都相切的橢圓飛行半圈，$a = (r_1 + r_2)/2$：在近拱點順向點火 $\Delta v_1$，經過 $t_H = \pi\sqrt{a^3/\mu}$ 後在遠拱點再點火 $\Delta v_2$ 使軌道圓化。雙橢圓轉移先爬升到遙遠的半徑 $r_b$，太空船在那裡速度很慢，一次小幅點火即可把軌道另一側抬升到 $r_2$，抵達時再減速。它耗時長得多，但當 $r_2/r_1 \gtrsim 11.94$ 時，夠遠的 $r_b$ 會使它更省（極限 $r_b \to \infty$ 的代價為 $(\sqrt2 - 1)(v_{c1} + v_{c2})$），而在 $r_2/r_1 \approx 15.58$ 以上，任何 $r_b > r_2$ 都更省。兩個交界點皆以二分法數值求出，第二個並用到 autograd 導數。預設是從近地軌道（高約 320 km）到地球同步軌道：霍曼轉移約需 3.9 km/s、5.3 h。選擇太陽並設 $r_1 = 1$ AU、$r_2 = 1.524$ AU 即為地球 → 火星：日心座標下總計約 5.6 km/s、約 259 天（程式每次都會印出此情形）。真實任務還得先爬出地球的重力井，並等待合適的行星相對位置；此處的軌道為圓形且共面，點火為瞬間完成。程式在每次點火處切開 RK4 積分，使每次點火恰好發生在拱點。
meanings:
- 太空船 $b$ 相對於中心天體的位置，單位 km
- 太空船 $b$ 的速度，單位 km/s
- 重複的 $j$ ⇒ 求和：距離平方 $r_b^2$
- 指向中心的平方反比引力，$\mu = GM$
- 半長軸為 $a$ 的軌道上、半徑 $r$ 處的速率；每個 $\Delta v$ 都是兩個這種速率之差
- 太空船 $b$ 第 $k$ 次點火的時間與帶號大小（$\Delta v < 0$ 為減速）
- 沿速度方向的脈衝點火，施加於兩段 RK4 之間
- 點火之間守恆；每次點火使它跳到下一條軌道的 $-\mu/2a$
- 在 $r_b = r_2$ 處的斜率；當 $r_2/r_1 \approx 15.58$ 以上時轉為負值
labels:
  body: 中心天體
  r1: 起始半徑 $r_1$
  r2: 目標半徑 $r_2$
  transfer: 轉移方式
  rb_ratio: 雙橢圓中間半徑 $r_b / r_2$
