source_hash: 63ac7ba591c6
title: 一個粒子被看見許多次：切割單一世界線
summary: 這是一個推測性假說，並非已確立的物理：每個電子都是同一個物體，是一條在時間中來回曲折的世界線（Wheeler 1940 年的單電子宇宙）。一個時間切片會多次切過它：向前的穿越看起來像電子，向後的則像正電子。本步驟切割成批的隨機世界線。所有電子都完全相同，而在轉折點處會產生並湮滅粒子對。但一條閉合世界線穿過每個切片時，向後與向前的次數一樣多，而一條開放世界線最多只增加一個淨粒子，然而宇宙中約有 $10^{80}$ 個重子，且幾乎沒有反物質。這個想法的最簡單形式已被排除。
notes: 狀態：推測性；其最簡單形式已被排除。這是投影假說（作者本人的推測性想法，見系列說明；並非已確立的物理）的第 2 步，對應公設 P3：所有粒子都是同一個物體的投影。第 1 步（cosmology/projection_postulate）陳述了公設；第 3 步（cosmology/projection_dimension_budget）計算它們所需的維度。先講已知的物理。1940 年在一通電話中，John Wheeler 向 Richard Feynman 提出：所有電子之所以相同，是因為它們是同一個電子，其世界線在時間中向前又向後；向後的一段就是正電子。Feynman 在 1965 年的諾貝爾演講中講述了這個故事，連同他自己的反駁：正電子的數目並不像電子那麼多。Wheeler 提出它們也許藏在質子之中。正電子是在時間中倒行的電子這一想法，作為反粒子的 Feynman–Stueckelberg 圖像保留了下來（Feynman, Phys. Rev. 76, 749, 1949），但單電子宇宙沒有：在量子場論中，所有電子之所以相同，是因為它們是同一個場的激發。這裡世界線存在於 $D$ 維空間中（$D$ 是一個參數，從不固定為 4）；正如 P2 所說，對切片而言只有它的時間座標重要。假說的預測：一個時間切片（P2）在 $N_+$ 個向前與 $N_-$ 個向後的穿越處切過世界線。計算內容：成批的平滑（隨機傅立葉，$K$ 個諧波，振幅 $\propto k^{-\beta}$）與粗糙（布朗）世界線，閉合或開放，被 $L$ 個切片切割。穿越次數以散射到差分陣列的方式計數，並對照暴力窮舉表作檢驗。對閉合迴圈，每個切片上都有 $N_+ = N_-$；對開放世界線，$Q = N_+ - N_-$ 等於 $[t_{end}\geq u] - [t_{start}\geq u]$，因此 $|Q|\leq 1$ 且 $N\equiv Q$（mod 2）。傾斜切片（一個運動中的觀察者）不會改變 $Q$。總計數等於切片以下的 $2(\#\text{minima} - \#\text{maxima})$，因此粒子對在 $t(s)$ 的極小值處誕生、在極大值處消亡。隨機平滑迴圈的平均計數服從 Rice 公式。它免費做對的部分：每次穿越讀到的都是同一條世界線的質量與電荷，所以所有電子完全相同，而正電子的電荷恰好相反、質量相同（PDG
  2024：$|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$，$|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$）。與數據的對照（data/*.csv，引用的數字）：AMS-02 量測了 0.5 GeV 到 1 TeV 的宇宙線正電子比例 $e^+/(e^+ + e^-)$（Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0，經 CRDB 資料庫取得 74 個區間）：0.6 GeV 處為 0.13，約 8 GeV 處有最小值 0.053，200 GeV 以上為 0.15 到 0.16。因此不對稱度 $1 - 2f$ 介於 0.67 與 0.89 之間，而閉合迴圈給出 $0$。在宇宙尺度上，Planck 2018 的重子密度 $\Omega_b h^2 = 0.0224$ 給出 $\eta = n_B/n_\gamma = 6.1\times10^{-10}$（見 cosmology/baryon_asymmetry）。以每 cm$^3$ 411 個光子、半徑 465 億光年的球體計算，這相當於 $N_B\approx 9\times10^{79}$ 個重子，而且反物質不存在（BESS-Polar：反氦/氦低於 $6.9\times10^{-8}$；Cohen、De Rújula 與 Glashow 1998：可見宇宙中沒有反物質區域）。單一世界線最多給出 $|Q|/N = 1/N$，當 $N\approx 1.5\times10^{89}$ 時為 $7\times10^{-90}$，而 $\eta = 6\times10^{-10}$；淨電荷差了約 $10^{80}$ 倍。對開放參數的掃描（平滑或布朗、閉合或開放、2 到 32 個諧波、三種粗糙度，約 $3\times10^5$ 個 $N\geq 2$ 的切片）沒有找到任何能達到 AMS-02 不對稱度的配置，而上界說明不可能有：當穿越次數 $N\geq 2$ 時，最大可能的不對稱度是 $1/3$（在 $N = 3$ 時）。結論：其最簡單形式已被排除。延伸，每一項都是額外的假設，並如此標明：(A) 開放世界線增加一個淨粒子，僅此而已。(B) 有偏的投影，即觀察者以效率
  $r$ 看見反粒子，根據 AMS-02 需要 $r = f/(1-f)$ 介於 0.056 與 0.195 之間且隨能量變化，但根據反氦則需要 $r < 7\times10^{-8}$。隱藏的反物質於是會與可見重子一樣重，約為暗物質的 0.19。這是現代形式的 Wheeler「藏在質子之中」；它需要一個機制，而目前並未給出。(C) 如果時間是一個圓，繞了 $w$ 圈的迴圈在每個切片上都會帶有淨電荷 $Q = w$（已檢驗），但 $w\approx 10^{80}$ 必須人為放入，而緊緻的時間意味著閉合類時曲線。這些都不是預測。能使這個想法復活的，是一個讓單一物體的切片計數變得不對稱的機制，而這正是本步驟留給本系列的未解問題。 逃脫路線：簡單版本已被排除，但一條在整體上平衡的世界線，若反物質位於我們的視界之外或位於 CPT 鏡像反宇宙中，則尚未被排除。第 7 步（cosmology/projection_antimatter_universe）列出這樣的反物質宇宙必須滿足的判準，並逐一以數據檢驗。
meanings:
- 重複的 $k$（諧波）與 $c$（cos、sin）⇒ 求和：$D$ 維中的 $B$ 條隨機世界線；座標 0 是時間
- 每個切片的向前（粒子）與向後（反粒子）穿越；對線段 $s$ 的求和是散射到差分陣列再加上累積和
- 切片上的淨電荷；等於兩個端點的穿越數，閉合迴圈為 $0$
- 僅由轉折點得到的同一計數：極小值產生粒子對，極大值使其湮滅
- Rice 公式，譜矩為 $\lambda_0 = \sum_k\sigma_k^2$、$\lambda_2 = \sum_k k^2\sigma_k^2$
- 由能量 $E$ 處的 AMS-02 正電子比例 $f_E$ 得到的宇宙線 $e^\pm$ 電荷不對稱度
- 一條世界線必須攜帶的淨重子數（$\eta$ 取自 Planck 2018）
labels:
  worldlines: 批次中的世界線數 $B$
  samples: 每條世界線上的取樣點數 $S$
  modes: 每個座標的諧波數 $K$（它能曲折的頻繁程度）
  roughness: 粗糙度 $\beta$：諧波 $k$ 的振幅 $\propto k^{-\beta}$
  dims: 世界線所在空間的維數 $D$（開放）
  slices: 時間切片數 $L$
