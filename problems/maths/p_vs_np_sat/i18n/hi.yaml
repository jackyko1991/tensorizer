title: P vs NP और 3-SAT प्रावस्था संक्रमण
summary: 'क्या हर वह समस्या, जिसके हल जाँचना आसान है, हल करने में भी आसान है? यही P vs NP प्रश्न है, जो 1971 से अनसुलझा है। यादृच्छिक 3-SAT इस विषमता को ठोस बनाता है: किसी प्रस्तावित नियतन को जाँचना एक gather और दो रिडक्शन भर है, जबकि संपूर्ण खोज सभी $2^n$ नियतनों का एक साथ एक पैक किए गए बिट टेंसर के रूप में मूल्यांकन करती है, जिसका आकार हर नए चर के साथ दोगुना हो जाता है। उपवाक्य/चर अनुपात $\alpha$ को बदलने पर $\alpha_c \approx 4.27$ के पास संतुष्टि-योग्यता का प्रावस्था संक्रमण और संक्रमण खिड़की के भीतर खोज लागत का शिखर दिखाई देता है।'
notes: 'P vs NP पूछता है कि क्या हर वह निर्णय समस्या, जिसके ''हाँ'' उत्तरों के ऐसे प्रमाणपत्र होते हैं जिन्हें बहुपद समय में जाँचा जा सके (वर्ग NP), बहुपद समय में हल भी की जा सकती है (वर्ग P)। कुक (1971) और लेविन (1973) ने सिद्ध किया कि संतुष्टि-योग्यता NP-पूर्ण है: 3-SAT के लिए एक बहुपद-समय एल्गोरिथ्म NP की हर समस्या के लिए एक ऐसा एल्गोरिथ्म दे देगा। यह ज्ञात नहीं है कि ऐसा एल्गोरिथ्म मौजूद है या नहीं। अधिकांश शोधकर्ता मानते हैं कि P $\ne$ NP, लेकिन इसका कोई प्रमाण नहीं है, और ज्ञात बाधाएँ (सापेक्षीकरण, प्राकृतिक प्रमाण, बीजीयकरण) प्रमाण रणनीतियों के पूरे परिवारों को खारिज कर देती हैं। यह प्रश्न क्ले मिलेनियम पुरस्कार की सात समस्याओं में से एक है और अनसुलझा है। यह प्रोग्राम इसके बारे में कुछ भी सिद्ध नहीं करता: संपूर्ण खोज केवल सबसे स्पष्ट एल्गोरिथ्म है, और 3-SAT के सबसे अच्छे ज्ञात एल्गोरिथ्म अभी भी घातांकीय हैं (PPSZ के लिए लगभग $1.307^n$)। यह जो दिखाता है वह विषमता है। सत्यापक एक gather और उसके बाद एक OR और एक AND है, कुल $O(M)$ कार्य। खोज पूरी सत्य तालिका बनाती है, हर नियतन के लिए एक
  बिट, एक पूर्णांक में 32, इसलिए टेंसर में $2^n$ बिट होते हैं और उसका समय हर चर के साथ दोगुना हो जाता है (नीचे दाईं ओर; छोटे $n$ पर स्थिर ओवरहेड हावी रहते हैं)। $M = \alpha n$ उपवाक्यों वाले यादृच्छिक 3-SAT में एक तीक्ष्ण देहली होती है: फ्रीडगुट (1999) ने सिद्ध किया कि $n \to \infty$ होने पर संक्रमण तीक्ष्ण हो जाता है, सांख्यिकीय भौतिकी (मेज़ार, पारिज़ी और ज़ेक्किना 2002) $\alpha_c \approx 4.267$ की भविष्यवाणी करती है, और डिंग, स्लाई और सुन (2015) ने बड़े $k$ वाले $k$-SAT के लिए भविष्यवाणी की गई देहली सिद्ध की। $k = 3$ के लिए 4.267 का मान अभी भी एक अनुमान है; सिद्ध केवल इतना है कि यादृच्छिक सूत्र $\alpha = 3.52$ से नीचे उच्च प्रायिकता से संतुष्टि-योग्य होते हैं और 4.49 से ऊपर असंतुष्टि-योग्य। छोटे $n$ पर 50% वाला प्रतिच्छेदन बिंदु 4.27 से ऊपर रहता है और $n$ बढ़ने के साथ नीचे खिसकता है (परिमित-आकार स्केलिंग)। परीक्षण जाँचते हैं कि सत्यापक हर नियतन पर ब्रूट फ़ोर्स से मेल खाता है, कि एक उपवाक्य सभी नियतनों का ठीक $1/8$ भाग हटा देता है, कि हलों की औसत संख्या प्रथम आघूर्ण $2^n (7/8)^M$ के बराबर
  है, कि $P_{\mathrm{sat}}$ एकदिष्ट है और देहली के पास तेज़ी से गिरता है, और कि खिड़की $n$ के साथ संकरी होती जाती है। खोज-लागत पैनल एक गहराई-प्रथम बैकट्रैकिंग खोज के नोड गिनता है, जो $x_0, x_1, \ldots$ को बारी-बारी से निर्धारित करती है और जैसे ही कोई पूरी तरह नियत उपवाक्य असत्य होता है, पीछे लौट जाती है। देहली से नीचे यह जल्दी हल ढूँढ लेती है, देहली से बहुत ऊपर छोटे विरोधाभास पेड़ को जल्दी छाँट देते हैं, और सबसे कठिन सूत्र संक्रमण खिड़की में होते हैं (इस सरल खोज के लिए $n = 16$ पर $\alpha \approx 5$ के पास; यूनिट प्रोपेगेशन वाले सॉल्वर 4.3 के पास शिखर पर पहुँचते हैं)। वक्रों को तीक्ष्ण होते देखने के लिए अधिक चर आज़माइए, या चिकने वक्रों के लिए अधिक सूत्र।'
meanings:
- $B$ सूत्र, जिनमें 3 भिन्न चरों वाले $M$ उपवाक्य हैं, हर चर प्रायिकता $\frac12$ से निषेधित
- हर सूत्र का हर लिटरल एक ही gather में
- 'सत्यापक: $3M$ लुकअप, $n$ में बहुपद'
- सभी $2^n$ नियतनों पर $x_j$ की सत्य तालिका, एक पूर्णांक में 32 नियतन
- एक उपवाक्य का सभी $2^n$ नियतनों पर बिटवाइज़ OR से मूल्यांकन (सभी एक वाले मान के साथ XOR निषेध करता है)
- उपवाक्यों का एक-एक करके AND; स्तर $d$ केवल वे उपवाक्य इकट्ठा करता है जिनके चर पहले $d$ में हैं, जिससे बैकट्रैकिंग पेड़ मिलता है
- नेस्टेड सूत्र (एक ही उपवाक्य सूची के उपसर्ग) एक ही पास में हर $\alpha = M/n$ देते हैं और $P_{\mathrm{sat}}$ को अवर्धमान बनाते हैं
labels:
  n_max: चर $n$ (सबसे बड़ा आकार)
  instances: प्रति आकार सूत्र
  seed: यादृच्छिक बीज
