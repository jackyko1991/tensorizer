source_hash: 48f29505ec48
title: k-mer、GC 含量與 GC 偏斜
summary: DNA 序列化為 one-hot 的 $(L, 4)$ 張量。計數每個 $k$ 字母字詞是對展開視窗的一次 einsum（一維卷積），GC 含量與 GC 偏斜是視窗和，而累積偏斜的最小值指出在一條植入了起點與終點的合成環狀染色體上，複製從何處開始。
notes: 大多數細菌染色體是環狀的，從單一複製起點開始複製，兩個複製叉朝相反方向前進，直到在終點相遇。兩半的複製方式不同（一股作為領先股連續合成，另一股分段合成），在演化時間尺度上領先股傾向累積略多於 C 的 G。這裡植入了此偏好：從起點到終點，G 以 $(1+\text{skew})/(1-\text{skew})$ 倍受青睞，另一半則偏好 C。單一視窗的偏斜帶有雜訊，但累加和 $S_n$ 一路下降到起點、一路上升到終點，所以即使偏好只有幾個百分點，其最小值與最大值仍很明顯。真實基因體呈現同樣的 V 形，只是較不乾淨，因為基因、重複序列與重排各有其組成。內環上兩段低 GC 區段模仿基因體島，即從別處獲得、常保有不同鹼基組成的 DNA。$k$-mer 頻譜是基因體組裝與許多免比對比較的起點；在這個隨機基因體中，其顏色只是跟著 GC 含量變化。試試較小的偏斜、較小的基因體或較大的 $k$（字詞更多，每個的計數更少）。
meanings:
- 位置 $n$、字母 $a$ ∈ (A, C, G, T)：鹼基為 $a$ 處為 1
- 每個 $k$ 字母的視窗，不複製記憶體
- $a \cdot 4^{k-1-j}$：將字詞視為 4 進位數字（AAA = 0、…、TTT = $4^k-1$）
- 重複的 $j$ 與 $a$ ⇒ 求和：從 $n$ 開始的 $k$-mer 的索引
- $k$-mer 頻譜；計數總和為 $L-k+1$
- 重複的 $i$ ⇒ 求和：$\ell$ 個鹼基的視窗 $w$ 中的鹼基計數，每隔 $\Delta = \ell/2$ 一個
- $(n_G + n_C)/\ell$ 與 $(n_G - n_C)/(n_G + n_C)$
- $c = (0, -1, +1, 0)$：G 減 C 的累計數；argmin = 起點，argmax = 終點
labels:
  length_kb: 基因體長度 $L$
  k: 字詞長度 $k$
  window: 視窗 $\ell$
  origin: 植入的起點（基因體比例）
  skew: 股偏好（偏斜）
  gc: GC 含量
  seed: 隨機種子
