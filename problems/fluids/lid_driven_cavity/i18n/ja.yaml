source_hash: 87bf1a8993df
title: キャビティ流れ（ナビエ–ストークス）
summary: 数値流体力学の古典的なベンチマーク：蓋が右へ滑る正方形の容器内の流体。流れ関数–渦度形式の2次元ナビエ–ストークス方程式を時間発展させ、$\psi$ のポアソン方程式は eigh でラプラシアンを対角化して解く。主渦が発達し、その中心線上の速度を Ghia ら（1982）の結果と比較する。
notes: 単位：キャビティの大きさ 1、蓋の速さ 1 なので $\mathrm{Re} = 1/\nu$。流れ関数を用いると流れは構成上自動的に発散ゼロとなり、ナビエ–ストークス方程式の回転をとることで圧力が消える。各ステップ：Thom の公式による壁上の渦度（滑りなし条件）、$\omega$ の前進オイラー1ステップ、そしてポアソン方程式の求解。$\nabla^2\psi = T\psi + \psi T^\mathsf T$ は $T$ の固有基底で対角になる——高速正弦変換と同じ考え方である。Re = 100 では渦中心は中央の右上 (0.62, 0.74) 付近にある。Re が低いと (0.5, 0.76) へ、高いと中央へ移動し、下の隅に小さな逆回転渦が現れる。高い Re にはより細かい格子が必要である。
meanings:
- 格子上の渦度と流れ関数、添字 [x, y]、壁を含む
- 中心差分による $(\partial_y\psi, -\partial_x\psi)$
- 繰り返される $j$ ⇒ 和をとる：渦度の移流
- 5点ステンシル
- 壁で $\psi = 0$ の1次元ラプラシアン、一度だけ対角化
- 変換；その後 $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$ として逆変換
- Thom：$-2\psi_\text{next}/h^2$、蓋の下ではさらに $2U/h$ を引く
labels:
  re: レイノルズ数 $UL/\nu$
  n: 一辺あたりの格子点数
  t_max: シミュレーション時間
