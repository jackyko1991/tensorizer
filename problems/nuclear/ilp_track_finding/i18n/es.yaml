source_hash: 16a2fcec9827
title: Reconstrucción de trayectorias de partículas como programa entero
summary: 'Impactos reales de una colisión simulada del HL-LHC (desafío TrackML, CC BY 4.0) se unen en trayectorias mediante un programa lineal entero: se eligen tripletes de impactos con curvatura y ángulo polar coherentes, y cada impacto se usa como máximo una vez. Nuestro PDLP tensorial (gradiente híbrido primal–dual con reinicios, el método LP de OR-Tools y cuOpt) resuelve la relajación LP en directo sobre tensores dispersos y después la redondea y la repara. Se compara con una referencia húngara (Kuhn–Munkres) escrita a mano y con ejecuciones offline de HiGHS, Gurobi y scipy: brecha en el objetivo, eficiencia, tasa de trayectorias falsas, la puntuación oficial de TrackML y el escalado del tiempo de cálculo $t \propto N^k$.'
notes: 'Estado: una comparación de herramientas, no un problema abierto. El ILP es un problema de empaquetamiento de conjuntos (NP-difícil en general); PDLP es un método LP de primer orden, y el redondeo da una solución entera heurística, no un óptimo certificado, por lo que siempre se informa la brecha respecto al óptimo exacto. La cota dual de PDLP proporciona una cota superior certificada incluso sin un solver exacto. Método. Los segmentos candidatos unen impactos de capas adyacentes que podría conectar una trayectoria con $p_T \ge p_{T,\min}$ procedente de la línea del haz. Los tripletes unen dos segmentos a través de un impacto central compartido y reciben la puntuación $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ (solo se conservan los $s_t > 0$). El ILP elige tripletes $x_t$ y segmentos $y_e$: cada impacto tiene como máximo un segmento elegido de entrada y uno de salida, de modo que las trayectorias son cadenas. Un segmento elegido continúa en como máximo
  un triplete elegido a cada lado, y cada segmento cuesta $\lambda = 0.1$. Su relajación LP ($0 \le x, y \le 1$) la resuelve nuestro PDLP (Applegate et al. 2021): PDHG con escalado de Ruiz, reinicios al promedio basados en las condiciones KKT y actualizaciones del peso primal, escrito con torch.sparse para que funcione en CPU o CUDA. La referencia húngara resuelve una asignación lineal exacta por cada par de capas (primero el par central, luego hacia dentro y hacia fuera, con costes de tripletes según la cadena construida hasta ese momento). Es un emparejamiento bipartito resuelto exactamente en tiempo polinómico, pero decide un par de capas cada vez, mientras que el ILP pondera cadenas enteras de forma global. Por eso sus trayectorias difieren. Datos. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), evento de entrenamiento 1000 (200 colisiones de apilamiento): registro de Zenodo 4730167, doi:10.5281/zenodo.4730167, licencia CC BY 4.0 (Salzburger, Innocente, Vlimant, Rousseau et
  al.). Se restringe al barril de píxeles (volumen 8, 4 capas) con $|\eta| < 1$: 11 519 impactos, 2 452 partículas y 6% de ruido, más los pesos oficiales por impacto. Banco de pruebas offline (data/solver_benchmark.csv) en un AMD Ryzen 5 5600G (1 hilo): HiGHS a través de scipy 1.18.1 (milp, linprog), Gurobi 13 a través de gurobipy con su licencia limitada en tamaño (como máximo 2000 variables y 2000 restricciones, así que solo $\Delta\phi \le 30°$), linear_sum_assignment de scipy, y nuestro PDLP en la CPU y en una NVIDIA GTX 1080 Ti. NVIDIA cuOpt 26.10 se instaló en WSL pero no pudo ejecutarse: sus kernels están compilados para capacidad de cómputo 7.0 (Volta) y posteriores, y la 1080 Ti es 6.1 (cudaErrorNoKernelImageForDevice), así que se omite y no tiene cifras. El estado del arte citado está en data/trackml_sota.csv. Veredicto. En los ocho sectores (de 5° a 360°, de 151 a 11 519 impactos) la relajación LP fue ajustada: el óptimo LP de HiGHS coincide con el óptimo MILP hasta $10^{-13}$.
  Nuestro PDLP con reparación alcanzó el mismo óptimo todas las veces (brecha inferior a $10^{-9}$), con exactamente los tripletes que eligieron HiGHS y Gurobi (0 diferentes). Esto es empírico, no está garantizado: el empaquetamiento de conjuntos es NP-difícil, y aquí la estructura de cadenas de cuatro capas mantiene ajustado el LP. Con puntuaciones continuas los empates exactos son improbables, así que los solvers que alcanzan el óptimo coinciden. A mitad de la ejecución, cerca de un tercio de los valores de PDLP son fraccionarios, muchos cerca de $\tfrac12$, donde tripletes rivales casi empatan (por ejemplo, impactos dobles en módulos solapados); se estabilizan a medida que PDLP converge. Las cadenas húngaras quedan entre 0 y 2.2% por debajo del óptimo (de 5 a 651 tripletes diferentes) y coinciden exactamente con el objetivo de asignación de scipy (una comprobación de nuestro algoritmo húngaro). Subconjunto completo del barril (360°): eficiencia del 93.1% y tasa de falsos del 13.0% para
  los solvers ILP frente a 90.9% y 16.2% para el húngaro, puntuación TrackML de 0.495 frente a 0.482. Un reconstructor perfecto de las partículas reconstruibles obtendría aquí 0.618; el estado del arte citado para eventos completos es de 0.88 a 0.94 (Mikado 0.944 en 0.56 s). Escalado para $N \ge 1000$ impactos: HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, nuestro PDLP en la CPU $N^{0.92}$, en la GPU $N^{0.36}$ (el coste de lanzamiento aún domina con 10 000 variables, así que la 1080 Ti todavía no es más rápida), nuestro húngaro $N^{2.14}$ (peor caso $O(n^3)$; los costes dispersos y filtrados mantienen cortos los caminos de aumento), scipy $N^{1.57}$. Gurobi cabe en su límite de tamaño solo hasta 860 impactos ($N^{1.04}$ en ese rango). A estos tamaños HiGHS es tan rápido como PDLP; los métodos de primer orden compensan en LP mucho más grandes. En sectores pequeños el húngaro encuentra algunas partículas más (97.4% frente a 94.8% a 30°): el objetivo del ILP es un indicador indirecto, no la
  métrica física. Advertencias. Nuestras instancias son un sector del barril con 4 capas, así que las trayectorias tienen como máximo 4 impactos y no hay tapas: más fácil y distinto de los eventos completos del desafío. La comparación de puntuaciones TrackML es orientativa, no en igualdad de condiciones: cerca del 40% del peso de la puntuación del subconjunto recae en partículas por debajo del corte en $p_T$ o con menos de 3 capas dentro del corte, y nuestros tiempos cubren una décima parte de un evento y excluyen la lectura y la construcción de candidatos. Los reconstructores reales (ACTS y los de los propios experimentos) usan filtros de Kalman combinatorios, y las redes neuronales de grafos (Exa.TrkX) son el principal enfoque de aprendizaje automático; nadie ejecuta un MILP por evento.'
meanings:
- 'impactos reales de TrackML en las 4 capas del barril de píxeles, restringidos a un sector $\Delta\phi$: el tamaño del problema'
- pares de impactos en capas adyacentes con $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ y $|z_0| \le 150$ mm, todos los pares a la vez
- curvatura de la circunferencia que pasa por la línea del haz y ambos impactos
- los tripletes comparten el impacto central; una hélice tiene los mismos $\kappa$ y $\theta$ en ambas mitades, así que $s_t$ disminuye con la discrepancia
- filas de exclusividad de impactos (un segmento de entrada, uno de salida) y filas de continuidad; $v$ repetido ⇒ sumado en cada producto
- PDHG sobre el LP escalado por Ruiz con promediado, reinicios y peso primal; dos productos matriz-vector dispersos por iteración
- ordenar los segmentos por valor LP, aceptar los que no tienen conflictos en rondas paralelas, recortar los extremos de cadena que cuestan más de lo que puntúan
- 'Kuhn–Munkres con potenciales: una asignación lineal exacta por par de capas, encadenada en trayectorias'
- 'puntuación oficial de TrackML: suma de los pesos de los impactos en trayectorias que contienen > 50% de una partícula y están formadas en > 50% por esa partícula'
labels:
  dphi: Anchura del sector $\Delta\phi$ (tamaño del problema)
  pt_min: Momento transversal mínimo $p_{T,\min}$
  max_iter: Número máximo de iteraciones de PDLP
  digits: Precisión objetivo de PDLP $10^{-k}$, $k$ =
  check: Iteraciones entre comprobaciones de reinicio (un fotograma cada una)
