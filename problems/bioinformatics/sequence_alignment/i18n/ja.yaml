source_hash: b944848791a5
title: テンソル更新の波面としての配列アラインメント
summary: 動的計画法による DNA 配列の Needleman–Wunsch（グローバル）および Smith–Waterman（ローカル）アラインメント。表の各セルは左、上、斜めの隣接セルだけを必要とするので、反対角線 $i + j = d$ 全体を、配列の組のバッチについて一度に、一回のテンソル更新で埋められる。波面が表を掃いていき、続いてトレースバックが最適なアラインメントを読み取る様子を見よう。
notes: グローバルアラインメントは両方の配列を端から端まで揃えることを強制する。ローカルアラインメントは選択肢 0 を加えるので、悪い区間は単に捨てられ、どこかにある最高スコアの断片が報告される（ここではランダムな背景に植え込んだモチーフ）。トレースバックは終端セルから逆にたどり、各ステップで三つの選択肢のどれが保存された値を生んだかを調べ、ギャップの内部では表 $H$、$E$、$F$ の間を切り替える。コストは依然として $O(nm)$ セルだが、逐次ステップは $n + m - 1$ だけである：この反対角線並列性が GPU や SIMD のアライナーの仕組みである。変異率を上げてみたり、$g_o > g_e$ として多くの短いギャップより少数の長いギャップを優遇してみよう。タンパク質では $W$ の代わりに BLOSUM62 などの $20\times20$ 行列を使う。それ以外は何も変わらない。
meanings:
- 組 $b$ の第 1 配列の文字 $i$ と第 2 配列の文字 $j$。A、C、G、T についての one-hot
- 文字 $\alpha$ と $\beta$ を揃えるスコア：対角線上は一致、それ以外は不一致
- $\alpha, \beta$ の繰り返し ⇒ 和：あらゆる文字の組み合わせのスコア
- $k$ 文字のギャップのコストは $g_o + (k-1)\,g_e$（アフィン）。$g_o = g_e$ なら線形ギャップ
- 反対角線 $d$ 上のすべてのセル。対角線 $d-1$ と $d-2$ だけに依存
- 対角線ごとに一回のテンソル更新：一致、$a$ のギャップ、$c$ のギャップで終わる最良スコア
- グローバルスコアは角、ローカルスコアは最良のセル。各長さを超えるパディングは無視
labels:
  mode: アラインメント（グローバル = Needleman–Wunsch、ローカル = Smith–Waterman）
  length: 配列長 $L$
  n_pairs: バッチ内の組数 $B$
  mutation: サイトあたりの変異率
  match: 一致スコア
  mismatch: 不一致スコア
  gap_open: ギャップ開始 $g_o$
  gap_extend: ギャップ伸長 $g_e$
