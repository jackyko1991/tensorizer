source_hash: b1957b563a0a
title: Lois de Kepler
summary: 'Des planètes d''orbites de tailles et d''excentricités différentes tournent autour d''une étoile sous la gravité newtonienne en inverse du carré. Une seule intégration RK4 vectorisée montre les trois lois de Kepler : des ellipses dont l''étoile occupe un foyer, des aires égales en des temps égaux, et $T^2 \propto a^3$.'
notes: 'Les unités sont l''UA, l''année et la masse solaire, donc $GM_\odot = 4\pi^2$ et la troisième loi de Kepler s''écrit simplement $T^2 = a^3$. Chaque planète part du périhélie avec la vitesse vis-viva $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$. Les secteurs ombrés de l''orbite la plus excentrique sont chacun parcourus en un même temps $T/12$ : courts et larges près de l''étoile, longs et fins au loin, mais toujours de même aire, car $dA/dt = L/2$ et $L$ est conservé. La période est mesurée dans la simulation comme le temps nécessaire pour balayer $2\pi$. L''étoile est supposée fixe (sa masse est bien plus grande que celle des planètes) et les planètes ne s''attirent pas entre elles.'
meanings:
- position de la planète $b$ par rapport à l'étoile, $i \in \{x, y\}$
- vitesse de la planète $b$
- '$j$ répété ⇒ sommé : distance au carré $r_b^2$'
- attraction en inverse du carré vers l'étoile
- symbole de Levi-Civita 2D, $\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- moment cinétique par unité de masse ; $dA/dt = L_b/2$ est constant
- $\tfrac12 v^2 - GM/r$ ; donne $a = -GM/2E$
labels:
