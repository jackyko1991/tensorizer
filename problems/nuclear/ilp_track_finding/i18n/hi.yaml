title: पूर्णांक प्रोग्राम के रूप में कण ट्रैक खोज
summary: 'HL-LHC की एक सिम्युलेटेड टक्कर (TrackML चैलेंज, CC BY 4.0) के वास्तविक हिट्स को एक पूर्णांक रैखिक प्रोग्राम द्वारा ट्रैकों में जोड़ा जाता है: संगत वक्रता और ध्रुवीय कोण वाले हिट-ट्रिपलेट चुने जाते हैं, और प्रत्येक हिट अधिकतम एक बार उपयोग होता है। हमारा टेंसर PDLP (रीस्टार्ट वाला प्राइमल–डुअल हाइब्रिड ग्रेडिएंट, OR-Tools और cuOpt के अंदर की LP विधि) विरल (sparse) टेंसरों पर LP रिलैक्सेशन को लाइव हल करता है, फिर उसे राउंड करके सुधारता है। इसकी तुलना हाथ से लिखे हंगेरियन (Kuhn–Munkres) बेसलाइन से और HiGHS, Gurobi तथा scipy के ऑफ़लाइन रन से की जाती है: उद्देश्य-फलन का अंतर, दक्षता, नकली ट्रैक दर, आधिकारिक TrackML स्कोर और रनटाइम का स्केलिंग $t \propto N^k$।'
notes: 'स्थिति: यह उपकरणों की तुलना है, कोई खुली समस्या नहीं। यह ILP एक सेट-पैकिंग समस्या है (सामान्यतः NP-कठिन); PDLP एक प्रथम-कोटि LP विधि है, और राउंडिंग एक अनुमानी (heuristic) पूर्णांक हल देती है, प्रमाणित इष्टतम नहीं, इसलिए सटीक इष्टतम से अंतर हमेशा बताया जाता है। PDLP की डुअल सीमा किसी सटीक सॉल्वर के बिना भी एक प्रमाणित ऊपरी सीमा देती है। विधि. उम्मीदवार सेगमेंट आसन्न परतों के उन हिट्स को जोड़ते हैं जिन्हें बीम लाइन से निकलने वाला $p_T \ge p_{T,\min}$ वाला ट्रैक जोड़ सकता है। ट्रिपलेट दो सेगमेंटों को एक साझा मध्य हिट के ज़रिए जोड़ते हैं और उन्हें स्कोर $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ मिलता है (केवल $s_t > 0$ रखे जाते हैं)। ILP ट्रिपलेट $x_t$ और सेगमेंट $y_e$ चुनता है: प्रत्येक हिट में अधिकतम एक चुना हुआ आने वाला और एक जाने वाला सेगमेंट होता है, इसलिए ट्रैक शृंखलाएँ होते हैं। एक चुना हुआ सेगमेंट हर तरफ़ अधिकतम एक चुने हुए ट्रिपलेट में आगे बढ़ता है, और हर सेगमेंट की लागत $\lambda = 0.1$ है। इसका LP रिलैक्सेशन ($0 \le x, y \le 1$) हमारे PDLP
  (Applegate et al. 2021) से हल होता है: Ruiz स्केलिंग के साथ PDHG, KKT-आधारित औसत की ओर रीस्टार्ट और प्राइमल-भार अपडेट, torch.sparse में लिखा गया ताकि यह CPU या CUDA पर चले। हंगेरियन बेसलाइन हर परत-जोड़ी के लिए एक सटीक रैखिक असाइनमेंट हल करता है (पहले मध्य जोड़ी, फिर अंदर और बाहर की ओर, अब तक बनी शृंखला के आधार पर ट्रिपलेट लागतों के साथ)। यह बहुपद समय में सटीक रूप से हल होने वाला द्विभाजित मिलान (bipartite matching) है, पर यह एक बार में एक परत-जोड़ी का निर्णय लेता है, जबकि ILP पूरी शृंखलाओं को वैश्विक रूप से तौलता है। इसीलिए इसके ट्रैक अलग होते हैं। डेटा. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), प्रशिक्षण इवेंट 1000 (200 पाइल-अप टक्करें): Zenodo रिकॉर्ड 4730167, doi:10.5281/zenodo.4730167, लाइसेंस CC BY 4.0 (Salzburger, Innocente, Vlimant, Rousseau et al.)। इसे $|\eta| < 1$ के साथ पिक्सेल बैरल (वॉल्यूम 8, 4 परतें) तक सीमित किया गया है: 11 519 हिट्स, 2 452 कण और 6% शोर, साथ में आधिकारिक प्रति-हिट भार। ऑफ़लाइन बेंचमार्क (data/solver_benchmark.csv) एक AMD Ryzen 5 5600G (1
  थ्रेड) पर: scipy 1.18.1 के ज़रिए HiGHS (milp, linprog), gurobipy के ज़रिए Gurobi 13 अपने आकार-सीमित लाइसेंस के साथ (अधिकतम 2000 चर और 2000 बाधाएँ, इसलिए केवल $\Delta\phi \le 30°$), scipy का linear_sum_assignment, और CPU तथा NVIDIA GTX 1080 Ti पर हमारा PDLP। NVIDIA cuOpt 26.10 WSL में इंस्टॉल हुआ पर चल नहीं सका: इसके कर्नेल कंप्यूट क्षमता 7.0 (Volta) और नए के लिए बने हैं, और 1080 Ti की क्षमता 6.1 है (cudaErrorNoKernelImageForDevice), इसलिए इसे छोड़ दिया गया है और इसके कोई आँकड़े नहीं हैं। उद्धृत अत्याधुनिक परिणाम data/trackml_sota.csv में हैं। निष्कर्ष. सभी आठ सेक्टरों (5° से 360°, 151 से 11 519 हिट्स) पर LP रिलैक्सेशन सटीक (tight) रहा: HiGHS का LP इष्टतम $10^{-13}$ तक MILP इष्टतम के बराबर है। हमारे PDLP और सुधार ने हर बार वही इष्टतम पाया (अंतर $10^{-9}$ से कम), ठीक उन्हीं ट्रिपलेटों के साथ जो HiGHS और Gurobi ने चुने (0 भिन्न)। यह प्रायोगिक है, गारंटीशुदा नहीं: सेट पैकिंग NP-कठिन है, और यहाँ चार-परत वाली शृंखला संरचना LP को सटीक रखती है। सतत स्कोरों के साथ सटीक बराबरी की संभावना कम है,
  इसलिए इष्टतम तक पहुँचने वाले सॉल्वर सहमत होते हैं। रन के बीच में PDLP के लगभग एक-तिहाई मान भिन्नात्मक होते हैं, कई $\tfrac12$ के पास, जहाँ प्रतिद्वंद्वी ट्रिपलेट लगभग बराबर होते हैं (उदाहरण के लिए एक-दूसरे पर चढ़े मॉड्यूलों में दोहरे हिट); PDLP के अभिसरण के साथ वे स्थिर हो जाते हैं। हंगेरियन शृंखलाएँ इष्टतम से 0 से 2.2% नीचे हैं (5 से 651 ट्रिपलेट भिन्न) और scipy के असाइनमेंट उद्देश्य से बिल्कुल मेल खाती हैं (हमारे हंगेरियन की एक जाँच)। पूरा बैरल उपसमुच्चय (360°): ILP सॉल्वरों के लिए दक्षता 93.1% और नकली दर 13.0%, जबकि हंगेरियन के लिए 90.9% और 16.2%; TrackML स्कोर 0.495 बनाम 0.482। पुनर्निर्माण-योग्य कणों का एक आदर्श ट्रैकर यहाँ 0.618 स्कोर करता; पूरे इवेंट के लिए उद्धृत अत्याधुनिक परिणाम 0.88 से 0.94 है (Mikado 0.944, 0.56 s में)। $N \ge 1000$ हिट्स पर स्केलिंग: HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, CPU पर हमारा PDLP $N^{0.92}$, GPU पर $N^{0.36}$ (10 000 चरों पर अब भी लॉन्च ओवरहेड हावी है, इसलिए 1080 Ti अभी तेज़ नहीं है), हमारा हंगेरियन $N^{2.14}$ (सबसे खराब स्थिति $O(n^3)$; विरल,
  फ़िल्टर की गई लागतें ऑगमेंटिंग पथों को छोटा रखती हैं), scipy $N^{1.57}$। Gurobi अपनी आकार सीमा में केवल 860 हिट्स तक समाता है (वहाँ $N^{1.04}$)। इन आकारों पर HiGHS उतना ही तेज़ है जितना PDLP; प्रथम-कोटि विधियाँ बहुत बड़े LP पर फ़ायदेमंद होती हैं। छोटे सेक्टरों पर हंगेरियन थोड़े अधिक कण पाता है (30° पर 97.4% बनाम 94.8%): ILP का उद्देश्य एक प्रतिनिधि (proxy) है, भौतिकी का मापदंड नहीं। सावधानियाँ. हमारे उदाहरण 4 परतों वाला एक बैरल सेक्टर हैं, इसलिए ट्रैकों में अधिकतम 4 हिट होते हैं और कोई एंडकैप नहीं है: यह चैलेंज के पूरे इवेंटों से आसान और अलग है। TrackML स्कोर की तुलना सांकेतिक है, समान परिस्थितियों में नहीं: उपसमुच्चय के स्कोर-भार का लगभग 40% उन कणों पर है जो $p_T$ कट से नीचे हैं या कट के अंदर 3 से कम परतों में हैं, और हमारे समय एक इवेंट के दसवें हिस्से को कवर करते हैं तथा डेटा पढ़ना और उम्मीदवार बनाना शामिल नहीं करते। वास्तविक ट्रैकर (ACTS, और प्रयोगों के अपने ट्रैकर) संयोजी Kalman फ़िल्टर उपयोग करते हैं, और ग्राफ़ न्यूरल नेटवर्क (Exa.TrkX) मुख्य मशीन-लर्निंग दृष्टिकोण हैं; कोई भी प्रति
  इवेंट MILP नहीं चलाता।'
meanings:
- '4 पिक्सेल-बैरल परतों पर वास्तविक TrackML हिट्स, एक $\Delta\phi$ सेक्टर तक सीमित: समस्या का आकार'
- आसन्न परतों पर हिट-जोड़ियाँ जिनमें $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ और $|z_0| \le 150$ mm, सभी जोड़ियाँ एक साथ
- बीम लाइन और दोनों हिट्स से होकर जाने वाले वृत्त की वक्रता
- ट्रिपलेट मध्य हिट साझा करते हैं; एक हेलिक्स के दोनों हिस्सों पर $\kappa$ और $\theta$ समान होते हैं, इसलिए बेमेल बढ़ने पर $s_t$ घटता है
- हिट-विशिष्टता पंक्तियाँ (एक सेगमेंट अंदर, एक बाहर) और निरंतरता पंक्तियाँ; दोहराया गया $v$ ⇒ हर गुणनफल में जोड़ा जाता है
- Ruiz-स्केल किए गए LP पर औसतन, रीस्टार्ट और प्राइमल भार के साथ PDHG; प्रति पुनरावृत्ति दो विरल मैट्रिक्स-वेक्टर गुणनफल
- सेगमेंटों को LP मान के अनुसार क्रमित करें, संघर्ष-रहित सेगमेंटों को समानांतर चरणों में स्वीकार करें, शृंखला के वे सिरे काटें जिनकी लागत उनके स्कोर से अधिक है
- 'पोटेंशियल के साथ Kuhn–Munkres: हर परत-जोड़ी के लिए एक सटीक रैखिक असाइनमेंट, ट्रैकों में जोड़ा गया'
- 'आधिकारिक TrackML स्कोर: उन ट्रैकों पर हिट्स के भारों का योग जिनमें किसी कण के > 50% हिट्स हों और जो > 50% उसी कण के हों'
labels:
  dphi: सेक्टर की चौड़ाई $\Delta\phi$ (समस्या का आकार)
  pt_min: न्यूनतम अनुप्रस्थ संवेग $p_{T,\min}$
  max_iter: PDLP पुनरावृत्तियों की अधिकतम संख्या
  digits: PDLP लक्ष्य सटीकता $10^{-k}$, $k$ =
  check: रीस्टार्ट जाँचों के बीच पुनरावृत्तियाँ (हर एक पर एक फ़्रेम)
