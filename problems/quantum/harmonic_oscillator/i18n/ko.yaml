source_hash: 213c96e488f8
title: 양자 조화 진동자
summary: 해밀토니안 $H = -\tfrac12\,d^2/dx^2 + \tfrac12\omega^2x^2$는 격자 위에서 행렬이 되고, torch.linalg.eigh는 등간격 에너지 사다리 $E_n = \omega(n + \tfrac12)$를 돌려줍니다. 옮겨진 가우스 함수(결맞음 상태)를 고유 상태들의 합으로 쓰고 각각에 위상 $e^{-iE_n t}$를 주면, 파동묶음이 용수철에 매달린 고전적인 질량처럼 정확히 앞뒤로 흔들립니다.
notes: 단위 $\hbar = m = 1$. 격자는 벽에서 $\psi = 0$인 큰 상자이며, 벽이 전혀 영향을 주지 않을 만큼 멉니다. 흐린 곡선들은 가장 낮은 정상 상태 $\varphi_n(x)$를 그 에너지 $E_n$의 높이에 그린 것이며, 사다리 간격은 정확히 $\omega$입니다. 초기 상태는 $x_0$으로 옮긴 바닥 상태 가우스 함수입니다. 그 가중치 $\lvert c_n\rvert^2$은 평균 $\omega x_0^2/2$인 푸아송 분포를 이루며, 모든 에너지가 $\omega$의 정수배만큼 차이 나므로 파동묶음은 주기 $2\pi/\omega$마다 퍼지지 않고 $x_0$으로 돌아옵니다. $\langle x\rangle$는 고전 운동 $x_0\cos\omega t$를 따릅니다(2차 퍼텐셜에서는 에렌페스트 정리가 정확합니다).
meanings:
- 모든 격자점에서의 용수철 퍼텐셜 $\tfrac12\omega^2x^2$
- 운동 에너지 $-\tfrac12\,D2$에 대각선의 퍼텐셜을 더함
- 에너지와 고유벡터 (열 $n$이 상태 $n$)
- '반복된 $x$ ⇒ 합: 초기 상태와 상태 $n$의 겹침'
- '반복된 $n$ ⇒ 합: 위상이 붙은 성분들로 $\psi$를 재구성'
- 평균 위치, 고전적인 $x_0\cos\omega t$와 비교
labels:
  omega: 각진동수 $\omega$
  x0: 처음 변위 $x_0$
  periods: 시뮬레이션 시간
  n_grid: 격자점 수
