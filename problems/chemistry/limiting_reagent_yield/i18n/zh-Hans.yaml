source_hash: 835586f4adf3
title: 限量试剂与产率
summary: 把铝和碘（或氮和氢）以任意比例混合：哪种反应物先耗尽，最多能生成多少产物，另一种又剩下多少？每种物质的量都随同一个反应进度 $\xi$ 变化，限量试剂由 $n_s/|\nu_s|$ 的最小值决定，而一整批实验以及起始质量的二维图，都用同一个张量运算处理。
notes: 按固定比例反应的是摩尔数而不是克数：先把每个质量除以其摩尔质量。然后用一个数，即反应进度 $\xi$，描述反应进行了多少：$2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$ 消耗 $2\xi$ mol 铝和 $3\xi$ mol 碘，生成 $2\xi$ mol 碘化铝。每种反应物最多允许 $n^0_s/|\nu_s|$ 个单位的反应，其中最小的那个数胜出：该反应物就是限量试剂，它的柱条会降到零。用 1.20 g Al（44.5 mmol）和 2.40 g I₂（9.46 mmol）时碘是限量试剂：$\xi^{\max} = 3.15$ mmol，最多生成 2.57 g AlI₃，剩下 1.03 g 铝。在图上，虚线化学计量线两侧的产物都只取决于一种反应物；沿着这条线，两者同时耗尽，没有浪费。实际产率低于理论产率（损失、副反应、未进行到底的平衡：Haber 反应器单程只能转化约 15 %），而产率超过 100 % 意味着产物潮湿或不纯。改变质量、称得的产物或反应试试看。
meanings:
- 带符号的化学计量数：2 Al + 3 I₂ → 2 AlI₃ 为 $-2, -3, +2$
- 重复的 $e$ ⇒ 求和：由各物种所含原子得到的摩尔质量
- 每个实验 $b$ 的起始摩尔数（最后一个是你的实验）
- 某反应物降到零之前的最大反应进度；argmin 即限量试剂
- 从 0 到 $\xi^{\max}$ 的 $K$ 个进度处的物质的量（柱条）
- 产物的理论产量，单位 g
- 产率（百分比）
- 起始质量网格只是一个更大的批次
labels:
  reaction: 反应
  mass_1: 反应物 1 的质量（Al 或 N₂）
  mass_2: 反应物 2 的质量（I₂ 或 H₂）
  measured: 称得的产物
