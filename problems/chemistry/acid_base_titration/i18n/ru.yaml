source_hash: e3d9a69287ac
title: Кривые кислотно-основного титрования
summary: Гидроксид натрия по каплям добавляют к сильной кислоте, слабой кислоте и фосфорной кислоте. Вместо отдельной учебной формулы для каждого участка одно уравнение баланса зарядов решается относительно $[\mathrm{H^+}]$ методом бисекции — сразу для всех кислот и всех объёмов в тензоре $(A, N)$. Кривые дают точки эквивалентности (пики $d\mathrm{pH}/dV$), буферную область и долевые концентрации частиц $\alpha_j(\mathrm{pH})$.
notes: 'Баланс зарядов выполняется во всех точках кривой, поэтому он заменяет отдельные рецепты для начала титрования, буферной области, точки эквивалентности и избытка основания. Каждое слагаемое — монотонная функция pH, что делает бисекцию надёжной: она всегда делит интервал пополам и не может пропустить корень. Сильная кислота (моделируемая как pKa $\approx -6$) даёт резкий скачок с pH 7 в точке эквивалентности, где остаются только $\mathrm{Na^+}$, $\mathrm{Cl^-}$ и вода. Слабая кислота начинается выше, плавно поднимается через буферную область, и её точка эквивалентности лежит выше 7, потому что сопряжённое основание $\mathrm{A^-}$ само является слабым основанием. На полпути к эквивалентности $[\mathrm{HA}] = [\mathrm{A^-}]$, поэтому уравнение Хендерсона–Хассельбаха $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$ даёт $\mathrm{pH} = \mathrm{p}K_a$: именно титрованием измеряют значения pKa. Фосфорная кислота (pKa ≈ 2.15, 7.20 и 12.35, приближённые значения при
  25 °C) показывает два скачка; третий протон настолько слабо кислый, что 0.1 M NaOH не может заметно его оторвать, и его скачок теряется в избытке основания. Панель частиц объясняет почему: каждая $\alpha_j$ достигает максимума между двумя значениями pKa, а две соседние равны ровно при $\mathrm{pH} = \mathrm{p}K$. Упрощения: концентрации вместо активностей, 25 °C, без CO₂ из воздуха.'
meanings:
- кислота $a$, протон $i$; недостающие протоны дополнены значением $+\infty$ ($K = 0$)
- 'кумулятивные константы: $-$ накопленная сумма значений pKa, $\beta_{a0} = 1$'
- кислота и натрий после смешения $V_0$ кислоты с $V_n$ основания
- долевые концентрации частиц; сумма по $k$ в знаменателе — нормировка softmax
- 'повторяющийся $j$ ⇒ суммирование: число протонов, отданных одной молекулой кислоты, $\bar n$'
- бисекция по $\mathrm{pH} = -\log_{10}h$, все кислоты и объёмы в одном тензоре
- наклон; его пики (найденные с помощью max-pool) — точки эквивалентности
labels:
  c_acid: Концентрация кислоты $c_a$
  V0: Объём кислоты $V_0$
  c_base: Концентрация NaOH $c_b$
  V_max: Наибольший объём NaOH
  pKa_weak: pKa слабой кислоты (уксусная ≈ 4.76)
