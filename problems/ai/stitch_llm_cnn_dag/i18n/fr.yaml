source_hash: 9a93d668845a
title: 'Entraîner séparément, assembler par un tenseur DAG : un CNN et un petit LM'
summary: 'Un petit CNN apprend les chiffres MNIST et un petit GPT au niveau des caractères apprend des phrases comme "three+two=five.", chacun de son côté. Une seule arête du DAG les relie ensuite : un connecteur transforme les caractéristiques du CNN en jetons souples qui remplacent le premier mot, si bien que le LM répond "five" à "[image d''un 3]+two=". Tout le processus d''entraînement est lui-même un DAG tensoriel (des règles par niveaux, un chemin critique max-plus, un seul appel groupé par règle sur l''ensemble des graines), et il est comparé au même réseau entraîné de bout en bout sur la seule tâche conjointe, à calcul égal (multiplications-additions). L''arête d''assemblage est aussi écrite comme une couche de mélange d''experts à routeur fixe, et un routeur appris est mis à l''épreuve.'
notes: 'Idée. Des réseaux peuvent être entraînés séparément, puis reliés par un tenseur DAG, puis optimisés globalement, et l''ensemble du processus peut lui-même être piloté par le tenseur DAG. L''idée est de Jacky Ka Long Ko ; ce problème la teste sur un petit CNN et un petit LM au niveau des caractères, délibérément pas comme un modèle vision-langage entraîné conjointement à partir de zéro, et la compare précisément à cette alternative sans DAG. Ce qui est nouveau et ce qui ne l''est pas. Construire un modèle multimodal à partir d''un encodeur d''images préentraîné séparément, d''un LM préentraîné et d''un petit connecteur appris, c''est ainsi que sont faits LLaVA (Liu et al. 2023, une projection linéaire ou MLP dans l''espace des jetons du LM) et BLIP-2 (Li et al. 2023, le Q-Former entre un encodeur d''images figé et un LLM figé) ; Frozen (Tsimpoukelli et al. 2021) fournit une image à un LM figé sous forme de préfixe souple, comme ici ; et l''assemblage de modèles (Lenc et Vedaldi, CVPR
  2015, arXiv 2014 ; Bansal et al. 2021) relie deux réseaux entraînés par une petite couche entraînable. Ce que ce problème ajoute, c''est l''orchestration : le graphe du modèle et le processus d''entraînement sont tous deux exécutés par le moteur de DAG tensoriel du problème de workflow du polygone de Willis (graphe des règles, graphe des tâches de Kronecker, niveaux booléens, chemin critique max-plus), et le modèle construit par DAG est mesuré face à un monolithe. Tâche et modèles. Un CNN (deux convolutions 5×5, 8474 poids) apprend les dix chiffres à partir de 3000 images MNIST. Un GPT à deux couches (d = 32, quatre têtes, 27 543 poids, attention einsum avec un axe de modèles issu de chain_of_thought) apprend les 300 phrases « a op b = r. » avec op parmi +, −, × modulo 10, les chiffres écrits en toutes lettres ("three+two=five.", le premier mot aligné à droite dans un emplacement de 5 lettres). La tâche conjointe fournit une image de test MNIST de a et le texte "+two=" ; le mot de l''opérande
  ne figure pas dans le texte. L''arête du DAG est un connecteur (3808 poids) : à partir des dix probabilités de chiffre $q$ du CNN et d''un vecteur d''emplacement $S_t$, il produit $K = 5$ jetons souples $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$ qui remplacent l''emplacement de l''opérande à l''entrée du LM. (Fournir plutôt les caractéristiques de l''avant-dernière couche du CNN apprenait beaucoup plus lentement lors des essais : environ 0,25 de précision conjointe après 100 pas du connecteur, contre environ 0,6.) La précision est la part des exemples de test dont toutes les lettres de la réponse et le point final sont le premier choix du LM étant donné le vrai préfixe, ce qui est exactement ce qu''écrit le décodage glouton. Le processus d''entraînement comme DAG. data/training.smk liste les règles ; le moteur l''analyse avec le parseur du polygone de Willis et l''exécute niveau par niveau, chaque règle en UN seul appel groupé sur ses modèles le long d''un axe de modèles empilés (graine
  × taille de l''ensemble conjoint $n$) : niveau 0 train_cnn ∥ train_lm ∥ train_monolith ; niveau 1 train_connector (CNN et LM figés, diffusés de la graine vers (graine, $n$) par le bloc $I \otimes \mathbb 1$) ; niveau 2 global_finetune (tout, de bout en bout à travers l''arête, avec un taux d''apprentissage 100 fois plus petit) ∥ deux routeurs appris ; niveau 3 evaluate. Avec 2 graines et 4 tailles : 8 règles, 45 tâches, 84 arêtes entre tâches, $A$ nilpotente. Les tests vérifient les niveaux, qu''un cycle est refusé, que deux graines entraînées dans une même pile donnent les mêmes pertes que chacune entraînée seule (Adam agit élément par élément, l''écrêtage se fait par modèle) et que la perte d''un modèle n''envoie aucun gradient aux autres. La référence. Le monolithe est le même CNN + connecteur + LM (39 825 poids), initialisé aléatoirement et entraîné de bout en bout sur les seuls exemples conjoints. Son budget est égalisé en multiplications-additions par modèle : les 150 pas du CNN,
  600 du LM, 150 du connecteur et 80 de réglage fin (lot de 32) du pipeline DAG coûtent autant que 682 pas conjoints, que reçoit le monolithe (en comptant chaque préentraînement en entier pour chaque modèle, bien que dans le DAG un seul CNN et un seul LM préentraînés servent les quatre valeurs de $n$). Résultats (2 graines, 1000 images de test, hasard 0,1, CPU). Les réductions flottantes multithreadées font varier les exécutions répétées de quelques points ; les chiffres ci-dessous sont donc l''intervalle de la moyenne sur les graines pour quatre exécutions complètes ; results/stages.csv contient les valeurs exactes de l''exécution fournie. Seul, le CNN lit 0,89 des chiffres de test et le LM complète 0,97 à 0,99 des invites textuelles ; écrire le chiffre du CNN sous forme de texte et le donner au LM atteint 0,88 à 0,89, le plafond de ce pipeline. Précision conjointe pour $n$ = 100, 300, 1000, 3000 exemples conjoints : connecteur non entraîné environ 0,16 ; après l''étape du connecteur 0,41–0,47,
  0,58–0,63, 0,60–0,69, 0,64–0,68 ; après le réglage fin global 0,41–0,47, 0,63–0,67, 0,68–0,75, 0,71–0,75 ; le monolithe 0,14, 0,13–0,15, 0,16–0,17, 0,23. Le modèle construit par DAG l''emporte pour chaque $n$ dans chaque exécution, avec le plus grand écart là où les données conjointes sont rares, et le réglage fin ajoute de 0,03 à 0,08 à partir de $n$ = 300 (à $n$ = 100 il ne change rien en moyenne). La raison est simple : le DAG réutilise des données unimodales (3000 chiffres étiquetés et toutes les phrases), tandis que le monolithe doit découvrir les chiffres et l''arithmétique à partir des seuls $n$ mots de réponse, et × masque souvent l''opérande (tout × 0 = 0). Avec plus de pas ou de données, le monolithe s''améliorerait (sa perte diminue encore à la fin de son budget) : c''est une comparaison à petit budget, pas une loi. Arête du DAG = répartition MoE. La même couche d''entrée s''écrit comme un mélange d''experts : l''expert img (CNN + connecteur) et l''expert txt (le plongement
  des jetons du LM), un routeur $G$ sur positions × experts, chaque expert exécuté en lot sur les positions qui lui sont attribuées, et la combinaison $X^0 = G_{mntx}Y^x_{mntc}$. Avec $G$ one-hot selon le type de données (emplacement d''image ou lettre, connu avant de voir la moindre donnée, comme un workflow choisit une règle d''après son joker), la sortie MoE est égale à la sortie câblée par le DAG à 1e-6 près, de même que tous les gradients (testé). La relation précise : une arête de DAG est une répartition MoE avec un routeur fixe décidé par le type de données ; un MoE est un DAG dont les arêtes sont choisies pour chaque jeton par un routeur appris. Un routeur peut-il apprendre ce routage ? Un routeur linéaire sur les caractéristiques de chaque position (image regroupée en 7×7 et identifiant one-hot) a été entraîné avec les experts figés et la perte d''équilibrage de charge de Switch ($\alpha$ = 0,01). Switch top-1 (seul l''expert choisi s''exécute, mis à l''échelle par $p$) n''est pas
  fiable : sa précision de routage a varié de 0 à 0,92 selon les modèles et les exécutions, et sa précision sur la tâche de 0 à environ 0,46, car l''expert non choisi ne reçoit aucun gradient, si bien qu''un mauvais choix précoce n''est jamais corrigé, et la perte d''équilibrage tire vers une répartition 50/50 alors que la vraie répartition est 5/17. Entraîné comme un mélange dense ($G = p$, les deux experts partout) puis utilisé en top-1, le routeur retrouve le routage par modalité dans chaque modèle et chaque exécution (0,97 à 0,99 des positions) et atteint environ 0,35 à 0,65 de précision sur la tâche, un peu en dessous du routeur fixe car $p < 1$ réduit l''échelle des sorties. Quand la bonne arête est connue d''après le type de données, la fixer est à la fois exact et moins coûteux. Temps. Sur un CPU de bureau à 6 cœurs, l''exécution par défaut s''entraîne en environ 66 s quand la machine est au repos (jusqu''à 2 à 4 minutes quand elle est partagée avec d''autres tâches lourdes), plus
  environ 15 s pour le GIF : lors de l''exécution au repos, le monolithe a pris 35 s, le LM 12 s, le connecteur 4,5 s et le réglage fin 4 s. Avec un worker par règle, le chemin critique max-plus est le monolithe, puis evaluate (39 s) ; la chaîne propre au système DAG LM → connecteur → réglage fin → evaluate prend environ 24 s. Le code choisit le GPU quand torch en détecte un ; l''environnement de ce projet a une version CPU de torch, donc tous les chiffres fournis proviennent du CPU. Données. MNIST (Y. LeCun, C. Cortes, C. J. C. Burges), licence CC BY-SA 3.0 : un sous-ensemble équilibré de 3000 images d''entraînement et 1000 images de test est fourni (data/mnist_subset.npz, 0,7 Mo ; data/SOURCES.md indique la source, les sommes de contrôle et le traitement). Les phrases sont générées dans le code. À essayer. Moins de pas du LM (la précision du LM plafonne tout), un $\alpha$ plus grand (le routeur Switch s''effondre davantage), pas de réglage fin (0 pas), ou une seule graine pour voir à quel
  point les graines divergent.'
meanings:
- la règle $s$ lit ce qu'écrit la règle $r$ ; le processus d'entraînement analysé à partir de data/training.smk avec le parseur du problème du polygone de Willis
- 'graphe des tâches sur les jokers graine et $n$ : une règle sans $n$ est diffusée vers chaque $n$ ($I \otimes \mathbb 1$), evaluate les rassemble toutes ($\mathbb 1^\top$)'
- 'niveau de chaque règle : train_cnn, train_lm et le monolithe au niveau 0, le connecteur au 1, réglage fin et routeur au 2, evaluate au 3'
- instants de fin max-plus à partir des durées mesurées des règles ; $\max t$ est le chemin critique
- les dix probabilités de chiffre du CNN pour chaque image ; l'axe de modèles $m$ devient les groupes d'une convolution groupée par couche
- 'l''arête du DAG : probabilités de chiffre plus un vecteur d''emplacement $S_t$ → un vecteur d''entrée du LM à la position $t$ ; les $K = 5$ jetons souples remplacent le premier mot masqué'
- 'routeur : one-hot selon le type de données (emplacement d''image ou lettre), ou un softmax Switch top-1 appris sur les caractéristiques des positions'
- '$x$ répété ⇒ sommé : la combinaison de la couche MoE ; chaque expert $Y^x$ n''est calculé que sur le groupe qui lui est attribué'
- logits de la lettre suivante du petit GPT (attention einsum avec un axe de modèles, issue de chain_of_thought)
- perte par modèle sur le texte après le préfixe (nats) ; sommer les $M$ pertes donne à chaque modèle son propre gradient
labels:
  seeds: Graines (réplicats indépendants)
  steps_cnn: Pas de préentraînement du CNN
  steps_lm: Pas de préentraînement du LM
  steps_con: Pas du connecteur (CNN et LM figés)
  steps_ft: Pas de réglage fin global
  steps_router: Pas du routeur appris (chaque routeur)
  lr_ft: Taux d'apprentissage du réglage fin
  alpha: Poids d'équilibrage de charge $\alpha$
