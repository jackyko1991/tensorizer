source_hash: 41a426132182
title: El problema de la jerarquía y la gravedad que se escapa a dimensiones extra
summary: '¿Por qué la gravedad es unas $10^{33}$ veces más débil que la fuerza débil ($G_F M_{Pl}^2$)? Una respuesta especulativa: la gravedad se extiende por $n$ dimensiones compactas ocultas. Sobre $\mathbb R^3\times T^n$ el potencial se suma de dos maneras, sobre imágenes de la masa y sobre la torre de Kaluza–Klein, como un solo tensor sobre capas de la red. Decae como $1/r^{1+n}$ dentro y como $1/r$ fuera, con una cola de Yukawa $\alpha = 2n$, $\lambda = R$. Los radios ADD para $n = 1..6$ se comparan con límites reales de balanzas de torsión y del LHC, y el factor de deformación de Randall–Sundrum $e^{-\pi k r_c}$ convierte $M_{Pl}$ en TeV. No se ha observado ninguna dimensión extra.'
notes: 'Estado: especulativo. El problema de la jerarquía pregunta por qué la escala electrodébil ($v \approx 246$ GeV) está tan por debajo de la escala de Planck ($M_{Pl} \approx 1.22\times10^{19}$ GeV), con $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$. Arkani-Hamed, Dimopoulos y Dvali (ADD, 1998) propusieron que solo la gravedad se extiende por $n$ dimensiones compactas de entre un milímetro y un femtómetro, de modo que la verdadera escala de la gravedad $M_*$ podría ser de un TeV. Randall y Sundrum (1999) propusieron en cambio una sola dimensión deformada. No se ha encontrado ninguna dimensión extra. Otras respuestas propuestas incluyen la supersimetría, la composición, el relaxión y la selección antrópica. Ninguna está establecida. Lo que se calcula: una masa puntual sobre $\mathbb R^3\times T^n$ (círculos de radio $R$, unidades $R = G_D M = 1$). La suma de imágenes y la suma de Kaluza–Klein son iguales por la fórmula de sumación de Poisson; ambas se agrupan por capas $m = |\mathbf
  k|^2$ con multiplicidades $r_n(m)$. La gráfica usa la suma de imágenes dentro ($r < R$, imágenes lejanas sustituidas por una integral) y la suma KK fuera. La ley de Gauss en $3+n$ dimensiones espaciales fija $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$. El nivel KK más ligero tiene $2n$ modos de masa $1/R$, así que justo fuera del espacio compacto la gravedad parece una corrección de Yukawa con $\alpha = 2n$, $\lambda = R$ (toro; otras formas cambian $\alpha$). Los radios ADD usan $M_{Pl}^2 = M_*^{n+2}R^n$; los artículos difieren en factores como $(2\pi)^n$ y $8\pi$, así que $R$ es un orden de magnitud. Datos, como números citados en data/*.csv: las balanzas de torsión de Eöt-Wash excluyen $|\alpha| = 1$ por encima de $\lambda = 56\,\mu$m (Kapner et al., PRL 98, 021101, 2007, arXiv:hep-ph/0611184; una dimensión extra $R \le 44\,\mu$m) y por encima de $38.6\,\mu$m (Lee et al., PRL 124, 101101, 2020, arXiv:2002.11761). La curva de exclusión en sí no se incluye. Como decrece con $\lambda$, todo
  punto con $\alpha \ge 1$ y $\lambda > 38.6\,\mu$m está excluido, una prueba conservadora. La búsqueda monojet de ATLAS a 13 TeV (139 fb$^{-1}$; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0) excluye $M_D$ por debajo de 11,2, 8,5, 7,1, 6,4 y 5,9 TeV para $n = 2..6$ (convención de Giudice–Rattazzi–Wells, comparada aquí directamente con $M_*$). $n = 1$ requeriría una dimensión del tamaño del Sistema Solar y está excluido por las órbitas planetarias. Randall–Sundrum: $k r_c \approx 11$–$12$ hace de $\bar M_{Pl}e^{-\pi k r_c}$ un TeV; el LHC no ha visto sus gravitones de Kaluza–Klein.'
meanings:
- vectores de modos de Kaluza–Klein (momentos $\mathbf k/R$ alrededor de los círculos); sirven para comprobar las multiplicidades
- 'cuántos $\mathbf k$ cumplen $|\mathbf k|^2 = m$: la serie theta elevada a $n$, por convolución FFT'
- 'índice de capa $m$ repetido ⇒ sumado: la masa y sus imágenes; imágenes lejanas por una cola continua'
- el mismo potencial como una torre de términos de Yukawa de masa $\sqrt m/R$ (sumación de Poisson)
- campo por autograd; por el área de $S^{2+n}$ (cerca) o de $S^2\times T^n$ (lejos) da el flujo de Gauss
- mínimos cuadrados sobre $\ln(\phi/\phi_N - 1)$ justo fuera del espacio compacto; se espera $2n$ y $R$
- radio ADD para cada $n$ y cada escala fundamental $M_*$ a la vez (broadcast)
- factor de deformación de Randall–Sundrum entre la brana de Planck y la brana del TeV
labels:
  M_star: Escala fundamental $M_*$ para la tabla impresa
  krc: $k r_c$ de Randall–Sundrum
  m_max: Capas de la red sumadas, $|\mathbf k|^2 \le m_{max}$
