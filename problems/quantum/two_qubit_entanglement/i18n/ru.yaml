source_hash: e0abd4c769f3
title: Запутанность двух кубитов
summary: 'Два кубита хранятся как тензор $(2, 2)$ $\psi_{ab}$. Гейты — тензоры 4-го ранга, применяемые одним einsum: гейт Адамара на кубите 1 и затем CNOT превращают $\lvert 00\rangle$ в состояние Белла. Сингулярное разложение $\psi_{ab}$ — это разложение Шмидта, сразу дающее энтропию запутанности. Затем пара эволюционирует с гамильтонианом Изинга; частичные следы дают редуцированную матрицу плотности каждого кубита, вектор Блоха которой уходит внутрь сферы, когда кубиты запутаны.'
notes: 'Единицы $\hbar = 1$. Тензорное произведение однокубитных операторов $A\otimes B$ — тензор 4-го ранга $A_{ac}B_{bd}$ (torch.kron даёт те же числа в виде матрицы $4\times 4$ с индексом строки $2a + b$). Поскольку $\psi_{ab}$ — матрица, её SVD записывает состояние как $\sum_k s_k\lvert u_k\rangle\lvert v_k\rangle$: разложение Шмидта. Энтропия запутанности $S = -\sum s_k^2\ln s_k^2$ равна 0 для факторизованного состояния и $\ln 2$ для состояния Белла, редуцированные состояния которого максимально смешанные ($\rho = I/2$, вектор Блоха в центре). Согласованность (concurrence) $C = 2\lvert\det\psi\rvert$ меняется от 0 (факторизованное) до 1 (максимально запутанное). При гамильтониане Изинга связь $J$ создаёт и разрушает запутанность, а поперечное поле $h$ поворачивает отдельные кубиты; при $h = 0$ состояние Белла собственное, и ничего не движется.'
meanings:
- амплитуда для кубита 1 в $\lvert a\rangle$ и кубита 2 в $\lvert b\rangle$
- 'двухкубитный гейт как тензор 4-го ранга: выходные индексы $a\,b$, входные $c\,d$'
- 'суммирование по $c$ и $d$: применение гейта'
- коэффициенты Шмидта; одно ненулевое значение ⇔ факторизованное состояние
- частичный след по кубиту 2 (суммирование по $b$)
- гамильтониан Изинга из тензорных произведений, приведённый к форме (4, 4) для eigh
- вектор Блоха $\operatorname{Tr}(\rho\,\sigma_k)$ одного кубита; $\lvert\mathbf r\rvert < 1$ означает смешанное
labels:
  initial: Начальное состояние (Белла из схемы или $\lvert 00\rangle$)
  J: Изинговская связь $J$
  h: Поперечное поле $h$
  t_max: Время моделирования
