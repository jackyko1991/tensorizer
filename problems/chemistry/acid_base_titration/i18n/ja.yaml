source_hash: e3d9a69287ac
title: 酸塩基滴定曲線
summary: 強酸、弱酸、リン酸に水酸化ナトリウムを一滴ずつ加えていく。領域ごとに教科書の近似式を使い分ける代わりに、一つの電荷収支を二分法で $[\mathrm{H^+}]$ について解き、すべての酸とすべての滴下量を $(A, N)$ テンソルで一度に扱う。曲線から当量点（$d\mathrm{pH}/dV$ のピーク）、緩衝領域、化学種分率 $\alpha_j(\mathrm{pH})$ が得られる。
notes: 電荷収支は曲線上のどこでも成り立つので、滴定開始時、緩衝領域、当量点、塩基過剰のそれぞれの公式をまとめて置き換えられる。各項は pH の単調関数なので二分法は安全である：区間は必ず半分になり、根を取り逃がすことはない。強酸（pKa $\approx -6$ としてモデル化）は鋭い跳躍を示し、当量点の pH は 7 で、そこには $\mathrm{Na^+}$、$\mathrm{Cl^-}$ と水だけが残る。弱酸は高めの pH から始まり、緩衝領域をゆるやかに上昇し、当量点は 7 より上にある。共役塩基 $\mathrm{A^-}$ 自体が弱塩基だからである。当量点までの半分で $[\mathrm{HA}] = [\mathrm{A^-}]$ となるので、ヘンダーソン–ハッセルバルヒの式 $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$ から $\mathrm{pH} = \mathrm{p}K_a$ が得られる：滴定は pKa を測定する方法なのである。リン酸（pKa ≈ 2.15、7.20、12.35、25 °C での近似値）は二つの跳躍を示す。第三のプロトンは酸性が非常に弱く、0.1 M NaOH では目に見えるほど引き抜けず、その跳躍は塩基過剰の中に埋もれてしまう。化学種パネルがその理由を示す：各 $\alpha_j$ は二つの pKa の間でピークをとり、隣り合う二つはちょうど $\mathrm{pH} = \mathrm{p}K$ で等しくなる。単純化：活量ではなく濃度を用い、25 °C、空気中の CO₂ は考えない。
meanings:
- 酸 $a$、プロトン $i$；存在しないプロトンは $+\infty$（$K = 0$）で埋める
- 累積定数：pKa の累積和の $-$ 倍、$\beta_{a0} = 1$
- 酸 $V_0$ と塩基 $V_n$ を混合した後の酸とナトリウム
- 化学種分率；分母の $k$ についての和はソフトマックス正規化
- $j$ の繰り返し ⇒ 和：酸一分子あたりに放出されたプロトン数 $\bar n$
- $\mathrm{pH} = -\log_{10}h$ についての二分法、すべての酸と滴下量を一つのテンソルで
- 傾き；そのピーク（max-pool で検出）が当量点
labels:
  c_acid: 酸の濃度 $c_a$
  V0: 酸の体積 $V_0$
  c_base: NaOH の濃度 $c_b$
  V_max: NaOH の最大体積
  pKa_weak: 弱酸の pKa（酢酸 ≈ 4.76）
