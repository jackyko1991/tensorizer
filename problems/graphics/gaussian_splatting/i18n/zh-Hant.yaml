source_hash: fb9eaaef3d46
title: 3D 高斯潑濺
summary: 場景以數百個有顏色、半透明的 3D 高斯表示。每個高斯以透視映射的 Jacobian 投影到相機中，$\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$，潑濺點依深度排序並由前至後做 alpha 合成，$C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$，再由 Adam 將每個均值、尺度、旋轉、顏色與不透明度擬合到合成場景的照片。保留的測試視角用來檢查高斯學到的是 3D 形狀，而不只是訓練圖片。
notes: 真值為三個球與一個立方體，以 Lambertian 著色解析地光線投射到環繞場景兩圈的 12 台相機中（$64\times 64$ px）；位於兩圈之間、另一高度的第 13 台相機保留作測試。高斯從立方體中的隨機位置開始，呈灰色且淡薄，方向隨機。每個 Adam 步驟將一個訓練視角經上述完整流程渲染，並將 L1 照片誤差反向傳播到每個均值、對數尺度、四元數、顏色與不透明度。張量上的重點是共變異數代數：無論最佳化器怎麼做，$\Sigma = RSS^{\mathsf T}R^{\mathsf T}$ 始終是有效的（對稱正定）共變異數；而投影不是線性的，因此每個高斯都透過其局部線性化 $J$ 推送；2D 潑濺點 $\Sigma' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$ 是一串 einsum。橢圓面板在測試視角中畫出這些 $1\sigma$ 橢圓。加密（簡化版）：每 50 步（在前 70% 期間）將中心梯度最大的高斯分裂成兩份，位於 $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$，軸長縮小 1.6 倍，並重用幾乎透明的高斯（$o < 0.05$），因此 $M$ 保持不變；論文則是以視角空間梯度做複製與分裂、修剪、重設不透明度，並增長到數百萬個高斯。相較於 Kerbl et al.（SIGGRAPH 2023）的其他簡化：以常數顏色取代球諧函數（場景為 Lambertian）、以隨機初始化取代運動恢復結構點雲、只用 L1 損失而沒有 D-SSIM 項，以及在每個像素評估每個潑濺點的稠密光柵化器（真正的實作在 GPU 上將潑濺點分到 $16\times 16$ 圖塊並略過遠處的），這也是影像很小的原因。測試視角的 PSNR 略低於訓練 PSNR：從未見過的視角對高斯的約束較少。試試更少的視角（測試視角變差）、L2 損失、關閉加密，或更多高斯與步數（邊緣更銳利）。
meanings:
- 由四元數得到高斯 $m$ 的旋轉，內部已正規化，因此任意 4 個數都是有效的旋轉
- 3D 共變異數，對 $j$ 求和；對任何參數都是對稱正定，$s = e^{\log s}$
- 每個高斯中心在每台相機座標系中的位置（x 向右、y 向下、z = 深度）
- 以針孔投影將中心投影到像素座標
- $\partial\mu'_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$：投影的局部線性化
- 每個潑濺點的 2D 共變異數，對 $j, k$ 求和，其中 $JW = $ einsum('vmai,vij->vmaj')，再加上 0.3 px² 低通
- 二次型 $d^{\mathsf T}\Sigma'^{-1}d$ 以像素的 6 個單項式 $\varphi = (u^2, 2uv, v^2, u, v, 1)$ 展開：一次矩陣乘積
- 潑濺點 $m$ 覆蓋像素 $p$ 的程度；$o_m = \sigma(\text{logit})$
- 每台相機的深度順序；在大的 $(V, M, P)$ 張量出現之前，先重排小的逐高斯張量
- 透射率：經過 $m$ 前方潑濺點後剩下的光；沿 $m$ 不增
- 由前至後合成，對 $m$ 求和；穿透的光顯示白色背景 $b$
- 每步在一個隨機訓練視角上的平均絕對像素誤差；Adam 更新全部 $14M$ 個數
labels:
  n_gaussians: 高斯數 $M$
  iterations: Adam 步數
  lr: Adam 學習率（均值；其他依比例縮放）
  loss: 光度損失
  densify: 分裂加密
  n_views: 訓練視角數 $V$
  resolution: 影像大小（像素）
