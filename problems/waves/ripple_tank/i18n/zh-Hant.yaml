source_hash: 0b5328cbe1c8
title: 水波槽干涉
summary: 兩個振子在水面上同步上下振動，發出圓形漣漪。二維波動方程式以拉普拉斯作為 $3\times3$ 卷積核（conv2d）推進，阻尼邊界吸收向外傳的波，干涉圖樣穩定成靜止的節線，位於路程差為半波長奇數倍之處。
notes: 單位：網格大小 $h = 1$，波速 $c = 1$。時間上採用蛙跳法，阻尼項取中心形式，因此每步為顯式。沿著節線，來自一個波源的漣漪總是比另一個晚半個週期抵達，因此互相抵消；虛線是雙曲線 $|r_1 - r_2| = (m + \tfrac12)\lambda$，在距波源夠遠處與右側面板的暗線吻合。把兩波源分得比 $\lambda$ 更遠會增加節線數。邊界是粗略的吸收層（摩擦層），而非完美匹配層，因此仍有少量反射。右側面板顯示 $u^2$ 的移動平均；最初幾個週期是波填滿水槽時的暫態。
meanings:
- 格子 $(a, b)$ 的水面高度
- 五點拉普拉斯核，偏移 $\alpha, \beta \in \{-1, 0, 1\}$
- 重複的 $\alpha, \beta$ ⇒ 求和：核在網格上滑動
- 內部為零，在吸收邊界中平滑上升
- 兩個同相振盪的小高斯波源
- Courant 數高於 $1/\sqrt2$ 會被拒絕（此法會發散）
- 約一個週期內 $u^2$ 的移動平均：暗線為節點
labels:
  wavelength: 波長 $\lambda$
  separation: 波源間距 $d$
  courant: Courant 數 $c\,\Delta t/h$
  t_max: 模擬時間
