source_hash: 895c388f37ef
title: 핵 결합 에너지
summary: 반경험적(액체 방울) 질량 공식은 부피, 표면, 쿨롱, 비대칭, 짝짓기의 다섯 항으로 모든 원자핵의 결합 에너지를 줍니다. 브로드캐스팅으로 $(Z, N)$ 격자 전체에서 한 번에 계산하면 철과 니켈이 가장 단단히 결합된 이유와 안정성의 골짜기가 어디로 뻗어 있는지 알 수 있습니다.
notes: 부피 결합은 $A$처럼 커지지만 표면의 핵자는 이웃이 적고($-A^{2/3}$), 양성자 사이의 반발은 $Z^2/A^{1/3}$처럼 커집니다. 이 균형으로 $B/A$의 최댓값이 $A \approx 56$–$62$ 근처에 오며, 그래서 가벼운 핵의 융합과 무거운 핵의 분열이 모두 에너지를 냅니다. 비대칭 항은 원자핵을 $N = Z$ 쪽으로 끌어당기고, 쿨롱 항은 무거운 핵을 $N > Z$ 쪽으로 밉니다. 둘이 함께 휘어진 안정성의 골짜기 $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$를 만듭니다. 이 공식은 중간 및 무거운 핵에 대해 약 1 % 정확하지만, 아주 가벼운 핵(⁴He는 액체 방울보다 훨씬 강하게 결합)과 마법수에서의 껍질 효과는 놓칩니다. 기본 계수는 흔히 쓰이는 최소제곱 맞춤값이며, 계수를 바꿔 보면 어느 항이 어떤 특징을 만드는지 알 수 있습니다.
meanings:
- 열을 따라 양성자 수, 행을 따라 중성자 수
- 열과 행을 브로드캐스팅으로 더하면 표 전체가 채워짐
- 짝-짝 핵은 $+a_P/\sqrt A$, 홀-홀 핵은 $-a_P/\sqrt A$, 홀수 $A$는 0
- 핵종도 위 모든 원자핵의 결합 에너지, MeV
- 핵자당 결합 에너지(히트맵)
- 각 질량수에서 가장 강하게 결합된 동중핵(빨간 선)
- $\partial B/\partial Z = 0$에서 얻은 $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$
labels:
  a_V: 부피 $a_V$
  a_S: 표면 $a_S$
  a_C: 쿨롱 $a_C$
  a_A: 비대칭 $a_A$
  a_P: 짝짓기 $a_P$
  z_max: 격자의 최대 $Z$
