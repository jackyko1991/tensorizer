source_hash: 9576f7bf38f3
title: マルコフ連鎖と PageRank
summary: ランダムサーファーが小さな合成ウェブ上でリンクをクリックし、ときどきランダムなページへ飛ぶ。各ページにいる確率はクリックごとに一回の行列–ベクトル積で変化し、その定常分布が PageRank である。ここではそれをべき乗法、固有値分解、そして数千人のサーファーの同時シミュレーションで求める。
notes: $S$ は列確率行列なので確率ベクトルを確率ベクトルに写すが、ウェブグラフには外向きリンクのないページや、サーファーを閉じ込めるページ群がある。ぶら下がりページには一様な列を与え（サーファーがランダムなアドレスを打ち込む）、テレポート項によって $G$ のすべての成分を正にする。するとペロン–フロベニウスの定理により定常分布は一意で正であり、どこから始めても到達する。$G$ の他のすべての固有値は $S$ の固有値の $d$ 倍なので $|\lambda_2| \le d$ であり、べき乗法は少なくとも $d^k$ と同じ速さで収束する。右のパネルは、まとめて解いた減衰係数のバッチを示す。$d = 0.85$（Brin と Page、1998 が提案した値）なら、ウェブの大きさによらず 50 ステップで誤差は少なくとも $0.85^{50} \approx 3\times10^{-4}$ 倍に縮む。サーファーは同じ連鎖のモンテカルロ推定である：その割合は $1/\sqrt W$ 程度のノイズを除いて $\mathbf x_k$ に従い、時間平均をとるとべき乗法と一致する順位が得られる。ぶら下がりページの修正を外すと確率が漏れ出していくことをターミナルが示す。$d \to 1$ にすると収束が遅くなり、順位が閉じたページ群に集まっていく様子が見える。
meanings:
- ページ $j$ がページ $i$ にリンクしていれば 1：列はサーファーが離れるページ
- $i$ について和：ページ $j$ の外向きリンク数
- ランダムなリンクをクリック；ぶら下がりページ（$d_j = 0$）には一様な列 $1/N$ を与える
- 減衰係数 $d_b$ のバッチに対する Google 行列；$1 - d$ はテレポート確率
- $j$ の繰り返し ⇒ 和：すべての $d_b$ について一度にべき乗法を一ステップ
- 固有値 1 の固有ベクトルを和が 1 になるようスケーリング；$G$ は対称でないので eigh ではなく eig
- 2 番目に大きい固有値の絶対値：誤差は一ステップごとにこの倍率で縮み、$|\lambda_2| \le d$
- $W$ 人のサーファーそれぞれのページ：確率 $d$ でリンクをたどり、さもなければテレポート
labels:
  damping: 減衰係数 $d$
  pages: ページ数 $N$
  dangling: ぶら下がりページ
  walkers: ランダムサーファー数 $W$
  iterations: ステップ数
  seed: グラフのシード
