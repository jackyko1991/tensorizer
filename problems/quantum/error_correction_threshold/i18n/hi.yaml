title: देहली से नीचे क्वांटम त्रुटि सुधार
summary: 'बिट-फ़्लिप पुनरावृत्ति कोड एक तार्किक बिट को $d$ रवयुक्त क्यूबिटों में फैलाता है और उनकी समताएँ (parities) लगातार मापता रहता है। हज़ारों मोंटे कार्लो शॉट एक $(S, R, d)$ टेंसर के रूप में चलते हैं, एक सटीक न्यूनतम-भार डिकोडर स्थान–काल सिंड्रोम इतिहास पढ़ता है, और $d = 3, 5, 7, 9$ के वक्र देहली (threshold) पर एक-दूसरे को काटते हैं: इसके नीचे हर चरण $d \to d + 2$ तार्किक त्रुटि दर को एक गुणक $\Lambda > 1$ से विभाजित करता है, यही राशि Google की 2024 की देहली-से-नीचे सरफ़ेस-कोड मेमोरी के पीछे है।'
notes: 'कोड $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$ और $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$ संग्रहीत करता है; समता जाँचें $Z_jZ_{j+1}$ बताती हैं कि पड़ोसी कहाँ असहमत हैं, तार्किक मान बताए बिना। कोड-क्षमता (code-capacity) मॉडल में (एक दौर, आदर्श जाँचें) सबसे अच्छा डिकोडर बहुमत मतदान है और अनुकारित $P_L$ सटीक द्विपद पुच्छ (धराशायी) का अनुसरण करता है, जिसकी देहली ठीक $p = 1/2$ है। परिघटनात्मक (phenomenological) मॉडल में जाँचें भी गलत पढ़ती हैं, इसलिए एक सिंड्रोम पर भरोसा नहीं किया जा सकता; डिकोडर डेटा फ़्लिप और गलत पठनों की सबसे कम संख्या खोजता है जो पूरे $d$-दौर इतिहास को समझाए। यही समस्या न्यूनतम-भार पूर्ण मिलान (minimum-weight perfect matching) हल करता है; 1D में यहाँ इसे $2^d$ त्रुटि पैटर्नों पर गतिक प्रोग्रामन से सटीक हल किया गया है (इसलिए $d \le 11$)। इस मॉडल के लिए देहली $p \approx 10\%$ के पास है (बहुत बड़े $d$ के लिए लगभग 10.3 %), और जब हर कोड $d$ दौर चलाया जाता है तो छोटे-$d$ प्रतिच्छेद इसके निकट पड़ते हैं। देहली के नीचे बड़े कोड जीतते हैं, और $p$ घटने के साथ $\Lambda
  = \varepsilon_d/\varepsilon_{d+2}$ बढ़ता है (मोटे तौर पर $p_{th}/p$ की तरह); इसके ऊपर क्यूबिट जोड़ना केवल विफल होने के और स्थान जोड़ता है। शोध संदर्भ: Google Quantum AI and Collaborators, Quantum error correction below the surface code threshold, Nature 638, 920 (2025; arXiv:2408.13687, 2024) ने अपने Willow प्रोसेसर पर दूरी-3, 5 और 7 सरफ़ेस-कोड मेमोरी चलाई और $\Lambda \approx 2.1$ बताया, दूरी-7 तार्किक त्रुटि लगभग 0.14 % प्रति चक्र के साथ (अनुमानित मान)। पहले के चरण पुनरावृत्ति कोड (Nature 595, 383, 2021) और दूरी 3 को थोड़ा पीछे छोड़ने वाला दूरी-5 सरफ़ेस कोड (Nature 614, 676, 2023) थे। पुनरावृत्ति कोड बनाम सरफ़ेस कोड: पुनरावृत्ति कोड एक 1D रेखा है जो केवल बिट फ़्लिप ($X$ त्रुटियाँ) सुधारती है — किसी भी क्यूबिट पर कला फ़्लिप ($Z$) एक तार्किक त्रुटि है, इसलिए यह पूर्ण क्वांटम मेमोरी नहीं है। सरफ़ेस कोड $Z$-प्रकार और $X$-प्रकार दोनों जाँचों वाला 2D जालक है और दोनों को सुधारता है; इसका डिकोडिंग ग्राफ़ 3D है (दो स्थान आयाम और समय) और इसकी देहलियाँ कम हैं, इस परिघटनात्मक रव के लिए लगभग 3 % और
  यथार्थवादी परिपथ रव के लिए लगभग 1 % (अनुमानित)। सरलीकरण: स्वतंत्र त्रुटियाँ, आदर्श अंतिम पठन, और कोई रिसाव (leakage) या सहसंबद्ध विस्फोट नहीं, जो वास्तविक उपकरणों में तार्किक त्रुटि दर की निचली सीमा तय करते हैं।'
meanings:
- शॉट $s$, दौर $t$ के लिए डेटा फ़्लिप (प्रायिकता $p$) और गलत पढ़ी गई जाँचें (प्रायिकता $q$)
- दौर $t$ के बाद डेटा क्यूबिट $i$ पर संचित त्रुटि
- जाँच $j$ पड़ोसियों $i = j$ और $i = j + 1$ की तुलना करती है ($Z_jZ_{j+1}$)
- 'दोहराया गया $i$ ⇒ योग: वह समता जो हर जाँच को बतानी चाहिए'
- 'एक सिंड्रोम बिट जो बदला: स्थान–काल में त्रुटि शृंखला का सिरा'
- त्रुटि पैटर्न $x$ पर समाप्त होने वाला सबसे सस्ता इतिहास, $w = \ln\frac{1-p}{p}$; $y$ पर न्यूनतम $d$ एक-बिट फ़्लिप है
- 'बहुमत मतदान: इष्टतम डिकोडर जब जाँचें कभी गलत नहीं पढ़तीं'
- प्रति दौर त्रुटि दमन, $1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: रव मॉडल (गलत पढ़ी गई जाँचों के साथ या बिना)
  d_max: सबसे बड़ी दूरी $d$ (11 धीमा है)
  shots: प्रति $(d, p)$ बिंदु शॉट
  n_p: त्रुटि दरों $p$ की संख्या
  p_min: सबसे छोटा $p$
  p_max: सबसे बड़ा $p$
  q_ratio: गलत-पठन दर $q/p$
