source_hash: 5ff140d5db65
title: Suche nach selbstähnlichen Blow-up-Profilen
summary: 'So jagt man heute Singularitäten: Man schreibt $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$, macht aus der PDE eine Gleichung für das Profil $U$ mit unbekanntem Exponenten $\lambda$ und trainiert einen Stapel von Kandidatenprofilen, eines pro Probewert von $\lambda$, als einen Tensor mit Gauß–Newton. Für die reibungsfreie Burgers-Gleichung brechen die Residuentrichter nur bei den exakten Werten $\lambda = 1/(2i+2)$ ein, und die gelernten Profile stimmen mit den klassischen $y = -U - U^{2i+3}$ überein. Dieselbe Suche findet für die nichtlokale Córdoba–Córdoba–Fontelos-Gleichung deren stabilen Exponenten $\lambda \approx 1.18$.'
notes: 'Begleitstück zu fluids/navier_stokes_blowup, das das Bild von 1983 zeigt: den Taylor–Green-Wirbel vorwärts rechnen und zusehen, wie die Wirbelstärke wächst, bis das Gitter nicht mehr mitkommt. Der moderne Weg überspringt die Zeitentwicklung: Er nimmt an, dass die Singularität selbstähnlich ist, und sucht das Profil direkt. Setzt man $u = \tau^\lambda U(y)$ in $u_t + uu_x = 0$ ein, erhält man $-\lambda U + ((1+\lambda)y + U)U'' = 0$. Als lineare ODE für $y(U)$ gelöst, ergibt das $y = -U - C\,U^{1+1/\lambda}$, was nur glatt ist, wenn $1 + 1/\lambda$ eine ungerade ganze Zahl ist. Also $\lambda = 1/(2i+2)$, mit den exakten Profilen $y = -U - U^{2i+3}$ (normiert durch $U''(0) = -1$ und $U(-2) = 1$). Das sind klassische Ergebnisse (Eggers & Fontelos, Singularities, 2015). $\lambda = 1/2$ ist der stabile, generische Blow-up; $1/4, 1/6, \dots$ erfordern fein abgestimmte Daten. Hier werden 61 Kandidatenprofile gleichzeitig bei festem $\lambda$ trainiert. Das beste Residuum als Funktion von
  $\lambda$ (der Trichter) fällt bei $\lambda = 1/2$ auf Rundungsniveau ($\sim10^{-15}$) und bei $1/4$ auf $\sim10^{-11}$. Dazwischen ist es viel größer ($\sim10^{7}$-mal größer bei $\lambda = 0.37$), weil es dort nur Profile mit einem nicht glatten Term $|y|^{1+1/\lambda}$ gibt. Die Bedingung $U''''''(0) = 0$ entfernt den Trichter bei $1/2$, und die Suche findet dann $1/4$. Zusätzlich $U^{(5)}(0) = 0$ zu fordern, sollte $1/6$ herausgreifen. Bei dieser Auflösung ist der Trichter nahe $1/6$ jedoch zu flach, um ihn festzulegen: Die konkurrierenden Profile unterscheiden sich erst in der Ordnung $y^{7}$, und das flache Minimum landet bei $\lambda \approx 0.19$. Das Residuum kann stabil und instabil nicht unterscheiden: Das ist eine Eigenschaft der Zeitentwicklung, und die instabilen Profile werden hier nur über die zusätzlichen Bedingungen erreicht. Das Profil ist eine Spektralentwicklung mit den induktiven Vorannahmen der Forschung, einer kompaktifizierten Koordinate und einer Formung der Ausgabe;
  Forschungsarbeiten verwenden physikinformierte neuronale Netze (PINNs) mit denselben Vorannahmen. Gauß–Newton ist der Optimierer von Wang et al. (2025). Gradientenschritte in $\lambda$ bleiben an der Spitze jedes Trichters stecken, daher legt eine gestapelte Goldener-Schnitt-Suche $\lambda$ fest. Die CCF-Gleichung $\theta_t - (H\theta)\theta_x = 0$ (ein 1D-Modell der quasigeostrophischen Oberflächengleichung; $H$ ist die Hilbert-Transformation) wird in Wirbelform gelöst, $\omega = \theta_x = \Omega(y)/\tau$. $\Omega$ wird in $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$, entwickelt, deren Hilbert-Transformationen exakt sind. Der Standardlauf findet $\lambda \approx 1.18$ (Residuum $\sim10^{-4}$); längere Läufe mit größerer Basis pendeln sich bei $1.1808$ ein (Residuum $2\times10^{-6}$). Das stimmt mit dem Grundzustandsexponenten $\approx 1.18$ von Eggers & Fontelos (Nonlinearity, 2020) überein. Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) fanden das erste instabile CCF-Profil
  mit PINNs, $\lambda_1 \approx 0.6057$. Wang et al. (2025, arXiv 2509.14185) fanden ein zweites, $\lambda_2 \approx 0.4713$, und erreichten Residuen nahe $10^{-13}$, fast doppelte Genauigkeit. Sie fanden auch neue instabile Familien für die Gleichungen poröser Medien und die Boussinesq-Gleichungen, die numerische Kandidaten sind. Die instabilen Profile haben steile Gradienten, die diese einminütige CPU-Suche nicht auflöst; sie zeigt nur den stabilen Trichter. Status: Die Burgers-Profile sind exakte Sätze. Der Blow-up für CCF wurde von Córdoba, Córdoba & Fontelos (Annals, 2005) bewiesen. Durch neuronale Suche gefundene Profile sind numerische Kandidaten, bis ein computergestützter Beweis sie zu Sätzen macht, wie Chen & Hou (2022) es für das Hou–Luo-Szenario des axialsymmetrischen Euler mit Rand getan haben. Das Millennium-Problem der inkompressiblen 3D-Navier–Stokes-Gleichungen bleibt offen, und nichts hier berührt es direkt. Probieren Sie ein gröberes $\lambda$-Gitter oder weniger Gauß–Newton-Schritte
  und sehen Sie zu, wie die Trichter verschwimmen.'
meanings:
- 'der Stapel: ein Probeexponent pro Kandidatenprofil, alle gleichzeitig trainiert'
- 'kompaktifizierte Koordinate $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$: $r = 1$ bei $y = 0$, $r \to 0$ für $|y| \to \infty$'
- ungerade, $U'(0) = -1$ und $U \sim y^{\lambda/(1+\lambda)}$ im Fernfeld sind eingebaut; $P$ ist eine Tschebyschow-Reihe in $r$
- Residuum der Profilgleichung an den Kollokationspunkten, dazu $U(2) = -1$ und die Glattheitsbedingungen
- $R$ ist quadratisch in $c$, daher ist die Jacobi-Matrix exakt (in den Tests mit autograd geprüft)
- Levenberg–Marquardt-Schritt (gedämpftes Gauß–Newton) für jedes Mitglied des Stapels in einem gemeinsamen Lösungsschritt
- Taylor-Koeffizienten von $U = -y + c_3y^3 + c_5y^5 + \dots$; sie auf null zu setzen entfernt die Trichter bei $\lambda = 1/2$ und $1/4$
- 'exakte Hilbert-Transformation der CCF-Basis: $(1-iy)^{-s}$ ist in der oberen Halbebene analytisch'
- legt den Boden jedes Trichters fest; das Profil wird bei jedem Probewert $\lambda$ neu trainiert
labels:
  n_lambda: 'Stapelgröße: Probeexponenten $\lambda$'
  gn_steps: Gauß–Newton-Schritte pro Profil
  ccf_lambda0: CCF-Startexponent $\lambda_0$
