source_hash: e53e4d6ab9fa
title: 'Kerr–Newman 블랙홀: 사건의 지평선, 에르고 영역, 벌거숭이 특이점'
summary: 전자기학을 포함한 일반 상대성 이론에서 가장 일반적인 블랙홀로, 질량 $M$, 스핀 $a$, 전하 $Q$ 를 가집니다. 배치로 묶은 $(M, a, Q)$ 격자 전체에 대해 코드는 지평선 $r_\pm$, 에르고 영역, 틀 끌림(frame dragging), 적도면의 ISCO 와 광자 궤도를 계산합니다(계량의 도함수는 자동 미분으로 구함). 애니메이션은 스핀과 전하를 극한 조건 $a^2 + Q^2 = M^2$ 까지, 그리고 그 너머까지 훑습니다. 그곳에서는 지평선이 사라지고 고리 특이점이 드러나게 되는데, 우주 검열 가설(미증명)은 자연이 이를 금지한다고 주장합니다.
notes: '단위 $G = c = 1$: 길이는 $GM/c^2$ 단위, 스핀은 $a = J/(Mc)$, 전하는 기하화 단위. 확립된 사실(고전 일반 상대론): Kerr–Newman 계량(Newman et al. 1965)은 Einstein–Maxwell 방정식의 해이며, 그 지평선은 $\Delta$ 의 근입니다. 어떤 관측자도 정지해 있을 수 없는 에르고 영역은 $r_+$ 와 $r_E(\theta)$ 사이에 있으며 극에서 지평선과 맞닿습니다. 그 안에서는 틀 끌림 때문에 모든 것이 함께 회전할 수밖에 없습니다. 초록색 곡선은 각운동량 0 으로 떨어지지만 여전히 회전 방향으로 휩쓸립니다. 순행 궤도는 블랙홀에 바짝 붙습니다. Kerr 의 경우 ISCO 는 $a = 0$ 에서 $6M$ 이고, $a = M$ 에서는 $M$(순행)과 $9M$(역행)으로 이동하며, 이는 Bardeen, Press, Teukolsky (1972)와 일치합니다. 극한 Reissner–Nordström 블랙홀의 ISCO 는 $4M$ 입니다. $a^2 + Q^2 > M^2$ 이면 공식은 여전히 계량을 주지만 지평선이 없고, $r = 0$, $\theta = \pi/2$ 에 벌거숭이 고리 특이점이 있습니다(빨간색으로 표시). Penrose 의 약한 우주 검열 가설은 중력 붕괴가 그런 특이점을 결코 만들지 않는다고 주장합니다. 이는 일반적으로 증명되지 않았으며(알려진 반례들은 미세 조정된 초기 조건이나 여분 차원을 필요로 함), 입자를 던져 넣어 극한 블랙홀을 과회전 또는 과전하 상태로 만들려는 시도는 2차 섭동 효과까지 포함하면 실패하는 것으로 보입니다(Sorce and Wald 2017). 실제 블랙홀은 $Q \approx 0$ 이며(전하는 빠르게 중화됨), 측정된 스핀(최대 약 $0.95$–$0.99\,M$)은 극한값보다 작습니다. 적도면 패널은 Boyer–Lindquist 좌표 $r$ 를 반지름으로 사용합니다. 여기서 떨어지는 초록색 곡선의 $\varphi$ 는 $r_+$ 에서 끝없이 감기는데,
  이는 좌표 효과입니다.'
meanings:
- 질량, 스핀, 전하의 모든 조합을 하나의 배치로, $G = c = 1$
- $\Delta = 0$ 의 근; $a^2 + Q^2 > M^2$(벌거숭이 특이점)이면 NaN
- 정지 한계 $g_{tt} = 0$, 프레임 $\times$ 극각으로 브로드캐스트
- Boyer–Lindquist 계량의 회전하는 $(t, \varphi)$ 블록
- 각운동량이 0 인 관측자의 각속도; 지평선에서 $\Omega_H = a/(r_+^2 + a^2)$
- 반지름 격자 위에서 자동 미분으로 구한 계량의 도함수
- 원궤도의 각속도와 에너지; ISCO 는 $E$ 의 최솟값, 광자 궤도는 궤도에 속도 $c$ 가 필요한 곳
- 표면 중력, $T_H = \kappa/2\pi$; 극한 블랙홀에서는 0
labels:
  angle: 혼합각 $\psi$($0°$ 순수 스핀, $90°$ 순수 전하)
  chi_max: 훑기 상한 $\sqrt{a^2 + Q^2}/M$
  frames: 프레임 수
  grid: 배치 $(a, Q)$ 탐색의 축당 격자점 수
