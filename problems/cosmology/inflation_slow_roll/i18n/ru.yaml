source_hash: 157106563a38
title: Инфляция медленного скатывания и плоскость (n_s, r)
summary: 'Пять потенциалов инфлатона ($m^2\phi^2$, $\lambda\phi^4$, Старобинского $R^2$, естественная инфляция, квартичная модель «вершины холма») скатываются в одном пакетном тензоре согласно уравнениям Фридмана и Клейна–Гордона, где часами служит число e-фолдов $N = \ln a$. Параметры медленного скатывания $\epsilon$, $\eta$ и предсказания $n_s$ и $r$ при $N_* = 50$–$60$ проверяются по точному фоновому решению и сопоставляются с данными Planck 2018 и BICEP/Keck 2021: $m^2\phi^2$ и $\lambda\phi^4$ исключаются наблюдениями, модель Старобинского лежит внутри области. Инфляция — ведущее объяснение начальных условий, но она не подтверждена: первичные B-моды не обнаружены.'
notes: 'Единицы: приведённая планковская масса $M_\mathrm{pl} = 1$. Если записать уравнения с $N = \ln a$ в роли времени, $\psi = d\phi/dN$ и $\epsilon_H = \psi^2/2$, получаем $d\psi/dN = -(3-\epsilon_H)(\psi + V''/V)$ и $H^2 = V/(3-\epsilon_H)$, так что важно только $V''/V$, и каждый потенциал строится с высотой 1 (амплитуда $A_s = 2.1\times10^{-9}$ затем фиксирует энергетический масштаб, выводимый как $V_*^{1/4}$, около $10^{16}$ GeV для большинства моделей). Каждое поле стартует примерно за 68 e-фолдов до своего конца, в точке из учебного подсчёта медленного скатывания, со скоростью медленного скатывания $\psi = -V''/V$; тест запускает $m^2\phi^2$ с сильно различающимися скоростями и обнаруживает, что все они в пределах нескольких e-фолдов выходят на одну кривую: медленное скатывание — аттрактор. Инфляция заканчивается там, где $\epsilon_H = 1$. Предсказания вычисляются дважды: из потенциала в первом порядке ($n_s = 1 - 6\epsilon_V + 2\eta_V$, $r = 16\epsilon_V$, метки ×) и из параметров
  хаббловского потока $\epsilon_{1,2,3}$ численного фонового решения во втором порядке (Stewart and Lyth 1993; Schwarz, Terrero-Escalante and García 2001; точки); они различаются на $O(\epsilon^2)$, несколько $10^{-4}$ в $n_s$. Полное помодовое решение уравнения Муханова–Сасаки здесь не выполняется. Результаты при $N_* = 55$: $m^2\phi^2$ даёт $n_s \approx 1 - 2/N_*$, $r \approx 8/N_* \approx 0.14$; $\lambda\phi^4$ даёт $r \approx 0.29$ и слишком «красный» $n_s$; модель Старобинского даёт $n_s \approx 0.965$, $r \approx 12/N_*^2 \approx 0.004$; естественная инфляция ($f = 7$) даёт $r \approx 0.08$, выше предела; квартичная модель «вершины холма» ($\mu = 15$) попадает внутрь. Наблюдательная область изображена прямоугольником (Planck 2018 $n_s = 0.9649 \pm 0.0042$ на уровне 68 %, TT,TE,EE+lowE+lensing; BICEP/Keck 2021 $r_{0.05} < 0.036$ на уровне 95 %), а не опубликованными двумерными контурами, которые слегка наклонены и зависят от комбинации данных. Честный статус: инфляция объясняет плоскостность,
  проблему горизонта и почти масштабно-инвариантные, гауссовы, адиабатические флуктуации, а $n_s < 1$ было предсказано до того, как было измерено; но существуют конкурирующие идеи (модели с отскоком и экпиротические модели), инфлатон не идентифицирован, а решающее доказательство — первичная B-модовая поляризация от гравитационных волн — не обнаружено (заявление BICEP2 2014 года оказалось галактической пылью). Попробуйте $N_*$ от 50 до 60 (это зависит от того, как происходил разогрев Вселенной) или измените $f$ и $\mu$: при $N_* = 55$ естественная инфляция никогда не попадает в прямоугольник, потому что уменьшение $f$ снижает $r$, но делает $n_s$ слишком «красным» ($f = 5$: $n_s \approx 0.950$, $r \approx 0.04$).'
meanings:
- 'строка one-hot: поле $b$ использует потенциал $p$'
- пять форм потенциала, вычисленные на каждом поле
- 'повторяющийся $p$ ⇒ суммирование: собственный потенциал каждого поля'
- поле и $d\phi/dN$, продвигаемые вместе методом RK4 по e-фолдам
- 'единственное, что нужно фоновому решению: высота $V$ выпадает'
- $V'$ и $V''$ автодифференцированием
- где $\epsilon_H$ проходит через 1, т. е. $\ddot a$ меняет знак
- параметры хаббловского потока за $N_*$ e-фолдов до конца, одной операцией gather
- предсказания второго порядка из точного фонового решения
labels:
  N_star: Число e-фолдов до конца для опорного масштаба $N_*$
  f: Масштаб естественной инфляции $f$
  mu: Ширина «вершины холма» $\mu$
