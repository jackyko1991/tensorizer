title: प्रकाश-विद्युत प्रभाव और प्रकाश क्वांटा
summary: 'आइंस्टीन का 1905 का प्रकाश-क्वांटम शोधपत्र: आवृत्ति $\nu$ का प्रकाश ऊर्जा $h\nu$ के पैकेटों में आता है, और एक पैकेट एक इलेक्ट्रॉन को गतिज ऊर्जा $K = h\nu - \phi - \varepsilon$ के साथ मुक्त करता है। फ़ोटॉन × आवृत्तियाँ × तीव्रताएँ का एक बैच देहली $\nu_0 = \phi/h$, तीव्रता की परवाह न करने वाला निरोधी विभव $eV_s = h\nu - \phi$, और कोई समय-विलंब नहीं — सब कुछ शास्त्रीय तरंग-चित्र के विरुद्ध दिखाता है। मिलिकन के 1916 के सोडियम मापनों पर सरल-रेखा फ़िट प्लांक नियतांक वापस देता है।'
notes: 'यह आइंस्टीन के 1905 के चार "चमत्कारी वर्ष" शोधपत्रों में से एक है: प्रकाश क्वांटा और प्रकाश-विद्युत प्रभाव (यह समस्या; 1921 का नोबेल पुरस्कार, "विशेष रूप से प्रकाश-विद्युत प्रभाव के नियम की खोज के लिए"), ब्राउनी गति (thermodynamics: यादृच्छिक चाल और विसरण), और $E = mc^2$ सहित विशिष्ट सापेक्षता (astro: आइंस्टीन 1905: गतिमान पिंड और $E = mc^2$)। तरंग-चित्र तीन तरह से विफल होता है: वह किसी भी आवृत्ति पर उत्सर्जन, तीव्रता के साथ बढ़ती गतिज ऊर्जाएँ, और मंद प्रकाश के लिए मिनटों का विलंब देता है (एक परमाणु जो $S = 10$ mW/m² से $\phi$ एकत्र करता है) — जबकि प्रयोग एक तीखी देहली, तीव्रता से स्वतंत्र $V_s$ और कोई मापने योग्य विलंब नहीं दिखाता (3 ns से कम, लॉरेंस और बीम्स 1928)। अधिक चमकीले प्रकाश का अर्थ केवल अधिक फ़ोटॉन है, इसलिए धारा बढ़ती है पर $V_s$ नहीं खिसकता। लाल वर्ग निर्वात में काटी गई सोडियम सतह के लिए मिलिकन के 1916 के निरोधी विभव हैं (R. A. Millikan, Phys. Rev. 7, 355 (1916), पारे की चार रेखाएँ, रोस्किल्डे विश्वविद्यालय के एक प्रश्न-संग्रह में सारणीबद्ध शोधपत्र से data/millikan_1916_sodium.csv
  में उतारी गईं; 1916 का प्रकाशन, सार्वजनिक डोमेन)। मिलिकन आइंस्टीन के समीकरण का खंडन करने निकले थे और उन्होंने उसकी पुष्टि कर दी; उनका ढलान $h$ को आज के सटीक मान $6.62607015\times10^{-34}$ J s के लगभग 0.3 % भीतर देता है। अंतःखंड, लगभग 1.8 eV, स्वच्छ सोडियम का कार्य-फलन (2.3 eV) नहीं है: इसमें उपकरण का संपर्क विभव शामिल है, और सतह संभवतः दूषित थी (D. Lloyd, Am. J. Phys. 2015)। अनुकारित धातु आदर्शीकृत है (गहराइयों की एक समतल पट्टी, कोई कोण नहीं, कोई तापमान नहीं): सरल रेखा $eV_s = h\nu - \phi$ सटीक है, धारा-वक्रों का आकार केवल योजनात्मक है।'
meanings:
- प्रकाश आवृत्तियाँ $10^{14}$ Hz में
- 'फ़ोटॉन $n$ को अवशोषित करने वाले इलेक्ट्रॉन की गहराई, $[0, 3]$ eV पर एकसमान ($i$: तीव्रता)'
- 'एक ब्रॉडकास्ट: हर आवृत्ति और तीव्रता का हर फ़ोटॉन एक साथ; $K \le 0$ ⇒ कोई उत्सर्जन नहीं'
- 'निरोधी वोल्टता $V$ को पार करने वाले इलेक्ट्रॉन: प्रकाश-धारा'
- 'निरोधी विभव: सबसे तेज़ इलेक्ट्रॉन; हर तीव्रता $i$ के लिए समान'
- 'मिलिकन के बिंदुओं से होकर सरल रेखा: ढलान $a = h/e$, अंतःखंड $b = -\phi/e$'
- 'तरंग-चित्र: विकिरण-तीव्रता $S$ से एक परमाणु के क्षेत्रफल $A$ पर $\phi$ सोखने में लगने वाला समय'
labels:
  phi: कार्य-फलन $\phi$
  irradiance: विकिरण-तीव्रता $S$ (तरंग-चित्र के विलंब के लिए)
  n_photons: तीव्रता 1 पर प्रति अनावरण फ़ोटॉन
