title: 'DAG टेंसर से छाती के एक्स-रे से रिपोर्ट तक: एक CNN और एक छोटा LM जोड़े गए'
summary: 'यह एक शिक्षण खिलौना है, क्लिनिकल रिपोर्ट बनाने का साधन नहीं। एक छोटा CNN NIH के 410 छाती एक्स-रे से छह फाइंडिंग्स सीखता है, और एक छोटा अक्षर-स्तरीय GPT लिखे हुए लेबल हेडर से टेम्पलेट रिपोर्ट ("enlarged heart. pleural effusion. no pneumothorax.") सीखता है; दोनों अलग-अलग प्रशिक्षित होते हैं। एक DAG एज उन्हें जोड़ता है: एक कनेक्टर CNN की फाइंडिंग प्रायिकताओं को एक सॉफ्ट हेडर में बदलता है, ताकि LM केवल छवि से रिपोर्ट लिख सके। प्रशिक्षण प्रक्रिया स्वयं एक टेंसर DAG है (स्तरों पर नियम, max-plus क्रिटिकल पाथ, हर नियम के लिए सभी सीड्स पर एक बैच्ड कॉल); इसकी तुलना उसी कंप्यूट से एंड-टू-एंड प्रशिक्षित उसी नेटवर्क से की जाती है, फिर इसे खुले लाइसेंस (CC BY) वाले PubMed Central लेखों के 251 असली पाठों (चित्र कैप्शन + उस रेडियोग्राफ़ का हवाला देने वाले वाक्य) पर फ़ाइन-ट्यून किया जाता है। इतने कम जोड़ों के साथ, जैसी अपेक्षा थी, चरण 2 कमज़ोर है, और यह पेज यह बात साफ़ कहता है।'
notes: 'यह क्या है। एक शिक्षण खिलौना, क्लिनिकल रिपोर्ट बनाने का साधन नहीं: छोटे मॉडल, 64×64 छवियाँ, कुछ सौ शोरयुक्त लेबल, और कोई असली रेडियोलॉजी रिपोर्ट नहीं। यहाँ कुछ भी क्लिनिकल सटीकता के बारे में कुछ नहीं कहता। विचार (नेटवर्क अलग-अलग प्रशिक्षित, एक DAG टेंसर से जुड़े, वैश्विक रूप से अनुकूलित, और पूरी प्रक्रिया स्वयं DAG टेंसर द्वारा नियंत्रित) Jacky Ka Long Ko का है; यह समस्या इस शृंखला की पिछली समस्या के CNN + छोटे LM को जोड़ने के तरीके को छाती के रेडियोग्राफ़ और ऐसे पाठ पर ले आती है जो एक (बहुत छोटी) रिपोर्ट जैसा पढ़ा जाता है। असली रिपोर्ट क्यों नहीं। खुले तौर पर उपलब्ध रिपोर्ट संग्रहों में से कोई भी यहाँ प्रयुक्त लाइसेंस नियम (खुला, पुनर्वितरण योग्य, व्यावसायिक उपयोग की अनुमति) पर खरा नहीं उतरता: IU X-ray / OpenI (Demner-Fushman et al. 2016) CC BY-NC-ND है; MIMIC-CXR (Johnson et al. 2019), VinDr-CXR और BRAX के लिए डेटा उपयोग समझौतों के तहत प्रमाणित पहुँच चाहिए; CheXpert और PadChest केवल शोध उपयोग के लिए हैं। इसलिए चरण 1 NIH लेबल सेटों से कोड में बनाई गई टेम्पलेट रिपोर्टों का उपयोग
  करता है, जो इसे पाठ के रूप में व्यक्त मल्टी-लेबल वर्गीकरण बना देता है, और चरण 2 CC BY PubMed Central लेखों से चित्र कैप्शन और उस चित्र का हवाला देने वाले वाक्यों का उपयोग करता है: केस रिपोर्टों के लिए लिखे गए छोटे, विषम पाठ, जो अक्सर तीरों और पैनलों की ओर इशारा करते हैं। क्या नया है और क्या नहीं। छाती के एक्स-रे से रिपोर्ट बनाना एक सक्रिय क्षेत्र है (Jing et al. 2018, Chen et al. 2020 का R2Gen); एक पूर्व-प्रशिक्षित इमेज एनकोडर को एक छोटे सीखे गए कनेक्टर से भाषा मॉडल से जोड़ना ही वह तरीका है जिससे LLaVA (Liu et al. 2023) और BLIP-2 (Li et al. 2023) बने हैं। यह समस्या ऑर्केस्ट्रेशन जोड़ती है: मॉडल ग्राफ़ और प्रशिक्षण प्रक्रिया दोनों Circle of Willis वर्कफ़्लो समस्या के टेंसर DAG इंजन से चलते हैं (data/training.smk से पार्स किया गया नियम ग्राफ़, क्रोनेकर जॉब ग्राफ़, बूलियन स्तर, max-plus क्रिटिकल पाथ), हर नियम सभी सीड्स पर एक बैच्ड कॉल है, और DAG से बने मॉडल को उसी कंप्यूट वाले एक मोनोलिथ से मापा जाता है। डेटा। NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center; श्रेय देने की शर्त पर
  उपयोग पर कोई प्रतिबंध नहीं): 549 सामने की PA छवियाँ, प्रति रोगी एक, छह फाइंडिंग्स (कार्डियोमेगाली, इफ़्यूज़न, इनफ़िल्ट्रेशन, एटेलेक्टेसिस, न्यूमोथोरैक्स, मास या नोड्यूल) या कोई नहीं, प्रति छवि अधिकतम दो; 410 प्रशिक्षण, 139 परीक्षण। लेबल NLP द्वारा रिपोर्टों से निकाले गए थे और शोरयुक्त हैं (लगभग 10 % या अधिक गलत)। PMC: 316 ओपन-एक्सेस लेखों से छाती के रेडियोग्राफ़ के 316 चित्र, हर एक CC BY (लेख के अपने XML लाइसेंस में जाँचा गया; नियम: CC BY, CC BY-SA या CC0, NC, ND, अन्य या अनुपस्थित को अस्वीकार)। उम्मीदवार ROCOv2 मेटाडेटा (Rückert et al. 2024) से आए, जिसे केवल PMCIDs के सूचकांक के रूप में प्रयोग किया गया; ROCOv2 का कुछ भी बंडल में शामिल नहीं है। जाँचे गए 2114 लेखों में से 1575 स्वीकार हुए और 539 लाइसेंस के कारण अस्वीकृत हुए (सभी CC BY-NC)। चरण 2 का पाठ कैप्शन है जिसके बाद उसी लेख के वे वाक्य आते हैं जो चित्र का हवाला देते हैं (316 में से 315 लेखों में कम से कम एक है), केवल पूरे वाक्य, अधिकतम 360 अक्षर, जो छोटे LM का संदर्भ है: माध्यिका 35 शब्द (IQR 26–45), जबकि केवल कैप्शन के लिए 12 (8–18)।
  हर चित्र और पाठ का श्रेय data/ATTRIBUTION.csv में दिया गया है; data/SOURCES.md में स्रोत, शर्तें, गिनतियाँ, चेकसम और प्रसंस्करण हैं। मॉडल और प्रशिक्षण DAG। CNN: तीन ग्रुप्ड कन्वोल्यूशन, 41 014 भार, छह सिग्मॉइड आउटपुट (मल्टी-लेबल, पॉज़िटिव उनकी दुर्लभता के अनुसार भारित)। LM: दो-परत वाला अक्षर-स्तरीय GPT (d = 32, चार हेड, 40 108 भार), हर टेम्पलेट पर प्रशिक्षित, जिसमें लेबल हेडर आगे छह अक्षरों के रूप में लिखा होता है ("ce----", फिर "enlarged heart. pleural effusion.")। कनेक्टर (2848 भार): छह प्रायिकताओं $q$ और एक स्लॉट वेक्टर $S_t$ से यह $K = 6$ सॉफ्ट टोकन बनाता है जो हेडर की जगह लेते हैं। स्तर: 0 train_cnn ∥ train_lm ∥ train_monolith; 1 train_connector (CNN और LM फ़्रीज़); 2 global_finetune ∥ train_router; 3 caption_finetune (PMC पाठों पर कनेक्टर + LM, CNN फ़्रीज़); 4 evaluate। परीक्षण जाँचते हैं: स्तर और क्रिटिकल पाथ, कि जॉब ग्राफ़ निलपोटेंट है, कि एक स्टैक में दो सीड्स ठीक वैसे ही प्रशिक्षित होते हैं जैसे प्रत्येक अकेले (float32 राउंडिंग तक), कि एक मॉडल का लॉस दूसरों को कोई ग्रेडिएंट नहीं
  भेजता, कि कनेक्टर चरण केवल कनेक्टर को बदलता है, और कि स्थिर राउटर वाली MoE परत 1e-6 तक DAG वायरिंग के बराबर है, ग्रेडिएंट भी। रिपोर्टें ग्रीडी तरीके से लिखी जाती हैं (की/वैल्यू कैश के साथ, जिसे सामान्य फ़ॉरवर्ड पास से जाँचा गया है) और कीवर्ड द्वारा वापस लेबलों में पार्स की जाती हैं, निषेध ("no pneumothorax.") सहित। चरण 1 के परिणाम (2 सीड्स, 139 परीक्षण छवियाँ, सीड औसत; हर संख्या results/stages.csv में है)। अकेला CNN: औसत AUROC 0.62 (संयोग 0.5), थ्रेशोल्ड 0.5 पर micro F1 0.31 (प्रशिक्षण प्रसार पर यादृच्छिक अनुमान: 0.16)। उसके लेबल अकेले LM के लिए हेडर के रूप में लिखे गए: micro F1 0.32, यानी LM लेबलों को निष्ठापूर्वक पाठ में बदलता है (उसके 0.90 आउटपुट सही रूप वाले टेम्पलेट हैं, उन लेबल सेटों के लिए भी जिन्हें उसने कभी नहीं देखा)। जोड़ा गया मॉडल: कनेक्टर चरण के बाद micro F1 0.22 और वैश्विक फ़ाइन-ट्यून के बाद 0.20 (रन और सीड्स पर 0.15 से 0.25), हर रिपोर्ट सही रूप वाला टेम्पलेट, 0.26 से 0.27 बिल्कुल सही लेबलों का टेम्पलेट। मोनोलिथ, यानी वही नेटवर्क जो 410 छवि–रिपोर्ट जोड़ों पर उतने ही गुणा-जोड़
  (405 संयुक्त चरण) से एंड-टू-एंड प्रशिक्षित हुआ, हर छवि के लिए "clear lungs." या "normal chest." लिखता है: micro F1 0, सटीक मिलान 0.27 (सामान्य छवियों का अनुपात)। तो DAG पाइपलाइन मोनोलिथ को स्पष्ट रूप से हराती है, क्योंकि वह CNN के लेबल पर्यवेक्षण और सारे टेम्पलेट पाठ का पुन: उपयोग करती है, लेकिन अकेले CNN को नहीं हराती: टेम्पलेट रिपोर्ट केवल वही दोबारा कह सकती है जो वर्गीकारक जानता है, और संभाविता से प्रशिक्षित जोड़ा गया मॉडल सबसे संभावित रिपोर्ट लिखता है, जो छवि अस्पष्ट होने पर "सामान्य" की ओर झुकती है, जबकि CNN का दुर्लभता-भारित थ्रेशोल्ड रिकॉल को तरजीह देता है, जिसे $F_1$ पुरस्कृत करता है। फ़ाइन-ट्यून से बहुत कम बदलता है। DAG एज = MoE डिस्पैच। इनपुट परत को विशेषज्ञों का मिश्रण (छवि विशेषज्ञ = CNN + कनेक्टर, पाठ विशेषज्ञ = टोकन एम्बेडिंग) मानकर और $G$ को डेटा प्रकार के अनुसार वन-हॉट रखकर ठीक DAG-वायर्ड आउटपुट मिलते हैं (परीक्षित)। एक रैखिक राउटर, जिसे विशेषज्ञों को फ़्रीज़ रखकर सघन मिश्रण के रूप में प्रशिक्षित किया गया और फिर top-1 (पहले रूट, फिर चुने गए विशेषज्ञ को चलाना) के रूप में
  प्रयोग किया गया, हर स्थिति को उसकी मोडैलिटी के विशेषज्ञ के पास भेजता है (दोनों सीड्स में राउटिंग सटीकता 1.00), इसलिए उसकी रिपोर्टें और स्कोर स्थिर राउटर के बराबर हैं। चरण 2 के परिणाम (65 अलग रखे गए PMC चित्र): कमज़ोर, जैसी अपेक्षा थी। 251 पाठों पर 150 चरणों के बाद मॉडल "chest x-ray showing" लिखता है और फिर अक्षरों की खिचड़ी: BLEU-1 0.05, ROUGE-L 0.06, फाइंडिंग-कीवर्ड रिकॉल 0, अलग रखे डेटा पर क्रॉस-एंट्रॉपी 2.32 nats प्रति अक्षर। इसे किसी दूसरे चित्र की छवि देने से कुछ नहीं बदलता (2.32 nats, वही स्कोर): छवि का उपयोग ही नहीं होता। एक अंधा बेसलाइन जो एक निश्चित प्रशिक्षण पाठ लौटाता है, अधिक स्कोर करता है (BLEU-1 0.17, ROUGE-L 0.22)। 40 000 भारों वाला अक्षर-स्तरीय LM CPU पर एक मिनट में लगभग 70 000 अक्षरों से यह भाषा नहीं सीख सकता; पिछले संस्करण के पहले उपवाक्य वाले कैप्शनों (माध्यिका 6 शब्द) के साथ ROUGE-L लगभग 0.28 था, लेकिन वे पाठ मुश्किल से वाक्य थे। DAG तंत्र काम करता है; चरण 2 के लिए डेटा बहुत ही कम है। समय। 6-कोर डेस्कटॉप CPU पर, मशीन खाली होने पर, प्रशिक्षण में लगभग 85 s लगते हैं, साथ
  में GIF के लिए लगभग 30 s; जब अन्य भारी काम मशीन साझा करते हैं तो मापे गए समय दो से तीन गुना बढ़ जाते हैं (GIF और timings.csv में दिखाया गया रन ऐसे ही भार में किया गया था, इसलिए उसके सेकंड अधिक हैं), और सबसे अधिक प्रभाव कैप्शन चरण पर पड़ता है। प्रति नियम एक वर्कर के साथ max-plus क्रिटिकल पाथ है CNN → कनेक्टर → फ़ाइन-ट्यून → कैप्शन → evaluate। जब torch को GPU दिखता है तो कोड उसे चुनता है (pixi run -e cuda); डिफ़ॉल्ट वातावरण में torch का CPU बिल्ड है, इसलिए बंडल की गई हर संख्या CPU से है। आज़माएँ। अधिक कैप्शन चरण (चरण 2 धीरे-धीरे सुधरता है), कोई वैश्विक फ़ाइन-ट्यून नहीं (0 चरण), कम CNN चरण (CNN हर चीज़ की सीमा तय करता है), या एक सीड, यह देखने के लिए कि सीड्स आपस में कितना असहमत हैं।'
meanings:
- नियम $s$ वह पढ़ता है जो नियम $r$ लिखता है; Circle of Willis समस्या के पार्सर से data/training.smk से पार्स की गई प्रशिक्षण प्रक्रिया
- 'हर नियम का स्तर: CNN, LM और मोनोलिथ 0 पर, कनेक्टर 1 पर, फ़ाइन-ट्यून और राउटर 2 पर, कैप्शन 3 पर, evaluate 4 पर'
- मापी गई नियम अवधियों से max-plus समाप्ति समय; $\max t$ क्रिटिकल पाथ है
- हर छवि के लिए CNN की छह फाइंडिंग प्रायिकताएँ (सिग्मॉइड, मल्टी-लेबल); मॉडल अक्ष $m$ हर परत में एक ग्रुप्ड कन्वोल्यूशन के समूह बन जाता है
- 'DAG एज: फाइंडिंग प्रायिकताएँ और एक स्लॉट वेक्टर $S_t$ → एक LM इनपुट वेक्टर; $K = 6$ सॉफ्ट टोकन लिखे हुए लेबल हेडर की जगह लेते हैं'
- 'राउटर: डेटा प्रकार के अनुसार वन-हॉट (हेडर स्लॉट या अक्षर), या स्थिति विशेषताओं पर एक सीखा गया softmax (सघन रूप से प्रशिक्षित, top-1 के रूप में प्रयुक्त)'
- 'दोहराया गया $x$ ⇒ योग: MoE परत का संयोजन; हर विशेषज्ञ $Y^x$ केवल अपने डिस्पैच किए गए समूह पर गणना किया जाता है'
- छोटे GPT के अगले-अक्षर लॉजिट्स (मॉडल अक्ष के साथ einsum अटेंशन, chain_of_thought से)
- हेडर के बाद रिपोर्ट के अक्षरों पर प्रति-मॉडल लॉस (nats); $M$ लॉसों का योग हर मॉडल को उसका अपना ग्रेडिएंट देता है
- 'दोहराया गया $n$ ⇒ योग: हर लिखी गई रिपोर्ट से वापस पार्स किए गए लेबलों के ट्रू पॉज़िटिव; micro $F_1$ उन्हें $f$ पर एकत्र करता है'
