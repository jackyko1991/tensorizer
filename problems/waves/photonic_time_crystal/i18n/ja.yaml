source_hash: 60f8bd39a854
title: フォトニック時間結晶と時間反射
summary: 誘電率 $\varepsilon(t)$ が空間的には一様で時間的に変化する媒質中の光。$\varepsilon$ の急なジャンプは、パルスを新しい周波数の前進波と時間反射された後退波に分ける。周期的な変調は運動量 $k$ にバンドギャップを開き、その内部では波が指数関数的に成長する。各フーリエモードは独立な $2\times 2$ 問題なので、すべての $k$ を一つのバッチとして解き、フロケバンドは一回のバッチ化した eigvals 呼び出しから得られる。
notes: 空間と時間の役割を入れ替えると、おなじみの光学が裏返しになる。空間の通常の界面では周波数が保存され波数が変わる。時間的界面、すなわち媒質全体が一斉に $\varepsilon_1$ から $\varepsilon_2$ に切り替わる場合には、波数 $k$ が保存され周波数がジャンプし、$\omega_2 = \omega_1 n_1/n_2$ となる。電荷も電流も現れないので、（$E$ と $H$ ではなく）$D$ と $B$ が連続のまま保たれ、これから時間的フレネル係数 $D_f = \tfrac12(1 + n_2/n_1)$ と $D_b = \tfrac12(1 - n_2/n_1)$ が得られる（Morgenthaler, 1958）：パルスの一部は向きを変えて逆向きに進む、これが時間反射である。媒質の切り替えが場に仕事をするので、エネルギーは保存されない。時間反射と広帯域の周波数変換は、時間的に切り替えた伝送線路メタマテリアル中のマイクロ波で観測された（Moussa et al., Nature Physics 2023）。周期的変調 $\varepsilon(t) = \varepsilon_0(1 + \alpha\cos\Omega t)$ は各モードをパラメトリック振動子 $\ddot D_k + (k^2/\varepsilon)D_k = 0$（マシュー型の方程式）にする。$k/n_0 = \Omega/2$ の近くでは前進波と後退波が共鳴的に結合する：準周波数は $\Omega/2$ にロックされて虚部をもち、（周波数ではなく）運動量のバンドギャップが生じる。その端は $k \approx \tfrac{n_0\Omega}{2}(1 \mp \alpha/4)$、最大成長率は $\alpha$ の 1 次で $\approx \alpha\Omega/8$ である。$k \approx n_0\Omega$ にははるかに狭い第 2 のギャップが $\alpha^2$ の次数で現れる。アニメーションでは、パルススペクトルのうちギャップ内の部分だけが成長する。これがフォトニック時間結晶の背後にある考え方である（Galiffi et al., "Photonics of time-varying media", Advanced Photonics
  2022 によるレビュー）。光周波数では必要な変調の深さと速さを実現するのが非常に難しいため、これまでの実験は主にマイクロ波とラジオ波の周波数で行われている。単純化：損失も分散もない 1 次元媒質、$\mu = 1$、瞬間的なジャンプ、外部から課される変調（成長のエネルギーはポンプから来る）。
meanings:
- フーリエ振幅。媒質は $x$ について一様なので $k$ は保存され、各モードは独立に発展する
- 波数ごとに一つの $2\times 2$ 生成子
- $b$ の繰り返し ⇒ 和。同じ行でモノドロミー行列 $(K, 2, 2)$ も発展させる
- $D$ と $B$ の連続性から得る前進／後退振幅 $\tfrac12(1 \pm n_2/n_1)$
- 単位行列に RK4 を適用して得る 1 周期分の伝播行列
- すべての $k$ についてのフロケ乗数を一回のバッチ呼び出しで。$\det M = 1$ なので $\lambda_+\lambda_- = 1$
- 準周波数：バンド内では実数、運動量ギャップ内では $\operatorname{Im}\omega > 0$（成長）
labels:
  eps2: ジャンプ後の誘電率 $\varepsilon_2$
  alpha: 変調の深さ $\alpha$
  omega: 変調周波数 $\Omega$
  t_max: シミュレーション時間
