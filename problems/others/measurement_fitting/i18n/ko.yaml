source_hash: 2ae828bc3a14
title: 텐서로 실험 측정값 피팅하기
summary: 감쇠 진동자의 (합성) 실험실 측정값을 각 점의 오차 막대 $\sigma_i$ 와 함께 최대 가능도로 피팅합니다. 측정 모델에는 명시적인 오차 항 $\varepsilon_i$ 가 있고, 그 퍼짐에는 미지의 추가 산포 $s$ 가 포함됩니다. autograd가 $-2\ln L$ 을 최소화하고, 야코비 행렬과 헤세 행렬이 매개변수의 불확도를 주며, 선형 부분 문제는 최소제곱법을 한 번의 lstsq 풀이로 보여 줍니다.
notes: '측정값은 결코 모델과 정확히 같지 않습니다: $x_i = f(t_i;\theta) + \varepsilon_i$, 그리고 통계가 다루는 것은 바로 오차 항 $\varepsilon_i$ 입니다. 표시된 오차 막대가 전부라면 $\varepsilon_i \sim N(0, \sigma_i^2)$ 이고, 가능도를 최대화하는 것은 $\chi^2 = \sum_i ((x_i - f_i)/\sigma_i)^2$ 를 최소화하는 것(가중 최소제곱법)과 같습니다. 실제 실험은 오차 막대가 말하는 것보다 더 많이 흩어지는 경우가 많으므로(진동, 모델에 없는 표류), 여기서는 퍼짐을 $\sigma_{tot,i}^2 = \sigma_i^2 + s^2$ 로 두고 미지의 추가 산포(지터) $s$ 를 다섯 개의 물리 매개변수와 함께 피팅합니다. $-2\ln L$ 안의 $\ln 2\pi\sigma_{tot,i}^2$ 항은 피팅이 거대한 $s$ 로 모든 것을 설명해 버리는 것을 막습니다. measurements.csv 의 데이터는 합성이며, 0.5–1 mm 오차 막대 위에 $s = 0.8$ mm 를 더해 생성했습니다. $\chi^2$ 만으로 피팅하면 $\chi^2/\mathrm{dof} \approx 2.5$ 로 끝나는데, 이는 오차가 과소평가된 신호입니다. 반면 $s$ 를 피팅하면 정규화 잔차 $r_i = (x_i - f_i)/\sigma_{tot,i}$ 가 $N(0,1)$ 을 따르고 $\chi^2/\mathrm{dof} \approx 1$ 이 됩니다. autograd는 Adam(애니메이션의 반복)과 L-BFGS(마지막 다듬기)에 $-2\ln L$ 의 기울기를 제공합니다. 불확도는 최솟값에서 $-2\ln L$ 의 곡률로부터 나옵니다: 야코비 행렬 $J_{ip} = \partial r_i/\partial\theta_p$ 를 쓴 $C = (J^TJ)^{-1}$, 또는 $s$ 를 포함할 때는 전체 헤세 행렬을 쓴 $C = 2H^{-1}$ 입니다. 선형 대 비선형 최소제곱: $\gamma$
  와 $\omega$ 를 고정하면 모델은 $(A\cos\varphi, A\sin\varphi, c)$ 에 대해 선형이므로 최적값은 한 번의 lstsq 풀이로 나옵니다(반복 없음, 유일한 답). 초기 추정은 이렇게 $\omega_0, \gamma_0$ 로부터 만들어집니다. $\gamma$ 와 $\omega$ 는 비선형으로 들어가므로 반복 탐색이 필요하고, 국소 최솟값에 갇힐 수 있습니다. 나쁜 $\omega_0$ (피팅이 틀린 진동수에 고정될 수 있음), 큰 학습률을 시도하거나 지터를 꺼 보세요. 단순화: 독립적인 가우스 오차, $t$ 에는 오차 없음, 공분산은 국소 곡률만으로 계산.'
meanings:
- 점 $i$ 의 시간, 측정 위치, 표시된 오차 막대; measurements.csv 에서 읽음
- $(A, \gamma, \omega, \varphi, c, \ln s)$; $\ln s$ 를 피팅하면 지터 $s$ 가 양수로 유지됨
- 모든 측정 시각에서의 감쇠 진동자 모델
- '오차 항 $\varepsilon_i$ 의 퍼짐: 오차 막대와 추가 산포를 제곱합으로 더함'
- 반복된 $i$ ⇒ 합산; $s = 0$ 이면 $\chi^2$ 에 상수를 더한 것
- 각 정규화 잔차가 각 매개변수에 따라 어떻게 변하는지
- '가우스–뉴턴 공분산 $C$: 불확도 $\sqrt{C_{pp}}$ ($i$ 에 대해 합산)'
- $\ln s$ 를 포함한 공분산, $-2\ln L$ 의 헤세 행렬로부터
- $\gamma, \omega$ 를 고정하면 모델은 $\beta = (A\cos\varphi, A\sin\varphi, c)$ 에 대해 선형
labels:
  omega0: 초기 추정 $\omega_0$
  gamma0: 초기 추정 $\gamma_0$
  lr: Adam 학습률
  iterations: Adam 반복 횟수
  jitter: 추가 산포 $s$ 피팅
