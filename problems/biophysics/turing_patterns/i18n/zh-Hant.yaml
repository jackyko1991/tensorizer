source_hash: 302fe326211e
title: 圖靈斑圖：Gray–Scott 反應擴散
summary: 兩種以不同速度反應與擴散的化學物質，可以把幾乎均勻的混合物變成斑點、條紋與迷宮，這是圖靈在 1952 年對動物毛皮花紋及其他生物圖樣形成方式的構想。在週期性網格上以 5 點拉普拉斯模板，於單一 $(2, B, n, n)$ 張量中同時求解四組 $(F, k)$ 的 Gray–Scott 模型，並以線性穩定性分析（色散關係 $\lambda(q)$）顯示真正的圖靈不穩定性出現在哪裡。
notes: 圖靈的洞見是：通常會把一切抹平的擴散，在自催化物（此處為 $v$）擴散得比限制它的物質（$u$）更慢時，反而可能使均勻狀態失穩：$v$ 的一個小凸起藉由消耗 $u$ 而在局部成長，而其周圍 $u$ 的耗竭阻止鄰近區域成長，即短程活化、長程抑制。線性穩定性讓這一點變得精確。均勻狀態上的波 $e^{i\mathbf q\cdot\mathbf x + \lambda t}$ 以 $J - q^2\,\mathrm{diag}(D_u, D_v)$ 的特徵值成長；若 $\lambda(0) < 0$ 但對一段 $q$ 有 $\lambda(q) > 0$，則成長最快的波長 $2\pi/q_{\max}$ 會從微小雜訊中浮現。當 $D_u = D_v$ 時每個特徵值只平移 $-Dq^2$，因此不可能出現圖靈不穩定性：把擴散比設為 1，圖上的藍色區域就會消失。在 Gray–Scott 中，這裡只有「Turing」這一組屬於此類，它從均勻狀態加上 1 % 雜訊出發；虛線檢驗振幅起初是否以 $e^{\lambda_{\max} t}$ 成長。著名的斑點、條紋與迷宮（Pearson 1993）大多位於唯一均勻狀態為 $u = 1$、$v = 0$ 的區域，該狀態對任何小擾動都穩定；這些圖樣需要有限大小的種子（幾個 $v$ 的方塊），屬於非線性、會自我複製的結構，而非線性圖靈不穩定性。5 點模板看到的波是 $q^2 \to (4/h^2)\sin^2(qh/2)$，對跨越許多格子的波長而言接近 $q^2$。真實的生物例子包括肢體中指頭的間距、毛囊間距以及魚皮條紋，其中的活化子與抑制子是訊號蛋白。
meanings:
- 第 $b$ 組的進料率與移除率；結尾的 1 將其廣播到整個網格
- 每組在格子 $(i, j)$ 中的受質與自催化物濃度，堆疊成形狀為 $(2, B, n, n)$ 的 $y$
- 四個鄰居減去四倍中心，以 torch.roll 處理週期性邊界
- 自催化步驟 $U + 2V \to 3V$、進料與移除
- 顯式歐拉法，$\Delta t = 1$，在 $D\,\Delta t / h^2 < 1/4$ 時穩定
- $(1, 0)$ 恆存在；當 $F \ge 4(F + k)^2$ 時另有兩個
- 均勻狀態下的線性化動力學 $\partial R_\alpha / \partial c_\beta$
- 對一批 $Q$ 個波數，$M(q)$ 的最大 $\operatorname{Re}$ 特徵值
- $\lambda(0) < 0$ 但在一段頻帶內 $\lambda(q) > 0$ 的狀態：圖靈不穩定性
labels:
  grid: 網格大小 $n$
  steps: 時間步數
  ratio: 擴散比 $D_v / D_u$
