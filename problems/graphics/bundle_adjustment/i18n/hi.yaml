source_hash: a99f4b65ce2b
title: 'बंडल एडजस्टमेंट (bundle adjustment): Levenberg–Marquardt द्वारा गति से संरचना'
summary: कई कैमरे पिक्सेल शोर के साथ एक ही 3D बिंदुओं की तस्वीरें लेते हैं। मोटे अनुमानित पोज़ (अक्ष-कोण घूर्णन $\boldsymbol\omega_c$, स्थानांतरण $\mathbf t_c$) और मोटे अनुमानित बिंदुओं $\mathbf X_p$ से शुरू करके, बंडल एडजस्टमेंट Levenberg–Marquardt द्वारा कुल पुनःप्रक्षेपण त्रुटि $\tfrac12\sum_{c,p}\lVert\pi(R_c\mathbf X_p + \mathbf t_c) - \tilde{\mathbf u}_{cp}\rVert^2$ को न्यूनतम करता है। जैकोबियन autograd से आता है, सामान्य समीकरण $J^{\mathsf T}J\,\Delta = -J^{\mathsf T}\mathbf r$ शूर पूरक (Schur complement) के माध्यम से हल किए जाते हैं, और 7 गेज स्वतंत्रताओं को स्थिर करने से हल अद्वितीय हो जाता है।
notes: 'डेटा कृत्रिम है: त्रिज्या 1 की गेंद में बिंदु, 5 इकाई दूर एक चाप पर कैमरे (फ़ोकस दूरी 1000 px, $640\times 640$ छवि), हर बिंदु हर कैमरे को दिखता है, गॉसियन पिक्सेल शोर $\sigma$। प्रारंभ में हर घूर्णन को कुछ डिग्री और हर स्थानांतरण व बिंदु को दृश्य के आकार के एक अंश से विचलित किया जाता है, इसलिए पहली पुनःप्रक्षेपण त्रुटियाँ दसियों पिक्सेल की होती हैं। गेज स्वतंत्रता: पूरे दृश्य को सभी कैमरों समेत एक साथ खिसकाने, घुमाने या स्केल करने से कोई छवि नहीं बदलती, इसलिए $E$ में बराबर न्यूनतमों की एक 7-विमीय घाटी होती है और $J^{\mathsf T}J$ के 7 शून्य आइगेनमान होते हैं (कंसोल उन्हें छापता है, सबसे बड़े के लगभग $10^{-16}$)। कैमरा 0 (6 संख्याएँ) और कैमरा 1 का $x$-स्थानांतरण (स्केल) स्थिर करने से शून्य-स्पेस हट जाता है: $J^{\mathsf T}J$ पूर्ण रैंक हो जाता है और कदम सुपरिभाषित होते हैं। हम इन्हें उनके सही मानों पर स्थिर करते हैं, ताकि परिणाम की सीधे सत्य से तुलना की जा सके। हर पुनरावृत्ति अवशेषों को रैखिक बनाती है, $\mathbf r(\boldsymbol\theta + \Delta) \approx \mathbf r + J\Delta$, और अवमंदित सामान्य
  समीकरण हल करती है; जैकोबियन torch.func.jacrev से बनता है, यानी सभी अवशेषों पर सदिशीकृत autograd, जो त्रुटि-प्रवण हाथ से व्युत्पत्ति को हटा देता है। शूर पूरक विरलता का लाभ उठाता है (तीर-आकार का $J^{\mathsf T}J$ पैनल): पहले बिंदुओं को हटाने से केवल कैमरों के आकार का तंत्र बचता है, इसी कारण असली बंडल एडजस्टर लाखों बिंदु संभाल लेते हैं। यहाँ सघन और शूर हल लगभग $10^{-12}$ तक एक ही कदम देते हैं। इष्टतम पर RMS पुनःप्रक्षेपण त्रुटि शोर तल $\sigma\sqrt{1 - n/m}$ के बराबर होती है (हर फ़िट किया गया अज्ञात थोड़ा शोर सोख लेता है) और अवशेष हिस्टोग्राम शोर वितरण से मेल खाता है: समझाने को कुछ नहीं बचता। बची हुई बिंदु और कैमरा त्रुटियाँ शोर और ज्यामिति से तय होती हैं, ऑप्टिमाइज़र से नहीं। संदर्भ: B. Triggs, P. McLauchlan, R. Hartley और A. Fitzgibbon, "Bundle Adjustment — A Modern Synthesis" (Vision Algorithms: Theory and Practice, 1999)। सरलीकरण: कोई बाह्य मान (outliers) नहीं (असली प्रणालियाँ मज़बूत हानि फलन उपयोग करती हैं), कोई लेंस विरूपण नहीं, सभी बिंदु सभी कैमरों में दिखते हैं, सघन जैकोबियन भंडारण।
  बड़ा प्रारंभिक विचलन आज़माएँ (तब LM को अधिक अवमंदन चाहिए, या वह गलत न्यूनतम में गिर जाता है), अधिक शोर, या केवल 2 कैमरे।'
meanings:
- 'कैमरा पोज़: अक्ष-कोण घूर्णन (दिशा = अक्ष, लंबाई = कोण) और स्थानांतरण, इसलिए $x_{\rm cam} = R\mathbf X + \mathbf t$'
- Rodrigues सूत्र $I + \sin\theta\,K + (1-\cos\theta)K^2$; प्रति घूर्णन तीन संख्याएँ, लागू करने को कोई बाधा नहीं
- हर कैमरा फ़्रेम में हर बिंदु, $j$ पर योग
- पिक्सेल में पुनःप्रक्षेपण त्रुटि; $r_m$ में चपटी की गई, $m = (c, p, a)$
- 'मुक्त अज्ञात: सभी पोज़ और बिंदु, 7 गेज संख्याओं को छोड़कर (कैमरा 0 और कैमरा 1 का $t_x$)'
- रिवर्स-मोड autograd से जैकोबियन, प्रति पंक्ति एक सदिशीकृत backward पास
- Gauss–Newton आव्यूह $H = J^{\mathsf T}J$ और प्रवणता $J^{\mathsf T}\mathbf r$, $m$ पर योग
- कैमरे | बिंदु ब्लॉक; एक अवशेष एक कैमरे और एक बिंदु को छूता है, इसलिए $V$ ब्लॉक विकर्ण है
- 'शूर पूरक (घटा हुआ कैमरा तंत्र): $P$ छोटे $3\times 3$ व्युत्क्रम, फिर एक छोटा हल'
- 'पश्च-प्रतिस्थापन: हर बिंदु अपने आप अद्यतन होता है'
- 'Levenberg–Marquardt अवमंदन: सफल कदम के बाद 3 से भाग, असफल के बाद 4 से गुणा'
