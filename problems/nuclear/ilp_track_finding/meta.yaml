notes: >
  Status: a tool comparison, not an open problem. The ILP is a set-packing problem (NP-hard in general); PDLP is a
  first-order LP method, and rounding gives a heuristic integer solution, not a certified optimum, so the gap to the
  exact optimum is always reported. The PDLP dual bound gives a certified upper bound even without an exact solver.

  Method. Candidate segments join hits on adjacent layers that a track with $p_T \ge p_{T,\min}$ from the beam line
  could connect. Triplets join two segments through a shared middle hit and score $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2
  - (\Delta\theta/\sigma_\theta)^2$ (only $s_t > 0$ kept). The ILP picks triplets $x_t$ and segments $y_e$: each hit has at most
  one chosen segment in and one out, so tracks are chains. A chosen segment continues into at most one chosen triplet on
  each side, and every segment costs $\lambda = 0.1$. Its LP relaxation ($0 \le x, y \le 1$) is solved by our PDLP
  (Applegate et al. 2021): PDHG with Ruiz scaling, KKT-based restarts to the average and primal-weight updates, written
  with torch.sparse so it runs on CPU or CUDA. The Hungarian baseline solves one exact linear assignment per layer pair
  (middle pair first, then inwards and outwards, with triplet costs given the chain so far). It is a bipartite matching
  solved exactly in polynomial time, but it decides one layer pair at a time, while the ILP weighs whole chains
  globally. That is why its tracks differ.

  Data. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), training event 1000 (200 pile-up collisions):
  Zenodo record 4730167, doi:10.5281/zenodo.4730167, licence CC BY 4.0 (Salzburger, Innocente, Vlimant, Rousseau et
  al.). It is cut to the pixel barrel (volume 8, 4 layers) with $|\eta| < 1$: 11 519 hits, 2 452 particles and 6% noise,
  plus the official per-hit weights. Offline benchmark (data/solver_benchmark.csv) on an AMD Ryzen 5 5600G (1
  thread): HiGHS through scipy 1.18.1 (milp, linprog), Gurobi 13 through gurobipy with its size-limited licence (at
  most 2000 variables and 2000 constraints, so only $\Delta\phi \le 30°$), scipy's linear_sum_assignment, and our
  PDLP on the CPU and on an NVIDIA GTX 1080 Ti. NVIDIA cuOpt 26.10 installed in WSL but could not run: its kernels
  are built for compute capability 7.0 (Volta) and newer, and the 1080 Ti is 6.1 (cudaErrorNoKernelImageForDevice), so
  it is skipped and has no numbers. The cited state of the art is in data/trackml_sota.csv.

  Verdict. On all eight wedges (5° to 360°, 151 to 11 519 hits) the LP relaxation was tight: the HiGHS LP optimum
  equals the MILP optimum to $10^{-13}$. Our PDLP plus repair reached the same optimum every time (gap below
  $10^{-9}$), with exactly the triplets HiGHS and Gurobi chose (0 differ). That is empirical, not guaranteed: set
  packing is NP-hard, and here the four-layer chain structure keeps the LP tight. With continuous scores exact ties
  are unlikely, so solvers that reach the optimum agree. Mid-run, about a third of the PDLP values are fractional, many
  near $\tfrac12$ where rival triplets almost tie (for example double hits in overlapping modules); they settle as
  PDLP converges. The Hungarian chains are 0 to 2.2% below the optimum (5 to 651 triplets differ) and match scipy's assignment objective exactly (a check of our
  Hungarian). Full barrel subset (360°): efficiency 93.1% and fake rate 13.0% for the ILP solvers vs 90.9% and 16.2%
  for Hungarian, TrackML score 0.495 vs 0.482. A perfect tracker of the reconstructable particles would score 0.618
  here; the cited full-event state of the art is 0.88 to 0.94 (Mikado 0.944 in 0.56 s). Scaling over $N \ge 1000$
  hits: HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, our PDLP on the CPU $N^{0.92}$, on the GPU $N^{0.36}$ (launch
  overhead still dominates at 10 000 variables, so the 1080 Ti is not faster yet), our Hungarian $N^{2.14}$ (worst case
  $O(n^3)$; sparse, gated costs keep augmenting paths short), scipy $N^{1.57}$. Gurobi fits in its size limit only up to
  860 hits ($N^{1.04}$ there). At these sizes HiGHS is as fast as PDLP; first-order methods pay off on
  much larger LPs. On small wedges Hungarian finds slightly more particles (97.4% vs 94.8% at 30°): the ILP objective
  is a proxy, not the physics metric.

  Caveats. Our instances are a barrel wedge with 4 layers, so tracks have at most 4 hits and there are no endcaps:
  easier and different from the full events of the challenge. The TrackML score comparison is indicative, not like
  for like: about 40% of the subset's score weight sits on particles below the $p_T$ cut or with fewer than 3 layers
  inside the cut, and our times cover one tenth of an event and exclude reading and candidate building. Real trackers
  (ACTS, and the experiments' own) use combinatorial Kalman filters, and graph neural networks (Exa.TrkX) are the main
  machine-learning approach; nobody runs a MILP per event.
