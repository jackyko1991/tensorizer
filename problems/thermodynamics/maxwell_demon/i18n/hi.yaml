title: मैक्सवेल का दानव, ज़िलार्ड इंजन और लैंडाउअर सिद्धांत
summary: 'एक दानव देखता है कि ब्राउनी कण डिब्बे के किस आधे भाग में है और एक विभाजक खिसकाता है ताकि कण उसे धकेले, और एक ही ऊष्मा-कुंड से कार्य निकालता है। अति-अवमंदित लांजेवाँ इंजनों के समूह हिसाब दिखाते हैं: कार्य प्रति बिट अधिकतम $kT\,I \le kT\ln 2$ है, जहाँ $I$ शोरयुक्त माप की पारस्परिक सूचना है, बिट मिटाने में कम से कम $kT\ln 2$ लगता है (लैंडाउअर), और सूचना गिनते ही सागावा–उएदा समता $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$ ऊष्मागतिकी का द्वितीय नियम लौटा देती है। उलटा चलाने पर पथ-प्रायिकताओं के अनुपात का लघुगणक उत्पन्न एन्ट्रॉपी है।'
notes: 'इकाइयाँ: $kT = 1$, गतिशीलता $1$ (अतः $D = 1$), डिब्बे की आधी चौड़ाई $a = 1$, समय $a^2/D$ में। मैक्सवेल (1867) ने एक ऐसे प्राणी की कल्पना की जो अणुओं को छाँटकर द्वितीय नियम को हरा दे; ज़िलार्ड (1929) ने इसे एक कण और एक बिट तक घटा दिया, जिसका मूल्य अधिकतम $kT\ln 2$ कार्य है। लैंडाउअर (1961) और बेनेट (1982) ने विरोधाभास सुलझाया: दानव को अंततः अपनी स्मृति मिटानी होगी, जिसमें प्रति बिट कम से कम $kT\ln 2$ लगता है, इसलिए पूरा चक्र द्वितीय नियम का पालन करता है। सागावा और उएदा (2010) ने त्रुटियों वाले प्रतिपुष्टि के लिए इसे मात्रात्मक बनाया: $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$, अतः $\langle W_{ext}\rangle \le kT\langle I\rangle - \langle\Delta F\rangle$। ये इस प्रकार की प्रसंभाव्य गतिकी के लिए सिद्ध प्रमेय हैं, और अनुकरण इन्हें संख्यात्मक रूप से जाँचता है। मॉडल: दीवारें कड़ी स्प्रिंग $\kappa u^2/2$ ($\kappa = 500\,kT/a^2$) हैं, इसलिए मुक्त ऊर्जाएँ $Z$ से संख्यात्मक रूप से निकाली जाती हैं, कठोर दीवार के मानों पर नहीं रखी जातीं। विभाजक अभेद्य है, इसलिए हर कण अपनी ओर $s$ बनाए रखता
  है। लांजेवाँ चरण मेट्रोपोलिस-संशोधित (MALA) हैं, इसलिए बोल्ट्ज़मान वितरण, जार्ज़िन्स्की, सागावा–उएदा और क्रूक्स नमूना-शोर तक ठीक-ठीक लागू होते हैं। मिटाना विभाजित डिब्बे से शुरू होकर बीच में पिस्टन पर समाप्त होता है, जिससे नरम दीवारों के साथ भी $\Delta F = kT\ln 2$ सटीक रहता है। बहीखाता विभाजक खिसकाने का कार्य गिनता है। अंत में विभाजक निकालने से उसकी थोड़ी स्प्रिंग ऊर्जा लौटती है। वास्तविक आँकड़े, केवल उद्धृत संख्याओं के रूप में (कोई चित्र पुनरुत्पादित नहीं): Bérut et al., Nature 483, 187 (2012) और उसका विस्तृत संस्करण J. Stat. Mech. P06015 (2015) ने प्रकाशीय द्वि-कूप में $2\,\mu$m सिलिका मनके में संग्रहीत एक बिट मिटाया। औसत ऊष्मा चक्र-समय $\tau$ के साथ $\langle Q\rangle = kT\ln 2 + B/\tau$ की तरह घटी, जहाँ $B = 8.15\,kT\cdot$s, और दो-प्राचल फ़िट ने अनंतस्पर्शी मान $A = 0.72\,kT$ ($\pm 0.15\,kT$) दिया, जो $kT\ln 2 \approx 0.693\,kT$ के निकट है। अनुकरणित मिटाना अपनी इकाइयों में वही $1/\tau$ नियम देता है। समय-उत्क्रमण: फ़िल्म का अंतिम भाग मिटाने को उलटा चलाता है। हर प्रक्षेपपथ के लिए, उसकी
  अग्र प्रायिकता और उलटे प्रोटोकॉल में उलटे पथ की प्रायिकता के अनुपात का लघुगणक $\beta(W - \Delta F)$ है, उत्पन्न एन्ट्रॉपी (Crooks 1999)। इसका औसत धनात्मक है, और $\langle e^{-\sigma}\rangle = 1$। आज़माएँ: बड़ी त्रुटि दर $\varepsilon$ (कम सूचना, कम कार्य; $\varepsilon = 0.5$ कुछ नहीं देता), या छोटा $\tau$ (अधिक क्षय)।'
meanings:
- $0$ और $2a$ पर डिब्बे की नरम दीवारें और $p$ पर विभाजक, कण जिस ओर $s=\pm1$ है उधर से अनुभव
- हर इंजन बीच में विभाजक के साथ साम्यावस्था $e^{-V/kT}/Z$ से शुरू होता है
- दानव का पठन, प्रायिकता $\varepsilon$ से ग़लत
- 'प्रतिपुष्टि: विभाजक उस ओर $2a(1-\varepsilon)$ तक खिसकता है जिस पर दानव विश्वास करता है'
- सभी इंजनों के लिए एक साथ ऑयलर–मारुयामा प्रस्ताव, मेट्रोपोलिस–हेस्टिंग्स से स्वीकृत ताकि $e^{-V/kT}$ ठीक-ठीक स्थिर रहे
- स्थिर $x$ पर दीवार खिसकने से कण पर किया गया कार्य
- दानव सही हो तो $\ln 2(1-\varepsilon)$, ग़लत हो तो $\ln 2\varepsilon$; इसका औसत $I$ है
- 'विभाजक की कई स्थितियों के लिए ग्रिड पर समलंब नियम: $\Delta F = -kT\ln Z_1/Z_0$'
- हर चरण की संक्रमण प्रायिकताओं और सीमा पदों से $\ln P_F[x]/P_R[\tilde x]$
labels:
  eps: दानव की माप त्रुटि दर $\varepsilon$
  tau: प्रतिपुष्टि समय $\tau$ (विभाजक खिसकाना, $a^2/D$)
  tau_erase: सबसे धीमा मिटाने का समय ($a^2/D$)
  n_engines: प्रति त्रुटि दर इंजन
  seed: यादृच्छिक बीज
