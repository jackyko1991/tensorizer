title: 접촉 네트워크 위의 전염병
summary: 실제 대면 접촉 네트워크 위의 SIR 및 SIS 전염병으로, 수백 번의 확률적 발병을 하나의 배치 텐서로 한꺼번에 실행하고 그 옆에 개체 기반 평균장 ODE를 함께 보여 줍니다. 발병은 인접 행렬의 최대 고윳값으로 정해지는 문턱 $\beta/\gamma > 1/\lambda_{\max}(A)$ 위에서만 크게 번질 수 있으며, 척도 없는 네트워크에서는 허브에 백신을 접종하면 무작위 접종보다 훨씬 적은 접종량으로 확산을 막을 수 있습니다.
notes: '각 사람은 S, I, R 중 하나의 상태에 있습니다. 매 단계 $\Delta t$마다 감수성자는 감염된 접촉자 각각으로부터 비율 $\beta$로 감염되고, 감염자는 비율 $\gamma$로 회복합니다(SIS에서는 다시 감수성자가 됩니다). 테스트는 사람들이 구획 사이를 옮겨 다니기만 하는지, $k$-정규 그래프에서 $\lambda_{\max} = k$인지, 문턱 아래에서는 발병이 사그라드는지, 그리고 완전 그래프(모두가 모두를 만남, $R_0 = \beta(N-1)/\gamma$)에서 대규모 발병의 평균 최종 크기가 커맥–매켄드릭(1927) 방정식 $z = 1 - e^{-R_0 z}$($R_0 = 2$일 때 $z \approx 0.80$)와 일치하는지 확인합니다. 문턱 $1/\lambda_{\max}$는 개체 기반 평균장을 선형화해서 얻습니다. 이 ODE에 대해서는 정확하지만, ODE는 이웃들을 서로 독립으로 취급하고 감염이 같은 간선을 따라 앞뒤로 되울리게 허용하므로, 이처럼 작고 조밀하며 군집된 네트워크에서는 전염병의 규모를 과대평가합니다. SIR 감염은 자신이 들어온 간선을 따라 곧바로 되돌아갈 수 없습니다. 그래서 메시지 전달 문턱 $T = \beta/(\beta + \gamma) = 1/\lambda_{NB}$도 함께 그립니다. 여기서 $\lambda_{NB}$는 비역행 행렬의 최대 고윳값입니다(Karrer, Newman, Zdeborová 2014). 시뮬레이션 곡선은 첫 환자 이후 우연히 소멸하는 많은 실행까지 포함한 모든 실행의 평균이므로 완만하게 올라갑니다. 척도 없는 네트워크에서는 $\lambda_{\max}$가 가장 큰 허브와 함께 커지므로 문턱이 아주 작고(Pastor-Satorras와 Vespignani 2001), 허브를 제거하면 $\lambda_{\max}$가 빠르게 낮아집니다. 즉 훨씬 적은 접종량으로 집단 면역에 도달합니다. 같은 평균 차수를 갖는 에르되시–레니 네트워크에는 큰 허브가 없으므로 표적 접종의 효과가 훨씬 작습니다.
  데이터: SocioPatterns "Contacts in a workplace"(프랑스의 사무실 건물, 2013년; 92명, 20초 구간에서 대면이 관측된 755쌍, 여기서는 합산함), M. Génois et al., Network Science 3, 326 (2015), Creative Commons Public Domain Dedication (CC0)으로 공개, www.sociopatterns.org. BA 및 ER 네트워크는 합성 데이터입니다. 시뮬레이션의 사람과 비율은 예시일 뿐이며 실제 질병의 모형이 아닙니다.'
meanings:
- 사람 $i$와 $j$가 대면한 것이 관측되면 1, 아니면 0 (대칭, 조밀)
- 함께 실행되는 $B$개의 실현 각각에서 누가 감염되었는지
- '반복된 $j$ ⇒ 합산: 각 사람의 감염된 접촉자 수'
- 감수성자가 한 단계 $\Delta t$ 동안 감염될 확률. 감염자는 확률 $1 - e^{-\gamma \Delta t}$로 회복합니다
- 사람 $i$가 감수성, 감염, 회복 상태일 확률로, RK4로 적분합니다
- '최대 고윳값: 선형화된 평균장 $\dot x = (\beta A - \gamma)x$는 $\beta \lambda_{\max} > \gamma$일 때만 증가합니다'
- 완전 혼합 시의 최종 크기, 방정식 $z = 1 - e^{-R_0 z}$의 근 (커맥–매켄드릭)
labels:
  beta_x_lambda: 문턱 $1/\lambda_{\max}$ 단위로 나타낸 $\beta/\gamma$
  n_runs: 확률적 실현 수 $B$
  n_synthetic: 합성 네트워크의 사람 수
  vacc_beta: 백신 접종 비교에 쓰는 $\beta/\gamma$
