source_hash: 35a326f71a76
title: 합성곱으로서의 이미지 필터링
summary: 절차적으로 그린 테스트 이미지 위로 작은 커널을 밀면서 흐리게 하고, 선명하게 하고, 경계를 찾는다. 각 선형 필터는 펼친 픽셀 창에 대한 축약 한 번 $O_p = K_k P_{kp}$로, conv2d와 같다. 가우시안은 두 번의 1D 패스로 분리되며, 합성곱 정리는 이를 푸리에 변환의 곱으로 바꾼다. 상자 블러와 가우시안 블러, 소벨 경계, 가우시안의 라플라시안, 언샤프 마스킹, 그리고 소금-후추 잡음에서 중앙값 필터와 가우시안 비교.
notes: 상자 필터의 주파수 응답은 음수로 내려가는 물결이 있는 sinc이므로 미세한 세부를 통과시키며, 일부는 부호가 뒤집힌다(처프의 줄무늬가 희미해졌다가 다시 나타난다). 가우시안의 응답은 또 다른 가우시안으로, 매끄럽게 0으로 떨어진다. 분리 가능성은 속도에 중요하다. $(2r+1)^2$ 커널은 픽셀당 $(2r+1)^2$번의 곱셈이 필요하지만, 1D 패스 두 번은 $2(2r+1)$번이면 된다. 소벨(1968)은 미분과 평활화를 결합하고, 가우시안의 라플라시안은 이계 도함수가 0을 지나는 곳에서 반응하며, 캐니(1986)는 같은 평활화된 기울기 위에 세선화와 히스테리시스를 더한다. 언샤프 마스킹은 $\alpha(I - G * I)$를 다시 더하는 고주파 강조로, 잡음도 증폭한다. 중앙값 필터는 선형이 아니므로 커널도 주파수 응답도 없지만, 가우시안이 번지게 할 뿐인 고립된 소금-후추 픽셀을 제거한다(터미널의 PSNR을 비교해 보자). 모든 합성곱 신경망 층은 학습된 커널로 하는 같은 펼치기-축약 연산이다.
meanings:
- '픽셀 $(i, j)$의 회색조 값: 그라데이션, 원판, 정사각형, 삼각형, 처프에 잡음을 더함'
- 필터 가중치, 모든 픽셀에서 같음
- 반복된 $a, b$ ⇒ 창에 대해 합산(상관이며, PyTorch는 이를 합성곱이라 부름)
- 픽셀 $p$ 주변의 창을 열로 만든 것, $k = (a, b)$
- '반복된 $k$ ⇒ 합산: 같은 필터를 einsum 하나로'
- 2D 가우시안은 외적이므로 행 패스와 열 패스로 실행 가능
- '소벨: 미분 방향에 수직인 $[1, 2, 1]$ 평활화 곱하기 미분 방향의 $[-1, 0, 1]$ 차분'
- '합성곱 정리: 푸리에 공간의 점별 곱, 순환 패딩을 쓴 conv2d와 같음'
labels:
  size: 이미지 크기
  sigma: 가우시안 폭 $\sigma$
  box: 상자 크기
  amount: 선명화 $\alpha$
  noise: 가우시안 잡음 $\sigma_n$
  salt_pepper: 소금-후추 잡음 비율
  median: 중앙값 창
