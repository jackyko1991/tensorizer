source_hash: 03516f527daf
title: 'GW150914: первый гравитационно-волновой «чирп»'
summary: Шестнадцать секунд реальных данных деформации LIGO с детекторов в Хэнфорде и Ливингстоне, 14 сентября 2015 года. Спектральная плотность мощности по методу Уэлча, выбеливание и полосовой фильтр выявляют «чирп», скрытый под шумом в сто раз сильнее. Карта Q-преобразования показывает, как его частота нарастает примерно до 150 Гц, а банк шаблонов постньютоновских инспиралей, отфильтрованный одним пакетом, даёт максимум при массе чирпа около $30\,M_\odot$. Гребень аппроксимируется с помощью autograd по закону $\dot f \propto M_c^{5/3} f^{11/3}$, а сигнал в Ливингстоне опережает хэнфордский примерно на 7 мс.
notes: '14 сентября 2015 года в 09:50:45 UTC оба детектора Advanced LIGO зарегистрировали слияние двух чёрных дыр на расстоянии около 410 Мпк (Abbott et al., PRL 116, 061102, 2016) — первое прямое обнаружение гравитационных волн. На этой странице упрощённая версия анализа повторяется на открытых данных. Ниже 30 Гц сырая деформация определяется сейсмическим и тепловым шумом, поэтому спектральная плотность мощности $S_n(f)$ оценивается методом Уэлча (4-секундные сегменты с окном Ханна, перекрытие 50 %), а данные делятся на $\sqrt{S_n}$ (выбеливание); страница проверяет, что спектр выбеленных данных плоский, что выполняется теорема Парсеваля и что у каждого шаблона $\langle h|h\rangle = 1$. Банк шаблонов использует инспираль в приближении стационарной фазы с фазой 2PN для равных масс, обрезанную на $f_\mathrm{peak} = 0.36/(2\pi M)$ — частоте, на которой, по расчётам численной относительности, достигает максимума слияние равных масс (обрезка на частоте ISCO теряет большую часть SNR). Все шаблоны
  и оба детектора фильтруются одним пакетом БПФ. При параметрах по умолчанию лучший шаблон имеет $\mathcal M_c \approx 32\,M_\odot$, SNR около 16 (H1) и 10 (L1), а два пика SNR и взаимная корреляция H1–(−L1) показывают, что Хэнфорд отстаёт от Ливингстона на 7–8 мс (опубликованное значение: 6,9 +0,5/−0,4 мс; ориентация плеч L1 меняет знак). Ньютоновская аппроксимация гребня на Q-карте даёт более тяжёлую $\mathcal M_c \approx 37\,M_\odot$, как и банк 0PN: постньютоновские члены замедляют чирп при заданной массе чирпа, поэтому ньютоновская модель воспринимает его как более тяжёлый. ЧЕСТНОСТЬ (оговорка): это учебный анализ, а не опубликованный. Опубликованные значения получены с полными волновыми формами «инспираль–слияние–затухание» со спинами, спектральной плотностью по гораздо более длинным данным и байесовской оценкой параметров: в системе отсчёта детектора $\mathcal M_c \approx 30\,M_\odot$ и сетевое SNR 24 (Abbott et al. 2016), в системе отсчёта источника $\mathcal M_c = 28.6^{+1.7}_{-1.5}\,M_\odot$,
  массы $35.6$ и $30.6\,M_\odot$, расстояние 440 Мпк в GWTC-1. Наши SNR ниже, потому что в шаблонах нет фазы слияния и затухания и нет спинов, а спектральная плотность оценена всего по 16 с, включающим сам сигнал. Данные: GWOSC (Gravitational Wave Open Science Center), релиз GW150914 GWTC-1-confident v3, файлы H-H1_GWOSC_4KHZ_R1-1126259447-32 и аналогичный для L1, с gwosc.org/eventapi/json/GWTC-1-confident/GW150914/v3/, CC BY 4.0; 16 с начиная с GPS 1126259455, фильтр нижних частот на 900 Гц и прореживание до 2048 Гц, сохранено как деформация × 10⁻²¹ в data/gw150914_strain.csv. Пожалуйста, цитируйте GWOSC (Abbott et al., SoftwareX 13, 100658, 2021) и Abbott et al. 2016. Премии: Премия Шао по астрономии 2016 года (Древер, Торн и Вайсс — за идею и разработку LIGO), Специальная премия Breakthrough Prize по фундаментальной физике 2016 года (Древер, Торн, Вайсс и участники LIGO) и Нобелевская премия по физике 2017 года (Вайсс, Бэриш и Торн).'
meanings:
- деформация детектора $d \in \{H1, L1\}$ в отсчёте $n$, 16 с при 2048 Гц
- 'односторонняя спектральная плотность мощности: сегменты $s$ с окном Ханна, БПФ, $|X|^2$, усреднённое по $s$'
- 'выбеленная деформация: белый шум единичной дисперсии там, где спектральная плотность оценена верно'
- энергия гауссовых полосовых фильтров шириной $f_q/q$, один пакет обратных БПФ
- фаза инспирали в приближении стационарной фазы до 2PN для массы чирпа $\mathcal M_m$, $\eta = 1/4$
- весь банк сразу, обрезанный на частоте пика слияния и нормированный так, что $\langle h|h\rangle = 1$
- $4\,\mathrm{Re}\sum_k a_k b_k^*/S_k\,\Delta f$, суммирование по $k$
- 'суммирование по $k$ через обратное БПФ: комплексное SNR для каждого детектора, шаблона и момента времени'
- ньютоновский трек $\frac1\pi(5/256\tau)^{3/8}\mathcal M_c^{-5/8}$, подогнанный к гребню методом Adam
labels:
  pn_order: Постньютоновский порядок фазы шаблона
  cutoff: Верхняя частота шаблона
  f_low: Нижняя частота шаблона $f_\mathrm{low}$
  n_templates: Шаблонов в банке
  mc_min: Наименьшая масса чирпа $\mathcal M_c$
  mc_max: Наибольшая масса чирпа $\mathcal M_c$
  q: Q частотно-временной карты
  welch_segment: Длина сегмента Уэлча
