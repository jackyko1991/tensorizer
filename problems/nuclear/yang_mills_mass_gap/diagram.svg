<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Square lattice with link variables U on the edges, one plaquette P highlighted, and a larger R by T Wilson loop">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- lattice -->
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="30" y1="20" x2="30" y2="140"/><line x1="70" y1="20" x2="70" y2="140"/><line x1="110" y1="20" x2="110" y2="140"/>
      <line x1="150" y1="20" x2="150" y2="140"/><line x1="190" y1="20" x2="190" y2="140"/>
      <line x1="20" y1="30" x2="200" y2="30"/><line x1="20" y1="70" x2="200" y2="70"/><line x1="20" y1="110" x2="200" y2="110"/>
    </g>
    <!-- Wilson loop R x T -->
    <rect x="110" y="30" width="80" height="80" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="198" y="54" font-size="13" font-style="italic" fill="#b45309">W</text>
    <!-- plaquette -->
    <rect x="30" y="70" width="40" height="40" fill="#93c5fd" fill-opacity="0.6" stroke="#2563eb" stroke-width="2.5"/>
    <text x="43" y="95" font-style="italic" fill="#1e40af">P</text>
    <!-- a link variable -->
    <line x1="70" y1="110" x2="108" y2="110" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="78" y="128" font-style="italic" fill="#b91c1c">U<tspan font-size="10" dy="3">μ</tspan></text>
    <g fill="#374151">
      <circle cx="30" cy="30" r="3"/><circle cx="70" cy="30" r="3"/><circle cx="110" cy="30" r="3"/><circle cx="150" cy="30" r="3"/><circle cx="190" cy="30" r="3"/>
      <circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/><circle cx="190" cy="70" r="3"/>
      <circle cx="30" cy="110" r="3"/><circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/><circle cx="190" cy="110" r="3"/>
    </g>
    <text x="30" y="155" font-size="13" fill="#374151">x</text>
    <text x="134" y="152" font-size="13" font-style="italic" fill="#374151">R × T</text>
  </g>
</svg>
