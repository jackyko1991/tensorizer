title: Трассировка лучей для сфер
summary: Крошечный трассировщик лучей в стиле Уиттеда, где луч каждого пикселя — одна строка тензора $(H\cdot W, 3)$. Все лучи проверяются против всех сфер сразу с помощью формулы корней квадратного уравнения, что даёт таблицу (лучи $\times$ сферы), argmin которой — видимая поверхность. Затенение по Ламберту и Блинну–Фонгу, жёсткие тени от второго пакета теневых лучей, зеркальные отражения и клетчатый пол, пока источник света или камера обходит сцену по кругу.
notes: Цвет пикселя равен $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$, где $m$ — зеркальная доля поверхности; отражённый цвет получается повторной трассировкой пакета отражённых лучей — это рекурсивная идея Уиттеда (1980). Модель затенения — модель Фонга (1975) с полувектором Блинна (1977) $\hat{\mathbf h}$. Поскольку $\hat{\mathbf d}$ имеет единичную длину, старший коэффициент квадратного уравнения равен 1, так что нужны только $b$ и $q$. Вторичные лучи начинаются на крошечном расстоянии $\varepsilon$ от поверхности, иначе из-за округления они попадают в собственную сферу (теневые артефакты, shadow acne). Попробуйте ноль отражений, чтобы увидеть сцену без отражений, высокий показатель блеска для маленьких резких бликов или широкое поле зрения. Настоящие рендереры добавляют мягкие тени, преломление и много выборок на пиксель (трассировка путей), но пакетная таблица «луч против всего» остаётся той же.
meanings:
- начало и единичное направление луча через пиксель $p$; $d$ — точка экрана $(x, y, 1)$ в базисе камеры, einsum по индексу базиса
- центр и радиус сферы $s$
- 'повторяющийся $i$ ⇒ суммирование: каждый луч против каждой сферы одним вызовом'
- ближний корень квадратного уравнения; $\infty$ там, где $b^2 < q$ (луч промахивается) или попадание позади
- видимая поверхность; плоскость земли $y = 0$ — дополнительный столбец с $t = -o_y/d_y$
- диффузный и зеркальный множители, обрезанные на 0 на обратной стороне
- 'теневые лучи к источнику света: 1, если до источника не встречена ни одна сфера, иначе 0'
- 'повторяющийся $j$ ⇒ суммирование: зеркальное направление, следующий пакет лучей'
