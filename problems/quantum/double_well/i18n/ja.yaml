source_hash: dc1d9350a90f
title: 二重井戸ポテンシャルのトンネル効果
summary: 対称な二重井戸ポテンシャル中の粒子。torch.linalg.eigh により、最低の2つの状態が近接した対をなすことがわかる：偶状態と奇状態で、ごく小さなトンネル分裂エネルギー $\Delta E$ だけ離れている。両者の和は左の井戸にいる粒子であり、2つの相対位相がずれていくにつれて、エネルギーが障壁より低いにもかかわらず、周期 $2\pi/\Delta E$ で右の井戸へトンネルしてまた戻る。
notes: 単位 $\hbar = m = 1$。二重項のエネルギーは障壁の頂上 $V_0$ より低いので、古典的には粒子は決して越えられない。2つの状態だけが関わるので、$\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$（全体の位相を除いて）である：$t = 0$ では左に $(\varphi_0 + \varphi_1)$、$t = \pi/\Delta E$ では右に $(\varphi_0 - \varphi_1)$ となる。$P_L(t) = \cos^2(\Delta E\,t/2)$ は、各状態の「反対側」の井戸との小さな重なりを除いて成り立つ。$\Delta E$ は障壁の高さと幅に対しておおよそ指数関数的に小さくなる（WKB 因子 $e^{-\int\kappa\,dx}$）ので、障壁を少し高くするだけでトンネル効果は大幅に遅くなる——シミュレーション時間はトンネル周期 $2\pi/\Delta E$ を単位に測るので、アニメーションは常に整数回の振動を示す。
meanings:
- 4次ポテンシャル：極小は $x = \pm a$、障壁 $V_0$ は $x = 0$
- 運動エネルギー $-\tfrac12\,D2$ と対角成分の $V$
- エネルギーと状態；$\varphi_0$ は偶、$\varphi_1$ は奇、$\Delta E = E_1 - E_0$
- $(1, 1, 0, 0, \dots)/\sqrt2$：二重項の等しい混合、左に局在
- 繰り返される $n$ ⇒ 和をとる：固有基底での厳密な時間発展
- 左半分を選ぶ階段関数；$P_L$ は $x$ について和
labels:
  V0: 障壁の高さ $V_0$
  a: 井戸の間隔 $a$（極小は $\pm a$）
  periods: シミュレーション時間
  n_grid: 格子点数
