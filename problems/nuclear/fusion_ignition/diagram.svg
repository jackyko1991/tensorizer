<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Imploded fusion capsule: a hot spot of radius R and temperature T inside a dense cold DT shell; alpha particles heat it and some are stopped in the shell, while bremsstrahlung escapes">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- cold dense shell and hot spot -->
    <circle cx="100" cy="80" r="62" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="100" cy="80" r="34" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <!-- radius -->
    <line x1="100" y1="80" x2="124" y2="104" stroke="#374151" stroke-width="2"/>
    <circle cx="100" cy="80" r="2.5" fill="#374151"/>
    <text x="113" y="88" font-style="italic">R</text>
    <text x="80" y="76" font-style="italic">T</text>
    <!-- alpha particles: one absorbed in the hot spot, one stopped in the shell -->
    <line x1="96" y1="70" x2="82" y2="56" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="104" y1="68" x2="126" y2="34" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="128" y="44" font-style="italic" fill="#b91c1c">α</text>
    <!-- bremsstrahlung escaping -->
    <path d="M118,74 q5,-6 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="180" y="64" font-size="13" fill="#4b5563">X-rays</text>
    <!-- shell label -->
    <text x="152" y="138" font-style="italic">ρ</text>
    <line x1="148" y1="133" x2="138" y2="122" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
</svg>
