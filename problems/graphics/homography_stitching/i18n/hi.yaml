title: होमोग्राफी आकलन और पैनोरमा सिलाई
summary: एक सपाट पोस्टर की दो तस्वीरें एक $3\times3$ होमोग्राफी (homography) से संबंधित होती हैं। हर फ़ीचर मिलान दो रैखिक समीकरण देता है। सामान्यीकृत प्रत्यक्ष रैखिक रूपांतरण (DLT) उन्हें SVD से हल करता है, और RANSAC गलत मिलानों को बाहर करने के लिए हज़ारों 4-मिलान परिकल्पनाओं को एक बैच SVD के रूप में फ़िट करता है। फिर दूसरे दृश्य को विकृत (warp) करके पहले के साथ फ़ेदर-मिश्रित करके पैनोरमा बनाया जाता है।
notes: 'किसी समतल को देखता कैमरा समतल बिंदुओं को $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$ से पिक्सेल पर मैप करता है, इसलिए एक ही समतल के दो दृश्य $H_2 H_1^{-1}$ से संबंधित होते हैं: आठ संख्याएँ, क्योंकि स्केल मुक्त है। हर मिलान उनमें से दो को तय करता है, इसलिए सामान्य स्थिति में चार मिलान $H$ को निर्धारित करते हैं। अधिक मिलानों को DLT न्यूनतम वर्ग अर्थ में मिलाता है। Hartley के सामान्यीकरण के बिना $A$ की प्रविष्टियाँ 1 से $10^4$ (पिक्सेल वर्ग) तक फैलती हैं और SVD सटीकता खो देता है। गलत मिलान न्यूनतम वर्ग को बर्बाद कर देते हैं: कुछ बाह्य मान (outliers) सीधे-सादे पैनोरमा को स्पष्ट रूप से संरेखण से बाहर खींच देते हैं। RANSAC (Fischler & Bolles, 1981) इसके बजाय $H$ को कई यादृच्छिक न्यूनतम नमूनों पर फ़िट करता है और वह रखता है जिससे सबसे अधिक मिलान सहमत हों। बाह्य-मान अंश $\varepsilon$ के साथ, एक 4-मिलान नमूना प्रायिकता $(1-\varepsilon)^4$ से शुद्ध होता है, इसलिए सिद्धांततः कुछ दर्जन नमूने पर्याप्त हैं। यहाँ हज़ारों एक साथ हल किए जाते हैं क्योंकि बैच SVD सस्ते हैं। अंतर्मानों (inliers) पर
  बची त्रुटि पिक्सेल शोर से मेल खाती है। विधि Hartley & Zisserman, Multiple View Geometry in Computer Vision का अनुसरण करती है। असली पाइपलाइनें मिलान SIFT या ORB जैसे फ़ीचर डिटेक्टरों से प्राप्त करती हैं।'
meanings:
- दृश्य 1 और दृश्य 2 में मिलान की गई पिक्सेल स्थितियाँ (ज्ञात पोस्टर बिंदु + शोर, कुछ को यादृच्छिक गलत मिलानों से बदला गया)
- दोहराया गया $j$ ⇒ योग, फिर तीसरे घटक (प्रक्षेपी स्केल) से भाग
- केंद्रक पर खिसकाएँ और माध्य दूरी $\sqrt 2$ तक स्केल करें (Hartley सामान्यीकरण)
- $\mathbf x' \times H\mathbf x = 0$ से प्रति मिलान दो पंक्तियाँ, नौ प्रविष्टियों $h_a$ में रैखिक
- सबसे छोटे एकवचन मान का दायाँ एकवचन सदिश; फिर $H = T'^{-1}\hat H\,T$
- 'RANSAC परिकल्पनाएँ: $B$ यादृच्छिक 4-मिलान नमूने, सभी आकार $(B, 8, 9)$ के एक बैच SVD से हल'
- हर परिकल्पना के अंतर्गत हर मिलान की पुनःप्रक्षेपण त्रुटि
- सबसे बड़े सहमति समुच्चय वाली परिकल्पना; उसके अंतर्मानों पर DLT से पुनः फ़िट
- 'व्युत्क्रम warp: हर पैनोरमा पिक्सेल देखता है कि वह दृश्य 2 में कहाँ पड़ता है; फ़ेदरिंग भारों से मिश्रित'
labels:
  matches: फ़ीचर मिलान
  outliers: गलत मिलानों का अंश
  noise: पिक्सेल शोर $\sigma$
  hypotheses: RANSAC परिकल्पनाएँ $B$
  threshold: अंतर्मान सीमा $\tau$
