source_hash: 51ed4214e669
title: 龐加萊猜想與 Ricci 流
summary: 已證明：每個閉的單連通三維流形都是三維球面（Perelman 2002–03，完成了 Hamilton 的 Ricci 流計劃）。Ricci 流 $\partial_t g = -2\,\mathrm{Ric}$ 會把度量抹平，就像熱傳導抹平溫度一樣。這裡它把一批凹凸不平的二維球面變圓（Gauss–Bonnet $\int K\,dA = 4\pi$ 精確成立至捨入誤差），並讓啞鈴形三維球面的頸部在有限時間內夾斷：這正是 Perelman 的手術所切除的奇點，之後每一塊都會變圓。
notes: 狀態：已證明。龐加萊在 1904 年問：如果一個閉三維流形上每條迴路都能收縮成一點，它是否必定是三維球面？Hamilton 於 1982 年引入 Ricci 流，並證明 Ricci 曲率為正的三維流形會流向圓的度量；在二維中，球面上的每個度量都會變圓（Hamilton 1988、Chow 1991），凹凸球面正好展示這一點：$K$ 的離散程度衰減到零，而 $\int K\,dA = 4\pi$ 與面積保持不變。$l = 1$ 的球諧函數是圓球面的共形運動，不會衰減，但它們不改變形狀。在三維中，流可能產生奇點。對頸部足夠細的旋轉對稱啞鈴，Angenent 與 Knopf（2004）證明了頸部夾斷：頸部像圓柱 $S^2 \times \mathbb R$ 一樣收縮，$\psi_\mathrm{neck}^2 \approx 2(T - t)$，而兩端的球體仍保持很大。Perelman 的論文（arXiv 2002–03）控制了三維中的所有奇點（無局部塌縮、典範鄰域），定義了帶手術的 Ricci 流——切斷頸部並加上帽蓋——並證明對單連通流形，流會在有限時間內消亡，每一塊在消失前都是圓球面，因此該流形就是三維球面。這個證明由 Kleiner–Lott、Morgan–Tian 與 Cao–Zhu 詳細驗證；Perelman 拒絕了 2006 年的菲爾茲獎和 2010 年的克雷千禧年大獎。數值方面：曲面在極角上使用有限體積網格，因此離散 Gauss–Bonnet 是精確的。三維球面寫成共形形式，它在兩極是正則的（弧長形式在那裡要除以 $\psi \to 0$，並不穩定），網格單元向兩極加密，因為頸部變細時兩端的球體會在那裡被擠壓；當頸部半徑降到 $0.05$ 時流停止，此時兩端的球體仍可解析。這裡的手術只是 Perelman 構造的示意圖。試試粗的頸部（$\varepsilon \gtrsim 0.5$）：它不會夾斷，整個球面都會變圓。
meanings:
- 每個凹凸球面 $b$ 在單元 $i$ 處的共形因子，度量為 $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$
- 重複的 $j$ ⇒ 求和：圓球面的通量形式拉普拉斯算子；其通量在兩極為零
- 共形度量的高斯曲率；曲面上的 Ricci 流為 $\partial_t g = -2Kg$
- 總曲率：對每個度量都恰為 $4\pi$（離散 Gauss–Bonnet），每一步都作檢驗
- 歸一化流的平均曲率目標；它使每個面積保持不變
- 三維球面 $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$ 的截面曲率 $-\psi_{ss}/\psi$ 與 $(1-\psi_s^2)/\psi^2$，其中 $\psi = e^u\sin x$
- 微分同胚（規範）項，使度量保持共形形式；它改變的是座標，而不是幾何
- 最小 $S^2$ 截面的半徑；$\psi_\mathrm{neck}^2$ 大約以圓柱的速率 $2$ 下降，直到夾斷
- 切掉高曲率的頸部，黏上一個與剖面相切的圓帽（Perelman 手術的示意）
labels:
  neck: 啞鈴的初始頸部半徑 $\varepsilon$
  t_surface: 曲面的流動時間
  cells: 網格單元數 $N$
