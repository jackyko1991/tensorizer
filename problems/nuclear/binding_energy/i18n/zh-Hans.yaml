source_hash: 895c388f37ef
title: 原子核结合能
summary: 半经验（液滴模型）质量公式由五项给出每个原子核的结合能：体积项、表面项、库仑项、对称项和对能项。通过广播在整个 $(Z, N)$ 网格上一次计算，可以看出为什么铁和镍结合得最紧，以及稳定谷的走向。
notes: 体积结合能按 $A$ 增长，但表面核子的近邻较少（$-A^{2/3}$），质子间的斥力按 $Z^2/A^{1/3}$ 增长；三者平衡使 $B/A$ 的最大值位于 $A \approx 56$–$62$ 附近，这正是轻核聚变和重核裂变都能释放能量的原因。对称项把原子核拉向 $N = Z$，库仑项把重核推向 $N > Z$：两者共同给出弯曲的稳定谷 $Z_0 \approx A/(2 + 0.0154\,A^{2/3})$。对中等和重核，该公式精度约为 1 %，但对很轻的核不适用（⁴He 的结合远强于液滴），也反映不出幻数处的壳效应。默认系数是一组常用的最小二乘拟合值；改变它们可以看出哪一项塑造了哪一特征。
meanings:
- 质子数沿列向下，中子数沿行排列
- 列与行广播相加，填满整张表
- 偶偶核为 $+a_P/\sqrt A$，奇奇核为 $-a_P/\sqrt A$，奇 $A$ 核为 0
- 核素图上每个原子核的结合能，MeV
- 比结合能（热图）
- 每个质量数下结合最紧的同量异位素（红线）
- 由 $\partial B/\partial Z = 0$ 得到 $A/(2 + \tfrac{a_C}{2a_A}A^{2/3})$
labels:
  a_V: 体积项 $a_V$
  a_S: 表面项 $a_S$
  a_C: 库仑项 $a_C$
  a_A: 对称项 $a_A$
  a_P: 对能项 $a_P$
  z_max: 网格上最大的 $Z$
