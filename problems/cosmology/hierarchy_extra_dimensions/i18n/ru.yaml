title: Проблема иерархии и гравитация, утекающая в дополнительные измерения
summary: 'Почему гравитация примерно в $10^{33}$ раз слабее слабого взаимодействия ($G_F M_{Pl}^2$)? Один спекулятивный ответ: гравитация расходится в $n$ скрытых компактных измерений. На $\mathbb R^3\times T^n$ потенциал суммируется двумя способами — по изображениям массы и по башне Калуцы–Клейна — как один тензор по оболочкам решётки. Внутри он спадает как $1/r^{1+n}$, снаружи как $1/r$, с юкавским хвостом $\alpha = 2n$, $\lambda = R$. Радиусы ADD для $n = 1..6$ сопоставляются с реальными ограничениями крутильных весов и LHC, а варп-фактор Рэндалл–Сундрума $e^{-\pi k r_c}$ превращает $M_{Pl}$ в ТэВ. Ни одного дополнительного измерения не обнаружено.'
notes: 'Статус: спекулятивно. Проблема иерархии спрашивает, почему электрослабый масштаб ($v \approx 246$ ГэВ) лежит так далеко ниже планковского ($M_{Pl} \approx 1.22\times10^{19}$ ГэВ), причём $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$. Аркани-Хамед, Димопулос и Двали (ADD, 1998) предположили, что только гравитация распространяется в $n$ компактных измерений размером от миллиметра до фемтометра, так что истинный масштаб гравитации $M_*$ может быть порядка ТэВ. Рэндалл и Сундрум (1999) предложили вместо этого одно искривлённое измерение. Дополнительных измерений не найдено. Среди других предложенных ответов — суперсимметрия, составная природа, релаксион и антропный отбор. Ни один не установлен. Что вычисляется: точечная масса на $\mathbb R^3\times T^n$ (окружности радиуса $R$, единицы $R = G_D M = 1$). Сумма по изображениям и сумма Калуцы–Клейна равны по формуле суммирования Пуассона; обе сгруппированы по оболочкам $m = |\mathbf k|^2$ с числами $r_n(m)$. График использует сумму по
  изображениям внутри ($r < R$, далёкие изображения заменены интегралом) и сумму КК снаружи. Теорема Гаусса в $3+n$ пространственных измерениях фиксирует $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$. Самый лёгкий уровень КК содержит $2n$ мод массы $1/R$, поэтому сразу за компактным пространством гравитация выглядит как юкавская поправка с $\alpha = 2n$, $\lambda = R$ (тор; другие формы меняют $\alpha$). Радиусы ADD используют $M_{Pl}^2 = M_*^{n+2}R^n$; статьи различаются множителями вроде $(2\pi)^n$ и $8\pi$, так что $R$ — это порядок величины. Данные, как цитируемые числа в data/*.csv: крутильные весы Eöt-Wash исключают $|\alpha| = 1$ выше $\lambda = 56\,\mu$м (Kapner et al., PRL 98, 021101, 2007, arXiv:hep-ph/0611184; одно дополнительное измерение $R \le 44\,\mu$м) и выше $38.6\,\mu$м (Lee et al., PRL 124, 101101, 2020, arXiv:2002.11761). Сама кривая исключения не включена. Поскольку она убывает с $\lambda$, любая точка с $\alpha \ge 1$ и $\lambda > 38.6\,\mu$м исключена — консервативная проверка.
  Поиск событий с одной струёй в ATLAS при 13 ТэВ (139 фб$^{-1}$; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0) исключает $M_D$ ниже 11,2, 8,5, 7,1, 6,4 и 5,9 ТэВ для $n = 2..6$ (соглашение Джудиче–Раттацци–Уэллса, здесь сравнивается напрямую с $M_*$). $n = 1$ потребовало бы измерения размером с Солнечную систему и исключено орбитами планет. Рэндалл–Сундрум: $k r_c \approx 11$–$12$ делает $\bar M_{Pl}e^{-\pi k r_c}$ равным ТэВ; LHC не увидел её гравитонов Калуцы–Клейна.'
meanings:
- векторы мод Калуцы–Клейна (импульсы $\mathbf k/R$ вокруг окружностей); для проверки чисел на оболочках
- 'сколько $\mathbf k$ удовлетворяют $|\mathbf k|^2 = m$: тэта-ряд в степени $n$ через свёртку FFT'
- 'повторяющийся индекс оболочки $m$ ⇒ суммирование: масса и её изображения; далёкие изображения — непрерывным хвостом'
- тот же потенциал как башня юкавских членов массы $\sqrt m/R$ (суммирование Пуассона)
- поле через autograd; умноженное на площадь $S^{2+n}$ (вблизи) или $S^2\times T^n$ (вдали) даёт поток Гаусса
- метод наименьших квадратов для $\ln(\phi/\phi_N - 1)$ сразу за компактным пространством; ожидается $2n$ и $R$
- радиус ADD для каждого $n$ и каждого фундаментального масштаба $M_*$ сразу (broadcast)
- варп-фактор Рэндалл–Сундрума между планковской браной и ТэВ-браной
labels:
  M_star: Фундаментальный масштаб $M_*$ для выводимой таблицы
  krc: $k r_c$ Рэндалл–Сундрума
  m_max: Суммируемые оболочки решётки, $|\mathbf k|^2 \le m_{max}$
