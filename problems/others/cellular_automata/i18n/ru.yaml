source_hash: ebc73dcb492e
title: Все 256 элементарных клеточных автоматов и Lenia
summary: 'Строка клеток, в которой каждая новая клетка зависит от себя самой и двух соседей: три бита образуют код $k \in \{0, \dots, 7\}$, а номер правила, записанный в двоичном виде, служит таблицей поиска. Все 256 правил работают как один тензор $(256, W)$, который продвигается одной операцией gather: правило 90 рисует треугольник Серпинского, правило 30 выглядит случайным, правило 110 строит взаимодействующие структуры, а правило 184 моделирует движение транспорта. Непрерывный родственник, Lenia, заменяет таблицу гладким кольцевым ядром и выращивает скользящее существо.'
notes: 'Вольфрам (Wolfram) разделил элементарные правила на четыре класса: (1) всё вымирает или заполняется, (2) неподвижные или периодические узоры, (3) хаос, как у правила 30, центральный столбец которого долго использовался как генератор случайных чисел, и (4) сложные долгоживущие взаимодействующие структуры, как у правила 110, для которого Мэттью Кук (Matthew Cook) доказал (публикация 2004 года) полноту по Тьюрингу. Мозаика раскрашивает каждое правило по грубому автоматическому тесту после 600 шагов на кольце из 151 клетки: однородное, периодическое с точностью до сдвига или период не найден. Последняя группа смешивает классы 3 и 4, и точного определения, позволяющего их различить, нет. Правило 90 складывает соседей по модулю 2, поэтому из одной клетки получается треугольник Паскаля по модулю 2, а правило 184 — простейшая модель транспорта: машина сдвигается вправо, если клетка впереди свободна, так что число машин сохраняется. В отличие от игры «Жизнь» (2D, подсчёт $3\times3$, одно
  правило), здесь все правила работают одновременно. Lenia (Берт Чан, Bert Chan, 2019) делает пространство, время и состояния непрерывными; Orbium, её классический глайдер, стартует из таблицы клеток, опубликованной вместе с Lenia (лицензия MIT), и сохраняет свою массу при движении — пример солитоноподобного узора, который не обеспечивается никаким законом сохранения.'
meanings:
- 'бит $k$ номера правила $r$: новое состояние, когда код окрестности равен $k$'
- левая, центральная и правая клетки вокруг клетки $i$ на кольце
- 'повторяющийся $j$ ⇒ суммирование: 3-битный код окрестности $4\,\text{left} + 2\,\text{centre} + \text{right}$'
- один поиск по таблице продвигает все правила сразу
- зеркальное отражение слева направо и дополнение 0/1 правила; 256 правил образуют 88 классов симметрии
- гладкое кольцо радиуса $R = 13$, нормированное на сумму 1
- свёртка на периодической сетке как произведение преобразований Фурье
- рост там, где $U \approx \mu$, затухание в остальных местах, шагами $1/T$
