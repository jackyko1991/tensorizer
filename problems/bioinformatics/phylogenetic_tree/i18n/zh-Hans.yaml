source_hash: 72ebeb1bb100
title: 由 DNA 距离构建系统发育树
summary: DNA 序列沿一棵隐藏的随机树进化，每条分支是与 Jukes–Cantor 转移矩阵的一次矩阵乘积。仅从叶节点出发，我们用对独热字母的一次 einsum 统计差异，校正隐藏的多重替换，再用 UPGMA 和邻接法重建树。看两棵树随所用位点增多如何变化，并以 Robinson–Foulds 距离与真实树比较评分。
notes: 真实树是一棵随机溯祖树；在宽松分子钟下，每条分支还有自己的速率，因此叶节点到根的距离各不相同。差异位点的原始比例 $p$ 在 $3/4$ 处饱和，并低估长路径（对角线下方的灰点）；Jukes–Cantor 距离 $d$ 是无偏的（对角线上的蓝点）但噪声更大，其噪声按 $1/\sqrt L$ 减小。UPGMA 假设所有叶节点到根的距离相等，因此在宽松分子钟下，无论看到多少位点，它都可能把两条并非相邻的短分支连在一起（红色分支）。邻接法只要求距离沿树可加，并收敛到真实的无根形状；它以其最长路径的中点为根绘制，因为仅凭距离无法确定根的位置。切换到严格分子钟，UPGMA 也变得一致。
meanings:
- 经过长度为 $t$ 的分支（每位点的期望替换数）后字母 $\alpha$ 变为 $\beta$ 的概率
- 重复的 $\alpha$ ⇒ 求和：子节点在每个位点的字母概率；用逆累积分布函数采样
- 观测到的叶节点序列，对 A、C、G、T 独热编码
- 重复的 $l, \alpha$ ⇒ 求和：$i$ 与 $j$ 不同的位点比例
- 校正距离 $-\tfrac34\ln(1 - \tfrac43 p)$：计入同一位点重复替换所隐藏的替换
- 邻接法合并 $Q$ 最小（而非 $d$ 最小）的一对；$r_i = d_{ik}\mathbf 1_k$
- 真实路径长度；当分支 $v$ 位于叶节点 $i$ 与根之间时 $M_{iv} = 1$，$b_v$ 为其长度
- 只出现在两棵树之一中的叶节点二分划数（每条内部分支一个）
labels:
  n_taxa: 分类单元数 $n$
  n_sites: 位点数 $L$
  tree_depth: 根到叶的深度（每位点替换数）
  clock: 分子钟
