source_hash: cf2636b6ae13
title: '물리 정보 신경망(PINN): 감쇠 진동자'
summary: 작은 신경망 $\hat x(t; w)$이 구간의 처음 40%에 있는 단 10개의 잡음 섞인 측정값만으로 용수철에 매달린 감쇠 질량의 운동을 학습합니다. 운동 방정식 $m\ddot x + \mu\dot x + kx = 0$을 손실 함수에 추가하고 콜로케이션 점에서 자동 미분으로 평가하면, 일반 신경망이 실패하는 곳에서도 외삽할 수 있고, 역문제 모드에서는 알려지지 않은 감쇠 $\mu$까지 추정합니다.
notes: '일반 신경망은 유연한 곡선 맞춤 도구입니다. 측정값만으로 훈련하면 그 점들을 지나갈 수는 있지만, 마지막 데이터 점 너머에서는 무엇을 해야 할지 알려 주는 것이 없어 예측(점선)이 벗어납니다. 물리 정보 신경망(PINN)은 두 번째 손실 항으로, 데이터가 없는 곳을 포함해 구간 전체를 덮는 콜로케이션 점 $t_c$에서 잔차 $r_c = m\hat x'''' + \mu\hat x'' + k\hat x$의 제곱 평균을 더합니다. 도함수는 입력에 대한 신경망의 정확한 도함수로, torch.autograd.grad를 create_graph=True로 호출해 계산하므로 손실을 이를 통해 가중치까지 역전파할 수 있습니다. $r_c \to 0$이 되도록 몰아가면 $\hat x$은 모든 곳에서 운동 방정식의 해가 되어야 하고, 데이터와 초기 조건 $x(0) = 1$, $\dot x(0) = 0$이 그중 들어맞는 유일한 해를 골라내므로 신경망이 올바르게 외삽합니다. 물리는 빠진 데이터를 대신하는 정칙화 항 역할을 합니다. 역문제에서는 감쇠 $\mu$를 모릅니다. 이것이 훈련 가능한 매개변수가 되고, 최적화기가 데이터와 물리가 일치하는 값을 찾습니다(한 번 지나쳤다가 자리 잡는 모습을 보세요). 정확한 해는 $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$이며 $\delta = \mu/2m$, $\omega = \sqrt{k/m - \delta^2}$입니다. 실용적인 점: 잔차는 오차의 약 $k$배 크기이므로 가중치 $\lambda \approx 10^{-4}$로 데이터 항과 균형을 맞춥니다(너무 크면 잔차가 역시 0인 자명해 $\hat x = 0$에 머물러 버립니다). 신경망은 낮은 주파수를 먼저 배우므로 높은 주파수(더 큰 $k$)일수록 더 많은 반복이 필요합니다. 여기서 순문제를 푸는 것은 방법을 보여 주기 위해서일 뿐이며, ODE 솔버가 훨씬 빠릅니다. PINN은 역문제, 드물고 잡음
  많은 데이터, 복잡한 모양의 영역에서의 편미분 방정식에서 진가를 발휘합니다. 단순화: 고정된 질량 $m = 1$, 고정된 시드, 코사인 감쇠 학습률을 쓰는 Adam(L-BFGS 미세 조정 없음).'
meanings:
- '입력 시간의 한 배치: 콜로케이션 점, 측정 시각, $t = 0$'
- '층 $l$의 훈련 가능한 가중치 $w$: 크기 $1 \to 32 \to 32 \to 32 \to 1$'
- 반복된 $j$ ⇒ 이전 층의 뉴런에 대해 합산
- 은닉 활성값; $\hat x$이 2계 도함수를 갖도록 매끄러운 활성화 함수 사용
- $\dot{\hat x}$을 줌; 그것에 다시 호출하면 $\ddot{\hat x}$ (신경망의 정확한 도함수, 유한 차분 아님)
- '콜로케이션 점에서의 ODE 잔차: $\hat x$이 물리를 따르는 곳에서 0'
- 데이터 오차, $r_c^2$의 평균, 초기 조건 $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- '역문제 모드: 감쇠는 훈련 가능한 매개변수 하나가 더 늘어난 것으로, 가중치와 함께 Adam이 갱신'
labels:
  mode: '모드: $\mu$ 학습(역문제) 또는 알려짐(순문제)'
  k: 용수철 상수 $k$
  mu: 실제 감쇠 $\mu$
  mu_guess: $\mu$의 초기 추정값(역문제 모드)
  n_data: 측정 개수
  data_fraction: 측정이 덮는 구간의 비율
  noise: 측정 잡음
  n_colloc: 콜로케이션 점 $t_c$
  log10_lambda: 물리 가중치 $\log_{10}\lambda$
  n_iter: 훈련 반복 횟수
  lr: Adam 학습률
  compare: 물리 없는 신경망도 훈련
