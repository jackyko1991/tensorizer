source_hash: 8d871084eacb
title: Преобразование Радона и реконструкция КТ
summary: 'Компьютерный томограф регистрирует линейные интегралы $p(\theta, s)$ карты ослабления под всеми углами. Фантом головы Шеппа–Логана проецируется поворотом и суммированием тензора и восстанавливается методом фильтрованной обратной проекции: рамп-фильтр $|\nu|$ в пространстве Фурье, затем один einsum по углам.'
notes: 'Каждая проекция сохраняет полную массу, $\int p\,ds = \iint f\,dA$, для каждого угла. Если размазать необработанные проекции обратно (простая обратная проекция), точка превращается в ореол $1/r$, так что изображение — размытая версия $f$; рамп-фильтр $|\nu|$ в точности устраняет это размытие (теорема о центральном сечении). Слишком малое число углов даёт полосы; ошибка уменьшается с ростом числа углов, пока её не ограничит сетка пикселей. Окно Шеппа–Логана смягчает рамп-фильтр на высоких частотах, жертвуя небольшой резкостью ради меньшего шума — попробуйте его с включённым шумом. Упрощения: геометрия параллельного пучка, монохроматические лучи, билинейная интерполяция, гауссов шум детектора вместо фотонной статистики. Учебная модель, не для клинического применения.'
meanings:
- 'карта ослабления (модифицированный фантом Шеппа–Логана: сумма 10 эллипсов)'
- изображение, взятое вдоль луча на расстоянии $s$, в положении $t$, под углом $\theta$
- 'повторяющийся $t$ ⇒ суммирование: синограмма'
- рамп $|\nu|$ (Рамачандрана–Лакшминараянана), при необходимости умноженный на $\mathrm{sinc}(\nu\,\Delta s)$ (Шепп–Логан), на дополненном нулями детекторе
- отфильтрованные проекции
- 'каждая проекция, размазанная обратно вдоль своих лучей: $q_\theta(x\cos\theta + y\sin\theta)$'
- 'повторяющийся $\theta$ ⇒ суммирование: обратная проекция'
labels:
  n_pixels: Размер изображения $N$
  n_angles: Углы проекций
  filter: Окно рамп-фильтра
  noise: Шум детектора (доля от максимума)
