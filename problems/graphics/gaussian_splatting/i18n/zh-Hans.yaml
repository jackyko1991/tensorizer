source_hash: fb9eaaef3d46
title: 三维高斯泼溅
summary: 用几百个带颜色、半透明的三维高斯来表示一个场景。每个高斯借助透视映射的雅可比矩阵投影到相机中，$\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$，各个泼溅按深度排序并从前到后进行 alpha 合成，$C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$，再用 Adam 把每个均值、尺度、旋转、颜色和不透明度拟合到一个合成场景的照片上。一个留出视角用来检验这些高斯学到的是三维形状，而不只是训练图片。
notes: 真值是三个球和一个立方体，用解析光线投射配合朗伯着色渲染到场景周围两圈共 12 台相机中（$64\times 64$ px）；位于两圈之间、高度不同的第 13 台相机作为留出视角。高斯一开始随机分布在一个立方体内，呈灰色且很淡，方向随机。每一步 Adam 都让一个训练视角走完上述整条流水线，并把 L1 照片误差反向传播到每个均值、对数尺度、四元数、颜色和不透明度。这里的张量要点是协方差代数：无论优化器怎么更新，$\Sigma = RSS^{\mathsf T}R^{\mathsf T}$ 始终是合法的（对称正定）协方差；而投影不是线性的，所以每个高斯都要通过其局部线性化 $J$ 来变换；二维泼溅 $\Sigma' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$ 是一串 einsum。椭圆面板在留出视角中画出这些 $1\sigma$ 椭圆。致密化（简化版）：在前 70% 的步数里每 50 步，把中心梯度最大的高斯分裂成两份，位于 $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$，轴长缩小为原来的 1/1.6，并复用几乎透明的高斯（$o < 0.05$），因此 $M$ 保持不变；原论文则依据视图空间梯度进行克隆和分裂、剪枝、重置不透明度，并增长到数百万个高斯。与 Kerbl et al.（SIGGRAPH 2023）相比的其他简化：用常数颜色代替球谐函数（场景是朗伯的），用随机初始化代替运动恢复结构点云，L1 损失不含 D-SSIM 项，以及一个在每个像素上计算每个泼溅的稠密光栅化器（真正的实现会在 GPU 上把泼溅分到 $16\times 16$ 的图块中并跳过远处的泼溅），所以图像很小。留出视角的 PSNR 略低于训练 PSNR：从未见过的视角对高斯的约束更弱。试试更少的视角（留出视角会变差）、L2 损失、关闭致密化，或者更多的高斯和步数（边缘更锐利）。
meanings:
- 由四元数得到高斯 $m$ 的旋转，内部做归一化，所以任意 4 个数都是合法的旋转
- 三维协方差，对 $j$ 求和；对任意参数都对称正定，$s = e^{\log s}$
- 每个高斯中心在每台相机坐标系中的位置（x 向右，y 向下，z = 深度）
- 将中心针孔投影到像素坐标
- $\partial\mu'_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$：投影的局部线性化
- 每个泼溅的二维协方差，对 $j, k$ 求和，其中 $JW = $ einsum('vmai,vij->vmaj')，再加上 0.3 px² 的低通
- 二次型 $d^{\mathsf T}\Sigma'^{-1}d$ 按像素的 6 个单项式 $\varphi = (u^2, 2uv, v^2, u, v, 1)$ 展开：一次矩阵乘法
- 泼溅 $m$ 覆盖像素 $p$ 的程度；$o_m = \sigma(\text{logit})$
- 每台相机的深度顺序；在大的 $(V, M, P)$ 张量生成之前先对每个高斯的小张量重新排序
- 透射率：经过 $m$ 前面的泼溅后剩下的光；沿 $m$ 单调不增
- 从前到后合成，对 $m$ 求和；透过来的光显示白色背景 $b$
- 每步在一个随机训练视角上的平均绝对像素误差；Adam 更新全部 $14M$ 个数
labels:
  n_gaussians: 高斯数 $M$
  iterations: Adam 步数
  lr: Adam 学习率（均值；其余按比例缩放）
  loss: 光度损失
  densify: 分裂致密化
  n_views: 训练视角数 $V$
  resolution: 图像尺寸（像素）
