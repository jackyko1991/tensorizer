source_hash: e3d9a69287ac
title: 酸鹼滴定曲線
summary: 將氫氧化鈉逐滴加入強酸、弱酸與磷酸中。不再對每個區段各用一套課本捷徑，而是以二分法對單一電荷平衡式求解 $[\mathrm{H^+}]$，在一個 $(A, N)$ 張量中同時處理每種酸與每個體積。曲線給出當量點（$d\mathrm{pH}/dV$ 的峰值）、緩衝區以及物種分率 $\alpha_j(\mathrm{pH})$。
notes: 電荷平衡在整條曲線上處處成立，因此它取代了起點、緩衝區、當量點與鹼過量時各自的公式。每一項都是 pH 的單調函數，這使二分法十分安全：它每次都把區間減半，不可能錯過根。強酸（以 pKa $\approx -6$ 模擬）給出陡峭的躍變，當量點 pH 為 7，此時只剩 $\mathrm{Na^+}$、$\mathrm{Cl^-}$ 與水。弱酸起點較高，在緩衝區緩緩上升，當量點高於 7，因為其共軛鹼 $\mathrm{A^-}$ 本身就是弱鹼。在半當量點 $[\mathrm{HA}] = [\mathrm{A^-}]$，因此 Henderson–Hasselbalch 方程式 $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$ 給出 $\mathrm{pH} = \mathrm{p}K_a$：滴定正是測量 pKa 值的方法。磷酸（pKa ≈ 2.15、7.20 與 12.35，為 25 °C 下的近似值）呈現兩個躍變；第三個質子的酸性極弱，0.1 M NaOH 無法明顯地將其奪走，其躍變淹沒在過量的鹼中。物種面板說明了原因：每個 $\alpha_j$ 在兩個 pKa 值之間達到峰值，而相鄰兩者恰在 $\mathrm{pH} = \mathrm{p}K$ 處相等。簡化：以濃度代替活性、25 °C、不考慮空氣中的 CO₂。
meanings:
- 酸 $a$、質子 $i$；不足的質子以 $+\infty$（$K = 0$）填補
- 累積常數：$-$ pKa 值的累加和，$\beta_{a0} = 1$
- 將 $V_0$ 的酸與 $V_n$ 的鹼混合後的酸與鈉
- 物種分率；分母中對 $k$ 的求和即 softmax 正規化
- 重複的 $j$ ⇒ 求和：每個酸分子釋出的質子數 $\bar n$
- 對 $\mathrm{pH} = -\log_{10}h$ 進行二分法，所有酸與體積在同一張量中
- 斜率；其峰值（以 max-pool 找出）即當量點
labels:
  c_acid: 酸濃度 $c_a$
  V0: 酸體積 $V_0$
  c_base: NaOH 濃度 $c_b$
  V_max: NaOH 最大體積
  pKa_weak: 弱酸的 pKa（乙酸 ≈ 4.76）
