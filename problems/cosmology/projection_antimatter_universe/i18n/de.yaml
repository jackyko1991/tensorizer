title: Wo könnte die Antimaterie sein? Kriterien für ein Antimaterie-Universum
summary: Eine spekulative Hypothese, keine gesicherte Physik. Schritt 2 ergab, dass eine einzige Weltlinie, die jeden Zeitschnitt durchquert, gleich viel Materie und Antimaterie liefert, während wir etwa $10^{80}$ Baryonen und keine Antimaterie sehen. Der Ausweg ist eine global ausgeglichene Weltlinie, bei der die Antimaterie weit entfernt oder in einem Spiegeluniversum liegt. Dieser Schritt listet auf, was ein solches Antimaterie-Universum erfüllen muss, und prüft jedes Kriterium an Daten. Es gibt keine Antikerne in der kosmischen Strahlung und keine Annihilations-Gammastrahlung aus Galaxienhaufen. Domänen müssen mindestens so groß wie der Horizont sein, etwa 16 Gpc. Eine zufällige Weltlinie ist fantastisch unwahrscheinlich. Übrig bleibt das CPT-symmetrische Universum von Boyle, Finn und Turok, dessen Vorhersagen (ein masseloses leichtestes Neutrino, $r = 0$) bisher mit den Daten übereinstimmen und scheitern könnten.
notes: 'Status: spekulativ. Dies ist die eigene Hypothese des Autors (siehe die Beschreibung der Serie), keine gesicherte Physik. Schritt 7 der Projektionshypothese, ein Theorieschritt zu Postulat P3 (alle Teilchen sind Projektionen eines einzigen Objekts). Schritt 1 (cosmology/projection_postulate) formulierte die Postulate. Schritt 2 (cosmology/projection_one_particle) schloss die einfachste Form von P3 aus: Eine geschlossene Weltlinie durchquert jeden Zeitschnitt ebenso oft vorwärts (Materie) wie rückwärts (Antimaterie), eine offene fügt höchstens ein Nettoteilchen hinzu, und das Universum enthält etwa $9\times10^{79}$ Baryonen und keine Antimaterie. Die Schritte 3 bis 6 (projection_dimension_budget, projection_singularity_fold, projection_bell_test, projection_telescope_tests) prüften P5, P4 und P1-P2. Dieser Schritt nimmt den Ausweg aus Schritt 2. Die Weltlinie ist global ausgeglichen, und die Antimaterie liegt jenseits unseres Horizonts oder in einem Anti-Universum. Die Frage ist,
  was ein solches Antimaterie-Universum erfüllen muss, um mit den Postulaten übereinzustimmen, und ob es das tut. Zuerst die bekannte Physik. Die Sacharow-Bedingungen (1967) erklären einen Materieüberschuss durch Verletzung der Baryonenzahl, C- und CP-Verletzung und Abweichung vom Gleichgewicht. Sie sagen ein Universum voraus, das überall aus Materie besteht, mit $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (Planck 2018, $\Omega_b h^2 = 0.0224$). Die Alternative, ein symmetrisches Universum mit getrennten Materie- und Antimaterieregionen, wurde ab den 1960er-Jahren untersucht (Alfvén und Klein, Omnès). Steigman (ARA&A 14, 339, 1976) gab einen Überblick über die Tests, und Cohen, De Rújula und Glashow (ApJ 495, 539, 1998) schlossen den Fall für Domänen innerhalb des sichtbaren Universums ab. Alle Daten stammen aus data/antimatter_criteria.csv, das zitierte Zahlen mit ihren Quellen enthält. Die Zahl der Dimensionen $D$, in denen die Weltlinie lebt, ist ein Parameter. Nur ihre Zeitkoordinate geht
  ein, daher hängt kein Ergebnis von $D$ ab. Kriterium 1: keine beigemischte Antimaterie in der Nähe. BESS-Polar fand kein Antihelium unter etwa 48 Millionen Heliumkernen. Die 95-%-Grenze ist Antihelium/Helium $< 6.9\times10^{-8}$ für ein heliumähnliches Spektrum und $1.0\times10^{-7}$ ohne diese Annahme (Abe et al., PRL 108, 131301, 2012). AMS-02 hat keinen Nachweis eines Antikerns veröffentlicht. Gammastrahlung: Im heißen Gas eines Haufens annihiliert ein Antiprotonenanteil $f$ mit der Rate $f\,n_p^2\langle\sigma v\rangle$, mit $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s (eine Wahl der Größenordnung nach). Jede Annihilation liefert 2.1 Photonen oberhalb von 100 MeV im hier verwendeten Pionzerfallsspektrum. Für den Coma-Haufen (Beta-Modell, $n_0 = 3.4\times10^{-3}$ cm$^{-3}$, $r_c = 291$ kpc, $\beta = 0.75$) und die Fermi-LAT-Grenze $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$ (Ackermann et al., ApJ 819, 149, 2016) ergibt das $f < 9\times10^{-8}$. Erfüllt: Jegliche
  Antimaterie muss außerhalb von Haufen und außer Reichweite der kosmischen Strahlung liegen, die auf einige zehn Mpc beschränkt ist. Kriterium 2: keine Domänen innerhalb unseres Horizonts. Würden sich Materie- und Antimateriedomänen der mitbewegten Größe $d$ berühren, wäre Annihilation an ihren Wänden nach der Rekombination unvermeidlich. Das Modell hier ist die einfache Version des Arguments von Cohen, De Rújula und Glashow. Die Wandfläche pro Volumen ist $3/d$ für Würfel der Kantenlänge $d$ ($n/d$ in $n$ Dimensionen, geprüft), und Baryonen strömen mit $\kappa$-facher Schallgeschwindigkeit des Gases in die Wände. Das Gas folgt der CMB-Temperatur bis $z\approx150$ und kühlt dann adiabatisch ab. Jede Annihilation liefert 3 Photonen aus dem Zerfall neutraler Pionen. Die Photonen werden bis heute rotverschoben, $dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$, und dieses Integral wird gegen eine geschlossene Form geprüft. Die Annihilation wird von der Rekombination ($z_{max} = 1000$)
  bis $z = 20$ gezählt. Wie bei CDG werden spätere Epochen weggelassen, weil sie von der Strukturbildung abhängen; sie einzubeziehen würde den Fluss nur erhöhen. Der Fluss ist exakt $\propto 1/d$ (geprüft). Er wird mit dem COMPTEL-Hintergrund verglichen, $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$ von 0.8 bis 30 MeV (Kappadath et al. 1996), und mit dem isotropen Fermi-LAT-Hintergrund ($7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$ oberhalb von 100 MeV, Index 2.32, Abschneideenergie 279 GeV; Ackermann et al., ApJ 799, 86, 2015). Die Photonen von $z\sim20$-$300$ kommen bei 1 bis 10 MeV an, wo COMPTEL die Grenze setzt. Ergebnis: Die Vorhersage übersteigt die Daten um einen Faktor 160 für $d = 100$ Mpc, 16 für 1 Gpc und 1.6 für 10 Gpc. Die minimale Domänengröße ist $d_{min}\approx16$ Gpc (bei 8.5 MeV, $\kappa = 1$), größer als der Radius von 14.3 Gpc des beobachtbaren Universums. CDG kamen zum selben Schluss: Die Materiedomäne muss nahezu das gesamte
  sichtbare Universum umfassen. Dies ist ein Spielzeugmodell, und $d_{min}$ skaliert mit $\kappa$. CDG argumentieren, dass die Aufheizung durch Annihilation den Zustrom beschleunigt, was die Schranke verschärft. Eingeschränkt: Jegliche Antimaterie muss jenseits unseres Horizonts liegen, wo kein Teleskop sie prüfen kann. Kriterium 3: Feinabstimmung. Angenommen, die Antimaterie liegt jenseits des Horizonts auf demselben Schnitt, und nichts ordnet sie an. Eine ausgeglichene zufällige Weltlinie gibt unserem Bereich dann eine Nettoladung der Größenordnung $\sqrt M$ bei $M$ Durchgängen. Die Varianz der Nettoladung ist gleich $M$, oder $M(T-M)/(T-1)$, wenn die Gesamtheit der $T$ Durchgänge ausgeglichen ist (beides geprüft). Die Wahrscheinlichkeit eines großen Überschusses folgt der Cramér-Ratenfunktion, $\log_{10}P\approx -M\,\mathrm{KL}/\ln10$, geprüft gegen den exakten Binomialschwanz. Heute sehen wir $N_B\approx9\times10^{79}$ Baryonen und keine Antimaterie, also muss jeder Durchgang dasselbe
  Vorzeichen haben: $P = 2^{-N_B}$, $\log_{10}P\approx-2.7\times10^{79}$. Liest man es stattdessen als Überschuss des frühen Universums von $9\times10^{79}$ unter etwa $1.5\times10^{89}$ Paaren (eines pro Photon), so ist $\log_{10}P\approx-1.2\times10^{70}$. Ohne Mechanismus scheitert die ausgeglichene Weltlinie. Der Mechanismus müsste eine Randbedingung sein, die die Vorzeichen aller Durchgänge in unserem Bereich korreliert: eine Symmetrie, keine Fluktuation. Kriterium 4: das CPT-symmetrische Universum. Boyle, Finn und Turok (PRL 121, 251301, 2018) schlagen vor, dass das Universum nach dem Urknall das CPT-Spiegelbild eines Universums vor ihm ist, sodass das Paar als Ganzes CPT nicht verletzt. Es folgt die Zuordnung des Autors von P3 zu diesem Modell. Eine Weltlinie, die $t = 0$ durchquert, ist auf unserer Seite Materie. Beobachter im Spiegel haben den entgegengesetzten Zeitpfeil, also sehen sie dasselbe Stück als Antimaterie. Der in Schritt 2 bewiesene Vorbehalt gilt weiterhin: Auf jedem
  vollständigen Schnitt hat eine zusammenhängende Weltlinie $|Q|\leq1$, also hilft der Spiegel allein nicht. Die Zuordnung funktioniert, wenn sich die Weltlinie durch den Urknall und durch den zukünftigen Rand windet, wobei die beiden Enden der konformen Zeit miteinander verklebt sind. Das ist eine zusätzliche Annahme über das veröffentlichte Modell hinaus und die Erweiterung C aus Schritt 2 an neuer Stelle. Eine Schleife, die sich $w$-mal windet, liest sich als $+w$ auf jedem Schnitt unserer Seite und als $-w$ auf jedem Spiegelschnitt, gelesen mit dem eigenen Zeitpfeil des Spiegels. Die Summe ist null (geprüft). Der Überschuss ist nun eine topologische ganze Zahl, keine Fluktuation, auch wenn $w\approx10^{80}$ weiterhin von Hand eingesetzt wird. Die veröffentlichten Vorhersagen des Modells (aus dem Abstract von Boyle, Finn und Turok), geprüft an zitierten Zahlen: (a) Das leichteste Neutrino ist masselos. Mit den NuFIT-6.0-Aufspaltungen ($\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$, $\Delta
  m^2_{31} = 2.513\times10^{-3}$ eV$^2$ normal, $\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ invertiert) legt dies $\Sigma m_\nu = 0.0588$ eV (normale Massenordnung) oder $0.0989$ eV (invertiert) fest, sowie $m_\beta = 0.009$ oder $0.049$ eV. KATRIN begrenzt $m_\beta$ auf unter 0.8 eV (Nature Physics 18, 160, 2022) und 0.45 eV (Science 388, 180, 2025), weit oberhalb beider Werte. Planck 2018 liefert $\Sigma m_\nu < 0.12$ eV, was beide zulässt. DESI 2024 ($< 0.072$ eV) und DESI DR2 ($< 0.064$ eV, $\Lambda$CDM) schließen den invertierten Fall aus und lassen den normalen zu. DESI DR2 weist außerdem auf eine Spannung mit der Untergrenze aus den Oszillationen hin, und ein masseloses leichtestes Neutrino ist der Fall mit der geringsten Spannung. (b) Dunkle Materie ist ein stabiles rechtshändiges Neutrino der Masse $4.8\times10^8$ GeV. Das liegt weit jenseits jedes Beschleunigers und erzeugt kein Signal in direkten Nachweisexperimenten, kann also derzeit nicht geprüft werden. (c) Es gibt keine
  primordialen Gravitationswellen, also $r = 0$. BICEP/Keck liefert $r < 0.036$ (95 %, PRL 127, 151301, 2021), was damit vereinbar ist. Der eigentliche Test ist $\sigma(r)\sim10^{-3}$: das Ziel von CMB-S4 (das Projekt wurde im Juli 2025 eingestellt), und nun von LiteBIRD und dem Simons Observatory. Urteilstabelle. (1) Nichts in der Nähe beigemischt: erforderlich; erfüllt. Ein einziger Antiheliumkern oder Annihilations-Gammastrahlung aus einem Haufen würde es falsifizieren. (2) Keine Domänen innerhalb des Horizonts: erforderlich; eingeschränkt ($d\gtrsim16$ Gpc). Ein Überschuss im MeV-Hintergrund oder eine CMB-Verzerrung durch nähere Wände würde es falsifizieren; jenseits des Horizonts ist es nicht prüfbar. (3) Nicht feinabgestimmt: erforderlich; scheitert für eine zufällige Weltlinie ($\log_{10}P\sim-10^{70}$ bis $-10^{79}$), und nur ein Mechanismus beseitigt das Problem. (4a) Leichtestes Neutrino masselos: eingeschränkt, bisher vereinbar. Eine gemessene leichteste Masse über null falsifiziert
  es, zum Beispiel $\Sigma m_\nu$ deutlich über 0.0588 eV bei normaler Massenordnung. (4b) Dunkle Materie aus schweren rechtshändigen Neutrinos: derzeit nicht prüfbar. Würde die Dunkle Materie als etwas anderes identifiziert, wäre es falsifiziert. (4c) $r = 0$: vereinbar. Primordiale B-Moden mit $r\gg10^{-3}$ würden es falsifizieren. Fazit: Das erweiterte P3 überlebt nur als eine Weltlinie, die über ein CPT-Spiegeluniversum hinweg ausgeglichen ist und sich durch den Urknall windet. In dieser Form erbt es falsifizierbare Vorhersagen. Eine von null verschiedene Masse des leichtesten Neutrinos oder primordiale B-Moden mit $r\gg0$ würden die Zuordnung zum CPT-Spiegel falsifizieren. Frühere Schritte reproduzierten entweder die Standardphysik oder trafen auf Daten, die die Hypothese auffangen konnte. Dies ist der erste Schritt der Serie mit einem Test, der scheitern könnte.'
meanings:
- 'wiederholtes $z$ ⇒ summiert: diffuse Gammastrahlungsintensität heute für jede Domänengröße $d$ und Photonenenergie $E$'
- 'Annihilationen pro mitbewegtem cm$^3$ und Sekunde an den Wänden: Wandfläche pro Volumen $3/d$ mal Zustrom $n_b v$'
- Photonen pro MeV aus einer Annihilation bei der emittierten Energie; wiederholtes $j$ (Pionenergie) ⇒ summiert
- kleinste Domänengröße, die die COMPTEL- und Fermi-LAT-Hintergründe zulassen (der Fluss ist exakt $\propto 1/d$)
- größter Antiprotonenanteil im Gas des Coma-Haufens, aus der Fermi-LAT-Flussgrenze
- Nettoladung von $M$ Durchgängen mit zufälligen Vorzeichen; ihre Varianz ist $M$
- Wahrscheinlichkeit, dass eine zufällige Weltlinie unserem Bereich eine Nettoladung $Q$ aus $M$ Durchgängen gibt (Cramér-Ratenfunktion)
- Nettoladung auf unseren Schnitten und auf ihren CPT-Bildern, jeweils mit dem eigenen Zeitpfeil gelesen; wiederholtes $s$ (Segment) ⇒ summiert
- Summe der Neutrinomassen aus der leichtesten Masse $m_l$ und den NuFIT-Aufspaltungen
labels:
  dims: Dimensionen $D$ des Raums, in dem die Weltlinie lebt (offen)
  speed_factor: Zustromgeschwindigkeit in die Wände $\kappa$, in Einheiten der Schallgeschwindigkeit des Gases
  z_max: Rotverschiebung $z_{max}$, bei der die Annihilation an den Wänden beginnt (Rekombination)
  winding: Windungszahl $w$ der Weltlinie durch den Urknall
