source_hash: 63ac7ba591c6
title: 一个粒子被看见许多次：切割单一世界线
summary: 这是一个推测性假说，并非已确立的物理：每个电子都是同一个物体，是一条在时间中来回曲折的世界线（Wheeler 1940 年的单电子宇宙）。一个时间切片会多次切过它：向前的穿越看起来像电子，向后的则像正电子。本步骤切割成批的随机世界线。所有电子都完全相同，而在转折点处会产生并湮灭粒子对。但一条闭合世界线穿过每个切片时，向后与向前的次数一样多，而一条开放世界线最多只增加一个净粒子，然而宇宙中约有 $10^{80}$ 个重子，且几乎没有反物质。这个想法的最简单形式已被排除。
notes: 状态：推测性；其最简单形式已被排除。这是投影假说（作者本人的推测性想法，见系列说明；并非已确立的物理）的第 2 步，对应公设 P3：所有粒子都是同一个物体的投影。第 1 步（cosmology/projection_postulate）陈述了公设；第 3 步（cosmology/projection_dimension_budget）计算它们所需的维度。先讲已知的物理。1940 年在一通电话中，John Wheeler 向 Richard Feynman 提出：所有电子之所以相同，是因为它们是同一个电子，其世界线在时间中向前又向后；向后的一段就是正电子。Feynman 在 1965 年的诺贝尔演讲中讲述了这个故事，连同他自己的反驳：正电子的数目并不像电子那么多。Wheeler 提出它们也许藏在质子之中。正电子是在时间中倒行的电子这一想法，作为反粒子的 Feynman–Stueckelberg 图像保留了下来（Feynman, Phys. Rev. 76, 749, 1949），但单电子宇宙没有：在量子场论中，所有电子之所以相同，是因为它们是同一个场的激发。这里世界线存在于 $D$ 维空间中（$D$ 是一个参数，从不固定为 4）；正如 P2 所说，对切片而言只有它的时间坐标重要。假说的预测：一个时间切片（P2）在 $N_+$ 个向前与 $N_-$ 个向后的穿越处切过世界线。计算内容：成批的平滑（随机傅里叶，$K$ 个谐波，振幅 $\propto k^{-\beta}$）与粗糙（布朗）世界线，闭合或开放，被 $L$ 个切片切割。穿越次数以散射到差分数组的方式计数，并对照暴力穷举表作检验。对闭合回路，每个切片上都有 $N_+ = N_-$；对开放世界线，$Q = N_+ - N_-$ 等于 $[t_{end}\geq u] - [t_{start}\geq u]$，因此 $|Q|\leq 1$ 且 $N\equiv Q$（mod 2）。倾斜切片（一个运动中的观察者）不会改变 $Q$。总计数等于切片以下的 $2(\#\text{minima} - \#\text{maxima})$，因此粒子对在 $t(s)$ 的极小值处诞生、在极大值处消亡。随机平滑回路的平均计数服从 Rice 公式。它免费做对的部分：每次穿越读到的都是同一条世界线的质量与电荷，所以所有电子完全相同，而正电子的电荷恰好相反、质量相同（PDG
  2024：$|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$，$|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$）。与数据的对照（data/*.csv，引用的数字）：AMS-02 测量了 0.5 GeV 到 1 TeV 的宇宙线正电子比例 $e^+/(e^+ + e^-)$（Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0，经 CRDB 数据库取得 74 个区间）：0.6 GeV 处为 0.13，约 8 GeV 处有最小值 0.053，200 GeV 以上为 0.15 到 0.16。因此不对称度 $1 - 2f$ 介于 0.67 与 0.89 之间，而闭合回路给出 $0$。在宇宙尺度上，Planck 2018 的重子密度 $\Omega_b h^2 = 0.0224$ 给出 $\eta = n_B/n_\gamma = 6.1\times10^{-10}$（见 cosmology/baryon_asymmetry）。以每 cm$^3$ 411 个光子、半径 465 亿光年的球体计算，这相当于 $N_B\approx 9\times10^{79}$ 个重子，而且反物质不存在（BESS-Polar：反氦/氦低于 $6.9\times10^{-8}$；Cohen、De Rújula 与 Glashow 1998：可见宇宙中没有反物质区域）。单一世界线最多给出 $|Q|/N = 1/N$，当 $N\approx 1.5\times10^{89}$ 时为 $7\times10^{-90}$，而 $\eta = 6\times10^{-10}$；净电荷差了约 $10^{80}$ 倍。对开放参数的扫描（平滑或布朗、闭合或开放、2 到 32 个谐波、三种粗糙度，约 $3\times10^5$ 个 $N\geq 2$ 的切片）没有找到任何能达到 AMS-02 不对称度的配置，而上界说明不可能有：当穿越次数 $N\geq 2$ 时，最大可能的不对称度是 $1/3$（在 $N = 3$ 时）。结论：其最简单形式已被排除。扩展，每一项都是额外的假设，并如此标明：(A) 开放世界线增加一个净粒子，仅此而已。(B) 有偏的投影，即观察者以效率
  $r$ 看见反粒子，根据 AMS-02 需要 $r = f/(1-f)$ 介于 0.056 与 0.195 之间且随能量变化，但根据反氦则需要 $r < 7\times10^{-8}$。隐藏的反物质于是会与可见重子一样重，约为暗物质的 0.19。这是现代形式的 Wheeler「藏在质子之中」；它需要一个机制，而目前并未给出。(C) 如果时间是一个圆，绕了 $w$ 圈的回路在每个切片上都会带有净电荷 $Q = w$（已检验），但 $w\approx 10^{80}$ 必须人为放入，而紧致的时间意味着闭合类时曲线。这些都不是预测。能使这个想法复活的，是一个让单一物体的切片计数变得不对称的机制，而这正是本步骤留给本系列的未解问题。 逃脱路线：简单版本已被排除，但一条在整体上平衡的世界线，若反物质位于我们的视界之外或位于 CPT 镜像反宇宙中，则尚未被排除。第 7 步（cosmology/projection_antimatter_universe）列出这样的反物质宇宙必须满足的判据，并逐一用数据检验。
meanings:
- 重复的 $k$（谐波）与 $c$（cos、sin）⇒ 求和：$D$ 维中的 $B$ 条随机世界线；坐标 0 是时间
- 每个切片的向前（粒子）与向后（反粒子）穿越；对线段 $s$ 的求和是散射到差分数组再加上累积和
- 切片上的净电荷；等于两个端点的穿越数，闭合回路为 $0$
- 仅由转折点得到的同一计数：极小值产生粒子对，极大值使其湮灭
- Rice 公式，谱矩为 $\lambda_0 = \sum_k\sigma_k^2$、$\lambda_2 = \sum_k k^2\sigma_k^2$
- 由能量 $E$ 处的 AMS-02 正电子比例 $f_E$ 得到的宇宙线 $e^\pm$ 电荷不对称度
- 一条世界线必须携带的净重子数（$\eta$ 取自 Planck 2018）
labels:
  worldlines: 批次中的世界线数 $B$
  samples: 每条世界线上的采样点数 $S$
  modes: 每个坐标的谐波数 $K$（它能曲折的频繁程度）
  roughness: 粗糙度 $\beta$：谐波 $k$ 的振幅 $\propto k^{-\beta}$
  dims: 世界线所在空间的维数 $D$（开放）
  slices: 时间切片数 $L$
