source_hash: f068882719e2
title: 'फ़ाइनमैन आरेख: डिरैक ट्रेस से $e^+e^- \to \mu^+\mu^-$'
summary: 'सबसे सरल QED आरेख: एक इलेक्ट्रॉन और एक पॉज़िट्रॉन विलोपित होकर एक आभासी फ़ोटॉन बनाते हैं, जो एक म्यूऑन युग्म उत्पन्न करता है। फ़ाइनमैन नियम चित्र को आयाम (amplitude) में बदलते हैं, स्पिन योग उसे $4\times4$ डिरैक आव्यूहों $\gamma^\mu$ के ट्रेस में बदलते हैं, और हर ट्रेस एक einsum है। ऊर्जा बदलते जाने पर दिखता है कि कोणीय आकृति देहली पर समदैशिक से $1 + \cos^2\theta$ में बदलती है, और प्रकीर्णन अनुप्रस्थ-काट $4\pi\alpha^2/3s$ की तरह घटता है।'
notes: 'आरेख एक बार बनाया जाता है, पर कोड कभी स्पिनर नहीं बनाता: स्पिनों पर योग करने से $u\bar u$ की जगह $\not p + m$ आ जाता है, इसलिए पूरी गणना $\gamma$ आव्यूहों के गुणनफल और ट्रेस बन जाती है, जिन्हें einsum सभी ऊर्जाओं और कोणों के लिए एक साथ करता है। परिणाम $m_e \to 0$ के लिए $\overline{|\mathcal M|^2} = e^4\big[1 + 4m^2/s + (1 - 4m^2/s)\cos^2\theta\big]$ है: देहली पर धीमे म्यूऑन समदैशिक रूप से निकलते हैं, उससे बहुत ऊपर फ़ोटॉन का स्पिन 1 और हेलिसिटी संरक्षण $1 + \cos^2\theta$ देते हैं। कुल $\sigma$ $\sqrt s = 2m$ से तेज़ी से बढ़ता है और फिर $1/s$ की तरह घटता है, 1 GeV पर लगभग $86.8$ nb। PETRA और LEP के वास्तविक आँकड़े $\sqrt s \approx 30$ GeV तक इस वक्र का अनुसरण करते हैं, जहाँ फ़ोटॉन की जगह $Z$ बोसॉन वाला दूसरा आरेख व्यतिकरण करता है और अग्र–पश्च असममिति $A_{FB}$ को शून्येतर बना देता है; शुद्ध QED $A_{FB} = 0$ देती है। $\tau$ युग्म आज़माइए, जिसकी खोज 1975 में SPEAR पर उसकी 3.55 GeV देहली के ठीक ऊपर हुई थी।'
meanings:
- 'डिरैक आव्यूह: सूचकांक $\mu$ दिक्काल का है, $a, b$ स्पिनर सूचकांक हैं; $\{\gamma^\mu, \gamma^\nu\} = 2\eta^{\mu\nu}$'
- मिंकोव्स्की मीट्रिक diag(1, −1, −1, −1), $\hbar = c = 1$ वाली इकाइयाँ
- हर ऊर्जा $\sqrt s$ और कोण $\theta$ के लिए $e^-$, $e^+$, $\ell^-$, $\ell^+$ के द्रव्यमान-केंद्र चतुर्संवेग
- 'फ़ाइनमैन स्लैश: स्पिन योग $\sum u\bar u = \not p + m$ और $\sum v\bar v = \not p - m$'
- 'दोहराए गए $a, b, c, d$ ⇒ योग: इलेक्ट्रॉन रेखा का ट्रेस (म्यूऑन रेखा के लिए वही फ़ंक्शन)'
- '$\eta$ से म्यूऑन सूचकांक नीचे करके संकुचन: फ़ोटॉन प्रसारक (propagator) दोनों रेखाओं को जोड़ता है'
- फ़्लक्स और कला-समष्टि गुणक; $(\hbar c)^2$ GeV$^{-2}$ को nb में बदलता है
- कुल अनुप्रस्थ-काट; $\frac{4\pi\alpha^2}{3s}\beta\,(1 + 2m^2/s)$, $\beta = \sqrt{1 - 4m^2/s}$ से तुलना
labels:
  final: अंतिम अवस्था
  sqrt_s_max: अधिकतम ऊर्जा $\sqrt s$
