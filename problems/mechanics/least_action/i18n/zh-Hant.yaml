source_hash: 31fa57e56a24
title: 最小作用量原理：以梯度下降尋找路徑
summary: 把路徑切成端點固定的點 $q_n$，將作用量 $S = \sum_n L\,\Delta t$ 寫成一個張量運算式，讓自動微分與最佳化器把一批錯誤的猜測沿下坡推動，直到 $\partial S/\partial q_n = 0$。它們最終落在拋體的拋物線或振子的正弦曲線上。
notes: 這裡大自然並不是一步一步向前積分：整條路徑同時調整，而且事先知道起點與終點。令 $\partial S/\partial q_n = 0$ 得到 $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 = -V'(q_n)$，即離散的歐拉–拉格朗日方程式，恰好就是 Verlet 格式；在均勻重力下它重現拋物線直到捨入誤差，對振子則精確到 $O(\Delta t^2)$。這個原理其實是穩定作用量原理：對振子而言，黑塞矩陣的最小特徵值約為 $m\Delta t\,(\pi^2/T^2 - \omega^2)$，所以一旦 $T$ 超過半個週期 $\pi/\omega$，真實路徑就是 $S$ 的鞍點，梯度下降會發散，程式於是改用牛頓步 $x \leftarrow x - \alpha H^{-1}\nabla S$，它能找到任何穩定點。平滑而長的擺動弛豫得最慢（對應最小的黑塞特徵值）；短的擺動在幾次迭代內就消失。
meanings:
- 試探路徑 $b$ 在時間 $t_n = n\,\Delta t$ 的位置；$q_{b0}$ 與 $q_{bN}$ 固定
- 對角線上為 $-1$，其右側為 $+1$：$(Dq)_n = q_{n+1} - q_n$
- 重複的 $k$ ⇒ 求和：每條路徑每一步的速度
- 動能減位能，對各步求和；$V$ 取在每一步的左端點
- 對內部自由點的梯度；各路徑彼此獨立，所以一次反向傳播即可同時處理
- 帶動量的梯度下降，$\eta = 0.8\,\Delta t/m$
- 黑塞矩陣：三對角，對角線為 $2m/\Delta t - V''\Delta t$，兩側為 $-m/\Delta t$
- 離散歐拉–拉格朗日方程式 $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 + V'(q_n)$，即 Verlet 格式；$\partial S/\partial q_n = -\Delta t\,r_n$
labels:
  system: 系統
  method: 方法
  T: 總時間 $T$
  omega: 振子頻率 $\omega$
  q_start: 起點 $q_0$
  q_end: 終點 $q_N$
  n_steps: 時間步數 $N$
  n_paths: 試探路徑數
  wiggle: 試探路徑的擺動幅度
  n_iter: 迭代次數
