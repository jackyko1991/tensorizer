source_hash: a69998e36eef
title: 가케야 추측
summary: 바늘은 넓이가 임의로 작은 집합 안에서 모든 방향으로 돌릴 수 있습니다. 이 문제에서는 그런 집합(옆으로 밀어 놓은 $2^k$개의 가는 삼각형으로 이루어진 페론의 나무)을 만들고, 그 넓이를 행마다 정확히 잽니다. 이어서 $\mathbb R^2$, $\mathbb R^3$, $\mathbb R^4$에서 $\delta$-관들의 합집합을 $\delta$-정육면체로 덮어 그 차원을 추정합니다. 가케야 추측은 그런 집합도 여전히 완전한 차원 $n$을 가진다고 말합니다. 이는 $n = 2$에 대해, 그리고 2025년부터는 $n = 3$에 대해 증명되었습니다. $n \ge 4$에 대해서는 지금까지의 증명이 검증되지 않은 AI 생성 주장뿐입니다.
notes: '가케야는 1917년, 단위 길이 바늘을 한 바퀴 돌릴 수 있는 최소 넓이가 얼마인지 물었습니다. 베시코비치(1919, 1928)는 모든 방향의 단위 선분을 포함하는 집합이 측도 0일 수 있음을 발견했고, 페론(1928)은 그 구성을 여기 그려진 나무로 단순화했습니다. 삼각형을 $2^k$개의 가는 조각으로 자르고 옆으로 미세요. 각 조각은 자신의 방향들을 유지하고, 페론 단계를 한 번 거칠 때마다 겹침이 커집니다. 넓이는 $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$를 만족하며(확인됨), 24개의 값을 한꺼번에 시도해 찾은 최적의 $\alpha$에서는 넓이가 $\ln k / k$처럼 줄어듭니다. 코르도바(1977)는 평면 가케야 집합의 $\delta$-근방의 넓이가 적어도 $c / \log(1/\delta)$임을 증명했으므로 이 느린 감소는 피할 수 없으며, 데이비스(1971)는 모든 평면 가케야 집합의 하우스도르프 차원과 민코프스키 차원이 2임을 증명했습니다. 60°씩 돌린 나무 세 개는 모든 방향의 단위 바늘을 포함합니다(빨간 바늘이 180°를 쓸고 지나갑니다). 팔의 기법으로 위치들을 이어 주면 바늘이 원하는 만큼 작은 넓이의 집합 안에서 실제로 회전할 수 있습니다. $\mathbb R^n$에서 가케야 집합 추측은 그러한 모든 집합이 차원 $n$을 가진다고 말합니다. $\delta$-분리된 방향의 반지름 $\delta$인 관들은 많이 겹칠 수 없으므로, 그 합집합의 부피는 $\gtrsim_\varepsilon \delta^{\varepsilon}$입니다. 오른쪽 패널은 두 가지 배치(모든 관이 원점을 지나는 경우와 중심이 무작위인 경우)에 대해 $\delta$-정육면체를 셉니다. $\log(1/\delta)$에 대한 $\log N$의 기울기는 각 경우 $n$에 가까워지며, 추측이 참이라면 마땅히 그래야 합니다. 컴퓨터는 특정한 배치만 시험할 수 있을 뿐, 결코 모든 배치를 시험할 수는 없습니다. 현황(2026년
  11월): $n = 2$ 증명됨(데이비스 1971). $n = 3$은 볼프의 하한 $(n+2)/2$(1995)와 카츠–와바–타오의 결과에 이어 훙 왕과 조슈아 잘이 증명했습니다(2025년 프리프린트). $n \ge 4$에 대해서는 심사를 거친 문헌에서 미해결 문제입니다. OpenAI가 공개한 AI 생성 원고 모음(github.com/openai/math, 074군과 079군)은 4차원의 경우를, 그리고 소기의 국소 평활화 추측을 통해 모든 차원을 주장합니다. 저장소에는 일부 명제가 Lean으로 형식화되었다고 적혀 있지만, 이는 심사를 거치지 않은 기계 생성 주장으로서 여전히 수학계의 검토를 기다리고 있으므로, 이 페이지는 이를 증명된 것이 아니라 주장된 것으로 취급합니다. 이 추측은 기하학을 훨씬 넘어서는 의미가 있습니다. 조화해석학의 푸리에 제한 추측과 보흐너–리스 추측으로부터 이 추측이 따라 나옵니다.'
meanings:
- '꼭짓점이 $(0, 1)$이고 밑변 $[b_i, b_i + w_0]$들이 $[-1/\sqrt3, 1/\sqrt3]$를 나누는 $N = 2^k$개의 가는 삼각형: 60° 방향 원뿔이며, 모든 변의 길이는 $\ge 1$'
- $k$번의 페론 단계 뒤의 수평 이동량, $\alpha$의 $A$개 값에 대해 한꺼번에; 매 단계마다 이웃한 '심장부'가 맞닿게 하고 오른쪽 것을 $(1-\alpha)(c - a)$만큼 왼쪽으로 밉니다
- 삼각형 $i$가 높이 $y$의 수평선과 만나는 곳
- 각 행의 구간들을 왼쪽 끝으로 정렬하면, 오른쪽 끝의 누적 최댓값이 이미 덮인 부분을 알려 줍니다
- '반복된 $i$와 $y$ ⇒ 합산: 각 행의 정확한 합집합 길이를 행들에 대해 평균(중점 규칙)'
- '정육면체 $[-1,1]^n$의 면 위의 $\delta$-격자를 구면으로 밀어낸 것: 대략 $\delta$-분리된 직선 방향들'
- 각 관이 지나는 한 변 $\delta$인 정육면체들, 관을 따라 $\delta/2$마다 표본 추출
- '반복된 $i$ ⇒ 합산: 정육면체마다 정수 키 하나, 그래서 서로 다른 정육면체를 세는 일은 정렬 한 번입니다'
- '반복된 $j$ ⇒ 합산: 0°, 60°, 120° 돌린 나무 세 개가 모든 방향을 덮습니다'
labels:
  k_max: 페론 단계 $k$ ($2^k$개 삼각형)
  n_max: 차원 $n$까지의 관
