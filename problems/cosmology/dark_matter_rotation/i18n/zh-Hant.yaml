source_hash: 9483d7c492cb
title: 星系旋轉曲線與暗物質
summary: 遠離星系中心的恆星與氣體轉得太快：SPARC 資料庫的真實旋轉曲線在可見質量預測克卜勒式下降的地方仍保持平坦。一次批次 autograd 擬合同時處理所有星系，比較四種解釋：只有重子（帶質光比 $\Upsilon$）、重子加 NFW 暗物質暈、重子加有核心的 Burkert 暈，以及只用單一加速度 $a_0$ 的 MOND（徑向加速度關係）。暗物質是由重力推斷的，並未被直接偵測到。
notes: 資料：SPARC（Lelli、McGaugh 與 Schombert 2016，AJ 152, 157）中的六個星系（NGC 3198、NGC 2403、NGC 6503、DDO 154、UGC 2885、NGC 7814），檔案 Rotmod_LTG，原樣複製到 data/sparc_rotation_curves.csv。來源 http://astroweb.cwru.edu/SPARC/，要求引用 SPARC 論文；Zenodo 上的鏡像（doi:10.5281/zenodo.16284118）以 CC-BY-4.0 發布。3.6 μm 的質光比帶有寬 0.1 dex 的先驗，中心為 $\Upsilon_d = 0.5$、$\Upsilon_b = 0.7$（把先驗設為 0 即可關閉）。擬合顯示：沒有任何合理的 $\Upsilon$ 能讓重子達到外圍平坦的速度（DDO 154 需要 $\Upsilon_d \approx 19$，遠超任何恆星族群），所以需要看不見的質量或修改的動力學，正如 Rubin 與 Ford 在 1970 年代以光學光譜發現的。兩種暈的形狀都擬合得很好；矮星系 DDO 154 偏好有核心的暈（尖峰–核心問題）。單一的 $a_0 \approx 1.1\times10^{-10}$ m/s² 出奇地好地描述所有星系，正如徑向加速度關係所說。誠實的現狀：暗物質是由其重力推斷的（旋轉曲線、重力透鏡、星系團、宇宙微波背景、結構形成）；尚未直接偵測到任何暗物質粒子。MOND 用一個參數就能很好地擬合旋轉曲線，但在星系團、子彈星系團與宇宙微波背景聲學峰上遇到困難，也沒有公認的相對論版本。此處距離與傾角固定（其誤差未傳遞），MOND 採用最簡單的代數形式。
meanings:
- 星系 $g$ 在半徑 $r$ 的觀測速度與誤差，補齊到最長的曲線
- 真實資料點（1）或補齊（0）
- 速度平方相加；$\Upsilon$ 縮放 SPARC 的盤與核球（以 $\Upsilon = 1$ 計算）
- 冷暗物質模擬得到的尖峰暈，$\rho \propto 1/(x(1+x)^2)$
- 有核心的暈，$\rho \propto 1/((1+x)(1+x^2))$
- 所有星系共用一個函數與一個 $a_0$；沒有暈
- 重複的 $r$ ⇒ 對每個星系的真實資料點求和
- 所有模型與星系合成一個純量：一次反向傳播得到所有梯度（先 Adam，再 L-BFGS）
labels:
  iterations: L-BFGS 之前的 Adam 迭代次數
  lr: Adam 學習率
  prior_dex: $\Upsilon$ 先驗的寬度（dex，0 = 不用）
