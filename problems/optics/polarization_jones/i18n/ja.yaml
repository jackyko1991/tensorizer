title: ジョーンズ行列による偏光
summary: 光の偏光は複素2元ベクトル $(E_x, E_y)$ であり、偏光子や波長板はそれぞれ複素 $2\times 2$ 行列である。光が波長板を通り、次に回転する偏光子を通る：$\mathbf E$ 場の楕円と透過強度が einsum から得られ、マリュスの法則が再現され、直線偏光が円偏光に変わる。
notes: 光は入力角の直線偏光、強度 $I_0 = 1$ で出発する。右の灰色の破線はマリュスの法則 $I_0\cos^2\theta$（波長板なし）で、青い曲線は波長板を通過した後の強度である。入力に対して 45° の1/4波長板は円偏光をつくる（$\lvert E_x\rvert$ と $\lvert E_y\rvert$ が等しく、位相が 90° ずれる）ので、どの偏光子角でも $I_0/2$ が通過する。角度 $\alpha$ の1/2波長板は直線偏光を $2\alpha$ だけ回転させる。1つのジョーンズベクトルは常に完全偏光である。非偏光は、直交する2つの入力の強度を平均することで扱う（main.py が表示する3枚偏光子の検証で使用）。
meanings:
- ジョーンズベクトル：$E_x$ と $E_y$ の複素振幅（位相差が形を決める）
- 実験室座標系を素子自身の軸に回転させる
- 角度 $\theta$ の透過軸方向の場だけを残す
- 遅相軸を $\Gamma$ だけ遅らせる：$\Gamma = \pi/2$ で1/4波長板、$\Gamma = \pi$ で1/2波長板
- 素子を連結する（繰り返される $j$ について和）；光が最初に出会う素子が右
- 光を光学系に通す
- 繰り返される $i$ ⇒ 和をとる：強度
- 1周期にわたる実際の場：偏光楕円を描く
labels:
  plate: 波長板
  plate_angle: 波長板の進相軸 $\alpha$
  input_angle: 入力偏光角
