source_hash: b1a74b85fb17
title: 'Registro de nubes de puntos: la cadena de PCL (FPFH, RANSAC, ICP)'
summary: 'Dos escaneos 3D parciales del mismo objeto, tomados desde dos puntos de vista y desplazados por un movimiento rígido desconocido, se alinean como lo hace la Point Cloud Library (PCL), escrita en PyTorch por lotes: submuestreo con rejilla de vóxeles, eliminación estadística de valores atípicos, normales a partir de covarianzas de vecindad, descriptores FPFH, RANSAC sobre correspondencias de descriptores (miles de ajustes de Kabsch a la vez) y refinamiento ICP, punto a punto y punto a plano, desde varios arranques. El resultado se compara con el movimiento conocido: error de rotación en grados, error de traslación y RMSE.'
notes: 'El objeto de demostración es la vaca «Spot» de Keenan Crane (5856 triángulos), que su autor liberó al dominio público (CC0 1.0; https://www.cs.cmu.edu/~kmcrane/Projects/ModelRepository/, incluida como data/spot_vertices.csv y data/spot_faces.csv, véase data/SOURCES.md; Crane, Pinkall y Schröder 2013, ACM TOG 32(4)). No usamos el conejo de Stanford: el Stanford 3D Scanning Repository permite el uso en investigación y la redistribución gratuita, pero dice que los modelos no deben usarse con fines comerciales ni aparecer en un producto a la venta sin permiso, lo que no está claro para un proyecto abierto que podría tener más adelante una versión de pago. El archivo de prueba bunny.pcd de PCL procede del mismo escaneo de Stanford y no lleva una licencia de datos propia (la licencia BSD de PCL cubre su código). Los escaneos son sintéticos: muestras aleatorias densas de la superficie de la malla, conservadas solo donde un escáner las ve (prueba de cara trasera más un z-buffer, es decir,
  eliminación de puntos ocultos), con ruido gaussiano $\sigma$, unos pocos por ciento de valores atípicos uniformes y un movimiento rígido aleatorio (30–60°, la mitad del tamaño del objeto) aplicado al escaneo B. El tamaño del objeto es la diagonal de su caja envolvente, escalada a 1. Cadena (nombres de clases de PCL entre corchetes): VoxelGrid; StatisticalOutlierRemoval; NormalEstimation con $k = 15$ vecinos y la normal orientada hacia el punto de vista de cada escaneo; FPFH con $k = 25$; correspondencias mutuas más cercanas en el espacio de descriptores; RANSAC con 4000 hipótesis, cada una de 3 correspondencias cuyos lados del triángulo coinciden dentro del 10 % (como el CorrespondenceRejectorPoly de PCL), ajustada por Kabsch y puntuada por el número de inliers, y luego reajustada sobre ellos; ICP desde 6 copias perturbadas de la pose de RANSAC, contra el objetivo submuestreado a la mitad del tamaño de vóxel, ignorando los pares a más de un vóxel. Simplificaciones: FPFH usa una vecindad
  fija de $k$ puntos en lugar de un radio, toma siempre el punto consultado como origen del marco de Darboux (PCL elige el orden del par según los ángulos de las normales) y normaliza cada bloque de 11 casillas a 100; la rejilla de vóxeles solo promedia posiciones. Lo que muestra la ejecución por defecto: unos 12000 puntos visibles por escaneo quedan en unos 1650 tras los dos filtros; 365 correspondencias FPFH mutuas, de las que RANSAC conserva 73 (alrededor del 20 %), dan una pose aproximada con 6,4° y 0,056 de error; el ICP punto a plano llega después a 0,37° y 0,0021 (0,2 % del tamaño del objeto, RMSE 0,007) en unas 5 iteraciones desde cada arranque, mientras que el punto a punto sigue deslizándose por la superficie tras 25 iteraciones (unos 2,1°, 0,018), porque los vecinos más cercanos en una superficie parcial y remuestreada lo arrastran de lado. Las pruebas comprueban que Kabsch es exacto, que un movimiento compuesto con su inverso es la identidad, que las normales de un plano y de
  una esfera son correctas, que la rejilla de vóxeles coincide con una referencia lenta, que se eliminan los atípicos lejanos, que FPFH es invariante ante movimientos rígidos, que la visibilidad por z-buffer elimina la cara oculta de una esfera, que RANSAC resiste un 50 % de correspondencias erróneas, que ICP converge, que el punto a plano es más rápido que el punto a punto en una superficie suave y que la cadena completa baja de 2° y del 2 % del tamaño del objeto. Son métodos establecidos: ICP (Besl y McKay 1992; punto a plano: Chen y Medioni 1992), FPFH (Rusu, Blodow y Beetz 2009), PCL (Rusu y Cousins 2011, licencia BSD, https://pointclouds.org). El código está escrito a partir de los artículos, no traducido de PCL. Pruebe un ángulo de vista mayor (menos solapamiento: RANSAC encuentra menos inliers y puede fallar), más atípicos o un vóxel más grueso.'
meanings:
- un movimiento rígido por miembro del lote $b$ (hipótesis de RANSAC o arranque de ICP), $j$ sumado
- los $k$ vecinos más cercanos, un bloque de filas de la matriz de distancias cada vez
- 'VoxelGrid: media por dispersión de los puntos que comparten clave de vóxel'
- 'StatisticalOutlierRemoval: distancia media a los vecinos frente a su media y desviación típica en la nube'
- covarianza de la vecindad; el vector propio del menor valor propio es la normal, orientada hacia el punto de vista
- 'variación de superficie (curvatura de PCL): 0 en un plano'
- 'ángulos del marco de Darboux de un par de puntos: $\alpha = \mathbf v\cdot\mathbf n_q$, $\phi = \mathbf u\cdot\hat{\mathbf d}$, $\theta = \operatorname{atan2}(\mathbf w\cdot\mathbf n_q, \mathbf u\cdot\mathbf n_q)$'
- tres histogramas de 11 casillas; el histograma propio de un punto más la media de los de sus vecinos ponderada por la distancia
- covarianza cruzada de Kabsch, una por hipótesis; una sola SVD por lotes da todas las rotaciones
- puntuación RANSAC de todas las hipótesis a la vez
- paso de ICP punto a plano $\boldsymbol\xi = (\boldsymbol\omega, \delta\mathbf t)$, por lotes sobre los arranques
- error de rotación respecto a la verdad conocida
labels:
  n_points: Muestras de superficie por escaneo
  view_angle: Ángulo entre los dos puntos de vista
  noise: Ruido del sensor $\sigma$ (tamaño del objeto 1)
  outliers: Fracción de valores atípicos
  voxel: Tamaño de vóxel $s$
  hypotheses: Hipótesis de RANSAC
  icp_iterations: Iteraciones de ICP
  starts: Arranques de ICP (por lotes)
