  sequence: अनुक्रम
  replicas: प्रतिकृतियाँ $R$
  steps: मोंटे कार्लो चरण
  T_start: प्रारंभिक तापमान $T_0$ ($\varepsilon/k_B$ की इकाइयों में)
  T_end: अंतिम तापमान $T_1$
