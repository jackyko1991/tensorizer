<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Unit square with a quarter circle of radius 1; darts inside the circle are blue, outside orange; the fraction inside tends to pi over 4">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- unit square, side 120 px, origin bottom-left (30, 140) -->
    <rect x="30" y="20" width="120" height="120" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <path d="M30,20 A120,120 0 0 1 150,140 L30,140 Z" fill="#eff6ff" stroke="#374151" stroke-width="1.5"/>
    <!-- darts inside (blue) -->
    <g fill="#2563eb">
      <circle cx="48" cy="60" r="3"/><circle cx="70" cy="110" r="3"/><circle cx="95" cy="80" r="3"/>
      <circle cx="40" cy="128" r="3"/><circle cx="118" cy="122" r="3"/><circle cx="62" cy="38" r="3"/>
      <circle cx="105" cy="58" r="3"/><circle cx="82" cy="132" r="3"/><circle cx="130" cy="96" r="3"/>
    </g>
    <!-- darts outside (orange) -->
    <g fill="#f59e0b">
      <circle cx="138" cy="34" r="3"/><circle cx="120" cy="28" r="3"/><circle cx="144" cy="62" r="3"/>
    </g>
    <text x="22" y="154" font-size="11">0</text>
    <text x="146" y="154" font-size="11">1</text>
    <text x="18" y="24" font-size="11">1</text>
    <text x="60" y="96" font-size="12" fill="#1e40af">π/4</text>
    <!-- formula -->
    <text x="160" y="58" font-size="12" fill="#2563eb">● inside</text>
    <text x="160" y="76" font-size="12" fill="#b45309">● outside</text>
    <text x="160" y="104" font-size="13"><tspan font-style="italic">π</tspan> ≈ 4 · <tspan fill="#2563eb">inside</tspan></text>
    <text x="196" y="122" font-size="13" text-anchor="middle">─────</text>
    <text x="196" y="138" font-size="13" text-anchor="middle"><tspan font-style="italic">N</tspan></text>
  </g>
</svg>
