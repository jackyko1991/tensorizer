source_hash: e6424f8df209
title: 机器学习加速的 CFD
summary: 在比真实解粗 16 倍的网格上，普通有限体积求解器会抹平黏性 Burgers 方程的激波。一个微型 CNN 学习对界面通量的修正，训练时对展开的粗网格模拟做反向传播。在从未见过的初始条件上，学习型求解器在相同的粗分辨率下对精细解的跟随程度高出数倍，同时精确守恒 $\int u\,dx$。
notes: 单位：区域为 $[0, 2\pi)$，周期性边界。真实解是同一有限体积格式在 512 个单元上的结果，采用 Heun 时间推进并做子循环以保持稳定。训练使用 32 个随机光滑波，测试使用来自另一随机种子的 8 个其他波，运行时间比训练数据长 50%（$t = 3$）。每个 Adam 步中，学习型求解器从随机时刻的真实粗网格状态出发，运行 $S$ 步，并因偏离平均后的真实解而受到惩罚。梯度反向流经每个时间步，因此网络学到的修正在以自身输出作为输入时仍然有效。两个设计选择保证了它的诚实：$\delta F$ 以通量形式进入，所以 $\sum_i u_i$ 守恒到舍入误差；最后一层初始化为零，所以训练从普通求解器开始。这一思想遵循 Bar-Sinai, Hoyer, Hickey & Brenner（PNAS, 2019），他们为正是这类方程学习了数据驱动的离散化；以及 Kochkov, Smith, Alieva, Wang, Brenner & Hoyer（PNAS, 2021）。后者在二维 Navier–Stokes 求解器中学习插值系数，报告在相同精度下网格可粗 8–10 倍，速度约快 40–80 倍。这个玩具展示的是机制，而不是那些加速效果。学习到的修正在远离训练数据的输入上可能失效。试试更少的训练步数、更短的展开，或网络未训练过的黏度。
meanings:
- 轨迹 $b$ 在粗单元 $i$ 中的单元平均（周期性）
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$，$\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$；$u_{i+1}$ 即 roll(u, -1)
- 从一个单元流出的量流入下一个单元 ⇒ $\sum_i u_i$ 守恒
- 重复的 $k$ ⇒ 求和：5 单元模板，周期性填充
- 由三个卷积得到的学习型通量修正（初始为零）
- 对每个粗单元内 $f = N_f/N_c$ 个细单元取平均的精细解
- 通过求解器全部 $S$ 个展开时间步的自动微分
labels:
  nu: 黏度 $\nu$
  n_coarse: 粗单元数 $N_c$
  train_iters: 训练步数
  unroll: 展开步数 $S$
