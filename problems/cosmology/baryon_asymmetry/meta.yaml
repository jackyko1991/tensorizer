  - {symbol: '\eta_B', code: 'A_SPH / DILUTION * n_bl', shape: '(E, K)', meaning: 'sphalerons keep $28/79$ of $B - L$ as baryons; photons grow by $f = 2387/86$'}
  - {symbol: '\kappa_f', code: 'n_bl / (0.75 * eps)', shape: '(K,)', meaning: 'efficiency: $1$ for weak washout, $\approx 1/(K z_B)$ for strong washout'}
notes: >
  Observations: the baryon-to-photon ratio is $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$ from the CMB (Planck 2018,
  $\Omega_bh^2 = 0.0224$), in agreement with Big Bang nucleosynthesis, and there is no sign of antimatter galaxies. Starting
  from a symmetric universe, Sakharov (1967) showed that an asymmetry needs (1) baryon-number violation, (2) C and CP
  violation and (3) a departure from thermal equilibrium. The tests check (2) and (3) directly: $\varepsilon = 0$, or
  heavy neutrinos held at equilibrium, give exactly zero; (1) is the Standard Model's sphaleron process, which converts
  $B - L$ into $B = \tfrac{28}{79}(B - L)$ above about 130 GeV. The CP violation of the quarks (CKM phase) is far too small,
  and the electroweak transition is a crossover, so the Standard Model alone fails: new physics is needed. Leptogenesis
  (Fukugita and Yanagida 1986) uses the heavy right-handed neutrinos of the seesaw mechanism, which would also explain
  why light neutrinos are so light. This toy keeps only decays and inverse decays of the lightest one, $N_1$ (no
  $\Delta L = 2$ scatterings, flavour effects or thermal corrections), in the normalisation of Buchmüller, Di Bari and
  Plümacher (2005). Weak washout ($K \ll 1$) with a thermal start keeps the full asymmetry ($\kappa_f \to 1$, checked);
  strong washout ($K \gg 1$) loses most of it but forgets the initial conditions (the two starts merge), and the solver
  agrees with their analytic fit to within about 10%. With $K = \tilde m_1/m_*$, $m_* \approx 1.08\times10^{-3}$ eV, the
  neutrino masses seen in oscillations ($\approx 0.009$–$0.05$ eV) point to $K \approx 10$–$50$, where $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$ is
  needed; the Davidson–Ibarra bound $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$ then requires $M_1 \gtrsim 10^{10}$ GeV.
  Status: open. Leptogenesis is attractive and consistent with everything known, but it is unconfirmed: the heavy
  neutrinos are far beyond colliders. Indirect hints would be neutrinoless double-beta decay (Majorana nature) and CP
  violation in neutrino oscillations (T2K, NOvA, and next DUNE and Hyper-Kamiokande); electroweak baryogenesis and
  other mechanisms remain alternatives. The page explores the toy equations numerically and does not claim this is
  how the asymmetry arose.
