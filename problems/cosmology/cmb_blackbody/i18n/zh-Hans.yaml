source_hash: 79a2f1fd310e
title: 宇宙微波背景：完美的黑体（COBE FIRAS）
summary: COBE 的 FIRAS 仪器在 43 个频率上测量宇宙微波背景，发现了迄今所见最完美的黑体。一批四个模型（仅普朗克定律、加上玻色–爱因斯坦化学势 $\mu$、加上康普顿 $y$ 畸变、两者皆加）在单个张量中拟合真实的 FIRAS 数据表，雅可比矩阵由自动微分求得。拟合给出 $T \approx 2.725$ K，42 个自由度下 $\chi^2 \approx 45$，残差低于峰值的 $10^{-4}$，畸变与零相符（$|\mu| \lesssim 10^{-4}$、$|y| \lesssim 10^{-5}$），并由 $T$ 推得每 cm³ 约 411 个光子。
notes: 1990 年，FIRAS（NASA COBE 卫星上的远红外绝对分光光度计）将天空与外部黑体定标源比较，未发现任何差异；最终光谱（Fixsen et al. 1996）与普朗克曲线的偏差小于峰值的百万分之 50。John Mather 与 George Smoot 共同获得 2006 年诺贝尔物理学奖，“表彰他们发现宇宙微波背景辐射的黑体形式及其各向异性”。如此完美的黑体意味着早期宇宙炽热、致密且处于热平衡：在红移 $z \sim 2\times10^6$ 之后释放的能量会留下化学势 $\mu$（玻色–爱因斯坦谱，$z \gtrsim 2\times10^5$）或康普顿 $y$ 畸变（热电子提升光子能量，$z \lesssim 5\times10^4$；形状与苏尼亚耶夫–泽尔多维奇效应相同，零点在 $x = 3.83$ 即 217 GHz，且保持光子数守恒）。我们的拟合只用对角误差，得到 95 % 上限约为 $|\mu| < 7\times10^{-5}$ 和 $|y| < 6\times10^{-6}$；FIRAS 发表的上限 $|\mu| < 9\times10^{-5}$ 和 $|y| < 1.5\times10^{-5}$ 更宽，因为它们使用完整的相关协方差矩阵，并计入系统（定标与银河系）不确定度。解读温度时要小心：拟合在统计上把 $T$ 确定到约 $10^{-5}$ K，但绝对标度来自定标源的测温，而且 LAMBDA 数据表将光谱写成 2.725 K 黑体加上已发表的残差，所以 $T = 2.725$ K 是内置的；目前最佳的绝对值为 $2.72548 \pm 0.00057$ K（Fixsen 2009）。由 $T$ 可得 $n_\gamma \approx 411$ cm$^{-3}$ 和 $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$。动画中，左图显示拟合从初始猜测收敛的过程（误差棒放大 400 倍，如同那张著名的图，否则根本看不见）；右图随后放大残差，以峰值的 $10^{-4}$ 为单位，并画出处于我们 95 % 上限的 $\mu$ 或 $y$ 在重新拟合 $T$ 后会留下的形状。数据：D. J. Fixsen et al., ApJ 473, 576 (1996) 的表 4，取自 NASA 的 LAMBDA
  数据库（https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt），属公有领域，随附为 data/firas_monopole.csv。
meanings:
- 43 个 FIRAS 波数（cm$^{-1}$）、强度与 $1\sigma$ 误差（MJy/sr）
- 批次中每个模型 $b$ 一行 $(T, \mu, y)$
- $h\nu/kT$，由 $(B,1)$ 对 $(F,)$ 广播得到
- 玻色–爱因斯坦占据数加上 Kompaneets $y$ 项，乘以 $2hc\tilde\nu^3$
- 对 $\sum_b I_{bf}$ 自动微分：各行彼此独立，一次调用即得每个模型的雅可比矩阵
- 重复的 $f$ ⇒ 求和：费希尔矩阵；其逆矩阵即协方差矩阵
- 所有模型同时进行一步 Levenberg–Marquardt 迭代
- 每个模型的拟合优度
labels:
  T_init: $T$ 的初始猜测
  steps: Levenberg–Marquardt 步数
