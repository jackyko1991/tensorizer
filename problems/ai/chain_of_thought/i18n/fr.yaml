source_hash: 71b446fca9cd
title: Pourquoi la chaîne de pensée aide un transformer
summary: 'La parité de $n$ bits est un XOR cumulé, une tâche intrinsèquement séquentielle. De minuscules transformers identiques (attention écrite à la main avec einsum, tous les modèles empilés sur un axe de modèle et entraînés en une seule exécution) l''apprennent sous deux formats : répondre immédiatement, "$b_1 \dots b_n = p$", ou écrire d''abord les parités cumulées, "$b_1 \dots b_n : s_1 \dots s_n = p$". À poids et nombre de pas égaux, les modèles à brouillon répondent correctement à 98–100 % des chaînes de test pour $n = 4$ à $10$, tandis que les modèles directs n''ajustent que $n = 4$ et sont au niveau du hasard ou en dessous au-delà ; l''attention montre la règle à deux jetons $s_k = s_{k-1} \oplus b_k$. Un modèle jouet du mécanisme, pas de la façon dont les grands modèles de langage raisonnent.'
notes: 'Statut : l''effet montré est établi. La parité est le cas difficile classique pour un transformer de profondeur fixe qui doit répondre immédiatement. Li, Liu, Zhou et Ma (ICLR 2024, arXiv 2402.12875) démontrent que les transformers de profondeur constante sans étapes intermédiaires sont limités à des circuits parallèles peu profonds (de type $\mathrm{TC}^0$, sous leurs hypothèses de précision), tandis que $T$ étapes de chaîne de pensée leur permettent de simuler un circuit séquentiel de taille $T$. Nye et al. (2021, arXiv 2112.00114) ont entraîné des transformers à écrire un « brouillon » (scratchpad) de résultats intermédiaires et les ont vus résoudre des tâches à plusieurs étapes comme l''addition longue et le traçage de programmes ; Wei et al. (2022, arXiv 2201.11903) ont donné son nom au prompting par chaîne de pensée (chain-of-thought prompting) pour les grands modèles de langage. Méthode : une chaîne de $n$ bits s''écrit soit directement, "$b_1 \dots b_n = p$", soit avec ses
  parités cumulées, "$b_1 \dots b_n : s_1 \dots s_n = p$". Chaque modèle est le même décodeur à 2 couches, $d = 64$ et 4 têtes (le code `tiny_transformer`, avec un axe de modèle $m$ ajouté à chaque einsum), entraîné avec AdamW pendant le même nombre de pas et sur le même lot de chaînes ; les modèles CoT lisent environ deux fois plus de jetons par chaîne et sont entraînés sur leurs jetons intermédiaires, ce qui est exactement l''aide supplémentaire qu''apporte un brouillon. Tous les modèles, $n$ par format par graine, plus les modèles de généralisation en longueur, s''entraînent en une seule exécution : leurs poids sont empilés sur le premier axe et l''écrêtage du gradient se fait modèle par modèle, si bien qu''ils ne s''influencent jamais (un test le vérifie). Données : pour $n \ge 8$, un quart des $2^n$ chaînes (au plus 1024) est mis de côté et jamais utilisé pour l''entraînement ; pour $n = 4$ et $6$, il y a trop peu de chaînes pour en mettre de côté, donc ces précisions (marquées d''une
  étoile sur le graphique) mesurent l''ajustement, pas la généralisation. Au test, un modèle CoT écrit lui-même son brouillon de façon gloutonne, jeton par jeton, et seule sa réponse finale est notée. Verdict, avec l''exécution par défaut (2 graines, chiffres affichés dans le terminal) : (a) les modèles CoT répondent correctement à 0.98 à 1.00 des chaînes de test pour $n = 4, 6, 8, 10$ ; les modèles directs ajustent les 16 chaînes de $n = 4$ (1.00) mais obtiennent 0.53, 0.27 et 0.53 pour $n = 6, 8, 10$. Une lecture plausible du score inférieur au hasard pour $n = 8$ (non testée ici) : une chaîne mise de côté diffère de ses voisines d''entraînement d''un seul bit et a donc la parité opposée, et un modèle qui interpole entre voisines se trompe. (b) La généralisation en longueur échoue pour les deux : les modèles entraînés sur $1 \le n \le 8$ obtiennent 0.46 à 0.51 pour $n = 12$ et $16$, car les positions au-delà de 19 n''ont jamais été entraînées et, avec la disposition CoT utilisée ici, le
  bit $b_k$ se trouve $n + 1$ places avant la case qui en a besoin, un décalage qui change avec $n$ ; les modèles CoT à longueurs mélangées maîtrisent $n = 4$ (1.00) mais pas même $n = 8$ (0.56) dans le budget de pas. (c) Masquer le brouillon après $k$ étapes fait tomber la réponse au niveau du hasard pour tout $k < n$ : la réponse est copiée depuis la dernière case, donc tout le calcul réside dans les jetons écrits. (d) Dans le modèle CoT à $n = 8$, à chaque étape $k$, une tête place 0.5 à 0.8 de l''attention de la requête qui écrit $s_k$ sur $b_k$, contre 0.08 pour une attention uniforme (une seule tête atteint en moyenne 0.48 sur les étapes ; les têtes se partagent les étapes). L''autre entrée de la règle, $s_{k-1}$, est le jeton de la requête lui-même et atteint la sortie par le flux résiduel, donc la règle apprise est locale : deux jetons par étape. Limites : il s''agit d''un modèle jouet qui montre le mécanisme, pas la façon dont les grands modèles de langage raisonnent. Il ne dit
  rien sur la question de savoir si les étapes écrites d''un grand modèle sont fidèles au calcul qui produit réellement sa réponse ; c''est une question de recherche ouverte. Les résultats varient d''une graine à l''autre et avec le budget de pas, c''est pourquoi chaque graine est tracée. Essayez plus de pas, $n$ jusqu''à 16, ou une seule couche.'
meanings:
- 'parité cumulée de chaque préfixe : les cibles du brouillon, et $p = s_n$'
- chaînes au format direct ou CoT sous forme d'identifiants de jetons $0, 1, :, =, \_$ ; complétées par des blancs pour que tous les modèles d'un même $n$ partagent un seul tenseur
- jeton plus embedding de position appris, chaque modèle $m$ avec ses propres tables
- $c$ répété ⇒ sommé ; l'indice de modèle $m$ n'est pas sommé, donc $M$ transformers indépendants tournent dans un seul produit
- 'attention causale : chaque ligne est une distribution de probabilité sur les positions $j \le i$'
- 'quels jetons suivants sont entraînés : $p$ seul (direct), ou $s_1 \dots s_n$, "=" et $p$ (CoT)'
- moyenne de $-\log p$ sur les jetons entraînés du modèle $m$ (nats) ; leur somme est minimisée, et chaque terme n'atteint que ses propres poids
- au test, le modèle écrit lui-même son brouillon, un jeton par passe avant, et répond ensuite
