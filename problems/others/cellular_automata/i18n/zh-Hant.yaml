source_hash: ebc73dcb492e
title: 全部 256 種基本細胞自動機，以及 Lenia
summary: 一排細胞，每個新細胞取決於它自己和左右兩個鄰居：這三個位元構成一個編碼 $k \in \{0, \dots, 7\}$，而規則編號的二進位寫法就是查找表。全部 256 條規則以一個 $(256, W)$ 張量同時運行，每一步只需一次 gather：規則 90 畫出謝爾賓斯基三角形，規則 30 看似隨機，規則 110 構築出相互作用的結構，規則 184 則讓車流移動。它的連續版本 Lenia 以平滑的環形核取代查找表，並長出一個會滑行的生物。
notes: Wolfram 把基本規則分成四類：(1) 全部死亡或填滿，(2) 靜止或週期性圖樣，(3) 混沌，例如規則 30，它的中心列曾長期被用作亂數產生器，(4) 複雜、長壽且相互作用的結構，例如規則 110，Matthew Cook 證明（2004 年發表）它是圖靈完備的。馬賽克圖依照一個粗略的自動測試為每條規則著色，測試在 151 個細胞的環上運行 600 步：均勻、在平移意義下週期，或找不到週期。最後一組混合了第 3 類與第 4 類，兩者的區分並沒有精確的定義。規則 90 把鄰居相加後取模 2，因此從單一細胞出發得到的是模 2 的帕斯卡三角形；規則 184 是最簡單的交通模型：前方格子空著時車就向右移動，所以車輛總數守恆。與生命遊戲（二維、$3\times3$ 計數、只有一條規則）不同，這裡所有規則同時運行。Lenia（Bert Chan，2019）讓空間、時間和狀態都變成連續；它的經典滑翔者 Orbium 從隨 Lenia 發表的細胞表（MIT 授權）出發，在移動時保持質量不變，是一個沒有任何守恆律強制、卻呈現類孤子行為的圖樣例子。
meanings:
- 規則編號 $r$ 的第 $k$ 位元：鄰域編碼為 $k$ 時的新狀態
- 環上細胞 $i$ 周圍的左、中、右細胞
- 重複的 $j$ ⇒ 求和：3 位元鄰域編碼 $4\,\text{left} + 2\,\text{centre} + \text{right}$
- 一次查表就同時推進所有規則
- 規則的左右鏡像與 0/1 互補；256 條規則構成 88 個對稱類
- 半徑 $R = 13$ 的平滑環，歸一化使總和為 1
- 週期網格上的卷積，寫成傅立葉轉換的乘積
- 在 $U \approx \mu$ 處增長，其他地方衰減，步長為 $1/T$
labels:
  rule: 你的規則 $r$（第一個面板）
  start: 你的規則的初始狀態
  width: 線寬 $W$
  generations: 世代數
  density: 隨機初始密度
  lenia_size: Lenia 世界 $S$
  lenia_steps: Lenia 步數
