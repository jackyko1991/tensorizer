source_hash: e1ad81688a05
title: 2次元フーリエ変換としてのフラウンホーファー回折
summary: 遠方場では、開口の回折パターンはその透過関数の2次元フーリエ変換である。torch.fft.fft2 を1回呼ぶだけで、正方形、円形の穴、二重スリット、回折格子が遠方場パターンに変わり、穴が大きくなるにつれてエアリーリングが縮む。
notes: 開口面の長さは大きさ $\Delta x$ のピクセル単位である。変換後の周波数ピクセル $(k, l)$ は方向 $\sin\theta = \lambda k/(N\Delta x)$ に対応する。したがって円形の穴の最初の暗環 $\sin\theta = 1.22\,\lambda/D$ は中心から $1.22\,N/D$ 周波数ピクセルの位置にある（破線の円）。大きな開口は小さなパターンを与える：幅の広い関数の変換は狭い。einsum 形式は fft2 と同じ変換だが、$O(N^2\log N)$ ではなく $O(N^3)$ である。
meanings:
- マスクの透過率：1 ＝ 開、0 ＝ 不透明；行 $a = y$、列 $b = x$
- 離散フーリエ変換行列
- 繰り返される $a$ と $b$ ⇒ 和をとる：$y$ 方向と $x$ 方向の1次元変換
- 高速フーリエ変換による同じ変換、零周波数を中心に移動
- 遠方場強度、$\log_{10}(I/I_{\max})$ として表示
- 直径 $D$ の円形の穴の最初の暗環（周波数ピクセル単位）
labels:
  size_min: 開始時の開口サイズ $D$
  size_max: 最終開口サイズ $D$
  frames_per_aperture: 開口形状あたりのフレーム数
