source_hash: 6345d973de84
title: 用光线传输矩阵分析双透镜系统
summary: 傍轴光学就是线性代数：自由空间和薄透镜都是作用在（高度，角度）光线矢量上的 $2\times 2$ 矩阵。整个系统是一串矩阵乘积，作用于一批光线；第二个透镜远离第一个透镜时重新计算。
notes: 顺序很重要：光最先遇到的元件是最右边的因子。每个因子的行列式都为 1，所以任何排列下 $\det M = 1$。注意观察：当透镜 1 的中间像恰好位于透镜 2 的焦点上（$d = sf_1/(s - f_1) + f_2$）时，像跑到无穷远，随后从另一侧作为虚像返回。
meanings:
- 光线 $r$：$j = 0$ 为高度 $h$，$j = 1$ 为角度 $\theta$
- 传播距离 $d$（批量 $d$ 给出 (..., 2, 2)）
- 焦距为 $f$ 的薄透镜
- 在系统上再串接一个元件（对重复的 $j$ 求和）；与 torch.linalg.multi_dot 相同
- 从物体到每个轴向采样点 $z$ 的传输矩阵
- 一次缩并得到每条光线在每个 $z$ 处的状态
- 高度不再依赖于出射角的位置
labels:
  s: 物距
  f1: 透镜 1 焦距
  f2: 透镜 2 焦距
  d_start: 初始透镜间距
  d_end: 最终透镜间距
  h0: 物高
  half_angle: 光束半角
  n_rays: 光线数
