source_hash: adf3aca0e79d
title: 陽子線治療：ブラッグピーク
summary: ベーテ–ブロッホの阻止能 $-dE/dz \propto 1/\beta^2$ を、陽子エネルギーのバッチ全体について RK4 で一度に積分する。線量は各陽子が止まる直前に急増し（ブラッグピーク）、エネルギー層の重み付き和によって腫瘍全体に平坦な線量を与え、その後方にはほとんど何も残さない。
notes: 水の定数：$K = 0.307$ MeV cm²/mol、$Z/A = 0.555$、$I \approx 75$ eV、$\rho = 1$ g/cm³。殻補正と密度補正は無視する。積分で得た飛程（150 MeV → 約 15.8 cm）は NIST PSTAR と約 1 % で一致し、$p \approx 1.75$ としてブラッグ–クリーマン則 $R = \alpha E^p$ に合う。飛程のストラグリング（$R$ の $\sigma \approx 1.2\,\%$）とビームのエネルギー幅がピークを丸める。核反応は1次粒子の 1 %/cm の損失としてのみモデル化しているので、ピークと入口の線量比は実際のビームより高い。同じ腫瘍線量に規格化したメガボルトX線ビーム（ビルドアップの後 $e^{-\mu z}$）は入口でより多くの線量を与え、腫瘍の先まで進み続ける。陽子は止まる。数値はすべて近似値で教育目的に限り、臨床や治療計画には使用できない。
meanings:
- 各深さステップにおけるビーム $b$ の運動エネルギー（RK4、全ビームを一緒に）
- ベーテ–ブロッホの $-dE/dz$（MeV/cm）、バッチについて要素ごとに
- 素の線量：深さビン $k$ で 1 cm あたりに失うエネルギー
- ガウス型の飛程ストラグリング + エネルギー幅、各行を規格化
- 繰り返される $k$ ⇒ 和をとる：ぼかしたブラッグ曲線
- 繰り返される $k$ ⇒ 和をとる：$K$ 個のエネルギー層からなる拡大ブラッグピーク
- 平坦な標的線量を得るための非負最小二乗法（射影勾配法）
