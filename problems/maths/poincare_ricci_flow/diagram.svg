<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A dumbbell-shaped sphere whose neck pinches under Ricci flow; surgery cuts the neck and caps the two pieces, which become round">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- dumbbell -->
    <path d="M20,55 C20,25 70,25 76,48 C80,52 90,52 94,48 C100,25 150,25 150,55 C150,85 100,85 94,62 C90,58 80,58 76,62 C70,85 20,85 20,55 z" fill="#93c5fd" fill-opacity="0.6" stroke="#2563eb" stroke-width="2"/>
    <line x1="85" y1="30" x2="85" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="85" y1="40" x2="85" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="85" y1="70" x2="85" y2="60" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="90" y="96" font-size="13" font-style="italic" fill="#b91c1c">ψ → 0</text>
    <text x="160" y="40" font-size="13" font-style="italic" fill="#374151">∂g/∂t = −2 Ric</text>
    <!-- arrow to after surgery -->
    <line x1="150" y1="110" x2="150" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="158" y="124" font-size="13" fill="#374151">surgery</text>
    <!-- two round pieces -->
    <circle cx="60" cy="130" r="20" fill="#93c5fd" fill-opacity="0.6" stroke="#2563eb" stroke-width="2"/>
    <circle cx="112" cy="130" r="20" fill="#93c5fd" fill-opacity="0.6" stroke="#2563eb" stroke-width="2"/>
    <path d="M196,60 A18,18 0 1 1 195.9,60" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="203" y="96" font-size="13" font-style="italic" fill="#b45309">S³</text>
  </g>
</svg>
