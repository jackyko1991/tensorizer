title: Гипотеза Пуанкаре и поток Риччи
summary: 'Доказано: всякое замкнутое односвязное трёхмерное многообразие есть трёхмерная сфера (Перельман, 2002–03, завершив программу потока Риччи Гамильтона). Поток Риччи $\partial_t g = -2\,\mathrm{Ric}$ сглаживает метрику так же, как теплопроводность выравнивает температуру. Здесь он скругляет пакет бугристых двумерных сфер (формула Гаусса–Бонне $\int K\,dA = 4\pi$ выполняется с точностью до ошибки округления) и за конечное время пережимает шейку трёхмерной сферы в форме гантели: это та сингулярность, которую вырезает хирургия Перельмана, после чего каждая часть становится круглой.'
notes: 'Статус: доказано. Пуанкаре в 1904 году спросил, должно ли замкнутое трёхмерное многообразие, в котором любую петлю можно стянуть в точку, быть трёхмерной сферой. Гамильтон ввёл поток Риччи в 1982 году и доказал, что трёхмерное многообразие с положительной кривизной Риччи перетекает в круглую метрику; в двух измерениях любая метрика на сфере становится круглой (Гамильтон 1988, Чоу 1991), что и показывают бугристые сферы: разброс $K$ убывает до нуля, а $\int K\,dA = 4\pi$ и площадь остаются неизменными. Гармоники с $l = 1$ — конформные движения круглой сферы, они не затухают, но и не меняют форму. В трёх измерениях у потока могут возникать сингулярности. Для вращательно-симметричной гантели с достаточно тонкой шейкой Ангенент и Кнопф (2004) доказали пережатие шейки: шейка сжимается как цилиндр $S^2 \times \mathbb R$, $\psi_\mathrm{neck}^2 \approx 2(T - t)$, а утолщения остаются большими. Статьи Перельмана (arXiv, 2002–03) взяли под контроль все сингулярности в трёх измерениях (отсутствие
  локального коллапса, канонические окрестности), определили поток Риччи с хирургией, который разрезает шейки и заклеивает их шапочками, и показали, что для односвязного многообразия поток вымирает за конечное время, причём каждая часть непосредственно перед исчезновением является круглой сферой, так что многообразие было трёхмерной сферой. Доказательство было детально проверено Клейнером–Лоттом, Морганом–Тианом и Цао–Чжу; Перельман отказался от Филдсовской премии 2006 года и от премии тысячелетия Института Клэя 2010 года. Численные методы: поверхности используют конечно-объёмную сетку по полярному углу, поэтому дискретная формула Гаусса–Бонне точна. Трёхмерная сфера записана в конформной форме, регулярной на полюсах (форма через длину дуги делит там на $\psi \to 0$ и неустойчива), с ячейками, сгущёнными к полюсам, потому что утолщения сжимаются там по мере утончения шейки; поток останавливается при радиусе шейки $0.05$, когда утолщения ещё разрешены. Хирургия здесь — лишь карикатура на
  конструкцию Перельмана. Попробуйте толстую шейку ($\varepsilon \gtrsim 0.5$): она не пережимается, и вся сфера скругляется.'
meanings:
- конформный множитель каждой бугристой сферы $b$, метрика $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$, в ячейке $i$
- 'по повторяющемуся $j$ ⇒ суммирование: лапласиан круглой сферы в потоковой форме; его потоки обращаются в нуль на полюсах'
- гауссова кривизна конформной метрики; поток Риччи на поверхности — это $\partial_t g = -2Kg$
- 'полная кривизна: ровно $4\pi$ для любой метрики (дискретная формула Гаусса–Бонне), проверка на каждом шаге'
- целевая средняя кривизна нормированного потока; она сохраняет каждую площадь неизменной
- секционные кривизны трёхмерной сферы $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$, $-\psi_{ss}/\psi$ и $(1-\psi_s^2)/\psi^2$ при $\psi = e^u\sin x$
- диффеоморфный (калибровочный) член, удерживающий метрику в конформной форме; он меняет координаты, а не геометрию
- радиус наименьшего сечения $S^2$; $\psi_\mathrm{neck}^2$ убывает примерно с цилиндрической скоростью $2$ вплоть до пережатия
- отрезать шейку с высокой кривизной и вклеить круглую шапочку, касательную к профилю (карикатура на хирургию Перельмана)
labels:
  neck: Начальный радиус шейки гантели $\varepsilon$
  t_surface: Время потока для поверхностей
  cells: Ячейки сетки $N$
