source_hash: 296b0fae0936
title: 'Das Projektionspostulat: ein hochdimensionaler Zustand, viele Schatten'
summary: 'Eine spekulative Hypothese, keine gesicherte Physik: Das Universum ist ein einziger Zustand $\Psi$ in einem Raum sehr vieler Dimensionen $D$, und was ein Beobachter misst, ist seine Projektion auf wenige davon. Dieser Schritt formuliert die Postulate und prüft ihre Mathematik. Der sichtbare Anteil $\|P\Psi\|^2$ folgt einer Beta$(d, D-d)$-Verteilung, und eine Messung wird als Wettlauf zwischen verborgenen Blöcken modelliert. Eine verborgene komplexe Dimension pro Ausgang ergibt genau die Bornsche Regel; mehr ergeben eine Abweichung, die Dreifachspalt-Experimente ausschließen. Bisher reproduziert die Idee die Quantenmechanik, statt über sie hinauszugehen.'
notes: 'Status: spekulativ. Dies ist die eigene Hypothese des Autors (siehe die Beschreibung der Serie), keine gesicherte Physik, und kein Experiment bevorzugt sie gegenüber der Standard-Quantenmechanik. Dieser erste Schritt schreibt die Postulate präzise auf und prüft die Mathematik, auf der sie beruhen. Die Postulate. P0 (eine Wirklichkeit): Das Universum ist ein einziger Zustand $\Psi$ in einem Raum der Dimension $D$, möglicherweise $D\to\infty$. P1 (Projektion): Ein Beobachter sieht nur eine Projektion $P:\mathbb C^D\to\mathbb C^d$ auf einen $d$-dimensionalen Unterraum; der gemessene Quantenzustand ist $\psi = P\Psi/\|P\Psi\|$, die Wellenfunktion ist also eine Projektion von $\Psi$, nicht $\Psi$ selbst. P2 (Ereignis): Eine Messung ist eine Projektion auf eine bestimmte Zeitscheibe, die einen Ausgang $k$ auswählt; die Gewichte der Ausgänge kommen aus $\|P_k\Psi\|^2$, und die Bornsche Regel soll getestet, nicht vorausgesetzt werden. P3 (ein Teilchen): Alle Teilchen sind Projektionen desselben
  Objekts. P4 (Geometrie): Die gekrümmte Raumzeit ist die projizierte Gestalt einer flachen höherdimensionalen Einbettung, und eine Singularität ist die Stelle, an der die Projektion faltet (ihre Jacobi-Matrix verliert Rang). P5 (offene Dimension): Quanteneffekte brauchen eine minimale Dimension $d_Q$ und die Gravitation eine Dimension $d_G$ innerhalb von $D$; sie werden geschätzt oder angepasst, nie von Hand auf $3+1$ gesetzt. Was berechnet wird. (1) Maßkonzentration: Für $\Psi$ gleichverteilt auf der Sphäre von $\mathbb C^D$ gilt $\|P\Psi\|^2\sim$ Beta$(d, D-d)$ mit Mittelwert $d/D$, geprüft über Mittelwert, Varianz und einen Kolmogorow–Smirnow-Test für $D$ von 4 bis $D_{max}$; das normierte $\psi$ ist auf der kleinen Sphäre gleichverteilt, egal wie groß $D$ ist. Ein typischer Beobachter sieht einen Anteil $d/D$ der Norm, der für $D\to\infty$ verschwindet. (2) P2 konkret als Projektionswettlauf (das Modell des Autors, hier formalisiert): Jeder Ausgang $k$ koppelt an einen eigenen Block
  aus $m$ verborgenen komplexen Dimensionen mit Energie $E_k = \|h_k\|^2$, und der Ausgang mit dem größten $|c_k|^2/E_k$ tritt ein. Für $m = 1$ ist $E_k\sim$ Exp(1), und der exponentielle Wettlauf ergibt genau $P(k) = |c_k|^2$: die Bornsche Regel. Für $m > 1$ ist $E_k\sim$ Gamma$(m)$, und der wahrscheinlichste Ausgang gewinnt zu oft; für zwei Ausgänge gilt $P_1 = I_{|c_1|^2}(m, m)$, und die Abweichung wächst mit $m$. Reelle verborgene Dimensionen ergeben Gamma$(m/2)$: eine reelle Dimension ergibt das Arkussinus-Gesetz $\tfrac2\pi\arcsin|c_1|$, zwei ergeben Born. (3) Dimensionszählung (P5): Der Wettlauf braucht $D\geq d + K$ für $K$ Ausgänge; $N$ verschränkte Zwei-Niveau-Systeme brauchen $D\geq 2^N$, also etwa $10^{3\times10^{79}}$ für die $\sim10^{80}$ Teilchen des beobachtbaren Universums, im Einklang mit $D\to\infty$ aus P0. Ehrlichkeit: Die Standard-Quantenmechanik benutzt bereits genau diesen Hilbertraum, und partielle Spuren und Projektionen sind Standard. Bisher ist die Hypothese eine
  Umdeutung; jede prüfbare Neuheit muss daher kommen, wo der Wettlauf mit $m > 1$ oder ein späterer Schritt etwas anderes vorhersagt. Das Gleason-Theorem (1957) zeigt bereits, dass für $d\geq 3$ jede nichtkontextuelle Wahrscheinlichkeitszuordnung auf einem Hilbertraum die Bornsche Regel ist. (4) Daten: In einem Dreifachspalt-Aufbau (41 Schirm-Bins plus ein Ausgang „blockiert“, jeder mit eigenem verborgenem Block) ergibt der Wettlauf einen Sorkin-Parameter $\kappa\approx s\,(a-1)$, mit $s$ zwischen 0,56 und 0,74 über 9 Einteilungen, wobei die verborgene Form $a = m$ (komplex) oder $m/2$ (reell) ist. Messwerte (data/born_rule_tests.csv, zitierte Zahlen): Sinha et al. (Science 329, 418, 2010) begrenzen $|\kappa|$ auf unter $10^{-2}$; Park et al. (NMR, New J. Phys. 14, 113025, 2012) $\kappa = 0.001\pm0.003$; Kauten et al. (New J. Phys. 19, 033017, 2017, Open Access, CC-BY 3.0) $0.0\pm1.6\times10^{-3}$ mit angekündigten Einzelphotonen, $(1.3\pm1.8)\times10^{-4}$ mit abgeschwächtem Laserlicht
  und $0.0\pm3.1\times10^{-5}$ mit klassischem Licht. Mit $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ und der kleinsten Steigung erlauben die Einzelphotonendaten $|a-1|\leq 6\times10^{-3}$, und die Daten mit klassischem Licht, falls jeder Photonennachweis ein Wettlauf ist, $|a-1|\leq 1.1\times10^{-4}$. Der Wettlauf mit $m = 2$ ergibt $\kappa\approx 1$ und eine reelle verborgene Dimension $\kappa\approx 0.1$, beide ausgeschlossen; nur eine komplexe (zwei reelle) verborgene Dimension pro Ausgang überlebt. Das ist eine Einschränkung des Modells, keine Bestätigung: $m = 1$ ist genau der Fall, der sich von der Standard-Quantenmechanik nicht unterscheiden lässt. Die Abbildung auf $\kappa$ hängt davon ab, wie die Ausgänge eingeteilt werden, deshalb wird die vorsichtigste Steigung verwendet. Nächste Schritte der Serie (hier nicht gebaut): P3 (alle Teilchen als Projektionen eines Objekts), P4 (gekrümmte Raumzeit als Schatten einer flachen Einbettung: eine analytische 4D-Metrik lässt sich nach dem Satz
  von Janet–Cartan lokal in 10 flache Dimensionen einbetten, Schwarzschild in 6), die Anpassung von $d_G$ für die Gravitation und die Suche nach einer Vorhersage, die von der Standardphysik abweicht.'
meanings:
- Anteil der Norm von $\Psi$, den der Beobachter sieht, für alle $D$ auf einmal (verschachtelte Zustände)
- der beobachtete Zustand, gleichverteilt auf der Einheitssphäre von $\mathbb C^d$ für jedes $D$
- Kolmogorow–Smirnow-Abstand zu Beta$(d, D-d)$ (unvollständige Betafunktion per Quadratur)
- 'Energie des verborgenen Blocks $k$ mit $m = 1..M$ Dimensionen: Gamma$(m)$ (komplex) oder $2\,$Gamma$(m/2)$ (reell)'
- 'der Projektionswettlauf: der Ausgang mit dem größten $|c_k|^2/E_k$ tritt ein'
- geschlossene Form des Wettlaufs; die Summe über $j$ (ohne $j = k$) ist das Produkt über die anderen Ausgänge
- 'wiederholter Spaltindex $s$ ⇒ summiert: die Amplitude für jede Menge $S$ offener Spalte'
- Sorkin-Dreiwegeparameter des Wettlaufmodells; $0$ für die Bornsche Regel
labels:
  D_max: Größte Gesamtdimension $D$ (Beispiel; der Lauf nutzt eine Leiter bis dorthin)
  d: Dimension des Beobachter-Unterraums $d$ (Beispiel)
  m_max: Größte Zahl verborgener Dimensionen pro Ausgang $m$
  outcomes: Zahl der Ausgänge $K$
  trials: Zufallszustände und Ereignisse pro Fall
