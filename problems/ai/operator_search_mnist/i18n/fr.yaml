source_hash: efa79cfa67ef
title: 'Recherche d''opérateurs sur MNIST : un DAG tensoriel écrit sa propre équation de classification'
summary: Quelques opérateurs tensoriels lisibles, câblés en DAG, peuvent-ils rivaliser avec un CNN quand on ne dispose que d'une poignée d'images d'entraînement ? Chaque arête d'un petit DAG porte un mélange pondéré par softmax de 23 opérateurs candidats (Sobel, laplacien, Gabor, un filtre 3×3 appris, ReLU, $x^2$, pooling, sommes de lignes, module de la FFT, gabarits de classe, ACP, moments, lectures linéaires et par prototypes) ; une recherche DARTS sur 1 à 100 images par chiffre choisit un opérateur par arête, et le DAG est imprimé sous forme d'une équation LaTeX qui reproduit exactement ses prédictions. Puis données et calcul face à un CNN de type LeNet et deux références en forme close, chaque graine affichée.
notes: 'La question. Ce problème jouet est celui de Jacky Ka Long Ko : une tentative d''entraînement d''IA sur petits lots avec écriture d''équations en boîte blanche. CNN contre une méthode tensorielle sur MNIST ; lister les opérateurs tensoriels candidats ; laisser un tenseur qui encode le DAG trouver les meilleurs opérateurs et leur câblage ; entraîner sur de petits lots et comparer les données et le calcul nécessaires à chacun pour une même précision ; et écrire l''équation de classification du DAG trouvé. Méthode. Les images font 14×14 (MNIST moyenné sur des blocs 2×2, si bien que 30 exécutions tiennent en environ une minute de CPU). Le superréseau est une cellule DARTS (Liu, Simonyan et Yang 2019) à trois nœuds $z_1, z_2, z_3$ alimentés par tous les nœuds précédents via 6 arêtes, chacune un mélange de 12 opérateurs de cellule (zéro, identité, $x^2$, $|x|$, ReLU, tanh, seuillage doux $S_\lambda$, filtre $3\times 3$ appris, Sobel-$x$, Sobel-$y$, laplacien, Gabor), puis une arête de pooling
  (moyenne ou max $2\times 2$), une arête de réduction (vec, sommes de lignes, sommes de colonnes, module basse fréquence de la FFT, corrélations avec des gabarits de classe, projection ACP, moments d''image) et une arête de tête (lecture linéaire ou 10 prototypes). L''architecture est le tenseur $\alpha$ (9 arêtes × 23 opérateurs) avec un masque pour la règle de typage. Recherche : DARTS du premier ordre, alternant un pas sur $\theta$ sur un mini-lot de la moitié d''entraînement et un pas sur $\alpha$ sur la moitié de validation, la température du softmax étant recuite de 1 à 0.001 ; le DAG garde l''opérateur argmax de chaque arête (zéro supprime l''arête), hérite du $\theta$ entraîné et est brièvement affiné, le meilleur pas de validation étant conservé. Écarts par rapport à DARTS, signalés parce qu''ils comptent : le recuit (comme dans SNAS et GDAS) et la règle de l''argmax comblent un écart de discrétisation qui, lors d''un premier essai, coûtait jusqu''à 25 points de précision ; l''image
  est conservée comme quatrième canal de la sortie de la cellule ; les têtes démarrent à la moyenne de classe la plus proche dans leur espace de caractéristiques. Le CNN (8 et 16 canaux de $3\times 3$, max pooling, une couche linéaire : 2698 poids) est entraîné avec Adam sur les mêmes images avec le même arrêt précoce. Les références n''ont aucun paramètre appris : moyenne de classe la plus proche en pixels, et ACP suivie d''une LDA avec rétrécissement. Résultats. Les tests vérifient que chaque opérateur est égal à sa formule sur une petite entrée, qu''un mélange one-hot est l''opérateur unique et le superréseau one-hot le DAG discret, que la discrétisation choisit l''argmax, que l''équation écrite, relue à partir de son seul LaTeX, donne exactement les prédictions du DAG, et que les références sont égales à leurs formes closes. Exécution fournie (CPU, un thread, 3 graines), précision de test moyenne pour $n$ = 1, 5, 10, 50, 100 images par chiffre : CNN 0.35, 0.53, 0.64, 0.81, 0.85 ; DAG
  trouvé 0.38, 0.48, 0.52, 0.69, 0.82 ; ACP + LDA 0.41, 0.58, 0.66, 0.75, 0.76 ; moyenne de classe la plus proche 0.41, 0.56, 0.64, 0.68, 0.69. Images par chiffre pour atteindre 70 % : CNN 18, DAG 52, ACP + LDA 20 ; pour atteindre 80 % : CNN 45, DAG 91. Temps d''entraînement par exécution : CNN 0.4 à 1 s, recherche plus affinage 2 à 4 s. Donc, honnêtement : le CNN demande moins de données et moins de calcul pour une même précision à partir d''environ 10 images par chiffre ; en dessous, les références en forme close sont les meilleures et aucun modèle appris ne les bat ; le modèle structuré n''a pas gagné à très petit $n$ (à $n$ = 1, il fait jeu égal avec les moyennes de classe). Pourquoi : la recherche s''appuie sur un jeu de validation lui-même minuscule, donc son choix est bruité, et sa perte de validation préfère souvent les sommes de lignes (28 caractéristiques, 290 nombres appris, une perte plus calme), qui classent moins bien que l''ensemble des pixels (environ 2000 nombres appris)
  ; 7 des 15 DAG ont choisi les sommes de lignes. Comme rapporté pour DARTS, la recherche favorise les opérateurs sans paramètre : les filtres de Sobel occupent la plupart des arêtes et un filtre appris apparaît dans 3 des 15 DAG. En dehors de l''exécution fournie, des recherches plus courtes (20 ou 40 pas) ont choisi l''ensemble des pixels et atteint 0.74 à 0.79 à $n$ = 50, signe que la recherche plus longue s''engage trop ; cela a été observé sur le jeu de test, c''est donc une observation, pas un réglage ajusté. Le GPU (une GTX 1080 Ti) n''a apporté aucune accélération : ce sont des milliers de minuscules noyaux, et non l''arithmétique, qui déterminent le temps. results/stages.csv contient tous les chiffres, results/equation.tex toutes les équations trouvées. Travaux connexes. La recherche d''architecture neuronale (Zoph et Le 2017) et sa forme différentiable DARTS ; la régression symbolique, qui cherche des formules plutôt que des réseaux (AI Feynman, Udrescu et Tegmark 2020 ; PySR,
  Cranmer 2023 ; programmation génétique, Koza 1992) ; LeNet (LeCun et al. 1998) pour le CNN. Données : MNIST (LeCun, Cortes et Burges), licence CC BY-SA 3.0 ; data/mnist_subset.npz contient 1000 images du réservoir d''entraînement et 2000 images de test (la licence de partage à l''identique s''applique à ce sous-ensemble), voir data/SOURCES.md. À vous de jouer. Modifiez show_n pour voir le DAG trouvé avec 1 ou 100 images par chiffre, augmentez le nombre de pas de recherche, ou prenez une seule graine pour une exécution rapide.'
meanings:
- 'la règle de typage : l''opérateur $o$ ne peut se trouver sur l''arête $e$ que s''il envoie la forme d''entrée de cette arête sur sa forme de sortie (cellule carte → carte, pooling, réduction carte → vecteur, tête vecteur → logits)'
- softmax masqué du tenseur d'architecture $\alpha$ (arêtes × opérateurs) ; la température $T$ descend de 1 à 0.001 de sorte que le mélange finit one-hot
- 'tous les opérateurs qu''un nœud alimente, calculés une seule fois pour toutes ses arêtes sortantes : une seule convolution donne Sobel-$x$, Sobel-$y$, le laplacien, Gabor et les filtres $3\times 3$ appris $K_e$'
- '$o$ répété ⇒ sommé : chaque nœud est la somme de ses arêtes entrantes mélangées ; la sortie de la cellule est l''empilement $(x, z_1, z_2, z_3)$'
- caractéristiques de la réduction $r$ (vec, sommes de lignes/colonnes, $|\mathcal F|$, gabarits $\langle z, \mu_k\rangle$, ACP $U^\top \mathrm{vec}$, moments), standardisées avec les images d'entraînement
- toutes les réductions × têtes mélangées au niveau des logits (leurs longueurs de caractéristiques diffèrent) ; linéaire $W\hat f + b$ ou prototypes $-e^\tau\lVert \hat f - p_k\rVert^2/D$, les deux initialisés à la moyenne de classe la plus proche
- 'DARTS du premier ordre : des pas sur $\theta$ sur un mini-lot d''entraînement, puis des pas sur $\alpha$ sur un mini-lot de validation'
- 'le DAG discret écrit en LaTeX, relu par un petit analyseur et évalué : exactement les mêmes prédictions que le DAG'
labels:
  search_steps: Pas de recherche DARTS (chacun une mise à jour de $\theta$ et de $\alpha$)
  retrain_steps: Pas d'affinage du DAG discret
  cnn_steps: Pas d'entraînement du CNN
  seeds: Graines par taille de jeu d'entraînement
  batch: Taille du mini-lot (équilibré entre les chiffres)
  show_n: Images d'entraînement par chiffre du DAG affiché
