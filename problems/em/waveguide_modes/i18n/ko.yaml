source_hash: 9c89c68f4f20
title: 직사각형 도파관 모드
summary: 속이 빈 금속관을 따라 어떤 장 패턴이 진행할 수 있을까요? 각 모드는 단면에서 2차원 헬름홀츠 방정식 $(\partial_i\partial_i + k_c^2)\psi = 0$의 해입니다. TM은 디리클레 벽, TE는 노이만 벽 조건을 씁니다. 이산 라플라시안을 torch.kron으로 조립하면 torch.linalg.eigh가 모든 모드와 차단 주파수를 한꺼번에 돌려줍니다.
notes: 기본 크기는 표준 WR-90 X 밴드 도파관(2.286 cm × 1.016 cm)이며, $\text{TE}_{10}$ 모드의 차단 주파수는 6.56 GHz입니다. 모드는 차단 주파수보다 높을 때만 $\beta = \sqrt{(\omega/c)^2 - k_c^2}$로 전파합니다. 같은 $(m, n \ge 1)$의 TE와 TM 모드는 차단 주파수가 같습니다. 상수인 TE 해($k_c = 0$)는 파동을 전달하지 않으므로 제외합니다. 기본 해상도에서 2차 유한 차분은 $k_c$를 정확한 값의 약 1 % 이내로 구합니다.
meanings:
- 격자점 $(x_a, y_b)$에서의 $E_z$(TM) 또는 $H_z$(TE)
- '같은 값을 평탄화: $m = a\cdot N_y + b$'
- 벽 조건을 모서리 원소에 넣은 1차원 $\partial^2$
- 2차원 라플라시안 $\partial_i\partial_i$ ($i$는 $x, y$에 대해 합)
- '고윳값과 정규직교 고유벡터: 차단 주파수와 모드 모양'
- $\pi\sqrt{(m/a)^2 + (n/b)^2}$, 수치 검증용
labels:
  a: 너비 $a$
  b: 높이 $b$
  n_modes: 모드 수
  n_grid: $b$ 방향 격자점 수
