source_hash: cb188a4168d9
title: '레너드-존스 유체: 분자 동역학과 동경 분포 함수'
summary: 주기적 상자 안에서 레너드-존스 퍼텐셜로 상호작용하는 원자 500개를 속도 베를레 방법으로 적분한다. 모든 쌍 벡터는 최소 이미지 규약을 적용한 하나의 브로드캐스트 텐서에 담기며, 세 상태점(기체, 삼중점 근처의 액체, 압축된 고체)이 하나의 배치로 실행된다. 베렌젠 온도 조절기로 온도를 맞춘 뒤 에너지를 보존하는 NVE 실행이 이어지고, 쌍 거리의 히스토그램이 $g(r)$을 준다. 기체는 평평하고, 액체는 감쇠하는 껍질, 고체는 날카로운 격자 봉우리를 보인다. 비리얼로 압력을 구한다.
notes: '환산 단위: 길이는 $\sigma$, 에너지는 $\varepsilon$, 질량 1, $T^* = k_BT/\varepsilon$, 시간 $\tau = \sigma\sqrt{m/\varepsilon}$. 아르곤은 $\sigma = 3.4$ Å, $\varepsilon/k_B = 120$ K이므로 액체 상태점은 약 86 K이다. 이는 1964년 Rahman이 액체 아르곤에 대해 수행한 시뮬레이션(Phys. Rev. 136, A405)에, 1967년 Verlet이 도입한 적분법과 $g(r)$ 분석(Phys. Rev. 159, 98)을 더한 것이다. 퍼텐셜은 $r_c = 2.5\sigma$에서 잘리고 그곳에서 0이 되도록 이동시켜 에너지가 연속이다. 압력에는 절단 거리 밖에서 $g = 1$을 가정하는 표준 꼬리 보정 $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$을 더한다. 베렌젠 온도 조절기는 속도를 목표 온도 쪽으로 다시 스케일하지만 정확한 정준 요동을 만들지는 않으므로 평형화에만 쓰고, 측정은 단순 NVE 실행에서 하며, 평평한 에너지 곡선이 적분기를 검증한다. 기체와 액체는 격자가 녹도록 뜨겁게 시작한다. 액체 $g(r)$의 첫 봉우리는 퍼텐셜 최소점 $2^{1/6}\sigma$ 근처에 있고, 이후 껍질들은 감쇠하며 약 $3\sigma$에서 $g \to 1$이 된다. 고체는 fcc 봉우리를 유지한다. 기체의 압력은 이상 기체 및 제2 비리얼 보정 $P = \rho T(1 + B_2\rho)$와 비교하며, $B_2$는 수치 적분한다. 실행이 짧으므로(몇 $\tau$) 평균에는 몇 퍼센트의 통계적 잡음이 있다. 전체 쌍 텐서는 단계마다 $O(N^2)$의 비용이 들며, 실제 코드는 셀 목록이나 이웃 목록으로 수백만 개의 원자를 다룬다.'
meanings:
- 환산 단위로 기체 $(0.05, 1.5)$, 액체 $(0.84, 0.72)$, 고체 $(1.10, 0.60)$
- fcc 격자에서 시작, 원자 $N = 4n^3$개, 상자 $L_s = (N/\rho_s)^{1/3}$
- 브로드캐스팅으로 모든 쌍 벡터를 한꺼번에 만든 뒤 가장 가까운 이미지로 감음
- 반복된 $a$ ⇒ 합산
- $-u^{\prime}(r)/r$, 대각과 $r_c = 2.5\sigma$ 밖에서는 0
- 반복된 $j$ ⇒ 합산; $d_{saji} = -d_{saij}$이므로 뉴턴 제3법칙이 저절로 성립
- '반 킥, 이동(상자 안으로 감음), 새 힘, 반 킥: 시간 가역적이며 에너지 보존'
- 평형화 동안에만 쓰는 베렌젠 온도 조절기
- $\rho T + W/3V$에 $r_c$ 밖 쌍에 대한 꼬리 보정을 더함
- 껍질당 쌍 수를 이상 기체의 개수 $\tfrac12 N\rho\,4\pi r^2\Delta r$로 나눔
labels:
  rho_liquid: 액체 밀도 $\rho^*$
  T_liquid: 액체 온도 $T^*$
  n_cells: 한 변의 fcc 단위 세포 수 ($N = 4n^3$)
  dt: 시간 간격 $\Delta t$
  equilibration_steps: 평형화 단계 수
  production_steps: 측정 단계 수
