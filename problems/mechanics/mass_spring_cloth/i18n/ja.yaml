source_hash: 6bb6cb4a204f
title: 質点–ばね系の布
summary: 構造ばね、せん断ばね、曲げばねで結ばれた質点の正方格子を、2つの角で固定し重力下で放す。接続行列 $D_{ea}$ がメッシュをテンソルに変える：1回の einsum ですべてのばねベクトルが、もう1回で各節点に働く力の合計が求まる。
notes: 対角線方向のせん断ばねは正方形がひし形につぶれるのを防ぎ、1節点おきに結ぶばねは布に曲げ剛性を与える。固定した2つの角は単に加速度を0にする。空気抵抗 $\gamma$ が唯一の損失なので、全エネルギーは減少しかしない（$dE/dt = -m\gamma\lvert\mathbf v\rvert^2$）。$\gamma = 0$ では保存される。ばねは硬いので、時間刻みは $\sqrt{m/k}$ で制限される。自己衝突は無視する。各節点の質量は 10 g、格子間隔は 10 cm である。
meanings:
- 節点 $a$ の位置；質点数 $N = n^2$
- 接続行列：ばね $e$ の両端で $-1$ / $+1$
- 繰り返される $a$ ⇒ 和をとる：各ばねに沿ったベクトル
- 現在のばねの長さ；$\ell^0_e$ は自然長
- 繰り返される $e$ ⇒ 和をとる：節点 $a$ に働くばねの合力
- 辺リスト上の scatter による同じ和
- 運動エネルギー + 弾性エネルギー + 重力ポテンシャルエネルギー
labels:
  n_side: 一辺あたりの質点数
  k: ばね定数 $k$
  damping: 空気抵抗 $\gamma$
  t_max: シミュレーション時間
