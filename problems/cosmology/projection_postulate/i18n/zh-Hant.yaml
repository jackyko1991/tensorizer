source_hash: 296b0fae0936
title: 投影公設：一個高維狀態，許多影子
summary: 這是一個推測性假說，並非已確立的物理：宇宙是維數 $D$ 極高的空間中的單一狀態 $\Psi$，觀察者量到的只是它在少數幾個維度上的投影。本步驟寫出公設並檢驗其數學。可見的比例 $\|P\Psi\|^2$ 服從 Beta$(d, D-d)$ 分佈，而一次測量被建模為隱藏區塊之間的競賽。每個結果配一個隱藏複數維度，正好給出玻恩定則；更多維度則產生偏差，而三縫實驗已排除這種偏差。到目前為止，這個想法重現了量子力學，而沒有超越它。
notes: 狀態：推測性。這是作者本人的假說（見系列說明），並非已確立的物理，也沒有任何實驗比起標準量子力學更支持它。這第一步把公設精確寫出，並檢驗它們所依賴的數學。公設如下。P0（唯一實在）：宇宙是維數為 $D$ 的空間中的單一狀態 $\Psi$，可能 $D\to\infty$。P1（投影）：觀察者只看到投影 $P:\mathbb C^D\to\mathbb C^d$，投到一個 $d$ 維子空間上；量到的量子態是 $\psi = P\Psi/\|P\Psi\|$，所以波函數是 $\Psi$ 的投影，而不是 $\Psi$ 本身。P2（事件）：測量是投影到某一確定的時間切片上，從而選出一個結果 $k$；各結果的權重來自 $\|P_k\Psi\|^2$，玻恩定則要被檢驗，而不是被假設。P3（唯一粒子）：所有粒子都是同一個物體的投影。P4（幾何）：彎曲時空是更高維平直嵌入的投影形狀，奇點是投影摺疊之處（其雅可比矩陣降秩）。P5（開放維數）：量子效應需要某個最小維數 $d_Q$，引力需要 $D$ 之內的某個 $d_G$；它們要估計或擬合，絕不手動設為 $3+1$。計算內容。(1) 測度集中：當 $\Psi$ 在 $\mathbb C^D$ 的球面上均勻分佈時，$\|P\Psi\|^2\sim$ Beta$(d, D-d)$，平均值為 $d/D$；以平均值、變異數及 Kolmogorov–Smirnov 檢定，對 $D$ 從 4 到 $D_{max}$ 驗證；不論 $D$ 為何，歸一化的 $\psi$ 都在小球面上均勻分佈。典型的觀察者只看到範數的 $d/D$ 比例，當 $D\to\infty$ 時趨於零。(2) 把 P2 具體化為投影競賽（作者的模型，在此形式化）：每個結果 $k$ 耦合到自己的一個由 $m$ 個隱藏複數維度組成的區塊，能量為 $E_k = \|h_k\|^2$，而 $|c_k|^2/E_k$ 最大的結果發生。當 $m = 1$ 時，$E_k\sim$ Exp(1)，指數競賽正好給出 $P(k) = |c_k|^2$：玻恩定則。當 $m > 1$ 時，$E_k\sim$ Gamma$(m)$，最可能的結果贏得太頻繁；兩個結果時 $P_1 = I_{|c_1|^2}(m, m)$，偏差隨 $m$ 增大。實數隱藏維度給出 Gamma$(m/2)$：一個實數維度給出反正弦定律
  $\tfrac2\pi\arcsin|c_1|$，兩個給出玻恩定則。(3) 維數計算（P5）：對 $K$ 個結果，競賽需要 $D\geq d + K$；$N$ 個糾纏的二能階系統需要 $D\geq 2^N$，對可觀測宇宙中 $\sim10^{80}$ 個粒子約為 $10^{3\times10^{79}}$，與 P0 的 $D\to\infty$ 一致。誠實說明：標準量子力學本來就使用完全相同的希爾伯特空間，取部分跡和投影也是標準做法。到目前為止，這個假說只是一種重新詮釋；任何可檢驗的新意，必須來自 $m > 1$ 的競賽或後續步驟預測出不同結果之處。Gleason 定理（1957）早已證明：當 $d\geq 3$ 時，希爾伯特空間上任何非情境性的機率指派都是玻恩定則。(4) 數據：在三縫裝置中（41 個屏幕區間加上一個「被擋住」的結果，各自有自己的隱藏區塊），競賽給出 Sorkin 參數 $\kappa\approx s\,(a-1)$，在 9 種分區下 $s$ 介於 0.56 和 0.74 之間，其中隱藏形狀參數為 $a = m$（複數）或 $m/2$（實數）。測量值（data/born_rule_tests.csv，引用的數字）：Sinha 等人（Science 329, 418, 2010）把 $|\kappa|$ 限制在 $10^{-2}$ 以下；Park 等人（核磁共振，New J. Phys. 14, 113025, 2012）$\kappa = 0.001\pm0.003$；Kauten 等人（New J. Phys. 19, 033017, 2017，開放取用，CC-BY 3.0）以預告單光子得 $0.0\pm1.6\times10^{-3}$，以衰減雷射得 $(1.3\pm1.8)\times10^{-4}$，以古典光得 $0.0\pm3.1\times10^{-5}$。取 $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ 並用最小斜率，單光子數據允許 $|a-1|\leq 6\times10^{-3}$；若每次光子偵測都是一次競賽，古典光數據允許 $|a-1|\leq 1.1\times10^{-4}$。$m = 2$ 的競賽給出 $\kappa\approx 1$，一個實數隱藏維度給出 $\kappa\approx
  0.1$，兩者都被排除；每個結果只有一個複數（兩個實數）隱藏維度能存活。這是對模型的約束，而不是對它的支持：$m = 1$ 恰好是無法與標準量子力學區分的情形。對 $\kappa$ 的對應取決於結果如何分區，因此使用最保守的斜率。系列的後續步驟（此處未建立）：P3（所有粒子作為同一物體的投影）、P4（彎曲時空作為平直嵌入的影子：依 Janet–Cartan 定理，解析的四維度規可局部嵌入 10 維平直空間，Schwarzschild 解可嵌入 6 維）、擬合引力的 $d_G$，以及尋找與標準物理不同的預測。
meanings:
- 觀察者看到的 $\Psi$ 範數比例，一次算出所有 $D$（巢狀狀態）
- 觀察到的狀態，對任何 $D$ 都在 $\mathbb C^d$ 的單位球面上均勻分佈
- 與 Beta$(d, D-d)$ 的 Kolmogorov–Smirnov 距離（以數值積分計算不完全 Beta 函數）
- 隱藏區塊 $k$ 在 $m = 1..M$ 維時的能量：Gamma$(m)$（複數）或 $2\,$Gamma$(m/2)$（實數）
- 投影競賽：$|c_k|^2/E_k$ 最大的結果發生
- 競賽的封閉形式；對 $j$ 求和（減去 $j = k$）即對其他結果的乘積
- 重複的狹縫指標 $s$ ⇒ 求和：每組開啟狹縫 $S$ 的振幅
- 競賽模型的 Sorkin 三路徑參數；玻恩定則下為 $0$
labels:
  D_max: 最大總維數 $D$（範例；計算使用一串直到此值的維數）
  d: 觀察者子空間維數 $d$（範例）
  m_max: 每個結果的最大隱藏維數 $m$
  outcomes: 結果數 $K$
  trials: 每種情況的隨機狀態與事件數
