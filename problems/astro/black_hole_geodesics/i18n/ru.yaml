source_hash: 31a92e6ff86f
title: 'Общая теория относительности: орбиты и падение вблизи чёрной дыры'
summary: Геодезические в метрике Шварцшильда; символы Кристоффеля получаются из $g_{\mu\nu}(x)$ автоматическим дифференцированием и свёртываются с помощью einsum. Связанная орбита прецессирует, а не замыкается; эффективный потенциал показывает последнюю устойчивую круговую орбиту (ISCO) на $6GM/c^2$ и фотонную сферу на $3GM/c^2$; радиальное падение достигает горизонта за конечное собственное время, а часы далёкого наблюдателя замирают.
notes: 'Единицы: $G = c = M = 1$, поэтому длины измеряются в $GM/c^2$ (1,5 км на массу Солнца), а горизонт находится при $r_s = 2$. Орбита начинается в перицентре с точными шварцшильдовскими энергией $E$ и моментом импульса $L$ орбиты с фокальным параметром $p$ и эксцентриситетом $e$. Интегрирование ведётся по собственному времени $\tau$ методом RK4; серый ньютоновский эллипс с теми же $p$ и $e$ замыкается. Смещение перигелия стремится к $6\pi GM/(c^2 p)$ при больших $p$ (43″ за столетие для Меркурия) и становится гораздо больше вблизи дыры. Связанные орбиты существуют лишь при $p > 6 + 2e$; ниже ISCO ($r = 6$) круговые орбиты неустойчивы, а при $r = 3$ по кругу может двигаться даже свет. При падении (справа внизу) падающие часы достигают горизонта примерно через $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$ (конечное время), но по шварцшильдовскому времени $t$ падение замедляется и замирает при $r = 2$; расчёт останавливается при $r = 2.1$, где эти координаты начинают отказывать.'
meanings:
- событие $(t, r, \theta, \varphi)$ на каждой геодезической, $G = c = M = 1$
- 4-скорость $dx^\mu/d\tau$
- метрика Шварцшильда, сигнатура $(-, +, +, +)$
- обратная метрика
- производные метрики через autograd, индекс производной последний
- повторяющийся $\sigma$ ⇒ суммирование ($z$ = батч)
- повторяющиеся $\alpha, \beta$ ⇒ суммирование
- $= -1$ для массивной частицы, проверка интегрирования
labels:
  p: Фокальный параметр $p$
  e: Эксцентриситет $e$
  n_orbits: Число оборотов
  dt: Шаг собственного времени $\Delta\tau$
  r_infall: Падение из покоя с радиуса
