source_hash: adf3aca0e79d
title: 'Протонная терапия: пик Брэгга'
summary: Тормозная способность Бете–Блоха $-dE/dz \propto 1/\beta^2$ интегрируется методом RK4 сразу для целого пакета энергий протонов. Доза накапливается непосредственно перед остановкой каждого протона (пик Брэгга), а взвешенная сумма энергетических слоёв даёт ровную дозу по опухоли почти без облучения за ней.
notes: 'Константы для воды: $K = 0.307$ МэВ·см²/моль, $Z/A = 0.555$, $I \approx 75$ эВ, $\rho = 1$ г/см³; оболочечные поправки и поправка на эффект плотности не учитываются. Проинтегрированный пробег (150 МэВ → около 15,8 см) совпадает с NIST PSTAR примерно до 1 % и описывается правилом Брэгга–Климана $R = \alpha E^p$ с $p \approx 1.75$. Разброс пробегов ($\sigma \approx 1.2\,\%$ от $R$) и энергетический разброс пучка скругляют пик; ядерные реакции моделируются лишь как потеря 1 %/см первичных частиц, поэтому отношение пика к входной дозе выше, чем в реальном пучке. Мегавольтный рентгеновский пучок (нарастание, затем $e^{-\mu z}$), нормированный на ту же дозу в опухоли, оставляет больше энергии на входе и продолжает идти за опухолью; протоны останавливаются. Все числа приближённые и только для обучения, не для клинического применения или планирования лечения.'
meanings:
- кинетическая энергия пучка $b$ на каждом шаге по глубине (RK4, все пучки вместе)
- $-dE/dz$ Бете–Блоха в МэВ/см, поэлементно по пакету
- 'исходная доза: энергия, теряемая на см в интервале глубины $k$'
- гауссов разброс пробегов + энергетический разброс, строки нормированы
- 'повторяющийся $k$ ⇒ суммирование: размытая кривая Брэгга'
- 'повторяющийся $k$ ⇒ суммирование: модифицированный (расширенный) пик Брэгга из $K$ энергетических слоёв'
- неотрицательный метод наименьших квадратов (проекционный градиент) для ровной дозы в мишени
