source_hash: 9e25d7739db7
title: Численное интегрирование и порядок сходимости
summary: Формула трапеций, формула Симпсона и квадратура Гаусса–Лежандра — все они взвешенная сумма $\sum_k w_k f(x_k)$, один einsum сразу по многим подынтегральным функциям. Узлы и веса Гаусса получаются из задачи на собственные значения (Голуб–Уэлш). В двойном логарифмическом масштабе ошибки убывают с наклонами 2 и 4 или экспоненциально, пока излом или особенность не отнимает высокий порядок.
notes: 'Для гладкой подынтегральной функции ошибка формулы трапеций убывает как $h^2 \propto N^{-2}$, а Симпсона — как $N^{-4}$: удвоение $N$ делит их на 4 и 16. Квадратура Гаусса–Лежандра с $N$ узлами точно интегрирует каждый многочлен степени до $2N - 1$, поэтому для аналитической функции её ошибка падает экспоненциально, пока не достигнет ошибки округления float64 около $10^{-16}$. Эти порядки происходят из разложений Тейлора, поэтому им нужны производные. При изломе $|x - a|$ вторая производная — пик: каждое правило, перекрывающее излом, делает там ошибку $O(h^2)$, так что Симпсон и Гаусс откатываются к порядку 2 (кривая зубчатая, потому что положение излома внутри его отрезка меняется с $N$). При $(1+x)^{\alpha}$ производные расходятся на конце отрезка: формулы трапеций и Симпсона падают до порядка $1 + \alpha$, а Гаусс, узлы которого сгущаются к концам, — примерно до $2 + 2\alpha$. Лекарство — разбить отрезок в точке излома или сделать замену переменных, чтобы подынтегральная функция
  стала гладкой. Попробуйте целое $\alpha$ (многочлен) и смотрите, как Гаусс становится точным, или поставьте излом в узел сетки ($a = 0.3$ является узлом, когда $N$ кратно 20): тогда формула трапеций точна для двух прямых кусков и падает до ошибки округления.'
meanings:
- равноотстоящие узлы; веса $h(\tfrac12, 1, \dots, 1, \tfrac12)$ и $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- трёхдиагональная матрица рекуррентного соотношения Лежандра, $\beta_k = k/\sqrt{4k^2 - 1}$ рядом с диагональю
- собственные значения — узлы Гаусса–Лежандра, собственные векторы в столбцах
- веса Гаусса из первой компоненты каждого собственного вектора; в сумме они дают $\int_{-1}^{1} dx = 2$
- гладкая, изломанная и концевая подынтегральные функции в каждом узле
- 'повторяющийся $k$ ⇒ суммирование: все три интеграла сразу'
labels:
  n_max: Наибольшее $N$
  kink: Положение излома $a$
  alpha: Показатель степени на конце $\alpha$
