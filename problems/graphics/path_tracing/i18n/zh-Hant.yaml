source_hash: a93d458517c4
title: Cornell box 的蒙地卡羅路徑追蹤
summary: 擬真渲染以蒙地卡羅方法求解渲染方程。每個取樣的每條相機光線都作為一個批次，在由平面與球體構成的盒子中追蹤：餘弦加權反彈、在每個命中點向面光源發射陰影光線，並以俄羅斯輪盤結束路徑。觀察雜訊以 $1/\sqrt{N}$ 下降，以及紅牆與綠牆將顏色滲染到白牆上，這只有全域照明才能捕捉。
notes: 對漫射（Lambertian）表面，渲染方程表示離開某點的光等於其自發光加上所有入射光的反射比例 $\rho$。入射光又是其他表面的出射光，因此這個積分是遞迴的。路徑追蹤器以隨機路徑取代它。餘弦加權取樣（$p = \cos\theta/\pi$）抵消了 BRDF 與餘弦，因此通量每次反彈只乘上一個因子 $\rho$。在每個命中點，向光源上隨機一點發射的陰影光線加入直接光（下一事件估計），這比等待某次反彈碰巧擊中小光源的雜訊小得多。只取第一個命中點的光，便得到僅直接光的影像。之後每次反彈都會加入間接光：陰影中柔和的補光、更亮的天花板，以及紅與綠的顏色滲染。測試套件中的熔爐測試會檢查這個估計器。一個所有牆面都發出 $L_e$ 並反射 $\rho$ 的封閉盒子，各處的輻射亮度必須為 $L_e/(1-\rho)$。使用餘弦取樣時，結果的變異數為零。誤差以 $1/\sqrt N$ 下降，因為每個像素是 $N$ 個獨立取樣的平均。雜訊減半需要四倍的取樣，這就是正式產品的渲染器使用降噪器的原因。
meanings:
- 光線 $r = (s, p)$ 的原點與方向：$P$ 個像素中每一個各有 $N$ 個抖動取樣，為一個批次
- 平面 $p$ 為 $n_{pi} x_i = d_p$，裁切到邊界框；光源是一個小平面
- 每條光線到每個平面的距離；重複的 $i$、$j$ ⇒ 求和
- 每條光線與每個球的 $\lvert o + t\omega - c\rvert^2 = r^2$ 之根
- 沿每條光線最近的命中：哪個圖元、在何處，以及其法向量
- 下一個方向：圓盤中的均勻點抬升到半球上；$f\cos\theta/p = \rho$
- 路徑通量：第 $k$ 次反彈處找到的光有多少到達相機
- 下一事件估計：向面光源上隨機一點 $y$ 發射的陰影光線
- 俄羅斯輪盤：隨機結束黯淡的路徑，但對存活者重新加權，因此平均值不變
- 像素顏色：對取樣索引 $s$ 取平均
labels:
  resolution: 影像大小
  spp: 每像素取樣數 $N$
  reference_spp: 參考每像素取樣數
  bounces: 反彈次數（輪盤之前）
  termination: 路徑終止
  light_power: 光源輻射亮度 $L_e$
