source_hash: 2ee80d9bf824
title: 블로흐 방정식과 스핀 에코
summary: 블로흐 방정식은 벡터곱 $\varepsilon_{ijk} M_j \Omega_k$에 이완을 더한 것입니다. 공명 이탈 진동수 $\Delta\omega_n$이 조금씩 다른 수백 개의 아이소크로맷을 배치 RK4 한 번으로 함께 진행시킵니다. 90° 펄스 뒤에 이들은 부채꼴로 퍼지고 신호는 $T_2^*$로 사라지며, $TE/2$에서 180° 펄스를 주면 다시 모여 $TE$에서 에코를 만듭니다. 에코의 높이는 진짜 $T_2$로만 감쇠합니다.
notes: 시간은 ms, 진동수는 rad/ms 단위입니다. 각 아이소크로맷은 이완을 빼면 $\lvert\mathbf M\rvert$를 유지하지만, 앙상블 평균은 위상 결맞음을 잃습니다. 로렌츠형 분포에서 자유 유도 감쇠는 $e^{-t/T_2^*}$를 따르며 $1/T_2^* = 1/T_2 + 1/T_2^{\prime}$입니다. 180° 펄스는 모든 위상을 뒤집으므로 앞서가던 스핀이 이제 뒤처지고, $TE$에서 모두 다시 정렬됩니다. 이것은 정적인 불균일성은 상쇄하지만 무작위적인 $T_2$ 손실은 상쇄하지 못하므로, 에코 높이는 $e^{-TE/T_2}$를 따라갑니다. 재집속 펄스를 여러 번 주면($y$축에 대한 180° 펄스열, CPMG) 에코가 줄지어 나타나 $T_2$를 그려 냅니다. 펄스는 같은 블로흐 방정식으로 계산하는 짧은 직사각형 '하드' 펄스이며, 공명에서 멀리 벗어난 스핀은 불완전하게 재집속됩니다. 값은 예시용이며 교육 목적으로만 쓰고 임상용이 아닙니다. 가우스 분포, 더 긴 $T_2^{\prime}$, 또는 단일 에코를 시도해 보세요.
meanings:
- 회전 좌표계에서 아이소크로맷 $n$의 자화, 성분 $i \in \{x, y, z\}$
- '레비-치비타 기호: 로런츠 힘에서와 똑같은 벡터곱'
- '회전 좌표계에서의 $\gamma\mathbf B$: 펄스 동안 $xy$ 평면의 RF 장 $\omega_1$, $z$ 방향의 공명 이탈 $\Delta\omega_n$'
- '반복된 $j, k$ ⇒ 합: 모든 아이소크로맷의 세차 운동 $\mathbf M\times\boldsymbol\Omega$'
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$. $j$에 대해 $M_{nj} - M^0_j$와 축약
- 자기장 불균일성에 의한 세차 진동수 분포, 폭 $1/T_2^{\prime}$
- '수신 코일이 보는 것: $n$에 대해 합한 평균 가로 자화'
labels:
  T1: 세로 이완 $T_1$
  T2: 가로 이완 $T_2$
  t2_prime: 불균일성 시간 $T_2^{\prime}$
  TE: 에코 시간 $TE$
  n_echoes: 에코 수(180° 펄스 수)
  n_spins: 아이소크로맷 수
  spread: 공명 이탈 선 모양
