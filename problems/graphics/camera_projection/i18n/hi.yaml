title: पिनहोल कैमरा
summary: 'एक 3D दृश्य 2D छवि कैसे बनता है: मॉडल, व्यू और प्रक्षेप $4\times4$ आव्यूह समघात (homogeneous) निर्देशांकों पर कार्य करते हैं, फिर परिप्रेक्ष्य विभाजन और व्यूपोर्ट पिक्सेल देते हैं। एक वायरफ़्रेम वस्तु के सभी शीर्ष एक einsum से एक साथ प्रक्षेपित होते हैं जबकि कैमरा परिक्रमा करता है। परिप्रेक्ष्य की तुलना लंबकोणीय (orthographic) प्रक्षेप और डॉली ज़ूम से करें, समांतर रेखाओं को लुप्त बिंदुओं पर मिलते देखें, और उसी कैमरे को $K[R\,|\,\mathbf t]$ के रूप में लिखें।'
notes: 'चौथा निर्देशांक ही कैमरे को रैखिक बनाता है: स्थानांतरण आव्यूह का एक स्तंभ बन जाता है, और परिप्रेक्ष्य, जो गहराई से भाग देता है, एक ऐसा आव्यूह बन जाता है जो गहराई को $\tilde x_4$ में कॉपी करता है और अंत में एक विभाजन होता है। $w = 0$ वाले बिंदु दिशाएँ हैं; उनके प्रतिबिंब लुप्त बिंदु हैं, और सभी क्षैतिज दिशाएँ क्षितिज पर लुप्त होती हैं, जो कैमरा नीचे देखने पर छवि केंद्र के ऊपर होता है। लंबकोणीय कैमरे में $\tilde x_4 = 1$ है, इसलिए इसमें कोई लुप्त बिंदु नहीं होते और दूर की वस्तुएँ छोटी नहीं होतीं, जैसे इंजीनियरिंग ड्रॉइंग और कई रणनीति खेलों में। डॉली ज़ूम (“Vertigo प्रभाव”) कैमरे को हिलाते हुए दृष्टि क्षेत्र बदलता है ताकि $d\,\tan(\text{fov}/2)$ स्थिर रहे: वस्तु का आकार वही रहता है पर उसके पीछे का फ़र्श खिंच जाता है। विज़न लाइब्रेरियाँ आगे की ओर इंगित $z$ के साथ $\lambda\,\hat{\mathbf u} = K[R|\mathbf t]\mathbf X$ उपयोग करती हैं; ग्राफ़िक्स API पीछे की ओर इंगित $z$ के साथ $P V M$ उपयोग करते हैं; दोनों में केवल $y$ और $z$ अक्षों को पलटने का अंतर है, और टर्मिनल जाँचता है कि वे समान पिक्सेल
  देते हैं।'
meanings:
- समघात निर्देशांकों $(x, y, z, 1)$ में शीर्ष $v$; किनारे सूचकांक युग्म $(E, 2)$ हैं
- 'वस्तु → विश्व: स्केल, $y$ के परितः घूर्णन, फिर स्थानांतरण (चौथा स्तंभ)'
- 'विश्व → कैमरा: पंक्तियाँ कैमरा अक्ष हैं, स्थानांतरण $-R\,\mathbf e$'
- 'कैमरा → क्लिप समष्टि; इसकी अंतिम पंक्ति $-z$ को $\tilde x_4$ में कॉपी करती है (लंबकोणीय: $\tilde x_4 = 1$)'
- 'दोहराए गए $j, k, l$ ⇒ योग: हर शीर्ष तीनों आव्यूहों से एक कॉल में'
- $\tilde x_4$ से परिप्रेक्ष्य विभाजन, फिर व्यूपोर्ट; छवि पंक्तियाँ नीचे की ओर गिनी जाती हैं
- फ़ोकस दूरी $f = \tfrac H2 / \tan\tfrac{\text{fov}}2$ और मुख्य बिंदु; दृढ़ गति विश्व → कैमरा
- 'अनंत पर एक बिंदु $(\hat{\mathbf d}, 0)$ स्थानांतरण खो देता है: $\hat{\mathbf d}$ के अनुदिश सभी रेखाएँ वहाँ मिलती हैं'
