title: 需要多少维度？投影假说的维数预算
summary: 这是一个推测性假说，并非已确立的物理：投影的想法需要多少隐藏维度，而实验又允许多少？量子方面，根据第 1 步，每个结果需要一个隐藏复数维度，$N$ 个纠缠粒子需要 $2^N$ 个，但这些维度存在于希尔伯特空间中，不必是空间中的方向。引力方面，$n$ 个半径为 $R$ 的紧致维度会在 $R$ 以下改变牛顿定律。扭秤、LHC 以及超新星与中子星的限制，逐一填满一张 $(n, R)$ 图。每个 $n$ 都能存活，但前提是 $R$ 足够小：$n = 1$ 时小于 38.6 μm，$n = 2$ 时小于 $2\times10^{-10}$ m。受到约束，但未被排除。
notes: 状态：推测性；受到约束，但未被排除。这是投影假说（作者本人的推测性想法，见系列说明；并非已确立的物理）的第 3 步，对应公设 P5：量子效应需要某个 $d_Q$、引力需要某个 $d_G$ 个维度，这些数目是估计出来的，从不人为设定。第 1 步（cosmology/projection_postulate）发现投影竞赛每个结果恰好需要一个隐藏复数维度；第 2 步（cosmology/projection_one_particle）切割了一条世界线；第 4 步（cosmology/projection_singularity_fold）把奇点当作投影的折叠来处理。不预设任何 $n$：这张图扫描 $n = 0$ 到 $n_{max}$，$R$ 从普朗克长度到 1 m。先讲已知的物理。(a) 量子方面：对 $K$ 个结果，竞赛以 $d + K$ 个维度重现玻恩定则，而 $N$ 个纠缠的二能级系统需要维数为 $2^N$ 的希尔伯特空间；标准量子力学使用同一个空间，而它的维度不是空间中的方向。如果把它们读作空间方向，$N$ 个量子比特就需要 $2^{N+1} - 3$ 个额外实数维度（一对贝尔态需要 5 个），这个数目每当粒子发生纠缠就会改变，而任何固定的空间流形都不会如此。(b) 引力方面：在 $3 + n$ 个空间维度中，高斯定律给出引力 $G_D M/r^{n+2}$（用 autograd 计算穿过 $S^{n+2}$ 的通量，对 $n = 0..6$ 作了检验）。如果这 $n$ 个维度是半径为 $R$ 的圆，镜像求和会在 $R$ 以外把它变成牛顿的 $G_4 M/r^2$，其中 $G_4 = |S^{n+2}|G_D/4\pi(2\pi R)^n$（对 $n = 1, 2, 3$ 作了检验）。在稍外处，第一个 Kaluza–Klein 引力子能级给出一个汤川项，$\alpha = 8n/3$（2-环面为 $16/3$，与 PDG 综述一致），$\lambda = R$。Arkani-Hamed、Dimopoulos 与 Dvali（1998）的 ADD 关系，采用 PDG 与 LHC 实验所用的约定 $M_{Pl}^2 = 8\pi R^n M_D^{n+2}$，重现了 PDG 的数字：$R = 30$ μm、$n = 2$ 给出 $M_D = 4.0$ TeV，而
  $M_D = 1$ TeV 对 $n = 1..6$ 分别需要 $10^{12}$ m、0.5 mm、……、0.1 MeV$^{-1}$。限制（data/gravity_bounds.csv，引用的数字；扭秤与 LHC 的数据行与 cosmology/hierarchy_extra_dimensions 中附带的相同，此处再次引用）。Eöt-Wash 扭秤在 56 μm 以上（Kapner et al., PRL 98, 021101, 2007）以及 38.6 μm 以上（Lee et al., PRL 124, 101101, 2020）排除了 $|\alpha| = 1$；由于对每个 $n$ 都有 $\alpha\geq 1$，对所有 $n\geq 1$ 都排除了 $R > 38.6$ μm（这是保守的：测量曲线在更大的 $\lambda$ 处持续下降）。对 $n = 2$，Tan et al.（PRL 116, 131101, 2016）给出 $R < 30$ μm。ATLAS 单喷注搜索（PRD 103, 112006, 2021, CC-BY 4.0）对 $n = 2..6$ 给出 $M_D > 11.2, 8.5, 7.1, 6.4, 5.9$ TeV。SN1987A 的冷却对 $n = 2$（3）给出 $M_D > 27$（2.4）TeV（Hanhart et al., PLB 509, 1, 2001），而被俘获的 KK 引力子对中子星的加热给出 $M_D > 1700$（76）TeV（Hannestad and Raffelt, PRD 67, 125008, 2003），两者均引自 PDG 2024 综述。每个限制都成为 $(n, R)$ 网格上的一个布尔掩码，并用玩具点对照手算答案作检验。结果：$R_{max} = 38.6$ μm（$n = 1$）、$1.7\times10^{-10}$ m（$n = 2$，中子星）、$2.6\times10^{-12}$ m（$n = 3$），而 $n = 4..6$ 则为 LHC 半径（$5\times10^{-13}$ 到 $2.5\times10^{-15}$ m）。对 $n\geq 7$ 只附带了扭秤限制；LHC 限制随 $n$ 缓慢减弱，若外推（此处未做）会把 $R$ 推向 $1/M_D\sim
  10^{-20}$ m。$M_D = 1$ TeV 的 ADD，也就是层级问题的原始解法，对 $n = 1..6$ 已被排除。预算：最小值为 $n = 0$，因为引力不需要额外的空间维度，而量子的隐藏维度不必是空间性的；没有最大值，因为只要 $R < R_{max}(n)$，数据允许任何 $n$。假说采取哪种解读：对 P1 与 P2 采用希尔伯特空间解读（隐藏维度是状态空间的维度，因此 $D_Q\geq 2^N$ 对空间不构成约束），对 P4 与 P5 采用几何解读（嵌入维度；如果引力能进入其中，它们必须是紧致的且小于 $R_{max}(n)$，否则它们只是嵌入的坐标，而不是可以前往的地方）。结论：受到约束，但未被排除，也没有新的预测：只有当假说把 $n$ 与 $R$ 固定在这些限制附近时，它才会变得可检验。
meanings:
- 重复的 $i$ ⇒ 求和：在 $S^{n+2}$ 上随机点的向外引力（autograd）；通量在每个半径上都相同
- 质量及其绕 $n$ 个圆的镜像，对镜像指标 $I$ 求和：内部为 $1/r^{n+2}$，外部为 $G_4/r^2$
- 某一引用限制所允许的最大半径：扭秤为 $\lambda_{max}$，对撞机与天体物理限制则为 $M_D = M_b$ 时的 ADD 半径
- 每一类限制一张布尔图，广播到整个网格
- 维数预算：紧致维度只有在此半径以下才被允许
- $n$ 个半径为 $R$ 的维度下引力的基本尺度（Giudice–Rattazzi–Wells 约定，与 PDG 所用相同）
- $N$ 个纠缠量子比特所需的希尔伯特空间维数 $2^N$（第 1 步）
labels:
  n_max: 图上额外维度的最大数目 $n$（从 0 起的所有 $n$ 都会扫描）
  R_points: 图上的半径，从普朗克长度到 1 m 按对数间隔取样
  M_star: ADD 线的基本尺度 $M_D$
  qubits: 量子计数所用的纠缠量子比特数 $N$
