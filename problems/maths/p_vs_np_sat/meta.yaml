notes: >
  P vs NP asks whether every decision problem whose yes-answers have certificates that can be checked in polynomial
  time (the class NP) can also be solved in polynomial time (the class P). Cook (1971) and Levin (1973) proved that
  satisfiability is NP-complete: a polynomial-time algorithm for 3-SAT would give one for every problem in NP. It is
  unknown whether one exists. Most researchers expect P $\ne$ NP, but there is no proof, and known barriers
  (relativisation, natural proofs, algebrisation) rule out whole families of proof strategies. The question is one of
  the seven Clay Millennium Prize problems and is open. This program proves nothing about it: exhaustive search is
  merely the obvious algorithm, and the best known 3-SAT algorithms are still exponential (about $1.307^n$ for PPSZ).
  What it shows is the asymmetry. The verifier is one gather plus an OR and an AND, $O(M)$ work. The search builds the
  full truth table, one bit per assignment packed 32 per integer, so the tensor has $2^n$ bits and its time doubles
  with each variable (bottom right; at small $n$ fixed overheads dominate). Random 3-SAT with $M = \alpha n$ clauses
  has a sharp threshold: Friedgut (1999) proved that the transition becomes sharp as $n \to \infty$, statistical
  physics (Mézard, Parisi and Zecchina 2002) predicts $\alpha_c \approx 4.267$, and Ding, Sly and Sun (2015) proved the
  predicted threshold for $k$-SAT with large $k$. For $k = 3$ the value 4.267 is still a conjecture; what is proven is
  that random formulas are satisfiable with high probability below $\alpha = 3.52$ and unsatisfiable above 4.49. At small $n$ the 50% crossing lies above 4.27 and drifts down as $n$ grows
  (finite-size scaling). Tests check that the verifier agrees with brute force on every assignment, that one clause
  removes exactly $1/8$ of all assignments, that the mean number of solutions equals the first moment $2^n (7/8)^M$,
  that $P_{\mathrm{sat}}$ is monotone and collapses near the threshold, and that the window narrows with $n$. The
  search-cost panel counts the nodes of a depth-first backtracking search that fixes $x_0, x_1, \ldots$ in turn and
  backs up as soon as a fully assigned clause is false. Below the threshold it finds a solution quickly, far above it
  short contradictions prune the tree early, and the hardest formulas sit in the transition window (for this simple
  search at $n = 16$ near $\alpha \approx 5$; solvers with unit propagation peak near 4.3). Try more variables to watch
  the curves sharpen, or more formulas for smoother curves.
