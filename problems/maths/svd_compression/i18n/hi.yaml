title: SVD से छवि संपीडन
summary: विचित्र मान वियोजन (SVD) एक छवि को कोटि-1 परतों $\sigma_r\,\mathbf u_r\mathbf v_r^T$ के योग के रूप में लिखता है, सबसे प्रबल पहले। केवल $k$ परतें रखना सर्वोत्तम कोटि-$k$ सन्निकटन है, इसकी त्रुटि ठीक छोड़े गए विचित्र मानों की ऊर्जा है, और एक रंगीन छवि तीन आव्यूह हैं जो एक बैच कॉल में वियोजित होते हैं।
notes: $H\times W$ छवि की $k$ परतें संग्रहीत करने में $HW$ के बजाय $k(H + W + 1)$ संख्याएँ लगती हैं, इसलिए संपीडन अनुपात $HW / k(H + W + 1)$ है। एकार्ट–यंग प्रमेय कहता है कि कोई भी कोटि-$k$ आव्यूह फ़्रोबेनियस मानक में $A$ के अधिक निकट नहीं है, और त्रुटि छोड़े गए विचित्र मानों के वर्गों का योग है। टर्मिनल इसे कई $k$ के लिए वास्तव में पुनर्निर्मित छवियों से जाँचता है। दृश्य के चिकने भाग (आकाश प्रवणता) पहली कुछ परतों में आ जाते हैं, जबकि तीक्ष्ण किनारों, विकर्णों और पाठ को कई परतें चाहिए। इसीलिए विचित्र मान पहले तेज़ी से गिरते हैं और फिर धीरे-धीरे क्षयित होते हैं, और इसीलिए JPEG इसके बजाय स्थानीय कोसाइन रूपांतरण उपयोग करता है। पहली परत मोटे तौर पर औसत चमक प्रोफ़ाइल है; बाद की परतें विवरण जोड़ने के लिए चिह्न में बारी-बारी बदलती हैं (लाल और नीला)। छवि प्रक्रियात्मक रूप से बनाई गई है, इसलिए कुछ भी डाउनलोड नहीं होता। बड़ी छवि या ऊँची अधिकतम कोटि आज़माएँ।
meanings:
- matplotlib से बने दृश्य का चैनल $c$, पंक्ति $i$, स्तंभ $j$, मान $[0, 1]$ में
- 'दोहराया गया $c$ ⇒ योग: भार $(0.299, 0.587, 0.114)$ के साथ चमक'
- प्रति चैनल एक SVD, अग्रणी सूचकांक $c$ पर बैच; $R = \min(H, W)$
- 'दोहराया गया $r \le k$ ⇒ योग: पहली $k$ कोटि-1 परतें'
- 'कोई दोहराया सूचकांक नहीं: धूसर छवि की एक बाह्य-गुणनफल परत'
- हर $k$ के लिए एक साथ एकार्ट–यंग त्रुटि, कोई छवि पुनर्निर्मित किए बिना
- dB में शिखर सिग्नल-रव अनुपात, छोड़े गए $\sigma$s से माध्य वर्ग त्रुटि के साथ
labels:
  size: छवि आकार (पिक्सेल)
  k_max: दिखाई गई सबसे बड़ी कोटि $k$
  frames: एनिमेशन फ़्रेम
