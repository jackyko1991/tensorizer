source_hash: 278f16a6d4b6
title: '아인슈타인 1905: 움직이는 물체와 $E = mc^2$'
summary: 1905년 아인슈타인의 상대성이론 논문 두 편을 그가 직접 밟은 경로대로 따라간다. 두 가지 공준 — 모든 관성계에서 같은 법칙, 빛은 언제나 $c$ — 에서 출발해, 한 묶음의 빛시계가 움직이는 시간은 $\gamma$배 느려지고, 막대는 $1/\gamma$배 짧아지며, 동시성은 관찰자에 따라 달라지고, 속도를 더해도 결코 $c$를 넘지 않음을 보여 준다. 질량–에너지 논문(빛 에너지 $L$을 방출한 물체는 질량 $L/c^2$을 잃는다)은 He-4의 질량 결손과 $e^+e^-$ 쌍소멸로 확인하고, 프리시와 스미스가 1963년 워싱턴산과 해수면에서 센 뮤온 수에 맞춘 피팅은 $\gamma \approx 9$를 준다.
notes: '이것은 아인슈타인의 1905년 ''기적의 해'' 논문 네 편 중 하나 — 정확히는 두 편이다: 「움직이는 물체의 전기역학에 관하여」(6월)와 「물체의 관성은 그 에너지 함량에 의존하는가?」(9월). 나머지는 광양자 논문(quantum: 광전 효과와 광양자)과 브라운 운동(thermodynamics: 무작위 걷기와 확산)이다. 기하학으로서의 상대성이론은 특수 상대성이론: 민코프스키 도표(astro), 장 텐서는 $F^{\mu\nu}$의 로런츠 부스트(em), 충돌은 4-운동량과 2체 붕괴(nuclear)를 참고하라. 단위는 $c = 1$, 거울 간격은 $D = 1$. 아인슈타인의 질량 논증: 정지한 물체가 앞으로 $L/2$, 뒤로 $L/2$를 방출한다. 속도 $v$로 움직이는 계에서 빛은 $L$보다 큰 $\gamma L$을 운반하고, 두 계 모두에서의 에너지 보존 때문에 물체의 운동 에너지는 $L(\gamma - 1)$만큼 줄어야 한다. 이는 정확히 질량 $L/c^2$이 지닐 양이다(그는 저속 항 $\tfrac12 (L/c^2)v^2$만 남겼다). 원자 질량은 AME2020. 실제 데이터(data/frisch_smith_1963_muons.csv): D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508 — 같은 에너지로 감속된 뮤온이 워싱턴산 해발 1917 m에서 시간당 $563 \pm 10$개, 해수면에서 시간당 $408 \pm 9$개(발표된 측정값; 위키백과 요약은 후자를 412로 반올림한다). 비행에는 약 6.4 μs, 즉 2.2 μs인 뮤온 수명의 거의 세 배가 걸리므로, 시간 지연이 없다면 시간당 약 30개만 도착할 것이다. 계수값으로부터 뮤온 시계는 0.71 μs, $\gamma \approx 9.1 \pm 0.8$을 얻는다(논문은 측정한 붕괴 곡선으로 $8.8 \pm 0.8$). 속도로부터의 예측은 공기 중에서 $\beta \approx 0.995$에서
  $\approx 0.989$까지의 감속(이온화 손실 $dE/dx$, 등온 대기)을 적분하여 약 8.4로, 논문과 같다. 로시와 홀(1941)이 에코 호수와 덴버에서 우주선 뮤온으로 이 효과를 처음 보였다.'
meanings:
- '시각 $t$에서 시계 $b$의 광자: 수평 속도 $\beta_b$, 수직 속도 $\sqrt{1-\beta_b^2}$, 따라서 언제나 $c$'
- 한 번의 째깍은 $\gamma\cdot 2D/c$ 걸린다; 지그재그로부터 째깍 수를 센다
- $x$ 방향 부스트 묶음, $\eta = \operatorname{diag}(-1, 1, 1, 1)$
- '반복된 $\nu$ ⇒ 합산: 모든 계에서의 모든 사건; 기차의 섬광은 $\Delta t'' = -\gamma\beta\Delta x$를 얻는다'
- 어떤 부스트에도 변하지 않는 간격
- '움직이는 계에서 본 두 빛 펄스: 합하여 $\gamma L$, 따라서 $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$'
- '질량 결손 × 931.494 MeV/u (He-4: 28.30 MeV)'
- 두 뮤온 계수율에 대한 $\chi^2(\gamma)$에 autograd로 뉴턴 단계 적용
labels:
  beta_fast: 가장 빠른 시계의 속도 $\beta$
  n_clocks: 빛시계 개수
  dEdx: 공기 중 뮤온 에너지 손실 $dE/dx$
