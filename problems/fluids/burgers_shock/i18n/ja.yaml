source_hash: 63ee714594c5
title: バーガース方程式と衝撃波の形成
summary: 最も単純な非線形流体方程式：波の速い部分が遅い部分に追いつき、波形が急峻になり、$t^* = 1/\max(-u_0')$ 付近で衝撃波が形成される。粘性はそれを薄く、しかし滑らかに保つ。微分は $N\times N$ 行列なので、偏微分方程式は各項1回の einsum となり、厳密なコール–ホップ解と照合される。
notes: $u\,u_x$ を $(\tfrac12u^2)_x$ と書く（保存形）ことで、スキームは $\int u\,dx$ を厳密に保存する。粘性がなければ特性曲線 $x = x_0 + u_0(x_0)\,t$ は $t^* = 1/\max(-u_0')$ で交差し、解は多価になってしまう。粘性があると代わりに幅 $\sim\nu/\Delta u$ の衝撃波ができる。中心差分には $|u|\Delta x/\nu \lesssim 2$ が必要であり、512 点では $\nu$ をあまり小さくできないのはこのためである。コール–ホップ変換 $u = -2\nu\,\partial_x\ln\varphi$ はバーガース方程式を熱方程式に変え、破線の厳密解曲線を与える。オフセット $U_0$ を非零にすると衝撃波が移動する。
meanings:
- 格子点 $x_i$ における速度（周期境界）
- 行列としての中心差分 $(f_{i+1} - f_{i-1})/2\Delta x$
- 2階差分 $(f_{i+1} - 2f_i + f_{i-1})/\Delta x^2$
- 繰り返される $j$ ⇒ 和をとる：流束 $\tfrac12 u^2$ の微分
- 粘性項
- 保存量：$D$ と $L$ の各列の和は0
- 厳密解、出発点についてソフトマックス重み付き平均
labels:
  nu: 粘性 $\nu$
  amplitude: $u_0 = U_0 + A\sin x$ の振幅 $A$
  offset: オフセット $U_0$
  t_max: シミュレーション時間
