source_hash: dc1d9350a90f
title: Efecto túnel en un doble pozo
summary: 'Una partícula en un potencial de doble pozo simétrico. torch.linalg.eigh muestra que los dos estados más bajos forman un par muy próximo: un estado par y uno impar, separados por una diminuta energía de túnel $\Delta E$. Su suma es una partícula situada en el pozo izquierdo; a medida que las dos fases relativas se separan, pasa por efecto túnel al pozo derecho y vuelve con período $2\pi/\Delta E$, aunque su energía esté por debajo de la barrera.'
notes: 'Unidades $\hbar = m = 1$. Las energías del doblete están por debajo de la cima de la barrera $V_0$, así que clásicamente la partícula nunca podría cruzarla. Con solo dos estados en juego, $\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$ (salvo una fase global): es $(\varphi_0 + \varphi_1)$ a la izquierda en $t = 0$ y $(\varphi_0 - \varphi_1)$ a la derecha en $t = \pi/\Delta E$. $P_L(t) = \cos^2(\Delta E\,t/2)$ se cumple salvo el pequeño solapamiento de cada estado con el pozo "equivocado". $\Delta E$ disminuye de forma aproximadamente exponencial con la altura y la anchura de la barrera (un factor WKB $e^{-\int\kappa\,dx}$), de modo que una barrera algo más alta ralentiza enormemente el efecto túnel: el tiempo simulado se mide en períodos de túnel $2\pi/\Delta E$ para que la animación muestre siempre oscilaciones completas.'
meanings:
- 'potencial cuártico: mínimos en $x = \pm a$, barrera $V_0$ en $x = 0$'
- cinética $-\tfrac12\,D2$ más $V$ en la diagonal
- energías y estados; $\varphi_0$ par, $\varphi_1$ impar, $\Delta E = E_1 - E_0$
- '$(1, 1, 0, 0, \dots)/\sqrt2$: mezcla a partes iguales del doblete, localizada a la izquierda'
- '$n$ repetido ⇒ sumado: evolución exacta en la base propia'
- función escalón que selecciona la mitad izquierda; $P_L$ suma sobre $x$
labels:
  V0: Altura de la barrera $V_0$
  a: Separación de los pozos $a$ (mínimos en $\pm a$)
  periods: Tiempo simulado
  n_grid: Puntos de malla
