title: 'वर्कफ़्लो ऑर्केस्ट्रेशन की शक्ति: टेंसर DAG के रूप में Circle of Willis कोहोर्ट'
summary: 'एक संवहनी अध्ययन चरणों की एक शृंखला है (MRA का विभाजन, सेंटरलाइन ग्राफ़ निकालना, वाहिकाओं को मापना, इनलेट और आउटलेट रखना, प्रवाह हल करना, रिपोर्ट), और हर चरण पहले से एक टेंसर प्रोग्राम है, इसलिए Snakemake जिस वर्कफ़्लो का ऑर्केस्ट्रेशन करता है वह भी टेंसर हो सकता है। Circle of Willis के छह खुले (CC0) TopCoW MRA स्कैन पर एक ही Snakefile को Snakemake (ऑफ़लाइन) और एक टेंसर DAG इंजन दोनों चलाते हैं: जॉब ग्राफ़ क्रोनेकर गुणनफलों का योग है, उसके स्तर, क्रिटिकल पाथ और पुनः-चलाने वाला समुच्चय मैट्रिक्स–वेक्टर पुनरावृत्तियाँ हैं, और परिणाम जॉब-दर-जॉब मेल खाते हैं। फिर बचाया गया समय, वह कहाँ से आता है, और वह जो फ़ाइल DAG नहीं दे सकता: पूरी पाइपलाइन से होकर एक ग्रेडिएंट। केवल शैक्षिक, नैदानिक उपयोग के लिए नहीं।'
notes: 'विचार। वर्कफ़्लो ऑर्केस्ट्रेशन की शक्ति वाला दृष्टिकोण Jacky Ko का है, जो संवहनी पाइपलाइनों पर उनके HPC और PhD कार्य से आया: यदि पाइपलाइन का हर चरण एक टेंसर प्रोग्राम है, तो वर्कफ़्लो मैनेजर जिस DAG को शेड्यूल करता है वह भी टेंसर हो सकता है। यह समस्या उसे बनाती और मापती है। वर्कफ़्लो। data/Snakefile में आठ नियम (segment, centreline, measure, boundaries, flow, report, cohort, all) और दो वाइल्डकार्ड हैं: केस (छह स्कैन) और स्थिति (दोनों ICA इनलेट खुले, या बायाँ ICA बंद)। हर नियम का shell workflow.py चलाता है, जो एक केस के लिए वही टेंसर फ़ंक्शन बुलाता है जिसे टेंसर इंजन सभी केसों के लिए एक बार बुलाता है। Snakemake 9.27.1 को WSL2 में ऑफ़लाइन चलाया गया (उसका अपना परिवेश, इस प्रोजेक्ट का हिस्सा कभी नहीं) और उसके आउटपुट संदर्भ के रूप में data/snakemake में शामिल हैं: जॉब DAG (--dag), ड्राई-रन जॉब सूची, एक इनपुट बदलने के बाद पुनः-चलाने वाला समुच्चय, --summary, हर जॉब के आरंभ और समाप्ति समय, और उसके जॉबों द्वारा लिखी कोहोर्ट तालिका। परीक्षण जाँचते हैं कि टेंसर इंजन में वही 50 जॉब और 79 किनारे
  हैं, कि Snakemake के क्रम हमारे $A$ का सम्मान करते हैं और हमारे स्तर देते हैं, कि पुनः-चलाने वाला समुच्चय वही है, और कि कोहोर्ट तालिका लिखे गए 9 अंकों तक समान है। पुनः-चलाने पर एक बात: किसी इनपुट को touch करने से Snakemake ने कुछ भी दोबारा नहीं चलाया, क्योंकि छोटी फ़ाइलों के लिए वह चेकसम की तुलना करता है; संदर्भ फ़ाइल के बाइट बदलता है (ऐरे वही), और तब 10 जॉब दोबारा चलते हैं, जैसा $x = s \lor Rs$ बताता है। समय। शामिल रन में Snakemake ने 1 कोर पर 118 s, 6 पर 43 s और 12 पर 27 s लिए (कम व्यस्त मशीन पर पहले के रन में: 79, 23 और 22 s); टेंसर इंजन वही काम एक थ्रेड पर लगभग 5 से 10 s में करता है। ईमानदार हिसाब: हर Snakemake जॉब एक नई प्रक्रिया है जो Python शुरू करती है और torch तथा जॉब मॉड्यूल import करती है (लगभग 1.8 s, data/snakemake/startup.csv, यानी कुल 115 s जॉब समय में से लगभग 88 s), .npz फ़ाइलें पढ़ती और लिखती है, और शेड्यूल होती है; टेंसर इंजन यह कीमत एक बार चुकाता है। यहाँ CPU पर बैचिंग से खुद बहुत कम लाभ होता है (केसों को प्रक्रिया के भीतर एक-एक करके चलाने में लगभग उतना ही, कभी-कभी कम
  समय लगता है), इसलिए लाभ स्टार्ट-अप और फ़ाइलों से आता है, और यह तब घटता है जब हर जॉब एक भारी GPU-बद्ध हल हो जो स्टार्ट-अप को बौना कर दे। $c$ कोर पर कोई भी शेड्यूल $\max(\mathrm{CP}, W/c)$ से बेहतर नहीं हो सकता, यानी max-plus पुनरावृत्ति से मिला क्रिटिकल पाथ और कुल कार्य को $c$ से भाग, और मापे गए रन इसका पालन करते हैं; सर्वोत्तम शेड्यूल खोजना सामान्यतः NP-hard है (Graham की लिस्ट शेड्यूलिंग $W/c + \mathrm{CP}$ के भीतर रहती है)। ग्रेडिएंट। फ़ाइल DAG संख्याएँ भेजता है, अवकलज नहीं। सॉफ़्ट थ्रेशोल्ड विभाजन, त्रिज्याओं और प्रवाह को अवकलनीय बनाता है, इसलिए $\partial s_{\mathrm{L\,MCA}}/\partial\theta$ (बहिर्वाह में बाएँ MCA का हिस्सा) हर केस के लिए एक ही बैकवर्ड पास से मिलता है और केंद्रीय परिमित अंतरों से मेल खाता है, जिनके लिए Snakemake को दो अतिरिक्त पूर्ण रन लगेंगे। सेंटरलाइन ग्राफ़ (टोपोलॉजी) और संबद्ध-घटक मास्क स्थिर रखे जाते हैं। पाइपलाइन। विभाजन: सामान्यीकृत TOF तीव्रता का सॉफ़्ट थ्रेशोल्ड $\sigma((I - \theta)/w)$, हार्ड मास्क $I > \theta$ में से 64 वॉक्सेल से छोटे घटक हटाए गए, TopCoW
  मास्क के सापेक्ष Dice लगभग 0.86 से 0.91। सेंटरलाइन: TopCoW वाहिका लेबलों से, जंक्शन जहाँ लेबल वाली वाहिकाएँ मिलती हैं (3.5 mm के भीतर के संपर्क मिलाए जाते हैं; केवल शारीरिक जोड़े गिने जाते हैं, इसलिए साथ-साथ चलती दो A2 नहीं), हर अंतिम वाहिका का एक मुक्त सिरा (यात्रा समय $\ell/R^2$ वाले min-plus आइकोनल से उसका सबसे दूर का वॉक्सेल, पुनः केंद्रित), और क्रमागत नोडों के बीच सबसे छोटा केंद्रित पथ (जैसे एन्यूरिज़्म समस्या में VMTK का टेंसर विकल्प)। माप: लेबल वाली वाहिकाओं के पास का हर वॉक्सेल अपने निकटतम सेंटरलाइन बिंदु को जाता है, इसलिए किसी किनारे की त्रिज्या सॉफ़्ट आयतन से $\sqrt{V_e/(\pi L_e)}$ है; हर वाहिका के लिए असममिति $2(r_R - r_L)/(r_R + r_L)$; जहाँ समतल त्रिज्या प्रोफ़ाइल अपनी माध्यिका के आधे से नीचे गिरे वहाँ स्टेनोसिस फ़्लैग (इन स्वस्थ नियंत्रणों में ऐसे फ़्लैग विभाजन की कलाकृतियाँ हैं)। सीमाएँ, Venova की तरह: इनलेट ICA और बेसिलर धमनी के मुक्त सिरों पर, आउटलेट MCA, ACA और PCA के सिरों पर; Pcom और Acom के सिरे कभी सीमा नहीं होते। प्रवाह: एक घटे-क्रम का स्थिर मॉडल, हर किनारे पर Poiseuille
  चालकता, खुले इनलेट पर $P$ = 90 mmHg, हर आउटलेट Murray लोड $g_k \propto r_k^3$ से होकर 0 Pa तक निकाला जाता है, जिसे इस तरह समायोजित किया गया कि प्रतिरोध-रहित नेटवर्क 10 ml/s ले जाए; एक बैच रैखिक हल। कोलैटरल परीक्षण बायाँ ICA बंद करता है: जहाँ Acom या Pcom खुला हो, बायाँ गोलार्ध परफ़्यूज़्ड रहता है। सरलीकरण: न्यूटोनियन रक्त, कठोर सीधी नलियाँ, कोई स्पंदन नहीं, कोई 3D प्रवाह नहीं (एन्यूरिज़्म समस्या एक वाहिका पर 3D CFD करती है), 0.5 mm वॉक्सेल पर थ्रेशोल्ड त्रिज्याएँ, साहित्य-स्तर के दाब और प्रवाह। डेटा। TopCoW 2024, MRA_Lausanne उपसमुच्चय (Zenodo 10.5281/zenodo.15692630, लाइसेंस CC0): Circle of Willis लेबलों सहित 20 स्वस्थ-नियंत्रण TOF-MRA स्कैन। छह केस 0.5 mm पर 96×80×48 क्रॉप के रूप में शामिल हैं (छवि और लेबल, कुल 1 MB से कम); data/SOURCES.md में प्रसंस्करण और उद्धरण हैं (Yang et al., TopCoW चैलेंज; Di Noto et al. 2022, Lausanne कोहोर्ट)। मुख्य TopCoW रिलीज़ का उपयोग नहीं किया गया (उसका लाइसेंस व्यावसायिक उपयोग को प्रतिबंधित करता है)। परिणाम। GIF के अलावा दो 3D परिणाम हैं। results/centreline.pvd
  शरीर-रचना है: हर केस की विभाजन सतह (मार्चिंग टेट्राहेड्रा) और उसका सेंटरलाइन ग्राफ़, दोनों वाहिका की त्रिज्या से रंगे हैं। results/flow.pvd 1D Poiseuille नेटवर्क का प्रवाह है, 11 चरणों में जिनमें बायाँ ICA संकरा होता जाता है: टाइमस्टेप स्टेनोसिस की गंभीरता s है, यानी ल्यूमेन के व्यास का खोया हुआ अंश (0 खुला, 1 बंद)। इसकी परतें हैं: निकटतम सेंटरलाइन किनारे के भित्ति अपरूपण प्रतिबल $\tau_w = 4\mu|Q|/(\pi r^3)$ से रंगी वाहिका की सतह (दाब दूसरे ऐरे के रूप में), स्ट्रीमलाइनें और कण (दोनों गति से रंगे), और तीरों सहित इनलेट और आउटलेट डिस्क। यहाँ कोई 3D CFD नहीं है: स्ट्रीमलाइनें 1D मॉडल का आदर्शीकृत अक्षीय प्रवाह हैं, यानी हर वाहिका की सेंटरलाइन के समानांतर उसकी त्रिज्या के $\rho = 0, 0.35, 0.7$ पर रेखाएँ, Hagen–Poiseuille गति $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$ के साथ; कोई द्वितीयक प्रवाह नहीं है, और संधियों पर ये टूट जाती हैं। हर चरण एक स्थिर अवस्था है; कण अपनी स्ट्रीमलाइनों पर हर चरण में केवल 4 ms के एक निश्चित छद्म-समय जितना आगे बढ़ते हैं (अंत पार करने पर अपनी वाहिका की शुरुआत से फिर
  चलते हैं), ताकि गतियाँ दिख सकें। स्टेनोसिस इनलेट के साथ श्रेणी में जुड़ा 10 mm का Poiseuille खंड है, इसलिए इसकी चालकता $(1 - s)^4$ के अनुपात में घटती है; s = 0 और s = 1 ठीक वर्कफ़्लो की दो स्थितियाँ हैं, और बीच के चरण केवल टेंसर इंजन चलाता है (हर चरण में एक बैच्ड हल)। results/stenosis_sweep.csv में हर चरण और केस के लिए बाएँ ICA का अंतर्प्रवाह और बाएँ MCA का हिस्सा है; बाकी संख्याएँ results/timings.csv, results/equivalence.csv और results/cohort.csv में हैं।'
meanings:
- नियम $s$ वह फ़ाइल पैटर्न पढ़ता है जिसे नियम $r$ लिखता है; शामिल Snakefile से ही पार्स किया गया
- 'हर वाइल्डकार्ड अक्ष $a$ (केस, स्थिति) के लिए: जब दोनों नियमों में वह हो तो $I$ (प्रति-केस किनारे $A \otimes I$), प्रसारण के लिए $\mathbb 1$, कोहोर्ट रिपोर्ट जैसे संग्रह के लिए $\mathbb 1^\top$'
- जब जॉब $i$ जॉब $j$ का आउटपुट पढ़ता है तब $A_{ij} = 1$; 50 जॉब, 79 किनारे
- लंबाई $k$ के बंद वॉक; सभी शून्य ⇔ $A$ निलपोटेंट ⇔ अचक्रीय
- पथ $j \to i$ गिनता है; इसका 0/1 पैटर्न पहुँच-योग्यता है (बूलियन बार-बार वर्ग)
- 'बूलियन मैट्रिक्स–वेक्टर पुनरावृत्ति से टोपोलॉजिकल स्तर: जॉब तब तैयार है जब उसकी पंक्ति में $A\,\neg\mathrm{done} = 0$ हो'
- सबसे जल्दी समाप्ति समय, एक max-plus (ट्रॉपिकल) स्थिर बिंदु; $\max_i t_i$ क्रिटिकल पाथ है
- $s$ के जॉबों (बदली गई फ़ाइल के पाठक) के पुराने हो जाने के बाद दोबारा चलाए जाने वाले जॉब
- सॉफ़्ट विभाजन, थ्रेशोल्ड $\theta$ (हर केस के लिए एक) में अवकलनीय
- 'सभी केसों की सभी वाहिकाओं के वॉक्सेल ग्राफ़ पर एक साथ min-plus आइकोनल: मुक्त सिरे और सेंटरलाइनें'
- अपनी सेंटरलाइन के निकटतम वॉक्सेलों के सॉफ़्ट आयतन से किनारे की त्रिज्या
- Poiseuille चालकताओं $G_e$ और Murray आउटलेट लोड $g_k$ के साथ Kirchhoff, एक बैच हल; खुले इनलेट पर Dirichlet पंक्तियाँ $p = P$
- प्रवाह, माप और विभाजन से होकर अवकलित बाएँ MCA का प्रवाह-हिस्सा, हर केस एक ही बैकवर्ड पास में
labels:
  threshold: सामान्यीकृत तीव्रता पर विभाजन थ्रेशोल्ड $\theta$
  cores: सीमा $\max(\mathrm{CP}, W/c)$ में कोर $c$
