source_hash: 9f4f33f51aa8
title: ニュートリノ振動
summary: ニュートリノは決まったフレーバー（$\nu_e, \nu_\mu, \nu_\tau$）で生成されるが、わずかに異なる位相をもつ3つの質量固有状態として伝搬する。PMNS 混合行列と質量添字についての1回の複素 einsum で、基線長の格子全体についてあらゆるフレーバー変化の確率が求まり、$\nu_\mu$ ビームが飛ぶうちに $\nu_\tau$ や $\nu_e$ に変わる様子が示される。
notes: $U$ はユニタリなので、どの距離でも $\sum_\beta P(\alpha\to\beta) = 1$ である：ニュートリノはフレーバーを変えるが失われはしない。2フレーバーだけなら公式は $P = \sin^2 2\theta\,\sin^2(1.267\,\Delta m^2 L/E)$ に帰着する。ここでは大きな $\Delta m^2_{31}$ が速い「大気」振動を与え（$\theta_{23} \approx 45°$ なので最初の $\nu_\mu$ の落ち込みは $L/E \approx 500$ km/GeV 付近で、主に $\nu_\tau$ に変わる）、小さな $\Delta m^2_{21}$ が遅い「太陽」振動を与える（$15\,000$ km/GeV 付近）。下の点はサンプルのニュートリノである：それぞれ、その距離にある検出器が記録するフレーバーを、計算した確率に従って抽選して示す（シード固定）。簡略化：真空振動のみ——地球や太陽内部の MSW 物質効果は含めない——で、質量順序は正順序。既定のパラメータは現在の全体フィットに近い。$\nu_\mu \to \nu_e$ ビームで $\delta_{CP}$ = 0 と 270° を比べてみよう。
meanings:
- フレーバー $\alpha$ × 質量固有状態 $i$；einsum('ab,bc,ci->ai') による3つの回転の積
- 効くのは差 $\Delta m^2_{21}, \Delta m^2_{31}$ だけ；$m_1^2 = 0$
- 対数間隔の距離（km）
- 各基線長での各質量固有状態の位相（eV²、km、GeV で $2.534\,m^2 L/E$）
- 繰り返される $i$ ⇒ 和をとる：3つの質量固有状態が干渉する
- 各基線長での9つの遷移確率すべて
labels:
  energy: ニュートリノのエネルギー $E$
  l_max: 最長基線長 $L_{\max}$
  flavour: 生成時のフレーバー
  theta12: $\theta_{12}$
  theta13: $\theta_{13}$
  theta23: $\theta_{23}$
  delta_cp: $\delta_{CP}$
  dm21: $\Delta m^2_{21}$
  dm31: $\Delta m^2_{31}$
