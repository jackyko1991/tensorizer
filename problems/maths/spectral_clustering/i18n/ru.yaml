title: Спектральная кластеризация и лапласиан графа
summary: Превратите облако точек в граф (гауссовы веса на рёбрах $k$ ближайших соседей), постройте лапласиан графа $L = D - W$ и его нормированную форму $L_{sym}$ как тензоры и считайте кластеры с его младших собственных векторов. Две луны и концентрические кольца, на которых обычный k-means терпит неудачу, разделяются идеально; тот же лапласиан на решётке даёт моды колебаний барабана.
notes: 'Почему это работает: $f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$ — сумма квадратов, поэтому $L$ положительно полуопределена, и эта форма равна нулю, только если $f$ постоянна вдоль каждого ребра, то есть постоянна на каждой компоненте связности. Поэтому число нулевых собственных значений в точности равно числу компонент (сравните два подсчёта в терминале), а индикаторные векторы компонент натягивают это собственное подпространство. Когда кластеры соединены лишь несколькими слабыми рёбрами, собственные значения малы, а не нулевые, и собственные векторы близки к индикаторам; минимизация $f^{\mathsf T}Lf$ — ослабленная версия разреза наименьшего числа рёбер, нормированный разрез Ши и Малика (2000). Второй собственный вектор (вектор Фидлера) даёт наилучшее разбиение на две части. Обычный k-means проводит прямые границы вокруг центров, поэтому разрезает луны и кольца пополам; во вложении (верхний ряд, следите, как скользят точки) кластеры — разделённые сгустки, и k-means
  работает. Большая щель в спектре после $k$-го собственного значения подсказывает число кластеров. На решётчатом графе $g\times g$ лапласиан $L = L_1\otimes I + I\otimes L_1$ есть минус дискретный лапласиан со свободными (неймановскими) краями, поэтому его собственные векторы — стоячие волны $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$ с $\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$: те же моды, что у колеблющегося барабана в теме о волнах (где края, наоборот, закреплены). Моды $(a, b)$ и $(b, a)$ имеют общее собственное значение, и eigh возвращает некоторую смесь этой пары, поэтому некоторые выглядят диагональными. Результаты зависят от $\sigma$ и $k$: слишком мало соседей разбивает кластер на части, слишком много добавляет мосты между кластерами. Дополнительное чтение: U. von Luxburg, A tutorial on spectral clustering (2007); Ng, Jordan и Weiss (2001).'
meanings:
- 'точка $i$, координата $a$: две луны, два кольца или три сгустка, с истинными метками для оценки'
- 'повторяющийся $a$ ⇒ суммирование: все квадраты расстояний сразу'
- гауссово сходство сохраняется, только если $j$ — один из $k$ ближайших соседей $i$ или наоборот; симметрично, нулевая диагональ
- 'повторяющийся $j$ ⇒ суммирование: степень каждой точки'
- каждая строка в сумме даёт 0, поэтому постоянный вектор имеет собственное значение 0
- $s_i = d_i^{-1/2}$; суммирования нет, $i$ и $j$ остаются свободными
- собственные значения по возрастанию; первые $k$ собственных векторов со строками, нормированными на единичную длину, — спектральное вложение
- итерации Ллойда со стартом k-means++; во вложении кластеры — плотные сгустки
labels:
  n_points: Точек в наборе данных $N$
  noise: Шум
  k_neighbours: Ближайшие соседи $k$
  sigma: Ширина ядра $\sigma$
  grid: Сторона решётчатого графа $g$
