source_hash: 8adb8e4369f3
title: 'विशिष्ट आपेक्षिकता: मिन्कोव्स्की आरेख और लोरेंत्ज़ बूस्ट'
summary: 'घटनाएँ 2-सदिश $x^\mu = (t, x)$ हैं और जड़त्वीय फ़्रेम का परिवर्तन एक आव्यूह $\Lambda^\mu{}_\nu$ है, जो einsum से सभी पर एक साथ लगाया जाता है। एक जुड़वाँ किसी तारे तक जाकर लौटता है: घरेलू फ़्रेम और बूस्ट किए गए फ़्रेम के आरेख झुकी समकालिकता रेखाएँ, अपरिवर्तनीय प्रकाश शंकु, और यात्री की घड़ी को $\int\sqrt{1 - v^2}\,dt$ टिक करते दिखाते हैं — जो घर पर रहे जुड़वाँ से कम है।'
notes: 'मात्रक: वर्ष और प्रकाश-वर्ष, अतः $c = 1$ और प्रकाश किरणें धराशायी 45° रेखाएँ हैं। यात्री चाल $v$ से दूरी $L$ पर स्थित तारे तक जाता है, तुरंत मुड़ता है और लौट आता है। एम्बर रेखा उन घटनाओं का समुच्चय है जिन्हें यात्री "अभी" कहता है: जाते समय $v$ से झुकी, यह मोड़ पर घरेलू जुड़वाँ की विश्व रेखा के पार घूम जाती है, और यहीं घरेलू जुड़वाँ के "गायब" वर्ष जाते हैं। विरोधाभास सममित नहीं है क्योंकि केवल यात्री जड़त्वीय फ़्रेम बदलता है। यात्री के जाने वाले फ़्रेम में बैठने के लिए दाएँ पैनल का बूस्ट $v$ के बराबर रखें, या वापसी के लिए $-v$। प्रकाश शंकु हर फ़्रेम में अपना आकार बनाए रखता है।'
meanings:
- एक घटना $(t, x)$, $\mu \in \{0, 1\}$, $c = 1$
- मिन्कोव्स्की मीट्रिक $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- 'दोहराया गया $\nu$ ⇒ योग: विश्व रेखा या ग्रिड की हर घटना एक साथ बूस्ट'
- अंतराल का वर्ग, हर फ़्रेम में समान
- विश्व रेखा के अनुदिश $\sqrt{-\Delta s^2}$ का संचयी योग
- $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$ के बराबर
labels:
  v: यात्री की चाल $v/c$
  distance: तारे की दूरी $L$
  beta_view: दाएँ पैनल का बूस्ट $\beta$
