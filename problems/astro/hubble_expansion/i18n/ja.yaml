source_hash: b6ae9044b340
title: ハッブル膨張
summary: 銀河は固定された共動格子上にあり、格子はスケール因子 $a(t)$ で引き伸ばされる。1つの外積 $x_{gi} = a\,q_{gi}$ ですべての銀河が動き、どの銀河から見ても他の銀河は $v = H d$ で遠ざかる。格子を横切る光子も同じ因子で引き伸ばされる：$1 + z = a_\mathrm{obs}/a_\mathrm{emit}$。
notes: 単位：Mpc、Gyr、km/s/Mpc。物質優勢（アインシュタイン–ド・ジッター）模型では $a = (t/t_0)^{2/3}$ なので $H = 2/(3t)$ は時間とともに減少する。ド・ジッター模型では $a = e^{H_0 (t - t_0)}$ で $H$ は一定のままである。いずれの場合も $v = Hd$ はどの観測者にとっても厳密に成り立つ。観測者を移動しても、青い点は中心から見た白丸と同じ直線上に乗る。銀河自身は空間中を動いているのではなく（特異速度なし）、銀河間の空間が広がっている。光子は1ステップあたり共動距離 $c\,dt/a$ を進む。遠方の銀河が $c$ を超える速さで遠ざかってもよい。局所的に光を追い越すものはないからである。
meanings:
- 銀河 $g$ の共動座標（変化しない）
- 各時刻のスケール因子、現在 $a = 1$
- 物理的位置：外積であり、和をとる添字はない
- $\dot a/a$：物質では $2/(3t)$、ド・ジッターでは一定
- 各銀河のハッブル流の速度
- 観測者 $o$ から見た位置（ブロードキャストによる引き算）
- 繰り返される $g, i$ ⇒ 和をとる：$v$ 対 $d$ の最小二乗傾き
- 放射以後の光子の波長の伸び
labels:
  model: 膨張則 $a(t)$
  H0: 現在のハッブル定数 $H_0$
  n_grid: 一辺あたりの銀河数
  spacing: 共動格子間隔
  observer_x: 観測者の列（格子単位）
  observer_y: 観測者の行（格子単位）
  a_start: 開始時のスケール因子 $a_\mathrm{emit}$
  a_end: 終了時のスケール因子 $a_\mathrm{obs}$
