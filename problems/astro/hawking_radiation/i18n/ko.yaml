source_hash: 7a350e6eef20
title: 호킹 복사와 블랙홀 증발
summary: 블랙홀은 호킹 온도 $T_H = \hbar c^3/(8\pi G M k_B)$의 흑체처럼 빛난다. 한 번의 브로드캐스팅으로 여러 질량과 파장에 대한 플랑크 법칙을 한꺼번에 계산하고, RK4로 질량 손실 $dM/dt = -\alpha/M^2$을 적분한다. 블랙홀은 줄어들고 뜨거워지며, $t \propto M^3$ 후에 폭발로 끝난다.
notes: 모두 SI 단위. 태양 질량 블랙홀의 온도는 $6\times10^{-8}$ K로 2.7 K 마이크로파 배경보다 훨씬 차가우므로, 실제 천체 블랙홀은 방출보다 흡수가 더 많다. 아주 작은 (원시) 블랙홀만 증발한다. 빅뱅 때 생긴 약 $2\times10^{11}$ kg의 블랙홀이 지금쯤 증발을 마치고 있을 것이다. 이 모형은 광자만 세고 지평선을 넓이 $4\pi r_s^2$의 완전 흑체로 취급한다. 실제 블랙홀은 중성미자, 중력자, 그리고 충분히 뜨거우면 더 무거운 입자도 방출하므로 수명이 짧아지며, 회색체 인자가 스펙트럼 모양을 바꾼다. 시간 간격은 각 RK4 단계가 남은 질량의 일정 비율을 소모하도록 정한다. 애니메이션은 $\log M$의 같은 간격으로 진행하므로 마지막 몇 프레임은 아주 짧은 시간만 나타낸다. 지평선 반지름은 보이도록 $M^{0.35}$로 그렸다.
meanings:
- '블랙홀 질량 배치(kg): 태양, 지구, …, 애니메이션의 블랙홀'
- 호킹 온도, 원소별 계산
- 로그 간격의 파장 격자
- T[:, None]과 lam[None, :]의 브로드캐스팅으로 구한 플랑크 스펙트럼
- 빈의 법칙 $b/T_H$
- 지평선의 슈테판–볼츠만 복사 일률
- $-P/c^2$, RK4로 적분
- 해석적 수명, 적분 결과와 비교
labels:
  log10_mass: 초기 질량 $\log_{10}(M_0/\mathrm{kg})$
  burn_fraction: RK4 단계당 소모되는 질량 비율
