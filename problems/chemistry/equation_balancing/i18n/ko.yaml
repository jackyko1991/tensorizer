source_hash: 94551bc4044d
title: 화학 반응식 맞추기 (영공간)
summary: 반응식을 맞춘다는 것은 모든 원소와 전하를 보존하는 계수 $\nu_s$를 찾는 것이다. 행렬로 쓰면 $M\nu = 0$, 즉 계수는 원소–화학종 행렬의 영공간이다. 배치 SVD 한 번으로 메테인 연소부터 산성 용액의 과망가니즈산염까지 일곱 반응을 동시에 풀고, 맞추는 방법이 유일하지 않은 반응을 찾아낸다.
notes: '각 원소는 미지 계수에 대한 선형 방정식 하나를 주므로, 화학종 $S$개와 원소 $E$개는 $E\times S$ 연립방정식 $M\nu = 0$이 된다. 보통 $M$의 계수(rank)는 $S-1$이고 해는 직선을 이룬다. 즉 맞춘 반응식은 공통 인수를 제외하면 유일하다. SVD는 그 직선을 특이값 0(마지막 것)에 대응하는 오른쪽 특이 벡터로 찾는다. 가장 작은 성분으로 나누고 배수 $k = 1, 2, \dots$를 시도하면 가장 작은 정수를 얻는다. 예: $\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$. 이온의 경우 전하는 행 하나를 더하는 것일 뿐이다. 전하가 없으면 $\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$의 영공간은 2차원이 되지만, 전하를 넣으면 익숙한 $1{:}5{:}8 \rightarrow 1{:}5{:}4$ 산화–환원 반응식이 나온다. 과산화물 예 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$는 특이값 0이 두 개다. 이 식에는 두 독립 반응($2\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$와 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$)이 숨어 있고, 이들의 어떤 양의 조합도 역시 맞는다. 대수만으로는 하나를 고를 수 없으며, 실제 비율은 화학(반응 속도론, 조건)이 정한다. 코드는 2차원 영공간에서 계수 하나를 0으로 두어 찾은 기저 반응을 보여 준다. tensors.py의 `REACTIONS`에 직접 반응을 추가해 보자. 파서는 ''Ca3(PO4)2''나 ''Fe^3+'' 같은 괄호와 전하를 읽는다.'
meanings:
- 반응 $r$의 화학종 $s$에 들어 있는 원소 $e$의 원자 수; 행 q는 전하(작은 화학식 파서에서 얻음)
- 반응물은 $+1$, 생성물은 $-1$
- '합산하는 첨자 없음: 각 열에 부호를 붙임'
- 모든 반응을 하나의 텐서로 채움; 쓰지 않는 열은 $\nu_s = 0$으로 고정
- 배치 SVD; 특이값은 내림차순
- '사라지는 특이값의 개수: 1 → 유일한 해, 2 → 두 독립 반응'
- 마지막 특이 벡터를 가장 작은 성분이 1이 되도록 스케일한 뒤, 정수를 주는 첫 $k_r$로 곱함
- '반복된 $s$ ⇒ 합산: 생성된 원소 $e$의 원자 수; 모든 원소와 전하에 대해 0'
labels:
  show: 행렬로 보여 줄 반응
  max_scale: 시도할 최대 배수 $k$
