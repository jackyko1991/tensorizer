title: टंकी का खाली होना (टॉरिसेली)
summary: पानी छिद्र से टॉरिसेली चाल $\sqrt{2gh}$ से निकलता है, इसलिए स्तर पहले तेज़ी से और अंत में धीरे गिरता है। भिन्न छिद्र आकारों वाली टंकियों को एक बैच टेंसर के रूप में साथ समाकलित किया जाता है और सटीक हल $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$ से तुलना की जाती है।
notes: 'टॉरिसेली नियम मुक्त पृष्ठ (विराम में, क्योंकि $A \gg a$) और धार के बीच बर्नूली से आता है, दोनों वायुमंडलीय दाब पर। वास्तविक छिद्र धार को छिद्र क्षेत्रफल के लगभग 60 % तक संकुचित करते हैं (vena contracta), इसलिए वास्तविक टंकियाँ धीरे खाली होती हैं: $a$ को निस्सरण गुणांक $C_d \approx 0.6$ से गुणा करें। छिद्र का व्यास दोगुना करने से खाली होने का समय चौथाई हो जाता है; प्रारंभिक ऊँचाई दोगुनी करने से वह केवल $\sqrt2$ गुना होता है। गिरती धार त्वरित होते हुए संकरी होती है — फिर से सांतत्य।'
meanings:
- समय के साथ टंकी $b$ में जल स्तर
- टंकी $b$ के छिद्र का क्षेत्रफल — बैच सूचकांक
- हर टंकी का अनुप्रस्थ काट
- टॉरिसेली बहिर्प्रवाह चाल
- RK4 से समाकलित दायाँ पक्ष
- 'कोई दोहराया सूचकांक नहीं ⇒ बाह्य गुणनफल: हर समय हर छिद्र के साथ'
