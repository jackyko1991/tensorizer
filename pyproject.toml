# Tool settings only — the environment is managed by pixi (see pixi.toml).

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
python_files = ["test_*.py", "test.py"]  # each problem folder has its own test.py
markers = ["slow: long physics checks; CI runs them, the after-run TDD check in the app skips them"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "notebooks"]  # notebooks/ is generated by scripts/notebooks.py

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B905"]
