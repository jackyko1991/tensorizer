source_hash: 28a44bb1dca2
title: 给人马座 A*（Sgr A*）称重：恒星 S2 的轨道
summary: 恒星 S2 每 16 年绕银河系中心一圈，最近时距离一个看不见的质量仅 120 AU。我们把一条开普勒轨道（用向量化牛顿迭代求解开普勒方程）拟合到 25 年的真实位置和视向速度数据。采用以 autograd 计算雅可比矩阵的 Levenberg–Marquardt 算法，同时从 64 个随机起点出发，得到一个约 $4.3\times 10^6\,M_\odot$、位于 $R_0 \approx 8.3$ kpc 的黑洞。这个拟合随后预言了 GRAVITY 后来探测到的两个相对论效应：近心点处约 200 km/s 的红移，以及每圈 $12'$ 的进动。
notes: 自 1990 年代初起，分别由 Reinhard Genzel（MPE，使用 ESO 望远镜）和 Andrea Ghez（UCLA，使用 Keck）领导的两个团队，持续追踪银河系中心一角秒范围内的恒星。S2 是短周期轨道恒星中最亮的一颗。它 16 年的椭圆轨道，把被包围的质量限制在一个小到只能是黑洞的体积内。位置数据给出轨道的角大小和周期，视向速度（谱线的多普勒频移）则给出以 km 计的真实大小；两者结合即得距离 $R_0$，再通过开普勒第三定律得到质量。模型共有 8 个参数：六个轨道根数加上 $M$ 和 $R_0$（周期由 $P^2 = 4\pi^2(aR_0)^3/GM$ 决定）。拟合使用 Levenberg–Marquardt 算法，雅可比矩阵由 autograd 计算，并同时从许多随机初始轨道出发。其中很多会落入局部极小值，这正是需要一批起点的原因，最后保留 $\chi^2$ 最优者。开普勒方程用牛顿迭代在 detached 张量上求解，最后再加一步保留计算图的迭代，使 autograd 得到精确的隐函数导数。默认参数下的结果：$M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$、$R_0 \approx 8.35 \pm 0.12$ kpc、$P \approx 16.03$ yr、$e \approx 0.884$，334 个数据点的 $\chi^2 \approx 336$。已发表值：由 17 颗恒星得到 $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ 和 $8.32 \pm 0.07 \pm 0.14$ kpc（Gillessen et al. 2017）。这个拟合随后预言了两个它本身并未包含的相对论效应。在近心点（120 AU、7700 km/s、$c$ 的 2.6 %），引力红移加上横向多普勒频移共贡献约 200 km/s；GRAVITY 在 2018 年 5 月近心点通过后测得为该广义相对论值的 $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ 倍（GRAVITY Collaboration 2018）。轨道每圈还会进动 $6\pi GM/(c^2a(1-e^2)) \approx
  12'$，测得值为广义相对论值的 $f_{SP} = 1.10 \pm 0.19$ 倍（GRAVITY Collaboration 2020）。这些是引用的探测结果，并非由本页数据计算：2016 年的数据表在 2018 年近心点之前就已结束。简化之处：纯开普勒轨道，未考虑 Rømer 延迟（光穿越轨道所需时间，约 8 天）、没有相对论项，也没有参考系的漂移（原论文另外拟合 5 个参考系参数）。数据：Gillessen et al. 2017, ApJ 837, 30（arXiv:1611.09144），S2 数据表 5，取自 VizieR/CDS 星表 J/ApJ/837/30（doi:10.26093/cds/vizier.18370030），按 CDS 使用条款注明出处使用。奖项：2008 年邵逸夫天文学奖（Genzel）、2012 年克拉福德天文学奖（Genzel 和 Ghez）以及 2020 年诺贝尔物理学奖（Genzel 和 Ghez 共享一半奖金，表彰发现银河系中心的超大质量致密天体）。
meanings:
- 每个起点一条轨道：$a$、$e$、$i$、$\Omega$、$\omega$、$t_p$、$M$、$R_0$
- 用牛顿迭代求偏近点角，所有轨道和所有时刻一次算出
- 轨道平面 →（北、东、视线方向），用 einsum 构建
- 对 $j$ 求和：S2 以 AU 计的位置；除以 $R_0$ 即得天空上的 mas
- 以 km/s 计的视向速度：正是它确定了 $R_0$
- （模型 − 数据）/$\sigma$，共 145 个赤经、145 个赤纬和 44 个速度
- 前向模式 autograd，对 8 个参数方向做 vmap
- 所有起点同时执行一步 Levenberg–Marquardt
- $6\pi GM/(c^2a(1-e^2))$：施瓦西进动，S2 为 $\approx 12'$
labels:
  n_starts: 随机初始轨道数
  n_iter: Levenberg–Marquardt 步数
  seed: 随机种子
