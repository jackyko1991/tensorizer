source_hash: 786f22a93dbf
title: Фотоэффект и кванты света
summary: 'Статья Эйнштейна 1905 года о световых квантах: свет частоты $\nu$ приходит порциями энергии $h\nu$, и одна порция освобождает один электрон с кинетической энергией $K = h\nu - \phi - \varepsilon$. Набор фотоны × частоты × интенсивности показывает порог $\nu_0 = \phi/h$, задерживающий потенциал $eV_s = h\nu - \phi$, не зависящий от интенсивности, и отсутствие задержки во времени — всё вопреки классической волновой картине. Линейная подгонка к измерениям Милликена 1916 года для натрия возвращает постоянную Планка.'
notes: 'Это одна из четырёх статей Эйнштейна «чудесного года» 1905: кванты света и фотоэффект (эта задача; Нобелевская премия 1921 года «в особенности за открытие закона фотоэлектрического эффекта»), броуновское движение (thermodynamics: Случайное блуждание и диффузия) и специальная теория относительности с $E = mc^2$ (astro: Эйнштейн, 1905: движущиеся тела и $E = mc^2$). Волновая картина ошибается трижды: она даёт эмиссию на любой частоте, кинетические энергии, растущие с интенсивностью, и задержку в минуты для слабого света (атом, набирающий $\phi$ при $S = 10$ мВт/м²), — тогда как опыт показывает резкий порог, $V_s$, не зависящий от интенсивности, и отсутствие измеримой задержки (меньше 3 нс, Лоуренс и Бимс, 1928). Более яркий свет означает лишь больше фотонов, поэтому ток растёт, а $V_s$ не сдвигается. Красные квадраты — задерживающие потенциалы Милликена 1916 года для поверхности натрия, срезанной в вакууме (R. A. Millikan, Phys. Rev. 7, 355 (1916), четыре линии ртути, перенесены в
  data/millikan_1916_sodium.csv из статьи по таблице в сборнике задач Университета Роскилле; публикация 1916 года, общественное достояние). Милликен хотел опровергнуть уравнение Эйнштейна, а подтвердил его; его наклон даёт $h$ с точностью около 0.3 % от сегодняшнего точного значения $6.62607015\times10^{-34}$ Дж·с. Отрезок на оси, около 1.8 эВ, — это не работа выхода чистого натрия (2.3 эВ): в него входит контактная разность потенциалов установки, а поверхность, вероятно, была загрязнена (D. Lloyd, Am. J. Phys. 2015). Моделируемый металл идеализирован (плоская полоса глубин, без углов, без температуры): прямая $eV_s = h\nu - \phi$ точна, форма кривых тока лишь схематична.'
meanings:
- частоты света в $10^{14}$ Гц
- 'глубина электрона, поглощающего фотон $n$, равномерно на $[0, 3]$ эВ ($i$: интенсивность)'
- 'одна трансляция (broadcast): все фотоны всех частот и интенсивностей сразу; $K \le 0$ ⇒ эмиссии нет'
- 'электроны, преодолевающие задерживающее напряжение $V$: фототок'
- 'задерживающий потенциал: самый быстрый электрон; одинаков для любой интенсивности $i$'
- 'прямая через точки Милликена: наклон $a = h/e$, отрезок $b = -\phi/e$'
- 'волновая картина: время набрать $\phi$ на площади одного атома $A$ при облучённости $S$'
labels:
  phi: Работа выхода $\phi$
  irradiance: Облучённость $S$ (для задержки в волновой картине)
  n_photons: Фотонов за экспозицию при интенсивности 1
