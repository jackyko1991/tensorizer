source_hash: 1f16a1cee568
title: 素数螺旋とハーディ–リトルウッド予想
summary: 素数をふるいで一つのブール型テンソルに求め、ウラムの螺旋とサックスの螺旋の上に描くと、素数は線の上に集まります。各線はオイラーの $k^2 + k + 41$ のような二次式であり、ハーディ–リトルウッド予想はその線に素数がいくつあるかを予測します。同じふるいを使って、双子素数とゴールドバッハ問題に関する彼らの予測、そして素数間隔に関するクラメールのランダムモデルも検証します。これらは予想です：プログラムは数値的に確かめるだけで、証明するわけではありません。
notes: ウラム（1963）は整数を正方形の螺旋上に書き、素数が対角線に沿って並ぶことに気づきました。サックスの螺旋（1994）は $n$ を半径 $\sqrt n$、角度 $2\pi\sqrt n$ の位置に置き、代わりに曲線を浮かび上がらせます。ウラムの螺旋の対角方向の半直線はどれも二次式 $4k^2 + bk + c$ の値を並べたもので、41 から始めた螺旋では主対角線がオイラーの $k^2 + k + 41$ になり、$k = 0, \dots, 39$ に対して素数です（証明済み：Rabinowitsch は、$k^2 + k + p$ がすべての $k < p - 1$ で素数になるのは $\mathbb Q(\sqrt{1 - 4p})$ の類数が 1 であるとき、かつそのときに限ることを示しました。したがって $p \in \{2, 3, 5, 11, 17, 41\}$ であり、このリストは Heegner と Stark によって完成されました）。密な半直線もあれば空の半直線もあるのは剰余のためです。判別式が多くの小さな素数について非剰余であるとき、$f$ はそれらの素数を法として根を持ちません。ハーディとリトルウッド（1923）はこれを予想 F として定式化し、Bateman–Horn 予想（1962）はそれを $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$ と言い換えます。右上のパネルは数百個の二次式について同時にこれを検証します：$K$ が大きくなるにつれ、測定された定数は予測された $C(f)$（対角線）に近づきます。無限に多くの素数値をとることが知られている二次式は一つもありません：$n^2 + 1$ についてはこれがランダウの第四問題（1912）であり、今も未解決です。オイラーの多項式について、ハーディとリトルウッドは奇素数にわたる積 $3.3197732$ を挙げています。Bateman–Horn 定数には $p = 2$ に由来する因子 2 が含まれる（値は常に奇数）ので、$6.6395$ になります。定数 $C_2 = 0.6601618\ldots$ をもつ双子素数予想と、特異級数をもつゴールドバッハ予想は、同じ考え方をそれぞれ $p$ と $p + 2$、$p$ と $N - p$
  に適用したものです。ふるいは既知の個数 $\pi_2(10^6) = 8169$ と $\pi_2(10^7) = 58980$ を再現し、ゴールドバッハの彗星は予測の上に収束します：彗星の帯は特異級数です（緑：$3 \mid N$）。どちらの予想も未解決です。ゴールドバッハ予想は $4 \cdot 10^{18}$ までのすべての偶数について検証されています（Oliveira e Silva、Herzog、Pardi、2014）。張益唐（2014）と Polymath および Maynard の研究は、246 以下の素数間隔が無限に多く存在することを証明し、陳景潤（1973）は十分大きな偶数はすべて素数と高々 2 個の素数の積との和であることを証明しました。クラメールのモデル（1936）は各 $n$ を確率 $1/\ln n$ で素数とみなします。このモデルは平均 $\ln p$ の指数分布に従う間隔を予測し、これは観測とよく合います。また最大間隔はおよそ $\ln^2 p$ と予測しますが、2、3、5、… による割り切れを無視するため、双子素数の個数をちょうど因子 $2C_2 \approx 1.32$ だけ誤ります（点線）。Maier（1985）はこのモデルが他の点でも破綻することを示し、Granville は最大間隔が $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$ に達しうると提案しました。
meanings:
- エラトステネスのふるい：素数 $p \le \sqrt{n_\text{max}}$ ごとに一回のストライド付きスライス
- すべての数のウラム螺旋上の位置を一度に、その環 $k = \lceil(\sqrt m - 1)/2\rceil$ と角 $(2k+1)^2$ までの距離から求めます
- サックスの螺旋：平方数 $k^2$ は正の $x$ 軸上に並びます
- $F$ 個の二次式 $4k^2 + bk + c$（ウラム螺旋の対角方向の半直線）の、すべての $k$ での値
- すべての値をふるいで引きます。累積和が各半直線上の素数を数えます
- オイラーの規準 $(D/p) \equiv D^{(p-1)/2}$（$D = b^2 - 4ac$）による $p$ を法とした $f_i$ の根。$p < 50$ では直接試します
- 繰り返される $p$ ⇒ 和：オイラー積を素数 $p < 10^5$ にわたる対数の和として
- 繰り返される $m$ ⇒ 和：ゴールドバッハの個数を自己畳み込みとして、FFT で計算
- $p \le x$ を満たす双子素数の組 $(p, p+2)$
- 正規化した間隔を、クラメールのランダムモデルの $e^{-s}$ 則と比較
labels:
  side: 螺旋の一辺
  start: 螺旋の開始値
  log10_x: 双子素数と間隔：$10^n$ まで
  goldbach_max: ゴールドバッハ：$N$ まで
