source_hash: 296b0fae0936
title: '사영 공준: 하나의 고차원 상태, 많은 그림자'
summary: 확립된 물리가 아닌 추측성 가설이다. 우주는 아주 많은 차원 $D$ 을 가진 공간 속의 단 하나의 상태 $\Psi$ 이고, 관측자가 재는 것은 그중 몇 차원으로의 사영이라는 것이다. 이 단계는 공준을 진술하고 그 수학을 확인한다. 보이는 비율 $\|P\Psi\|^2$ 는 Beta$(d, D-d)$ 분포를 따르고, 측정은 숨은 블록들 사이의 경주로 모형화된다. 결과마다 숨은 복소 차원이 하나이면 정확히 보른 규칙이 나오고, 더 많으면 편차가 생기는데 삼중 슬릿 실험이 이를 배제한다. 지금까지 이 생각은 양자역학을 넘어서기보다 재현한다.
notes: '상태: 추측성. 이것은 저자 자신의 가설(시리즈 설명 참조)이며 확립된 물리가 아니고, 표준 양자역학보다 이를 지지하는 실험은 없다. 이 첫 단계는 공준을 정확히 적고 그것이 기대는 수학을 확인한다. 공준. P0(하나의 실재): 우주는 차원 $D$ 인 공간 속의 단일 상태 $\Psi$ 이며, $D\to\infty$ 일 수도 있다. P1(사영): 관측자는 $d$ 차원 부분공간으로의 사영 $P:\mathbb C^D\to\mathbb C^d$ 만 본다. 측정되는 양자 상태는 $\psi = P\Psi/\|P\Psi\|$ 이므로 파동함수는 $\Psi$ 의 사영이지 $\Psi$ 자체가 아니다. P2(사건): 측정은 하나의 정해진 시간 조각으로의 사영이며 하나의 결과 $k$ 을 고른다. 결과의 가중치는 $\|P_k\Psi\|^2$ 에서 오며, 보른 규칙은 가정하지 않고 검증한다. P3(하나의 입자): 모든 입자는 같은 대상의 사영이다. P4(기하): 굽은 시공간은 평평한 고차원 매장을 사영한 모양이며, 특이점은 사영이 접히는 곳(야코비안의 계수가 떨어지는 곳)이다. P5(열린 차원): 양자 효과에는 어떤 최소 차원 $d_Q$, 중력에는 $D$ 안의 어떤 $d_G$ 이 필요하며, 이들은 추정하거나 맞추는 것이지 결코 손으로 $3+1$ 으로 정하지 않는다. 계산 내용. (1) 측도 집중: $\Psi$ 가 $\mathbb C^D$ 의 구면 위에서 균일할 때 $\|P\Psi\|^2\sim$ Beta$(d, D-d)$ (평균 $d/D$)임을 평균, 분산, Kolmogorov–Smirnov 검정으로 $D$ 가 4부터 $D_{max}$ 까지 확인한다. 정규화된 $\psi$ 는 $D$ 와 상관없이 작은 구면 위에서 균일하다. 전형적인 관측자는 노름의 비율 $d/D$ 만 보며, 이는 $D\to\infty$ 일 때 사라진다. (2) P2를 사영 경주로 구체화(저자의 모형을 여기서 정식화): 각 결과 $k$ 는 에너지 $E_k = \|h_k\|^2$ 를 가진 $m$ 개의 숨은 복소
  차원으로 된 자기 블록과 결합하고, $|c_k|^2/E_k$ 가 가장 큰 결과가 일어난다. $m = 1$ 이면 $E_k\sim$ Exp(1) 이고 지수 경주는 정확히 $P(k) = |c_k|^2$, 즉 보른 규칙을 준다. $m > 1$ 이면 $E_k\sim$ Gamma$(m)$ 이고 가장 가능성 높은 결과가 너무 자주 이긴다. 결과가 둘이면 $P_1 = I_{|c_1|^2}(m, m)$ 이고 편차는 $m$ 와 함께 커진다. 실수 숨은 차원은 Gamma$(m/2)$ 를 주며, 실수 차원 하나는 아크사인 법칙 $\tfrac2\pi\arcsin|c_1|$, 둘은 보른 규칙을 준다. (3) 차원 세기(P5): 경주에는 $K$ 개의 결과에 대해 $D\geq d + K$ 가 필요하다. $N$ 개의 얽힌 2준위계에는 $D\geq 2^N$ 가 필요하므로, 관측 가능한 우주의 $\sim10^{80}$ 개 입자에는 약 $10^{3\times10^{79}}$ 이 되며 P0의 $D\to\infty$ 와 부합한다. 솔직히 말하면, 표준 양자역학은 이미 바로 이 힐베르트 공간을 쓰고, 부분 대각합과 사영을 취하는 것도 표준이다. 지금까지 이 가설은 재해석이며, 검증 가능한 새로움은 $m > 1$ 인 경주나 이후 단계가 다른 예측을 하는 곳에서 나와야 한다. Gleason 정리(1957)는 이미 $d\geq 3$ 이면 힐베르트 공간 위의 비맥락적 확률 배정은 모두 보른 규칙임을 보였다. (4) 데이터: 삼중 슬릿 배치(화면 칸 41개와 ''막힘'' 결과 하나, 각각 자기 숨은 블록을 가짐)에서 경주는 Sorkin 매개변수 $\kappa\approx s\,(a-1)$ 를 주며, 9가지 구획에서 $s$ 는 0.56과 0.74 사이이다. 여기서 숨은 모양 매개변수는 $a = m$ (복소) 또는 $m/2$ (실수)이다. 측정값(data/born_rule_tests.csv, 인용한 수치): Sinha 외(Science 329, 418, 2010)는 $|\kappa|$ 를 $10^{-2}$ 미만으로
  제한, Park 외(NMR, New J. Phys. 14, 113025, 2012)는 $\kappa = 0.001\pm0.003$, Kauten 외(New J. Phys. 19, 033017, 2017, 오픈 액세스, CC-BY 3.0)는 예고된 단일 광자로 $0.0\pm1.6\times10^{-3}$, 감쇠 레이저로 $(1.3\pm1.8)\times10^{-4}$, 고전광으로 $0.0\pm3.1\times10^{-5}$. $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ 와 가장 작은 기울기를 쓰면 단일 광자 데이터는 $|a-1|\leq 6\times10^{-3}$ 를 허용하고, 광자 검출 한 번이 경주 한 번이라면 고전광 데이터는 $|a-1|\leq 1.1\times10^{-4}$ 를 허용한다. $m = 2$ 인 경주는 $\kappa\approx 1$, 실수 숨은 차원 하나는 $\kappa\approx 0.1$ 를 주며 둘 다 배제된다. 결과마다 복소 숨은 차원 하나(실수 둘)만 살아남는다. 이것은 모형에 대한 제약이지 지지가 아니다. $m = 1$ 는 바로 표준 양자역학과 구별할 수 없는 경우이기 때문이다. $\kappa$ 로의 대응은 결과를 어떻게 나누는지에 달려 있으므로 가장 보수적인 기울기를 쓴다. 시리즈의 다음 단계(여기서는 만들지 않음): P3(모든 입자를 하나의 대상의 사영으로), P4(굽은 시공간을 평평한 매장의 그림자로: Janet–Cartan 정리에 따라 해석적인 4차원 계량은 국소적으로 10차원 평평한 공간에, 슈바르츠실트 해는 6차원에 매장된다), 중력의 $d_G$ 맞추기, 그리고 표준 물리와 다른 예측 찾기.'
meanings:
- 관측자가 보는 $\Psi$ 의 노름 비율, 모든 $D$ 를 한 번에 계산(중첩된 상태)
- 관측되는 상태, 어떤 $D$ 에서도 $\mathbb C^d$ 의 단위 구면 위에서 균일
- Beta$(d, D-d)$ 와의 Kolmogorov–Smirnov 거리(불완전 베타 함수는 수치 적분)
- '$m = 1..M$ 차원일 때 숨은 블록 $k$ 의 에너지: Gamma$(m)$ (복소) 또는 $2\,$Gamma$(m/2)$ (실수)'
- '사영 경주: $|c_k|^2/E_k$ 가 가장 큰 결과가 일어난다'
- 경주의 닫힌 형식; $j$ 에 대한 합($j = k$ 제외)이 다른 결과들에 대한 곱이다
- '반복되는 슬릿 첨자 $s$ ⇒ 합: 열린 슬릿 집합 $S$ 마다의 진폭'
- 경주 모형의 Sorkin 삼경로 매개변수; 보른 규칙이면 $0$
labels:
  D_max: 가장 큰 전체 차원 $D$ (예시; 계산은 여기까지의 차원 사다리를 쓴다)
  d: 관측자 부분공간 차원 $d$ (예시)
  m_max: 결과당 숨은 차원의 최대 개수 $m$
  outcomes: 결과의 수 $K$
  trials: 경우마다의 무작위 상태와 사건 수
