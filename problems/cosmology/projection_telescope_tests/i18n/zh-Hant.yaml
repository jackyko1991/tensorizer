source_hash: c17ad8b19789
title: 投影的望遠鏡檢驗：引力波、黑洞陰影與超新星
summary: 一個推測性的假說，而非既定物理，在此以公開天文數據加以檢驗。若引力所見的維度多於 $3+1$，引力波的衰減會比 $1/d$ 更快；若彎曲時空是摺疊投影的影子，則位於光子球之外的摺疊會使黑洞陰影變大。GW170817 加上其宿主星系的距離給出 $D = 4.00^{+0.07}_{-0.25}$，M87* 與 Sgr A* 的 EHT 陰影只允許摺疊位於約 $2.3$ 個史瓦西半徑以內，而 Pantheon+ 超新星無法區分洩漏（DGP）宇宙與 $\Lambda$CDM。一切都與 $3+1$ 維的廣義相對論一致：任何額外維度都必須是引力在這些尺度上感受不到的。
notes: 狀態：推測性。這是作者本人的假說（見系列說明），並非既定物理。投影假說的第 6 步，即觀測步驟。第 1 步（cosmology/projection_postulate）陳述了公設，並發現玻恩規則只有在與標準量子力學無法區分的情況下才得以保留；第 2 至 5 步（projection_one_particle、projection_dimension_budget、projection_singularity_fold、projection_bell_test）分別處理 P3、P5、P4 與 P1-P2。本步驟將 P4（幾何是可以摺疊的投影）與 P5（引力需要某個 $d_G$，由擬合得出而非假定）的開放參數擬合到公開數據，並呈現結論，無論結果偏向哪一方。先講已知物理。在 $3+1$ 維的廣義相對論中，引力波的應變按 $1/d$ 衰減；在 $D$ 維時空中，其能量散布於 $(D-2)$ 維球面上，且 $h\propto d^{-(D-2)/2}$。假定 $1/d$ 的探測器會推得 $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$（$d_* = 1$ Mpc，同 Pardo、Fishbach、Holz 與 Spergel 2018），或者若洩漏只在屏蔽尺度 $R_c$ 之外才開始，則推得 $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$（他們的屏蔽形式，僅對 $D > 4$ 有意義）。假說的預測：若引力在大距離上擴散到額外維度，則 $d_{GW} > d_{EM}$ 且 $D > 4$。檢驗 (a)：GW170817，一次在 NGC 4993 中具有光學對應體的中子星併合。數據：GWTC-1 發布中 GW 光度距離的 8078 個後驗樣本（data/gw170817_distance.csv；LIGO Scientific 與 Virgo 合作組，低自旋先驗，天空位置自由；GWOSC，授權 CC BY 4.0；Abbott et al. 2019, PRX 9, 031040）。分析所用的先驗 $\propto d^2$，因此每個樣本以 $d^{-2}$ 加權，再以核密度估計得出 $d_{GW}$ 的似然（已發表值為 $40^{+8}_{-14}$ Mpc，Abbott et al.
  2017）。電磁距離（data/em_distances.csv，引用數值）：表面亮度起伏 $40.7\pm1.4\pm1.9$ Mpc（Cantiello et al. 2018, ApJL 854, L31，預設值），以及 Pardo 等人所用的哈伯流距離，即 $v_H = 3017\pm250$ km/s 除以 $H_0 = 73.24\pm1.74$（SH0ES）或 $67.74\pm0.46$ km/s/Mpc（Planck）。結果：$D = 4.00^{+0.07}_{-0.25}$（68%，SBF；autograd 擬合給出 $4.00\pm0.11$）、$3.98^{+0.09}_{-0.24}$（SH0ES）與 $3.94^{+0.08}_{-0.24}$（Planck）。Pardo 等人得到 $4.02^{+0.07}_{-0.10}$（SH0ES）與 $3.98^{+0.07}_{-0.09}$（Planck）；他們的下側誤差較小，因為他們將天空位置固定在對應體上，並使用 LVC 的 $H_0$ 後驗，而此處附帶的樣本天空位置是自由的，因此距離與傾角的簡併在小距離一側留下較長的尾部。對屏蔽洩漏而言，$-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ 在 $D = 5$、$n = 1$ 時排除了低於數百 Mpc 的 $R_c$，在 $n = 2$ 至 5 時則排除低於約 50-80 Mpc 者；漸進的過渡（$n(D-4)/2$ 很小）直到網格邊緣 $10^4$ Mpc 都被排除。Pardo 等人給出對任何陡度皆有 $R_c\gtrsim 20$ Mpc，依據的是後驗而非似然比。結論 (a)：直到 40 Mpc，引力的表現如同 $D = 4.0$，精度約 $\pm0.1$；引力所感受到的任何額外維度，在這些距離上都是緊緻的或被屏蔽的。檢驗 (b)：黑洞陰影。在史瓦西時空中，光子球位於 $r = 3GM/c^2$，陰影半徑為 $b_c = \sqrt{27}\,GM/c^2$；此處同時以 $\min_r r/\sqrt{f}$ 計算，並對一批碰撞參數以光線追蹤 $u'' = -u + \tfrac32 u^2$ 求得。自旋最多使陰影的等面積半徑縮小 7%（Bardeen 曲線；從極軸方向觀看極端黑洞時為 $2(1+\sqrt2)\,GM/c^2$）。摺疊是作者的建模選擇，在此加以精確化：P4
  說奇點是投影摺疊之處；假設投影後的幾何直到半徑 $r_f$ 處的摺疊都是史瓦西幾何，而到達摺疊的光永不返回。位於光子球內的摺疊（$r_f\leq 1.5\,r_s$）不改變陰影；位於光子球外的摺疊則使陰影邊緣成為擦過它的那條光線，$b = r_f/\sqrt{1 - r_s/r_f}$，因此 $\delta = b/b_c - 1 > 0$。數據（data/eht_shadows.csv，引用數值）：M87* 光環 $42\pm3$ $\mu$as 與 $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as（EHT 2019，Papers I 與 VI），對照恆星動力學給出的 $3.64\pm0.22$ $\mu$as（Gebhardt et al. 2011，$6.6\pm0.4\times10^9\,M_\odot$，距離 17.9 Mpc），因此 $\delta = +0.04\pm0.13$（此處計算，非已發表值）；Sgr A* 光環 $51.8\pm2.3$ $\mu$as（EHT 2022，Paper I），以及取自 Paper VI 表 2 的 $\delta = -0.04^{+0.09}_{-0.10}$（Keck 先驗）與 $-0.08\pm0.09$（VLTI 先驗）。取 $\delta + 2\sigma$ 並允許自旋掩蓋最多 7%，摺疊最多可使陰影增大 0.37（M87*）、0.21（Keck）與 0.17（VLTI），因此 $r_f\leq 2.86$、$2.40$ 與 $2.28\,r_s$。結論 (b)：陰影與史瓦西/克爾相符；位於約 $2.3\,r_s$ 之外的摺疊被排除，但位於光子球內的摺疊（P4 自然會把它放在那裡：視界或中心奇點）在陰影影像中是看不見的。檢驗 (c，選做)：超新星。在 DGP 膜世界中，引力在 $r_c$ 之外洩漏到第五維，膨脹遵循 $H^2 - H/r_c\propto\rho$；Dvali 與 Turner 的指數 $\alpha$ 在兩者間內插（$E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$，$\alpha = 0$ 為 $\Lambda$CDM，$\alpha = 1$ 為 DGP）。數據：cosmology/cosmological_constant_fit
  的 Pantheon+ 表，複製為 data/pantheon_plus.csv（1466 顆超新星，$z > 0.01$，對角誤差；Scolnic et al. 2022、Brout et al. 2022；Pantheon+ 數據檔未註明授權，論文為 CC BY 4.0）。結果（均勻先驗，$-1\leq\alpha\leq 1.8$）：$\alpha = 0.44\pm0.71$；$\Lambda$CDM 的 $\chi^2 = 639.5$，DGP 為 $638.9$（兩者都遠低於超新星數量，因為對角誤差包含了協方差的對角項）。結論 (c)：僅憑超新星無法區分洩漏的宇宙與 $\Lambda$CDM；真正排除自加速 DGP 分支的是與 CMB 及重子聲學振盪的聯合分析（例如 Fang et al. 2008, Phys. Rev. D 78, 103509），此處不重新擬合。P4 與 P5 的總體結論：每一項檢驗都與 $3+1$ 維的廣義相對論一致。只有當 $3+1$ 之外的維度是引力在這些尺度上感受不到的（緊緻、被屏蔽，或只存在於第 1 與第 5 步的量子部分），且任何摺疊都位於光子球內時，假說才得以存活。這是一項約束，而非支持：到目前為止，本系列尚未找到一個既不同於標準物理、又與數據相符的預測。
meanings:
- 8078 個 GW170817 距離樣本（GWTC-1）；$w_i = d_i^{-2}$ 除去體積均勻先驗
- 重複的 $i$（樣本）⇒ 求和：$d_{GW}$ 的核密度，即歸一化的似然
- 當引力擴散到 $D_a$ 維時，探測器對每個電磁距離 $d_j$ 推得的距離
- $D$ 的後驗，對電磁距離邊緣化（對 $j$ 求和，梯形法）
- autograd 擬合：對 $\log p(D)$ 做牛頓步，誤差取自二階導數（拉普拉斯近似）
- 同時對 $B$ 個碰撞參數與 $F$ 個摺疊半徑計算光子軌道 $u = r_s/r$（對 $\varphi$ 做 RK4）
- 位於 $r_f$ 的摺疊造成的陰影相對增大（在光子球內為零）
- 不同自旋 $a$ 與傾角下的克爾陰影縮小（Bardeen 曲線，等面積半徑）
- 對每個洩漏指數 $\alpha_a$ 與 $\Omega_{m}$ 的超新星 $\chi^2$，已除去偏移量（$H_0$、$M$）；對 $i$ 求和
labels:
  em_distance: 用於結論的 NGC 4993 電磁距離
  D_screen: 屏蔽尺度之外的維度 $D$（屏蔽洩漏）
  n_screen: 屏蔽過渡的陡度 $n$
  inc_max_sgra: 自旋區間中 Sgr A* 的最大傾角
