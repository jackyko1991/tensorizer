source_hash: 0b86e0abca1f
title: ラザフォード散乱
summary: アルファ粒子のビームを金の原子核に打ち込む。すべてのアルファ粒子を1つのバッチ化したテンソルとして斥力的なクーロン場の中で RK4 により積分し、散乱角のヒストグラムがラザフォードの $1/\sin^4(\theta/2)$ 則を再現する——原子の正電荷が小さな原子核に集中していることの証拠である。
notes: 単位：fm、MeV、時間は fm/$c$。各経路に沿ってエネルギーと角運動量が保存されるので、$E$ と衝突パラメータ $b$ だけで偏向角 $\theta = 2\arctan(k/2Eb)$ が決まる。正面衝突するアルファ粒子は $d = k/E$ で折り返す（金に 5 MeV で約 45 fm、半径 7 fm の原子核よりはるかに外側なので、純粋なクーロン則が成り立つ）。ビームは半径 $b_{\max}$ の円板上に一様に分布させる（ランダムだがシード固定）ので、ある立体角に散乱される数は（単位面積あたりのアルファ粒子数）× $d\sigma/d\Omega$ となる。90° を超えて跳ね返るのは数百個に1個だけである——1909年のガイガーとマースデンの驚きである。簡略化：原子核は固定された点電荷（反跳なし、核力なし）で、運動は非相対論的（$v \approx 0.05c$）。各アルファ粒子は 30 $d$ 離れた位置から、無限遠から来たアルファ粒子とまったく同じエネルギーと角運動量で出発する。残りの $1/r^2$ の力の裾による角度のずれは 1° よりずっと小さい。
meanings:
- $Z_\alpha Z e^2/4\pi\varepsilon_0 = 2Z \cdot 1.44$ MeV fm
- アルファ粒子 $b$ の位置（fm）と速度（$c$ 単位）
- 繰り返される $j$ ⇒ 和をとる：距離の2乗 $r_b^2$
- ビーム全体に一度に働くクーロン斥力
- 2次元の外積：単位質量あたりの角運動量
- 出射速度とビーム軸のなす角
- ラザフォードの予言、ヒストグラムと比較
labels:
  energy: アルファ粒子のエネルギー $E$
  z_target: 標的の電荷 $Z$
  b_max: ビーム半径 $b_{\max}$
  n_beam: ビーム中のアルファ粒子数
  n_steps: RK4 のステップ数
