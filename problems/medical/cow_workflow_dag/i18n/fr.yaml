title: 'La puissance de l''orchestration de workflows : une cohorte du polygone de Willis en DAG tensoriel'
summary: 'Une étude vasculaire est une chaîne d''étapes (segmenter l''ARM, extraire le graphe des lignes centrales, mesurer les vaisseaux, placer les entrées et sorties, résoudre l''écoulement, rédiger le rapport), chacune déjà un programme tensoriel ; le workflow qu''orchestre Snakemake peut donc lui aussi être un tenseur. Sur six examens ARM ouverts (CC0) TopCoW du polygone de Willis, le même Snakefile est exécuté par Snakemake (hors ligne) et par un moteur de DAG tensoriel : le graphe des tâches est une somme de produits de Kronecker, ses niveaux, son chemin critique et l''ensemble à réexécuter sont des itérations matrice–vecteur, et les résultats concordent tâche par tâche. Ensuite, le temps gagné, d''où il vient, et ce qu''un DAG de fichiers ne peut pas offrir : un gradient à travers tout le pipeline. À but pédagogique uniquement, pas pour un usage clinique.'
notes: 'Idée. Le cadrage, la puissance de l''orchestration de workflows, est celui de Jacky Ko, issu de son travail en HPC et de sa thèse sur les pipelines vasculaires : si chaque étape du pipeline est un programme tensoriel, le DAG qu''ordonnance un gestionnaire de workflows peut l''être aussi. Ce problème le construit et le mesure. Workflow. data/Snakefile contient huit règles (segment, centreline, measure, boundaries, flow, report, cohort, all) et deux wildcards : le cas (six examens) et la condition (les deux entrées ICA ouvertes, ou l''ICA gauche fermée). Le shell de chaque règle exécute workflow.py, qui appelle pour un seul cas la même fonction tensorielle que le moteur tensoriel appelle une fois pour tous les cas. Snakemake 9.27.1 l''a exécuté hors ligne sous WSL2 (dans son propre environnement, jamais intégré à ce projet) et ses sorties sont fournies comme références dans data/snakemake : le DAG des tâches (--dag), la liste des tâches du dry-run, l''ensemble à réexécuter après modification
  d''une entrée, --summary, les heures de début et de fin de chaque tâche, et le tableau de cohorte écrit par ses tâches. Les tests vérifient que le moteur tensoriel a les mêmes 50 tâches et 79 arêtes, que les ordres de Snakemake respectent notre $A$ et donnent nos niveaux, que l''ensemble à réexécuter est identique, et que le tableau de cohorte est identique aux 9 chiffres écrits près. Un détail sur les réexécutions : un touch sur une entrée n''a fait réexécuter rien à Snakemake, car pour les petits fichiers il compare des sommes de contrôle ; la référence modifie les octets du fichier (mêmes tableaux), et alors 10 tâches sont réexécutées, comme le prédit $x = s \lor Rs$. Temps. Dans l''exécution fournie, Snakemake a pris 118 s sur 1 cœur, 43 s sur 6 et 27 s sur 12 (une exécution antérieure sur une machine moins chargée : 79, 23 et 22 s) ; le moteur tensoriel effectue le même travail en environ 5 à 10 s sur un seul thread. Le décompte honnête : chaque tâche Snakemake est un nouveau processus
  qui lance Python et importe torch et le module de la tâche (environ 1,8 s, data/snakemake/startup.csv, soit environ 88 s sur les 115 s de temps cumulé des tâches), lit et écrit des fichiers .npz, et doit être ordonnancé ; le moteur tensoriel paie ce coût une seule fois. Le traitement par lots en lui-même apporte peu sur un CPU ici (traiter les cas un par un dans le même processus prend à peu près autant de temps, parfois moins) ; le gain vient donc du démarrage et des fichiers, et il diminue lorsque chaque tâche est une résolution lourde sur GPU qui éclipse le démarrage. Aucun ordonnancement sur $c$ cœurs ne fait mieux que $\max(\mathrm{CP}, W/c)$, le chemin critique issu de l''itération max-plus et le travail total divisé par $c$, et les exécutions mesurées le respectent ; trouver le meilleur ordonnancement est NP-difficile en général (l''ordonnancement par liste de Graham reste dans $W/c + \mathrm{CP}$). Gradient. Un DAG de fichiers transmet des nombres, pas des dérivées. Le seuil doux
  rend la segmentation, les rayons et l''écoulement différentiables, de sorte que $\partial s_{\mathrm{L\,MCA}}/\partial\theta$ (la part de l''écoulement sortant passant par la MCA gauche) s''obtient pour chaque cas en une seule passe arrière et concorde avec les différences finies centrées, qui coûteraient à Snakemake deux exécutions complètes supplémentaires. Le graphe des lignes centrales (topologie) et le masque des composantes connexes restent fixes. Pipeline. Segmentation : seuil doux $\sigma((I - \theta)/w)$ de l''intensité TOF normalisée, masque dur $I > \theta$ privé des composantes de moins de 64 voxels, Dice par rapport au masque TopCoW d''environ 0,86 à 0,91. Lignes centrales : à partir des étiquettes de vaisseaux TopCoW, des jonctions là où des vaisseaux étiquetés se rejoignent (contacts à moins de 3,5 mm fusionnés ; seules les paires anatomiques comptent, si bien que deux A2 côte à côte n''en forment pas), une extrémité libre par vaisseau terminal (son voxel le plus éloigné
  selon une eikonale min-plus avec un temps de parcours $\ell/R^2$, recentré), et le plus court chemin centré entre nœuds consécutifs (comme dans le substitut tensoriel de VMTK du problème de l''anévrisme). Mesure : chaque voxel proche des vaisseaux étiquetés est attribué au point de ligne centrale le plus proche, de sorte que le rayon d''une arête vaut $\sqrt{V_e/(\pi L_e)}$ d''après le volume doux ; asymétrie $2(r_R - r_L)/(r_R + r_L)$ par vaisseau ; un indicateur de sténose là où le profil de rayon lissé descend sous la moitié de sa médiane (chez ces témoins sains, de tels indicateurs sont des artefacts de segmentation). Conditions aux limites, comme dans Venova : entrées aux extrémités libres des ICA et du tronc basilaire, sorties aux extrémités des MCA, ACA et PCA ; les extrémités des Pcom et de l''Acom ne sont jamais des limites. Écoulement : un modèle stationnaire d''ordre réduit, conductance de Poiseuille par arête, $P$ = 90 mmHg aux entrées ouvertes, chaque sortie drainée vers 0
  Pa par une charge de Murray $g_k \propto r_k^3$ réglée pour qu''un réseau sans résistance porte 10 ml/s ; une seule résolution linéaire par lots. Le test des collatérales ferme l''ICA gauche : là où une Acom ou une Pcom est perméable, l''hémisphère gauche reste perfusé. Simplifications : sang newtonien, tubes droits rigides, pas de pulsatilité, pas d''écoulement 3D (le problème de l''anévrisme fait de la CFD 3D sur un vaisseau), rayons seuillés sur des voxels de 0,5 mm, pressions et débits de l''ordre de ceux de la littérature. Données. TopCoW 2024, sous-ensemble MRA_Lausanne (Zenodo 10.5281/zenodo.15692630, licence CC0) : 20 examens TOF-ARM de témoins sains avec étiquettes du polygone de Willis. Six cas sont fournis sous forme de recadrages 96×80×48 à 0,5 mm (image et étiquettes, moins de 1 Mo au total) ; data/SOURCES.md décrit le traitement et les références (Yang et al., le challenge TopCoW ; Di Noto et al. 2022, la cohorte de Lausanne). La version principale de TopCoW n''est pas utilisée
  (sa licence restreint l''usage commercial). Résultats. Outre le GIF, il y a deux résultats 3D. results/centreline.pvd est l''anatomie : la surface de segmentation de chaque cas (marching tetrahedra) et son graphe des lignes centrales, tous deux colorés selon le rayon du vaisseau. results/flow.pvd est l''écoulement du réseau de Poiseuille 1D sur 11 pas au cours desquels l''ICA gauche se rétrécit : le pas de temps est la sévérité de la sténose s, la fraction du diamètre de la lumière perdue (0 ouverte, 1 fermée). Ses couches sont la surface du vaisseau colorée selon la contrainte de cisaillement pariétale $\tau_w = 4\mu|Q|/(\pi r^3)$ de l''arête de ligne centrale la plus proche (la pression en second tableau), les lignes de courant et les particules (toutes deux colorées selon la vitesse), et les disques d''entrée et de sortie avec flèches. Il n''y a pas de CFD 3D ici : les lignes de courant sont l''écoulement axial idéalisé du modèle 1D, des lignes parallèles à la ligne centrale de chaque
  vaisseau à $\rho = 0, 0.35, 0.7$ de son rayon, avec la vitesse de Hagen-Poiseuille $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$ ; il n''y a pas d''écoulement secondaire, et elles s''interrompent aux jonctions. Chaque pas est un état stationnaire ; les particules n''avancent le long de leurs lignes de courant que d''un pseudo-temps fixe de 4 ms par pas (en repartant du début de leur vaisseau une fois la fin atteinte), pour montrer les vitesses. La sténose est un segment de Poiseuille de 10 mm en série avec l''entrée, si bien que sa conductance décroît comme $(1 - s)^4$ ; s = 0 et s = 1 sont exactement les deux conditions du workflow, et les pas intermédiaires ne sont exécutés que par le moteur tensoriel (une résolution par lots par pas). results/stenosis_sweep.csv donne le débit entrant de l''ICA gauche et la part de la MCA gauche par pas et par cas ; results/timings.csv, results/equivalence.csv et results/cohort.csv contiennent les autres chiffres.'
meanings:
- la règle $s$ lit un motif de fichier que la règle $r$ écrit ; extrait directement du Snakefile fourni
- 'par axe de wildcard $a$ (cas, condition) : $I$ quand les deux règles le portent (arêtes par cas $A \otimes I$), $\mathbb 1$ pour une diffusion, $\mathbb 1^\top$ pour un regroupement comme le rapport de cohorte'
- $A_{ij} = 1$ quand la tâche $i$ lit une sortie de la tâche $j$ ; 50 tâches, 79 arêtes
- marches fermées de longueur $k$ ; toutes nulles ⇔ $A$ nilpotente ⇔ acyclique
- compte les chemins $j \to i$ ; son motif 0/1 est l'accessibilité (élévation au carré booléenne répétée)
- 'niveau topologique par itération booléenne matrice–vecteur : une tâche est prête quand $A\,\neg\mathrm{done} = 0$ sur sa ligne'
- dates de fin au plus tôt, un point fixe max-plus (tropical) ; $\max_i t_i$ est le chemin critique
- tâches à réexécuter après que les tâches de $s$ (lectrices d'un fichier modifié) sont devenues obsolètes
- segmentation douce, différentiable par rapport au seuil $\theta$ (un par cas)
- 'eikonale min-plus sur le graphe de voxels de tous les vaisseaux de tous les cas à la fois : extrémités libres et lignes centrales'
- rayon d'arête d'après le volume doux des voxels les plus proches de sa ligne centrale
- Kirchhoff avec conductances de Poiseuille $G_e$ et charges de sortie de Murray $g_k$, une seule résolution par lots ; lignes de Dirichlet $p = P$ aux entrées ouvertes
- la part de débit de la MCA gauche différenciée à travers l'écoulement, la mesure et la segmentation, tous les cas en une seule passe arrière
labels:
  threshold: Seuil de segmentation $\theta$ sur l'intensité normalisée
  cores: Cœurs $c$ dans la borne $\max(\mathrm{CP}, W/c)$
