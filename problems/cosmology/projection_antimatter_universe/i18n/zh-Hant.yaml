source_hash: 039347a6014e
title: 反物質可能在哪裡？反物質宇宙的判據
summary: 這是一個推測性假說，並非已確立的物理。第 2 步發現，一條穿過每個時間切片的世界線給出等量的物質與反物質，而我們看到約 $10^{80}$ 個重子且沒有反物質。出路是一條在全域上平衡的世界線，反物質位於遙遠之處或在一個鏡像宇宙中。本步驟列出這樣的反物質宇宙必須滿足的條件，並以數據逐一檢驗每個判據。宇宙線中沒有反原子核，星系團也沒有湮滅伽瑪射線。區域至少必須與視界一樣大，約 16 Gpc。一條隨機世界線的可能性低得驚人。剩下的是 Boyle、Finn 與 Turok 的 CPT 對稱宇宙，其預測（最輕的微中子無質量、$r = 0$）至今與數據相符，但也可能失敗。
notes: 狀態：推測性。這是作者本人的假說（見系列說明），並非已確立的物理。投影假說的第 7 步，是公設 P3（所有粒子都是同一個物體的投影）的一個理論步驟。第 1 步（cosmology/projection_postulate）陳述了公設。第 2 步（cosmology/projection_one_particle）排除了 P3 的最簡單形式：一條閉合世界線穿過每個時間切片時，向前（物質）與向後（反物質）的次數一樣多，一條開放世界線最多增加一個淨粒子，而宇宙中約有 $9\times10^{79}$ 個重子且沒有反物質。第 3 到 6 步（projection_dimension_budget、projection_singularity_fold、projection_bell_test、projection_telescope_tests）檢驗了 P5、P4 與 P1-P2。本步驟採取第 2 步的出路。世界線在全域上是平衡的，而反物質位於我們的視界之外或在一個反宇宙中。問題在於，這樣的反物質宇宙必須滿足什麼條件才能與公設相符，以及它是否滿足。先講已知的物理。Sakharov 條件（1967）以重子數破壞、C 與 CP 破壞以及偏離平衡來解釋物質的過剩。它們預測一個處處由物質構成的宇宙，其 $\eta = n_B/n_\gamma = 6.1\times10^{-10}$（Planck 2018，$\Omega_b h^2 = 0.0224$）。另一種可能，即物質與反物質區域彼此分隔的對稱宇宙，自 1960 年代起就有人研究（Alfvén 與 Klein、Omnès）。Steigman（ARA&A 14, 339, 1976）回顧了相關檢驗，而 Cohen、De Rújula 與 Glashow（ApJ 495, 539, 1998）為可見宇宙內存在區域的情形下了定論。所有數據都來自 data/antimatter_criteria.csv，其中收錄了引用的數字及其來源。世界線所在空間的維數 $D$ 是一個參數。只有它的時間座標會進入計算，因此沒有任何結果取決於 $D$。判據 1：附近沒有混入反物質。BESS-Polar 在約 4800 萬個氦原子核中沒有發現反氦。95% 上限為：假設類似氦的能譜時，反氦/氦 $< 6.9\times10^{-8}$；不作此假設時為
  $1.0\times10^{-7}$（Abe et al., PRL 108, 131301, 2012）。AMS-02 沒有發表任何反原子核的偵測。伽瑪射線：在星系團的熱氣體中，比例為 $f$ 的反質子以速率 $f\,n_p^2\langle\sigma v\rangle$ 湮滅，其中 $\langle\sigma v\rangle\approx10^{-15}$ cm$^3$/s（一個數量級上的選擇）。在這裡採用的 π 介子衰變能譜中，每次湮滅給出 2.1 個 100 MeV 以上的光子。對后髮座星系團（beta 模型，$n_0 = 3.4\times10^{-3}$ cm$^{-3}$，$r_c = 291$ kpc，$\beta = 0.75$）與 Fermi-LAT 上限 $F(>100\ \mathrm{MeV}) < 5.2\times10^{-9}$ cm$^{-2}$ s$^{-1}$（Ackermann et al., ApJ 819, 149, 2016），這給出 $f < 9\times10^{-8}$。滿足：任何反物質都必須位於星系團之外，且超出宇宙線所能觸及的範圍，而宇宙線被侷限在數十 Mpc 之內。判據 2：我們的視界內沒有區域。如果共動尺寸為 $d$ 的物質與反物質區域相互接觸，那麼複合之後在它們的壁上發生湮滅是無法避免的。這裡的模型是 Cohen、De Rújula 與 Glashow 論證的簡化版本。對邊長為 $d$ 的立方體，每單位體積的壁面積為 $3/d$（在 $n$ 維中為 $n/d$，已檢驗），而重子以氣體聲速的 $\kappa$ 倍流入壁中。氣體溫度在 $z\approx150$ 之前追隨 CMB 溫度，之後絕熱冷卻。每次湮滅經由中性 π 介子衰變給出 3 個光子。光子紅移到今天，$dJ/dE = (c/4\pi)\int dz\,\dot{\mathcal N}\,S(E(1+z))/H$，而這個積分已對照一個解析式作檢驗。湮滅從複合（$z_{max} = 1000$）一直計算到 $z = 20$。與 CDG 一樣，較晚的時期被略去，因為它們取決於結構形成；把它們包括進來只會提高通量。通量恰好 $\propto 1/d$（已檢驗）。它與 COMPTEL 背景作比較，即 0.8 到 30 MeV 的 $dJ/dE = 6.4\times10^{-3}(E/\mathrm{MeV})^{-2.38}$
  cm$^{-2}$ s$^{-1}$ sr$^{-1}$ MeV$^{-1}$（Kappadath et al. 1996），以及 Fermi-LAT 各向同性背景（100 MeV 以上為 $7.2\times10^{-6}$ cm$^{-2}$ s$^{-1}$ sr$^{-1}$，譜指數 2.32，截斷 279 GeV；Ackermann et al., ApJ 799, 86, 2015）。來自 $z\sim20$-$300$ 的光子到達時能量為 1 到 10 MeV，在這個範圍由 COMPTEL 設定上限。結果：預測超出數據的倍數，對 $d = 100$ Mpc 為 160 倍，對 1 Gpc 為 16 倍，對 10 Gpc 為 1.6 倍。最小區域尺寸為 $d_{min}\approx16$ Gpc（在 8.5 MeV，$\kappa = 1$），大於可觀測宇宙 14.3 Gpc 的半徑。CDG 得到了相同的結論：物質區域必須幾乎就是整個可見宇宙。這是一個玩具模型，而 $d_{min}$ 隨 $\kappa$ 縮放。CDG 論證湮滅加熱會加快流入，這會使界限更強。受約束：任何反物質都必須位於我們的視界之外，那裡沒有望遠鏡能檢驗它。判據 3：微調。假設反物質在同一切片上位於視界之外，而且沒有任何東西安排它的分布。那麼一條平衡的隨機世界線在 $M$ 次穿越中給予我們這一區域的淨電荷約為 $\sqrt M$ 的量級。淨電荷的變異數等於 $M$；當 $T$ 次穿越的總和平衡時則為 $M(T-M)/(T-1)$（兩者都已檢驗）。出現大幅過剩的機率服從 Cramér 速率函數，$\log_{10}P\approx -M\,\mathrm{KL}/\ln10$，並已對照精確的二項分布尾部作檢驗。今天我們看到 $N_B\approx9\times10^{79}$ 個重子且沒有反物質，因此每次穿越都必須同號：$P = 2^{-N_B}$，$\log_{10}P\approx-2.7\times10^{79}$。若改為解讀成早期宇宙中約 $1.5\times10^{89}$ 對粒子（每個光子一對）之中 $9\times10^{79}$ 的過剩，則為 $\log_{10}P\approx-1.2\times10^{70}$。沒有機制的話，平衡的世界線就會失敗。這個機制必須是一個使我們這一區域中所有穿越的符號相互關聯的邊界條件：一種對稱性，而不是一次漲落。判據
  4：CPT 對稱宇宙。Boyle、Finn 與 Turok（PRL 121, 251301, 2018）提出，大霹靂之後的宇宙是大霹靂之前一個宇宙的 CPT 鏡像，因此這一對宇宙作為整體並不破壞 CPT。以下是作者將 P3 與此模型對齊的方式。一條穿過 $t = 0$ 的世界線在我們這一側是物質。鏡像中的觀察者具有相反的時間箭頭，因此他們把同一段看作反物質。第 2 步證明的但書依然適用：在任何完整的切片上，一條連續的世界線都有 $|Q|\leq1$，所以單靠鏡像並無幫助。如果世界線纏繞穿過大霹靂並穿過未來邊界，且共形時間的兩端被黏合在一起，這種對齊就行得通。這是超出已發表模型的一個額外假設，也就是第 2 步的延伸 C 換了一個位置出現。一個纏繞 $w$ 次的迴圈在我們這一側的每個切片上讀數為 $+w$，在每個鏡像切片上（以鏡像自身的箭頭讀取）讀數為 $-w$。總和為零（已檢驗）。過剩現在是一個拓撲整數，而不是一次漲落，儘管 $w\approx10^{80}$ 仍然是人為放入的。此模型已發表的預測（取自 Boyle、Finn 與 Turok 的摘要），以引用的數字檢驗：(a) 最輕的微中子無質量。以 NuFIT 6.0 的質量平方差（$\Delta m^2_{21} = 7.49\times10^{-5}$ eV$^2$，$\Delta m^2_{31} = 2.513\times10^{-3}$ eV$^2$ 正常，$\Delta m^2_{32} = -2.484\times10^{-3}$ eV$^2$ 反轉），這固定了 $\Sigma m_\nu = 0.0588$ eV（正常排序）或 $0.0989$ eV（反轉排序），以及 $m_\beta = 0.009$ 或 $0.049$ eV。KATRIN 將 $m_\beta$ 限制在 0.8 eV 以下（Nature Physics 18, 160, 2022）與 0.45 eV 以下（Science 388, 180, 2025），遠高於這兩個值。Planck 2018 給出 $\Sigma m_\nu < 0.12$ eV，兩者都允許。DESI 2024（$< 0.072$ eV）與 DESI DR2（$< 0.064$ eV，$\Lambda$CDM）排除了反轉情形，而允許正常情形。DESI DR2 也指出與振盪給出的下限之間存在張力，而最輕微中子無質量正是張力最小的情形。(b)
  暗物質是質量為 $4.8\times10^8$ GeV 的穩定右手微中子。這遠超任何對撞機的能及範圍，也不給出直接偵測訊號，因此目前無法檢驗。(c) 沒有原初重力波，所以 $r = 0$。BICEP/Keck 給出 $r < 0.036$（95%，PRL 127, 151301, 2021），兩者一致。真正的檢驗是 $\sigma(r)\sim10^{-3}$：這是 CMB-S4 的目標（該計畫已於 2025 年 7 月終止），現在則由 LiteBIRD 與 Simons Observatory 承擔。判定表。(1) 附近沒有混入：必要；滿足。單一個反氦原子核，或來自星系團的湮滅伽瑪射線，就會證偽它。(2) 視界內沒有區域：必要；受約束（$d\gtrsim16$ Gpc）。MeV 背景的過剩或來自較近壁面的 CMB 畸變會證偽它；在視界之外則無法檢驗。(3) 沒有微調：必要；對隨機世界線而言失敗（$\log_{10}P\sim-10^{70}$ 至 $-10^{79}$），只有一個機制能消除這個問題。(4a) 最輕微中子無質量：受約束，至今一致。量測到大於零的最輕質量就會證偽它，例如在正常排序下 $\Sigma m_\nu$ 明顯高於 0.0588 eV。(4b) 重右手微中子暗物質：目前無法檢驗。若暗物質被確認為其他東西，就會證偽它。(4c) $r = 0$：一致。$r\gg10^{-3}$ 的原初 B 模式會證偽它。總結：延伸後的 P3 只能以一種形式存活：一條跨越 CPT 鏡像宇宙而平衡、纏繞穿過大霹靂的世界線。以這種形式，它繼承了可證偽的預測。非零的最輕微中子質量，或 $r\gg0$ 的原初 B 模式，都會證偽 CPT 鏡像對齊。先前的步驟要麼重現了標準物理，要麼遇到的是假說能夠吸收的數據。這是本系列中第一個帶有可能失敗之檢驗的步驟。
meanings:
- 重複的 $z$ ⇒ 求和：對每個區域尺寸 $d$ 與光子能量 $E$，今天的瀰漫伽瑪射線強度
- 壁上每共動 cm$^3$ 每秒的湮滅次數：每單位體積的壁面積 $3/d$ 乘以流入量 $n_b v$
- 一次湮滅在發射能量處每 MeV 的光子數；重複的 $j$（π 介子能量）⇒ 求和
- COMPTEL 與 Fermi-LAT 背景所允許的最小區域尺寸（通量恰好 $\propto 1/d$）
- 由 Fermi-LAT 通量上限得到的后髮座星系團氣體中最大的反質子比例
- 符號隨機的 $M$ 次穿越的淨電荷；其變異數為 $M$
- 一條隨機世界線在 $M$ 次穿越中給予我們這一區域淨電荷 $Q$ 的機率（Cramér 速率函數）
- 我們的切片及其 CPT 映像上的淨電荷，各自以自身的時間箭頭讀取；重複的 $s$（線段）⇒ 求和
- 由最輕質量 $m_l$ 與 NuFIT 質量平方差得到的微中子質量總和
labels:
  dims: 世界線所在空間的維數 $D$（開放）
  speed_factor: 流入壁中的速度 $\kappa$，以氣體聲速為單位
  z_max: 壁上湮滅開始時的紅移 $z_{max}$（複合）
  winding: 世界線穿過大霹靂的纏繞數 $w$
