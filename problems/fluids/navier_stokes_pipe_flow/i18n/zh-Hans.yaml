source_hash: db9343501d33
title: 纳维–斯托克斯圆管流
summary: 完整的不可压缩纳维–斯托克斯方程，应用于圆管中突然受压强梯度驱动的水。对于轴向流动，非线性项严格消失，只剩下径向扩散方程：动量从无滑移壁面向内扩散，速度剖面在几个 $R^2/\nu$ 的时间内发展为哈根–泊肃叶抛物线。
notes: 这是纳维–斯托克斯方程少有的精确解之一：由于流动是平行的，$(\mathbf u\cdot\nabla)\mathbf u = 0$，只剩下压强梯度和黏性。定常哈根–泊肃叶流为 $u_z = G(R^2 - r^2)/4\mu$，流量 $Q = \pi G R^4/8\mu$（著名的 $R^4$ 定律），壁面切应力 $\tau_w = GR/2$——即单位长度上的力平衡 $G\,\pi R^2 = \tau_w\,2\pi R$。启动过程按 $e^{-\lambda_1^2\nu t/R^2}$ 趋于定常，其中 $\lambda_1 = 2.405$（$J_0$ 的第一个零点），因此到 $t \approx 0.6\,R^2/\nu$ 时剖面与抛物线只差百分之几。早期中心部分像柱塞一样整体运动，只有壁面附近的流体感受到阻力——注意观察染色线。此解为层流；雷诺数超过约 2000 时，实际管流会变为湍流。
meanings:
- 只有 $u_z \ne 0$ 且 $\partial_z u_z = 0$，因此对流项严格为零
- 连续性方程自动满足：$u_z$ 沿管道不变
- 从轴线（$i = 0$）到管壁（$i = N$）的径向点
- 轴向速度 $u_z(r_i)$；壁面值 $u_N = 0$（无滑移）
- $\tfrac1r\partial_r(r\partial_r\,\cdot)$ 的矩阵形式，轴线上取 $r \to 0$ 极限 $2\partial_r^2$
- 重复的 $j$ ⇒ 求和：黏性项 $\nu\nabla^2 u_z$
- 驱动压强梯度，单位 Pa/m
- 体积流量；定常值 $\pi G R^4/8\mu$
- 壁面单位面积阻力；定常值 $GR/2$
labels:
  G: 压强梯度 $G$
  R: 管道半径 $R$
  nu: 运动黏度 $\nu$
  t_max: 模拟时长（以 $R^2/\nu$ 为单位）
