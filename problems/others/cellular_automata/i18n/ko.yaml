source_hash: ebc73dcb492e
title: 256개의 기본 셀룰러 오토마타 전부, 그리고 Lenia
summary: '각 새 셀이 자기 자신과 두 이웃에 의해 결정되는 한 줄의 셀: 세 비트가 코드 $k \in \{0, \dots, 7\}$를 이루고, 규칙 번호를 이진수로 쓴 것이 곧 조회 테이블입니다. 256개 규칙 전부가 하나의 $(256, W)$ 텐서로 실행되며 단 한 번의 gather로 진행됩니다: 규칙 90은 시에르핀스키 삼각형을 그리고, 규칙 30은 무작위처럼 보이며, 규칙 110은 상호작용하는 구조를 만들고, 규칙 184는 교통 흐름을 움직입니다. 연속적인 사촌인 Lenia는 테이블을 매끄러운 고리 커널로 바꾸고 미끄러지듯 움직이는 생명체를 키웁니다.'
notes: '울프럼(Wolfram)은 기본 규칙을 네 부류로 나누었습니다: (1) 모든 것이 사라지거나 가득 차는 경우, (2) 정지하거나 주기적인 패턴, (3) 규칙 30처럼 혼돈인 경우(그 중앙 열은 오랫동안 난수 생성기로 쓰였습니다), (4) 규칙 110처럼 복잡하고 오래 지속되며 상호작용하는 구조(매슈 쿡(Matthew Cook)이 튜링 완전함을 증명했으며 2004년에 발표되었습니다). 모자이크는 151개 셀로 된 고리에서 600단계 후 거친 자동 판정으로 각 규칙을 색칠합니다: 균일, 이동을 허용한 주기적, 또는 주기를 찾지 못함. 마지막 그룹에는 3부류와 4부류가 섞여 있으며, 둘을 구별하는 정확한 정의는 없습니다. 규칙 90은 이웃을 mod 2로 더하므로 한 셀에서 시작하면 mod 2 파스칼 삼각형이 되고, 규칙 184는 가장 단순한 교통 모델입니다: 앞 칸이 비어 있으면 자동차가 오른쪽으로 움직이므로 자동차 수가 보존됩니다. 생명 게임(2D, $3\times3$ 개수 세기, 규칙 하나)과 달리 여기서는 모든 규칙이 동시에 실행됩니다. Lenia(버트 챈(Bert Chan), 2019)는 공간, 시간, 상태를 연속으로 만듭니다; 그 고전적 글라이더인 Orbium은 Lenia와 함께 공개된 셀 테이블(MIT 라이선스)에서 시작하여 움직이는 동안 질량을 유지하는데, 이는 어떤 보존 법칙도 강제하지 않는 솔리톤 같은 패턴의 예입니다.'
meanings:
- '규칙 번호 $r$의 비트 $k$: 이웃 코드가 $k$일 때의 새 상태'
- 고리 위 셀 $i$ 주변의 왼쪽, 가운데, 오른쪽 셀
- '반복된 $j$ ⇒ 합산: 3비트 이웃 코드 $4\,\text{left} + 2\,\text{centre} + \text{right}$'
- 한 번의 조회로 모든 규칙이 동시에 진행됨
- 규칙의 좌우 반전과 0/1 보수; 256개 규칙은 88개의 대칭류를 이룸
- 반지름 $R = 13$의 매끄러운 고리, 합이 1이 되도록 정규화
- 주기적 격자 위의 합성곱을 푸리에 변환의 곱으로 계산
- $U \approx \mu$인 곳에서는 성장하고 그 밖에서는 감쇠하며, 단계 크기는 $1/T$
labels:
  rule: 내 규칙 $r$ (첫 번째 패널)
  start: 내 규칙의 시작 상태
  width: 줄 너비 $W$
  generations: 세대 수
  density: 무작위 시작 밀도
  lenia_size: Lenia 세계 $S$
  lenia_steps: Lenia 단계 수
