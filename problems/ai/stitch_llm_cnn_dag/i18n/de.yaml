source_hash: 9a93d668845a
title: 'Getrennt trainieren, per DAG-Tensor zusammenfügen: ein CNN und ein kleines LM'
summary: 'Ein kleines CNN lernt MNIST-Ziffern und ein kleines GPT auf Zeichenebene lernt Sätze wie "three+two=five.", jedes für sich. Eine einzige DAG-Kante verbindet sie dann: Ein Konnektor wandelt die Merkmale des CNN in weiche Tokens um, die das erste Wort ersetzen, sodass das LM auf "[Bild einer 3]+two=" mit "five" antwortet. Der gesamte Trainingsprozess ist selbst ein Tensor-DAG (Regeln in Ebenen, ein Max-Plus-kritischer Pfad, ein gebündelter Aufruf pro Regel über alle Seeds), und er wird mit demselben Netz verglichen, das ausschließlich auf der gemeinsamen Aufgabe Ende-zu-Ende trainiert wird, bei gleichem Rechenaufwand (Multiplikationen-Additionen). Die verbindende Kante wird außerdem als Mixture-of-Experts-Schicht mit festem Router geschrieben, und ein gelernter Router wird auf die Probe gestellt.'
notes: 'Idee. Netze können getrennt trainiert, dann über einen DAG-Tensor verbunden und anschließend global optimiert werden, und der gesamte Prozess kann selbst vom DAG-Tensor gesteuert werden. Die Idee stammt von Jacky Ka Long Ko; dieses Problem testet sie an einem kleinen CNN und einem kleinen LM auf Zeichenebene, bewusst nicht als von Grund auf gemeinsam trainiertes Vision-Language-Modell, und vergleicht sie genau mit dieser Alternative ohne DAG. Was neu ist und was nicht. Ein multimodales Modell aus einem separat vortrainierten Bild-Encoder, einem vortrainierten LM und einem kleinen gelernten Konnektor aufzubauen, ist die Bauweise von LLaVA (Liu et al. 2023, eine lineare oder MLP-Projektion in den Token-Raum des LM) und BLIP-2 (Li et al. 2023, der Q-Former zwischen einem eingefrorenen Bild-Encoder und einem eingefrorenen LLM); Frozen (Tsimpoukelli et al. 2021) gibt einem eingefrorenen LM ein Bild als weiches Präfix ein, wie hier; und Model Stitching (Lenc und Vedaldi, CVPR 2015, arXiv
  2014; Bansal et al. 2021) verbindet zwei trainierte Netze durch eine kleine trainierbare Schicht. Was dieses Problem hinzufügt, ist die Orchestrierung: Der Modellgraph und der Trainingsprozess werden beide von der Tensor-DAG-Engine des Workflow-Problems zum Circulus arteriosus Willisii ausgeführt (Regelgraph, Kronecker-Jobgraph, boolesche Ebenen, Max-Plus-kritischer Pfad), und das per DAG gebaute Modell wird an einem Monolithen gemessen. Aufgabe und Modelle. Ein CNN (zwei 5×5-Faltungen, 8474 Gewichte) lernt die zehn Ziffern aus 3000 MNIST-Bildern. Ein zweischichtiges GPT (d = 32, vier Köpfe, 27 543 Gewichte, einsum-Attention mit einer Modellachse aus chain_of_thought) lernt die 300 Sätze „a op b = r.“ mit op aus +, −, × modulo 10, die Ziffern als Wörter ausgeschrieben ("three+two=five.", das erste Wort rechtsbündig in einem 5-Buchstaben-Slot). Die gemeinsame Aufgabe liefert ein MNIST-Testbild von a und den Text "+two="; das Operandenwort steht nicht im Text. Die DAG-Kante ist ein Konnektor
  (3808 Gewichte): Aus den zehn Ziffernwahrscheinlichkeiten $q$ des CNN und einem Slot-Vektor $S_t$ erzeugt er $K = 5$ weiche Tokens $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$, die den Operanden-Slot am Eingang des LM ersetzen. (Die vorletzten Merkmale des CNN stattdessen einzuspeisen lernte in Versuchen viel langsamer: etwa 0,25 gemeinsame Genauigkeit nach 100 Konnektor-Schritten gegenüber etwa 0,6.) Die Genauigkeit ist der Anteil der Testbeispiele, bei denen alle Antwortbuchstaben und der Schlusspunkt bei gegebenem wahrem Präfix die erste Wahl des LM sind, was genau dem entspricht, was gieriges Dekodieren schreibt. Der Trainingsprozess als DAG. data/training.smk listet die Regeln auf; die Engine parst sie mit dem Parser des Circulus-Willisii-Problems und führt sie Ebene für Ebene aus, jede Regel als EIN gebündelter Aufruf über ihre Modelle auf einer gestapelten Modellachse (Seed × Größe der gemeinsamen Menge $n$): Ebene 0 train_cnn ∥ train_lm ∥ train_monolith; Ebene 1 train_connector (CNN
  und LM eingefroren, durch den Block $I \otimes \mathbb 1$ von Seed auf (Seed, $n$) ausgestrahlt); Ebene 2 global_finetune (alles, Ende-zu-Ende über die Kante, mit einer 100-mal kleineren Lernrate) ∥ zwei gelernte Router; Ebene 3 evaluate. Mit 2 Seeds und 4 Größen: 8 Regeln, 45 Jobs, 84 Job-Kanten, $A$ nilpotent. Die Tests prüfen die Ebenen, dass ein Zyklus abgelehnt wird, dass zwei in einem Stapel trainierte Seeds dieselben Verluste liefern wie jeder allein trainierte (Adam arbeitet elementweise, das Clipping erfolgt pro Modell) und dass der Verlust eines Modells keinen Gradienten an die anderen sendet. Die Vergleichsbasis. Der Monolith ist dasselbe CNN + Konnektor + LM (39 825 Gewichte), zufällig initialisiert und ausschließlich auf den gemeinsamen Beispielen Ende-zu-Ende trainiert. Sein Budget ist in Multiplikationen-Additionen pro Modell angeglichen: Die 150 CNN-, 600 LM-, 150 Konnektor- und 80 Feinabstimmungsschritte (Batch 32) der DAG-Pipeline kosten so viel wie 682 gemeinsame Schritte,
  die der Monolith erhält (wobei jedes Vortraining für jedes Modell vollständig gezählt wird, obwohl im DAG ein vortrainiertes CNN und LM alle vier Werte von $n$ bedienen). Ergebnisse (2 Seeds, 1000 Testbilder, Zufall 0,1, CPU). Mehrfädige Gleitkomma-Reduktionen lassen wiederholte Läufe um einige Punkte voneinander abweichen, daher sind die folgenden Zahlen die Spanne des Seed-Mittelwerts über vier vollständige Läufe; results/stages.csv enthält die exakten Zahlen des mitgelieferten Laufs. Allein liest das CNN 0,89 der Testziffern und das LM vervollständigt 0,97 bis 0,99 der Text-Prompts; die Ziffer des CNN als Text zu schreiben und dem LM zu geben ergibt 0,88 bis 0,89, die Obergrenze dieser Pipeline. Gemeinsame Genauigkeit für $n$ = 100, 300, 1000, 3000 gemeinsame Beispiele: untrainierter Konnektor etwa 0,16; nach der Konnektor-Stufe 0,41–0,47, 0,58–0,63, 0,60–0,69, 0,64–0,68; nach der globalen Feinabstimmung 0,41–0,47, 0,63–0,67, 0,68–0,75, 0,71–0,75; der Monolith 0,14, 0,13–0,15, 0,16–0,17,
  0,23. Das per DAG gebaute Modell gewinnt bei jedem $n$ in jedem Lauf, am deutlichsten dort, wo gemeinsame Daten knapp sind, und die Feinabstimmung bringt ab $n$ = 300 zusätzlich 0,03 bis 0,08 (bei $n$ = 100 ändert sie im Mittel nichts). Der Grund ist einfach: Der DAG nutzt unimodale Daten wieder (3000 beschriftete Ziffern und jeden Satz), während der Monolith Ziffern und Arithmetik allein aus $n$ Antwortwörtern entdecken muss, und × verbirgt oft den Operanden (alles × 0 = 0). Mit mehr Schritten oder Daten würde sich der Monolith verbessern (sein Verlust sinkt am Ende seines Budgets noch): Dies ist ein Vergleich mit kleinem Budget, kein Gesetz. DAG-Kante = MoE-Verteilung. Dieselbe Eingabeschicht wird als Mixture of Experts geschrieben: Experte img (CNN + Konnektor) und Experte txt (die Token-Einbettung des LM), ein Router $G$ über Positionen × Experten, jeder Experte gebündelt auf den ihm zugeteilten Positionen ausgeführt, und die Kombination $X^0 = G_{mntx}Y^x_{mntc}$. Mit $G$ one-hot
  nach Datentyp (Bild-Slot oder Buchstabe, bekannt, bevor irgendwelche Daten gesehen werden, so wie ein Workflow eine Regel anhand ihrer Wildcard wählt) stimmt die MoE-Ausgabe bis auf 1e-6 mit der per DAG verdrahteten Ausgabe überein, ebenso alle Gradienten (getestet). Die genaue Beziehung: Eine DAG-Kante ist eine MoE-Verteilung mit einem festen, durch den Datentyp bestimmten Router; ein MoE ist ein DAG, dessen Kanten für jedes Token von einem gelernten Router gewählt werden. Kann ein Router dieses Routing lernen? Ein linearer Router auf den Merkmalen jeder Position (auf 7×7 gepooltes Bild und One-hot-ID) wurde mit eingefrorenen Experten und dem Switch-Lastausgleichsverlust ($\alpha$ = 0,01) trainiert. Switch top-1 (nur der gewählte Experte läuft, skaliert mit $p$) ist unzuverlässig: Seine Routing-Genauigkeit lag über Modelle und Läufe hinweg zwischen 0 und 0,92 und seine Aufgabengenauigkeit zwischen 0 und etwa 0,46, weil der nicht gewählte Experte keinen Gradienten erhält, sodass eine falsche
  frühe Wahl nie korrigiert wird, und der Ausgleichsverlust zu einer 50/50-Aufteilung zieht, während die wahre Aufteilung 5/17 ist. Als dichte Mischung trainiert ($G = p$, beide Experten überall) und dann als top-1 verwendet, findet der Router in jedem Modell und jedem Lauf das Routing nach Modalität wieder (0,97 bis 0,99 der Positionen) und erreicht etwa 0,35 bis 0,65 Aufgabengenauigkeit, etwas unter dem festen Router, weil $p < 1$ die Ausgaben herunterskaliert. Wenn die richtige Kante aus dem Datentyp bekannt ist, ist es sowohl exakt als auch günstiger, sie festzulegen. Zeit. Auf einer 6-Kern-Desktop-CPU trainiert der Standardlauf in etwa 66 s, wenn die Maschine sonst unbelastet ist (bis zu 2 bis 4 Minuten, wenn sie mit anderen rechenintensiven Jobs geteilt wird), zuzüglich etwa 15 s für das GIF: Im unbelasteten Lauf brauchte der Monolith 35 s, das LM 12 s, der Konnektor 4,5 s und die Feinabstimmung 4 s. Mit einem Worker pro Regel ist der Max-Plus-kritische Pfad der Monolith, dann evaluate
  (39 s); die eigene Kette des DAG-Systems LM → Konnektor → Feinabstimmung → evaluate dauert etwa 24 s. Der Code wählt die GPU, wenn torch eine erkennt; die Umgebung dieses Projekts hat einen CPU-Build von torch, daher stammt jede mitgelieferte Zahl von der CPU. Daten. MNIST (Y. LeCun, C. Cortes, C. J. C. Burges), Lizenz CC BY-SA 3.0: Eine ausgewogene Teilmenge von 3000 Trainings- und 1000 Testbildern ist mitgeliefert (data/mnist_subset.npz, 0,7 MB; data/SOURCES.md enthält die Quelle, die Prüfsummen und die Verarbeitung). Die Sätze werden im Code erzeugt. Ausprobieren. Weniger LM-Schritte (die Genauigkeit des LM begrenzt alles), ein größeres $\alpha$ (der Switch-Router kollabiert stärker), keine Feinabstimmung (0 Schritte) oder ein einziger Seed, um zu sehen, wie stark die Seeds voneinander abweichen.'
meanings:
- Regel $s$ liest, was Regel $r$ schreibt; der Trainingsprozess, aus data/training.smk mit dem Parser des Circulus-Willisii-Problems geparst
- 'Jobgraph über die Wildcards Seed und $n$: Eine Regel ohne $n$ wird auf jedes $n$ ausgestrahlt ($I \otimes \mathbb 1$), evaluate sammelt alle ein ($\mathbb 1^\top$)'
- 'Ebene jeder Regel: train_cnn, train_lm und der Monolith auf 0, der Konnektor auf 1, Feinabstimmung und Router auf 2, evaluate auf 3'
- Max-Plus-Endzeiten aus den gemessenen Regeldauern; $\max t$ ist der kritische Pfad
- die zehn Ziffernwahrscheinlichkeiten des CNN für jedes Bild; die Modellachse $m$ wird zu den Gruppen einer gruppierten Faltung pro Schicht
- 'die DAG-Kante: Ziffernwahrscheinlichkeiten plus ein Slot-Vektor $S_t$ → ein LM-Eingabevektor an Position $t$; die $K = 5$ weichen Tokens ersetzen das verborgene erste Wort'
- 'Router: one-hot nach Datentyp (Bild-Slot oder Buchstabe) oder ein gelernter Switch-top-1-Softmax über die Positionsmerkmale'
- 'wiederholtes $x$ ⇒ summiert: die Kombination der MoE-Schicht; jeder Experte $Y^x$ wird nur auf seiner zugeteilten Gruppe berechnet'
- Logits des nächsten Buchstabens des kleinen GPT (einsum-Attention mit einer Modellachse, aus chain_of_thought)
- Verlust pro Modell auf dem Text nach dem Präfix (nats); die Summe der $M$ Verluste gibt jedem Modell seinen eigenen Gradienten
labels:
  seeds: Seeds (unabhängige Wiederholungen)
  steps_cnn: CNN-Vortrainingsschritte
  steps_lm: LM-Vortrainingsschritte
  steps_con: Konnektor-Schritte (CNN und LM eingefroren)
  steps_ft: Schritte der globalen Feinabstimmung
  steps_router: Schritte des gelernten Routers (je Router)
  lr_ft: Lernrate der Feinabstimmung
  alpha: Gewicht des Lastausgleichs $\alpha$
