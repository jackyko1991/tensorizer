source_hash: c27c115f2935
title: Las singularidades como pliegues de una proyección
summary: 'Una hipótesis especulativa, no física establecida: el espacio-tiempo curvo es la sombra de una superficie en un espacio plano de dimensión superior, y una singularidad es donde esa sombra se pliega. Primero se comprueba la geometría conocida. El paraboloide de Flamm y el embebimiento de Fronsdal de 1959 de todo el espacio-tiempo de Schwarzschild en seis dimensiones planas devuelven exactamente la métrica (autograd), y el escalar de Kretschmann $12r_s^2/r^6$ sale de la misma diferenciación automática. Las láminas proyectadas se pliegan con exponentes de densidad universales: $-1/2$ para un pliegue, $-2/3$ para una cúspide. Un interior con forma de pliegue deja el exterior exactamente de Schwarzschild, de modo que se oculta tras el horizonte. Nada de esto puede observarse directamente.'
notes: 'Paso 4 de la hipótesis de proyección (véase la descripción de la serie), la hipótesis especulativa del autor, no física establecida. El paso 1 (cosmology/projection_postulate) enuncia el postulado P4: el espacio-tiempo curvo es la forma proyectada de un embebimiento plano de dimensión superior, y una singularidad es donde la proyección se pliega (su jacobiano pierde rango). El paso 3 (cosmology/projection_dimension_budget) cuenta dimensiones, el paso 5 (cosmology/projection_bell_test) pone a prueba los postulados de medición, y el paso 6 (cosmology/projection_telescope_tests) examina lo que los telescopios pueden comprobar. El número de dimensiones planas $D$ queda abierto: aquí es un parámetro y nunca entra en un resultado. Primero, la geometría conocida. (a) Flamm (1916): el corte ecuatorial $t = $ const, $\theta = \pi/2$ de Schwarzschild dibujado en $\mathbb R^3$ plano es el paraboloide $z = 2\sqrt{r_s(r-r_s)}$, y su métrica inducida $dr^2/(1-r_s/r) + r^2d\phi^2$ coincide hasta
  $10^{-16}$. (b) Fronsdal (Phys. Rev. 116, 778, 1959) embebe todo el espacio-tiempo de Schwarzschild, también dentro del horizonte, en $\mathbb R^{1,5}$ plano. La métrica inducida $\eta_{AB}\partial_iz^A\partial_jz^B$, con el jacobiano calculado por autograd, coincide con Schwarzschild hasta $10^{-13}$ fuera y dentro, y en coordenadas de Kruskal a través del horizonte. La geometría curva en 4D puede verse realmente como una superficie en un espacio plano; este es el ancla de P4. Dos hechos importan para P4. El embebimiento tiene rango completo en el horizonte: la pérdida de rango que se ve en coordenadas $(t, r)$ desaparece en coordenadas de Kruskal. En $r\to0$ tampoco se pliega; se va al infinito, $z^2\approx-2r_s^{3/2} r^{-1/2}$. La curvatura, calculada con la misma diferenciación automática (símbolos de Christoffel, tensor de Riemann, contracciones einsum), da $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ hasta $10^{-15}$. Los autovalores de marea estáticos son $+r_s/r^3$ (estiramiento radial)
  y $-r_s/2r^3$ (compresión lateral), todos divergentes en $r = 0$. La afirmación de P4, hecha concreta: una lámina suave en $\mathbb R^D$ plano, vista a través de una proyección, tiene una sombra cuya densidad diverge en las cáusticas de pliegue. La teoría de catástrofes (Thom, Arnold) dice que el exponente es universal. La aplicación $x = s^n$ da $\rho\propto|x|^{1/n-1}$, medido como $-0.500$ (pliegue), $-0.667$ (cúspide) y $-0.750$ ($n = 4$). Una esfera $S^k$ proyectada sobre $\mathbb R^3$ tiene una densidad en el borde $u^{(k-3-1)/2}$, medida como $-0.51$, $0.00$, $+0.45$ para $k = 3, 4, 5$ con cualquier $D$. Así, un pico de densidad necesita una lámina con exactamente tantas dimensiones como la pantalla; una lámina más gruesa da una sombra suave. La animación inclina una lámina ondulada hasta que se pliega, en $a\tan\alpha > 1$. Comparación con la RG: se da a la masa $M = r_s/2$ la densidad de la sombra de una 3-esfera, $\rho\propto(1-r^2/R^2)^{-1/2}$, una caricatura de campo débil,
  no una solución de las ecuaciones de Einstein. Fuera de $R$ el campo es exactamente $r_s/r^3$ (teorema de Birkhoff, teorema de la capa), y el centro sigue siendo finito. La divergencia se traslada a la capa del pliegue y se suaviza a $(R-r)^{-1/2}$ en densidad y campo de marea, y el indicador de curvatura $8\sum E^2$ a $(R-r)^{-1}$, en lugar de los $r^{-3}$ y $r^{-6}$ de la RG. La lámina misma conserva una curvatura finita $1/R^2$. Veredicto, con honestidad. P4 puede mantener sin cambios la geometría exterior de Schwarzschild, muy estrictamente comprobada, y cambiar solo el interior, pero eso es justamente lo que la hace incomprobable: para $R < r_s$ el pliegue queda detrás del horizonte, y ninguna señal procedente de él nos llega. Los exponentes universales son nuevos solo como descripción, ya que nada fuera del horizonte depende de ellos. Un pliegue fuera del horizonte ($R > r_s$) sería un objeto compacto sin horizonte, con anillos de fotones y ecos distintos; eso es lo que el paso 6
  pone a prueba con las sombras de agujeros negros. Contexto: fluids/blowup_profile_search muestra cómo se estudian en la práctica los perfiles singulares y sus exponentes (ansatz autosemejante, búsqueda de exponentes). Wikipedia: métrica de Schwarzschild, teoría de catástrofes.'
meanings:
- jacobiano del embebimiento por diferenciación automática, uno por punto de muestra $b$
- 'métrica inducida: los índices de embebimiento repetidos $A, C$ se suman con la métrica plana $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$'
- la coordenada de embebimiento adicional, una suma de Gauss–Legendre de 64 nodos sobre $q$ en $\ell = \ln s$, diferenciable en $r$; tiende a $-\infty$ como $r^{-1/2}$
- 'menor valor singular: un pliegue de la aplicación está donde llega a 0 y el jacobiano pierde rango'
- símbolos de Christoffel a partir de la derivada autograd de la métrica; se suma sobre $d$
- tensor de Riemann a partir de una segunda derivada en modo directo y dos productos einsum (suma sobre $e$)
- escalar de Kretschmann, sumados los cuatro índices; igual a $12r_s^2/r^6$ dentro y fuera del horizonte
- densidad de la sombra de una lámina uniforme bajo $x = s^n$ (pliegue $n = 2$, cúspide $n = 3$), histograma en intervalos logarítmicos
- tensor de marea newtoniano de una masa repartida como la sombra de una 3-esfera de radio $R$ (caricatura de campo débil)
labels:
  fold_radius: Radio $R$ de la capa del pliegue
  sheet_amplitude: Amplitud $a$ de la lámina ondulada
  D: Dimensión plana $D$ que contiene las láminas esféricas (abierta)
  samples: Puntos muestreados en cada lámina
