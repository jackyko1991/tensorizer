source_hash: 695e730c122f
title: 有 $N$ 扇门的蒙提霍尔问题
summary: 一辆汽车藏在 $N$ 扇门的其中一扇后面。你选一扇；知道汽车位置的主持人打开 $N-2$ 扇后面是山羊的门，并让你改选最后一扇关着的门。对每个从 3 到 1000 的 $N$，数百万局游戏在一个 $(B, G)$ 张量中同时进行：换门的获胜概率是 $(N-1)/N$（三扇门时就是著名的 $2/3$），不换则是 $1/N$，而每条累积胜率都保持在它的二项误差带之内。
notes: 只有当你第一次就选中汽车时，换门才会输，而这发生的概率是 $1/N$；其他每一次，主持人的选择都是被迫的，所以他留下没开的那扇门承载了他打开的所有门的信息。有 1000 扇门时答案显而易见，而论证和三扇门时完全相同。这个谜题因 Marilyn vos Savant 1990 年的杂志专栏而声名大噪，当时许多读者（其中不乏数学家）坚持答案是 $1/2$。这个直觉对另一种游戏是正确的：选择不知情的主持人，他随机开门，有时会把汽车揭露出来。丢掉这些局（只有比例 $2/N$ 的局留下）后，不换与换门的胜率都正好是 $1/2$，因为随机开门对你的门没有提供任何信息。终端也会检查没有哪个初始选择是特殊的，而测试中一个逐局进行的慢速参考实现与张量版本结果一致。
meanings:
- 并排比较的门数，从 3 到 1000
- 第 $b$ 行第 $g$ 局的汽车门与初始选择，在 $N_b$ 扇门上均匀分布；广播让每一行有各自的 $N_b$
- 主持人留下没开的门：你选到山羊时必定是汽车门，你选到汽车时则是随机的一扇门
- 主持人打开的 $N-2$ 扇门：除了 $p$ 和 $k$ 以外的每一扇门
- 不换获胜与换门获胜；每局中恰有其中一个成立
- 累积胜场除以累积有效局数：每局之后的胜率
- 二项比例的 $\pm 2\sigma$ 带，累积胜率约有 95 % 的时间落在其中
labels:
  n_games: 每种门数的游戏局数 $G$
  max_doors: 最大门数 $N$
  host: 主持人
