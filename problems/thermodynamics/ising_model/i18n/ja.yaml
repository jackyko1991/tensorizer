source_hash: f24d1ad2823c
title: 2次元イジング模型
summary: 隣接スピンとそろうことを好む $\pm 1$ スピンの格子。各サイトの隣接和は十字形カーネルによる1回の conv2d であり、チェッカーボード型のメトロポリス更新で格子の半分を並列に反転させる。臨界温度より下ではドメインが成長して磁石が秩序化し、上ではスピンは無秩序のままである。
notes: 単位：$J = k_B = 1$ なので $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$。バッチ内で3つの格子が並んで走る：選んだ $T$、$T_c$、$T = 3.5$。すべてランダムなスピン（無限大温度）から始まり、急冷される。すべてのサイトを一度に更新するのは誤りである——隣接サイトが古い値に基づいて反転してしまう——が、チェッカーボードの一方の色のサイトは他方の色にしか接しないので、各半分は並列に更新できる。低い $T$ への急冷では2つの縞状ドメインに長時間はまり込むことがあり、これは周期格子上のダイナミクスの実際の特徴である。有限格子では $T_c$ より上でも $\lvert m\rvert$ は厳密には0でなく、$T_c$ 付近では強く揺らぐ（臨界減速）。$E/N$ は $-2$（完全秩序）から 0 までをとる。
meanings:
- 行 $i$、列 $j$ のスピン $\pm 1$——$B$ 個の温度のバッチについて（1 は conv2d のチャネル）
- 最近接4サイトを拾う畳み込みカーネル
- 繰り返される $k, l$ ⇒ 和をとる：隣接和、周期境界
- 各スピンを単独で反転させるエネルギーコスト
- 繰り返される $i, j$ ⇒ 和をとる：ボンドエネルギーの2倍（各ボンドを両端から数える）
- 格子ごとに1つの温度、サイトにわたってブロードキャスト
labels:
  T: 温度 $T$
  L: 格子サイズ $L$
  n_sweeps: モンテカルロ・スイープ数
