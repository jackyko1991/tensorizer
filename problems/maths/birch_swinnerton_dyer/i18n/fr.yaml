source_hash: 52a00886e77c
title: 'Birch et Swinnerton-Dyer : compter les points modulo p'
summary: Compter d'un seul coup les points de cinq courbes elliptiques de rang 0 à 4 sur $\mathbb F_p$ pour tous les nombres premiers jusqu'à $X$, voir les produits $\prod_{p\le X} N_p/p$ croître comme $(\log X)^r$, comme Birch et Swinnerton-Dyer l'ont observé les premiers, et calculer $L(E, s)$ en $s = 1$, où elle s'annule à un ordre égal au rang. La conjecture selon laquelle c'est toujours le cas reste ouverte ; elle n'est démontrée que pour un rang analytique 0 ou 1.
notes: 'Une courbe elliptique $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ sur $\mathbb Q$ possède un groupe de points rationnels de type fini $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ (Mordell 1922) ; le rang $r$ est difficile à calculer. Au début des années 1960, Birch et Swinnerton-Dyer ont compté des points modulo des nombres premiers sur l''ordinateur EDSAC et remarqué que $\prod_{p \le X} N_p/p$ croît comme $(\log X)^r$ : davantage de points rationnels imposent davantage de points modulo $p$. Ils ont conjecturé que $L(E, s)$, construite à partir des $a_p$, s''annule en $s = 1$ à l''ordre exactement $r$, avec pour coefficient dominant $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$. C''est l''un des problèmes du prix du millénaire de l''Institut Clay, et il est ouvert. Ce qui est démontré : si le rang analytique vaut 0 ou 1, le rang lui est égal et Ш est fini (Gross et Zagier 1986, Kolyvagin 1989), grâce à la modularité (Wiles, Taylor–Wiles 1995,
  Breuil–Conrad–Diamond–Taylor 2001), qui est précisément ce qui permet de prolonger $L(E, s)$ jusqu''en $s = 1$. Pour un rang analytique $\ge 2$, on ne sait rien de général. Les cinq courbes sont celles de plus petit conducteur pour les rangs 0 à 4 (11a1, 37a1, 389a1, 5077a1 et 234446a1 dans les tables de Cremona). Ici : les traces respectent la borne de Hasse $|a_p| \le 2\sqrt p$ ; pour 11a1, elles coïncident avec les coefficients de la forme modulaire $\eta(q)^2\eta(q^{11})^2$ (testé) ; les signes de l''équation fonctionnelle valent $\varepsilon = (-1)^r$ ; la première dérivée non nulle en $s = 1$ est la $r$-ième pour chaque courbe, et $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$ et $L''''''(E,1)/6 = 1.7318499\ldots$ concordent avec la LMFDB. Pour 11a1, la formule complète se vérifie : $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$. Un zéro numérique d''une dérivée est un indice, pas une preuve qu''elle s''annule.
  Les produits partiels sont l''heuristique d''origine : Goldfeld (1982) a montré que s''ils se comportent vraiment comme $C(\log X)^r$, alors $r$ est le rang analytique et l''hypothèse de Riemann est vraie pour $L(E, s)$ ; leur convergence est donc elle-même conjecturale, et lente. Les pentes ordonnent correctement les rangs 0 à 3 dès $X = 2\times 10^4$, mais la courbe de rang 4 reste encore en deçà de son rang à $X = 3\times 10^4$. La loi de Sato–Tate pour $a_p/2\sqrt p$, le demi-cercle $\frac{2}{\pi}\sqrt{1-x^2}$, est un théorème pour les courbes sans multiplication complexe (Taylor et collaborateurs, 2008–2011).'
meanings:
- toutes les courbes, tous les nombres premiers d'un bloc et tous les $x \in \mathbb F_p$ d'un coup (Horner, réduction modulo $p$ à chaque étape)
- symbole de Legendre tiré d'une table des carrés $y^2 \bmod p$ ; $\chi = 0$ pour $v = 0$
- 'la trace de Frobenius ; Hasse : $|a_p| \le 2\sqrt p$'
- les produits partiels pour tous les $X$ d'un coup (bons nombres premiers uniquement)
- pente sur $\sqrt{X} \le p \le X$ ; converge très lentement
- coefficients de Dirichlet par multiplicativité, une tranche à pas fixe par puissance de nombre premier $q = p^k$
- '$n$ répété ⇒ sommé : $F(t)$ aux nœuds de Gauss–Legendre $t = e^{u_m}$'
- toutes les dérivées en $s = 1$ d'un coup ; la première non nulle donne le rang analytique
labels:
  x_max: Nombres premiers jusqu'à $X$
