source_hash: f81a85fc73c6
title: 反應爐臨界
summary: 一塊可分裂材料平板是否達到臨界？單群中子擴散把這個問題化為網格上的廣義特徵值問題 $M\phi = \tfrac1k F\phi$。冪迭代——反覆求解下一代中子——收斂到基本通量模態與倍增因子 $k_{eff}$，而對多個平板寬度的批次特徵值求解則找出臨界尺寸。
notes: $k$ 是一代中子數與前一代之比。每一步冪迭代就是一代：較高的空間模態每步縮小 $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$ 倍，因此不對稱的初始分佈弛豫為對稱的 $\sin(\pi x/L)$ 形狀。薄板洩漏太多中子（$k < 1$）；超過臨界寬度 $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$ 時，連鎖反應便會增長。預設的單群常數是熱中子反應爐的示意值（$k_\infty \approx 1.06$）。簡化：單一能群、均勻裸板無反射層、$L$ 量於外推邊界之間，且沒有遲發中子或回饋——這是靜態特徵值計算，不是時間相依的計算。
meanings:
- 內部格點；在（外推）板面上 $\phi = 0$
- 二階差分矩陣 $(1, -2, 1)/h^2$
- 因洩漏與吸收而損失的中子
- 分裂產生的中子
- 重複的 $j$ ⇒ 求和：下一代的分裂源
- 一步冪迭代
- 直接求解，對 $S$ 個平板寬度批次計算
labels:
  width: 平板寬度 $L$
  diffusion: 擴散係數 $D$
  sigma_a: 吸收 $\Sigma_a$
  nu_sigma_f: 產生 $\nu\Sigma_f$
  n_iter: 冪迭代次數
  n_grid: 格點數
