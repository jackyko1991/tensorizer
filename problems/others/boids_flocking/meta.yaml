  n_birds: {default: 200, min: 50, max: 1000, step: 10, type: int, label: 'Birds $N$'}
  box: {default: 5.8, min: 3.0, max: 20.0, step: 0.2, label: 'Box side $L$ (neighbour radius $R = 1$)'}
  speed: {default: 0.03, min: 0.005, max: 0.3, step: 0.005, label: 'Speed $v_0$'}
  eta: {default: 1.5, min: 0.0, max: 6.28, step: 0.05, label: 'Noise $\eta$ of the flock shown'}
  n_noise: {default: 12, min: 4, max: 40, step: 1, type: int, label: 'Noise levels in the batch'}
  steps: {default: 500, min: 50, max: 3000, step: 50, type: int, label: Time steps}
  seed: {default: 0, min: 0, max: 1000, step: 1, type: int, label: Random seed}
