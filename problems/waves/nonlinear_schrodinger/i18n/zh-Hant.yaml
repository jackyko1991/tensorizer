source_hash: 615dd7755626
title: 瘋狗浪（非線性薛丁格方程式）
summary: 聚焦型非線性薛丁格方程式描述深水波群與光纖中光脈衝的包絡。均勻波列是不穩定的：微小漣漪會長成約為背景三倍高的巨峰，就像瘋狗浪。以分步傅立葉法求解：色散在 $k$ 空間中精確處理，非線性在 $x$ 空間中精確處理。
notes: Strang 分裂：半步色散、一整步非線性、再半步色散；具二階精度，且使 $N$ 守恆到捨入誤差。調制不穩定性：在高度為 1 的背景上，波數 $K < 2$ 的擾動會增長，在 $K = \sqrt2$ 時最快，增長率為 1。在 **modulation** 模式中，背景以 $10^{-3}$ 的隨機雜訊開始（固定種子）：峰值在 $t \approx 8$ 之後出現，並不斷形成與消散。Peregrine 呼吸子 $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$ 從背景中升起一次，恰好達到背景的 $3\times$ 高度後消失；**peregrine** 模式從 $t = -5$ 開始。**soliton** 模式發射亮孤立子 $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$，其形狀永遠保持不變。虛線標示 $|\psi| = 3$。週期性盒子，長度 60。
meanings:
- 週期性網格上的複數波包絡（complex128）
- 色散 $i\psi_t = -\tfrac12\psi_{xx}$ 的半步，對每個傅立葉模態精確
- 重複的 $l$ ⇒ 求和：離散傅立葉轉換
- 非線性 $i\psi_t = -|\psi|^2\psi$ 的一步，因 $|\psi|$ 不變而精確
- $\int|\psi|^2$ 與 $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$，兩者皆守恆
labels:
  mode: 初始狀態
  noise: 雜訊振幅（modulation）
  eta: 孤立子高度 $\eta$
  t_max: 模擬時間
