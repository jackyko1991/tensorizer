source_hash: 278f16a6d4b6
title: アインシュタイン 1905：運動物体と $E = mc^2$
summary: 1905 年の相対論に関する 2 本の論文を、アインシュタイン自身の道筋に沿ってたどる。2 つの公準——すべての慣性系で物理法則は同じ、光は常に $c$ で進む——から出発し、一群の光時計によって、運動する時間が $\gamma$ 倍遅れること、物差しが $1/\gamma$ に縮むこと、同時性が観測者に依存すること、速度を合成しても決して $c$ を超えないことを示す。質量とエネルギーの論文（光のエネルギー $L$ を放出した物体は質量 $L/c^2$ を失う）は He-4 の質量欠損と $e^+e^-$ 対消滅で確かめ、Frisch と Smith が 1963 年にワシントン山と海面で数えたミューオン計数へのフィットから $\gamma \approx 9$ を得る。
notes: これはアインシュタインの 1905 年「奇跡の年」の 4 論文のうちの 1 つ——実際には 2 つ——である：「運動物体の電気力学について」（6 月）と「物体の慣性はその物体の含むエネルギーに依存するか？」（9 月）。残りは光量子論文（量子：光電効果と光量子）とブラウン運動（熱力学：ランダムウォークと拡散）。相対論を幾何として見るには特殊相対論：ミンコフスキー図とローレンツブースト（天体物理）、場のテンソルについては $F^{\mu\nu}$ のローレンツブースト（電磁気）、衝突については4元運動量と2体崩壊（原子核・素粒子）を参照。単位は $c = 1$、鏡の間隔は $D = 1$。アインシュタインの質量の議論：静止した物体が前方に $L/2$、後方に $L/2$ を放出する。速度 $v$ で動く系では光は $\gamma L$ を運び、$L$ より多い。両方の系でのエネルギー保存から、物体の運動エネルギーは $L(\gamma - 1)$ だけ減らねばならず、これはちょうど質量 $L/c^2$ が持つ運動エネルギーに等しい（彼は低速の項 $\tfrac12 (L/c^2)v^2$ だけを残した）。原子質量は AME2020 による。実データ（data/frisch_smith_1963_muons.csv）：D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508——同じエネルギーまで減速したミューオンが、ワシントン山の 1917 m で毎時 $563 \pm 10$ 個、海面で毎時 $408 \pm 9$ 個（論文で公表された測定値。Wikipedia の要約は後者を 412 に丸めている）。飛行には約 6.4 μs かかり、ミューオン寿命 2.2 μs のほぼ 3 倍なので、時間の遅れがなければ毎時約 30 個しか届かない。計数からミューオンの時計は 0.71 μs、$\gamma \approx 9.1 \pm 0.8$ となる（論文では測定した崩壊曲線を用いて $8.8 \pm 0.8$）。速度からの予言は、大気中で $\beta \approx 0.995$ から $\approx 0.989$ へ減速する過程を積分して求める（電離損失 $dE/dx$、等温大気）：約
  8.4 で、論文と一致する。Rossi と Hall（1941）が、エコー湖とデンバーで宇宙線ミューオンを使って初めてこの効果を示した。
meanings:
- 時刻 $t$ における時計 $b$ の光子：水平速度 $\beta_b$、鉛直速度 $\sqrt{1-\beta_b^2}$、したがって常に $c$
- 1 刻みにかかる時間は $\gamma\cdot 2D/c$。刻みの数はジグザグ経路から数える
- $x$ 方向の一群のブースト、$\eta = \operatorname{diag}(-1, 1, 1, 1)$
- 繰り返された $\nu$ ⇒ 和：すべての系におけるすべての事象。列車の閃光は $\Delta t' = -\gamma\beta\Delta x$ となる
- 世界間隔。どのブーストでも不変
- 運動する系から見た 2 つの光パルス：合計 $\gamma L$、したがって $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$
- 質量欠損 × 931.494 MeV/u（He-4：28.30 MeV）
- 2 つのミューオン計数率に対する $\chi^2(\gamma)$ を autograd でニュートン法により最小化
labels:
  beta_fast: 最速の時計の速さ $\beta$
  n_clocks: 光時計の数
  dEdx: 空気中でのミューオンのエネルギー損失 $dE/dx$
