source_hash: 88e5f57d0eb4
title: 曼德博集合與朱利亞集合
summary: 在整個複數像素網格上同時迭代 $z \mapsto z^2 + c$。軌道保持有界的點構成曼德博集合 $M$（改變 $c$，從 $z_0 = 0$ 出發）或填充朱利亞集合 $K_c$（固定 $c$，從像素出發）。平滑逃逸計數與由導數得到的距離估計，讓畫面在一路放大到海馬谷時都保持清晰，而朱利亞集合則隨 $c$ 繞主心形線行走而改變形狀。
notes: 為何以 $|z| > 2$ 為逃逸條件：若 $|z| > \max(2, |c|)$，則 $|z^2 + c| \ge |z|^2 - |c| > |z|$，軌道會無界增長。所以每個 $|c| > 2$ 的 $c$ 在第一步就逃逸，而 $M$ 位於圓盤 $|c| \le 2$ 之內。這裡使用較大的逃逸半徑 $R = 1000$，因為它使平滑計數 $\nu = n + 1 - \log_2 \ln|z_n|$ 更準確：在無窮遠附近 $z \mapsto z^2$ 每步使 $\ln|z|$ 加倍，而 $\log_2$ 恰好抵消這一點。主心形線是使 $z^* = z^{*2} + c$ 為吸引不動點（$|2z^*| < 1$）的 $c$ 的集合；令 $2z^* = w$ 得 $c = w/2 - w^2/4$，$|w| \le 1$，而週期 2 球泡是 2 週期軌道為吸引的區域 $|4(1+c)| < 1$。這兩塊覆蓋了 $M$ 總面積 $\approx 1.5066$ 中的約 1.37，其內的像素永遠不會逃逸。距離估計 $d = |z_n|\ln|z_n|/|z'_n|$ 來自位勢 $G(c) = \lim 2^{-n}\ln|z_n|$，即 $G/|\nabla G|$；在集合附近，真實距離與它相差大約不超過 2 倍（Koebe 四分之一定理的推論）。朱利亞面板讓 $c$ 保持在心形線邊緣上，此處不動點為中性：因為 $c \in M$，$K_c$ 在此總是連通的，但其形狀隨角度不同而完全改變。每個朱利亞集合都像 $M$ 在該 $c$ 附近的樣子，這就是為什麼放大 $M$ 時會看到小小的朱利亞集合。比約 $10^{-13}$ 更深的放大需要超過 complex128 的 16 位有效數字。
meanings:
- 每個像素 $p$ 一個複數；不對任何指標求和，每個像素各自運算
- 對所有仍在迭代的像素做二次映射的一步
- 鏈鎖律：對 $M$ 取 $c' = 1$（對 $c$ 的導數），對朱利亞集合取 $c' = 0$ 與 $z'_0 = 1$（對 $z_0$ 的導數）
- 首次 $|z_p| > R$ 的步數；已逃逸的像素從張量中移除，因此工作量逐漸減少
- 平滑（連續）逃逸計數：色帶之間沒有顏色階梯
- 距離估計：$d_p$ 小於四分之一像素的像素畫成深色，從而顯現細絲
- 主心形線的精確判定（週期 2 球泡為 $|c+1| \le \frac14$），其中 $q = (x-\frac14)^2 + y^2$
labels:
  target: 放大目標
  zoom_decades: 放大深度（10 的冪次）
  resolution: 每邊像素數
  max_iter: 起始迭代次數（每十倍 +150）
  frames: 幀數
