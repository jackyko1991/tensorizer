source_hash: 56bd5dd35d76
title: Чтение QR-кода с фотографии
summary: 'Постройте QR-код версии 1–3 с нуля (поисковые, синхронизирующие и выравнивающие узоры, биты формата BCH, маска, выбранная по штрафу, код Рида–Соломона над GF(256)), сфотографируйте его со случайной гомографией, размытием, шумом, неравномерным освещением и пальцем поверх и прочитайте обратно как тензорный конвейер: адаптивный порог, согласованные фильтры для поисковых узоров 1:1:3:1:1, гомография DLT и grid_sample, декодирование BCH и Рида–Соломона с арифметикой $\mathrm{GF}(2^8)$ в виде выборок из таблиц.'
notes: 'Реальные считыватели, такие как ZXing, следуют той же схеме: бинаризация с локальным порогом, сканирование строк в поисках серии 1:1:3:1:1 поискового узора с подтверждением по столбцам и диагоналям, выбор трёх поисковых узоров, образующих прямой угол, оценка размера модуля и версии по их расстоянию, поиск выравнивающего узора рядом с местом, предсказанным аффинной оценкой, подгонка перспективного преобразования, выборка сетки, затем декодирование слоёв формата и Рида–Соломона. Здесь гомография ещё и уточняется максимизацией корреляции известных модулей (поисковые узоры, синхронизация, выравнивание, свободная зона) с изображением через grid_sample, а версия выбирается та, чей шаблон подходит лучше всего. Четыре уровня коррекции ошибок L, M, Q, H восстанавливают примерно 7, 15, 25 и 30 % кодовых слов: при $T$ байтах ECC блок исправляет $\lfloor T/2 \rfloor$ неизвестных ошибок в байтах (вдвое больше, если их позиции известны, как стирания). Пятно, закрывающее долю $f$ символа, задевает
  больше $f$ кодовых слов, потому что каждый байт — блок модулей $2\times4$, поэтому кривые успеха опускаются ниже этих процентов. Маски затрагивают только модули данных и $M \oplus M = 0$, так что снятие маски — тот же XOR; кодировщик пробует все 8 масок одним пакетом и оставляет маску с наименьшим штрафом (серии, блоки $2\times2$, подобия поисковых узоров, баланс тёмного). Проверка: кодировщик Рида–Соломона воспроизводит байты ECC из разобранного примера в ISO/IEC 18004 (''01234567'' как версия 1-M), а слова формата совпадают со стандартной таблицей; остальное проверяется круговыми проходами и нулевыми синдромами. Упрощения: только байтовый режим, версии 1–3 (один выравнивающий узор, без блоков информации о версии), без зеркальных символов, без декодирования стираний. У версии 1 нет выравнивающего узора, поэтому сильная перспектива вредит ей больше всего. Источники: ISO/IEC 18004 (QR code symbology); I. S. Reed and G. Solomon, Polynomial codes over certain finite fields, J. SIAM 8 (1960)
  300–304.'
meanings:
- произведение в GF(256) как две выборки из таблиц; $\alpha = 2$ порождает все 255 ненулевых байтов по модулю $x^8+x^4+x^3+x^2+1$ (0x11D); $\oplus$ — это XOR
- 'XOR по суммируемому индексу $i$: сложение каждой из 8 битовых плоскостей по модулю 2'
- 'систематический код Рида–Соломона: строка $i$ матрицы $G$ равна $x^{T+k-1-i} \bmod g(x)$, так что байты ECC линейны по данным'
- многочлен блока, вычисленный в $\alpha^j$; все нули ровно для кодовых слов
- локатор ошибок по Берлекэмпу–Месси (пакетно с torch.where), корни поиском Ченя по всем позициям, величины $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$ (Форни)
- BCH(15,5) с порождающим 0x537, XOR 0x5412; ближайшее из 32 кодовых слов исправляет до 3 битовых ошибок
- 'тёмный, если пиксель ниже среднего по своему окну $31\times31$ (conv2d) минус $c$: следует за неравномерным освещением'
- согласованный фильтр $K^s$ для профиля 1:1:3:1:1 вдоль строк и столбцов на 11 масштабах $s$; пики — центры поисковых узоров (проверяются также вдоль диагоналей)
- 'DLT/SVD по 3 центрам поисковых узоров + выравнивающему узору (версия 1: угол параллелограмма), затем уточнение градиентным подъёмом по согласию со всеми известными модулями'
- модуль $(i, j)$ считывается в $3\times3$ точках внутри него; затем снятие маски (XOR, инволюция) и чтение в зигзагообразном порядке
labels:
  message: Сообщение
  version: Наименьшая версия (повышается, если сообщение не помещается)
  ecc: Уровень коррекции ошибок
  perspective: Сила перспективы (сдвиг угла / сторона)
  occlusion: Закрытая доля символа
  noise: Пиксельный шум $\sigma$
