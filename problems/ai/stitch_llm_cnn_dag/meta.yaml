title: 'Train apart, stitch by a DAG tensor: a CNN and a tiny LM'
category: ai
level: advanced
order: 6
summary: >
  A small CNN learns MNIST digits and a tiny character-level GPT learns sentences such as "three+two=five.",
  each on its own. One DAG edge then joins them: a connector turns the CNN's features into soft tokens that replace
  the first word, so the LM answers "[image of a 3]+two=" with "five". The whole training process is itself a
  tensor DAG (rules on levels, a max-plus critical path, one batched call per rule over the seeds), and it is compared
  with the same network trained end to end on the joint task alone, with the same compute (multiply-adds). The
  stitching edge is also written as a mixture-of-experts layer with a fixed router, and a learned router is put to
  the test.
animated: true
vector_form: 'X^0 = G_{\mathrm{img}} \odot C\big(\mathrm{CNN}(\mathrm{image})\big) + G_{\mathrm{txt}} \odot \mathrm{Tok}[\mathrm{text}],\qquad z = \mathrm{LM}(X^0 + P),\qquad \ell_r = \max_{s} (A_{\mathrm{rule}})_{rs}(\ell_s + 1),\qquad t = d \oplus (A_{\mathrm{rule}} \otimes t)'
index_form: 'q_{mne} = \mathrm{softmax}_e\,\mathrm{CNN}_m(x_{mn}) \qquad c_{mntc} = \mathrm{GELU}(q_{mne}W^1_{mef} + S_{mtf})\,W^2_{mfc} + b^2_{mc} \qquad X^0_{mntc} = G_{mntx}\,Y^x_{mntc} \qquad \mathcal L_m = -\frac{1}{|\mu_m|}\sum_{n,t}\mu_{mnt}\log \mathrm{softmax}_v z_{mntv}[y_{mnt}]'
