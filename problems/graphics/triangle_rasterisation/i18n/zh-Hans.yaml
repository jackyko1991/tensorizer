source_hash: e60c88b1723d
title: 使用 z 缓冲的三角形光栅化
summary: 游戏绘制三维画面的方式：把三角形网格投影到屏幕上，一次性计算每个（像素, 三角形）对的重心坐标权重。对三角形取最小值归约就是 z 缓冲。同样的权重还驱动平面着色、Gouraud 着色、Phong 着色以及纹理查找。用 $\lambda/z$（透视校正）而不是 $\lambda$（仿射）来插值纹理坐标，才能让棋盘格地板保持笔直。
notes: 重心坐标权重是有向面积：$\lambda_k$ 是角 $k$ 对面的小三角形的面积除以整个三角形的面积，因此三者之和为 1，并且恰好在三角形内部时全为正。这里对每个像素和每个三角形同时计算，是 GPU 在硬件中所做工作的暴力版本。对像素分块可以让 $(P, T, 3)$ 张量保持在几百万个元素以内；真正的光栅化器只访问每个三角形的包围盒。屏幕空间面积的符号还顺便给出了背面剔除：一个封闭网格大约有一半的面背对相机。沿三角形的深度在屏幕上不是线性的，但 $1/z$ 是，所以 z 缓冲测试和每个插值属性都使用权重 $\lambda_k/z_k$。地板只有两个三角形，因此仿射插值（PlayStation 1 风格）会让棋盘格线明显弯曲，而透视校正版本保持笔直。平面着色显示出每个面片。Gouraud 着色在顶点处计算光照再混合亮度，会把高光抹开。Phong 着色混合法线并逐像素计算光照，高光保持锐利。
meanings:
- 网格顶点加上地板的 4 个角点；面 $(T, 3)$ 是对它们的索引
- 重复的 $j$ ⇒ 求和：旋转网格（每帧一个旋转）
- 三角形 $t$ 的角 $k$ 的屏幕位置和深度（针孔相机 $f\,(x, y)/z$）
- $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$ 的一半；$A_t \le 0$ ⇒ 背面，剔除
- 每个像素在每个三角形中的重心坐标权重；按像素分块计算以限制内存
- 重复的 $k$ ⇒ 求和：在屏幕上线性变化的是 $1/z$
- z 缓冲：每个像素最近的覆盖三角形（外部像素为 $+\infty$）
- 纹理坐标、法线、位置和 Gouraud 亮度，以权重 $\lambda/z$ 插值
- 仿射插值：对正对屏幕的三角形是对的，对倾斜的三角形是错的
labels:
  mesh: 网格
  resolution: 图像尺寸
  frames: 每圈帧数
  tilt: 绕 $x$ 轴倾斜
