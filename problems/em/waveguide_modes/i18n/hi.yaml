title: आयताकार तरंगपथक (waveguide) के मोड
summary: खोखले धातु पाइप में कौन-से क्षेत्र पैटर्न आगे बढ़ सकते हैं? हर मोड अनुप्रस्थ काट पर 2D हेल्महोल्ट्ज़ समीकरण $(\partial_i\partial_i + k_c^2)\psi = 0$ का हल है — TM के लिए डिरिक्ले दीवारें, TE के लिए न्यूमान दीवारें। विविक्त लाप्लासियन torch.kron से बनता है और torch.linalg.eigh एक साथ सभी मोड और अंतक (cutoff) आवृत्तियाँ लौटाता है।
notes: डिफ़ॉल्ट आकार मानक WR-90 X-बैंड तरंगपथक (2.286 cm × 1.016 cm) है, जिसका $\text{TE}_{10}$ मोड 6.56 GHz पर कट ऑफ होता है। कोई मोड केवल अपनी अंतक आवृत्ति से ऊपर संचरित होता है, $\beta = \sqrt{(\omega/c)^2 - k_c^2}$ के साथ। समान $(m, n \ge 1)$ वाले TE और TM मोड की अंतक आवृत्ति एक ही होती है। स्थिर TE हल ($k_c = 0$) कोई तरंग नहीं ले जाता और हटा दिया जाता है। डिफ़ॉल्ट विभेदन पर द्वितीय-कोटि परिमित अंतर $k_c$ को सटीक मान के लगभग एक प्रतिशत के भीतर देते हैं।
meanings:
- ग्रिड बिंदु $(x_a, y_b)$ पर $E_z$ (TM) या $H_z$ (TE)
- 'वही मान चपटे करके: $m = a\cdot N_y + b$'
- 1D $\partial^2$, जिसमें दीवार की शर्त कोने की प्रविष्टियों में शामिल है
- 2D लाप्लासियन $\partial_i\partial_i$ ($i$ का योग $x, y$ पर)
- 'आइगेनमान और प्रसामान्य लांबिक आइगेनसदिश: अंतक और मोड आकृतियाँ'
- जाँच के लिए $\pi\sqrt{(m/a)^2 + (n/b)^2}$
labels:
  a: चौड़ाई $a$
  b: ऊँचाई $b$
  n_modes: मोड
  n_grid: $b$ के आर-पार ग्रिड बिंदु
