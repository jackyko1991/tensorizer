title: 광선 전달 행렬로 보는 두 렌즈 계
summary: 근축 광학은 선형대수입니다. 자유 공간과 얇은 렌즈는 (높이, 각도) 광선 벡터에 작용하는 $2\times 2$ 행렬입니다. 계 전체는 광선 배치에 적용되는 연쇄 행렬 곱 하나이며, 두 번째 렌즈가 첫 번째 렌즈에서 멀어짐에 따라 다시 계산됩니다.
notes: 순서가 중요합니다. 빛이 처음 만나는 소자가 가장 오른쪽 인수입니다. 모든 인수의 행렬식이 1이므로 어떤 배치든 $\det M = 1$입니다. 렌즈 1의 중간 상이 정확히 렌즈 2의 초점에 놓일 때($d = sf_1/(s - f_1) + f_2$) 상이 무한대로 달아났다가, 반대편에서 허상으로 돌아오는 것을 지켜보세요.
meanings:
- '광선 $r$: $j = 0$ 높이 $h$, $j = 1$ 각 $\theta$'
- 거리 $d$만큼의 전파 ($d$를 배치로 주면 (..., 2, 2))
- 초점 거리 $f$인 얇은 렌즈
- 계에 소자 하나를 더 연결(반복된 $j$에 대해 합); torch.linalg.multi_dot과 같음
- 물체에서 모든 축 위치 $z$까지의 전달 행렬
- 축약 한 번으로 모든 $z$에서의 모든 광선
- 높이가 발사 각에 더 이상 의존하지 않는 곳
labels:
  s: 물체 거리
  f1: 렌즈 1의 초점 거리
  f2: 렌즈 2의 초점 거리
  d_start: 처음 렌즈 간격
  d_end: 최종 렌즈 간격
  h0: 물체 높이
  half_angle: 광선 다발 반각
  n_rays: 광선 다발의 광선 수
