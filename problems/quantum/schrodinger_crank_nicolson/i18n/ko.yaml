source_hash: d9c269ec5e13
title: '슈뢰딩거 방정식: Crank–Nicolson 시간 진행'
summary: 시간 의존 슈뢰딩거 방정식 $i\,\partial_t\psi = H\psi$ 을 격자 위에서 암시적 Crank–Nicolson 방식 $(I + \tfrac{i\Delta t}{2}H)\,\psi^{n+1} = (I - \tfrac{i\Delta t}{2}H)\,\psi^n$ 으로 진행시킵니다. 왼쪽 행렬은 한 번만 LU 분해하고, 이후 각 단계는 세 파동 묶음($\psi_{xb}$ 의 열들)을 한꺼번에 푸는 값싼 torch.linalg.lu_solve 일 뿐입니다. 이 단계는 정확히 유니터리이므로 노름은 1로 유지되고, 같은 $\Delta t$ 의 명시적 Euler 법은 폭발합니다.
notes: '단위 $\hbar = m = 1$. 작동 원리: $U = (I + \tfrac{i\Delta t}{2}H)^{-1}(I - \tfrac{i\Delta t}{2}H)$ 은 에르미트 행렬 $H$ 의 케일리 변환입니다. 에너지 $E$ 인 고유벡터에는 $(1 - iE\Delta t/2)/(1 + iE\Delta t/2)$ 를 곱하는데, 이는 절댓값이 정확히 1인 수이므로 $U$ 는 어떤 $\Delta t$ 에서도 유니터리입니다: 증가도 감쇠도 없으며, $U$ 가 $H$ 의 함수이므로 $\langle H\rangle$ 도 보존됩니다. 그 위상 $2\arctan(E\Delta t/2)$ 은 정확한 $E\Delta t$ 와 단계당 $\mathcal O(E^3\Delta t^3)$ 만큼만 다르므로 이 방식은 2차 정확도를 가지며, 암시적이므로 어떤 $\Delta t$ 에서도 안정합니다(큰 단계는 덜 정확할 뿐 불안정해지지 않습니다). 명시적 Euler 법은 대신 $1 - iE\Delta t$ 를 곱하며 그 절댓값은 $\sqrt{1 + E^2\Delta t^2} > 1$ 입니다; $E \sim 2/dx^2$ 인 경직된 격자 모드가 수십 단계 안에 폭발합니다(빨간 곡선). 세 파동 묶음은 진폭이 다릅니다; 더 단단한 $g\,x^4$ 용수철 때문에 큰 묶음이 더 빨리 진동하고, 에너지 준위가 더 이상 등간격이 아니어서 위상이 어긋나 퍼지고 모양을 잃습니다. 반면 작은 묶음은 비조화성을 거의 느끼지 않습니다. $g = 0$ 을 시도해 보세요: 셋 모두 주기 $2\pi$ 로 함께 진동하며 결코 퍼지지 않습니다(결맞음 상태). 양자 터널링의 분할 단계 FFT(또 하나의 유니터리 2차 방식)와 비교해 보세요.'
meanings:
- '비조화 우물 $\tfrac12x^2 + g\,x^4$: 진동 주기가 진폭에 따라 달라짐'
- 운동 에너지 $-\tfrac12\,D2$ 에 대각선의 $V$ 을 더함; 상자 가장자리는 벽
- 열 $b$ 마다 가우스 묶음 하나, $x_{0,b}$ 에서 정지 상태로 놓음
- $I \pm \tfrac{i\Delta t}{2}H$, 반복문 전에 한 번만 만듦
- 한 번만 분해($\mathcal O(N^3)$); 이후 각 단계는 $\mathcal O(N^2)$ 만 듦
- '반복된 $y$ ⇒ 합: 우변을 만든 뒤 모든 열에 대해 삼각 풀이 두 번'
- '비교용 명시적 Euler 법: 각 고유 성분이 단계마다 $\sqrt{1 + E^2\Delta t^2}$ 배로 커짐'
- '반복된 $x, y$ ⇒ 합: 각 묶음의 에너지, 정확히 보존됨'
labels:
  g: 4차 항 세기 $g$
  x0: 가장 큰 시작 위치 $x_0$
  t_max: 시뮬레이션 시간
  dt: 시간 간격 $\Delta t$
  n_grid: 격자점 수
