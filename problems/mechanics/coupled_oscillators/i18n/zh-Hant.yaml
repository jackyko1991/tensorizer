source_hash: ea8025a41e84
title: 耦合振子與簡正模態
summary: $N$ 個相同質量以彈簧相連，夾在兩面固定牆之間。彈簧構成一個剛度張量 $K_{ij}$，其特徵向量即簡正模態，運動則是以一次 einsum 求和的模態疊加。
notes: 因為 $K_{ij}$ 對稱，eigh 給出實數頻率與正交歸一模態，所以任何運動都是獨立餘弦函數之和，不需要時間步進。從單一模態出發，鏈會永遠保持該形狀；撥動一個質量，能量便沿著鏈來回傳遞。解析頻率為 $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$。
meanings:
- 質量 $i$ 偏離平衡位置的位移
- 剛度張量：對角線為 $2k$，相鄰為 $-k$
- 重複的 $j$ ⇒ 求和：質量 $i$ 所受的彈簧淨力
- 特徵值與特徵向量（第 $n$ 行）= 簡正模態
- 重複的 $i$ ⇒ 求和：把初始狀態投影到各模態
- 重複的 $n$ ⇒ 求和：模態疊加
labels:
  n_masses: 質量數
  k: 彈簧常數
  m: 質量
  start: 初始位移
  amplitude: 初始振幅
  t_max: 模擬時間
