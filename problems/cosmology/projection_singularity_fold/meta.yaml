title: 'Singularities as folds of a projection'
category: cosmology
level: advanced
order: 16
tags: [series:projection-hypothesis:4, role:theory, speculative]
summary: >
  A speculative hypothesis, not established physics: curved spacetime is the shadow of a surface in flat
  higher-dimensional space, and a singularity is where that shadow folds. The known geometry is checked first.
  Flamm's paraboloid and Fronsdal's 1959 embedding of the whole Schwarzschild spacetime in six flat dimensions give
  back the metric exactly (autograd), and the Kretschmann scalar $12r_s^2/r^6$ comes out of the same automatic
  differentiation. Projected sheets fold with universal density exponents: $-1/2$ for a fold, $-2/3$ for a cusp. A
  fold-shaped interior leaves the exterior exactly Schwarzschild, so it hides behind the horizon. Nothing here can
  be observed directly.
animated: true
vector_form: 'g_{ij} = \eta_{AB}\,\frac{\partial z^A}{\partial x^i}\frac{\partial z^B}{\partial x^j},\qquad z_{\rm Flamm} = 2\sqrt{r_s(r-r_s)},\qquad z^{0,1}_{\rm Fronsdal} = 2r_s\sqrt{1-\tfrac{r_s}{r}}\,\big(\sinh,\cosh\big)\tfrac{t}{2r_s},\quad z^2 = \int\!\sqrt{\tfrac{r_s}{r}\big(1+\tfrac{r_s}{r}+\tfrac{r_s^2}{r^2}\big)}\,dr,\qquad K = R_{abcd}R^{abcd} = \frac{12\,r_s^2}{r^6},\qquad \rho(x) = \sum_{s:\,x(s)=x}\frac{1}{|x^\prime(s)|} \propto |x|^{1/n-1},\qquad \rho_{S^k\to\mathbb R^d}(u)\propto u^{(k-d-1)/2}'
index_form: 'g_{bij} = J_{bAi}\,\eta_{AC}\,J_{bCj},\qquad \Gamma^a{}_{bc} = \tfrac12 g^{ad}\big(\partial_b g_{dc} + \partial_c g_{db} - \partial_d g_{bc}\big),\qquad R^a{}_{bcd} = \partial_c\Gamma^a{}_{db} - \partial_d\Gamma^a{}_{cb} + \Gamma^a{}_{ce}\Gamma^e{}_{db} - \Gamma^a{}_{de}\Gamma^e{}_{cb},\qquad K = g_{ae}R^e{}_{bcd}\,g^{bf}g^{cg}g^{dh}R^a{}_{fgh},\qquad z^2(r) = \tfrac{\ell_1-\ell_0}{2}\,w_q\sqrt{h(e^{\ell_q})}\,e^{\ell_q}'
