source_hash: efa79cfa67ef
title: 'MNIST에서의 연산자 탐색: 텐서 DAG가 스스로 분류 방정식을 쓴다'
summary: 학습 이미지가 몇 장뿐일 때, DAG로 연결된 몇 개의 읽기 쉬운 텐서 연산자가 CNN과 경쟁할 수 있을까? 작은 DAG의 모든 에지는 23개 후보 연산자(Sobel, 라플라시안, Gabor, 학습되는 3×3 필터, ReLU, $x^2$, 풀링, 행 합, FFT 크기, 클래스 템플릿, PCA, 모멘트, 선형 및 프로토타입 판독)의 softmax 가중 혼합을 담고 있다. 숫자당 1~100장의 이미지로 DARTS 탐색을 수행해 에지마다 연산자 하나를 고르고, DAG는 그 예측을 정확히 재현하는 LaTeX 방정식으로 출력된다. 이어서 LeNet 스타일 CNN 및 두 가지 닫힌 형식 기준 방법과 데이터·계산량을 비교하며, 모든 시드를 보여 준다.
notes: '질문. 이 장난감 문제는 Jacky Ka Long Ko의 것으로, 화이트박스 방정식 작성을 곁들인 소규모 배치 AI 학습의 시도다. MNIST에서 CNN 대 텐서 방법; 후보 텐서 연산자를 나열하고; DAG를 인코딩하는 텐서가 최적의 연산자와 그 연결을 찾게 하며; 작은 배치로 학습해 같은 정확도에 각각 필요한 데이터와 계산량을 비교하고; 찾은 DAG의 분류 방정식을 쓴다. 방법. 이미지는 14×14이다(MNIST를 2×2 블록으로 평균했으므로 30회 실행이 CPU 약 1분 안에 들어간다). 슈퍼넷은 DARTS 셀(Liu, Simonyan, Yang 2019)로, 세 노드 $z_1, z_2, z_3$에 앞선 모든 노드가 6개 에지를 통해 입력되며, 각 에지는 12개 셀 연산자(영, 항등, $x^2$, $|x|$, ReLU, tanh, 소프트 임계값 $S_\lambda$, 학습되는 $3\times 3$ 필터, Sobel-$x$, Sobel-$y$, 라플라시안, Gabor)의 혼합이다. 그다음 풀링 에지(평균 또는 최대 $2\times 2$), 축소 에지(vec, 행 합, 열 합, 저주파 FFT 크기, 클래스 템플릿 상관, PCA 투영, 이미지 모멘트), 헤드 에지(선형 판독 또는 10개 프로토타입)가 이어진다. 아키텍처는 텐서 $\alpha$(9 에지 × 23 연산자)이며 타입 규칙을 위한 마스크가 있다. 탐색: 1차 DARTS로, 학습 절반의 미니배치에서 $\theta$ 스텝과 검증 절반에서 $\alpha$ 스텝을 번갈아 수행하며, softmax 온도를 1에서 0.001로 어닐링한다. DAG는 모든 에지의 argmax 연산자를 유지하고(영은 에지를 제거한다), 학습된 $\theta$를 물려받아 짧게 미세 조정하며, 검증 성능이 가장 좋은 스텝을 보존한다. DARTS와 다른 점은 중요하므로 밝혀 둔다: 어닐링(SNAS와 GDAS에서처럼)과 argmax 규칙은 첫 시도에서 정확도를 최대 25포인트 잃게 했던 이산화 격차를 메운다; 이미지는 셀 출력의 네
  번째 채널로 유지된다; 헤드는 각자의 특징 공간에서 최근접 클래스 평균에서 시작한다. CNN($3\times 3$의 8채널과 16채널, 최대 풀링, 선형 층: 가중치 2698개)은 같은 이미지에서 같은 조기 종료로 Adam을 사용해 학습한다. 기준 방법에는 학습되는 매개변수가 없다: 픽셀 공간의 최근접 클래스 평균, 그리고 PCA 후 수축 LDA. 결과. 테스트는 모든 연산자가 작은 입력에서 자신의 공식과 같은지, one-hot 혼합이 단일 연산자이고 one-hot 슈퍼넷이 이산 DAG인지, 이산화가 argmax를 고르는지, 작성된 방정식을 LaTeX만으로 다시 읽었을 때 DAG의 예측을 정확히 내는지, 그리고 기준 방법이 닫힌 형식과 일치하는지 확인한다. 동봉된 실행(CPU, 스레드 1개, 시드 3개), 숫자당 이미지 $n$ = 1, 5, 10, 50, 100에 대한 평균 테스트 정확도: CNN 0.35, 0.53, 0.64, 0.81, 0.85; 탐색된 DAG 0.38, 0.48, 0.52, 0.69, 0.82; PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76; 최근접 클래스 평균 0.41, 0.56, 0.64, 0.68, 0.69. 70 %에 도달하는 데 필요한 숫자당 이미지: CNN 18, DAG 52, PCA + LDA 20; 80 %에 도달하려면: CNN 45, DAG 91. 실행당 학습 시간: CNN 0.4~1 s, 탐색과 미세 조정 2~4 s. 그러니 솔직히 말하면: 숫자당 이미지 약 10장부터는 CNN이 같은 정확도에 더 적은 데이터와 더 적은 계산을 필요로 한다; 그보다 적으면 닫힌 형식 기준 방법이 가장 좋고 어떤 학습기도 이를 이기지 못한다; 구조화된 모델은 아주 작은 $n$에서 이기지 못했다($n$ = 1에서 클래스 평균과 동률). 이유: 탐색은 그 자체로 아주 작은 검증 분할에서 실행되므로 선택이 잡음에 휘둘리고, 검증 손실은 종종 행 합(특징 28개, 학습되는 수 290개, 더 안정적인 손실)을 선호하는데, 이는
  모든 픽셀(학습되는 수 약 2000개)보다 분류 성능이 나쁘다; 15개 DAG 중 7개가 행 합을 택했다. DARTS에서 보고된 것처럼 탐색은 매개변수 없는 연산자를 선호한다: Sobel 필터가 대부분의 에지를 채우고, 학습되는 필터는 15개 DAG 중 3개에만 나타난다. 동봉된 실행 밖에서, 더 짧은 탐색(20 또는 40 스텝)은 모든 픽셀을 택했고 $n$ = 50에서 0.74~0.79에 도달했다. 이는 더 긴 탐색이 지나치게 한쪽으로 쏠린다는 힌트다; 이는 테스트 세트에서 본 것이므로 관찰일 뿐 조정된 설정이 아니다. GPU(GTX 1080 Ti)는 속도 향상을 주지 못했다: 시간을 정하는 것은 산술이 아니라 수천 개의 작은 커널이다. results/stages.csv에 모든 수치가, results/equation.tex에 찾은 모든 방정식이 있다. 관련 연구. 신경 아키텍처 탐색(Zoph와 Le 2017)과 그 미분 가능한 형태인 DARTS; 네트워크 대신 공식을 탐색하는 기호 회귀(AI Feynman, Udrescu와 Tegmark 2020; PySR, Cranmer 2023; 유전 프로그래밍, Koza 1992); CNN에 대해서는 LeNet(LeCun et al. 1998). 데이터: MNIST(LeCun, Cortes, Burges), 라이선스 CC BY-SA 3.0; data/mnist_subset.npz에는 학습 풀 이미지 1000장과 테스트 이미지 2000장이 들어 있다(동일조건변경허락 라이선스가 이 부분집합에 적용된다). data/SOURCES.md를 참조. 해 보기. show_n을 바꿔 숫자당 이미지 1장 또는 100장으로 찾은 DAG를 보거나, 탐색 스텝을 늘리거나, 빠른 실행을 위해 시드를 하나로 하라.'
meanings:
- '타입 규칙: 연산자 $o$는 그 에지의 입력 형태를 출력 형태로 사상할 때만 에지 $e$에 놓일 수 있다(셀: 맵 → 맵, 풀링, 축소: 맵 → 벡터, 헤드: 벡터 → 로짓)'
- 아키텍처 텐서 $\alpha$(에지 × 연산자)의 마스크된 softmax; 온도 $T$가 1에서 0.001로 떨어져 혼합은 결국 one-hot이 된다
- '노드가 공급하는 모든 연산자를 나가는 모든 에지에 대해 한 번만 계산한다: 한 번의 합성곱이 Sobel-$x$, Sobel-$y$, 라플라시안, Gabor, 학습되는 $3\times 3$ 필터 $K_e$를 준다'
- '반복된 $o$ ⇒ 합산: 각 노드는 혼합된 입력 에지들의 합이다; 셀 출력은 스택 $(x, z_1, z_2, z_3)$이다'
- 축소 $r$의 특징(vec, 행/열 합, $|\mathcal F|$, 템플릿 $\langle z, \mu_k\rangle$, PCA $U^\top \mathrm{vec}$, 모멘트), 학습 이미지로 표준화됨
- 모든 축소 × 헤드를 로짓 수준에서 혼합한다(특징 길이가 서로 다르므로); 선형 $W\hat f + b$ 또는 프로토타입 $-e^\tau\lVert \hat f - p_k\rVert^2/D$, 둘 다 최근접 클래스 평균에서 시작한다
- '1차 DARTS: 학습 미니배치에서 $\theta$ 스텝, 이어서 검증 미니배치에서 $\alpha$ 스텝'
- 'LaTeX로 작성된 이산 DAG를 작은 파서로 다시 읽어 평가한다: DAG와 정확히 같은 예측'
labels:
  search_steps: DARTS 탐색 스텝(각각 $\theta$와 $\alpha$ 갱신 1회)
  retrain_steps: 이산 DAG의 미세 조정 스텝
  cnn_steps: CNN 학습 스텝
  seeds: 학습 세트 크기당 시드 수
  batch: 미니배치 크기(숫자별 균형)
  show_n: 표시되는 DAG의 숫자당 학습 이미지 수
