source_hash: 9483d7c492cb
title: 은하 회전 곡선과 암흑물질
summary: '은하 중심에서 먼 별과 가스는 너무 빨리 돈다: SPARC 데이터베이스의 실제 회전 곡선은 보이는 질량이 케플러식 감소를 예측하는 곳에서도 평평하게 유지된다. 모든 은하를 한꺼번에 다루는 한 번의 묶음 autograd 맞춤으로 네 가지 설명을 비교한다: 바리온만(질량-광도비 $\Upsilon$ 포함), 바리온과 NFW 암흑물질 헤일로, 바리온과 중심핵이 있는 Burkert 헤일로, 그리고 단일 가속도 $a_0$ 를 쓰는 MOND(반경 가속도 관계). 암흑물질은 중력으로부터 추론된 것이며 직접 검출되지 않았다.'
notes: '데이터: SPARC(Lelli, McGaugh, Schombert 2016, AJ 152, 157)의 은하 6개(NGC 3198, NGC 2403, NGC 6503, DDO 154, UGC 2885, NGC 7814), 파일 Rotmod_LTG 를 그대로 data/sparc_rotation_curves.csv 에 복사. 출처 http://astroweb.cwru.edu/SPARC/ 는 SPARC 논문 인용을 요청한다; Zenodo 미러(doi:10.5281/zenodo.16284118)는 CC-BY-4.0 으로 공개되어 있다. 3.6 μm 질량-광도비에는 $\Upsilon_d = 0.5$, $\Upsilon_b = 0.7$ 을 중심으로 폭 0.1 dex 의 사전분포를 둔다(0 으로 두면 끔). 맞춤 결과: 어떤 합리적인 $\Upsilon$ 로도 바리온은 바깥쪽의 평평한 속도에 닿지 못한다(DDO 154 는 $\Upsilon_d \approx 19$ 가 필요한데, 이는 어떤 별 집단보다도 훨씬 크다). 따라서 보이지 않는 질량이나 수정된 역학이 필요하며, 이는 Rubin 과 Ford 가 1970년대에 광학 스펙트럼으로 발견한 것이다. 두 헤일로 모양 모두 잘 맞고, 왜소은하 DDO 154 는 중심핵을 선호한다(첨점-중심핵 문제). 단 하나의 $a_0 \approx 1.1\times10^{-10}$ m/s² 가 놀랍도록 잘 모든 은하를 설명하며, 이것이 반경 가속도 관계가 말하는 바이다. 정직한 현황: 암흑물질은 그 중력으로부터 추론된다(회전 곡선, 중력 렌즈, 은하단, CMB, 구조 형성); 암흑물질 입자는 직접 검출되지 않았다. MOND 는 매개변수 하나로 회전 곡선을 잘 맞추지만 은하단, 총알 은하단, CMB 음향 봉우리에서 어려움을 겪고, 널리 받아들여진 상대론적 형태도 없다. 여기서 거리와 기울기는 고정되어 있고(오차는 전파하지 않음), MOND 는 가장 간단한 대수적 형태로 쓴다.'
meanings:
- 은하 $g$ 의 반지름 $r$ 에서 관측된 속도와 오차, 가장 긴 곡선에 맞춰 채움
- 실제 데이터 점(1) 또는 채움(0)
- 속도 제곱이 더해짐; $\Upsilon$ 는 SPARC 원반과 팽대부($\Upsilon = 1$ 로 계산)를 비율 조정
- 차가운 암흑물질 시뮬레이션의 첨점 헤일로, $\rho \propto 1/(x(1+x)^2)$
- 중심핵 헤일로, $\rho \propto 1/((1+x)(1+x^2))$
- 모든 은하에 하나의 함수와 하나의 $a_0$; 헤일로 없음
- 반복된 $r$ ⇒ 각 은하의 실제 데이터 점에 대해 합
- '모든 모형과 은하에 대한 스칼라 하나: 역전파 한 번으로 모든 기울기를 얻음(Adam 다음 L-BFGS)'
labels:
  iterations: L-BFGS 전 Adam 반복 횟수
  lr: Adam 학습률
  prior_dex: $\Upsilon$ 사전분포의 폭(dex, 0 = 없음)
