source_hash: e6424f8df209
title: CFD, ускоренная машинным обучением
summary: Обычный конечно-объёмный решатель на сетке в 16 раз грубее эталонной размазывает ударные волны вязкого уравнения Бюргерса. Крошечная CNN обучается поправке к потокам через грани, обучаясь обратным распространением через развёрнутую грубую симуляцию. На начальных условиях, которых она никогда не видела, обученный решатель следует точному решению в несколько раз ближе при том же грубом разрешении, точно сохраняя $\int u\,dx$.
notes: 'Единицы: область $[0, 2\pi)$, периодическая. Эталон — та же конечно-объёмная схема на 512 ячейках с шагами по времени методом Хойна, разбитыми на подшаги для устойчивости. Для обучения используются 32 случайные гладкие волны, а для теста — 8 других с другим зерном, прогоняемые на 50% дольше ($t = 3$), чем обучающие данные. На каждом шаге Adam обученный решатель стартует из истинного грубого состояния в случайные моменты, делает $S$ шагов и штрафуется за отклонение от усреднённого эталона. Градиенты проходят назад через каждый шаг по времени, поэтому сеть учится поправкам, которые остаются хорошими, когда ей подают её собственный выход. Два конструктивных решения сохраняют честность: $\delta F$ входит как поток, поэтому $\sum_i u_i$ сохраняется с точностью до округления, а последний слой инициализируется нулём, так что обучение начинается с обычного решателя. Идея следует Bar-Sinai, Hoyer, Hickey & Brenner (PNAS, 2019), которые обучали управляемые данными дискретизации именно такого
  типа уравнений, и Kochkov, Smith, Alieva, Wang, Brenner & Hoyer (PNAS, 2021). Они обучали коэффициенты интерполяции внутри двумерного решателя Навье–Стокса и сообщили о сетках в 8–10 раз грубее при той же точности, примерно в 40–80 раз быстрее. Эта модель показывает механизм, а не такие ускорения. Обученная поправка может отказать на входах, далёких от обучающих данных. Попробуйте обучать меньше шагов, укоротить развёртку или взять вязкость, на которой сеть не обучалась.'
meanings:
- среднее по ячейке в грубой ячейке $i$ для траектории $b$ (периодически)
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$, $\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$; $u_{i+1}$ — это roll(u, -1)
- что вытекает из одной ячейки, втекает в следующую ⇒ $\sum_i u_i$ сохраняется
- 'повторяющийся $k$ ⇒ суммирование: 5-точечный шаблон, периодическое дополнение'
- обученная поправка к потоку из трёх свёрток (ноль в начале)
- точное решение, усреднённое по $f = N_f/N_c$ мелким ячейкам в каждой грубой ячейке
- autograd через все $S$ развёрнутых шагов решателя по времени
labels:
  nu: Вязкость $\nu$
  n_coarse: Грубые ячейки $N_c$
  train_iters: Шаги обучения
  unroll: Развёрнутые шаги $S$
