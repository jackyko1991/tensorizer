source_hash: 63ee714594c5
title: 버거스 방정식과 충격파 형성
summary: '가장 간단한 비선형 유체 방정식: 파동의 빠른 부분이 느린 부분을 따라잡아 파형이 가팔라지고, $t^* = 1/\max(-u_0'')$ 부근에서 충격파가 생기며 점성이 이를 얇지만 매끄럽게 유지합니다. 미분은 $N\times N$ 행렬이므로 편미분 방정식의 각 항이 einsum 하나이며, 정확한 콜–호프 해와 비교해 검증합니다.'
notes: $u\,u_x$를 $(\tfrac12u^2)_x$(보존형)로 쓰면 기법이 $\int u\,dx$를 정확히 보존합니다. 점성이 없으면 특성선 $x = x_0 + u_0(x_0)\,t$가 $t^* = 1/\max(-u_0')$에서 교차해 해가 다가 함수가 되지만, 점성이 있으면 대신 폭 $\sim\nu/\Delta u$의 충격파가 생깁니다. 중심 차분은 $|u|\Delta x/\nu \lesssim 2$를 요구하므로 512개 점에서는 $\nu$를 너무 작게 할 수 없습니다. 콜–호프 변환 $u = -2\nu\,\partial_x\ln\varphi$는 버거스 방정식을 열 방정식으로 바꾸어 정확한 점선 곡선을 줍니다. 0이 아닌 오프셋 $U_0$을 주면 충격파가 이동합니다.
meanings:
- 격자점 $x_i$에서의 속도(주기적)
- 행렬로 쓴 중심 차분 $(f_{i+1} - f_{i-1})/2\Delta x$
- 2계 차분 $(f_{i+1} - 2f_i + f_{i-1})/\Delta x^2$
- '반복된 $j$ ⇒ 합: 선속 $\tfrac12 u^2$의 미분'
- 점성 항
- '보존량: $D$와 $L$의 각 열의 합은 0'
- 정확한 해, 출발점들에 대한 softmax 가중 평균
labels:
  nu: 점성 $\nu$
  amplitude: $u_0 = U_0 + A\sin x$의 진폭 $A$
  offset: 오프셋 $U_0$
  t_max: 시뮬레이션 시간
