source_hash: 15137dcd8bb9
title: Кинетика полимеризации и молекулярно-массовые распределения
summary: Почему ступенчатые полимеры (полиэфиры, найлоны) так полидисперсны, а живая полимеризация даёт почти одинаковые цепи? Уравнение баланса популяций по длинам цепей — один тензор $(S, L)$ для обоих механизмов — воспроизводит формулу Карозерса $X_n = 1/(1-p)$ и наиболее вероятное распределение Флори $w(x) = x(1-p)^2p^{x-1}$ с дисперсностью $Đ \to 2$, сверенные с кинетическим методом Монте-Карло для 100 000 мономеров, а также пуассоновское распределение живых цепей с $Đ \approx 1 + 1/X_n$.
notes: 'Ступенчатый рост: каждая молекула несёт реакционноспособные концы (здесь один A и один B, как у гидроксикислоты), и соединиться могут ЛЮБЫЕ две цепи — мономер с мономером, димер с 50-мером. Допущение Флори о равной реакционной способности (скорость не зависит от длины цепи) превращает баланс популяций в уравнение коагуляции Смолуховского с постоянным ядром, точное решение которого — наиболее вероятное распределение: прореагировала доля $p$ концов, так что цепь длины $x$ — это серия из $x - 1$ прореагировавших связей, завершённая непрореагировавшей, с вероятностью $(1-p)p^{x-1}$. Её средние — формулы Карозерса $X_n = 1/(1-p)$ и $X_w = (1+p)/(1-p)$, так что $Đ = 1 + p \to 2$. Практический урок суров: конверсия 98 % даёт лишь $X_n = 50$, а для длинных цепей нужны $p > 0.99$ и идеальный баланс 1:1 реакционноспособных групп. Живой цепной рост (анионный или методы контролируемой радикальной полимеризации, такие как ATRP или RAFT, которые его приближают) — противоположность: все цепи стартуют
  одновременно и растут по одному мономеру без обрыва, так что после $\nu$ присоединений на цепь длины распределены по Пуассону и $Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ стремится к 1. Тензорная форма держит оба механизма в одном тензоре $(S, L)$, продвигаемом RK4. Свёртка ступенчатого роста $\sum_y P_y P_{x-y}$ — это einsum с тёплицевой матрицей, собранной из $P$ (БПФ сделало бы то же за $O(L\log L)$). Поскольку две строки используют часы с $X_n = 1 + s$, каждый кадр сравнивает два механизма при одном и том же $X_n$, на оси $x / X_n$, где форма Флори неизменна, а пик Пуассона сужается. Кинетический Монте-Карло соединяет случайные пары цепей; он согласуется с балансом популяций с точностью до шума выборки, который растёт к концу, потому что остаётся лишь $N_0(1-p)$ цепей (2000 при $p = 0.98$). Упрощения: нет образования циклов, нет побочных реакций, идеально сбалансированная стехиометрия A–B, длины цепей обрезаны на $L$ (отброшенный хвост меньше $10^{-6}$), а для живого случая — мгновенное
  инициирование без обрыва и передачи цепи. Обычная свободнорадикальная полимеризация, с обрывом, находится посередине ($Đ \approx 1.5$–2).'
meanings:
- 'цепи длины $x$ ($x = 1 … L$) для механизма $s$: 0 = ступенчатый рост (на мономер), 1 = живой рост (на инициатор)'
- 'одни часы для обеих строк: $\tau = kN_0t$ для ступенчатого роста, $\nu = \int k_p[M]\,dt$ для живого роста'
- тёплицева матрица, собранная из популяций; ноль там, где $x - y < 1$
- 'повторяющийся $y$ ⇒ суммирование: все способы соединить $y$-мер с $(x-y)$-мером'
- цепь реагирует любым из двух своих концов с любой из $N$ цепей
- живые цепи только присоединяют мономер, по одному звену за раз, и никогда не обрываются
- 'суммирование по $x$: моменты $k = 0, 1, 2$ дают $X_n = \mu_1/\mu_0$, $X_w = \mu_2/\mu_1$'
- 'точное решение для ступенчатого роста: цепи на исходный мономер при конверсии $p = \tau/(1+\tau)$'
- точное решение для живого роста, с lgamma для факториала
- 'соединение двух случайных цепей по одной связи за раз: независимая стохастическая проверка'
labels:
  p_max: Конечная конверсия $p$ (ступенчатый рост)
  n_monomers: Мономеры в Монте-Карло $N_0$
