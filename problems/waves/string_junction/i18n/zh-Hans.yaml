source_hash: 162fb2c64168
title: 弦连接处的脉冲
summary: 两根线密度不同的弦连在一起。从左边传来的脉冲在结点处分裂为反射脉冲和透射脉冲，其振幅由波阻抗 $Z = \sqrt{T\mu}$ 决定。二阶导数是与模板 $(1, -2, 1)$ 的一维卷积。
notes: 结点不会断开，所以 $u$ 连续；结点无质量，所以两侧的横向力 $T u_x$ 平衡。这两个条件给出 $R$ 和 $\mathcal T$。右侧弦较重（$Z_2 > Z_1$）时，脉冲倒相反射，如同固定端；较轻时正相反射，如同自由端。透射脉冲总是正立的，并以 $c_2 = \sqrt{T/\mu_2}$ 传播，因此按 $c_2/c_1$ 被压缩或拉伸。脉冲携带的能量正比于 $Z\,A^2$，由此得到能流平衡 $R^2 + (Z_2/Z_1)\,\mathcal T^2 = 1$。单位：$T = 1$，$\mu_1 = 1$，弦从 $-1$ 延伸到 $1$。灰色虚线标出预言的振幅。注意观察较快的弦：其脉冲到达远端墙壁后弹回。
meanings:
- 格点 $i$ 处的位移；两个远端都固定
- 线密度：左边 $\mu_1$，右边 $\mu_2$，结点处取平均
- 重复的 $j$ ⇒ 求和：模板沿弦滑动
- 弦 $k$ 的波阻抗
- 由结点处 $u$ 和力 $T\,u_x$ 的连续性得到的振幅比
- $\sum_i \tfrac12\mu_i\dot u_i^2\Delta x + \tfrac12 T (\partial_x u)^2\Delta x$，守恒
labels:
  mu_ratio: 线密度比 $\mu_2/\mu_1$
  width: 脉冲宽度
  t_max: 模拟时长
  n_points: 格点数
