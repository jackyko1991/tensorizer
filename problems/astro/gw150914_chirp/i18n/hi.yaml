title: 'GW150914: पहला गुरुत्वीय-तरंग चर्प'
summary: 14 सितंबर 2015 को हैनफ़र्ड और लिविंगस्टन से प्राप्त वास्तविक LIGO स्ट्रेन के सोलह सेकंड। वेल्च (Welch) PSD, व्हाइटनिंग और बैंड-पास फ़िल्टर सौ गुना तेज़ शोर के नीचे दबे चर्प को उभार देते हैं। Q-ट्रांसफ़ॉर्म मानचित्र दिखाता है कि उसकी आवृत्ति लगभग 150 Hz तक बढ़ती है, और एक ही बैच में फ़िल्टर किया गया पोस्ट-न्यूटोनियन इंस्पाइरल टेम्पलेट बैंक लगभग $30\,M_\odot$ के चर्प द्रव्यमान पर शिखर देता है। रिज (ridge) को autograd द्वारा $\dot f \propto M_c^{5/3} f^{11/3}$ के अनुसार फ़िट किया जाता है, और लिविंगस्टन का सिग्नल हैनफ़र्ड से लगभग 7 ms पहले आता है।
notes: '14 सितंबर 2015 को 09:50:45 UTC पर दोनों Advanced LIGO डिटेक्टरों ने लगभग 410 Mpc दूर दो ब्लैक होल के विलय को रिकॉर्ड किया (Abbott et al., PRL 116, 061102, 2016) — गुरुत्वीय तरंगों का पहला प्रत्यक्ष संसूचन। यह पृष्ठ खुले डेटा पर उस विश्लेषण का एक सरलीकृत संस्करण दोहराता है। 30 Hz से नीचे कच्चे स्ट्रेन पर भूकंपीय और ऊष्मीय शोर हावी रहता है, इसलिए PSD $S_n(f)$ का अनुमान वेल्च विधि (4 s के Hann-विंडो खंड, 50 % ओवरलैप) से लगाया जाता है और डेटा को $\sqrt{S_n}$ से विभाजित किया जाता है (व्हाइटनिंग); पृष्ठ जाँचता है कि व्हाइटन किया गया PSD समतल है, पार्सेवल प्रमेय लागू होता है और हर टेम्पलेट के लिए $\langle h|h\rangle = 1$ है। टेम्पलेट बैंक समान द्रव्यमानों के लिए 2PN कला वाला स्थिर-कला (stationary-phase) इंस्पाइरल प्रयोग करता है, जिसे $f_\mathrm{peak} = 0.36/(2\pi M)$ पर काटा जाता है — वह आवृत्ति जिस पर संख्यात्मक सापेक्षता में समान-द्रव्यमान विलय शिखर पर पहुँचता है (ISCO आवृत्ति पर काटने से अधिकांश SNR खो जाता है)। सभी टेम्पलेट और दोनों डिटेक्टर FFT के एक ही बैच में फ़िल्टर किए जाते हैं।
  डिफ़ॉल्ट मानों के साथ सर्वश्रेष्ठ टेम्पलेट का $\mathcal M_c \approx 32\,M_\odot$ है, SNR लगभग 16 (H1) और 10 (L1) है, और दोनों SNR शिखर तथा H1–(−L1) क्रॉस-कोरिलेशन हैनफ़र्ड को लिविंगस्टन से 7–8 ms बाद रखते हैं (प्रकाशित: 6.9 +0.5/−0.4 ms; L1 की भुजाओं का अभिविन्यास चिह्न उलट देता है)। Q-मानचित्र के रिज पर न्यूटोनियन फ़िट भारी $\mathcal M_c \approx 37\,M_\odot$ देता है, और 0PN बैंक भी यही देता है: पोस्ट-न्यूटोनियन पद किसी दिए गए चर्प द्रव्यमान पर चर्प को धीमा करते हैं, इसलिए न्यूटोनियन मॉडल उसे भारी पढ़ता है। ईमानदारी / सावधानी: यह एक शिक्षण विश्लेषण है, प्रकाशित विश्लेषण नहीं। प्रकाशित मान स्पिन सहित पूर्ण इंस्पाइरल–विलय–रिंगडाउन तरंगरूपों, कहीं अधिक लंबे डेटा से प्राप्त PSD और बेज़ियन प्राचल आकलन से आते हैं: डिटेक्टर-फ़्रेम $\mathcal M_c \approx 30\,M_\odot$ और नेटवर्क SNR 24 (Abbott et al. 2016), GWTC-1 में स्रोत-फ़्रेम $\mathcal M_c = 28.6^{+1.7}_{-1.5}\,M_\odot$, द्रव्यमान $35.6$ और $30.6\,M_\odot$, दूरी 440 Mpc। हमारे SNR कम हैं क्योंकि टेम्पलेट में विलय–रिंगडाउन और स्पिन नहीं हैं,
  और क्योंकि PSD केवल 16 s के डेटा से आता है जिसमें सिग्नल भी शामिल है। डेटा: GWOSC (Gravitational Wave Open Science Center), GW150914 रिलीज़ GWTC-1-confident v3, फ़ाइलें H-H1_GWOSC_4KHZ_R1-1126259447-32 और उसकी L1 समकक्ष, gwosc.org/eventapi/json/GWTC-1-confident/GW150914/v3/ से, CC BY 4.0; GPS 1126259455 से 16 s, 900 Hz पर लो-पास और 2048 Hz तक डेसीमेट करके, स्ट्रेन × 10⁻²¹ के रूप में data/gw150914_strain.csv में सहेजा गया। कृपया GWOSC (Abbott et al., SoftwareX 13, 100658, 2021) और Abbott et al. 2016 का उद्धरण दें। पुरस्कार: खगोलविज्ञान में शॉ पुरस्कार 2016 (ड्रेवर, थॉर्न और वाइस, LIGO की परिकल्पना और डिज़ाइन के लिए), मूलभूत भौतिकी में विशेष ब्रेकथ्रू पुरस्कार 2016 (ड्रेवर, थॉर्न, वाइस और LIGO के योगदानकर्ता) और भौतिकी का नोबेल पुरस्कार 2017 (वाइस, बैरिश और थॉर्न)।'
meanings:
- नमूना $n$ पर डिटेक्टर $d \in \{H1, L1\}$ का स्ट्रेन, 2048 Hz पर 16 s
- 'एक-पक्षीय PSD: Hann-विंडो खंड $s$, FFT, $s$ पर औसत किया गया $|X|^2$'
- 'व्हाइटन किया गया स्ट्रेन: जहाँ PSD सही है वहाँ इकाई प्रसरण वाला श्वेत शोर'
- चौड़ाई $f_q/q$ वाले गाउसीय बैंड-पास फ़िल्टरों की ऊर्जा, व्युत्क्रम FFT का एक बैच
- चर्प द्रव्यमान $\mathcal M_m$, $\eta = 1/4$ के लिए 2PN तक स्थिर-कला इंस्पाइरल कला
- पूरा बैंक एक साथ, विलय-शिखर आवृत्ति पर काटा गया, ऐसे सामान्यीकृत कि $\langle h|h\rangle = 1$
- $4\,\mathrm{Re}\sum_k a_k b_k^*/S_k\,\Delta f$, $k$ पर योग
- 'व्युत्क्रम FFT द्वारा $k$ पर योग: हर डिटेक्टर, टेम्पलेट और समय के लिए सम्मिश्र SNR'
- न्यूटोनियन पथ $\frac1\pi(5/256\tau)^{3/8}\mathcal M_c^{-5/8}$, Adam द्वारा रिज पर फ़िट किया गया
