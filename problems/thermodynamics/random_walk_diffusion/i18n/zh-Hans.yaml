source_hash: 16ad9ff3967d
title: 随机行走与扩散
summary: 数千个布朗粒子各自受到随机冲击。存储为一个 (时间, 行走者, 2) 张量后，行走只是一次 cumsum；均方位移 $\langle x_i x_i\rangle$——一次 einsum——随时间按 $2dDt$ 线性增长，而行走者云团以高斯分布扩展。
notes: 每一步都是每个分量方差为 $2D\Delta t$ 的高斯冲击，因此经过时间 $t$ 后每个坐标的方差为 $2Dt$，在 $d$ 维中离起点距离平方的平均值为 $2dDt$（这里 $d = 2$）。对行走者指标 $n$ 求和，把随机云团变成平滑、可预测的规律——这就是扩散。行走者数目有限，使测得的均方位移有约 $\sqrt{2/N}$ 的相对起伏；随机种子固定，结果可重复。单位任意（例如 µm 和 s）。
meanings:
- 第 $s$ 步、行走者 $n$、分量 $i$ 的独立标准正态冲击
- 行走者 $n$ 在时刻 $t$ 的位置：其冲击的累积和
- 重复的 $n$ 和 $i$ ⇒ 求和：每个时刻的均方位移
- 均方位移对 $t$ 过原点的最小二乘斜率，除以 $2d$
- 点源出发的扩散方程 $\partial_t\rho = D\,\partial_i\partial_i\rho$ 的解
labels:
  n_walkers: 行走者数
  D: 扩散系数 $D$
  t_max: 模拟时长
  n_steps: 时间步数
