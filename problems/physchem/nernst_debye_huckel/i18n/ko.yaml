source_hash: 32bf873c8175
title: 네른스트 식과 데바이–휘켈 차폐
summary: 다니엘 전지 Zn | Zn²⁺ ‖ Cu²⁺ | Cu의 전압은 네른스트 식을 따르며, 여기서는 온도와 농도비의 $(T, Q)$ 격자 하나로 계산한다. 실제 이온은 농도가 암시하는 것보다 덜 활동적이다. 각 이온은 두께 $\kappa^{-1}$인 반대 전하의 구름을 두르고 있다. 이온 주위의 선형화된 푸아송–볼츠만 방정식을 동경 격자에서 배치 선형계로 풀면 해석적 유카와 퍼텐셜과 일치하고, 기전력을 이동시키는 데바이–휘켈 활동도 계수를 재현한다.
notes: '다니엘 전지에서는 아연이 산화되고 구리 이온이 환원된다: $\mathrm{Zn + Cu^{2+} \to Zn^{2+} + Cu}$, 전자 $n = 2$개, $E^\circ \approx 1.10$ V(자체 온도 변화가 작으므로 여기서는 고정). $Q$가 10배 바뀔 때마다 기전력은 $\ln 10\,RT/nF$, 즉 25 °C에서 29.6 mV만큼 움직이며, 기울기는 $T$에 비례해 커진다. 네른스트 식은 몰랄 농도가 아니라 활동도 $a = \gamma m$을 쓴다. 데바이와 휘켈은 다른 이온들이 중심 이온의 퍼텐셜 $\varphi$ 안에서 볼츠만 가중치에 따라 배열되도록 하고 선형화하여 $\gamma$를 계산했다: $\nabla^2\varphi = \kappa^2\varphi$. 그 해는 차폐된 쿨롱(유카와) 퍼텐셜로, 25 °C 물에서 데바이 길이 $\kappa^{-1} \approx 0.304\,\mathrm{nm}/\sqrt{I}$에 걸쳐 감소한다. 수치 풀이법은 $u = r\varphi$에 대한 동경 방정식을 삼중 대각 계로 쓰고, 이온 표면에서 가우스 법칙, 데바이 길이 12배 바깥에서 $\varphi = 0$을 경계 조건으로 하며, 해석적 형태와 약 $10^{-4}$까지 일치한다. 자기 구름의 퍼텐셜 안에서 이온의 에너지는 $kT\ln\gamma$이며, 이것이 정확히 확장 법칙을 준다. $I \to 0$이면 극한 법칙 $\log_{10}\gamma = -Az^2\sqrt I$가 되고 $A \approx 0.51$이다. 각 반쪽 전지는 별개의 2:2 황산염 용액($I = 4m$)이므로, $m(\mathrm{Zn^{2+}})$을 바꾸면 $\gamma_{Cu}$는 그대로인 채 $\gamma_{Zn}$이 바뀌고, 기전력은 이상적인 네른스트 값에서 몇 밀리볼트 벗어난다. 단일 이온 활동도 계수는 단독으로 측정할 수 없으며(평균 $\gamma_\pm$만 가능), $I \approx 0.01$ 위에서는 2:2 황산염의 이온쌍 형성과 특이적 상호작용 때문에
  확장 법칙조차 정성적이 된다. 이온 크기 $a \approx 0.5$ nm는 전형적인 수화 이온 값이다.'
meanings:
- 전지 온도와 반응 지수의 배치
- '합산하는 첨자 없음: 모든 기울기가 모든 반응 지수와 만남'
- 변화시키는 ZnSO₄ 반쪽 전지의 이온 세기 $I = mz^2$와 역 데바이 길이
- 확장 법칙; $a \to 0$이면 극한 법칙 $-Az^2\sqrt I$
- 이온 표면 $a$에서 $a + 12\,\kappa_c^{-1}$까지의 격자, 농도마다 하나
- $u = r\varphi$인 $u^{\prime\prime} - \kappa^2u = 0$; 0행은 $r = a$에서의 가우스 법칙
- 반복된 $j$ ⇒ 합산; 농도마다 밀집 행렬 풀이 하나, 배치로
- '자기 구름 속 이온의 에너지: 확장 데바이–휘켈 법칙을 되찾음'
labels:
  T_C: 활동도와 차폐에 쓰는 온도
  m_Cu: Cu²⁺ 반쪽 전지의 몰랄 농도
  E0: 표준 기전력 $E^\circ$
  a_ion: 이온 크기 $a$
  n_points: 동경 격자점 수 $M$
