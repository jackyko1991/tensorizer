source_hash: 3ad16fadfd42
title: 'MRI k-समष्टि: प्रवणताओं और फ़ूरिये रूपांतरण से इमेजिंग'
summary: 'चुंबकीय-क्षेत्र प्रवणताएँ हर पिक्सेल को उसकी अपनी पुरस्सरण कला देती हैं, इसलिए कुंडली छवि का फ़ूरिये रूपांतरण दर्ज करती है: $s(\mathbf k) = \sum_x \rho(x)\,e^{-2\pi i\,\mathbf k\cdot\mathbf x}$, जहाँ $\mathbf k(t) = \tfrac{\gamma}{2\pi}\int \mathbf G\,dt$। एनकोडिंग-आव्यूह einsum के रूप में लिखने पर यह FFT के बराबर है। k-समष्टि को पंक्ति-दर-पंक्ति भरकर व्युत्क्रम लेने पर छवि स्पष्ट होती दिखती है; पंक्तियाँ छोड़ने पर वह मुड़कर अपने ऊपर आ जाती है (ऐलियासिंग), और केवल केंद्र रखने पर गिब्स रिंगिंग के साथ धुंधली हो जाती है।'
notes: 'हर दूसरी पंक्ति ($R = 2$) दृश्य-क्षेत्र को आधा कर देती है: शून्य-भरित छवि ठीक $\tfrac12[\rho(p) + \rho(p + N/2)]$ है, यानी $\mathrm{FOV}/2$ से खिसकी हुई एक प्रति जो लिपटकर वापस आती है। केवल केंद्रीय पंक्तियाँ रखने से DC पद बना रहता है, इसलिए कुल तीव्रता संरक्षित रहती है, पर किनारे खो जाते हैं: छवि धुंधली होती है और उसमें रिंगिंग (गिब्स) आती है। नियमितीकृत पुनर्निर्माण हर छवि-स्तंभ के लिए एक छोटी न्यूनतम-वर्ग समस्या हल करता है, जिसमें केंद्रीय पंक्तियों से अनुमानित सिर-मास्क के बाहर के संकेत पर दंड लगता है; यह यादृच्छिक योजना की त्रुटि थोड़ी घटाता है, पर नियमित ऐलियासिंग को पूर्ववत नहीं कर सकता जब दोनों मुड़ी हुई प्रतियाँ सिर के भीतर पड़ती हैं। वास्तविक स्कैनर कई कुंडलियाँ (पैरेलल इमेजिंग) या विरलता पूर्वधारणाएँ (कंप्रेस्ड सेंसिंग) जोड़ते हैं। फ़ैंटम क्लासिक शेप–लोगन सिर है; केवल उदाहरण हेतु, नैदानिक उपयोग के लिए नहीं।'
meanings:
- 'प्रोटॉन-घनत्व छवि: पिक्सेल पंक्ति $p$ (फ़ेज़-एनकोड दिशा), स्तंभ $r$ (रीडआउट)'
- प्रवणता के चालू समाकल के रूप में k-समष्टि स्थिति, $\tfrac{\gamma}{2\pi}\int G\,dt$; चरण $\Delta k = 1/\mathrm{FOV}$
- k-समष्टि पंक्ति $u$ पर पिक्सेल $p$ की कला $e^{-2\pi i\,up/N}$; 2D आव्यूह $E_{kx}$ का गुणनखंडन $E_{up}E_{vr}$ होता है
- 'दोहराए गए $p, r$ ⇒ योग: मापा गया k-समष्टि संकेत, fft2(rho) के समान'
- 'प्रतिचयन मास्क: प्राप्त फ़ेज़-एनकोड पंक्तियों पर 1'
- शून्य-भरित पुनर्निर्माण
- हर छवि-स्तंभ $r$ के लिए तिखोनोव न्यूनतम वर्ग, सिर के बाहर के संकेत पर दंड
labels:
  size: छवि आकार $N$
  R: छोड़ने का गुणक $R$ (हर $R$-वीं पंक्ति)
  lowpass: रखा गया k-समष्टि का केंद्रीय अंश
  random_frac: रखी गई पंक्तियों का यादृच्छिक अंश
  lam: तिखोनोव भार $\lambda$
  n_frames: भराई फ़्रेम
