source_hash: 9231afd9bb4a
title: 순열 텐서로 에니그마 해독하기
summary: '물리는 아니고 그냥 재미로: 3로터 Enigma I의 각 키 입력은 $26\times26$ 순열 행렬 여덟 개의 곱이며, 각 로터는 그 위치에 해당하는 순환 이동으로 켤레화된다. 비밀 로터 순서와 시작 위치로 영어 메시지를 암호화한 다음, 모든 로터 순서에 대해 $26^3 = 17\,576$개의 시작 위치 전부로 하나의 배치 텐서로 한꺼번에 복호화하고, 글자 통계가 영어와 가장 비슷한 텍스트를 남겨 암호를 깬다.'
notes: '반사판 $U$는 고정점이 없는 대칭 순열이므로 $Q = R_3R_2R_1S$일 때 $E = Q^{-1}UQ$도 그렇다. $E^2 = I$(같은 설정으로 복호화된다)이고 $E_{ii} = 0$(어떤 글자도 자기 자신으로 암호화되지 않는다. 암호 해독가들이 이용한 약점이다)이다. 각 키 입력 전에 오른쪽 로터가 한 칸 돈다. 오른쪽 로터가 노치에 있으면 가운데 로터도 밀어 주고, 가운데 로터가 자신의 노치에 있으면 왼쪽 로터와 함께 돈다(이중 스텝 이상 현상). 테스트 벡터: 로터 I-II-III, 반사판 B, 링 AAA, 시작 AAA에서 AAAAA는 BDZGO가 된다. 역사: 마리안 레예프스키는 1932년 순열군 이론으로 에니그마를 깼고, 튜링과 웰치먼의 봄베(1940)는 통계가 아니라 크립(일기 예보처럼 추측한 평문)을 이용해 로터 순서와 위치를 탐색했다. 여기서 쓰는 순수 통계적 공격, 즉 일치 지수로 복호문의 순위를 매기는 방법은 제임스 길로글리가 1995년(Cryptologia)에 발표한 것으로, 이후 단계에서 링 설정과 플러그까지 복원했다. 단순화: 링 설정은 AAA이고 공격자가 알고 있으며 플러그보드는 비어 있으므로, 키 공간은 $60 \times 26^3 \approx 10^6$개 설정뿐이고 올바른 설정이 뚜렷이 드러난다. 케이블 10개를 쓴 실제 전시 플러그보드는 약 $1.5 \times 10^{14}$가지 선택을 추가하고, 로터 양쪽에서 26글자 중 20글자를 바꾸며, 글자 통계를 너무 많이 뒤섞어 올바른 로터 설정이 틀린 것들을 간신히 앞설 정도가 된다. 그러면 길로글리의 공격은 플러그에 대한 언덕 오르기 탐색이 필요하고, 짧은 메시지에서는 실패한다. 글자 수를 줄이거나(약 60~100) 다른 점수를 써 보면 통계가 언제 믿을 수 없게 되는지 볼 수 있다. 로터 I–III만 탐색하면 IV나 V를 쓰는 키는 찾을 수 없다.'
meanings:
- 글자는 원-핫 벡터 $e_x$ 또는 그 인덱스 $x \in \{0, \dots, 25\}$ (A = 0)
- '로터 I–V의 역사적 배선: 접점 $b$가 접점 $a$에 연결되어 있으면 $W_{ab} = 1$'
- 순환 이동 $x \to x + o$; $o_k$ = 키 입력 $t$에서 로터 $k$의 창 글자 − 링 설정
- '반복된 $a, b$ ⇒ 합산: 회전된 로터; 인덱스로는 $x \to (w[(x + o) \bmod 26] - o) \bmod 26$'
- '키 입력 한 번: 플러그보드 $S$, 오른쪽 $R^{(1)}$에서 왼쪽 $R^{(3)}$까지의 로터, 반사판 $U$, 그리고 되돌아옴; $(R^{-1})_{ab} = R_{ba}$'
- 26개 오프셋 전부에 대한 로터를 조회 표로 만들어, $R\,e_x$가 수백만 글자에 대해 한꺼번에 F[o, x]가 된다
- 모든 시작 위치 $b$로 복호화한 암호문 ($B = 26^3$); $E^2 = I$이므로 복호화 = 암호화
- 후보 $b$에서 글자 $k$가 나타나는 횟수
- '반복된 $k$ ⇒ 합산: 두 글자가 일치할 확률, 영어는 약 0.066, 무작위 텍스트는 $1/26 \approx 0.038$'
- '대안 점수: 영어 유니그램 평균 로그 가능도 $c_{bk}\log p_k / N$'
labels:
  message: 평문
