source_hash: aac1f92f727e
title: Фрактал Ньютона
summary: Метод Ньютона $z \leftarrow z - p(z)/p'(z)$, запущенный сразу на каждом пикселе комплексной плоскости как один комплексный тензор. Раскраска каждого пикселя по корню, к которому он приходит, рисует бассейны притяжения, границы которых фрактальны, а вблизи корня ошибка возводится в квадрат на каждом шаге.
notes: 'Разложение $p$ вокруг простого корня $r$ даёт $e_{k+1} \approx \frac{p''''(r)}{2p''(r)}\,e_k^2$: число верных знаков удваивается на каждом шаге, что правая панель показывает как параболу в логарифмическом масштабе (для $z^3 - 1$ константа ровно 1). Вдали от корней метод Ньютона хаотичен. Вблизи критической точки, где $p''(z) = 0$, крошечный шаг по $z$ отправляет следующую итерацию куда угодно на плоскости, поэтому копии всей картины появляются на каждом масштабе. Бассейны многочлена с тремя или более корнями имеют одну общую границу — множество Жюлиа отображения Ньютона: каждая граничная точка одного бассейна является граничной точкой их всех (свойство Вады). Терминал подсчитывает, у скольких граничных пикселей в окрестности $3\times3$ есть все цвета, в полном виде и после увеличения. Эта доля остаётся примерно одинаковой на всех масштабах. Попробуйте $z^3 - 2z + 2$, где начальные точки вблизи 0 попадают в притягивающий цикл $0 \to 1 \to 0$ и никогда не достигают корня (серые области).
  Вся сетка — один комплексный тензор, поэтому один einsum обновляет каждый пиксель.'
meanings:
- 'одна начальная точка на пиксель $p = (h, w)$: $z = x_w + i\,y_h$'
- коэффициенты многочлена начиная со свободного члена, например $z^3 - 1 \to (-1, 0, 0, 1)$
- степени $1, z, z^2, \dots$ каждого пикселя, построенные накопленным произведением
- 'повторяющийся $k$ ⇒ суммирование: $p(z)$ на каждом пикселе'
- 'коэффициенты $p''(z)$: дифференцирование сдвигает степени вниз'
- корни как собственные значения сопровождающей матрицы
- расстояние от каждого пикселя до каждого корня; минимум по $j$ даёт метку бассейна
- 'одна начальная точка в двойной точности: отношение стремится к $|p''''(r)/2p''(r)|$'
