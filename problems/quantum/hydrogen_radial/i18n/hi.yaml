title: हाइड्रोजन परमाणु के कक्षक
summary: $\psi = (u(r)/r)\,Y_{lm}(\theta, \phi)$ लिखने से 3D हाइड्रोजन समस्या अतिरिक्त अपकेंद्री पद $l(l+1)/2r^2$ वाले 1D त्रिज्य समीकरण में बदल जाती है। हर कोणीय संवेग $l$ के लिए एक परिमित-अंतर हैमिल्टनियन को $(L, N, N)$ टेंसर में रखा जाता है और एक ही बैच torch.linalg.eigh सभी कक्षक एक साथ लौटाता है। एनिमेशन 1s, 2s, 2p, 3s, … से गुज़रते हुए त्रिज्य प्रायिकता और $\lvert\psi_{nl0}\rvert^2$ की एक काट दिखाता है।
notes: 'परमाण्विक मात्रक ($\hbar = m_e = e = 4\pi\varepsilon_0 = 1$): लंबाइयाँ बोर त्रिज्याओं में, ऊर्जाएँ हार्ट्री में। सटीक ऊर्जाएँ $E_n = -1/(2n^2)$ केवल $n$ पर निर्भर हैं, इसलिए 2s और 2p (या 3s, 3p, 3d) अपभ्रष्ट (degenerate) आते हैं, यद्यपि वे भिन्न आव्यूहों के आइगेनमान हैं — $1/r$ विभव की छिपी सममिति। $(n, l)$ के त्रिज्य फलन में $n - l - 1$ निस्पंद (nodes) होते हैं। ग्रिड $r_{\max}$ पर रुकता है, इसलिए जिन अवस्थाओं का आकार ($\approx 2n^2$) $r_{\max}$ के निकट पहुँचता है वे संपीडित होकर ऊर्जा में ऊपर धकेली जाती हैं; परिमित अंतर $1/r$ विचित्रता के निकट 1s को थोड़ा कम बाँधते हैं। काट $xz$-तल ($z$ ऊपर) में $m = 0$ कक्षक दिखाती है, $Y_{l0} \propto P_l(\cos\theta)$; रंग संपीडित घात-नियम पैमाना $(\lvert\psi\rvert^2)^{0.3}$ प्रयोग करता है ताकि हल्की बाहरी पालियाँ दिखती रहें।'
meanings:
- आंतरिक बिंदु $r = dr \dots r_{\max} - dr$ (दोनों सिरों पर $u = 0$)
- कूलॉम आकर्षण और अपकेंद्री अवरोध, प्रति $l$ एक पंक्ति
- $L$ हैमिल्टनियनों का ढेर, प्रति कोणीय संवेग एक
- '$l$ पर बैच: ऊर्जाएँ और त्रिज्य फलन; मुख्य क्वांटम संख्या $n = l + 1 + \text{column}$'
- प्रति इकाई त्रिज्या प्रायिकता, $r^2\lvert R\rvert^2 = u^2$
- $z$-अक्ष से होकर जाती काट पर $\lvert R(r)\,Y_{l0}(\theta)\rvert^2$
labels:
  n_max: उच्चतम कोश $n$
  r_max: ग्रिड त्रिज्या $r_{\max}$
  n_grid: ग्रिड बिंदु
