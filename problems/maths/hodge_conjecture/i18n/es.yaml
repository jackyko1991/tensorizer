title: La conjetura de Hodge
summary: 'Calcular diamantes de Hodge contando: para las hipersuperficies de Fermat $x_0^d + \dots + x_{n+1}^d = 0$, los números de Hodge son los coeficientes de una potencia de un polinomio, y para los toros complejos y los productos son productos exteriores y convoluciones. El recuento de caracteres de Shioda da después las clases de Hodge racionales, las clases que según la conjetura de Hodge deberían provenir de subvariedades. Para superficies esto es el teorema $(1,1)$ de Lefschetz, que está demostrado, y las rectas de la superficie lo muestran. En dimensión mayor la conjetura sigue abierta; esta página solo cuenta las clases.'
notes: 'En una variedad de Kähler compacta, toda clase de cohomología se descompone en piezas de tipo $(p, q)$: $p$ direcciones holomorfas y $q$ antiholomorfas (Hodge, 1941). Los números $h^{p,q}$ cumplen la simetría de Hodge $h^{p,q} = h^{q,p}$ y la dualidad de Serre $h^{p,q} = h^{n-p,n-q}$, y cada diamante de la izquierda supera ambas comprobaciones. Su suma alternada es la característica de Euler, que para una hipersuperficie de grado $d$ vale $((1-d)^{n+2} - 1)/d + n + 2$. El diamante la reproduce, junto con $h^{1,1} = 20$ para la cuártica K3, $h^{2,1} = 101$ para la quíntica tridimensional y $h^{3,1} = 1$ para la cúbica de dimensión cuatro. Una subvariedad $Z$ de codimensión $p$ define una clase racional de tipo $(p, p)$. La conjetura de Hodge (Hodge 1950; uno de los problemas del Premio del Milenio del Instituto Clay) afirma que toda clase racional $(p, p)$ es una combinación racional de tales clases. Lo que está demostrado: $p = 1$ por el teorema $(1,1)$ de Lefschetz (1924), y por
  tanto $p = n-1$ por el teorema fuerte de Lefschetz. También se cumple para variedades abelianas de dimensión a lo sumo 3, para variedades unirregladas de dimensión cuatro y cúbicas de dimensión cuatro (Conte–Murre, Zucker), y en muchos casos especiales, entre ellos las variedades de Fermat de muchos grados (Shioda 1979, Ran 1980). La versión entera es falsa (Atiyah–Hirzebruch, 1962). Para las variedades de Fermat, los caracteres de Shioda hacen que las clases de Hodge racionales se puedan contar, con una condición por cada conjugado de Galois. Para superficies, el recuento es el número de Picard: $7, 20, 37, 86$ para $d = 3, 4, 5, 6$, y $3(d-1)(d-2) + 1$ cuando $\gcd(d, 6) = 1$. Las $3d^2$ rectas de la superficie dan clases algebraicas explícitas, y su matriz de intersección (rango y signatura del índice de Hodge $(1, \rho - 1)$, calculados aquí) las genera todas sobre $\mathbb Q$ exactamente cuando $d \le 4$ o $\gcd(d, 6) = 1$. Para $d = 6, 8, 9, 10$ hacen falta otras curvas, cuya existencia
  garantiza Lefschetz. Para las variedades de Fermat de dimensión cuatro, el programa cuenta las clases de Hodge, pero saber si cada una es algebraica es precisamente la conjetura. Estado (noviembre de 2026): abierta. La colección de manuscritos generados por IA publicada por OpenAI (github.com/openai/math, familia 032) afirma haber demostrado la conjetura de Hodge racional para toda variedad abeliana CM e informa de una formalización en Lean de ese enunciado. Es una afirmación producida por máquina, sin revisión por pares, pendiente de verificación por la comunidad matemática, y aunque fuera correcta solo abarca una clase especial, no la conjetura general.'
meanings:
- 'multiplicar polinomios es convolucionar vectores de coeficientes, repetido $n+2$ veces: la base de monomios $x^b$, $0 \le b_i \le d-2$, del anillo jacobiano del polinomio de Fermat'
- 'Griffiths: los números de Hodge primitivos centrales son el anillo jacobiano en grado $(q+1)d - (n+2)$'
- 'un toro complejo: $\wedge^p$ de los $dz$ por $\wedge^q$ de los $d\bar z$'
- 'Künneth: cada par de clases, sumado en la casilla $(a + c, b + d)$'
- 'caracteres de Shioda: $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$; cada uno etiqueta una recta $V(a)$ de la cohomología primitiva'
- '$i$ repetido ⇒ sumado: el tipo de Hodge de todos los conjugados de Galois $t\cdot a$ a la vez'
- 'una clase de Hodge racional: de tipo $(\frac n2, \frac n2)$ para cada conjugado'
- dos rectas se cortan si y solo si sus cuatro vectores generadores en $\mathbb C^4$ son linealmente dependientes; $L^2 = 2-d$ por adjunción
- 'rango del retículo generado por las rectas, y su signatura (teorema del índice de Hodge: exactamente un valor propio positivo)'
labels:
  d_max: Grado máximo $d$
  n_max: Comprobación de Euler hasta la dimensión $n$
  g_max: Toros hasta la dimensión $g$
