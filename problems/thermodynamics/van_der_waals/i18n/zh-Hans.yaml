title: 范德瓦尔斯气体与麦克斯韦等面积法则
summary: 范德瓦尔斯方程在理想气体中加入分子间引力和分子大小，于是出现了气液相变。一整族等温线是一次 $(T, V)$ 广播；在临界温度以下，非物理的回环被麦克斯韦等面积线取代，其压强通过对一批温度同时二分求得。
notes: $a$ 衡量分子间的引力（它降低压强），$b$ 是一摩尔分子所占的体积（$V$ 不能小于 $nb$）。在 $T_c$ 以下，等温线上有一段压缩气体反而使压强降低——力学上不稳定。实际上气体在恒定压强 $p^*$（饱和蒸气压）下凝结：摩尔体积为 $V_l$ 的液体与体积为 $V_g$ 的气体共存。麦克斯韦法则要求直线上下两部分面积相等（等价于两相吉布斯自由能相等），由此确定 $p^*$。虚线穹顶连接所有 $(V_l, p^*)$ 和 $(V_g, p^*)$；其顶点是临界点，液体与气体在此变得相同。坐标轴以临界值为单位，在此单位下所有范德瓦尔斯气体看起来都一样（对应态定律）；体积轴为线性，便于目测比较阴影面积。范德瓦尔斯模型对真实流体只是定性的：例如其 $V_c = 3nb$ 高估了真实的临界体积。
meanings:
- 扫描的温度，排成一列
- 体积网格，排成一行
- 通过广播一次得到所有等温线
- 对一批温度求三次方程 $p(V) = p^*$ 的根
- 曲线与直线之间的有向面积：在解处为零
- 二分法：torch.where 一次移动所有区间
labels:
  gas: 气体
  n: 物质的量
  T_high: 起始温度
  T_low: 终止温度
  n_temps: 温度数（帧数）
