source_hash: f1078e5d3894
title: 球のレイトレーシング
summary: 各ピクセルのレイが $(H\cdot W, 3)$ テンソルの一行になる、Whitted 方式の小さなレイトレーサー。すべてのレイをすべての球に対して二次方程式の解の公式で一度に判定し、（レイ $\times$ 球）の表を作り、その argmin が見える面になる。ランバート反射とブリン–フォンシェーディング、シャドウレイの第二のバッチによるハードシャドウ、鏡面反射の跳ね返り、市松模様の床。光源またはカメラがシーンのまわりを回る。
notes: ピクセルの色は $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$ で、$m$ は表面の鏡面反射の割合である。反射色は反射レイのバッチを再びトレースして得られる。これが Whitted（1980）の再帰的アイデアである。シェーディングモデルは Phong（1975）のものに Blinn（1977）のハーフベクトル $\hat{\mathbf h}$ を組み合わせている。$\hat{\mathbf d}$ は単位長なので二次方程式の最高次係数は 1 で、必要なのは $b$ と $q$ だけである。二次レイは表面からわずかな距離 $\varepsilon$ 離して出発させる。そうしないと丸め誤差で自分の球に当たってしまう（シャドウアクネ）。跳ね返りゼロにすると反射のないシーンが、光沢度を高くすると小さく鋭いハイライトが、視野角を広げると広角の眺めが見られる。実際のレンダラーはソフトシャドウ、屈折、ピクセルあたり多数のサンプル（パストレーシング）を加えるが、バッチ化した「レイ対すべて」の表は変わらない。
meanings:
- ピクセル $p$ を通るレイの原点と単位方向；$d$ はカメラ基底でのスクリーン点 $(x, y, 1)$、基底の添字についての einsum
- 球 $s$ の中心と半径
- $i$ の繰り返し ⇒ 和：一回の呼び出しですべてのレイをすべての球に対して
- 二次方程式の近いほうの根；$b^2 < q$（レイが外れる）か交点が背後にある場合は $\infty$
- 見える面；地面 $y = 0$ は $t = -o_y/d_y$ の追加列
- 拡散反射と鏡面反射の係数、裏側では 0 に切り詰める
- 光源へ向かうシャドウレイ：光源より手前でどの球にも当たらなければ 1、さもなければ 0
- $j$ の繰り返し ⇒ 和：鏡面反射方向、次のレイのバッチ
labels:
  orbit: 周回するもの
  bounces: 鏡面反射の回数
  shininess: ブリン–フォン指数 $\alpha$
  fov: 視野角
  width: 画像の幅
  height: 画像の高さ
  frames: 一周あたりのフレーム数
