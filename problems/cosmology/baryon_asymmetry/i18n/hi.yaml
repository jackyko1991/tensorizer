title: प्रतिपदार्थ से अधिक पदार्थ क्यों है?
summary: 'ब्रह्मांड में प्रति फ़ोटॉन लगभग $6\times 10^{-10}$ बेरियॉन हैं और लगभग कोई प्रतिपदार्थ नहीं। सखारोव की तीन शर्तें बताती हैं कि किसी भी व्याख्या को क्या चाहिए; लेप्टोजेनेसिस एक प्रमुख उम्मीदवार है: भारी मायोराना न्यूट्रिनो प्रतिलेप्टॉन की तुलना में लेप्टॉन में थोड़ा अधिक बार क्षय होते हैं (CP असममिति $\varepsilon$), व्युत्क्रम क्षय इसका कुछ भाग धो देते हैं (तीव्रता $K$), और स्फ़ेलेरॉन लेप्टॉनों को बेरियॉन में बदल देते हैं। हज़ारों $(\varepsilon, K)$ मॉडलों के बोल्ट्ज़मान समीकरण एक बैच ODE की तरह हल होकर प्रेक्षित $\eta_B$ से मिलाए जाते हैं। एक खुली समस्या।'
notes: 'प्रेक्षण: CMB से बेरियॉन-फ़ोटॉन अनुपात $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$ है (Planck 2018, $\Omega_bh^2 = 0.0224$), जो बिग बैंग नाभिक-संश्लेषण से मेल खाता है, और प्रतिपदार्थ आकाशगंगाओं का कोई संकेत नहीं है। सखारोव (1967) ने दिखाया कि सममित ब्रह्मांड से असममिति बनने के लिए (1) बेरियॉन संख्या का उल्लंघन, (2) C और CP का उल्लंघन और (3) ऊष्मीय साम्य से विचलन चाहिए। परीक्षण (2) और (3) को सीधे जाँचते हैं: $\varepsilon = 0$, या साम्य में रोके गए भारी न्यूट्रिनो, ठीक शून्य देते हैं; (1) मानक मॉडल की स्फ़ेलेरॉन प्रक्रिया है, जो लगभग 130 GeV से ऊपर $B - L$ को $B = \tfrac{28}{79}(B - L)$ में बदलती है। क्वार्कों का CP उल्लंघन (CKM कला) बहुत छोटा है और विद्युत-दुर्बल संक्रमण एक क्रॉसओवर है, इसलिए अकेला मानक मॉडल विफल रहता है: नई भौतिकी चाहिए। लेप्टोजेनेसिस (Fukugita और Yanagida 1986) सीसॉ क्रियाविधि के भारी दक्षिणहस्त न्यूट्रिनो का उपयोग करता है, जो यह भी समझाएगी कि हल्के न्यूट्रिनो इतने हल्के क्यों हैं। यह खिलौना मॉडल केवल सबसे हल्के $N_1$ के क्षय और व्युत्क्रम क्षय रखता है ($\Delta L
  = 2$ प्रकीर्णन, फ़्लेवर प्रभाव या ऊष्मीय सुधार नहीं), Buchmüller, Di Bari और Plümacher (2005) के सामान्यीकरण में। ऊष्मीय आरंभ के साथ दुर्बल धुलाई ($K \ll 1$) पूरी असममिति रखती है ($\kappa_f \to 1$, जाँचा गया); प्रबल धुलाई ($K \gg 1$) अधिकांश खो देती है पर आरंभिक शर्तें भूल जाती है (दोनों आरंभ मिल जाते हैं), और सॉल्वर उनके विश्लेषणात्मक फ़िट से लगभग 10% के भीतर मेल खाता है। $K = \tilde m_1/m_*$, $m_* \approx 1.08\times10^{-3}$ eV लेने पर, दोलनों में दिखे न्यूट्रिनो द्रव्यमान ($\approx 0.009$–$0.05$ eV) $K \approx 10$–$50$ की ओर इशारा करते हैं, जहाँ $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$ चाहिए; तब Davidson–Ibarra सीमा $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$ के लिए $M_1 \gtrsim 10^{10}$ GeV चाहिए। स्थिति: खुली। लेप्टोजेनेसिस आकर्षक है और ज्ञात हर बात से संगत है, पर पुष्ट नहीं: भारी न्यूट्रिनो कोलाइडरों की पहुँच से बहुत परे हैं। अप्रत्यक्ष संकेत न्यूट्रिनो-रहित द्वि-बीटा क्षय (मायोराना प्रकृति) और न्यूट्रिनो दोलनों में CP उल्लंघन (T2K, NOvA, और आगे DUNE तथा Hyper-Kamiokande)
  होंगे; विद्युत-दुर्बल बेरियोजेनेसिस और अन्य क्रियाविधियाँ विकल्प बनी हुई हैं। यह पृष्ठ खिलौना समीकरणों का संख्यात्मक अन्वेषण करता है और यह दावा नहीं करता कि असममिति इसी तरह बनी।'
meanings:
- '$z = M/T$, लघुगणकीय अंतराल: ब्रह्मांड के ठंडा होने के साथ घड़ी चलती है'
- 'CP असममिति पहले अक्ष पर, क्षय प्राचल दूसरे अक्ष पर: सब कुछ $(E, K)$ पर ब्रॉडकास्ट होता है'
- '$\tfrac38 z^2K_2(z)$: सापेक्षिकीय रहते प्रति फ़ोटॉन $3/4$, फिर $e^{-z}$'
- चरण के मध्यबिंदु पर प्रति हबल समय क्षय और व्युत्क्रम क्षय
- '$N_N - N_N^{eq}$: साम्य से विचलन (सखारोव शर्त 3)'
- 'रैखिक ODE का सटीक एक-चरण गुणक: $K = 1000$ पर भी स्थिर'
- हर मॉडल की $B - L$ असममिति, प्रति चरण एक टेंसर अद्यतन से आगे बढ़ाई गई
- स्फ़ेलेरॉन $B - L$ का $28/79$ भाग बेरियॉन के रूप में रखते हैं; फ़ोटॉन $f = 2387/86$ गुना बढ़ते हैं
- 'दक्षता: दुर्बल धुलाई में $1$, प्रबल धुलाई में $\approx 1/(K z_B)$'
labels:
  log_eps: 'दिखाया गया मॉडल: $\log_{10}\varepsilon$'
  log_K: 'दिखाया गया मॉडल: $\log_{10}K$'
  initial: भारी न्यूट्रिनो की आरंभिक प्रचुरता
  n_eps: $\varepsilon$ में ग्रिड बिंदु
  n_K: $K$ में ग्रिड बिंदु
  steps: $z$ में समाकलन चरण
  z_max: अंतिम $z = M/T$
