source_hash: 293708490c35
title: 由共进化推断蛋白质接触（DCA）
summary: 在折叠蛋白质中相互接触的残基在进化中会一起突变。我们把一个玩具蛋白质折叠在立方格点上，在其接触处植入耦合 $J_{ij}(a,b)$，用吉布斯采样从 Potts 模型抽取多序列比对，然后仅凭比对恢复接触：用独热 einsum 求成对统计量，用平均场 DCA $J \approx -C^{-1}$（或借助自动微分的伪似然）求直接耦合，再计算经 APC 校正的 Frobenius 分数，并与真实接触图比较。
notes: 为什么这行得通？如果残基 $i$ 改变了大小或电荷，与它接触的残基 $j$ 往往也必须改变，否则蛋白质会错误折叠。在许多相关序列中，这会在比对的第 $i$ 列和第 $j$ 列之间留下相关。但相关是可传递的：如果 $i$ 接触 $j$、$j$ 接触 $k$，那么 $i$ 和 $k$ 即使不接触也会相关。直接耦合分析（DCA）拟合一个全局模型，即 Potts 模型（$q$ 态 Ising 模型），其耦合 $J_{ij}$ 一次性解释所有相关，从而把间接相关解释掉。在平均场近似下，耦合就是协方差矩阵之逆的相反数（类似偏相关）；伪似然最大化则对每一列拟合 $P(s_i\mid\text{rest})$，在真实蛋白质家族上通常更准确。动画把比对从 20 条序列逐步增加到全部：DCA（上三角）随深度提高，而普通协方差（下三角）停滞不前，因为它的假阳性是间接的残基对。这里的数据确实来自已知接触的 Potts 模型，因此精确率是诚实的评分。真实比对更难：少数几个字母代替了 20 种氨基酸加空位，序列之间有系统发育关系（真实 DCA 会降低近似重复序列的权重），而且只有部分接触留下信号。共进化是当今结构预测的根源：plmDCA 类的接触曾为早期深度学习方法提供输入，AlphaFold 2 以 MSA 为主要输入，并用注意力学会了自己的、远为丰富的利用方式。这个玩具展示的是该输入背后的统计思想，而不是 AlphaFold 的工作方式。试试更弱的耦合、更少的序列或更多的字母 $q$。
meanings:
- 填满 $X\times Y\times Z$ 盒子的蛇形链；接触是沿链至少相隔 3 个位点的格点近邻
- “真实”模型：随机场，以及仅在 $\mathcal C_{ij} = 1$ 处的随机 $q\times q$ 耦合块
- 局部场：对序列 $n$ 的所有其他列与字母 $j, b$ 求和
- 棋盘式吉布斯采样：接触连接相反颜色，因此一半位点可同时在全部 $N$ 条链中重采样
- 以独热张量表示的比对
- 对 $n$ 求和：单点与成对频率；对 $b$ 求和 $f_{iajb}$ 即得回 $f_{ia}$
- 连通相关，先混入伪计数 $\lambda$ 的均匀频率
- 平均场 DCA：对 $L(q-1)$ 阶方阵的协方差求逆；最后一个字母为参考态
- 伪似然替代方案：用带 $L_2$ 惩罚的 Adam 对 $h, J$ 最大化
- 一对位点的耦合强度，对 $a, b$ 求和，在零和规范 $J^z$ 下
- 平均乘积校正：去除每列的背景，使各行各列的均值为 0
labels:
  fold: 格点折叠（盒子大小）
  q: 每列字母数 $q$
  coupling: 植入耦合强度 $\sigma_J$
  n_seq: MSA 中的序列数 $N$
  sweeps: 每条序列的吉布斯扫描次数
  pseudocount: 伪计数 $\lambda$
  method: 推断方法：平均场 DCA 或伪似然
  plm_iters: 伪似然 Adam 步数
