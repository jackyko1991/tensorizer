source_hash: 52a00886e77c
title: 버치–스위너턴다이어, 법 p에서 점 세기
summary: 랭크가 0부터 4까지인 다섯 개의 타원곡선에 대해 $X$ 이하의 모든 소수에서 $\mathbb F_p$ 위의 점을 한꺼번에 세고, 버치와 스위너턴다이어가 처음 관찰한 대로 곱 $\prod_{p\le X} N_p/p$ 가 $(\log X)^r$ 처럼 커지는 것을 지켜본 뒤, $L(E, s)$ 를 $s = 1$ 에서 계산합니다. 그곳에서 이 함수는 랭크와 같은 차수로 0이 됩니다. 이것이 항상 성립한다는 추측은 미해결이며, 해석적 랭크가 0과 1인 경우에만 증명되어 있습니다.
notes: '$\mathbb Q$ 위의 타원곡선 $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ 의 유리점들은 유한생성군 $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ 를 이룹니다(모델, 1922). 랭크 $r$ 는 계산하기 어렵습니다. 1960년대 초 버치와 스위너턴다이어는 EDSAC 컴퓨터로 소수를 법으로 하는 점의 개수를 세다가 $\prod_{p \le X} N_p/p$ 가 $(\log X)^r$ 처럼 커진다는 것을 알아차렸습니다. 유리점이 많을수록 법 $p$ 에서의 점도 많아지는 것입니다. 그들은 $a_p$ 로 만든 $L(E, s)$ 가 $s = 1$ 에서 정확히 $r$ 차로 0이 되고, 그 최고차 계수가 $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$ 라고 추측했습니다. 이는 클레이 밀레니엄 상 문제 중 하나이며 미해결입니다. 증명된 것: 해석적 랭크가 0 또는 1이면 랭크는 그것과 같고 Ш는 유한합니다(그로스와 자기에 1986, 콜리바긴 1989). 이 증명은 모듈러성(와일스, 테일러–와일스 1995, 브뢰유–콘래드–다이아몬드–테일러 2001)을 사용하며, 애초에 $L(E, s)$ 가 $s = 1$ 까지 연장되는 것도 모듈러성 덕분입니다. 해석적 랭크가 $\ge 2$ 인 경우에는 일반적으로 알려진 것이 없습니다. 다섯 곡선은 랭크 0부터 4까지 각각 도체가 가장 작은 곡선입니다(크레모나 표의 11a1, 37a1, 389a1, 5077a1, 234446a1). 여기서 확인하는 것: 대각합은 하세 부등식 $|a_p| \le 2\sqrt p$ 를 만족하고, 11a1의 경우 모듈러 형식 $\eta(q)^2\eta(q^{11})^2$ 의 계수와 같으며(테스트됨), 근번호는 $\varepsilon = (-1)^r$ 입니다. 모든 곡선에서 $s = 1$ 에서 처음으로 0이 아닌 도함수는 $r$ 번째이며,
  $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$, $L''''''(E,1)/6 = 1.7318499\ldots$ 는 LMFDB 값과 일치합니다. 11a1에서는 전체 공식이 성립함을 확인할 수 있습니다: $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$. 도함수가 수치적으로 0이라는 것은 증거일 뿐, 실제로 0이 된다는 증명은 아닙니다. 부분곱은 원래의 발견적 근거입니다. 골드펠드(1982)는 부분곱이 정말 $C(\log X)^r$ 처럼 행동한다면 $r$ 는 해석적 랭크이고 $L(E, s)$ 에 대한 리만 가설이 성립함을 보였습니다. 따라서 부분곱의 수렴 자체가 추측이며 느립니다. 기울기는 $X = 2\times 10^4$ 에서 이미 랭크 0부터 3까지를 올바른 순서로 나열하지만, 랭크 4인 곡선은 $X = 3\times 10^4$ 에서도 여전히 자기 랭크에 못 미칩니다. $a_p/2\sqrt p$ 의 사토–테이트 분포, 즉 반원 분포 $\frac{2}{\pi}\sqrt{1-x^2}$ 는 복소곱이 없는 곡선에 대해 정리입니다(테일러와 공동 연구자들, 2008–2011).'
meanings:
- 모든 곡선, 블록의 모든 소수, 모든 $x \in \mathbb F_p$ 를 한꺼번에(호너 방법, 매 단계마다 법 $p$ 로 축약)
- 제곱 $y^2 \bmod p$ 의 표로 구한 르장드르 기호; $v = 0$ 이면 $\chi = 0$
- '프로베니우스 대각합; 하세: $|a_p| \le 2\sqrt p$'
- 모든 $X$ 에 대한 부분곱을 한꺼번에(좋은 소수만)
- $\sqrt{X} \le p \le X$ 구간의 기울기; 매우 느리게 수렴
- 곱셈성으로 구한 디리클레 계수, 소수 거듭제곱 $q = p^k$ 마다 간격 있는 슬라이스 하나
- '반복된 $n$ ⇒ 합산: 가우스–르장드르 절점 $t = e^{u_m}$ 에서의 $F(t)$'
- $s = 1$ 에서의 모든 도함수를 한꺼번에; 처음으로 0이 아닌 것이 해석적 랭크를 줌
labels:
  x_max: $X$ 이하의 소수
