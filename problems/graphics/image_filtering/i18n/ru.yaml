source_hash: 35a326f71a76
title: Фильтрация изображений как свёртка
summary: Размытие, повышение резкости и поиск краёв на процедурно нарисованном тестовом изображении путём скольжения по нему малого ядра. Каждый линейный фильтр — одна свёртка индексов $O_p = K_k P_{kp}$ по развёрнутым окнам пикселей, то же самое, что conv2d; гауссиан разделяется на два одномерных прохода, а теорема о свёртке превращает его в произведение преобразований Фурье. Прямоугольное и гауссово размытие, края Собеля, лапласиан гауссиана, нерезкое маскирование и медиана против гауссиана на шуме «соль и перец».
notes: 'Частотная характеристика прямоугольного фильтра — sinc с колебаниями, уходящими в отрицательную область, поэтому он пропускает мелкие детали, часть из них с обращённым знаком (полосы чирпа исчезают и появляются вновь); характеристика гауссиана — снова гауссиан, плавно спадающий до нуля. Разделимость важна для скорости: ядру $(2r+1)^2$ нужно $(2r+1)^2$ умножений на пиксель, а двум одномерным проходам — лишь $2(2r+1)$. Собель (1968) сочетает производную со сглаживанием; лапласиан гауссиана откликается там, где вторая производная проходит через ноль, а Кэнни (1986) строит на тех же сглаженных градиентах с утоньшением и гистерезисом. Нерезкое маскирование добавляет $\alpha(I - G * I)$ — высокочастотное усиление, которое усиливает и шум. Медиана нелинейна, поэтому у неё нет ни ядра, ни частотной характеристики, но она удаляет изолированные пиксели «соль и перец», которые гауссиан лишь размазывает (сравните PSNR в терминале). Каждый слой свёрточной нейронной сети — та же операция развёртки
  и свёртки с выученными ядрами.'
meanings:
- 'уровень серого пикселя $(i, j)$: градиент, диск, квадрат, треугольник и чирп плюс шум'
- веса фильтра, одинаковые для каждого пикселя
- повторяющиеся $a, b$ ⇒ суммирование по окну (корреляция, которую PyTorch называет свёрткой)
- окно вокруг пикселя $p$ как столбец, $k = (a, b)$
- 'повторяющийся $k$ ⇒ суммирование: тот же фильтр как один einsum'
- двумерный гауссиан — внешнее произведение, поэтому его можно выполнить как проход по строкам и проход по столбцам
- 'Собель: сглаживание $[1, 2, 1]$ поперёк, умноженное на разность $[-1, 0, 1]$ вдоль'
- 'теорема о свёртке: поточечное произведение в пространстве Фурье, равное conv2d с циклическим дополнением'
labels:
  size: Размер изображения
  sigma: Ширина гауссиана $\sigma$
  box: Размер прямоугольного фильтра
  amount: Повышение резкости $\alpha$
  noise: Гауссов шум $\sigma_n$
  salt_pepper: Доля шума «соль и перец»
  median: Окно медианы
