source_hash: 492f2e3f4bf6
title: PET：正电子湮灭与图像重建
summary: FDG 等示踪剂会发射正电子；每个正电子与电子湮灭，产生两个背对背飞出的 511 keV 光子。我们追踪一批模拟衰变直到探测器环，每个符合事件按其响应线（LOR）分箱到正弦图中，再用 MLEM 重建图像：$\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$，其中整台扫描仪就是一个系统矩阵 $A$，每次迭代只需两次矩阵–向量乘法。
notes: 两个光子朝相反方向飞出，所以衰变一定发生在同时触发的两个探测器之间的连线上：这就是响应线。收集数百万条响应线便得到正弦图（身体中每一点在 $(\theta, s)$ 中描出一条正弦曲线）。MLEM 把计数视为均值为 $\bar y = A\lambda + r$ 的泊松分布，并爬升对数似然 $\sum_b y_b \log \bar y_b - \bar y_b$：每次迭代先正投影当前图像，与数据比较，再把比值反投影回去。它永远不会变成负值，会保持总计数（没有背景时 $\sum_b (A\lambda)_b = \sum_b y_b$），而且似然值永不下降。早期迭代较平滑；后期更锐利，却会放大泊松噪声，因此误差先下降后回升（使用默认值时最小值约在第 50 次迭代；试试 150 次迭代或减少衰变数，就能看到回升）：临床扫描仪会提前停止（或使用 OSEM 子集与后滤波）。FBP 用斜坡滤波器处理每个投影，再一步反投影；速度快但噪声较多，且可能出现负值。穿过身体的光子会衰减 $e^{-\int \mu\, dl}$，在 511 keV 时水的 $\mu \approx 0.096$ cm$^{-1}$；这个因子只取决于响应线，与衰变发生在线上何处无关，因此可以并入 $A$。简化：只有 2D、高斯形正电子射程（F-18 的平均射程约 0.6 mm，Ga-68 约 3 mm，因此除非调高，否则会被 6 mm 的像素掩盖）、不考虑光子非共线性、理想晶体（每条响应线的端点放在触发晶体内的随机位置）且没有作用深度或死时间，以及已知的平滑随机与散射本底。所有数值均为近似值，仅供教学使用，不可用于临床。
meanings:
- 按活度分布抽样的衰变位置（热病灶衰变得更频繁）
- 湮灭点：正电子先移动约一毫米
- 两个光子 $p = 1, 2$ 方向相反，各为 $511$ keV
- 每个光子到达环的位置：解 $|a + t u| = R$，取 $t > 0$
- 正弦图：每条响应线 $(\theta, s)$ 探测到的符合事件数
- 像素 $j$ 中的衰变被计入分箱 $b$ 的概率（乘以衰减）
- 重复的 $j$ ⇒ 求和：正投影加上随机/散射本底
- 重复的 $b$ ⇒ 求和：沿每条响应线反投影
- 乘法更新：保持为正并维持总计数
labels:
  kilo_decays: 模拟衰变数（千）
  n_iter: MLEM 迭代次数
  positron_range: 正电子射程 $\sigma_+$
  attenuation: 体内衰减
  background: 随机 + 散射比例
  grid: 图像网格 $n \times n$
  n_detectors: 环上的探测晶体数
