title: 'डॉप्लर अल्ट्रासाउंड: रक्त प्रवाह मापना'
summary: 'अल्ट्रासाउंड प्रोब लाल रक्त कोशिकाओं की प्रतिध्वनियाँ (इको) सुनता है। हर गतिमान कोशिका इको की आवृत्ति को $f_D = 2 f_0 v \cos\theta / c$ से खिसका देती है, और धड़कती धमनी की सैकड़ों कोशिकाओं को फेज़रों के एक बैच के रूप में एक साथ सिम्युलेट किया जाता है। अल्पकालिक फूरिये रूपांतरण (STFT) उनके जोड़े गए इको को वह डॉप्लर स्पेक्ट्रोग्राम बना देता है जो स्कैनर दिखाता है: हृदय चक्र के दौरान रक्त वेगों का फैलाव।'
notes: 'गुणक 2 इसलिए आता है कि विस्थापन दो बार होता है: गतिमान कोशिका पहले खिसकी हुई तरंग प्राप्त करती है और फिर चलते-चलते उसे दोबारा उत्सर्जित करती है। केवल बीम की दिशा में वेग का घटक मायने रखता है, इसलिए $\theta = 90°$ पर कोई विस्थापन नहीं होता; स्कैनर ऑपरेटर से कोण पूछकर $v = f_D c / (2 f_0 \cos\theta)$ निकालता है, जो लगभग 60° से ऊपर बहुत अनिश्चित हो जाता है। डिफ़ॉल्ट मानों ($f_0 = 5$ MHz, $\theta = 60°$, शिखर 1 m/s) पर सिस्टोलिक विस्थापन लगभग 3.2 kHz है, जो श्रव्य सीमा में है, इसीलिए डॉप्लर मशीनें संकेत को ध्वनि के रूप में भी सुनाती हैं। लैमिनर प्रवाह में प्रोफ़ाइल परवलयिक होती है: दीवार के पास की कोशिकाएँ मुश्किल से हिलती हैं और केंद्र-रेखा सबसे तेज़ चलती है। क्योंकि अनुप्रस्थ काट के बराबर क्षेत्रफलों में बराबर कोशिकाएँ होती हैं, 0 से $v_{\max}$ तक हर वेग समान रूप से आम है, स्पेक्ट्रम एक सपाट पट्टी ("भरी हुई" खिड़की) है, और औसत आवृत्ति ठीक अधिकतम की आधी है। विक्षुब्ध या स्टेनोटिक प्रवाह इसके बजाय स्पेक्ट्रम को चौड़ा कर देगा। पल्स्ड डॉप्लर हर पल्स पर इको का एक नमूना लेता है, इसलिए नाइक्विस्ट
  के अनुसार यह केवल $|f_D| < \mathrm{PRF}/2$ माप सकता है: PRF घटाइए (या वेग बढ़ाइए) तो सिस्टोलिक शिखर ऋणात्मक ओर लिपट जाता है (एलियासिंग)। वास्तविक स्कैनरों को तेज़ जेट के लिए ऊँची PRF चाहिए, पर गहरी वाहिकाओं तक पहुँचने के लिए कम PRF, क्योंकि हर पल्स को अगली पल्स भेजने से पहले लौटना होता है। सरलीकरण: सैंपल वॉल्यूम पूरी वाहिका को ढकता है, बीम एकसमान है, IQ संकेत सीधे बेसबैंड में सिम्युलेट होता है, और कोई वॉल फ़िल्टर या ऊतक क्लटर नहीं है। सभी मान अनुमानित हैं और केवल शिक्षा के लिए हैं, नैदानिक उपयोग के लिए नहीं।'
meanings:
- 'दो धड़कनों में केंद्र-रेखा वेग: सिस्टोलिक शिखर, थोड़ा उल्टा प्रवाह, धीमा डायस्टोलिक प्रवाह'
- 'यादृच्छिक लाल रक्त कोशिकाएँ: वाहिका में त्रिज्या, इको की कला और प्रबलता'
- 'परवलयिक (लैमिनर) प्रोफ़ाइल गुणा तरंगरूप: बाहरी गुणनफल, किसी सूचकांक का योग नहीं'
- हर पल्स पर हर कोशिका का डॉप्लर विस्थापन $2 f_0 v \cos\theta / c$
- 'दोहराया $n$ ⇒ योग: प्राप्त इको, हर पल्स पर एक जटिल (IQ) नमूना, अंतराल $\Delta t = 1/\mathrm{PRF}$'
- 'स्पेक्ट्रोग्राम: समय खिड़की $k$ में आवृत्ति $f$ पर शक्ति'
- पल्स्ड डॉप्लर $f$ को केवल $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$ में लपेटकर देखता है
labels:
  f0: प्रेषण आवृत्ति $f_0$
  theta: बीम–प्रवाह कोण $\theta$
  v_peak: शिखर सिस्टोलिक वेग
  prf: पल्स पुनरावृत्ति आवृत्ति PRF
  heart_rate: हृदय गति
  n_scatterers: सिम्युलेट की गई लाल रक्त कोशिकाएँ
