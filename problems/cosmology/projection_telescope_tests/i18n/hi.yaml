source_hash: c17ad8b19789
title: 'प्रक्षेपण के दूरबीन परीक्षण: गुरुत्वीय तरंगें, ब्लैक-होल छायाएँ और सुपरनोवा'
summary: 'एक अनुमानात्मक परिकल्पना, स्थापित भौतिकी नहीं, जिसे खुले खगोलीय डेटा के सामने रखा गया है। यदि गुरुत्व $3+1$ से अधिक आयाम देखता है, तो गुरुत्वीय तरंगें $1/d$ से तेज़ी से कमज़ोर होती हैं; यदि वक्रित दिक्काल एक मुड़े हुए प्रक्षेपण की छाया है, तो फ़ोटॉन गोले के बाहर का मोड़ ब्लैक होल की छाया को बड़ा कर देगा। GW170817 अपनी मेज़बान आकाशगंगा की दूरी के साथ $D = 4.00^{+0.07}_{-0.25}$ देता है, M87* और Sgr A* की EHT छायाएँ केवल लगभग $2.3$ श्वार्ज़शिल्ड त्रिज्याओं के भीतर मोड़ की अनुमति देती हैं, और Pantheon+ सुपरनोवा रिसते हुए (DGP) ब्रह्मांड को $\Lambda$CDM से अलग नहीं कर पाते। सब कुछ $3+1$ में सामान्य सापेक्षता से मेल खाता है: कोई भी अतिरिक्त आयाम ऐसे होने चाहिए जिन्हें गुरुत्व इन पैमानों पर महसूस नहीं करता।'
notes: 'स्थिति: अनुमानात्मक। यह लेखक की अपनी परिकल्पना है (श्रृंखला का विवरण देखें), स्थापित भौतिकी नहीं। प्रक्षेपण परिकल्पना का चरण 6, प्रेक्षण चरण। चरण 1 (cosmology/projection_postulate) ने अभिधारणाएँ प्रस्तुत कीं और पाया कि बॉर्न नियम केवल उस स्थिति में बचता है जो मानक क्वांटम यांत्रिकी से अप्रभेद्य है; चरण 2 से 5 (projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test) P3, P5, P4 और P1-P2 को विकसित करते हैं। यह चरण P4 (ज्यामिति एक ऐसे प्रक्षेपण के रूप में जो मुड़ सकता है) और P5 (गुरुत्व को कोई $d_G$ चाहिए, जो मान लिया नहीं बल्कि फ़िट किया जाता है) के खुले प्राचलों को खुले डेटा पर फ़िट करता है, और निर्णय जो भी निकले उसे दिखाता है। पहले ज्ञात भौतिकी। $3+1$ आयामों में सामान्य सापेक्षता में गुरुत्वीय तरंग का विकृति-आयाम (strain) $1/d$ के रूप में घटता है; $D$ दिक्काल आयामों में उसकी ऊर्जा एक $(D-2)$-गोले पर फैलती है और $h\propto d^{-(D-2)/2}$ होता है। $1/d$ मानने वाला डिटेक्टर $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$ का अनुमान लगाता है ($d_* =
  1$ Mpc, जैसा Pardo, Fishbach, Holz और Spergel 2018 में), या, यदि रिसाव केवल परिरक्षण पैमाने $R_c$ के पार शुरू होता है, तो $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ (उनका परिरक्षित रूप, जो $D > 4$ के लिए सार्थक है)। परिकल्पना की भविष्यवाणी: यदि बड़ी दूरियों पर गुरुत्व अतिरिक्त आयामों में फैलता है, तो $d_{GW} > d_{EM}$ और $D > 4$। परीक्षण (a): GW170817, NGC 4993 में प्रकाशीय प्रतिरूप वाला न्यूट्रॉन-तारा विलय। डेटा: GWTC-1 रिलीज़ से गुरुत्वीय-तरंग ज्योति दूरी के 8078 पश्च नमूने (data/gw170817_distance.csv; LIGO Scientific and Virgo Collaborations, निम्न-स्पिन पूर्वधारणा, आकाश स्थिति मुक्त; GWOSC, लाइसेंस CC BY 4.0; Abbott et al. 2019, PRX 9, 031040)। विश्लेषण की पूर्वधारणा $\propto d^2$ है, इसलिए प्रत्येक नमूने को $d^{-2}$ से भारित किया जाता है और एक कर्नेल घनत्व $d_{GW}$ की संभाविता देता है (प्रकाशित मान $40^{+8}_{-14}$ Mpc है, Abbott et al. 2017)। विद्युतचुंबकीय दूरियाँ (data/em_distances.csv, उद्धृत संख्याएँ): पृष्ठ चमक उतार-चढ़ाव $40.7\pm1.4\pm1.9$ Mpc (Cantiello et al. 2018,
  ApJL 854, L31, डिफ़ॉल्ट) और Pardo et al. द्वारा प्रयुक्त हबल-प्रवाह दूरियाँ, अर्थात् $v_H = 3017\pm250$ km/s को $H_0 = 73.24\pm1.74$ (SH0ES) या $67.74\pm0.46$ km/s/Mpc (Planck) से विभाजित करके। परिणाम: $D = 4.00^{+0.07}_{-0.25}$ (68%, SBF; autograd फ़िट $4.00\pm0.11$ देता है), $3.98^{+0.09}_{-0.24}$ (SH0ES) और $3.94^{+0.08}_{-0.24}$ (Planck)। Pardo et al. ने $4.02^{+0.07}_{-0.10}$ (SH0ES) और $3.98^{+0.07}_{-0.09}$ (Planck) पाया; उनकी निचली त्रुटि छोटी है क्योंकि उन्होंने आकाश स्थिति को प्रतिरूप पर स्थिर किया और LVC के $H_0$ पश्च वितरण का उपयोग किया, जबकि यहाँ शामिल नमूनों की आकाश स्थिति मुक्त है, इसलिए दूरी-झुकाव अपभ्रष्टता छोटी दूरियों की ओर एक लंबी पूँछ छोड़ती है। परिरक्षित रिसाव के लिए, $-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ की शर्त $D = 5$, $n = 1$ के लिए कुछ सौ Mpc से कम $R_c$ को और $n = 2$ से 5 तक के लिए लगभग 50-80 Mpc से कम मानों को अपवर्जित करती है; क्रमिक संक्रमण (छोटा $n(D-4)/2$) ग्रिड के $10^4$ Mpc किनारे तक अपवर्जित हैं। Pardo et al. किसी भी तीव्रता के लिए $R_c\gtrsim
  20$ Mpc बताते हैं, जो संभाविता अनुपात से नहीं बल्कि पश्च वितरण से निकाला गया है। निर्णय (a): 40 Mpc तक गुरुत्व लगभग $\pm0.1$ की सटीकता से $D = 4.0$ की तरह व्यवहार करता है; गुरुत्व जो भी अतिरिक्त आयाम देखता है, वे संहत हैं या इन दूरियों के पार परिरक्षित हैं। परीक्षण (b): ब्लैक-होल छायाएँ। श्वार्ज़शिल्ड में फ़ोटॉन गोला $r = 3GM/c^2$ पर है और छाया की त्रिज्या $b_c = \sqrt{27}\,GM/c^2$ है; यहाँ इसे $\min_r r/\sqrt{f}$ के रूप में और संघट्ट प्राचलों के एक समूह के लिए $u'''' = -u + \tfrac32 u^2$ की किरण अनुरेखण द्वारा, दोनों तरह से परिकलित किया गया है। स्पिन छाया की क्षेत्रफल-तुल्य त्रिज्या को अधिकतम 7% घटाता है (बार्डीन वक्र; ध्रुव से देखे गए चरम ब्लैक होल के लिए $2(1+\sqrt2)\,GM/c^2$)। मोड़, लेखक का एक मॉडलिंग विकल्प जिसे यहाँ सटीक बनाया गया है: P4 कहता है कि विलक्षणता वह जगह है जहाँ प्रक्षेपण मुड़ता है; मान लीजिए कि प्रक्षेपित ज्यामिति त्रिज्या $r_f$ पर स्थित मोड़ तक श्वार्ज़शिल्ड है और जो प्रकाश मोड़ तक पहुँचता है वह कभी वापस नहीं आता। फ़ोटॉन गोले के भीतर का मोड़ ($r_f\leq 1.5\,r_s$) छाया
  को अपरिवर्तित छोड़ता है; बाहर का मोड़ उसे छूकर गुज़रने वाली किरण को छाया का किनारा बना देता है, $b = r_f/\sqrt{1 - r_s/r_f}$, इसलिए $\delta = b/b_c - 1 > 0$। डेटा (data/eht_shadows.csv, उद्धृत संख्याएँ): M87* वलय $42\pm3$ $\mu$as और $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as (EHT 2019, Papers I और VI), तारकीय गतिकी से प्राप्त $3.64\pm0.22$ $\mu$as (Gebhardt et al. 2011, 17.9 Mpc पर $6.6\pm0.4\times10^9\,M_\odot$) के विरुद्ध, इसलिए $\delta = +0.04\pm0.13$ (यहाँ परिकलित, प्रकाशित मान नहीं); Sgr A* वलय $51.8\pm2.3$ $\mu$as (EHT 2022, Paper I) और Paper VI, Table 2 से $\delta = -0.04^{+0.09}_{-0.10}$ (Keck पूर्वधारणा) तथा $-0.08\pm0.09$ (VLTI पूर्वधारणा)। $\delta + 2\sigma$ लेकर और स्पिन को 7% तक छिपाने देने पर, मोड़ छाया को अधिकतम 0.37 (M87*), 0.21 (Keck) और 0.17 (VLTI) तक बढ़ा सकता है, इसलिए $r_f\leq 2.86$, $2.40$ और $2.28\,r_s$। निर्णय (b): छायाएँ श्वार्ज़शिल्ड/केर से मेल खाती हैं; लगभग $2.3\,r_s$ के बाहर का मोड़ अपवर्जित है, परंतु फ़ोटॉन गोले के भीतर का मोड़, जहाँ P4 उसे स्वाभाविक रूप से रखेगा (क्षितिज
  पर या केंद्रीय विलक्षणता पर), छाया-चित्रों के लिए अदृश्य है। परीक्षण (c, वैकल्पिक): सुपरनोवा। DGP ब्रेन विश्व में गुरुत्व $r_c$ के पार पाँचवें आयाम में रिसता है और प्रसार $H^2 - H/r_c\propto\rho$ का पालन करता है; Dvali और Turner का सूचकांक $\alpha$ दोनों के बीच अंतर्वेशन करता है ($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$ है $\Lambda$CDM, $\alpha = 1$ है DGP)। डेटा: cosmology/cosmological_constant_fit की Pantheon+ तालिका, जिसे data/pantheon_plus.csv में कॉपी किया गया (1466 सुपरनोवा, $z > 0.01$, विकर्ण त्रुटियाँ; Scolnic et al. 2022, Brout et al. 2022; Pantheon+ डेटा फ़ाइलों पर कोई घोषित लाइसेंस नहीं है, शोधपत्र CC BY 4.0 हैं)। परिणाम (एकसमान पूर्वधारणाएँ, $-1\leq\alpha\leq 1.8$): $\alpha = 0.44\pm0.71$; $\Lambda$CDM के लिए $\chi^2 = 639.5$ और DGP के लिए $638.9$ (दोनों सुपरनोवा की संख्या से काफ़ी कम, क्योंकि विकर्ण त्रुटियों में सहप्रसरण का विकर्ण शामिल है)। निर्णय (c): अकेले सुपरनोवा रिसते हुए ब्रह्मांड को $\Lambda$CDM से अलग नहीं कर सकते; स्व-त्वरित DGP शाखा को CMB और
  बेरिऑन ध्वनिक दोलनों के साथ संयोजन ही खारिज करता है (उदा. Fang et al. 2008, Phys. Rev. D 78, 103509), जिसे यहाँ दोबारा फ़िट नहीं किया गया है। P4 और P5 के लिए समग्र निर्णय: प्रत्येक परीक्षण $3+1$ आयामों में सामान्य सापेक्षता के अनुरूप है। परिकल्पना केवल तभी बचती है जब $3+1$ से परे के आयाम ऐसे हों जिन्हें गुरुत्व इन पैमानों पर महसूस नहीं करता (संहत, परिरक्षित, या केवल चरण 1 और 5 के क्वांटम क्षेत्र में उपस्थित), और यदि कोई भी मोड़ फ़ोटॉन गोले के भीतर स्थित हो। यह एक बाधा है, समर्थन नहीं: अब तक इस श्रृंखला को ऐसी कोई भविष्यवाणी नहीं मिली है जो मानक भौतिकी से भिन्न हो और डेटा से मेल खाती हो।'
meanings:
- GW170817 के 8078 दूरी नमूने (GWTC-1); $w_i = d_i^{-2}$ आयतन में एकसमान पूर्वधारणा को विभाजित करके हटा देता है
- 'दोहराया गया $i$ (नमूने) ⇒ योग: $d_{GW}$ का कर्नेल घनत्व, एक सामान्यीकृत संभाविता'
- वह दूरी जिसका अनुमान डिटेक्टर लगाता है जब गुरुत्व $D_a$ आयामों में फैलता है, प्रत्येक विद्युतचुंबकीय दूरी $d_j$ के लिए
- $D$ का पश्च वितरण, विद्युतचुंबकीय दूरी पर सीमांतीकृत ($j$ का योग, समलंब नियम)
- 'autograd फ़िट: $\log p(D)$ पर न्यूटन चरण, त्रुटि द्वितीय अवकलज से (लाप्लास)'
- $B$ संघट्ट प्राचलों और $F$ मोड़ त्रिज्याओं के लिए एक साथ फ़ोटॉन कक्षाएँ $u = r_s/r$ ($\varphi$ में RK4)
- $r_f$ पर मोड़ से छाया की आंशिक वृद्धि (फ़ोटॉन गोले के भीतर शून्य)
- स्पिन $a$ और झुकावों के लिए केर छाया का संकुचन (बार्डीन वक्र, क्षेत्रफल-तुल्य त्रिज्या)
- प्रत्येक रिसाव सूचकांक $\alpha_a$ और $\Omega_{m}$ के लिए सुपरनोवा $\chi^2$, ऑफ़सेट ($H_0$, $M$) हटाया गया; $i$ का योग
labels:
  em_distance: निर्णय के लिए प्रयुक्त NGC 4993 तक की विद्युतचुंबकीय दूरी
  D_screen: परिरक्षण पैमाने के पार आयाम $D$ (परिरक्षित रिसाव)
  n_screen: परिरक्षण संक्रमण की तीव्रता $n$
  inc_max_sgra: स्पिन पट्टी के लिए Sgr A* का अधिकतम झुकाव
