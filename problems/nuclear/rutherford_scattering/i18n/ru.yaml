source_hash: 0b86e0abca1f
title: Резерфордовское рассеяние
summary: Пучок альфа-частиц направлен на ядро золота. Каждая альфа-частица интегрируется методом RK4 в отталкивающем кулоновском поле в одном пакетном тензоре, и гистограмма углов рассеяния воспроизводит закон Резерфорда $1/\sin^4(\theta/2)$ — свидетельство того, что положительный заряд атома сосредоточен в крошечном ядре.
notes: 'Единицы: фм, МэВ и время в фм/$c$. Энергия и момент импульса сохраняются вдоль каждой траектории, поэтому $E$ и прицельный параметр $b$ однозначно определяют отклонение $\theta = 2\arctan(k/2Eb)$; лобовая альфа-частица разворачивается на расстоянии $d = k/E$ (около 45 фм для 5 МэВ на золоте — всё ещё далеко за пределами ядра радиусом 7 фм, так что чистый закон Кулона выполняется). Пучок равномерно распределён по диску радиуса $b_{\max}$ (случайно, но с фиксированным зерном), поэтому число частиц, рассеянных в телесный угол, равно (частиц на площадь) × $d\sigma/d\Omega$. Лишь одна альфа-частица из нескольких сотен отскакивает назад на угол больше 90° — сюрприз Гейгера и Марсдена в 1909 году. Упрощения: ядро — неподвижный точечный заряд (без отдачи и ядерных сил), движение нерелятивистское ($v \approx 0.05c$). Каждая альфа-частица стартует на расстоянии 30 $d$ ровно с энергией и моментом импульса частицы, прилетевшей из бесконечности; оставшийся хвост силы $1/r^2$ сдвигает углы гораздо
  меньше чем на градус.'
meanings:
- $Z_\alpha Z e^2/4\pi\varepsilon_0 = 2Z \cdot 1.44$ МэВ·фм
- положение (фм) и скорость (в единицах $c$) альфа-частицы $b$
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния $r_b^2$'
- кулоновское отталкивание сразу для всего пучка
- 'двумерное векторное произведение: момент импульса на единицу массы'
- угол вылетающей скорости к оси пучка
- предсказание Резерфорда, сравниваемое с гистограммой
