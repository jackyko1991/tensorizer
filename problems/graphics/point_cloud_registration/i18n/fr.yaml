source_hash: b1a74b85fb17
title: 'Recalage de nuages de points : la chaîne PCL (FPFH, RANSAC, ICP)'
summary: 'Deux scans 3D partiels du même objet, pris depuis deux points de vue et déplacés par un mouvement rigide inconnu, sont alignés comme le fait la Point Cloud Library (PCL), écrite en PyTorch par lots : sous-échantillonnage par grille de voxels, suppression statistique des points aberrants, normales à partir des covariances de voisinage, descripteurs FPFH, RANSAC sur les correspondances de descripteurs (des milliers d''ajustements de Kabsch à la fois) et raffinement ICP, point à point et point à plan, depuis plusieurs départs. Le résultat est comparé au mouvement connu : erreur de rotation en degrés, erreur de translation et RMSE.'
notes: 'L''objet de démonstration est la vache « Spot » de Keenan Crane (5856 triangles), que son auteur a placée dans le domaine public (CC0 1.0 ; https://www.cs.cmu.edu/~kmcrane/Projects/ModelRepository/, fournie sous data/spot_vertices.csv et data/spot_faces.csv, voir data/SOURCES.md ; Crane, Pinkall et Schröder 2013, ACM TOG 32(4)). Nous n''avons pas utilisé le lapin de Stanford : le Stanford 3D Scanning Repository autorise l''usage en recherche et la redistribution gratuite, mais précise que les modèles ne doivent pas servir à des fins commerciales ni figurer dans un produit vendu sans autorisation, ce qui est incertain pour un projet ouvert qui pourrait plus tard avoir une offre payante. Le fichier de test bunny.pcd de PCL dérive du même scan de Stanford et ne porte aucune licence de données propre (la licence BSD de PCL couvre son code). Les scans sont synthétiques : des échantillons aléatoires denses de la surface du maillage, conservés seulement là où un scanner les voit (test de
  face arrière plus un z-buffer, c''est-à-dire suppression des points cachés), avec un bruit gaussien $\sigma$, quelques pour cent de points aberrants uniformes et un mouvement rigide aléatoire (30–60°, la moitié de la taille de l''objet) appliqué au scan B. La taille de l''objet est la diagonale de sa boîte englobante, ramenée à 1. Chaîne (noms des classes PCL entre crochets) : VoxelGrid ; StatisticalOutlierRemoval ; NormalEstimation avec $k = 15$ voisins et la normale tournée vers le point de vue propre à chaque scan ; FPFH avec $k = 25$ ; correspondances mutuelles les plus proches dans l''espace des descripteurs ; RANSAC avec 4000 hypothèses, chacune de 3 correspondances dont les longueurs des côtés du triangle concordent à 10 % près (comme le CorrespondenceRejectorPoly de PCL), ajustée par Kabsch et notée par le nombre de points conformes, puis réajustée sur ceux-ci ; ICP depuis 6 copies perturbées de la pose RANSAC, contre la cible sous-échantillonnée à la moitié de la taille de voxel,
  en ignorant les paires distantes de plus d''un voxel. Simplifications : FPFH utilise un voisinage fixe de $k$ points au lieu d''un rayon, prend toujours le point courant comme origine du repère de Darboux (PCL choisit l''ordre de la paire selon les angles des normales) et normalise chaque bloc de 11 classes à 100 ; la grille de voxels ne moyenne que les positions. Ce que montre l''exécution par défaut : environ 12000 points visibles par scan deviennent environ 1650 après les deux filtres ; 365 correspondances FPFH mutuelles, dont RANSAC garde 73 (environ 20 %), donnent une pose approximative à 6,4° et 0,056 près ; l''ICP point à plan atteint ensuite 0,37° et 0,0021 (0,2 % de la taille de l''objet, RMSE 0,007) en environ 5 itérations depuis chaque départ, tandis que le point à point glisse encore le long de la surface après 25 itérations (environ 2,1°, 0,018), car les plus proches voisins sur une surface partielle et rééchantillonnée le tirent de côté. Les tests vérifient que Kabsch est
  exact, qu''un mouvement composé avec son inverse donne l''identité, que les normales d''un plan et d''une sphère sont justes, que la grille de voxels concorde avec une référence lente, que les points aberrants lointains sont supprimés, que FPFH est invariant par mouvement rigide, que la visibilité par z-buffer retire la face cachée d''une sphère, que RANSAC résiste à 50 % de mauvaises correspondances, qu''ICP converge, que le point à plan est plus rapide que le point à point sur une surface lisse, et que la chaîne complète descend sous 2° et 2 % de la taille de l''objet. Ce sont des méthodes établies : ICP (Besl et McKay 1992 ; point à plan : Chen et Medioni 1992), FPFH (Rusu, Blodow et Beetz 2009), PCL (Rusu et Cousins 2011, licence BSD, https://pointclouds.org). Le code est écrit à partir des articles, pas traduit de PCL. Essayez un angle de vue plus grand (moins de recouvrement : RANSAC trouve moins de points conformes et peut échouer), plus de points aberrants ou un voxel plus grossier.'
meanings:
- un mouvement rigide par membre du lot $b$ (hypothèse RANSAC ou départ ICP), $j$ sommé
- les $k$ plus proches voisins, un bloc de lignes de la matrice des distances à la fois
- 'VoxelGrid : moyenne par dispersion des points qui partagent une clé de voxel'
- 'StatisticalOutlierRemoval : distance moyenne aux voisins comparée à sa moyenne et à son écart type sur le nuage'
- covariance du voisinage ; le vecteur propre de la plus petite valeur propre est la normale, tournée vers le point de vue
- 'variation de surface (courbure PCL) : 0 sur un plan'
- 'angles du repère de Darboux d''une paire de points : $\alpha = \mathbf v\cdot\mathbf n_q$, $\phi = \mathbf u\cdot\hat{\mathbf d}$, $\theta = \operatorname{atan2}(\mathbf w\cdot\mathbf n_q, \mathbf u\cdot\mathbf n_q)$'
- trois histogrammes de 11 classes ; l'histogramme propre d'un point plus la moyenne de ceux de ses voisins pondérée par la distance
- covariance croisée de Kabsch, une par hypothèse ; une seule SVD par lots donne toutes les rotations
- score RANSAC de toutes les hypothèses à la fois
- pas d'ICP point à plan $\boldsymbol\xi = (\boldsymbol\omega, \delta\mathbf t)$, par lots sur les départs
- erreur de rotation par rapport à la vérité terrain connue
labels:
  n_points: Échantillons de surface par scan
  view_angle: Angle entre les deux points de vue
  noise: Bruit du capteur $\sigma$ (taille de l'objet 1)
  outliers: Fraction de points aberrants
  voxel: Taille de voxel $s$
  hypotheses: Hypothèses RANSAC
  icp_iterations: Itérations ICP
  starts: Départs ICP (par lots)
