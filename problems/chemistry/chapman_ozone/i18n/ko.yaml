title: 채프먼 메커니즘과 오존층
summary: 햇빛이 구동하는 O, O₂, O₃ 사이의 네 반응이 오존층을 만든다. $3\times4$ 화학량론 행렬을 갖는 반응 네트워크 $\dot c = S\,r(c)$로 쓴 이 강성 계를 모든 고도에서 동시에, 뉴턴 단계를 포함한 후진 오일러법으로 일출부터 수 세기 뒤까지 적분한다. O와 O₃는 몇 초 만에 서로 자리를 바꾸고, 홀수 산소는 자리 잡는 데 며칠에서 수 세기가 걸리며, 정상 상태는 약 30 km에서 최대가 된다.
notes: 시드니 채프먼(Sydney Chapman, 1930)은 네 반응으로 오존층을 설명했다. 242 nm보다 짧은 자외선이 $\mathrm{O_2}$를 쪼개고(1), 각 O 원자는 에너지를 가져가는 제3체 $\mathrm M$과 함께 곧바로 $\mathrm{O_2}$에 붙는다(2). 오존은 자외선과 가시광선을 흡수해 다시 분해되며(3), 이것이 지표를 보호하는 방식이지만 "홀수 산소" $\mathrm O_x = \mathrm O + \mathrm{O_3}$를 없애지는 않는다. 그것을 없애는 것은 $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$ (4)뿐이다. 반응 (2)와 (3)은 밀리초에서 분 단위로 O와 $\mathrm{O_3}$를 순환시키고, (1)과 (4)는 성층권 상부에서는 며칠, 아래쪽에서는 수십 년 이상에 걸쳐 총량을 정한다. 시간 척도가 $10^{14}$배 차이 나는 강성 계이므로 양적 방법은 수십억 단계가 필요하지만, 후진 오일러법(어떤 $\Delta t$에서도 안정)은 $\log t$에서 고르게 놓인 300단계면 된다. $S$의 모든 열은 산소 원자를 보존하며, 후진 오일러법은 이러한 선형 불변량을 정확히 유지한다. 두 쌍을 균형시키면 $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$이다. 아래로 내려갈수록 공기(그리고 $[\mathrm{O_2}]^{3/2}$)는 지수적으로 짙어지는 반면 $\mathrm{O_2}$를 쪼개는 빛은 소모되므로, 이 곱은 비스듬한 $\mathrm{O_2}$ 광학 깊이가 약 3인 곳에서 최대가 된다. 속도 상수 $k_2$, $k_4$는 JPL 평가값(근삿값)이다. 광분해 속도는 분자마다 하나의 유효 파장대와 예시용 매개변수를 쓰는데, 이는 태양 스펙트럼에 대한 적분을 대신한 것이며 해는 항상 비춘다고 가정한다. 약 18 km 아래에서는 홀수 산소의 수명이 가장 긴 실행보다도 길어 그 고도들은 끝내
  자리 잡지 못한다. 실제 대기에서는 바람이 오존을 그곳으로 실어 나른다. 채프먼 화학만으로는 오존이 너무 많이 나온다(여기서는 최대 약 $8\times10^{12}$ cm$^{-3}$, 15 km 위로 약 380 DU인데, 관측값은 20–25 km 근처에서 약 $5\times10^{12}$ cm$^{-3}$, 300 DU이다). 빠진 소멸원은 촉매 순환 $\mathrm X + \mathrm{O_3} \to \mathrm{XO} + \mathrm{O_2}$, $\mathrm{XO} + \mathrm O \to \mathrm X + \mathrm{O_2}$로, 촉매 하나가 반응 (4)를 여러 번 수행한다. NOₓ(Crutzen, 1970)와 CFC에서 나온 염소(Molina와 Rowland, 1974)가 그것이며, 오존 구멍과 몬트리올 의정서의 배경이 된 화학이다(1995년 노벨상).
meanings:
- 고도 $a$에서 $\mathrm O$, $\mathrm{O_2}$, $\mathrm{O_3}$의 수밀도, 단위 cm$^{-3}$
- 반응 $r$이 만드는 화학종 $s$의 순 분자 수; 1열은 $\mathrm{O_2} \to 2\,\mathrm O$에 대한 $(2, -1, 0)$
- '반복된 $s$ ⇒ 합산: 각 반응이 만드는 산소 원자 수, 모두 0'
- 네 반응의 질량 작용 속도
- '반복된 $r$ ⇒ 합산: $dc/dt$'
- 네트워크의 야코비 행렬, 반복된 $r$ 합산
- 후진 오일러 단계의 뉴턴 갱신 한 번, 고도마다 $3\times3$ 연립방정식 풀이
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$와 $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$ (JPL, 근삿값)
- 위쪽의 $\mathrm{O_2}$와 $\mathrm{O_3}$ 기둥에 의해 감쇠된 광분해 속도(예시용 단일 파장대 모형)
- $[\mathrm O]$에 대한 이차방정식에서 얻은 정확한 채프먼 정상 상태
labels:
  sza: 태양 천정각
  log10_t_end: 실행 길이 $\log_{10}(t/\mathrm{s})$
  levels: 고도 층 수
