source_hash: 4c18d665b55e
title: 為什麼物質比反物質多？
summary: 宇宙中每個光子約有 $6\times 10^{-10}$ 個重子，而幾乎沒有反物質。沙卡洛夫的三個條件說明任何解釋都需要什麼；輕子生成是主要候選之一：重的馬約拉納微中子衰變成輕子的機率略高於反輕子（CP 不對稱 $\varepsilon$），逆衰變會洗掉其中一部分（強度 $K$），而斯法勒龍過程把輕子轉成重子。上千個 $(\varepsilon, K)$ 模型的波茲曼方程作為一個批次 ODE 一起求解，並與觀測到的 $\eta_B$ 比較。這是一個未解問題。
notes: 觀測：由 CMB 得到重子與光子之比 $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$（Planck 2018，$\Omega_bh^2 = 0.0224$），與大霹靂核合成一致，也沒有反物質星系的跡象。沙卡洛夫（1967）證明，從對稱的宇宙出發，要產生不對稱需要（1）重子數破壞、（2）C 與 CP 破壞，以及（3）偏離熱平衡。測試直接檢驗（2）與（3）：$\varepsilon = 0$，或讓重微中子保持在平衡，結果恰好為零；（1）是標準模型的斯法勒龍過程，在約 130 GeV 以上把 $B - L$ 轉換成 $B = \tfrac{28}{79}(B - L)$。夸克的 CP 破壞（CKM 相位）太小，電弱相變又是平滑過渡（crossover），因此單靠標準模型行不通：需要新物理。輕子生成（Fukugita 與 Yanagida 1986）利用蹺蹺板機制中的重右手微中子，這個機制也能解釋為何輕微中子如此之輕。這個玩具模型只保留最輕的 $N_1$ 的衰變與逆衰變（沒有 $\Delta L = 2$ 散射、味效應或熱修正），採用 Buchmüller、Di Bari 與 Plümacher（2005）的歸一化。弱沖刷（$K \ll 1$）且熱初始條件時保留全部不對稱（$\kappa_f \to 1$，已檢驗）；強沖刷（$K \gg 1$）損失大部分，但會忘記初始條件（兩種起始方式匯合），而求解器與他們的解析擬合相差約 10% 以內。由 $K = \tilde m_1/m_*$、$m_* \approx 1.08\times10^{-3}$ eV，振盪實驗看到的微中子質量（$\approx 0.009$–$0.05$ eV）指向 $K \approx 10$–$50$，此時需要 $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$；Davidson–Ibarra 上限 $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$ 於是要求 $M_1 \gtrsim 10^{10}$ GeV。現狀：未解決。輕子生成很有吸引力，且與所有已知結果相容，但尚未證實：重微中子遠超出對撞機能及的範圍。間接線索包括無微中子雙貝他衰變（馬約拉納性質）和微中子振盪中的
  CP 破壞（T2K、NOvA，以及之後的 DUNE 與 Hyper-Kamiokande）；電弱重子生成和其他機制仍是替代方案。本頁以數值探索這些玩具方程，並不宣稱不對稱就是這樣產生的。
meanings:
- $z = M/T$，對數間隔：宇宙冷卻時時鐘向前走
- CP 不對稱沿第一軸、衰變參數沿第二軸排列：一切廣播到 $(E, K)$
- $\tfrac38 z^2K_2(z)$：相對論性時每個光子 $3/4$，之後為 $e^{-z}$
- 步長中點處每個哈伯時間內的衰變與逆衰變
- $N_N - N_N^{eq}$：偏離平衡的程度（沙卡洛夫條件 3）
- 線性 ODE 的精確單步因子：即使 $K = 1000$ 也穩定
- 每個模型的 $B - L$ 不對稱，每步只用一次張量更新推進
- 斯法勒龍把 $B - L$ 的 $28/79$ 留為重子；光子數增加 $f = 2387/86$ 倍
- 效率：弱沖刷時為 $1$，強沖刷時約 $\approx 1/(K z_B)$
labels:
  log_eps: 顯示的模型：$\log_{10}\varepsilon$
  log_K: 顯示的模型：$\log_{10}K$
  initial: 重微中子的初始豐度
  n_eps: $\varepsilon$ 的網格點數
  n_K: $K$ 的網格點數
  steps: $z$ 的積分步數
  z_max: 最終 $z = M/T$
