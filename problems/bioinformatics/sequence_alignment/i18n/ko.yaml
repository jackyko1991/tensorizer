source_hash: b944848791a5
title: 텐서 갱신의 파면으로 보는 서열 정렬
summary: 동적 계획법으로 DNA 서열을 니들먼–분쉬(전역) 및 스미스–워터맨(국소) 정렬한다. 표의 각 칸은 왼쪽, 위쪽, 대각선 이웃만 필요하므로, 반대각선 $i + j = d$ 전체를 텐서 갱신 한 번으로, 서열 쌍 배치 전체에 대해 한꺼번에 채운다. 파면이 표를 쓸고 지나간 뒤 역추적이 최적 정렬을 읽어 내는 것을 보자.
notes: 전역 정렬은 두 서열을 처음부터 끝까지 정렬하도록 강제한다. 국소 정렬은 선택지 0을 추가하여 나쁜 구간은 그냥 버리고 어디서든 가장 점수가 높은 조각을 보고한다(여기서는 무작위 배경에 심은 모티프). 역추적은 끝 칸에서 거꾸로 걸어가며, 각 단계에서 세 선택지 중 어느 것이 저장된 값을 만들었는지 묻고, 갭 안에 있는 동안에는 표 $H$, $E$, $F$ 사이를 오간다. 비용은 여전히 $O(nm)$ 칸이지만 순차 단계는 $n + m - 1$개뿐이다. 이 반대각선 병렬성이 GPU와 SIMD 정렬기가 작동하는 방식이다. 돌연변이율을 높이거나, 짧은 갭 여러 개보다 긴 갭 몇 개를 선호하도록 $g_o > g_e$로 해 보자. 단백질은 $W$ 대신 BLOSUM62 같은 $20\times20$ 행렬을 쓰며, 그 밖에는 아무것도 바뀌지 않는다.
meanings:
- 쌍 $b$의 첫 번째 서열의 글자 $i$와 두 번째 서열의 글자 $j$, A, C, G, T에 대한 원-핫
- '글자 $\alpha$와 $\beta$를 정렬하는 점수: 대각선은 일치, 나머지는 불일치'
- '반복된 $\alpha, \beta$ ⇒ 합: 가능한 모든 글자 쌍의 점수'
- 글자 $k$개의 갭은 비용 $g_o + (k-1)\,g_e$(아핀). $g_o = g_e$이면 선형 갭
- 반대각선 $d$ 위의 모든 칸. 대각선 $d-1$과 $d-2$에만 의존한다
- '대각선당 텐서 갱신 하나: 일치로 끝나는, $a$의 갭으로 끝나는, $c$의 갭으로 끝나는 최고 점수'
- 전역 점수는 모서리에서, 국소 점수는 최고 칸에서. 각 길이를 넘는 패딩은 무시한다
labels:
  mode: 정렬(전역 = 니들먼–분쉬, 국소 = 스미스–워터맨)
  length: 서열 길이 $L$
  n_pairs: 배치의 쌍 수 $B$
  mutation: 자리당 돌연변이율
  match: 일치 점수
  mismatch: 불일치 점수
  gap_open: 갭 개시 $g_o$
  gap_extend: 갭 연장 $g_e$
