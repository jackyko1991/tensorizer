source_hash: fb9eaaef3d46
title: 3D गॉसियन स्प्लैटिंग (Gaussian splatting)
summary: एक दृश्य को कुछ सौ रंगीन, अर्ध-पारदर्शी 3D गॉसियनों से दर्शाया जाता है। हर एक को परिप्रेक्ष्य मानचित्र के जैकोबियन से कैमरे में प्रक्षेपित किया जाता है, $\Sigma' = J W \Sigma W^{\mathsf T} J^{\mathsf T}$, स्प्लैट गहराई के क्रम में छाँटे जाते हैं और आगे से पीछे अल्फ़ा-संयोजित होते हैं, $C = \sum_i c_i\alpha_i\prod_{j<i}(1 - \alpha_j)$, और Adam हर माध्य, स्केल, घूर्णन, रंग और अपारदर्शिता को एक कृत्रिम दृश्य की तस्वीरों पर फ़िट करता है। एक अलग रखा गया दृश्य जाँचता है कि गॉसियनों ने केवल प्रशिक्षण चित्र नहीं, बल्कि 3D आकृतियाँ सीखी हैं।
notes: 'सत्य दृश्य तीन गोले और एक घन है, जिन्हें Lambertian छायांकन के साथ विश्लेषणात्मक रूप से दृश्य के चारों ओर दो वलयों पर 12 कैमरों में रे-कास्ट किया गया है ($64\times 64$ px); उनके बीच, दूसरी ऊँचाई पर एक 13वाँ कैमरा अलग रखा गया है। गॉसियन एक घन में यादृच्छिक स्थितियों पर, धूसर और धुंधले, यादृच्छिक अभिविन्यासों के साथ शुरू होते हैं। हर Adam कदम ऊपर की पूरी पाइपलाइन से एक प्रशिक्षण दृश्य रेंडर करता है और L1 फ़ोटो त्रुटि को हर माध्य, लॉग-स्केल, क्वाटर्नियन, रंग और अपारदर्शिता में पश्च-प्रसारित करता है। टेंसर पाठ सहप्रसरण बीजगणित है: ऑप्टिमाइज़र कुछ भी करे, $\Sigma = RSS^{\mathsf T}R^{\mathsf T}$ एक मान्य (सममित धनात्मक निश्चित) सहप्रसरण बना रहता है, और प्रक्षेपण रैखिक नहीं है, इसलिए हर गॉसियन को उसके स्थानीय रैखिकीकरण $J$ से गुज़ारा जाता है; 2D स्प्लैट $\Sigma'' = JW\Sigma W^{\mathsf T}J^{\mathsf T}$ einsums की एक श्रृंखला है। दीर्घवृत्त पैनल अलग रखे दृश्य में ये $1\sigma$ दीर्घवृत्त खींचता है। घनत्वीकरण (densification), सरलीकृत: हर 50 कदम पर (पहले 70% में) जिन गॉसियनों के केंद्रों को
  सबसे बड़ी प्रवणताएँ मिलीं, उन्हें $\boldsymbol\mu \pm R\,S\,\boldsymbol\epsilon$ पर दो प्रतियों में बाँटा जाता है और अक्ष 1.6 से सिकोड़े जाते हैं, लगभग पारदर्शी गॉसियनों ($o < 0.05$) का पुनः उपयोग करते हुए, इसलिए $M$ स्थिर रहता है; शोधपत्र इसके बजाय दृश्य-स्पेस प्रवणताओं से क्लोन और विभाजन करता है, छँटाई करता है, अपारदर्शिताएँ रीसेट करता है और लाखों गॉसियनों तक बढ़ता है। Kerbl et al. (SIGGRAPH 2023) की तुलना में अन्य सरलीकरण: गोलीय हार्मोनिक्स के बजाय स्थिर रंग (दृश्य Lambertian है), structure-from-motion बिंदु-मेघ के बजाय यादृच्छिक प्रारंभ, D-SSIM पद के बिना L1 हानि, और एक सघन रास्टराइज़र जो हर स्प्लैट को हर पिक्सेल पर आँकता है (असली वाला GPU पर स्प्लैटों को $16\times 16$ टाइलों में छाँटता है और दूर वालों को छोड़ देता है), इसी कारण छवि छोटी है। अलग रखे दृश्य का PSNR प्रशिक्षण PSNR से थोड़ा नीचे रहता है: कभी न देखे गए दृश्य गॉसियनों को कम बाँधते हैं। कम दृश्य (अलग रखा दृश्य बिगड़ता है), L2 हानि, घनत्वीकरण बंद, या अधिक गॉसियन और कदम (तीखे किनारे) आज़माएँ।'
meanings:
- क्वाटर्नियन से गॉसियन $m$ का घूर्णन, भीतर सामान्यीकृत, इसलिए कोई भी 4 संख्याएँ एक मान्य घूर्णन हैं
- 3D सहप्रसरण, $j$ पर योग; किसी भी प्राचलों के लिए सममित धनात्मक निश्चित, $s = e^{\log s}$
- हर कैमरा फ़्रेम में हर गॉसियन केंद्र (x दाएँ, y नीचे, z = गहराई)
- केंद्रों का पिक्सेल निर्देशांकों पर पिनहोल प्रक्षेपण
- '$\partial\mu''_a/\partial x_i = \begin{pmatrix} f/z & 0 & -fx/z^2\\ 0 & f/z & -fy/z^2\end{pmatrix}$: प्रक्षेपण का स्थानीय रैखिकीकरण'
- हर स्प्लैट का 2D सहप्रसरण, $j, k$ पर योग, $JW = $ einsum('vmai,vij->vmaj') के साथ, साथ में 0.3 px² लो-पास
- 'द्विघात रूप $d^{\mathsf T}\Sigma''^{-1}d$ पिक्सेल के 6 एकपदियों $\varphi = (u^2, 2uv, v^2, u, v, 1)$ में विस्तारित: एक आव्यूह गुणनफल'
- स्प्लैट $m$ पिक्सेल $p$ को कितना ढकता है; $o_m = \sigma(\text{logit})$
- प्रति कैमरा गहराई क्रम; छोटे प्रति-गॉसियन टेंसर बड़े $(V, M, P)$ टेंसरों के बनने से पहले पुनर्व्यवस्थित किए जाते हैं
- 'पारगम्यता: $m$ के आगे के स्प्लैटों के बाद बचा प्रकाश; $m$ के अनुदिश अवर्धमान'
- आगे से पीछे संयोजन, $m$ पर योग; जो प्रकाश पार निकलता है वह सफ़ेद पृष्ठभूमि $b$ दिखाता है
- प्रति कदम एक यादृच्छिक प्रशिक्षण दृश्य पर माध्य निरपेक्ष पिक्सेल त्रुटि; Adam सभी $14M$ संख्याएँ अद्यतन करता है
