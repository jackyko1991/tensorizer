source_hash: 160447300c99
title: MRI：T1・T2 緩和と画像コントラスト
summary: ラジオ波パルスの後、各組織の磁化は磁場方向に時定数 $T_1$ で回復し、横成分は $T_2$ で減衰する。スピンエコー信号を（組織、$TR$、$TE$）を添字とする1つのテンソルとして評価し、模式的な脳の組織ラベルマップと縮約すると、$TR$ と $TE$ の選び方によって画像が T1 強調、PD 強調、T2 強調になる様子がわかる。
notes: 短い $TR$ と短い $TE$ で T1 強調になる：脂肪と白質は明るく、CSF は暗い。CSF の長い $T_1$ が回復する時間がないためである。長い $TR$ と短い $TE$ では $T_1$ の因子が消え、プロトン密度（PD）強調になる。長い $TR$ と長い $TE$ で T2 強調になる：非常に長い $T_2$ をもつ CSF が最も明るい組織になる。この簡単な式は再収束パルスが $M_z$ に及ぼす影響を無視し、$TR \gg TE$ を仮定している。スキャナーの表示と同様に、各画像はそれ自身の最も明るい画素に合わせてウィンドウ調整されている。組織の値は 1.5 T での大まかな教科書的数値であり、教育目的に限り、臨床には使用できない。短い・長い $TR$/$TE$ を動かして、灰白質と白質のコントラストが反転する様子を観察しよう。
meanings:
- $S = 5$ 種類の組織の緩和時間とプロトン密度（1.5 T での近似値）
- 縦緩和による回復。組織 $s$ と時刻 $t$ についてブロードキャスト
- 各組織の横緩和による減衰
- 各組織、繰り返し時間 $TR_a$、エコー時間 $TE_b$ に対するスピンエコー信号（和をとる添字はない）
- one-hot ラベルマップ：画素 $(x, y)$ を占める組織
- 繰り返される $s$ ⇒ 和をとる：各 $(TR, TE)$ に対する画像
- $M_0(1 - 2e^{-t/T_1})$ がゼロを横切る反転時間。脂肪（STIR）や CSF（FLAIR）の信号を抑制するのに使う
labels:
  tr_short: 短い繰り返し時間 $TR$
  tr_long: 長い繰り返し時間 $TR$
  te_short: 短いエコー時間 $TE$
  te_long: 長いエコー時間 $TE$
  size: ファントムのサイズ
  n_frames: アニメーションのフレーム数
