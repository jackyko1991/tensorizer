source_hash: 8522595ab746
title: 馬可夫 Mpemba 效應
summary: 熱水能比溫水更快結冰嗎？對於在晶格位能中以 Metropolis 速率跳躍的粒子，答案是肯定的。主方程 $\dot p = W p$ 只需對角化一次，每個初始溫度以一次 einsum 投影到最慢模態上，而慢模態振幅 $a_2$ 為零的熱起點，弛豫速度比較冷的起點快上指數倍。
notes: 單位：$k_B = 1$，嘗試速率為 1。熱浴溫度為 $T_b$，系統從溫度 $T_0$ 的平衡態出發。若跳躍滿足細緻平衡 $W_{ij}\pi_j = W_{ji}\pi_i$，則 $W$ 相似於一個對稱矩陣，所以其所有特徵值皆為實數且 $\le 0$，穩態為波茲曼分布 $\pi$。短時間後只剩最慢的模態，$p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$，所以 $\lvert a_2\rvert$ 較小的起點最終更接近平衡，不論其溫度為何。由於 $a_2(T_0)$ 不一定單調，較熱的起點可以超越較溫的起點（馬可夫 Mpemba 效應）。在使 $a_2 = 0$ 的特殊溫度 $T^*$，慢模態完全消失，弛豫以較快的速率 $\lambda_3$ 進行（強效應）。在此位能中，這個形狀來自不同盆地之間的競爭。$T_0$ 低時，深而窄的井容納大部分機率。$T_0$ 居中時，寬而淺的井以熵取勝。$T_0$ 高時，抬升的平台被填滿，所以左側盆地的份額回升，並在 $T^*$ 處超過其平衡值。理論出自 Lu & Raz（PNAS, 2017）。Kumar & Bechhoefer（Nature, 2020）以置於光學塑形雙井位能中的膠體微珠觀測到此效應，包括強效應版本。Kumar、Chétrite & Bechhoefer（PNAS, 2022）接著觀測到反向效應（異常加熱）。近來在囚禁離子實驗中也報告了量子類比。此晶格是那些系統的玩具版本。試試提高 $T_b$：超過約 $1.4$ 時交叉便消失。
meanings:
- 位點 $i$ 的階梯狀能量：平台、深窄井、能障、寬淺井
- 鏈上最近鄰為 1，否則為 0
- 跳躍 $j \to i$ 的速率；對角項使每一欄總和為零
- 每個初始溫度 $T_{0,b}$ 下的波茲曼態，一批起點
- 重複的 $j$ ⇒ 求和：所有起點同時的主方程
- 對稱化的 $\Pi^{-1/2} W \Pi^{1/2}$ 做 eigh；$\lambda_1 = 0$ 為平衡，$\lambda_2$ 為最慢衰減
- 重複的 $i$ ⇒ 求和：每個起點與每個模態的重疊
- 重複的 $k$ ⇒ 求和：每個時刻的精確解
- 到平衡的 Kullback–Leibler 距離，$\sum_i p_i \ln(p_i/\pi_i)$
labels:
  T_bath: 熱浴溫度 $T_b$
  barrier: 能障高度 $U_\text{bar}$
  T_hot: 熱起點 $T_\text{hot}$
