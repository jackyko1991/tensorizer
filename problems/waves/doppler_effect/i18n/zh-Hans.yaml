source_hash: 698c7a054398
title: 多普勒效应与马赫锥
summary: 以速度 $v_s$ 运动的波源每个周期发出一个圆形波前。每个波前是张量中的一行（发出时刻，发出位置），所以任意时刻的半径只需一次减法。波前在前方密集、在后方稀疏；超过声速时，它们堆积成马赫锥。
notes: 听到的频率就是每秒到达的波前数：在波源前方，波前发出时彼此更近，所以 $f' = f\,c/(c - v_s)$；在后方，$f' = f\,c/(c + v_s)$。听者位于运动直线上，这些公式在此严格成立。当 $v_s > c$（马赫数 $M = v_s/c > 1$）时，波源跑在自己的声音前面：所有波前都与两条直线相切，即半顶角为 $\mu$ 的马赫锥，$\sin\mu = 1/M$。这时前方的听者在锥面经过之前什么也听不到，而且波前以相反的顺序到达。声速 $c = 340$ m/s；只有波源运动，空气静止。
meanings:
- 每个周期 $1/f$ 发出一个波前
- 发出波前 $e$ 时波源所在的位置
- 每个波前在时刻 $t$ 的半径（尚未发出则为零）
- 波源前方和后方的听者
- 重复的 $i$ ⇒ 求和：每个发出点到每个听者的距离平方
- 波前 $e$ 到达听者 $o$ 的时刻
labels:
  mach: 马赫数 $v_s/c$
  f: 波源频率 $f$（所画波前数）
  t_max: 模拟时长
