title: रदरफ़ोर्ड प्रकीर्णन
summary: ऐल्फ़ा कणों का एक पुंज सोने के नाभिक पर दागा जाता है। हर ऐल्फ़ा को प्रतिकर्षी कूलॉम क्षेत्र में RK4 से एक बैच टेंसर में समाकलित किया जाता है, और उनके प्रकीर्णन कोणों का हिस्टोग्राम रदरफ़ोर्ड का $1/\sin^4(\theta/2)$ नियम पुनः उत्पन्न करता है — यह प्रमाण कि परमाणु का धनावेश एक अत्यंत छोटे नाभिक में स्थित है।
notes: 'मात्रक: fm, MeV और समय fm/$c$ में। हर पथ के अनुदिश ऊर्जा और कोणीय संवेग संरक्षित हैं, इसलिए केवल $E$ और संघट्ट प्राचल $b$ विचलन $\theta = 2\arctan(k/2Eb)$ तय करते हैं; सीधी टक्कर वाला ऐल्फ़ा $d = k/E$ पर मुड़ जाता है (सोने पर 5 MeV के लिए लगभग 45 fm, जो 7 fm नाभिक से अब भी बहुत बाहर है, अतः शुद्ध कूलॉम नियम लागू होता है)। पुंज त्रिज्या $b_{\max}$ की एक चकती पर एकसमान फैला है (यादृच्छिक पर स्थिर seed के साथ), अतः किसी घन कोण में प्रकीर्णित संख्या (प्रति क्षेत्रफल ऐल्फ़ा) × $d\sigma/d\Omega$ है। कुछ सौ में से केवल एक ऐल्फ़ा 90° से अधिक पीछे लौटता है — 1909 में गाइगर और मार्सडेन का आश्चर्य। सरलीकरण: नाभिक एक स्थिर बिंदु आवेश है (कोई प्रतिक्षेप नहीं, कोई नाभिकीय बल नहीं) और गति अनापेक्षिकीय है ($v \approx 0.05c$)। हर ऐल्फ़ा 30 $d$ दूर से ठीक उतनी ऊर्जा और कोणीय संवेग के साथ शुरू होता है जितना अनंत से आते ऐल्फ़ा का होता; बल की शेष $1/r^2$ पूँछ कोणों को एक डिग्री से बहुत कम खिसकाती है।'
meanings:
