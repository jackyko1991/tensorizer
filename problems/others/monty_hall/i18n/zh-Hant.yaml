source_hash: 695e730c122f
title: 有 $N$ 扇門的蒙提霍爾問題
summary: 一輛汽車藏在 $N$ 扇門的其中一扇後面。你選一扇；知道汽車位置的主持人打開 $N-2$ 扇後面是山羊的門，並讓你改選最後一扇關著的門。對每個從 3 到 1000 的 $N$，數百萬局遊戲在一個 $(B, G)$ 張量中同時進行：換門的獲勝機率是 $(N-1)/N$（三扇門時就是著名的 $2/3$），不換則是 $1/N$，而每條累積勝率都保持在它的二項誤差帶之內。
notes: 只有當你第一次就選中汽車時，換門才會輸，而這發生的機率是 $1/N$；其他每一次，主持人的選擇都是被迫的，所以他留下沒開的那扇門承載了他打開的所有門的資訊。有 1000 扇門時答案顯而易見，而論證和三扇門時完全相同。這個謎題因 Marilyn vos Savant 1990 年的雜誌專欄而聲名大噪，當時許多讀者（其中不乏數學家）堅持答案是 $1/2$。這個直覺對另一種遊戲是正確的：選擇不知情的主持人，他隨機開門，有時會把汽車揭露出來。丟掉這些局（只有比例 $2/N$ 的局留下）後，不換與換門的勝率都正好是 $1/2$，因為隨機開門對你的門沒有提供任何資訊。終端機也會檢查沒有哪個初始選擇是特殊的，而測試中一個逐局進行的慢速參考實作與張量版本結果一致。
meanings:
- 並排比較的門數，從 3 到 1000
- 第 $b$ 列第 $g$ 局的汽車門與初始選擇，在 $N_b$ 扇門上均勻分布；廣播讓每一列有各自的 $N_b$
- 主持人留下沒開的門：你選到山羊時必定是汽車門，你選到汽車時則是隨機的一扇門
- 主持人打開的 $N-2$ 扇門：除了 $p$ 和 $k$ 以外的每一扇門
- 不換獲勝與換門獲勝；每局中恰有其中一個成立
- 累積勝場除以累積有效局數：每局之後的勝率
- 二項比例的 $\pm 2\sigma$ 帶，累積勝率約有 95 % 的時間落在其中
labels:
  n_games: 每種門數的遊戲局數 $G$
  max_doors: 最大門數 $N$
  host: 主持人
