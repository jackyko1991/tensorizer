source_hash: 2633dfd2d254
title: Trouver le boson de Higgs dans de vraies données diphotons
summary: 'Environ 95 000 paires de photons issues de 10 fb$^{-1}$ de vraies collisions ATLAS à 13 TeV (ATLAS Open Data, CC0) sont réparties en classes de masse diphoton $m_{\gamma\gamma}$ et ajustées avec autograd : un fond lisse et décroissant plus un pic de Higgs étroit. Le rapport de vraisemblance profilée donne $m_H$, l''intensité du signal $\mu$ et la significance locale $Z = \sqrt{q_0}$ ; un lot d''expériences simulées avec fond seul montre l''effet de recherche ailleurs (look-elsewhere), et le potentiel en chapeau mexicain $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ transforme la masse mesurée en auto-couplage du Higgs $\lambda = m_H^2/2v^2$.'
notes: 'En juillet 2012, ATLAS et CMS ont annoncé un nouveau boson vers 125 GeV, observé surtout dans deux canaux : deux photons et quatre leptons. Le prix Nobel de physique 2013 a été décerné à Englert et Higgs pour le mécanisme qu''il confirmait. Ici, le canal photonique est refait sur de vraies données. Le Higgs ne peut pas se désintégrer directement en photons (ils sont sans masse), seulement via des boucles de bosons W et de quarks top : c''est donc une désintégration rare ($\mathcal B \approx 0.23\%$) au-dessus d''un énorme fond lisse de paires de photons ordinaires. Avec les 10 fb$^{-1}$ de ce fichier, on obtient $m_H \approx 124.2 \pm 1.0$ GeV (PDG 2024 : $125.20 \pm 0.11$), $\mu \approx 1.0 \pm 0.4$ (le taux du Modèle standard) et une significance locale d''environ $2.7\sigma$ (environ $3.4\sigma$ attendus). C''est un excès, pas une découverte : les découvertes de 2012 ont combiné plusieurs catégories d''événements, les deux canaux et les deux expériences pour dépasser $5\sigma$.
  Le balayage est aussi un avertissement utile : dans ce petit échantillon, une fluctuation du fond vers 143 GeV est presque aussi grande ($2.6\sigma$ en local) que le vrai Higgs à 124 GeV. C''est l''effet de recherche ailleurs. Une bosse quelque part dans une large fenêtre est probable, donc les expériences simulées estiment à quelle fréquence le fond seul en produit une : environ 13 % des balayages avec fond seul dépassent quelque part l''excès à 125 GeV, et la formule des franchissements de Gross–Vitells donne une valeur p globale proche de 0,1. À masse fixée, les expériences simulées avec fond seul suivent $\tfrac12\delta(0) + \tfrac12\chi^2_1$ (Wilks/Chernoff), d''où $Z = \sqrt{q_0}$. Le chapeau mexicain : avec $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV tiré de la durée de vie du muon, la masse mesurée fixe $\lambda = m_H^2/2v^2 \approx 0.13$ ; l''oscillation radiale autour de l''anneau de vides est le boson de Higgs, et la direction plate le long de l''anneau devient la polarisation longitudinale
  des W et Z. Données : ATLAS Open Data 13 TeV, version 2020, échantillons GamGam (CERN Open Data Portal, enregistrement 15006, doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS, licence CC0 ; périodes de données 2016 A–D). Sélection comme dans le notebook de vulgarisation ATLAS H → γγ : déclenchement photon, deux photons isolés de qualité « tight » avec $p_T > 40$ et 30 GeV, $|\eta| < 2.37$ hors de 1,37–1,52. La colonne sm_signal est la simulation ATLAS correspondante (ggF, VBF, WH, ZH, ttH à 125 GeV) pondérée à 10 fb$^{-1}$, ce qui donne $N_{SM} \approx 406$ événements et la largeur du pic. Simplifications : une seule catégorie inclusive, un pic gaussien (le vrai a des queues, c''est pourquoi la largeur ajustée d''environ 2,3 GeV dépasse la résolution du cœur), aucune incertitude systématique, et un fond exponentielle-polynôme (variez le degré pour voir la sensibilité au signal parasite).'
meanings:
- nombres réels de diphotons par classe de 0,5 GeV ; tout CSV avec m_low, m_high, events convient
- puissances de la masse normalisée $x \in [0, 1]$ ; le fond vaut $\exp(X\theta)$
- pic gaussien intégré sur chaque classe (erf), largeur $\sigma$ ajustée sur la simulation ATLAS
- vraisemblance de Poisson de chaque histogramme, minimisée par Adam + L-BFGS via autograd
- '$n$ répété ⇒ sommé : le scoring de Fisher ajuste chaque expérience simulée × chaque masse d''un seul coup'
- rapport de vraisemblance profilée, nul lorsque le signal ajusté est négatif
- incertitudes sur $m_H$ et $\mu$ tirées de la courbure de $-\ln L$
- 'potentiel le long de trois rayons $\phi = r\,e^{i\alpha}$ du plan complexe : la même courbe pour chaque phase, un anneau de vides en $|\phi| = v/\sqrt2$'
labels:
  m_min: Début de la fenêtre d'ajustement
  m_max: Fin de la fenêtre d'ajustement
  degree: Degré du polynôme de fond dans l'exposant
  m_start: Masse de départ de l'ajustement
  scan_step: Pas du balayage en masse
  n_toys: Expériences simulées avec fond seul
