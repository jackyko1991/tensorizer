source_hash: 433f576ee66b
title: 'От рентгенограммы грудной клетки к заключению через DAG-тензор: сшитые CNN и крошечная LM'
summary: 'Учебная игрушка, а не генерация клинических заключений. Небольшая CNN учится распознавать шесть находок на 410 рентгенограммах грудной клетки NIH, а крошечная посимвольная GPT учится писать шаблонные заключения ("enlarged heart. pleural effusion. no pneumothorax.") по записанному заголовку с метками; каждая модель обучается отдельно. Их соединяет одно ребро DAG: коннектор превращает вероятности находок от CNN в мягкий заголовок, и LM пишет заключение только по изображению. Сам процесс обучения тоже является тензорным DAG (правила по уровням, критический путь в max-plus, один пакетный вызов на правило по всем сидам); он сравнивается с той же сетью, обученной сквозным образом при тех же вычислительных затратах, а затем дообучается на 251 реальном тексте (подпись к рисунку + предложения, ссылающиеся на эту рентгенограмму) из статей PubMed Central под открытой лицензией (CC BY). Этап 2 получился слабым, как и ожидалось при столь малом числе пар, и страница прямо об этом говорит.'
notes: 'Что это такое. Учебная игрушка, а не генерация клинических заключений: крошечные модели, изображения 64×64, несколько сотен зашумлённых меток и никаких настоящих рентгенологических заключений. Ничто здесь ничего не говорит о клинической точности. Идея (сети обучаются по отдельности, соединяются через DAG-тензор, оптимизируются глобально, а весь процесс сам управляется DAG-тензором) принадлежит Jacky Ka Long Ko; эта задача переносит сшивание CNN и крошечной LM из предыдущей задачи этой серии на рентгенограммы грудной клетки и на текст, похожий на (очень короткое) заключение. Почему нет настоящих заключений. Ни один из открыто доступных наборов заключений не проходит используемое здесь лицензионное правило (открытый, допускает распространение и коммерческое использование): IU X-ray / OpenI (Demner-Fushman et al. 2016) распространяется под CC BY-NC-ND; MIMIC-CXR (Johnson et al. 2019), VinDr-CXR и BRAX требуют аккредитованного доступа по соглашениям об использовании данных; CheXpert
  и PadChest предназначены только для исследований. Поэтому на этапе 1 используются шаблонные заключения, сгенерированные в коде из наборов меток NIH, что превращает задачу в многометочную классификацию, выраженную текстом, а на этапе 2 — подписи к рисункам плюс предложения, ссылающиеся на рисунок, из статей PubMed Central под CC BY: короткие, разнородные тексты, написанные для описаний клинических случаев и часто указывающие на стрелки и панели. Что здесь нового, а что нет. Генерация заключений по рентгенограммам грудной клетки — активная область (Jing et al. 2018, R2Gen от Chen et al. 2020); предобученный кодировщик изображений, соединённый с языковой моделью небольшим обучаемым коннектором, — именно так устроены LLaVA (Liu et al. 2023) и BLIP-2 (Li et al. 2023). Эта задача добавляет оркестровку: и граф модели, и процесс обучения выполняются тензорным DAG-движком из задачи о рабочем процессе Circle of Willis (граф правил разбирается из data/training.smk, граф заданий через произведение
  Кронекера, булевы уровни, критический путь в max-plus), каждое правило — один пакетный вызов по всем сидам, а построенная через DAG модель сравнивается с монолитом при тех же вычислительных затратах. Данные. NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center; без ограничений на использование, с указанием авторства): 549 фронтальных снимков в проекции PA, по одному на пациента, шесть находок (кардиомегалия, выпот, инфильтрация, ателектаз, пневмоторакс, образование или узел) или ни одной, не более двух на снимок; 410 для обучения, 139 для теста. Метки извлечены из заключений методами NLP и зашумлены (около 10 % или больше ошибочны). PMC: 316 рисунков с рентгенограммами грудной клетки из 316 статей открытого доступа, все под CC BY (проверено по лицензии в собственном XML статьи; правило: CC BY, CC BY-SA или CC0, отклонять NC, ND, прочие или отсутствующие). Кандидаты взяты из метаданных ROCOv2 (Rückert et al. 2024), которые использовались только как указатель PMCID; ничего из ROCOv2 в
  комплект не входит. Из 2114 проверенных статей 1575 приняты и 539 отклонены по лицензии (все CC BY-NC). Текст этапа 2 — это подпись, за которой следуют предложения той же статьи, ссылающиеся на рисунок (в 315 из 316 статей есть хотя бы одно), только целые предложения, до 360 символов — это контекст крошечной LM: медиана 35 слов (IQR 26–45) против 12 (8–18) для одной лишь подписи. Каждый рисунок и текст указан с авторством в data/ATTRIBUTION.csv; в data/SOURCES.md — источники, условия, количества, контрольные суммы и обработка. Модели и DAG обучения. CNN: три групповые свёртки, 41 014 весов, шесть сигмоидных выходов (многометочная классификация, положительные примеры взвешены по их редкости). LM: двухслойная посимвольная GPT (d = 32, четыре головы, 40 108 весов), обученная на всех шаблонах, с заголовком меток из шести букв в начале ("ce----", затем "enlarged heart. pleural effusion."). Коннектор (2848 весов): из шести вероятностей $q$ и вектора слота $S_t$ он строит $K = 6$ мягких токенов,
  заменяющих заголовок. Уровни: 0 train_cnn ∥ train_lm ∥ train_monolith; 1 train_connector (CNN и LM заморожены); 2 global_finetune ∥ train_router; 3 caption_finetune (коннектор + LM на текстах PMC, CNN заморожена); 4 evaluate. Тесты проверяют уровни и критический путь, нильпотентность графа заданий, то, что два сида в одном стеке обучаются ровно так же, как каждый по отдельности (с точностью до округления float32), что функция потерь одной модели не посылает градиента другим, что этап коннектора меняет только коннектор и что слой MoE с фиксированным маршрутизатором совпадает с DAG-соединением до 1e-6, включая градиенты. Заключения пишутся жадно (с кэшем ключей/значений, проверенным против обычного прямого прохода) и разбираются обратно в метки по ключевым словам с учётом отрицания ("no pneumothorax."). Результаты этапа 1 (2 сида, 139 тестовых снимков, средние по сидам; все числа — в results/stages.csv). Одна CNN: средний AUROC 0.62 (случайный уровень 0.5), micro F1 0.31 при пороге 0.5 (случайное
  угадывание с частотой из обучающей выборки: 0.16). Её метки, записанные как заголовок для одной LM: micro F1 0.32, то есть LM верно переводит метки в текст (0.90 её выходов — правильно оформленные шаблоны, даже для наборов меток, которых она никогда не видела). Сшитая модель: micro F1 0.22 после этапа коннектора и 0.20 после глобального дообучения (от 0.15 до 0.25 по запускам и сидам), каждое заключение — правильно оформленный шаблон, 0.26–0.27 — в точности шаблон истинных меток. Монолит, та же сеть, обученная сквозным образом на 410 парах изображение–заключение с тем же числом умножений-сложений (405 совместных шагов), пишет "clear lungs." или "normal chest." для каждого снимка: micro F1 0, точное совпадение 0.27 (доля нормальных снимков). Итак, DAG-конвейер явно превосходит монолит, потому что повторно использует надзор по меткам для CNN и весь шаблонный текст, но не превосходит одну CNN: шаблонное заключение может лишь пересказать то, что знает классификатор, а сшитая модель, обученная
  по правдоподобию, пишет наиболее вероятное заключение, которое склоняется к «норме», когда снимок неоднозначен, тогда как взвешенный по редкости порог CNN благоприятствует полноте, которую вознаграждает $F_1$. Дообучение мало что меняет. Ребро DAG = диспетчеризация MoE. Входной слой как смесь экспертов (эксперт изображений = CNN + коннектор, текстовый эксперт = эмбеддинг токенов) с $G$, one-hot по типу данных, даёт в точности выходы DAG-соединения (проверено тестом). Линейный маршрутизатор, обученный как плотная смесь при замороженных экспертах и затем используемый в режиме top-1 (сначала маршрутизация, затем запуск выбранного эксперта), направляет каждую позицию к эксперту её модальности (точность маршрутизации 1.00 в обоих сидах), поэтому его заключения и оценки совпадают с фиксированным маршрутизатором. Результаты этапа 2 (65 отложенных рисунков PMC): слабые, как и ожидалось. После 150 шагов на 251 тексте модель пишет "chest x-ray showing", а затем буквенную кашу: BLEU-1 0.05, ROUGE-L
  0.06, полнота по ключевым словам находок 0, перекрёстная энтропия на отложенных данных 2.32 ната на букву. Если подать ей изображение от другого рисунка, ничего не меняется (2.32 ната, те же оценки): изображение не используется. Слепой базовый вариант, возвращающий один фиксированный обучающий текст, набирает больше (BLEU-1 0.17, ROUGE-L 0.22). Посимвольная LM с 40 000 весов не может выучить этот язык примерно по 70 000 символов за минуту на CPU; с подписями из первого предложения в одной из прежних версий (медиана 6 слов) ROUGE-L был около 0.28, но те тексты едва ли были предложениями. Механизм DAG работает; данных для этапа 2 слишком мало. Время. На 6-ядерном настольном CPU обучение занимает около 85 с, когда машина не загружена, плюс около 30 с на GIF; измеренные времена вырастают в два-три раза, когда машину делят другие тяжёлые задачи (запуск, показанный в GIF и timings.csv, сделан под такой нагрузкой, поэтому его секунды больше), сильнее всего страдает этап подписей. При одном исполнителе
  на правило критический путь в max-plus: CNN → коннектор → дообучение → подписи → evaluate. Код выбирает GPU, если torch его видит (pixi run -e cuda); в окружении по умолчанию стоит сборка torch для CPU, поэтому все прилагаемые числа получены на CPU. Попробуйте. Больше шагов на подписях (этап 2 улучшается медленно), без глобального дообучения (0 шагов), меньше шагов CNN (CNN ограничивает всё) или один сид, чтобы увидеть, насколько расходятся сиды.'
meanings:
- правило $s$ читает то, что пишет правило $r$; процесс обучения разобран из data/training.smk парсером задачи Circle of Willis
- 'уровень каждого правила: CNN, LM и монолит на 0, коннектор на 1, дообучение и маршрутизатор на 2, подписи на 3, evaluate на 4'
- времена завершения в max-plus по измеренным длительностям правил; $\max t$ — критический путь
- шесть вероятностей находок от CNN (сигмоида, многометочная классификация) для каждого снимка; ось моделей $m$ становится группами одной групповой свёртки на слой
- 'ребро DAG: вероятности находок плюс вектор слота $S_t$ → входной вектор LM; $K = 6$ мягких токенов заменяют записанный заголовок меток'
- 'маршрутизатор: one-hot по типу данных (слот заголовка или буква) или обучаемый softmax по признакам позиции (обучается плотно, используется top-1)'
- 'повторяющийся $x$ ⇒ суммирование: объединение в слое MoE; каждый эксперт $Y^x$ вычисляется только на назначенной ему группе'
- логиты следующей буквы крошечной GPT (внимание через einsum с осью моделей, из chain_of_thought)
- потери каждой модели на буквах заключения после заголовка (наты); сумма $M$ потерь даёт каждой модели её собственный градиент
- 'повторяющийся $n$ ⇒ суммирование: истинно положительные среди меток, разобранных обратно из каждого написанного заключения; micro $F_1$ объединяет их по $f$'
labels:
  seeds: Сиды (независимые повторы)
  steps_cnn: Шаги предобучения CNN
  steps_lm: Шаги предобучения LM (шаблонные заключения)
  steps_con: Шаги коннектора (CNN и LM заморожены)
  steps_ft: Шаги глобального дообучения
  steps_router: Шаги обучаемого маршрутизатора
  steps_cap: Шаги дообучения на подписях (этап 2)
  lr_ft: Скорость обучения при дообучении
  lr_cap: Скорость обучения на подписях
