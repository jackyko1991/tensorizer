<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Doppler ultrasound: a transducer above a blood vessel sends a beam at angle theta to the flow; blood moves with a parabolic velocity profile">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- vessel -->
    <rect x="10" y="95" width="220" height="40" fill="#93c5fd" fill-opacity="0.35"/>
    <line x1="10" y1="95" x2="230" y2="95" stroke="#374151" stroke-width="2"/>
    <line x1="10" y1="135" x2="230" y2="135" stroke="#374151" stroke-width="2"/>
    <line x1="10" y1="115" x2="230" y2="115" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- parabolic velocity profile -->
    <path d="M40,95 Q120,115 40,135" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <g stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="40" y1="101" x2="58" y2="101"/>
      <line x1="40" y1="108" x2="73" y2="108"/>
      <line x1="40" y1="115" x2="78" y2="115"/>
      <line x1="40" y1="122" x2="73" y2="122"/>
      <line x1="40" y1="129" x2="58" y2="129"/>
    </g>
    <text x="24" y="153" font-style="italic">v(r)</text>
    <!-- red blood cells -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <circle cx="172" cy="104" r="3"/><circle cx="196" cy="121" r="3"/><circle cx="214" cy="106" r="3"/>
      <circle cx="160" cy="126" r="3"/><circle cx="186" cy="112" r="3"/><circle cx="220" cy="128" r="3"/>
    </g>
    <!-- beam and angle -->
    <line x1="148" y1="49.2" x2="101" y2="130.6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M136,115 A26,26 0 0 0 123,92.5" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="138" y="108" font-style="italic" fill="#b45309">θ</text>
    <!-- transducer -->
    <g transform="translate(151.5,43.1) rotate(30)">
      <rect x="-18" y="-6" width="36" height="12" rx="2" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    </g>
    <path d="M146.8,63.1 A14,14 0 0 1 136.5,57.2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M145.9,73.1 A24,24 0 0 1 128.3,63" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="176" y="44" font-style="italic">f₀</text>
  </g>
</svg>
