source_hash: 7a350e6eef20
title: ホーキング放射とブラックホールの蒸発
summary: ブラックホールはホーキング温度 $T_H = \hbar c^3/(8\pi G M k_B)$ の黒体のように輝く。1 回のブロードキャストで多数の質量と波長に対するプランクの法則を一度に評価し、RK4 で質量損失 $dM/dt = -\alpha/M^2$ を積分する。ブラックホールは縮み、熱くなり、$t \propto M^3$ の後に爆発的に終わる。
notes: すべて SI 単位。太陽質量のブラックホールは $6\times10^{-8}$ K で、2.7 K のマイクロ波背景放射よりはるかに冷たいため、実際の天体ブラックホールは放出より吸収のほうが多い。蒸発するのはごく小さな（原始）ブラックホールだけで、ビッグバンで生まれた約 $2\times10^{11}$ kg のものがちょうど今、蒸発を終えつつあるはずである。このモデルは光子のみを数え、地平面を面積 $4\pi r_s^2$ の完全黒体として扱う。実際のブラックホールはニュートリノや重力子、十分に熱ければより重い粒子も放出するため寿命は短くなり、灰色体因子がスペクトルの形を変える。時間刻みは、各 RK4 ステップが残りの質量の一定割合を消費するように選ぶ。アニメーションは $\log M$ の等間隔で進むので、最後の数コマはごく短い時間しか表さない。地平面半径は見えるように $M^{0.35}$ として描いている。
meanings:
- ブラックホール質量のバッチ（kg）：太陽、地球、…、アニメーションのブラックホール
- ホーキング温度、要素ごと
- 対数間隔の波長グリッド
- T[:, None] と lam[None, :] のブロードキャストによるプランクスペクトル
- ウィーンの法則 $b/T_H$
- 地平面からのシュテファン–ボルツマン放射パワー
- $-P/c^2$、RK4 で積分
- 解析的な寿命、積分結果と比較
labels:
  log10_mass: 初期質量 $\log_{10}(M_0/\mathrm{kg})$
  burn_fraction: RK4 1 ステップあたりに消費する質量の割合
