<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A smooth wavy sheet in a higher-dimensional flat space is projected straight down onto a line; where the sheet turns over, the projection folds and the shadow density spikes">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- the smooth sheet, an S-shaped curve that turns over -->
    <path d="M30,40 C90,30 150,90 90,80 C40,72 120,20 200,50" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="204" y="46" font-style="italic">Σ</text>
    <!-- projection lines at the two folds -->
    <line x1="114" y1="72" x2="114" y2="124" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <line x1="72" y1="62" x2="72" y2="124" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="120" y="104" font-style="italic" fill="#b91c1c">P</text>
    <!-- the screen -->
    <line x1="20" y1="130" x2="220" y2="130" stroke="#374151" stroke-width="2"/>
    <!-- shadow density with spikes at the folds -->
    <path d="M30,150 L72,150 L72,134 Q74,146 90,147 Q110,146 112,134 L114,134 L114,150 L200,150" fill="#93c5fd" fill-opacity="0.5" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="146" font-style="italic" fill="#b45309">ρ(x)</text>
    <text x="20" y="24" font-style="italic" fill="#374151">ℝ</text>
    <text x="30" y="18" font-size="10" font-style="italic" fill="#374151">D</text>
  </g>
</svg>
