title: प्रक्षेपण की तहों के रूप में विलक्षणताएँ
summary: 'एक काल्पनिक परिकल्पना, स्थापित भौतिकी नहीं: वक्र दिक्काल समतल उच्च-विमीय स्थान में एक सतह की छाया है, और विलक्षणता वह जगह है जहाँ यह छाया तह हो जाती है। पहले ज्ञात ज्यामिति की जाँच की जाती है। फ़्लैम का परवलयज और फ़्रॉन्सडल का 1959 का संपूर्ण श्वार्ज़शील्ड दिक्काल का छह समतल विमाओं में अंतःस्थापन मीट्रिक को ठीक-ठीक वापस देते हैं (autograd), और क्रेत्शमान अदिश $12r_s^2/r^6$ उसी स्वचालित अवकलन से निकलता है। प्रक्षेपित परतें सार्वभौमिक घनत्व घातांकों के साथ तह होती हैं: तह के लिए $-1/2$, कस्प के लिए $-2/3$। तह-आकार का आंतरिक भाग बाहरी भाग को ठीक श्वार्ज़शील्ड छोड़ देता है, इसलिए वह क्षितिज के पीछे छिप जाता है। यहाँ कुछ भी सीधे प्रेक्षित नहीं किया जा सकता।'
notes: 'प्रक्षेपण परिकल्पना का चरण 4 (श्रृंखला का विवरण देखें), जो लेखक की काल्पनिक परिकल्पना है, स्थापित भौतिकी नहीं। चरण 1 (cosmology/projection_postulate) अभिगृहीत P4 बताता है: वक्र दिक्काल एक समतल उच्च-विमीय अंतःस्थापन का प्रक्षेपित आकार है, और विलक्षणता वह जगह है जहाँ प्रक्षेपण तह होता है (उसका जैकोबियन कोटि खो देता है)। चरण 3 (cosmology/projection_dimension_budget) विमाएँ गिनता है, चरण 5 (cosmology/projection_bell_test) मापन अभिगृहीतों को परखता है, और चरण 6 (cosmology/projection_telescope_tests) देखता है कि दूरबीनें क्या परख सकती हैं। समतल विमाओं की संख्या $D$ खुली रहती है: यहाँ यह एक प्राचल है और किसी परिणाम में कभी प्रवेश नहीं करती। पहले ज्ञात ज्यामिति। (a) फ़्लैम (1916): श्वार्ज़शील्ड का विषुवतीय खंड $t = $ const, $\theta = \pi/2$, समतल $\mathbb R^3$ में खींचा गया, परवलयज $z = 2\sqrt{r_s(r-r_s)}$ है, और उसका प्रेरित मीट्रिक $dr^2/(1-r_s/r) + r^2d\phi^2$ $10^{-16}$ तक मेल खाता है। (b) फ़्रॉन्सडल (Phys. Rev. 116, 778, 1959) संपूर्ण श्वार्ज़शील्ड दिक्काल को, क्षितिज के भीतर भी, समतल
  $\mathbb R^{1,5}$ में अंतःस्थापित करते हैं। प्रेरित मीट्रिक $\eta_{AB}\partial_iz^A\partial_jz^B$, autograd से लिए गए जैकोबियन के साथ, बाहर और भीतर, और क्षितिज के पार क्रुस्कल निर्देशांकों में, श्वार्ज़शील्ड से $10^{-13}$ तक मेल खाता है। वक्र 4D ज्यामिति को सचमुच समतल स्थान में एक सतह के रूप में देखा जा सकता है; यही P4 का आधार है। P4 के लिए दो तथ्य मायने रखते हैं। क्षितिज पर अंतःस्थापन पूर्ण कोटि का है: $(t, r)$ निर्देशांकों में दिखने वाली कोटि-हानि क्रुस्कल निर्देशांकों में गायब हो जाती है। $r\to0$ पर भी यह तह नहीं होता; यह अनंत की ओर भाग जाता है, $z^2\approx-2r_s^{3/2} r^{-1/2}$। वक्रता, उसी स्वचालित अवकलन (क्रिस्टोफ़ेल प्रतीक, रीमान टेन्सर, einsum संकुचन) से गणना करने पर, $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$ देती है, $10^{-15}$ तक। स्थैतिक ज्वारीय अभिलक्षणिक मान $+r_s/r^3$ (त्रिज्य खिंचाव) और $-r_s/2r^3$ (पार्श्व दबाव) हैं, जो सभी $r = 0$ पर अपसारी होते हैं। P4 का दावा, ठोस रूप में: समतल $\mathbb R^D$ में एक चिकनी परत, एक प्रक्षेपण से देखने पर, ऐसी छाया बनाती है जिसका घनत्व तह कॉस्टिक
  पर अपसारी होता है। आपदा सिद्धांत (थॉम, आर्नोल्ड) कहता है कि घातांक सार्वभौमिक है। प्रतिचित्रण $x = s^n$ से $\rho\propto|x|^{1/n-1}$ मिलता है, जो $-0.500$ (तह), $-0.667$ (कस्प) और $-0.750$ ($n = 4$) मापा गया। एक गोला $S^k$, $\mathbb R^3$ पर प्रक्षेपित, किनारे पर घनत्व $u^{(k-3-1)/2}$ रखता है, जो $-0.51$, $0.00$, $+0.45$ मापा गया, $k = 3, 4, 5$ के लिए, किसी भी $D$ में। अतः घनत्व शिखर के लिए ऐसी परत चाहिए जिसकी विमाएँ ठीक पर्दे जितनी हों; अधिक मोटी परत चिकनी छाया देती है। एनिमेशन एक लहरदार परत को तब तक झुकाता है जब तक वह तह न हो जाए, जो $a\tan\alpha > 1$ पर होता है। सामान्य सापेक्षता से तुलना: द्रव्यमान $M = r_s/2$ को एक 3-गोले की छाया का घनत्व दें, $\rho\propto(1-r^2/R^2)^{-1/2}$, जो दुर्बल-क्षेत्र का एक व्यंग्यचित्र है, आइंस्टाइन के समीकरणों का हल नहीं। $R$ के बाहर क्षेत्र ठीक $r_s/r^3$ है (बिरखॉफ़ प्रमेय, कोश प्रमेय), और केंद्र परिमित रहता है। अपसरण तह कोश की ओर खिसक जाता है और घनत्व तथा ज्वारीय क्षेत्र में नरम होकर $(R-r)^{-1/2}$ हो जाता है, और वक्रता सूचक $8\sum E^2$ में $(R-r)^{-1}$,
  सामान्य सापेक्षता के $r^{-3}$ और $r^{-6}$ के बजाय। परत स्वयं एक परिमित वक्रता $1/R^2$ बनाए रखती है। निर्णय, ईमानदारी से। P4 कड़ाई से परखी गई बाहरी श्वार्ज़शील्ड ज्यामिति को अपरिवर्तित रख सकता है और केवल आंतरिक भाग बदल सकता है, पर ठीक यही इसे अपरीक्षणीय बनाता है: $R < r_s$ के लिए तह क्षितिज के पीछे होती है, और उससे कोई संकेत हम तक नहीं पहुँचता। सार्वभौमिक घातांक केवल एक वर्णन के रूप में नए हैं, क्योंकि क्षितिज के बाहर कुछ भी उन पर निर्भर नहीं करता। क्षितिज के बाहर एक तह ($R > r_s$) एक क्षितिज-रहित सघन पिंड होगी, जिसके फोटॉन वलय और प्रतिध्वनियाँ भिन्न होंगी; यही चरण 6 ब्लैक-होल छायाओं से परखता है। पृष्ठभूमि: fluids/blowup_profile_search दिखाता है कि विलक्षण प्रोफ़ाइलों और उनके घातांकों का व्यवहार में अध्ययन कैसे किया जाता है (स्व-समरूप ansatz, घातांक खोज)। विकिपीडिया: श्वार्ज़शील्ड मीट्रिक, आपदा सिद्धांत।'
meanings:
- स्वचालित अवकलन द्वारा अंतःस्थापन का जैकोबियन, प्रति नमूना बिंदु $b$ एक
- 'प्रेरित मीट्रिक: दोहराए गए अंतःस्थापन सूचकांकों $A, C$ पर समतल मीट्रिक $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ के साथ योग किया जाता है'
- अतिरिक्त अंतःस्थापन निर्देशांक, $q$ पर 64-नोड गाउस–लेजांड्र योग, $\ell = \ln s$ में, $r$ में अवकलनीय; यह $-\infty$ की ओर जाता है, $r^{-1/2}$ की तरह
- 'सबसे छोटा विलक्षण मान: प्रतिचित्रण की तह वहाँ है जहाँ यह 0 तक पहुँचता है और जैकोबियन कोटि खो देता है'
- मीट्रिक के autograd अवकलज से क्रिस्टोफ़ेल प्रतीक; $d$ पर योग किया जाता है
- दूसरे फ़ॉरवर्ड-मोड अवकलज और दो einsum गुणनफलों से रीमान टेन्सर ($e$ पर योग)
- क्रेत्शमान अदिश, चारों सूचकांकों पर योग; क्षितिज के भीतर और बाहर $12r_s^2/r^6$ के बराबर
- $x = s^n$ के अंतर्गत एकसमान परत की छाया का घनत्व (तह $n = 2$, कस्प $n = 3$), लघुगणकीय अंतरालों पर आयतचित्र
- एक द्रव्यमान का न्यूटनी ज्वारीय टेन्सर, जो त्रिज्या $R$ वाले 3-गोले की छाया की तरह फैला है (दुर्बल-क्षेत्र व्यंग्यचित्र)
labels:
  fold_radius: तह कोश की त्रिज्या $R$
  sheet_amplitude: लहरदार परत का आयाम $a$
  D: समतल विमा $D$ जिसमें गोलाकार परतें हैं (खुली)
  samples: हर परत पर नमूना लिए गए बिंदु
