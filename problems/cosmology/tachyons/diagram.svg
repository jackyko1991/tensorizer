<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Tachyon on a Minkowski diagram: the light cone, Alice's and Bob's worldlines, a superluminal message outside the light cone and a reply that arrives before the message was sent">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- light cone from the origin -->
    <line x1="40" y1="148" x2="160" y2="28" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="150" y="24" font-size="12" fill="#6b7280">c</text>
    <!-- Alice (x = 0) and Bob (receding) -->
    <line x1="40" y1="150" x2="40" y2="14" stroke="#374151" stroke-width="2"/>
    <line x1="40" y1="148" x2="140" y2="14" stroke="#374151" stroke-width="1.5"/>
    <text x="10" y="26" font-style="italic">t</text>
    <text x="22" y="150" font-size="12">A</text>
    <text x="146" y="18" font-size="12">B</text>
    <!-- message: faster than light, outside the cone -->
    <line x1="40" y1="96" x2="116" y2="46" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="40" cy="96" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="68" y="62" font-style="italic" fill="#1e40af">u</text>
    <!-- reply: back to Alice before the message left -->
    <line x1="116" y1="46" x2="44" y2="118" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="40" cy="121" r="4" fill="#f59e0b"/>
    <text x="150" y="110" font-style="italic">m² &lt; 0</text>
  </g>
</svg>
