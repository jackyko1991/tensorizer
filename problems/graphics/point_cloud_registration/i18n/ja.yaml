source_hash: b1a74b85fb17
title: 点群レジストレーション：PCL のパイプライン（FPFH、RANSAC、ICP）
summary: 同じ物体を 2 つの視点から撮った部分的な 3D スキャン 2 つを、未知の剛体運動でずらしたうえで、Point Cloud Library（PCL）と同じ手順で位置合わせする。すべてバッチ化した PyTorch で書く：ボクセルグリッドによる間引き、統計的外れ値除去、近傍の共分散からの法線推定、FPFH 記述子、特徴対応に対する RANSAC（数千回の Kabsch 当てはめを同時に）、複数の初期値からの ICP による精密化（点対点と点対面）。結果は既知の運動と比較する：回転誤差（度）、並進誤差、RMSE。
notes: デモの物体は Keenan Crane の牛「Spot」（三角形 5856 枚）で、作者によりパブリックドメインに置かれている（CC0 1.0；https://www.cs.cmu.edu/~kmcrane/Projects/ModelRepository/、data/spot_vertices.csv と data/spot_faces.csv として同梱、data/SOURCES.md 参照；Crane、Pinkall、Schröder 2013、ACM TOG 32(4)）。スタンフォードバニーは使わなかった。Stanford 3D Scanning Repository は研究目的の利用と無償の再配布を認めているが、許可なく商業目的に使ったり販売される製品に含めたりしてはならないとしており、将来有料版を持つかもしれないオープンなプロジェクトにとっては不明確だからである。PCL 自身のテストファイル bunny.pcd は同じスタンフォードのスキャンに由来し、独自のデータライセンスはない（PCL の BSD ライセンスはコードを対象とする）。スキャンは合成である：メッシュ表面を密にランダムサンプリングし、スキャナから見える点だけを残し（背面テストと z バッファ、すなわち隠れ点除去）、ガウス雑音 $\sigma$、数パーセントの一様な外れ値を加え、スキャン B にはランダムな剛体運動（30–60°、物体サイズの半分）をかける。物体サイズはバウンディングボックスの対角線で、1 に正規化している。パイプライン（括弧内は PCL のクラス名）：VoxelGrid；StatisticalOutlierRemoval；NormalEstimation（$k = 15$ 近傍、法線は各スキャン自身の視点の方へ反転）；FPFH（$k = 25$）；記述子空間での相互最近傍対応；RANSAC は仮説 4000 個で、各仮説は三角形の辺の長さが 10 % 以内で一致する 3 対応（PCL の CorrespondenceRejectorPoly と同様）を Kabsch で当てはめ、インライア数で評価し、最後にインライアで再当てはめする；ICP は RANSAC 姿勢を摂動した 6 つの初期値から、ボクセルの半分の大きさで間引いたターゲットに対して行い、1 ボクセルより離れた対は無視する。簡略化：FPFH
  は半径ではなく固定の $k$ 近傍を使い、Darboux 枠の基点を常に注目点とし（PCL は法線の角度で対の順序を選ぶ）、11 ビンの各ブロックを 100 に正規化する；ボクセルグリッドは位置だけを平均する。既定の実行結果：各スキャン約 12000 の可視点が 2 つのフィルタの後に約 1650 点になる；相互 FPFH 対応 365 個のうち RANSAC が 73 個（約 20 %）を残し、誤差 6.4° と 0.056 の粗い姿勢を与える；点対面 ICP はどの初期値からも約 5 回の反復で 0.37° と 0.0021（物体サイズの 0.2 %、RMSE 0.007）に達するが、点対点は 25 回の反復後もまだ表面に沿ってゆっくり滑っている（約 2.1°、0.018）。部分的で再サンプリングされた表面上の最近傍が横方向に引っぱるためである。テストでは次を確認する：Kabsch が厳密であること、運動とその逆の合成が恒等であること、平面と球の法線が正しいこと、ボクセルグリッドが遅い参照実装と一致すること、遠い外れ値が除去されること、FPFH が剛体運動で不変であること、z バッファ可視性が球の裏側を取り除くこと、RANSAC が 50 % の誤対応に耐えること、ICP が収束すること、滑らかな曲面では点対面が点対点より速く収束すること、そしてパイプライン全体が 2° 未満、物体サイズの 2 % 未満に達すること。いずれも確立した手法である：ICP（Besl と McKay 1992；点対面：Chen と Medioni 1992）、FPFH（Rusu、Blodow、Beetz 2009）、PCL（Rusu と Cousins 2011、BSD ライセンス、https://pointclouds.org）。このコードは論文をもとに書いたもので、PCL からの翻訳ではない。視点間の角度を大きくする（重なりが減り、RANSAC のインライアが減って失敗することがある）、外れ値を増やす、ボクセルを粗くする、などを試してみよう。
meanings:
- バッチの各要素 $b$（RANSAC の仮説または ICP の初期値）ごとに 1 つの剛体運動、$j$ について和
- $k$ 個の最近傍、距離行列を行のブロックごとに計算
- VoxelGrid：同じボクセルキーを持つ点の scatter 平均
- StatisticalOutlierRemoval：近傍までの平均距離を、点群全体でのその平均と標準偏差と比べる
- 近傍の共分散；最小固有値の固有ベクトルが法線で、視点の方へ反転する
- 表面変動（PCL の曲率）：平面では 0
- 点対の Darboux 枠の角度：$\alpha = \mathbf v\cdot\mathbf n_q$、$\phi = \mathbf u\cdot\hat{\mathbf d}$、$\theta = \operatorname{atan2}(\mathbf w\cdot\mathbf n_q, \mathbf u\cdot\mathbf n_q)$
- 11 ビンのヒストグラム 3 つ；点自身のヒストグラムに、近傍のヒストグラムの距離重み付き平均を加える
- Kabsch の相互共分散、仮説ごとに 1 つ；1 回のバッチ SVD ですべての回転が得られる
- すべての仮説の RANSAC スコアを一度に
- 点対面 ICP の 1 ステップ $\boldsymbol\xi = (\boldsymbol\omega, \delta\mathbf t)$、初期値についてバッチ処理
- 既知の真値に対する回転誤差
labels:
  n_points: スキャンごとの表面サンプル数
  view_angle: 2 つの視点の間の角度
  noise: センサ雑音 $\sigma$（物体サイズ 1）
  outliers: 外れ値の割合
  voxel: ボクセルサイズ $s$
  hypotheses: RANSAC の仮説数
  icp_iterations: ICP の反復回数
  starts: ICP の初期値数（バッチ）
