title: चतुर्-संवेग और द्वि-पिंड क्षय
summary: एक गतिमान कण दो में क्षयित होता है। उसके विराम फ़्रेम में उत्पाद निश्चित संवेग $p^*$ के साथ विपरीत दिशाओं में उड़ते हैं; एक लोरेंत्ज़ बूस्ट $\Lambda^\mu{}_\nu$ (एक einsum) हर क्षय कोण को एक साथ प्रयोगशाला फ़्रेम में ले जाता है, जहाँ संवेग आगे की ओर झुक जाते हैं। मिन्कोव्स्की मीट्रिक $\eta_{\mu\nu}$ उत्पादों के चतुर्-संवेगों को वापस जनक के द्रव्यमान में बदलती है — नए कणों की खोज में प्रयुक्त अपरिवर्तनीय-द्रव्यमान (invariant mass) युक्ति।
notes: 'विराम-फ़्रेम संवेग त्रिज्या $p^*$ के गोले पर स्थित हैं; बूस्ट इसे एक दीर्घवृत्त (खींचे गए वक्र) में खींचता है जो जनक के संवेग से आगे खिसका होता है, इसलिए तेज़ जनक दोनों उत्पादों को एक संकरे अग्र शंकु में फेंकते हैं। ऊर्जा और प्रयोगशाला कोण $\theta^*$ के साथ बदलते हैं, पर हर उत्पाद के लिए $p_\mu p^\mu = m^2$ और $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$ कभी नहीं बदलते — दोनों संवेग मापने वाला संसूचक सदा $M$ का पुनर्निर्माण कर सकता है। $\pi^0 \to \gamma\gamma$ के लिए फ़ोटॉन द्रव्यमानहीन हैं ($p_\mu p^\mu = 0$) और न्यूनतम विवर्तन कोण $2\arcsin(1/\gamma)$ है। तीनों क्षय वास्तविक हैं: $K^0_S \to \pi^+\pi^-$, $\pi^0 \to \gamma\gamma$, $\Lambda \to p\,\pi^-$। केवल शुद्धगतिकी मॉडल की गई है: क्षय कोण नमूने लेने के बजाय समान रूप से फैलाए गए हैं, और स्पिन व ध्रुवण उपेक्षित हैं।'
meanings:
- diag(1, −1, −1, −1), $c = 1$ वाले मात्रक
- विराम फ़्रेम में B क्षय कोणों $\theta^*$ के लिए संतति चतुर्-संवेग
- जनक वेग $\boldsymbol\beta = \mathbf P/E$ के लिए $\gamma$, $\gamma\beta_i$ और $\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$
