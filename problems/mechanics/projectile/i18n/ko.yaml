source_hash: bb811720bfea
title: 공기 저항을 받는 포물체
summary: 공기 저항이 속력의 제곱에 비례하는 공에 대한 뉴턴 제2법칙. 여러 발사각을 배치 텐서 하나로 쌓아 한꺼번에 풀므로, einsum 하나가 모든 궤적을 처리합니다.
notes: 배치 지표 $b$는 물리가 아닙니다. PyTorch가 $B$개의 포물체를 한 번에 풀 수 있게 해 주는 텐서 기법입니다. 저항을 0으로 두면 45°에서 최대 수평 도달 거리를 갖는 교과서의 포물선이 나옵니다.
meanings:
- 공 $b$의 위치, 성분 $i \in \{x, z\}$
- 공 $b$의 속도
- 중력 벡터 $(0, -9.81)$
- '반복된 $j$ ⇒ 합: 각 공의 속력 제곱'
- 상미분 방정식의 우변
labels:
  v0: 발사 속력
  drag: 저항 $c/m$
  n_angles: 발사각 수
  t_max: 시뮬레이션 시간
