source_hash: 3af965e9bb1a
title: 'UMAP como problema tensorial: grafo kNN, conjuntos difusos y una disposición por fuerzas sobre MNIST'
summary: 'UMAP, el método de reducción de dimensión que representa los dígitos de MNIST de 784 píxeles como un mapa 2D, escrito por completo como operaciones tensoriales: un grafo kNN exacto a partir de una única matriz de distancias y topk, una bisección que encuentra el ancho de banda $\sigma_i$ de cada punto a la vez, la unión difusa $P + P^\top - P\circ P^\top$, un inicio espectral a partir del laplaciano del grafo, y fuerzas de atracción y repulsión aplicadas a toda la lista de aristas en cada época (a mano, y de nuevo con autograd). Con 2500 dígitos y un rollo suizo iguala a la biblioteca umap-learn en confiabilidad (trustworthiness), recall de vecinos y precisión sobre los dígitos, muy por delante de PCA.'
notes: 'La pregunta. «UMAP como un simple problema tensorial» es la petición de Jacky Ka Long Ko: tomar UMAP (Uniform Manifold Approximation and Projection; McInnes, Healy y Melville 2018), que normalmente se ejecuta con la biblioteca umap-learn y sus bucles numba, escribir cada paso como operaciones tensoriales por lotes y comprobar después que el resultado es igual de bueno. Método, en tensores (N puntos en D dimensiones). 1. Grafo kNN: las distancias al cuadrado (N, N) $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$ (un einsum), calculadas por bloques de filas; después topk da las distancias e índices (N, k); exacto, como umap-learn por debajo de 4096 puntos (por encima pasa a un descenso aproximado de vecinos más cercanos). 2. Conjunto simplicial difuso: $\rho_i$ es la distancia al otro punto más cercano; $\sigma_i$ resuelve $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ por bisección, con los N intervalos reducidos a la mitad a la vez (64 veces, precedidas de una fase
  de duplicación mientras el extremo superior es desconocido); las pertenencias se dispersan en una matriz densa (N, N) $P$ y se simetrizan mediante la unión difusa $W = P + P^\top - P\circ P^\top$ (lo denso basta con unos pocos miles de puntos; un tensor disperso COO es la misma fórmula a gran escala). 3. La similitud en baja dimensión $q = 1/(1 + a d^{2b})$, con $a$ y $b$ ajustados a min_dist mediante un ajuste por mínimos cuadrados de Gauss–Newton con 2 parámetros; inicio: los dos menores vectores propios no triviales del laplaciano normalizado $I - D^{-1/2} W D^{-1/2}$, obtenidos con un torch.linalg.eigh denso (unos 4 s para 2500 puntos en un núcleo; umap-learn usa un solucionador disperso; si eigh falla, el código recurre a un inicio aleatorio). 4. Disposición: 500 épocas; una arista de peso $w_{ij}$ está activa una vez cada $\max w / w_{ij}$ épocas (el calendario de umap-learn, guardado como un tensor (E,) de las próximas épocas de muestreo); cada arista activa atrae a sus dos extremos
  y toma 5 negativos aleatorios que repelen a su cabeza; todas las fuerzas de la época se calculan a la vez y se suman por punto con index_add_ (una actualización síncrona, mientras que umap-learn mueve los puntos arista por arista). El mismo bucle con autograd: el gradiente de la entropía cruzada muestreada, recortado tras la suma. 5. Métricas, todas como operaciones tensoriales con $k$ = 10: confiabilidad (trustworthiness) y continuidad (Venna y Kaski 2001) a partir de matrices de rangos (un argsort de un argsort), recall kNN y precisión sobre los dígitos con 10-NN dejando uno fuera (leave-one-out) en la disposición 2D; PCA mediante SVD como referencia lineal. Datos. MNIST (LeCun, Cortes y Burges), licencia CC BY-SA 3.0: data/mnist_subset.npz contiene las primeras 250 imágenes de entrenamiento de cada dígito (2500 imágenes, uint8; la licencia de compartir igual se aplica a este subconjunto), véase data/SOURCES.md. El rollo suizo (1500 puntos, como en make_swiss_roll de scikit-learn, con
  un poco de ruido) se genera en el código, por lo que se conocen sus verdaderas coordenadas planas (longitud de arco, altura). La referencia de umap-learn (umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42) se calculó una sola vez sin conexión en un entorno desechable con data/make_reference.py; solo se incluyen sus coordenadas 2D y sus métricas. Resultados (ejecución incluida, CPU, un hilo). MNIST, 2500 dígitos: confiabilidad / continuidad / recall 10-NN / precisión 10-NN sobre los dígitos = 0.957 / 0.963 / 0.39 / 0.887 con las fuerzas escritas a mano, 0.960 / 0.963 / 0.40 / 0.898 con autograd, 0.963 / 0.963 / 0.40 / 0.896 para umap-learn y 0.740 / 0.913 / 0.07 / 0.414 para PCA. Rollo suizo: confiabilidad 0.999 (umap-learn 0.999, PCA 0.943) y, frente a las verdaderas coordenadas planas, 0.999 conservando el 76 % de los 10 verdaderos vecinos más cercanos (umap-learn 77 %, PCA 28 %). Nuestra confiabilidad también coincide con la de scikit-learn hasta $2\times 10^{-4}$ en las disposiciones
  de umap-learn incluidas (probado), y $a$, $b$ coinciden con los de umap-learn. Tiempo real en MNIST: 11 s con las fuerzas (0.5 s grafo, 4 s eigh, 7 s disposición), 15 s con autograd, 14 s para umap-learn (segunda llamada, un hilo; su primera llamada, con la compilación de numba, tardó 28 s). Tras la mejor rotación, reflexión y escala (Procrustes), nuestra disposición de MNIST difiere de la de umap-learn en una disparidad de 0.05 (0 = misma forma, 1 = sin relación); los mismos grupos de dígitos se sitúan en los mismos lugares. Veredicto y límites. UMAP es un problema tensorial: la construcción del grafo, la búsqueda del ancho de banda, la unión difusa, el inicio espectral y la disposición por fuerzas son todas operaciones tensoriales por lotes, y el resultado es tan bueno como la referencia según todas las métricas aquí usadas. Lo que difiere: las disposiciones se comparan mediante métricas, nunca por coordenadas, porque las disposiciones de UMAP solo están definidas salvo rotación, reflexión
  y la aleatoriedad del muestreo negativo (otra semilla mueve los grupos); por encima de 4096 puntos el kNN de umap-learn se vuelve aproximado mientras que el nuestro sigue siendo exacto (y cuesta $O(N^2)$); nuestras matrices densas $N\times N$ y eigh limitan esta versión a unos $10^4$ puntos (bloques, tensores dispersos y un solucionador iterativo de valores propios eliminarían ese límite); la actualización síncrona hace que las primeras épocas parezcan un gas caliente (la tasa de aprendizaje es cercana a 1 y cada punto recibe todos sus impulsos a la vez) antes de que la disposición se enfríe. El rollo suizo conserva cada vecindad local pero no se desenrolla como una única lámina limpia: se rasga en tiras, como con umap-learn, un rasgo conocido de UMAP y t-SNE. La precisión sobre los dígitos mide lo bien que el mapa separa clases que nunca vio; no es un clasificador. Los resultados varían unas milésimas según la compilación de BLAS y el número de hilos. Trabajos relacionados. t-SNE (van
  der Maaten y Hinton 2008) estableció el patrón de hacer coincidir probabilidades de vecindad con un núcleo de cola pesada en 2D; UMAP sustituye sus probabilidades normalizadas por pertenencias difusas y su repulsión completa por muestreo negativo (como en word2vec), y por eso escala. Los mapas propios laplacianos (Laplacian eigenmaps; Belkin y Niyogi 2003) proporcionan el inicio espectral. Pruébalo. Menos vecinos (5) da más grupos y más pequeños; min_dist cerca de 0.9 dispersa los puntos holgadamente; menos épocas muestra una disposición sin terminar; otra semilla gira y reordena el mapa mientras las métricas se mantienen.'
meanings:
- distancias a los $k$ puntos más cercanos (el propio punto primero), a partir de $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$ ($d$ repetido ⇒ sumado) y topk; exacto, los bloques de filas mantienen la memoria en $O(BN)$
- $\rho_i$ = distancia al otro punto más cercano; $\sigma_i$ mediante 64 bisecciones de un único tensor de intervalos para todos los puntos a la vez, de modo que $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$
- 'pertenencia dirigida: 1 para el vecino más cercano, decreciente con la distancia más allá de él, 0 fuera de la lista kNN'
- 'unión difusa (O probabilístico) de las dos direcciones: simétrica, en $[0, 1]$; sus elementos no nulos forman la lista de aristas $(i_e, j_e)$, $E$ ≈ 50 000 para 2500 dígitos'
- 'ajuste de Gauss–Newton de $1/(1 + a x^{2b})$ a 1 por debajo de min_dist y a $e^{-(x - \mathrm{min\_dist})}$ por encima: $a$ = 1.577, $b$ = 0.895 para min_dist = 0.1'
- 'inicio espectral: los dos menores vectores propios no triviales del laplaciano normalizado del grafo, escalados a $[0, 10]$'
- fuerzas de todas las aristas muestreadas $(i, j)$ y de 5 negativos aleatorios $s$ por arista, sumadas por punto en un único scatter-add; cada término recortado a $\pm 4$; tasa de aprendizaje $\alpha = 1 - \mathrm{epoch}/n$
- 'el mismo paso con autograd sobre la pérdida muestreada $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$: igual a las fuerzas escritas a mano (probado)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, rangos $r$ a partir de un argsort de un argsort; la continuidad intercambia $x$ e $y$
labels:
  n_neighbors: Vecinos $k$ (incluido el propio punto)
  min_dist: Distancia mínima en la disposición
  n_epochs: Épocas de disposición
  neg_rate: Muestras negativas por muestra de arista
  n_mnist: Imágenes de MNIST (equilibradas entre dígitos)
  seed: Semilla aleatoria
