<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Square cavity filled with fluid of viscosity nu; the lid slides right at speed U and drives a primary vortex, drawn as closed streamlines of psi, with small eddies in the bottom corners">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- box -->
    <rect x="66" y="34" width="112" height="112" fill="#93c5fd" fill-opacity="0.3"/>
    <path d="M66,30 V146 H178 V30" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- lid -->
    <rect x="62" y="26" width="120" height="6" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <line x1="92" y1="14" x2="152" y2="14" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="158" y="19" font-style="italic" fill="#b91c1c">U</text>
    <!-- primary vortex (clockwise) -->
    <ellipse cx="128" cy="76" rx="40" ry="32" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    <ellipse cx="130" cy="72" rx="22" ry="17" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M150,104 A40,32 0 0 1 120,107" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#flow)"/>
    <path d="M100,52 A40,32 0 0 1 140,45" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#flow)"/>
    <circle cx="131" cy="71" r="2.5" fill="#f59e0b"/>
    <!-- corner eddies -->
    <path d="M70,142 Q70,124 86,142 Z" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <path d="M174,142 Q174,120 154,142 Z" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="134" y="88" font-style="italic" fill="#1e40af">ψ</text>
    <text x="80" y="128" font-style="italic">ν</text>
  </g>
</svg>
