source_hash: 0456b6169f6d
title: 二維波包散射
summary: 在 $(N, N)$ 網格上以分步傅立葉法求解二維含時薛丁格方程式。高斯波包撞上有兩條狹縫的牆（或圓盤狀障礙物）；torch.fft.fft2 在位能為對角的 $x$ 空間與動能為對角的 $k$ 空間之間切換。障礙物後方的偵測屏記錄時間積分的機率：由單一粒子的波函數構成的干涉圖樣。
notes: 單位 $\hbar = m = 1$，波包能量 $E \approx k_0^2/2$。若沒有遮罩 $M$，每個因子都是純相位，因此每一步都嚴格么正，歸一化保持為 1；遮罩刻意移除抵達邊緣的機率（否則週期性 FFT 網格會把它從對側帶回來），因此印出的歸一化在後期會下降。對間距 $d$ 的雙狹縫，在距離 $D$ 的屏幕上條紋間距約為 $\lambda D/d$，$\lambda = 2\pi/k_0$（屏幕不在遠場，因此只是近似）。選擇圓盤會看到陰影，其後方軸上有一個明亮的帕松亮點。影像顏色採用平方根刻度，並對每一格歸一化，使微弱的散射波仍可見；障礙物以灰色繪出。
meanings:
- 週期性二維網格上的波函數（第一指標 $x$，第二指標 $y$）
- 障礙物：位於 $x \approx 0$ 有兩個開口的高牆，或一個圓盤
- 半步位能算符，在 $x$ 空間為對角
- 整步動能算符，在 $k$ 空間為對角
- $x$ 與 $y$ 都求和：沿每個軸各一次一維傅立葉轉換
- 邊緣附近的平滑阻尼，使波離開而不是繞回
- 偵測線 $x = x_\text{screen}$ 上的時間積分機率
labels:
  barrier: 障礙物
  k0: 波包動量 $k_0$
  slit_sep: 狹縫間距 $d$（圓盤直徑）
  slit_width: 狹縫寬度 $w$
  n_grid: 每軸格點數
