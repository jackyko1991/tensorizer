source_hash: 26b3bf83c6f6
title: A → B → C 的 Beer–Lambert 光譜
summary: 分光光度計追蹤連續反應 $A \to B \to C$。混合物的光譜是一個矩陣乘積 $D = l\,E\,c$（波長 × 物種），因此濃度剖面可以用擬反矩陣 $E^{+}$ 以最小平方法從帶雜訊的光譜中還原。觀察等吸收點，在某一步進行時光譜在此保持不動。
notes: 每個物種吸收的光與其濃度及光徑長成正比，$D = \varepsilon\,l\,c$，而混合物的吸光度直接相加。對所有波長與時間同時寫出，就是矩陣乘積 $D_{tw} = l\,E_{ws}c_{ts}$，因此當波長數多於物種數時，濃度由一個超定線性系統以最小平方法求得：$\hat c = E^{+}D/l$，擬反矩陣為 $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$。這只在純物種光譜明顯不同時才有效；終端輸出的 $E$ 條件數說明雜訊被放大了多少。動力學 $A \to B \to C$ 是線性系統 $\dot{\mathbf c} = K\mathbf c$，以矩陣指數精確求解：$[A]$ 衰減，$[B]$ 先升後降（在 $t = \ln(k_1/k_2)/(k_1 - k_2)$ 達到峰值），$[C]$ 增長，而 $[A] + [B] + [C]$ 保持不變，因為 $K$ 的每一行總和為零。等吸收點：若只進行 $A \to B$，則 $D = l(\varepsilon_A[A] + \varepsilon_B[B])$，且 $[A] + [B]$ 固定，因此在 $\varepsilon_A = \varepsilon_B$ 的波長處吸光度不會改變。清晰的等吸收點是乾淨的雙物種轉化的經典標誌；這裡交點從 $\varepsilon_A = \varepsilon_B$（早期）移到 $\varepsilon_B = \varepsilon_C$（後期），其間因三個物種共存而變得模糊。設 $k_2 = 0$ 可看到完美的等吸收點，設 $k_2 \approx k_1$ 則看它消失。光譜是合成的高斯吸收帶，具有典型的染料級莫耳吸光係數（$\sim 10^4$ L mol$^{-1}$ cm$^{-1}$），樣品槽為 1 cm。
meanings:
- 300–700 nm，間隔 2 nm
- 各物種的莫耳吸光係數（合成高斯吸收帶，L mol$^{-1}$ cm$^{-1}$）
- $A \to B \to C$ 的速率矩陣；每一行總和為 0（質量守恆）
- 每個取樣時間的精確濃度；對 $r$ 求和
- 混合物的 Beer–Lambert 定律：吸光度相加，對物種 $s$ 求和
- 純物種光譜的重疊（Gram）矩陣；對 $w$ 求和
- 擬反矩陣；光譜線性獨立時等於 torch.linalg.pinv(E)
- 從每條帶雜訊光譜求得的最小平方濃度；對 $w$ 求和
- 步驟 $A \to B$ 的等吸收點（$B \to C$ 同理）
labels:
  k1: 速率常數 $k_1$（$A \to B$）
  k2: 速率常數 $k_2$（$B \to C$）
  t_end: 實驗時長
  c0: 起始 $[A]_0$
  noise: 偵測器雜訊 $\sigma$（吸光度）
