title: स्पेक्ट्रमी गुच्छन और ग्राफ़ लाप्लासियन
summary: बिंदुओं के एक बादल को ग्राफ़ में बदलें ($k$-निकटतम-पड़ोसी किनारों पर गाउसीय भार), ग्राफ़ लाप्लासियन $L = D - W$ और इसका प्रसामान्यीकृत रूप $L_{sym}$ टेंसरों के रूप में बनाएँ, और गुच्छों को इसके निम्नतम आइगेनसदिशों से पढ़ें। दो चंद्र और संकेंद्री वलय, जहाँ साधारण k-means विफल होता है, पूर्णतः अलग हो जाते हैं; ग्रिड पर वही लाप्लासियन एक ढोल के कंपन विधा देता है।
notes: 'यह क्यों काम करता है: $f^{\mathsf T} L f = \frac12\sum_{ij} W_{ij}(f_i - f_j)^2$ वर्गों का योग है, इसलिए $L$ धनात्मक अर्ध-निश्चित है, और यह शून्य केवल तभी है जब $f$ हर किनारे के आर-पार स्थिर हो, यानी हर संबद्ध घटक पर स्थिर हो। इसलिए शून्य आइगेनमानों की संख्या ठीक घटकों की संख्या है (टर्मिनल में दोनों गणनाओं की तुलना करें), और घटकों के सूचक सदिश उस आइगेन-समष्टि को जनित करते हैं। जब गुच्छे केवल कुछ दुर्बल किनारों से जुड़े हों, आइगेनमान शून्य के बजाय छोटे होते हैं और आइगेनसदिश सूचकों के निकट होते हैं; $f^{\mathsf T}Lf$ को न्यूनतम करना सबसे कम किनारे काटने का शिथिलित रूप है, Shi और Malik (2000) का प्रसामान्यीकृत कट। दूसरा आइगेनसदिश (Fiedler सदिश) सर्वोत्तम द्वि-विभाजन देता है। साधारण k-means केंद्रों के चारों ओर सीधी सीमाएँ खींचता है, इसलिए चंद्रों और वलयों को आधा काट देता है; अंतःस्थापन (embedding) में (ऊपरी पंक्ति, बिंदुओं को सरकते देखें) गुच्छे अलग-अलग गोले हैं, और k-means काम करता है। स्पेक्ट्रम में $k$-वें आइगेनमान के बाद बड़ा अंतराल गुच्छों की संख्या का संकेत है। $g\times g$ ग्रिड
  ग्राफ़ पर $L = L_1\otimes I + I\otimes L_1$ मुक्त (Neumann) किनारों वाले असतत लाप्लासियन का ऋणात्मक है, इसलिए इसके आइगेनसदिश अप्रगामी तरंगें $\cos\frac{\pi a (i+\frac12)}{g}\cos\frac{\pi b (j+\frac12)}{g}$ हैं, $\lambda = (2 - 2\cos\frac{\pi a}{g}) + (2 - 2\cos\frac{\pi b}{g})$ के साथ: तरंग विषय के कंपित ढोल जैसी ही विधाएँ (जिसमें इसके बजाय जकड़े किनारे हैं)। विधाएँ $(a, b)$ और $(b, a)$ एक आइगेनमान साझा करती हैं, और eigh इस युग्म का कोई मिश्रण लौटाता है, इसीलिए कुछ विकर्ण दिखती हैं। परिणाम $\sigma$ और $k$ पर निर्भर करते हैं: बहुत कम पड़ोसी एक गुच्छे को टुकड़ों में बाँट देते हैं, बहुत अधिक गुच्छों के बीच पुल जोड़ देते हैं। आगे पढ़ें: U. von Luxburg, A tutorial on spectral clustering (2007); Ng, Jordan और Weiss (2001)।'
meanings:
- 'बिंदु $i$, निर्देशांक $a$: दो चंद्र, दो वलय या तीन गोले, अंकन के लिए वास्तविक लेबलों के साथ'
- 'दोहराया गया $a$ ⇒ योग: सभी वर्गित दूरियाँ एक साथ'
- गाउसीय समानता केवल तभी रखी जाती है जब $j$, $i$ के $k$ निकटतम पड़ोसियों में से एक हो या इसका उलटा; सममित, शून्य विकर्ण
- 'दोहराया गया $j$ ⇒ योग: हर बिंदु की कोटि (degree)'
- हर पंक्ति का योग 0 है, इसलिए स्थिर सदिश का आइगेनमान 0 है
- $s_i = d_i^{-1/2}$; कोई योग नहीं, $i$ और $j$ मुक्त रहते हैं
- आइगेनमान आरोही; पहले $k$ आइगेनसदिश, पंक्तियाँ इकाई लंबाई तक स्केल, स्पेक्ट्रमी अंतःस्थापन हैं
- k-means++ आरंभों के साथ Lloyd पुनरावृत्तियाँ; अंतःस्थापन में गुच्छे सघन गोले हैं
labels:
  n_points: प्रति आँकड़ा समुच्चय बिंदु $N$
  noise: रव
  k_neighbours: निकटतम पड़ोसी $k$
  sigma: कर्नेल चौड़ाई $\sigma$
  grid: ग्रिड ग्राफ़ की भुजा $g$
