source_hash: c17ad8b19789
title: '사영의 망원경 검증: 중력파, 블랙홀 그림자, 초신성'
summary: 확립된 물리학이 아닌 사변적 가설을 공개 천문 데이터와 대조합니다. 중력이 $3+1$보다 많은 차원을 본다면 중력파는 $1/d$보다 빠르게 약해지고, 휘어진 시공간이 접힌 사영의 그림자라면 광자구 바깥의 접힘은 블랙홀의 그림자를 키울 것입니다. GW170817과 그 모은하까지의 거리는 $D = 4.00^{+0.07}_{-0.25}$를 주고, M87*와 Sgr A*의 EHT 그림자는 약 $2.3$ 슈바르츠실트 반지름 이내의 접힘만 허용하며, Pantheon+ 초신성은 누출되는(DGP) 우주와 $\Lambda$CDM을 구별하지 못합니다. 모든 결과가 $3+1$ 차원의 일반 상대성 이론과 일치합니다. 추가 차원이 있다면 그것은 이 규모에서 중력이 느끼지 못하는 차원이어야 합니다.
notes: '상태: 사변적. 이것은 저자 자신의 가설(시리즈 설명 참조)이며 확립된 물리학이 아닙니다. 사영 가설의 6단계, 관측 단계입니다. 1단계(cosmology/projection_postulate)는 공준을 제시하고 보른 규칙이 표준 양자역학과 구별되지 않는 경우에만 살아남는다는 것을 발견했으며, 2~5단계(projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test)는 P3, P5, P4, P1-P2를 전개합니다. 이 단계는 P4(접힐 수 있는 사영으로서의 기하)와 P5(중력에는 가정이 아니라 피팅으로 정하는 어떤 $d_G$가 필요함)의 열린 매개변수를 공개 데이터에 피팅하고, 판정이 어느 쪽으로 나오든 그대로 보여 줍니다. 먼저 알려진 물리학입니다. $3+1$ 차원의 일반 상대성 이론에서 중력파의 변형률(strain)은 $1/d$로 감소합니다. $D$ 시공간 차원에서는 그 에너지가 $(D-2)$-구면에 퍼지고 $h\propto d^{-(D-2)/2}$입니다. $1/d$를 가정하는 검출기는 $d_{GW} = d_*(d_{EM}/d_*)^{(D-2)/2}$를 추론하거나($d_* = 1$ Mpc, Pardo, Fishbach, Holz, Spergel 2018과 같음), 누출이 차폐 규모 $R_c$ 너머에서만 시작된다면 $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$를 추론합니다(그들의 차폐 형태로, $D > 4$일 때 의미가 있습니다). 가설의 예측: 먼 거리에서 중력이 추가 차원으로 퍼진다면 $d_{GW} > d_{EM}$이고 $D > 4$입니다. 검증 (a): GW170817, NGC 4993에 광학 대응체가 있는 중성자별 병합. 데이터: GWTC-1 공개 자료의 중력파 광도 거리 사후 표본 8078개(data/gw170817_distance.csv; LIGO Scientific
  and Virgo Collaborations, 저스핀 사전분포, 천구 위치 자유; GWOSC, 라이선스 CC BY 4.0; Abbott et al. 2019, PRX 9, 031040). 분석의 사전분포가 $\propto d^2$이므로 각 표본에 $d^{-2}$의 가중치를 주고, 커널 밀도 추정으로 $d_{GW}$의 가능도를 얻습니다(발표된 값은 $40^{+8}_{-14}$ Mpc, Abbott et al. 2017). 전자기 거리(data/em_distances.csv, 인용된 수치): 표면 밝기 요동 $40.7\pm1.4\pm1.9$ Mpc(Cantiello et al. 2018, ApJL 854, L31, 기본값)와 Pardo et al.가 사용한 허블 흐름 거리, 즉 $v_H = 3017\pm250$ km/s를 $H_0 = 73.24\pm1.74$(SH0ES) 또는 $67.74\pm0.46$ km/s/Mpc(Planck)로 나눈 값. 결과: $D = 4.00^{+0.07}_{-0.25}$(68%, SBF; autograd 피팅은 $4.00\pm0.11$), $3.98^{+0.09}_{-0.24}$(SH0ES), $3.94^{+0.08}_{-0.24}$(Planck). Pardo et al.는 $4.02^{+0.07}_{-0.10}$(SH0ES)와 $3.98^{+0.07}_{-0.09}$(Planck)를 얻었습니다. 그들의 아래쪽 오차가 더 작은 이유는 천구 위치를 대응체에 고정하고 LVC의 $H_0$ 사후분포를 사용했기 때문이며, 여기에 포함된 표본은 천구 위치가 자유로워 거리-경사각 축퇴가 작은 거리 쪽으로 더 긴 꼬리를 남깁니다. 차폐된 누출의 경우 $-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ 조건은 $D = 5$, $n = 1$에서 수백 Mpc 미만의 $R_c$를, $n = 2$에서 5까지는 약 50-80 Mpc 미만의 값을 배제합니다. 완만한 전이(작은 $n(D-4)/2$)는 격자의 끝인 $10^4$ Mpc까지
  배제됩니다. Pardo et al.는 가능도비가 아니라 사후분포로부터 모든 가파름에 대해 $R_c\gtrsim 20$ Mpc를 제시합니다. 판정 (a): 중력은 40 Mpc까지 약 $\pm0.1$ 정밀도로 $D = 4.0$처럼 행동합니다. 중력이 보는 추가 차원이 있다면 그것은 콤팩트하거나 이 거리 너머에서 차폐되어 있습니다. 검증 (b): 블랙홀 그림자. 슈바르츠실트 시공간에서 광자구는 $r = 3GM/c^2$에 있고 그림자 반지름은 $b_c = \sqrt{27}\,GM/c^2$입니다. 여기서는 이를 $\min_r r/\sqrt{f}$로, 그리고 여러 충돌 매개변수에 대해 $u'''' = -u + \tfrac32 u^2$를 광선 추적하여 두 가지 방법으로 계산합니다. 스핀은 그림자의 면적 등가 반지름을 최대 7%까지 줄입니다(바딘 곡선; 극 방향에서 본 극한 블랙홀의 경우 $2(1+\sqrt2)\,GM/c^2$). 접힘은 저자의 모델링 선택으로, 여기서 정밀하게 정합니다. P4는 특이점이 사영이 접히는 곳이라고 말합니다. 사영된 기하가 반지름 $r_f$의 접힘까지 슈바르츠실트이고, 접힘에 도달한 빛은 결코 돌아오지 않는다고 가정합시다. 광자구 안쪽의 접힘($r_f\leq 1.5\,r_s$)은 그림자를 바꾸지 않습니다. 바깥쪽의 접힘은 그것을 스치는 광선을 그림자의 가장자리로 만들어 $b = r_f/\sqrt{1 - r_s/r_f}$가 되고, 따라서 $\delta = b/b_c - 1 > 0$입니다. 데이터(data/eht_shadows.csv, 인용된 수치): M87* 고리 $42\pm3$ $\mu$as와 $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as(EHT 2019, Papers I 및 VI)를 항성 동역학에서 얻은 $3.64\pm0.22$ $\mu$as(Gebhardt et al. 2011, 17.9 Mpc에서 $6.6\pm0.4\times10^9\,M_\odot$)와 비교하면 $\delta = +0.04\pm0.13$(여기서 계산한 값이며 발표된
  값이 아님)입니다. Sgr A* 고리 $51.8\pm2.3$ $\mu$as(EHT 2022, Paper I)와 Paper VI, Table 2의 $\delta = -0.04^{+0.09}_{-0.10}$(Keck 사전분포) 및 $-0.08\pm0.09$(VLTI 사전분포). $\delta + 2\sigma$를 취하고 스핀이 최대 7%까지 가릴 수 있다고 하면, 접힘은 그림자를 최대 0.37(M87*), 0.21(Keck), 0.17(VLTI)만큼 키울 수 있으므로 $r_f\leq 2.86$, $2.40$, $2.28\,r_s$입니다. 판정 (b): 그림자는 슈바르츠실트/커와 일치합니다. 약 $2.3\,r_s$ 바깥의 접힘은 배제되지만, P4가 자연스럽게 놓을 위치(지평선 또는 중심 특이점)인 광자구 안쪽의 접힘은 그림자 영상으로는 보이지 않습니다. 검증 (c, 선택): 초신성. DGP 브레인 세계에서 중력은 $r_c$ 너머에서 다섯 번째 차원으로 누출되고, 팽창은 $H^2 - H/r_c\propto\rho$를 따릅니다. Dvali와 Turner의 지수 $\alpha$는 둘 사이를 보간합니다($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$은 $\Lambda$CDM, $\alpha = 1$은 DGP). 데이터: cosmology/cosmological_constant_fit의 Pantheon+ 표를 data/pantheon_plus.csv로 복사한 것(초신성 1466개, $z > 0.01$, 대각 오차; Scolnic et al. 2022, Brout et al. 2022; Pantheon+ 데이터 파일에는 명시된 라이선스가 없고, 논문은 CC BY 4.0). 결과(균등 사전분포, $-1\leq\alpha\leq 1.8$): $\alpha = 0.44\pm0.71$; $\Lambda$CDM은 $\chi^2 = 639.5$, DGP는 $638.9$(대각 오차가 공분산의 대각 성분을 포함하므로 둘 다 초신성
  개수보다 훨씬 작음). 판정 (c): 초신성만으로는 누출되는 우주와 $\Lambda$CDM을 구별할 수 없습니다. 자가 가속 DGP 분기를 배제하는 것은 CMB 및 바리온 음향 진동과의 결합이며(예: Fang et al. 2008, Phys. Rev. D 78, 103509), 여기서는 이를 다시 피팅하지 않습니다. P4와 P5에 대한 종합 판정: 모든 검증이 $3+1$ 차원의 일반 상대성 이론과 일치합니다. 가설은 $3+1$을 넘는 차원이 이 규모에서 중력이 느끼지 못하는 차원(콤팩트하거나, 차폐되거나, 1단계와 5단계의 양자 부문에만 존재하는 차원)이고 접힘이 있다면 광자구 안쪽에 놓일 때에만 살아남습니다. 이것은 제약이지 지지가 아닙니다. 지금까지 이 시리즈는 표준 물리학과 다르면서 데이터와 일치하는 예측을 찾지 못했습니다.'
meanings:
- GW170817 거리 표본 8078개(GWTC-1); $w_i = d_i^{-2}$가 부피 균등 사전분포를 나누어 없앰
- '반복되는 $i$(표본) ⇒ 합산: $d_{GW}$의 커널 밀도, 정규화된 가능도'
- 중력이 $D_a$ 차원으로 퍼질 때 검출기가 추론하는 거리, 모든 전자기 거리 $d_j$에 대해
- $D$의 사후분포, 전자기 거리를 주변화($j$ 합산, 사다리꼴 공식)
- 'autograd 피팅: $\log p(D)$에 대한 뉴턴 단계, 오차는 2차 도함수에서(라플라스)'
- $B$개의 충돌 매개변수와 $F$개의 접힘 반지름에 대한 광자 궤도 $u = r_s/r$를 한꺼번에($\varphi$에 대한 RK4)
- $r_f$의 접힘에 의한 그림자의 상대적 증가(광자구 안쪽에서는 0)
- 스핀 $a$와 경사각에 따른 커 그림자의 축소(바딘 곡선, 면적 등가 반지름)
- 모든 누출 지수 $\alpha_a$와 $\Omega_{m}$에 대한 초신성 $\chi^2$, 오프셋($H_0$, $M$) 제거; $i$ 합산
labels:
  em_distance: 판정에 사용하는 NGC 4993까지의 전자기 거리
  D_screen: 차폐 규모 너머의 차원 $D$(차폐된 누출)
  n_screen: 차폐 전이의 가파름 $n$
  inc_max_sgra: 스핀 띠에 대한 Sgr A*의 최대 경사각
