source_hash: 71b446fca9cd
title: विचार-श्रृंखला ट्रांसफ़ॉर्मर की मदद क्यों करती है
summary: '$n$ बिटों की पैरिटी एक चलता हुआ XOR है, जो स्वभावतः क्रमिक कार्य है। एक जैसे छोटे ट्रांसफ़ॉर्मर (हाथ से लिखा einsum अटेंशन, सभी मॉडल एक मॉडल अक्ष पर एक साथ रखे गए और एक ही रन में प्रशिक्षित) इसे दो प्रारूपों में सीखते हैं: तुरंत उत्तर देना, "$b_1 \dots b_n = p$", या पहले चलती पैरिटियाँ लिखना, "$b_1 \dots b_n : s_1 \dots s_n = p$"। समान भार-संरचना और समान चरणों के साथ, स्क्रैचपैड मॉडल $n = 4$ से $10$ तक परीक्षण स्ट्रिंगों के 98–100% का सही उत्तर देते हैं, जबकि प्रत्यक्ष मॉडल केवल $n = 4$ पर फ़िट होते हैं और उससे आगे संयोग-स्तर पर या उससे नीचे रहते हैं; अटेंशन दो-टोकन नियम $s_k = s_{k-1} \oplus b_k$ दिखाता है। यह क्रियाविधि का एक खिलौना मॉडल है, न कि इसका कि बड़े भाषा मॉडल कैसे तर्क करते हैं।'
notes: 'स्थिति: यहाँ दिखाया गया प्रभाव स्थापित है। तुरंत उत्तर देने वाले स्थिर गहराई के ट्रांसफ़ॉर्मर के लिए पैरिटी पाठ्यपुस्तकीय कठिन उदाहरण है। Li, Liu, Zhou and Ma (ICLR 2024, arXiv 2402.12875) सिद्ध करते हैं कि मध्यवर्ती चरणों के बिना स्थिर-गहराई वाले ट्रांसफ़ॉर्मर उथले समानांतर परिपथों तक सीमित हैं (उनकी परिशुद्धता संबंधी मान्यताओं के तहत $\mathrm{TC}^0$ जैसे), जबकि विचार-श्रृंखला के $T$ चरण उन्हें आकार $T$ के क्रमिक परिपथ का अनुकरण करने देते हैं। Nye et al. (2021, arXiv 2112.00114) ने ट्रांसफ़ॉर्मरों को मध्यवर्ती परिणामों का "स्क्रैचपैड" लिखने के लिए प्रशिक्षित किया और उन्हें लंबे जोड़ और प्रोग्राम ट्रेसिंग जैसे बहु-चरणीय कार्य हल करते देखा; Wei et al. (2022, arXiv 2201.11903) ने बड़े भाषा मॉडलों के लिए विचार-श्रृंखला (chain-of-thought) प्रॉम्प्टिंग को यह नाम दिया। विधि: $n$ बिटों की एक स्ट्रिंग या तो सीधे, "$b_1 \dots b_n = p$", या अपनी चलती पैरिटियों के साथ, "$b_1 \dots b_n : s_1 \dots s_n = p$", लिखी जाती है। हर मॉडल वही 2-परत, $d = 64$, 4-हेड डिकोडर है (`tiny_transformer` कोड,
  जिसमें हर einsum में एक मॉडल अक्ष $m$ जोड़ा गया है), जिसे AdamW से समान संख्या में चरणों तक और स्ट्रिंगों के समान बैच पर प्रशिक्षित किया जाता है; CoT मॉडल प्रति स्ट्रिंग लगभग दोगुने टोकन पढ़ते हैं और अपने मध्यवर्ती टोकनों पर भी प्रशिक्षित होते हैं, जो ठीक वही अतिरिक्त मदद है जो स्क्रैचपैड देता है। सभी मॉडल ($n$, प्रारूप और सीड के हर संयोजन के लिए, और लंबाई-सामान्यीकरण वाले मॉडल भी) एक ही रन में प्रशिक्षित होते हैं: उनके भार अग्रणी अक्ष पर एक साथ रखे जाते हैं और ग्रेडिएंट क्लिपिंग प्रति मॉडल की जाती है, इसलिए वे कभी एक-दूसरे को प्रभावित नहीं करते (एक परीक्षण इसकी जाँच करता है)। आँकड़े: $n \ge 8$ के लिए $2^n$ स्ट्रिंगों का एक चौथाई (अधिकतम 1024) अलग रखा जाता है और उस पर कभी प्रशिक्षण नहीं होता; $n = 4$ और $6$ के लिए स्ट्रिंगें इतनी कम हैं कि कोई भी अलग नहीं रखी जा सकती, इसलिए वे सटीकताएँ (प्लॉट पर तारांकित) सामान्यीकरण नहीं, बल्कि फ़िटिंग मापती हैं। परीक्षण के समय CoT मॉडल अपना स्क्रैचपैड खुद लालची ढंग से, टोकन-दर-टोकन, लिखता है, और केवल उसका अंतिम उत्तर अंकित किया जाता है। निष्कर्ष: डिफ़ॉल्ट
  रन (2 सीड, संख्याएँ टर्मिनल में मुद्रित) में, (a) CoT मॉडल $n = 4, 6, 8, 10$ पर परीक्षण स्ट्रिंगों में से 0.98 से 1.00 का सही उत्तर देते हैं; प्रत्यक्ष मॉडल $n = 4$ की 16 स्ट्रिंगों पर फ़िट होते हैं (1.00), पर $n = 6, 8, 10$ पर 0.53, 0.27 और 0.53 अंक पाते हैं। $n = 8$ पर संयोग से नीचे के अंक की एक संभावित व्याख्या (यहाँ परखी नहीं गई): अलग रखी गई स्ट्रिंग अपने प्रशिक्षण-पड़ोसियों से एक बिट में भिन्न होती है और इसलिए उसकी पैरिटी उलटी होती है, और पड़ोसियों के बीच अंतर्वेशन करने वाला मॉडल उसे गलत बताता है। (b) लंबाई-सामान्यीकरण दोनों के लिए विफल होता है: $1 \le n \le 8$ पर प्रशिक्षित मॉडल $n = 12$ और $16$ पर 0.46 से 0.51 अंक पाते हैं, क्योंकि 19 से आगे की स्थितियों पर कभी प्रशिक्षण नहीं हुआ और, यहाँ प्रयुक्त CoT विन्यास में, बिट $b_k$ उसे चाहने वाले सेल से $n + 1$ स्थान पहले होता है, एक ऐसा अंतर जो $n$ के साथ बदलता है; मिश्रित-लंबाई वाले CoT मॉडल चरण-बजट के भीतर $n = 4$ पर महारत पा लेते हैं (1.00), पर $n = 8$ पर भी नहीं (0.56)। (c) $k$ चरणों के बाद स्क्रैचपैड को मिटा देने पर हर $k < n$ के
  लिए उत्तर संयोग-स्तर पर गिर जाता है: उत्तर अंतिम सेल से कॉपी होता है, इसलिए पूरी गणना लिखे गए टोकनों में ही रहती है। (d) $n = 8$ के CoT मॉडल में, हर चरण $k$ पर कोई न कोई हेड $s_k$ लिखने वाली क्वेरी के अटेंशन का 0.5 से 0.8 भाग $b_k$ पर रखता है, जबकि एकसमान अटेंशन के लिए यह 0.08 होता (अकेला एक हेड चरणों पर औसतन 0.48 देता है; हेड आपस में चरण बाँट लेते हैं)। नियम का दूसरा इनपुट, $s_{k-1}$, स्वयं क्वेरी टोकन है और अवशिष्ट धारा (residual stream) से होकर आउटपुट तक पहुँचता है, इसलिए सीखा गया नियम स्थानीय है: प्रति चरण दो टोकन। सीमाएँ: यह एक खिलौना मॉडल है जो क्रियाविधि दिखाता है, न कि यह कि बड़े भाषा मॉडल कैसे तर्क करते हैं। यह इस बारे में कुछ नहीं कहता कि किसी बड़े मॉडल के लिखे गए चरण उस गणना के प्रति निष्ठावान हैं या नहीं जो वास्तव में उसका उत्तर उत्पन्न करती है; यह एक खुला शोध प्रश्न है। परिणाम सीडों के बीच और चरण-बजट के साथ बदलते हैं, इसीलिए हर सीड प्लॉट किया गया है। अधिक चरण, 16 तक $n$, या एक ही परत आज़माकर देखें।'
meanings:
- 'हर उपसर्ग की चलती पैरिटी: स्क्रैचपैड के लक्ष्य, और $p = s_n$'
- प्रत्यक्ष या CoT प्रारूप में स्ट्रिंगें, टोकन आईडी $0, 1, :, =, \_$ के रूप में; रिक्त टोकनों से पैड की गईं ताकि एक $n$ के सभी मॉडल एक ही टेंसर साझा करें
- टोकन एम्बेडिंग और सीखा गया स्थिति एम्बेडिंग का योग, हर मॉडल $m$ की अपनी तालिकाएँ
- दोहराया गया $c$ ⇒ योग; मॉडल सूचकांक $m$ का योग नहीं होता, इसलिए $M$ स्वतंत्र ट्रांसफ़ॉर्मर एक ही गुणनफल में चलते हैं
- 'कारणात्मक (causal) अटेंशन: हर पंक्ति स्थितियों $j \le i$ पर एक प्रायिकता वितरण है'
- 'कौन से अगले टोकन प्रशिक्षित होते हैं: केवल $p$ (प्रत्यक्ष), या $s_1 \dots s_n$, "=" और $p$ (CoT)'
- मॉडल $m$ के प्रशिक्षित टोकनों का माध्य $-\log p$ (nats); उनका योग न्यूनतम किया जाता है, और हर पद केवल अपने ही भारों तक पहुँचता है
- परीक्षण के समय मॉडल अपना स्क्रैचपैड खुद लिखता है, प्रति फ़ॉरवर्ड पास एक टोकन, और उसके बाद उत्तर देता है
labels:
  steps: प्रशिक्षण चरण
  lengths: प्रयोग (a) की स्ट्रिंग लंबाइयाँ $n$
  seeds: प्रति मॉडल सीड
  d_model: मॉडल चौड़ाई $d$
  heads: अटेंशन हेड $H$
  layers: ट्रांसफ़ॉर्मर ब्लॉक
  batch: प्रति चरण स्ट्रिंगें
  lr: लर्निंग रेट
