source_hash: 85a6136cffba
title: 多層媒質中のスネルの法則
summary: 扇状に広がる光線が屈折率の異なる3つの層を横切る。ベクトル形式のスネルの法則により、1回の einsum ですべての光線を一度に屈折させ、全反射が起こるところでは鏡面反射に切り替える。
notes: 光線は速さ $c/n$ で進むので、光線の先端を結ぶ破線は波面である：密な層では遅れる。既定値では最下層は空気（$n = 1$）であり、その境界面で臨界角 $\arcsin(n_3/n_2)$ より急な光線は全反射して上へ戻る。2つの屈折率を等しくすると境界面が消える。
meanings:
- 光線 $r$ の単位方向ベクトル、成分 $i \in \{x, y\}$
- 入射光線の側を向いた単位法線
- 各光線が当たる境界面での屈折率比 $n_1/n_2$
- 繰り返される $j$ ⇒ 和をとる：各光線の $\cos\theta_i$
- 屈折方向（単位ベクトルのまま）
- 鏡面反射方向、$1 - \eta^2(1 - c^2) < 0$（全反射）のところで使用
labels:
  n1: 上層の屈折率 $n_1$
  n2: 中間層の屈折率 $n_2$
  n3: 下層の屈折率 $n_3$
  n_rays: 扇の光線数
  max_angle: 最大光線角
  t_max: シミュレーション時間
