title: बहुलकीकरण गतिकी और आण्विक-भार वितरण
summary: पद-वृद्धि (step-growth) बहुलक (पॉलिएस्टर, नायलॉन) इतने बहुपरिक्षेपी क्यों होते हैं, जबकि जीवित (living) बहुलकीकरण लगभग एकसमान शृंखलाएँ बनाता है? शृंखला लंबाइयों पर एक जनसंख्या संतुलन, दोनों क्रियाविधियों के लिए एक $(S, L)$ टेंसर, कैरोथर्स का $X_n = 1/(1-p)$ और फ़्लोरी का सर्वाधिक संभाव्य वितरण $w(x) = x(1-p)^2p^{x-1}$ परिक्षेपिता $Đ \to 2$ के साथ पुनः उत्पन्न करता है, जिसे 100 000 एकलकों के गतिक मोंटे कार्लो से जाँचा गया है, तथा जीवित शृंखलाओं का पॉयसन वितरण $Đ \approx 1 + 1/X_n$ के साथ।
notes: 'पद वृद्धि: हर अणु पर अभिक्रियाशील सिरे होते हैं (यहाँ एक A और एक B, जैसे हाइड्रॉक्सी अम्ल) और कोई भी दो शृंखलाएँ जुड़ सकती हैं, एकलक से एकलक, द्वितय से 50-मर। फ़्लोरी की समान-अभिक्रियाशीलता धारणा (दर शृंखला लंबाई पर निर्भर नहीं) जनसंख्या संतुलन को स्थिर कर्नेल वाले स्मोलुकोव्स्की स्कंदन समीकरण में बदल देती है, जिसका सटीक हल सर्वाधिक संभाव्य वितरण है: सिरों के एक अंश $p$ ने अभिक्रिया की है, इसलिए लंबाई $x$ की शृंखला $x - 1$ अभिक्रियित बंधों की एक कड़ी है जो एक अनभिक्रियित बंध पर समाप्त होती है, प्रायिकता $(1-p)p^{x-1}$ के साथ। इसके माध्य कैरोथर्स का $X_n = 1/(1-p)$ और $X_w = (1+p)/(1-p)$ हैं, इसलिए $Đ = 1 + p \to 2$। व्यावहारिक सबक कठोर है: 98 % रूपांतरण केवल $X_n = 50$ देता है, और लंबी शृंखलाओं के लिए $p > 0.99$ और अभिक्रियाशील समूहों का पूर्ण 1:1 संतुलन चाहिए। जीवित शृंखला वृद्धि (ऋणायनी, या ATRP या RAFT जैसी नियंत्रित मूलक विधियाँ, जो इसका सन्निकटन करती हैं) इसके विपरीत है: सभी शृंखलाएँ एक साथ शुरू होती हैं और बिना समापन के एक-एक एकलक जोड़कर बढ़ती हैं, इसलिए प्रति शृंखला $\nu$
  योगों के बाद लंबाइयाँ पॉयसन वितरित होती हैं और $Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ घटकर 1 की ओर जाता है। टेंसर रूप दोनों क्रियाविधियों को RK4 से आगे बढ़ाए गए एक $(S, L)$ टेंसर में रखता है। पद-वृद्धि संवलन $\sum_y P_y P_{x-y}$, $P$ से एकत्रित Toeplitz आव्यूह के साथ एक einsum है (FFT यही $O(L\log L)$ में करेगा)। चूँकि दोनों पंक्तियाँ $X_n = 1 + s$ वाली घड़ियाँ उपयोग करती हैं, हर फ़्रेम दोनों क्रियाविधियों की तुलना समान $X_n$ पर करता है, अक्ष $x / X_n$ पर जहाँ फ़्लोरी आकार स्थिर है और पॉयसन शिखर संकरा होता है। गतिक मोंटे कार्लो शृंखलाओं के यादृच्छिक युग्म जोड़ता है; यह प्रतिचयन रव तक जनसंख्या संतुलन से मेल खाता है, जो अंत के निकट बढ़ता है क्योंकि केवल $N_0(1-p)$ शृंखलाएँ बचती हैं ($p = 0.98$ पर 2000)। सरलीकरण: कोई वलय निर्माण नहीं, कोई पार्श्व अभिक्रिया नहीं, पूर्णतः संतुलित A–B रससमीकरणमिति, शृंखला लंबाइयाँ $L$ पर काटी गईं (छोड़ी गई पूँछ $10^{-6}$ से कम है), और जीवित स्थिति के लिए तात्क्षणिक आरंभन बिना समापन या स्थानांतरण के। समापन वाला पारंपरिक मुक्त-मूलक बहुलकीकरण बीच में आता है
  ($Đ \approx 1.5$–2)।'
meanings:
- 'क्रियाविधि $s$ के लिए लंबाई $x$ ($x = 1 … L$) की शृंखलाएँ: 0 = पद वृद्धि (प्रति एकलक), 1 = जीवित (प्रति आरंभक)'
- 'दोनों पंक्तियों के लिए एक घड़ी: पद वृद्धि के लिए $\tau = kN_0t$, जीवित वृद्धि के लिए $\nu = \int k_p[M]\,dt$'
- जनसंख्याओं से एकत्रित Toeplitz आव्यूह; जहाँ $x - y < 1$ वहाँ शून्य
- 'दोहराया गया $y$ ⇒ योग: $y$-मर को $(x-y)$-मर से जोड़ने के सभी तरीक़े'
- एक शृंखला अपने दोनों में से किसी भी सिरे से $N$ शृंखलाओं में से किसी के साथ अभिक्रिया करती है
- जीवित शृंखलाएँ केवल एकलक जोड़ती हैं, एक बार में एक इकाई, और कभी समाप्त नहीं होतीं
- '$x$ पर योग: आघूर्ण $k = 0, 1, 2$ से $X_n = \mu_1/\mu_0$, $X_w = \mu_2/\mu_1$'
- 'पद वृद्धि का सटीक हल: रूपांतरण $p = \tau/(1+\tau)$ पर प्रति आरंभिक एकलक शृंखलाएँ'
- जीवित वृद्धि का सटीक हल, क्रमगुणित के लिए lgamma के साथ
- 'एक बार में एक बंध से दो यादृच्छिक शृंखलाएँ जोड़ना: एक स्वतंत्र प्रसंभाव्य जाँच'
labels:
  p_max: अंतिम रूपांतरण $p$ (पद वृद्धि)
  n_monomers: मोंटे कार्लो में एकलक $N_0$
