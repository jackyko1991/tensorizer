source_hash: 5ff140d5db65
title: 자기 유사 폭발 프로파일 탐색
summary: '오늘날 특이점을 찾는 방법: $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$ 로 쓰고 편미분방정식을 미지 지수 $\lambda$ 를 가진 프로파일 $U$ 의 방정식으로 바꾼 뒤, 시험값 $\lambda$ 마다 하나씩 둔 후보 프로파일 묶음을 하나의 텐서로 가우스–뉴턴법으로 학습시킨다. 비점성 버거스 방정식에서는 잔차 깔때기가 정확한 값 $\lambda = 1/(2i+2)$ 에서만 무너지고, 학습된 프로파일은 고전적인 $y = -U - U^{2i+3}$ 와 일치한다. 같은 탐색을 비국소 코르도바–코르도바–폰텔로스 방정식에 적용하면 안정 지수 $\lambda \approx 1.18$ 를 찾는다.'
notes: 'fluids/navier_stokes_blowup 의 짝이 되는 문제다. 그쪽은 1983년의 그림으로, 테일러–그린 소용돌이를 시간 전진시키며 격자가 감당하지 못할 때까지 와도가 커지는 것을 본다. 현대적 방법은 시간 발전을 건너뛰고, 특이점이 자기 유사하다고 가정하여 프로파일을 직접 찾는다. $u = \tau^\lambda U(y)$ 를 $u_t + uu_x = 0$ 에 대입하면 $-\lambda U + ((1+\lambda)y + U)U'' = 0$ 를 얻는다. $y(U)$ 에 대한 선형 상미분방정식으로 풀면 $y = -U - C\,U^{1+1/\lambda}$ 이고, 이는 $1 + 1/\lambda$ 가 홀수 정수일 때만 매끄럽다. 따라서 $\lambda = 1/(2i+2)$ 이며, 정확한 프로파일은 $y = -U - U^{2i+3}$ 이다($U''(0) = -1$ 와 $U(-2) = 1$ 로 정규화). 이는 고전적인 결과다(Eggers & Fontelos, Singularities, 2015). $\lambda = 1/2$ 이 안정적이고 일반적인 폭발이며, $1/4, 1/6, \dots$ 은 미세하게 맞춘 초기 데이터가 필요하다. 여기서는 61개의 후보 프로파일을 $\lambda$ 를 고정한 채 동시에 학습시킨다. $\lambda$ 에 대한 최선의 잔차(깔때기)는 $\lambda = 1/2$ 에서 반올림 오차 수준($\sim10^{-15}$)까지, $1/4$ 에서 $\sim10^{-11}$ 까지 떨어진다. 그 사이에서는 훨씬 크다($\lambda = 0.37$ 에서 $\sim10^{7}$ 배). 그곳에는 매끄럽지 않은 항 $|y|^{1+1/\lambda}$ 을 가진 프로파일만 존재하기 때문이다. $U''''''(0) = 0$ 를 부과하면 $1/2$ 의 깔때기가 사라지고, 탐색은 $1/4$ 을 찾는다. $U^{(5)}(0) = 0$ 까지 부과하면 $1/6$ 이 골라져야 하지만, 이 해상도에서는 $1/6$ 근처의 깔때기가 너무 평평해 위치를 정할
  수 없다. 경쟁 프로파일들은 $y^{7}$ 차수에서만 다르고, 얕은 최솟값은 $\lambda \approx 0.19$ 에 놓인다. 잔차로는 안정과 불안정을 구별할 수 없다. 그것은 시간 발전의 성질이며, 여기서 불안정한 프로파일에는 추가 제약을 통해서만 도달한다. 프로파일은 연구에서 쓰는 귀납적 편향(콤팩트화한 좌표와 출력 형태 조정)을 갖춘 스펙트럼 전개이며, 연구 논문에서는 같은 편향을 가진 물리 정보 신경망(PINN)을 쓴다. 가우스–뉴턴법은 Wang et al. (2025) 의 최적화 방법이다. $\lambda$ 에 대한 경사 단계는 각 깔때기의 뾰족한 바닥에서 멈추므로, 묶음 단위의 황금분할 탐색으로 $\lambda$ 를 정한다. CCF 방정식 $\theta_t - (H\theta)\theta_x = 0$(표면 준지균 방정식의 1차원 모형, $H$ 는 힐베르트 변환)은 와도 형태 $\omega = \theta_x = \Omega(y)/\tau$ 로 푼다. $\Omega$ 는 $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$ 로 전개하며, 그 힐베르트 변환은 정확하다. 기본 실행은 $\lambda \approx 1.18$(잔차 $\sim10^{-4}$)을 찾고, 더 큰 기저로 오래 실행하면 $1.1808$(잔차 $2\times10^{-6}$)에 수렴한다. 이는 Eggers & Fontelos (Nonlinearity, 2020) 의 바닥 상태 지수 $\approx 1.18$ 과 일치한다. Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) 는 PINN으로 첫 번째 불안정 CCF 프로파일 $\lambda_1 \approx 0.6057$ 를 찾았다. Wang et al. (2025, arXiv 2509.14185) 는 두 번째 $\lambda_2 \approx 0.4713$ 를 찾았고, 배정밀도에 가까운 $10^{-13}$ 수준의 잔차에 도달했다. 그들은 다공성 매질 방정식과
  부시네스크 방정식에서도 새로운 불안정 계열을 찾았는데, 이는 수치적 후보다. 불안정한 프로파일은 가파른 기울기를 가져 이 1분짜리 CPU 탐색으로는 분해되지 않으며, 여기서는 안정 깔때기만 보인다. 현황: 버거스 프로파일은 정확한 정리다. CCF의 폭발은 Córdoba, Córdoba & Fontelos (Annals, 2005) 가 증명했다. 신경망 탐색으로 찾은 프로파일은 컴퓨터 보조 증명이 정리로 바꾸기 전까지는 수치적 후보이며, Chen & Hou (2022) 는 경계가 있는 축대칭 오일러 방정식의 호우–뤄 시나리오에 대해 그렇게 했다. 3차원 비압축성 나비에–스토크스 밀레니엄 문제는 여전히 미해결이며, 여기의 내용은 그 문제와 직접 관련이 없다. $\lambda$ 격자를 더 성기게 하거나 가우스–뉴턴 단계를 줄여 깔때기가 흐려지는 것을 보라.'
meanings:
- '묶음: 후보 프로파일마다 시험 지수 하나, 모두 동시에 학습'
- '콤팩트화한 좌표 $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$: $y = 0$ 에서 $r = 1$, $|y| \to \infty$ 일 때 $r \to 0$'
- 홀함수, $U'(0) = -1$, 먼 곳의 $U \sim y^{\lambda/(1+\lambda)}$ 이 내장됨. $P$ 는 $r$ 의 체비쇼프 급수
- 선점에서의 프로파일 방정식 잔차, 그리고 $U(2) = -1$ 와 매끄러움 제약
- $R$ 는 $c$ 에 대해 2차이므로 야코비안이 정확함(테스트에서 autograd와 대조)
- 묶음의 모든 구성원에 대한 레벤버그–마쿼트(감쇠 가우스–뉴턴) 단계를 한 번의 일괄 풀이로
- $U = -y + c_3y^3 + c_5y^5 + \dots$ 의 테일러 계수. 이를 0으로 만들면 $\lambda = 1/2$ 과 $1/4$ 의 깔때기가 사라짐
- 'CCF 기저의 정확한 힐베르트 변환: $(1-iy)^{-s}$ 는 위쪽 반평면에서 해석적'
- 각 깔때기의 바닥을 정함. 시험값 $\lambda$ 마다 프로파일을 다시 학습
labels:
  n_lambda: '묶음 크기: 시험 지수 $\lambda$'
  gn_steps: 프로파일당 가우스–뉴턴 단계
  ccf_lambda0: CCF 시작 지수 $\lambda_0$
