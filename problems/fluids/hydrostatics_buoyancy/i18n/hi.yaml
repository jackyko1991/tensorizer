title: द्रवस्थैतिक दाब और उत्प्लावकता
summary: 'पानी की टंकी में दाब गहराई के साथ रैखिक रूप से बढ़ता है, $p = p_0 + \rho_w g h$। भिन्न घनत्वों के गुटके एक साथ डाले जाते हैं (एक बैच टेंसर): हल्के ऊपर-नीचे डोलकर $\rho_b/\rho_w$ अंश पानी में डूबे तैरते हैं, भारी तल पर डूब जाते हैं।'
notes: हर गुटका भुजा $s$ का घन है; उत्प्लावन बल $\rho_w g s^2 d_b$ उसके द्वारा विस्थापित पानी का भार है (आर्किमिडीज़), और यह दाब $p_0 + \rho_w g h$ के ऊपरी फलक की तुलना में निचले फलक पर अधिक धकेलने का कुल परिणाम है। तैरता गुटका वहाँ स्थिर होता है जहाँ उत्प्लावकता भार को संतुलित करे, $d_b/s = \rho_b/\rho_w$ — बर्फ़ ($\rho \approx 917$) 92 % पानी में डूबी तैरती है। कर्षण भीगे आयतन के समानुपाती एक सरल रैखिक अवमंदन है; वास्तविक कर्षण द्विघात के अधिक निकट है, और वास्तविक तरंगें व संलग्न द्रव्यमान उपेक्षित हैं। डूबने वाले गुटके तल पर टिकते हैं।
meanings:
- पानी में बिंदुओं का ग्रिड, घटक $i \in \{x, z\}$
- गुरुत्व सदिश $(0, -g)$
- 'दोहराया गया $i$ ⇒ योग: गहराई $h = -z$ पर $g\,h$'
- गुटके $b$ के निचले फलक की ऊँचाई और वेग
- गुटके $b$ का घनत्व — बैच सूचकांक
- डूबी गहराई, 0 (हवा में) और $s$ (पूर्णतः भीगा) के बीच
- प्रति इकाई द्रव्यमान उत्प्लावकता घटा भार घटा कर्षण
labels:
  n_blocks: गुटकों की संख्या
  rho_min: सबसे हल्का घनत्व $\rho_\text{min}$
  rho_max: सबसे भारी घनत्व $\rho_\text{max}$
  size: गुटके का आकार $s$
  drag: अवमंदन $\gamma$
  t_max: अनुकरण समय
