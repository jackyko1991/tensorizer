source_hash: fdbefecc20a0
title: '원기둥을 지나는 흐름: 항력과 소용돌이 떨어짐'
summary: 원기둥을 지나는 흐름의 격자 볼츠만(D2Q9) 시뮬레이션. 분포 $f_{xyi}$는 einsum으로 만든 평형 분포를 향해 충돌하고 torch.roll로 흘러갑니다. 원기둥에 작용하는 힘은 원기둥에서 튕겨 나오는 모든 분포가 넘겨주는 운동량으로 구합니다. Re ≈ 47을 넘으면 후류가 카르만 소용돌이 열이 됩니다. 항력이 맥동하고 양력이 좌우로 흔들립니다.
notes: '격자 단위: 노드 간격과 시간 간격 1, 원기둥 지름 $D = 10$, 유입 속도 $U = 0.12$. 점성 $\nu = UD/\mathrm{Re}$가 완화 시간 $\tau = 3\nu + \tfrac12$를 정합니다. 이 모형은 $U$가 격자 음속 $1/\sqrt3$보다 충분히 작을 때 나비에–스토크스 방정식을 재현합니다. 유입은 고정된 평형 분포, 유출은 이웃 값을 복사하고, 위아래는 주기적이며(간격 $H$인 원기둥의 열), 원기둥은 완전 되튐(full-way bounce-back)을 써서 원을 계단 모양으로 근사합니다. 운동량 교환 힘은 원기둥에 부딪히는 모든 분포를 셉니다. 분포는 방향이 반대로 바뀌므로 $2 f_i\mathbf e_i$를 넘겨줍니다. 채널이 좁으므로($D/H \approx 0.18$) 항력은 Re = 100에서의 자유 흐름 값 $C_D \approx 1.4$보다 크고, 소용돌이 떨어짐도 조금 빠릅니다($St \approx 0.16$–$0.2$). 처음 수백 단계는 음향적 시작 과도 상태이므로 평균은 후반부에서 읽으세요. 시작할 때 옆으로 살짝 차 주면 소용돌이 떨어짐이 더 빨리 시작됩니다.'
meanings:
- '분포: 노드 $(x, y)$에서 격자 속도 $i$로 움직이는 유체'
- D2Q9 속도(정지, 축 4개, 대각선 4개)와 가중치
- '밀도: $i$에 대한 합'
- '반복된 $i$ ⇒ 합: 운동량 밀도'
- 각 격자 방향에 사영한 속도
- '흐름 단계: 각 분포를 링크 하나만큼 이동'
- 분포가 유체에서 원기둥 안으로 흘러 들어간 곳에서 1
- '운동량 교환: 원기둥에 작용하는 힘 (되튐이 각 충돌을 반전)'
labels:
  re: 레이놀즈 수 $UD/\nu$
  steps: 격자 시간 단계 수
