name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      - run: pixi run lint
      # Colab opens the committed notebooks/ — they must match the problem files
      - run: pixi run python scripts/notebooks.py --check
      - run: pixi run pytest -q tests/test_api.py

  # Physics checks + convention/diagram/render smoke tests, one job per topic in parallel.
  physics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic: [mechanics, optics, waves, thermodynamics, em, fluids, quantum, astro, nuclear, physchem, chemistry, medical, biophysics, bioinformatics, maths, graphics, others]
    env:
      TENSORIZER_CATEGORIES: ${{ matrix.topic }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      - run: pixi run pytest -q tests/test_physics_${{ matrix.topic }}*.py tests/test_smoke.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      - run: pixi run python scripts/build_assets.py --manifest-only
      - run: pixi run web-build
