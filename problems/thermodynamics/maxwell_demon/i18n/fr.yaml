source_hash: 6884660f84d2
title: Le démon de Maxwell, la machine de Szilard et le principe de Landauer
summary: 'Un démon regarde dans quelle moitié d''une boîte se trouve une particule brownienne et fait glisser une cloison pour la laisser pousser, tirant du travail d''un seul bain thermique. Des lots de machines de Langevin suramorties présentent l''addition : le travail vaut au plus $kT\,I \le kT\ln 2$ par bit, avec $I$ l''information mutuelle d''une mesure bruitée, effacer le bit coûte au moins $kT\ln 2$ (Landauer), et l''égalité de Sagawa–Ueda $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$ rétablit le second principe dès que l''information est comptée. Joué à l''envers, le log du rapport des probabilités des trajectoires est l''entropie produite.'
notes: 'Unités : $kT = 1$, mobilité $1$ (donc $D = 1$), demi-largeur de la boîte $a = 1$, temps en $a^2/D$. Maxwell (1867) imagina un être qui trie les molécules et bat le second principe ; Szilard (1929) le réduisit à une particule et un bit, valant au plus $kT\ln 2$ de travail. Landauer (1961) et Bennett (1982) ont résolu le paradoxe : le démon doit tôt ou tard effacer sa mémoire, ce qui coûte au moins $kT\ln 2$ par bit, si bien que le cycle complet obéit au second principe. Sagawa et Ueda (2010) l''ont rendu quantitatif pour une rétroaction avec erreurs : $\langle e^{-\beta(W-\Delta F)-I}\rangle = 1$, donc $\langle W_{ext}\rangle \le kT\langle I\rangle - \langle\Delta F\rangle$. Ce sont des théorèmes démontrés pour ce type de dynamique stochastique, et la simulation les vérifie numériquement. Modèle : les parois sont des ressorts raides $\kappa u^2/2$ ($\kappa = 500\,kT/a^2$), donc les énergies libres sont calculées numériquement à partir de $Z$ et non fixées à leurs valeurs de parois
  dures. La cloison est impénétrable, chaque particule garde donc son côté $s$. Les pas de Langevin sont corrigés par Metropolis (MALA), donc la distribution de Boltzmann, Jarzynski, Sagawa–Ueda et Crooks sont exactes au bruit d''échantillonnage près. L''effacement part de la boîte cloisonnée et se termine avec le piston au milieu, ce qui rend $\Delta F = kT\ln 2$ exact même avec des parois molles. Le registre compte le travail du déplacement de la cloison. Retirer la cloison à la fin restitue sa petite énergie de ressort. Données réelles, uniquement sous forme de valeurs citées (aucune figure reproduite) : Bérut et al., Nature 483, 187 (2012) et la version détaillée dans J. Stat. Mech. P06015 (2015) ont effacé un bit stocké dans une bille de silice de $2\,\mu$m dans un double puits optique. La chaleur moyenne diminuait avec la durée du cycle $\tau$ comme $\langle Q\rangle = kT\ln 2 + B/\tau$ avec $B = 8.15\,kT\cdot$s, et un ajustement à deux paramètres donnait une asymptote $A = 0.72\,kT$
  ($\pm 0.15\,kT$), proche de $kT\ln 2 \approx 0.693\,kT$. L''effacement simulé donne la même loi en $1/\tau$ dans ses propres unités. Renversement du temps : la dernière partie du film joue l''effacement à l''envers. Pour chaque trajectoire, le log du rapport entre sa probabilité directe et celle de la trajectoire renversée sous le protocole renversé vaut $\beta(W - \Delta F)$, l''entropie produite (Crooks 1999). Sa moyenne est positive, et $\langle e^{-\sigma}\rangle = 1$. À essayer : un taux d''erreur $\varepsilon$ plus grand (moins d''information, moins de travail ; $\varepsilon = 0.5$ ne donne rien), ou un $\tau$ plus court (plus de dissipation).'
meanings:
- parois molles de la boîte en $0$ et $2a$ plus la cloison en $p$, ressentie du côté $s=\pm1$ où se trouve la particule
- chaque machine part de l'équilibre $e^{-V/kT}/Z$ avec la cloison au milieu
- la lecture du démon, fausse avec la probabilité $\varepsilon$
- 'rétroaction : la cloison glisse jusqu''à $2a(1-\varepsilon)$ du côté auquel croit le démon'
- proposition d'Euler–Maruyama pour toutes les machines à la fois, acceptée par Metropolis–Hastings pour que $e^{-V/kT}$ soit exactement stationnaire
- travail fourni à la particule quand la paroi bouge à $x$ fixé
- $\ln 2(1-\varepsilon)$ si le démon avait raison, $\ln 2\varepsilon$ sinon ; sa moyenne est $I$
- 'méthode des trapèzes sur une grille pour un lot de positions de la cloison : $\Delta F = -kT\ln Z_1/Z_0$'
- $\ln P_F[x]/P_R[\tilde x]$ à partir des probabilités de transition de chaque pas plus les termes de bord
labels:
  eps: Taux d'erreur de mesure du démon $\varepsilon$
  tau: Durée de la rétroaction $\tau$ (déplacement de la cloison, $a^2/D$)
  tau_erase: Durée d'effacement la plus lente ($a^2/D$)
  n_engines: Machines par taux d'erreur
  seed: Graine aléatoire
