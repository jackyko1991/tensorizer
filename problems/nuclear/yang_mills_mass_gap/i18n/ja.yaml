source_hash: 1bffd0a0cc18
title: 格子上の Yang–Mills 理論と質量ギャップ
summary: クレイ研究所のミレニアム懸賞問題は、質量ギャップ $\Delta > 0$ をもつ 4 次元の厳密な量子 Yang–Mills 理論を求めている。これは未解決である。Wilson の格子ゲージ理論はこの問いを計算可能にする：単位四元数として格納したリンク $U_\mu(x) \in SU(2)$（または $U(1)$）を、結合定数 $\beta$ のバッチ全体について一度に Metropolis 法で更新する。Wilson ループは閉じ込めの面積則を示し、プラケットは 2 次元の厳密な Bessel 比および強結合展開と一致し、グルーボール相関関数から格子上の質量の推定値が得られる。
notes: 状態：未解決。クレイ問題（Jaffe と Witten による公式の問題記述）は、任意のコンパクト単純ゲージ群について、Wightman や Osterwalder–Schrader のような公理を満たす量子 Yang–Mills 理論を $\mathbb R^4$ 上に構成し、そのスペクトルが真空の上にギャップ $\Delta > 0$ をもつことを証明するよう求めている。$SU(3)$ の格子シミュレーションは約 $1.7$ GeV の最軽量グルーボールを与え、閉じ込め（線形ポテンシャル、測定された弦張力）を合理的な疑いの余地なく示しているが、有限の格子間隔での数値的証拠は証明ではない。本ページは同じ枠組みでおもちゃサイズの計算を行う。2 次元では理論は厳密に解ける：各プラケットは独立で、$U(1)$ では $\langle\frac12\mathrm{Tr}P\rangle = I_1(\beta)/I_0(\beta)$、$SU(2)$ では $I_2(\beta)/I_1(\beta)$ であり、$W(R,T) = u^{RT}$ が厳密に成り立つ（テストになる）。強結合（小さい $\beta$）では、指標展開がどの次元でも同じ主要値と、弦張力 $\sigma = -\ln u$ の面積則を与える：そこでは閉じ込めが証明されており（Osterwalder–Seiler 1978）、3 次元のコンパクト $U(1)$ ではすべての $\beta$ で証明されている（Göpfert–Mack 1982）。難しいのは、格子間隔がゼロに近づく 4 次元の弱結合 $\beta \to \infty$ への連続性である。漸近的自由性（Gross、Wilczek、Politzer、2004 年ノーベル賞）によれば、連続極限はまさにそこにある。Creutz 比 $\chi(R,R)$ は、周長項が相殺するようにループの比から $\sigma$ を推定する。グルーボール演算子は時間スライス上の空間的プラケットの和であり、その連結相関関数は $e^{-m\Delta}$ のように減衰する。強結合では 2 つのプラケットを結ぶ最小曲面が $4\Delta$ 枚の面からなるチューブであるため、$a\,m \approx -4\ln u$ となる。より大きな $\beta$
  では格子単位での質量が小さくなり、より大きな格子、スメアリング、はるかに多くのスイープが必要になる。4 次元の $U(1)$ は $\beta \approx 1.01$ 付近に非閉じ込め転移をもち、それより上では質量ギャップがない。これが、この問題が非可換群について述べられている理由である。ステップ幅 $\propto 1/\sqrt{\beta}$ の Metropolis 法により採択率はおよそ半分に保たれる。誤差は 20 個のジャックナイフビンで評価する。
meanings:
- リンクごとに 1 つの単位四元数を、バッチ内の各結合定数 $\beta_b$ について持つ。$U(1)$ は部分群 $(\cos\theta, 0, 0, \sin\theta)$
- 群の演算則。繰り返す $i, j$ ⇒ 和をとる（外積）
- 周期的格子上の隣接点：全サイトの全プラケットを一度に扱う
- 最小の Wilson ループ。$\frac12\mathrm{Tr}(ab) = a_0b_0 - a_kb_k$
- $2(D-1)$ 個のステープルの和：$S$ のうち $U_\mu(x)$ を含む部分は $-\beta\frac12\mathrm{Tr}(U_\mu A_\mu)$
- 1 つの方向・1 つのチェッカーボードの偶奇に属する全リンクに同時に Metropolis 更新を行う（それらはステープルを共有しない）
- $R\times T$ の長方形を一周するリンクの積を、サイト・平面・向きについて平均したもの
- $U(1)$ では $I_1/I_0$、$SU(2)$ では $I_2/I_1$：2 次元では厳密な $\langle\frac12\mathrm{Tr}P\rangle$、任意の $D$ では最低次
- 空間的プラケット演算子の $\ln C(\Delta)/C(\Delta+1)$（ジャックナイフ誤差付き）
labels:
  group: ゲージ群
  dim: 次元 $D$
  size: 格子サイズ $L$（一辺あたりのサイト数）
  beta: ループとグルーボールの結合定数 $\beta$
  sweeps: モンテカルロ・スイープ数
