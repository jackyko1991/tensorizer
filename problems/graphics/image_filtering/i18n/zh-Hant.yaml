source_hash: 35a326f71a76
title: 以摺積進行影像濾波
summary: 在程序化繪製的測試影像上滑動一個小核，進行模糊、銳化與邊緣偵測。每個線性濾波器都是對展開後的像素窗做一次縮併 $O_p = K_k P_{kp}$，與 conv2d 相同；高斯核可分解為兩次一維運算，而摺積定理把它化為傅立葉轉換的乘積。內容包括方框與高斯模糊、Sobel 邊緣、高斯拉普拉斯、反銳化遮罩，以及在椒鹽雜訊上比較中值濾波與高斯濾波。
notes: 方框濾波器的頻率響應是帶有負向漣波的 sinc，因此它會讓細節通過，其中一部分還被翻轉了符號（啁啾訊號的條紋會淡出又重現）；高斯的響應則是另一個平滑降至零的高斯。可分離性對速度很重要：$(2r+1)^2$ 的核每個像素需要 $(2r+1)^2$ 次乘法，兩次一維運算只需 $2(2r+1)$ 次。Sobel（1968）把微分與平滑結合；高斯拉普拉斯在二階導數過零處響應，而 Canny（1986）在同樣的平滑梯度上加入細化與遲滯。反銳化遮罩加回 $\alpha(I - G * I)$，這是一種高通增強，也會放大雜訊。中值不是線性的，所以沒有核也沒有頻率響應，但它能去除孤立的椒鹽像素，而高斯只會把它們抹開（比較終端中的 PSNR）。每一層摺積神經網路都是同樣的展開再縮併運算，只是核是學習而來的。
meanings:
- 像素 $(i, j)$ 的灰階：漸層、圓盤、正方形、三角形與啁啾訊號，再加上雜訊
- 濾波器權重，每個像素都相同
- 重複的 $a, b$ ⇒ 對窗內求和（相關運算，PyTorch 稱之為摺積）
- 像素 $p$ 周圍的窗排成一行，$k = (a, b)$
- 重複的 $k$ ⇒ 求和：同一個濾波器寫成一次 einsum
- 二維高斯是外積，因此可以拆成一次列方向與一次行方向的運算
- Sobel：橫向的 $[1, 2, 1]$ 平滑乘以縱向的 $[-1, 0, 1]$ 差分
- 摺積定理：傅立葉空間中的逐點乘積，等於採用環繞填補的 conv2d
labels:
  size: 影像大小
  sigma: 高斯寬度 $\sigma$
  box: 方框大小
  amount: 銳化程度 $\alpha$
  noise: 高斯雜訊 $\sigma_n$
  salt_pepper: 椒鹽雜訊比例
  median: 中值窗大小
