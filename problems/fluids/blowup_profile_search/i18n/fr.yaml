source_hash: 5ff140d5db65
title: Recherche de profils d'explosion autosimilaires
summary: 'Comment on traque aujourd''hui les singularités : écrire $u = (T-t)^\lambda U\big(x/(T-t)^{1+\lambda}\big)$, transformer l''EDP en une équation pour le profil $U$ avec un exposant inconnu $\lambda$, puis entraîner un lot de profils candidats, un par valeur d''essai de $\lambda$, comme un seul tenseur par Gauss–Newton. Pour Burgers non visqueux, les entonnoirs de résidu ne s''effondrent qu''aux valeurs exactes $\lambda = 1/(2i+2)$, et les profils appris coïncident avec les profils classiques $y = -U - U^{2i+3}$. La même recherche sur l''équation non locale de Córdoba–Córdoba–Fontelos trouve son exposant stable $\lambda \approx 1.18$.'
notes: 'Compagnon de fluids/navier_stokes_blowup, qui montre l''image de 1983 : faire avancer le tourbillon de Taylor–Green et regarder la vorticité croître jusqu''à ce que la grille ne suive plus. L''approche moderne saute l''évolution temporelle : elle suppose que la singularité est autosimilaire et cherche directement le profil. En substituant $u = \tau^\lambda U(y)$ dans $u_t + uu_x = 0$, on obtient $-\lambda U + ((1+\lambda)y + U)U'' = 0$. Résolue comme une EDO linéaire pour $y(U)$, elle donne $y = -U - C\,U^{1+1/\lambda}$, qui n''est lisse que si $1 + 1/\lambda$ est un entier impair. Donc $\lambda = 1/(2i+2)$, avec les profils exacts $y = -U - U^{2i+3}$ (normalisés par $U''(0) = -1$ et $U(-2) = 1$). Ce sont des résultats classiques (Eggers & Fontelos, Singularities, 2015). $\lambda = 1/2$ est l''explosion stable et générique ; $1/4, 1/6, \dots$ exigent des données ajustées finement. Ici, 61 profils candidats sont entraînés simultanément à $\lambda$ fixé. Le meilleur résidu en fonction
  de $\lambda$ (l''entonnoir) tombe à l''erreur d''arrondi ($\sim10^{-15}$) en $\lambda = 1/2$ et à $\sim10^{-11}$ en $1/4$. Entre les deux, il est bien plus grand ($\sim10^{7}$ fois plus grand en $\lambda = 0.37$), car seuls existent là des profils avec un terme non lisse $|y|^{1+1/\lambda}$. Imposer $U''''''(0) = 0$ supprime l''entonnoir en $1/2$, et la recherche trouve alors $1/4$. Imposer en plus $U^{(5)}(0) = 0$ devrait isoler $1/6$. À cette résolution, cependant, l''entonnoir près de $1/6$ est trop plat pour le localiser : les profils concurrents ne diffèrent qu''à l''ordre $y^{7}$, et le minimum peu profond tombe en $\lambda \approx 0.19$. Le résidu ne distingue pas stable et instable : c''est une propriété de l''évolution temporelle, et les profils instables ne sont atteints ici que par les contraintes supplémentaires. Le profil est un développement spectral doté des biais inductifs utilisés en recherche, une coordonnée compactifiée et une mise en forme de la sortie ; les articles
  de recherche utilisent des réseaux de neurones informés par la physique (PINN) avec les mêmes biais. Gauss–Newton est l''optimiseur de Wang et al. (2025). Les pas de gradient sur $\lambda$ calent à la pointe de chaque entonnoir, si bien qu''une recherche par section dorée, en lot, fixe $\lambda$. L''équation CCF $\theta_t - (H\theta)\theta_x = 0$ (un modèle 1D de l''équation quasi-géostrophique de surface ; $H$ est la transformée de Hilbert) est résolue sous forme de vorticité, $\omega = \theta_x = \Omega(y)/\tau$. $\Omega$ est développé en $\operatorname{Im}(1-iy)^{-s}$, $s = j/(1+\lambda) + m$, dont les transformées de Hilbert sont exactes. Le calcul par défaut trouve $\lambda \approx 1.18$ (résidu $\sim10^{-4}$) ; des calculs plus longs avec une base plus grande se stabilisent à $1.1808$ (résidu $2\times10^{-6}$). Cela concorde avec l''exposant de l''état fondamental $\approx 1.18$ d''Eggers & Fontelos (Nonlinearity, 2020). Wang, Lai, Gómez-Serrano & Buckmaster (PRL, 2023) ont trouvé
  le premier profil CCF instable avec des PINN, $\lambda_1 \approx 0.6057$. Wang et al. (2025, arXiv 2509.14185) en ont trouvé un second, $\lambda_2 \approx 0.4713$, et ont atteint des résidus proches de $10^{-13}$, voisins de la double précision. Ils ont aussi trouvé de nouvelles familles instables pour les équations des milieux poreux et de Boussinesq, qui sont des candidats numériques. Les profils instables ont des gradients raides que cette recherche d''une minute sur CPU ne résout pas ; elle ne montre que l''entonnoir stable. Statut : les profils de Burgers sont des théorèmes exacts. L''explosion pour CCF a été démontrée par Córdoba, Córdoba & Fontelos (Annals, 2005). Les profils trouvés par recherche neuronale restent des candidats numériques jusqu''à ce qu''une preuve assistée par ordinateur en fasse des théorèmes, comme Chen & Hou (2022) l''ont fait pour le scénario de Hou–Luo d''Euler axisymétrique avec bord. Le problème du millénaire de Navier–Stokes incompressible 3D reste ouvert,
  et rien ici ne le concerne directement. Essayez une grille de $\lambda$ plus grossière ou moins de pas de Gauss–Newton, et regardez les entonnoirs s''estomper.'
meanings:
- 'le lot : un exposant d''essai par profil candidat, tous entraînés en même temps'
- 'coordonnée compactifiée $r = (1 + y^2/L^2)^{-1/(2(1+\lambda))}$ : $r = 1$ en $y = 0$, $r \to 0$ quand $|y| \to \infty$'
- impair, $U'(0) = -1$ et $U \sim y^{\lambda/(1+\lambda)}$ à l'infini sont intégrés ; $P$ est une série de Tchebychev en $r$
- résidu de l'équation du profil aux points de collocation, plus $U(2) = -1$ et les contraintes de régularité
- $R$ est quadratique en $c$, donc la jacobienne est exacte (vérifiée contre autograd dans les tests)
- pas de Levenberg–Marquardt (Gauss–Newton amorti) pour chaque membre du lot en une seule résolution groupée
- coefficients de Taylor de $U = -y + c_3y^3 + c_5y^5 + \dots$ ; les annuler supprime les entonnoirs en $\lambda = 1/2$ et $1/4$
- 'transformée de Hilbert exacte de la base CCF : $(1-iy)^{-s}$ est analytique dans le demi-plan supérieur'
- localise le fond de chaque entonnoir ; le profil est réentraîné à chaque valeur d'essai de $\lambda$
labels:
  n_lambda: 'Taille du lot : exposants d''essai $\lambda$'
  gn_steps: Pas de Gauss–Newton par profil
  ccf_lambda0: Exposant de départ CCF $\lambda_0$
