source_hash: 28d4b810cb16
title: 制限三体問題のラグランジュ点
summary: 恒星と惑星が互いのまわりを回る。その回転座標系では、試験粒子は重力、遠心力、コリオリ力を受け、これらは $\varepsilon_{ijk}$ で書かれる。$\nabla\Phi_\mathrm{eff} = 0$ にニュートン法を適用すると（勾配とヘッシアンは autograd で計算）、5つのラグランジュ点が一度に求まり、L4 から少しずらした粒子はオタマジャクシ型軌道や馬蹄形軌道を描く。
notes: 単位：天体間距離 1、$G(M_1 + M_2) = 1$ なので、2天体は $2\pi$ ごとに1回転する。惑星の質量比は $\mu$ であり、試験粒子は軽すぎてどちらの天体も乱さない。L1、L2、L3 は2天体を結ぶ直線上にあり $\Phi_\mathrm{eff}$ の鞍点である。L4 と L5 は2天体と正三角形をなし $\Phi_\mathrm{eff}$ の極大点であるが、$\mu < 0.0385$ のときコリオリ力により安定となる。木星のトロヤ群小惑星が惑星の 60° 前方と後方に集まるのはこのためである。ずらし量を大きくすると、小さなオタマジャクシ型ループが大きくなり、ついには L3 も回り込む馬蹄形軌道になる。$\mu$ が 0.0385 を超えると粒子は離れていく。
meanings:
- 回転座標系における試験粒子 $b$ の位置
- 恒星は $(-\mu, 0, 0)$、惑星は $(1-\mu, 0, 0)$
- 繰り返される $s$ ⇒ 和をとる：両天体の重力
- 外積のためのレヴィ＝チヴィタ記号
- コリオリ加速度、$\boldsymbol\Omega = \hat{\mathbf z}$
- 5点すべてでの autograd による勾配
- autograd によるヘッシアン：ニュートン法の1ステップは1回のバッチ化した linalg.solve
- $-2\Phi_\mathrm{eff} - \dot x_i\dot x_i$、保存量
labels:
  mu: 惑星の質量比 $\mu$
  nudge: 軌道方向への L4 からの最大ずれ
  t_max: シミュレーション時間
  dt: 時間刻み
