title: Gauß' 17-Eck mit Zirkel und Lineal
summary: '1796, einen Monat vor seinem 19. Geburtstag, fand Gauß heraus, dass sich das regelmäßige 17-Eck mit Zirkel und Lineal zeichnen lässt: das erste neue konstruierbare Vieleck seit den Griechen. Die 17. Einheitswurzeln, zu Gaußschen Perioden gruppiert, lösen eine Kette quadratischer Gleichungen. Diese Kette schreibt $\cos(2\pi/17)$ allein mit Quadratwurzeln. Richmonds Konstruktion von 1893 zeichnet dann das Vieleck Schritt für Schritt, mit Schnitten von Geraden und Kreisen als Tensoroperationen. Ein Raster zeigt, welche $n$-Ecke konstruierbar sind (Satz von Gauß–Wantzel). Alles hier ist bewiesene klassische Mathematik.'
notes: 'Gauß fand das 17-Eck am 30. März 1796, kurz vor seinem 19. Geburtstag, und angeblich entschied er sich deshalb für die Mathematik statt für die Philologie. Die Theorie veröffentlichte er im letzten Abschnitt der Disquisitiones Arithmeticae (1801). Die Idee: Die 16 nichttrivialen Wurzeln $\zeta^k$ werden durch $k \mapsto 3k \bmod 17$ zyklisch vertauscht, weil 3 eine Primitivwurzel ist. Summiert man in dieser zyklischen Reihenfolge jede zweite Wurzel, erhält man zwei Perioden mit 8 Termen, mit $\eta_0 + \eta_1 = -1$ und $\eta_0\eta_1 = -4$, also $\eta_{0,1} = (-1 \pm \sqrt{17})/2$. Weiteres Halbieren ergibt Perioden mit 4, 2 und 1 Termen. Jedes Paar ist das Wurzelpaar einer quadratischen Gleichung, deren Koeffizienten Perioden der Stufe darüber sind, denn die Untergruppen haben die Ordnungen $16 \to 8 \to 4 \to 2 \to 1$, alles Zweierpotenzen. Die Perioden mit 2 Termen sind $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$, also liefern vier Quadratwurzeln die Gaußsche Formel. Das Programm
  prüft jede quadratische Beziehung mit exakten ganzzahligen Koeffizienten, baut jede Periode allein aus Quadratwurzeln wieder auf und vergleicht die geschlossene Formel mit `torch.cos` (und mit sympy auf 60 Stellen, wenn es installiert ist). Jede Primitivwurzel (3, 5, 6, 7, 10, 11, 12, 14) liefert denselben Baum in anderer Reihenfolge. Eine Quadratwurzel ist eine Operation mit Zirkel und Lineal, also ist das Vieleck konstruierbar. H. W. Richmond (1893) gab ein kurzes Rezept am Einheitskreis. Man nimmt $OJ = OB/4$ auf dem senkrechten Radius. Man legt $E$ auf den Durchmesser mit $\angle OJE = \tfrac14\angle OJP_0$ (zwei Winkelhalbierungen) und $F$ mit $\angle EJF = 45°$. Der Kreis über dem Durchmesser $FP_0$ schneidet $OB$ in $K$. Der Kreis um $E$ durch $K$ schneidet den Durchmesser in $N_3 = \cos(6\pi/17)$ und $N_5 = \cos(10\pi/17)$, und die Senkrechten dort liefern $P_3$ und $P_5$. Hier zeichnet jeder Schritt wirklich eine Gerade durch zwei Punkte oder einen Kreis um einen Punkt durch einen
  anderen. Jeder neue Punkt ist ein Schnitt Gerade–Gerade, Gerade–Kreis oder Kreis–Kreis, und die übrigen Ecken werden mit Kreisen abgetragen: um $P_k$ durch $P_{k-1}$, und um $P_0$ durch $P_k$ für das Spiegelbild. Die 55 Schritte setzen alle 17 Ecken bis auf etwa $10^{-15}$ an $e^{2\pi i k/17}$ in float64; mit float32 sieht man den Rundungsfehler auf etwa $10^{-6}$ wachsen. Gauß gab an, dass das $n$-Eck konstruierbar ist, wenn $n = 2^k p_1 \cdots p_r$ mit verschiedenen Fermatschen Primzahlen $p_i = 2^{2^j} + 1$. Wantzel (1837) bewies, dass kein anderes $n$ geht, und erledigte damit auch die Dreiteilung des Winkels und die Würfelverdopplung. Das ist gleichwertig damit, dass die Eulersche Phi-Funktion $\varphi(n)$ eine Zweierpotenz ist, und das Raster prüft beide Tests bis $n$. Die einzigen bekannten Fermatschen Primzahlen sind 3, 5, 17, 257 und 65537. Richelot veröffentlichte das 257-Eck 1832, und J. G. Hermes arbeitete etwa zehn Jahre am 65537-Eck, 1894 abgeschlossen und in Göttingen aufbewahrt.
  Gauß soll sich ein 17-Eck auf seinem Grabstein gewünscht haben; der Steinmetz soll abgelehnt haben, weil es wie ein Kreis aussähe. Das Gauß-Denkmal in Braunschweig trägt stattdessen einen 17-zackigen Stern.'
meanings:
- die 17. Einheitswurzeln, die Ecken des 17-Ecks in der komplexen Ebene
- 'die Exponenten in der Reihenfolge der Potenzen einer Primitivwurzel, $g = 3$: 1, 3, 9, 10, 13, …'
- 'welche Positionen der zyklischen Reihenfolge die Periode $i$ auf Stufe $m$ bilden: jede $2^m$-te'
- 'wiederholtes $j$ ⇒ summiert: alle Gaußschen Perioden aller fünf Stufen (Längen 16, 8, 4, 2, 1) auf einmal'
- das Produkt zweier Geschwisterperioden ist eine Summe von $\zeta^{a+b}$; das Zählen der Exponenten ergibt ganze Zahlen, die auf den Perioden der Elternstufe konstant sind
- 'wiederholtes $k$ ⇒ summiert: das konstante Glied jeder quadratischen Gleichung aus der Stufe darüber'
- 'eine Quadratwurzel pro Stufe: $16 \to 8 \to 4 \to 2 \to 1$; Stufe 3 enthält $2\cos(2\pi k/17)$'
- 'die drei Zirkel-und-Lineal-Schritte als Tensorformeln: ein $2\times 2$-System über Kreuzprodukte, eine quadratische Gleichung in $t$ und die Potenzgerade zweier Kreise'
- Eulersche Phi-Funktion per Sieb; konstruierbar genau dann, wenn $\varphi(n)$ eine Zweierpotenz ist, geprüft als $x \,\&\, (x-1) = 0$
- 'der ungerade Anteil muss $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$ teilen: ein Produkt verschiedener Fermatscher Primzahlen'
labels:
  generator: Primitivwurzel $g$ für die zyklische Reihenfolge
  precision: Genauigkeit der Konstruktion
  n_max: Konstruierbarkeitsraster bis $n$
