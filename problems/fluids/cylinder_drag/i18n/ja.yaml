source_hash: fdbefecc20a0
title: 円柱まわりの流れ：抗力と渦放出
summary: 円柱まわりの流れの格子ボルツマン法（D2Q9）シミュレーション。分布関数 $f_{xyi}$ は einsum で組み立てた平衡分布に向かって衝突し、torch.roll で並進する。円柱に働く力は、円柱で跳ね返るすべての分布関数が渡す運動量から求まる。Re ≈ 47 を超えると後流はカルマン渦列となる：抗力が脈動し、揚力が左右に振れる。
notes: 格子単位：節点間隔と時間刻みは 1、円柱の直径 $D = 10$、流入速度 $U = 0.12$。粘性 $\nu = UD/\mathrm{Re}$ が緩和時間 $\tau = 3\nu + \tfrac12$ を決める。$U$ が格子音速 $1/\sqrt3$ より十分小さいとき、このモデルはナビエ–ストークス方程式を再現する。流入口は固定された平衡分布、流出口は隣の値をコピー、上下は周期境界（間隔 $H$ の円柱の列）であり、円柱には完全バウンスバック（円の階段近似）を用いる。運動量交換による力は円柱に当たるすべての分布関数を数える：分布関数は向きを反転するので $2 f_i\mathbf e_i$ を渡す。流路が狭い（$D/H \approx 0.18$）ため、Re = 100 での抗力は一様流中の $C_D \approx 1.4$ より大きく、渦放出はやや速い（$St \approx 0.16$–$0.2$）。最初の数百ステップは音波による立ち上がりの過渡状態なので、平均値は後半から読み取ること。最初に横方向に小さく蹴ると渦放出が早く始まる。
meanings:
- 分布関数：節点 $(x, y)$ で格子速度 $i$ で動く流体
- D2Q9 の速度（静止、4軸、4対角）と重み
- 密度：$i$ についての和
- 繰り返される $i$ ⇒ 和をとる：運動量密度
- 各格子方向に射影した速度
- 並進：各分布関数をリンク1つ分ずらす
- 分布関数が流体から円柱内へ並進したところで 1
- 運動量交換：円柱に働く力（バウンスバックは各衝突を反転させる）
labels:
  re: レイノルズ数 $UD/\nu$
  steps: 格子時間ステップ数
