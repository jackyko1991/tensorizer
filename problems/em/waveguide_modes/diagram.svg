<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Hollow rectangular metal waveguide of width a and height b; the cross-section shows the TE10 mode electric field E, strongest in the middle, and the wave travels along the pipe with propagation constant beta">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <path d="M34.0,64.0 L110.0,24.0 L202.0,24.0 L126.0,64.0 Z" fill="#93c5fd" stroke="#374151" stroke-width="2" fill-opacity="0.6" stroke-linejoin="round"/>
    <path d="M126.0,64.0 L202.0,24.0 L202.0,78.0 L126.0,118.0 Z" fill="#93c5fd" stroke="#374151" stroke-width="2" fill-opacity="0.35" stroke-linejoin="round"/>
    <rect x="34" y="64" width="92" height="54" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
    <line x1="53.7" y1="103.5" x2="53.7" y2="78.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="66.9" y1="109.0" x2="66.9" y2="73.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80.0" y1="111.0" x2="80.0" y2="71.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="93.1" y1="109.0" x2="93.1" y2="73.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="106.3" y1="103.5" x2="106.3" y2="78.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="80" y="136" font-style="italic" text-anchor="middle">a</text>
    <text x="20" y="96" font-style="italic" text-anchor="middle">b</text>
    <line x1="150.0" y1="134.0" x2="208.0" y2="104.0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-o)"/>
    <text x="214" y="124" font-style="italic" fill="#b45309">β</text>
    <text x="39" y="83" font-style="italic" fill="#b91c1c" font-size="13">E</text>
  </g>
</svg>
