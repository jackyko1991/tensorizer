<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Ray tracing: a ray leaves the camera at o with direction d, passes through one pixel of the image plane and hits a sphere; at the hit point the normal n is drawn and a dashed shadow ray goes to the light L; the sphere casts a shadow on the floor">
  <defs>
    <marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- floor and the sphere's shadow -->
    <line x1="40" y1="140" x2="236" y2="140" stroke="#374151" stroke-width="2"/>
    <ellipse cx="190" cy="140" rx="26" ry="3.5" fill="#9ca3af"/>
    <!-- camera -->
    <rect x="6" y="92" width="14" height="16" rx="2" fill="#374151"/>
    <circle cx="24" cy="100" r="3" fill="#374151"/>
    <text x="14" y="124" font-style="italic">o</text>
    <!-- image plane with pixel rows; the pixel this ray passes through is highlighted -->
    <rect x="58" y="60" width="10" height="72" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="58" y1="68" x2="68" y2="68"/><line x1="58" y1="76" x2="68" y2="76"/><line x1="58" y1="84" x2="68" y2="84"/>
      <line x1="58" y1="100" x2="68" y2="100"/><line x1="58" y1="108" x2="68" y2="108"/><line x1="58" y1="116" x2="68" y2="116"/>
      <line x1="58" y1="124" x2="68" y2="124"/>
    </g>
    <rect x="58" y="84" width="10" height="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- sphere -->
    <circle cx="165" cy="95" r="30" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <!-- primary ray o + t d -->
    <line x1="24" y1="100" x2="139" y2="77.4" stroke="#374151" stroke-width="2" marker-end="url(#ray)"/>
    <text x="92" y="80" font-style="italic">d</text>
    <!-- shadow ray to the light -->
    <line x1="141" y1="77" x2="114" y2="26" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="110" cy="18" r="7" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="1.5">
      <line x1="96" y1="18" x2="100" y2="18"/><line x1="120" y1="18" x2="124" y2="18"/>
      <line x1="110" y1="4" x2="110" y2="8"/><line x1="100" y1="8" x2="103" y2="11"/><line x1="120" y1="8" x2="117" y2="11"/>
    </g>
    <text x="128" y="23" font-style="italic" fill="#b45309">L</text>
    <!-- normal at the hit point -->
    <line x1="141" y1="77" x2="122" y2="62.6" stroke="#f59e0b" stroke-width="2" marker-end="url(#normal)"/>
    <text x="146" y="62" font-style="italic" fill="#b45309">n</text>
    <circle cx="141" cy="77" r="2.5" fill="#ffffff" stroke="#1e40af" stroke-width="1"/>
  </g>
</svg>
