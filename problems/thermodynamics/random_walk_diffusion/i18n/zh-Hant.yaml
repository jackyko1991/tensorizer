source_hash: 16ad9ff3967d
title: 隨機漫步與擴散
summary: 數千個布朗粒子各自受到隨機衝擊。存成一個 (時間, 漫步者, 2) 張量，漫步只是一次 cumsum；均方位移 $\langle x_i x_i\rangle$——一次 einsum——隨時間線性增長為 $2dDt$，而漫步者群則擴散成高斯分佈。
notes: 每一步是每個分量變異數為 $2D\Delta t$ 的高斯衝擊，因此經過時間 $t$ 後每個座標的變異數為 $2Dt$，在 $d$ 維中與起點距離平方的平均為 $2dDt$（此處 $d = 2$）。對漫步者指標 $n$ 求和，把隨機的粒子群變成平滑、可預測的定律——這就是擴散。漫步者數有限，使量得的 MSD 有約 $\sqrt{2/N}$ 的相對擾動；隨機種子固定，因此圖形可重現。單位任意（例如 µm 與 s）。
meanings:
- 第 $s$ 步、漫步者 $n$、分量 $i$ 的獨立標準常態衝擊
- 漫步者 $n$ 在時間 $t$ 的位置：其衝擊的累加和
- 重複的 $n$ 與 $i$ ⇒ 求和：每個時刻的均方位移
- MSD 對 $t$ 過原點的最小平方斜率，除以 $2d$
- 擴散方程式 $\partial_t\rho = D\,\partial_i\partial_i\rho$ 從點源出發的解
labels:
  n_walkers: 漫步者數
  D: 擴散常數 $D$
  t_max: 模擬時間
  n_steps: 時間步數
