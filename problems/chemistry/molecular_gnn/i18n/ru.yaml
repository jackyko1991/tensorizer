source_hash: 176bf5bc914e
title: Графовая нейронная сеть для молекул (передача сообщений)
summary: 'Молекула — это граф, а нейронная сеть с передачей сообщений — несколько einsum по её матрице смежности: каждый атом многократно суммирует состояния соседей, $s_{mic} = A_{mij}h_{mjc}$, а предсказание для молекулы — сумма по атомам. Обученная предсказывать π-электронную энергию Хюккеля случайных сопряжённых углеводородов, она даёт один и тот же ответ при любой нумерации атомов и продолжает работать на молекулах крупнее любых из обучающей выборки, где обычный MLP на матрице смежности терпит неудачу.'
notes: 'Данные намеренно синтетические, чтобы правильный ответ был известен точно. Каждая «молекула» — случайный углеродный скелет без атомов водорода (дерево не более чем с тремя соседями у каждого атома углерода, замкнутое в несколько 5- и 6-членных циклов): теоретико-графовые игрушки, а не отобранный набор реальных соединений. Её метка — π-электронная энергия Хюккеля: при $H = \alpha + \beta A$ и одном π-электроне на атом углерода, заполняющем орбитали с наибольшими собственными значениями $\lambda_k$ матрицы $A$, $E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$, и сеть учится находить $y = \sum_k o_k\lambda_k$ только по графу. Собственных значений она никогда не видит. Тензорный урок в том, что графовой нейронной сети нужна лишь одна новая операция — einsum по смежности $A_{mij}h_{mjc}$, суммирующий состояния соседей каждого атома в каждой молекуле сразу. Все веса действуют на один атом за раз, а атомы объединяются только через $A$ и итоговую сумму, поэтому модель инвариантна к перестановкам
  по построению, и одни и те же веса подходят для молекулы любого размера. Консоль показывает оба свойства: перенумерация атомов меняет выход GNN примерно на $10^{-6}$ (округление float32), а выход MLP — на целые единицы $|\beta|$; на молекулах с 11–16 атомами углерода, крупнее любых в обучении, MLP никогда ничего не видел в дополнительных строках своего входа и ошибается, тогда как ошибка GNN почти не растёт. Сравните с базовой моделью «подсчёта связей» $aN + bN_{bonds} + c$: π-энергия почти аддитивна (около $1.2|\beta|$ на атом углерода), и настоящая задача GNN — поправки от ветвления, циклов и нечётных электронов, где она примерно вдвое уменьшает ошибку. Четыре раунда сообщений доходят лишь на четыре связи, поэтому эффекты, зависящие от всей сопряжённой системы (ароматичность, 4n-циклы), выучиваются лишь приближённо. Это схема нейронной сети с передачей сообщений (MPNN) Гилмера и др. (ICML 2017), которые показали, что многие более ранние молекулярные графовые сети укладываются в эту схему,
  и обучили их на DFT-свойствах молекул QM9. Модели этого семейства (SchNet, DimeNet, эквивариантные сети вроде NequIP или MACE, которые используют и трёхмерную геометрию) сейчас широко применяются для предсказания молекулярных свойств и аппроксимации межатомных потенциалов, но они хороши лишь настолько, насколько хороши их обучающие данные, и могут ошибаться на химии, непохожей на них. Попробуйте 1 слой (только ближайшие соседи), меньше обучающих молекул или более узкую сеть.'
meanings:
- смежность углеродного скелета молекулы $m$, дополненная нулями до $N = 16$ атомов
- 'признаки атома: one-hot число соседних атомов углерода (1, 2 или 3)'
- 'цель: занятые собственные значения Хюккеля для $A$ (eigvalsh), π-энергия в единицах $|\beta|$'
- 'суммирование по $f$: вложение каждого атома в $C$ каналов'
- 'повторяющийся $j$ ⇒ суммирование по соседям атома $i$: сообщение'
- 'суммирование по $c$: одни и те же веса для каждого атома каждой молекулы'
- выученная энергия на атом (цвета на молекуле)
- 'суммирование по $i$ по реальным атомам: экстенсивно по размеру и не зависит от порядка атомов'
- 'перенумерация атомов: выход GNN остаётся тем же с точностью float'
- 'базовая модель: сеть фиксированного размера на 256 развёрнутых элементах матрицы смежности'
labels:
  n_train: Обучающие молекулы
  epochs: Эпохи обучения
  width: Каналы $C$
  layers: Слои передачи сообщений $L$
  lr: Скорость обучения Adam
