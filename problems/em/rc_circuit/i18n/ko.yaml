source_hash: 6cf1e64854dc
title: 축전기 충전 (RC 회로)
summary: 저항을 통해 충전되는 축전기는 $dV/dt = (V_s - V)/(RC)$를 따릅니다. 저항이 서로 다른 여러 회로를 전압 텐서 하나로 쌓아 두므로 룽게–쿠타 한 단계로 모든 회로를 전진시킵니다. 전원을 사각파로 바꾸면 축전기가 충전과 방전을 반복하는 모습을 볼 수 있습니다.
notes: '단위: $R$은 kΩ, $C$는 mF이므로 $\tau = RC$는 초 단위, $I$는 mA 단위로 나옵니다. 시간 상수 하나가 지나면 축전기는 전원 전압의 63 %에 이르고, $5\tau$ 후에는 사실상 가득 찹니다. 전지로 충전하는 동안 전원은 $CV_s^2$의 에너지를 공급합니다. 정확히 절반은 축전기에 저장되고 나머지 절반은 $R$에서 열로 바뀝니다. $R$의 값과 상관없이 그렇습니다.'
meanings:
- 축전기 $b$ 양단의 전압(회로마다 한 원소)
- 회로 $b$의 저항
- 전기용량, 모든 회로에서 같음
- 전원 전압, 모든 회로가 공유($b$에 대해 브로드캐스팅)
- '원소별 연산: 지표 $b$가 양변에 한 번씩 나타나며 합하지 않음'
- 각 저항을 흐르는 전류
- 각 축전기에 저장된 에너지
labels:
  V_s: 전원 전압
  C: 전기용량
  R_min: 최소 저항
  R_max: 최대 저항
  n_circuits: 회로 수
  source: 전원
  period: 사각파 주기
  t_max: 시뮬레이션 시간
