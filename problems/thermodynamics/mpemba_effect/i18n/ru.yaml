title: Марковский эффект Мпембы
summary: Может ли горячая вода замёрзнуть быстрее тёплой? Для частицы, прыгающей в решёточном потенциале с метрополисовскими скоростями, ответ — да. Основное кинетическое уравнение $\dot p = W p$ диагонализуется один раз, каждая начальная температура проецируется на самую медленную моду одним einsum, и горячий старт, у которого амплитуда медленной моды $a_2$ обращается в ноль, релаксирует экспоненциально быстрее более холодного.
notes: 'Единицы: $k_B = 1$, частота попыток равна 1. Термостат находится при $T_b$, а система стартует в равновесии при температуре $T_0$. Если прыжки подчиняются детальному равновесию, $W_{ij}\pi_j = W_{ji}\pi_i$, то $W$ подобна симметричной матрице, поэтому все её собственные значения вещественны и $\le 0$, а её стационарное состояние — распределение Больцмана $\pi$. Через короткое время остаётся только самая медленная мода, $p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$, поэтому старт с меньшим $\lvert a_2\rvert$ оказывается ближе к равновесию, какова бы ни была его температура. Поскольку $a_2(T_0)$ не обязана быть монотонной, более горячий старт может обогнать более тёплый (марковский эффект Мпембы). При особой $T^*$, где $a_2 = 0$, медленная мода полностью отсутствует, и релаксация идёт с более высокой скоростью $\lambda_3$ (сильный эффект). В этом потенциале форма возникает из конкуренции бассейнов. При низкой $T_0$ глубокая узкая яма удерживает большую часть вероятности. При промежуточной
  $T_0$ широкая мелкая яма выигрывает за счёт энтропии. При высокой $T_0$ заполняется приподнятое плато, поэтому доля левого бассейна снова растёт и проходит своё равновесное значение при $T^*$. Теория принадлежит Lu & Raz (PNAS, 2017). Kumar & Bechhoefer (Nature, 2020) наблюдали эффект, включая сильную версию, с коллоидной частицей в оптически сформированном двухъямном потенциале. Kumar, Chétrite & Bechhoefer (PNAS, 2022) затем наблюдали обратный эффект (аномальный нагрев). Недавно сообщалось о квантовых аналогах в экспериментах с захваченными ионами. Эта решётка — модельная версия таких систем. Попробуйте повысить $T_b$: выше примерно $1.4$ пересечение исчезает.'
meanings:
- 'ступенчатая энергия узла $i$: плато, глубокая узкая яма, барьер, широкая мелкая яма'
- 1 для ближайших соседей в цепочке, иначе 0
- скорость прыжка $j \to i$; диагональ делает сумму каждого столбца равной нулю
- состояние Больцмана при каждой начальной температуре $T_{0,b}$, пакет стартов
- 'повторяющийся $j$ ⇒ суммирование: основное кинетическое уравнение для всех стартов сразу'
- eigh симметризованной $\Pi^{-1/2} W \Pi^{1/2}$; $\lambda_1 = 0$ — равновесие, $\lambda_2$ — самое медленное затухание
- 'повторяющийся $i$ ⇒ суммирование: перекрытие каждого старта с каждой модой'
- 'повторяющийся $k$ ⇒ суммирование: точное решение в каждый момент времени'
- расстояние Кульбака–Лейблера до равновесия, $\sum_i p_i \ln(p_i/\pi_i)$
labels:
  T_bath: Температура термостата $T_b$
  barrier: Высота барьера $U_\text{bar}$
  T_hot: Горячий старт $T_\text{hot}$
