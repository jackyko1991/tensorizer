source_hash: 840ee0536fe3
title: 3次元の N 体重力
summary: $N$ 個の天体間のニュートン重力。ブロードキャストですべての対の変位 $r_{abi}$ を一度に作り、1回の einsum で各天体 $a$ に働くすべての天体 $b$ からの引力を足し合わせ、速度ベルレ法で系全体を時間発展させる。
notes: 軟化長 $\varepsilon$ は、2天体がごく近くを通過するときに力を有限に保つ。$\varepsilon = 0$ なら厳密なニュートン重力である。単位は $G = 1$ となるように選ぶ。速度ベルレ法はシンプレクティックなので、エネルギー誤差はドリフトせず小さく有界に保たれる。8の字軌道は、Moore（1993）と Chenciner & Montgomery（2000）によって発見された有名な周期的三体軌道である。
meanings:
- 天体 $a$ の位置、成分 $i \in \{x, y, z\}$
- 天体 $b$ の質量
- $a$ から $b$ への変位、ブロードキャストで全対
- 繰り返される $j$ ⇒ 和をとる：各対の距離の2乗
- 繰り返される $b$ ⇒ 和をとる：天体 $a$ に働く引力の合計
- 運動エネルギー + 対ポテンシャル、保存量
labels:
  scenario: 初期条件
  t_max: シミュレーション時間
  dt: 時間刻み
  softening: 軟化長 $\varepsilon$
