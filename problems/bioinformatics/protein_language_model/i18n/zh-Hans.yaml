source_hash: 2038e43e9d92
title: 微型蛋白质语言模型学会接触
summary: 一个使用 einsum 注意力 $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$ 的两层 Transformer，只被训练去填补序列中被遮蔽的字母，这些序列来自在格点折叠上植入耦合的 Potts 模型。没有人告诉它结构，但其对称化、经 APC 校正的注意力图却指向植入的接触——这正是蛋白质语言模型接触预测头背后的思想。
notes: 为什么注意力能找到接触？在 Potts 模型中，给定其他所有位点时，位点 $i$ 的字母只取决于与它耦合的位点（其马尔可夫毯），所以猜测被遮蔽字母的最佳方式就是查看它的接触伙伴，而注意力恰好学会了这么做。Rao et al. 的“Transformer protein language models are unsupervised structure learners”（ICLR 2021）表明，在数百万条天然序列上训练的大型蛋白质语言模型的注意力图编码了接触，可以通过在少数蛋白质上拟合、作用于经 APC 校正并对称化的注意力图的逻辑回归读出。后来的模型如 ESM-2（2022–2023）进一步从这类表示预测三维结构。这里的读出完全是无监督的（对注意力头简单取平均），蛋白质家族是合成的，测试损失与两个不依赖上下文的基线比较：一元模型（单一字母分布）与逐位点谱。胜过逐位点谱意味着模型利用了上下文，即耦合。蛇形折叠把接触放在反对角线上，类似 β 折叠的链；随机残基对只有约 5 % 的时候是对的。APC 去除了所有位置都会关注的那些位置的背景。试试更弱的耦合、更少的序列或单个注意力头。
meanings:
- 仅在格点折叠中相互接触的残基之间的随机耦合块；吉布斯采样把它们变成一个序列家族
- 字母 $s_{ni}$ 的词元嵌入加位置嵌入（被遮蔽的字母使用 [MASK] 词元）
- 重复的 $c$ ⇒ 求和：每个注意力头的查询（键与值同理）
- 重复的 $k$ ⇒ 求和；每一行都是对被关注位置 $j$ 的概率分布
- 重复的 $j$，然后 $h, k$ ⇒ 求和：每个位置从其他位置收集到的信息
- 15 % 被遮蔽位置上真实字母的交叉熵，用 Adam 最小化
- 对测试序列取平均、按每个头对称化并做 APC 校正，再对层 $l$ 与头 $h$ 取平均的注意力
labels:
  coupling: 植入耦合强度 $\sigma_J$
  n_seq: 训练序列数
  q: 字母表大小 $q$
  layers: Transformer 层数
  heads: 注意力头数 $H$
  d_model: 模型宽度 $d$
  steps: 训练步数
  lr: 学习率
  mask_rate: 遮蔽比例
