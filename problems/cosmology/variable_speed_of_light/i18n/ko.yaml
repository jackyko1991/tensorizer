source_hash: b1b7792277b6
title: 가변 광속과 지평선 문제
summary: '표준 ΛCDM에서 우주 마이크로파 배경(CMB)의 하늘은 서로 신호를 주고받은 적 없는 약 $10^4$개의 조각으로 나뉘는데, 왜 CMB는 모든 방향에서 온도가 같을까요? 우주들의 배치에 대해 $\chi_p = \int c\,d\ln a/(aH)$를 적분해 세 가지 답을 비교합니다: 없음(ΛCDM), 인플레이션(줄어드는 허블 반지름의 $\sim 60$ e-폴드), 그리고 상전이 이전에 빛이 약 $10^{26}$배 빨랐다는 모팻(Moffat)과 알브레히트–마게이주(Albrecht–Magueijo)의 사변적인 가변 광속(VSL) 아이디어입니다. 인플레이션이 주류 설명이며, VSL은 소수 의견의 사변적 대안입니다.'
notes: 'Planck 2018 매개변수($H_0 = 67.4$ km/s/Mpc, $\Omega_m = 0.315$, $\Omega_r = 9.1\times10^{-5}$, 평탄), 마지막 산란은 $a_\mathrm{rec} = 1/1090$. ΛCDM에서 입자 지평선은 오늘 14.2 Gpc이지만 재결합 시기에는 약 0.28 Gpc에 불과하므로, 인과적 조각 하나는 약 1.2°에 걸치고 하늘에는 약 $10^4$개가 들어갑니다. 공형 도표에서 빛은 45°로 움직이며, 서로 반대편 CMB 두 점의 과거 광원뿔은 $\chi_p(a_\mathrm{rec}) \ge D$(CMB까지의 거리, 13.9 Gpc)일 때만 겹칩니다. 인플레이션은 $a_*$에서 끝나는 $N$ e-폴드의 드 지터 팽창으로 이를 해결합니다(공동 허블 반지름이 $\propto 1/a$로 줄어듦). VSL은 표준 팽창을 유지하되 $a_*$에서의 전이 이전에 $c$를 $r$배 크게 만들며, 전이는 폭 $w = 0.1$ e-폴드의 매끄러운 계단입니다. 애니메이션은 두 가지를 점차 켭니다. 현황: VSL(Moffat 1993; Albrecht, Magueijo 1999)은 사변적이며 소수 의견입니다. 차원 있는 상수가 변할 수 있는 틀이 필요하고(측정 가능한 것은 $\alpha = e^2/4\pi\varepsilon_0\hbar c$ 같은 무차원 조합뿐), 예측은 모형에 따라 달라지며, 관측적 뒷받침이 없습니다. 인플레이션은 표준 설명으로, 역시 직접 확인되지는 않았지만(원시 B-모드는 아직 없음) 측정된 CMB 요동 스펙트럼과 일치합니다. 제약(터미널에 출력): 원자시계 $\dot\alpha/\alpha = (1.0\pm1.1)\times10^{-18}$/년, 오클로 원자로 2 Gyr 동안 $|\Delta\alpha/\alpha| \lesssim 10^{-7}$, 재결합 시기 CMB $|\Delta\alpha/\alpha| \lesssim 4\times10^{-3}$, GW170817 $-3\times10^{-15}
  \le (v_\mathrm{gw}-c)/c \le 7\times10^{-16}$. $a_* \sim 10^{-28}$에서의 전이는 이 모두를 피해 가며, 바로 그 때문에 검증하기가 매우 어렵습니다.'
meanings:
- $a_*$보다 훨씬 이전부터 오늘까지의 $\ln a$ 격자
- '각 $a$에서 우주(프레임) $m$의 광속: $a_*$ 이전에는 $c_0$의 $r$배'
- 팽창률, 인플레이션의 $N$ e-폴드 동안 $H(a_*)$에 고정
- '공동 허블 반지름: 팽창 시간 하나 동안 빛이 가는 거리'
- '$a$를 따른 누적 사다리꼴 적분: 공동 입자 지평선'
- CMB 하늘에서 인과적 조각 하나의 각도와 조각의 수
labels:
  log10_c_ratio: 'VSL: 초기 광속 $\log_{10}(c_\mathrm{early}/c_0)$'
  efolds: '인플레이션: e-폴드 수 $N$'
  log10_a_star: 전이 / 인플레이션 종료 $\log_{10} a_*$
  n_grid: $\ln a$ 격자 점 수
