source_hash: 75e6d7e3dc93
title: Doppelpendel und Chaos
summary: Die Lagrange-Gleichungen eines Doppelpendels in der Form $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$. Jede RK4-Stufe baut den $2\times 2$-Massenmatrix-Tensor auf und ruft torch.linalg.solve auf; zwei fast identische Anfangszustände laufen auseinander und zeigen Chaos.
notes: Der Batch enthält zwei Pendel, deren $\theta_2$ sich um $\delta$ unterscheidet. Ihre Differenz wächst ungefähr exponentiell, bis die Bewegungen nichts mehr miteinander zu tun haben, obwohl die Energie jedes Pendels sehr genau konstant bleibt (float64 + RK4 mit kleinem Schritt). Für kleine Ausschläge hat das System zwei Normalmoden; bei gleichen Massen und Längen ist $\omega^2 = (2 \mp \sqrt2)\,g/L$. Die Stäbe sind masselos und die Aufhängung reibungsfrei.
meanings:
- Winkel $(\theta_1, \theta_2)$ des Pendels $b$ gegen die Senkrechte nach unten
- Winkelgeschwindigkeiten
- konfigurationsabhängige Massenmatrix, Nebendiagonale $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 'verallgemeinerte Kräfte: Zentrifugalkopplung + Gravitation'
- löse $M\ddot q = f$ für den ganzen Batch in einem Aufruf
- '$i$ und $j$ summiert: doppelte kinetische Energie'
labels:
  theta1: Anfangswert $\theta_1$
  theta2: Anfangswert $\theta_2$
  delta: Störung $\delta$ von $\theta_2$
  m1: Obere Masse $m_1$
  m2: Untere Masse $m_2$
  L1: Oberer Stab $L_1$
  L2: Unterer Stab $L_2$
  t_max: Simulierte Zeit
