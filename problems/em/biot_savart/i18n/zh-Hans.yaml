source_hash: 4d0cdb4cbe20
title: 载流线圈的磁场（毕奥–萨伐尔定律）
summary: 毕奥–萨伐尔定律把导线化为短线元之和。叉积 $d\mathbf l\times\mathbf r$ 就是列维-奇维塔张量 $\varepsilon_{ijk}$ 与两个矢量的缩并，因此对（$i, j, k$，线元）做一次 einsum 即可得到整个线圈在每个格点的磁场。线圈半径时胀时缩，$x$–$z$ 平面内及轴线上的磁场随之变化。
notes: 国际单位制（$\mu_0 = 4\pi\times 10^{-7}$ T·m/A），磁场以 μT 显示。线圈位于水平面内，因此 $x$–$z$ 平面与每个线圈交于两点（⊙ 电流穿出纸面，⊗ 穿入纸面）。亥姆霍兹线圈（间距 $R$，电流相等）在两线圈之间产生近乎均匀的磁场；反亥姆霍兹线圈（电流反向）的磁场在中心为零并线性增长——这正是冷原子实验所用的磁阱。靠近导线的格点使用一个小的软化长度，使磁场保持有限。
meanings:
- 平面 $y = 0$ 上的场点 $g$
- 导线线元 $s$ 的中点和方向矢量
- 从每个线元到每个场点（广播）
- 列维-奇维塔符号：叉积的张量形式
- 重复的 $j, k$ ⇒ 叉积；重复的 $s$ ⇒ 沿导线求和
- 每个线圈的精确结果 $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$，用于检验求和
labels:
  layout: 线圈
  current: 电流
  radius: 平均线圈半径
  n_segments: 每个线圈的线元数
  n_grid: 每边箭头数
