source_hash: e272fe98f3be
title: एक छोटा CNN DNA बंधन मोटिफ़ खोजता है
summary: यादृच्छिक DNA अनुक्रमों के एक समुच्चय में से आधे में एक प्रतिलेखन-कारक (transcription factor) बंधन स्थल की एक अपभ्रष्ट (degenerate) प्रति होती है। एक-परत 1D संवलनी (convolutional) नेटवर्क, $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$ और फिर max-pooling, autograd और Adam से उन्हें अलग करना सीखता है; अनुक्रम लोगो के रूप में पढ़ने पर इसका सबसे महत्त्वपूर्ण फ़िल्टर रोपित मोटिफ़ बन जाता है।
notes: 'प्रतिलेखन कारक DNA से वहाँ बँधता है जहाँ उसे एक छोटा, थोड़ा परिवर्तनशील शब्द मिलता है, उसका मोटिफ़, जिसे आमतौर पर स्थिति भार आव्यूह (PWM) से सारांशित किया जाता है। PWM से अनुक्रम को स्कैन करना ठीक one-hot अनुक्रम का $w \times 4$ फ़िल्टर के साथ 1D संवलन है, इसीलिए संवलनी नेटवर्क जीनोमिकी के लिए उपयुक्त हैं: पहली परत के फ़िल्टर मोटिफ़ संसूचक हैं और max-pooling उत्तर को स्थल की स्थिति से स्वतंत्र बनाता है। यहाँ नेटवर्क को कोई नहीं बताता कि मोटिफ़ क्या है: वह केवल लेबल देखता है, और प्रवणता अवतरण उसके सबसे उपयोगी फ़िल्टर को रोपित शब्द का आकार देता है (लोगो को रव से स्पष्ट होते देखें)। धराशायी रेखा एक संदर्भ है जो मोटिफ़ जानता है: वास्तविक PWM से स्कैन। चूँकि रोपित स्थल अपभ्रष्ट हैं और यादृच्छिक DNA कभी-कभी स्थल जैसा दिखता है, वह भी 100% तक नहीं पहुँचता, और प्रशिक्षित नेटवर्क उसके निकट समाप्त होता है। केवल अग्र रज्जुक (forward strand) प्रयुक्त है और पृष्ठभूमि एकसमान है; वास्तविक मॉडल विपरीत पूरक (reverse complement) को भी स्कैन करते हैं और उन्हें GC मात्रा, पुनरावृत्तियों और रवयुक्त प्रायोगिक
  लेबलों से निपटना पड़ता है। यह DeepBind (2015) के पीछे का विचार है, जिसने प्रोटीन-बंधन प्रयोगों से मोटिफ़ सीखे; Basset, Basenji और Enformer जैसे मॉडल 100-kb अनुक्रमों से क्रोमैटिन और अभिव्यक्ति की भविष्यवाणी के लिए कहीं अधिक परतें (और ध्यान) जोड़ते हैं। यह खिलौना केवल पहली परत के विचार को दोहराता है। कमज़ोर मोटिफ़, छोटा मोटिफ़ (E-box, CACGTG, संयोग से अधिक बार आता है), या कम फ़िल्टर आज़माएँ।'
meanings:
- 'रोपित स्थिति भार आव्यूह: सर्वसम्मत (consensus) क्षार प्रायिकता "strength" के साथ, शेष तीन बाकी बाँटते हैं'
- अनुक्रम $n$ में स्थिति $l$ पर क्षार $b \in$ {A, C, G, T} है; यदि स्थल रोपा गया हो तो लेबल $y_n = 1$
- $w$ क्षारों की हर खिड़की (एक व्यू, कोई प्रति नहीं), $P = \ell - w + 1$
- 'प्रशिक्षणीय फ़िल्टर: प्रति क्षार और स्थिति एक स्कोर, PWM जैसा ही आकार'
- 'संवलन: $k, b$ पर योग, फ़िल्टर $f$ हर स्थिति $p$ पर स्कोर किया गया'
- 'वैश्विक max pooling: कहीं भी सबसे अच्छा मेल, इसलिए स्थल किसी भी स्थिति पर हो सकता है'
- लॉजिट, $f$ पर योग; द्विआधारी क्रॉस-एन्ट्रॉपी, autograd और Adam (100 के मिनी-बैच) से प्रशिक्षित
- 'वापस मोटिफ़ की ओर, जैसा DeepBind करता है: हर धनात्मक अनुक्रम की सबसे अच्छी खिड़की $p^*_{nf}$ का औसत, जिसका स्कोर शीर्ष स्कोर के आधे से अधिक हो ($\kappa_{nf} = 1$), $n$ पर योग'
- 'बिट में सूचना सामग्री: स्थिति $k$ पर लोगो स्तंभ की ऊँचाई'
- सबसे अच्छे विस्थापन पर सीखे और रोपित आव्यूहों का सहसंबंध; 1 = समान
labels:
  motif: 'रोपित मोटिफ़: NF-κB, AP-1 या E-box'
  strength: सर्वसम्मत क्षार की प्रायिकता
  n_seq: अनुक्रम (80% प्रशिक्षण / 20% परीक्षण)
  length: अनुक्रम लंबाई $\ell$
  n_filters: फ़िल्टर $F$
  width: फ़िल्टर चौड़ाई $w$
  epochs: प्रशिक्षण युग (epochs)
  lr: Adam अधिगम दर
