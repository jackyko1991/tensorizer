source_hash: b05c63a03eb9
title: DT 热斑的惯性聚变点火
summary: 内爆氘氚靶丸中心热斑的零维模型。来自 $\mathrm{D + T \to {}^4He + n}$ 的 α 粒子加热热斑，轫致辐射和膨胀使其冷却，而逸入冷壳层的热量为燃烧提供燃料。整个起始温度与面密度 $(T_0, \rho R_0)$ 网格作为一个批次积分：在类劳森边界之上热斑失控并燃烧，之下则熄灭。
notes: 惯性约束把几百微克的 DT 压缩得如此之快，使其在飞散之前就燃烧。当热斑产生的 α 粒子加热它的速度快于它的冷却速度时，热斑点火。有两个数决定这一点：温度，因为 $\langle\sigma v\rangle$ 在几十 keV 以内急剧上升；以及面密度 $\rho R$，因为更厚的热斑能阻止自身的 α 粒子（10 keV 附近 α 射程约 0.3 g/cm²），并能更久地抵抗膨胀而维持聚集。仅轫致辐射就决定了理想点火温度，约 4.3 keV，此时 $\tfrac14\langle\sigma v\rangle E_\alpha = C_B\sqrt T$。虚线是瞬时平衡，即劳森判据的 ICF 形式；阴影区域是完整积分得到的结果，其中还计入了向冷壳层的燃烧传播。增大损失倍数 $L$，边界移向更大的 $\rho R$ 和更高的 $T$。研究背景：2022 年 12 月 5 日，美国国家点火装置（National Ignition Facility）报告了首次靶增益大于 1 的实验室聚变实验，靶上 2.05 MJ 激光产生约 3.15 MJ 聚变能量（近似值；Indirect Drive ICF Collaboration, Phys. Rev. Lett. 132, 065102, 2024），此前已实现燃烧等离子体（Zylstra et al., Nature 601, 542, 2022），以及 2021 年 8 月一次 1.3 MJ 的打靶超过了点火的劳森判据（Phys. Rev. Lett. 129, 075001, 2022）。靶增益只计入到达靶上的激光能量；驱动激光器所耗电能要大得多。简化：密度固定的均匀零维热斑（因此燃耗份额被高估——除了 PdV 损失项外没有任何东西使其解体），示意性的 α 沉积公式，近似的 Spitzer 热导（$\ln\Lambda \approx 10$），无辐射俘获，无烧蚀层物质混合，且离子与电子温度相等。
meanings:
- 每个网格点 $b = i\,n_r + j$ 是一个热斑；状态为 $(\ln T, \ln\rho R, \varphi)$
- Bosch–Hale DT 反应率，10 keV 时 $\approx 1.14\times10^{-22}$ m³/s，在 65 keV 附近达到峰值 $\approx 9\times10^{-22}$
- 3.5 MeV α 粒子能量中在热斑内被阻止的份额
- 轫致辐射，$C_B = 5.34\times10^{-37}$ W m³ keV$^{-1/2}$
- 以声速膨胀的热斑所做的 PdV 功
- 向壳层的 Spitzer 热传导；作为新的热质量回收（燃烧传播）
- 所有热斑同时计算的右端项，用 RK4 推进
- 自加热等于损失处的类劳森曲线，由批量二分法求得
labels:
  density: 热斑密度 $\rho$
  loss: 损失倍数 $L$（轫致辐射 + PdV）
  rho_r_max: 可用燃料总 $\rho R$
  t_end: 模拟时间
  n_grid: 每轴网格点数
  t_min: 最低 $T_0$
  t_max_init: 最高 $T_0$
