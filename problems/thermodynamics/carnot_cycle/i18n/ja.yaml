source_hash: 539b278aa207
title: 理想気体のカルノーサイクル
summary: 理想気体の2本の等温線と2本の断熱線を、$(V, p)$ 点のテンソルとしてサンプリングする。仕事は $p$–$V$ 図で囲まれた面積であり torch.trapezoid で計算し、効率 $W/Q_h$ はカルノーの限界 $1 - T_c/T_h$ にぴったり一致する。
notes: 熱が境界を通過するのは等温過程だけである：$Q_h = nRT_h\ln(V_2/V_1)$ を吸収し、$Q_c = nRT_c\ln(V_3/V_4)$ を放出する。断熱線が体積比を結びつけるので $V_3/V_4 = V_2/V_1$ となり、これが効率が2つの温度だけに依存する理由である。圧縮過程は $V$ が小さくなる向きに進むので、torch.trapezoid は自動的に負の仕事を与える。$T$–$S$ 図ではサイクルは長方形であり、その面積もまた $W$ である。体積は $V_1 = 1$ リットルから始まる。
meanings:
- サイクルの過程 $l$ 上のサンプル $k$（$l$ ＝ 高温等温、断熱、低温等温、断熱）
- 等温線、体積のテンソルに要素ごとに作用
- サイクルの角を通る断熱線
- 繰り返される $k$ ⇒ 和をとる：各過程に沿った仕事
- 過程 $l$ についての和：囲まれた面積
- $T$–$S$ 図のための経路に沿ったエントロピー
labels:
  T_h: 高温熱源 $T_h$
  T_c: 低温熱源 $T_c$
  ratio: 膨張比 $V_2/V_1$
  n: 物質量
  gas: 気体
