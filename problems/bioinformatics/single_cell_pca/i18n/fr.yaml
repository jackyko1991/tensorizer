  n_genes: Gènes $G$
  n_types: Vrais types cellulaires $K$
  n_markers: Gènes marqueurs par type
  fold_change: Facteur de variation des marqueurs
  dispersion: Dispersion binomiale négative $\varphi$
  depth_spread: Dispersion de la taille de bibliothèque ($\sigma$ log-normal)
  n_hvg: Gènes très variables conservés
  n_pcs: Composantes principales pour le partitionnement
  k: Clusters $k$
  kmeans_iters: Itérations de k-means
  embedding: 'Vue 2D : CP1–CP2 ou t-SNE'
