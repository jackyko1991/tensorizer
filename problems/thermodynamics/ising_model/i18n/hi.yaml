source_hash: f24d1ad2823c
title: 2D आइज़िंग मॉडल
summary: $\pm 1$ स्पिनों का एक जालक जो अपने पड़ोसियों के साथ संरेखित होना पसंद करते हैं। हर स्थल का पड़ोसी योग क्रॉस-आकार के कर्नेल वाला एक conv2d है, और शतरंज-पट (checkerboard) Metropolis अद्यतन आधे जालक को समांतर रूप से पलटता है। क्रांतिक ताप से नीचे डोमेन बढ़ते हैं जब तक चुंबक व्यवस्थित न हो जाए; उससे ऊपर स्पिन अव्यवस्थित रहते हैं।
notes: 'मात्रक: $J = k_B = 1$, इसलिए $T_c = 2/\ln(1 + \sqrt2) \approx 2.269$। बैच में तीन जालक साथ-साथ चलते हैं: चुना गया $T$, $T_c$ और $T = 3.5$। सभी यादृच्छिक स्पिनों (अनंत ताप) से शुरू होते हैं और अचानक ठंडे किए जाते हैं। हर स्थल को एक साथ अद्यतन करना गलत होगा — पड़ोसी पुराने मानों के आधार पर पलटेंगे — पर शतरंज-पट के एक रंग के स्थल केवल दूसरे रंग को छूते हैं, इसलिए हर आधा भाग समांतर अद्यतन हो सकता है। कम $T$ तक अचानक ठंडा करने पर जालक लंबे समय तक दो पट्टी-आकार के डोमेनों में अटक सकता है, जो आवर्ती जालक पर गतिकी की वास्तविक विशेषता है। परिमित जालक पर $T_c$ से ऊपर $\lvert m\rvert$ ठीक शून्य नहीं होता, और $T_c$ के पास यह तेज़ी से उतार-चढ़ाव करता है (critical slowing down)। $E/N$ $-2$ (पूर्ण व्यवस्था) से 0 तक जाता है।'
meanings:
- पंक्ति $i$, स्तंभ $j$ पर स्पिन $\pm 1$ — $B$ तापों के बैच के लिए (1 conv2d चैनल है)
- चार निकटतम पड़ोसियों को चुनने वाला संवलन कर्नेल
- 'दोहराए गए $k, l$ ⇒ योग: पड़ोसी योग, आवर्ती किनारे'
- हर स्पिन को अकेले पलटने की लागत
- 'दोहराए गए $i, j$ ⇒ योग: बंध ऊर्जा का दोगुना (हर बंध दोनों सिरों से गिना जाता है)'
- प्रति जालक एक ताप, स्थलों पर broadcast
labels:
  T: ताप $T$
  L: जालक आकार $L$
  n_sweeps: मोंटे कार्लो स्वीप
