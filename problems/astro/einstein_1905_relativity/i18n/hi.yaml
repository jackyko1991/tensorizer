title: 'आइंस्टीन 1905: गतिमान पिंड और $E = mc^2$'
summary: आइंस्टीन के 1905 के सापेक्षता पर दो शोधपत्रों से होकर उन्हीं का अपना रास्ता। दो अभिगृहीतों से — हर जड़त्वीय निर्देश-तंत्र में एक जैसे नियम, प्रकाश सदा $c$ पर — प्रकाश-घड़ियों का एक बैच दिखाता है कि गतिमान समय $\gamma$ गुना धीमा होता है, छड़ें $1/\gamma$ गुना छोटी होती हैं, समकालिकता प्रेक्षक पर निर्भर करती है और वेग जोड़ने पर कभी $c$ से आगे नहीं जाते। द्रव्यमान–ऊर्जा वाले शोधपत्र (प्रकाश-ऊर्जा $L$ उत्सर्जित करने वाला पिंड द्रव्यमान $L/c^2$ खोता है) की जाँच He-4 के द्रव्यमान-क्षति और $e^+e^-$ विलोपन पर होती है, और माउंट वॉशिंगटन तथा समुद्र तल पर फ्रिश और स्मिथ की 1963 की म्यूऑन गिनती पर फ़िट $\gamma \approx 9$ देता है।
notes: 'यह आइंस्टीन के 1905 के चार "चमत्कारी वर्ष" शोधपत्रों में से एक है — असल में उनमें से दो: "गतिमान पिंडों की विद्युतगतिकी पर" (जून) और "क्या किसी पिंड का जड़त्व उसकी ऊर्जा-सामग्री पर निर्भर करता है?" (सितंबर)। बाकी हैं प्रकाश-क्वांटम शोधपत्र (quantum: प्रकाश-विद्युत प्रभाव और प्रकाश क्वांटा) और ब्राउनी गति (thermodynamics: यादृच्छिक चाल और विसरण)। ज्यामिति के रूप में सापेक्षता के लिए देखें विशिष्ट सापेक्षता: मिन्कोव्स्की आरेख (astro), क्षेत्र टेंसर के लिए $F^{\mu\nu}$ का लोरेन्ट्ज़ बूस्ट (em), और टक्करों के लिए चतुर्-संवेग और द्वि-पिंड क्षय (nuclear)। इकाइयाँ $c = 1$, दर्पणों के बीच दूरी $D = 1$। आइंस्टीन का द्रव्यमान-तर्क: विरामावस्था में एक पिंड $L/2$ आगे और $L/2$ पीछे उत्सर्जित करता है; $v$ वेग से गतिमान तंत्र में प्रकाश $\gamma L$ ले जाता है, जो $L$ से अधिक है, और दोनों तंत्रों में ऊर्जा-संरक्षण पिंड की गतिज ऊर्जा को $L(\gamma - 1)$ घटने पर बाध्य करता है — ठीक उतना जितना द्रव्यमान $L/c^2$ ले जाता (उन्होंने केवल निम्न-वेग पद $\tfrac12 (L/c^2)v^2$ रखा)। परमाणु द्रव्यमान AME2020 से
  हैं। वास्तविक डेटा (data/frisch_smith_1963_muons.csv): D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508 — एक ही ऊर्जा तक धीमे किए गए म्यूऑन, माउंट वॉशिंगटन पर 1917 m ऊँचाई पर प्रति घंटा $563 \pm 10$ और समुद्र तल पर प्रति घंटा $408 \pm 9$ (प्रकाशित मापन मान; विकिपीडिया का सारांश बाद वाले को 412 तक पूर्णांकित करता है)। उड़ान में लगभग 6.4 μs लगते हैं, जो 2.2 μs की म्यूऑन आयु का लगभग तीन गुना है, इसलिए काल-वृद्धि के बिना प्रति घंटा केवल लगभग 30 ही पहुँचते; गिनतियों से म्यूऑन घड़ी 0.71 μs और $\gamma \approx 9.1 \pm 0.8$ मिलता है (शोधपत्र में, मापे गए क्षय-वक्र के साथ: $8.8 \pm 0.8$)। वेगों से भविष्यवाणी हवा में $\beta \approx 0.995$ से $\approx 0.989$ तक मंदन (आयनन-हानि $dE/dx$, समतापी वायुमंडल) का समाकलन करती है: लगभग 8.4, जैसा शोधपत्र में है। रॉसी और हॉल (1941) ने पहली बार एको लेक और डेनवर में कॉस्मिक-किरण म्यूऑनों से यह प्रभाव दिखाया।'
meanings:
- 'समय $t$ पर घड़ी $b$ का फ़ोटॉन: क्षैतिज वेग $\beta_b$, ऊर्ध्वाधर $\sqrt{1-\beta_b^2}$, इसलिए सदा $c$'
- एक टिक में $\gamma\cdot 2D/c$ लगता है; टिकें ज़िगज़ैग से गिनी जाती हैं
- $x$ के अनुदिश बूस्टों का एक बैच, $\eta = \operatorname{diag}(-1, 1, 1, 1)$
- 'दोहराया गया $\nu$ ⇒ योग: हर तंत्र में हर घटना; ट्रेन की चमकों को $\Delta t'' = -\gamma\beta\Delta x$ मिलता है'
- अंतराल, जो किसी भी बूस्ट से नहीं बदलता
- 'गतिमान तंत्र से देखे गए दो प्रकाश-स्पंद: कुल $\gamma L$, इसलिए $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$'
- 'द्रव्यमान-क्षति × 931.494 MeV/u (He-4: 28.30 MeV)'
- दोनों म्यूऑन दरों के लिए $\chi^2(\gamma)$ पर autograd के साथ न्यूटन चरण
labels:
  beta_fast: सबसे तेज़ घड़ी का वेग $\beta$
  n_clocks: प्रकाश-घड़ियों की संख्या
  dEdx: हवा में म्यूऑन ऊर्जा-हानि $dE/dx$
