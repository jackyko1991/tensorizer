source_hash: 35a326f71a76
title: 畳み込みとしての画像フィルタリング
summary: 手続き的に描いたテスト画像の上で小さなカーネルを滑らせ、ぼかし、シャープ化、エッジ検出を行う。各線形フィルタは展開したピクセル窓についての一つの縮約 $O_p = K_k P_{kp}$ であり、conv2d と同じである。ガウシアンは二回の 1D パスに分離でき、畳み込み定理によりフーリエ変換の積になる。ボックスぼかしとガウシアンぼかし、Sobel エッジ、ガウシアンのラプラシアン、アンシャープマスク、そしてごま塩ノイズに対するメディアンとガウシアンの比較。
notes: ボックスフィルタの周波数応答は負に振れるリップルをもつ sinc 関数なので、細かい細部を通してしまい、その一部は符号が反転する（チャープの縞が消えてはまた現れる）。ガウシアンの応答は別のガウシアンで、滑らかにゼロへ落ちる。分離可能性は速度にとって重要である：$(2r+1)^2$ のカーネルはピクセルあたり $(2r+1)^2$ 回の乗算が必要だが、二回の 1D パスなら $2(2r+1)$ 回で済む。Sobel（1968）は微分と平滑化を組み合わせる。ガウシアンのラプラシアンは二階微分がゼロを横切るところで反応し、Canny（1986）は同じ平滑化勾配の上に細線化とヒステリシスを組み立てる。アンシャープマスクは $\alpha(I - G * I)$ を足し戻す。これは高域強調であり、ノイズも増幅する。メディアンは線形ではないのでカーネルも周波数応答ももたないが、ガウシアンでは塗り広げるだけの孤立したごま塩ピクセルを除去する（ターミナルの PSNR を比べよう）。畳み込みニューラルネットワークのどの層も、学習されたカーネルによる同じ展開と縮約の演算である。
meanings:
- ピクセル $(i, j)$ の灰色レベル：グラデーション、円板、正方形、三角形、チャープにノイズを加えたもの
- フィルタの重み、すべてのピクセルで同じ
- $a, b$ の繰り返し ⇒ 窓について和（相関であり、PyTorch はこれを畳み込みと呼ぶ）
- ピクセル $p$ のまわりの窓を列として、$k = (a, b)$
- $k$ の繰り返し ⇒ 和：同じフィルタを一つの einsum で
- 2D ガウシアンは外積なので、行方向パスと列方向パスとして実行できる
- Sobel：横方向の $[1, 2, 1]$ 平滑化と縦方向の $[-1, 0, 1]$ 差分の積
- 畳み込み定理：フーリエ空間での要素ごとの積、周期境界パディングの conv2d に等しい
labels:
  size: 画像サイズ
  sigma: ガウシアンの幅 $\sigma$
  box: ボックスの大きさ
  amount: シャープ化 $\alpha$
  noise: ガウスノイズ $\sigma_n$
  salt_pepper: ごま塩ノイズの割合
  median: メディアン窓
