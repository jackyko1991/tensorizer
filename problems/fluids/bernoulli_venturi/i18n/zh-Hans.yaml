source_hash: 6140ba04c201
title: 伯努利方程与文丘里管
summary: 水流过收缩的管道时必须加速才能保持相同的流量（$A u = Q$），按照伯努利方程，喉部的压强随之降低。截面积、速度和压强都是沿管轴的张量；一批示踪粒子显示了流速的增大。
notes: 流动按一维处理：每个截面上速度均匀，忽略摩擦，这正是伯努利方程在此严格成立的原因。处于当地半径固定比例处的示踪粒子沿管壁形状运动。压力计是开口竖管，液柱高度 $h = p/(\rho g)$ 随当地表压增大。测量 $p_1 - p_2$ 即可得到流量 $Q = A_2\sqrt{2\Delta p/(\rho(1 - A_2^2/A_1^2))}$——这就是文丘里流量计的原理。若喉部压强低于大气压，实际流动可能发生空化；这里只打印一条警告。
meanings:
- 沿管轴的点，指标 $k$
- 每个轴向点处的截面积
- 连续性方程：每秒通过每个截面的体积相同
- 伯努利方程：流速越快 ⇒ 压强越低
- 一批示踪粒子的位置，用 RK4 推进
- 体积流量 $A_1 u_1$，单位 m³/s
labels:
  u1: 入口流速 $u_1$
  area_ratio: 面积比 $A_1/A_2$
  p1: 入口表压 $p_1$
  t_max: 模拟时长
