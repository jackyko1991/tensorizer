title: वान्डरवाल्स गैस और मैक्सवेल रचना
summary: वान्डरवाल्स समीकरण आदर्श गैस में आणविक आकर्षण और आकार जोड़ता है, और अचानक द्रव–गैस संक्रमण प्रकट होता है। समतापी वक्रों का पूरा परिवार एक $(T, V)$ broadcast है; क्रांतिक ताप से नीचे अभौतिक लूप की जगह मैक्सवेल की समान-क्षेत्रफल रेखा आती है, जिसका दाब तापों के एक बैच पर एक साथ द्विभाजन (bisection) से निकाला जाता है।
notes: '$a$ अणुओं के बीच आकर्षण मापता है (यह दाब घटाता है) और $b$ एक मोल अणुओं द्वारा घेरा गया आयतन ($V$ $nb$ से कम नहीं हो सकता)। $T_c$ से नीचे समतापी वक्र में एक भाग होता है जहाँ गैस को संपीडित करने से उसका दाब घटेगा — यांत्रिक रूप से अस्थायी। वास्तव में गैस स्थिर दाब $p^*$, यानी वाष्प दाब, पर संघनित होती है: मोलर आयतन $V_l$ का द्रव आयतन $V_g$ की गैस के साथ सहअस्तित्व में रहता है। मैक्सवेल का नियम रेखा के ऊपर और नीचे समान क्षेत्रफल की शर्त से $p^*$ तय करता है (समतुल्य रूप से, दोनों प्रावस्थाओं की गिब्स ऊर्जाएँ समान)। धराशायी गुंबद सभी $(V_l, p^*)$ और $(V_g, p^*)$ को जोड़ता है; उसका शीर्ष क्रांतिक बिंदु है, जहाँ द्रव और गैस एक समान हो जाते हैं। अक्ष क्रांतिक मानों से मापित हैं, जिनमें हर वान्डरवाल्स गैस एक जैसी दिखती है (संगत अवस्थाओं का नियम); आयतन अक्ष रैखिक है ताकि छायांकित क्षेत्रफलों की तुलना आँख से की जा सके। वास्तविक तरलों के लिए वान्डरवाल्स मॉडल केवल गुणात्मक है: जैसे इसका $V_c = 3nb$ वास्तविक क्रांतिक आयतनों को अधिक आँकता है।'
meanings:
- तापों का स्वीप, स्तंभ के रूप में
- आयतन ग्रिड, पंक्ति के रूप में
- broadcasting से हर समतापी वक्र एक साथ
- तापों के बैच के लिए त्रिघात समीकरण $p(V) = p^*$ के मूल
- 'वक्र और रेखा के बीच चिह्नित क्षेत्रफल: उत्तर पर शून्य'
- 'द्विभाजन: torch.where हर ब्रैकेट को एक साथ खिसकाता है'
