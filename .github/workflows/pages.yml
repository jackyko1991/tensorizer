name: Deploy site to GitHub Pages

# The static site: every problem's code, equations and prebuilt animation. Re-running with custom
# parameters needs the Python backend, which GitHub Pages can't host, so the site shows prebuilt results.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
      # Rendered GIFs are cached; build_assets re-renders only problems whose code hash changed.
      - uses: actions/cache@v6.1.0
        with:
          path: frontend/public/generated
          key: generated-${{ hashFiles('problems/**/*.py', 'problems/**/meta.yaml') }}
          restore-keys: generated-
      - run: pixi run python scripts/build_assets.py --jobs 4
      # Refuse to publish if any problem lacks its diagram, animation, notebook or translations
      - run: pixi run python scripts/audit.py
      # The Hugging Face Space URL (repository variable TENSORIZER_API_URL); empty = prebuilt results only
      - run: pixi run web-build
        env:
          VITE_API_URL: ${{ vars.TENSORIZER_API_URL }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
