<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Higgs to two photons: two proton beams collide, a Higgs boson decays to two photons, and the diphoton mass spectrum shows a small bump on a falling background">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- colliding protons -->
    <line x1="8" y1="62" x2="42" y2="62" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="104" y1="62" x2="70" y2="62" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="6" y="54" font-style="italic">p</text>
    <text x="96" y="54" font-style="italic">p</text>
    <!-- Higgs and its decay -->
    <circle cx="56" cy="62" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="51" y="88" font-style="italic">H</text>
    <path d="M62,56 q4,-6 8,-2 t8,-2 t8,-2 t8,-2 t8,-2" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M62,68 q4,6 8,2 t8,2 t8,2 t8,2 t8,2" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="104" y="40" font-style="italic">γ</text>
    <text x="104" y="96" font-style="italic">γ</text>
    <!-- spectrum sketch -->
    <line x1="132" y1="140" x2="232" y2="140" stroke="#374151" stroke-width="2"/>
    <line x1="132" y1="140" x2="132" y2="24" stroke="#374151" stroke-width="2"/>
    <path d="M136,40 C160,70 180,90 228,118" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M136,40 C150,58 160,66 168,74 C172,62 178,62 182,80 C196,96 210,108 228,118" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="160" y="156" font-style="italic" font-size="13">m</text><text x="171" y="159" font-size="10" font-style="italic">γγ</text>
    <text x="168" y="54" font-size="12">125</text>
  </g>
</svg>
