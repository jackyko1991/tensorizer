source_hash: 87bf1a8993df
title: 頂蓋驅動方腔流（Navier–Stokes）
summary: 計算流體力學的經典基準問題：一個方形流體盒，其頂蓋向右滑動。以流函數–渦度形式的二維 Navier–Stokes 方程式隨時間推進，$\psi$ 的帕松方程式則以 eigh 對角化拉普拉斯來求解。主渦旋逐漸形成，其中心線速度與 Ghia 等人（1982）的結果比較。
notes: 單位：方腔大小 1、頂蓋速度 1，因此 $\mathrm{Re} = 1/\nu$。流函數使流場在構造上即為無散度，而對 Navier–Stokes 取旋度則消去了壓力。每一步：以 Thom 公式求牆上渦度（無滑移），對 $\omega$ 作一次前向歐拉步，再求解帕松方程式。$\nabla^2\psi = T\psi + \psi T^\mathsf T$ 在 $T$ 的特徵基底中變成對角——與快速正弦變換的想法相同。Re = 100 時渦旋中心約在 (0.62, 0.74)，位於中心的右上方；Re 較低時移到 (0.5, 0.76)，較高時朝中間移動，且底部角落出現反向旋轉的小渦旋。較高的 Re 需要更細的網格。
meanings:
- 網格上的渦度與流函數，以 [x, y] 索引，含牆壁
- 以中央差分求 $(\partial_y\psi, -\partial_x\psi)$
- 重複的 $j$ ⇒ 求和：渦度的平流
- 五點模板
- 牆上 $\psi = 0$ 的一維拉普拉斯，只對角化一次
- 變換；再令 $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$ 並變換回來
- Thom：$-2\psi_\text{next}/h^2$，頂蓋下方再減 $2U/h$
labels:
  re: 雷諾數 $UL/\nu$
  n: 每邊格點數
  t_max: 模擬時間
