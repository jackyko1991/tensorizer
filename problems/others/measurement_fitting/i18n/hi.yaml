title: टेंसरों से प्रायोगिक मापों का फिटिंग
summary: एक अवमंदित दोलक का (कृत्रिम) प्रयोगशाला माप, जिसके हर बिंदु पर त्रुटि-पट्टी $\sigma_i$ है, अधिकतम संभाविता (maximum likelihood) से फिट किया जाता है। माप मॉडल में एक स्पष्ट त्रुटि पद $\varepsilon_i$ है जिसके फैलाव में एक अज्ञात अतिरिक्त बिखराव $s$ शामिल है; autograd $-2\ln L$ को न्यूनतम करता है, जैकोबियन और हेसियन पैरामीटरों की अनिश्चितताएँ देते हैं, और एक रैखिक उप-समस्या न्यूनतम वर्ग विधि को एक ही lstsq हल के रूप में दिखाती है।
notes: 'माप कभी भी ठीक-ठीक मॉडल नहीं होता: $x_i = f(t_i;\theta) + \varepsilon_i$, और सांख्यिकी का विषय यही त्रुटि पद $\varepsilon_i$ है। यदि बताई गई त्रुटि-पट्टियाँ ही पूरी कहानी होतीं, तो $\varepsilon_i \sim N(0, \sigma_i^2)$ होता और संभाविता को अधिकतम करना $\chi^2 = \sum_i ((x_i - f_i)/\sigma_i)^2$ को न्यूनतम करने (भारित न्यूनतम वर्ग) के समान होता। असली प्रयोग अक्सर अपनी त्रुटि-पट्टियों से अधिक बिखरते हैं (कंपन, बिना मॉडल किया गया बहाव), इसलिए यहाँ फैलाव $\sigma_{tot,i}^2 = \sigma_i^2 + s^2$ है, जिसमें एक अज्ञात अतिरिक्त बिखराव (jitter) $s$ पाँच भौतिक पैरामीटरों के साथ फिट होता है। $-2\ln L$ में $\ln 2\pi\sigma_{tot,i}^2$ पद फिट को एक विशाल $s$ से सब कुछ समझा देने से रोकता है। measurements.csv के आँकड़े कृत्रिम हैं, 0.5–1 mm की त्रुटि-पट्टियों के ऊपर $s = 0.8$ mm से बनाए गए: केवल $\chi^2$ वाला फिट $\chi^2/\mathrm{dof} \approx 2.5$ पर समाप्त होता है, जो कम आँकी गई त्रुटियों का संकेत है, जबकि $s$ फिट करने पर सामान्यीकृत अवशेष $r_i = (x_i - f_i)/\sigma_{tot,i}$ $N(0,1)$ का अनुसरण करते हैं
  और $\chi^2/\mathrm{dof} \approx 1$ होता है। autograd Adam (एनिमेटेड पुनरावृत्तियाँ) और L-BFGS (अंतिम सुधार) को $-2\ln L$ की प्रवणता देता है। अनिश्चितताएँ न्यूनतम पर $-2\ln L$ की वक्रता से आती हैं: जैकोबियन $J_{ip} = \partial r_i/\partial\theta_p$ के साथ $C = (J^TJ)^{-1}$, या $s$ शामिल होने पर पूर्ण हेसियन के साथ $C = 2H^{-1}$। रैखिक बनाम अरैखिक न्यूनतम वर्ग: स्थिर $\gamma$ और $\omega$ के लिए मॉडल $(A\cos\varphi, A\sin\varphi, c)$ में रैखिक है, इसलिए सर्वोत्तम मान एक ही lstsq हल से मिलते हैं (कोई पुनरावृत्ति नहीं, अद्वितीय उत्तर), और प्रारंभिक अनुमान इसी तरह $\omega_0, \gamma_0$ से बनता है; $\gamma$ और $\omega$ अरैखिक रूप से आते हैं, इसलिए उन्हें पुनरावृत्त खोज चाहिए जो किसी स्थानीय न्यूनतम में अटक सकती है। एक खराब $\omega_0$ (फिट गलत आवृत्ति पर टिक सकता है), बड़ी लर्निंग रेट आज़माएँ, या jitter बंद करें। सरलीकरण: स्वतंत्र गाउसीय त्रुटियाँ, $t$ में कोई त्रुटि नहीं, और सहप्रसरण केवल स्थानीय वक्रता से।'
meanings:
- बिंदु $i$ का समय, मापी गई स्थिति और बताई गई त्रुटि-पट्टी, measurements.csv से पढ़े गए
- $(A, \gamma, \omega, \varphi, c, \ln s)$; $\ln s$ फिट करने से jitter $s$ धनात्मक रहता है
- हर मापे गए समय पर अवमंदित दोलक मॉडल
- 'त्रुटि पद $\varepsilon_i$ का फैलाव: त्रुटि-पट्टी और अतिरिक्त बिखराव वर्गों में जोड़े गए'
- दोहराया गया $i$ ⇒ योग; $s = 0$ पर यह $\chi^2$ और एक स्थिरांक है
- हर सामान्यीकृत अवशेष हर पैरामीटर के साथ कैसे बदलता है
- 'गॉस–न्यूटन सहप्रसरण $C$: अनिश्चितताएँ $\sqrt{C_{pp}}$ ($i$ पर योग)'
- $\ln s$ सहित सहप्रसरण, $-2\ln L$ के हेसियन से
- स्थिर $\gamma, \omega$ के लिए मॉडल $\beta = (A\cos\varphi, A\sin\varphi, c)$ में रैखिक है
labels:
  omega0: प्रारंभिक अनुमान $\omega_0$
  gamma0: प्रारंभिक अनुमान $\gamma_0$
  lr: Adam लर्निंग रेट
  iterations: Adam पुनरावृत्तियाँ
  jitter: अतिरिक्त बिखराव $s$ फिट करें
