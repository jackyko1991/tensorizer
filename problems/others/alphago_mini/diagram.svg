<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Left: a 5 by 5 Go board with a few stones. Right: a search tree; the root position branches into moves, each labelled with visit count N and value Q; one branch is followed by PUCT down to a new leaf, which is judged by a fan of random playouts">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- 5x5 board, spacing 18, origin (14, 34) -->
    <rect x="6" y="26" width="88" height="88" rx="3" fill="#e8c27a"/>
    <g stroke="#5b4636" stroke-width="1">
      <line x1="14" y1="34" x2="86" y2="34"/><line x1="14" y1="52" x2="86" y2="52"/><line x1="14" y1="70" x2="86" y2="70"/>
      <line x1="14" y1="88" x2="86" y2="88"/><line x1="14" y1="106" x2="86" y2="106"/>
      <line x1="14" y1="34" x2="14" y2="106"/><line x1="32" y1="34" x2="32" y2="106"/><line x1="50" y1="34" x2="50" y2="106"/>
      <line x1="68" y1="34" x2="68" y2="106"/><line x1="86" y1="34" x2="86" y2="106"/>
    </g>
    <circle cx="50" cy="70" r="7.5" fill="#111827"/>
    <circle cx="68" cy="70" r="7.5" fill="#ffffff" stroke="#111827"/>
    <circle cx="50" cy="52" r="7.5" fill="#111827"/>
    <circle cx="68" cy="88" r="7.5" fill="#ffffff" stroke="#111827"/>
    <text x="16" y="18" font-size="11" fill="#374151">position <tspan font-style="italic">s</tspan></text>
    <path d="M96,70 L112,70" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- tree -->
    <circle cx="124" cy="70" r="7" fill="#374151"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="124" y1="70" x2="164" y2="30"/>
      <line x1="124" y1="70" x2="164" y2="110"/>
    </g>
    <line x1="124" y1="70" x2="164" y2="70" stroke="#2563eb" stroke-width="3"/>
    <circle cx="164" cy="30" r="6" fill="#9ca3af"/>
    <circle cx="164" cy="70" r="6" fill="#2563eb"/>
    <circle cx="164" cy="110" r="6" fill="#9ca3af"/>
    <text x="172" y="26" font-size="9" fill="#6b7280">N=3</text>
    <text x="170" y="62" font-size="9" fill="#1e40af">N=9 Q=.6</text>
    <text x="172" y="122" font-size="9" fill="#6b7280">N=2</text>
    <line x1="164" y1="70" x2="196" y2="90" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="196" cy="90" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="186" y="80" font-size="8" fill="#1e40af">new leaf</text>
    <!-- random playouts -->
    <g stroke="#f59e0b" stroke-width="1" fill="none">
      <path d="M199,94 q6,10 2,22"/><path d="M199,94 q12,8 12,20"/><path d="M199,94 q18,4 22,16"/><path d="M199,94 q-4,10 -6,20"/>
    </g>
    <text x="180" y="132" font-size="9" fill="#b45309">random playouts</text>
    <text x="112" y="152" font-size="11" fill="#374151">PUCT: <tspan font-style="italic">Q</tspan> + <tspan font-style="italic">cP</tspan>√Σ<tspan font-style="italic">N</tspan> / (1+<tspan font-style="italic">N</tspan>)</text>
  </g>
</svg>
