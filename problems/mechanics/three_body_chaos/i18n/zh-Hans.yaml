source_hash: d014ac5184c9
title: 三体混沌：毕达哥拉斯问题
summary: 布劳问题：质量为 3、4、5 的物体从 3-4-5 三角形的顶点静止出发，混沌地舞动，直到其中一个被甩出。一个起点相差 $\delta = 10^{-6}$ 的孪生运行在同一个张量中积分（运行指标 $k$）；两者之间的距离呈指数增长，$|\Delta| \propto e^{\lambda t}$，最终命运分道扬镳。
notes: 难点在于近距离交会：两个物体在约 $0.01$ 的距离上擦身而过，此时引力是平常的 $10^4$ 倍。固定步长要么在那里发散，要么在其他地方慢如蜗牛，因此求解器采用自适应的 Dormand–Prince 5(4) 方法：每一步比较五阶和四阶的结果，dt 在近距离掠过时自动缩小，之后再变大。这里不使用软化，因此是 $G = 1$ 的精确牛顿引力。两个运行共用同一步长，从而在相同时刻比较。由于运动是混沌的，容差很重要：在默认值 $10^{-11}$ 下，参考运行重现了经典结果（Szebehely 和 Peters，1967）：最轻的物体（$m = 3$）在 $t \approx 60$ 左右被抛出，而质量 4 和 5 组成紧密双星向相反方向离去。仅偏移 $\delta$ 的孪生运行在 $t \approx 45$ 时已完全分开，走上不同的历史。$|\Delta|$ 的曲线起伏不定：每次近距离交会时，孪生体会以高速早一点或晚一点经过，因此出现尖峰，增长也是一阵一阵的。拟合得到的 $\lambda$ 是从 $t = 0$ 到 $|\Delta|$ 永久保持在 $0.1$ 以上为止的平均趋势。试试更宽松的容差：参考运行本身的命运也会改变，提醒我们数值误差同样是一种扰动。
meanings:
- 运行 $k$（$k = 0$ 为参考，$k = 1$ 为孪生）中物体 $a$ 的位置，平面分量 $i$
- 质量 3、4、5
- 从 $a$ 到 $b$ 的间隔，通过广播得到两次运行的所有物体对
- 重复的 $j$ ⇒ 求和：每对物体距离的平方
- 重复的 $b$ ⇒ 求和：物体 $a$ 受到的总引力；$k$ 不求和，各次运行保持独立
- 自适应 Dormand–Prince 步的 7 个级斜率；五阶减四阶组合即误差估计
- 孪生与参考在位置和速度上的距离
- 直到两次运行彻底分开为止 $\ln|\Delta|$ 随 $t$ 的斜率：李雅普诺夫指数
labels:
  t_max: 模拟时间
  log10_delta: 孪生偏移 $\log_{10}\delta$
  log10_tol: 误差容限 $\log_{10}\mathrm{tol}$
