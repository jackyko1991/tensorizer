source_hash: e60c88b1723d
title: z-버퍼를 이용한 삼각형 래스터화
summary: '게임이 3D를 그리는 방식: 삼각형 메시를 화면에 투영하고, 모든 (픽셀, 삼각형) 쌍의 무게중심 가중치를 한꺼번에 계산한다. 삼각형에 대한 최솟값 축약이 바로 z-버퍼다. 같은 가중치가 플랫, 고러드, 퐁 음영과 텍스처 조회까지 구동한다. 텍스처 좌표를 $\lambda$(아핀) 대신 $\lambda/z$(원근 보정)로 보간해야 체크무늬 바닥이 곧게 유지된다.'
notes: 무게중심 가중치는 부호 있는 넓이다. $\lambda_k$는 꼭짓점 $k$의 맞은편에 있는 작은 삼각형의 넓이를 전체 넓이로 나눈 값이므로, 세 값의 합은 1이고 내부에서만 정확히 모두 양수다. 여기서는 모든 픽셀과 모든 삼각형에 대해 한꺼번에 계산하는데, GPU가 하드웨어로 하는 일의 무차별 대입 버전이다. 픽셀을 타일로 나누면 $(P, T, 3)$ 텐서가 수백만 항목 아래로 유지된다. 실제 래스터라이저는 각 삼각형의 경계 상자만 방문한다. 화면 공간 넓이의 부호는 후면 제거도 공짜로 준다. 닫힌 메시의 약 절반은 반대쪽을 향한다. 삼각형을 따른 깊이는 화면에서 선형이 아니지만 $1/z$는 선형이므로, z-버퍼 검사와 보간되는 모든 속성은 가중치 $\lambda_k/z_k$를 쓴다. 바닥은 삼각형 두 개뿐이어서, 아핀 보간(PlayStation-1 방식)은 체크무늬 선을 눈에 띄게 휘게 하지만 원근 보정 버전은 곧게 유지한다. 플랫 음영은 모든 면을 드러낸다. 고러드 음영은 꼭짓점에서 조명을 계산하고 밝기를 섞으므로 정반사 하이라이트가 번진다. 퐁 음영은 법선을 섞고 픽셀마다 조명을 계산하므로 하이라이트가 선명하게 유지된다.
meanings:
- 메시 꼭짓점과 바닥 모서리 4개; 면 $(T, 3)$이 이들을 인덱스로 가리킴
- '반복된 $j$ ⇒ 합: 메시를 회전(프레임마다 회전 하나)'
- 삼각형 $t$의 꼭짓점 $k$의 화면 위치와 깊이(핀홀 카메라 $f\,(x, y)/z$)
- $\varepsilon_{ij}(v_1 - v_0)_i (v_2 - v_0)_j$의 절반; $A_t \le 0$ ⇒ 후면, 제거
- 모든 삼각형 안에서 모든 픽셀의 무게중심 가중치; 메모리를 제한하기 위해 픽셀 타일 단위로 계산
- '반복된 $k$ ⇒ 합: 화면에서 선형으로 변하는 것은 $1/z$'
- 'z-버퍼: 픽셀마다 덮는 가장 가까운 삼각형(바깥 픽셀은 $+\infty$)'
- 텍스처 좌표, 법선, 위치, 고러드 밝기를 가중치 $\lambda/z$로 보간
- '아핀 보간: 정면을 향한 삼각형에는 맞지만 기울어진 삼각형에는 틀림'
labels:
  mesh: 메시
  resolution: 이미지 크기
  frames: 한 바퀴당 프레임 수
  tilt: $x$축 기준 기울기
