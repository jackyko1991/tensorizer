source_hash: 125d78b166e3
title: 粗視化タンパク質フォールディング：ランジュバン動力学による Gō モデル
summary: 小さなヘリカルヘアピン・タンパク質を、アミノ酸 1 個につき 1 個のビーズからなる鎖として表し、結合と結合角でつなぎ、引力的なネイティブコンタクトで安定化する（Gō モデル）。力は全エネルギーの自動微分による勾配で、エネルギーはペア距離テンソルで書かれる。ランジュバン動力学で温度とレプリカのバッチ全体を同時に走らせ、半分はフォールド状態、半分はアンフォールド状態から始める。ネイティブコンタクト率 $Q(t)$ がフォールディングとアンフォールディングを示し、その温度に対する平均が融解曲線になる。
notes: Gō モデルは答えから組み立てられる：ネイティブ構造に存在するすべての相互作用は引力的で、それ以外はすべて斥力のみなので、エネルギー地形はネイティブ構造へ向かう滑らかな漏斗になる。これは戯画だが有用である：小さなタンパク質は実際にフラストレーションが最小の地形をもつかのように折りたたまれ、Gō モデルはその多くについてフォールディング速度、遷移状態、協同的な融解を再現する。単位は換算単位で、エネルギーは $\varepsilon$（コンタクト 1 個）、温度は $\varepsilon/k_B$、時間は $\tau$ を単位とする。レプリカの半分はフォールド状態から、半分はまっすぐな棒から始まる。実線と破線が一致するところでは平衡に達しており、一致しないところ（低 $T$）ではアンフォールドした鎖が誤って折りたたまれた状態に速度論的にトラップされていて、ずっと長い計算かレプリカ交換が必要になる。タンパク質がとても小さいので融解曲線は幅広い。数百のコンタクトをもつ実際のタンパク質は鋭く融解する。二面角項がないとエネルギーは距離だけに依存するので、ネイティブ構造の鏡像はまったく同じエネルギーと $Q$ をもつ。実際の Gō モデルでは二面角ポテンシャルを加えて掌性を固定する。摩擦（速度論は変わるが平衡曲線は変わらない）や温度の数を変えてみよう。
meanings:
- 系 $s$ のビーズ $i$；$S = B\cdot R$ 個の温度 × レプリカ
- ペア $p = (i_p, j_p)$ のネイティブ距離、$j - i \ge 3$；ネイティブ構造で 8 Å より近ければ $n_p = 1$
- すべての系の全ペア距離を一つのテンソルに、$a$ について和
- 結合 + 結合角 + 12–10 ネイティブ井戸（$r^0_p$ で最小値 $-\varepsilon$）+ 非ネイティブペアの斥力
- 自動微分による力；系どうしは相互作用しないので $s$ について和をとっても問題ない
- 各系がそれぞれ自分の熱浴をもつ
- キック、ドリフト、摩擦 + ノイズ $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$、ドリフト、キック
- 形成されたネイティブコンタクトの割合：フォールド状態で 1、アンフォールド鎖で約 0.4（局所的なコンタクトは形成され続ける）
- 計算の後半での時間平均；$T_m$ は ½ を横切る点
labels:
  helix_length: ヘリックスあたりのビーズ数
  T_min: 最低温度 $T$
  T_max: 最高温度 $T$
  temperatures: 温度の数 $B$
  friction: 摩擦 $\gamma$
  steps: 時間ステップ数
