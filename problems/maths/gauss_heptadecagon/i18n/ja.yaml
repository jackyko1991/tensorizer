title: ガウスの正十七角形を定規とコンパスで
summary: 1796 年、19 歳の誕生日の 1 か月前に、ガウスは正十七角形が定規とコンパスで作図できることを発見した。古代ギリシャ以来はじめての、新しく作図可能な正多角形である。17 乗根をガウス周期にまとめると、2 次方程式の連鎖が解ける。この連鎖は $\cos(2\pi/17)$ を平方根だけで書き表す。続いて Richmond の 1893 年の作図が多角形を一手ずつ描き、直線と円の交点はテンソル演算として書かれる。どの正 $n$ 角形が作図可能かを格子で示す（ガウス–ヴァンツェルの定理）。ここにあるのはすべて証明済みの古典数学である。
notes: ガウスは 1796 年 3 月 30 日、19 歳の誕生日の少し前に正十七角形を見つけた。これがきっかけで文献学ではなく数学を選んだと言われている。理論は『整数論』（Disquisitiones Arithmeticae, 1801）の最終章で発表された。アイデアはこうである。3 は原始根なので、16 個の非自明な根 $\zeta^k$ は $k \mapsto 3k \bmod 17$ によって巡回的に置換される。この巡回順序で一つおきに根を足すと 8 項の周期が二つでき、$\eta_0 + \eta_1 = -1$ と $\eta_0\eta_1 = -4$ を満たすので $\eta_{0,1} = (-1 \pm \sqrt{17})/2$ となる。さらに半分に分けると 4 項、2 項、1 項の周期が得られる。部分群の位数が $16 \to 8 \to 4 \to 2 \to 1$ とすべて 2 のべきなので、各ペアは一つ上の段の周期を係数とする 2 次方程式の 2 根になる。2 項の周期は $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$ なので、4 回の開平でガウスの公式が得られる。プログラムは各 2 次関係を厳密な整数係数で確かめ、平方根だけで全周期を組み立て直し、閉じた公式を `torch.cos` と比べる（sympy があれば 60 桁でも確かめる）。どの原始根（3, 5, 6, 7, 10, 11, 12, 14）でも順序が違うだけで同じ木になる。平方根は定規とコンパスの操作なので、多角形は作図可能である。H. W. Richmond（1893）は単位円上の短い手順を与えた。垂直な半径上に $OJ = OB/4$ をとる。直径上に $\angle OJE = \tfrac14\angle OJP_0$ となる $E$ をとり（角の二等分を 2 回）、$\angle EJF = 45°$ となる $F$ をとる。$FP_0$ を直径とする円が $OB$ と $K$ で交わる。$E$ を中心に $K$ を通る円が直径と $N_3 = \cos(6\pi/17)$ と $N_5 = \cos(10\pi/17)$ で交わり、そこで立てた垂線が $P_3$ と $P_5$ を与える。ここでは各手順が実際に 2
  点を通る直線か、ある点を中心に別の点を通る円を描く。新しい点はすべて直線–直線、直線–円、円–円の交点であり、残りの頂点は円で写し取る。$P_k$ を中心に $P_{k-1}$ を通る円、そして鏡像には $P_0$ を中心に $P_k$ を通る円を使う。55 手で 17 個の頂点はすべて float64 で $e^{2\pi i k/17}$ から約 $10^{-15}$ 以内に乗る。float32 にすると丸め誤差が約 $10^{-6}$ まで増えるのが見える。ガウスは、$p_i = 2^{2^j} + 1$ が相異なるフェルマー素数で $n = 2^k p_1 \cdots p_r$ のとき正 $n$ 角形が作図可能だと述べた。ヴァンツェル（1837）はそれ以外の $n$ では不可能であることを証明し、角の三等分と立方体倍積の問題も決着させた。これはオイラーの関数 $\varphi(n)$ が 2 のべきであることと同値で、格子は $n$ まで両方の判定を確かめる。知られているフェルマー素数は 3, 5, 17, 257, 65537 だけである。Richelot は 1832 年に正 257 角形を発表し、J. G. Hermes は約 10 年かけて正 65537 角形を 1894 年に完成させ、原稿はゲッティンゲンに保管されている。ガウスは墓石に正十七角形を望んだが、円に見えてしまうと石工が断ったと伝えられる。ブラウンシュヴァイクのガウス記念碑には代わりに 17 の尖りをもつ星が刻まれている。
meanings:
- 1 の 17 乗根、複素平面上の正十七角形の頂点
- 原始根のべきの順に並べた指数、$g = 3$：1, 3, 9, 10, 13, …
- 巡回順序のどの位置が段 $m$ の周期 $i$ をなすか：$2^m$ 個おき
- 繰り返す $j$ ⇒ 和：5 段すべて（長さ 16, 8, 4, 2, 1）のガウス周期を一度に
- 兄弟の周期 2 つの積は $\zeta^{a+b}$ の和；指数を数えると、親の段の周期上で一定の整数が得られる
- 繰り返す $k$ ⇒ 和：一つ上の段から得る各 2 次方程式の定数項
- 段ごとに平方根を 1 回：$16 \to 8 \to 4 \to 2 \to 1$；段 3 には $2\cos(2\pi k/17)$ が並ぶ
- 定規とコンパスの 3 つの操作をテンソルの式で：外積による $2\times 2$ 連立方程式、$t$ の 2 次方程式、2 円の根軸
- ふるいによるオイラー関数；$\varphi(n)$ が 2 のべきのときに限り作図可能で、$x \,\&\, (x-1) = 0$ で判定
- 奇数部分が $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$ を割り切ること：相異なるフェルマー素数の積
labels:
  generator: 巡回順序の原始根 $g$
  precision: 作図の精度
  n_max: 作図可能性の格子の上限 $n$
