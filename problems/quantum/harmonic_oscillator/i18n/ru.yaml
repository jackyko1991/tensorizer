source_hash: 213c96e488f8
title: Квантовый гармонический осциллятор
summary: Гамильтониан $H = -\tfrac12\,d^2/dx^2 + \tfrac12\omega^2x^2$ на сетке становится матрицей, и torch.linalg.eigh возвращает его эквидистантную лестницу энергий $E_n = \omega(n + \tfrac12)$. Смещённый гауссиан (когерентное состояние) записывается как сумма собственных состояний; если придать каждому его фазу $e^{-iE_n t}$, пакет качается туда-сюда точно как классический груз на пружине.
notes: Единицы $\hbar = m = 1$. Сетка — большой ящик с $\psi = 0$ на стенках, настолько широкий, что стенки никогда не играют роли. Бледные кривые — нижние стационарные состояния $\varphi_n(x)$, нарисованные на высоте своей энергии $E_n$; расстояние между ступенями ровно $\omega$. Начальное состояние — гауссиан основного состояния, сдвинутый в $x_0$. Его веса $\lvert c_n\rvert^2$ образуют распределение Пуассона со средним $\omega x_0^2/2$, и поскольку все энергии отличаются на целые кратные $\omega$, пакет возвращается в $x_0$ через каждый период $2\pi/\omega$, не расплываясь. $\langle x\rangle$ следует классическому движению $x_0\cos\omega t$ (теорема Эренфеста точна для квадратичного потенциала).
meanings:
- потенциал пружины $\tfrac12\omega^2x^2$ в каждой точке сетки
- кинетическая часть $-\tfrac12\,D2$ плюс потенциал на диагонали
- энергии и собственные векторы (столбец $n$ — состояние $n$)
- 'повторяющийся $x$ ⇒ суммирование: перекрытие начального состояния с состоянием $n$'
- 'повторяющийся $n$ ⇒ суммирование: восстановление $\psi$ из компонент с фазами'
- среднее положение, сравниваемое с классическим $x_0\cos\omega t$
labels:
  omega: Циклическая частота $\omega$
  x0: Начальное смещение $x_0$
  periods: Время моделирования
  n_grid: Точки сетки
