source_hash: d29dc3e384c1
title: 死んだ星の再点火：褐色矮星、新星、X線バースト、ブラックホール
summary: 恒星の残骸に新しいガスが供給されると何が起こるでしょうか。褐色矮星は質量が約 $0.075\,M_\odot$ を超えると水素を燃焼して恒星になれます。白色矮星は降着した水素の殻に点火して古典新星となり、中性子星は降着した H/He を数時間ごとに閃光的に燃焼させて I 型 X線バーストを起こします。ブラックホールには表面がないため何も点火せず、エディントン（Eddington）限界まで光るだけです。ひとつのバッチ化テンソルモデル（Lane–Emden ポリトロープ、縮退した状態方程式、自動微分を用いた 1 ゾーンの殻点火）が、すべての残骸とすべての質量について臨界降着質量を一度に求めます。
notes: 厳密な結果：Lane–Emden 定数、チャンドラセカール（Chandrasekhar）質量（$\mu_e = 2$ で $1.456\,M_\odot$）、エディントン（Eddington）光度（$M_\odot$ あたり $1.26\times10^{38}$ erg/s）、ISCO 効率（$5.7\%$ から $42\%$）。それ以外はすべてオーダー評価のモデルです。(1) 褐色矮星：収縮する $n = 3/2$ ポリトロープが到達する最高温度 $T_{\max} \propto M^{4/3}$ を、$3\times10^5$ K（Gyr かけてゆっくり進む重水素燃焼）および $3\times10^6$ K（水素）と比較します。モデルは約 $14\,M_J$ と $0.074\,M_\odot$ を与え、進化モデルによる限界値である約 $13\,M_J$（Spiegel et al. 2011）と $0.07$–$0.08\,M_\odot$（Burrows et al. 2001）に近い値です。これは必要条件にすぎません。古く冷えた褐色矮星が限界を超えても、点火するには降着（圧縮）による加熱も必要です。(2) 新星：点火質量は $10^{-7}$ から $10^{-3}\,M_\odot$ で、白色矮星が重いほど、また降着が速いほど小さくなります。これは Yaron et al. (2005) の新星グリッドと同じ傾向ですが、一致は数倍の範囲にとどまります（熱伝導、混合、遮蔽は無視しています）。新星はおそらく降着した量以上を放出するため、白色矮星が $M_{\rm Ch}$ まで成長して Ia 型超新星として爆発できるか（単一縮退星シナリオ）は議論が続いています。(3) X線バースト：点火柱密度は $10^8$ g/cm² 程度、再発時間は数時間で、観測と一致します（Galloway and Keek 2021）。1 グラムあたりの重力エネルギーは核エネルギーの約 40 倍です（$\alpha$）。バーストを引き起こす同じ降着が中性子星の自転を加速します。約 $0.04\,M_\odot$ で、古いパルサーがミリ秒パルサーへと再生（リサイクル）されます。(4) ブラックホール：表面がないので閃光もありません。
meanings:
- 各要素が 1 つの降着残骸：白色矮星（質量 $\times$ 降着率）と中性子星（燃料 $\times$ 降着率）
- 降着層の柱密度、g/cm²；圧力 $P = g y$
- 理想イオン + 部分縮退電子の状態方程式をバッチ二分法で逆に解く
- 放射平衡での底部温度、不動点反復（$\kappa$、$\rho$ は $T$ に依存）
- 薄い殻の不安定性：加熱が冷却より $T$ とともに速く増加 ⇒ 暴走
- 臨界降着質量：新星または X線バースト
- あらゆる半径を通って収縮する $n = 3/2$ ポリトロープ；$r$ について最大値 ⇒ 褐色矮星の限界
- $n = 1, 3/2, 3$ の Lane–Emden 方程式を一度に解く：定数 $\omega_3$、$\rho_c/\bar\rho$、$P_c$
- ブラックホール：降着による光のみ、$\eta = 1 - E_{\rm ISCO}$
