source_hash: 92d9eb39c4ac
title: 迷你 AlphaFold：從距離圖到三維摺疊
summary: 結構預測器兩個部分的玩具版本，並非 AlphaFold 本身。預測的距離分布圖（distogram，成對 Cα 距離及其分箱不確定度）可選擇由一個自注意力區塊清理，接著「結構模組」以多個起點的批次對應力（stress）做梯度下降，並以經典多維尺度法（MDS），找出符合它的三維座標 $x_{ia}$。結果以 Kabsch SVD 與目標疊合，並以 RMSD 和類 TM 分數評分。
notes: 這只是精神上的 AlphaFold。真正的 AlphaFold 2 讀取胺基酸序列以及相關蛋白質的多重序列比對（MSA），其中共同演化的位置暗示哪些殘基彼此接觸；其 Evoformer（48 個在 MSA 與殘基對上做注意力、並含三角更新的區塊）建立成對關係圖；其結構模組則為每個殘基放置完整的主鏈座標框（不變點注意力）以及側鏈，並經過數次循環精修。它以蛋白質資料庫（PDB）中約 170,000 個結構訓練，並輸出信心值（pLDDT）。這裡的「網路」是假的：距離分布圖是真實距離加上隨距離增大的雜訊（$\sigma_{ij} \propto d_{ij}$），而超出最後一個分箱的成對只知道「很遠」。注意力區塊只在這一張圖上訓練數百步，因此是記憶而非預測；它展示了在殘基對上做注意力的樣貌，而且由於其讀出把每個殘基放在 6 維空間中的一點，它無法擬合獨立的雜訊，因此會將其平滑。結構模組則是貨真價實的距離幾何。距離無法區分結構與其鏡像：MDS 與梯度下降會回傳任一鏡像異構物，因此以 Cα 擬二面角的正負號選出正確手性（由 L-胺基酸構成的右手 α 螺旋約為 $+50^\circ$），並印出兩個 RMSD。由於有些起點會卡在兩段螺旋手性相反的狀態，因此同時摺疊數個隨機起點；應力最低者勝出。試著提高雜訊直到摺疊崩壞，或關閉精修。
meanings:
- 殘基 $i$ 的 Cα 位置，座標軸 $a$；目標是由螺旋幾何建構的合成螺旋–轉角–螺旋
- 殘基 $i, j$ 落在距離分箱 $k$ 的機率（64 個分箱，2–22 Å）；代替訓練好的網路
- 期望距離，對 $k$ 求和；反變異數給出信心權重 $w_{ij}$
- 注意力 logits：殘基 $i$ 提問，殘基 $j$ 回答；對 $e$ 求和
- 每個殘基收集其他殘基的加權混合，對 $j$ 求和；$b_{ij}$ 是來自 $\hat d_{ij}$ 的成對偏置
- $B$ 個起點批次的模型距離，對 $a$ 求和
- 加權失配，「遠」的成對只會被推開，鍵固定在 3.8 Å；以 Adam 透過自動微分最小化
- 雙中心化的平方距離 = Gram 矩陣 $x_{ia}x_{ja}$；其前 3 個特徵向量給出初始猜測
- 兩個中心化結構的共變異數，對 $i$ 求和；其 SVD 給出最佳的真旋轉
- 疊合後的誤差；類 TM 分數 $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$，1 = 完全相同
labels:
  helix_length: 每段螺旋的殘基數
  noise: 距離分布圖雜訊（10 Å 處的 σ）
  refine: 注意力精修
  starts: 隨機起點數 $B$
  steps: 梯度步數
