<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Feynman diagram, time to the right: an electron and a positron meet at a vertex, a wavy virtual photon gamma star carries q = p + p' to a second vertex, which emits a muon and an antimuon">
  <defs>
    <marker id="fermion" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="time" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- time arrow -->
    <line x1="80" y1="152" x2="160" y2="152" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#time)"/>
    <text x="166" y="156" font-size="11" fill="#6b7280" font-style="italic">t</text>
    <!-- incoming electron (arrow along time), positron (arrow against time) -->
    <line x1="22" y1="138" x2="80" y2="80" stroke="#2563eb" stroke-width="2"/>
    <line x1="22" y1="138" x2="51" y2="109" stroke="#2563eb" stroke-width="2" marker-end="url(#fermion)"/>
    <line x1="80" y1="80" x2="22" y2="22" stroke="#2563eb" stroke-width="2"/>
    <line x1="80" y1="80" x2="51" y2="51" stroke="#2563eb" stroke-width="2" marker-end="url(#fermion)"/>
    <!-- outgoing muon (along time), antimuon (against time) -->
    <line x1="160" y1="80" x2="218" y2="22" stroke="#dc2626" stroke-width="2"/>
    <line x1="160" y1="80" x2="189" y2="51" stroke="#dc2626" stroke-width="2" marker-end="url(#fermion)"/>
    <line x1="218" y1="138" x2="160" y2="80" stroke="#dc2626" stroke-width="2"/>
    <line x1="218" y1="138" x2="189" y2="109" stroke="#dc2626" stroke-width="2" marker-end="url(#fermion)"/>
    <!-- virtual photon -->
    <path d="M80,80 q5,-8 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
    <circle cx="80" cy="80" r="3.5" fill="#111827"/>
    <circle cx="160" cy="80" r="3.5" fill="#111827"/>
    <!-- labels -->
    <text x="14" y="134" text-anchor="end" font-size="13" transform="translate(16 18)">e⁻</text>
    <text x="8" y="20" font-size="13">e⁺</text>
    <text x="38" y="128" font-size="11" fill="#1e40af" font-style="italic">p</text>
    <text x="38" y="42" font-size="11" fill="#1e40af"><tspan font-style="italic">p</tspan>′</text>
    <text x="220" y="20" font-size="13">μ⁻</text>
    <text x="220" y="152" font-size="13">μ⁺</text>
    <text x="196" y="42" font-size="11" fill="#b91c1c"><tspan font-style="italic">k</tspan></text>
    <text x="196" y="128" font-size="11" fill="#b91c1c"><tspan font-style="italic">k</tspan>′</text>
    <text x="108" y="66" font-size="13" fill="#b45309">γ*</text>
    <text x="96" y="102" font-size="11" fill="#b45309"><tspan font-style="italic">q</tspan> = <tspan font-style="italic">p</tspan> + <tspan font-style="italic">p</tspan>′</text>
    <text x="62" y="96" font-size="10" fill="#374151">−ieγ<tspan font-size="8" dy="-5">μ</tspan></text>
  </g>
</svg>
