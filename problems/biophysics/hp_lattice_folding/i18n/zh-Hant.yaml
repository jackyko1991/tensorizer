source_hash: a25b37200a6c
title: HP 晶格蛋白質摺疊
summary: 仍會摺疊的最簡單蛋白質模型：正方晶格上一串疏水（H）與極性（P）殘基，每個非鏈上相鄰殘基之間的 H–H 接觸使能量降低 1。一個 20 殘基基準序列的許多複本同時以 Metropolis 蒙地卡羅搭配拉動與曲軸移動進行摺疊，同時逐步降溫；接觸圖由一個形狀為 $(R, N, N)$ 的成對距離張量得出。
notes: 蛋白質會摺疊，主要是因為疏水側鏈躲進緻密的核心以避開水。HP 模型（Dill，1985）只保留這一點：一個 H–H 接觸值 $-\varepsilon$，其他都不計，而鏈是晶格上的自迴避行走。即使如此，尋找最低能量仍是 NP 困難問題，構形數目則以 $2.64^N$ 成長。預設序列 HPHPPHHPHPPHPHHPPHPH 是 Unger 與 Moult（1993）的經典 20 殘基基準，基態 $E = -9$；其他序列的已知最小值為 $-9$、$-8$ 與 $-14$。每一步，每個複本選一個殘基並嘗試拉動移動（Lesh、Mitzenmacher 與 Whitesides，2003：殘基跳到一個空的角落，並沿鏈拖動其鄰居，直到鏈重新相連；在末端這相當於旋轉最後一個殘基，最簡單的情形則是角翻轉）或曲軸移動（一對 U 形殘基翻轉）。會打斷鍵或使兩個殘基佔據同一格點的提議會被拒絕；否則由 Metropolis 準則決定。高溫讓鏈能自由探索，緩慢降溫則讓它們安定成以 H 為核心、P 殘基在表面的緻密摺疊。能量 $E$ 以每個被接受移動的 $\Delta E$ 更新，並在測試中與完整重算比對。拉動移動並非完全對稱的提議，因此這個模擬是最佳化器，而非精確的熱力學取樣器。試試 36 殘基的序列：它需要更多步數或複本，而到達基態的複本比例顯示其能量地景有多崎嶇。
meanings:
- 複本 $r$ 中殘基 $i$ 的晶格座標 $k$；每個複本都從直桿出發
- H 為 1，P 為 0
- 重複的 $k$ ⇒ 求和：批次 Gram 矩陣；配合平方範數得到 $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$
- 晶格上相鄰但鏈上不相鄰的殘基
- 重複的 $i$ 與 $j$ ⇒ 求和：H–H 接觸，每個計算兩次，因此乘以 $\tfrac12$
- 鍵長為 1 且沒有兩個殘基在同一格點，否則拒絕移動
- 退火排程：$T$ 逐步按幾何級數下降
- Metropolis 準則：下坡一律接受，上坡以機率 $e^{-\Delta E/T}$ 接受
labels:
  sequence: 序列
  replicas: 複本數 $R$
  steps: 蒙地卡羅步數
  T_start: 起始溫度 $T_0$（單位 $\varepsilon/k_B$）
  T_end: 結束溫度 $T_1$
