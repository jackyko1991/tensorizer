source_hash: a69998e36eef
title: Гипотеза Какеи
summary: Иглу можно развернуть во всех направлениях внутри множества сколь угодно малой площади. В этой задаче строится такое множество (дерево Перрона из $2^k$ тонких треугольников, сдвинутых вбок), и его площадь точно измеряется строка за строкой. Затем объединения $\delta$-трубок в $\mathbb R^2$, $\mathbb R^3$ и $\mathbb R^4$ покрываются $\delta$-кубами, чтобы оценить их размерность. Гипотеза Какеи утверждает, что такие множества всё равно имеют полную размерность $n$. Это доказано для $n = 2$ и, с 2025 года, для $n = 3$; для $n \ge 4$ единственные пока доказательства — непроверенные утверждения, сгенерированные ИИ.
notes: 'В 1917 году Какея спросил, какова наименьшая площадь, в которой единичную иглу можно развернуть. Безикович (1919, 1928) обнаружил, что множество, содержащее единичный отрезок в каждом направлении, может иметь меру нуль, а Перрон (1928) упростил построение до дерева, изображённого здесь. Разрежьте треугольник на $2^k$ узких клиньев и сдвиньте их вбок. Каждый клин сохраняет свои направления, а после каждого раунда шага Перрона перекрытие растёт. Площадь удовлетворяет оценке $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ (проверено), а наилучшее $\alpha$, найденное перебором 24 значений одновременно, заставляет её убывать как $\ln k / k$. Кордоба (1977) доказал, что $\delta$-окрестность множества Какеи на плоскости имеет площадь не меньше $c / \log(1/\delta)$, так что это медленное убывание неизбежно, а Дэвис (1971) доказал, что каждое плоское множество Какеи имеет хаусдорфову и минковскую размерность 2. Три дерева, повёрнутые на 60°, содержат единичную иглу в каждом направлении
  (красная игла заметает 180°); соединение положений с помощью приёма Пала позволяет игле действительно вращаться внутри множества сколь угодно малой площади. В $\mathbb R^n$ гипотеза Какеи о множествах утверждает, что каждое такое множество имеет размерность $n$: трубки радиуса $\delta$ в $\delta$-разделённых направлениях не могут сильно перекрываться, поэтому их объединение имеет объём $\gtrsim_\varepsilon \delta^{\varepsilon}$. Правые панели подсчитывают $\delta$-кубы для двух конфигураций (все трубки через начало координат и случайные центры). Наклон $\log N$ относительно $\log(1/\delta)$ в каждом случае приближается к $n$, как и должно быть, если гипотеза верна. Компьютер может проверить лишь отдельные конфигурации, но никогда — все. Статус (ноябрь 2026): $n = 2$ доказано (Дэвис 1971). $n = 3$ доказано Хун Ван и Джошуа Залем (препринт 2025) после оценки Вольфа $(n+2)/2$ (1995) и работ Каца–Лабы–Тао. Для $n \ge 4$ задача открыта в рецензируемой литературе. Собрание сгенерированных ИИ
  рукописей, опубликованное OpenAI (github.com/openai/math, семейства 074 и 079), заявляет доказательство четырёхмерного случая и, через гипотезу Согга о локальном сглаживании, всех размерностей. В репозитории сказано, что некоторые его утверждения формализованы в Lean, но это не прошедшие рецензирование, созданные машиной утверждения, всё ещё ожидающие проверки математическим сообществом, поэтому эта страница считает их заявленными, а не доказанными. Гипотеза важна далеко за пределами геометрии: она следует из гипотез гармонического анализа о фурье-ограничении и о средних Бохнера–Рисса.'
meanings:
- '$N = 2^k$ тонких треугольников с вершиной $(0, 1)$ и основаниями $[b_i, b_i + w_0]$, разбивающими $[-1/\sqrt3, 1/\sqrt3]$: конус направлений в 60°, каждая сторона $\ge 1$'
- горизонтальные сдвиги после $k$ раундов Перрона, сразу для $A$ значений $\alpha$; каждый раунд заставляет соседние «сердцевины» соприкоснуться и сдвигает правую влево на $(1-\alpha)(c - a)$
- где треугольник $i$ пересекает горизонтальную прямую на высоте $y$
- интервалы каждой строки сортируются по левому концу; текущий максимум правых концов даёт уже покрытую часть
- 'повторяющиеся $i$ и $y$ ⇒ суммирование: точная длина объединения в каждой строке, усреднённая по строкам (правило средних точек)'
- '$\delta$-сетка на гранях куба $[-1,1]^n$, спроецированная на сферу: примерно $\delta$-разделённые направления прямых'
- кубы со стороной $\delta$, которые пересекает каждая трубка, с отсчётами через каждые $\delta/2$ вдоль неё
- 'повторяющийся $i$ ⇒ суммирование: один целочисленный ключ на куб, так что подсчёт различных кубов — это одна сортировка'
- 'повторяющийся $j$ ⇒ суммирование: три копии дерева, повёрнутые на 0°, 60°, 120°, покрывают все направления'
labels:
  k_max: Раунды Перрона $k$ ($2^k$ треугольников)
  n_max: Трубки до размерности $n$
