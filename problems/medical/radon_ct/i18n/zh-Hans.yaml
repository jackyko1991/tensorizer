source_hash: 8d871084eacb
title: 拉东变换与 CT 重建
summary: CT 扫描仪从每个角度记录衰减分布图的线积分 $p(\theta, s)$。通过旋转并求和张量来投影 Shepp–Logan 头部模体，再用滤波反投影重建：先在傅里叶空间应用斜坡滤波器 $|\nu|$，再对所有角度做一次 einsum。
notes: 对每个角度，每个投影都守恒总质量：$\int p\,ds = \iint f\,dA$。把原始投影直接抹回去（简单反投影）会把一个点变成 $1/r$ 的光晕，所以图像是 $f$ 的模糊版本；斜坡滤波器 $|\nu|$ 恰好抵消这种模糊（中心切片定理）。角度太少会产生条纹伪影；误差随角度数增加而下降，直到受像素网格限制为止。Shepp–Logan 窗在高频处使斜坡变得平缓，以少许锐度换取较低的噪声——打开噪声试试看。简化假设：平行束几何、单色射线、双线性插值，以及用高斯探测器噪声代替光子统计。教学模型，不可用于临床。
meanings:
- 衰减分布图（修改版 Shepp–Logan：10 个椭圆之和）
- 沿射线在距离 $s$、位置 $t$、角度 $\theta$ 处采样的图像
- 重复的 $t$ ⇒ 求和：正弦图
- 斜坡 $|\nu|$（Ram-Lak），可选再乘以 $\mathrm{sinc}(\nu\,\Delta s)$（Shepp–Logan），作用于补零的探测器上
- 滤波后的投影
- 每个投影沿其射线抹回：$q_\theta(x\cos\theta + y\sin\theta)$
- 重复的 $\theta$ ⇒ 求和：反投影
labels:
  n_pixels: 图像大小 $N$
  n_angles: 投影角度数
  filter: 斜坡滤波器窗函数
  noise: 探测器噪声（最大值的比例）
