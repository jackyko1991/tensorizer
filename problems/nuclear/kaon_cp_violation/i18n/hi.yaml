title: उदासीन केऑन के साथ समय-उत्क्रमण और CPT
summary: 'उदासीन केऑन एक द्वि-अवस्था तंत्र ($K^0$, $\bar K^0$) है जो दोलन करता है और क्षय होता है, इसलिए यह एक अहर्मिटी $2\times 2$ हैमिल्टोनियन $H = M - i\Gamma/2$ के अंतर्गत विकसित होता है। PDG मानों से बनाकर और संसारों के एक बैच के लिए हर समय पर एक साथ घातांकित करके, यह $\Delta m$ पर दोलित होती विचित्रता, CP-उल्लंघनकारी $\pi\pi$ व्यतिकरण, और समय-उत्क्रमण का CPLEAR परीक्षण दिखाता है: $K^0 \to \bar K^0$ और $\bar K^0 \to K^0$ में $A_T \approx 4\,\mathrm{Re}\,\varepsilon \approx 6.5\times 10^{-3}$ का अंतर है, जबकि CPT $K^0$ और $\bar K^0$ के द्रव्यमान और जीवनकाल समान रखता है।'
notes: 'C (आवेश संयुग्मन) कणों और प्रतिकणों की अदला-बदली करता है, P (समता) आकाश का दर्पण-प्रतिबिंब बनाती है और T समय को उलट देता है। CPT प्रमेय (Lüders, Pauli, Schwinger) कहता है कि कोई भी स्थानीय, लोरेंत्ज़-निश्चर क्वांटम क्षेत्र सिद्धांत तीनों के संयुक्त रूपांतरण के अंतर्गत सममित होता है, इसलिए किसी कण और उसके प्रतिकण के द्रव्यमान और जीवनकाल बिल्कुल बराबर होते हैं। 1964 में Christenson, Cronin, Fitch और Turlay ने दीर्घजीवी $K_L$ को दो पायॉनों में क्षय होते देखा, जिसे CP निषिद्ध करता है: CP का उल्लंघन $|\varepsilon| \approx 2.2\times 10^{-3}$ के स्तर पर होता है (1980 का नोबेल पुरस्कार Cronin और Fitch को)। यदि CPT लागू है, तो CP उल्लंघन का अर्थ T उल्लंघन भी है, और CERN में CPLEAR ने 1998 में इसे सीधे देखा: टैग किए गए $K^0$ और $\bar K^0$ से शुरू करके और अर्ध-लेप्टॉनिक क्षयों से क्षय के समय विचित्रता को टैग करके, $\bar K^0 \to K^0$ थोड़ा अधिक बार होता है बनिस्बत $K^0 \to \bar K^0$ के, $\langle A_T\rangle = (6.6 \pm 1.3 \pm 1.0)\times 10^{-3}$ (इसे T उल्लंघन के रूप में व्याख्यायित करना $\Delta
  S = \Delta Q$ नियम और क्षयों में CPT उल्लंघन न होने की कल्पना करता है)। यहाँ $H$ को उसकी आइगेन-अवस्थाओं से बनाया गया है, इसलिए CP प्राचल $\varepsilon$ और CPT प्राचल $\delta$ नियंत्रक डायल हैं: $\delta = 0$ होने पर $H_{11} = H_{22}$ (समान द्रव्यमान और जीवनकाल), $P(K^0\to K^0) = P(\bar K^0\to\bar K^0)$ और $A_T$ $(|p/q|^2 - |q/p|^2)/(|p/q|^2 + |q/p|^2) \approx 4\,\mathrm{Re}\,\varepsilon$ पर एक सपाट पठार है; शून्येतर $\mathrm{Re}\,\delta$ $A_{CPT} = [P(\bar K^0\to\bar K^0) - P(K^0\to K^0)]/[\ldots]$ को कुछ $\tau_S$ के बाद $4\,\mathrm{Re}\,\delta$ तक चढ़ा देता है (CPLEAR ने $\mathrm{Re}\,\delta$ को $10^{-4}$ के स्तर पर शून्य के अनुरूप पाया)। निचला पैनल $K_S$ और $K_L$ क्षयों के बीच क्लासिक $\pi^+\pi^-$ व्यतिकरण दिखाता है, जो $12\,\tau_S$ के निकट सबसे बड़ा होता है और जिससे $|\eta_{+-}|$ और $\phi_{+-}$ मापे जाते हैं। एकात्मकता की जाँच Bell–Steinberger संबंध $(i\Delta m + \bar\Gamma)\langle K_S|K_L\rangle = \sum_f A_S^* A_L$ से की जाती है; $\pi\pi$ के प्रभुत्व के साथ मापा गया $\eta_{+-}$ $\mathrm{Re}\,\varepsilon$
  की भविष्यवाणी 0.2% तक करता है। मान: PDG 2024 ($\tau_S = 0.8954\times10^{-10}$ s, $\tau_L = 5.116\times10^{-8}$ s, $\Delta m = 0.5293\times10^{10}\,\hbar$/s, $|\varepsilon| = 2.228\times 10^{-3}$, $\phi_\varepsilon = 43.52°$, $|\eta_{+-}| = 2.232\times10^{-3}$); CPLEAR, Phys. Lett. B 444 (1998) 43। सरलीकरण: प्रत्यक्ष CP उल्लंघन ($\varepsilon''$, $\varepsilon$ का $10^{-3}$) की उपेक्षा की गई है इसलिए $\eta_{+-} = \varepsilon$, अर्ध-लेप्टॉनिक टैगिंग को विचित्रता के पूर्ण मापन के रूप में आदर्शीकृत किया गया है, और पदार्थ में कोई पुनर्जनन नहीं है।'
meanings:
- स्तंभ $K_S \propto (1+\varepsilon_S, 1-\varepsilon_S)$, $K_L \propto (1+\varepsilon_L, -(1-\varepsilon_L))$, जहाँ $\varepsilon_{S,L} = \varepsilon \pm \delta$
- $\hbar/\tau_S$ की इकाइयों में $\mp\Delta m/2 - i\Gamma_{S,L}/2$ (साझा द्रव्यमान एक वैश्विक कला है)
- 'दोहराया गया $i$ ⇒ योग: हर संसार के लिए एक प्रभावी हैमिल्टोनियन'
- हर समय पर $e^{-iHt}$, matrix_exp से जाँचा गया
- प्रायिकता कि $b$ के रूप में जन्मा केऑन $a$ के रूप में पाया जाए ($0 = K^0$, $1 = \bar K^0$)
- 'हर्मिटी और $\ge 0$: एकात्मकता, Bell–Steinberger संबंध'
- पंक्ति सदिश जिसमें $a\cdot K_S = 1$, $a\cdot K_L = \eta_{+-}$
- 'दोहराया गया $x$ ⇒ योग: $K^0$ या $\bar K^0$ के रूप में जन्मी किरणपुंज की $\pi^+\pi^-$ क्षय दर'
labels:
  eps_abs: $|\varepsilon|$
  eps_phase: कला $\phi_\varepsilon$
  re_delta: CPT उल्लंघन $\mathrm{Re}\,\delta$
  dm: द्रव्यमान अंतर $\Delta m$
  t_max: समय खिड़की $t_\mathrm{max}$
