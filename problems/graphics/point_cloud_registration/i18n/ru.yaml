source_hash: b1a74b85fb17
title: 'Регистрация облаков точек: конвейер PCL (FPFH, RANSAC, ICP)'
summary: 'Два частичных 3D-скана одного объекта, снятых с двух точек обзора и сдвинутых неизвестным жёстким движением, совмещаются так, как это делает Point Cloud Library (PCL), записанная на пакетном PyTorch: прореживание воксельной сеткой, статистическое удаление выбросов, нормали из ковариаций окрестностей, дескрипторы FPFH, RANSAC по соответствиям дескрипторов (тысячи подгонок Кабша одновременно) и уточнение ICP, точка-точка и точка-плоскость, из нескольких начальных положений. Результат сравнивается с известным движением: ошибка поворота в градусах, ошибка сдвига и RMSE.'
notes: 'Демонстрационный объект — корова «Spot» Кинана Крейна (5856 треугольников), которую автор передал в общественное достояние (CC0 1.0; https://www.cs.cmu.edu/~kmcrane/Projects/ModelRepository/, приложена как data/spot_vertices.csv и data/spot_faces.csv, см. data/SOURCES.md; Crane, Pinkall и Schröder 2013, ACM TOG 32(4)). Стэнфордского кролика мы не использовали: Stanford 3D Scanning Repository разрешает исследовательское использование и бесплатное распространение, но говорит, что модели нельзя использовать в коммерческих целях или включать в продаваемый продукт без разрешения, что неясно для открытого проекта, у которого позже может появиться платная версия. Тестовый файл PCL bunny.pcd получен из того же стэнфордского скана и не имеет собственной лицензии на данные (лицензия BSD у PCL относится к коду). Сканы синтетические: плотные случайные выборки поверхности сетки, оставленные только там, где их видит сканер (тест обратной грани плюс z-буфер, то есть удаление скрытых точек), с гауссовым
  шумом $\sigma$, несколькими процентами равномерных выбросов и случайным жёстким движением (30–60°, половина размера объекта), применённым к скану B. Размер объекта — диагональ ограничивающего параллелепипеда, приведённая к 1. Конвейер (имена классов PCL в скобках): VoxelGrid; StatisticalOutlierRemoval; NormalEstimation с $k = 15$ соседями и нормалью, повёрнутой к собственной точке обзора каждого скана; FPFH с $k = 25$; взаимные ближайшие соответствия в пространстве дескрипторов; RANSAC с 4000 гипотез, каждая из 3 соответствий, у которых длины сторон треугольника совпадают с точностью 10 % (как в CorrespondenceRejectorPoly из PCL), подогнанная методом Кабша и оценённая числом инлаеров, затем переподогнанная по ним; ICP из 6 возмущённых копий позы RANSAC, по цели, прореженной с половинным размером вокселя, без пар дальше одного вокселя. Упрощения: FPFH использует фиксированную окрестность из $k$ точек вместо радиуса, всегда берёт текущую точку началом репера Дарбу (PCL выбирает порядок пары
  по углам нормалей) и нормирует каждый блок из 11 бинов к 100; воксельная сетка усредняет только координаты. Что показывает запуск по умолчанию: около 12000 видимых точек на скан превращаются примерно в 1650 после двух фильтров; из 365 взаимных соответствий FPFH RANSAC оставляет 73 (около 20 %) и даёт грубую позу с ошибкой 6,4° и 0,056; затем ICP точка-плоскость доходит до 0,37° и 0,0021 (0,2 % размера объекта, RMSE 0,007) примерно за 5 итераций из любого начального положения, а точка-точка после 25 итераций всё ещё ползёт вдоль поверхности (около 2,1°, 0,018), потому что ближайшие соседи на частичной, заново дискретизированной поверхности тянут его вбок. Тесты проверяют, что метод Кабша точен, движение в композиции со своим обратным даёт тождество, нормали плоскости и сферы верны, воксельная сетка совпадает с медленной эталонной реализацией, далёкие выбросы удаляются, FPFH инвариантен относительно жёстких движений, видимость по z-буферу убирает обратную сторону сферы, RANSAC выдерживает
  50 % неверных соответствий, ICP сходится, точка-плоскость на гладкой поверхности быстрее точки-точки, а весь конвейер опускается ниже 2° и 2 % размера объекта. Это устоявшиеся методы: ICP (Besl и McKay 1992; точка-плоскость: Chen и Medioni 1992), FPFH (Rusu, Blodow и Beetz 2009), PCL (Rusu и Cousins 2011, лицензия BSD, https://pointclouds.org). Код написан по статьям, а не переведён из PCL. Попробуйте больший угол между точками обзора (меньше перекрытие: RANSAC находит меньше инлаеров и может ошибиться), больше выбросов или более крупный воксель.'
meanings:
- одно жёсткое движение на элемент пакета $b$ (гипотеза RANSAC или старт ICP), суммирование по $j$
- $k$ ближайших соседей, матрица расстояний по блокам строк
- 'VoxelGrid: scatter-среднее точек с одинаковым ключом вокселя'
- 'StatisticalOutlierRemoval: среднее расстояние до соседей против его среднего и стандартного отклонения по облаку'
- ковариация окрестности; собственный вектор наименьшего собственного значения — нормаль, повёрнутая к точке обзора
- 'изменчивость поверхности (кривизна PCL): 0 на плоскости'
- 'углы репера Дарбу для пары точек: $\alpha = \mathbf v\cdot\mathbf n_q$, $\phi = \mathbf u\cdot\hat{\mathbf d}$, $\theta = \operatorname{atan2}(\mathbf w\cdot\mathbf n_q, \mathbf u\cdot\mathbf n_q)$'
- три гистограммы по 11 бинов; собственная гистограмма точки плюс взвешенное по расстоянию среднее гистограмм соседей
- взаимная ковариация Кабша, одна на гипотезу; одно пакетное SVD даёт все повороты
- оценка RANSAC для всех гипотез сразу
- шаг ICP точка-плоскость $\boldsymbol\xi = (\boldsymbol\omega, \delta\mathbf t)$, пакетно по стартам
- ошибка поворота относительно известной истины
labels:
  n_points: Точек поверхности на скан
  view_angle: Угол между двумя точками обзора
  noise: Шум датчика $\sigma$ (размер объекта 1)
  outliers: Доля выбросов
  voxel: Размер вокселя $s$
  hypotheses: Гипотез RANSAC
  icp_iterations: Итераций ICP
  starts: Стартов ICP (пакетно)
