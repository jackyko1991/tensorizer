source_hash: dc1d9350a90f
title: 雙位能井中的穿隧
summary: 處於對稱雙位能井中的粒子。torch.linalg.eigh 顯示最低的兩個態構成緊密的一對：一個偶態與一個奇態，被微小的穿隧能 $\Delta E$ 分開。兩者之和是位於左井的粒子；隨著兩者的相對相位漸漸錯開，粒子以週期 $2\pi/\Delta E$ 穿隧到右井再回來，儘管其能量低於位障。
notes: 單位 $\hbar = m = 1$。雙重態的能量低於位障頂端 $V_0$，因此在古典力學中粒子永遠無法越過。只有兩個態參與時，$\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$（差一個整體相位）：在 $t = 0$ 時為位於左側的 $(\varphi_0 + \varphi_1)$，在 $t = \pi/\Delta E$ 時為位於右側的 $(\varphi_0 - \varphi_1)$。$P_L(t) = \cos^2(\Delta E\,t/2)$ 成立，誤差只來自各態與「錯誤」井的少量重疊。$\Delta E$ 隨位障高度與寬度大致呈指數縮小（WKB 因子 $e^{-\int\kappa\,dx}$），因此位障稍高就會使穿隧大幅變慢——模擬時間以穿隧週期 $2\pi/\Delta E$ 計，使動畫總是顯示完整的振盪。
meanings:
- 四次位能：極小值在 $x = \pm a$，位障 $V_0$ 在 $x = 0$
- 動能 $-\tfrac12\,D2$ 加上對角線上的 $V$
- 能量與態；$\varphi_0$ 為偶，$\varphi_1$ 為奇，$\Delta E = E_1 - E_0$
- $(1, 1, 0, 0, \dots)/\sqrt2$：雙重態的等量混合，局域在左側
- 重複的 $n$ ⇒ 求和：在特徵基底中的精確演化
- 選出左半部的階梯函數；$P_L$ 對 $x$ 求和
labels:
  V0: 位障高度 $V_0$
  a: 井間距 $a$（極小值在 $\pm a$）
  periods: 模擬時間
  n_grid: 格點數
