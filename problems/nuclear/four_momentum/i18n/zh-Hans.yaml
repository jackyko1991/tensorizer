source_hash: 045c5b4ab526
title: 四维动量与二体衰变
summary: 一个运动粒子衰变为两个粒子。在其静止系中，产物以固定动量 $p^*$ 背对背飞出；洛伦兹变换 $\Lambda^\mu{}_\nu$（一次 einsum）把所有衰变角一次变换到实验室系，在那里动量被推向前方。闵可夫斯基度规 $\eta_{\mu\nu}$ 把产物的四维动量还原为母粒子的质量——这就是用于发现新粒子的不变质量方法。
notes: 静止系中的动量位于半径为 $p^*$ 的球面上；变换把它拉伸成椭圆（图中描出的曲线），并按母粒子动量向前平移，所以高速母粒子把两个产物都抛进一个狭窄的前向锥内。能量和实验室系角度随 $\theta^*$ 变化，但每个产物的 $p_\mu p^\mu = m^2$ 以及 $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$ 始终不变——测量两个动量的探测器总能重建 $M$。对于 $\pi^0 \to \gamma\gamma$，光子无质量（$p_\mu p^\mu = 0$），最小张角为 $2\arcsin(1/\gamma)$。三种衰变都是真实存在的：$K^0_S \to \pi^+\pi^-$、$\pi^0 \to \gamma\gamma$、$\Lambda \to p\,\pi^-$。只模拟运动学：衰变角均匀扫描而非随机抽样，并忽略自旋和极化。
meanings:
- diag(1, −1, −1, −1)，取 $c = 1$ 的单位
- 静止系中 B 个衰变角 $\theta^*$ 对应的子粒子四维动量
- 母粒子速度 $\boldsymbol\beta = \mathbf P/E$ 对应的 $\gamma$、$\gamma\beta_i$ 和 $\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$
- 重复的 $\nu$ ⇒ 求和：所有衰变一次完成变换
- 闵可夫斯基内积：在每个参考系中相同
- 每种构型重建出的母粒子质量
