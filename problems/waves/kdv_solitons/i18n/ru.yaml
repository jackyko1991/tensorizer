source_hash: faa64f98c4b2
title: Столкновение солитонов КдФ
summary: Две уединённые волны уравнения Кортевега–де Фриза. Более высокая быстрее, догоняет низкую, и обе выходят из столкновения с неизменной формой, лишь сдвинутыми. Производные берутся в фурье-пространстве ($\partial_x \to ik$), жёсткое слагаемое $u_{xxx}$ решается точно с интегрирующим множителем, а остальное — методом RK4.
notes: 'Соглашение: $u_t + 6uu_x + u_{xxx} = 0$; солитон со скоростью $c$ имеет высоту $c/2$, т. е. движется со скоростью, вдвое большей его амплитуды. Выше — значит быстрее и уже. После столкновения высокий солитон оказывается впереди того места, где он был бы без взаимодействия, а низкий — позади; при $\kappa = \sqrt c/2$ точные сдвиги равны $\frac{1}{\kappa_1}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ вперёд и $\frac{1}{\kappa_2}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ назад. Пунктир: где были бы солитоны, если бы не замечали друг друга. Область периодическая (длина 100), так что при долгом счёте волны заворачиваются. БПФ превращает каждую производную в умножение, а интегрирующий множитель снимает жёсткое ограничение на шаг по времени от $u_{xxx}$, оставляя лишь более мягкое ограничение от нелинейного слагаемого.'
meanings:
- высота волны на периодической сетке (float64)
- коэффициенты Фурье; $\partial_x \to ik$, $\partial_x^3 \to -ik^3$
- нелинейное слагаемое $(u^2)$ вычисляется в реальном пространстве, верхняя треть мод удаляется (правило 2/3)
- точное решение дисперсионной части на одном шаге (интегрирующий множитель)
- 'сохраняются: $\int u\,dx$ и $\int u^2\,dx$'
labels:
  c_tall: Скорость высокого солитона $c_1$
  c_short: Скорость низкого солитона $c_2$
  t_max: Время моделирования
