source_hash: 7be6ce46bf01
title: 黒体放射
summary: プランクの法則は、熱放射のエネルギー密度をあらゆる波長について与える。温度の列ベクトルを波長の行ベクトルとブロードキャストすると、$(T, \lambda)$ スペクトル表全体が1行で作られる。argmax がウィーンのピークを見つけ、torch.trapezoid でスペクトルを積分するとシュテファン–ボルツマンの $T^4$ 則が得られる。
notes: 波長格子は 10 nm から 100 µm までの対数間隔で、欠けた裾による積分の変化が $10^{-5}$ 未満になるほど広い。精度のため計算は float64 で行い expm1 を用いる。ウィーンの定数 $b \approx 2.898\times 10^{-3}$ m·K は格子の分解能（約 0.2 %）の範囲で argmax から得られる。曲線の色は赤、緑、青に相当する3つの波長でスペクトルをサンプリングしたものである——実際の等色計算の粗い代用だが、輝きがオレンジから白を経て淡い青へ変わる様子がわかる。グラフは毎フレーム再スケールされる：ピークの高さは $T^5$ のように増加する。陰影の帯は可視域 380–750 nm を示す。
meanings:
- 列ベクトルとしての温度のバッチ
- 行ベクトルとしての波長格子
- 列を行とブロードキャストすると表全体が埋まる
- すべてのスペクトルのウィーンのピークを一度に
- 繰り返される $b$ ⇒ 和をとる：全エネルギー密度、$\propto T_a^4$
- 610、550、465 nm でのプランク分布を規格化したもの：おおまかな可視光の色
labels:
  T_min: 開始温度
  T_max: 終了温度
  n_temps: 温度の数（フレーム数）
