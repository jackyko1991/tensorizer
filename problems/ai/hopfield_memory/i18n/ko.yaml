source_hash: a8220b6707c1
title: '홉필드 네트워크: 고전적 연상 기억과 현대적 연상 기억'
summary: '손상되었거나 절반이 가려진 그림으로부터 원래 그림을 완성하는 기억 장치입니다. 고전적인 홉필드(Hopfield) 네트워크는 이진 패턴을 헤브 가중치 $W_{ij}$에 저장하고 에너지를 따라 내리막으로 미끄러집니다; 무작위 패턴은 최대 약 $0.138\,N$개까지 저장할 수 있고, 상관된 패턴은 훨씬 적게 저장합니다. 라므자우어(Ramsauer) 등(2020)의 현대적 연속 홉필드 네트워크는 패턴 자체를 보관하고 $\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$로 갱신하는데, 이것이 바로 트랜스포머의 어텐션입니다: 고전 네트워크가 뒤섞어 버리는 만화 얼굴을 한 단계 만에 불러옵니다.'
notes: '얼굴들은 실존 인물의 이미지가 아닙니다: 각 얼굴은 몇 개의 난수(머리 모양, 눈, 안경, 눈썹, 코, 입의 곡률, 머리카락, 귀)로부터 코드가 그려 내므로, 저작권이 있는 캐릭터나 사진은 전혀 사용되지 않습니다. 각 질의는 얼굴의 아래쪽 40 %를 가리고 나머지 픽셀의 5 %를 뒤집습니다. 무작위 패턴에 대한 고전 네트워크의 한계 $\alpha_c \approx 0.138$은 아밋, 구트프로인트, 솜폴린스키(Amit, Gutfreund, Sompolinsky, 1985)가 스핀 유리의 방법으로 계산했으며, 한 단계 비트 오류율은 가우스 누화 법칙 $\Phi(-1/\sqrt\alpha)$를 따릅니다(둘 다 테스트에서 확인). 얼굴들은 강하게 상관되어 있으므로(윤곽과 넓은 빈 종이를 공유함) 고전 네트워크는 $0.138$보다 훨씬 낮은 부하에서도 이미 얼굴들을 혼동하여 얼굴들의 혼합 상태에 빠집니다. 현대 네트워크의 에너지에는 log-sum-exp 항이 있습니다; 라므자우어 등은 이 에너지가 매 갱신마다 감소하고, 보통 한 번의 갱신으로 충분하며, 잘 분리된 패턴에 대해서는 용량이 $N$에 대해 지수적으로 증가함을 증명했습니다. 그 갱신은 저장된 패턴을 키와 값으로 쓰는 트랜스포머 어텐션과 정확히 같습니다. $\beta$를 작게 하면 얼굴 하나 대신 여러 얼굴의 준안정 평균을 볼 수 있습니다. 이 아이디어는 논문에 딸린 블로그 글을 따르되, 그 글의 만화 이미지 대신 절차적으로 생성한 얼굴을 사용합니다.'
meanings:
- '패턴 $\mu$: 절차적으로 그린 만화 얼굴, 잉크 $+1$, 종이 $-1$, $N = 32 \times 32$ 픽셀'
- 헤브 규칙, 반복된 $\mu$ ⇒ 합산; 저장된 얼굴 수마다 네트워크 $f$ 하나, 대각선은 0으로 설정
- '반복된 $j$ ⇒ 합산: 모든 네트워크와 질의에 대한 뉴런 $i$의 입력장; $s_i$는 그 부호를 취함'
- 에너지; 뉴런을 하나씩 갱신할 때 절대 증가하지 않음
- '반복된 $n$ ⇒ 합산: 질의와 각 저장 패턴의 유사도를 $\beta$로 날카롭게 만든 것'
- '반복된 $\mu$ ⇒ 합산: 새 상태는 패턴들의 가중 평균이며, $\beta$가 크면 패턴 하나가 됨'
- '회상 품질: 얼굴이 정확히 복원되면 1'
labels:
  n_faces: 최대 저장 얼굴 수 $P$
  beta: 역온도 $\beta$
  mask: 각 얼굴의 가려진 비율
  noise: 뒤집힌 픽셀
  sweeps: 고전 갱신 스윕 횟수
  n_random: 용량 곡선용 뉴런 수 $N$
