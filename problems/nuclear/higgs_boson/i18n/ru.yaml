title: Поиск бозона Хиггса в реальных дифотонных данных
summary: 'Около 95 000 пар фотонов из 10 fb$^{-1}$ реальных столкновений ATLAS при 13 TeV (ATLAS Open Data, CC0) разбиты на бины по дифотонной массе $m_{\gamma\gamma}$ и аппроксимированы с помощью autograd: гладкий спадающий фон плюс узкий пик Хиггса. Отношение профильных правдоподобий даёт $m_H$, силу сигнала $\mu$ и локальную значимость $Z = \sqrt{q_0}$; пакет игрушечных экспериментов только с фоном показывает эффект «поиска в других местах» (look-elsewhere effect), а потенциал «мексиканской шляпы» $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ превращает измеренную массу в константу самодействия Хиггса $\lambda = m_H^2/2v^2$.'
notes: 'В июле 2012 года ATLAS и CMS объявили о новом бозоне вблизи 125 GeV, наблюдаемом прежде всего в двух каналах: два фотона и четыре лептона. Нобелевская премия по физике 2013 года досталась Энглеру и Хиггсу за механизм, который он подтвердил. Здесь фотонный канал воспроизводится на реальных данных. Хиггс не может распадаться на фотоны напрямую (они безмассовы), а только через петли W-бозонов и топ-кварков, поэтому это редкий распад ($\mathcal B \approx 0.23\%$) поверх огромного гладкого фона обычных фотонных пар. С 10 fb$^{-1}$ в этом файле результат таков: $m_H \approx 124.2 \pm 1.0$ GeV (PDG 2024: $125.20 \pm 0.11$), $\mu \approx 1.0 \pm 0.4$ (темп Стандартной модели) и локальная значимость около $2.7\sigma$ (ожидалось около $3.4\sigma$). Это превышение, а не открытие: открытия 2012 года использовали несколько категорий событий, оба канала и оба эксперимента, чтобы превзойти $5\sigma$. Сканирование также служит полезным предостережением: в этой небольшой выборке флуктуация фона вблизи
  143 GeV почти так же велика ($2.6\sigma$ локально), как настоящий Хиггс при 124 GeV. Это эффект «поиска в других местах». Бугор где-нибудь в широком окне вероятен, поэтому игрушечные эксперименты оценивают, как часто один лишь фон его порождает: около 13% сканирований только с фоном где-нибудь превосходят превышение при 125 GeV, а формула пересечений уровня Гросса–Вителлса даёт глобальное p-значение около 0.1. Игрушечные эксперименты только с фоном при фиксированной массе следуют распределению $\tfrac12\delta(0) + \tfrac12\chi^2_1$ (Уилкс/Чернов), поэтому $Z = \sqrt{q_0}$. Мексиканская шляпа: при $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV из времени жизни мюона измеренная масса фиксирует $\lambda = m_H^2/2v^2 \approx 0.13$; радиальные колебания относительно кольца вакуумов — это бозон Хиггса, а плоское направление вдоль кольца становится продольными W и Z. Данные: ATLAS Open Data 13 TeV, выпуск 2020 года, выборки GamGam (запись 15006 на CERN Open Data Portal, doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS,
  лицензия CC0; периоды данных 2016 года A–D). Отбор как в просветительском ноутбуке ATLAS H → γγ: фотонный триггер, два жёстко отобранных изолированных фотона с $p_T > 40$ и 30 GeV, $|\eta| < 2.37$ вне диапазона 1.37–1.52. Столбец sm_signal — соответствующее моделирование ATLAS (ggF, VBF, WH, ZH, ttH при 125 GeV), взвешенное на 10 fb$^{-1}$, что даёт $N_{SM} \approx 406$ событий и ширину пика. Упрощения: одна инклюзивная категория, гауссов пик (у настоящего есть хвосты, поэтому подогнанная ширина около 2.3 GeV больше разрешения ядра), никаких систематических неопределённостей и экспоненциально-полиномиальный фон (попробуйте менять степень, чтобы увидеть чувствительность к ложному сигналу).'
meanings:
- реальные числа дифотонных событий на бин 0.5 GeV; подойдёт любой CSV со столбцами m_low, m_high, events
- степени масштабированной массы $x \in [0, 1]$; фон равен $\exp(X\theta)$
- гауссов пик, проинтегрированный по каждому бину (erf), ширина $\sigma$ подогнана к моделированию ATLAS
- пуассоновское правдоподобие каждой гистограммы, минимизируемое с помощью Adam + L-BFGS через autograd
- 'повторяющийся $n$ ⇒ суммирование: метод скоринга Фишера аппроксимирует все игрушечные эксперименты × все массы одновременно'
- отношение профильных правдоподобий, 0, когда подогнанный сигнал отрицателен
- погрешности $m_H$ и $\mu$ из кривизны $-\ln L$
- 'потенциал вдоль трёх лучей $\phi = r\,e^{i\alpha}$ комплексной плоскости: одна и та же кривая для любой фазы, кольцо вакуумов при $|\phi| = v/\sqrt2$'
labels:
  m_min: Начало окна аппроксимации
  m_max: Конец окна аппроксимации
  degree: Степень полинома фона в экспоненте
  m_start: Начальная масса аппроксимации
  scan_step: Шаг сканирования по массе
  n_toys: Игрушечные эксперименты только с фоном
