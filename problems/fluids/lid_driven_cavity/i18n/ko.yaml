source_hash: 87bf1a8993df
title: 뚜껑 구동 공동 흐름 (나비에–스토크스)
summary: '전산 유체 역학의 고전적인 벤치마크: 뚜껑이 오른쪽으로 미끄러지는 정사각형 유체 상자. 유선 함수–와도 형태의 2차원 나비에–스토크스 방정식을 시간에 따라 전진시키며, $\psi$에 대한 푸아송 방정식은 eigh로 라플라시안을 대각화해 풉니다. 주 소용돌이가 생겨나고, 중심선 속도를 Ghia 등(1982)의 결과와 비교합니다.'
notes: '단위: 공동 크기 1, 뚜껑 속력 1이므로 $\mathrm{Re} = 1/\nu$입니다. 유선 함수는 구성상 흐름의 발산을 0으로 만들고, 나비에–스토크스 방정식의 회전을 취하면 압력이 사라집니다. 각 단계: 톰 공식으로 벽의 와도를 구하고(미끄럼 없음), $\omega$에 대해 전진 오일러 단계를 밟은 뒤 푸아송 방정식을 풉니다. $\nabla^2\psi = T\psi + \psi T^\mathsf T$는 $T$의 고유 기저에서 대각이 됩니다. 빠른 사인 변환과 같은 아이디어입니다. Re = 100에서 소용돌이 중심은 중앙의 오른쪽 위인 (0.62, 0.74) 근처에 있습니다. Re가 낮으면 (0.5, 0.76)으로, 높으면 가운데 쪽으로 이동하며, 아래쪽 모서리에 반대로 도는 작은 소용돌이가 나타납니다. Re가 높을수록 더 촘촘한 격자가 필요합니다.'
meanings:
- 격자 위의 와도와 유선 함수, [x, y]로 색인, 벽 포함
- 중심 차분으로 구한 $(\partial_y\psi, -\partial_x\psi)$
- '반복된 $j$ ⇒ 합: 와도의 이류'
- 5점 스텐실
- 벽에서 $\psi = 0$인 1차원 라플라시안, 한 번만 대각화
- 변환한 뒤 $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$로 나누고 역변환
- '톰: $-2\psi_\text{next}/h^2$, 뚜껑 아래에서는 $2U/h$를 뺌'
labels:
  re: 레이놀즈 수 $UL/\nu$
  n: 한 변의 격자점 수
  t_max: 시뮬레이션 시간
