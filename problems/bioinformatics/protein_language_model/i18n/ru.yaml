source_hash: 2038e43e9d92
title: Маленькая белковая языковая модель выучивает контакты
summary: Двухслойный трансформер с вниманием через einsum, $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$, обучается только восстанавливать замаскированные буквы последовательностей из модели Поттса со связями, заданными на решёточной укладке. Никто не сообщает ему структуру, и всё же его симметризованные карты внимания с поправкой APC указывают на заданные контакты — идея, стоящая за контактными головами белковых языковых моделей.
notes: 'Почему внимание находит контакты? В модели Поттса буква в позиции $i$ при известных всех остальных зависит только от связанных с ней позиций (её марковского покрывала), поэтому лучший способ угадать замаскированную букву — посмотреть на её контактных партнёров, и внимание учится делать именно это. Rao et al., «Transformer protein language models are unsupervised structure learners» (ICLR 2021), показали, что карты внимания больших белковых языковых моделей, обученных на миллионах природных последовательностей, кодируют контакты; их считывают логистической регрессией по симметризованным картам с поправкой APC, подогнанной на нескольких белках. Более поздние модели, такие как ESM-2 (2022–2023), пошли дальше и предсказывали трёхмерную структуру по таким представлениям. Здесь считывание полностью без учителя (простое среднее по головам), семейство синтетическое, а тестовая функция потерь сравнивается с двумя бесконтекстными базовыми моделями: униграммой (одно распределение букв) и профилем
  по позициям. Превзойти профиль — значит, что модель использует контекст, т. е. связи. Змеевидная укладка помещает контакты на антидиагонали, как нити β-листа; случайные пары были бы верны лишь примерно в 5 % случаев. APC убирает фон позиций, на которые смотрят все. Попробуйте более слабые связи, меньше последовательностей или одну голову.'
meanings:
- случайные блоки связей только между остатками, соприкасающимися в решёточной укладке; сэмплирование Гиббса превращает их в семейство последовательностей
- эмбеддинг токена плюс позиции для буквы $s_{ni}$ (замаскированные буквы используют токен [MASK])
- 'повторяющийся $c$ ⇒ суммирование: запросы каждой головы (ключи и значения аналогично)'
- повторяющийся $k$ ⇒ суммирование; каждая строка — распределение вероятностей по позициям внимания $j$
- 'повторяющийся $j$, затем $h, k$ ⇒ суммирование: что каждая позиция собирает от остальных'
- кросс-энтропия истинной буквы в 15 % замаскированных позиций, минимизируемая Adam
- внимание, усреднённое по тестовым последовательностям, симметризованное и скорректированное APC для каждой головы, затем усреднённое по слоям $l$ и головам $h$
labels:
  coupling: Сила заданной связи $\sigma_J$
  n_seq: Обучающие последовательности
  q: Размер алфавита $q$
  layers: Слои трансформера
  heads: Головы внимания $H$
  d_model: Ширина модели $d$
  steps: Шаги обучения
  lr: Скорость обучения
  mask_rate: Доля маскирования
