source_hash: 492f2e3f4bf6
title: PET：正子湮滅與影像重建
summary: FDG 等示蹤劑會放出正子；每個正子與電子湮滅，產生兩個背對背飛出的 511 keV 光子。我們追蹤一批模擬衰變直到偵測器環，每個符合事件依其響應線（LOR）分箱到正弦圖中，再以 MLEM 重建影像：$\lambda \leftarrow \lambda\,A^{\mathsf T}(y / A\lambda) / A^{\mathsf T}1$，其中整台掃描儀就是一個系統矩陣 $A$，每次迭代只需兩次矩陣–向量乘法。
notes: 兩個光子朝相反方向飛出，所以衰變一定發生在同時觸發的兩個偵測器之間的連線上：這就是響應線。收集數百萬條響應線便得到正弦圖（身體中每一點在 $(\theta, s)$ 中描出一條正弦曲線）。MLEM 把計數視為平均值為 $\bar y = A\lambda + r$ 的卜瓦松分布，並爬升對數概似 $\sum_b y_b \log \bar y_b - \bar y_b$：每次迭代先正投影目前的影像，與資料比較，再把比值反投影回去。它永遠不會變成負值，會保持總計數（沒有背景時 $\sum_b (A\lambda)_b = \sum_b y_b$），而且概似值永不下降。早期迭代較平滑；後期更銳利，卻會放大卜瓦松雜訊，因此誤差先下降後回升（使用預設值時最小值約在第 50 次迭代；試試 150 次迭代或減少衰變數，就能看到回升）：臨床掃描儀會提早停止（或使用 OSEM 子集與後濾波）。FBP 以斜坡濾波器處理每個投影，再一步反投影；速度快但雜訊較多，且可能出現負值。穿過身體的光子會衰減 $e^{-\int \mu\, dl}$，在 511 keV 時水的 $\mu \approx 0.096$ cm$^{-1}$；這個因子只取決於響應線，與衰變發生在線上何處無關，因此可以併入 $A$。簡化：只有 2D、高斯形正子射程（F-18 的平均射程約 0.6 mm，Ga-68 約 3 mm，因此除非調高，否則會被 6 mm 的像素掩蓋）、不考慮光子非共線性、理想晶體（每條響應線的端點放在觸發晶體內的隨機位置）且沒有作用深度或死時間，以及已知的平滑隨機與散射背景。所有數值皆為近似值，僅供教學使用，不可用於臨床。
meanings:
- 依活度分布抽樣的衰變位置（熱病灶衰變得更頻繁）
- 湮滅點：正子先移動約一毫米
- 兩個光子 $p = 1, 2$ 方向相反，各為 $511$ keV
- 每個光子到達環的位置：解 $|a + t u| = R$，取 $t > 0$
- 正弦圖：每條響應線 $(\theta, s)$ 偵測到的符合事件數
- 像素 $j$ 中的衰變被計入分箱 $b$ 的機率（乘上衰減）
- 重複的 $j$ ⇒ 求和：正投影加上隨機/散射背景
- 重複的 $b$ ⇒ 求和：沿每條響應線反投影
- 乘法更新：保持為正並維持總計數
labels:
  kilo_decays: 模擬衰變數（千）
  n_iter: MLEM 迭代次數
  positron_range: 正子射程 $\sigma_+$
  attenuation: 體內衰減
  background: 隨機 + 散射比例
  grid: 影像網格 $n \times n$
  n_detectors: 環上的偵測晶體數
