title: परिवर्ती प्रकाश वेग और क्षितिज समस्या
summary: 'CMB हर दिशा में समान तापमान का क्यों है, जबकि मानक ΛCDM में उसका आकाश लगभग $10^4$ ऐसे टुकड़ों में बँटा है जिन्होंने कभी संकेत का आदान-प्रदान नहीं किया? ब्रह्मांडों के एक बैच के लिए $\chi_p = \int c\,d\ln a/(aH)$ का समाकलन तीन उत्तरों की तुलना करता है: कोई नहीं (ΛCDM), स्फीति (सिकुड़ती हबल त्रिज्या के $\sim 60$ e-फ़ोल्ड) और मॉफ़ैट (Moffat) तथा अल्ब्रेख्त–मागेइजो (Albrecht–Magueijo) का काल्पनिक परिवर्ती प्रकाश वेग (VSL) विचार, जिसमें एक प्रावस्था संक्रमण से पहले प्रकाश लगभग $10^{26}$ गुना तेज़ था। स्फीति मुख्यधारा की व्याख्या है; VSL एक अल्पमत, काल्पनिक विकल्प है।'
notes: 'Planck 2018 प्राचल ($H_0 = 67.4$ km/s/Mpc, $\Omega_m = 0.315$, $\Omega_r = 9.1\times10^{-5}$, समतल), अंतिम प्रकीर्णन $a_\mathrm{rec} = 1/1090$ पर। ΛCDM आज 14.2 Gpc का कण क्षितिज देता है, पर पुनर्संयोजन के समय केवल लगभग 0.28 Gpc, इसलिए एक कारणात्मक टुकड़ा लगभग 1.2° फैला होता है और आकाश में ऐसे लगभग $10^4$ टुकड़े हैं। अनुरूप (conformal) आरेख में प्रकाश 45° पर चलता है; CMB के दो विपरीत बिंदुओं के भूतकालीन प्रकाश-शंकु तभी अतिव्याप्त होते हैं जब $\chi_p(a_\mathrm{rec}) \ge D$ (CMB तक की दूरी, 13.9 Gpc)। स्फीति यह $a_*$ पर समाप्त होने वाले डी सिटर प्रसार के $N$ e-फ़ोल्ड से करती है (सहगामी हबल त्रिज्या $\propto 1/a$ सिकुड़ती है); VSL मानक प्रसार रखता है पर $a_*$ पर संक्रमण से पहले $c$ को $r$ गुना बड़ा कर देता है, जो $w = 0.1$ e-फ़ोल्ड चौड़ाई का एक चिकना सोपान है। एनिमेशन दोनों को धीरे-धीरे चालू करता है। स्थिति: VSL (Moffat 1993; Albrecht और Magueijo 1999) काल्पनिक है और अल्पमत दृष्टिकोण है; इसे ऐसा फ़्रेम चाहिए जिसमें विमीय नियतांक बदल सके (केवल $\alpha = e^2/4\pi\varepsilon_0\hbar c$ जैसे
  विमाहीन संयोजन मापने योग्य हैं), इसकी भविष्यवाणियाँ मॉडल पर निर्भर हैं, और इसे कोई प्रेक्षणीय समर्थन नहीं है। स्फीति मानक व्याख्या है, वह भी प्रत्यक्ष रूप से पुष्ट नहीं (अभी तक कोई आदिम B-मोड नहीं) पर CMB उतार-चढ़ाव के मापे गए स्पेक्ट्रम से संगत है। सीमाएँ (टर्मिनल में छपती हैं): परमाणु घड़ियाँ $\dot\alpha/\alpha = (1.0\pm1.1)\times10^{-18}$/वर्ष, ओक्लो रिएक्टर 2 Gyr में $|\Delta\alpha/\alpha| \lesssim 10^{-7}$, पुनर्संयोजन पर CMB $|\Delta\alpha/\alpha| \lesssim 4\times10^{-3}$, और GW170817 $-3\times10^{-15} \le (v_\mathrm{gw}-c)/c \le 7\times10^{-16}$। $a_* \sim 10^{-28}$ पर संक्रमण इन सभी से बच निकलता है, और इसी कारण इसका परीक्षण इतना कठिन है।'
meanings:
- $a_*$ से बहुत पहले से आज तक $\ln a$ में ग्रिड
- 'हर $a$ पर ब्रह्मांड (फ़्रेम) $m$ का प्रकाश वेग: $a_*$ से पहले $c_0$ का $r$ गुना'
- प्रसार दर, स्फीति के $N$ e-फ़ोल्ड के दौरान $H(a_*)$ पर स्थिर
- 'सहगामी हबल त्रिज्या: एक प्रसार काल में प्रकाश कितनी दूर जाता है'
- '$a$ के साथ संचयी समलंब नियम: सहगामी कण क्षितिज'
- CMB आकाश पर एक कारणात्मक टुकड़े का कोण और टुकड़ों की संख्या
labels:
  log10_c_ratio: 'VSL: प्रारंभिक प्रकाश वेग $\log_{10}(c_\mathrm{early}/c_0)$'
  efolds: 'स्फीति: e-फ़ोल्ड की संख्या $N$'
  log10_a_star: संक्रमण / स्फीति का अंत $\log_{10} a_*$
  n_grid: $\ln a$ में ग्रिड बिंदु
