title: लॉरेंज़ आकर्षक और तितली प्रभाव
summary: संवहन के एक मॉडल से आए तीन युग्मित समीकरण न कभी थमते हैं, न कभी दोहराते हैं। इन्हें रैखिक भाग $A_{ij}x_j$ और रैंक-3 टेंसर वाले द्विघाती भाग $Q_{ijk}x_j x_k$ के योग के रूप में लिखने पर, एक ही einsum उन प्रक्षेप-पथों के पूरे बैच को आगे बढ़ाता है जो एक-दूसरे से $10^{-6}$ के भीतर शुरू होते हैं; वे सबसे बड़े ल्यापुनोव घातांक $\lambda \approx 0.9$ द्वारा तय दर से चरघातांकी रूप से अलग होते हैं, जब तक कि पूरी तितली पर फैल न जाएँ।
notes: 'लॉरेंज़ (1963) ने नीचे से गर्म किए गए तरल के एक मॉडल को तीन संख्याओं तक घटा दिया: $x$ संवहन रोल की तीव्रता है, $y$ और $z$ तापमान प्रोफ़ाइल बताते हैं। $\sigma = 10$, $\rho = 28$ और $\beta = 8/3$ के साथ गति दो स्थिर बिंदुओं $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$ में से एक के चारों ओर घूमती है, फिर अप्रत्याशित रूप से दूसरे पंख पर कूद जाती है। पास के प्रक्षेप-पथ $e^{\lambda t}$ की तरह अलग होते हैं, $\lambda \approx 0.906$: $10^{-6}$ की त्रुटि लगभग $15$ समय इकाइयों में आकर्षक के आकार तक बढ़ जाती है, इसीलिए पूर्वानुमान की एक सीमा होती है (तितली प्रभाव)। साथ ही अवस्थाओं का हर आयतन $e^{-(\sigma+1+\beta)t}$ की तरह सिकुड़ता है, इसलिए प्रक्षेप-पथ एक पतले, फ्रैक्टल समुच्चय पर सिमट जाते हैं: विचित्र आकर्षक। टेंसर रूप संरचना को स्पष्ट करता है: $A$ में सभी रैखिक युग्मन हैं और पूरी अरैखिकता $Q$ के दो घटक हैं। गणना से पहले $(1, 1, 1)$ से शुरू एक प्रक्षेप-पथ को $10$ समय इकाइयों तक समाकलित किया जाता है ताकि गेंद आकर्षक पर शुरू हो; यहाँ स्थिर चरण $0.005$ वाला RK4 पर्याप्त
  सटीक है। $\rho < 1$ आज़माएँ: मूल बिंदु स्थिर हो जाता है और सभी प्रक्षेप-पथ उसी में क्षीण हो जाते हैं; $1 < \rho < 24.74$ के लिए वे सर्पिल बनाते हुए $C_+$ या $C_-$ में गिरते हैं; $\rho = 28$ के पास और उससे ऊपर अराजकता लौट आती है।'
meanings:
- प्रक्षेप-पथ $b$ की अवस्था $(x, y, z)$
- 'रैखिक भाग: पंक्तियाँ $(-\sigma, \sigma, 0)$, $(\rho, -1, 0)$, $(0, 0, -\beta)$'
- 'द्विघाती भाग, दो शून्येतर घटकों वाला रैंक-3 टेंसर: $\dot y$ में $-xz$ और $\dot z$ में $+xy$'
- दोहराया $j$ ⇒ योग
- 'दोहराए $j$ और $k$ ⇒ योग: वह अरैखिकता जो अराजकता पैदा करती है'
- 'जैकोबियन का ट्रेस: अवस्थाओं के आयतन स्थिर दर $\sigma + 1 + \beta$ से सिकुड़ते हैं'
- प्रक्षेप-पथों की उनके माध्य से वर्ग-माध्य-मूल दूरी
- जब तक फैलाव $10\,s(0)$ से $1$ तक बढ़ता है, $t$ के सापेक्ष $\ln s$ की ढलान
labels:
  sigma: प्रांटल संख्या $\sigma$
  rho: रेले संख्या $\rho$
  beta: ज्यामिति गुणांक $\beta$
  t_max: सिमुलेशन समय
  log10_radius: प्रारंभिक गेंद की त्रिज्या $\log_{10} r$
  n_traj: प्रक्षेप-पथों की संख्या
