<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Our three-dimensional space drawn as a plane; at every point a small compact extra dimension of radius R is attached as a circle; gravity from a mass M spreads into the extra dimensions at distances below R and looks like Newton's law beyond">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- our 3D space as a plane -->
    <path d="M20,110 L180,110 L220,140 L60,140 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- compact circles attached along the plane -->
    <g fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <ellipse cx="60" cy="98" rx="9" ry="12"/>
      <ellipse cx="160" cy="98" rx="9" ry="12"/>
      <ellipse cx="200" cy="122" rx="7" ry="10"/>
    </g>
    <ellipse cx="110" cy="96" rx="14" ry="18" fill="#93c5fd" fill-opacity="0.35" stroke="#374151" stroke-width="2"/>
    <line x1="110" y1="96" x2="124" y2="96" stroke="#f59e0b" stroke-width="2"/>
    <text x="128" y="92" font-style="italic" fill="#b45309">R</text>
    <!-- the mass -->
    <circle cx="110" cy="114" r="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="96" y="132" font-style="italic">M</text>
    <!-- gravity spreading -->
    <line x1="104" y1="108" x2="80" y2="72" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="116" y1="108" x2="140" y2="72" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="110" y1="104" x2="110" y2="58" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="76" y="50" font-style="italic">n</text>
    <text x="90" y="28" font-size="13">extra dimensions?</text>
  </g>
</svg>
