source_hash: 3955d9d3b7d9
title: 米氏酶动力学（Michaelis–Menten）
summary: 酶与底物结合形成复合物，再释放产物：$E + S \rightleftharpoons ES \to E + P$。在同一个 $(4, B, C)$ 张量中同时求解三种酶和整组底物滴定的完整质量作用方程，并与准稳态速率方程 $v = V_{max} S/(K_m + S)$ 及 Lineweaver–Burk 拟合进行比较。
notes: 仅靠质量作用就得到四个耦合的常微分方程。Michaelis 和 Menten（1913），以 Briggs 和 Haldane（1925）的形式，注意到复合物 $ES$ 在不到一秒内就积累起来，之后只缓慢变化，因此可令 $d[ES]/dt \approx 0$。结合 $E + ES = E_0$ 可得 $[ES] = E_0 S/(K_m + S)$ 以及速率方程 $v = k_2 [ES] = V_{max} S/(K_m + S)$，其中 $K_m = (k_{-1} + k_2)/k_1$、$V_{max} = k_2 E_0$。中间面板的点显示每支试管当前的 $(S, k_2 [ES])$：爆发期过后，它们落在虚线曲线上，并随底物消耗沿曲线下滑，这正是准稳态近似（QSSA）在起作用。简化模型 $dS/dt = -V_{max} S/(K_m + S)$（橙色虚线）甚至有精确解 $S_0 - S + K_m \ln(S_0/S) = V_{max} t$。该近似在 $E_0 \ll S_0 + K_m$ 时成立；把 $E_0$ 提高到 2 µM，可以看到完整动力学落后于 QSSA，因为锁在复合物中的底物已不可忽略。生物化学家在多个 $S_0$ 下测量初速度 $v_0$，并拟合 $1/v_0 = (K_m/V_{max})(1/S_0) + 1/V_{max}$，这是一条直线（Lineweaver–Burk，1934）：$y$ 截距为 $1/V_{max}$，$x$ 截距为 $-1/K_m$。双倒数作图会放大低 $S_0$ 处的误差，因此数据有噪声时直接做非线性拟合更好。酶 A、B、C 在结合与速度之间取舍：A 的 $K_m$ 小，C 的 $k_{cat}$ 最大；催化效率 $k_{cat}/K_m$ 决定在低底物浓度下谁胜出。简化：单一活性位点、产物释放不可逆、无抑制作用，且体系均匀混合。
meanings:
- 酶 $b$ 的结合、解离和催化速率常数（$k_2 = k_{cat}$）
- 滴定的起始底物浓度 $c$（µM）
- 每支试管中的游离酶、底物、复合物 $X = ES$ 和产物
- 不对任何指标求和：$k_b$ 广播到每个浓度 $c$
- RK4 的右端项；$E + X = E_0$ 和 $S + X + P = S_0$ 保持不变
- 米氏常数（达到半速率时的底物浓度）和最大速率
- 初（稳态）速度，在短暂爆发期之后测量
- Lineweaver–Burk 正规方程，$A_{ck} = [1/S_c,\ 1]$；重复的 $c$ ⇒ 求和
- 每种酶的斜率 $K_m/V_{max}$ 和截距 $1/V_{max}$
labels:
  E0: 酶 $E_0$
  t_end: 模拟时间
  enzyme: 进程曲线所用的酶
