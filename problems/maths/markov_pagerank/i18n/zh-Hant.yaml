source_hash: 9576f7bf38f3
title: 馬可夫鏈與 PageRank
summary: 一位隨機瀏覽者在一個小型合成網路上點擊連結，偶爾跳到隨機頁面。位於各頁面的機率每點擊一次就以一次矩陣–向量乘積演化，其穩態分布就是 PageRank，這裡以冪迭代法、本徵分解以及同時模擬數千位瀏覽者三種方式求得。
notes: $S$ 是行隨機矩陣，因此把機率向量映射為機率向量，但網頁圖中有沒有外連結的頁面，也有會困住瀏覽者的頁面群組。懸空頁面被賦予均勻的一行（瀏覽者隨意輸入一個網址），而傳送項使 $G$ 的每個元素皆為正。由 Perron–Frobenius 定理，穩態分布因此唯一、為正，且從任何起點都能到達。$G$ 的其他每個本徵值都是 $S$ 的某個本徵值的 $d$ 倍，所以 $|\lambda_2| \le d$，冪迭代至少以 $d^k$ 的速度收斂。右側面板顯示一起求解的一批阻尼因子。取 $d = 0.85$（Brin 與 Page 於 1998 年建議的值），50 步至少把誤差縮小 $0.85^{50} \approx 3\times10^{-4}$，無論網路多大。瀏覽者是同一條鏈的蒙地卡羅估計：他們的比例跟隨 $\mathbf x_k$，雜訊約為 $1/\sqrt W$ 量級，而時間平均給出與冪迭代一致的排名。移除懸空修正會讓機率流失，如終端所示。試試 $d \to 1$，看收斂變慢，排名堆積在封閉的頁面群組中。
meanings:
- 若頁面 $j$ 連到頁面 $i$ 則為 1：各行是瀏覽者離開的頁面
- 對 $i$ 求和：頁面 $j$ 的外連結數
- 點擊隨機連結；懸空頁面（$d_j = 0$）得到均勻行 $1/N$
- 一批阻尼因子 $d_b$ 的 Google 矩陣；$1 - d$ 是傳送機率
- 重複的 $j$ ⇒ 求和：對每個 $d_b$ 同時做一步冪迭代
- 本徵值 1 的本徵向量，縮放使總和為 1；$G$ 不對稱，因此用 eig 而非 eigh
- 第二大本徵值的模：誤差每步以此因子縮小，且 $|\lambda_2| \le d$
- $W$ 位瀏覽者各自所在的頁面：以機率 $d$ 點擊連結，否則傳送
labels:
  damping: 阻尼因子 $d$
  pages: 頁面數 $N$
  dangling: 懸空頁面
  walkers: 隨機瀏覽者數 $W$
  iterations: 步數
  seed: 圖的亂數種子
