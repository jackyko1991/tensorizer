source_hash: c0b25ec18fe5
title: 霍曼转移与双椭圆轨道转移
summary: 把航天器从一条圆轨道送到另一条圆轨道需要多少 $\Delta v$？活力公式 $v^2 = \mu(2/r - 1/a)$ 给出两次点火的霍曼转移与三次点火的双椭圆转移的代价，再用一次批量 RK4 积分（在拱点施加脉冲点火）验证每艘航天器确实进入了目标轨道。
notes: 霍曼转移沿着同时与两个圆相切的椭圆飞行半圈，$a = (r_1 + r_2)/2$：在近拱点进行一次顺行点火 $\Delta v_1$，经过 $t_H = \pi\sqrt{a^3/\mu}$ 后在远拱点进行第二次点火 $\Delta v_2$ 使轨道圆化。双椭圆转移先爬升到一个很远的半径 $r_b$，此处航天器速度很慢，一次小的点火就能把轨道另一侧抬升到 $r_2$，到达时再制动。它耗时长得多，但当 $r_2/r_1 \gtrsim 11.94$ 时，足够远的 $r_b$ 能使它更省（极限 $r_b \to \infty$ 的代价为 $(\sqrt2 - 1)(v_{c1} + v_{c2})$），而当 $r_2/r_1 \approx 15.58$ 以上时，任何 $r_b > r_2$ 都更省。这两个交叉点都用二分法数值求得，第二个借助自动微分求导数。默认情形是从近地轨道（高度约 320 km）到地球静止轨道：霍曼转移约需 3.9 km/s 和 5.3 h。选择太阳并取 $r_1 = 1$ AU、$r_2 = 1.524$ AU 即为地球 → 火星：日心总计约 5.6 km/s，耗时约 259 天（运行时总会打印此情形）。真实任务还需先脱离地球引力井，并等待合适的行星相对位置；这里的轨道是共面的圆轨道，点火是瞬时的。运行时在每次点火处把 RK4 积分分段，使每次点火都恰好发生在拱点。
meanings:
- 航天器 $b$ 相对中心天体中心的位置，单位 km
- 航天器 $b$ 的速度，单位 km/s
- 重复的 $j$ ⇒ 求和：距离平方 $r_b^2$
- 指向中心的平方反比引力，$\mu = GM$
- 半长轴为 $a$ 的轨道上半径 $r$ 处的速度；每个 $\Delta v$ 都是两个这样的速度之差
- 航天器 $b$ 第 $k$ 次点火的时刻与带符号的大小（$\Delta v < 0$ 为制动）
- 沿速度方向的脉冲点火，施加在两段 RK4 之间
- 点火之间守恒；每次点火使它跃变为下一条轨道的 $-\mu/2a$
- $r_b = r_2$ 处的斜率；在 $r_2/r_1 \approx 15.58$ 以上变为负值
labels:
  body: 中心天体
  r1: 初始半径 $r_1$
  r2: 目标半径 $r_2$
  transfer: 转移方式
  rb_ratio: 双椭圆中间半径 $r_b / r_2$
