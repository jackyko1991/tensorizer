source_hash: 9753ed59836b
title: X선 감쇠와 영상 대조도
summary: 'X선은 몸을 지나며 지수적으로 약해집니다: $I = I_0\,e^{-\int\mu\,dl}$. 폐, 연조직, 뼈, 아이오딘 조영제로 만든 흉부 팬텀을 einsum 하나로 광선마다 투영하여, 낮은 에너지에서 뼈가 두드러지는 이유와 실제 관구 스펙트럼이 깊이에 따라 단단해지는 과정을 보여 줍니다.'
notes: '로그 공간에서 투영은 덧셈적입니다. $-\ln(I/I_0)$는 물질별 $\mu\,L$의 합이므로, 단색 영상은 물질 길이의 선형 사상입니다. 균질한 판은 반가층 $\ln 2/\mu$마다 빔을 절반으로 줄입니다. 광전 흡수는 대략 $Z^3/E^3$처럼 커지므로 뼈의 대조도는 30–50 keV에서 크고 더 높은 에너지에서는 사라집니다. 아이오딘은 33 keV의 K-흡수단 위에서 흡수가 급증하며, 이것이 조영제로 쓰이는 이유입니다. 실제 관구는 스펙트럼을 내보냅니다. 부드러운 광자가 먼저 흡수되어 평균 에너지가 올라가고 유효 $\mu$는 깊이에 따라 줄어듭니다(빔 경화). 단순화: 곧은 평행 광선, 산란 없음, 검출기 응답 없음, $\mu$ 값을 반올림한 여덟 개의 표 에너지. 모든 수치는 근삿값이며 교육용일 뿐 임상용이 아닙니다.'
meanings:
- '원-핫 팬텀: 픽셀 $(y, x)$가 물질 $m$이면 1'
- 픽셀 행 $y$ 안에서 광선의 경로 길이
- '반복된 $y$ ⇒ 합: 광선 $x$가 지나는 물질 $m$의 길이'
- 에너지 $E_e$에서 물질 $m$의 선형 감쇠 계수(1/cm)
- '반복된 $m$ ⇒ 합: 모든 에너지와 광선에 대한 선적분 $\int \mu\, dl$'
- 관구 스펙트럼(크라머스 법칙, 알루미늄 필터), $\sum_e S_e = 1$
- '반복된 $e$ ⇒ 합: 다색 빔의 투과 비율'
labels:
  energy_kev: 광자 에너지 $E$
  kvp: 관전압
  iodine_mg_ml: 아이오딘 농도
