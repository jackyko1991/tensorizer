source_hash: 09cd4df32aa9
title: NeRF：神经辐射场的体渲染
summary: 一个小型 MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$ 给空间中每个点一个密度和一个颜色。一个像素就是沿其光线收集到的光：先做分层采样 $t_s$，再用求积公式 $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$，其中透射率 $T_s = e^{-\sum_{s'<s}\sigma_{s'}\delta_{s'}}$，在光线 × 采样上批量计算。它只用合成场景的照片训练，就能渲染出一个留出视角和一张深度图；另一个不带位置编码的网络则展示了普通 MLP 的频谱偏差。
notes: 训练数据是一个红色球体、一个棋盘格立方体和一个橙色球的 $V$ 张照片，由带朗伯着色的解析光线投射器生成；网络从未见过几何，只看到像素颜色和每个像素的光线。每一步 Adam 从所有训练像素中随机抽取一批光线，用求积公式渲染，并与真实颜色比较。由于 $w_{rs}$、$T_{rs}$ 和颜色都是 $\sigma$ 与 $\mathbf c$ 的光滑函数，自动微分会把照片误差传回网络：在多个视角的光线一致认为存在表面的地方，密度会增大。深度图 $\sum_s w_s t_s$ 和沿标记光线的权重分布都显示了这一点：权重收缩为真实表面处的一个尖峰。位置编码是关键技巧。直接以 $(x, y, z)$ 为输入的普通 MLP 先学低频，拟合锐利边缘和细节纹理非常慢（频谱偏差）；改为输入 $\sin(2^k\pi x), \cos(2^k\pi x)$ 就给了它高频的构件。在相同步数下，编码后的网络（蓝色）轮廓更清晰，深度误差约减半，训练视角上的 PSNR 也更高，而普通网络（红色）始终模糊。在留出视角上收益较小：视角少且图像小时，细节只受到较弱的约束，而且两个网络都还远未收敛（真正的 NeRF 要训练好几个小时）。与 Mildenhall et al.（ECCV 2020）相比的简化：没有视角方向输入（场景是朗伯的，颜色不依赖观察角度），用一个网络代替粗 + 细两个网络及分层采样，一个很小的 MLP（3 × 64 而不是 8 × 256），$40\times 40$ 的图像，以及几百步而不是几十万步。试试 $L = 2$ 或 $L = 10$、更少的采样数 $S$（粗糙求积导致条带）、更多步数（只有带编码时才会出现棋盘格），或者更少的视角（几何变得不确定，训练视角仍能拟合，但留出视角变差）。
meanings:
- 穿过每台相机 $P$ 个像素中每一个的光线的起点和单位方向
- 在 $[t_n, t_f]$ 的 $S$ 个等长区间中各取一个随机深度：每步重新抽取，因此网络能看到整条光线
- 采样点：在光线 $r$ 和采样 $s$ 上广播
- $2^k\pi x_i$ 的 $\sin$ 和 $\cos$，$k = 0 \dots L-1$；不求和，是外积
- 一次性对所有采样应用一层 MLP，对 $g$ 求和；层间使用 ReLU
- 密度 $\ge 0$，颜色在 $(0, 1)$ 内
- 沿光线每个区间的长度
- 透射率：光学厚度 $\tau = \sigma\delta$ 在 $s' < s$ 上的排他累积和
- 到达像素的光是在区间 $s$ 中发出的概率；$\sum_s w_{rs} \le 1$
- 像素颜色，对 $s$ 求和；剩余的透射率显示白色背景
- 期望深度：同样的权重免费给出一张深度图
labels:
  n_freq: 编码频率数 $L$
  width: 隐藏层宽度 $H$
  n_samples: 每条光线的采样数 $S$
  steps: Adam 步数（每个网络）
  batch: 每步光线数
  lr: Adam 学习率
  n_views: 训练视角数 $V$
  resolution: 图像尺寸（像素）
