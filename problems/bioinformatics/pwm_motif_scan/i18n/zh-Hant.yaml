source_hash: 8da6dcc23206
title: 位置權重矩陣：模體標誌與掃描
summary: 將一個轉錄因子已比對的結合位點計數成 $(m, 4)$ 矩陣，加上偽計數轉為頻率，再轉為相對於背景的對數勝算分數。資訊量給出序列標誌，對展開視窗的一次 einsum 同時為長序列的兩股評分；命中以從序列打亂拷貝所得的 p 值判定。
notes: PWM 假設結合位點的每個位置獨立貢獻，所以視窗的分數是每個字母一個數字的總和：one-hot 視窗與 $W$ 的內積。偽計數 $\beta$ 使在少數訓練位點中從未出現的字母不致得到 $-\infty$ 的分數；位點越多它越不重要。一欄的資訊量是模體在該處把字母縮小到多少範圍，從 0 位元（什麼都行）到 2 位元（總是同一字母），標誌依 $P_{ja}$ 的比例堆疊字母。這裡的位點是合成的：12 bp，核心類似 TATA box（共識序列 TATAWAWR，W = A 或 T，R = A 或 G），兩側各有兩個固定字母，使模體帶有足夠的位元可被找到。單獨一個短的簡併模體資訊太少：在長序列中，隨機視窗的分數會與真實位點一樣高，這就是為什麼真實的 TATA box 僅憑 PWM 很難找到。p 值來自掃描序列的打亂拷貝（相同字母、沒有模體）；有 $2(L-m+1)$ 個視窗時，閾值 $p$ 大約會放過 $2(L-m+1)\,p$ 個隨機命中，而可解析的最小 p 值為 $1/(1 + \#\text{null scores})$。試試較少的訓練位點、較弱的模體或較寬鬆的閾值，看看植入的位點如何漏失或出現假命中。
meanings:
- 訓練位點 $s$、欄 $j$、字母 $a$ ∈ (A, C, G, T)
- 重複的 $s$ ⇒ 求和：每一欄的字母計數
- 加入偽計數 $\beta$ 的頻率；每列總和為 1，且無任何項為 0
- 相對於背景 $q_a$ 的對數勝算（位元）：> 0 為偏好，< 0 為避開
- 重複的 $a$ ⇒ 求和：每欄位元數，均勻背景下介於 0 與 2；即標誌高度
- $t = 0$ 為正股，$t = 1$ 為反向互補（欄反轉，A↔T，C↔G）
- 長序列中每個 $m$ 字母的視窗
- 重複的 $j$、$a$ ⇒ 求和：一次呼叫處理兩股；同一段程式碼為所有打亂序列 $(R, 2, L-m+1)$ 評分
- 打亂序列分數中至少同樣高者的比例
labels:
  n_train: 訓練位點數 $N$
  strength: 模體強度（共識的機率）
  pseudo: 偽計數 $\beta$
  length: 序列長度 $L$
  n_sites: 植入位點數
  log10_p: p 值閾值 $\log_{10} p$
  shuffles: 打亂序列數 $R$
  seed: 隨機種子
