source_hash: 4c18d665b55e
title: Почему вещества больше, чем антивещества?
summary: 'Во Вселенной около $6\times 10^{-10}$ барионов на фотон и почти нет антивещества. Три условия Сахарова говорят, что нужно любому объяснению; лептогенез — один из главных кандидатов: тяжёлые майорановские нейтрино распадаются в лептоны чуть чаще, чем в антилептоны (CP-асимметрия $\varepsilon$), обратные распады частично её смывают (сила $K$), а сфалероны превращают лептоны в барионы. Уравнения Больцмана для тысяч моделей $(\varepsilon, K)$ решаются как одно пакетное ОДУ и сравниваются с наблюдаемым $\eta_B$. Открытая проблема.'
notes: 'Наблюдения: отношение барионов к фотонам $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$ по реликтовому излучению (Planck 2018, $\Omega_bh^2 = 0.0224$), в согласии с первичным нуклеосинтезом, и нет признаков галактик из антивещества. Сахаров (1967) показал, что для асимметрии, возникающей из симметричной Вселенной, нужны (1) нарушение барионного числа, (2) нарушение C и CP и (3) отклонение от теплового равновесия. Тесты прямо проверяют (2) и (3): $\varepsilon = 0$ или тяжёлые нейтрино, удерживаемые в равновесии, дают ровно ноль; (1) — сфалеронный процесс Стандартной модели, который выше примерно 130 ГэВ превращает $B - L$ в $B = \tfrac{28}{79}(B - L)$. CP-нарушение кварков (фаза CKM) слишком мало, а электрослабый переход — кроссовер, поэтому одной Стандартной модели недостаточно: нужна новая физика. Лептогенез (Фукугита и Янагида, 1986) использует тяжёлые правые нейтрино механизма качелей (seesaw), который объяснил бы и то, почему лёгкие нейтрино так легки. Эта игрушечная модель оставляет
  только распады и обратные распады легчайшего $N_1$ (без рассеяний с $\Delta L = 2$, эффектов аромата и тепловых поправок) в нормировке Бухмюллера, Ди Бари и Плюмахера (2005). Слабое вымывание ($K \ll 1$) при тепловом начале сохраняет всю асимметрию ($\kappa_f \to 1$, проверено); сильное вымывание ($K \gg 1$) теряет большую часть, но забывает начальные условия (оба начала сливаются), а решатель согласуется с их аналитической аппроксимацией примерно в пределах 10 %. При $K = \tilde m_1/m_*$, $m_* \approx 1.08\times10^{-3}$ эВ массы нейтрино из осцилляций ($\approx 0.009$–$0.05$ эВ) указывают на $K \approx 10$–$50$, где нужно $\varepsilon \approx 2\times10^{-6}$–$10^{-5}$; тогда граница Дэвидсон–Ибарры $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$ требует $M_1 \gtrsim 10^{10}$ ГэВ. Статус: открыто. Лептогенез привлекателен и согласуется со всем известным, но не подтверждён: тяжёлые нейтрино далеко за пределами ускорителей. Косвенными указаниями были бы безнейтринный двойной
  бета-распад (майорановская природа) и CP-нарушение в нейтринных осцилляциях (T2K, NOvA, далее DUNE и Hyper-Kamiokande); электрослабый бариогенез и другие механизмы остаются альтернативами. Страница численно исследует игрушечные уравнения и не утверждает, что асимметрия возникла именно так.'
meanings:
- '$z = M/T$, логарифмическая сетка: часы идут по мере остывания Вселенной'
- 'CP-асимметрия по первой оси, параметр распада по второй: всё транслируется на $(E, K)$'
- '$\tfrac38 z^2K_2(z)$: $3/4$ на фотон, пока релятивистские, затем $e^{-z}$'
- распады и обратные распады за хаббловское время в середине шага
- '$N_N - N_N^{eq}$: отклонение от равновесия (3-е условие Сахарова)'
- 'точный одношаговый множитель линейного ОДУ: устойчив даже при $K = 1000$'
- асимметрия $B - L$ каждой модели, продвигаемая одним тензорным обновлением за шаг
- сфалероны оставляют $28/79$ от $B - L$ в виде барионов; число фотонов растёт в $f = 2387/86$ раз
- 'эффективность: $1$ при слабом вымывании, $\approx 1/(K z_B)$ при сильном'
