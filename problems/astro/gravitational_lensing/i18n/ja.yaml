source_hash: e3dd0dc823a1
title: ブラックホールによる重力レンズ
summary: ブラックホールのそばを通る光線はヌル測地線であり、さまざまな衝突パラメータの光線の扇を一度に追跡する。遠くを通る光線は $4GM/(c^2 b)$ だけ曲がり、$\sqrt{27}\,GM/c^2$ より内側の光線は落ち込む。天球上では、レンズ方程式が一回のテンソル演算ですべてのピクセルを光源面へ写し戻すので、ブラックホールの背後を通過する星は 2 つの弧、アインシュタインリング、そして増光のスパイクになる。
notes: 光線パネル：単位は $G = c = M = 1$。点線の円は光子球（$r = 3M$）で、$b < \sqrt{27}\,M \approx 5.2\,M$ の光線はブラックホールに落ちる。これが、ブラックホールが地平面半径の 2.6 倍の影（シャドウ）をつくる理由である。そのすぐ外側の光線は、一周してから脱出することがある。天球パネル：アインシュタイン半径を単位とした薄レンズ近似の点質量（銀河系内の恒星質量ブラックホールでは約 1 ミリ秒角で、そのためマイクロレンズは分解された像ではなく増光として観測される）。重力レンズは表面輝度を保存するので、像は単に $\beta(\theta)$ で評価した光源である。余分な光は像が引き伸ばされることによる。完全な整列に近いとき、点光源なら $\mu \to \infty$ となるが、光源の有限の大きさが増光率を制限する。
meanings:
- 光線 $b$ に沿った $1/r$、0（無限遠）から $du/d\varphi = 1/b$ で出発
- ヌル測地線の軌道方程式、すべての光線について $\varphi$ で RK4
- 出射角から $\pi$ を引いたもの。捕獲されたら NaN
- ピクセル $p$ の天球上の角度、$\theta_E$ 単位
- 繰り返される $j$ ⇒ 和をとる
- 各ピクセルが光源面のどこを見ているか
- ブロードキャストによる各フレーム $f$ のレンズ像
- 増光率：全フラックスの比
labels:
  b_min: 最小の衝突パラメータ $b$
  b_max: 最大の衝突パラメータ $b$
  n_rays: 光線の数
  impact: レンズからの光源のずれ $u$
  source_radius: 光源の半径
  n_pixels: 一辺あたりの天球ピクセル数
