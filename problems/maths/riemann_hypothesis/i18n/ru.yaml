source_hash: a175ef505737
title: Гипотеза Римана в тысячах нулей
summary: Найдите тысячи нетривиальных нулей $\zeta$ на критической прямой с помощью формулы Римана–Зигеля в тензорной форме, сравните их число с законом Римана–фон Мангольдта $N(T) = \theta(T)/\pi + 1 + S(T)$ и законом Грама, сопоставьте их расстояния и парную корреляцию со случайными эрмитовыми матрицами (GUE) и восстановите по ним лестницу степеней простых $\psi(x)$. Сама гипотеза о том, что каждый нетривиальный нуль имеет вещественную часть $\frac12$, по-прежнему открыта.
notes: 'Эта страница дополняет задачу «Дзета-функция Римана и простые числа» (maths/zeta_primes), где $\zeta$ строится с нуля по формуле Эйлера–Маклорена, находятся первые нули и восстанавливается $\pi(x)$; прочитайте её сначала, чтобы познакомиться с основами. Здесь более быстрая формула Римана–Зигеля с поправками $C_0, C_1, C_2$ (производные $\Psi$ из ряда Чебышёва) вычисляет $Z(t)$ на четверти миллиона высот и находит все нули на критической прямой ниже $T$; при $t \ge 100$ она согласуется с вычислением высокой точности (mpmath) лучше чем до $10^{-5}$. Ниже $t = 1000$ она находит 649 смен знака, а ниже 5000 — 4520, ровно столько, сколько всего нулей в полосе до этих высот (подсчитано независимо с mpmath), так что все они лежат на прямой; считающая функция следует $\theta(T)/\pi + 1$ с малой флуктуацией $S(t)$, среднее которой равно нулю. Закон Грама выполняется в большинстве точек Грама и впервые нарушается в $g_{126} \approx 282.45$. После нормировки к среднему расстоянию 1 нули отталкиваются
  друг от друга точно так же, как собственные значения больших случайных эрмитовых матриц (GUE): Монтгомери (1973) высказал гипотезу о парной корреляции $1 - (\sin \pi u / \pi u)^2$ и доказал её, в предположении гипотезы Римана, для пробных функций с носителем преобразования Фурье в $(-1, 1)$, а вычисления Одлыжко около $10^{20}$-го нуля впечатляюще её подтверждают; на малых высотах здесь согласие уже близкое. Явная формула (фон Мангольдт 1895, доказана) превращает нули в простые числа: каждая пара $\frac12 \pm i\gamma$ добавляет волну $x^{1/2}\cos(\gamma\ln x)$, и с тысячами нулей $\psi(x)$ становится чёткой лестницей. Гипотеза Римана о том, что каждый нетривиальный нуль имеет вещественную часть $\frac12$, — одна из задач тысячелетия Института Клэя, и она открыта. Она проверена для всех нулей до высоты $3\times10^{12}$ (Платт и Трудджиан 2021). Доказанные результаты, показанные в полосе: отсутствие нулей на $\operatorname{Re} s = 1$ (Адамар, де ла Валле Пуссен 1896, эквивалентно теореме
  о распределении простых чисел) и область без нулей $\sigma > 1 - 1/(5.558691\ln t)$ (Моссингхофф и Трудджиан 2015), отражённая функциональным уравнением. Заявлено, но не установлено: в октябре 2026 года OpenAI опубликовала (по сообщениям; мы не проверяли рукописи) в своём открытом репозитории openai/math рукописей, созданных ИИ, заявленную полуплоскость без нулей $\operatorname{Re} s > 7/8$ для $\zeta$ и каждой $L$-функции Дирихле, а также сопутствующее рассуждение для $\operatorname{Re} s > 11/12$. Эти препринты не прошли рецензирование и не были независимо проверены; если они верны, полоса без нулей фиксированной ширины стала бы крупным продвижением, но всё ещё далёким от прямой $\frac12$. Никакое вычисление не может доказать гипотезу: конечный поиск может лишь находить нули на прямой или контрпример.'
meanings:
- 'повторный $n$ ⇒ суммирование: главная сумма сразу для 250 000 высот, с маской $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$'
- $\Psi$ — целая функция, но частное имеет вид $0/0$ при $p = \frac14, \frac34$; аппроксимация Чебышёва это устраняет
- 'поправки Римана–Зигеля: ряд Чебышёва дифференцируется почленно, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- смены знака $Z$ на сетке с шагом 0.02, затем 32 шага бисекции сразу на всех интервалах
- число нулей минус его гладкая часть; остаётся малым и в среднем равно 0
- все точки Грама сразу методом Ньютона; закон Грама гласит, что $(-1)^n Z(g_n) > 0$
- разности нормированных нулей $x = \theta(\gamma)/\pi + 1$ до следующих $J = 10$ соседей, для парной корреляции
- 'каждый нуль в каждой точке $x$, с накоплением по нулям: одна строка на каждую высоту $T$'
labels:
  t_max: Высота $T$
  x_max: Явная формула до $x$
