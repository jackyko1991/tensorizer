source_hash: 07db7a3fd274
title: 상자 속 입자와 염료의 색
summary: 더 긴 공액 분자는 왜 더 붉은 빛을 흡수할까? 사이아닌 염료의 $\pi$ 전자는 길이 $L$인 1차원 상자 속 입자처럼 사슬을 따라 자유롭게 움직인다. 준위 $E_n \propto n^2/L^2$를 둘씩 채우면 HOMO→LUMO 간격 $\Delta E = h^2(N+1)/8m_eL^2$와 예측 $\lambda_{max}$를 동족 계열 전체에 대해 한꺼번에 얻는다. torch.linalg.eigh로 대각화한 배치 유한 차분 해밀토니언이 해석적 준위를 재현한다.
notes: 쿤의 자유 전자 모형(1948)은 공액 사슬의 $\pi$ 전자를 상자 속의 독립된 입자로 다룬다. 사이아닌 염료 $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$에서는 양전하를 두 질소가 나눠 가지므로 사슬의 모든 결합 길이가 거의 같고(약 $l = 0.139$ nm), 바닥이 평평한 상자가 좋은 그림이 된다. 결합 $2k + 2$개, 전자 $N = 2k + 4$개, 그리고 상자가 각 질소 너머로 결합 하나만큼 튀어나온다고 하면 $L = (2k + 4)l$이고, $\lambda_{max} = 8m_ec\,L^2/h(N + 1)$은 $k$에 대해 거의 선형으로 증가한다. 모형은 CH=CH 단위 하나를 더할 때마다 약 125 nm를 예측하고, 빨간 사각형(가장 단순한 사이아닌들의 반올림한 측정값)은 약 100 nm씩 올라간다. 이는 고전적인 학부 실험이다. 사슬 길이가 늘어나는 사이아닌 염료 몇 가지의 가시광선 스펙트럼을 측정한 뒤 $\lambda_{max}$로 상자 길이나 말단 연장을 맞춘다. 수치 풀이법은 같은 준위를 $10^{-3}$보다 정확하게 주며(오차는 $(n\,\Delta x)^2$처럼 줄어든다), 공식이 할 수 없는 일, 즉 퍼텐셜을 켜는 일을 할 수 있다. 폴리엔은 이중 결합과 단일 결합이 번갈아 있다. 단순한 상자에서는 예측 $\lambda_{max}$가 적외선 깊숙이 들어가지만 실제 폴리엔은 일정 값에 수렴한다(C=C가 11개인 β-카로틴은 450 nm 근처를 흡수한다). 폴리엔 계열을 고르고 $V_{alt}$를 1–2 eV로 올려 보자. 주기적 퍼텐셜이 긴 사슬에서도 유한하게 남는 간격을 여는데, 이것이 띠 간격의 1차원 씨앗이다. 색 견본은 각 $\lambda_{max}$에서 가우시안 흡수 띠를 뺀 백색광을 보여 준다. 노란색을 흡수하는 염료는 파랗게 보이고, 자외선만 흡수하는 염료는 무색으로 보인다.
meanings:
- 계열 속 분자 $b$의 π 전자와 공액 결합
- '상자 길이: 모든 결합에 각 말단 원자 너머 결합 길이 하나씩을 더함'
- 해석적 준위; 합산하는 첨자 없음, $n^2$와 $1/L^2$의 외적
- HOMO $n = N/2$에서 LUMO $n = N/2 + 1$로, 그리고 흡수 파장
- 각 상자의 내부 격자점; 벽에서 $\psi = 0$
- 분자마다 유한 차분 해밀토니언 하나, 쌓아 올림
- 반복된 $j$ ⇒ 합산; eigh가 배치 전체를 한 번의 호출로 대각화
- '반복된 $w$ ⇒ 가시광선 파장에 대해 합산: 흡수 후 남은 색'
labels:
  series: 동족 계열
  n_max: 가장 긴 사슬 (추가된 CH=CH 단위)
  bond: 결합 길이 $l$
  end: 각 말단 원자 너머 상자 연장 (결합 수)
  V_alt: 결합 교대 퍼텐셜 $V_{alt}$
  n_points: 격자점 수 $M$
