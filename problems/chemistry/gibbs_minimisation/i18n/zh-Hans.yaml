source_hash: 955b219d37d6
title: 通过吉布斯自由能最小化求化学平衡
summary: 甲烷–空气火焰会产生什么？在固定的 $T$ 和 $P$ 下，产物会停留在吉布斯自由能 $G = \sum_j n_j \mu_j$ 最低之处，同时满足每种元素守恒 $A_{ij} n_j = b_i$。批量牛顿法（RAND 方法）在一整段温度范围内同时求解 10 个物种，展示 CO₂ 和 H₂O 随气体变热分解为 CO、H₂、OH、H 和 O，并求出绝热火焰温度。
notes: 为什么要最小化 $G$？在恒定 $T$ 和 $P$ 下，热力学第二定律指出封闭系统只能降低其吉布斯自由能，因此平衡就是在保持每个原子不变的条件下 $G$ 的最低点：一个约束最小化问题。引入拉格朗日乘子 $\pi_i$（每种元素一个），条件为 $\mu_j/RT = \sum_i \pi_i A_{ij}$：每个物种的化学势等于其各原子“元素势”之和。这用一个对所有物种的优化取代了一串平衡常数（每个反应一个），NASA CEA、STANJAN 和 Cantera 等程序正是这样计算火焰、火箭尾气和大气的。这里的求解器是 Gordon–McBride 形式（NASA RP-1311）的 RAND 方法：对 $\ln n_j$ 用牛顿法，消元后化为关于 $\pi_i$ 和 $\Delta\ln n_{tot}$ 的小型 $(E{+}1)\times(E{+}1)$ 方程组，并限制步长，使主要物种每步最多变化 $e^2$ 倍。在对数空间中计算能让摩尔分数为 $10^{-30}$ 的痕量物种保持为正且精确。控制台打印两项最优性检验（元素平衡和 $\mu_j/RT = \pi_i A_{ij}$，都接近机器精度）以及一项自动微分检验：用 torch 对 $G/RT$ 求导，得到的正是 $\pi_i A_{ij}$。值得关注的是：低于约 1500 K 时，产物只有 CO₂、H₂O 和 N₂（贫燃时还有 O₂）；高于 2000 K 时它们会解离（CO₂ → CO + ½O₂，H₂O → OH + ½H₂，然后分解为原子），因为熵项 $-T\,S$ 胜过了键焓。解离吸热，所以平衡火焰比产物保持完整时低约 100 K（右下），最热的火焰出现在略富燃于化学计量比的位置。提高 $P$ 可以看到勒夏特列原理：分子数较少的一方更有利，因此解离受到抑制。数据：$\Delta_f H^\circ$(298 K) 和 $S^\circ$(298 K) 是取自 NIST-JANAF 表的舍入值。热容是示意性的常数（大致为 298 到 2000 K 的平均 $c_p$），而不是随 $T$ 变化的表列函数，所以组成只是半定量的：本模型对 1 bar 下化学计量比的甲烷–空气给出 $T_{ad} \approx 2260$ K，而精确的热化学数据给出约 2225 K。简化：理想气体，无凝聚相（无烟炱、无液态水），产物中无
  CH₄ 或其他烃类，且只考虑平衡：真实火焰中 CO 和 NO 的冻结由动力学而非热力学决定。
meanings:
- 物种 $j$（CO₂、H₂O、CO、H₂、O₂、N₂、OH、H、O、NO）中元素 $i$（C、H、O、N）的原子数
- 由 CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂) 输入的原子，每个当量比 $\varphi$ 一行
- 批次：每个温度都是一个独立的最小化问题，一起求解
- 由 $\Delta_f H^\circ$、$S^\circ$ 和恒定的 $c_p$ 得到 $[H_j(T) - T S_j(T)]/RT$
- 重复的 $j$ ⇒ 求和：每种混合物的吉布斯自由能
- 现有各元素的原子数；在解处等于 $b_i$
- 对 $j$ 求和：牛顿矩阵，每行一个加权的 $A\,\mathrm{diag}(n)\,A^{\mathsf T}$
- 每个温度一个小型 $(E{+}1)\times(E{+}1)$ 方程组，一次调用全部求解
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$，对 $i$ 求和；像 NASA CEA 一样加阻尼
- 自动微分检验：在最小值处等于 $\pi_{bi}A_{ij}$（拉格朗日条件）
- 产物焓；对 $T$ 二分直到它等于反应物焓：$T_{ad}$
labels:
  phi: 当量比 $\varphi$（燃料 / 化学计量燃料）
  P_bar: 压强 $P$
  T_max: 扫描的最高温度
