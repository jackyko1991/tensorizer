<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Two reactant flasks, aluminium and iodine, are poured together; the reaction proceeds by an extent xi into a beaker of aluminium iodide product with some aluminium left over">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- flask 1: aluminium (grey grains) -->
    <path d="M28,22 V40 L10,74 H62 L44,40 V22" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <path d="M17,61 H55 L62,74 H10 Z" fill="#e5e7eb"/>
    <g fill="#374151">
      <circle cx="20" cy="69" r="2.5"/><circle cx="28" cy="66" r="2.5"/><circle cx="36" cy="70" r="2.5"/>
      <circle cx="44" cy="66" r="2.5"/><circle cx="52" cy="70" r="2.5"/><circle cx="32" cy="62" r="2.5"/>
    </g>
    <text x="36" y="94" text-anchor="middle">Al</text>
    <!-- flask 2: iodine -->
    <path d="M28,104 V118 L10,150 H62 L44,118 V104" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <path d="M19,134 H53 L62,150 H10 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <text x="74" y="140">I<tspan font-size="10" dy="3">2</tspan></text>
    <!-- mixing arrows and reaction extent -->
    <line x1="68" y1="56" x2="122" y2="88" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="92" y1="124" x2="122" y2="104" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="62" font-style="italic" fill="#b45309">ξ</text>
    <!-- product beaker -->
    <path d="M134,58 V146 H206 V58" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <rect x="135" y="100" width="70" height="45" fill="#93c5fd"/>
    <line x1="135" y1="100" x2="205" y2="100" stroke="#1e40af" stroke-width="1"/>
    <g fill="#374151">
      <circle cx="146" cy="141" r="2.5"/><circle cx="160" cy="142" r="2.5"/><circle cx="153" cy="137" r="2.5"/>
    </g>
    <text x="182" y="124" text-anchor="middle">AlI<tspan font-size="10" dy="3">3</tspan></text>
    <text x="170" y="40" text-anchor="middle" font-size="12" fill="#6b7280">excess Al left</text>
    <line x1="162" y1="46" x2="154" y2="132" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
