source_hash: 9a93d668845a
title: 'Entrenar por separado, unir mediante un tensor DAG: una CNN y un LM diminuto'
summary: 'Una CNN pequeña aprende los dígitos de MNIST y un GPT diminuto a nivel de caracteres aprende frases como "three+two=five.", cada uno por su cuenta. Después, una sola arista del DAG los une: un conector convierte las características de la CNN en tokens suaves que sustituyen a la primera palabra, de modo que el LM responde "five" a "[imagen de un 3]+two=". Todo el proceso de entrenamiento es en sí mismo un DAG tensorial (reglas por niveles, un camino crítico max-plus, una única llamada por lotes por regla sobre todas las semillas), y se compara con la misma red entrenada de extremo a extremo solo en la tarea conjunta, con el mismo cómputo (multiplicaciones-sumas). La arista de unión también se escribe como una capa de mezcla de expertos con un enrutador fijo, y se pone a prueba un enrutador aprendido.'
notes: 'Idea. Las redes pueden entrenarse por separado, conectarse luego mediante un tensor DAG y optimizarse después globalmente, y todo el proceso puede estar a su vez controlado por el tensor DAG. La idea es de Jacky Ka Long Ko; este problema la pone a prueba con una CNN pequeña y un LM diminuto a nivel de caracteres, deliberadamente no como un modelo de visión y lenguaje entrenado conjuntamente desde cero, y la compara exactamente con esa alternativa sin DAG. Qué es nuevo y qué no. Construir un modelo multimodal a partir de un codificador de imágenes preentrenado por separado, un LM preentrenado y un pequeño conector aprendido es como se hacen LLaVA (Liu et al. 2023, una proyección lineal o MLP al espacio de tokens del LM) y BLIP-2 (Li et al. 2023, el Q-Former entre un codificador de imágenes congelado y un LLM congelado); Frozen (Tsimpoukelli et al. 2021) entrega una imagen a un LM congelado como prefijo suave, como aquí; y el cosido de modelos (Lenc y Vedaldi, CVPR 2015, arXiv 2014;
  Bansal et al. 2021) une dos redes entrenadas con una pequeña capa entrenable. Lo que añade este problema es la orquestación: tanto el grafo del modelo como el proceso de entrenamiento los ejecuta el motor de DAG tensorial del problema de flujo de trabajo del polígono de Willis (grafo de reglas, grafo de trabajos de Kronecker, niveles booleanos, camino crítico max-plus), y el modelo construido mediante el DAG se mide frente a un monolito. Tarea y modelos. Una CNN (dos convoluciones de 5×5, 8474 pesos) aprende los diez dígitos a partir de 3000 imágenes de MNIST. Un GPT de dos capas (d = 32, cuatro cabezas, 27 543 pesos, atención con einsum y un eje de modelos tomado de chain_of_thought) aprende las 300 frases «a op b = r.» con op en +, −, × módulo 10, con los dígitos escritos como palabras ("three+two=five.", la primera palabra alineada a la derecha en una casilla de 5 letras). La tarea conjunta da una imagen de prueba de MNIST de a y el texto "+two="; la palabra del operando no está en
  el texto. La arista del DAG es un conector (3808 pesos): a partir de las diez probabilidades de dígito $q$ de la CNN y de un vector de casilla $S_t$, genera $K = 5$ tokens suaves $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$ que sustituyen a la casilla del operando en la entrada del LM. (Alimentar en su lugar las características de la penúltima capa de la CNN aprendía mucho más despacio en las pruebas: alrededor de 0,25 de precisión conjunta tras 100 pasos del conector frente a alrededor de 0,6.) La precisión es la proporción de ejemplos de prueba cuyas letras de respuesta y punto final son todas la primera opción del LM dado el prefijo verdadero, que es exactamente lo que escribe la decodificación voraz. El proceso de entrenamiento como DAG. data/training.smk enumera las reglas; el motor lo analiza con el analizador del polígono de Willis y lo ejecuta nivel por nivel, cada regla como UNA sola llamada por lotes sobre sus modelos en un eje de modelos apilados (semilla × tamaño del conjunto
  conjunto $n$): nivel 0 train_cnn ∥ train_lm ∥ train_monolith; nivel 1 train_connector (CNN y LM congelados, difundidos de semilla a (semilla, $n$) por el bloque $I \otimes \mathbb 1$); nivel 2 global_finetune (todo, de extremo a extremo a través de la arista, con una tasa de aprendizaje 100 veces menor) ∥ dos enrutadores aprendidos; nivel 3 evaluate. Con 2 semillas y 4 tamaños: 8 reglas, 45 trabajos, 84 aristas entre trabajos, $A$ nilpotente. Las pruebas comprueban los niveles, que se rechaza un ciclo, que dos semillas entrenadas en una misma pila dan las mismas pérdidas que cada una entrenada por separado (Adam actúa elemento a elemento, el recorte es por modelo) y que la pérdida de un modelo no envía ningún gradiente a los demás. La referencia. El monolito es la misma CNN + conector + LM (39 825 pesos), inicializada aleatoriamente y entrenada de extremo a extremo solo con los ejemplos conjuntos. Su presupuesto se iguala en multiplicaciones-sumas por modelo: los 150 pasos de la CNN, 600
  del LM, 150 del conector y 80 de ajuste fino (lote de 32) del pipeline DAG cuestan lo mismo que 682 pasos conjuntos, que son los que recibe el monolito (contando cada preentrenamiento completo para cada modelo, aunque en el DAG una sola CNN y un solo LM preentrenados sirven a los cuatro valores de $n$). Resultados (2 semillas, 1000 imágenes de prueba, azar 0,1, CPU). Las reducciones en coma flotante multihilo hacen que las ejecuciones repetidas difieran en unos pocos puntos, así que las cifras siguientes son el intervalo de la media sobre las semillas en cuatro ejecuciones completas; results/stages.csv contiene los valores exactos de la ejecución incluida. Por sí sola, la CNN lee 0,89 de los dígitos de prueba y el LM completa de 0,97 a 0,99 de las indicaciones de texto; escribir el dígito de la CNN como texto y dárselo al LM obtiene de 0,88 a 0,89, el techo de este pipeline. Precisión conjunta para $n$ = 100, 300, 1000, 3000 ejemplos conjuntos: conector sin entrenar alrededor de 0,16;
  tras la etapa del conector 0,41–0,47, 0,58–0,63, 0,60–0,69, 0,64–0,68; tras el ajuste fino global 0,41–0,47, 0,63–0,67, 0,68–0,75, 0,71–0,75; el monolito 0,14, 0,13–0,15, 0,16–0,17, 0,23. El modelo construido mediante el DAG gana para cada $n$ en todas las ejecuciones, con mayor margen donde los datos conjuntos escasean, y el ajuste fino añade de 0,03 a 0,08 a partir de $n$ = 300 (con $n$ = 100 no cambia nada en promedio). La razón es sencilla: el DAG reutiliza datos unimodales (3000 dígitos etiquetados y todas las frases), mientras que el monolito debe descubrir los dígitos y la aritmética solo a partir de $n$ palabras de respuesta, y × a menudo oculta el operando (cualquier cosa × 0 = 0). Con más pasos o datos el monolito mejoraría (su pérdida sigue bajando al final de su presupuesto): es una comparación con poco presupuesto, no una ley. Arista del DAG = reparto MoE. La misma capa de entrada se escribe como una mezcla de expertos: el experto img (CNN + conector) y el experto txt (la
  incrustación de tokens del LM), un enrutador $G$ sobre posiciones × expertos, cada experto ejecutado por lotes sobre las posiciones que se le asignan, y la combinación $X^0 = G_{mntx}Y^x_{mntc}$. Con $G$ one-hot según el tipo de datos (casilla de imagen o letra, conocido antes de ver ningún dato, igual que un flujo de trabajo elige una regla por su comodín), la salida MoE es igual a la salida cableada por el DAG con una diferencia de 1e-6, y lo mismo ocurre con todos los gradientes (comprobado). La relación precisa: una arista de DAG es un reparto MoE con un enrutador fijo decidido por el tipo de datos; un MoE es un DAG cuyas aristas elige para cada token un enrutador aprendido. ¿Puede un enrutador aprender ese enrutamiento? Se entrenó un enrutador lineal sobre las características de cada posición (imagen agrupada a 7×7 e identificador one-hot) con los expertos congelados y la pérdida de equilibrio de carga de Switch ($\alpha$ = 0,01). Switch top-1 (solo se ejecuta el experto elegido,
  escalado por $p$) no es fiable: su precisión de enrutamiento osciló entre 0 y 0,92 según los modelos y las ejecuciones, y su precisión en la tarea entre 0 y alrededor de 0,46, porque el experto no elegido no recibe gradiente, de modo que una mala elección temprana nunca se corrige, y la pérdida de equilibrio empuja hacia un reparto 50/50 mientras que el reparto real es 5/17. Entrenado como una mezcla densa ($G = p$, ambos expertos en todas partes) y usado después en top-1, el enrutador recupera el enrutamiento por modalidad en todos los modelos y ejecuciones (0,97 a 0,99 de las posiciones) y alcanza alrededor de 0,35 a 0,65 de precisión en la tarea, algo por debajo del enrutador fijo porque $p < 1$ reduce la escala de las salidas. Cuando la arista correcta se conoce a partir del tipo de datos, fijarla es a la vez exacto y más barato. Tiempo. En una CPU de escritorio de 6 núcleos, la ejecución por defecto entrena en unos 66 s cuando la máquina está desocupada (hasta 2 a 4 minutos cuando
  se comparte con otros trabajos pesados), más unos 15 s para el GIF: en la ejecución sin carga, el monolito tardó 35 s, el LM 12 s, el conector 4,5 s y el ajuste fino 4 s. Con un worker por regla, el camino crítico max-plus es el monolito y luego evaluate (39 s); la cadena propia del sistema DAG LM → conector → ajuste fino → evaluate tarda unos 24 s. El código elige la GPU cuando torch detecta una; el entorno de este proyecto tiene una compilación de torch para CPU, así que todas las cifras incluidas proceden de la CPU. Datos. MNIST (Y. LeCun, C. Cortes, C. J. C. Burges), licencia CC BY-SA 3.0: se incluye un subconjunto equilibrado de 3000 imágenes de entrenamiento y 1000 de prueba (data/mnist_subset.npz, 0,7 MB; data/SOURCES.md contiene la fuente, las sumas de verificación y el procesamiento). Las frases se generan en el código. Prueba. Menos pasos del LM (la precisión del LM limita todo), un $\alpha$ mayor (el enrutador Switch colapsa más), sin ajuste fino (0 pasos) o una sola semilla
  para ver cuánto discrepan las semillas.'
meanings:
- la regla $s$ lee lo que escribe la regla $r$; el proceso de entrenamiento analizado a partir de data/training.smk con el analizador del problema del polígono de Willis
- 'grafo de trabajos sobre los comodines semilla y $n$: una regla sin $n$ se difunde a cada $n$ ($I \otimes \mathbb 1$), evaluate los reúne todos ($\mathbb 1^\top$)'
- 'nivel de cada regla: train_cnn, train_lm y el monolito en el 0, el conector en el 1, ajuste fino y enrutador en el 2, evaluate en el 3'
- tiempos de finalización max-plus a partir de las duraciones medidas de las reglas; $\max t$ es el camino crítico
- las diez probabilidades de dígito de la CNN para cada imagen; el eje de modelos $m$ se convierte en los grupos de una convolución agrupada por capa
- 'la arista del DAG: probabilidades de dígito más un vector de casilla $S_t$ → un vector de entrada del LM en la posición $t$; los $K = 5$ tokens suaves sustituyen a la primera palabra oculta'
- 'enrutador: one-hot según el tipo de datos (casilla de imagen o letra), o un softmax Switch top-1 aprendido sobre las características de las posiciones'
- '$x$ repetido ⇒ sumado: la combinación de la capa MoE; cada experto $Y^x$ se calcula solo sobre su grupo asignado'
- logits de la siguiente letra del GPT diminuto (atención con einsum y un eje de modelos, de chain_of_thought)
- pérdida por modelo en el texto tras el prefijo (nats); sumar las $M$ pérdidas da a cada modelo su propio gradiente
labels:
  seeds: Semillas (réplicas independientes)
  steps_cnn: Pasos de preentrenamiento de la CNN
  steps_lm: Pasos de preentrenamiento del LM
  steps_con: Pasos del conector (CNN y LM congelados)
  steps_ft: Pasos de ajuste fino global
  steps_router: Pasos del enrutador aprendido (cada enrutador)
  lr_ft: Tasa de aprendizaje del ajuste fino
  alpha: Peso del equilibrio de carga $\alpha$
