title: 문턱값 아래의 양자 오류 정정
summary: 비트 반전 반복 부호는 논리 비트 하나를 잡음 있는 큐비트 $d$개에 퍼뜨리고 그 패리티를 계속 측정한다. 수천 번의 몬테카를로 샷을 하나의 $(S, R, d)$ 텐서로 실행하고, 정확한 최소 가중치 복호기가 시공간 신드롬 이력을 읽으며, $d = 3, 5, 7, 9$의 곡선이 문턱값에서 교차한다. 문턱값 아래에서는 $d \to d + 2$로 한 단계 커질 때마다 논리 오류율이 인자 $\Lambda > 1$로 나뉜다. 이것이 Google의 2024년 문턱값 이하 표면 부호 메모리 뒤에 있는 양이다.
notes: '이 부호는 $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$과 $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$을 저장한다. 패리티 검사 $Z_jZ_{j+1}$은 논리 값을 드러내지 않으면서 이웃이 어디서 불일치하는지를 드러낸다. 부호 용량 모형(한 라운드, 완벽한 검사)에서 최적 복호기는 다수결이고, 시뮬레이션한 $P_L$은 정확한 이항 꼬리(점선)를 따르며 문턱값은 정확히 $p = 1/2$이다. 현상론적 모형에서는 검사도 잘못 읽히므로 신드롬 하나를 믿을 수 없다. 복호기는 $d$ 라운드 이력 전체를 설명하는 가장 적은 데이터 반전과 오독의 조합을 찾는다. 이것이 최소 가중치 완전 매칭이 푸는 문제이며, 1D에서는 여기서 $2^d$개 오류 패턴에 대한 동적 계획법으로 정확히 푼다(따라서 $d \le 11$). 이 모형의 문턱값은 $p \approx 10\%$ 근처이고(매우 큰 $d$에서 약 10.3 %), 각 부호를 $d$ 라운드 동안 실행하면 작은 $d$의 교차점들이 그 근처에 놓인다. 문턱값 아래에서는 더 큰 부호가 이기고 $\Lambda = \varepsilon_d/\varepsilon_{d+2}$는 $p$가 작아질수록 커진다(대략 $p_{th}/p$처럼). 문턱값 위에서는 큐비트를 더해도 실패할 곳만 늘어난다. 연구 배경: Google Quantum AI and Collaborators, Quantum error correction below the surface code threshold, Nature 638, 920 (2025; arXiv:2408.13687, 2024)은 Willow 프로세서에서 거리 3, 5, 7의 표면 부호 메모리를 실행하여 $\Lambda \approx 2.1$, 거리 7에서 사이클당 대략 0.14 %의 논리 오류를 보고했다(근삿값). 그 이전 단계로는 반복 부호(Nature 595, 383, 2021)와, 거리 5 표면 부호가 거리 3을 근소하게
  앞선 결과(Nature 614, 676, 2023)가 있었다. 반복 부호와 표면 부호의 차이: 반복 부호는 비트 반전($X$ 오류)만 정정하는 1D 선이다 — 어느 큐비트에서든 위상 반전($Z$)이 일어나면 논리 오류가 되므로 완전한 양자 메모리가 아니다. 표면 부호는 $Z$형과 $X$형 검사를 모두 갖는 2D 격자로 두 가지를 모두 정정한다. 그 복호 그래프는 3D(공간 2차원과 시간)이고 문턱값은 더 낮아서, 이 현상론적 잡음에서는 약 3 %, 현실적인 회로 잡음에서는 대략 1 %다(근삿값). 단순화: 독립적인 오류, 완벽한 최종 판독, 누설이나 상관된 폭발적 오류 없음. 실제 장치에서는 이런 요인이 논리 오류율의 하한을 정한다.'
meanings:
- 샷 $s$, 라운드 $t$에서의 데이터 반전(확률 $p$)과 검사 오독(확률 $q$)
- 라운드 $t$ 후 데이터 큐비트 $i$에 누적된 오류
- 검사 $j$는 이웃 $i = j$와 $i = j + 1$을 비교한다($Z_jZ_{j+1}$)
- '반복된 $i$ ⇒ 합: 각 검사가 보고해야 할 패리티'
- '바뀐 신드롬 비트: 시공간에서 오류 사슬의 끝'
- 오류 패턴 $x$로 끝나는 가장 저렴한 이력, $w = \ln\frac{1-p}{p}$. $y$에 대한 최솟값은 1비트 반전 $d$개
- '다수결: 검사가 절대 오독하지 않을 때의 최적 복호기'
- 라운드당 오류 억제, $1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: 잡음 모형(검사 오독 포함 또는 미포함)
  d_max: 최대 거리 $d$(11은 느림)
  shots: $(d, p)$ 점당 샷 수
  n_p: 오류율 $p$의 개수
  p_min: 최소 $p$
  p_max: 최대 $p$
  q_ratio: 오독률 $q/p$
