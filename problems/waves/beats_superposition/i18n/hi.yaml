source_hash: 2765022e4b7f
title: विस्पंद और समूह वेग
summary: निकट आवृत्तियों वाली दो (या अधिक) ज्यावक्रीय तरंगों को जोड़ें। सभी तरंगें एक टेंसर में हैं जिसके सूचकांक तरंग $s$, समय $n$ और स्थिति $j$ हैं; $s$ पर एक einsum उनका अध्यारोपण करता है। किसी स्थिर बिंदु पर आप $|f_1 - f_2|$ पर विस्पंद सुनते हैं; समष्टि में वाहक शीर्ष कला वेग से चलते हैं जबकि आवरण समूह वेग से चलता है।
notes: 'दो तरंगों के लिए $\cos a + \cos b = 2\cos\tfrac{a-b}{2}\cos\tfrac{a+b}{2}$: धीमे आवरण के भीतर औसत आवृत्ति वाला तेज़ वाहक। प्रबलता $|{\rm envelope}|$ प्रति सेकंड $|f_1 - f_2|$ बार शिखर पर पहुँचती है — यही विस्पंद आवृत्ति है। परिक्षेपण संबंध $\omega = c_0 k_0 (k/k_0)^p$ के साथ समूह वेग कला वेग का $p$ गुना है: डोरी पर ध्वनि के लिए बराबर ($p = 1$), गहरे पानी की तरंगों के लिए आधा ($p = \tfrac12$), केशिका लहरों के लिए डेढ़ गुना ($p = \tfrac32$)। लाल बिंदु $v_p$ पर एक शीर्ष के साथ चलता है, हरा बिंदु $v_g$ पर आवरण शिखर के साथ। दो से अधिक तरंगों के साथ विस्पंद अलग-अलग तरंग समूह बन जाते हैं।'
meanings:
- तरंग $s$ की कोणीय आवृत्ति और तरंग संख्या, परिक्षेपण संबंध $\omega \propto k^p$ से जुड़ी
- स्थितियाँ और समय जहाँ तरंग का मान निकाला जाता है
- broadcasting से हर समय और स्थान पर हर तरंग की कला
- 'दोहराया गया $s$ ⇒ योग: अध्यारोपण'
- 'आवरण: फेज़रों के योग की लंबाई'
labels:
  f1: आवृत्ति $f_1$
  f2: आवृत्ति $f_2$
  n_waves: तरंगों की संख्या (f1 से f2 तक फैली)
  dispersion: परिक्षेपण $p$ = 1, ½, 3/2
  t_max: सिमुलेशन समय
