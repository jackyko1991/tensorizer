title: सिंकहॉर्न विधि से इष्टतम परिवहन
summary: छल्ले के आकार के रेत के ढेर को दो ढेरियों में, और फिर एक सर्पिल में, कुल न्यूनतम मेहनत से कैसे ले जाएँ? इष्टतम परिवहन वह योजना $P_{ij}$ खोजता है जो द्रव्यमान को $x_i$ से $y_j$ तक लागत $|x_i - y_j|^2$ पर ले जाती है; इसका न्यूनतम मान वासरस्टीन दूरी का वर्ग $W_2^2$ है। थोड़ी-सी एन्ट्रॉपी $\varepsilon$ जोड़ने से समस्या सिंकहॉर्न के बारी-बारी से होने वाले अद्यतनों द्वारा हल हो जाती है, जिन्हें यहाँ लॉग डोमेन में logsumexp के साथ $\varepsilon$ के पूरे बैच के लिए एक साथ लिखा गया है; $\varepsilon \to 0$ होने पर लागत हंगेरियन एल्गोरिद्म द्वारा पाए गए सटीक इष्टतम तक घट जाती है।
notes: 'मोंज ने 1781 में यह समस्या प्रस्तुत की और कांतोरोविच ने 1942 में इसे योजनाओं $P$ तक शिथिल किया। कुतुरी (2013) ने दिखाया कि एन्ट्रॉपिक संस्करण सिंकहॉर्न के मैट्रिक्स स्केलिंग से हल होता है, जिसमें प्रति पुनरावृत्ति कुछ ही मैट्रिक्स गुणन लगते हैं, और इसी ने इष्टतम परिवहन को मशीन लर्निंग में व्यावहारिक बनाया। छोटे $\varepsilon$ में सावधानी चाहिए: कोड $e^{-C/\varepsilon}$ (जो अंडरफ़्लो हो जाता है) के बजाय पोटेंशियल $f, g$ और logsumexp के साथ काम करता है, और $\varepsilon$ को 1 से धीरे-धीरे उसके लक्ष्य मान तक घटाता है ($\varepsilon$-स्केलिंग)। लागत $\langle P_\varepsilon, C\rangle$ हंगेरियन एल्गोरिद्म द्वारा गणना किए गए सटीक $W_2^2$ तक घटती है (एक धीमा सटीक संदर्भ, जिसे सभी क्रमचयों पर पूर्ण खोज से जाँचा गया है), जबकि द्वैत मान $\mathrm{OT}_\varepsilon$ में एक एन्ट्रॉपिक पूर्वाग्रह रहता है जिसे फ़ेडी और अन्य (2019) का सिंकहॉर्न डाइवर्जेंस हटा देता है। परीक्षण दो बंद रूपों की भी जाँच करते हैं: एक विमा में इष्टतम योजना क्रमबद्ध बिंदुओं को जोड़ती है (क्वांटाइल फलन), और गाउसीय वितरणों के बीच
  $W_2^2 = |m_1 - m_2|^2 + \operatorname{tr}(S_1 + S_2 - 2(S_1^{1/2} S_2 S_1^{1/2})^{1/2})$ (ब्यूरेस मीट्रिक), ब्रेनियर प्रमेय का उपयोग करते हुए कि किसी उत्तल फलन की प्रवणता ही इष्टतम प्रतिचित्रण है। सभी आकृतियाँ कोड द्वारा बनाई गई हैं; किसी छवि का उपयोग नहीं हुआ है।'
meanings:
- सूत्रों और यादृच्छिक संख्याओं से बने कृत्रिम बिंदु-समूह, प्रत्येक बिंदु का द्रव्यमान $a_i = 1/N$
- दूरी का वर्ग, दोहराया गया $k$ ⇒ योग
- एक साथ हल की जाने वाली नियमितीकरण शक्तियों का बैच
- लॉग डोमेन में सिंकहॉर्न अद्यतन, $j$ पर योग logsumexp के रूप में; बहुत छोटे $\varepsilon$ के लिए भी कभी ओवरफ़्लो नहीं होता
- '$i$ पर वही: इसके बाद $P$ के स्तंभ-योग ठीक $b$ के बराबर होते हैं'
- 'परिवहन योजना: बड़े $\varepsilon$ के लिए धुंधली, छोटे $\varepsilon$ के लिए लगभग एक क्रमचय'
- 'बैरीसेंट्रिक प्रतिचित्रण: $x_i$ का द्रव्यमान कहाँ जाता है; बिंदु सीधी रेखाओं $(1-t)\,x + t\,T(x)$ पर चलते हैं (मैककैन अंतर्वेशन)'
- $\mathrm{OT}_\varepsilon(\mu,\nu) - \tfrac12\mathrm{OT}_\varepsilon(\mu,\mu) - \tfrac12\mathrm{OT}_\varepsilon(\nu,\nu)$, $\mu = \nu$ होने पर शून्य
labels:
  n_points: प्रति आकृति बिंदु $N$
  eps_min: सबसे छोटा नियमितीकरण $\varepsilon$
  n_eps: बैच में $\varepsilon$ के मान
  n_iter: सिंकहॉर्न पुनरावृत्तियाँ
