  - {symbol: 'x = s \lor R s', code: 'rerun_set(closure(A), touched)', shape: '(J,)', meaning: 'jobs to rerun after the jobs in $s$ (readers of a changed file) became outdated'}
  - {symbol: '\sigma((I - \theta)/w)', code: 'soft_threshold(image, theta, width)', shape: '(B, X, Y, Z)', meaning: 'soft segmentation, differentiable in the threshold $\theta$ (one per case)'}
