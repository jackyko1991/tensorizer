source_hash: 936404bf1075
title: 量測你的晶片屋頂線（roofline）
summary: 執行這段程式的機器有多快？為一次大型記憶體複製計時，得到頻寬 $\beta$；再以 FP64、FP32、TF32、BF16 和 FP16 為 $n\times n$ 矩陣乘積 $C_{ij} = A_{ik}B_{kj}$ 計時，得到每種精度的速率 $\pi$。接著，屋頂線 $P(I) = \min(\pi, \beta I)$ 會告訴你哪些核心（kernel）能在你的晶片上全速執行，哪些得等待記憶體。程式技巧 ▸ 加速晶片組 會把你的結果放在其他晶片的規格表旁邊。
notes: 規格表給的是峰值；實際量測給的是 PyTorch 在你的機器上真正達到的速度，對大型矩陣乘積來說通常是峰值的 50–90%。GPU 的運算是非同步的，所以每次計時都會等裝置完成（synchronize），並在暖機之後取多次執行的中位數。在 NVIDIA GPU 上，FP32 乘積會量測兩次：一次用真正的 FP32，一次用 TF32 張量核心（torch.set_float32_matmul_precision("high")），這個設定會悄悄犧牲尾數位元來換取速度。Apple 的 GPU 後端（MPS）沒有 float64，所以在那裡會跳過 FP64；消費級 GPU 執行 FP64 的速率只有 FP32 的一小部分，這對物理計算很重要。試試更大的矩陣尺寸：速率會持續上升，直到乘積受運算能力限制為止，而記憶體複製則維持在頻寬附近。
meanings:
- 大型複製（讀取 + 寫入）測得的記憶體頻寬，GB/s
- 精度 $p$ 下實際達到的矩陣乘積速率，TFLOP/s
- 重複的 $k$ ⇒ 求和：$n^3$ 次乘加
- 每搬移一個位元組的 FLOP 數：元素為 $b$ 位元組時是 $2n/(3b)$
- 強度為 $I$ 的核心最多能達到的速率
labels:
  matrix_size: 矩陣尺寸 $n$
  copy_mb: 複製大小
  repeats: 計時重複次數
