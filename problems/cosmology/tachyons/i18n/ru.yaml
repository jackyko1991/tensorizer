source_hash: e3fd71733e91
title: Тахионы и антителефон
summary: 'Что, если бы у частицы была мнимая масса, $m^2 < 0$? С комплексными тензорами $E^2 = p^2 + m^2$ по-прежнему даёт вещественные энергии, но частица всегда движется быстрее света и ускоряется, теряя энергию. Пакетные преобразования Лоренца сверхсветовых мировых линий находят системы отсчёта, в которых сигнал приходит раньше, чем был отправлен, и замыкают петлю антителефона Толмена. В теории поля $m^2 < 0$ означает другое: неустойчивый вакуум, который конденсируется, как это делает поле Хиггса. Это спекулятивно: ни один тахион никогда не наблюдался, а «сверхсветовые нейтрино» OPERA 2011 года оказались следствием плохо подключённого кабеля.'
notes: 'Спекулятивная физика: тахионы гипотетичны. Ничто в Стандартной модели не является тахионной частицей, и ни один эксперимент никогда её не обнаружил. Специальная теория относительности запрещает разогнать массивное тело через $c$, но сама по себе не запрещает частицы, которые всегда движутся быстрее света (Билянюк, Дешпанде и Сударшан 1962; Файнберг 1967, придумавший это название). Цена — причинность. Два события, связанные сигналом со скоростью $u > c$, разделены пространственноподобным интервалом, поэтому их временной порядок зависит от наблюдателя: в любой системе отсчёта, движущейся быстрее $c^2/u$, сигнал приходит раньше, чем отправлен, и несёт отрицательную энергию. Переинтерпретация Файнберга читает это как антитахион с положительной энергией, летящий в обратную сторону; это спасает положительность энергии, но вопрос «кто его отправил» остаётся зависящим от системы отсчёта. Две системы отсчёта дают антителефон Толмена (1917): Алиса посылает сигнал Бобу, удаляющемуся со скоростью
  $\beta$, а Боб отвечает с той же скоростью в своей собственной системе. Ответ достигает Алисы раньше, чем она отправила сообщение, как только $\beta > 2u/(1+u^2)$, и это замыкает причинную петлю. В квантовой теории поля отрицательная $m^2$ — это не быстрая частица, а неустойчивость. Поле скатывается с вершины холма $\phi = 0$ потенциала $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ в $\phi = \pm\sqrt{-m^2/\lambda}$ («тахионная конденсация», понижающая энергию на $m^4/4\lambda$), где живут обычные частицы с масса$^2 = 2|m^2|$. Именно это делает поле Хиггса, и панель показывает это на решётке с хаббловским трением. Реальные данные: в 2011 году OPERA сообщила, что мюонные нейтрино прибывают на $60.7 \pm 6.9 \pm 7.4$ ns раньше на базе 730 km, $(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1). Причиной оказались плохо подключённый оптоволоконный кабель и дрейф часов. Исправленный результат — $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ (v4, JHEP 10 (2012) 093), а ICARUS
  измерил $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns (Phys. Lett. B 713 (2012) 17): оба согласуются с $c$. Если трактовать значение 2011 года как тахион, потребовалось бы $|m| \approx 120$ MeV, и тогда нейтрино с энергией 10 MeV от сверхновой SN1987A обогнали бы свет примерно в 12 раз, вместо того чтобы прийти в пределах нескольких часов от него после 168 000 лет пути ($|v-c|/c \lesssim 2\times10^{-9}$, Лонго 1987). Единицы: $c = 1$, масса тахиона $\mu = 1$ для веера сигналов.'
meanings:
- 'комплексный квадратный корень: вещественный при $p > \mu$, хотя $m$ и $\gamma$ оба мнимые'
- одно преобразование Лоренца на каждую систему отсчёта наблюдателя ($c = 1$)
- 'повторяющийся $b$ ⇒ суммирование: каждый сигнал виден из каждой системы отсчёта одновременно'
- инвариант $m^2 = -\mu^2$, одинаковый во всех системах отсчёта
- 'быстроты вычитаются: $\tanh$ ниже $c$, $\coth$ выше'
- когда ответ достигает Алисы; $< t_{\mathrm{send}}$ замыкает причинную петлю
- решёточное поле, скатывающееся с ложного вакуума $\phi = 0$ (лапласиан через torch.roll, скоростной алгоритм Верле)
labels:
  u: Скорость тахионного сигнала $u$
  beta_max: Самая быстрая система отсчёта наблюдателя $\beta_\mathrm{max}$
  m2: Тахионная масса$^2$ поля $m^2$
  lam: Константа самодействия $\lambda$
  friction: Хаббловское трение $\gamma$
