source_hash: d014ac5184c9
title: 三體混沌：畢達哥拉斯問題
summary: 布勞問題：質量為 3、4、5 的物體從 3-4-5 三角形的頂點靜止出發，混沌地舞動，直到其中一個被甩出。一個起點相差 $\delta = 10^{-6}$ 的孿生運行在同一個張量中積分（運行指標 $k$）；兩者之間的距離呈指數增長，$|\Delta| \propto e^{\lambda t}$，最終命運分道揚鑣。
notes: 難點在於近距離交會：兩個物體在約 $0.01$ 的距離上擦身而過，此時引力是平常的 $10^4$ 倍。固定步長要麼在那裡發散，要麼在其他地方慢如蝸牛，因此求解器採用自適應的 Dormand–Prince 5(4) 方法：每一步比較五階和四階的結果，dt 在近距離掠過時自動縮小，之後再變大。這裡不使用軟化，因此是 $G = 1$ 的精確牛頓引力。兩個運行共用同一步長，從而在相同時刻比較。由於運動是混沌的，容差很重要：在預設值 $10^{-11}$ 下，參考運行重現了經典結果（Szebehely 和 Peters，1967）：最輕的物體（$m = 3$）在 $t \approx 60$ 左右被拋出，而質量 4 和 5 組成緊密雙星向相反方向離去。僅偏移 $\delta$ 的孿生運行在 $t \approx 45$ 時已完全分開，走上不同的歷史。$|\Delta|$ 的曲線起伏不定：每次近距離交會時，孿生體會以高速早一點或晚一點經過，因此出現尖峰，增長也是一陣一陣的。擬合得到的 $\lambda$ 是從 $t = 0$ 到 $|\Delta|$ 永久保持在 $0.1$ 以上為止的平均趨勢。試試更寬鬆的容差：參考運行本身的命運也會改變，提醒我們數值誤差同樣是一種擾動。
meanings:
- 運行 $k$（$k = 0$ 為參考，$k = 1$ 為孿生）中物體 $a$ 的位置，平面分量 $i$
- 質量 3、4、5
- 從 $a$ 到 $b$ 的間隔，透過廣播得到兩次運行的所有物體對
- 重複的 $j$ ⇒ 求和：每對物體距離的平方
- 重複的 $b$ ⇒ 求和：物體 $a$ 受到的總引力；$k$ 不求和，各次運行保持獨立
- 自適應 Dormand–Prince 步的 7 個級斜率；五階減四階組合即誤差估計
- 孿生與參考在位置和速度上的距離
- 直到兩次運行徹底分開為止 $\ln|\Delta|$ 隨 $t$ 的斜率：李雅普諾夫指數
labels:
  t_max: 模擬時間
  log10_delta: 孿生偏移 $\log_{10}\delta$
  log10_tol: 誤差容限 $\log_{10}\mathrm{tol}$
