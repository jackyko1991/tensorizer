source_hash: e9d43436470c
title: 周転円で絵を描く
summary: 閉曲線を複素数 $z_n = x_n + i\,y_n$ としてサンプリングすると離散フーリエ変換 $c_k$ が得られ、各項 $c_k e^{2\pi i k t}$ は半径 $|c_k|$ で一周の間に $k$ 回まわる円になります。これらの円を大きい順に次々とつなげると、ペン先が元の曲線をなぞり直します。円を加えるにつれて Tensorizer のロゴの輪郭が現れ、誤差は Parseval の定理の予測どおりに減っていきます。
notes: DFT 行列 $W$ は和をそのまま書き下します（$N^2$ 回の積）。`torch.fft.fft` は Cooley–Tukey の高速フーリエ変換で同じ $c_k$ を $O(N \log N)$ で求め、両者が一致することをテストで確認しています。DFT は可逆です。$N$ 個の円をすべて使えば $N$ 個のサンプルが正確に再現され、時間シフト $z_{n-s}$ は $c_k$ に位相 $e^{-2\pi i k s/N}$ を掛けるだけです（半径は変わらず、出発点だけが変わります）。一度だけなぞる円は1項（$k = 1$）で足り、ハート形 $x = 16\sin^3 s$, $y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$ は三角多項式なので、ちょうど 8 個の円（$k = \pm1 \dots \pm4$）で完全に描けます。多角形は事情が違います。角ごとに速度が跳ぶため、$|c_k|$ は $1/k^2$ 程度でしか減衰せず、$M$ 個の円での誤差は $M^{-3}$ 程度になります。円が少ないと角が丸まり、辺に沿ってリンギングの波打ちが現れます。曲線そのものは連続なので、（関数自体が跳ぶフーリエ級数の問題の矩形波とは違い）この波打ちは消えるまで小さくなります。9 % の Gibbs のオーバーシュートは、跳びのある速度のほうに現れます。大きい円から残すと誤差は単調に減ります。Parseval の定理により、誤差は捨てた円の $\sum|c_k|^2$ にちょうど等しいからです。歴史：Ptolemy の天文学（『アルマゲスト』、2 世紀）では、惑星は円（周転円）の上を動き、その中心がさらに別の円（従円）の上を動きます。周転円を十分に増やせばどんな周期的な閉じた軌道にも合わせられるため、この体系は正しい物理ではないのに 1400 年にわたって観測とよく合ったのです。ロゴの経路は Tensorizer の立方体の六角形の輪郭と内側の3本の辺で、行って戻る形でたどります。少ない円で星形を試してみてください。
meanings:
- 等間隔の時刻 $t_n = n/N$ における曲線の複素数値。多角形は弧長で再サンプリングする
- DFT 行列。周波数は $k = -N/2 \dots N/2 - 1$
- 繰り返される $n$ ⇒ 和をとる：円 $k$ の半径は $|c_k|$、初期角は $\arg c_k$
- 半径で順位づけた円：連鎖は大きいものから残す
- 繰り返される $k$ ⇒ 和をとる：最大の $M_m$ 個の円が描く曲線を、すべての $M$ について一度に求める（$K_{mk} = [r_k < M_m]$、$E_{tk} = e^{2\pi i k t}$）
- 項の累積和：連鎖の各円の中心。最後のものがペン先
- サンプル点での平均二乗誤差。捨てた円のエネルギーに等しい（Parseval）
labels:
  shape: 曲線
  n_points: サンプル数 $N$
  max_terms: 円の最大数 $M$
