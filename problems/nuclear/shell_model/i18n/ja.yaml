source_hash: f7213dbb7c33
title: 原子核の殻模型
summary: 核子はウッズ–サクソン型ポテンシャルの中を独立に運動する。すべての $(l, j)$ チャネルの動径シュレーディンガー方程式を差分ハミルトニアンの1つのバッチとして解き、スピン軌道力を強めていくと、魔法数 2, 8, 20, 28, 50, 82, 126——特に安定な原子核の核子数——が準位図の最大のギャップとして現れる。
notes: スピン軌道力がなければ準位は3次元調和振動子のように束になり、ギャップは核子数 2, 8, 20, 40 の後に現れる（ウッズ–サクソン型ポテンシャルの平らな底により 58, 92, 138 も分離する）。スピン軌道項は $j = l + \tfrac12$ を下げ $j = l - \tfrac12$ を上げ、その量は $l$ とともに大きくなる。そのため各振動子殻の高 $j$ の相方（1f7/2、1g9/2、1h11/2、1i13/2）が下の殻に落ち込む——これが 28, 50, 82, 126 に対するマイヤーとイェンゼンの1949年の説明である。既定のパラメータは ²⁰⁸Pb の中性子に対するもの：$V_0 = 51 - 33(N-Z)/A \approx 44$ MeV、$r_0 = 1.27$ fm、$a = 0.67$ fm。簡略化：全準位に対して1つの固定ポテンシャル（自己無撞着性なし、対相関なし）、クーロン項なし（したがって中性子準位）、18 fm の箱なので束縛準位だけを示す。
meanings:
- 内部の格子点；$r = 0$ と箱の端で $u = 0$
- 差分による $d^2/dr^2$
- $l = 8$ までのすべてのチャネル $(l, j = l \pm \tfrac12)$
- $j = l+\tfrac12$ で $+l/2$、$j = l-\tfrac12$ で $-(l+1)/2$
- ポテンシャル + スピン軌道 + 遠心力項、einsum('k,i->ki') による
- チャネルごとに1つのハミルトニアンを積み重ねたもの
- $k$ についてバッチ化；束縛準位 $E < 0$ を残す
- 並べた各準位まで詰めた核子数：魔法数は大きなギャップの位置にある
labels:
  v_so: 最終スピン軌道強度 $V_{so}$
  v0: ポテンシャルの深さ $V_0$
  mass_number: 質量数 $A$（$R = r_0 A^{1/3}$ を決める）
  diffuseness: 表面の広がり $a$
  n_grid: 格子点数
