title: L'hypothèse de Riemann en milliers de zéros
summary: Localiser des milliers de zéros non triviaux de $\zeta$ sur la droite critique avec la formule de Riemann–Siegel sous forme tensorielle, les dénombrer face à la loi de Riemann–von Mangoldt $N(T) = \theta(T)/\pi + 1 + S(T)$ et à la loi de Gram, comparer leurs espacements et leur corrélation de paires à celles de matrices hermitiennes aléatoires (GUE), et reconstruire à partir d'eux l'escalier des puissances de nombres premiers $\psi(x)$. L'hypothèse elle-même, selon laquelle tout zéro non trivial a pour partie réelle $\frac12$, reste ouverte.
notes: 'Cette page complète le problème « La fonction zêta de Riemann et les nombres premiers » (maths/zeta_primes), qui construit $\zeta$ de zéro avec Euler–Maclaurin, trouve les premiers zéros et reconstruit $\pi(x)$ ; lisez-le d''abord pour les bases. Ici, la formule de Riemann–Siegel, plus rapide, avec ses corrections $C_0, C_1, C_2$ (dérivées de $\Psi$ obtenues par une série de Tchebychev), évalue $Z(t)$ en un quart de million de hauteurs et trouve tous les zéros sur la droite critique en dessous de $T$ ; pour $t \ge 100$, elle concorde avec une évaluation en haute précision (mpmath) à mieux que $10^{-5}$. En dessous de $t = 1000$, elle trouve 649 changements de signe et en dessous de 5000, 4520, soit exactement le nombre total de zéros dans la bande jusqu''à ces hauteurs (calculé indépendamment avec mpmath) : tous se trouvent donc sur la droite ; la fonction de comptage suit $\theta(T)/\pi + 1$ avec une petite fluctuation $S(t)$ de moyenne nulle. La loi de Gram est vérifiée à la plupart
  des points de Gram et échoue pour la première fois en $g_{126} \approx 282.45$. Après normalisation à un espacement moyen de 1, les zéros se repoussent exactement comme les valeurs propres de grandes matrices hermitiennes aléatoires (GUE) : Montgomery (1973) a conjecturé la corrélation de paires $1 - (\sin \pi u / \pi u)^2$ et l''a démontrée, sous l''hypothèse de Riemann, pour des fonctions test dont la transformée de Fourier est à support dans $(-1, 1)$, et les calculs d''Odlyzko près du $10^{20}$-ième zéro la confirment de façon spectaculaire ; aux faibles hauteurs considérées ici, l''accord est déjà bon. La formule explicite (von Mangoldt 1895, démontrée) transforme les zéros en nombres premiers : chaque paire $\frac12 \pm i\gamma$ ajoute une onde $x^{1/2}\cos(\gamma\ln x)$, et avec des milliers de zéros, $\psi(x)$ devient un escalier net. L''hypothèse de Riemann, selon laquelle tout zéro non trivial a pour partie réelle $\frac12$, est l''un des problèmes du prix du millénaire de l''Institut
  Clay et reste ouverte. Elle a été vérifiée pour tous les zéros jusqu''à la hauteur $3\times10^{12}$ (Platt et Trudgian 2021). Résultats démontrés représentés dans la bande : aucun zéro sur $\operatorname{Re} s = 1$ (Hadamard, de la Vallée Poussin 1896, équivalent au théorème des nombres premiers) et la région sans zéro $\sigma > 1 - 1/(5.558691\ln t)$ (Mossinghoff et Trudgian 2015), symétrisée par l''équation fonctionnelle. Revendiqué, non établi : en octobre 2026, OpenAI a publié (selon les informations rapportées ; nous n''avons pas vérifié les manuscrits), dans son dépôt public openai/math de manuscrits générés par IA, un demi-plan sans zéro revendiqué $\operatorname{Re} s > 7/8$ pour $\zeta$ et pour toute fonction $L$ de Dirichlet, accompagné d''un argument complémentaire pour $\operatorname{Re} s > 11/12$. Ces prépublications n''ont pas été relues par des pairs ni vérifiées de manière indépendante ; si elles étaient correctes, une bande sans zéro de largeur fixe constituerait une
  avancée majeure, mais encore loin de la droite $\frac12$. Aucun calcul ne peut démontrer l''hypothèse : une recherche finie ne peut que trouver des zéros sur la droite, ou un contre-exemple.'
meanings:
- '$n$ répété ⇒ sommé : la somme principale pour 250 000 hauteurs d''un coup, masquée à $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$'
- $\Psi$ est entière, mais le quotient vaut $0/0$ en $p = \frac14, \frac34$ ; un ajustement de Tchebychev élimine ce problème
- 'les corrections de Riemann–Siegel : une série de Tchebychev se dérive terme à terme, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- changements de signe de $Z$ sur une grille de pas 0.02, puis 32 étapes de dichotomie sur tous les encadrements d'un coup
- nombre de zéros moins sa partie lisse ; reste petit et de moyenne 0
- tous les points de Gram par Newton d'un coup ; la loi de Gram affirme $(-1)^n Z(g_n) > 0$
- différences entre zéros normalisés $x = \theta(\gamma)/\pi + 1$ et leurs $J = 10$ voisins suivants, pour la corrélation de paires
- 'chaque zéro en chaque $x$, accumulé sur les zéros : une ligne par hauteur $T$'
labels:
