source_hash: 56bd5dd35d76
title: 從照片讀取 QR 碼
summary: 從零建立版本 1–3 的 QR 碼（定位、時序與校正圖案、BCH 格式位元、依懲罰分數選擇的遮罩、GF(256) 上的里德–所羅門碼），以隨機單應性、模糊、雜訊、不均勻光照與一根遮擋的拇指將它「拍照」，再以張量流程讀回：自適應門檻、針對 1:1:3:1:1 定位圖案的匹配濾波器、DLT 單應性與 grid_sample，以及將 $\mathrm{GF}(2^8)$ 運算化為查表的 BCH 與里德–所羅門解碼。
notes: ZXing 等實際讀取器遵循相同的架構：以局部門檻二值化，逐列掃描定位圖案的 1:1:3:1:1 遊程樣式並在行與對角線上確認，挑出構成直角的三個定位圖案，由其間距估計模組大小與版本，在仿射猜測所指的位置附近尋找校正圖案，擬合透視變換，取樣網格，再解碼格式層與里德–所羅門層。此處還透過 grid_sample 最大化已知模組（定位、時序、校正、靜區）與影像的相關性來精修單應性，並選擇樣板最吻合的版本。四個錯誤更正等級 L、M、Q、H 大約可還原 7、15、25 與 30 % 的碼字：有 $T$ 個 ECC 位元組的區塊可更正 $\lfloor T/2 \rfloor$ 個未知位元組錯誤（若已知其位置，即作為抹除，可更正兩倍）。覆蓋符號比例 $f$ 的遮擋物會擊中超過 $f$ 的碼字，因為每個位元組是 $2\times4$ 的模組區塊，所以成功率曲線會低於那些百分比。遮罩只作用於資料模組且 $M \oplus M = 0$，因此去遮罩就是同一個 XOR；編碼器將全部 8 種遮罩作為一個批次嘗試，保留懲罰最低者（連續段、$2\times2$ 區塊、類似定位圖案的樣式、深淺平衡）。驗證：里德–所羅門編碼器重現了 ISO/IEC 18004 範例（'01234567'，版本 1-M）的 ECC 位元組，格式字也與標準表格相符；其餘部分以往返測試與零校驗子檢查。簡化：僅位元組模式、版本 1–3（一個校正圖案、沒有版本資訊區塊）、不支援鏡像符號、不做抹除解碼。版本 1 沒有校正圖案，因此受強烈透視的影響最大。參考文獻：ISO/IEC 18004（QR code symbology）；I. S. Reed and G. Solomon, Polynomial codes over certain finite fields, J. SIAM 8 (1960) 300–304。
meanings:
- 以兩次查表計算 GF(256) 乘積；$\alpha = 2$ 在模 $x^8+x^4+x^3+x^2+1$（0x11D）下生成全部 255 個非零位元組；$\oplus$ 為 XOR
- 對求和索引 $i$ 做 XOR：將 8 個位元平面各自模 2 相加
- 系統式里德–所羅門碼：$G$ 的第 $i$ 列為 $x^{T+k-1-i} \bmod g(x)$，因此 ECC 位元組對資料為線性
- 在 $\alpha^j$ 處求值的區塊多項式；恰好對碼字全為零
- 以 Berlekamp–Massey 求錯誤定位多項式（以 torch.where 批次化），以 Chien 搜尋遍歷所有位置求根，大小 $e = X\,\Omega(X^{-1})/\Lambda'(X^{-1})$（Forney）
- BCH(15,5)，生成式 0x537，XOR 0x5412；取 32 個碼字中最近者，可修正最多 3 個位元錯誤
- 像素低於其 $31\times31$ 方框平均（conv2d）減 $c$ 時為深色：能適應不均勻光照
- 沿列與行、在 11 個尺度 $s$ 上針對 1:1:3:1:1 輪廓的匹配濾波器 $K^s$；峰值即定位圖案中心（也沿對角線檢查）
- 由 3 個定位圖案中心 + 校正圖案（版本 1：平行四邊形的角）以 DLT/SVD 求得，再以梯度上升對所有已知模組的吻合度精修
- 模組 $(i, j)$ 在其內部 $3\times3$ 個點讀取；再去遮罩（XOR，為對合）並依鋸齒順序讀出
labels:
  message: 訊息
  version: 最小版本（訊息放不下時會提高）
  ecc: 錯誤更正等級
  perspective: 透視強度（角點位移 / 邊長）
  occlusion: 符號被遮擋的比例
  noise: 像素雜訊 $\sigma$
