source_hash: 31a92e6ff86f
title: 'सामान्य आपेक्षिकता: ब्लैक होल के चारों ओर कक्षाएँ और पतन'
summary: श्वार्ज़शिल्ड मीट्रिक (Schwarzschild metric) में जियोडेसिक (geodesics), जिनमें क्रिस्टोफ़ेल प्रतीक (Christoffel symbols) $g_{\mu\nu}(x)$ से स्वचालित अवकलन (automatic differentiation) द्वारा प्राप्त होते हैं और einsum से संकुचित किए जाते हैं। एक बद्ध कक्षा बंद होने के बजाय पुरस्सरण (precession) करती है, प्रभावी विभव में अंतरतम स्थायी वृत्तीय कक्षा (ISCO) $6GM/c^2$ पर और फ़ोटॉन गोला $3GM/c^2$ पर दिखता है, और एक त्रिज्य पतन (radial plunge) सीमित उचित समय (proper time) में क्षितिज तक पहुँच जाता है, जबकि दूर की घड़ी थम जाती है।
notes: 'मात्रक: $G = c = M = 1$, अतः लंबाइयाँ $GM/c^2$ में हैं (प्रति सौर द्रव्यमान 1.5 km) और क्षितिज $r_s = 2$ पर है। कक्षा उपसौर (periapsis) से शुरू होती है, जिसमें अर्ध-नाभिलंब (semi-latus rectum) $p$ और उत्केंद्रता $e$ वाली कक्षा की सटीक श्वार्ज़शिल्ड ऊर्जा $E$ और कोणीय संवेग $L$ होते हैं। इसे उचित समय $\tau$ में RK4 से समाकलित किया जाता है; समान $p$ और $e$ वाला धूसर न्यूटनीय दीर्घवृत्त स्वयं पर बंद हो जाता है। बड़े $p$ के लिए उपसौर अग्रगमन (perihelion advance) $6\pi GM/(c^2 p)$ के निकट पहुँचता है (बुध के लिए प्रति शताब्दी 43″) और होल के पास बहुत अधिक हो जाता है। बद्ध कक्षाएँ केवल $p > 6 + 2e$ के लिए होती हैं; ISCO ($r = 6$) से नीचे वृत्तीय कक्षाएँ अस्थायी हैं, और $r = 3$ पर प्रकाश भी चक्कर लगा सकता है। पतन (नीचे दाएँ) में गिरती घड़ी लगभग $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$-ish (सीमित) के बाद क्षितिज तक पहुँचती है, परंतु श्वार्ज़शिल्ड समय $t$ में पतन धीमा होकर $r = 2$ पर थम जाता है; रन $r = 2.1$ पर रुकता है, जहाँ ये निर्देशांक विफल होने लगते हैं।'
meanings:
- प्रत्येक जियोडेसिक पर घटना $(t, r, \theta, \varphi)$, $G = c = M = 1$
- 4-वेग $dx^\mu/d\tau$
- श्वार्ज़शिल्ड मीट्रिक, चिह्नक (signature) $(-, +, +, +)$
- व्युत्क्रम मीट्रिक
- autograd से मीट्रिक के अवकलज, अवकलज सूचकांक अंतिम
- दोहराया गया $\sigma$ ⇒ योग ($z$ = बैच)
- दोहराए गए $\alpha, \beta$ ⇒ योग
- द्रव्यमान वाले कण के लिए $= -1$, समाकलन की जाँच करता है
labels:
  p: अर्ध-नाभिलंब $p$
  e: उत्केंद्रता $e$
  n_orbits: अनुकरण की जाने वाली कक्षाएँ
  dt: उचित-समय चरण $\Delta\tau$
  r_infall: पतन विराम से यहाँ शुरू होता है
