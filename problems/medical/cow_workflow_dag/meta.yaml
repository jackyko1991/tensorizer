title: 'The power of workflow orchestration: a Circle of Willis cohort as a tensor DAG'
category: medical
level: advanced
order: 6
tags: [series:vascular-flow:3, series:workflow-orchestration:1]
summary: >
  A vascular study is a chain of steps (segment the MRA, extract the centreline graph, measure the vessels, place the
  inlets and outlets, solve the flow, report), each already a tensor program, so the workflow that Snakemake
  orchestrates can be a tensor too. On six open (CC0) TopCoW MRA scans of the Circle of Willis, the same Snakefile is
  run by Snakemake (offline) and by a tensor DAG engine: the job graph is a sum of Kronecker products, its levels,
  critical path and rerun set are matrix–vector iterations, and the results match job for job. Then the time saved,
  where it comes from, and what a file DAG cannot give: a gradient through the whole pipeline. Educational only, not
  for clinical use.
animated: true
vector_form: 'A = \sum_{s,r} (A_{\mathrm{rule}})_{sr}\, E_{sr} \otimes \bigotimes_a M_a^{sr},\qquad (I - A)^{-1} = \sum_{k \ge 0} A^k,\qquad t = d \oplus (A \otimes t),\qquad K\,p = b,\quad G_e = \frac{\pi r_e^4}{8\mu L_e}'
index_form: 'M_a^{sr} \in \{I_{n_a},\ \mathbb 1_{n_a},\ \mathbb 1_{n_a}^{\top}\},\qquad \operatorname{tr}(A^k) = 0\ \ (k = 1 \dots J),\qquad \ell_i = \max_j A_{ij}(\ell_j + 1),\qquad t_i = d_i + \max_j A_{ij}\, t_j,\qquad x = s \lor R\,s \qquad K_{nm} = \sum_e G_e B_{en} B_{em} + g_n \delta_{nm},\quad g_k = \frac{Q\, r_k^3}{P \sum_m r_m^3},\quad r_e = \sqrt{\frac{h^3 \sum_{x \to e} \sigma\big((I_x - \theta)/w\big)}{\pi L_e}}'
