source_hash: faa64f98c4b2
title: KdV 솔리톤 충돌
summary: 코르테베흐–더프리스 방정식의 두 고립파. 더 높은 파동이 더 빨라서 따라잡고, 충돌 후 둘 다 모양을 그대로 유지한 채 위치만 이동합니다. 미분은 푸리에 공간에서 취하고($\partial_x \to ik$), 경직된 $u_{xxx}$ 항은 적분 인자로 정확히, 나머지는 RK4로 풉니다.
notes: '규약: $u_t + 6uu_x + u_{xxx} = 0$. 이 방정식에서 속력 $c$인 솔리톤의 높이는 $c/2$, 즉 진폭의 두 배 속력으로 진행합니다. 높을수록 빠르고 좁습니다. 충돌 후 높은 솔리톤은 상호작용이 없었을 때보다 앞에, 낮은 솔리톤은 뒤에 있습니다. $\kappa = \sqrt c/2$일 때 정확한 이동량은 앞으로 $\frac{1}{\kappa_1}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$, 뒤로 $\frac{1}{\kappa_2}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$입니다. 점선: 솔리톤들이 서로를 무시했다면 있었을 위치. 상자는 주기적(길이 100)이므로 오래 돌리면 한 바퀴 돌아옵니다. FFT는 모든 미분을 곱셈으로 바꾸고, 적분 인자는 $u_{xxx}$의 심한 시간 간격 제한을 없애 비선형 항의 완만한 제한만 남깁니다.'
meanings:
- 주기적 격자 위의 파고 (float64)
- 푸리에 계수; $\partial_x \to ik$, $\partial_x^3 \to -ik^3$
- 실공간에서 계산한 비선형 항 $(u^2)$, 모드의 위쪽 3분의 1 제거 (2/3 규칙)
- 한 단계 동안 분산 부분의 정확한 해 (적분 인자)
- '보존량: $\int u\,dx$와 $\int u^2\,dx$'
labels:
  c_tall: 높은 솔리톤의 속력 $c_1$
  c_short: 낮은 솔리톤의 속력 $c_2$
  t_max: 시뮬레이션 시간
