source_hash: 28a44bb1dca2
title: 為人馬座 A*（Sgr A*）稱重：恆星 S2 的軌道
summary: 恆星 S2 每 16 年繞銀河系中心一圈，最近時距離一個看不見的質量僅 120 AU。我們把一條克卜勒軌道（以向量化牛頓迭代求解克卜勒方程）擬合到 25 年的真實位置與徑向速度數據。採用以 autograd 計算 Jacobian 的 Levenberg–Marquardt 演算法，同時從 64 個隨機起點出發，得出一個約 $4.3\times 10^6\,M_\odot$、位於 $R_0 \approx 8.3$ kpc 的黑洞。這個擬合接著預測了 GRAVITY 後來探測到的兩個相對論效應：近心點處約 200 km/s 的紅移，以及每圈 $12'$ 的進動。
notes: 自 1990 年代初起，分別由 Reinhard Genzel（MPE，使用 ESO 望遠鏡）與 Andrea Ghez（UCLA，使用 Keck）領導的兩個團隊，持續追蹤銀河系中心一角秒範圍內的恆星。S2 是短週期軌道恆星中最亮的一顆。它 16 年的橢圓軌道，把被包圍的質量限制在一個小到只能是黑洞的體積內。位置數據給出軌道的角大小與週期，徑向速度（譜線的都卜勒位移）則給出以 km 計的真實大小；兩者結合即得距離 $R_0$，再透過克卜勒第三定律得到質量。模型共有 8 個參數：六個軌道根數加上 $M$ 與 $R_0$（週期由 $P^2 = 4\pi^2(aR_0)^3/GM$ 決定）。擬合使用 Levenberg–Marquardt 演算法，Jacobian 由 autograd 計算，並同時從許多隨機初始軌道出發。其中很多會落入局部極小值，這正是需要一批起點的原因，最後保留 $\chi^2$ 最佳者。克卜勒方程以牛頓迭代在 detached 張量上求解，最後再加一步保留計算圖的迭代，使 autograd 得到精確的隱函數導數。預設參數下的結果：$M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$、$R_0 \approx 8.35 \pm 0.12$ kpc、$P \approx 16.03$ yr、$e \approx 0.884$，334 個數據點的 $\chi^2 \approx 336$。已發表值：由 17 顆恆星得到 $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ 與 $8.32 \pm 0.07 \pm 0.14$ kpc（Gillessen et al. 2017）。這個擬合接著預測了兩個它本身並未納入的相對論效應。在近心點（120 AU、7700 km/s、$c$ 的 2.6 %），重力紅移加上橫向都卜勒位移共貢獻約 200 km/s；GRAVITY 在 2018 年 5 月近心點通過後測得為該廣義相對論值的 $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ 倍（GRAVITY Collaboration 2018）。軌道每圈還會進動 $6\pi GM/(c^2a(1-e^2)) \approx
  12'$，測得值為廣義相對論值的 $f_{SP} = 1.10 \pm 0.19$ 倍（GRAVITY Collaboration 2020）。這些是引用的探測結果，並非由本頁數據計算：2016 年的數據表在 2018 年近心點之前就已結束。簡化之處：純克卜勒軌道，未考慮 Rømer 延遲（光穿越軌道所需時間，約 8 天）、沒有相對論項，也沒有參考座標系的漂移（原論文另外擬合 5 個座標系參數）。數據：Gillessen et al. 2017, ApJ 837, 30（arXiv:1611.09144），S2 數據表 5，取自 VizieR/CDS 星表 J/ApJ/837/30（doi:10.26093/cds/vizier.18370030），依 CDS 使用條款註明出處使用。獎項：2008 年邵逸夫天文學獎（Genzel）、2012 年克拉福德天文學獎（Genzel 與 Ghez）以及 2020 年諾貝爾物理學獎（Genzel 與 Ghez 共享一半獎金，表彰發現銀河系中心的超大質量緻密天體）。
meanings:
- 每個起點一條軌道：$a$、$e$、$i$、$\Omega$、$\omega$、$t_p$、$M$、$R_0$
- 以牛頓迭代求偏近點角，所有軌道與所有時刻一次算出
- 軌道平面 →（北、東、視線方向），以 einsum 建構
- 對 $j$ 求和：S2 以 AU 計的位置；除以 $R_0$ 即得天空上的 mas
- 以 km/s 計的視線速度：正是它確定了 $R_0$
- （模型 − 數據）/$\sigma$，共 145 個赤經、145 個赤緯與 44 個速度
- 前向模式 autograd，對 8 個參數方向做 vmap
- 所有起點同時執行一步 Levenberg–Marquardt
- $6\pi GM/(c^2a(1-e^2))$：史瓦西進動，S2 為 $\approx 12'$
labels:
  n_starts: 隨機初始軌道數
  n_iter: Levenberg–Marquardt 步數
  seed: 隨機種子
