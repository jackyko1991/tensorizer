title: Механизм Чепмена и озоновый слой
summary: 'Четыре реакции между O, O₂ и O₃, управляемые солнечным светом, создают озоновый слой. Записанная как сеть реакций $\dot c = S\,r(c)$ со стехиометрической матрицей $3\times4$, жёсткая система интегрируется неявным методом Эйлера с шагами Ньютона сразу на всех высотах, от восхода солнца до столетий спустя: O и O₃ обмениваются ролями за секунды, нечётный кислород устанавливается от дней до столетий, а стационарное состояние имеет максимум около 30 км.'
notes: 'Сидни Чепмен (1930) объяснил озоновый слой четырьмя реакциями. Ультрафиолет с длиной волны короче 242 нм расщепляет $\mathrm{O_2}$ (1); каждый атом O быстро присоединяется к $\mathrm{O_2}$ при участии третьего тела $\mathrm M$, уносящего энергию (2); озон поглощает ультрафиолетовый и видимый свет и снова распадается (3) — так он защищает поверхность Земли, но это не уничтожает «нечётный кислород» $\mathrm O_x = \mathrm O + \mathrm{O_3}$; это делает только $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$ (4). Реакции (2) и (3) циклически превращают O и $\mathrm{O_3}$ друг в друга за время от миллисекунд до минут, тогда как (1) и (4) устанавливают сумму за дни в верхней стратосфере и за десятилетия и более внизу: жёсткая система с временными масштабами, различающимися в $10^{14}$ раз, так что явной схеме потребовались бы миллиарды шагов, а неявный метод Эйлера (устойчивый при любом $\Delta t$) делает 300 шагов, равномерно распределённых по $\log t$. Каждый столбец $S$ сохраняет число
  атомов кислорода, а неявный метод Эйлера точно сохраняет такие линейные инварианты. Баланс двух пар даёт $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$: при спуске воздух (а с ним и $[\mathrm{O_2}]^{3/2}$) экспоненциально уплотняется, а свет, расщепляющий $\mathrm{O_2}$, расходуется, и произведение достигает максимума там, где наклонная оптическая толща $\mathrm{O_2}$ около 3. Константы скорости $k_2$, $k_4$ — значения из оценки JPL (приближённые); скорости фотолиза используют одну эффективную полосу на молекулу с иллюстративными параметрами вместо интегрирования по солнечному спектру, а солнце светит всё время. Ниже примерно 18 км время жизни нечётного кислорода превышает даже самый длинный прогон, поэтому эти уровни никогда не устанавливаются; в реальной атмосфере туда переносят озон ветры. Одна лишь химия Чепмена даёт слишком много озона (здесь максимум около $8\times10^{12}$ cm$^{-3}$ и около 380 DU выше 15 км против наблюдаемых примерно $5\times10^{12}$
  cm$^{-3}$ на 20–25 км и 300 DU). Недостающие стоки — каталитические циклы $\mathrm X + \mathrm{O_3} \to \mathrm{XO} + \mathrm{O_2}$, $\mathrm{XO} + \mathrm O \to \mathrm X + \mathrm{O_2}$, которые многократно проводят реакцию (4) на каждую частицу катализатора: NOₓ (Крутцен, 1970) и хлор из ХФУ (Молина и Роуленд, 1974) — химия, стоящая за озоновой дырой и Монреальским протоколом (Нобелевская премия 1995 года).'
meanings:
- концентрации (числовые плотности) $\mathrm O$, $\mathrm{O_2}$, $\mathrm{O_3}$ на высоте $a$, в cm$^{-3}$
- чистое число молекул вещества $s$, образуемых реакцией $r$; столбец 1 равен $(2, -1, 0)$ для $\mathrm{O_2} \to 2\,\mathrm O$
- 'повторяющийся $s$ ⇒ суммирование: атомы кислорода, образуемые каждой реакцией, — все нули'
- скорости четырёх реакций по закону действующих масс
- 'повторяющийся $r$ ⇒ суммирование: $dc/dt$'
- якобиан сети, повторяющийся $r$ суммируется
- одно обновление Ньютона в шаге неявного метода Эйлера, решение системы $3\times3$ на каждой высоте
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$ и $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$ (JPL, приближённо)
- скорости фотолиза, ослабленные вышележащими столбами $\mathrm{O_2}$ и $\mathrm{O_3}$ (иллюстративная однополосная модель)
- точное стационарное состояние Чепмена из квадратного уравнения относительно $[\mathrm O]$
