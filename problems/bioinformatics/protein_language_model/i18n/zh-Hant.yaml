source_hash: 2038e43e9d92
title: 小型蛋白質語言模型學會接觸
summary: 一個以 einsum 注意力 $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$ 構成的兩層 transformer，只被訓練去填回序列中被遮蔽的字母，這些序列來自在晶格摺疊上植入耦合的 Potts 模型。沒有人告訴它結構，但它經對稱化與 APC 校正的注意力圖卻指向植入的接觸，這正是蛋白質語言模型中接觸預測頭背後的想法。
notes: 為何注意力能找到接觸？在 Potts 模型中，給定其他所有位點時，位點 $i$ 的字母只取決於與它耦合的位點（其馬可夫毯），所以猜出被遮蔽字母的最佳方法是查看它的接觸夥伴，而注意力正學會這樣做。Rao et al.，"Transformer protein language models are unsupervised structure learners"（ICLR 2021）指出，以數百萬條天然序列訓練的大型蛋白質語言模型，其注意力圖編碼了接觸，可用在少數蛋白質上擬合、作用於 APC 校正且對稱化之注意力圖的邏輯斯迴歸讀出。後來的模型如 ESM-2（2022–2023）進一步從這類表示預測三維結構。這裡的讀出完全無監督（對各注意力頭單純平均），家族是合成的，測試損失與兩個不看上下文的基準比較：unigram（單一字母分布）與逐位點輪廓。勝過輪廓表示模型利用了上下文，亦即耦合。蛇形摺疊把接觸放在反對角線上，就像 β 摺板的股；隨機配對只有約 5 % 的機率正確。APC 移除所有位置都會關注之位置的背景。試試較弱的耦合、較少的序列或單一注意力頭。
meanings:
- 只在晶格摺疊中接觸的殘基之間設置隨機耦合區塊；吉布斯取樣將其轉為一個序列家族
- 字母 $s_{ni}$ 的詞元嵌入加位置嵌入（被遮蔽的字母使用 [MASK] 詞元）
- 重複的 $c$ ⇒ 求和：每個注意力頭的查詢（鍵與值亦同）
- 重複的 $k$ ⇒ 求和；每一列是對被關注位置 $j$ 的機率分布
- 重複的 $j$，再對 $h, k$ ⇒ 求和：每個位置從其他位置收集到的內容
- 在 15 % 被遮蔽位置上真實字母的交叉熵，以 Adam 最小化
- 對測試序列平均的注意力，逐頭對稱化並做 APC 校正，再對層 $l$ 與頭 $h$ 平均
labels:
  coupling: 植入耦合強度 $\sigma_J$
  n_seq: 訓練序列數
  q: 字母表大小 $q$
  layers: Transformer 層數
  heads: 注意力頭數 $H$
  d_model: 模型寬度 $d$
  steps: 訓練步數
  lr: 學習率
  mask_rate: 遮蔽比例
