source_hash: d40b53524521
title: 脱出速度
summary: 多数のロケットを、脱出速度 $v_\mathrm{esc} = \sqrt{2GM/R}$ 前後の速さで惑星から打ち上げる。各ロケットの運命はエネルギーの符号で決まる。束縛されたロケット（$E < 0$）は落下して戻り、束縛されないロケット（$E \ge 0$）は二度と戻らない。
notes: 単位：惑星半径 $R = 1$、$GM = 1$ とするので $v_\mathrm{esc} = \sqrt 2$（地球では 11.2 km/s）。ロケットはエンジンを止めて慣性飛行し、空気はなく、惑星は自転しない。$v_\mathrm{esc}$ のわずかに下では最高点が $1/(1 - v^2/v_\mathrm{esc}^2)$ のように急増し、飛行時間もどんどん長くなる。ちょうど $v_\mathrm{esc}$ のときロケットは永遠に減速し続けるが、決して止まらない。打ち上げ方向を傾けると、脱出速度が方向によらないことがわかる（軌道が惑星に衝突しない限り）。効くのはエネルギーだけである。暗黒星：$v_\mathrm{esc}$ が光速 $c$ に達するまで惑星を圧縮すると $R = 2GM/c^2$ が得られる。Michell（1783年）と Laplace は、そのような星は見えないと論じた。一般相対性理論はブラックホールの事象の地平面としてまったく同じ半径（シュワルツシルト半径、太陽では 3 km）を与えるが、その背後にあるニュートン力学的な推論は本当の説明ではない。
meanings:
- 惑星中心から測ったロケット $b$ の位置
- ロケット $b$ の速度
- 繰り返される $j$ ⇒ 和をとる：距離の2乗 $r_b^2$
- 惑星の重力
- 単位質量あたりのエネルギー：負 ⇒ 束縛
- 表面で $E = 0$ となる速さ
- $2GM/c^2$：$v_\mathrm{esc} = c$ となる半径
- $R/(1 - v^2/v_\mathrm{esc}^2)$、鉛直打ち上げの最高点
labels:
  n_rockets: ロケット数
  f_min: 最小打ち上げ速度 $v/v_\mathrm{esc}$
  f_max: 最大打ち上げ速度 $v/v_\mathrm{esc}$
  tilt: 鉛直からの傾き
  t_max: シミュレーション時間
  dt: 時間刻み
