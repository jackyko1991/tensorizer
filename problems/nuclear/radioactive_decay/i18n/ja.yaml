source_hash: 8bd75af0e44c
title: 放射性崩壊
summary: 各原子核は、1秒あたり同じ確率 $\lambda$ でランダムに崩壊する。原子核の格子全体を1つのブールテンソルとしてシミュレートする——各時間ステップで原子核ごとに1回コインを投げる——と、滑らかな指数法則 $N(t) = N_0 e^{-\lambda t}$ と半減期 $T_{1/2} = \ln 2/\lambda$ が再現される。
notes: 指数法則は平均についての法則である。$N_0$ 個の原子核から始めると、時間 $t$ 後の個数は平均 $N_0 e^{-\lambda t}$、標準偏差 $\sqrt{N_0 e^{-\lambda t}(1 - e^{-\lambda t})}$ の二項分布に従う。そのため小さな格子は曲線のまわりで目に見えて揺らぎ、大きな格子は曲線によく沿う。半減期ごとに、何個あったとしても残りの約半分がなくなる。ステップ $\Delta t$ は $T_{1/2}$ に比べて小さければよい。1ステップあたりの厳密な確率 $1 - e^{-\lambda\Delta t}$ を使うので、どんなステップでも平均は正しくなる。乱数のシードは固定しているので、図は再現可能である。
meanings:
- 崩壊定数 $\ln 2 / T_{1/2}$
- 原子核 $n$ が崩壊していない間 True；格子は $n$ を描くための便宜にすぎない
- 1ステップあたり原子核ごとに1つの一様乱数
- 1ステップ $\Delta t$ の間に崩壊する確率
- 崩壊した原子核は崩壊したまま
- 全原子核にわたる和：個数 $N(t)$
labels:
  n_side: 格子の一辺（一辺² 個の原子核）
  half_life: 半減期 $T_{1/2}$
  t_max: シミュレーション時間
  dt: 時間刻み $\Delta t$
