title: ब्लैक होल के पास स्पेगेटीकरण
summary: 'कणों का एक वलय एक तारकीय-द्रव्यमान ब्लैक होल की ओर गिरता है। वलय के आर-पार गुरुत्व का अंतर ज्वारीय टेंसर $T_{ij} = -\partial_i\partial_j\Phi$ है, जिसे सूत्र से और autograd हेसियन के रूप में निकाला जाता है। यह वलय को त्रिज्य दिशा में खींचता है ($+2GM/r^3$) और अनुप्रस्थ दिशा में दबाता है (दो बार $-GM/r^3$): स्पेगेटीकरण (spaghettification), जो ज्वारीय त्रिज्या के भीतर वास्तविक पिंडों को फाड़ देता है।'
notes: 'मात्रक: $G = c = 1$ और लंबाइयाँ $GM/c^2$ में, अतः क्षितिज $r_s = 2$ पर है (10 सौर-द्रव्यमान ब्लैक होल के लिए 30 km)। वलय के कण एक-दूसरे को आकर्षित नहीं करते: नीले बिंदु सटीक न्यूटनीय गुरुत्व का पालन करते हैं, लाल वक्र रैखिक नियम $\ddot\xi_i = T_{ij}\xi_j$ का, और ये तब तक मेल खाते हैं जब तक वलय $r$ की तुलना में छोटा रहता है। नारंगी वृत्त वह स्थान दिखाता है जहाँ वलय के आकार और द्रव्यमान $m$ वाला, अपने ही गुरुत्व से बँधा पिंड फट जाएगा। तारकीय-द्रव्यमान ब्लैक होल के लिए यह त्रिज्या क्षितिज से बहुत बाहर है, इसलिए गिरता तारा (या अंतरिक्ष यात्री) पार करने से पहले ही चिथड़े हो जाता है; अतिविशाल ब्लैक होल के लिए यह क्षितिज के भीतर हो सकती है। यहाँ गुरुत्व न्यूटनीय है; उल्लेखनीय रूप से, सामान्य आपेक्षिकता में त्रिज्यतः गिरते प्रेक्षक के ज्वारीय टेंसर के आइगेनमान भी ठीक यही $(2, -1, -1)\,GM/r^3$ हैं। रन क्षितिज से पहले रुक जाता है।'
meanings:
- वलय के केंद्र की स्थिति (ब्लैक होल मूलबिंदु पर)
- केंद्र से वलय कण $b$ का पृथक्करण
- बाह्य गुणनफल, किसी सूचकांक पर योग नहीं
- सूत्र से ज्वारीय टेंसर
- वही टेंसर autograd हेसियन के रूप में
- 'दोहराया गया $j$ ⇒ योग: रैखिक ज्वारीय त्वरण'
- निर्वात में $= -\nabla^2\Phi = 0$
- स्व-गुरुत्वीय पिंड की ज्वारीय (रोश) त्रिज्या
