source_hash: 24c72b95c811
title: 電磁簇射
summary: 高能電子撞上鉛塊會引發級聯：電子輻射出光子，光子轉為電子–正子對，每一步能量減半，直到降至臨界能量。Heitler 模型以張量上的分支過程模擬——每個粒子一列，每次分裂產生兩個新列——並預測簇射極大 $N_{max} \approx E_0/E_c$ 出現在深度 $t_{max} \approx \ln(E_0/E_c)/\ln 2$。
notes: 深度以輻射長度 $X_0$ 計（鉛中為 0.56 cm），$E_c$ 是臨界能量，鉛中約為 7.4 MeV。當子粒子能量將低於 $E_c$ 時倍增停止，因此約經過 $\log_2(E_0/E_c)$ 個輻射長度，粒子數達到約 $E_0/E_c$ 的極大值：簇射深度只隨能量對數增長，這就是量能器可以很緊湊的原因。在固定長度模式中，每個粒子恰好在一個 $X_0$ 後分裂，因此整代粒子同步前進，數目呈階梯狀上升。隨機模式（虛線顯示另一模式以供比較）隨機抽取每個交互作用點（光子平均行進 $\tfrac97 X_0$）：各代在深度上被抹開，給出真實簇射較低、較寬、較長的剖面，而能量收支仍然精確。橫向擴展只是示意（角度擾動 $\propto E_c/E$）。Heitler 模型的簡化：能量平均分配、高於 $E_c$ 時無游離損失、低於閾值的粒子一次沉積全部能量，且沒有康普頓散射或光電效應。隨機種子固定。
meanings:
- 每個飛行中粒子的能量（MeV）與種類（1 = e±，0 = γ）；P 隨簇射成長而改變
- 隨機模式：$1 - e^{-\Delta t/\lambda}$，$\lambda = X_0$（e±）或 $\tfrac97 X_0$（γ）
- 布林遮罩：哪些粒子倍增，其餘沉積其能量
- e → e + γ 與 γ → e + e，以兩個串接的半部表示
- 每個深度的飛行中粒子數
- 低於臨界能量的粒子所沉積的能量
labels:
  e0: 初始能量 $E_0$
  e_crit: 臨界能量 $E_c$
  mode: 分裂長度
