source_hash: a7f6ff1f025f
title: 色散水波
summary: 深水上的波包，长波跑得比短波快：$\omega = \sqrt{g k}$。每个傅里叶模式只是转动其相位，因此任意时刻的波包就是一次 FFT、一次乘法和一次逆 FFT，所有时刻一次算出。波峰以包络两倍的速度穿过包络。
notes: 线性深水重力波（水深远大于波长，无表面张力，小坡度）。由于 $\omega \propto \sqrt k$，群速度 $d\omega/dk$ 恰好是相速度 $\omega/k$ 的一半：观察红色波峰超过绿色包络峰，在前端消失，又被后端新生的波峰取代（红点每次后跳整数个波长）。较长的波传播较快，所以波包缓慢扩展，前端的波长比后端长（啁啾）。FFT 使盒子成为周期性的。由于每个模式只转动相位，$\sum|\hat a_k|^2$（由帕塞瓦尔定理即波能）严格守恒。
meanings:
- 复波包：高斯包络乘以 $e^{ik_0x}$
- 初始波包的傅里叶振幅
- 每个模式的深水色散关系
- 通过广播得到每个模式在每个时刻的值（精确，无需时间步进）
- 重复的 $k$ ⇒ 求和：对所有时刻变换回实空间
labels:
  wavelength: 载波波长 $2\pi/k_0$
  width: 波包宽度 $\sigma$
  t_max: 模拟时长
