source_hash: b6ae9044b340
title: 哈伯膨脹
summary: 星系位於固定的共動網格上，網格隨尺度因子 $a(t)$ 拉伸。一個外積 $x_{gi} = a\,q_{gi}$ 就移動了所有星系；從任選的一個星系看，其他星系都以 $v = H d$ 退行。穿越網格的光子也被拉伸同樣的倍數：$1 + z = a_\mathrm{obs}/a_\mathrm{emit}$。
notes: 單位：Mpc、Gyr 與 km/s/Mpc。在物質主導（Einstein–de Sitter）模型中 $a = (t/t_0)^{2/3}$，因此 $H = 2/(3t)$ 隨時間下降；在 de Sitter 模型中 $a = e^{H_0 (t - t_0)}$，$H$ 保持不變。無論哪種，$v = Hd$ 對每位觀測者都嚴格成立：移動觀測者，藍點仍落在與從中心所見的空心圓相同的直線上。星系本身並沒有在空間中移動（沒有本動速度）：是它們之間的空間在增長。光子每一步走過共動距離 $c\,dt/a$；遠方星系的速率超過 $c$ 是允許的，因為在局部沒有任何東西超越光。
meanings:
- 星系 $g$ 的共動座標（永不改變）
- 各時刻的尺度因子，今天 $a = 1$
- 物理位置：外積，沒有指標被求和
- $\dot a/a$：物質為 $2/(3t)$，de Sitter 為常數
- 每個星系的哈伯流速度
- 從觀測者 $o$ 看到的位置（廣播相減）
- 重複的 $g, i$ ⇒ 求和：$v$ 對 $d$ 的最小平方斜率
- 光子自發射以來的波長拉伸
labels:
  model: 膨脹律 $a(t)$
  H0: 今日哈伯常數 $H_0$
  n_grid: 每邊星系數
  spacing: 共動網格間距
  observer_x: 觀測者所在行（網格步）
  observer_y: 觀測者所在列（網格步）
  a_start: 起始尺度因子 $a_\mathrm{emit}$
  a_end: 結束尺度因子 $a_\mathrm{obs}$
