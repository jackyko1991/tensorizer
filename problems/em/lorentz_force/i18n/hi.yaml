source_hash: a8a725d373c7
title: E और B क्षेत्रों में आवेशित कण
summary: 'परस्पर लंबवत विद्युत और चुंबकीय क्षेत्रों में आवेशित कणों के समूह पर लॉरेंज़ बल। सदिश गुणनफल लेवी-सिविटा टेंसर $\varepsilon_{ijk}$ से लिखा जाता है, इसलिए एक einsum हर कण पर चुंबकीय बल दे देता है: हर कण साइक्लोट्रॉन कुंडलिनी (helix) में घूमता है जबकि पूरा झुंड $\mathbf E\times\mathbf B$ के अनुदिश विचलित (drift) होता है।'
notes: मात्रक विमाहीन हैं ($q$, $m$, $E$, $B$ लगभग एक के क्रम के)। $\mathbf E = 0$ होने पर हर कण साइक्लोट्रॉन आवृत्ति $\omega = \lvert q\rvert B/m$ से $mv_\perp/(\lvert q\rvert B)$ त्रिज्या के वृत्त में घूमता है; धनात्मक और ऋणात्मक आवेश विपरीत दिशाओं में मुड़ते हैं। $\mathbf E\perp\mathbf B$ जोड़ने पर हर मार्गदर्शक केंद्र (guiding centre) वेग $\mathbf E\times\mathbf B/B^2$ से विचलित होता है, जो आवेश और द्रव्यमान पर निर्भर नहीं करता।
meanings:
- कण $b$ की स्थिति, घटक $i \in \{x, y, z\}$
- कण $b$ का वेग
- हर कण का आवेश और द्रव्यमान
- 'एकसमान क्षेत्र: $\mathbf E$ $y$ के अनुदिश, $\mathbf B$ $z$ के अनुदिश'
- $(x, y, z)$ के सम क्रमचयों के लिए $+1$, विषम के लिए $-1$, सूचकांक दोहराने पर 0
- 'दोहराए गए $j$ और $k$ ⇒ योग: सदिश गुणनफल $\mathbf v\times\mathbf B$'
- $\mathbf E\times\mathbf B$ विचलन वेग, हर आवेश के लिए समान
labels:
  B: चुंबकीय क्षेत्र $B_z$
  E: विद्युत क्षेत्र $E_y$
  v_par: $\mathbf B$ के अनुदिश प्रारंभिक वेग
  n_particles: कण
  t_max: सिमुलेशन समय
