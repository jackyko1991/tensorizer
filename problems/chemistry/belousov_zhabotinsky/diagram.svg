<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Beaker of the Belousov-Zhabotinsky reaction with alternating red and blue colour bands: bromate oxidises malonic acid while the cerium catalyst flips between Ce3+ and Ce4+; x is the autocatalyst HBrO2 and z the oxidised catalyst">
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <clipPath id="glass"><path d="M62,40 L62,128 Q62,138 72,138 L148,138 Q158,138 158,128 L158,40 z"/></clipPath>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <g clip-path="url(#glass)"><rect x="60" y="62" width="100" height="12" fill="#fca5a5"/><rect x="60" y="74" width="100" height="12" fill="#93c5fd"/><rect x="60" y="86" width="100" height="12" fill="#fca5a5"/><rect x="60" y="98" width="100" height="12" fill="#93c5fd"/><rect x="60" y="110" width="100" height="12" fill="#fca5a5"/><rect x="60" y="122" width="100" height="12" fill="#93c5fd"/><rect x="60" y="134" width="100" height="12" fill="#fca5a5"/></g>
    <line x1="62" y1="62" x2="158" y2="62" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M56,34 L62,40 L62,128 Q62,138 72,138 L148,138 Q158,138 158,128 L158,40 L164,34" fill="none" stroke="#374151" stroke-width="2"/>
    <rect x="98" y="129" width="24" height="5" rx="2.5" fill="#374151"/>
    <line x1="152" y1="68" x2="170" y2="68" stroke="#374151" stroke-width="1.5"/>
    <text x="173" y="72" font-size="13">Ce<tspan font-size="10" dy="-5">4+</tspan></text>
    <line x1="152" y1="80" x2="170" y2="92" stroke="#374151" stroke-width="1.5"/>
    <text x="173" y="98" font-size="13">Ce<tspan font-size="10" dy="-5">3+</tspan></text>
    <text x="10" y="84" font-style="italic">x</text><text x="20" y="84" font-size="11">HBrO<tspan font-size="8" dy="3">2</tspan></text>
    <text x="10" y="108" font-style="italic">z</text><text x="20" y="108" font-size="11">Ce<tspan font-size="8" dy="-4">4+</tspan></text>
    <text x="58" y="24" font-size="13">BrO<tspan font-size="10" dy="3">3</tspan><tspan font-size="10" dy="-9">−</tspan><tspan dy="6"> + malonic acid</tspan></text>
  </g>
</svg>
