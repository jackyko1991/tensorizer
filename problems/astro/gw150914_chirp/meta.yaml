  - {symbol: 'x_{dn}', code: "load_strain()['x']", shape: '(2, N)', meaning: 'strain of detector $d \in \{H1, L1\}$ at sample $n$, 16 s at 2048 Hz'}
  - {symbol: 'S_{dk}', code: 'welch_psd(x, fs, L)', shape: '(2, F)', meaning: 'one-sided PSD: Hann-windowed segments $s$, FFT, $|X|^2$ averaged over $s$'}
  - {symbol: '\tilde x_{dk}/\sqrt{S_{dk} f_s/2}', code: 'whiten(x, psd, fs)', shape: '(2, N)', meaning: 'whitened strain: unit-variance white noise where the PSD is right'}
  - {symbol: 'E_{qt}', code: 'qtransform(white, fs, freqs, q)', shape: '(Q, N)', meaning: 'energy of Gaussian band-pass filters of width $f_q/q$, one batch of inverse FFTs'}
  - {symbol: '\Psi_{mk}', code: 'spa_phase(f, mc, pn_order=2)', shape: '(M, F)', meaning: 'stationary-phase inspiral phase up to 2PN for chirp mass $\mathcal M_m$, $\eta = 1/4$'}
  - {symbol: '\tilde h_{mk}', code: 'template_bank(f, mc, psd)', shape: '(M, F)', meaning: 'the whole bank at once, cut at the merger peak frequency, normalised so $\langle h|h\rangle = 1$'}
