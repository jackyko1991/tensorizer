title: Die Hodge-Vermutung
summary: 'Hodge-Diamanten durch Abzählen berechnen: Für Fermat-Hyperflächen $x_0^d + \dots + x_{n+1}^d = 0$ sind die Hodge-Zahlen Koeffizienten einer Polynompotenz, und für komplexe Tori und Produkte sind sie äußere Produkte und Faltungen. Shiodas Charakterzählung liefert dann die rationalen Hodge-Klassen, also die Klassen, die laut Hodge-Vermutung von Untervarietäten herrühren sollten. Für Flächen ist das der bewiesene $(1,1)$-Satz von Lefschetz, und die Geraden auf der Fläche machen ihn sichtbar. In höherer Dimension ist die Vermutung offen; diese Seite zählt nur die Klassen.'
notes: 'Auf einer kompakten Kähler-Mannigfaltigkeit zerfällt jede Kohomologieklasse in Anteile vom Typ $(p, q)$: $p$ holomorphe und $q$ antiholomorphe Richtungen (Hodge, 1941). Die Zahlen $h^{p,q}$ erfüllen die Hodge-Symmetrie $h^{p,q} = h^{q,p}$ und die Serre-Dualität $h^{p,q} = h^{n-p,n-q}$, und jeder Diamant links besteht beide Prüfungen. Ihre alternierende Summe ist die Euler-Charakteristik, die für eine Hyperfläche vom Grad $d$ gleich $((1-d)^{n+2} - 1)/d + n + 2$ ist. Der Diamant reproduziert sie, ebenso wie $h^{1,1} = 20$ für die K3-Quartik, $h^{2,1} = 101$ für die quintische Dreifaltigkeit und $h^{3,1} = 1$ für die kubische Vierfaltigkeit. Eine Untervarietät $Z$ der Kodimension $p$ definiert eine rationale Klasse vom Typ $(p, p)$. Die Hodge-Vermutung (Hodge 1950; eines der Millennium-Prize-Probleme des Clay-Instituts) besagt, dass jede rationale $(p, p)$-Klasse eine rationale Kombination solcher Klassen ist. Bewiesen ist: $p = 1$ durch den $(1,1)$-Satz von Lefschetz (1924), und damit
  $p = n-1$ durch den harten Lefschetz-Satz. Sie gilt außerdem für abelsche Varietäten der Dimension höchstens 3, für uniregelte Vierfaltigkeiten und kubische Vierfaltigkeiten (Conte–Murre, Zucker) sowie in vielen Spezialfällen, darunter Fermat-Varietäten vieler Grade (Shioda 1979, Ran 1980). Die ganzzahlige Version ist falsch (Atiyah–Hirzebruch, 1962). Für Fermat-Varietäten machen Shiodas Charaktere die rationalen Hodge-Klassen abzählbar, mit einer Bedingung pro Galois-Konjugiertem. Für Flächen ist diese Anzahl die Picard-Zahl: $7, 20, 37, 86$ für $d = 3, 4, 5, 6$, und $3(d-1)(d-2) + 1$, wenn $\gcd(d, 6) = 1$. Die $3d^2$ Geraden auf der Fläche liefern explizite algebraische Klassen, und ihre Schnittmatrix (Rang und Signatur $(1, \rho - 1)$ nach dem Hodge-Indexsatz, hier berechnet) spannt sie alle über $\mathbb Q$ auf, genau wenn $d \le 4$ oder $\gcd(d, 6) = 1$. Für $d = 6, 8, 9, 10$ braucht man weitere Kurven, deren Existenz Lefschetz garantiert. Für Fermat-Vierfaltigkeiten zählt das Programm
  die Hodge-Klassen, aber ob jede davon algebraisch ist, ist genau die Vermutung selbst. Stand (November 2026): offen. Die von OpenAI veröffentlichte Sammlung KI-generierter Manuskripte (github.com/openai/math, Familie 032) beansprucht die rationale Hodge-Vermutung für jede abelsche CM-Varietät und berichtet von einer Lean-Formalisierung dieser Aussage. Es handelt sich um eine nicht begutachtete, maschinell erzeugte Behauptung, die noch auf die Überprüfung durch die mathematische Gemeinschaft wartet, und selbst wenn sie stimmt, deckt sie nur eine spezielle Klasse ab, nicht die allgemeine Vermutung.'
meanings:
- 'Polynome multiplizieren heißt Koeffizientenvektoren falten, $n+2$-mal wiederholt: die Monombasis $x^b$, $0 \le b_i \le d-2$, des Jacobi-Rings des Fermat-Polynoms'
- 'Griffiths: Die primitiven mittleren Hodge-Zahlen sind der Jacobi-Ring in Grad $(q+1)d - (n+2)$'
- 'ein komplexer Torus: $\wedge^p$ der $dz$ mal $\wedge^q$ der $d\bar z$'
- 'Künneth: jedes Klassenpaar, aufsummiert in die Zelle $(a + c, b + d)$'
- 'Shiodas Charaktere: $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$; jeder bezeichnet eine Gerade $V(a)$ der primitiven Kohomologie'
- 'wiederholtes $i$ ⇒ summiert: der Hodge-Typ aller Galois-Konjugierten $t\cdot a$ auf einmal'
- 'eine rationale Hodge-Klasse: Typ $(\frac n2, \frac n2)$ für jedes Konjugierte'
- zwei Geraden schneiden sich genau dann, wenn ihre vier aufspannenden Vektoren in $\mathbb C^4$ linear abhängig sind; $L^2 = 2-d$ nach der Adjunktionsformel
- 'Rang des von den Geraden aufgespannten Gitters und seine Signatur (Hodge-Indexsatz: genau ein positiver Eigenwert)'
labels:
  d_max: Größter Grad $d$
  n_max: Euler-Prüfung bis Dimension $n$
  g_max: Tori bis Dimension $g$
