source_hash: f93e7ab544e0
title: 'Одноклеточное РНК-секвенирование: PCA и кластеризация k-средних'
summary: 'Синтетический одноклеточный эксперимент: клетки нескольких типов, каждый из которых включает собственные маркерные гены, с отрицательно-биномиальными подсчётами и клетками, секвенированными на разную глубину. Мы выполняем стандартный конвейер как тензорные операции: нормировка $\log(1 + 10^4 K_{cg}/n_c)$, отбор высоковариабельных генов, PCA через SVD, затем k-средних с несколькими параллельными перезапусками, и оцениваем кластеры относительно истинных типов скорректированным индексом Рэнда.'
notes: 'Каждая клетка даёт несколько тысяч подсчётов мРНК, распределённых по тысячам генов, поэтому большинство элементов равны нулю, а сырые подсчёты в основном отражают глубину секвенирования клетки. Деление на размер библиотеки $n_c$ убирает глубину; логарифм укрощает огромный диапазон уровней экспрессии. Большинство генов несут лишь шум, поэтому мы оставляем гены, дисперсия которых превышает типичную для генов со схожим средним: высоковариабельные гены, обогащённые заданными маркерами. Затем PCA сжимает их: при $K$ типах сигнал живёт примерно в $K-1$ направлениях, что видно по первым $K-1$ столбцам графика каменистой осыпи, возвышающимся над плоским уровнем шума. k-средних чередует два шага: отнести каждую клетку к ближайшему центру и сдвинуть каждый центр в среднее его клеток; ни один шаг не может увеличить инерцию $\sum_c \lVert y_c - \mu_{k(c)}\rVert^2$, поэтому алгоритм сходится, но лишь к локальному минимуму — поэтому несколько случайных стартов выполняются бок о бок (серые кривые)
  и сохраняется лучший. Поскольку мы знаем истинные типы, скорректированный индекс Рэнда честно оценивает результат. Необязательная карта t-SNE — небольшая силовая укладка, обученная с autograd (сходства по Стьюденту, раннее преувеличение); расстояния между кластерами на таких картах мало что значат. Реальные конвейеры (Scanpy, Seurat) добавляют контроль качества, коррекцию батч-эффектов и графовую кластеризацию (Leiden) на графе ближайших соседей, а реальные типы клеток редко бывают такими чистыми. Попробуйте меньшее кратное изменение, меньше маркеров или неверное $k$.'
meanings:
- 'средняя экспрессия гена $g$ в типе $k$: логнормальный базовый уровень, умноженный на кратное изменение для $M$ маркерных генов типа $k$'
- отрицательно-биномиальные подсчёты (дисперсия $m + \varphi m^2$); $s_c$ — логнормальная глубина секвенирования
- 'размер библиотеки: суммарные подсчёты клетки $c$, суммирование по $g$'
- нормированные по глубине (подсчёты на $10^4$, как CPM) и логарифмированные
- дисперсия $\mathrm{Var}/\mathrm{Mean}$, стандартизованная внутри интервалов со схожим средним (суммы по интервалам через one-hot einsum)
- PCA центрированной матрицы по $H$ высоковариабельным генам; torch.pca_lowrank даёт те же главные компоненты
- оценки PC, суммирование по $g$; $\Sigma_p^2/\sum_q\Sigma_q^2$ — доля объяснённой дисперсии
- квадрат расстояния от клетки $c$ до центра $k$ перезапуска $r$; суммирование по $p$, все $R$ перезапусков сразу
- 'шаг назначения: каждая клетка присоединяется к ближайшему центру'
- 'шаг обновления: каждый центр сдвигается в среднее своих клеток, суммирование по $c$'
- согласие по подсчёту пар из таблицы сопряжённости $n_{ij}$ (one-hot einsum); 1 = идеально, около 0 = случайно
labels:
  n_cells: Клетки $C$
  n_genes: Гены $G$
  n_types: Истинные типы клеток $K$
  n_markers: Маркерных генов на тип
  fold_change: Кратное изменение маркеров
  dispersion: Отрицательно-биномиальная дисперсия $\varphi$
  depth_spread: Разброс размера библиотеки (логнормальное $\sigma$)
  n_hvg: Оставленные высоковариабельные гены
  n_pcs: Главные компоненты для кластеризации
  k: Кластеры $k$
  kmeans_iters: Итерации k-средних
  embedding: '2D-вид: PC1–PC2 или t-SNE'
