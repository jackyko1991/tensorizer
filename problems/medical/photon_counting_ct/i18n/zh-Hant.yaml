source_hash: e03f3730cc96
title: 光子計數 CT 與物質分解
summary: 光子計數偵測器把每個 X 光光子分入能量箱，所以每條射線給出數個 Beer–Lambert 量測 $\lambda_{rb} = N_0 R_{be}S_e e^{-\mu_{em}A_{rm}}$，而非一個。批次最大似然擬合（autograd 梯度、Fisher scoring 步驟）把每條射線的帕松計數轉為水、骨與碘的線積分；濾波反投影產生物質圖與虛擬單能影像，並區分出傳統掃描儀顯示為相同的碘與骨。
notes: 光子計數偵測器（碲化鎘或矽）記錄單一光子，並將每個脈衝高度與數個閾值比較，所以每個能量箱中的計數是一次獨立的 Beer–Lambert 量測。首台光子計數 CT 掃描儀於 2021 年獲美國 FDA 核准，此後能譜成像、更高解析度與更低電子雜訊已從研究走入臨床。三種物質至少需要三個能量箱：水與骨主要透過光電效應區分，碘則加入其位於 33.2 keV 的 K 邊緣，所以約 35 keV 的閾值有幫助（試試 25、50、75 keV 設定）。骨插件經稀釋，使其能量加權衰減與 10 mg/mL 的碘插件相同，因此傳統影像顯示兩者相同；物質圖則能區分。虛擬單能影像 $\mu_m(E)a_m$ 在低能量時增強碘對比，且沒有傳統影像所呈現的射束硬化杯狀假影。三物質分解會放大雜訊（基底衰減曲線幾乎平行），所以碘誤差只以 $1/\sqrt{N_0}$ 下降，在中等劑量下每個像素約為幾 mg/mL；臨床系統常使用兩種基底物質、去雜訊與迭代重建。簡化：平行射束，除高斯能量解析度外為理想偵測器（無電荷共享、堆積或 K 逃逸），無散射，衰減表經過四捨五入。教學用模型，不可用於臨床。
meanings:
- 每個像素的基底含量：水比例、骨比例、碘（mg/mL）
- 各基底圖的 Radon 轉換：沿射線 $r = (\theta, s)$ 的水 cm、骨 cm、碘 mg/cm²
- 各基底物質在 1 keV 網格上的衰減（XCOM，log-log 內插，碘 K 邊緣位於 33.2 keV）
- 經濾過的射線管能譜；能量 $E_e$ 的光子被計入能量箱 $b$ 的機率（高斯能量解析度）
- 每個能量箱的 Beer–Lambert：重複的 $m$ 再 $e$ ⇒ 求和；計數為 $y_{rb} \sim \mathrm{Poisson}(\lambda_{rb})$
- 帕松負對數似然的梯度；射線彼此獨立，所以一次反向傳播即給每條射線各自的梯度
- Fisher 資訊，重複的 $b$ ⇒ 求和；$J_{rbm} = \partial\lambda_{rb}/\partial A_{rm}$
- 每條射線一次 $3\times 3$ 求解，批次進行：Fisher scoring（類牛頓）步驟
- 由重建的基底圖得到能量 $E$ 的虛擬單能影像，以 HU 顯示
labels:
  kvp: 管電壓
  dose: 每條射線光子數 $N_0$
  thresholds: 能量閾值（keV）
  sigma_kev: 能量解析度 $\sigma$
  n_pixels: 影像大小 $N$
  n_angles: 投影角度數
