source_hash: 41a426132182
title: 계층 문제와 여분 차원으로 새어 나가는 중력
summary: '왜 중력은 약력보다 약 $10^{33}$ 배나 약할까($G_F M_{Pl}^2$)? 한 가지 추측적인 답: 중력이 $n$개의 숨겨진 콤팩트 차원으로 퍼진다. $\mathbb R^3\times T^n$ 위에서 퍼텐셜을 두 가지 방식으로 더한다. 질량의 거울상에 대한 합과 칼루차–클라인 탑에 대한 합이며, 둘 다 격자 껍질에 대한 하나의 텐서로 쓴다. 안쪽에서는 $1/r^{1+n}$, 바깥에서는 $1/r$처럼 줄어들고, 유카와 꼬리 $\alpha = 2n$, $\lambda = R$를 가진다. $n = 1..6$에 대한 ADD 반지름을 비틀림 저울과 LHC의 실제 제한과 비교하고, 랜들–선드럼 휨 인자 $e^{-\pi k r_c}$는 $M_{Pl}$을 TeV로 바꾼다. 여분 차원은 아직 관측된 적이 없다.'
notes: '상태: 추측적. 계층 문제는 왜 전약 에너지 규모($v \approx 246$ GeV)가 플랑크 규모($M_{Pl} \approx 1.22\times10^{19}$ GeV)보다 훨씬 낮은지를 묻는다. 여기서 $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$. 아르카니하메드, 디모풀로스, 드발리(ADD, 1998)는 중력만이 밀리미터에서 펨토미터 크기의 $n$개 콤팩트 차원으로 퍼지며, 따라서 중력의 진짜 규모 $M_*$는 TeV 정도일 수 있다고 제안했다. 랜들과 선드럼(1999)은 대신 휘어진 차원 하나를 제안했다. 여분 차원은 발견되지 않았다. 다른 제안으로는 초대칭, 복합성, 릴랙시온, 인류 원리적 선택이 있지만 어느 것도 확립되지 않았다. 계산하는 것: $\mathbb R^3\times T^n$ 위의 점 질량(반지름 $R$의 원, 단위 $R = G_D M = 1$). 거울상 합과 칼루차–클라인 합은 푸아송 합 공식에 의해 같다. 둘 다 껍질 $m = |\mathbf k|^2$별로 개수 $r_n(m)$로 묶는다. 그림은 안쪽에서 거울상 합($r < R$, 먼 거울상은 적분으로 대체)을, 바깥에서 KK 합을 쓴다. $3+n$차원 공간의 가우스 법칙이 $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$를 정한다. 가장 가벼운 KK 준위에는 질량 $1/R$의 모드가 $2n$개 있으므로, 콤팩트 공간 바로 바깥에서 중력은 $\alpha = 2n$, $\lambda = R$인 유카와 보정처럼 보인다(토러스; 다른 모양이면 $\alpha$가 바뀐다). ADD 반지름은 $M_{Pl}^2 = M_*^{n+2}R^n$를 쓴다. 논문마다 $(2\pi)^n$나 $8\pi$ 같은 인자가 다르므로 $R$은 크기 정도로 보아야 한다. 데이터(data/*.csv에 인용 값으로 수록): Eöt-Wash 비틀림 저울은 $\lambda = 56\,\mu$m 이상에서 $|\alpha| = 1$를 배제하고(Kapner
  외, PRL 98, 021101, 2007, arXiv:hep-ph/0611184; 여분 차원 하나는 $R \le 44\,\mu$m), $38.6\,\mu$m 이상에서도 배제한다(Lee 외, PRL 124, 101101, 2020, arXiv:2002.11761). 배제 곡선 자체는 포함하지 않았다. 곡선이 $\lambda$에 따라 내려가므로 $\alpha \ge 1$이고 $\lambda > 38.6\,\mu$m인 점은 모두 배제된다. 보수적인 판정이다. ATLAS의 13 TeV 단일 제트 탐색(139 fb$^{-1}$; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0)은 $n = 2..6$에 대해 11.2, 8.5, 7.1, 6.4, 5.9 TeV 아래의 $M_D$를 배제한다(Giudice–Rattazzi–Wells 규약, 여기서는 $M_*$와 직접 비교). $n = 1$은 태양계 크기의 차원이 필요하며 행성 궤도로 배제된다. 랜들–선드럼: $k r_c \approx 11$–$12$이면 $\bar M_{Pl}e^{-\pi k r_c}$가 TeV가 된다. LHC는 그 칼루차–클라인 중력자를 보지 못했다.'
meanings:
- 칼루차–클라인 모드 벡터(원을 도는 운동량 $\mathbf k/R$); 껍질 개수 확인에 사용
- '$|\mathbf k|^2 = m$을 만족하는 $\mathbf k$의 개수: 세타 급수의 $n$제곱을 FFT 합성곱으로'
- '반복된 껍질 첨자 $m$ ⇒ 합: 질량과 그 거울상; 먼 거울상은 연속 꼬리로'
- 같은 퍼텐셜을 질량 $\sqrt m/R$의 유카와 항의 탑으로(푸아송 합)
- autograd로 구한 장; $S^{2+n}$(가까이) 또는 $S^2\times T^n$(멀리)의 넓이를 곱하면 가우스 선속
- 콤팩트 공간 바로 바깥에서 $\ln(\phi/\phi_N - 1)$에 대한 최소제곱; 기대값 $2n$과 $R$
- 모든 $n$과 기본 규모 $M_*$에 대한 ADD 반지름을 한 번에(브로드캐스트)
- 플랑크 막과 TeV 막 사이의 랜들–선드럼 휨 인자
labels:
  M_star: 출력 표의 기본 규모 $M_*$
  krc: 랜들–선드럼 $k r_c$
  m_max: 더하는 격자 껍질, $|\mathbf k|^2 \le m_{max}$
