source_hash: 3b3a390c2f31
title: 傅里叶级数与吉布斯现象
summary: 用正弦函数构造方波、锯齿波和三角波。系数由一次 einsum 得到（一个数值积分，与 $4/(\pi n)$ 等解析值对照），每个部分和都是一次矩阵乘法 $S_N = B\,c$，使用基矩阵的前 $N$ 列。观察振荡如何向跳跃处聚集，而过冲始终保持在跳跃幅度的约 9%。
notes: 精确系数为：方波对奇数 $n$ 为 $b_n = 4/(\pi n)$，锯齿波为 $2(-1)^{n+1}/(\pi n)$，三角波对奇数 $n$ 为 $\pm 8/(\pi^2 n^2)$；数值积分与它们的吻合度约为 $10^{-6}$。在跳跃附近部分和会过冲。随着 $N$ 增大，凸起向跳跃处移动（其宽度按 $1/N$ 缩小），但其高度趋于跳跃幅度的 $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$ 倍，而不是趋于零：对于从 $-1$ 到 $1$ 的方波，峰值始终在 $1.179$ 附近。这就是吉布斯现象。级数仍然在均方意义下收敛：由 Parseval 定理，$\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$，所以 $L^2$ 误差的平方就是缺失的 $b_n^2$ 之和。系数按 $1/n$ 下降（有跳跃）时误差 $\propto 1/N$；三角波只有一个折点，其系数按 $1/n^2$ 下降，误差按 $1/N^3$ 下降。越光滑的函数收敛越快。试试粗网格（较小的 $X$），看数值系数如何偏离。
meanings:
- $(-\pi, \pi)$ 上 $X$ 个等宽单元的中点及其宽度 $h$：积分权重
- 在 $x_j$ 处采样的波形 $w$（方波、锯齿波、三角波）
- 基矩阵：第 $n$ 列是网格上的 $\sin(n x)$
- 重复的 $j$ ⇒ 求和：积分 $b_n$ 写成网格上的加权和
- 重复的 $n$ ⇒ 求和：含 $N$ 个谐波的部分和，一次矩阵乘法
- $L^2$ 误差的平方，$d = F - S$；重复的 $j$ ⇒ 求和
labels:
  n_max: 最大谐波数 $N$
  n_x: 网格点数 $X$
