title: 2D तरंग-पैकेट प्रकीर्णन
summary: 'दो विमाओं में समय-आश्रित श्रोडिंगर समीकरण, $(N, N)$ ग्रिड पर split-step फ़ूरिये विधि से हल। एक गाउसीय तरंग पैकेट दो झिरियों वाली दीवार (या चकती-आकार की बाधा) से टकराता है; torch.fft.fft2, $x$-समष्टि (जहाँ विभव विकर्ण है) और $k$-समष्टि (जहाँ गतिज ऊर्जा विकर्ण है) के बीच बदलता है। अवरोध के पीछे एक संसूचक पर्दा समय-समाकलित प्रायिकता दर्ज करता है: एक ही कण के तरंग फलन से बना व्यतिकरण पैटर्न।'
notes: मात्रक $\hbar = m = 1$, पैकेट ऊर्जा $E \approx k_0^2/2$। मास्क $M$ के बिना हर गुणक एक शुद्ध कला है, इसलिए हर चरण ठीक ऐकिक है और मानक 1 रहता है; मास्क जानबूझकर किनारों तक पहुँचने वाली प्रायिकता हटाता है (अन्यथा आवर्ती FFT ग्रिड उसे विपरीत ओर से वापस ले आता), इसलिए अंत में छपा मानक घटता है। पृथक्करण $d$ वाली दो झिरियों के लिए दूरी $D$ पर रखे पर्दे पर फ़्रिंजें लगभग $\lambda D/d$ के अंतराल पर होती हैं, जहाँ $\lambda = 2\pi/k_0$ (पर्दा दूर क्षेत्र में नहीं है, अतः यह केवल सन्निकट है)। चकती चुनने पर एक छाया दिखती है जिसके पीछे अक्ष पर एक चमकीला पॉयसन बिंदु होता है। प्रतिबिंब का रंग हर फ़्रेम के लिए सामान्यीकृत वर्गमूल पैमाना प्रयोग करता है ताकि दुर्बल प्रकीर्णित तरंगें दिखती रहें; अवरोध धूसर रंग में है।
meanings:
- आवर्ती 2D ग्रिड पर तरंग फलन (पहला सूचकांक $x$, दूसरा $y$)
- 'अवरोध: $x \approx 0$ पर दो छिद्रों वाली ऊँची दीवार, या एक चकती'
- अर्ध-चरण विभव संकारक, $x$-समष्टि में विकर्ण
- पूर्ण-चरण गतिज संकारक, $k$-समष्टि में विकर्ण
- '$x$ और $y$ दोनों पर योग: हर अक्ष के अनुदिश 1D फ़ूरिये रूपांतरण'
- किनारों के पास चिकना अवमंदन, ताकि तरंगें लिपटने के बजाय निकल जाएँ
- संसूचक रेखा $x = x_\text{screen}$ पर समय-समाकलित प्रायिकता
labels:
  barrier: अवरोध
  k0: पैकेट संवेग $k_0$
  slit_sep: झिरी पृथक्करण $d$ (चकती व्यास)
  slit_width: झिरी चौड़ाई $w$
  n_grid: प्रति अक्ष ग्रिड बिंदु
