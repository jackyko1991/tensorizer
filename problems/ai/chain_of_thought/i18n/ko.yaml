source_hash: 71b446fca9cd
title: 생각의 사슬은 왜 트랜스포머에 도움이 되는가
summary: '$n$ 비트의 패리티는 누적 XOR로, 본질적으로 순차적인 작업입니다. 동일한 작은 트랜스포머들(직접 작성한 einsum 어텐션, 모든 모델을 하나의 모델 축에 쌓아 한 번의 실행으로 학습)이 이를 두 가지 형식으로 학습합니다. 즉시 답하는 "$b_1 \dots b_n = p$" 형식과, 누적 패리티를 먼저 쓰는 "$b_1 \dots b_n : s_1 \dots s_n = p$" 형식입니다. 같은 가중치 구성과 같은 스텝 수에서 스크래치패드 모델은 $n = 4$부터 $10$까지 테스트 문자열의 98–100%에 정답을 내지만, 직접 모델은 $n = 4$에만 적합하고 그보다 길면 우연 수준이거나 그보다 낮습니다. 어텐션에는 두 토큰 규칙 $s_k = s_{k-1} \oplus b_k$가 나타납니다. 이것은 메커니즘의 장난감 모델이지, 대규모 언어 모델이 추론하는 방식의 모델이 아닙니다.'
notes: '현황: 여기서 보이는 효과는 확립된 것입니다. 패리티는 즉시 답해야 하는 고정 깊이 트랜스포머에게 교과서적인 어려운 사례입니다. Li, Liu, Zhou and Ma(ICLR 2024, arXiv 2402.12875)는 중간 단계가 없는 상수 깊이 트랜스포머가 얕은 병렬 회로(그들의 정밀도 가정하에서 $\mathrm{TC}^0$ 수준)로 제한되는 반면, $T$ 단계의 생각의 사슬이 있으면 크기 $T$의 순차 회로를 시뮬레이션할 수 있음을 증명했습니다. Nye et al.(2021, arXiv 2112.00114)은 트랜스포머가 중간 결과의 "스크래치패드"를 쓰도록 학습시켜, 긴 덧셈이나 프로그램 추적 같은 다단계 작업을 푸는 것을 확인했습니다. Wei et al.(2022, arXiv 2201.11903)은 대규모 언어 모델을 위한 생각의 사슬(chain-of-thought) 프롬프팅이라는 이름을 붙였습니다. 방법: $n$ 비트 문자열을 직접 "$b_1 \dots b_n = p$"로 쓰거나, 누적 패리티와 함께 "$b_1 \dots b_n : s_1 \dots s_n = p$"로 씁니다. 모든 모델은 동일한 2층, $d = 64$, 4헤드 디코더(`tiny_transformer` 코드에서 모든 einsum에 모델 축 $m$을 추가한 것)이며, AdamW로 같은 스텝 수만큼 같은 문자열 배치로 학습합니다. CoT 모델은 문자열당 약 두 배의 토큰을 읽고 중간 토큰에 대해서도 학습되는데, 이것이 바로 스크래치패드가 주는 추가적인 도움입니다. 모든 모델($n$ × 형식 × 시드, 그리고 길이 일반화 모델)은 한 번의 실행으로 학습됩니다. 가중치는 맨 앞 축에 쌓이고 그래디언트 클리핑은 모델별로 이루어지므로 서로 영향을 주지 않습니다(테스트로 확인합니다). 데이터: $n \ge 8$에서는 $2^n$개 문자열의 4분의 1(최대 1024개)을 따로 떼어 두고 학습에 전혀 쓰지 않습니다. $n = 4$와 $6$에서는 문자열이 너무 적어 따로 떼어 둘 수 없으므로,
  그 정확도(그림에서 별표 표시)는 일반화가 아니라 적합을 측정합니다. 테스트 시 CoT 모델은 자신의 스크래치패드를 토큰 하나씩 탐욕적으로 쓰며, 최종 답만 채점됩니다. 결론: 기본 실행(시드 2개, 수치는 터미널에 출력)에서, (a) CoT 모델은 $n = 4, 6, 8, 10$에서 테스트 문자열의 0.98에서 1.00에 정답을 냅니다. 직접 모델은 $n = 4$의 문자열 16개에는 적합하지만(1.00), $n = 6, 8, 10$에서는 0.53, 0.27, 0.53에 그칩니다. $n = 8$에서 우연 수준보다 낮은 점수에 대한 그럴듯한 해석(여기서는 검증하지 않음)은 다음과 같습니다. 떼어 둔 문자열은 학습 시의 이웃 문자열과 한 비트만 달라 패리티가 반대이므로, 이웃 사이를 보간하는 모델은 틀리게 됩니다. (b) 길이 일반화는 두 경우 모두 실패합니다. $1 \le n \le 8$에서 학습한 모델은 $n = 12$와 $16$에서 0.46에서 0.51에 그치는데, 19번째 이후의 위치는 학습된 적이 없고, 여기서 쓴 CoT 배치에서는 비트 $b_k$가 그것이 필요한 칸보다 $n + 1$자리 앞에 있어 그 오프셋이 $n$에 따라 바뀌기 때문입니다. 길이를 섞어 학습한 CoT 모델은 스텝 예산 안에서 $n = 4$는 익히지만(1.00) $n = 8$조차 익히지 못합니다(0.56). (c) $k$ 스텝 후에 스크래치패드를 지우면 모든 $k < n$에서 답이 우연 수준으로 떨어집니다. 답은 마지막 칸에서 복사되므로, 계산은 모두 쓰인 토큰 안에 있습니다. (d) $n = 8$의 CoT 모델에서는 모든 스텝 $k$마다 $s_k$를 쓰는 쿼리의 어텐션 중 0.5에서 0.8을 $b_k$에 두는 헤드가 있으며, 균일한 어텐션이라면 0.08입니다(헤드 하나만으로 스텝 평균 0.48이며, 헤드들이 스텝을 나누어 맡습니다). 규칙의 다른 입력인 $s_{k-1}$은 쿼리 토큰 자신이고 잔차 스트림을 통해 출력에 도달하므로, 학습된 규칙은 국소적입니다. 즉 스텝당 두 토큰입니다.
  한계: 이것은 메커니즘을 보여 주는 장난감 모델이며, 대규모 언어 모델이 추론하는 방식을 보여 주는 것이 아닙니다. 대규모 모델이 써 내는 단계가 실제로 답을 만들어 내는 계산에 충실한지에 대해서는 아무것도 말해 주지 않으며, 이는 아직 열린 연구 문제입니다. 결과는 시드와 스텝 예산에 따라 달라지므로 모든 시드를 그림에 표시합니다. 스텝 수를 늘리거나, $n$을 16까지 늘리거나, 층을 하나로 해 보세요.'
meanings:
- '모든 접두사의 누적 패리티: 스크래치패드의 목표이며, $p = s_n$'
- 직접 형식 또는 CoT 형식의 문자열을 토큰 ID $0, 1, :, =, \_$로 나타낸 것. 하나의 $n$에 대한 모든 모델이 하나의 텐서를 공유하도록 빈칸으로 패딩
- 토큰 임베딩과 학습되는 위치 임베딩의 합. 각 모델 $m$은 자체 테이블을 가짐
- 반복되는 $c$ ⇒ 합산. 모델 인덱스 $m$은 합산하지 않으므로 $M$개의 독립된 트랜스포머가 하나의 곱으로 실행됨
- '인과적 어텐션: 각 행은 위치 $j \le i$에 대한 확률 분포'
- '학습하는 다음 토큰: $p$만(직접), 또는 $s_1 \dots s_n$, "="와 $p$(CoT)'
- 모델 $m$의 학습 대상 토큰에 대한 평균 $-\log p$(nats). 그 합을 최소화하며, 각 항은 자기 가중치에만 영향을 줌
- 테스트 시 모델은 순전파 한 번에 토큰 하나씩 자신의 스크래치패드를 쓰고, 그 뒤에 답함
labels:
