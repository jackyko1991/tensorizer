source_hash: 835586f4adf3
title: 한계 반응물과 수득률
summary: 알루미늄과 아이오딘(또는 질소와 수소)을 어떤 비율로든 섞어 보자. 어느 반응물이 먼저 바닥나고, 생성물은 얼마나 생기며, 다른 반응물은 얼마나 남을까? 모든 양은 하나의 반응 진행도 $\xi$에 따라 움직이고, 한계 반응물은 $n_s/|\nu_s|$의 최솟값이며, 실험 배치 전체와 시작 질량의 2D 지도도 같은 텐서 연산으로 처리한다.
notes: '일정한 비율로 반응하는 것은 그램이 아니라 몰이므로, 먼저 각 질량을 몰질량으로 나눈다. 그러면 반응이 얼마나 진행되었는지를 숫자 하나, 진행도 $\xi$로 나타낼 수 있다. $2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$는 알루미늄 $2\xi$ mol과 아이오딘 $3\xi$ mol을 쓰고 아이오딘화 알루미늄 $2\xi$ mol을 만든다. 각 반응물은 최대 $n^0_s/|\nu_s|$ 단위의 반응을 허용하며, 이 값들 중 가장 작은 것이 이긴다. 그 반응물이 한계 반응물이고, 0에 도달하는 막대가 그것이다. Al 1.20 g(44.5 mmol)과 I₂ 2.40 g(9.46 mmol)이면 아이오딘이 한계 반응물이다. $\xi^{\max} = 3.15$ mmol, AlI₃는 최대 2.57 g, 알루미늄 1.03 g이 남는다. 지도에서 생성물은 점선으로 표시된 화학량론 선의 양쪽에서 각각 한 반응물에만 의존한다. 선 위에서는 둘이 함께 바닥나고 낭비가 없다. 실제 수득량은 이론값보다 적으며(손실, 부반응, 완결되지 않는 평형: 하버 반응기를 한 번 통과하면 약 15 %만 전환된다), 수득률이 100 %를 넘으면 생성물이 젖었거나 불순하다는 뜻이다. 질량, 측정한 생성물, 반응을 바꿔 보자.'
meanings:
- '부호가 있는 화학량론 수: 2 Al + 3 I₂ → 2 AlI₃에 대해 $-2, -3, +2$'
- '반복된 $e$ ⇒ 합산: 각 화학종의 원자로부터 얻은 몰질량'
- 각 실험 $b$의 처음 몰수(마지막이 사용자의 실험)
- 반응물이 0이 되기 전의 최대 진행도; argmin이 한계 반응물
- 0부터 $\xi^{\max}$까지 $K$개 진행도에서의 양(막대)
- 생성물의 이론 수득량(g)
- 수득률(%)
- 시작 질량의 격자는 더 큰 배치일 뿐
labels:
  reaction: 반응
  mass_1: 반응물 1의 질량 (Al 또는 N₂)
  mass_2: 반응물 2의 질량 (I₂ 또는 H₂)
  measured: 측정한 생성물 질량
