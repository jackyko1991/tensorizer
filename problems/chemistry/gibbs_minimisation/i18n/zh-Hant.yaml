source_hash: 955b219d37d6
title: 以吉布斯自由能最小化求化學平衡
summary: 甲烷–空氣火焰會產生什麼？在固定 $T$ 與 $P$ 下，產物會停在吉布斯自由能 $G = \sum_j n_j \mu_j$ 最低之處，並受每種元素守恆 $A_{ij} n_j = b_i$ 的約束。批次 Newton 法（RAND 法）同時在一整段溫度範圍內求解 10 個物種，顯示氣體變熱時 CO₂ 與 H₂O 分解為 CO、H₂、OH、H 與 O，並求出絕熱火焰溫度。
notes: 為何要最小化 $G$？在定 $T$ 與定 $P$ 下，熱力學第二定律指出封閉系統只能降低其吉布斯自由能，因此平衡是在保持每個原子的前提下 $G$ 的最低點：一個約束最小化問題。引入 Lagrange 乘數 $\pi_i$（每種元素一個），條件為 $\mu_j/RT = \sum_i \pi_i A_{ij}$：每個物種的化學勢等於其原子「元素勢」之和。這以一次對所有物種的最佳化取代了一串平衡常數（每個反應一個），NASA CEA、STANJAN 與 Cantera 等程式正是以此計算火焰、火箭排氣與大氣。這裡的求解器是 Gordon–McBride 形式（NASA RP-1311）的 RAND 法：對 $\ln n_j$ 施行 Newton 法，消元後化為關於 $\pi_i$ 與 $\Delta\ln n_{tot}$ 的小型 $(E{+}1)\times(E{+}1)$ 系統，並限制步長使主要物種每步最多變化 $e^2$ 倍。以對數運算可讓莫耳分率 $10^{-30}$ 的微量物種保持為正且精確。終端輸出兩項最佳性檢查（元素平衡與 $\mu_j/RT = \pi_i A_{ij}$，皆接近機器精度）以及一項自動微分檢查：用 torch 對 $G/RT$ 微分會得回 $\pi_i A_{ij}$。值得觀察的是：約 1500 K 以下產物只有 CO₂、H₂O 與 N₂（貧燃時還有 O₂）；2000 K 以上它們會解離（CO₂ → CO + ½O₂、H₂O → OH + ½H₂，再分解成原子），因為熵項 $-T\,S$ 勝過鍵焓。解離吸熱，所以平衡火焰比產物保持完整的火焰低約 100 K（右下），而最熱的火焰略偏富燃。提高 $P$ 可看到 Le Chatelier 原理：分子數較少的一方較有利，因此解離受到抑制。數據：$\Delta_f H^\circ$（298 K）與 $S^\circ$（298 K）為 NIST-JANAF 表的四捨五入值。熱容量是示意性常數（大致為 298 到 2000 K 的平均 $c_p$），而非隨 $T$ 變化的表列函數，因此組成只是半定量的：此模型對 1 bar 下化學計量的甲烷–空氣給出 $T_{ad} \approx 2260$ K，而精確熱化學數據給出約 2225 K。簡化：理想氣體、無凝相（無煙粒、無液態水）、產物中無 CH₄
  或其他碳氫化合物，且只考慮平衡：真實火焰中的 CO 與 NO 是由動力學而非熱力學凍結的。
meanings:
- 物種 $j$（CO₂、H₂O、CO、H₂、O₂、N₂、OH、H、O、NO）中元素 $i$（C、H、O、N）的原子數
- 由 CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂) 送入的原子，每個當量比 $\varphi$ 一列
- 批次：每個溫度都是獨立的最小化問題，一起求解
- 由 $\Delta_f H^\circ$、$S^\circ$ 與常數 $c_p$ 得到的 $[H_j(T) - T S_j(T)]/RT$
- 重複的 $j$ ⇒ 求和：每種混合物的吉布斯自由能
- 各元素存在的原子數；在解處等於 $b_i$
- 對 $j$ 求和：Newton 矩陣，每列一個加權的 $A\,\mathrm{diag}(n)\,A^{\mathsf T}$
- 每個溫度一個小型 $(E{+}1)\times(E{+}1)$ 系統，一次呼叫全部求解
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$，對 $i$ 求和；如 NASA CEA 般加阻尼
- 自動微分檢查：在最小值處等於 $\pi_{bi}A_{ij}$（Lagrange 條件）
- 產物焓；對 $T$ 二分直到等於反應物焓：$T_{ad}$
labels:
  phi: 當量比 $\varphi$（燃料／化學計量燃料）
  P_bar: 壓力 $P$
  T_max: 掃描的最高溫度
