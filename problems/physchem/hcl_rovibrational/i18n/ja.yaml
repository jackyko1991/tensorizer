source_hash: dda111a1c11f
title: HCl の振動回転スペクトル
summary: HCl の赤外バンドは櫛状に並んだ線である：分子は振動し（非調和振動子）、回転する（回るにつれて伸びる回転子）。各線は $\Delta J = \pm 1$ を伴う遷移 $v = 0 \to 1$ である。両方の塩素同位体の P 枝と R 枝を一つのバッチ化した $(I, J)$ 格子として求め、温度を上げていくときのボルツマン強度を付ける。そして結合差の最小二乗フィットで線から $B_e$、$\alpha_e$、$\nu_0$ を復元する。
notes: '定数は H³⁵Cl の近似的な文献値である：$\omega_e \approx 2991$、$\omega_ex_e \approx 52.8$、$B_e \approx 10.59$、$\alpha_e \approx 0.31$、$D_e \approx 5\times10^{-4}$ cm⁻¹。バンド原点 $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹ には線がない。HCl のような $\Sigma$ 状態には $\Delta J = 0$（Q）枝がないからである：R(0) と P(1) の間隔は約 $4B$ である。$B_1 < B_0$（振動している結合は平均して長い）なので、R 線は高い $J$ に向かって密集し、P 線は広がっていく。各線は二重線で、H³⁷Cl が約 2 cm⁻¹ 低いところに強度 1/3 で現れる（天然存在比 76 : 24）。どの定数も換算質量のべきに比例するので、このずれは $|\nu - \nu_0|$ とともに大きくなる。気体が温まると、ボルツマン因子 $(2J+1)e^{-hcF(J)/kT}$ の最大は高い $J$ へ移り、二つの枝は広がる（各フレームは最も強い線で規格化している）。結合差は二つの状態を分離するための分光学者の技法である：R(J−1) と P(J+1) は同じ上準位で終わるので、その差は $v = 0$ だけに依存し、R(J) と P(J) は同じ下準位から始まるので、その差は $v = 1$ だけに依存する。$J^2 + J + 1$ に対する $\Delta_2F/(4J+2)$ の直線フィットから $B_v$（切片）と $D$（傾き）が得られ、さらに $\alpha_e = B_0 - B_1$、$B_e = B_0 + \alpha_e/2$ となる。測定ノイズを加えて、定数がどれだけよく残るか見てみよう。等価なモースポテンシャルの井戸の深さは $\omega_e^2/4\omega_ex_e$ である。単純化：Herman–Wallis の強度補正なし、すべての線に一つのローレンツ幅、吸収は $\tilde\nu$ で重み付けしない。'
meanings:
- H³⁵Cl の近似定数、$\rho = \sqrt{\mu_{35}/\mu_{37}}$ で H³⁷Cl にスケーリング
- 準位 $v$ の回転項；どの添字についても和をとらず、外積
- 両方の同位体分子のすべての線を一つの格子に；$J$ は下準位
- 温度を上げていく各温度での準位 $J$ のボルツマン分布
- 存在比 × 分布 × ヘンル–ロンドン因子；P(0) はちょうどゼロ
- $\ell$ の繰り返し ⇒ すべての線について和：広がったスペクトル
- 下（$s=0$）と上（$s=1$）の状態に対する $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$
- $n$ の繰り返し ⇒ 和：各同位体分子と状態に対する最小二乗の $B_v$ と $D$
labels:
  T: 最終温度 $T$
  J_max: 最も高い下準位 $J_{max}$
  fwhm: 線幅（FWHM）
  noise: 測定した線のノイズ
