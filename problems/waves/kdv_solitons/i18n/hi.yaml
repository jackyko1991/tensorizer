source_hash: faa64f98c4b2
title: KdV सॉलिटॉन टक्कर
summary: कॉर्टेवेग–द व्रीस समीकरण की दो एकाकी तरंगें। ऊँची तरंग तेज़ है, पीछे से पकड़ लेती है, और दोनों टक्कर के बाद अपनी आकृति बरकरार रखते हुए बस खिसककर निकलती हैं। अवकलज फ़ूरिए समष्टि में लिए जाते हैं ($\partial_x \to ik$), कठोर (stiff) $u_{xxx}$ पद को समाकलन गुणक से सटीक हल किया जाता है और बाकी को RK4 से।
notes: 'परिपाटी: $u_t + 6uu_x + u_{xxx} = 0$, जिसके चाल $c$ वाले सॉलिटॉन की ऊँचाई $c/2$ है, यानी यह अपने आयाम की दोगुनी चाल से चलता है। ऊँचा अर्थात तेज़ और संकरा। टक्कर के बाद ऊँचा सॉलिटॉन बिना अन्योन्यक्रिया वाली स्थिति से आगे होता है और छोटा पीछे; $\kappa = \sqrt c/2$ के साथ सटीक विस्थापन आगे की ओर $\frac{1}{\kappa_1}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ और पीछे की ओर $\frac{1}{\kappa_2}\ln\frac{\kappa_1+\kappa_2}{\kappa_1-\kappa_2}$ हैं। बिंदुदार: यदि सॉलिटॉन एक-दूसरे की उपेक्षा करते तो कहाँ होते। बॉक्स आवर्ती है (लंबाई 100), इसलिए लंबा रन घूमकर वापस आता है। FFT हर अवकलज को गुणा में बदल देता है, और समाकलन गुणक $u_{xxx}$ की कठोर समय-चरण सीमा हटा देता है, केवल अरैखिक पद की हल्की सीमा रह जाती है।'
meanings:
- आवर्ती ग्रिड पर तरंग की ऊँचाई (float64)
- फ़ूरिए गुणांक; $\partial_x \to ik$, $\partial_x^3 \to -ik^3$
- अरैखिक पद $(u^2)$ वास्तविक समष्टि में गणना किया गया, विधाओं का ऊपरी तिहाई हटाया गया (2/3 नियम)
- एक चरण पर परिक्षेपी भाग का सटीक हल (समाकलन गुणक)
- 'संरक्षित: $\int u\,dx$ और $\int u^2\,dx$'
labels:
  c_tall: ऊँचे सॉलिटॉन की चाल $c_1$
  c_short: छोटे सॉलिटॉन की चाल $c_2$
  t_max: सिमुलेशन समय
