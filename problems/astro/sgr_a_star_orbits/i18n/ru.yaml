source_hash: 28a44bb1dca2
title: 'Взвешивание Sgr A*: орбита звезды S2'
summary: 'Звезда S2 обращается вокруг центра Млечного Пути за 16 лет, проходя в 120 а. е. от невидимой массы. Кеплерова орбита, в которой уравнение Кеплера решается векторизованными итерациями Ньютона, подгоняется к 25 годам реальных измерений положений и лучевых скоростей. Метод Левенберга–Марквардта с якобианами из autograd запускается сразу из 64 случайных начальных точек и находит чёрную дыру массой около $4.3\times 10^6\,M_\odot$ на расстоянии $R_0 \approx 8.3$ кпк. Затем подгонка предсказывает два релятивистских эффекта, позже обнаруженных GRAVITY: около 200 км/с красного смещения в перицентре и прецессию на $12''$ за оборот.'
notes: 'С начала 1990-х годов две группы — под руководством Райнхарда Генцеля (MPE, телескопы ESO) и Андреа Гез (UCLA, Keck) — наблюдают за звёздами в центральной угловой секунде Галактики. S2 — самая яркая звезда с коротким периодом обращения. Её 16-летний эллипс определяет массу, заключённую в объёме, слишком малом для чего-либо, кроме чёрной дыры. Положения дают угловой размер орбиты и период, а лучевые скорости (доплеровские сдвиги спектральных линий) — её истинный размер в км. Вместе они дают расстояние $R_0$ и, через третий закон Кеплера, массу. Модель имеет 8 параметров: шесть элементов орбиты плюс $M$ и $R_0$ (период следует из $P^2 = 4\pi^2(aR_0)^3/GM$). Подгонка использует метод Левенберга–Марквардта с якобианами из autograd, запускаемый сразу из множества случайных начальных орбит. Многие из них попадают в локальные минимумы, поэтому и нужен пакет начальных точек; сохраняется решение с наименьшим $\chi^2$. Уравнение Кеплера решается итерациями Ньютона на отсоединённых (detached)
  тензорах плюс один финальный «живой» шаг, так что autograd видит точную неявную производную. Результат при параметрах по умолчанию: $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ кпк, $P \approx 16.03$ лет, $e \approx 0.884$, при $\chi^2 \approx 336$ на 334 точки данных. Опубликованные значения: $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ и $8.32 \pm 0.07 \pm 0.14$ кпк по 17 звёздам (Gillessen et al. 2017). Затем подгонка предсказывает два релятивистских эффекта, которые в ней не учтены. В перицентре (120 а. е., 7700 км/с, 2,6 % от $c$) гравитационное красное смещение вместе с поперечным эффектом Доплера добавляют около 200 км/с; GRAVITY измерила $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ от этого значения ОТО после прохождения перицентра в мае 2018 года (GRAVITY Collaboration 2018). Орбита также прецессирует на $6\pi GM/(c^2a(1-e^2)) \approx 12''$ за оборот; измерено $f_{SP} = 1.10 \pm 0.19$ от значения ОТО (GRAVITY Collaboration 2020).
  Это цитируемые обнаружения, а не результаты расчёта по этим данным: таблица 2016 года заканчивается до перицентра 2018 года. Упрощения: чисто кеплерова орбита, без задержки Рёмера (время прохождения света через орбиту, около 8 дней), без релятивистских членов и без дрейфа системы отсчёта (в статье подгоняются 5 дополнительных параметров системы отсчёта). Данные: Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), таблица 5 с данными S2 из каталога VizieR/CDS J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030), используется со ссылкой согласно условиям использования CDS. Премии: Премия Шао по астрономии 2008 года (Генцель), Премия Крафорда по астрономии 2012 года (Генцель и Гез) и Нобелевская премия по физике 2020 года (половина — Генцелю и Гез, за открытие сверхмассивного компактного объекта в центре нашей Галактики).'
meanings:
- 'одна орбита на каждую начальную точку: $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- эксцентрическая аномалия итерациями Ньютона, сразу для всех орбит и эпох
- плоскость орбиты → (север, восток, луч зрения), построено с помощью einsum
- 'суммирование по $j$: положение S2 в а. е.; деление на $R_0$ даёт миллисекунды дуги на небе'
- 'лучевая скорость в км/с: именно она фиксирует $R_0$'
- (модель − данные)/$\sigma$ для 145 значений RA, 145 Dec и 44 скоростей
- autograd в прямом режиме, векторизованный через vmap по 8 направлениям в пространстве параметров
- один шаг Левенберга–Марквардта сразу для всех начальных точек
- '$6\pi GM/(c^2a(1-e^2))$: шварцшильдовская прецессия, $\approx 12''$ для S2'
