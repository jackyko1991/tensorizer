source_hash: 24c72b95c811
title: 電磁シャワー
summary: 高エネルギー電子が鉛のブロックに当たるとカスケードが始まる：電子は光子を放射し、光子は電子–陽電子対に変わり、エネルギーは各段階で半分になって臨界エネルギーに下がるまで続く。ハイトラー模型をテンソル上の分岐過程としてシミュレートする——各粒子が1行、各分裂が新しい2行——と、シャワー最大 $N_{max} \approx E_0/E_c$ が深さ $t_{max} \approx \ln(E_0/E_c)/\ln 2$ で予言される。
notes: 深さは放射長 $X_0$（鉛で 0.56 cm）単位で、$E_c$ は臨界エネルギー（鉛で約 7.4 MeV）である。娘粒子が $E_c$ を下回るところで倍増は止まるので、約 $E_0/E_c$ 個の最大粒子数には約 $\log_2(E_0/E_c)$ 放射長の後に達する：シャワーの深さはエネルギーに対して対数的にしか増えず、カロリメーターをコンパクトにできるのはこのためである。固定長モードではすべての粒子がちょうど $X_0$ ごとに分裂するので、世代全体がそろって進み、粒子数は階段状に増える。確率モード（破線は比較のためもう一方のモードを示す）では各相互作用点をランダムに抽選する（光子は平均 $\tfrac97 X_0$ 進む）：世代は深さ方向にぼやけ、実際のシャワーのような低く、広く、長い分布になる。一方、エネルギーの収支は厳密に保たれる。横方向の広がりは説明用にすぎない（$\propto E_c/E$ の角度の蹴り）。ハイトラー模型の簡略化：エネルギーは等分配、$E_c$ より上での電離損失なし、しきい値を下回った粒子は全エネルギーを一度に落とす、コンプトン散乱や光電効果なし。乱数のシードは固定。
meanings:
- 飛行中の各粒子のエネルギー（MeV）と種類（1 = e±、0 = γ）；シャワーが成長するにつれて P が変わる
- 確率モード：$1 - e^{-\Delta t/\lambda}$、$\lambda = X_0$（e±）または $\tfrac97 X_0$（γ）
- ブールマスク：増殖する粒子、残りはエネルギーを落とす
- e → e + γ と γ → e + e、連結した2つの半分として
- 各深さで飛行中の粒子
- 臨界エネルギーを下回った粒子が落としたエネルギー
labels:
  e0: 一次エネルギー $E_0$
  e_crit: 臨界エネルギー $E_c$
  mode: 分裂長
