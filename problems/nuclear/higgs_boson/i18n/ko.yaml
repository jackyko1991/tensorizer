title: 실제 이중광자 데이터에서 힉스 보손 찾기
summary: '실제 13 TeV ATLAS 충돌 10 fb$^{-1}$(ATLAS Open Data, CC0)에서 얻은 약 95 000개의 광자 쌍을 이중광자 질량 $m_{\gamma\gamma}$로 구간화하고 autograd로 맞춤합니다: 매끄럽게 감소하는 배경과 좁은 힉스 봉우리. 프로파일 가능도비로 $m_H$, 신호 세기 $\mu$, 국소 유의도 $Z = \sqrt{q_0}$를 구하고, 배경만 있는 모의(toy) 실험 묶음으로 ‘다른 곳 보기 효과(look-elsewhere effect)’를 보여 주며, 멕시코 모자 퍼텐셜 $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$은 측정된 질량을 힉스 자기 결합 $\lambda = m_H^2/2v^2$로 바꿉니다.'
notes: '2012년 7월 ATLAS와 CMS는 125 GeV 근처의 새로운 보손을 발표했으며, 이는 무엇보다 두 채널, 즉 광자 두 개와 렙톤 네 개에서 관측되었습니다. 2013년 노벨 물리학상은 이 보손이 확인해 준 메커니즘으로 Englert와 Higgs에게 돌아갔습니다. 여기서는 광자 채널을 실제 데이터로 다시 수행합니다. 힉스는 광자로 직접 붕괴할 수 없고(광자는 질량이 없음) W 보손과 꼭대기 쿼크의 고리를 통해서만 붕괴하므로, 이는 보통 광자 쌍이 만드는 거대하고 매끄러운 배경 위의 드문 붕괴($\mathcal B \approx 0.23\%$)입니다. 이 파일의 10 fb$^{-1}$로 얻는 결과는 $m_H \approx 124.2 \pm 1.0$ GeV (PDG 2024: $125.20 \pm 0.11$), $\mu \approx 1.0 \pm 0.4$ (표준 모형의 비율), 그리고 약 $2.7\sigma$의 국소 유의도(기대값 약 $3.4\sigma$)입니다. 이것은 초과일 뿐 발견이 아닙니다. 2012년의 발견은 $5\sigma$를 넘기 위해 여러 사건 범주, 두 채널, 두 실험을 모두 사용했습니다. 스캔은 유용한 경고이기도 합니다. 이 작은 표본에서는 143 GeV 근처의 배경 요동이 124 GeV의 실제 힉스와 거의 같은 크기($2.6\sigma$ 국소)입니다. 이것이 다른 곳 보기 효과입니다. 넓은 창 어딘가에 봉우리가 생기는 것은 흔한 일이므로, 모의 실험은 배경만으로 그런 봉우리가 얼마나 자주 생기는지 추정합니다. 배경만 있는 스캔의 약 13%가 어딘가에서 125 GeV 초과를 능가하며, Gross–Vitells 상향 교차 공식은 0.1 근처의 전역 p-값을 줍니다. 질량을 고정한 배경만의 모의 실험은 $\tfrac12\delta(0) + \tfrac12\chi^2_1$ (Wilks/Chernoff)을 따르며, 이것이 $Z = \sqrt{q_0}$인 이유입니다. 멕시코 모자: 뮤온 수명에서 얻은 $v = (\sqrt2 G_F)^{-1/2}
  = 246.2$ GeV를 쓰면 측정된 질량이 $\lambda = m_H^2/2v^2 \approx 0.13$을 정합니다. 진공 고리 주위의 지름 방향 흔들림이 힉스 보손이고, 고리를 따르는 평평한 방향은 종방향 W와 Z가 됩니다. 데이터: ATLAS Open Data 13 TeV, 2020년 공개본, GamGam 표본(CERN Open Data Portal 레코드 15006, doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS, 라이선스 CC0; 2016년 데이터 기간 A–D). 선별 기준은 ATLAS 교육용 H → γγ 노트북과 같습니다: 광자 트리거, $p_T > 40$ 및 30 GeV인 tight 고립 광자 두 개, 1.37–1.52 바깥의 $|\eta| < 2.37$. sm_signal 열은 대응하는 ATLAS 시뮬레이션(125 GeV의 ggF, VBF, WH, ZH, ttH)을 10 fb$^{-1}$에 맞게 가중한 것으로, $N_{SM} \approx 406$ 사건과 봉우리 폭을 줍니다. 단순화: 단일 포괄 범주, 가우스 봉우리(실제 봉우리에는 꼬리가 있어서 맞춤된 폭 약 2.3 GeV가 중심부 분해능보다 큼), 계통 불확도 없음, 지수-다항식 배경(차수를 바꿔 가며 가짜 신호 민감도를 확인해 보세요).'
meanings:
- 0.5 GeV 구간당 실제 이중광자 개수; m_low, m_high, events 열이 있는 CSV라면 무엇이든 작동
- 스케일된 질량 $x \in [0, 1]$의 거듭제곱; 배경은 $\exp(X\theta)$
- 각 구간에 대해 적분한 가우스 봉우리(erf), 폭 $\sigma$는 ATLAS 시뮬레이션에 맞춤
- 각 히스토그램의 푸아송 가능도, autograd를 통해 Adam + L-BFGS로 최소화
- '반복된 $n$ ⇒ 합산: Fisher 스코어링이 모든 모의 실험 × 모든 질량을 한꺼번에 맞춤'
- 프로파일 가능도비, 맞춤된 신호가 음수이면 0
- $-\ln L$의 곡률에서 얻은 $m_H$와 $\mu$의 오차
- '복소평면의 세 반직선 $\phi = r\,e^{i\alpha}$를 따른 퍼텐셜: 모든 위상에서 같은 곡선, $|\phi| = v/\sqrt2$에 진공들의 고리'
labels:
  m_min: 맞춤 창 시작
  m_max: 맞춤 창 끝
  degree: 지수 안의 배경 다항식 차수
  m_start: 맞춤 시작 질량
  scan_step: 질량 스캔 간격
  n_toys: 배경만 있는 모의 실험
