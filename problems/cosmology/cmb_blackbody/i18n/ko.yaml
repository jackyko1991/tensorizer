source_hash: 79a2f1fd310e
title: 완벽한 흑체로서의 우주 마이크로파 배경 (COBE FIRAS)
summary: COBE의 FIRAS 장비는 우주 마이크로파 배경을 43개 주파수에서 측정했고, 지금까지 관측된 것 중 가장 완벽한 흑체를 발견했습니다. 네 가지 모델(플랑크 법칙만, 보스–아인슈타인 화학 퍼텐셜 $\mu$ 추가, 콤프턴 $y$-왜곡 추가, 둘 다 추가)로 이루어진 배치를 하나의 텐서로 실제 FIRAS 표에 피팅하며, 야코비안은 자동 미분으로 구합니다. 피팅 결과는 자유도 42에 대해 $\chi^2 \approx 45$로 $T \approx 2.725$ K이며, 잔차는 피크의 $10^{-4}$ 미만이고, 왜곡은 0과 일치하며($|\mu| \lesssim 10^{-4}$, $|y| \lesssim 10^{-5}$), $T$로부터 cm³당 약 411개의 광자가 얻어집니다.
notes: '1990년 FIRAS(NASA COBE에 탑재된 원적외선 절대 분광광도계, Far-Infrared Absolute Spectrophotometer)는 하늘을 외부 흑체 교정기와 비교했고 차이를 발견하지 못했습니다. 최종 스펙트럼(Fixsen et al. 1996)은 플랑크 곡선에서 피크의 100만분의 50 미만만큼 벗어납니다. 존 매더와 조지 스무트는 "우주 마이크로파 배경 복사의 흑체 형태와 비등방성을 발견한 공로로" 2006년 노벨 물리학상을 공동 수상했습니다. 이렇게 완벽한 흑체는 초기 우주가 뜨겁고 밀도가 높으며 열평형 상태였음을 의미합니다. 적색편이 $z \sim 2\times10^6$ 이후에 방출된 에너지는 화학 퍼텐셜 $\mu$(보스–아인슈타인 스펙트럼, $z \gtrsim 2\times10^5$)나 콤프턴 $y$-왜곡(뜨거운 전자가 광자의 에너지를 높임, $z \lesssim 5\times10^4$; 쑤냐예프–젤도비치 효과와 같은 모양이며, $x = 3.83$ 즉 217 GHz에서 영점을 가지고 광자 수를 보존함)을 남겼을 것입니다. 대각 오차만 사용한 우리의 피팅은 약 $|\mu| < 7\times10^{-5}$, $|y| < 6\times10^{-6}$의 95 % 한계를 줍니다. 발표된 FIRAS 한계 $|\mu| < 9\times10^{-5}$, $|y| < 1.5\times10^{-5}$가 더 넓은 이유는 상관관계를 포함한 전체 공분산을 사용하고 계통 (교정 및 은하) 불확도를 포함하기 때문입니다. 온도는 주의해서 해석해야 합니다. 피팅은 통계적으로 $T$를 약 $10^{-5}$ K까지 고정하지만, 절대 눈금은 교정기의 온도 측정에서 오며, LAMBDA 표는 스펙트럼을 2.725 K 흑체에 발표된 잔차를 더한 형태로 기록하므로 $T = 2.725$ K가 내장되어 있습니다. 오늘날 가장 정확한 절대값은 $2.72548 \pm 0.00057$ K(Fixsen 2009)입니다. $T$로부터 $n_\gamma \approx 411$ cm$^{-3}$와
  $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$가 따라 나옵니다. 애니메이션의 왼쪽 패널은 초기 추정값에서 피팅이 수렴하는 과정을 보여 줍니다(오차 막대는 유명한 그래프에서처럼 400배 확대했으며, 그렇지 않으면 보이지 않습니다). 이어서 오른쪽 패널은 피크의 $10^{-4}$ 단위로 잔차를 확대하고, 우리의 95 % 한계에 해당하는 $\mu$ 또는 $y$가 $T$를 다시 피팅한 뒤 남길 모양을 함께 보여 줍니다. 데이터: D. J. Fixsen et al., ApJ 473, 576 (1996)의 Table 4, NASA LAMBDA 아카이브(https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt) 제공, 퍼블릭 도메인, data/firas_monopole.csv로 동봉.'
meanings:
- 43개의 FIRAS 파수(cm$^{-1}$), 세기와 $1\sigma$ 오차(MJy/sr)
- 배치의 모델 $b$마다 한 행 $(T, \mu, y)$
- $(B,1)$을 $(F,)$에 브로드캐스팅하여 얻은 $h\nu/kT$
- 보스–아인슈타인 점유수와 콤파네예츠 $y$ 항의 합에 $2hc\tilde\nu^3$를 곱한 것
- '$\sum_b I_{bf}$의 자동 미분: 행들이 독립이므로 한 번의 호출로 모든 모델의 야코비안을 얻음'
- '반복된 $f$ ⇒ 합산: 피셔 행렬; 그 역행렬이 공분산'
- 모든 모델에 대해 한꺼번에 수행하는 레벤버그–마쿼트 한 단계
- 모델별 적합도
labels:
  T_init: $T$의 초기 추정값
  steps: 레벤버그–마쿼트 단계 수
