source_hash: cd1d0cc0a127
title: 由光线方程解释路面蜃景
summary: 炎热路面上方的空气较稀薄，所以折射率 $n(y)$ 在地面附近降低。几何光学的光线方程使光线向 $n$ 较大处弯曲；对一束观察方向用 RK4 积分，可以看到射向路面的光线又向上弯回，于是眼睛看到远处物体的第二个倒立像。
notes: 光线从眼睛反向追迹（光路可逆）：每条光线回答“眼睛朝这个方向看时看到什么？”。略向下的光线在低折射率层中向上弯曲，从下方射到物体上，因此越低的视角看到物体越高的部分——像是倒立的。更陡的光线到达路面（灰色）。竖直方向放大约 100 倍：实际折射率差 $\sim 10^{-5}$，角度为毫弧度量级。计算使用 float64，因为 $n\cos\theta$ 只在小数点后第 7 位变化。
meanings:
- 光线 $r$ 的位置 $(x, y)$
- 光学方向矢量：单位切矢乘以 $n$
- 折射率，在炎热路面 $y = 0$ 处最低
- 只有 $y$ 分量非零：$(0,\ \tfrac{\Delta n}{h}\,e^{-y/h})$
- 写成一阶方程组的光线方程，用 RK4 推进
- 重复的 $j$ ⇒ 求和：$\lvert\mathbf p\rvert$ 必须保持等于 $n$（精度检验）
- 水平分层介质中的斯涅耳定律：沿每条光线守恒
labels:
  delta_n: 路面处折射率降低量 $\Delta n$
  scale_height: 热空气层厚度 $h$
  eye_height: 眼睛高度
  distance: 到物体的距离
  max_dip: 最大俯视角
  n_rays: 光线数
