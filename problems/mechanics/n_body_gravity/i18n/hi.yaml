title: 3D में N-पिंड गुरुत्व
summary: $N$ पिंडों के बीच न्यूटनी गुरुत्व। हर युग्म का पृथक्करण $r_{abi}$ broadcasting से एक साथ बनता है, एक einsum हर पिंड $a$ पर सभी पिंडों $b$ के खिंचाव को जोड़ता है, और velocity Verlet पूरे निकाय को आगे बढ़ाता है।
notes: Softening लंबाई $\varepsilon$ दो पिंडों के बहुत पास से गुज़रने पर बल को परिमित रखती है; $\varepsilon = 0$ पर यह सटीक न्यूटनी गुरुत्व है। मात्रक ऐसे चुने गए हैं कि $G = 1$। Velocity Verlet सिम्प्लेक्टिक है, इसलिए ऊर्जा त्रुटि बहकने के बजाय छोटी और सीमित रहती है। आकृति-8 प्रसिद्ध आवर्ती त्रि-पिंड कक्षा है जिसे मूर (1993) और शेंसिनर व मॉन्टगोमरी (2000) ने खोजा।
meanings:
- पिंड $a$ की स्थिति, घटक $i \in \{x, y, z\}$
- पिंड $b$ का द्रव्यमान
- $a$ से $b$ तक पृथक्करण, broadcasting से सभी युग्म
- 'दोहराया गया $j$ ⇒ योग: हर युग्म की दूरी का वर्ग'
- 'दोहराया गया $b$ ⇒ योग: पिंड $a$ पर कुल खिंचाव'
- गतिज + युग्मवार स्थितिज, संरक्षित
labels:
  scenario: प्रारंभिक अवस्था
  t_max: सिमुलेशन समय
  dt: समय चरण
  softening: Softening $\varepsilon$
