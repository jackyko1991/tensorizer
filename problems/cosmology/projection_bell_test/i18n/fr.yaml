source_hash: 3a74544d7716
title: Tests de Bell de la course de projection
summary: 'Une hypothèse spéculative, pas de la physique établie : deux particules intriquées forment un seul état partagé $\Psi$ en $D$ dimensions, et chaque mesure est une projection suivie de la course de l''étape 1. Exécutée conjointement sur $\Psi$, comme un seul événement dans l''espace complet, la course donne exactement le résultat quantique $E = -\cos\theta$ et la valeur CHSH $S = 2\sqrt2$. Exécutée séparément sur les coordonnées cachées locales de chaque partie, c''est un modèle à variables cachées locales avec $S\leq2$, que les tests de Bell sans échappatoire excluent. Une course avec plus d''une dimension cachée par résultat viole la borne de Tsirelson et permet une signalisation plus rapide que la lumière.'
notes: 'Étape 5 de l''hypothèse de projection (voir la description de la série), l''hypothèse spéculative de l''auteur, pas de la physique établie. Elle teste les postulats P1 (projection) et P2 (événement) de l''étape 1 (cosmology/projection_postulate) sur l''intrication. L''étape 4 (cosmology/projection_singularity_fold) traite de la géométrie, et l''étape 6 (cosmology/projection_telescope_tests) des observations. La dimension $D$ de l''état partagé reste ouverte : c''est un paramètre, et aucun résultat n''en dépend. D''abord la physique connue. Le singulet donne $E(a,b) = -a\cdot b = -\cos\theta$. Bell (1964) ainsi que Clauser, Horne, Shimony et Holt (1969) ont démontré $S\leq2$ pour tout modèle à variables cachées locales, tandis que la mécanique quantique atteint la borne de Tsirelson $S = 2\sqrt2$. L''hypothèse : il existe un seul $\Psi$ partagé (P0, P3) ; la mesure de chaque partie est une projection plus la course de l''étape 1, où se produit le résultat ayant le plus grand $\|P_k\Psi\|^2/E_k$,
  et $E_k$ est l''énergie contenue dans $m$ coordonnées complexes cachées de $\Psi$. (i) Modèle conjoint : la course a lieu une seule fois sur les quatre résultats conjoints, avec les poids $\|(P^a_i\otimes P^b_j)\Psi\|^2$. Non locale en 3D, c''est un événement unique en $D$ dimensions. Avec $m = 1$ (la seule valeur que l''étape 1 a laissée en vie), elle reproduit exactement la mécanique quantique : $E = -\cos\theta$ sous forme close à $10^{-15}$ près, et un Monte Carlo à partir de $\Psi$ dans $\mathbb C^D$ dans les limites statistiques. $S = 2\sqrt2$ aux réglages optimaux, le maximum sur 2000 réglages aléatoires reste en dessous, et les marginales d''Alice ne dépendent pas du réglage de Bob (pas de signalisation). (ii) Modèle local : chaque partie fait la course uniquement sur ses propres énergies cachées et sur une direction cachée $n$ fixée à la source, c''est-à-dire sur les poids $(1\pm a\cdot n)/2$. C''est un modèle à variables cachées locales, donc $S\leq2$ est garanti. $m = 1$ donne
  $E = -\cos\theta/3$ (max $S\approx0.93$), et $m\to\infty$ est le propre modèle déterministe de Bell $E = -(1-2\theta/\pi)$, qui atteint exactement $S = 2$. Au-delà de Born : une course conjointe avec $m\neq1$ n''est pas la mécanique quantique. Pour $m > 1$, elle viole la borne de Tsirelson ($S = 3.85$ à $m = 3$, tendant vers la valeur 4 de la boîte PR). Pour un état partiellement intriqué, elle rend les statistiques d''Alice dépendantes du réglage de Bob, ce qui est une signalisation plus rapide que la lumière ($dS/dm = 1.34$, signalisation $\approx0.18\,|m-1|$). Ainsi, $m = 1$ est exigé par la causalité relativiste aussi bien que par les données des trois fentes. Données (data/bell_tests.csv, valeurs citées d''après les résumés). Hensen et al. (Nature 526, 682, 2015) : spins NV distants de 1.3 km, $S = 2.42\pm0.20$, $p = 0.039$. Leur seconde série (Sci. Rep. 6, 30289, 2016) : $S = 2.35\pm0.18$. Giustina et al. et Shalm et al. (Phys. Rev. Lett. 115, 250401 et 250402, 2015) : photons, inégalité
  de CH–Eberhard, $p\leq3.74\times10^{-31}$ et $2.3\times10^{-7}$. Rosenfeld et al. (Phys. Rev. Lett. 119, 010402, 2017) : atomes distants de 398 m, $S = 2.221\pm0.033$. Storz et al. (Nature 617, 265, 2023) : qubits supraconducteurs distants de 30 m, $S = 2.0747\pm0.0033$, 22.6$\sigma$ au-dessus de 2. Verdict : le modèle (ii), et avec lui toute version locale de la course, est exclu. Le modèle (i) s''accorde avec tous les tests, mais seulement parce qu''il est la mécanique quantique réécrite ; il ne fait aucune prédiction nouvelle. L''écart encore permis par l''étape 1 ($|m-1|\leq6\times10^{-3}$) décalerait $S$ d''au plus $8\times10^{-3}$. C''est plus que le $\sigma_S$ de Storz, mais les valeurs mesurées de $S$ se situent bien en dessous de $2\sqrt2$ (visibilité 0.73), et une visibilité inconnue absorbe un tel décalage. Seule la forme de $E(\theta)$ (résidu $\leq1.5\times10^{-3}$) ou un test direct d''absence de signalisation ($\leq10^{-3}$) pourrait le voir. Wikipédia : théorème de Bell,
  inégalité CHSH.'
meanings:
- projecteurs de spin selon des vecteurs unitaires $n$, construits avec un einsum sur les matrices de Pauli
- 'poids de chaque résultat conjoint : les indices de qubit $x, y, u, v$ sont sommés'
- corrélation, signes des résultats $s = (+1, -1)$ sommés
- la course conjointe sur les quatre résultats ; la somme sur $l$ (moins $l = k$) est le produit sur les autres résultats ; $m = 1$ donne $P = w$
- énergies des blocs cachés lues à partir d'échantillons de $\Psi$ uniformes sur la sphère de $\mathbb C^D$
- 'direction cachée fixée à la source, trois coordonnées réelles de $\Psi$ : uniforme sur $S^2$ pour tout $D$'
- 'courses locales : chaque partie fait la course sur ses propres poids $(1\pm a\cdot n)/2$ ; le $\nu$ partagé est moyenné'
- valeur CHSH, maximisée sur le choix du terme, parmi les quatre, qui porte le signe moins
labels:
  D: Dimension totale $D$ de l'état partagé $\Psi$ (ouverte)
  m_max: Plus grand nombre de dimensions cachées par résultat $m$
  settings: Réglages de mesure aléatoires
  trials: Événements de course par angle (Monte Carlo)
