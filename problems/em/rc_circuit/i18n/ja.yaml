source_hash: 6cf1e64854dc
title: コンデンサーの充電（RC回路）
summary: 抵抗を通して充電されるコンデンサーは $dV/dt = (V_s - V)/(RC)$ に従う。抵抗の異なる複数の回路を1つの電圧テンソルにまとめるので、1回のルンゲ–クッタ法のステップですべてが進む。電源を矩形波に切り替えると、コンデンサーの充電と放電の様子が見られる。
notes: 単位：$R$ は kΩ、$C$ は mF なので、$\tau = RC$ は秒、$I$ は mA で得られる。時定数1つ分の時間が経つとコンデンサーは電源電圧の 63 % に達し、$5\tau$ 後には実質的に満充電となる。電池から充電する間に電源は $CV_s^2$ のエネルギーを供給する。ちょうど半分がコンデンサーに蓄えられ、残りの半分は $R$ でジュール熱になる——$R$ の値によらない。
meanings:
- コンデンサー $b$ の両端の電圧（回路ごとに1要素）
- 回路 $b$ の抵抗
- 電気容量、すべての回路で共通
- 電源電圧、全回路で共有（$b$ についてブロードキャスト）
- 要素ごと：添字 $b$ は両辺に1回ずつ現れ、和はとらない
- 各抵抗を流れる電流
- 各コンデンサーに蓄えられたエネルギー
labels:
  V_s: 電源電圧
  C: 電気容量
  R_min: 最小抵抗
  R_max: 最大抵抗
  n_circuits: 回路数
  source: 電源
  period: 矩形波の周期
  t_max: シミュレーション時間
