source_hash: 2c6e3e6a24cf
title: Ein Workflow-DAG ist ein Mixture of Experts mit festem Router
summary: 'Eine MNIST-Ziffer $d$ und ein Text aus drei Wörtern wie "now plus three" ergeben die Antwort $y = (d \circ k) \bmod 10$; keine der beiden Modalitäten reicht allein aus. Als Workflow im Stil von Snakemake geschrieben (encode_image, encode_text, eine fuse-Regel pro Operation, ausgewählt durch eine Eingabefunktion, classify) und von der Tensor-DAG-Engine des Circulus-Willisii-Problems ausgeführt, berechnet die Pipeline genau das, was eine Top-1-Mixture-of-Experts-Schicht berechnet, wenn ihre Router-Matrix $G$ auf die Regelauswahl festgelegt ist. Danach folgen die vier Stufen, die ein einziges Tensorprogramm ermöglicht: ein gelernter Router, getrennt trainierte und dann verkettete Experten, ein einziger Rückwärtsdurchlauf durch den gesamten DAG und die Destillation in ein kleines dichtes Netz, gespeichert in int8. Eine Sichtweise, die bekannte Ergebnisse verbindet, kein neues Theorem.'
notes: 'Idee. Die Sichtweise stammt von Jacky Ka Long Ko: Der Aufbau des Circulus-Willisii-Workflows (medical/cow_workflow_dag) zeigte, dass ein Snakemake-DAG ein einziges Tensorprogramm sein kann, und ein solches Programm sieht aus wie ein multimodaler Mixture of Experts. Genau formuliert: Ein Workflow-DAG ist ein MoE mit festem Router; ein MoE ist ein DAG, dessen Kanten pro Eingabe gewählt werden. Dies ist eine Sichtweise, die bekannte Ergebnisse verbindet, kein neues Theorem, und dieses Problem baut eine kleine Instanz davon. Äquivalenz. data/Snakefile enthält die Regeln encode_image, encode_text, fuse (ein Job pro Probe und pro Operation, die Wildcard $op$), classify und collect; classify liest seine Eingabe über eine Eingabefunktion, `routed`, die die fuse-Ausgabe der im Text der Probe genannten Operation benennt. Die Engine parst die Datei mit dem Parser von cow_workflow_dag und baut die Job-Adjazenz aus deren Kronecker-Blöcken auf; der Block der bedingten Kante ist $(I_N \otimes \mathbb
  1_E^\top) \odot \mathbb 1_N \operatorname{vec}(G)^\top$, sodass die Router-Matrix $G$ in der Adjazenz steckt, und nur die $N$ ausgewählten der $N E$ fuse-Jobs werden benötigt (ein boolescher Rückwärtsdurchlauf, so wie Snakemake Jobs beschneidet). Ebene für Ebene ausgeführt, ein gebündelter Aufruf pro Regel, liefert sie dieselben Logits wie eine Schicht im Stil von Switch (Dispatch-Tensor $D$ über kumulative Ränge, alle Experten in einem gebündelten einsum, Kombination) mit $G$ auf die Regelauswahl festgelegt und Gate-Werten 1: bitweise identisch in float32 und innerhalb von $4 \times 10^{-15}$ in float64 auf allen 1000 Testproben × 2 Seeds (die gestapelten und die gruppenweisen Produkte summieren in anderer Reihenfolge), überall dieselbe Vorhersage. Das ist eine Identität zweier Schreibweisen einer Berechnung, kein empirischer Befund. Gelernter Router. Ein Softmax-Gate auf den Textmerkmalen mit Top-1-Routing und dem Switch-Load-Balancing-Verlust ($\alpha = 0.01$), Encoder eingefroren,
  zwei Varianten nebeneinander. Vor den eigenen fuse-Experten des Workflows entdeckt das Gate allein die Regel wieder: Nach den standardmäßigen 800 Schritten geht Operation $e$ für 0.85 ± 0.03 der Testproben an Experte $e$ (Genauigkeit 0.82 gegenüber 0.92 mit festem Router), noch steigend (0.95 und 0.90 nach 1500 Schritten in einem Testlauf). Zusammen mit frischen Experten gelernt, gelingt es nicht: Das Routing passt nicht besser zu den Operationen als der Zufall (0.35 mit der besten Permutation der Experten; 1/3 bedeutet keinen Zusammenhang), die Experten bleiben gemischt und die Genauigkeit bleibt bei 0.40. Die fuse-Experten sehen den Text nicht, also lässt ein Routing, das die Operation ignoriert, jedem Experten eine unlösbare Aufgabe; zu Beginn ist aber kein Experte bei irgendeiner Operation besser, sodass ein Top-1-Gate kein Signal erhält, um die Symmetrie zu brechen. Gate-Rauschen, eine 100× größere Gate-Initialisierung, ein dichtes (weiches) Aufwärmen über 500 Schritte und $\alpha
  = 0.1$ änderten daran in Testläufen nichts (nicht Teil des Standardlaufs). Größere MoEs trainieren ihre Router erfolgreich von Grund auf; dieses Spielzeugbeispiel sagt nur, dass sich die feste Regel hier nicht umsonst wiederentdecken lässt. Stufen. (2) Getrenntes Training: jeder Experte auf seiner eigenen Teilaufgabe, der Bildexperte (ein MLP) auf den Ziffernlabels (Testgenauigkeit 0.916), der Textexperte (eine einsum-Attention-Schicht) auf dem Zahlwort (1.000), die fuse-Experten auf der Tabelle mit 300 Einträgen aus One-hot-Eingaben (1.000); durch den DAG verkettet, ohne gemeinsames Training, beantwortet die Pipeline 0.924 der Testpaare richtig (mehr als die Ziffergenauigkeit, weil mal 0 oder mal 5 manche falschen Ziffern verzeihen). (3) End-to-End-Feinabstimmung, ein Rückwärtsdurchlauf durch alle Stufen: 0.924, kein Gewinn; der Engpass ist der Bildexperte, und der gemeinsame Verlust bringt keine neue Information über Ziffern (dieselben 3000 Bilder). (4) Ein dichter Student (784 + 45
  → 64 → 64 → 10, 57 930 Gewichte, 0.53 der 108 766 der Pipeline), destilliert bei $T = 4$ (Verlust $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 Kreuzentropie): 0.85–0.86, stimmt bei 0.85–0.87 der Proben mit seinem Lehrer überein und verbessert sich am Ende seiner 3000 Schritte noch; int8 pro Kanal: 0.85–0.86, 58.9 kB statt 232 kB (435 kB für die Pipeline). Zeiten für die 1000 Testpaare auf einem CPU-Thread: DAG-Engine 90 ms, derselbe DAG als eine MoE-Schicht 19 ms (die Engine baut zusätzlich ihre Job-Blöcke auf), Student 3.4 ms, int8-Student 3.5 ms (mit dequantisierten Gleitkommazahlen gerechnet, also kleiner, aber hier nicht wirklich schneller), und ein Aufruf pro Job, wie ein Scheduler ihn ohne Prozessstart ausführen würde, 900–1000 ms. Was nicht folgt. Nur Stufen, die Tensorprogramme in einem gemeinsamen Speicherraum sind, verschmelzen ohne Kopie und reichen einen Gradienten weiter: dateibasierte Werkzeuge (OpenFOAM, VMTK, der Großteil der Bioimage-Analyse) tun das nicht, und ein Snakemake-DAG
  aus ihnen bleibt ein DAG von Prozessen. Die Beschleunigung beim Circulus Willisii kam vor allem vom vermiedenen Prozessstart und Datei-I/O pro Job, nicht vom Bündeln. Und End-to-End-Training hilft nur, wenn eine Stufe etwas lernen kann, das ihr das getrennte Training nicht gegeben hat; hier war das nicht der Fall. Verwandte Arbeiten. Neural Module Networks (Andreas et al. 2016) setzen pro Frage ein Netz aus von einem Parser gewählten Modulen zusammen, ein pro Eingabe gewählter DAG; dünn gegateter MoE (Shazeer et al. 2017) und der Switch Transformer (Fedus et al. 2021, das hier verwendete Top-1-Routing und der Load-Balancing-Verlust); Modalitätsexperten in LIMoE (Mustafa et al. 2022) und Uni-MoE (Li et al. 2024); Model Stitching (Lenc & Vedaldi 2015; Bansal et al. 2021) verbindet getrennt trainierte Netze über eine gelernte Schnittstelle, so wie Stufe 2 über Wahrscheinlichkeitsvektoren; Wissensdestillation (Hinton et al. 2015); DSPy (Khattab et al. 2023) optimiert ganze Pipelines von Sprachmodellaufrufen
  end-to-end. Googles Pathways (ein Blogbeitrag und eine Vision von 2021) beschreibt ein einziges Modell, das jede Aufgabe durch die Teile leitet, die sie benötigt. Daten. MNIST (LeCun, Cortes & Burges; LeCun et al. 1998), Lizenz CC BY-SA 3.0: 3000 Trainingsbilder (300 pro Ziffer) und 1000 Testbilder (100 pro Ziffer), jeweils die ersten jeder Ziffer in Dateireihenfolge, als uint8 mitgeliefert (0.7 MB, data/mnist_train.npz, data/mnist_test.npz, unter derselben Lizenz weiterverbreitet; data/SOURCES.md enthält Quelle, Prüfsummen und Verarbeitung). Die Texte sind generiert: ein Operationswort (plus, minus, times), ein Zahlwort (zero bis nine) und ein Füllwort (now, then) in zufälliger Reihenfolge; die Testtexte verwenden einen festen Seed. Gerät und Grenzen. Die mitgelieferten Zahlen stammen aus dem Standardlauf auf einer CPU (die Projektumgebung hat hier keinen CUDA-Build von PyTorch; bei etwa $10^5$ Gewichten würde eine GPU nicht helfen): etwa 75–150 s Training und Messung plus das GIF auf
  einer ausgelasteten 6-Kern-Maschine. Alle Seeds trainieren gemeinsam auf der Modellachse, jeder mit eigenen Minibatches, und jeder Seed wird geplottet. Ein Spielzeugbeispiel mit einer Ziffer und drei Operationen: Es zeigt die Struktur, nicht wie sich große multimodale MoEs verhalten.'
meanings:
- Regelgraph, mit dem Parser von medical/cow_workflow_dag aus data/Snakefile geparst, plus die Eingabefunktion `routed` (eine bedingte Kante classify ← fuse)
- 'Block auf Job-Ebene: das Kronecker-Produkt von cow_workflow_dag ($I$, $\mathbb 1$, $\mathbb 1^\top$ pro Wildcard-Achse sample, op); für die bedingte Kante wird er durch den Router maskiert, sodass Job $n$ von classify genau dann Job $(n, e)$ von fuse liest, wenn $G_{ne} = 1$'
- 'der Router des Workflows: One-hot-Kodierung des Operationsworts, von einer Regel (der Eingabefunktion) gefunden, nicht gelernt'
- 'Jobs, von denen das Ziel abhängt, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$: nur $N$ der $N E$ fuse-Jobs'
- 'die Engine: Regeln Ebene für Ebene, jede als EIN gebündelter Aufruf über ihre benötigten Jobs (fuse: ein Aufruf pro Wert seiner Wildcard $op$)'
- Probe $n$ auf Platz $c$ von Experte $e$ (ihr Rang unter den dorthin gerouteten Proben), wie in GShard/Switch; Kapazität $C$ = größte Gruppe
- alle Experten in einem gebündelten Produkt; $m$ ist die Modell-(Seed-)Achse, nie summiert
- 'Kombination: $e$ und $c$ summiert, ein von null verschiedener Term pro Probe, also ist sie mit $g = G$ gleich der DAG-Ausgabe'
- 'gelernter Router: Softmax eines linearen Gates auf den Textmerkmalen; Top-1-Routing, Ausgabe mit $p$ skaliert'
- 'Switch-Load-Balancing: $f_e$ = Anteil, der an $e$ geroutet wird, $P_e$ = mittlere Gate-Wahrscheinlichkeit; 1 bei ausgeglichen und gleichverteilt, $E$ bei Kollaps'
- Hinton-Destillation bei Temperatur $T$; der Verlust des Studenten ist $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ Kreuzentropie auf der wahren Antwort
- symmetrisches int8 pro Ausgabekanal, $s_o = \max_i |W_{io}|/127$; gespeichert als int8 + ein float32-Skalenfaktor pro Kanal
labels:
  seeds: Seeds (Modelle auf der Modellachse)
  split_steps: Schritte Stufe 2 (jeder Experte auf seiner Teilaufgabe)
  router_steps: Schritte Stufe 1b (gelernter Router)
  global_steps: Schritte Stufe 3 (End-to-End-Feinabstimmung)
  student_steps: Schritte Stufe 4 (Destillation)
  student_hidden: Breite des Studenten $H$
  temperature: Destillationstemperatur $T$
  balance_weight: Load-Balancing-Gewicht $\alpha$
