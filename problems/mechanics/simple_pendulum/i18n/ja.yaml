source_hash: a761e752552d
title: 微小振動を超えた単振り子
summary: 完全な非線形振り子の方程式を、複数の振幅について一度に解く。すべての振り子は1つのバッチ化したテンソルに入っており、それぞれを学校で習う微小角近似の余弦解と比較する。
notes: 振れが小さければ $\sin\theta \approx \theta$ であり、どの振り子も同じ周期 $2\pi\sqrt{L/g}$ をもつ。振れが大きいほど周期は長くなる：厳密な周期は第1種完全楕円積分 $K$ を用いて $4\sqrt{L/g}\,K(\sin(\theta_0/2))$ であり、90° では約 18% 長い。大振幅の振り子が、破線で示した微小角近似の相棒から遅れていく様子を見よう。
meanings:
- 鉛直から測った振り子 $b$ の角度
- 振り子 $b$ の角速度
- 右辺：すべての振り子について一度に $-(g/L)\sin\theta$
- 微小角近似の解：外積であり、和をとる添字はない
- 単位質量あたりのエネルギー $\tfrac12L^2\omega^2 + gL(1 - \cos\theta)$、保存量
labels:
  length: 棒の長さ $L$
  g: 重力加速度 $g$
  n_pendulums: 振り子の数
  max_amplitude: 最大振幅
  t_max: シミュレーション時間
