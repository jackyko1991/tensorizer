source_hash: 125d78b166e3
title: '조대화 단백질 접힘: 랑주뱅 동역학을 이용한 Gō 모형'
summary: 나선-헤어핀 구조의 작은 단백질을 아미노산 하나당 구슬 하나로 이루어진 사슬로 나타내고, 결합과 결합각으로 묶은 뒤 끌어당기는 천연 접촉(native contact)으로 안정화한다(Gō 모형). 힘은 쌍 거리 텐서로 쓴 전체 에너지의 자동 미분 기울기이다. 랑주뱅 동역학으로 여러 온도와 복제본 묶음을 한꺼번에 돌리며, 절반은 접힌 상태에서, 절반은 풀린 상태에서 시작한다. 천연 접촉 비율 $Q(t)$는 접힘과 풀림을 보여 주고, 그 평균을 온도에 대해 그리면 녹는 곡선이 된다.
notes: Gō 모형은 정답으로부터 만들어진다. 천연 구조에 존재하는 모든 상호작용은 인력이고 나머지는 모두 척력뿐이므로, 에너지 지형은 천연 접힘을 향한 매끄러운 깔때기가 된다. 이는 과장된 그림이지만 유용하다. 작은 단백질은 실제로 지형이 최소로 좌절된(minimally frustrated) 것처럼 접히며, Gō 모형은 그중 다수의 접힘 속도, 전이 상태, 협동적 녹음을 재현한다. 단위는 환산 단위이다. 에너지는 $\varepsilon$(접촉 하나), 온도는 $\varepsilon/k_B$, 시간은 $\tau$ 단위이다. 복제본의 절반은 접힌 상태로, 절반은 곧은 막대로 시작한다. 실선과 점선 곡선이 일치하는 곳에서는 계산이 평형에 도달한 것이고, 일치하지 않는 곳(낮은 $T$)에서는 풀린 사슬이 잘못 접힌 상태에 동역학적으로 갇혀 있어 훨씬 긴 계산이나 복제 교환이 필요하다. 단백질이 아주 작기 때문에 녹는 곡선이 넓다. 수백 개의 접촉을 가진 실제 단백질은 날카롭게 녹는다. 이면각 항이 없으면 에너지는 거리에만 의존하므로 천연 접힘의 거울상도 정확히 같은 에너지와 $Q$를 갖는다. 실제 Gō 모형은 손대칭성(handedness)을 고정하기 위해 이면각 퍼텐셜을 추가한다. 마찰(동역학은 바꾸지만 평형 곡선은 바꾸지 않는다)이나 온도 개수를 바꿔 보라.
meanings:
- 계 $s$의 구슬 $i$; $S = B\cdot R$ 온도 × 복제본
- 쌍 $p = (i_p, j_p)$의 천연 거리, $j - i \ge 3$; 천연 접힘에서 8 Å보다 가까우면 $n_p = 1$
- 모든 계의 모든 쌍 거리를 하나의 텐서로, $a$에 대해 합산
- 결합 + 결합각 + 12–10 천연 우물(최솟값 $-\varepsilon$, 위치 $r^0_p$) + 비천연 쌍의 척력
- 자동 미분으로 구한 힘; 계들은 서로 상호작용하지 않으므로 $s$에 대해 합해도 된다
- 각 계는 자신만의 열저장고를 갖는다
- 킥, 드리프트, 마찰 + 잡음 $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$, 드리프트, 킥
- '형성된 천연 접촉의 비율: 접힌 상태는 1, 풀린 사슬은 약 0.4(국소 접촉은 계속 형성된다)'
- 계산 후반부에 대한 시간 평균; ½을 지나는 곳이 $T_m$
labels:
  helix_length: 나선당 구슬 수
  T_min: 최저 온도 $T$
  T_max: 최고 온도 $T$
  temperatures: 온도 개수 $B$
  friction: 마찰 $\gamma$
  steps: 시간 단계
