source_hash: 0b2a4ba1c286
title: π 電子系のヒュッケル分子軌道
summary: 平面炭化水素の π 電子は、炭素骨格の隣接行列そのものであるハミルトニアン $H = \alpha\mathbb 1 + \beta A$ の中にいる。一回のバッチ eigh でエチレンからナフタレンまで七つの分子を同時に対角化する。軌道を占有させると HOMO–LUMO ギャップ、非局在化エネルギー（ベンゼン：$2\beta$、シクロブタジエン：$0$）、占有軌道についての einsum としてのクールソン結合次数が得られ、環の大きさ $N = 3, 4, \dots$ からヒュッケルの $4n + 2$ 則がわかる。
notes: Hückel（1931）は平面共役分子の π 電子にとって重要なものだけを残した：炭素ごとに一つの $2p_z$ 軌道、すべての原子で同じエネルギー $\alpha$、結合した隣どうしの間の飛び移りエネルギー $\beta$、それ以外は何もなく、重なりもない。するとハミルトニアンは $\alpha\mathbb 1 + \beta A$ で $A$ は分子のグラフなので、固有値は $\alpha + \beta\lambda$（$\lambda$ は $A$ の固有値）となる。$\beta < 0$ なので最も結合性の軌道は $\lambda$ が最大のものである。ベンゼンでは $\alpha + 2\beta$、$\alpha + \beta$（二重）、$\alpha - \beta$（二重）、$\alpha - 2\beta$ となり、6 個の電子は $E_\pi = 6\alpha + 8\beta$ をもつ。これは孤立した三つの二重結合より $2\beta$ 低い。$|\beta| \approx 75$ kJ/mol（ベンゼンの水素化エンタルピーにフィットした大まかな熱化学的値；分光学からはより大きな $|\beta|$ が示唆されるので近似値として扱うこと）とすれば、これが有名な $\approx 150$ kJ/mol の芳香族安定化である。シクロブタジエンでは 2 個の電子が $\alpha$ の縮退対に余る：非局在化エネルギーはなく、ギャップはゼロで、ジラジカルであり、鎖状のブタジエンより不安定でさえある：反芳香族である。$N$ 原子の環では準位は $\alpha + 2\beta\cos(2\pi k/N)$ で、最低準位が一つ、あとは縮退対が続く（フロスト円）ので、閉殻には $2 + 4n$ 個の電子が必要である：ヒュッケル則。奇数員環はシクロペンタジエニルアニオンやトロピリウムカチオンのように芳香族イオンとして示している。ブタジエンの結合次数 $P_{ij} = \sum_k n_k C_{ik}C_{jk}$ は両端の結合で $0.894$、中央で $0.447$ で、短–長–短の結合長と一致する。ベンゼンでは六つすべてが $2/3$ である。交互炭化水素（奇数員環なし）では対形成定理によりスペクトルは $\alpha$ について対称となり、π
  電荷はすべてゼロになる。別の分子を選ぶとフロンティア軌道が見える：HOMO と LUMO は求電子剤と求核剤が攻撃する位置を決め、ギャップを通じて色も決める（長いポリエンほど長波長を吸収する）。
meanings:
- 分子 $b$ の結合した炭素 $i, j$（一結合長だけ離れた原子）に対して $1$、最大の $N = 10$ まで埋める
- ヒュッケル行列；詰め物の原子には巨大な対角成分を与え、偽の軌道が決して占有されないようにする
- MO エネルギー（昇順：$\beta < 0$ なので結合性が先）と係数、MO $k$ は列 $k$
- 構成原理による占有、MO あたり電子 2 個；部分的に占有された縮退組は電子を分け合う
- $k$ の繰り返し ⇒ 和：全 π エネルギー $E_\pi$
- それぞれ $2(\alpha + \beta)$ の孤立二重結合に対する非局在化エネルギー
- $k$ の繰り返し ⇒ 占有 MO について和：結合上ではクールソン結合次数、対角上では π 電子密度
- π 電荷 $1 - P_{bii}$；これらの交互炭化水素ではすべての原子でゼロ
- 環の準位の閉じた式、環状隣接行列の eigh と照合
labels:
  molecule: 軌道図を表示する分子
  ring_max: 最大の環の大きさ $N$
  beta: kJ/mol への換算用の $|\beta|$（近似値）
