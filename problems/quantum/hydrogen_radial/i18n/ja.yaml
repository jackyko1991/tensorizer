source_hash: bc7b5c9d23fa
title: 水素原子の軌道
summary: $\psi = (u(r)/r)\,Y_{lm}(\theta, \phi)$ と書くと、3次元の水素原子の問題は、遠心力項 $l(l+1)/2r^2$ が加わった1次元の動径方程式になる。角運動量 $l$ ごとに1つの差分ハミルトニアンを $(L, N, N)$ テンソルに積み重ね、1回のバッチ化した torch.linalg.eigh ですべての軌道を一度に求める。アニメーションは 1s、2s、2p、3s、… と順に、動径確率と $\lvert\psi_{nl0}\rvert^2$ の断面を表示する。
notes: 原子単位（$\hbar = m_e = e = 4\pi\varepsilon_0 = 1$）：長さはボーア半径、エネルギーはハートリー単位。厳密なエネルギー $E_n = -1/(2n^2)$ は $n$ だけに依存するので、2s と 2p（あるいは 3s、3p、3d）は異なる行列の固有値であるにもかかわらず縮退する——$1/r$ ポテンシャルの隠れた対称性である。$(n, l)$ の動径関数は $n - l - 1$ 個の節をもつ。格子は $r_{\max}$ で終わるので、大きさ（$\approx 2n^2$）が $r_{\max}$ に近い状態は押し縮められ、エネルギーが押し上げられる。また差分法は $1/r$ 特異点付近で 1s の束縛をわずかに弱く見積もる。断面は $xz$ 平面（$z$ が上向き）内の $m = 0$ 軌道で、$Y_{l0} \propto P_l(\cos\theta)$ である。色は圧縮したべき乗スケール $(\lvert\psi\rvert^2)^{0.3}$ を用いるので、外側の弱いローブも見える。
meanings:
- 内部の点 $r = dr \dots r_{\max} - dr$（両端で $u = 0$）
- クーロン引力と遠心力障壁、$l$ ごとに1行
- $L$ 個のハミルトニアンの積み重ね、角運動量ごとに1つ
- $l$ についてバッチ化：エネルギーと動径関数；主量子数 $n = l + 1 + \text{column}$
- 単位半径あたりの確率、$r^2\lvert R\rvert^2 = u^2$
- $z$ 軸を通る断面上の $\lvert R(r)\,Y_{l0}(\theta)\rvert^2$
labels:
  n_max: 最大の殻 $n$
  r_max: 格子の半径 $r_{\max}$
  n_grid: 格子点数
