source_hash: 0b5328cbe1c8
title: リップルタンクの干渉
summary: 2つの振動子が水面で同位相に上下し、円形の波紋を送り出す。2次元波動方程式を、ラプラシアンを $3\times3$ の畳み込みカーネル（conv2d）として時間発展させ、減衰境界が出ていく波を吸収する。干渉パターンは、光路差が波長の半奇数倍となるところで静止した節線に落ち着く。
notes: 単位：セルサイズ $h = 1$、波の速さ $c = 1$。時間はリープフロッグ法で、減衰項を中心化しているのでステップは陽的である。節線に沿っては、一方の波源からの波紋が他方からの波紋より常に半周期遅れて到着するので打ち消し合う。破線の曲線は双曲線 $|r_1 - r_2| = (m + \tfrac12)\lambda$ で、波源から十分離れたところで右パネルの暗い線と一致する。波源を $\lambda$ より離すと節線が増える。境界は粗い吸収層（摩擦層）であり完全整合層ではないので、わずかな反射が残る。右パネルは $u^2$ の移動平均を示す。最初の数周期は波がタンクを満たすまでの過渡状態である。
meanings:
- 格子セル $(a, b)$ における水面の高さ
- 5点ラプラシアンカーネル、オフセット $\alpha, \beta \in \{-1, 0, 1\}$
- 繰り返される $\alpha, \beta$ ⇒ 和をとる：カーネルが格子上をスライドする
- 内部では0、吸収境界で滑らかに増加
- 同位相で振動する2つの小さなガウス型波源
- クーラン数が $1/\sqrt2$ を超えると受け付けない（計算が発散する）
- 約1周期にわたる $u^2$ の移動平均：暗い線が節
labels:
  wavelength: 波長 $\lambda$
  separation: 波源間隔 $d$
  courant: クーラン数 $c\,\Delta t/h$
  t_max: シミュレーション時間
