source_hash: 278f16a6d4b6
title: 爱因斯坦 1905：运动物体与 $E = mc^2$
summary: 沿着爱因斯坦本人在 1905 年两篇相对论论文中的思路前进。从两条公设出发——所有惯性参考系中物理定律相同、光速恒为 $c$——一批光钟显示：运动的时间变慢 $\gamma$ 倍，尺缩短为 $1/\gamma$，同时性取决于观察者，速度相加永远不会超过 $c$。质能论文（物体放出光能 $L$ 时失去质量 $L/c^2$）用 He-4 的质量亏损与 $e^+e^-$ 湮灭来验证；再用 Frisch 与 Smith 1963 年在华盛顿山与海平面测得的 μ 子计数作拟合，得到 $\gamma \approx 9$。
notes: 这是爱因斯坦 1905 年四篇“奇迹年”论文之一——其实是其中两篇：《论动体的电动力学》（六月）与《物体的惯性同它所含的能量有关吗？》（九月）。另外两篇是光量子论文（量子：光电效应与光量子）与布朗运动（热力学：随机行走与扩散）。把相对论当作几何来看，请见狭义相对论：闵可夫斯基图与洛伦兹变换（天体物理）；场张量部分见 $F^{\mu\nu}$ 的洛伦兹变换（电磁学）；碰撞部分见四维动量与二体衰变（核与粒子）。单位取 $c = 1$，镜间距 $D = 1$。爱因斯坦的质量论证：静止物体向前放出 $L/2$、向后放出 $L/2$；在以 $v$ 运动的参考系中，光带走 $\gamma L$，比 $L$ 多，而两个参考系中的能量守恒迫使物体的动能减少 $L(\gamma - 1)$，正好是质量 $L/c^2$ 所携带的动能（他只保留了低速项 $\tfrac12 (L/c^2)v^2$）。原子质量取自 AME2020。真实数据（data/frisch_smith_1963_muons.csv）：D. H. Frisch and J. H. Smith, Am. J. Phys. 31, 342 (1963), doi:10.1119/1.1969508——减速到相同能量的 μ 子，在华盛顿山 1917 m 处为每小时 $563 \pm 10$ 个，在海平面为每小时 $408 \pm 9$ 个（论文公布的测量值；维基百科的摘要把后者四舍五入为 412）。飞行约需 6.4 μs，几乎是 μ 子寿命 2.2 μs 的三倍，所以若没有时间膨胀，每小时只会有约 30 个到达；计数给出 μ 子自身时钟经过 0.71 μs，$\gamma \approx 9.1 \pm 0.8$（论文结合其测得的衰变曲线得到 $8.8 \pm 0.8$）。由速度出发的预测，对穿越大气时从 $\beta \approx 0.995$ 减速到 $\approx 0.989$ 的过程积分（电离损失 $dE/dx$，等温大气）：约 8.4，与论文一致。Rossi 与 Hall（1941）最早在 Echo Lake 与丹佛用宇宙线 μ 子展示了这一效应。
meanings:
- 时刻 $t$ 时时钟 $b$ 的光子：水平速度 $\beta_b$，竖直速度 $\sqrt{1-\beta_b^2}$，因此恒为 $c$
- 一次嘀嗒需时 $\gamma\cdot 2D/c$；嘀嗒次数由锯齿路径数出
- 一批沿 $x$ 方向的洛伦兹变换，$\eta = \operatorname{diag}(-1, 1, 1, 1)$
- 重复的 $\nu$ ⇒ 求和：每个参考系中的每个事件；火车上的闪光得到 $\Delta t' = -\gamma\beta\Delta x$
- 时空间隔，在每次洛伦兹变换下不变
- 从运动参考系看到的两道光脉冲：合计 $\gamma L$，因此 $K_0 - K_1 = (L/c^2)(\gamma - 1)c^2$
- 质量亏损 × 931.494 MeV/u（He-4：28.30 MeV）
- 对两个 μ 子计数率的 $\chi^2(\gamma)$ 用 autograd 做牛顿迭代
labels:
  beta_fast: 最快时钟的速度 $\beta$
  n_clocks: 光钟数目
  dEdx: μ 子在空气中的能量损失 $dE/dx$
