source_hash: a1a35d304051
title: 하디–바인베르크와 라이트–피셔 유전적 부동
summary: 무작위 교배는 하디–바인베르크 유전자형 빈도 $p^2, 2pq, q^2$를 주고, 매 세대 $2N$개 유전자 사본을 무작위로 표본 추출하면 대립유전자 빈도가 부동한다. 수천 개의 집단이 (반복, 세대) 텐서 하나의 이항 추출로 한꺼번에 진화하며, 선택 $s$를 넣을 수도 있다. 이종접합도는 $(1-1/2N)^t$와, 고정 확률은 $1/2N$ 및 기무라 공식과 비교한다.
notes: 하디–바인베르크 원리에 따르면 무작위 교배 한 번이면 부모의 유전자형이 무엇이었든 대립유전자 빈도 $p$가 유전자형 빈도 $p^2, 2pq, q^2$로 바뀐다. 점들은 무작위 생식세포 두 개로 만든 개체 $N$명이며 이 곡선 주위에 흩어진다. 대립유전자 빈도는 무한한 집단에서만 그대로 유지된다. 사본이 $2N$개이면 각 세대는 이전 세대의 이항 표본이므로, $p$는 0(대립유전자 소실) 또는 1(대립유전자 고정)에 닿을 때까지 무작위 행보를 한다. 무작위로 고른 두 사본이 같은 부모 사본을 공유할 확률은 $1/2N$이므로, 기대 이종접합도 $2pq$는 세대마다 인자 $1 - 1/2N$만큼 줄어든다. 부동은 작은 집단에서 더 빠르다. 새로운 중립 돌연변이는 $2N$개 중 사본 하나로 시작한다. 결국 $2N$개 사본 중 하나가 모두의 조상이 되므로, 고정될 확률은 $1/2N$이다. 선택이 있으면 기무라의 확산 결과가 적용된다. $4Ns \gg 1$인 유리한 대립유전자는 $2s$에 가까운 확률로 고정되어 여전히 확실과는 거리가 멀고, 약간 해로운 대립유전자도 $|4Ns| \lesssim 1$이면 부동으로 고정될 수 있다. 여기서 $N$은 이상화된 집단 크기(일정, 무작위 교배, 돌연변이나 이주 없음)이며, 실제 집단은 더 작은 유효 집단 크기 $N_e$로 기술된다.
meanings:
- 세대 $t$에서 반복 집단 $r$의 대립유전자 A 빈도
- '선택 후: A 사본이 $1+s$배 더 자주 전달된다'
- '다음 세대 $2N$개 사본 중 A의 수: 집단마다 추출 하나, 모두 한꺼번에'
- 무작위 교배에서 유전자형 AA, Aa, aa의 빈도
- 각각 무작위 생식세포 두 개로 만든 개체 $N$명, 유전자형별로 센 수(점)
- '$r$에 대한 합: 평균 $2pq$, $H_0(1-1/2N)^t$와 비교'
- 새 사본 하나($p_0 = 1/2N$)가 고정된 집단의 비율, 각 $s$에 대해
- $(1-e^{-4Nsp_0})/(1-e^{-4Ns})$, $s = 0$이면 $p_0 = 1/2N$과 같다
labels:
  N: 집단 크기 $N$(이배체)
  p0: 초기 빈도 $p_0$
  s: 선택 계수 $s$
  generations: 세대 수 $G$
  replicates: 집단 수 $R$
  fix_replicates: $s$당 집단 수(고정)
  seed: 난수 시드
