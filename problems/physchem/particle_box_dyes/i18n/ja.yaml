source_hash: 07db7a3fd274
title: 箱の中の粒子と色素の色
summary: なぜ長い共役分子ほど赤い光を吸収するのか？シアニン色素の $\pi$ 電子は、長さ $L$ の一次元の箱の中の粒子のように鎖に沿って自由に動く。準位 $E_n \propto n^2/L^2$ を二個ずつ埋めると HOMO→LUMO ギャップ $\Delta E = h^2(N+1)/8m_eL^2$ と予測される $\lambda_{max}$ が同族列全体について一度に得られる。torch.linalg.eigh で対角化したバッチ化差分ハミルトニアンが解析的な準位を再現する。
notes: Kuhn の自由電子モデル（1948）は、共役鎖の $\pi$ 電子を箱の中の独立な粒子として扱う。シアニン色素 $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$ では正電荷が二つの窒素に共有されるので、鎖の結合はすべてほぼ等しく（約 $l = 0.139$ nm）、底の平らな箱がよい描像になる。結合 $2k + 2$ 個、電子 $N = 2k + 4$ 個で、箱が各窒素から一結合分はみ出すとすると $L = (2k + 4)l$ で、$\lambda_{max} = 8m_ec\,L^2/h(N + 1)$ は $k$ にほぼ比例して増える：モデルは CH=CH 単位を一つ加えるごとに約 125 nm を予測し、赤い四角（最も単純なシアニンの実測値を丸めたもの）は約 100 nm ずつ上がる。これは学部の古典的な実験である：鎖長の異なるいくつかのシアニン色素の可視スペクトルを測定し、$\lambda_{max}$ を使って箱の長さや端のはみ出しをフィットする。数値ソルバーは同じ準位を $10^{-3}$ より良い精度で与え（誤差は $(n\,\Delta x)^2$ のように減る）、公式にはできないことができる：ポテンシャルを入れることである。ポリエンは二重結合と単結合が交互に並ぶ。素朴な箱では予測される $\lambda_{max}$ ははるか赤外まで伸びるが、実際のポリエンは頭打ちになる（11 個の C=C をもつ β-カロテンは 450 nm 付近を吸収する）。ポリエン系列を選び、$V_{alt}$ を 1–2 eV に上げてみよう：周期ポテンシャルが長い鎖でも有限にとどまるギャップを開く。これがバンドギャップの一次元の萌芽である。色見本は、白色光から各 $\lambda_{max}$ のガウス吸収帯を差し引いたものを示す：黄色を吸収する色素は青く見え、紫外線だけを吸収するものは無色に見える。
meanings:
- 系列中の分子 $b$ の π 電子数と共役結合数
- 箱の長さ：すべての結合に、両端の原子からそれぞれ一結合長を加えたもの
- 解析的な準位；どの添字についても和をとらず、$n^2$ と $1/L^2$ の外積
- HOMO $n = N/2$ から LUMO $n = N/2 + 1$ へ、そして吸収波長
- 各箱の内部格子点；壁では $\psi = 0$
- 分子ごとに一つの差分ハミルトニアン、積み重ねる
- $j$ の繰り返し ⇒ 和；eigh がバッチ全体を一回の呼び出しで対角化する
- $w$ の繰り返し ⇒ 可視波長について和：吸収後に残る色
labels:
  series: 同族列
  n_max: 最長の鎖（追加する CH=CH 単位）
  bond: 結合長 $l$
  end: 両端の原子からの箱のはみ出し（結合数）
  V_alt: 結合交替ポテンシャル $V_{alt}$
  n_points: 格子点数 $M$
