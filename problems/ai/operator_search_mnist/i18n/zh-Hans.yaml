title: MNIST 上的算子搜索：张量 DAG 自己写出分类方程
summary: 当训练图像只有寥寥几张时，少数几个可读的张量算子连接成 DAG，能否与 CNN 一较高下？小型 DAG 的每条边上都是 23 个候选算子（Sobel、拉普拉斯、Gabor、可学习的 3×3 滤波器、ReLU、$x^2$、池化、行和、FFT 幅值、类别模板、PCA、矩、线性与原型读出）经 softmax 加权的混合；以每个数字 1 到 100 张图像进行 DARTS 搜索，为每条边挑选一个算子，并把 DAG 输出为一个能精确复现其预测的 LaTeX 方程。随后与 LeNet 风格的 CNN 及两个闭式基线比较所需的数据量与计算量，并展示每个种子的结果。
notes: 问题。这个玩具问题出自 Jacky Ka Long Ko：尝试以白盒方式写出方程的小批量 AI 训练。在 MNIST 上比较 CNN 与张量方法；列出候选张量算子；让一个编码 DAG 的张量找出最佳算子及其连接方式；以小批量训练，比较两者达到相同准确率所需的数据量与计算量；并写出所找到 DAG 的分类方程。方法。图像为 14×14（将 MNIST 按 2×2 块平均，使 30 次运行能在约一分钟的 CPU 时间内完成）。超网络是一个 DARTS 单元（Liu, Simonyan and Yang 2019），其中三个节点 $z_1, z_2, z_3$ 通过 6 条边接收所有前面节点的输入，每条边都是 12 个单元算子（零、恒等、$x^2$、$|x|$、ReLU、tanh、软阈值 $S_\lambda$、可学习的 $3\times 3$ 滤波器、Sobel-$x$、Sobel-$y$、拉普拉斯、Gabor）的混合；之后接一条池化边（平均或最大 $2\times 2$）、一条归约边（vec、行和、列和、低频 FFT 幅值、类别模板相关、PCA 投影、图像矩）以及一条输出头边（线性读出或 10 个原型）。架构即张量 $\alpha$（9 条边 × 23 个算子），并带有一个对应类型规则的掩码。搜索：一阶 DARTS，在训练半数数据的小批量上做 $\theta$ 步与在验证半数数据上做 $\alpha$ 步交替进行，softmax 温度从 1 退火至 0.001；DAG 保留每条边的 argmax 算子（零表示删除该边），继承已训练的 $\theta$ 并短暂微调，保留验证表现最佳的步骤。与 DARTS 的差异很重要，故在此说明：退火（如 SNAS 与 GDAS）与 argmax 规则弥合了离散化差距，而在第一次尝试中这一差距造成最多 25 个百分点的准确率损失；图像被保留为单元输出的第四个通道；各输出头从其特征空间中的最近类别均值开始。CNN（$3\times 3$ 的 8 与 16 个通道、最大池化、一个线性层：2698 个权重）用 Adam 在相同图像上、采用相同的早停进行训练。基线没有任何可学习参数：像素空间中的最近类别均值，以及 PCA 后接收缩 LDA。结果。测试检查：每个算子在小输入上等于其公式；one-hot 混合即为单一算子，one-hot 超网络即为离散
  DAG；离散化选取 argmax；写出的方程仅从其 LaTeX 读回后，给出与 DAG 完全相同的预测；以及基线等于其闭式解。随附的运行（CPU、单线程、3 个种子）中，每个数字 $n$ = 1, 5, 10, 50, 100 张图像时的平均测试准确率：CNN 0.35, 0.53, 0.64, 0.81, 0.85；搜索所得 DAG 0.38, 0.48, 0.52, 0.69, 0.82；PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76；最近类别均值 0.41, 0.56, 0.64, 0.68, 0.69。达到 70 % 所需的每个数字图像数：CNN 18、DAG 52、PCA + LDA 20；达到 80 %：CNN 45、DAG 91。每次运行的训练时间：CNN 0.4 至 1 s，搜索加微调 2 至 4 s。所以，坦白说：从每个数字约 10 张图像起，CNN 达到相同准确率所需的数据与计算都更少；低于此数时，闭式基线最好，没有任何学习器能胜过它们；结构化模型在极小的 $n$ 下并未胜出（在 $n$ = 1 时与类别均值持平）。原因：搜索所用的验证集本身就极小，因此其选择充满噪声，而且其验证损失常偏好行和（28 个特征、290 个可学习数值、更平稳的损失），但行和的分类效果比全部像素（约 2000 个可学习数值）差；15 个 DAG 中有 7 个选了行和。正如 DARTS 文献所报告的，搜索偏好无参数算子：Sobel 滤波器占据大多数边，可学习的滤波器只出现在 15 个 DAG 中的 3 个。在随附运行之外，较短的搜索（20 或 40 步）选择了全部像素，并在 $n$ = 50 时达到 0.74 至 0.79，暗示较长的搜索会过早定型；这是在测试集上看到的，因此只是观察，而非调优过的设置。GPU（GTX 1080 Ti）没有带来加速：决定时间的是成千上万个小内核，而非算术运算。results/stages.csv 包含所有数字，results/equation.tex 包含所找到的每个方程。相关工作。神经架构搜索（Zoph and Le 2017）及其可微分形式 DARTS；搜索公式而非网络的符号回归（AI Feynman, Udrescu and Tegmark 2020；PySR, Cranmer 2023；遗传编程, Koza
  1992）；CNN 部分参考 LeNet（LeCun et al. 1998）。数据：MNIST（LeCun, Cortes and Burges），许可证 CC BY-SA 3.0；data/mnist_subset.npz 包含 1000 张训练池图像与 2000 张测试图像（相同方式共享许可适用于此子集），见 data/SOURCES.md。动手试试。修改 show_n 以查看用每个数字 1 张或 100 张图像找到的 DAG，增加搜索步数，或只用一个种子快速运行。
meanings:
- 类型规则：算子 $o$ 只有在能把边 $e$ 的输入形状映射到其输出形状时，才能放在该边上（单元：特征图 → 特征图、池化、归约：特征图 → 向量、输出头：向量 → logits）
- 架构张量 $\alpha$（边 × 算子）的掩码 softmax；温度 $T$ 从 1 降至 0.001，使混合最终成为 one-hot
- 节点所馈入的每个算子，对其所有输出边只计算一次：一次卷积即得到 Sobel-$x$、Sobel-$y$、拉普拉斯、Gabor 以及可学习的 $3\times 3$ 滤波器 $K_e$
- 重复的 $o$ ⇒ 求和：每个节点是其混合输入边之和；单元输出为堆叠 $(x, z_1, z_2, z_3)$
- 归约 $r$ 的特征（vec、行和／列和、$|\mathcal F|$、模板 $\langle z, \mu_k\rangle$、PCA $U^\top \mathrm{vec}$、矩），用训练图像标准化
- 所有归约 × 输出头在 logit 层面混合（其特征长度不同）；线性 $W\hat f + b$ 或原型 $-e^\tau\lVert \hat f - p_k\rVert^2/D$，两者均从最近类别均值开始
- 一阶 DARTS：在训练小批量上做 $\theta$ 步，然后在验证小批量上做 $\alpha$ 步
- 以 LaTeX 写出的离散 DAG，经小型解析器读回并求值：预测与 DAG 完全相同
labels:
  search_steps: DARTS 搜索步数（每步各更新一次 $\theta$ 与 $\alpha$）
  retrain_steps: 离散 DAG 的微调步数
  cnn_steps: CNN 训练步数
  seeds: 每种训练集大小的种子数
  batch: 小批量大小（各数字均衡）
  show_n: 所显示 DAG 的每个数字训练图像数
