source_hash: bed4e5f065d8
title: P vs NP と 3-SAT の相転移
summary: 解が容易に検証できる問題は、すべて容易に解けるのだろうか？これが 1971 年以来未解決の P vs NP 問題である。ランダム 3-SAT はこの非対称性を具体的に示す：与えられた割り当ての検証は 1 回の gather と 2 回のリダクションで済むが、全数探索は $2^n$ 個の割り当てすべてを 1 つのパックされたビットテンソルとして一度に評価し、そのサイズは変数が 1 つ増えるごとに倍になる。節と変数の比 $\alpha$ を掃引すると、$\alpha_c \approx 4.27$ 付近に充足可能性の相転移が現れ、探索コストが転移ウィンドウ内でピークになる様子が見える。
notes: P vs NP は、「はい」の答えに多項式時間で検証できる証拠をもつ決定問題（クラス NP）がすべて多項式時間で解けるか（クラス P）を問う。Cook（1971）と Levin（1973）は充足可能性問題が NP 完全であることを証明した：3-SAT に多項式時間アルゴリズムがあれば、NP のすべての問題にもある。そのようなアルゴリズムが存在するかどうかはわかっていない。ほとんどの研究者は P $\ne$ NP を予想しているが証明はなく、既知の障壁（相対化、自然な証明、代数化）が証明戦略の系統全体を排除している。この問題はクレイ数学研究所の 7 つのミレニアム懸賞問題の一つであり、未解決である。このプログラムはこの問題について何も証明しない：全数探索は単に最も素朴なアルゴリズムにすぎず、既知の最良の 3-SAT アルゴリズムもなお指数時間である（PPSZ で約 $1.307^n$）。示しているのは非対称性である。検証器は 1 回の gather に OR と AND を 1 回ずつ加えたもので、計算量は $O(M)$ である。探索は完全な真理値表を構築し、割り当て 1 つにつき 1 ビット、整数 1 つに 32 個をパックするので、テンソルは $2^n$ ビットとなり、時間は変数が 1 つ増えるごとに倍になる（右下。$n$ が小さいうちは固定オーバーヘッドが支配的）。$M = \alpha n$ 個の節をもつランダム 3-SAT には鋭い閾値がある：Friedgut（1999）は $n \to \infty$ で転移が鋭くなることを証明し、統計物理学（Mézard、Parisi、Zecchina 2002）は $\alpha_c \approx 4.267$ を予測し、Ding、Sly、Sun（2015）は $k$ が大きい $k$-SAT について予測された閾値を証明した。$k = 3$ では 4.267 という値はまだ予想である。証明されているのは、ランダムな論理式が $\alpha = 3.52$ 未満では高い確率で充足可能、4.49 より上では充足不能だということである。$n$ が小さいと 50% の交差点は 4.27 より上にあり、$n$ が大きくなるにつれて下へずれていく（有限サイズスケーリング）。テストでは、検証器がすべての割り当てで総当たりと一致すること、1
  つの節がちょうど全割り当ての $1/8$ を除くこと、解の個数の平均が 1 次モーメント $2^n (7/8)^M$ に等しいこと、$P_{\mathrm{sat}}$ が単調で閾値付近で急落すること、ウィンドウが $n$ とともに狭まることを確かめる。探索コストのパネルは、$x_0, x_1, \ldots$ を順に固定し、完全に割り当てられた節が偽になった時点で後戻りする深さ優先バックトラック探索のノード数を数える。閾値より下ではすぐに解が見つかり、閾値よりずっと上では短い矛盾が早い段階で木を枝刈りし、最も難しい論理式は転移ウィンドウ内にある（この単純な探索では $n = 16$ で $\alpha \approx 5$ 付近。単位伝播をもつソルバーでは 4.3 付近でピークになる）。変数を増やして曲線が鋭くなる様子を見たり、論理式を増やして曲線を滑らかにしたりしてみよう。
meanings:
- $B$ 個の論理式。各々 3 つの異なる変数からなる節を $M$ 個もち、各変数は確率 $\frac12$ で否定される
- すべての論理式のすべてのリテラルを 1 回の gather で
- 検証器：$3M$ 回の参照、$n$ について多項式
- $2^n$ 個すべての割り当てにわたる $x_j$ の真理値表、整数 1 つに 32 個の割り当て
- ビットごとの OR で 1 つの節を $2^n$ 個すべての割り当てで評価（全ビット 1 との XOR で否定）
- 節を 1 つずつ AND していく。レベル $d$ では変数がすべて最初の $d$ 個に含まれる節だけを集め、これがバックトラック木を与える
- 入れ子の論理式（1 つの節リストの接頭部分）により、1 回のパスですべての $\alpha = M/n$ が得られ、$P_{\mathrm{sat}}$ が非増加になる
labels:
  n_max: 変数の数 $n$（最大サイズ）
  instances: サイズごとの論理式の数
  seed: 乱数シード
