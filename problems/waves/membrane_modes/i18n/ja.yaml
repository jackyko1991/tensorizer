source_hash: a794040c9063
title: 太鼓の膜の振動モード
summary: 正方形または円形の太鼓の膜の基準振動。格子上の2次元ラプラシアンは1次元のものからクロネッカー積で $\Delta = D\otimes I + I\otimes D$ と組み立てられ、1回の対称固有値ソルバー（eigh）がすべてのモード形状と振動数を一度に返す。
notes: 各パネルは1つのモード $\phi_m(x, y)\cos(\omega_m t)$ を示す。内側の白い線は決して動かない節線である。一辺 $L$ の正方形では厳密な振動数は $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$ なので、基本振動に対する比は $\sqrt{(m^2+n^2)/2}$ = 1, 1.58, 1.58, 2, 2.24 … となる：整数ではないので、太鼓は弦のようには聞こえない。$(1,2)$ と $(2,1)$ のような対は振動数が等しく、eigh はそれらの何らかの混合を返す。円では厳密な比はベッセル関数の零点から得られる（1, 1.59, 2.14, 2.30 …）。格子の階段状の縁によりこれらは数パーセントずれる。単位：$c = 1$、正方形の一辺または円の直径 $L = 1$；時間は基本周期単位で表示。
meanings:
- 縁を固定した1次元2階微分（外側で $u = 0$）
- 対の添字 $p = (a, b)$ が格子点に番号をつける：2次元ラプラシアン
- 太鼓の内側の点だけを残す（円形マスク）；縁は固定
- 固有値 $\omega^2/c^2$ と、列に並んだ正規直交モード形状
- 繰り返される $p$ ⇒ 和をとる：単位行列
labels:
  shape: 太鼓の形
  n_grid: 一辺あたりの格子点数
  periods: 表示する基本周期数
