source_hash: bb811720bfea
title: Полёт тела с сопротивлением воздуха
summary: 'Второй закон Ньютона для мяча с квадратичным сопротивлением воздуха. Несколько углов броска решаются одновременно: они собраны в один пакетный тензор, так что один einsum обрабатывает все траектории.'
notes: 'Пакетный индекс $b$ — не физика: это тензорный приём, позволяющий PyTorch рассчитать $B$ бросков за один проход. При нулевом сопротивлении получается школьная парабола с максимальной дальностью при 45°.'
meanings:
- положение мяча $b$, компонента $i \in \{x, z\}$
- скорость мяча $b$
- вектор силы тяжести $(0, -9.81)$
- 'повторяющийся $j$ ⇒ суммирование: квадрат скорости каждого мяча'
- правая часть ОДУ
labels:
  v0: Начальная скорость
  drag: Сопротивление $c/m$
  n_angles: Углы броска
  t_max: Время моделирования
