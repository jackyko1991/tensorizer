title: मेटालेंस का व्युत्क्रम डिज़ाइन
summary: उप-तरंगदैर्घ्य मेटा-परमाणुओं की एक समतल मेटासतह प्रकाश पर कला $\varphi(x)$ अंकित करती है। प्रकाश कोणीय-स्पेक्ट्रम विधि (एक FFT) से संचरित होता है, और Adam के साथ autograd हर मेटा-परमाणु को समायोजित करता है ताकि समतल प्रारंभ से जितनी संभव हो उतनी शक्ति फ़ोकल धब्बे में जाए। परिणाम की तुलना विश्लेषणात्मक अतिपरवलयिक लेंस से की जाती है, और एक साथ दो तरंगदैर्घ्यों (एक बैच) के लिए डिज़ाइन वर्णीय समझौता (chromatic trade-off) दिखाता है।
notes: 'विश्लेषणात्मक मेटालेंस लेंस से फ़ोकस तक के हर पथ को कला में लाता है, $\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$, जिसे $[0, 2\pi)$ में लपेटा जाता है क्योंकि मेटा-परमाणु प्रकाश को अधिकतम एक तरंग तक ही विलंबित कर सकता है (इस प्रकार के दृश्य मेटालेंस Khorasaninejad et al., Science 2016 ने प्रदर्शित किए)। यहाँ अनुकूलक को कोई सूत्र नहीं दिया जाता: यह समतल सतह से शुरू करता है, FFT-आधारित संचारक से फ़ोकल-धब्बा शक्ति $\eta$ की गणना करता है, और एक पश्च पास से सभी मेटा-परमाणु कलाओं के सापेक्ष प्रवणता प्राप्त करता है, वही सूचना जो फ़ोटोनिक व्युत्क्रम डिज़ाइन में एडजॉइंट (adjoint) विधि देती है। एक तरंगदैर्घ्य और एक फ़ोकल बिंदु के लिए सबसे अच्छी कला अतिपरवलयिक के निकट है, और अनुकूलक उसे फिर से खोज लेता है (यह $\eta$ पर थोड़ा बेहतर कर सकता है, क्योंकि धब्बे की चौड़ाई परिमित है और अदिश संचारक ठीक किरण चित्र नहीं है)। रोचक स्थिति दो तरंगदैर्घ्य हैं: खिलौना मॉडल में हर मेटा-परमाणु एक तरंग में लिपटा एक स्थिर प्रकाशीय पथ जोड़ता है, इसलिए $\lambda_1 \neq \lambda_0$ पर कला $\lambda_0/\lambda_1$ से मापित
  हो जाती है और लपेटें अब मेल नहीं खातीं। तब अतिपरवलयिक लेंस लाल प्रकाश को अलग दूरी पर फ़ोकस करता है (विवर्तनी वर्ण-विपथन)। डिज़ाइन ''dual'' के साथ दोनों तरंगदैर्घ्य हानि साझा करते हैं और अनुकूलक एक समझौता पाता है: $\lambda_1$ पर बेहतर, $\lambda_0$ पर बदतर। सरलीकरण: अदिश 1D प्रकाश, एक पतले-तत्व कला मुखौटा (हर मेटा-परमाणु पड़ोसियों से बिना युग्मन के एक आदर्श कला विस्थापक है), पूर्ण पारगमन, एक खिलौना परिक्षेपण मॉडल और आवर्ती सीमाएँ। वास्तविक व्युत्क्रम डिज़ाइन मेटा-परमाणुओं के लिए मैक्सवेल समीकरण हल करता है; पूरे मेटासतह कैमरों के अवकलनीय मॉडल Tseng et al. ("Neural nano-optics", Nature Communications 2021) द्वारा सिरे-से-सिरे तक प्रशिक्षित किए गए, और Li et al. व्युत्क्रम-डिज़ाइन की गई मेटासतहों की समीक्षा करते हैं (ACS Photonics 2022)। एक समतल लेंस एक साथ कितनी बैंडविड्थ फ़ोकस कर सकता है, इसकी मौलिक सीमाएँ हैं (Presutti & Monticone, Optica 2020)।'
meanings:
- 2048 ग्रिड बिंदु ($\Delta x = 0.05$ μm) और उनकी FFT तरंग-संख्याएँ
- 'डिज़ाइन चर: $\lambda_0$ पर तरंगों में हर मेटा-परमाणु का कला विलंब, प्रति 0.25 μm परमाणु एक मान'
- तरंगदैर्घ्य $\lambda_l$ पर कला; $l$ दो तरंगदैर्घ्यों का बैच है
- 'सम्मिश्र: क्षयी (evanescent) घटकों $|k_x| > k$ के लिए काल्पनिक (क्षयमान)'
- दोहराया गया $x$ ⇒ योग, FFT से $O(X\log X)$ में किया गया
- स्थानांतरण फलन को ब्रॉडकास्ट करके हर तरंगदैर्घ्य और दूरी पर एक साथ क्षेत्र
- 'दोहराया गया $x$ ⇒ योग: फ़ोकल धब्बे $|x| < \lambda_l f / D$ के अंदर शक्ति'
- 'FFT से होकर autograd: एडजॉइंट विधि मुफ़्त में'
labels:
  design: दोनों तरंगदैर्घ्यों के लिए डिज़ाइन (dual) या केवल $\lambda_0$
  wavelength: डिज़ाइन तरंगदैर्घ्य $\lambda_0$
  wavelength2: दूसरी तरंगदैर्घ्य $\lambda_1$
  focal_length: फ़ोकस दूरी $f$
  diameter: लेंस व्यास $D$
  n_iter: Adam पुनरावृत्तियाँ
  lr: Adam अधिगम दर (प्रति चरण तरंगें)
