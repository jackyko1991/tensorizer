title: युग्मित दोलक और प्रसामान्य विधाएँ (normal modes)
summary: दो स्थिर दीवारों के बीच स्प्रिंगों से जुड़े $N$ समान द्रव्यमान। स्प्रिंगें मिलकर एक दृढ़ता टेंसर $K_{ij}$ बनाती हैं, उसके आइगेनसदिश प्रसामान्य विधाएँ हैं, और गति इन विधाओं का अध्यारोपण है जिसे एक ही einsum से जोड़ा जाता है।
notes: चूँकि $K_{ij}$ सममित है, eigh वास्तविक आवृत्तियाँ और प्रसामान्य लांबिक विधाएँ देता है, इसलिए हर गति स्वतंत्र कोसाइनों का योग है और समय-चरणों की ज़रूरत नहीं पड़ती। एक ही विधा से शुरू करें तो शृंखला हमेशा वही आकार बनाए रखती है; एक द्रव्यमान को खींचकर छोड़ें तो ऊर्जा शृंखला में इधर-उधर बहती है। विश्लेषणात्मक आवृत्तियाँ $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$ हैं।
meanings:
- द्रव्यमान $i$ का अपनी विराम स्थिति से विस्थापन
- 'दृढ़ता टेंसर: विकर्ण पर $2k$, उसके बगल में $-k$'
- 'दोहराया गया $j$ ⇒ योग: द्रव्यमान $i$ पर कुल स्प्रिंग बल'
- आइगेनमान और आइगेनसदिश (स्तंभ $n$) = प्रसामान्य विधाएँ
- 'दोहराया गया $i$ ⇒ योग: प्रारंभिक अवस्था का हर विधा पर प्रक्षेप'
- 'दोहराया गया $n$ ⇒ योग: विधाओं का अध्यारोपण'
labels:
  n_masses: द्रव्यमानों की संख्या
  k: स्प्रिंग नियतांक
  m: द्रव्यमान
  start: प्रारंभिक विस्थापन
  amplitude: प्रारंभिक आयाम
  t_max: सिमुलेशन समय
