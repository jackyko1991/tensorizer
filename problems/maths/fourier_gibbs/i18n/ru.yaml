source_hash: 3b3a390c2f31
title: Ряды Фурье и явление Гиббса
summary: Прямоугольная, пилообразная и треугольная волны, построенные из синусов. Коэффициенты — один einsum (численный интеграл, сверенный с $4/(\pi n)$ и аналогами), а каждая частичная сумма — одно матричное произведение $S_N = B\,c$ с первыми $N$ столбцами базисной матрицы. Смотрите, как осцилляции стягиваются к скачкам, а выброс остаётся около 9% величины скачка.
notes: 'Точные коэффициенты: $b_n = 4/(\pi n)$ для нечётных $n$ (прямоугольная), $2(-1)^{n+1}/(\pi n)$ (пилообразная) и $\pm 8/(\pi^2 n^2)$ для нечётных $n$ (треугольная); численные интегралы совпадают с ними примерно до $10^{-6}$. Вблизи скачка частичные суммы дают выброс. С ростом $N$ горб сдвигается к скачку (его ширина убывает как $1/N$), но его высота стремится к $\left(\tfrac{1}{\pi}\mathrm{Si}(\pi) - \tfrac12\right) \approx 0.0895$ величины скачка, а не к нулю: для прямоугольной волны от $-1$ до $1$ пик остаётся около $1.179$. Это явление Гиббса. Ряд всё же сходится в среднем: по Парсевалю $\tfrac1\pi\int f^2\,dx = \sum_n b_n^2$, так что квадрат ошибки в $L^2$ равен сумме недостающих $b_n^2$. Коэффициенты, убывающие как $1/n$ (скачок), дают ошибку $\propto 1/N$; у треугольной волны есть только излом, её коэффициенты убывают как $1/n^2$, а ошибка — как $1/N^3$. Более гладкие функции сходятся быстрее. Попробуйте грубую сетку (малое $X$), чтобы увидеть, как численные коэффициенты уплывают.'
meanings:
- 'середины $X$ равных ячеек на $(-\pi, \pi)$ и их ширина $h$: веса интегрирования'
- волна $w$ (прямоугольная, пилообразная, треугольная) в точках $x_j$
- 'базисная матрица: столбец $n$ — это $\sin(n x)$ на сетке'
- 'повторяющийся $j$ ⇒ суммирование: интеграл $b_n$ как взвешенная сумма по сетке'
- 'повторяющийся $n$ ⇒ суммирование: частичная сумма с $N$ гармониками, матричное произведение'
- квадрат ошибки в $L^2$ при $d = F - S$; повторяющийся $j$ ⇒ суммирование
labels:
  n_max: Наибольшее число гармоник $N$
  n_x: Точки сетки $X$
