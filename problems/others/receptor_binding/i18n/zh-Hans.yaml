source_hash: 9b626f6fbe35
title: 受体–配体结合（$k_{\mathrm{on}}$、$k_{\mathrm{off}}$）
summary: 免疫受体（T 细胞受体或抗体）与其靶标结合得多紧、多久？用结合速率 $k_{on}$ 和解离速率 $k_{off}$ 的质量作用动力学，在一个 $(B, C)$ 张量中同时求解多种受体变体和整组配体浓度滴定，并以 SPR 式传感图与结合等温线一同展示。
notes: 结合需要一个游离受体和一个游离配体相遇，所以速率为 $k_{on} R L$；解离则由每个复合物各自发生，速率为 $k_{off} C$。平衡时两者相等，结合分数为 $\theta = L/(L + K_D)$，其中 $K_D = k_{off}/k_{on}$：当 $L = K_D$ 时一半受体被占据（每条等温线上的刻度标记）。从空受体开始，趋近过程为指数形式 $C(t) = C_{eq}(1 - e^{-k_{obs} t})$，其中 $k_{obs} = k_{on} L + k_{off}$，SPR（表面等离子体共振）仪器正是借此测量 $k_{on}$；缓冲液冲洗后，复合物按 $e^{-k_{off} t}$ 衰减，半衰期 $t_{1/2} = \ln 2 / k_{off}$，即停留时间。各变体覆盖真实范围：T 细胞受体与肽–MHC 结合较弱（$K_D \sim 1$–$10\,\mu$M，停留时间为数秒），抗体则结合紧密（$K_D \sim 0.1$ nM，停留时间为数小时）。看看等温线上的点：低浓度时 $k_{obs} \approx k_{off}$ 很小，所以开始冲洗时抗体尚未达到平衡。为什么 $k_{off}$ 对 T 细胞如此重要？在动力学校对（kinetic proofreading）模型中，结合的 TCR 必须先经过若干信号转导步骤（磷酸化）才能激活细胞，而如果配体先脱落，一切就会归零。存活时间长于这些步骤的复合物更有可能发出信号，因此 T 细胞读取的是停留时间 $1/k_{off}$，而不仅是占据率，从而能区分外来肽和亲和力仅略有差异的自身肽。简化：每个受体只有一个结合位点（无亲合力效应或再结合）、溶液充分混合且无传质限制；开启配体耗竭时，每个复合物会从封闭体积中移走一个配体，平衡遵循二次方程的解，而非 $L/(L + K_D)$。
meanings:
- 受体变体 $b$ 的速率常数（弱／中／高亲和力 TCR、抗体）
- 滴定的配体浓度 $c$（nM）；最后一个用于传感图
- 各变体、各浓度下的游离受体与复合物
- 游离配体：$L_c$，考虑耗竭时为 $L_c - C_{bc}$
- 不对任何指标求和：$k_b$ 广播到每个浓度 $c$
- RK4 的右端项；$R$ 和 $C$ 以 $\mp J$ 变化，故 $R + C = R_T$
- 解离常数：使一半受体被结合的配体浓度
- 平衡占据率（虚线等温线）
labels:
  log10_L: 传感图配体 $\log_{10}(L/\mu\mathrm{M})$
  t_assoc: 结合时间
  t_dissoc: 解离时间
  depletion: 配体耗竭
  R_T: 受体浓度 $R_T$
