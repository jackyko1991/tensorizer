source_hash: 0f2f557927c5
title: Квантовая коррекция ошибок ниже порога
summary: 'Код повторения против битовых ошибок распределяет один логический бит по $d$ зашумлённым кубитам и постоянно измеряет их чётности. Тысячи выстрелов Монте-Карло выполняются как один тензор $(S, R, d)$, точный декодер минимального веса читает пространственно-временную историю синдромов, а кривые для $d = 3, 5, 7, 9$ пересекаются на пороге: ниже него каждый шаг $d \to d + 2$ делит логическую частоту ошибок на множитель $\Lambda > 1$ — величину, стоящую за подпороговой памятью на поверхностном коде Google 2024 года.'
notes: 'Код хранит $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$ и $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$; проверки чётности $Z_jZ_{j+1}$ показывают, где соседи расходятся, не раскрывая логического значения. В модели ёмкости кода (один раунд, идеальные проверки) лучший декодер — голосование большинством, и смоделированная $P_L$ следует точному биномиальному хвосту (пунктир) с порогом ровно $p = 1/2$. В феноменологической модели проверки тоже ошибаются при считывании, поэтому одному синдрому доверять нельзя; декодер ищет наименьшее число переворотов данных плюс ошибок считывания, объясняющее всю $d$-раундовую историю. Эту задачу решает минимальное совершенное паросочетание; в 1D она решается здесь точно динамическим программированием по $2^d$ конфигурациям ошибок (поэтому $d \le 11$). Для этой модели порог близок к $p \approx 10\%$ (около 10.3 % при очень больших $d$), и пересечения для малых $d$ ложатся близко к нему, когда каждый код прогоняется $d$ раундов. Ниже порога большие коды
  выигрывают, а $\Lambda = \varepsilon_d/\varepsilon_{d+2}$ растёт с уменьшением $p$ (примерно как $p_{th}/p$); выше порога добавление кубитов лишь добавляет мест для сбоя. Научный контекст: Google Quantum AI and Collaborators, Quantum error correction below the surface code threshold, Nature 638, 920 (2025; arXiv:2408.13687, 2024) запустили память на поверхностном коде с расстояниями 3, 5 и 7 на процессоре Willow и сообщили о $\Lambda \approx 2.1$ с логической ошибкой при расстоянии 7 примерно 0.14 % за цикл (приблизительные значения). Более ранними шагами были коды повторения (Nature 595, 383, 2021) и поверхностный код расстояния 5, немного превзошедший расстояние 3 (Nature 614, 676, 2023). Код повторения против поверхностного кода: код повторения — одномерная линия, исправляющая только битовые ошибки (ошибки $X$) — фазовая ошибка ($Z$) на любом кубите является логической ошибкой, поэтому это не полноценная квантовая память. Поверхностный код — двумерная решётка с проверками как $Z$-типа,
  так и $X$-типа, и он исправляет оба вида; его граф декодирования трёхмерный (два пространственных измерения плюс время), а пороги ниже: около 3 % для этого феноменологического шума и примерно 1 % для реалистичного схемного шума (приблизительно). Упрощения: независимые ошибки, идеальное финальное считывание, без утечки и коррелированных всплесков, которые в реальных устройствах задают нижнюю границу логической частоты ошибок.'
meanings:
- перевороты данных (вероятность $p$) и ошибки считывания проверок (вероятность $q$) для выстрела $s$, раунда $t$
- накопленная ошибка на кубите данных $i$ после раунда $t$
- проверка $j$ сравнивает соседей $i = j$ и $i = j + 1$ ($Z_jZ_{j+1}$)
- 'повторяющийся $i$ ⇒ суммирование: чётность, которую должна сообщить каждая проверка'
- 'изменившийся бит синдрома: конец цепочки ошибок в пространстве–времени'
- самая дешёвая история, заканчивающаяся конфигурацией ошибок $x$, $w = \ln\frac{1-p}{p}$; минимум по $y$ — это $d$ однобитовых переворотов
- 'голосование большинством: оптимальный декодер, когда проверки никогда не ошибаются'
- подавление ошибок за раунд, $1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: Модель шума (с ошибками считывания проверок или без)
  d_max: Наибольшее расстояние $d$ (11 — медленно)
  shots: Выстрелов на точку $(d, p)$
  n_p: Число частот ошибок $p$
  p_min: Наименьшее $p$
  p_max: Наибольшее $p$
  q_ratio: Частота ошибок считывания $q/p$
