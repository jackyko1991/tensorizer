title: Lorentz boost of the field tensor
category: em
level: advanced
order: 1
summary: >
  In relativity $\mathbf E$ and $\mathbf B$ are not separate vectors but the six components of one antisymmetric $4\times 4$ tensor $F^{\mu\nu}$.
  A Lorentz boost transforms it with one $\Lambda$ per index, $F' = \Lambda F\Lambda^{\mathsf T}$, written as a single einsum. Sweeping the boost
  speed shows electric and magnetic fields mixing into each other while $F_{\mu\nu}F^{\mu\nu}$ and $\mathbf E\cdot\mathbf B$ stay fixed.
animated: true
vector_form: '\mathbf E''_\parallel = \mathbf E_\parallel,\;\; \mathbf E''_\perp = \gamma(\mathbf E + \boldsymbol\beta\times\mathbf B)_\perp,\;\; \mathbf B''_\perp = \gamma(\mathbf B - \boldsymbol\beta\times\mathbf E)_\perp'
index_form: 'F''^{\mu\nu} = \Lambda^{\mu}{}_{\alpha}\,\Lambda^{\nu}{}_{\beta}\,F^{\alpha\beta},\qquad F^{0i} = -E_i,\;\; F^{ij} = -\varepsilon_{ijk}B_k'
translation:
  - {symbol: 'F^{\mu\nu}', code: 'field_tensor(E, B, eps)', shape: '(4, 4)', meaning: 'antisymmetric field tensor, $\mu, \nu \in \{t, x, y, z\}$'}
  - {symbol: '\eta_{\mu\nu}', code: 'metric()', shape: '(4, 4)', meaning: 'Minkowski metric $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$'}
  - {symbol: '\Lambda^{\mu}{}_{\alpha}', code: 'boost(beta)', shape: '(S, 4, 4)', meaning: 'boost along $x$ for each of $S$ speeds $\beta$'}
  - {symbol: '\Lambda^{\mu}{}_{\alpha}\Lambda^{\nu}{}_{\beta}F^{\alpha\beta}', code: "einsum('sma,snb,ab->smn', Lam, Lam, F)", shape: '(S, 4, 4)', meaning: 'repeated $\alpha$ and $\beta$ ⇒ summed: one $\Lambda$ per index of $F$'}
  - {symbol: 'F_{\mu\nu}', code: "einsum('ma,nb,...ab->...mn', eta, eta, F)", shape: '(…, 4, 4)', meaning: 'indices lowered with the metric'}
  - {symbol: 'F_{\mu\nu}F^{\mu\nu}', code: "einsum('...mn,...mn->...', F_low, F)", shape: '(S,)', meaning: 'invariant $2(B^2 - E^2)$'}
  - {symbol: 'F_{\mu\nu}\tilde F^{\mu\nu}', code: 'pseudo_invariant(F, eta, eps4)', shape: '(S,)', meaning: 'invariant $-4\,\mathbf E\cdot\mathbf B$, using the dual tensor $\tfrac12\varepsilon^{\mu\nu\rho\sigma}F_{\rho\sigma}$'}
notes: >
  Units with $c = 1$, metric signature $(+, -, -, -)$. The boost is along $x$, so $E_x$ and $B_x$ never change; only the
  transverse components mix. For a pure electric field ($\mathbf B = 0$) the moving observer sees a magnetic field
  $\mathbf B' = -\gamma\,\boldsymbol\beta\times\mathbf E$. Both Lorentz invariants stay constant along the whole sweep.
params:
  Ex: {default: 0.3, min: -2, max: 2, step: 0.1, label: '$E_x$'}
  Ey: {default: 1.0, min: -2, max: 2, step: 0.1, label: '$E_y$'}
  Ez: {default: 0.0, min: -2, max: 2, step: 0.1, label: '$E_z$'}
  Bx: {default: 0.4, min: -2, max: 2, step: 0.1, label: '$B_x$'}
  By: {default: 0.0, min: -2, max: 2, step: 0.1, label: '$B_y$'}
  Bz: {default: 0.5, min: -2, max: 2, step: 0.1, label: '$B_z$'}
  beta_max: {default: 0.95, min: 0.1, max: 0.99, step: 0.01, label: 'Final boost speed $\beta = v/c$'}
