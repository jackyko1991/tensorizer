source_hash: 66c98bbdd023
title: 牛顿冷却定律
summary: 一排热咖啡杯向室温冷却。每杯都有各自的初始温度和冷却常数，但全部存放在一个张量中，因此一行 PyTorch 代码就能同时推进所有杯子——结果与指数解吻合。
notes: 该定律指出，冷却速率与和室温的温差成正比。因此温差在相等时间内按相同比例缩小：每经过 $t_{1/2} = \ln 2/k$ 减半，与初始温度无关。常微分方程用龙格–库塔法（RK4）数值求解，虚线为精确指数解以供比较。实际杯子同时通过对流、辐射和蒸发冷却；$k$ 把这些效应合并为一个数。
meanings:
- 杯子 $b$ 的温度（°C）
- 杯子 $b$ 的冷却常数（1/min）：越大冷却越快
- 室温，广播到每个杯子
- 逐元素运算：不对任何指标求和，每杯各自冷却
- 外积：每个时刻与每个杯子，用于精确解
- 温差减半所需的时间
labels:
  n_cups: 杯数
  T_env: 室温
  k_min: 最慢冷却 $k$
  k_max: 最快冷却 $k$
  t_max: 模拟时长
