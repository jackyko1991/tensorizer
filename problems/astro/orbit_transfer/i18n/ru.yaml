source_hash: c0b25ec18fe5
title: Гомановский и биэллиптический орбитальные переходы
summary: Какое $\Delta v$ нужно, чтобы перевести космический аппарат с одной круговой орбиты на другую? Уравнение vis-viva $v^2 = \mu(2/r - 1/a)$ даёт стоимость двухимпульсного гомановского перехода и трёхимпульсного биэллиптического перехода, а одно пакетное интегрирование RK4 с импульсными манёврами в апсидах проверяет, что каждый аппарат действительно оказывается на целевой орбите.
notes: 'Гомановский переход проходит половину эллипса, касающегося обеих окружностей, $a = (r_1 + r_2)/2$: разгонный импульс $\Delta v_1$ в перицентре и второй импульс $\Delta v_2$ в апоцентре для скругления орбиты, через время $t_H = \pi\sqrt{a^3/\mu}$. Биэллиптический переход сначала поднимается на дальний радиус $r_b$, где аппарат движется медленно и небольшой импульс поднимает противоположную сторону орбиты до $r_2$, а затем тормозит по прибытии. Он занимает намного больше времени, но при $r_2/r_1 \gtrsim 11.94$ достаточно далёкий $r_b$ делает его дешевле (предел $r_b \to \infty$ стоит $(\sqrt2 - 1)(v_{c1} + v_{c2})$), а выше $r_2/r_1 \approx 15.58$ дешевле любой $r_b > r_2$. Обе точки перехода находятся численно методом бисекции, вторая — с производной через autograd. По умолчанию — переход с низкой околоземной орбиты (около 320 км высоты) на геостационарную: около 3.9 км/с и 5.3 ч по Гоману. Выберите Солнце с $r_1 = 1$ а.е. и $r_2 = 1.524$ а.е. для перелёта Земля → Марс: всего примерно
  5.6 км/с в гелиоцентрической системе и около 259 суток (этот случай расчёт выводит всегда). Реальным миссиям также нужно выбраться из гравитационного колодца Земли и дождаться подходящего взаимного расположения планет; здесь орбиты круговые и компланарные, а импульсы мгновенные. Расчёт разбивает интегрирование RK4 на каждом импульсе, чтобы каждый импульс срабатывал точно в апсиде.'
meanings:
- положение аппарата $b$ относительно центра тела, в км
- скорость аппарата $b$, в км/с
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния $r_b^2$'
- притяжение к центру по закону обратных квадратов, $\mu = GM$
- скорость на радиусе $r$ на орбите с большой полуосью $a$; каждое $\Delta v$ — разность двух таких величин
- время и знаковая величина импульса $k$ аппарата $b$ ($\Delta v < 0$ — торможение)
- импульсный манёвр вдоль скорости, применяемый между двумя участками RK4
- сохраняется между импульсами; каждый импульс переводит её к значению $-\mu/2a$ следующей орбиты
- наклон при $r_b = r_2$; он становится отрицательным выше $r_2/r_1 \approx 15.58$
labels:
  body: Центральное тело
  r1: Начальный радиус $r_1$
  r2: Целевой радиус $r_2$
  transfer: Переход
  rb_ratio: Промежуточный радиус биэллиптического перехода $r_b / r_2$
