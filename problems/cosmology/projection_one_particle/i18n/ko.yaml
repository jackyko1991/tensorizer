source_hash: 63ac7ba591c6
title: '여러 번 보이는 하나의 입자: 단일 세계선 자르기'
summary: 확립된 물리가 아닌 추측성 가설이다. 모든 전자는 같은 대상, 즉 시간 속에서 앞뒤로 지그재그하는 하나의 세계선이라는 것이다(Wheeler 의 1940년 단일 전자 우주). 시간 조각 하나가 이를 여러 번 자른다. 앞으로 가는 교차는 전자처럼, 뒤로 가는 교차는 양전자처럼 보인다. 이 단계는 무작위 세계선 묶음을 자른다. 모든 전자는 정확히 동일하게 나오고, 전환점에서 쌍이 생성되고 소멸한다. 그러나 닫힌 세계선은 모든 조각을 앞으로와 똑같은 횟수만큼 뒤로 지나고, 열린 세계선은 많아야 하나의 순입자를 더할 뿐인데, 우주에는 약 $10^{80}$ 개의 바리온이 있고 반물질은 거의 없다. 가장 단순한 형태에서 이 생각은 배제된다.
notes: '상태: 추측성; 가장 단순한 형태에서는 배제됨. 사영 가설(저자 자신의 추측성 아이디어, 시리즈 설명 참조; 확립된 물리가 아님)의 2단계로, 공준 P3 에 해당한다. 모든 입자는 하나의 대상의 사영이다. 1단계(cosmology/projection_postulate)는 공준을 진술했고, 3단계(cosmology/projection_dimension_budget)는 그것들에 필요한 차원을 센다. 먼저 알려진 물리. 1940년 한 통의 전화에서 John Wheeler 는 Richard Feynman 에게, 모든 전자가 동일한 것은 그것들이 하나의 전자이기 때문이며 그 세계선이 시간 속에서 앞으로도 뒤로도 달린다고 제안했다. 뒤로 가는 구간이 양전자다. Feynman 은 1965년 노벨 강연에서 이 이야기를 자신의 반론과 함께 전했다. 양전자는 전자만큼 많지 않다는 것이다. Wheeler 는 그것들이 양성자 속에 숨어 있을지 모른다고 했다. 양전자가 시간을 거슬러 가는 전자라는 생각은 반입자에 대한 Feynman–Stueckelberg 그림으로 살아남았지만(Feynman, Phys. Rev. 76, 749, 1949), 단일 전자 우주는 그렇지 못했다. 양자장론에서 모든 전자가 동일한 것은 그것들이 하나의 장의 들뜸이기 때문이다. 여기서 세계선은 $D$ 차원 공간에 있다($D$ 는 매개변수이며 결코 4로 고정하지 않는다). P2 가 말하듯 조각에 중요한 것은 시간 좌표뿐이다. 가설의 예측: 시간 조각 하나(P2)가 세계선을 앞으로 가는 교차 $N_+$ 개와 뒤로 가는 교차 $N_-$ 개에서 자른다. 계산하는 것: 매끄러운(무작위 푸리에, 조화파 $K$ 개, 진폭 $\propto k^{-\beta}$) 세계선과 거친(브라운) 세계선의 묶음, 닫힌 것 또는 열린 것을 $L$ 개의 조각으로 자른다. 교차는 차분 배열로의 scatter 로 세고, 전수 대입 표와 대조해 확인한다. 닫힌 고리에서는 모든 조각에서 $N_+ = N_-$ 이다. 열린 세계선에서는 $Q
  = N_+ - N_-$ 가 $[t_{end}\geq u] - [t_{start}\geq u]$ 와 같으므로 $|Q|\leq 1$ 이고 $N\equiv Q$ (mod 2)이다. 조각을 기울여도(움직이는 관측자) $Q$ 는 바뀌지 않는다. 전체 개수는 조각 아래의 $2(\#\text{minima} - \#\text{maxima})$ 와 같으므로, 쌍은 $t(s)$ 의 극소에서 태어나고 극대에서 사라진다. 무작위 매끄러운 고리의 평균 개수는 Rice 공식을 따른다. 공짜로 맞히는 것: 모든 교차는 같은 세계선의 질량과 전하를 읽으므로 모든 전자는 정확히 같고, 양전자는 정확히 반대 전하와 같은 질량을 가진다(PDG 2024: $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$). 데이터와의 대조(data/*.csv, 인용된 수치): AMS-02 는 0.5 GeV 부터 1 TeV 까지 우주선 양전자 비율 $e^+/(e^+ + e^-)$ 를 측정했다(Aguilar et al., PRL 110, 141102, 2013; PRL 122, 101101, 2019, CC-BY 4.0, CRDB 데이터베이스를 통한 74개 구간). 0.6 GeV 에서 0.13, 8 GeV 근처에서 최솟값 0.053, 200 GeV 이상에서 0.15 에서 0.16 이다. 따라서 비대칭 $1 - 2f$ 는 0.67 과 0.89 사이이며, 닫힌 고리의 $0$ 과 대조된다. 우주적 규모에서는 Planck 2018 바리온 밀도 $\Omega_b h^2 = 0.0224$ 가 $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ 을 준다(cosmology/baryon_asymmetry 참조). cm$^3$ 당 광자 411개, 반지름 465억 광년인 구에서 이는 $N_B\approx 9\times10^{79}$ 개의 바리온이며, 반물질은 없다(BESS-Polar: 반헬륨/헬륨 $6.9\times10^{-8}$
  미만; Cohen, De Rújula, Glashow 1998: 보이는 우주에 반물질 영역 없음). 단일 세계선은 많아야 $|Q|/N = 1/N$ 을 주며, $N\approx 1.5\times10^{89}$ 일 때 이는 $7\times10^{-90}$ 으로 $\eta = 6\times10^{-10}$ 과 대조된다. 순전하가 약 $10^{80}$ 배 모자란다. 열린 매개변수에 대한 조사(매끄러운 것 또는 브라운, 닫힌 것 또는 열린 것, 조화파 2 에서 32 개, 세 가지 거칠기, $N\geq 2$ 인 조각 약 $3\times10^5$ 개)는 AMS-02 비대칭에 이르는 배치를 하나도 찾지 못하며, 한계는 그런 배치가 있을 수 없음을 보여 준다. 교차가 $N\geq 2$ 개이면 가능한 최대 비대칭은 $1/3$ ($N = 3$ 에서)이다. 판정: 가장 단순한 형태에서는 배제됨. 확장들, 각각 추가 가정이며 그렇게 표시함: (A) 열린 세계선은 순입자 하나를 더할 뿐, 그 이상은 아니다. (B) 관측자가 효율 $r$ 로 반입자를 보는 편향된 사영은, AMS-02 로부터 0.056 과 0.195 사이에서 에너지에 따라 변하는 $r = f/(1-f)$ 를 요구하지만, 반헬륨으로부터는 $r < 7\times10^{-8}$ 을 요구한다. 그러면 숨은 반물질은 보이는 바리온만큼 무거워, 암흑물질의 약 0.19 가 된다. 이것은 Wheeler 의 ''양성자 속에 숨어 있다''의 현대판이며, 메커니즘이 필요하지만 아무것도 주어지지 않았다. (C) 시간이 원이라면 $w$ 번 감긴 고리는 모든 조각에서 순전하 $Q = w$ 를 가지지만(확인함), $w\approx 10^{80}$ 은 손으로 넣어야 하고, 콤팩트한 시간은 닫힌 시간꼴 곡선을 뜻한다. 이 중 어느 것도 예측이 아니다. 이 생각을 되살릴 수 있는 것은 단일 대상의 조각 개수를 비대칭으로 만드는 메커니즘이며, 그것이 이 단계가 시리즈에 남기는 열린 질문이다. 탈출로: 단순한 형태는 배제되었지만, 반물질이 우리 지평선 너머나
  CPT 거울 반우주에 있는, 전체적으로 균형 잡힌 세계선은 배제되지 않았다. 7단계(cosmology/projection_antimatter_universe)는 그러한 반물질 우주가 만족해야 할 기준들을 나열하고 각각을 데이터로 검증한다.'
meanings:
- '반복된 $k$ (조화파)와 $c$ (cos, sin) ⇒ 합: $D$ 차원 속 무작위 세계선 $B$ 개; 좌표 0 은 시간'
- 모든 조각의 앞으로 가는(입자) 교차와 뒤로 가는(반입자) 교차; 선분 $s$ 에 대한 합은 차분 배열로의 scatter 와 누적합
- 조각 위의 순전하; 두 끝점의 교차수와 같으며 닫힌 고리에서는 $0$
- '전환점만으로 얻는 같은 개수: 극소는 쌍을 만들고 극대는 소멸시킨다'
- 스펙트럼 모멘트 $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$ 를 쓰는 Rice 공식
- 에너지 $E$ 에서의 AMS-02 양전자 비율 $f_E$ 로부터 얻은 우주선 $e^\pm$ 의 전하 비대칭
- 하나의 세계선이 지녀야 할 순 바리온 수(Planck 2018 의 $\eta$)
labels:
  worldlines: 묶음 속 세계선 수 $B$
  samples: 각 세계선을 따라가는 표본 수 $S$
  modes: 좌표당 조화파 수 $K$ (얼마나 자주 지그재그할 수 있는지)
  roughness: '거칠기 $\beta$: 조화파 $k$ 의 진폭은 $\propto k^{-\beta}$'
  dims: 세계선이 사는 공간의 차원 $D$ (열려 있음)
  slices: 시간 조각 수 $L$
