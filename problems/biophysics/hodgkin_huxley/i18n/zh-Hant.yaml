source_hash: 9c0f102b3159
title: Hodgkin–Huxley 動作電位
summary: 1952 年的魷魚巨大軸突模型：一個膜電容由鈉離子與鉀離子通道放電，其閘門 $m$、$h$、$n$ 隨電壓開啟與關閉。四十一條軸突各受不同的階躍電流驅動，在單一 $(4, B)$ 張量中一起積分，以找出發放閾值以及發放頻率對電流的關係。
notes: Hodgkin 與 Huxley（1963 年諾貝爾獎）以電壓箝制量測魷魚巨大軸突的鈉電流與鉀電流，並以三種閘門擬合。鈉電流經由 $m^3$ 快速開啟，再經由失活閘門 $h$ 較慢地關閉；鉀電流則經由 $n^4$ 較晚開啟。一個尖峰就是兩者的競賽：小幅去極化開啟 $m$，流入的 $\mathrm{Na}^+$ 使膜進一步去極化（正回饋），$V$ 衝向 $E_{Na}$；接著 $h$ 關閉、$n$ 開啟，$V$ 回落甚至過衝到靜止電位以下。在持續的階躍電流下，模型呈現三種狀態。低於約 2.3 µA/cm² 時，膜只被被動充電。介於此值與約 6.3 µA/cm² 之間時，它發放單一尖峰後便穩定下來，因為失活與鉀電流把它維持在新的靜止狀態。高於此值則重複發放，而且頻率不是從零開始，而是跳到約 50 Hz：魷魚軸突是第 II 型（共振型）神經元，其靜止態經由 Hopf 分岔失去穩定性，不同於可以任意緩慢發放的第 I 型神經元。之後 f–I 曲線緩慢上升，在 10 µA/cm² 時約為 68 Hz。速率函數具有可去奇點，$0.1(V+40)/(1 - e^{-(V+40)/10})$ 在 $V = -40$ mV 處為有限值，因此程式透過 $x/(1 - e^{-x})$ 並取安全極限來計算。原始實驗在 6.3 °C 下進行；加溫會使每個閘門加速 $\phi = 3^{(T - 6.3)/10}$ 倍，讓尖峰變窄、發放變快，直到約 30 °C 以上軸突完全無法發放。簡化：空間箝制的膜片（不沿軸突傳導）以及確定性的通道。
meanings:
- 軸突 $b$ 的刺激電流，於 10 ms 開啟的階躍（µA/cm²）
- 每條軸突的膜電位與閘門 $g = (m, h, n)$
- 各閘門的開啟與關閉速率（1/ms），即經典的魷魚軸突擬合
- 通道 $k$ = Na、K、漏電流的開啟比例
- 最大電導（120、36、0.3 mS/cm²）與反轉電位（50、−77、−54.4 mV）
- 總離子電流；重複的 $k$ ⇒ 對各通道求和
- 溫度因子（$Q_{10} = 3$）：每升高 10 °C，每個閘門加速 3 倍
- 由尖峰間隔求得的穩定發放頻率（Hz）
labels:
  I_max: 最大刺激 $I_{max}$
  t_end: 模擬時間
  temp: 溫度 $T$
