title: 分開訓練，以 DAG 張量拼接：一個 CNN 與一個微型 LM
summary: 一個小型 CNN 學習 MNIST 數字，一個微型字元級 GPT 學習「three+two=five.」這類句子，兩者各自獨立訓練。接著以一條 DAG 邊將它們連接：連接器把 CNN 的特徵轉換成軟 token，取代句子的第一個單字，於是 LM 對「[一張 3 的影像]+two=」回答「five」。整個訓練流程本身也是一個張量 DAG（規則分層、max-plus 關鍵路徑、每條規則對所有種子只做一次批次呼叫），並與同一網路在相同計算量（乘加次數）下、只在聯合任務上端對端訓練的結果比較。拼接邊也被寫成一個固定路由器的混合專家（MoE）層，並檢驗學習式路由器能否勝任。
notes: 構想。網路可以先分開訓練，再透過 DAG 張量連接，然後進行全域最佳化，而整個流程本身也可以由 DAG 張量控制。這個構想來自 Jacky Ka Long Ko；本問題在一個小型 CNN 與一個微型字元級 LM 上檢驗它，刻意不採用從零開始聯合訓練的視覺語言模型，並正是與這種非 DAG 的替代方案相比較。哪些是新的，哪些不是。以分別預訓練的影像編碼器、預訓練的 LM 與一個小型可學習連接器組成多模態模型，正是 LLaVA（Liu et al. 2023，以線性或 MLP 投影映射到 LM 的 token 空間）與 BLIP-2（Li et al. 2023，在凍結的影像編碼器與凍結的 LLM 之間加入 Q-Former）的做法；Frozen（Tsimpoukelli et al. 2021）如同本問題，將影像以軟前綴的形式輸入凍結的 LM；而模型拼接（Lenc and Vedaldi, CVPR 2015, arXiv 2014；Bansal et al. 2021）則以一個小型可訓練層連接兩個已訓練的網路。本問題新增的是編排：模型圖與訓練流程都由 Circle of Willis 工作流程問題的張量 DAG 引擎執行（規則圖、Kronecker 作業圖、布林分層、max-plus 關鍵路徑），並將以 DAG 建構的模型與單體模型相比較。任務與模型。一個 CNN（兩個 5×5 卷積，8474 個權重）從 3000 張 MNIST 影像學習十個數字。一個兩層 GPT（d = 32，四個注意力頭，27 543 個權重，採用來自 chain_of_thought、帶模型軸的 einsum 注意力）學習 300 個「a op b = r.」形式的句子，其中 op 為模 10 的 +、−、×，數字以英文單字書寫（「three+two=five.」，第一個單字靠右對齊於 5 個字母的欄位中）。聯合任務給出一張數字 a 的 MNIST 測試影像與文字「+two=」；運算元單字不在文字中。DAG 邊是一個連接器（3808 個權重）：由 CNN 的十個數字機率 $q$ 與一個欄位向量 $S_t$，產生 $K = 5$ 個軟 token $c_t = \mathrm{GELU}(qW_1 + S_t)W_2 + b_2$，在 LM 輸入端取代運算元欄位。（試驗中改為輸入 CNN
  倒數第二層的特徵時學習慢得多：連接器訓練 100 步後聯合準確率約 0.25，相較之下前者約 0.6。）準確率是指在給定真實前綴時，答案的每個字母與句點都是 LM 首選的測試樣本比例，這正是貪婪解碼會寫出的結果。以 DAG 表示訓練流程。data/training.smk 列出各條規則；引擎以 Circle of Willis 的剖析器剖析它並逐層執行，每條規則以「一次」批次呼叫處理其所有模型，這些模型堆疊在一個模型軸上（種子 × 聯合資料集大小 $n$）：第 0 層 train_cnn ∥ train_lm ∥ train_monolith；第 1 層 train_connector（CNN 與 LM 凍結，經由 $I \otimes \mathbb 1$ 區塊由種子廣播到 (種子, $n$)）；第 2 層 global_finetune（全部參數，穿過該邊端對端訓練，學習率小 100 倍）∥ 兩個學習式路由器；第 3 層 evaluate。在 2 個種子與 4 種大小下：8 條規則、45 個作業、84 條作業邊，$A$ 為冪零矩陣。測試檢查分層是否正確、循環是否被拒絕、兩個種子在同一堆疊中訓練所得的損失是否與各自單獨訓練時相同（Adam 是逐元素運算，梯度裁剪按模型進行），以及一個模型的損失傳給其他模型的梯度是否為零。基準模型。單體模型是同樣的 CNN + 連接器 + LM（39 825 個權重），隨機初始化，並僅在聯合樣本上端對端訓練。它的預算以每個模型的乘加次數匹配：DAG 流程的 150 步 CNN、600 步 LM、150 步連接器與 80 步微調（批次大小 32）的成本相當於 682 步聯合訓練，單體模型即獲得這麼多步（每個模型都完整計入每項預訓練，儘管在 DAG 中一個預訓練好的 CNN 與 LM 服務全部四個 $n$ 值）。結果（2 個種子，1000 張測試影像，隨機猜測為 0.1，CPU）。多執行緒浮點歸約使重複執行的結果相差數個百分點，因此以下數字是四次完整執行中種子平均值的範圍；results/stages.csv 保存隨附執行的確切數字。單獨使用時，CNN 能正確讀出 0.89 的測試數字，LM 能完成 0.97 至 0.99 的文字提示；把 CNN 的數字寫成文字交給 LM，得分 0.88 至 0.89，這是本流程的上限。在 $n$ =
  100、300、1000、3000 個聯合樣本下的聯合準確率：未訓練的連接器約 0.16；連接器階段後 0.41–0.47、0.58–0.63、0.60–0.69、0.64–0.68；全域微調後 0.41–0.47、0.63–0.67、0.68–0.75、0.71–0.75；單體模型 0.14、0.13–0.15、0.16–0.17、0.23。以 DAG 建構的模型在每次執行、每個 $n$ 都勝出，在聯合資料稀少時差距最大，而從 $n$ = 300 起微調再增加 0.03 至 0.08（在 $n$ = 100 時平均而言沒有變化）。原因很簡單：DAG 重複利用單模態資料（3000 個有標記的數字與所有句子），而單體模型必須僅從 $n$ 個答案單字中自行發現數字與算術，且 × 常常會隱藏運算元（任何數 × 0 = 0）。若有更多步數或資料，單體模型會進步（在預算結束時它的損失仍在下降）：這是小預算下的比較，而非定律。DAG 邊 = MoE 分派。同一個輸入層可寫成混合專家：專家 img（CNN + 連接器）與專家 txt（LM 的 token 嵌入），一個作用於位置 × 專家的路由器 $G$，每個專家對分派給它的位置批次執行，再以 $X^0 = G_{mntx}Y^x_{mntc}$ 合併。當 $G$ 依資料類型為 one-hot（影像欄位或字母，在看到任何資料前即已知，正如工作流程依萬用字元選擇規則）時，MoE 輸出與 DAG 接線的輸出在 1e-6 以內一致，所有梯度亦然（已測試）。精確的關係是：DAG 邊是一個由資料類型決定、路由器固定的 MoE 分派；MoE 則是一個其邊由學習式路由器逐 token 選擇的 DAG。路由器能學會這種路由嗎？在專家凍結的情況下，以 Switch 負載平衡損失（$\alpha$ = 0.01）訓練一個作用於每個位置特徵（7×7 池化影像與 one-hot id）的線性路由器。Switch top-1（只執行被選中的專家，並乘以 $p$）並不可靠：在各模型與各次執行中，它的路由準確率介於 0 至 0.92，任務準確率介於 0 至約 0.46，原因是未被選中的專家得不到梯度，因此早期的錯誤選擇永遠不會被修正，而平衡損失又把分配拉向 50/50，但真實的比例是 5/17。若以稠密混合（$G = p$，兩個專家在所有位置都執行）訓練，再以
  top-1 使用，路由器在每個模型與每次執行中都能恢復模態路由（0.97 至 0.99 的位置），並達到約 0.35 至 0.65 的任務準確率，略低於固定路由器，因為 $p < 1$ 會縮放輸出。當正確的邊可由資料類型得知時，將它固定既精確又更便宜。時間。在 6 核心桌上型 CPU 上，機器空閒時預設執行的訓練約需 66 s（與其他繁重作業共用時可達 2 至 4 分鐘），另需約 15 s 產生 GIF：在空閒的那次執行中，單體模型耗時 35 s，LM 12 s，連接器 4.5 s，微調 4 s。每條規則一個工作者時，max-plus 關鍵路徑是單體模型再接 evaluate（39 s）；DAG 系統自身的鏈 LM → 連接器 → 微調 → evaluate 約需 24 s。當 torch 偵測到 GPU 時，程式碼會使用 GPU；本專案環境中的 torch 為 CPU 版本，因此所有隨附數據都來自 CPU。資料。MNIST（Y. LeCun, C. Cortes, C. J. C. Burges），授權 CC BY-SA 3.0：隨附一個平衡子集，含 3000 張訓練影像與 1000 張測試影像（data/mnist_subset.npz，0.7 MB；data/SOURCES.md 載明來源、校驗和與處理方式）。句子由程式碼產生。試試看。減少 LM 步數（LM 的準確率是一切的上限）、加大 $\alpha$（Switch 路由器崩潰得更嚴重）、不做微調（0 步），或只用一個種子，看看各種子之間的差異有多大。
meanings:
- 規則 $s$ 讀取規則 $r$ 所寫出的內容；訓練流程由 data/training.smk 以 Circle of Willis 問題的剖析器剖析而得
- 在萬用字元 seed 與 $n$ 上的作業圖：不含 $n$ 的規則廣播到每個 $n$（$I \otimes \mathbb 1$），evaluate 收集全部（$\mathbb 1^\top$）
- 每條規則的層級：train_cnn、train_lm 與單體模型在第 0 層，連接器在第 1 層，微調與路由器在第 2 層，evaluate 在第 3 層
- 由實測規則耗時得出的 max-plus 完成時間；$\max t$ 即關鍵路徑
- CNN 對每張影像給出的十個數字機率；模型軸 $m$ 成為每層一次分組卷積中的各組
- DAG 邊：數字機率加上欄位向量 $S_t$ → 位置 $t$ 的 LM 輸入向量；$K = 5$ 個軟 token 取代被隱藏的第一個單字
- 路由器：依資料類型（影像欄位或字母）的 one-hot，或作用於位置特徵、學習而得的 Switch top-1 softmax
- 重複的 $x$ ⇒ 求和：MoE 層的合併；每個專家 $Y^x$ 只在分派給它的組上計算
- 微型 GPT 的下一字母 logits（帶模型軸的 einsum 注意力，來自 chain_of_thought）
- 每個模型在前綴之後文字上的損失（nats）；將 $M$ 個損失相加，每個模型都得到自己的梯度
labels:
  seeds: 種子（獨立重複）
  steps_cnn: CNN 預訓練步數
  steps_lm: LM 預訓練步數
  steps_con: 連接器步數（CNN 與 LM 凍結）
  steps_ft: 全域微調步數
  steps_router: 學習式路由器步數（每個路由器）
  lr_ft: 微調學習率
  alpha: 負載平衡權重 $\alpha$
