source_hash: ebe74e0d5d26
title: Renversement du temps et CPT avec les kaons neutres
summary: 'Un kaon neutre est un système à deux états ($K^0$, $\bar K^0$) qui oscille et se désintègre ; il évolue donc sous un hamiltonien non hermitien $2\times 2$ $H = M - i\Gamma/2$. Construit à partir des valeurs du PDG et exponentié pour un lot de mondes à tous les instants à la fois, il montre l''étrangeté oscillant à $\Delta m$, l''interférence $\pi\pi$ violant CP, et le test du renversement du temps de CPLEAR : $K^0 \to \bar K^0$ et $\bar K^0 \to K^0$ diffèrent de $A_T \approx 4\,\mathrm{Re}\,\varepsilon \approx 6.5\times 10^{-3}$, tandis que CPT maintient l''égalité de masse et de durée de vie entre $K^0$ et $\bar K^0$.'
notes: 'C (conjugaison de charge) échange particules et antiparticules, P (parité) renverse l''espace comme un miroir et T renverse le temps. Le théorème CPT (Lüders, Pauli, Schwinger) affirme que toute théorie quantique des champs locale et invariante de Lorentz est symétrique sous les trois opérations combinées, de sorte qu''une particule et son antiparticule ont exactement les mêmes masses et durées de vie. En 1964, Christenson, Cronin, Fitch et Turlay ont observé la désintégration du $K_L$ à longue durée de vie en deux pions, interdite par CP : CP est violée, au niveau $|\varepsilon| \approx 2.2\times 10^{-3}$ (prix Nobel 1980 décerné à Cronin et Fitch). Si CPT est respectée, la violation de CP implique aussi la violation de T, et CPLEAR au CERN l''a observée directement en 1998 : en partant de $K^0$ et $\bar K^0$ étiquetés et en étiquetant l''étrangeté à la désintégration grâce aux désintégrations semi-leptoniques, $\bar K^0 \to K^0$ se produit un peu plus souvent que $K^0 \to \bar
  K^0$, $\langle A_T\rangle = (6.6 \pm 1.3 \pm 1.0)\times 10^{-3}$ (l''interprétation comme violation de T suppose la règle $\Delta S = \Delta Q$ et l''absence de violation de CPT dans les désintégrations). Ici, $H$ est construit à partir de ses états propres, si bien que le paramètre CP $\varepsilon$ et le paramètre CPT $\delta$ sont des boutons réglables : avec $\delta = 0$, $H_{11} = H_{22}$ (masses et durées de vie égales), $P(K^0\to K^0) = P(\bar K^0\to\bar K^0)$ et $A_T$ forme un plateau plat à $(|p/q|^2 - |q/p|^2)/(|p/q|^2 + |q/p|^2) \approx 4\,\mathrm{Re}\,\varepsilon$ ; un $\mathrm{Re}\,\delta$ non nul fait monter $A_{CPT} = [P(\bar K^0\to\bar K^0) - P(K^0\to K^0)]/[\ldots]$ jusqu''à $4\,\mathrm{Re}\,\delta$ après quelques $\tau_S$ (CPLEAR a trouvé $\mathrm{Re}\,\delta$ compatible avec zéro au niveau de $10^{-4}$). Le panneau du bas montre l''interférence classique $\pi^+\pi^-$ entre les désintégrations de $K_S$ et de $K_L$, maximale vers $12\,\tau_S$, à partir de laquelle on mesure
  $|\eta_{+-}|$ et $\phi_{+-}$. L''unitarité est vérifiée avec la relation de Bell–Steinberger $(i\Delta m + \bar\Gamma)\langle K_S|K_L\rangle = \sum_f A_S^* A_L$ ; en supposant la dominance $\pi\pi$, le $\eta_{+-}$ mesuré prédit $\mathrm{Re}\,\varepsilon$ à 0,2 % près. Valeurs : PDG 2024 ($\tau_S = 0.8954\times10^{-10}$ s, $\tau_L = 5.116\times10^{-8}$ s, $\Delta m = 0.5293\times10^{10}\,\hbar$/s, $|\varepsilon| = 2.228\times 10^{-3}$, $\phi_\varepsilon = 43.52°$, $|\eta_{+-}| = 2.232\times10^{-3}$) ; CPLEAR, Phys. Lett. B 444 (1998) 43. Simplifications : la violation directe de CP ($\varepsilon''$, $10^{-3}$ de $\varepsilon$) est négligée, donc $\eta_{+-} = \varepsilon$ ; l''étiquetage semi-leptonique est idéalisé en une mesure parfaite de l''étrangeté ; et aucune régénération dans la matière.'
meanings:
- colonnes $K_S \propto (1+\varepsilon_S, 1-\varepsilon_S)$, $K_L \propto (1+\varepsilon_L, -(1-\varepsilon_L))$ avec $\varepsilon_{S,L} = \varepsilon \pm \delta$
- $\mp\Delta m/2 - i\Gamma_{S,L}/2$ en unités de $\hbar/\tau_S$ (la masse commune est une phase globale)
- '$i$ répété ⇒ sommé : un hamiltonien effectif par monde'
- $e^{-iHt}$ à chaque instant, vérifié avec matrix_exp
- probabilité qu'un kaon né $b$ soit trouvé $a$ ($0 = K^0$, $1 = \bar K^0$)
- 'hermitienne et $\ge 0$ : unitarité, relation de Bell–Steinberger'
- vecteur ligne avec $a\cdot K_S = 1$, $a\cdot K_L = \eta_{+-}$
- '$x$ répété ⇒ sommé : taux de désintégration $\pi^+\pi^-$ d''un faisceau né $K^0$ ou $\bar K^0$'
labels:
  eps_abs: $|\varepsilon|$
  eps_phase: Phase $\phi_\varepsilon$
  re_delta: Violation de CPT $\mathrm{Re}\,\delta$
  dm: Différence de masse $\Delta m$
  t_max: Fenêtre temporelle $t_\mathrm{max}$
