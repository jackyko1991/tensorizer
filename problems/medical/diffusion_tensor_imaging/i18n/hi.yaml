source_hash: 27367fbd090e
title: 'विसरण टेंसर इमेजिंग: तंत्रिका तंतुओं का मानचित्रण'
summary: जल एक्सॉन के अनुदिश उनके आर-पार की तुलना में तेज़ी से विसरित होता है, इसलिए हर वॉक्सेल का एक विसरण टेंसर $D_{ij}$ होता है। स्टेस्कल–टैनर संकेत $S = S_0\,e^{-b\,\hat g_i D_{ij}\hat g_j}$ वॉक्सेलों और प्रवणता दिशाओं पर एक einsum है; लॉग-संकेतों का बैच न्यूनतम-वर्ग फ़िट $D_{ij}$ को पुनः प्राप्त करता है, उसका आइगेन-विघटन माध्य विसरणशीलता, आंशिक विषमदैशिकता (FA) और तंतु की दिशा देता है, और RK2 से उस दिशा का अनुसरण करने पर तंत्रिका बंडल अनुरेखित होते हैं (ट्रैक्टोग्राफी)।
notes: 'विसरणशीलताएँ $10^{-3}\,\mathrm{mm^2/s}$ में और $b$ $\mathrm{s/mm^2}$ में है: बंडल में लगभग $\lambda_\parallel = 1.7$, $\lambda_\perp = 0.3$ (FA ≈ 0.8), मुक्त जल (CSF) के लिए 3.0 और धूसर द्रव्य के लिए 0.8। ये शिक्षण के लिए अनुमानित मान हैं, नैदानिक उपयोग के लिए नहीं। शोर राइसी (Rician) है (एक सम्मिश्र संकेत का परिमाण), इसलिए शोरयुक्त फ़िट समदैशिक क्षेत्रों में FA को अधिक आँकते हैं। जहाँ दो बंडल एक-दूसरे को काटते हैं, वहाँ एक टेंसर केवल उनका औसत दर्शा सकता है, कम FA वाला एक चपटा (समतलीय) टेंसर, और उसमें प्रवेश करने वाला ट्रैक्ट रुक सकता है या गलत मोड़ लेकर दूसरे बंडल में जा सकता है: यह DTI की क्लासिक सीमा है जिसे बहु-तंतु मॉडल संबोधित करते हैं। हर दीर्घवृत्त फ़िट किए गए टेंसर की तल-में आकृति दिखाता है। धारारेखाएँ बीज-बिंदुओं से शुरू होकर, द्विरैखिक रूप से अंतर्वेशित टेंसर क्षेत्र के मुख्य आइगेनसदिश का मध्यबिंदु (RK2) नियम से तब तक अनुसरण करती हैं जब तक FA 0.2 से नीचे न गिर जाए। अधिक शोर, कम प्रवणता दिशाएँ या छोटा $b$ आज़माइए।'
meanings:
- एक गोलार्ध पर फैली इकाई विसरण-प्रवणता दिशाएँ
- 'हर वॉक्सेल का वास्तविक विसरण टेंसर: बंडल $\lambda_\parallel e_ie_j + \lambda_\perp(\delta_{ij} - e_ie_j)$, समदैशिक CSF और धूसर द्रव्य'
- 'दोहराए गए $i, j$ ⇒ योग: हर दिशा के लिए हर वॉक्सेल का विसरण-भारित संकेत'
- पंक्तियाँ $(g_x^2, g_y^2, g_z^2, 2g_xg_y, 2g_xg_z, 2g_yg_z)$ ताकि $\hat g_i D_{ij}\hat g_j = B_{gm}d_m$
- छह अद्वितीय टेंसर घटकों का न्यूनतम-वर्ग फ़िट, सभी वॉक्सेलों के लिए एक साथ
- आइगेनमान और आइगेनसदिश; सबसे बड़े आइगेनमान का आइगेनसदिश तंतु के अनुदिश इंगित करता है
- माध्य विसरणशीलता (ट्रेस/3) और आंशिक विषमदैशिकता (0 समदैशिक, 1 एकल दिशा)
labels:
  b: विसरण भारण $b$
  n_dirs: प्रवणता दिशाएँ
  noise: शोर स्तर $\sigma/S_0$
  size: प्रति भुजा वॉक्सेल
