source_hash: 3955d9d3b7d9
title: Ферментативная кинетика Михаэлиса–Ментен
summary: 'Фермент связывает субстрат, образует комплекс и высвобождает продукт: $E + S \rightleftharpoons ES \to E + P$. Полные уравнения закона действующих масс решаются сразу для трёх ферментов и целого титрования субстрата в одном тензоре $(4, B, C)$ и сравниваются с квазистационарным законом скорости $v = V_{max} S/(K_m + S)$ и аппроксимацией Лайнуивера–Берка.'
notes: 'Один лишь закон действующих масс даёт четыре связанных ОДУ. Михаэлис и Ментен (1913), в формулировке Бриггса и Холдейна (1925), заметили, что комплекс $ES$ накапливается за доли секунды, а затем меняется лишь медленно, так что можно положить $d[ES]/dt \approx 0$. Вместе с $E + ES = E_0$ это даёт $[ES] = E_0 S/(K_m + S)$ и закон скорости $v = k_2 [ES] = V_{max} S/(K_m + S)$, где $K_m = (k_{-1} + k_2)/k_1$ и $V_{max} = k_2 E_0$. Точки на средней панели показывают текущее $(S, k_2 [ES])$ каждой пробирки: после начального всплеска они ложатся на штриховую кривую и скользят по ней вниз по мере расходования субстрата — это и есть квазистационарное приближение (QSSA) в действии. Редуцированная модель $dS/dt = -V_{max} S/(K_m + S)$ (оранжевый пунктир) даже имеет точное решение, $S_0 - S + K_m \ln(S_0/S) = V_{max} t$. Приближение справедливо при $E_0 \ll S_0 + K_m$; поднимите $E_0$ до 2 µM и посмотрите, как полная кинетика отстаёт от QSSA, потому что субстрат, запертый в комплексе, уже не
  пренебрежимо мал. Биохимики измеряют начальную скорость $v_0$ при нескольких $S_0$ и аппроксимируют $1/v_0 = (K_m/V_{max})(1/S_0) + 1/V_{max}$ прямой линией (Лайнуивер–Берк, 1934): отрезок на оси $y$ равен $1/V_{max}$, а на оси $x$ — $-1/K_m$. График в двойных обратных координатах усиливает ошибки при малых $S_0$, поэтому для зашумлённых данных лучше прямая нелинейная аппроксимация. Ферменты A, B и C жертвуют сродством ради скорости или наоборот: у A малая $K_m$, у C наибольшая $k_{cat}$; каталитическая эффективность $k_{cat}/K_m$ решает, кто выигрывает при низкой концентрации субстрата. Упрощения: один активный центр, необратимое высвобождение продукта, отсутствие ингибирования и хорошо перемешанный объём.'
meanings:
- константы скорости связывания, диссоциации и катализа фермента $b$ ($k_2 = k_{cat}$)
- начальная концентрация субстрата $c$ в титровании (µM)
- свободный фермент, субстрат, комплекс $X = ES$ и продукт в каждой пробирке
- 'суммирования по индексам нет: $k_b$ транслируется на каждую концентрацию $c$'
- правая часть для RK4; $E + X = E_0$ и $S + X + P = S_0$ остаются постоянными
- константа Михаэлиса (концентрация субстрата при половинной скорости) и максимальная скорость
- начальная (стационарная) скорость, измеряемая после короткого всплеска
- нормальные уравнения Лайнуивера–Берка, $A_{ck} = [1/S_c,\ 1]$; повторяющийся $c$ ⇒ суммирование
- наклон $K_m/V_{max}$ и отрезок $1/V_{max}$ для каждого фермента
labels:
  E0: Фермент $E_0$
  t_end: Время моделирования
  enzyme: Фермент для кинетических кривых
