source_hash: 73d953345169
title: Подгонка космологической постоянной по сверхновым
summary: '1466 настоящих сверхновых типа Ia из открытой компиляции Pantheon+ подгоняются вселенной Фридмана с веществом $\Omega_m$, космологической постоянной $\Omega_\Lambda$ и кривизной. Один пакетный $\chi^2$ оценивает тысячи вселенных сразу на каждой сверхновой и рисует доверительные контуры $\Omega_m$–$\Omega_\Lambda$, а Adam и автоматическое дифференцирование ведут от вселенной из одного вещества к наилучшей подгонке. Далёкие сверхновые тусклее, чем в замедляющейся вселенной: $q_0 < 0$, расширение ускоряется.'
notes: 'В 1998 году две команды, Supernova Cosmology Project (Перлмуттер и др.) и High-z Supernova Search Team (Рисс и др.; Шмидт), обнаружили, что далёкие сверхновые типа Ia, стандартизуемые свечи, выглядят тусклее, чем допускает замедляющаяся Вселенная: расширение ускоряется, что в общей теории относительности требует чего-то вроде космологической постоянной $\Lambda$ (тёмной энергии). Это открытие удостоено Нобелевской премии по физике 2011 года. Здесь тот же тест проводится на современных данных. Левая панель показывает каждый модуль расстояния минус модуль пустой, свободно расширяющейся вселенной ($\Omega_m = \Omega_\Lambda = 0$): вселенная из одного вещества (красная) сделала бы далёкие сверхновые ярче (ниже нуля), а данные лежат выше. Правая панель показывает области 1, 2 и 3$\sigma$ ($\Delta\chi^2 = 2.30, 6.18, 11.83$) по пакетной сетке, с линией плоской геометрии, прямой $q_0 = 0$, разделяющей ускорение и замедление, и углом «без Большого взрыва», где $E^2$ становится отрицательным
  в пределах данных. С этими диагональными ошибками подгонка даёт $\Omega_m \approx 0.30 \pm 0.07$, $\Omega_\Lambda \approx 0.57 \pm 0.10$ (плоская: $\Omega_m \approx 0.35 \pm 0.02$), и $\Omega_\Lambda \le 0$ отвергается примерно на $5.5\sigma$ ($\sigma = \sqrt{\Delta\chi^2}$ относительно лучшей модели на отвергнутой стороне). $H_0$ вырожден с абсолютной звёздной величиной сверхновых; выводимое значение ($\approx 73$ км/с/Мпк) взято из встроенной в эти $\mu$ цефеидной калибровки SH0ES и не является независимым измерением («хаббловское напряжение» со значением по реликтовому излучению $\approx 67$ — открытый вопрос). Данные: модули расстояния Pantheon+ (Scolnic et al. 2022, ApJ 938, 113; Brout et al. 2022, ApJ 938, 110), с github.com/PantheonPlusSH0ES/DataRelease (файл Pantheon+SH0ES.dat; опубликован для исследований без указанной лицензии, статьи в открытом доступе по CC BY 4.0; пожалуйста, цитируйте их). Оставлены zHD, MU_SH0ES и MU_SH0ES_ERR_DIAG для $z > 0.01$, без родительских галактик
  калибровочных цефеид, по одной строке на сверхновую. Подойдёт и ваша таблица: любой CSV со столбцами z, mu, sigma_mu (см. load_distance_moduli). Упрощения: используются только диагональные ошибки, а не полная статистическая + систематическая ковариация Pantheon+ ($\chi^2/\mathrm{dof} \approx 0.44$ показывает, что эти ошибки консервативны, а пренебрежение коррелированными систематиками делает контуры несколько оптимистичными); тёмная энергия — чистая постоянная ($w = -1$); излучение не учитывается.'
meanings:
- красное смещение, модуль расстояния и ошибка сверхновой $i$ из любого CSV с этими столбцами
- вселенные-кандидаты; транслируются как $(A,1,1)$ и $(1,B,1)$
- темп расширения в каждом узле $z_k$ сразу для всех вселенных
- накопленная формула трапеций для $1/E$ вдоль последней оси
- кубическая эрмитова интерполяция на красные смещения сверхновых (наклон $1/E$ известен)
- $\sinh$, тождество или $\sin$ для открытого, плоского или замкнутого пространства
- 'суммирование по $i$: лучшее $H_0$ каждой вселенной — аналитическое взвешенное среднее'
- суммирование по $i$ с весами $w_i = 1/\sigma_i^2$
- автоматическое дифференцирование через интеграл для Adam и L-BFGS
- ковариация подогнанных параметров из кривизны $\chi^2$
