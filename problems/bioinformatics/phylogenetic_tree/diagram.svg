<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A rooted tree with four leaves; a root sequence evolves down each branch of length t through the Jukes-Cantor matrix P(t), and the leaf sequences are compared to get distances d">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- tree, root on the left, leaves on the right -->
    <g stroke="#374151" stroke-width="2" fill="none">
      <path d="M24,80 L24,44 L70,44"/>
      <path d="M24,80 L24,116 L56,116"/>
      <path d="M70,44 L70,26 L140,26"/>
      <path d="M70,44 L70,62 L120,62"/>
      <path d="M56,116 L56,98 L132,98"/>
      <path d="M56,116 L56,134 L150,134"/>
    </g>
    <circle cx="24" cy="80" r="4" fill="#374151"/>
    <!-- branch length -->
    <line x1="70" y1="20" x2="140" y2="20" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="15" font-style="italic" fill="#b45309">t</text>
    <!-- evolution along a branch -->
    <line x1="80" y1="70" x2="112" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="78" y="86" font-size="12" fill="#b91c1c"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">t</tspan>)</text>
    <!-- leaf sequences -->
    <g>
      <rect x="146" y="20" width="10" height="12" fill="#2563eb"/><rect x="157" y="20" width="10" height="12" fill="#93c5fd"/><rect x="168" y="20" width="10" height="12" fill="#2563eb"/><rect x="179" y="20" width="10" height="12" fill="#2563eb"/>
      <rect x="126" y="56" width="10" height="12" fill="#2563eb"/><rect x="137" y="56" width="10" height="12" fill="#93c5fd"/><rect x="148" y="56" width="10" height="12" fill="#93c5fd"/><rect x="159" y="56" width="10" height="12" fill="#2563eb"/>
      <rect x="138" y="92" width="10" height="12" fill="#93c5fd"/><rect x="149" y="92" width="10" height="12" fill="#93c5fd"/><rect x="160" y="92" width="10" height="12" fill="#2563eb"/><rect x="171" y="92" width="10" height="12" fill="#93c5fd"/>
      <rect x="156" y="128" width="10" height="12" fill="#93c5fd"/><rect x="167" y="128" width="10" height="12" fill="#2563eb"/><rect x="178" y="128" width="10" height="12" fill="#2563eb"/><rect x="189" y="128" width="10" height="12" fill="#93c5fd"/>
    </g>
    <!-- distance between two leaves -->
    <path d="M196,28 Q222,45 176,62" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="214" y="50" font-style="italic">d</text>
    <text x="196" y="117" font-size="12" fill="#374151">leaves</text>
  </g>
</svg>
