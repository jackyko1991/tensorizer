source_hash: 7fc4a728d6a3
title: Оценка гомографии и склейка панорамы
summary: Две фотографии плоского плаката связаны гомографией $3\times3$. Каждое сопоставление признаков даёт два линейных уравнения. Нормализованное прямое линейное преобразование (DLT) решает их через SVD, а RANSAC подгоняет тысячи гипотез по 4 сопоставлениям одним пакетным SVD, чтобы отбросить ошибочные сопоставления. Затем второй вид деформируется и плавно смешивается с первым в панораму.
notes: 'Камера, смотрящая на плоскость, отображает точки плоскости в пиксели по $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$, поэтому два вида одной плоскости связаны $H_2 H_1^{-1}$: восемь чисел, поскольку масштаб свободен. Каждое сопоставление фиксирует два из них, так что четыре сопоставления в общем положении определяют $H$. Большее число сопоставлений объединяется по методу наименьших квадратов в DLT. Без нормализации Хартли элементы $A$ лежат в диапазоне от 1 до $10^4$ (квадрат пикселя), и SVD теряет точность. Метод наименьших квадратов разрушается ошибочными сопоставлениями: несколько выбросов заметно сбивают наивную панораму. RANSAC (Fischler & Bolles, 1981) вместо этого подгоняет $H$ ко множеству случайных минимальных выборок и оставляет ту, с которой согласно больше всего сопоставлений. При доле выбросов $\varepsilon$ выборка из 4 сопоставлений чиста с вероятностью $(1-\varepsilon)^4$, так что теоретически хватает нескольких десятков выборок. Здесь тысячи решаются сразу, потому
  что пакетные SVD дёшевы. Оставшаяся ошибка на инлаерах соответствует пиксельному шуму. Метод следует Hartley & Zisserman, Multiple View Geometry in Computer Vision. Реальные конвейеры получают сопоставления от детекторов признаков, таких как SIFT или ORB.'
meanings:
- сопоставленные положения пикселей на виде 1 и виде 2 (известные точки плаката + шум, часть заменена случайными ошибочными сопоставлениями)
- повторяющийся $j$ ⇒ суммирование, затем деление на третью компоненту (проективный масштаб)
- сдвиг к центроиду и масштабирование до среднего расстояния $\sqrt 2$ (нормализация Хартли)
- две строки на сопоставление из $\mathbf x' \times H\mathbf x = 0$, линейные по девяти элементам $h_a$
- правый сингулярный вектор наименьшего сингулярного числа; затем $H = T'^{-1}\hat H\,T$
- 'гипотезы RANSAC: $B$ случайных выборок по 4 сопоставления, все решаются одним пакетным SVD формы $(B, 8, 9)$'
- ошибка перепроецирования каждого сопоставления при каждой гипотезе
- гипотеза с наибольшим согласованным множеством; повторная подгонка DLT по её инлаерам
- 'обратная деформация: каждый пиксель панорамы ищет, куда он попадает на виде 2; смешивание с плавными весами'
labels:
  matches: Сопоставления признаков
  outliers: Доля ошибочных сопоставлений
  noise: Пиксельный шум $\sigma$
  hypotheses: Гипотезы RANSAC $B$
  threshold: Порог инлаеров $\tau$
