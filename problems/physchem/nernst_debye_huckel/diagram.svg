<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Daniell cell: a zinc electrode in zinc sulfate and a copper electrode in copper sulfate, joined by a salt bridge, with electrons flowing through a voltmeter from zinc to copper; the cell voltage is E">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- beakers with solution -->
    <rect x="22" y="92" width="70" height="52" fill="#93c5fd" opacity="0.5"/>
    <rect x="148" y="92" width="70" height="52" fill="#93c5fd" opacity="0.5"/>
    <path d="M20,78 V146 H94 V78" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M146,78 V146 H220 V78" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- salt bridge -->
    <path d="M72,128 V70 H168 V128" fill="none" stroke="#9ca3af" stroke-width="10" stroke-linejoin="round"/>
    <path d="M72,128 V70 H168 V128" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-dasharray="4 3"/>
    <text x="96" y="86" font-size="10" fill="#6b7280">salt bridge</text>
    <!-- electrodes -->
    <rect x="38" y="52" width="12" height="80" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <rect x="190" y="52" width="12" height="80" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="14" y="68" font-size="13">Zn</text>
    <text x="206" y="68" font-size="13">Cu</text>
    <!-- external circuit with voltmeter -->
    <path d="M44,52 V20 H106 M134,20 H196 V52" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="120" cy="20" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="114" y="25" font-style="italic" fill="#1e40af">E</text>
    <!-- electron flow -->
    <line x1="60" y1="32" x2="94" y2="32" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="64" y="47" font-size="12" fill="#b91c1c">e⁻</text>
    <!-- ions -->
    <text x="54" y="140" font-size="11" fill="#1e40af">Zn²⁺</text>
    <text x="150" y="140" font-size="11" fill="#1e40af">Cu²⁺</text>
  </g>
</svg>
