source_hash: 6b976c8609c8
title: 호지 추측
summary: 호지 다이아몬드를 세어서 계산합니다. 페르마 초곡면 $x_0^d + \dots + x_{n+1}^d = 0$의 호지 수는 다항식 거듭제곱의 계수이고, 복소 원환면과 곱공간의 호지 수는 외적과 합성곱입니다. 이어서 시오다의 지표 세기로 유리 호지 류를 구하는데, 이는 호지 추측에 따르면 부분다양체에서 와야 하는 류들입니다. 곡면의 경우 이것은 증명된 레프셰츠 $(1,1)$ 정리이며, 곡면 위의 직선들이 이를 보여 줍니다. 더 높은 차원에서 이 추측은 미해결이며, 이 페이지는 류를 세기만 합니다.
notes: '콤팩트 켈러 다양체에서 모든 코호몰로지 류는 $(p, q)$형 조각들로 분해됩니다. 즉 $p$개의 정칙 방향과 $q$개의 반정칙 방향입니다(호지, 1941). 수 $h^{p,q}$는 호지 대칭 $h^{p,q} = h^{q,p}$와 세르 쌍대성 $h^{p,q} = h^{n-p,n-q}$를 만족하며, 왼쪽의 모든 다이아몬드는 두 검사를 모두 통과합니다. 이들의 교대합은 오일러 지표이고, 차수 $d$ 초곡면의 경우 $((1-d)^{n+2} - 1)/d + n + 2$와 같습니다. 다이아몬드는 이 값과 함께 K3 4차 곡면의 $h^{1,1} = 20$, 5차 3차원 다양체의 $h^{2,1} = 101$, 3차 4차원 다양체의 $h^{3,1} = 1$을 재현합니다. 여차원 $p$인 부분다양체 $Z$는 $(p, p)$형 유리 류를 정의합니다. 호지 추측(호지 1950; 클레이 밀레니엄 문제 중 하나)은 모든 유리 $(p, p)$ 류가 이러한 류들의 유리 계수 결합이라고 말합니다. 증명된 것: $p = 1$은 레프셰츠 $(1,1)$ 정리(1924)로, 따라서 $p = n-1$은 강한 레프셰츠 정리로 증명되었습니다. 또한 차원이 3 이하인 아벨 다양체, 단선직 4차원 다양체와 3차 4차원 다양체(콘테–무레, 추커), 그리고 여러 차수의 페르마 다양체를 포함한 많은 특수한 경우(시오다 1979, 란 1980)에도 성립합니다. 정수 버전은 거짓입니다(아티야–히르체브루흐, 1962). 페르마 다양체의 경우 시오다의 지표 덕분에 유리 호지 류를 셀 수 있으며, 갈루아 켤레마다 조건이 하나씩 붙습니다. 곡면의 경우 그 개수는 피카르 수입니다: $d = 3, 4, 5, 6$일 때 $7, 20, 37, 86$이고, $\gcd(d, 6) = 1$일 때 $3(d-1)(d-2) + 1$입니다. 곡면 위의 $3d^2$개 직선은 명시적인 대수적 류를 주며, 이들의 교차 행렬(여기서 계산하는 계수(rank)와 호지 지표 부호수 $(1, \rho - 1)$)은 정확히 $d \le 4$ 또는
  $\gcd(d, 6) = 1$일 때 $\mathbb Q$ 위에서 그 류 전체를 생성합니다. $d = 6, 8, 9, 10$의 경우 다른 곡선이 필요하며, 이는 레프셰츠 정리에 의해 존재합니다. 페르마 4차원 다양체의 경우 프로그램은 호지 류를 세지만, 그 각각이 대수적인지는 바로 추측 그 자체입니다. 현황(2026년 11월): 미해결. OpenAI가 공개한 AI 생성 원고 모음(github.com/openai/math, 032군)은 모든 CM 아벨 다양체에 대한 유리 호지 추측을 주장하며, 그 명제의 Lean 형식화를 보고합니다. 이는 심사를 거치지 않은 기계 생성 주장으로서 수학계의 검증을 기다리고 있으며, 설령 옳다 하더라도 일반적인 추측이 아니라 특수한 부류만을 다룹니다.'
meanings:
- '다항식의 곱셈은 계수 벡터의 합성곱이며, 이를 $n+2$번 반복합니다: 페르마 다항식의 야코비 환의 단항식 기저 $x^b$, $0 \le b_i \le d-2$'
- '그리피스: 원시 중간 호지 수는 차수 $(q+1)d - (n+2)$에서의 야코비 환입니다'
- '복소 원환면: $dz$들의 $\wedge^p$ 곱하기 $d\bar z$들의 $\wedge^q$'
- '퀴네트: 모든 류의 쌍을 칸 $(a + c, b + d)$에 합산'
- '시오다의 지표: $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$; 각 지표는 원시 코호몰로지의 직선 $V(a)$에 대응합니다'
- '반복된 $i$ ⇒ 합산: 모든 갈루아 켤레 $t\cdot a$의 호지 형을 한꺼번에'
- '유리 호지 류: 모든 켤레에 대해 $(\frac n2, \frac n2)$형'
- 두 직선은 $\mathbb C^4$에서 이들을 생성하는 네 벡터가 일차종속일 때, 그리고 그때에만 만납니다; 첨가 공식에 의해 $L^2 = 2-d$
- '직선들이 생성하는 격자의 계수(rank)와 부호수(호지 지표 정리: 양의 고윳값이 정확히 하나)'
labels:
  d_max: 최대 차수 $d$
  n_max: 차원 $n$까지 오일러 검사
  g_max: 차원 $g$까지의 원환면
