source_hash: fa6ec3302fec
title: 잡음과 랑주뱅 방정식
summary: 조화 트랩 속의 브라운 입자는 주위 분자들에게 무작위로 얻어맞습니다. 랑주뱅 방정식은 이 잡음 항 $\sqrt{2\gamma k_BT}\,dW$ 을 뉴턴 법칙에 더합니다. Euler–Maruyama 방법이 입자 앙상블 전체를 하나의 배치 텐서로 한꺼번에 진행시키면, 위치의 퍼짐은 볼츠만 분포 $N(0, k_BT/k)$ 로 수렴합니다(에너지 등분배).
notes: '마찰만 있다면 뉴턴 법칙은 입자를 트랩 바닥에 멈춰 세웁니다(굵은 빨간 곡선). 하지만 유체 속의 실제 입자는 결코 멈추지 않습니다. 분자들이 사방에서 부딪히고, 그 무작위 힘이 랑주뱅 방정식의 잡음 항(오차 항)입니다. 그 크기는 마음대로 정할 수 없습니다. 요동–소산 정리가 이를 $\sqrt{2\gamma k_BT}$ 로 고정합니다. 마찰 $\gamma$ 를 일으키는 바로 그 충돌들이 입자를 걷어차기도 하므로, 앙상블은 온도 $T$ 에서 평형에 이릅니다: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$ (에너지 등분배), 그리고 위치는 $N(0, k_BT/k)$ 를 따라 분포합니다. 위너 증분 $dW$ 의 분산은 $dt$ 입니다. 유한한 스텝에서는 $\sqrt{\Delta t}\,\xi$ ($\xi \sim N(0,1)$) 가 되고, 스텝당 속도 충격의 분산은 $2\gamma k_BT\Delta t/m^2$ 입니다. 잡음을 $\Delta t$ 에 비례시키면 스텝을 줄일수록 잡음이 사라집니다. 무작위 충격은 무작위 행보처럼 더해지므로 그 퍼짐은 $\sqrt{t}$ 처럼 자랍니다. 방정식이 선형이므로 앙상블 평균 $\langle x\rangle$ 는 잡음 없는 감쇠 진동자를 정확히 따라가고(빨간 선 위의 검은 점선), 개별 궤적은 제멋대로 헤맵니다. $T = 0$ (순수한 감쇠 진동자), 큰 $\gamma$ 와 작은 $m$ (과감쇠 브라운 운동: $\langle x^2\rangle$ 가 진동 없이 비율 $2k/\gamma$ 로 완화), 또는 작은 $\gamma$ (평형으로의 느린 접근)를 시도해 보세요. 단순화: $k_B = 1$ 인 환산 단위, 1차원, 백색(상관 없는) 잡음, 그리고 평형 분산에 $O(\Delta t)$ 편향이 남는 1차 방법.'
meanings:
- '스텝 $n$ 에서 입자 $b$ 의 위치와 속도: 앙상블 전체가 하나의 배치'
- '잡음 텐서, 스텝마다 한 행: 독립적인 표준 정규 난수(고정 시드)'
- 스텝당 무작위 충격의 크기; $\Delta t$ 가 아니라 $\sqrt{\Delta t}$ 에 비례
- '결정론적 가속도: 마찰과 용수철'
- Euler–Maruyama 스텝; 위치는 새 속도를 사용(심플렉틱 Euler)
- '앙상블 평균: 반복된 $b$ ⇒ 입자들에 대해 합산'
- '평형에서의 $\langle x^2\rangle$ 와 $\langle v^2\rangle$: $\tfrac12 k\langle x^2\rangle = \tfrac12 m\langle v^2\rangle = \tfrac12 k_BT$'
labels:
  temperature: 온도 $k_BT$
  gamma: 마찰 $\gamma$
  k: 강성 $k$
  m: 질량 $m$
  n_particles: 입자 수 $B$
  t_max: 시간 $t_{max}$
