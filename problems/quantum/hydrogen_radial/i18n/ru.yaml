source_hash: bc7b5c9d23fa
title: Орбитали атома водорода
summary: Запись $\psi = (u(r)/r)\,Y_{lm}(\theta, \phi)$ сводит трёхмерную задачу о водороде к одномерному радиальному уравнению с дополнительным центробежным слагаемым $l(l+1)/2r^2$. По одному конечно-разностному гамильтониану на каждый орбитальный момент $l$ собираются в тензор $(L, N, N)$, и один пакетный вызов torch.linalg.eigh возвращает сразу все орбитали. Анимация перебирает 1s, 2s, 2p, 3s, …, показывая радиальную вероятность и срез $\lvert\psi_{nl0}\rvert^2$.
notes: 'Атомные единицы ($\hbar = m_e = e = 4\pi\varepsilon_0 = 1$): длины в боровских радиусах, энергии в хартри. Точные энергии $E_n = -1/(2n^2)$ зависят только от $n$, поэтому 2s и 2p (или 3s, 3p, 3d) получаются вырожденными, хотя это собственные значения разных матриц, — скрытая симметрия потенциала $1/r$. Радиальная функция $(n, l)$ имеет $n - l - 1$ узлов. Сетка обрывается на $r_{\max}$, поэтому состояния, размер которых ($\approx 2n^2$) приближается к $r_{\max}$, сжимаются и поднимаются по энергии; конечные разности также немного недооценивают связь 1s вблизи особенности $1/r$. Срез показывает орбитали с $m = 0$ в плоскости $xz$ ($z$ вверх), $Y_{l0} \propto P_l(\cos\theta)$; цвет использует сжатую степенную шкалу $(\lvert\psi\rvert^2)^{0.3}$, чтобы слабые внешние лепестки оставались видимыми.'
meanings:
- внутренние точки $r = dr \dots r_{\max} - dr$ ($u = 0$ на обоих концах)
- кулоновское притяжение плюс центробежный барьер, одна строка на $l$
- стек из $L$ гамильтонианов, по одному на орбитальный момент
- 'пакетно по $l$: энергии и радиальные функции; главное квантовое число $n = l + 1 + \text{column}$'
- вероятность на единицу радиуса, $r^2\lvert R\rvert^2 = u^2$
- $\lvert R(r)\,Y_{l0}(\theta)\rvert^2$ на срезе через ось $z$
labels:
  n_max: Высшая оболочка $n$
  r_max: Радиус сетки $r_{\max}$
  n_grid: Точки сетки
