<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Go model: a bead chain folded into a hairpin, with bonds, a bond angle theta, attractive native contacts at distance r0 between the two arms, and random thermal kicks xi from a heat bath at temperature T">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- native contacts between the two arms -->
    <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="92" y1="128" x2="148" y2="128"/>
      <line x1="80" y1="100" x2="160" y2="100"/>
      <line x1="92" y1="72" x2="148" y2="72"/>
    </g>
    <text x="118" y="122" font-style="italic" fill="#6b7280">r<tspan font-size="10" dy="-6">0</tspan></text>
    <!-- chain: a hairpin of beads -->
    <path d="M92,128 L80,100 L92,72 L84,46 Q120,14 156,46 L148,72 L160,100 L148,128" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- bond angle at one bead -->
    <path d="M86.3,85.3 A16,16 0 0 1 86.3,114.7" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="99" y="105" font-style="italic" fill="#b45309">θ</text>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1.5">
      <circle cx="92" cy="128" r="7"/><circle cx="80" cy="100" r="7"/><circle cx="92" cy="72" r="7"/><circle cx="84" cy="46" r="7"/>
      <circle cx="120" cy="30" r="7"/>
      <circle cx="156" cy="46" r="7"/><circle cx="148" cy="72" r="7"/><circle cx="160" cy="100" r="7"/><circle cx="148" cy="128" r="7"/>
    </g>
    <!-- thermal kick on a bead -->
    <line x1="167" y1="104" x2="194" y2="116" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="198" y="128" font-style="italic" fill="#b91c1c">ξ</text>
    <!-- heat bath -->
    <text x="20" y="30" font-style="italic">T</text>
    <text x="32" y="30" font-size="11" fill="#6b7280">heat bath</text>
    <text x="162" y="62" font-size="11" fill="#6b7280">bond</text>
    <text x="102" y="152" font-size="11" fill="#6b7280">native contacts</text>
  </g>
</svg>
