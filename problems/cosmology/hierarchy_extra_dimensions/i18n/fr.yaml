source_hash: 41a426132182
title: Le problème de la hiérarchie et la gravité qui fuit dans des dimensions supplémentaires
summary: 'Pourquoi la gravité est-elle environ $10^{33}$ fois plus faible que l''interaction faible ($G_F M_{Pl}^2$) ? Une réponse spéculative : la gravité se répand dans $n$ dimensions compactes cachées. Sur $\mathbb R^3\times T^n$, le potentiel est sommé de deux façons, sur les images de la masse et sur la tour de Kaluza–Klein, comme un seul tenseur sur des couches du réseau. Il décroît en $1/r^{1+n}$ à l''intérieur et en $1/r$ à l''extérieur, avec une queue de Yukawa $\alpha = 2n$, $\lambda = R$. Les rayons ADD pour $n = 1..6$ sont confrontés aux limites réelles des balances de torsion et du LHC, et le facteur de déformation de Randall–Sundrum $e^{-\pi k r_c}$ transforme $M_{Pl}$ en TeV. Aucune dimension supplémentaire n''a été observée.'
notes: 'Statut : spéculatif. Le problème de la hiérarchie demande pourquoi l''échelle électrofaible ($v \approx 246$ GeV) se trouve si loin sous l''échelle de Planck ($M_{Pl} \approx 1.22\times10^{19}$ GeV), avec $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$. Arkani-Hamed, Dimopoulos et Dvali (ADD, 1998) ont proposé que seule la gravité se répande dans $n$ dimensions compactes de taille comprise entre le millimètre et le femtomètre, de sorte que la véritable échelle de la gravité $M_*$ pourrait être d''un TeV. Randall et Sundrum (1999) ont proposé à la place une seule dimension déformée. Aucune dimension supplémentaire n''a été trouvée. D''autres réponses proposées incluent la supersymétrie, la compositivité, le relaxion et la sélection anthropique. Aucune n''est établie. Ce qui est calculé : une masse ponctuelle sur $\mathbb R^3\times T^n$ (cercles de rayon $R$, unités $R = G_D M = 1$). La somme sur les images et la somme de Kaluza–Klein sont égales par la formule sommatoire de Poisson
  ; toutes deux sont regroupées par couches $m = |\mathbf k|^2$ de multiplicités $r_n(m)$. Le graphique utilise la somme sur les images à l''intérieur ($r < R$, images lointaines remplacées par une intégrale) et la somme KK à l''extérieur. Le théorème de Gauss en $3+n$ dimensions d''espace fixe $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$. Le premier niveau KK compte $2n$ modes de masse $1/R$, si bien que juste à l''extérieur de l''espace compact la gravité ressemble à une correction de Yukawa avec $\alpha = 2n$, $\lambda = R$ (tore ; d''autres formes changent $\alpha$). Les rayons ADD utilisent $M_{Pl}^2 = M_*^{n+2}R^n$ ; les articles diffèrent par des facteurs comme $(2\pi)^n$ et $8\pi$, il faut donc voir $R$ comme un ordre de grandeur. Données, sous forme de valeurs citées dans data/*.csv : les balances de torsion d''Eöt-Wash excluent $|\alpha| = 1$ au-delà de $\lambda = 56\,\mu$m (Kapner et al., PRL 98, 021101, 2007, arXiv:hep-ph/0611184 ; une dimension supplémentaire $R \le 44\,\mu$m) et
  au-delà de $38.6\,\mu$m (Lee et al., PRL 124, 101101, 2020, arXiv:2002.11761). La courbe d''exclusion elle-même n''est pas incluse. Comme elle décroît avec $\lambda$, tout point avec $\alpha \ge 1$ et $\lambda > 38.6\,\mu$m est exclu, un test conservateur. La recherche monojet d''ATLAS à 13 TeV (139 fb$^{-1}$ ; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0) exclut $M_D$ en dessous de 11,2, 8,5, 7,1, 6,4 et 5,9 TeV pour $n = 2..6$ (convention de Giudice–Rattazzi–Wells, comparée ici directement à $M_*$). $n = 1$ exigerait une dimension de la taille du Système solaire et est exclu par les orbites planétaires. Randall–Sundrum : $k r_c \approx 11$–$12$ fait de $\bar M_{Pl}e^{-\pi k r_c}$ un TeV ; le LHC n''a pas vu ses gravitons de Kaluza–Klein.'
meanings:
- vecteurs de modes de Kaluza–Klein (impulsions $\mathbf k/R$ autour des cercles) ; servent à vérifier les multiplicités des couches
- 'combien de $\mathbf k$ vérifient $|\mathbf k|^2 = m$ : la série thêta à la puissance $n$, par convolution FFT'
- 'indice de couche $m$ répété ⇒ sommé : la masse et ses images ; images lointaines par une queue continue'
- le même potentiel comme une tour de termes de Yukawa de masse $\sqrt m/R$ (sommation de Poisson)
- champ par autograd ; multiplié par l'aire de $S^{2+n}$ (près) ou de $S^2\times T^n$ (loin), il donne le flux de Gauss
- moindres carrés sur $\ln(\phi/\phi_N - 1)$ juste à l'extérieur de l'espace compact ; on attend $2n$ et $R$
- rayon ADD pour chaque $n$ et chaque échelle fondamentale $M_*$ à la fois (broadcast)
- facteur de déformation de Randall–Sundrum entre la brane de Planck et la brane du TeV
labels:
  M_star: Échelle fondamentale $M_*$ pour le tableau affiché
  krc: $k r_c$ de Randall–Sundrum
  m_max: Couches du réseau sommées, $|\mathbf k|^2 \le m_{max}$
