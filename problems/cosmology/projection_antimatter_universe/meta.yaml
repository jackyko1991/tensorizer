summary: >
  A speculative hypothesis, not established physics. Step 2 found that one worldline crossing every time slice
  gives equal matter and antimatter, while we see about $10^{80}$ baryons and no antimatter. The escape route is a
  worldline balanced globally, with the antimatter far away or in a mirror universe. This step lists what such an
  antimatter universe must satisfy and tests each criterion against data. There are no antinuclei in cosmic rays and
  no annihilation gamma rays from clusters. Domains must be at least as large as the horizon, about 16 Gpc. A random
  worldline is fantastically unlikely. That leaves the CPT-symmetric universe of Boyle, Finn and Turok, whose
  predictions (a massless lightest neutrino, $r = 0$) agree with data so far and could fail.
