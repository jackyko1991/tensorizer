source_hash: 2ee80d9bf824
title: 布洛赫方程與自旋回波
summary: 布洛赫方程是一個叉積 $\varepsilon_{ijk} M_j \Omega_k$ 加上弛豫項。數百個離共振頻率 $\Delta\omega_n$ 略有不同的等色群（isochromat）在一次批次 RK4 更新中一起推進：90° 脈衝後它們呈扇形散開，訊號以 $T_2^*$ 消失；接著在 $TE/2$ 施加 180° 脈衝，使它們在 $TE$ 重新聚焦成回波，而回波高度只隨真正的 $T_2$ 衰減。
notes: 時間單位為 ms，頻率單位為 rad/ms。單一等色群除了弛豫之外保持 $\lvert\mathbf M\rvert$ 不變，但整體平均會失去相位相干：對勞侖茲分布而言，自由感應衰減遵循 $e^{-t/T_2^*}$，其中 $1/T_2^* = 1/T_2 + 1/T_2^{\prime}$。180° 脈衝把每個相位鏡像翻轉，原本跑在前面的自旋變成落後，於是在 $TE$ 全部重新對齊；這抵消了靜態的不均勻性，卻無法挽回隨機的 $T_2$ 損失，所以回波高度描出 $e^{-TE/T_2}$。多個重聚焦脈衝（CPMG 序列，繞 $y$ 的 180°）產生一串回波，可用來測量 $T_2$。脈衝是短的矩形「硬」脈衝，用同一個布洛赫方程計算；離共振很遠的自旋重聚焦得並不完美。數值僅為示意，僅供教學，不可用於臨床。試試高斯分布、更長的 $T_2^{\prime}$ 或只有一個回波。
meanings:
- 等色群 $n$ 的磁化向量，分量 $i \in \{x, y, z\}$，在旋轉座標系中
- Levi-Civita 符號：就是叉積，與勞侖茲力中的完全相同
- 旋轉座標系中的 $\gamma\mathbf B$：脈衝期間在 $xy$ 平面上的射頻場 $\omega_1$，沿 $z$ 的離共振 $\Delta\omega_n$
- 重複的 $j, k$ ⇒ 求和：每個等色群的進動 $\mathbf M\times\boldsymbol\Omega$
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$；與 $M_{nj} - M^0_j$ 在 $j$ 上縮並
- 磁場不均勻造成的進動頻率分布，寬度 $1/T_2^{\prime}$
- 接收線圈看到的量：平均橫向磁化，對 $n$ 求和
labels:
  T1: 縱向弛豫 $T_1$
  T2: 橫向弛豫 $T_2$
  t2_prime: 不均勻時間 $T_2^{\prime}$
  TE: 回波時間 $TE$
  n_echoes: 回波數（180° 脈衝數）
  n_spins: 等色群數
  spread: 離共振線型
