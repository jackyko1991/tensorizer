title: कॉनवे का गेम ऑफ़ लाइफ़ (Game of Life) एक संवलन के रूप में
summary: 'भौतिकी नहीं, केवल मनोरंजन के लिए: जीवित और मृत कोशिकाओं का एक ग्रिड, जिसमें हर कोशिका अपने आठ पड़ोसियों को देखती है। उन्हें गिनना एक $3\times3$ संवलन (convolution) है, जिसे खोले गए पैचों पर एक einsum के रूप में लिखा जाता है, और जन्म/उत्तरजीविता नियम टेंसरों की तुलना है, इसलिए कई बोर्डों की हर कोशिका एक साथ अद्यतन होती है। ग्लाइडर (glider), ग्लाइडर गन (glider gun) और यादृच्छिक सूप देखें।'
notes: तीन संख्याएँ (3 पर जन्म, 2 या 3 पर उत्तरजीविता) ऐसे ग्लाइडरों के लिए पर्याप्त हैं जो हर 4 पीढ़ियों में एक कोशिका तिरछे चलते हैं, पल्सर (आवर्त 3) जैसे दोलकों के लिए, और गॉस्पर ग्लाइडर गन के लिए, जो हर 30 पीढ़ियों में एक नया ग्लाइडर दागती है, जिससे उसकी जनसंख्या हर आवर्त में 5 बढ़ती है। $R$-पेंटोमिनो, केवल 5 कोशिकाओं वाला, असीमित ग्रिड पर 1103 पीढ़ियों तक बदलता रहता है; सीमित बोर्ड पर किनारा इसे बीच में ही रोक देता है। यादृच्छिक सूप जलकर स्थिर आकृतियों (still lifes), ब्लिंकरों और भागते ग्लाइडरों में बदल जाते हैं; धूसर वक्र दिखाते हैं कि यह क्षय एक सूप से दूसरे सूप तक कितना समान है। यही खोलो-और-einsum पैटर्न वह तरीका है जिससे संवलनी तंत्रिका जाल (convolutional neural network) की एक परत की गणना होती है।
meanings:
- 'बोर्ड $b$ की कोशिका $(i, j)$: 1 जीवित, 0 मृत'
- 'कोशिका के चारों ओर 1 और बीच में 0: कोई कोशिका अपनी ही पड़ोसी नहीं होती'
- हर कोशिका $p$ के चारों ओर का $3\times3$ पैच एक स्तंभ के रूप में; बोर्ड के बाहर की कोशिकाएँ मृत मानी जाती हैं
- 'दोहराया गया $k$ ⇒ योग: हर कोशिका के जीवित पड़ोसी, $K$ के साथ संवलन के समान'
- 'B3/S23: ठीक 3 पड़ोसियों पर जन्म, 2 या 3 पर उत्तरजीविता, अन्यथा मृत्यु'
- हर पीढ़ी में हर बोर्ड की जनसंख्या
