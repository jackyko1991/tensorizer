title: 能斯特方程与德拜–休克尔屏蔽
summary: 丹尼尔电池 Zn | Zn²⁺ ‖ Cu²⁺ | Cu 的电压遵循能斯特方程，这里作为温度和浓度比的一个 $(T, Q)$ 网格计算。真实离子的活性低于其浓度所示：每个离子都披着一层厚度为 $\kappa^{-1}$ 的反号电荷云。离子周围的线性化泊松–玻尔兹曼方程在径向网格上作为批量线性方程组求解，与解析的 Yukawa 势吻合，并重现了使电动势偏移的德拜–休克尔活度系数。
notes: 在丹尼尔电池中锌被氧化、铜离子被还原，$\mathrm{Zn + Cu^{2+} \to Zn^{2+} + Cu}$，$n = 2$ 个电子，$E^\circ \approx 1.10$ V（这里保持固定，因为它本身随温度的变化很小）。$Q$ 每变化十倍，电动势移动 $\ln 10\,RT/nF$，在 25 °C 时为 29.6 mV，斜率与 $T$ 成正比增大。能斯特方程使用的是活度 $a = \gamma m$，而不是质量摩尔浓度。Debye 和 Hückel 让其他离子在中心离子的势 $\varphi$ 中按玻尔兹曼权重排布，再做线性化，从而算出 $\gamma$：$\nabla^2\varphi = \kappa^2\varphi$。其解是屏蔽库仑（Yukawa）势，在德拜长度 $\kappa^{-1} \approx 0.304\,\mathrm{nm}/\sqrt{I}$（25 °C 水中）范围内衰减。数值求解器把关于 $u = r\varphi$ 的径向方程写成三对角方程组，在离子表面施加高斯定律，在十二个德拜长度之外取 $\varphi = 0$，与解析形式吻合到约 $10^{-4}$。离子在自身电荷云势中的能量为 $kT\ln\gamma$，这恰好给出扩展定律；当 $I \to 0$ 时它变为极限定律 $\log_{10}\gamma = -Az^2\sqrt I$，$A \approx 0.51$。每个半电池是一个独立的 2:2 硫酸盐溶液（$I = 4m$），所以改变 $m(\mathrm{Zn^{2+}})$ 会改变 $\gamma_{Zn}$ 而 $\gamma_{Cu}$ 不变，电动势偏离理想能斯特值数毫伏。单离子活度系数无法单独测量（只能测平均值 $\gamma_\pm$），而在 $I \approx 0.01$ 以上，2:2 硫酸盐中的离子缔合和特定相互作用使得即使扩展定律也只是定性的。离子尺寸 $a \approx 0.5$ nm 是典型的水合离子值。
meanings:
- 一批电池温度和反应商
- 不对任何指标求和：每个斜率与每个反应商组合
- 所扫描 ZnSO₄ 半电池的离子强度 $I = mz^2$ 和德拜长度的倒数
- 扩展定律；$a \to 0$ 给出极限定律 $-Az^2\sqrt I$
- 从离子表面 $a$ 到 $a + 12\,\kappa_c^{-1}$ 的网格，每个浓度一个
- $u^{\prime\prime} - \kappa^2u = 0$，$u = r\varphi$；第 0 行是 $r = a$ 处的高斯定律
- 重复的 $j$ ⇒ 求和；每个浓度一次稠密求解，批量进行
- 离子在自身电荷云中的能量：重现扩展德拜–休克尔定律
labels:
  T_C: 活度与屏蔽的温度
  m_Cu: Cu²⁺ 半电池质量摩尔浓度
  E0: 标准电动势 $E^\circ$
  a_ion: 离子尺寸 $a$
  n_points: 径向网格点数 $M$
