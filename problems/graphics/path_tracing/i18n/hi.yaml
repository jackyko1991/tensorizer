title: Cornell बॉक्स का मोंटे कार्लो पाथ ट्रेसिंग
summary: 'फ़ोटोयथार्थवादी रेंडरिंग रेंडरिंग समीकरण को मोंटे कार्लो से हल करती है। हर नमूने की हर कैमरा किरण को समतलों और गोलों के एक बॉक्स में एक बैच के रूप में ट्रेस किया जाता है: कोसाइन-भारित उछाल, हर टक्कर पर क्षेत्र-प्रकाश की ओर एक छाया किरण, और पथ समाप्त करने के लिए रशियन रूलेट। शोर को $1/\sqrt{N}$ की तरह घटते और लाल व हरी दीवारों का रंग सफ़ेद दीवारों पर बहते देखें, जिसे केवल वैश्विक प्रदीपन पकड़ता है।'
notes: 'विसरित (Lambertian) सतह के लिए रेंडरिंग समीकरण कहता है कि किसी बिंदु से निकलने वाला प्रकाश उसका उत्सर्जन और सभी आने वाले प्रकाश का परावर्तित अंश $\rho$ है। आने वाला प्रकाश स्वयं अन्य सतहों का निकलने वाला प्रकाश है, इसलिए समाकल पुनरावर्ती है। पाथ ट्रेसर इसे यादृच्छिक पथों से बदल देता है। कोसाइन-भारित नमूनाकरण ($p = \cos\theta/\pi$) BRDF और कोसाइन को निरस्त कर देता है, इसलिए थ्रूपुट प्रति उछाल केवल एक गुणक $\rho$ उठाता है। हर टक्कर पर प्रकाश के एक यादृच्छिक बिंदु की ओर एक छाया किरण प्रत्यक्ष प्रकाश जोड़ती है (next-event estimation), जो किसी उछाल के संयोग से छोटे प्रकाश से टकराने की प्रतीक्षा से कहीं कम शोरयुक्त है। केवल पहली टक्कर का प्रकाश केवल-प्रत्यक्ष छवि देता है। हर अगला उछाल अप्रत्यक्ष प्रकाश जोड़ता है: छायाओं में कोमल भराव, अधिक चमकीली छत और लाल व हरा रंग-स्राव। परीक्षण सूट में भट्ठी परीक्षण (furnace test) अनुमानक की जाँच करता है। एक बंद बॉक्स जिसकी सभी दीवारें $L_e$ उत्सर्जित करती हैं और $\rho$ परावर्तित करती हैं, उसमें हर जगह विकिरण $L_e/(1-\rho)$ होना चाहिए। कोसाइन नमूनाकरण
  से यह शून्य प्रसरण के साथ आता है। त्रुटि $1/\sqrt N$ की तरह घटती है क्योंकि हर पिक्सेल $N$ स्वतंत्र नमूनों का माध्य है। शोर आधा करने में चार गुना नमूने लगते हैं, इसी कारण उत्पादन रेंडरर डीनॉइज़र उपयोग करते हैं।'
meanings:
- 'किरण $r = (s, p)$ का मूल और दिशा: $P$ पिक्सेलों में से हर एक के लिए $N$ हिलाए गए नमूने, एक बैच'
- समतल $p$ है $n_{pi} x_i = d_p$, एक परिसीमा बॉक्स तक काटा गया; प्रकाश एक छोटा समतल है
- हर किरण से हर समतल तक दूरी; दोहराए गए $i$, $j$ ⇒ योग
- हर किरण और गोले के लिए $\lvert o + t\omega - c\rvert^2 = r^2$ के मूल
- 'हर किरण के अनुदिश निकटतम टक्कर: कौन-सा आदिम, कहाँ, और उसका अभिलंब'
- 'अगली दिशा: डिस्क में एकसमान बिंदु को गोलार्ध पर उठाया गया; $f\cos\theta/p = \rho$'
- 'पथ थ्रूपुट: उछाल $k$ पर मिले प्रकाश का कितना भाग कैमरे तक पहुँचता है'
- 'next-event estimation: क्षेत्र-प्रकाश पर एक यादृच्छिक बिंदु $y$ की ओर छाया किरण'
- 'रशियन रूलेट: मंद पथों को यादृच्छिक रूप से समाप्त करें पर बचे हुओं को पुनः भारित करें, ताकि माध्य न बदले'
- 'पिक्सेल रंग: नमूना सूचकांक $s$ पर औसत'
labels:
  resolution: छवि आकार
  spp: प्रति पिक्सेल नमूने $N$
  reference_spp: संदर्भ प्रति पिक्सेल नमूने
  bounces: उछाल (रूलेट से पहले)
  termination: पथ समापन
  light_power: प्रकाश विकिरण $L_e$
