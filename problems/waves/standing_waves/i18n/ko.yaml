source_hash: 902cc4c799f5
title: 줄의 정상파
summary: '양 끝이 고정된 줄 위의 1차원 파동 방정식. 2계 도함수는 행렬(유한 차분 스텐실 $D_{ij}$)이 되므로, einsum 하나로 여러 줄의 모든 점을 한꺼번에 움직입니다: 처음 몇 개의 배음과 퉁긴 줄.'
notes: 1행부터 $n$행까지는 단일 배음 $\sin(n\pi x/L)$ 모양으로 시작해 제자리에서 $f_n = nc/2L$로 숨 쉬듯 진동합니다. 이것이 정상파입니다. 퉁긴 줄(삼각형)은 많은 배음의 합이므로, 꺾인 점이 두 조각으로 나뉘어 양 끝으로 달려가 뒤집힌 뒤 돌아옵니다. 기본 주기 $2L/c$가 지나면 모든 모양이 처음 자리로 돌아옵니다. 시간 간격은 쿠랑 조건 $c\,\Delta t \le \Delta x$를 따르며, 줄을 감쇠시키는 것이 없으므로 에너지 $\tfrac12\int (\dot u^2 + c^2 u_x^2)\,dx$(단위 선밀도당)가 일정하게 유지됩니다.
meanings:
- 내부 격자점 $i$에서 줄 $b$의 변위 (고정된 양 끝은 제외)
- '2계 도함수 행렬: 대각선에 $-2$, 그 옆에 $1$'
- '반복된 $j$ ⇒ 합: 모든 줄의 $\partial_x^2 u$'
- 시간에 대한 중심 차분 (립프로그)
- '$D$의 고윳값이 $\omega_n^2 = -c^2\lambda_n$을 줌: 배음'
labels:
  n_harmonics: 표시할 배음 수
  pluck_at: 퉁기는 위치 $x_p/L$
  c: 파동 속력 $c$
  L: 줄 길이 $L$
  n_points: 격자점 수
  periods: 시뮬레이션할 기본 주기 수
