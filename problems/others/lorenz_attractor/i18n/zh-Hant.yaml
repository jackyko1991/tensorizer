source_hash: 8944aa9bc162
title: 勞侖次吸引子與蝴蝶效應
summary: 來自對流模型的三個耦合方程永不停歇，也永不重複。把它寫成線性部分 $A_{ij}x_j$ 加上用三階張量表示的二次部分 $Q_{ijk}x_j x_k$，一次 einsum 就能推進一整批彼此相距不到 $10^{-6}$ 的軌道；它們以最大李雅普諾夫指數 $\lambda \approx 0.9$ 決定的速率指數分離，直到鋪滿整隻蝴蝶。
notes: 勞侖次（1963）把一個從下方加熱的流體模型簡化為三個數：$x$ 是對流卷的強度，$y$ 和 $z$ 描述溫度分布。當 $\sigma = 10$、$\rho = 28$、$\beta = 8/3$ 時，運動繞著兩個不動點 $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$ 之一旋轉，然後不可預測地跳到另一側翅膀。相鄰軌道按 $e^{\lambda t}$ 分離，$\lambda \approx 0.906$：$10^{-6}$ 的誤差在大約 $15$ 個時間單位後增長到吸引子的大小，這就是預報存在極限的原因（蝴蝶效應）。與此同時，任何狀態體積都按 $e^{-(\sigma+1+\beta)t}$ 收縮，於是軌道擠到一個薄薄的碎形集合上：奇異吸引子。張量形式讓結構一目了然：$A$ 包含全部線性耦合，而全部非線性只是 $Q$ 的兩個分量。計算前，先把一條從 $(1, 1, 1)$ 出發的軌道積分 $10$ 個時間單位，使小球從吸引子上出發；這裡固定步長 $0.005$ 的 RK4 已足夠精確。試試 $\rho < 1$：原點變得穩定，所有軌道都衰減到原點；當 $1 < \rho < 24.74$ 時它們螺旋落入 $C_+$ 或 $C_-$；在 $\rho = 28$ 附近及以上，混沌重新出現。
meanings:
- 軌道 $b$ 的狀態 $(x, y, z)$
- 線性部分：各列為 $(-\sigma, \sigma, 0)$、$(\rho, -1, 0)$、$(0, 0, -\beta)$
- 二次部分，一個只有兩個非零分量的三階張量：$\dot y$ 中的 $-xz$ 和 $\dot z$ 中的 $+xy$
- 重複的 $j$ ⇒ 求和
- 重複的 $j$ 和 $k$ ⇒ 求和：產生混沌的非線性
- 雅可比矩陣的跡：狀態體積以恆定速率 $\sigma + 1 + \beta$ 收縮
- 各軌道到其平均值的均方根距離
- 離散度從 $10\,s(0)$ 增長到 $1$ 期間 $\ln s$ 隨 $t$ 的斜率
labels:
  sigma: 普朗特數 $\sigma$
  rho: 瑞利數 $\rho$
  beta: 幾何因子 $\beta$
  t_max: 模擬時間
  log10_radius: 初始球半徑 $\log_{10} r$
  n_traj: 軌道數
