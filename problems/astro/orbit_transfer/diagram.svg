<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Hohmann transfer: a spacecraft leaves the inner circular orbit r1 with a prograde burn, coasts half an ellipse to the outer circular orbit r2 and burns again to circularise">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- inner and outer circular orbits around the central body at (95,80) -->
    <circle cx="95" cy="80" r="22" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="95" cy="80" r="62" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- transfer ellipse: periapsis at x = 117, apoapsis at x = 33, so centre x = 75, a = 42, b = sqrt(22*62) = 36.9 -->
    <path d="M117,80 A42,36.9 0 0 0 33,80" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M33,80 A42,36.9 0 0 0 117,80" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- radii -->
    <line x1="95" y1="80" x2="95" y2="102" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="99" y="99" font-style="italic">r<tspan font-size="10" dy="3">1</tspan></text>
    <line x1="95" y1="80" x2="138.8" y2="123.8" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="146" y="138" font-style="italic">r<tspan font-size="10" dy="3">2</tspan></text>
    <!-- central body -->
    <circle cx="95" cy="80" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- spacecraft at periapsis with the first burn (prograde, up) -->
    <circle cx="117" cy="80" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="124" y1="78" x2="124" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="129" y="62" font-style="italic" fill="#b91c1c">Δv<tspan font-size="10" dy="3">1</tspan></text>
    <!-- spacecraft at apoapsis with the second burn (prograde, down) -->
    <circle cx="33" cy="80" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="26" y1="82" x2="26" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="2" y="128" font-style="italic" fill="#b91c1c">Δv<tspan font-size="10" dy="3">2</tspan></text>
  </g>
</svg>
