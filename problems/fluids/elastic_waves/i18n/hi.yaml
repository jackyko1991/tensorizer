title: प्रत्यास्थ P और S तरंगें
summary: 'प्रत्यास्थ ठोस के लिए नेवियर–कॉशी समीकरण। एक बिंदु पर छोटा धक्का दो तरंगें भेजता है: तेज़ संपीडन P तरंग ($\nabla\cdot\mathbf u$ में दिखती) और धीमी अपरूपण S तरंग ($\nabla\times\mathbf u$ में दिखती)। दोनों पद द्वितीय अवकलजों $\partial_i\partial_j u_k$ की एक ही तालिका के संकुचन हैं — भिन्न दोहराए सूचकांकों वाले दो einsum।'
notes: मात्रक $\rho = 1$ और कोष्ठ आकार 1। समय चरण लीपफ़्रॉग है, $u^{n+1} = 2u^n - u^{n-1} + \Delta t^2\,\ddot u^n$। समीकरण का अपसरण लेने पर $\theta = \partial_j u_j$ के लिए चाल $c_P$ वाला तरंग समीकरण मिलता है; कर्ल लेने पर घूर्णन के लिए चाल $c_S < c_P$ वाला — चट्टान में $c_P \approx 1.7\,c_S$, इसीलिए भूकंप की P तरंग पहले और S तरंग कुछ सेकंड बाद पहुँचती है। बिंदु बल P तरंगें मुख्यतः बल के अनुदिश और S तरंगें मुख्यतः उसके आर-पार विकिरित करता है, जैसा दोनों पालियुक्त पैटर्न दिखाते हैं। धराशायी वृत्त पूर्वानुमानित तरंगाग्र $c\,(t - t_0)$ हैं, जहाँ $t_0$ स्रोत तरंगिका का शिखर है। एक अवमंदन सीमा तरंगों को किनारे तक पहुँचने से पहले अवशोषित करती है (वास्तविक कोड perfectly matched layer का उपयोग करते हैं); ½ के निकट पॉयसन अनुपात ($\lambda \gg \mu$) $c_P$ को बड़ा बनाता है और छोटा समय चरण आवश्यक करता है।
meanings:
- विस्थापन क्षेत्र, हर नोड पर घटक $i \in \{x, y\}$
- केंद्रीय अंतरों से सभी द्वितीय अवकलज
- दोहराया गया $j$ (दूसरा और तीसरा स्थान) ⇒ अपसरण की प्रवणता
- दोहराया गया $j$ (पहला और दूसरा स्थान) ⇒ हर घटक का लाप्लासियन
- केंद्र पर एक दिशा में छोटा मैक्सिकन-हैट धक्का
- आयतन परिवर्तन (P) और घूर्णन (S)
- लीपफ़्रॉग चरण; कूरां संख्या $S > 1$ अस्वीकार है क्योंकि योजना अस्थिर हो जाती है
labels:
  lam: लामे स्थिरांक $\lambda$
  mu: अपरूपण गुणांक $\mu$
  direction: बल की दिशा
  courant: कूरां संख्या $S$
  t_max: अनुकरण समय
