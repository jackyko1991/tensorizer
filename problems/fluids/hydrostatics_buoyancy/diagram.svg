<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Water tank: pressure grows with depth h below the surface at pressure p0; a light block floats partly submerged with buoyancy F_B up and weight mg down, a heavy block rests on the floor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="guide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- water -->
    <rect x="30" y="50" width="180" height="92" fill="#93c5fd" fill-opacity="0.45"/>
    <line x1="30" y1="50" x2="210" y2="50" stroke="#2563eb" stroke-width="1.5"/>
    <!-- tank -->
    <path d="M30,24 V142 H210 V24" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="38" y="42" font-style="italic">p<tspan font-size="10" dy="3" font-style="normal">0</tspan></text>
    <!-- depth -->
    <line x1="48" y1="54" x2="48" y2="134" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#guide)" marker-end="url(#guide)"/>
    <text x="54" y="100" font-style="italic">h</text>
    <!-- floating block -->
    <rect x="96" y="34" width="34" height="34" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="113" y1="34" x2="113" y2="10" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="118" y="20" font-style="italic" fill="#b91c1c">F<tspan font-size="10" dy="3" font-style="normal">B</tspan></text>
    <line x1="113" y1="68" x2="113" y2="94" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="118" y="92" font-style="italic" fill="#b91c1c">mg</text>
    <!-- sunk block -->
    <rect x="162" y="112" width="30" height="30" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  </g>
</svg>
