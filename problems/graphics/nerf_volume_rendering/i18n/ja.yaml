source_hash: 09cd4df32aa9
title: NeRF：ニューラル放射輝度場のボリュームレンダリング
summary: 小さな MLP $F_\theta(\mathbf x) = (\sigma, \mathbf c)$ が空間の各点に密度と色を与えます。画素はそのレイに沿って集めた光です。層化サンプル $t_s$ をとり、透過率 $T_s = e^{-\sum_{s'<s}\sigma_{s'}\delta_{s'}}$ を用いた求積 $C = \sum_s T_s\,(1 - e^{-\sigma_s\delta_s})\,\mathbf c_s$ を、レイ × サンプルについてバッチで計算します。合成シーンの写真だけで学習し、学習に使わない視点と深度マップをレンダリングします。位置エンコーディングのない 2 つ目のネットワークで、素朴な MLP のスペクトルバイアスを示します。
notes: 学習データは赤い球、市松模様の立方体、オレンジのボールを写した $V$ 枚の写真で、ランバート陰影付きの解析的レイキャスタで作ります。ネットワークは幾何形状を一切見ず、画素の色と各画素のレイだけを見ます。Adam の各ステップでは全学習画素からレイをランダムに一括で選び、求積でレンダリングして真の色と比べます。$w_{rs}$、$T_{rs}$ と色は $\sigma$ と $\mathbf c$ の滑らかな関数なので、自動微分が写真誤差をネットワークへ逆伝播します。多くの視点のレイが同じ面で一致する場所で密度が育ちます。深度マップ $\sum_s w_s t_s$ と、印を付けたレイに沿った重みのプロファイルがそれを示します。重みは真の表面で鋭いピークに集まります。位置エンコーディングが鍵となる工夫です。$(x, y, z)$ をそのまま入れた MLP は低周波から先に学び、鋭いエッジや細かい模様の当てはめはとても遅くなります（スペクトルバイアス）。代わりに $\sin(2^k\pi x), \cos(2^k\pi x)$ を入力すると、高周波の部品が与えられます。同じステップ数で、エンコードしたネットワーク（青）はシルエットがよりくっきりし、深度誤差は約半分、学習視点での PSNR も高くなりますが、素朴なネットワーク（赤）はぼやけたままです。学習に使わない視点での改善はより小さくなります。少数の小さな視点では細部の拘束が弱く、どちらのネットワークもまだ収束にはほど遠いからです（本物の NeRF は何時間も学習します）。Mildenhall et al. (ECCV 2020) からの簡略化：視線方向の入力なし（シーンはランバート面なので、色は見る角度に依存しない）、階層的サンプリングを伴う coarse + fine の 2 ネットワークの代わりに 1 つのネットワーク、小さな MLP（8 × 256 の代わりに 3 × 64）、$40\times 40$ の画像、そして数十万ステップの代わりに数百ステップ。$L = 2$ や $L = 10$、サンプル数 $S$ を減らす（粗い求積による縞）、ステップを増やす（市松模様はエンコーディングありでのみ現れる）、視点を減らす（幾何が曖昧になり、学習視点には合ったまま学習外の視点が劣化する）などを試してください。
meanings:
- 各カメラの $P$ 個の画素それぞれを通るレイの原点と単位方向
- $[t_n, t_f]$ を $S$ 個に等分した各区間からランダムな深さを 1 つ。毎ステップ新しく選ぶので、ネットワークはレイ全体を見る
- サンプル点：レイ $r$ とサンプル $s$ にわたるブロードキャスト
- $2^k\pi x_i$ の $\sin$ と $\cos$、$k = 0 \dots L-1$。和はとらず、外積
- MLP の 1 層をすべてのサンプルに一度に適用、$g$ について和をとる。層の間に ReLU
- 密度 $\ge 0$ と $(0, 1)$ 内の色
- レイに沿った各区間の長さ
- 透過率：光学的厚さ $\tau = \sigma\delta$ の $s' < s$ にわたる排他的累積和
- 画素に届いた光が区間 $s$ で放出された確率。$\sum_s w_{rs} \le 1$
- 画素の色、$s$ について和をとる。残った透過率は白い背景を見せる
- 期待深度：同じ重みで深度マップがただで得られる
labels:
  n_freq: エンコーディング周波数 $L$
  width: 隠れ層の幅 $H$
  n_samples: レイあたりのサンプル数 $S$
  steps: Adam ステップ数（ネットワークごと）
  batch: ステップあたりのレイ数
  lr: Adam 学習率
  n_views: 学習視点数 $V$
  resolution: 画像サイズ（画素）
