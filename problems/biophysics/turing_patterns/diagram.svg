<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Gray-Scott reaction-diffusion: a grid cell holds substrate u and autocatalyst v, which react as U plus 2V to 3V; u is fed in at rate F, v is removed at rate F plus k, and both diffuse to the four neighbouring cells with D_u larger than D_v">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- 3x3 block of grid cells -->
    <g fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
      <rect x="30" y="20" width="40" height="40"/><rect x="70" y="20" width="40" height="40"/><rect x="110" y="20" width="40" height="40"/>
      <rect x="30" y="60" width="40" height="40"/><rect x="110" y="60" width="40" height="40"/>
      <rect x="30" y="100" width="40" height="40"/><rect x="70" y="100" width="40" height="40"/><rect x="110" y="100" width="40" height="40"/>
    </g>
    <rect x="70" y="60" width="40" height="40" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <!-- molecules in the centre cell: light u, dark v -->
    <circle cx="80" cy="72" r="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
    <circle cx="98" cy="70" r="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
    <circle cx="86" cy="88" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <circle cx="100" cy="90" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <!-- diffusion to the four neighbours -->
    <g stroke="#374151" stroke-width="2" marker-end="url(#arrow)">
      <line x1="90" y1="58" x2="90" y2="38"/><line x1="90" y1="102" x2="90" y2="122"/>
      <line x1="68" y1="80" x2="48" y2="80"/><line x1="112" y1="80" x2="132" y2="80"/>
    </g>
    <text x="32" y="155" font-style="italic">D<tspan font-size="10" dy="3">u</tspan><tspan dy="-3" font-style="normal"> &gt; </tspan>D<tspan font-size="10" dy="3">v</tspan></text>
    <!-- reaction, feed and removal -->
    <text x="160" y="76" font-size="13"><tspan font-style="italic">U</tspan> + 2<tspan font-style="italic">V</tspan> → 3<tspan font-style="italic">V</tspan></text>
    <line x1="196" y1="18" x2="196" y2="44" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
    <text x="204" y="36" font-style="italic" fill="#b91c1c">F</text>
    <line x1="196" y1="98" x2="196" y2="124" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
    <text x="204" y="118" font-style="italic" fill="#b91c1c">F + k</text>
  </g>
</svg>
