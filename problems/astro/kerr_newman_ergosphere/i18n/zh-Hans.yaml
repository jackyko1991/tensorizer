source_hash: e53e4d6ab9fa
title: Kerr–Newman 黑洞：视界、能层与裸奇点
summary: 广义相对论结合电磁学后最一般的黑洞，具有质量 $M$、自旋 $a$ 和电荷 $Q$。对整个批量化的 $(M, a, Q)$ 网格，代码计算视界 $r_\pm$、能层、参考系拖曳以及赤道面上的 ISCO 和光子轨道（度规导数由自动微分求得）。动画将自旋和电荷一路扫到并越过极端条件 $a^2 + Q^2 = M^2$：此时视界消失，环状奇点将会暴露，而宇宙监督猜想（尚未证明）认为自然界禁止这种情况。
notes: 单位 $G = c = 1$：长度以 $GM/c^2$ 为单位，自旋 $a = J/(Mc)$，电荷采用几何化单位。已确立的结论（经典广义相对论）：Kerr–Newman 度规（Newman et al. 1965）是 Einstein–Maxwell 方程的解，其视界是 $\Delta$ 的根；能层是任何观测者都无法保持静止的区域，位于 $r_+$ 与 $r_E(\theta)$ 之间，并在两极与视界相接。在能层内，参考系拖曳迫使一切物体共转：绿色曲线以零角动量落入，却仍被带着绕转。顺行轨道紧贴黑洞：对于 Kerr 黑洞，ISCO 从 $a = 0$ 时的 $6M$ 变为 $a = M$ 时的 $M$（顺行）和 $9M$（逆行），与 Bardeen、Press 和 Teukolsky (1972) 一致；极端 Reissner–Nordström 黑洞的 ISCO 为 $4M$。当 $a^2 + Q^2 > M^2$ 时，公式仍给出一个度规，但没有视界，并在 $r = 0$、$\theta = \pi/2$ 处存在裸露的环状奇点（以红色绘出）。Penrose 的弱宇宙监督猜想认为引力坍缩永远不会产生裸奇点；它在一般情况下尚未得到证明（已知反例需要精细调节的初始数据或额外维度），而通过投入粒子使极端黑洞超自旋或超电荷的尝试，在计入二阶微扰效应后似乎都会失败（Sorce and Wald 2017）。真实黑洞的 $Q \approx 0$（电荷会很快被中和），而测得的自旋（最高约 $0.95$–$0.99\,M$）都低于极端值。赤道面板以 Boyer–Lindquist 坐标 $r$ 作为半径；在此图中，落入的绿色曲线的 $\varphi$ 在 $r_+$ 处无界地缠绕，这是一种坐标效应。
meanings:
- 将质量、自旋和电荷的每种组合作为一个批次，$G = c = 1$
- $\Delta = 0$ 的根；当 $a^2 + Q^2 > M^2$（裸奇点）时为 NaN
- 静止极限 $g_{tt} = 0$，在帧 $\times$ 极角上广播
- Boyer–Lindquist 度规中旋转的 $(t, \varphi)$ 分块
- 零角动量观测者的角速度；视界处 $\Omega_H = a/(r_+^2 + a^2)$
- 通过自动微分在半径网格上求度规导数
- 圆轨道的角速度与能量；ISCO 位于 $E$ 的最小值处，光子轨道位于轨道需要速度 $c$ 之处
- 表面引力，$T_H = \kappa/2\pi$；极端黑洞为零
labels:
  angle: 混合角 $\psi$（$0°$ 为纯自旋，$90°$ 为纯电荷）
  chi_max: 扫描上限 $\sqrt{a^2 + Q^2}/M$
  frames: 帧数
  grid: 批量 $(a, Q)$ 扫描中每个轴的网格点数
