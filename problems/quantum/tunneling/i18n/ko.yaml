source_hash: 5c7383dc415a
title: 양자 터널링
summary: 가우스 파동묶음이 직사각형 장벽에 부딪힙니다. 시간 의존 슈뢰딩거 방정식을 분할 단계 푸리에 방법으로 풉니다. 퍼텐셜은 $x$ 공간에서, 운동 에너지는 $k$ 공간에서 대각 연산자이므로 시간 단계의 각 절반은 원소별 텐서 곱셈일 뿐이며, torch.fft가 두 기저 사이를 오갑니다.
notes: 단위 $\hbar = m = 1$, 파동묶음 에너지 $E \approx k_0^2/2$. $\psi$에 작용하는 대각 연산자 $D_{xy} = d_x\,\delta_{xy}$는 $D_{xy}\psi_y = d_x\psi_x$입니다. 행렬이 필요 없고 원소별 곱셈만 하면 됩니다. 스트랭 분할 $P\cdot K\cdot P$는 $\Delta t$에 대해 2차 정확도이고 정확히 유니터리이므로, 노름은 반올림 오차 수준까지 1로 유지됩니다. 시뮬레이션 시간은 파동묶음 중심이 $x = -25$에서 약 $x = +20$까지 가도록 자동으로 정합니다($45/k_0$). $E < V_0$이면 고전적인 입자는 언제나 튕겨 나오므로, 오른쪽으로 투과한 덩어리가 터널링입니다. 비교를 위해 출력하는 평면파 투과 계수 $T(k_0)$는 파동묶음의 운동량 퍼짐을 무시합니다(그리고 격자에 맞춰진 장벽 폭을 씁니다). 더 넓은 파동묶음(더 큰 $\sigma_0$)은 운동량이 더 날카로워 이 값과 더 잘 맞습니다.
meanings:
- 주기적인 격자 $x$ 위의 파동 함수
- '반 단계 퍼텐셜 연산자: $x$에서 대각, psi * P로 적용'
- '한 단계 운동 연산자: $k$에서 대각, psi_k * K로 적용'
- 기저 변환 $x \to k$ (명시적으로 만들지 않는 빠른 행렬 곱)
- '투과율: 장벽 오른쪽에서 발견될 확률'
labels:
  k0: 파동묶음 운동량 $k_0$
  V0: 장벽 높이 $V_0$
  width: 장벽 폭 $a$
  sigma: 파동묶음 폭 $\sigma_0$
