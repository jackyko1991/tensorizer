source_hash: 125d78b166e3
title: 粗粒化蛋白质折叠：用朗之万动力学模拟 Gō 模型
summary: 把一个小型螺旋发夹蛋白表示为一串珠子，每个氨基酸一颗，由键和键角相连，并由具有吸引作用的天然接触稳定（Gō 模型）。力是总能量的自动微分梯度，能量用成对距离张量写出。朗之万动力学同时模拟一整批温度和副本，一半从折叠态出发、一半从去折叠态出发；天然接触分数 $Q(t)$ 显示折叠与去折叠，其对温度的平均就是熔解曲线。
notes: Gō 模型是从答案出发构建的：天然结构中存在的每个相互作用都是吸引的，其他一切只有排斥，因此能量面是一个通向天然折叠的光滑漏斗。这是一种夸张的简化，但很有用：小蛋白确实像能量面阻挫极小那样折叠，而 Gō 模型能重现其中许多蛋白的折叠速率、过渡态和协同熔解。采用约化单位：能量以 $\varepsilon$（一个接触）计，温度以 $\varepsilon/k_B$ 计，时间以 $\tau$ 计。一半副本从折叠态出发，一半从直棒出发；实线与虚线一致的地方说明模拟已达平衡，不一致的地方（低 $T$）说明去折叠的链被动力学地困在错误折叠态中，需要更长的模拟或副本交换。由于蛋白极小，熔解曲线很宽；拥有数百个接触的真实蛋白会急剧熔解。没有二面角项时能量只依赖距离，因此天然折叠的镜像具有完全相同的能量和 $Q$；真实的 Gō 模型会加入二面角势来固定手性。试着改变摩擦系数（它改变动力学但不改变平衡曲线）或温度个数。
meanings:
- 体系 $s$ 的珠子 $i$；$S = B\cdot R$ 个温度 × 副本
- 原子对 $p = (i_p, j_p)$ 的天然距离，$j - i \ge 3$；若在天然折叠中距离小于 8 Å，则 $n_p = 1$
- 所有体系的全部成对距离放在同一个张量里，对 $a$ 求和
- 键 + 键角 + 12–10 天然势阱（在 $r^0_p$ 处最小值为 $-\varepsilon$）+ 非天然原子对的排斥
- 用自动微分求力；对 $s$ 求和没有问题，因为各体系互不作用
- 每个体系都有自己的热浴
- 踢、漂移、摩擦 + 噪声 $v \to e^{-\gamma dt}v + \sqrt{(1-e^{-2\gamma dt})k_BT}\,\xi$、漂移、踢
- 已形成的天然接触比例：折叠时为 1，去折叠链约为 0.4（局部接触仍会不断形成）
- 对模拟后半段的时间平均；$T_m$ 为其穿过 ½ 的位置
labels:
  helix_length: 每段螺旋的珠子数
  T_min: 最低温度 $T$
  T_max: 最高温度 $T$
  temperatures: 温度个数 $B$
  friction: 摩擦系数 $\gamma$
  steps: 时间步数
