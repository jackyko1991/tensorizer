<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Spring pendulum: a mass m on a spring of length r swinging at angle theta under gravity g; its motion follows from the Lagrangian L = T - V">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <line x1="70" y1="20" x2="170" y2="20" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="76" y1="20" x2="68" y2="12"/>
      <line x1="90" y1="20" x2="82" y2="12"/>
      <line x1="104" y1="20" x2="96" y2="12"/>
      <line x1="118" y1="20" x2="110" y2="12"/>
      <line x1="132" y1="20" x2="124" y2="12"/>
      <line x1="146" y1="20" x2="138" y2="12"/>
      <line x1="160" y1="20" x2="152" y2="12"/>
    </g>
    <line x1="120" y1="20" x2="120" y2="132" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M120,50 A30,30 0 0 0 133.2,47" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="123" y="69" font-style="italic" fill="#b45309">θ</text>
    <path d="M120,20 L123.5,27.2 L119.2,32.1 L132.2,31.3 L123.6,41.1 L136.6,40.3 L128,50 L141,49.3 L132.4,59 L145.3,58.3 L136.7,68 L149.7,67.3 L141.1,77 L154.1,76.2 L145.5,86 L158.5,85.2 L154.2,90.1 L157.7,97.3" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="120" cy="20" r="3" fill="#374151"/>
    <circle cx="162.1" cy="106.3" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="157.1" y="111.3" font-style="italic" fill="#ffffff" font-size="11">m</text>
    <text x="152.8" y="66.7" font-style="italic">r</text>
    <line x1="162.1" y1="119.3" x2="162.1" y2="146.3" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="169.1" y="143.3" font-style="italic" fill="#b91c1c">g</text>
    <text x="14" y="148" font-size="13"><tspan font-style="italic">L</tspan> = <tspan font-style="italic">T</tspan> − <tspan font-style="italic">V</tspan></text>
  </g>
</svg>
