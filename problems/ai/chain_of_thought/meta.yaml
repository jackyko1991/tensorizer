title: Why chain of thought helps a transformer
category: ai
level: intermediate
order: 2
summary: >
  The parity of $n$ bits is a running XOR, an inherently serial task. Identical tiny transformers (hand-written einsum
  attention, all models stacked on one model axis and trained in one run) learn it in two formats: answering at once,
  "$b_1 \dots b_n = p$", or writing the running parities first, "$b_1 \dots b_n : s_1 \dots s_n = p$". With the same
  weights and steps, the scratchpad models answer 98–100% of the test strings at $n = 4$ to $10$, while the direct
  models only fit $n = 4$ and are at or below chance beyond; the attention shows the two-token rule
  $s_k = s_{k-1} \oplus b_k$. A toy of the mechanism, not of how large language models reason.
animated: true
vector_form: 's_k = s_{k-1} \oplus b_k,\quad s_0 = 0,\quad p = s_n \qquad \mathbf A^{(m,h)} = \operatorname{softmax}\!\Big(\frac{\mathbf Q^{(m,h)}\mathbf K^{(m,h)\mathsf T}}{\sqrt{d_k}} + \mathbf M\Big) \qquad \mathcal L = \sum_m \mathcal L_m'
index_form: 's_{nk} = \Big(\sum_{l \le k} b_{nl}\Big) \bmod 2 \qquad Q_{mnhik} = \hat X_{mnic} W^Q_{mhck} \qquad A_{mnhij} = \mathrm{softmax}_j\big(Q_{mnhik}K_{mnhjk}/\sqrt{d_k} + M_{ij}\big) \qquad \mathcal L_m = \frac{\sum_{n,i} \mu_{mni}\,\ell_{mni}}{\sum_{n,i}\mu_{mni}}'
translation:
  - {symbol: 's_{nk}', code: 'cumsum(bits, -1) % 2', shape: '(N, n)', meaning: 'running parity of every prefix: the scratchpad targets, and $p = s_n$'}
  - {symbol: 't_{mni}', code: 'make_batch(bits, n, cot, ctx)', shape: '(M, N, T)', meaning: 'strings in the direct or the CoT format as token ids $0, 1, :, =, \_$; padded with blanks so every model of one $n$ shares one tensor'}
  - {symbol: 'X_{mnic}', code: "w['tok'][m, tokens] + w['pos'][:, None, :T]", shape: '(M, N, T, d)', meaning: 'token plus learned position embedding, each model $m$ with its own tables'}
  - {symbol: 'Q_{mnhik}', code: "einsum('mnic,mhck->mnhik', X, Wq)", shape: '(M, N, H, T, d_k)', meaning: 'repeated $c$ ⇒ summed; the model index $m$ is not summed, so $M$ independent transformers run in one product'}
  - {symbol: 'A_{mnhij}', code: "softmax(einsum('...ik,...jk->...ij', Q, K) / sqrt(dk) + M, -1)", shape: '(M, N, H, T, T)', meaning: 'causal attention: each row is a probability distribution over the positions $j \le i$'}
  - {symbol: '\mu_{mni}', code: 'mask', shape: '(M, N, T)', meaning: 'which next tokens are trained: $p$ alone (direct), or $s_1 \dots s_n$, "=" and $p$ (CoT)'}
  - {symbol: '\mathcal L_m', code: 'masked_loss(logits, targets, mask)', shape: '(M,)', meaning: 'mean $-\log p$ of the trained tokens of model $m$ (nats); their sum is minimised, and each term only reaches its own weights'}
  - {symbol: 's_k \text{ written}', code: 'greedy(w, bits, n, cot, ctx)', shape: '(M, N, T)', meaning: 'at test time the model writes its own scratchpad, one token per forward pass, and answers after it'}
notes: >
  Status: the effect shown is established. Parity is the textbook hard case for a transformer of fixed depth that
  must answer at once. Li, Liu, Zhou and Ma (ICLR 2024, arXiv 2402.12875) prove that constant-depth transformers
  without intermediate steps are limited to shallow parallel circuits ($\mathrm{TC}^0$-like, under their
  precision assumptions), while $T$ steps of chain of thought let them simulate a serial circuit of size $T$. Nye et
  al. (2021, arXiv 2112.00114) trained transformers to write a "scratchpad" of intermediate results and saw them
  solve multi-step tasks such as long addition and program tracing; Wei et al. (2022, arXiv 2201.11903) named
  chain-of-thought prompting for large language models.

  Method: a string of $n$ bits is written either directly, "$b_1 \dots b_n = p$", or with its running parities,
  "$b_1 \dots b_n : s_1 \dots s_n = p$". Every model is the same 2-layer, $d = 64$, 4-head decoder (the
  `tiny_transformer` code, with a model axis $m$ added to every einsum), trained with AdamW for the same number of
  steps and the same batch of strings; the CoT models read about twice as many tokens per string and are trained on
  their intermediate tokens, which is exactly the extra help a scratchpad gives. All models, $n$ by format by seed,
  plus the length-generalisation models, train in one run: their weights are stacked on the leading axis and
  gradient clipping is done per model, so they never influence one another (a test checks it).

  Data: for $n \ge 8$ a quarter of the $2^n$ strings (at most 1024) is held out and never trained on; for $n = 4$
  and $6$ there are too few strings to hold any out, so those accuracies (starred on the plot) measure fitting, not
  generalisation. At test time a CoT model writes its own scratchpad greedily, token by token, and only its final
  answer is scored.

  Verdict: in the default run (2 seeds, numbers printed in the terminal), (a) the CoT models answer 0.98 to 1.00 of the
  test strings correctly at $n = 4, 6, 8, 10$; the direct models fit the 16 strings of $n = 4$ (1.00) but score
  0.53, 0.27 and 0.53 at $n = 6, 8, 10$. A plausible reading of the below-chance score at $n = 8$ (not tested
  here): a held-out string differs from its training neighbours in one bit and so has the opposite parity, and a
  model that interpolates between neighbours gets it wrong. (b) Length generalisation fails for both: models trained
  on $1 \le n \le 8$ score 0.46 to 0.51 at $n = 12$ and $16$, because positions beyond 19 were never trained and, with the CoT layout used here, the bit $b_k$ sits $n + 1$
  places before the cell that needs it, an offset that changes with $n$; the mixed-length CoT models master $n = 4$
  (1.00) but not even $n = 8$ (0.56) in the step budget. (c) Blanking out the scratchpad after $k$ steps drops the answer to
  chance for every $k < n$: the answer is copied from the last cell, so all of the computation lives in the written
  tokens. (d) In the CoT model at $n = 8$, at every step $k$ some head puts 0.5 to 0.8 of the attention of
  the query that writes $s_k$ on $b_k$, against 0.08 for uniform attention (one head alone averages 0.48 over the
  steps; the heads share the steps between them). The other input of the rule, $s_{k-1}$, is the query token itself
  and reaches the output through the residual stream, so the learned rule is local: two tokens per step.

  Limits: this is a toy that shows the mechanism, not how large language models reason. It says nothing about
  whether the written steps of a large model are faithful to the computation that actually produces its answer; that
  is an open research question. Results vary between seeds and with the step budget, which is why every seed is
  plotted. Try more steps, $n$ up to 16, or a single layer.
