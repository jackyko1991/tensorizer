source_hash: 176bf5bc914e
title: 分子のためのグラフニューラルネットワーク（メッセージパッシング）
summary: 分子はグラフであり、メッセージパッシング型ニューラルネットワークはその隣接行列についての数回の einsum である：各原子は隣接原子の状態の和 $s_{mic} = A_{mij}h_{mjc}$ を繰り返しとり、分子の予測は原子についての和である。ランダムな共役炭化水素のヒュッケル π 電子エネルギーを予測するよう訓練すると、原子の番号付けによらず同じ答えを出し、訓練に使ったどの分子より大きな分子でも機能する。隣接行列に対する素朴な MLP はそこで失敗する。
notes: 正解が厳密にわかるよう、データはあえて合成している。各「分子」は水素を省略したランダムな炭素骨格（炭素あたり隣接原子が最大三つの木を、いくつかの 5 員環と 6 員環で閉じたもの）であり、グラフ理論的なトイモデルで、実在化合物の精選セットではない。ラベルはヒュッケル π 電子エネルギーである：$H = \alpha + \beta A$ で、炭素あたり一つの π 電子が $A$ の固有値 $\lambda_k$ の大きい軌道から占有すると $E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$ となり、ネットワークはグラフだけから $y = \sum_k o_k\lambda_k$ を学習する。固有値は一度も見ない。テンソルの教訓は、グラフニューラルネットワークに必要な新しい演算は一つだけ、隣接行列についての einsum $A_{mij}h_{mjc}$ であり、これがすべての分子のすべての原子について隣接原子の状態を一度に足し合わせる、ということである。重みはすべて一度に一つの原子に作用し、原子どうしは $A$ と最後の和を通じてのみ結びつくので、モデルは構成上置換不変であり、同じ重みが任意の大きさの分子に当てはまる。コンソールは両方の性質を示す：原子の番号を付け替えると GNN の出力は約 $10^{-6}$（float32 の丸め）しか変わらないが、MLP の出力は $|\beta|$ の単位で丸ごと変わる。訓練データのどれより大きい炭素数 11–16 の分子では、MLP は入力の余分な行で何も見たことがないため失敗するが、GNN の誤差はほとんど増えない。「結合数え上げ」ベースライン $aN + bN_{bonds} + c$ と比べてみよう：π エネルギーはほぼ加成的（炭素あたり約 $1.2|\beta|$）で、GNN の本当の仕事は分岐、環、奇数電子による補正であり、そこで誤差をおよそ半分にする。メッセージを 4 回送っても届くのは 4 結合先までなので、共役系全体に依存する効果（芳香族性、4n 員環）は近似的にしか学習されない。これは Gilmer et al.（ICML 2017）のメッセージパッシングニューラルネットワーク（MPNN）の枠組みであり、彼らは以前の多くの分子グラフネットワークがこのパターンに当てはまることを示し、QM9
  分子の DFT 物性で訓練した。この系統のモデル（SchNet、DimeNet、3D 構造も用いる NequIP や MACE などの同変ネットワーク）は今では分子物性の予測や原子間ポテンシャルのフィットに広く使われているが、訓練データ以上には良くならず、それとかけ離れた化学では失敗しうる。1 層（最近接のみ）、少ない訓練分子、狭いネットワークを試してみよう。
meanings:
- 分子 $m$ の炭素骨格の隣接行列、ゼロで $N = 16$ 原子まで埋める
- 原子の特徴量：隣接炭素数（1、2、3）のワンホット表現
- 目標値：$A$ の占有ヒュッケル固有値（eigvalsh）、$|\beta|$ 単位の π エネルギー
- $f$ について和：各原子を $C$ チャネルに埋め込む
- $j$ の繰り返し ⇒ 原子 $i$ の隣接原子について和：メッセージ
- $c$ について和：すべての分子のすべての原子に同じ重み
- 学習された原子ごとのエネルギー（分子上の色）
- $i$ を実在の原子について和：示量的で、原子の順序に依存しない
- 原子の番号の付け替え：GNN の出力は浮動小数点精度で変わらない
- ベースライン：平坦化した 256 個の隣接行列成分に対する固定サイズのネットワーク
labels:
  n_train: 訓練分子数
  epochs: 訓練エポック数
  width: チャネル数 $C$
  layers: メッセージパッシング層数 $L$
  lr: Adam の学習率
