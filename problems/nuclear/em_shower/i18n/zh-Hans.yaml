source_hash: 24c72b95c811
title: 电磁簇射
summary: 高能电子射入铅块会引发级联：电子辐射光子，光子转化为电子–正电子对，能量每一步减半，直到降至临界能量。Heitler 模型被模拟为张量上的分支过程——每个粒子一行，每次分裂产生两个新行——并预言簇射极大 $N_{max} \approx E_0/E_c$ 出现在深度 $t_{max} \approx \ln(E_0/E_c)/\ln 2$ 处。
notes: 深度以辐射长度 $X_0$ 计（铅中为 0.56 cm），$E_c$ 是临界能量，铅中约为 7.4 MeV。当子粒子能量将低于 $E_c$ 时倍增停止，所以约 $\log_2(E_0/E_c)$ 个辐射长度后达到约 $E_0/E_c$ 个粒子的极大值：簇射深度只随能量对数增长，这就是量能器可以做得紧凑的原因。在固定长度模式下，每个粒子恰好在一个 $X_0$ 后分裂，所以整代粒子同步前进，数目呈阶梯式上升。随机模式（虚线显示另一模式以作比较）随机抽取每个相互作用点（光子平均走 $\tfrac97 X_0$）：各代在深度上被抹平，给出真实簇射那种更低、更宽、更长的剖面，而能量记账仍然精确。横向展宽仅为示意（角度偏转 $\propto E_c/E$）。Heitler 模型的简化：能量均分，$E_c$ 以上无电离损失，低于阈值的粒子一次沉积全部能量，不考虑康普顿散射和光电效应。随机种子固定。
meanings:
- 每个飞行中粒子的能量（MeV）和类型（1 = e±，0 = γ）；P 随簇射发展而变化
- 随机模式：$1 - e^{-\Delta t/\lambda}$，$\lambda = X_0$（e±）或 $\tfrac97 X_0$（γ）
- 布尔掩模：哪些粒子倍增，其余沉积能量
- e → e + γ 和 γ → e + e，作为拼接的两半
- 每个深度上飞行中的粒子数
- 低于临界能量的粒子沉积的能量
labels:
  e0: 初级能量 $E_0$
  e_crit: 临界能量 $E_c$
  mode: 分裂长度
