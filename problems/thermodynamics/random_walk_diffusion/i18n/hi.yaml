title: यादृच्छिक भ्रमण और विसरण
summary: हज़ारों ब्राउनी कण यादृच्छिक धक्के खाते हैं। एक (time, walker, 2) टेंसर में रखा गया भ्रमण एक cumsum है, और माध्य-वर्ग विस्थापन $\langle x_i x_i\rangle$ — एक einsum — समय के साथ $2dDt$ की तरह रैखिक बढ़ता है, जबकि कणों का बादल गाउसीय रूप में फैलता है।
notes: हर चरण प्रति घटक $2D\Delta t$ प्रसरण वाला गाउसीय धक्का है, इसलिए समय $t$ के बाद हर निर्देशांक का प्रसरण $2Dt$ होता है और प्रारंभ से दूरी का वर्ग $d$ विमाओं में औसतन $2dDt$ होता है (यहाँ $d = 2$)। कण सूचकांक $n$ पर योग यादृच्छिक बादल को एक चिकने, पूर्वानुमेय नियम में बदल देता है — यही विसरण है। कणों की परिमित संख्या के कारण मापा गया MSD आपेक्षिक रूप से लगभग $\sqrt{2/N}$ डगमगाता है; seed स्थिर है ताकि चित्र दोहराया जा सके। मात्रक मनमाने हैं (मान लीजिए µm और s)।
meanings:
- चरण $s$, कण $n$, घटक $i$ के लिए स्वतंत्र मानक-प्रसामान्य धक्का
- 'समय $t$ पर कण $n$ की स्थिति: उसके धक्कों का चलता योग'
- 'दोहराए गए $n$ और $i$ ⇒ योग: हर समय पर माध्य-वर्ग विस्थापन'
- मूल बिंदु से गुज़रती MSD बनाम $t$ की न्यूनतम-वर्ग ढाल, $2d$ से विभाजित
- बिंदु स्रोत से विसरण समीकरण $\partial_t\rho = D\,\partial_i\partial_i\rho$ का हल
labels:
  n_walkers: भ्रमणकर्ता कण
  D: विसरण नियतांक $D$
  t_max: सिमुलेशन समय
  n_steps: समय चरण
