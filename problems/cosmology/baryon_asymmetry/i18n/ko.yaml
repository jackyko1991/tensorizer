source_hash: 4c18d665b55e
title: 왜 반물질보다 물질이 많을까?
summary: 우주에는 광자 하나당 약 $6\times 10^{-10}$개의 바리온이 있고 반물질은 거의 없습니다. 사하로프의 세 조건은 어떤 설명이든 무엇이 필요한지 알려 줍니다. 유력한 후보인 렙토제네시스에서는 무거운 마요라나 중성미자가 반렙톤보다 렙톤으로 약간 더 자주 붕괴하고(CP 비대칭 $\varepsilon$), 역붕괴가 그중 일부를 씻어 내며(세기 $K$), 스팔레론이 렙톤을 바리온으로 바꿉니다. 수천 개 $(\varepsilon, K)$ 모형의 볼츠만 방정식을 하나의 배치 ODE로 풀어 관측된 $\eta_B$와 비교합니다. 미해결 문제입니다.
notes: '관측: CMB에서 바리온 대 광자 비는 $\eta_B = (6.12 \pm 0.04)\times 10^{-10}$(Planck 2018, $\Omega_bh^2 = 0.0224$)이며 빅뱅 핵합성과 일치하고, 반물질 은하의 흔적은 없습니다. 대칭인 우주에서 출발할 때 비대칭이 생기려면 (1) 바리온 수 위반, (2) C와 CP 위반, (3) 열평형에서의 이탈이 필요하다는 것을 사하로프(1967)가 보였습니다. 테스트는 (2)와 (3)을 직접 확인합니다: $\varepsilon = 0$이거나 무거운 중성미자를 평형에 묶어 두면 정확히 0이 됩니다. (1)은 표준모형의 스팔레론 과정으로, 약 130 GeV 이상에서 $B - L$을 $B = \tfrac{28}{79}(B - L)$로 바꿉니다. 쿼크의 CP 위반(CKM 위상)은 너무 작고 전약 전이는 크로스오버이므로 표준모형만으로는 실패합니다: 새로운 물리가 필요합니다. 렙토제네시스(Fukugita와 Yanagida 1986)는 시소 메커니즘의 무거운 오른손잡이 중성미자를 사용하며, 이 메커니즘은 가벼운 중성미자가 왜 그렇게 가벼운지도 설명합니다. 이 장난감 모형은 가장 가벼운 $N_1$의 붕괴와 역붕괴만 남기며($\Delta L = 2$ 산란, 향 효과, 열 보정 없음), Buchmüller, Di Bari, Plümacher(2005)의 규격화를 따릅니다. 약한 워시아웃($K \ll 1$)에서 열적 초기 조건이면 비대칭이 모두 남고($\kappa_f \to 1$, 확인함), 강한 워시아웃($K \gg 1$)에서는 대부분을 잃지만 초기 조건을 잊으며(두 초기 조건이 합쳐짐), 솔버는 그들의 해석적 근사식과 약 10% 이내로 일치합니다. $K = \tilde m_1/m_*$, $m_* \approx 1.08\times10^{-3}$ eV로 두면, 진동 실험에서 보이는 중성미자 질량($\approx 0.009$–$0.05$ eV)은 $K \approx 10$–$50$을 가리키고, 거기서는 $\varepsilon
  \approx 2\times10^{-6}$–$10^{-5}$가 필요합니다. 그러면 Davidson–Ibarra 한계 $\varepsilon \lesssim 10^{-6}\,(M_1/10^{10}\,\mathrm{GeV})$에 의해 $M_1 \gtrsim 10^{10}$ GeV가 요구됩니다. 현황: 미해결. 렙토제네시스는 매력적이고 알려진 모든 것과 모순되지 않지만 확인되지 않았습니다: 무거운 중성미자는 가속기로 닿을 수 없는 영역에 있습니다. 간접적인 단서로는 중성미자 없는 이중 베타 붕괴(마요라나 성질)와 중성미자 진동의 CP 위반(T2K, NOvA, 이후 DUNE과 하이퍼카미오칸데)이 있으며, 전약 바리오제네시스 등 다른 메커니즘도 대안으로 남아 있습니다. 이 페이지는 장난감 방정식을 수치적으로 탐구할 뿐, 비대칭이 실제로 이렇게 생겼다고 주장하지 않습니다.'
meanings:
- '$z = M/T$, 로그 간격: 우주가 식으면서 시계가 흐름'
- CP 비대칭은 첫째 축, 붕괴 매개변수는 둘째 축에 놓여 모두 $(E, K)$로 브로드캐스트
- '$\tfrac38 z^2K_2(z)$: 상대론적인 동안 광자당 $3/4$, 이후 $e^{-z}$'
- 스텝 중점에서 허블 시간당 붕괴와 역붕괴
- '$N_N - N_N^{eq}$: 평형에서의 이탈(사하로프 조건 3)'
- '선형 ODE의 정확한 한 스텝 인자: $K = 1000$에서도 안정'
- 모든 모형의 $B - L$ 비대칭을 스텝마다 한 번의 텐서 갱신으로 진행
- 스팔레론은 $B - L$의 $28/79$를 바리온으로 남기고, 광자는 $f = 2387/86$배로 늘어남
- '효율: 약한 워시아웃에서 $1$, 강한 워시아웃에서 $\approx 1/(K z_B)$'
labels:
  log_eps: '표시할 모형: $\log_{10}\varepsilon$'
  log_K: '표시할 모형: $\log_{10}K$'
  initial: 무거운 중성미자의 초기 함량
  n_eps: $\varepsilon$ 격자점 수
  n_K: $K$ 격자점 수
  steps: $z$ 적분 스텝 수
  z_max: 최종 $z = M/T$
