source_hash: 52a00886e77c
title: 'Бёрч и Суиннертон-Дайер: подсчёт точек по модулю p'
summary: Подсчитайте точки пяти эллиптических кривых ранга от 0 до 4 над $\mathbb F_p$ сразу для всех простых до $X$, проследите, как произведения $\prod_{p\le X} N_p/p$ растут как $(\log X)^r$, что впервые заметили Бёрч и Суиннертон-Дайер, и вычислите $L(E, s)$ в точке $s = 1$, где она обращается в нуль с порядком, равным рангу. Гипотеза о том, что так бывает всегда, остаётся открытой; она доказана только для аналитического ранга 0 и 1.
notes: 'Эллиптическая кривая $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ над $\mathbb Q$ имеет конечно порождённую группу рациональных точек $E(\mathbb Q) \cong \mathbb Z^r \oplus T$ (Морделл, 1922); ранг $r$ вычислить трудно. В начале 1960-х годов Бёрч и Суиннертон-Дайер подсчитывали точки по модулю простых чисел на компьютере EDSAC и заметили, что $\prod_{p \le X} N_p/p$ растёт как $(\log X)^r$: больше рациональных точек влечёт больше точек по модулю $p$. Они предположили, что $L(E, s)$, построенная из $a_p$, обращается в нуль в точке $s = 1$ с порядком ровно $r$, а старший коэффициент равен $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$. Это одна из задач тысячелетия Института Клэя, и она открыта. Доказано: если аналитический ранг равен 0 или 1, то ранг равен ему и Ш конечна (Гросс и Загир 1986, Колывагин 1989); при этом используется модулярность (Уайлс, Тейлор–Уайлс 1995, Бройль–Конрад–Даймонд–Тейлор 2001), благодаря которой $L(E, s)$ вообще продолжается
  до $s = 1$. Для аналитического ранга $\ge 2$ ничего общего не известно. Пять кривых — кривые наименьшего кондуктора рангов от 0 до 4 (11a1, 37a1, 389a1, 5077a1 и 234446a1 в таблицах Кремоны). Здесь: следы удовлетворяют оценке Хассе $|a_p| \le 2\sqrt p$; для 11a1 они совпадают с коэффициентами модулярной формы $\eta(q)^2\eta(q^{11})^2$ (проверено); корневые числа равны $\varepsilon = (-1)^r$; первая ненулевая производная в точке $s = 1$ для каждой кривой — $r$-я, а значения $L(E,1) = 0.2538418608\ldots$, $L''(E,1) = 0.3059997738\ldots$, $L''''(E,1)/2 = 0.7593165\ldots$ и $L''''''(E,1)/6 = 1.7318499\ldots$ совпадают с LMFDB. Для 11a1 полная формула подтверждается: $L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$. Численный нуль производной — это свидетельство, а не доказательство того, что она обращается в нуль. Частичные произведения — исходная эвристика: Голдфелд (1982) показал, что если они действительно ведут себя как $C(\log X)^r$, то $r$ — аналитический ранг и
  для $L(E, s)$ выполняется гипотеза Римана, так что сама их сходимость гипотетична и медленна. Наклоны правильно упорядочивают ранги от 0 до 3 уже при $X = 2\times 10^4$, но кривая ранга 4 при $X = 3\times 10^4$ всё ещё отстаёт от своего ранга. Распределение Сато–Тейта для $a_p/2\sqrt p$, полукруг $\frac{2}{\pi}\sqrt{1-x^2}$, является теоремой для кривых без комплексного умножения (Тейлор и соавторы, 2008–2011).'
meanings:
- все кривые, все простые блока и все $x \in \mathbb F_p$ сразу (схема Горнера с приведением по модулю $p$ на каждом шаге)
- символ Лежандра по таблице квадратов $y^2 \bmod p$; $\chi = 0$ при $v = 0$
- 'след Фробениуса; Хассе: $|a_p| \le 2\sqrt p$'
- частичные произведения сразу для всех $X$ (только простые с хорошей редукцией)
- наклон на $\sqrt{X} \le p \le X$; сходится очень медленно
- коэффициенты Дирихле по мультипликативности, по одному срезу с шагом на каждую степень простого $q = p^k$
- 'повторный $n$ ⇒ суммирование: $F(t)$ в узлах Гаусса–Лежандра $t = e^{u_m}$'
- все производные в точке $s = 1$ сразу; первая ненулевая даёт аналитический ранг
labels:
  x_max: Простые до $X$
