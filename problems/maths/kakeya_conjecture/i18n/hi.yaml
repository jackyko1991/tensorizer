title: काकेया अनुमान
summary: एक सुई को मनचाहे छोटे क्षेत्रफल वाले समुच्चय के भीतर हर दिशा में घुमाया जा सकता है। यह समस्या ऐसा एक समुच्चय बनाती है (पेरॉन का वृक्ष, जिसमें $2^k$ पतले त्रिभुज बगल की ओर खिसकाए गए हैं) और पंक्ति-दर-पंक्ति उसका क्षेत्रफल ठीक-ठीक मापती है। फिर यह $\mathbb R^2$, $\mathbb R^3$ और $\mathbb R^4$ में $\delta$-ट्यूबों के सम्मिलनों को $\delta$-घनों से ढककर उनकी विमा का अनुमान लगाती है। काकेया अनुमान कहता है कि ऐसे समुच्चयों की विमा फिर भी पूर्ण $n$ होती है। यह $n = 2$ के लिए और, 2025 से, $n = 3$ के लिए सिद्ध है; $n \ge 4$ के लिए अब तक के एकमात्र प्रमाण असत्यापित, AI-जनित दावे हैं।
notes: 'काकेया ने 1917 में पूछा था कि वह न्यूनतम क्षेत्रफल क्या है जिसमें एक इकाई-लंबाई की सुई को पूरा घुमाया जा सके। बेसिकोविच (1919, 1928) ने पाया कि हर दिशा में एक इकाई रेखाखंड वाले समुच्चय का माप शून्य हो सकता है, और पेरॉन (1928) ने इस रचना को सरल करके यहाँ दिखाए गए वृक्ष का रूप दिया। एक त्रिभुज को $2^k$ पतली फाँकों में काटिए और उन्हें बगल की ओर खिसकाइए। हर फाँक अपनी दिशाएँ बनाए रखती है, और पेरॉन के चरण के हर दौर के बाद अतिव्यापन बढ़ता है। क्षेत्रफल $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ का पालन करता है (जाँचा गया), और 24 मान एक साथ आज़माकर पाया गया सर्वोत्तम $\alpha$ इसे $\ln k / k$ की तरह घटाता है। कोर्दोबा (1977) ने सिद्ध किया कि समतल में किसी काकेया समुच्चय के $\delta$-प्रतिवेश का क्षेत्रफल कम से कम $c / \log(1/\delta)$ होता है, इसलिए यह धीमा क्षय अपरिहार्य है, और डेविस (1971) ने सिद्ध किया कि हर समतलीय काकेया समुच्चय की हाउसडॉर्फ़ और मिंकोव्स्की विमा 2 होती है। 60° घुमाए गए तीन वृक्षों में हर दिशा में एक इकाई सुई समाई होती है (लाल सुई 180° घूमती है); पाल की युक्ति से
  स्थितियों को जोड़ने पर सुई सचमुच मनचाहे छोटे क्षेत्रफल वाले समुच्चय के भीतर घूम सकती है। $\mathbb R^n$ में काकेया समुच्चय अनुमान कहता है कि हर ऐसे समुच्चय की विमा $n$ होती है: $\delta$-पृथक दिशाओं में त्रिज्या $\delta$ की ट्यूबें बहुत अधिक अतिव्यापित नहीं हो सकतीं, इसलिए उनके सम्मिलन का आयतन $\gtrsim_\varepsilon \delta^{\varepsilon}$ होता है। दाईं ओर के पैनल दो विन्यासों (सभी ट्यूबें मूलबिंदु से होकर, और यादृच्छिक केंद्र) के लिए $\delta$-घनों की गिनती करते हैं। $\log(1/\delta)$ के सापेक्ष $\log N$ की ढलान हर स्थिति में $n$ के निकट पहुँचती है, जैसा कि अनुमान सत्य होने पर होना ही चाहिए। कंप्यूटर केवल विशेष विन्यासों का परीक्षण कर सकता है, सभी का कभी नहीं। स्थिति (नवंबर 2026): $n = 2$ सिद्ध (डेविस 1971)। $n = 3$ को होंग वांग और जोशुआ ज़ाल ने सिद्ध किया (प्रीप्रिंट 2025), वोल्फ़ की सीमा $(n+2)/2$ (1995) और काट्ज़–वाबा–ताओ के बाद। $n \ge 4$ के लिए समस्या समकक्ष-समीक्षित साहित्य में खुली है। OpenAI द्वारा प्रकाशित AI-जनित पांडुलिपि-संग्रह (github.com/openai/math, फ़ैमिली 074 और 079) चतुर्विम
  स्थिति का, और सॉग के स्थानीय स्मूदिंग अनुमान के माध्यम से हर विमा का दावा करता है। रिपॉज़िटरी कहती है कि इसके कुछ कथनों को Lean में औपचारिक रूप दिया गया है, लेकिन ये बिना समीक्षा वाले, मशीन द्वारा बनाए गए दावे हैं जो अभी भी गणितीय समुदाय की जाँच की प्रतीक्षा में हैं, इसलिए यह पृष्ठ इन्हें सिद्ध नहीं, बल्कि दावा किया गया मानता है। यह अनुमान ज्यामिति से कहीं आगे तक महत्वपूर्ण है: यह हार्मोनिक विश्लेषण के फ़ूरिये प्रतिबंध (रेस्ट्रिक्शन) और बॉखनर–रीस अनुमानों से निकलता है।'
meanings:
- 'शीर्ष $(0, 1)$ वाले $N = 2^k$ पतले त्रिभुज, जिनके आधार $[b_i, b_i + w_0]$ अंतराल $[-1/\sqrt3, 1/\sqrt3]$ को बाँटते हैं: दिशाओं का एक 60° शंकु, हर भुजा $\ge 1$'
- $k$ पेरॉन दौरों के बाद क्षैतिज विस्थापन, $\alpha$ के $A$ मानों के लिए एक साथ; हर दौर पड़ोसी 'हृदयों' को छुआता है और दाएँ वाले को $(1-\alpha)(c - a)$ से बाईं ओर धकेलता है
- जहाँ त्रिभुज $i$ ऊँचाई $y$ पर क्षैतिज रेखा को काटता है
- हर पंक्ति के अंतरालों को उनके बाएँ सिरे से क्रमबद्ध करें; दाएँ सिरों का चालू अधिकतम बताता है कि कितना पहले से ढका है
- 'दोहराए गए $i$ और $y$ ⇒ योग: हर पंक्ति के सम्मिलन की सटीक लंबाई, पंक्तियों पर औसत (मध्यबिंदु नियम)'
- 'घन $[-1,1]^n$ के फलकों पर एक $\delta$-ग्रिड, गोले पर धकेला गया: लगभग $\delta$-पृथक रेखा-दिशाएँ'
- हर ट्यूब जिन भुजा $\delta$ वाले घनों से मिलती है, उसके साथ-साथ हर $\delta/2$ पर नमूना लेकर
- 'दोहराया गया $i$ ⇒ योग: हर घन के लिए एक पूर्णांक कुंजी, इसलिए भिन्न घनों की गिनती एक ही सॉर्ट है'
- 'दोहराया गया $j$ ⇒ योग: 0°, 60°, 120° घुमाई गई वृक्ष की तीन प्रतियाँ हर दिशा को ढकती हैं'
labels:
  k_max: पेरॉन दौर $k$ ($2^k$ त्रिभुज)
  n_max: विमा $n$ तक ट्यूबें
