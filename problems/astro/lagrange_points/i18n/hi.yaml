title: प्रतिबंधित त्रि-पिंड समस्या के लाग्रांज बिंदु
summary: एक तारा और एक ग्रह एक-दूसरे की परिक्रमा करते हैं; उनके घूर्णी फ़्रेम में एक परीक्षण कण गुरुत्व, अपकेंद्री बल और कोरिओलिस बल अनुभव करता है, जो $\varepsilon_{ijk}$ से लिखे गए हैं। $\nabla\Phi_\mathrm{eff} = 0$ पर न्यूटन विधि (प्रवणता और हेसियन autograd से) पाँचों लाग्रांज बिंदु एक साथ ढूँढती है, और L4 से थोड़ा हटाए गए कण उसके चारों ओर टैडपोल कक्षाएँ बनाते हैं।
notes: 'मात्रक: पृथक्करण 1, $G(M_1 + M_2) = 1$, अतः युग्म हर $2\pi$ में एक बार घूमता है। ग्रह का द्रव्यमान अंश $\mu$ है, और परीक्षण कण इतने हल्के हैं कि किसी पिंड को प्रभावित नहीं करते। L1, L2 और L3 पिंडों से होकर जाती रेखा पर हैं और $\Phi_\mathrm{eff}$ के काठी बिंदु (saddle points) हैं; L4 और L5 दोनों पिंडों के साथ समबाहु त्रिभुज बनाते हैं और $\Phi_\mathrm{eff}$ के उच्चिष्ठ हैं, फिर भी $\mu < 0.0385$ होने पर कोरिओलिस बल उन्हें स्थायी बनाता है। इसीलिए बृहस्पति के ट्रोजन क्षुद्रग्रह ग्रह से 60° आगे और पीछे इकट्ठा होते हैं। कण ग्रह की कक्षा पर, L4 से कुछ डिग्री आगे, विराम से शुरू होते हैं: छोटे विस्थापन छोटे टैडपोल लूप देते हैं (ऊपर से तेज़ अधिचक्रों के साथ), बड़े विस्थापन कक्षा के अनुदिश लंबे केले-जैसे लूप बनाते हैं, और लगभग 20° से आगे ($\mu = 0.01$ के लिए) कण भटक जाता है। $\mu$ के 0.0385 से ऊपर होने पर बहुत छोटे विस्थापन भी दूर बह जाते हैं।'
meanings:
- घूर्णी फ़्रेम में परीक्षण कण $b$ की स्थिति
- तारा $(-\mu, 0, 0)$ पर और ग्रह $(1-\mu, 0, 0)$ पर
- 'दोहराया गया $s$ ⇒ योग: दोनों पिंडों का गुरुत्व'
- सदिश गुणनफलों के लिए लेवी-चिविटा प्रतीक
- कोरिओलिस त्वरण, $\boldsymbol\Omega = \hat{\mathbf z}$
- पाँचों बिंदुओं पर autograd से प्रवणता
- 'autograd से हेसियन: न्यूटन चरण एक बैच linalg.solve है'
- $-2\Phi_\mathrm{eff} - \dot x_i\dot x_i$, संरक्षित
labels:
  mu: ग्रह का द्रव्यमान अंश $\mu$
  nudge: L4 से आगे सबसे बड़ा विस्थापन
  t_max: अनुकरण समय
  dt: समय चरण
