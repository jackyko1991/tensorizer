source_hash: 3955d9d3b7d9
title: ミカエリス–メンテンの酵素反応速度論
summary: 酵素は基質と結合して複合体を作り、生成物を放出する：$E + S \rightleftharpoons ES \to E + P$。3 種類の酵素と基質の滴定系列全体について、完全な質量作用の方程式を一つの $(4, B, C)$ テンソルで同時に解き、準定常状態の速度式 $v = V_{max} S/(K_m + S)$ およびラインウィーバー–バークのフィットと比較する。
notes: 質量作用だけで 4 本の連立常微分方程式が得られる。Michaelis と Menten（1913）は、Briggs と Haldane（1925）の形式で言えば、複合体 $ES$ が 1 秒足らずで蓄積し、その後はゆっくりとしか変化しないことに気づいた。そこで $d[ES]/dt \approx 0$ とおける。$E + ES = E_0$ と合わせると $[ES] = E_0 S/(K_m + S)$ と速度式 $v = k_2 [ES] = V_{max} S/(K_m + S)$ が得られ、$K_m = (k_{-1} + k_2)/k_1$、$V_{max} = k_2 E_0$ である。中央のパネルの点は各試験管の現在の $(S, k_2 [ES])$ を示す：バーストの後、点は破線の曲線上に乗り、基質が消費されるにつれて曲線に沿って下っていく。これが準定常状態近似（QSSA）の働きである。縮約モデル $dS/dt = -V_{max} S/(K_m + S)$（オレンジの破線）には厳密解 $S_0 - S + K_m \ln(S_0/S) = V_{max} t$ さえある。この近似は $E_0 \ll S_0 + K_m$ のとき成り立つ。$E_0$ を 2 µM に上げると、複合体に取り込まれた基質がもはや無視できないため、完全な速度論が QSSA より遅れるのが見える。生化学者はいくつかの $S_0$ で初速度 $v_0$ を測り、$1/v_0 = (K_m/V_{max})(1/S_0) + 1/V_{max}$ という直線（ラインウィーバー–バーク、1934）をフィットする：$y$ 切片は $1/V_{max}$、$x$ 切片は $-1/K_m$ である。二重逆数プロットは低い $S_0$ での誤差を拡大するので、ノイズのあるデータでは直接の非線形フィットのほうがよい。酵素 A、B、C は結合と速さを引き換えにしている：A は $K_m$ が小さく、C は $k_{cat}$ が最大である。低基質濃度でどれが勝つかは触媒効率 $k_{cat}/K_m$ が決める。単純化：活性部位は一つ、生成物の放出は不可逆、阻害なし、体積は十分に混合されている。
meanings:
- 酵素 $b$ の結合・解離・触媒の速度定数（$k_2 = k_{cat}$）
- 滴定の初期基質濃度 $c$（µM）
- 各試験管の遊離酵素、基質、複合体 $X = ES$、生成物
- どの添字も和をとらない：$k_b$ はすべての濃度 $c$ にブロードキャストされる
- RK4 の右辺；$E + X = E_0$ と $S + X + P = S_0$ は一定に保たれる
- ミカエリス定数（半分の速度になる基質濃度）と最大速度
- 初（定常状態）速度、短いバーストの後に測定
- ラインウィーバー–バークの正規方程式、$A_{ck} = [1/S_c,\ 1]$；繰り返される $c$ ⇒ 和
- 各酵素の傾き $K_m/V_{max}$ と切片 $1/V_{max}$
labels:
  E0: 酵素 $E_0$
  t_end: シミュレーション時間
  enzyme: 経時変化曲線に使う酵素
