source_hash: 433f576ee66b
title: 'De la radiographie thoracique au compte rendu par un tenseur DAG : un CNN et un minuscule LM assemblés'
summary: 'Un jouet pédagogique, pas de la génération de comptes rendus cliniques. Un petit CNN apprend six signes à partir de 410 radiographies thoraciques du NIH, et un minuscule GPT au niveau des caractères apprend des comptes rendus types ("enlarged heart. pleural effusion. no pneumothorax.") à partir d''un en-tête d''étiquettes écrit, chacun séparément. Une seule arête du DAG les relie : un connecteur transforme les probabilités de signes du CNN en un en-tête souple, de sorte que le LM rédige un compte rendu à partir de la seule image. Le processus d''entraînement est lui-même un DAG tensoriel (règles par niveaux, chemin critique max-plus, un appel groupé par règle sur toutes les graines), comparé au même réseau entraîné de bout en bout avec le même calcul, puis affiné sur 251 textes réels (légende de figure + phrases citant cette radiographie) issus d''articles PubMed Central sous licence ouverte (CC BY). L''étape 2 est faible, comme on pouvait s''y attendre avec si peu de paires, et
  la page le dit.'
notes: 'Ce que c''est. Un jouet pédagogique, pas de la génération de comptes rendus cliniques : de minuscules modèles, des images 64×64, quelques centaines d''étiquettes bruitées, et aucun vrai compte rendu de radiologie. Rien ici ne dit quoi que ce soit sur la précision clinique. L''idée (des réseaux entraînés séparément, reliés par un tenseur DAG, optimisés globalement, l''ensemble du processus étant lui-même piloté par le tenseur DAG) est celle de Jacky Ka Long Ko ; ce problème transpose l''assemblage CNN + minuscule LM du problème précédent de cette série aux radiographies thoraciques et à un texte qui se lit comme un compte rendu (très court). Pourquoi pas de vrais comptes rendus. Aucune des collections de comptes rendus librement disponibles ne satisfait la règle de licence utilisée ici (ouverte, redistribuable, usage commercial autorisé) : IU X-ray / OpenI (Demner-Fushman et al. 2016) est sous CC BY-NC-ND ; MIMIC-CXR (Johnson et al. 2019), VinDr-CXR et BRAX exigent un accès accrédité
  sous accord d''utilisation des données ; CheXpert et PadChest sont réservés à la recherche. L''étape 1 utilise donc des comptes rendus types générés par le code à partir des ensembles d''étiquettes du NIH, ce qui en fait une classification multi-étiquettes verbalisée en texte, et l''étape 2 utilise des légendes de figures ainsi que les phrases qui citent la figure, tirées d''articles PubMed Central sous CC BY : des textes courts et hétérogènes, écrits pour des rapports de cas, qui renvoient souvent à des flèches et à des panneaux. Ce qui est nouveau et ce qui ne l''est pas. La génération de comptes rendus à partir de radiographies thoraciques est un domaine actif (Jing et al. 2018, R2Gen par Chen et al. 2020) ; un encodeur d''images préentraîné relié à un modèle de langage par un petit connecteur appris, c''est ainsi que sont construits LLaVA (Liu et al. 2023) et BLIP-2 (Li et al. 2023). Ce que ce problème apporte, c''est l''orchestration : le graphe du modèle et le processus d''entraînement
  sont tous deux exécutés par le moteur de DAG tensoriel du problème de workflow du cercle de Willis (graphe des règles analysé depuis data/training.smk, graphe des tâches de Kronecker, niveaux booléens, chemin critique max-plus), chaque règle étant un appel groupé sur les graines, et le modèle construit par le DAG est mesuré face à un monolithe disposant du même calcul. Données. NIH ChestX-ray14 (Wang et al. 2017, NIH Clinical Center ; aucune restriction d''usage, avec attribution) : 549 images frontales PA, une par patient, six signes (cardiomégalie, épanchement, infiltrat, atélectasie, pneumothorax, masse ou nodule) ou aucun, au plus deux par image ; 410 pour l''entraînement, 139 pour le test. Les étiquettes ont été extraites des comptes rendus par TAL et sont bruitées (environ 10 % ou plus d''erreurs). PMC : 316 figures de radiographies thoraciques issues de 316 articles en libre accès, toutes sous CC BY (vérifié dans la licence du propre XML de l''article ; règle : CC BY, CC BY-SA ou
  CC0, rejet de NC, ND, autre ou absente). Les candidats proviennent des métadonnées ROCOv2 (Rückert et al. 2024), utilisées uniquement comme index de PMCID ; rien de ROCOv2 n''est inclus. Sur 2114 articles vérifiés, 1575 ont été acceptés et 539 rejetés pour leur licence (tous CC BY-NC). Le texte de l''étape 2 est la légende suivie des phrases du même article qui citent la figure (315 des 316 articles en ont au moins une), uniquement des phrases entières, jusqu''à 360 caractères, le contexte du minuscule LM : médiane de 35 mots (IQR 26–45) contre 12 (8–18) pour la légende seule. Chaque figure et chaque texte est crédité dans data/ATTRIBUTION.csv ; data/SOURCES.md donne les sources, conditions, effectifs, sommes de contrôle et traitements. Les modèles et le DAG d''entraînement. CNN : trois convolutions groupées, 41 014 poids, six sorties sigmoïdes (multi-étiquettes, positifs pondérés selon leur rareté). LM : un GPT de caractères à deux couches (d = 32, quatre têtes, 40 108 poids) entraîné
  sur tous les modèles de compte rendu, l''en-tête d''étiquettes écrit en six lettres au début ("ce----", puis "enlarged heart. pleural effusion."). Connecteur (2848 poids) : à partir des six probabilités $q$ et d''un vecteur de position $S_t$, il produit les $K = 6$ jetons souples qui remplacent l''en-tête. Niveaux : 0 train_cnn ∥ train_lm ∥ train_monolith ; 1 train_connector (CNN et LM gelés) ; 2 global_finetune ∥ train_router ; 3 caption_finetune (connecteur + LM sur les textes PMC, CNN gelé) ; 4 evaluate. Les tests vérifient les niveaux et le chemin critique, que le graphe des tâches est nilpotent, que deux graines dans une même pile s''entraînent exactement comme chacune seule (à l''arrondi float32 près), que la perte d''un modèle n''envoie aucun gradient aux autres, que l''étape du connecteur ne modifie que le connecteur, et que la couche MoE avec le routeur fixe égale le câblage du DAG à 1e-6 près, gradients compris. Les comptes rendus sont écrits de façon gloutonne (avec un cache
  clé/valeur, testé contre la passe avant simple) et reconvertis en étiquettes par mots-clés, avec négation ("no pneumothorax."). Résultats de l''étape 1 (2 graines, 139 images de test, moyennes sur les graines ; results/stages.csv contient tous les chiffres). Le CNN seul : AUROC moyenne 0.62 (hasard 0.5), micro F1 0.31 au seuil 0.5 (deviner au hasard selon la prévalence d''entraînement : 0.16). Ses étiquettes écrites comme en-tête pour le LM seul : micro F1 0.32, donc le LM verbalise fidèlement (0.90 de ses sorties sont des modèles bien formés, même pour des ensembles d''étiquettes jamais vus). Le modèle assemblé : micro F1 0.22 après l''étape du connecteur et 0.20 après l''affinage global (0.15 à 0.25 selon les exécutions et les graines), chaque compte rendu étant un modèle bien formé, et 0.26 à 0.27 étant exactement le modèle des vraies étiquettes. Le monolithe, le même réseau entraîné de bout en bout sur les 410 paires image–compte rendu avec les mêmes multiplications-additions (405
  pas conjoints), écrit "clear lungs." ou "normal chest." pour chaque image : micro F1 0, exact 0.27 (la part des images normales). Le pipeline DAG bat donc nettement le monolithe, parce qu''il réutilise la supervision par étiquettes du CNN et tout le texte des modèles, mais il ne bat pas le CNN seul : un compte rendu type ne peut que reformuler ce que sait le classifieur, et le modèle assemblé, entraîné par vraisemblance, écrit le compte rendu le plus probable, qui penche vers "normal" quand l''image est ambiguë, tandis que le seuil du CNN pondéré par la rareté favorise le rappel, que $F_1$ récompense. L''affinage change peu de chose. Arête du DAG = répartition MoE. La couche d''entrée vue comme un mélange d''experts (expert image = CNN + connecteur, expert texte = plongement des jetons) avec $G$ one-hot selon le type de données donne exactement les sorties câblées par le DAG (testé). Un routeur linéaire entraîné comme un mélange dense avec les experts gelés, puis utilisé en top-1 (router,
  puis exécuter l''expert choisi), envoie chaque position vers l''expert de sa modalité (précision de routage 1.00 pour les deux graines), si bien que ses comptes rendus et ses scores égalent ceux du routeur fixe. Résultats de l''étape 2 (65 figures PMC mises de côté) : faibles, comme prévu. Après 150 pas sur 251 textes, le modèle écrit "chest x-ray showing" puis une soupe de lettres : BLEU-1 0.05, ROUGE-L 0.06, rappel des mots-clés de signes 0, entropie croisée sur les données mises de côté 2.32 nats par lettre. Lui donner l''image d''une autre figure ne change rien (2.32 nats, mêmes scores) : l''image n''est pas utilisée. Une référence aveugle qui renvoie un texte d''entraînement fixe obtient de meilleurs scores (BLEU-1 0.17, ROUGE-L 0.22). Un LM de caractères de 40 000 poids ne peut pas apprendre cette langue à partir d''environ 70 000 caractères en une minute de CPU ; avec les légendes réduites à la première proposition d''une version antérieure (médiane 6 mots), ROUGE-L était d''environ
  0.28, mais ces textes étaient à peine des phrases. La machinerie du DAG fonctionne ; les données sont bien trop peu nombreuses pour l''étape 2. Temps. Sur un CPU de bureau à 6 cœurs, l''entraînement prend environ 85 s quand la machine est au repos, plus environ 30 s pour le GIF ; les temps mesurés sont deux à trois fois plus longs quand d''autres tâches lourdes partagent la machine (l''exécution montrée dans le GIF et dans timings.csv a été faite sous une telle charge, ses secondes sont donc plus élevées), l''étape des légendes étant la plus touchée. Avec un worker par règle, le chemin critique max-plus est CNN → connecteur → affinage → légendes → évaluation. Le code choisit un GPU quand torch en voit un (pixi run -e cuda) ; l''environnement par défaut contient une version CPU de torch, donc tous les chiffres fournis proviennent du CPU. À essayer. Plus de pas sur les légendes (l''étape 2 progresse lentement), pas d''affinage global (0 pas), moins de pas pour le CNN (le CNN plafonne tout),
  ou une seule graine pour voir à quel point les graines divergent.'
meanings:
- la règle $s$ lit ce qu'écrit la règle $r$ ; le processus d'entraînement analysé depuis data/training.smk avec l'analyseur du problème du cercle de Willis
- 'niveau de chaque règle : CNN, LM et monolithe au niveau 0, connecteur au 1, affinage et routeur au 2, légendes au 3, évaluation au 4'
- instants de fin max-plus à partir des durées mesurées des règles ; $\max t$ est le chemin critique
- les six probabilités de signes du CNN (sigmoïde, multi-étiquettes) pour chaque image ; l'axe des modèles $m$ devient les groupes d'une convolution groupée par couche
- 'l''arête du DAG : probabilités de signes plus un vecteur de position $S_t$ → un vecteur d''entrée du LM ; les $K = 6$ jetons souples remplacent l''en-tête d''étiquettes écrit'
- 'routeur : one-hot selon le type de données (position d''en-tête ou lettre), ou un softmax appris sur les caractéristiques de position (entraîné dense, utilisé en top-1)'
- '$x$ répété ⇒ sommé : la combinaison de la couche MoE ; chaque expert $Y^x$ n''est calculé que sur son groupe attribué'
- logits de la lettre suivante du minuscule GPT (attention einsum avec un axe des modèles, issue de chain_of_thought)
- perte par modèle sur les lettres du compte rendu après l'en-tête (nats) ; sommer les $M$ pertes donne à chaque modèle son propre gradient
- '$n$ répété ⇒ sommé : vrais positifs des étiquettes reconverties à partir de chaque compte rendu écrit ; le micro $F_1$ les regroupe sur $f$'
labels:
  seeds: Graines (réplicats indépendants)
  steps_cnn: Pas de préentraînement du CNN
  steps_lm: Pas de préentraînement du LM (comptes rendus types)
  steps_con: Pas du connecteur (CNN et LM gelés)
  steps_ft: Pas d'affinage global
  steps_router: Pas du routeur appris
  steps_cap: Pas d'affinage sur les légendes (étape 2)
  lr_ft: Taux d'apprentissage de l'affinage
  lr_cap: Taux d'apprentissage des légendes
