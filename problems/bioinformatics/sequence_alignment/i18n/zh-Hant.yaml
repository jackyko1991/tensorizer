source_hash: b944848791a5
title: 以張量更新波前進行序列比對
summary: 以動態規劃進行 DNA 序列的 Needleman–Wunsch（全域）與 Smith–Waterman（局部）比對。表格的每一格只需要其左、上與對角鄰格，所以整條反對角線 $i + j = d$ 可在一次張量更新中填完，並同時處理一批序列對。看看波前如何掃過表格，接著回溯讀出最佳比對。
notes: 全域比對強制兩條序列從頭到尾對齊；局部比對多了選項 0，所以不佳的片段直接被捨棄，並回報任何位置得分最高的片段（此處是植入隨機背景中的模體）。回溯從終點格往回走，每一步詢問三個選項中哪一個產生了儲存的值，並在空位內時於表格 $H$、$E$、$F$ 之間切換。成本仍是 $O(nm)$ 格，但只需 $n + m - 1$ 個循序步驟：這種反對角線平行化正是 GPU 與 SIMD 比對程式的做法。試試提高突變率，或設 $g_o > g_e$ 以偏好少數長空位而非許多短空位。蛋白質使用 BLOSUM62 等 $20\times20$ 矩陣取代 $W$；其他一切不變。
meanings:
- 序列對 $b$ 中第一條序列的第 $i$ 個字母與第二條的第 $j$ 個字母，對 A、C、G、T 做 one-hot 編碼
- 字母 $\alpha$ 與 $\beta$ 對齊的分數：對角線為匹配，其餘為錯配
- 重複的 $\alpha, \beta$ ⇒ 求和：每種可能字母配對的分數
- 長 $k$ 個字母的空位代價為 $g_o + (k-1)\,g_e$（仿射）；$g_o = g_e$ 即線性空位
- 反對角線 $d$ 上的所有格；它們只依賴對角線 $d-1$ 與 $d-2$
- 每條對角線一次張量更新：以匹配、$a$ 中空位、$c$ 中空位結尾的最佳分數
- 全域分數在角落，局部分數在最佳格；超出各自長度的填補部分被忽略
labels:
  mode: 比對（全域 = Needleman–Wunsch，局部 = Smith–Waterman）
  length: 序列長度 $L$
  n_pairs: 批次中的序列對數 $B$
  mutation: 每位點突變率
  match: 匹配分數
  mismatch: 錯配分數
  gap_open: 空位開啟 $g_o$
  gap_extend: 空位延伸 $g_e$
