source_hash: b1957b563a0a
title: 케플러의 행성 운동 법칙
summary: '궤도 크기와 이심률이 서로 다른 행성들이 뉴턴의 역제곱 중력을 받으며 별 주위를 돕니다. 한 번의 배치 RK4 적분으로 케플러의 세 법칙을 모두 보여 줍니다: 별이 한 초점에 있는 타원, 같은 시간에 같은 넓이, 그리고 $T^2 \propto a^3$.'
notes: 단위는 AU, 년, 태양 질량이므로 $GM_\odot = 4\pi^2$이고 케플러 제3법칙은 간단히 $T^2 = a^3$이 됩니다. 모든 행성은 근일점에서 활력 방정식(vis-viva) 속력 $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$로 출발합니다. 이심률이 가장 큰 궤도의 음영 조각은 각각 같은 시간 $T/12$ 동안 쓸린 영역입니다. 별 가까이에서는 짧고 넓으며 멀리서는 길고 가늘지만 넓이는 언제나 같습니다. $dA/dt = L/2$이고 $L$이 보존되기 때문입니다. 주기는 시뮬레이션에서 $2\pi$를 쓸고 지나가는 데 걸린 시간으로 측정합니다. 별은 고정된 것으로 보며(질량이 행성보다 훨씬 큼), 행성끼리는 서로 끌어당기지 않습니다.
meanings:
- 별에 대한 행성 $b$의 위치, $i \in \{x, y\}$
- 행성 $b$의 속도
- '반복된 $j$ ⇒ 합: 거리의 제곱 $r_b^2$'
- 별을 향한 역제곱 인력
- 2차원 레비치비타 기호, $\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- 단위 질량당 각운동량; $dA/dt = L_b/2$는 일정
- $\tfrac12 v^2 - GM/r$; $a = -GM/2E$를 줌
labels:
  n_planets: 행성 수
  e_max: 최대 이심률 $e$
  t_max: 시뮬레이션 시간
  dt: 시간 간격
