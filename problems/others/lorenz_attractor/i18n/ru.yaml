source_hash: 8944aa9bc162
title: Аттрактор Лоренца и эффект бабочки
summary: Три связанных уравнения из модели конвекции никогда не успокаиваются и никогда не повторяются. Записанные как линейная часть $A_{ij}x_j$ плюс квадратичная часть $Q_{ijk}x_j x_k$ с тензором третьего ранга, они позволяют одним einsum продвигать целый пакет траекторий, стартующих ближе чем $10^{-6}$ друг к другу; траектории расходятся экспоненциально, со скоростью, заданной старшим показателем Ляпунова $\lambda \approx 0.9$, пока не распределятся по всей бабочке.
notes: 'Лоренц (1963) свёл модель жидкости, подогреваемой снизу, к трём числам: $x$ — интенсивность конвективного вала, $y$ и $z$ описывают профиль температуры. При $\sigma = 10$, $\rho = 28$ и $\beta = 8/3$ движение кружит вокруг одной из двух неподвижных точек $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$, а затем непредсказуемо перескакивает на другое крыло. Близкие траектории расходятся как $e^{\lambda t}$ с $\lambda \approx 0.906$: ошибка $10^{-6}$ вырастает до размера аттрактора примерно за $15$ единиц времени — поэтому у прогноза есть горизонт (эффект бабочки). Одновременно любой объём состояний сжимается как $e^{-(\sigma+1+\beta)t}$, так что траектории скапливаются на тонком фрактальном множестве — странном аттракторе. Тензорная форма делает структуру явной: в $A$ собраны все линейные связи, а вся нелинейность — это два элемента $Q$. Перед расчётом одна траектория из $(1, 1, 1)$ интегрируется $10$ единиц времени, чтобы шар стартовал на аттракторе; RK4 с постоянным
  шагом $0.005$ здесь достаточно точен. Попробуйте $\rho < 1$: начало координат становится устойчивым, и все траектории затухают к нему; при $1 < \rho < 24.74$ они по спирали уходят в $C_+$ или $C_-$; около $\rho = 28$ и выше хаос возвращается.'
meanings:
- состояние $(x, y, z)$ траектории $b$
- 'линейная часть: строки $(-\sigma, \sigma, 0)$, $(\rho, -1, 0)$, $(0, 0, -\beta)$'
- 'квадратичная часть, тензор третьего ранга с двумя ненулевыми элементами: $-xz$ в $\dot y$ и $+xy$ в $\dot z$'
- повторяющийся $j$ ⇒ суммирование
- 'повторяющиеся $j$ и $k$ ⇒ суммирование: нелинейность, порождающая хаос'
- 'след матрицы Якоби: объёмы состояний сжимаются с постоянной скоростью $\sigma + 1 + \beta$'
- среднеквадратичное расстояние траекторий от их среднего
- наклон $\ln s$ от $t$, пока разброс растёт от $10\,s(0)$ до $1$
labels:
  sigma: Число Прандтля $\sigma$
  rho: Число Рэлея $\rho$
  beta: Геометрический фактор $\beta$
  t_max: Время моделирования
  log10_radius: Радиус начального шара $\log_{10} r$
  n_traj: Число траекторий
