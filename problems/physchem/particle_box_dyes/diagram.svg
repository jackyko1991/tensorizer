<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Free-electron model: a conjugated chain of atoms between two nitrogens drawn inside a one-dimensional box of length L, with the lowest standing waves and an electron promoted from the HOMO to the LUMO by a photon">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- box walls -->
    <path d="M30,18 V128 H210 V18" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- levels: HOMO (filled) and LUMO -->
    <line x1="30" y1="96" x2="210" y2="96" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="30" y1="52" x2="210" y2="52" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- standing waves: HOMO (3 half waves) and LUMO (4 half waves) -->
    <path d="M30,96 Q60,72 90,96 T150,96 T210,96" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M30,52 Q52.5,30 75,52 T120,52 T165,52 T210,52" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <!-- electrons -->
    <circle cx="112" cy="96" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <circle cx="128" cy="96" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <!-- excitation by a photon -->
    <line x1="196" y1="92" x2="196" y2="58" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="174" y="80" font-style="italic" fill="#b91c1c">hν</text>
    <!-- the conjugated chain N–C=C–C=N⁺: four bonds, the box reaches one bond past each N -->
    <polyline points="60,120 90,112 120,120 150,112 180,120" fill="none" stroke="#374151" stroke-width="1.5"/>
    <g fill="#6b7280"><circle cx="90" cy="112" r="3"/><circle cx="120" cy="120" r="3"/><circle cx="150" cy="112" r="3"/></g>
    <circle cx="60" cy="120" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <circle cx="180" cy="120" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <text x="48" y="114" font-size="11" fill="#1e40af">N</text>
    <text x="184" y="114" font-size="11" fill="#1e40af">N⁺</text>
    <!-- box length -->
    <line x1="30" y1="146" x2="210" y2="146" stroke="#f59e0b" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="116" y="142" font-style="italic" fill="#b45309">L</text>
  </g>
</svg>
