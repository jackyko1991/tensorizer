  - {symbol: '\nu_f', code: 'frequencies(3.5, 13.5, 91)', shape: '(F,)', meaning: 'light frequencies in $10^{14}$ Hz'}
  - {symbol: '\varepsilon_{ifn}', code: 'electron_depths(F, N, n_int=I)', shape: '(I, F, N)', meaning: 'depth of the electron that absorbs photon $n$, uniform on $[0, 3]$ eV ($i$: intensity)'}
  - {symbol: 'h\nu_f - \phi - \varepsilon_{ifn}', code: 'photon_energy(nu)[:, None] - phi - depth', shape: '(I, F, N)', meaning: 'one broadcast: every photon of every frequency and intensity at once; $K \le 0$ ⇒ no emission'}
