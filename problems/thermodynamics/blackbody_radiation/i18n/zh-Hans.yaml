source_hash: 7be6ce46bf01
title: 黑体辐射
summary: 普朗克定律给出热辐射在每个波长上的能量密度。把一列温度与一行波长广播，一行代码就构造出整张 $(T, \lambda)$ 光谱表；argmax 找出维恩峰值，torch.trapezoid 对光谱积分得到斯特藩–玻尔兹曼 $T^4$ 定律。
notes: 波长网格从 10 nm 到 100 µm 按对数分布，范围足够宽，缺失的尾部对积分的影响小于 $10^{-5}$；计算采用 float64 并用 expm1 保证精度。维恩常量 $b \approx 2.898\times 10^{-3}$ m·K 由 argmax 得出，精度受网格分辨率限制（约 0.2 %）。曲线颜色取光谱在代表红、绿、蓝的三个波长上的值——这只是真实配色计算的粗略替代，但能显示辉光由橙色经白色变为淡蓝色。每帧重新缩放坐标：峰值高度按 $T^5$ 增长。阴影带标出 380–750 nm 的可见光范围。
meanings:
- 一批温度，排成一列
- 波长网格，排成一行
- 列与行广播，填满整张表
- 一次求出每条光谱的维恩峰值
- 重复的 $b$ ⇒ 求和：总能量密度，$\propto T_a^4$
- 610、550 和 465 nm 处的普朗克值，归一化：近似的可见颜色
labels:
  T_min: 起始温度
  T_max: 终止温度
  n_temps: 温度数（帧数）
