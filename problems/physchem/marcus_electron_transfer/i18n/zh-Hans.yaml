source_hash: d134f88d426a
title: 电子转移的 Marcus 理论与反转区
summary: 只有当周围溶剂恰好涨落到使两个态能量相等的构型，即两条抛物线的交点时，电子才会从给体跳到受体。这给出 Marcus 速率 $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$，这里在重组能、温度和驱动力的一个广播网格上计算。当 $-\Delta G^\circ = \lambda$ 时速率最快，而且与直觉相反，对于更加下坡的反应速率反而再次变慢。对溶剂坐标的 Langevin 模拟加上交点处的 Landau–Zener 跃迁重现了这条曲线。
notes: 单位：eV、K 和 ps。溶剂坐标 $x$ 是被转移电荷所感受到的集体极化，经缩放使反应物势阱位于 0、产物势阱位于 1；$\lambda$ 是在电荷仍位于给体上时，把溶剂极化成产物构型所需的能量。Marcus 于 1956 年推导出二次型势垒（J. Chem. Phys. 24, 966）并预言了反转区，而反转区直到 1980 年代才得到实验证实。在反转区（$-\Delta G^\circ > \lambda$），产物抛物线在反应物抛物线的远侧与之相交，所以驱动力越大，交点越高。速率公式是费米黄金规则（非绝热，$H_{AB}$ 很小）加上经典溶剂；真实的反转区速率下降得更慢，因为高频分子振动打开了量子通道（Marcus–Levich–Jortner 扩展）。模拟是一个刻意简化的图像：一个频率为 $\omega$、摩擦为 $\gamma$ 的经典溶剂坐标，每次在一条非绝热抛物线上运动，并在交点处以 Landau–Zener 概率 $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$ 切换，该概率假定通过是直线且快速的。对热通量下的所有通过求和，在 $P_{\mathrm{LZ}} \ll 1$ 时就回到黄金规则速率，这就是数据点落在曲线上的原因；对于大的 $H_{AB}$，跃迁达到饱和（绝热转移），摩擦开始起作用。发生跃迁的轨迹继续在产物面上运动，也可能跳回。试试降低 $T$（曲线变窄）、增大 $H_{AB}$（模拟结果偏离到公式之下）或改变 $\lambda$。
meanings:
- 速率网格的三个轴
- 广播一次构造出所有组合；不对任何指标求和
- 抛物线的交点；$x^* < 0$ 表示反转区
- 交点相对于反应物极小值的高度
- 在模拟驱动力 $d$ 下的轨迹 $n$，按玻尔兹曼统计从反应物势阱出发
- 在反应物面上为 0，在产物面上为 1；它决定溶剂被拉向的极小值
- 半步冲量、半步漂移、摩擦 + 噪声、半步漂移、半步冲量，所有轨迹一起进行
- 每当一步越过 $x^*$ 时以此概率切换势能面
- 在反应物面上单位时间内的正向跃迁数；误差棒为 $\sqrt{\text{hops}}/t$
labels:
  lam: 重组能 $\lambda$
  T: 温度 $T$
  H_ab: 电子耦合 $H_{AB}$
  omega: 溶剂频率 $\omega$
  friction: 溶剂摩擦 $\gamma$
  steps: 时间步数
