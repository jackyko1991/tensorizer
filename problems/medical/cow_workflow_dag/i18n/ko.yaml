source_hash: 4e5cb68f190c
title: '워크플로 오케스트레이션의 힘: 텐서 DAG로 본 윌리스 고리 코호트'
summary: 혈관 연구는 일련의 단계(MRA 분할, 중심선 그래프 추출, 혈관 측정, 유입구·유출구 배치, 유동 계산, 보고)로 이루어지며 각 단계는 이미 텐서 프로그램이므로, Snakemake가 오케스트레이션하는 워크플로도 텐서가 될 수 있습니다. 윌리스 고리의 공개(CC0) TopCoW MRA 스캔 6건에 대해 같은 Snakefile을 Snakemake(오프라인)와 텐서 DAG 엔진으로 실행합니다. 작업 그래프는 크로네커 곱의 합이고, 그 레벨, 임계 경로, 재실행 집합은 행렬–벡터 반복으로 구하며, 결과는 작업 단위로 일치합니다. 이어서 절약된 시간과 그 출처, 그리고 파일 DAG가 줄 수 없는 것, 즉 파이프라인 전체를 관통하는 기울기를 보입니다. 교육용이며 임상용이 아닙니다.
notes: '아이디어. 워크플로 오케스트레이션의 힘이라는 관점은 Jacky Ko의 것으로, 혈관 파이프라인에 관한 그의 HPC 및 박사 연구에서 나왔습니다. 파이프라인의 모든 단계가 텐서 프로그램이라면, 워크플로 관리자가 스케줄링하는 DAG도 텐서가 될 수 있습니다. 이 문제는 그것을 구현하고 측정합니다. 워크플로. data/Snakefile에는 8개의 규칙(segment, centreline, measure, boundaries, flow, report, cohort, all)과 2개의 와일드카드가 있습니다. 증례(스캔 6건)와 조건(양쪽 ICA 유입구 개방, 또는 왼쪽 ICA 폐쇄)입니다. 각 규칙의 shell은 workflow.py를 실행하며, 이는 텐서 엔진이 모든 증례에 대해 한 번에 호출하는 것과 같은 텐서 함수를 한 증례에 대해 호출합니다. Snakemake 9.27.1은 WSL2에서 오프라인으로 실행되었고(별도 환경이며 이 프로젝트에 포함되지 않음), 그 출력은 참조로 data/snakemake에 포함되어 있습니다. 작업 DAG(--dag), 드라이런 작업 목록, 입력 하나를 바꾼 뒤의 재실행 집합, --summary, 작업별 시작·종료 시각, 그리고 작업들이 기록한 코호트 표입니다. 테스트는 텐서 엔진이 같은 50개 작업과 79개 간선을 갖는지, Snakemake의 실행 순서가 우리의 $A$를 따르고 우리의 레벨을 주는지, 재실행 집합이 같은지, 코호트 표가 기록된 9자리까지 동일한지를 확인합니다. 재실행에 관한 세부 사항: 입력을 touch해도 Snakemake는 아무것도 재실행하지 않았는데, 작은 파일은 체크섬을 비교하기 때문입니다. 참조에서는 파일의 바이트를 바꾸며(배열은 동일), 그러면 $x = s \lor Rs$가 예측하듯 10개 작업이 재실행됩니다. 시간. 포함된 실행에서 Snakemake는 1코어에서 118 s, 6코어에서 43 s, 12코어에서 27 s가 걸렸습니다(덜 바쁜 머신에서의 이전 실행: 79, 23, 22 s). 텐서 엔진은
  같은 작업을 단일 스레드에서 약 5~10 s에 수행합니다. 정직한 내역: Snakemake의 각 작업은 새 프로세스로서 Python을 시작하고 torch와 작업 모듈을 import하며(약 1.8 s, data/snakemake/startup.csv, 즉 합산 작업 시간 115 s 중 약 88 s), .npz 파일을 읽고 쓰고, 스케줄링됩니다. 텐서 엔진은 이 비용을 한 번만 치릅니다. 여기서 CPU상의 배치 처리 자체는 이득이 작으며(증례를 프로세스 내에서 하나씩 실행해도 거의 같은 시간이 걸리고 때로는 더 짧음), 이득은 시작 비용과 파일에서 오고, 모든 작업이 시작 비용을 압도하는 무거운 GPU 의존 계산이라면 줄어듭니다. $c$개 코어에서 어떤 스케줄도 $\max(\mathrm{CP}, W/c)$, 즉 max-plus 반복으로 얻은 임계 경로와 총 작업량을 $c$로 나눈 값보다 빠를 수 없으며, 측정된 실행도 이를 지킵니다. 최적 스케줄을 찾는 것은 일반적으로 NP-난해합니다(Graham의 리스트 스케줄링은 $W/c + \mathrm{CP}$ 이내). 기울기. 파일 DAG는 숫자를 전달할 뿐 도함수를 전달하지 않습니다. 소프트 임계값 덕분에 분할, 반지름, 유동이 미분 가능하므로, $\partial s_{\mathrm{L\,MCA}}/\partial\theta$(유출량 중 왼쪽 MCA의 비율)를 한 번의 역전파로 모든 증례에 대해 얻으며 중심 유한 차분과 일치합니다. 유한 차분이라면 Snakemake 전체 실행이 두 번 더 필요합니다. 중심선 그래프(위상)와 연결 성분 마스크는 고정합니다. 파이프라인. 분할: 정규화된 TOF 강도의 소프트 임계값 $\sigma((I - \theta)/w)$, 하드 마스크 $I > \theta$에서 64 복셀 미만 성분 제거, TopCoW 마스크 대비 Dice 약 0.86~0.91. 중심선: TopCoW 혈관 레이블로부터, 레이블된 혈관이 만나는 분기점(3.5 mm 이내의 접촉은 병합; 해부학적 쌍만 인정하므로 나란히 달리는
  두 A2는 제외), 말단 혈관마다 하나의 자유단(이동 시간 $\ell/R^2$의 min-plus 아이코널로 찾은 가장 먼 복셀, 재중심화), 그리고 연속한 노드 사이의 최단 중심 경로(동맥류 문제에서 VMTK를 대신한 텐서 구현과 같음). 측정: 레이블된 혈관 근처의 각 복셀을 가장 가까운 중심선 점에 할당하므로, 간선의 반지름은 소프트 부피로부터 $\sqrt{V_e/(\pi L_e)}$입니다. 혈관별 비대칭도 $2(r_R - r_L)/(r_R + r_L)$. 평활화한 반지름 프로파일이 중앙값의 절반 아래로 내려가는 곳에 협착 플래그(이 건강 대조군에서 그런 플래그는 분할 아티팩트임). 경계는 Venova와 같습니다: 유입구는 ICA와 뇌바닥동맥의 자유단, 유출구는 MCA, ACA, PCA 끝이며, Pcom과 Acom 끝은 결코 경계가 아닙니다. 유동: 축소 차수 정상 모델, 간선마다 Poiseuille 컨덕턴스, 열린 유입구에서 $P$ = 90 mmHg, 각 유출구는 Murray 부하 $g_k \propto r_k^3$를 거쳐 0 Pa로 배출되며, 저항 없는 네트워크라면 10 ml/s를 흘리도록 조정합니다. 배치 선형 풀이는 한 번입니다. 측부 순환 테스트는 왼쪽 ICA를 폐쇄합니다. Acom이나 Pcom이 열려 있으면 왼쪽 반구는 계속 관류됩니다. 단순화: 뉴턴 유체 혈액, 강체 직관, 박동 없음, 3D 유동 없음(동맥류 문제는 한 혈관에서 3D CFD를 수행), 0.5 mm 복셀의 임계값 반지름, 문헌 수준의 압력과 유량. 데이터. TopCoW 2024, MRA_Lausanne 부분집합(Zenodo 10.5281/zenodo.15692630, 라이선스 CC0): 윌리스 고리 레이블이 있는 건강 대조군 TOF-MRA 스캔 20건. 6건을 0.5 mm의 96×80×48 크롭으로 포함했습니다(영상과 레이블, 합계 1 MB 미만). data/SOURCES.md에 처리 과정과 인용(Yang et al., TopCoW 챌린지; Di Noto et al. 2022,
  Lausanne 코호트)이 있습니다. TopCoW 주 릴리스는 사용하지 않습니다(라이선스가 상업적 사용을 제한함). 결과. GIF 외에 3D 결과가 두 개 있습니다. results/centreline.pvd는 해부 구조입니다. 각 증례의 분할 표면(마칭 테트라헤드라)과 그 중심선 그래프가 들어 있으며, 둘 다 혈관 반지름으로 채색됩니다. results/flow.pvd는 1D Poiseuille 네트워크의 흐름으로, 왼쪽 ICA가 좁아지는 11개 스텝에 걸쳐 있습니다. 타임스텝은 협착 정도 s, 즉 잃은 내강 지름의 비율입니다(0은 개방, 1은 폐쇄). 레이어는 가장 가까운 중심선 에지의 벽면 전단응력 $\tau_w = 4\mu|Q|/(\pi r^3)$으로 채색한 혈관 표면(압력은 두 번째 배열), 유선과 입자(둘 다 속력으로 채색), 화살표가 있는 유입구·유출구 원판입니다. 여기에는 3D CFD가 없습니다. 유선은 1D 모델의 이상화된 축방향 흐름으로, 각 혈관의 중심선과 평행하게 반지름의 $\rho = 0, 0.35, 0.7$ 위치를 지나는 선이며 속력은 Hagen–Poiseuille의 $u = 2U(1 - \rho^2)$, $U = |Q|/(\pi r^2)$입니다. 2차 흐름은 없고, 분기점에서 끊깁니다. 각 스텝은 정상 상태이며, 입자는 속력을 보여 주기 위해서만 스텝마다 고정된 의사 시간 4 ms만큼 유선을 따라 이동합니다(혈관 끝을 지나면 시작점으로 돌아감). 협착은 유입구와 직렬로 연결된 10 mm Poiseuille 구간으로 모델링하므로 그 전도도는 $(1 - s)^4$에 비례해 줄어듭니다. s = 0과 s = 1은 정확히 워크플로의 두 조건이며, 그 사이의 스텝은 텐서 엔진만 실행합니다(스텝마다 한 번의 배치 풀이). results/stenosis_sweep.csv에는 스텝과 증례별 왼쪽 ICA 유입량과 왼쪽 MCA 분배 비율이 있습니다. 그 밖의 수치는 results/timings.csv, results/equivalence.csv, results/cohort.csv에
  있습니다.'
meanings:
- 규칙 $s$가 규칙 $r$이 쓰는 파일 패턴을 읽음; 포함된 Snakefile 자체에서 파싱
- '와일드카드 축 $a$(증례, 조건)별로: 두 규칙이 모두 그 축을 가지면 $I$(증례별 간선 $A \otimes I$), 브로드캐스트에는 $\mathbb 1$, 코호트 보고처럼 모으는 경우에는 $\mathbb 1^\top$'
- 작업 $i$가 작업 $j$의 출력을 읽으면 $A_{ij} = 1$; 작업 50개, 간선 79개
- 길이 $k$의 닫힌 보행; 모두 0 ⇔ $A$가 멱영 ⇔ 비순환
- 경로 $j \to i$의 수를 셈; 그 0/1 패턴이 도달 가능성(불리언 반복 제곱)
- '불리언 행렬–벡터 반복에 의한 위상 레벨: 그 행에서 $A\,\neg\mathrm{done} = 0$이면 작업이 준비됨'
- 가장 이른 종료 시각, max-plus(열대) 고정점; $\max_i t_i$가 임계 경로
- $s$의 작업(변경된 파일을 읽는 작업)이 오래된 것이 된 뒤 재실행할 작업
- 소프트 분할, 임계값 $\theta$(증례마다 하나)에 대해 미분 가능
- '모든 증례의 모든 혈관 복셀 그래프에서 한 번에 수행하는 min-plus 아이코널: 자유단과 중심선'
- 중심선에 가장 가까운 복셀들의 소프트 부피로 구한 간선 반지름
- Poiseuille 컨덕턴스 $G_e$와 Murray 유출구 부하 $g_k$를 쓰는 Kirchhoff 방정식, 배치 풀이 한 번; 열린 유입구에서 Dirichlet 행 $p = P$
- 유동, 측정, 분할을 거쳐 미분한 왼쪽 MCA 유량 비율, 모든 증례를 한 번의 역전파로
labels:
  threshold: 정규화 강도에 대한 분할 임계값 $\theta$
  cores: 상계 $\max(\mathrm{CP}, W/c)$의 코어 수 $c$
