source_hash: e6424f8df209
title: 기계 학습으로 가속한 CFD
summary: 참값보다 16배 거친 격자 위의 평범한 유한 체적 솔버는 점성 버거스 방정식의 충격파를 뭉갠다. 작은 CNN이 면 플럭스의 보정을 학습하며, 펼쳐 놓은 거친 시뮬레이션을 통해 역전파로 학습된다. 한 번도 본 적 없는 초기 조건에서, 학습된 솔버는 같은 거친 해상도로 미세한 해를 몇 배 더 가깝게 따라가면서 $\int u\,dx$를 정확히 보존한다.
notes: '단위: 영역은 주기적인 $[0, 2\pi)$이다. 참값은 512개 셀 위의 같은 유한 체적 기법이며, 안정성을 위해 하위 사이클링한 호인(Heun) 시간 적분을 쓴다. 학습에는 무작위 매끄러운 파동 32개를, 테스트에는 다른 시드로 만든 8개를 쓰며, 테스트는 학습 데이터보다 50% 더 길게($t = 3$) 실행한다. Adam의 각 단계에서 학습된 솔버는 무작위 시각의 참 거친 상태에서 출발해 $S$단계를 실행하고, 평균한 참값에서 벗어난 만큼 벌점을 받는다. 기울기는 모든 시간 단계를 거쳐 거꾸로 흐르므로, 신경망은 자신의 출력을 입력으로 받아도 계속 좋은 보정을 배운다. 두 가지 설계 선택이 이를 정직하게 유지한다. $\delta F$가 플럭스로 들어가므로 $\sum_i u_i$가 반올림 오차 수준까지 보존되고, 마지막 층이 0에서 시작하므로 학습은 평범한 솔버에서 시작한다. 이 아이디어는 바로 이런 종류의 방정식에 대해 데이터 기반 이산화를 학습한 Bar-Sinai, Hoyer, Hickey & Brenner(PNAS, 2019)와 Kochkov, Smith, Alieva, Wang, Brenner & Hoyer(PNAS, 2021)를 따른다. 후자는 2D 나비에–스토크스 솔버 안의 보간 계수를 학습하여 같은 정확도에서 8–10배 거친 격자, 대략 40–80배의 속도 향상을 보고했다. 이 장난감은 그 메커니즘을 보여 줄 뿐, 그런 속도 향상을 보여 주지는 않는다. 학습된 보정은 학습 데이터와 동떨어진 입력에서 실패할 수 있다. 더 적은 학습 단계, 더 짧은 펼침, 또는 신경망이 학습하지 않은 점성을 시도해 보자.'
meanings:
- 궤적 $b$에 대한 거친 셀 $i$의 셀 평균(주기적)
- $\tfrac14(u_i^2 + u_{i+1}^2) - \tfrac12\alpha(u_{i+1} - u_i)$, $\alpha = \max(\lvert u_i\rvert, \lvert u_{i+1}\rvert)$. $u_{i+1}$은 roll(u, -1)
- 한 셀에서 나간 것은 다음 셀로 들어간다 ⇒ $\sum_i u_i$ 보존
- '반복된 $k$ ⇒ 합: 5셀 스텐실, 주기적 패딩'
- 합성곱 세 개로 만든 학습된 플럭스 보정(처음에는 0)
- 각 거친 셀 안의 $f = N_f/N_c$개 미세 셀에 대해 평균한 미세 해
- 솔버의 펼친 $S$개 시간 단계 전체를 통과하는 autograd
labels:
  nu: 점성 $\nu$
  n_coarse: 거친 셀 수 $N_c$
  train_iters: 학습 단계 수
  unroll: 펼친 단계 수 $S$
