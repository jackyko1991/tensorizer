source_hash: 4e5cb68f190c
title: 工作流程編排的力量：將威利氏環多步研究化為張量 DAG
summary: 一項血管研究是一連串步驟（分割 MRA、擷取中心線圖、量測血管、設置入口與出口、求解血流、產出報告），每一步本身已是張量程式，因此由 Snakemake 編排的工作流程也可以是張量。在六筆開放（CC0）的 TopCoW 威利氏環 MRA 掃描上，同一份 Snakefile 分別由 Snakemake（離線）與張量 DAG 引擎執行：作業圖是 Kronecker 積之和，其層級、關鍵路徑與重跑集合都是矩陣–向量迭代，結果逐一作業相符。接著說明節省了多少時間、從何而來，以及檔案 DAG 無法提供的東西：貫穿整條流程的梯度。僅供教學，不可用於臨床。
notes: 構想。「工作流程編排的力量」這個框架出自 Jacky Ko，源於他在血管分析流程上的 HPC 與博士研究：若流程的每個階段都是張量程式，工作流程管理器所排程的 DAG 也可以是張量。本問題將其實作並加以量測。工作流程。data/Snakefile 有八條規則（segment、centreline、measure、boundaries、flow、report、cohort、all）與兩個萬用字元：案例（六筆掃描）與條件（兩側 ICA 入口皆開放，或左側 ICA 閉塞）。每條規則的 shell 執行 workflow.py，它對單一案例呼叫的張量函式，正是張量引擎對所有案例一次呼叫的同一個函式。Snakemake 9.27.1 在 WSL2 中離線執行（使用其自身環境，從不屬於本專案），其輸出作為參考資料收錄於 data/snakemake：作業 DAG（--dag）、dry-run 作業清單、某一輸入變更後的重跑集合、--summary、每個作業的開始與結束時間，以及其作業寫出的世代表格。測試檢查：張量引擎具有相同的 50 個作業與 79 條邊、Snakemake 的執行順序符合我們的 $A$ 並得出我們的層級、重跑集合相同，且世代表格在寫出的 9 位數字上完全一致。關於重跑的一個細節：touch 某個輸入並不會讓 Snakemake 重跑任何東西，因為對小檔案它比對的是校驗和；參考資料改變了檔案的位元組（陣列不變），此時有 10 個作業重跑，正如 $x = s \lor Rs$ 所預測。時間。在收錄的執行中，Snakemake 在 1 個核心上耗時 118 s，6 個核心 43 s，12 個核心 27 s（較早一次在較空閒機器上的執行：79、23 與 22 s）；張量引擎以單一執行緒約 5 至 10 s 完成相同工作。誠實的帳目：每個 Snakemake 作業都是一個新行程，需啟動 Python 並匯入 torch 與作業模組（約 1.8 s，見 data/snakemake/startup.csv，因此在 115 s 的作業時間總和中約佔 88 s），讀寫 .npz 檔案，並等待排程；張量引擎只付出一次這些成本。批次處理本身在此 CPU 上幫助不大（在同一行程中逐一執行各案例耗時相近，有時更短），因此收益來自啟動與檔案，而當每個作業都是遠超啟動成本的大型
  GPU 求解時，收益便會縮小。在 $c$ 個核心上，沒有任何排程能勝過 $\max(\mathrm{CP}, W/c)$，即由 max-plus 迭代得到的關鍵路徑與總工作量除以 $c$ 兩者的較大值，而實測執行皆符合此界限；一般而言，尋找最佳排程是 NP-hard 問題（Graham 的列表排程不超過 $W/c + \mathrm{CP}$）。梯度。檔案 DAG 傳遞的是數值，而非導數。軟閾值使分割、半徑與血流皆可微分，因此 $\partial s_{\mathrm{L\,MCA}}/\partial\theta$（左側 MCA 佔流出量的比例）只需一次反向傳播即可得到每個案例的值，並與中央有限差分相符，而後者需要 Snakemake 額外完整執行兩次。中心線圖（拓撲）與連通元件遮罩保持固定。流程。分割：對正規化的 TOF 強度取軟閾值 $\sigma((I - \theta)/w)$，硬遮罩為 $I > \theta$ 並去除小於 64 個體素的連通元件，與 TopCoW 遮罩的 Dice 約為 0.86 至 0.91。中心線：依據 TopCoW 血管標籤，在標記血管相接處設置分岔節點（3.5 mm 內的接觸予以合併；只計入解剖學上的配對，因此兩條並行的 A2 不算），每條末端血管設一個自由端（以行進時間 $\ell/R^2$ 的 min-plus eikonal 求得其最遠體素，再重新置中），並在相鄰節點間取最短的置中路徑（如同動脈瘤問題中以張量替代 VMTK 的做法）。量測：標記血管附近的每個體素歸屬於最近的中心線點，因此一條邊的半徑由軟體積得到，為 $\sqrt{V_e/(\pi L_e)}$；每條血管的不對稱度為 $2(r_R - r_L)/(r_R + r_L)$；平滑後的半徑剖面低於其中位數一半之處標記為狹窄（在這些健康對照中，此類標記屬於分割假影）。邊界，如同 Venova：入口位於 ICA 與基底動脈的自由端，出口位於 MCA、ACA 與 PCA 末端；Pcom 與 Acom 末端絕不作為邊界。血流：降階穩態模型，每條邊採 Poiseuille 流導，開放入口處 $P$ = 90 mmHg，每個出口經 Murray 負載 $g_k \propto r_k^3$ 引流至 0 Pa，負載經調整使無阻力網路可承載 10 ml/s；一次批次線性求解。側支循環測試關閉左側
  ICA：若 Acom 或 Pcom 通暢，左半球仍維持灌流。簡化之處：牛頓流體血液、剛性直管、無脈動、無 3D 流動（動脈瘤問題對單一血管進行 3D CFD）、半徑由 0.5 mm 體素上的閾值求得、壓力與流量取文獻量級。資料。TopCoW 2024 的 MRA_Lausanne 子集（Zenodo 10.5281/zenodo.15692630，授權 CC0）：20 筆附威利氏環標籤的健康對照 TOF-MRA 掃描。其中六個案例以 0.5 mm、96×80×48 的裁切收錄（影像與標籤，總計不到 1 MB）；data/SOURCES.md 記載處理過程與引用文獻（Yang 等人，TopCoW 挑戰賽；Di Noto 等人 2022，Lausanne 世代）。未使用 TopCoW 主要釋出版本（其授權限制商業用途）。結果。除 GIF 外，還有兩個 3D 結果。results/centreline.pvd 是解剖結構：每個案例的分割表面（marching tetrahedra）及其中心線圖，兩者皆依血管半徑著色。results/flow.pvd 是一維 Poiseuille 網路的血流，共 11 個時間步，左側 ICA 逐步狹窄：時間步即狹窄程度 s，也就是管腔直徑損失的比例（0 為通暢，1 為閉塞）。它的圖層是：依最近中心線邊的壁面剪應力 $\tau_w = 4\mu|Q|/(\pi r^3)$ 著色的血管表面（壓力作為第二個陣列）；流線與粒子（皆依速度著色）；以及帶箭頭的入口與出口圓盤。這裡沒有三維 CFD：流線是一維模型的理想化軸向流動，即平行於每條血管中心線、位於其半徑 $\rho = 0, 0.35, 0.7$ 處的線，速度為 Hagen–Poiseuille 速度 $u = 2U(1 - \rho^2)$，$U = |Q|/(\pi r^2)$；沒有二次流，並且在分叉處斷開。每個時間步都是一個穩態；粒子每步只沿流線前進固定的 4 ms 偽時間（越過血管末端後回到起點），僅用於顯示速度。狹窄以一段與入口串聯的 10 mm Poiseuille 管段建模，因此其傳導率按 $(1 - s)^4$ 下降；s = 0 與 s = 1 正是工作流程的兩種條件，其間的步驟僅由張量引擎執行（每步一次批次求解）。results/stenosis_sweep.csv 列出每個時間步與案例的左側
  ICA 流入量與左側 MCA 占比；其他數值存放於 results/timings.csv、results/equivalence.csv 與 results/cohort.csv。
meanings:
- 規則 $s$ 讀取規則 $r$ 寫出的檔案模式；直接從收錄的 Snakefile 解析而得
- 對每個萬用字元軸 $a$（案例、條件）：兩條規則皆帶有該軸時為 $I$（每案例的邊 $A \otimes I$），廣播時為 $\mathbb 1$，彙整（如世代報告）時為 $\mathbb 1^\top$
- 作業 $i$ 讀取作業 $j$ 的輸出時 $A_{ij} = 1$；50 個作業、79 條邊
- 長度為 $k$ 的閉合路徑；全為零 ⇔ $A$ 冪零 ⇔ 無環
- 計算路徑 $j \to i$ 的數目；其 0/1 型樣即為可達性（布林重複平方）
- 以布林矩陣–向量迭代求拓撲層級：當其所在列中 $A\,\neg\mathrm{done} = 0$ 時作業即可執行
- 最早完成時間，即 max-plus（熱帶）不動點；$\max_i t_i$ 為關鍵路徑
- $s$ 中的作業（變更檔案的讀取者）過時後需重跑的作業
- 軟分割，對閾值 $\theta$（每案例一個）可微分
- 在所有案例全部血管的體素圖上一次執行 min-plus eikonal：求自由端與中心線
- 由最接近其中心線之體素的軟體積求得邊的半徑
- 以 Poiseuille 流導 $G_e$ 與 Murray 出口負載 $g_k$ 建立 Kirchhoff 方程，一次批次求解；開放入口處為 Dirichlet 列 $p = P$
- 左側 MCA 血流比例經由血流、量測與分割求導，所有案例在一次反向傳播中完成
labels:
  threshold: 正規化強度上的分割閾值 $\theta$
  cores: 界限 $\max(\mathrm{CP}, W/c)$ 中的核心數 $c$
