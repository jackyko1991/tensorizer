title: अपनी चिप की रूफ़लाइन मापें
summary: जिस मशीन पर यह चल रहा है, वह कितनी तेज़ है? बैंडविड्थ $\beta$ पाने के लिए एक बड़ी मेमोरी कॉपी का समय मापें, और हर प्रिसिज़न की दर $\pi$ पाने के लिए FP64, FP32, TF32, BF16 और FP16 में $n\times n$ मैट्रिक्स गुणनफल $C_{ij} = A_{ik}B_{kj}$ का समय मापें; फिर रूफ़लाइन $P(I) = \min(\pi, \beta I)$ बताती है कि आपकी चिप कौन-से कर्नेल पूरी गति से चलाती है और कौन-से मेमोरी का इंतज़ार करते हैं। कोडिंग कौशल ▸ चिप्स आपके परिणाम को दूसरी चिप्स की स्पेसिफ़िकेशन शीट के बगल में रखता है।
notes: 'स्पेसिफ़िकेशन शीट शिखर मान बताती हैं; माप बताता है कि PyTorch आपकी मशीन पर असल में कितना पाता है, बड़े मैट्रिक्स गुणनफल के लिए आमतौर पर शिखर का 50–90%। GPU का काम असिंक्रोनस होता है, इसलिए हर समय-माप डिवाइस के काम पूरा करने का इंतज़ार करता है (synchronize) और वार्म-अप के बाद कई रन का माध्यिका लेता है। NVIDIA GPU पर FP32 गुणनफल दो बार मापा जाता है: एक बार असली FP32 में और एक बार TF32 टेंसर कोर के साथ (torch.set_float32_matmul_precision("high")), यह वह सेटिंग है जो चुपचाप मैंटिसा के बिट्स को गति के बदले छोड़ देती है। Apple के GPU बैकएंड (MPS) में float64 नहीं है, इसलिए वहाँ FP64 छोड़ दिया जाता है; उपभोक्ता GPU, FP64 को अपनी FP32 दर के छोटे-से हिस्से पर चलाते हैं, जो भौतिकी के लिए मायने रखता है। बड़ा मैट्रिक्स आकार आज़माएँ: दर तब तक बढ़ती है जब तक गुणनफल गणना-सीमित न हो जाए, जबकि मेमोरी कॉपी बैंडविड्थ पर ही रहती है।'
meanings:
- बड़ी कॉपी (पढ़ना + लिखना) से मेमोरी बैंडविड्थ, GB/s
- प्रिसिज़न $p$ में हासिल मैट्रिक्स गुणनफल दर, TFLOP/s
- 'दोहराया गया $k$ ⇒ योग: $n^3$ गुणा-जोड़'
- 'हर स्थानांतरित बाइट पर FLOP: $b$-बाइट तत्वों के लिए $2n/(3b)$'
- तीव्रता $I$ वाला कर्नेल अधिकतम जितना पहुँच सकता है
labels:
