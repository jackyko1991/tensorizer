source_hash: 6a76aa67658c
title: Электростатический потенциал (уравнение Пуассона)
summary: Решаем уравнение Пуассона для потенциала нескольких линейных зарядов внутри заземлённого ящика. На сетке лапласиан $\partial_i\partial_i$ становится матрицей, построенной из одномерной матрицы вторых разностей с помощью кронекеровых произведений, так что всё уравнение в частных производных сводится к одной линейной системе $L\phi = -\rho/\varepsilon_0$, которую torch.linalg.solve решает за один вызов.
notes: 'Ящик — единичный квадрат с $\phi = 0$ на стенках (заземлён). Задача двумерная, поэтому каждый «точечный» заряд на самом деле — бесконечная заряженная нить $\lambda$ (на единицу длины), и теорема Гаусса имеет вид $\oint \mathbf E\cdot\mathbf n\,dl = \lambda/\varepsilon_0$. Единицы: $\varepsilon_0 = 1$. $L$ состоит в основном из нулей — настоящий код хранил бы её как разреженную матрицу; здесь плотная $N^2\times N^2$ ещё достаточно мала, чтобы решать напрямую.'
meanings:
- потенциал в строке сетки $a$ ($y$) и столбце $b$ ($x$)
- 'те же значения, вытянутые в вектор: $m = a\cdot N + b$'
- 'одномерная $\partial^2$: $(\phi_{a-1} - 2\phi_a + \phi_{a+1})/h^2$, трёхдиагональная'
- 'двумерный лапласиан $\partial_y^2 + \partial_x^2$: ленточный, пять ненулевых элементов в строке'
- плотность заряда на сетке
- 'повторяющийся $m$ ⇒ суммирование: дискретный лапласиан $\phi$'
- $E_i = -\partial_i\phi$ центральными разностями, $i \in \{x, y\}$
labels:
  config: Расположение зарядов
  n_grid: Точек сетки на сторону
  charge: Заряд на нить
