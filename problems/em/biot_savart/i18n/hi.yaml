title: धारा लूपों का चुंबकीय क्षेत्र (बायो–सावर्ट)
summary: बायो–सावर्ट नियम एक तार को छोटे-छोटे खंडों के योग में बदल देता है। सदिश गुणनफल (cross product) $d\mathbf l\times\mathbf r$ असल में लेवी-सिविटा टेंसर $\varepsilon_{ijk}$ का दो सदिशों के साथ संकुचन (contraction) है, इसलिए ($i, j, k$, खंड) पर एक ही einsum हर ग्रिड बिंदु पर पूरी कुंडली का क्षेत्र दे देता है। लूप की त्रिज्या बढ़ती-घटती है और $x$–$z$ तल तथा अक्ष पर क्षेत्र उसके साथ बदलता है।
notes: SI मात्रक ($\mu_0 = 4\pi\times 10^{-7}$ T·m/A), क्षेत्र μT में दिखाया गया है। लूप क्षैतिज तलों में हैं, इसलिए $x$–$z$ तल हर लूप को दो बिंदुओं पर काटता है (⊙ धारा पृष्ठ से बाहर, ⊗ पृष्ठ के अंदर)। हेल्महोल्ट्ज़ कुंडलियाँ (दूरी $R$, समान धाराएँ) उनके बीच लगभग एकसमान क्षेत्र बनाती हैं; एंटी-हेल्महोल्ट्ज़ कुंडलियाँ (विपरीत धाराएँ) ऐसा क्षेत्र देती हैं जो केंद्र पर शून्य होता है और रैखिक रूप से बढ़ता है — यही ठंडे परमाणुओं को फँसाने वाला ट्रैप है। तार के पास के ग्रिड बिंदुओं पर एक छोटी softening लंबाई ली जाती है ताकि क्षेत्र परिमित रहे।
meanings:
- तल $y = 0$ पर क्षेत्र बिंदु $g$
- तार खंड $s$ का मध्य बिंदु और दिशा सदिश
- हर खंड से हर क्षेत्र बिंदु तक (broadcasting)
- 'लेवी-सिविटा प्रतीक: टेंसर के रूप में सदिश गुणनफल'
- दोहराए गए $j, k$ ⇒ सदिश गुणनफल; दोहराया गया $s$ ⇒ पूरे तार पर योग
- जाँच के लिए प्रति लूप सटीक मान $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$
