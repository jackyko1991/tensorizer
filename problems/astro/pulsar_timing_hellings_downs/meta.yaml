title: Pulsar timing array and the Hellings–Downs curve
category: astro
level: advanced
order: 4
summary: >
  A sea of nanohertz gravitational waves gently stretches the paths between Earth and many millisecond pulsars.
  An isotropic background, built from a thousand random plane waves, shifts each pulsar's ticks through the
  antenna pattern $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$, one einsum over polarisation
  tensors. Correlating every pair of timing residuals and binning by angle recovers the Hellings–Downs
  curve, the quadrupolar fingerprint that pulsar timing arrays reported evidence for in 2023.
animated: true
vector_form: 'z_a(t) = \frac{\hat p_a^{\,i}\hat p_a^{\,j}}{2(1 + \hat\Omega\cdot\hat p_a)}\,\Delta h_{ij},\qquad \langle r_a r_b\rangle \propto \Gamma(\zeta_{ab}) = \frac12 - \frac{x}{4} + \frac32\,x\ln x,\quad x = \frac{1 - \cos\zeta_{ab}}{2}'
index_form: 'e^{+}_{mij} = m_im_j - n_in_j,\quad e^{\times}_{mij} = m_in_j + n_im_j,\qquad F^A_{ma} = \frac{\tfrac12\,e^A_{mij}\,\hat p_{ai}\hat p_{aj}}{1 + \hat\Omega_{mk}\hat p_{ak}},\qquad r_{at} = F^A_{ma}\,\frac{h_{mA}}{\omega_m}\big[\sin\theta_{mAt} - \sin(\theta_{mAt} - \Delta_{ma})\big],\qquad \rho_{ab} = \frac{r_{at}r_{bt}}{\langle r_{ct}r_{ct}\rangle}'
translation:
  - {symbol: '\hat p_{ai}', code: 'random_directions(N, gen)', shape: '(N, 3)', meaning: 'unit vector to pulsar $a$, uniform on the sky'}
  - {symbol: '\hat\Omega_{mi},\ \psi_m', code: 'plane_waves(M, J, span, gen)', shape: '(M, 3), (M,)', meaning: 'propagation direction and polarisation angle of wave $m$'}
  - {symbol: 'e^A_{mij}', code: 'polarisation_tensors(omega, psi)', shape: '(M, 2, 3, 3)', meaning: '$+$ and $\times$ tensors built from the transverse frame $m, n \perp \hat\Omega$'}
  - {symbol: 'e^A_{mij}\hat p_{ai}\hat p_{aj}', code: "einsum('mAij,ni,nj->mAn', e, p, p)", shape: '(M, 2, N)', meaning: '$i$ and $j$ summed: the stretch of the Earth–pulsar line'}
  - {symbol: 'F^A_{ma}', code: 'antenna_patterns(p, omega, e)', shape: '(M, 2, N)', meaning: 'antenna pattern; sky average of $\sum_A (F^A)^2$ is exactly $1/3$'}
  - {symbol: '\Delta_{ma}', code: 'omega_t[:, None] * L * (1 + omega @ p.T)', shape: '(M, N)', meaning: 'phase lag of the pulsar term, $\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$'}
  - {symbol: 'r_{at}', code: "einsum('mAn,mAt->nt', ...)", shape: '(N, T)', meaning: '$m$ and $A$ summed: timing residual of pulsar $a$ at epoch $t$'}
  - {symbol: '\rho_{ab}', code: "einsum('...at,...bt->...ab', r, r) / auto", shape: '(K, N, N)', meaning: '$t$ summed: correlation of every pair, normalised by the mean auto-power'}
  - {symbol: '\Gamma(\zeta)', code: 'hellings_downs(cos_zeta)', shape: '(B,)', meaning: 'expected correlation, $\Gamma(0^+) = \tfrac12$, minimum $\approx -0.152$ at $\zeta \approx 82.5^\circ$'}
notes: >
  A gravitational wave changes the light-travel time between a pulsar and Earth, so the pulse arrival times drift
  by tens to hundreds of nanoseconds over years. For a single wave the effect depends on the geometry through
  $F^{+}$ and $F^{\times}$; for an isotropic background, averaging over directions leaves a correlation that depends only on
  the angle between the two pulsars. Hellings and Downs (ApJL 265, L39, 1983) computed it: pulsars close on the sky
  are correlated by $\tfrac12$ (the other half of each pulsar's power is its own uncorrelated pulsar term), pairs about
  $82.5^\circ$ apart are slightly anti-correlated, and opposite pulsars are again positively correlated by $\tfrac14$. The
  quadrupolar shape is the signature of a transverse, spin-2 wave: a clock error would give a monopole ($\Gamma = 1$)
  and an error in the Solar-System ephemeris a dipole ($\Gamma = \cos\zeta$); both are fitted for comparison. The page
  checks the normalisation two ways: the formula against a Monte Carlo sky integral $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$,
  and the antenna-pattern average $\langle\sum_A (F^A)^2\rangle = 1/3$. One sky scatters noticeably about the curve:
  with only a few dominant frequencies this "cosmic variance" is real and also affects real arrays; averaging many
  simulated skies shows the convergence. The fitted amplitude is diluted below 1 by white noise. Research context:
  in June 2023 the NANOGrav Collaboration (15-year data set, Agazie et al., ApJL 951, L8, 2023) reported evidence for
  a nanohertz gravitational-wave background with Hellings–Downs correlations (roughly 3σ for the correlations,
  approximate), alongside the European and Indian PTAs (EPTA + InPTA, A&A 2023), the Parkes PTA (Reardon et al., ApJL
  951, L6, 2023) and the Chinese PTA. The likely source is a population of supermassive black-hole binaries, which
  gives the $h_c \propto f^{-2/3}$ spectrum used here. Simplifications: residuals are not fitted for each pulsar's spin-down
  (only the mean is removed), white noise only, no pulsar-specific red noise, and a simple normalised cross-correlation
  instead of the optimal statistic or a full Bayesian analysis.
params:
  n_pulsars: {default: 100, min: 20, max: 200, step: 5, type: int, label: 'Pulsars $N$'}
  n_realisations: {default: 30, min: 2, max: 80, step: 1, type: int, label: 'Simulated skies $K$'}
  n_waves: {default: 1000, min: 100, max: 4000, step: 100, type: int, label: 'Plane waves per sky $M$'}
  n_freq: {default: 8, min: 1, max: 20, step: 1, type: int, label: 'Frequency bins $j/T_{span}$'}
  span: {default: 15.0, min: 3.0, max: 30.0, step: 1.0, label: 'Observing span $T_{span}$', unit: yr}
  n_times: {default: 128, min: 32, max: 512, step: 16, type: int, label: 'Epochs per pulsar'}
  noise: {default: 0.3, min: 0.0, max: 3.0, step: 0.1, label: 'White noise $\sigma$ / GW rms'}
  n_bins: {default: 12, min: 4, max: 30, step: 1, type: int, label: 'Angular bins'}
  seed: {default: 0, min: 0, max: 1000, step: 1, type: int, label: Random seed}
