title: Yang–Mills on the lattice and the mass gap
category: nuclear
level: advanced
order: 6
tags: [millennium, nobel:physics:2004, status:open]
summary: >
  The Clay Millennium Problem asks for a rigorous quantum Yang–Mills theory in four dimensions with a mass gap $\Delta > 0$;
  it is open. Wilson's lattice gauge theory makes the question computable: links $U_\mu(x) \in SU(2)$ (or $U(1)$) stored as
  unit quaternions are updated by Metropolis for a whole batch of couplings $\beta$ at once. Wilson loops show the area
  law of confinement, the plaquette matches the exact 2D Bessel ratio and the strong-coupling series, and a glueball
  correlator gives a lattice mass estimate.
animated: true
vector_form: 'S[U] = \beta\sum_x\sum_{\mu<\nu}\Big(1 - \tfrac12\mathrm{Tr}\,P_{\mu\nu}(x)\Big),\qquad \langle W(R,T)\rangle \sim e^{-\sigma RT},\qquad C(\Delta) = \langle O(t)\,O(t+\Delta)\rangle_c \sim e^{-m\Delta}'
index_form: 'P_{\mu\nu}(x) = U_\mu(x)\,U_\nu(x+\hat\mu)\,U_\mu^\dagger(x+\hat\nu)\,U_\nu^\dagger(x),\qquad (ab)_0 = a_0b_0 - a_kb_k,\quad (ab)_k = a_0b_k + b_0a_k + \varepsilon_{kij}a_ib_j,\qquad \Delta S = -\beta\,\tfrac12\mathrm{Tr}\big[(U^\prime_\mu - U_\mu)A_\mu\big]'
