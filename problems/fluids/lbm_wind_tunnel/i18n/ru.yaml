source_hash: 7dfc00ae0203
title: 'Цифровая аэродинамическая труба: 3D решёточный метод Больцмана вокруг самолёта из STL'
summary: 'Небольшая 3D аэродинамическая труба в духе библиотеки OpenLB: файл STL модели самолёта читается в тензор треугольников, вокселизуется трассировкой лучей сразу во всех узлах решётки, наклоняется на угол атаки и помещается в течение решёточного метода Больцмана D3Q19 со столкновениями TRT или MRT, необязательной LES Смагоринского и отражением (bounce-back) на теле. Сопротивление и подъёмная сила получаются из обмена импульсом; линии тока (пакетный RK4) и частицы-трассеры показывают течение. Случай сферы проверяет решатель по заранее посчитанному расчёту самого OpenLB и показывает невязку.'
notes: 'Решёточные единицы: шаг узлов и шаг по времени 1, набегающий поток $U = 0.08$ (Мах 0,14), вязкость $\nu = UL/\mathrm{Re}$, где $L$ — длина тела в узлах, и $\tau = 3\nu + \tfrac12$. Самолёт летит в решётке $80\times 36\times 26$ с $L = 32$ (длина фюзеляжа; размах 28 узлов), необязательное крыло NACA 0012 — в $72\times 24\times 24$ (хорда 20). Оба файла STL созданы для этой задачи (см. data/SOURCES.md): коренастая модель самолёта (фюзеляж-тело вращения, стреловидное крыло NACA 0018, горизонтальное и вертикальное оперение), части которой перекрываются в местах соединения, поэтому вокселизатор считает числа оборотов (знаковые пересечения), а не простую чётность лучей; и крыло, перекрывающее всю периодическую ширину, то есть бесконечное крыло (сравните $C_L$ с $2\pi\alpha$). Коэффициенты отнесены к площади в плане (тело сверху). Границы: периодичность поперёк потока (решётка самолётов) и отражение на полпути на вокселизованном теле; solve.simulate также умеет движущийся пол и потолок
  со свободным скольжением. Вместо входа и выхода последние 16 узлов образуют зону fringe, которая возвращает течение к набегающему потоку, прежде чем оно снова войдёт при $x = 0$; скорость нарастает за 300 шагов (ранний горб $C_D$ — градиент давления, разгоняющий воздух), и анимация начинается после этого. TRT использует «магический» $\Lambda = 3/16$, MRT — скорости D3Q19 из работы d''Humières et al. (2002), Смагоринский $C_s = 0.17$. При Re = 1000 по умолчанию ($\tau \approx 0.508$) чистый TRT на этой грубой решётке разваливается, а LES удерживает его устойчивым: попробуйте выключить LES. Результаты при 8°: самолёт $C_D \approx 0.39$, $C_L \approx 0.12$; крыло $C_L \approx 0.31$ против $2\pi\alpha = 0.88$. Подъёмная сила мала, потому что крылья толщиной всего 1–3 ячейки, Re ламинарное, а периодические образы сверху и снизу действуют как стопка бипланов: это иллюстрации метода, а не предсказания. Проверка (тело sphere_openlb): сфера при Re = 20 ($D = 10$, $80\times 40\times 40$, BGK, равновесный
  вход) против OpenLB 1.7 на той же решётке, запущенного один раз офлайн (data/openlb_reference_*.csv): $C_D$ 3,360 против 3,378 (−0,5 %); $u_x$ в средней плоскости: относительная L2 0,8 %, L∞ 1,1 %, max $|\Delta u|/U$ 1,3 %. Оставшаяся разница — от граничных схем (OpenLB использует интерполированные условия по скорости и давлению и продолжает звенеть звуковыми волнами, ±5 % в $C_D$) и от полного против полуотражения; оператор столкновений (BGK) и разрешение одинаковы. Оба кода выше значения Шиллера–Наумана 2,61, потому что эта сфера не свободна: OpenLB в ящике $160\times 60\times 60$ даёт 3,04, а при $D = 20$ в тех же пропорциях 3,21. OpenLB служил только заранее посчитанным эталоном; никакой его (GPL) код здесь не используется. Проверка выполняется вживую после самолёта в том же запуске (параметр validate, по умолчанию включён; 2000 шагов) и заполняет панель невязки.'
meanings:
- 'популяции: жидкость в узле $(x, y, z)$, движущаяся с решёточной скоростью $i$'
- скорости D3Q19 (покой, 6 граней, 12 рёбер), веса и противоположные направления
- 'треугольники STL: треугольник $t$, вершина $v$, координата $a$'
- внутри, если знаковые пересечения луча вдоль $+x$ (число оборотов) положительны; все лучи × все треугольники, затем searchsorted
- 'повторный $a$ ⇒ суммирование: скорость вдоль каждого направления решётки'
- 'повторный $i$ ⇒ суммирование: плотность импульса'
- 'MRT: неравновесные моменты, каждый релаксирует со своей скоростью $s_k$'
- неравновесный поток импульса; его величина задаёт вихревую вязкость Смагоринского $\nu_t$
- 'перенос: сдвиг каждой популяции на одно звено'
- 1 там, где популяция уходит из узла жидкости к телу (отражение как маскированная перестановка)
- 'обмен импульсом: сила на тело, просуммированная по его граничным звеньям'
labels:
  body: Тело (STL в data/; sphere_openlb — проверочный случай OpenLB)
  re: Число Рейнольдса $UL/\nu$ (длина тела $L$)
  collision: Оператор столкновений
  les: LES Смагоринского
  pitch: Угол атаки (самолёт и крыло)
  steps: Шаги решётки по времени
  validate: Также запустить проверку сферы по OpenLB (панель невязки)
