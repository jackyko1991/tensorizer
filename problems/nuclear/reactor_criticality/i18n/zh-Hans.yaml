source_hash: f81a85fc73c6
title: 反应堆临界
summary: 一块裂变材料平板是否临界？单群中子扩散把问题化为网格上的广义本征值问题 $M\phi = \tfrac1k F\phi$。幂迭代——反复求解下一代中子——收敛到基模通量和增殖因数 $k_{eff}$，对多种平板宽度的批量本征求解则找出临界尺寸。
notes: $k$ 是相邻两代中子数之比。每一步幂迭代就是一代：高阶空间模式每步按因子 $k_2/k_1 = (\Sigma_a + DB^2)/(\Sigma_a + 4DB^2)$ 衰减，所以不对称的初态弛豫为对称的 $\sin(\pi x/L)$ 形状。薄板泄漏的中子太多（$k < 1$）；超过临界宽度 $L_c = \pi\sqrt{D/(\nu\Sigma_f - \Sigma_a)}$ 后链式反应增长。默认的单群常数用于示意热中子反应堆（$k_\infty \approx 1.06$）。简化：单能群，均匀裸平板、无反射层，$L$ 在外推边界之间测量，没有缓发中子和反馈——这是静态本征值计算，而非含时计算。
meanings:
- 内部格点；在平板（外推）边界处 $\phi = 0$
- 二阶差分矩阵 $(1, -2, 1)/h^2$
- 因泄漏和吸收损失的中子
- 裂变产生的中子
- 重复的 $j$ ⇒ 求和：下一代的裂变源
- 一步幂迭代
- 直接求解，对 $S$ 种平板宽度批量计算
labels:
  width: 平板宽度 $L$
  diffusion: 扩散系数 $D$
  sigma_a: 吸收截面 $\Sigma_a$
  nu_sigma_f: 产生截面 $\nu\Sigma_f$
  n_iter: 幂迭代次数
  n_grid: 格点数
