source_hash: a25b37200a6c
title: HP 格点蛋白质折叠
summary: 仍能折叠的最简单蛋白质模型：正方格点上的一串疏水（H）和极性（P）残基，每个非链上相邻残基之间的 H–H 接触使能量降低 1。一条 20 残基基准序列的许多副本同时用 Metropolis 蒙特卡罗加上拉动和曲轴移动进行折叠，同时逐步降温；接触图由一个形状为 $(R, N, N)$ 的成对距离张量得到。
notes: 蛋白质之所以折叠，主要是因为疏水侧链躲进紧密的核心以避开水。HP 模型（Dill，1985）只保留这一点：一个 H–H 接触值 $-\varepsilon$，其他都不计，而链是格点上的自回避行走。即便如此，寻找最低能量仍是 NP 难问题，构象数则按 $2.64^N$ 增长。默认序列 HPHPPHHPHPPHPHHPPHPH 是 Unger 和 Moult（1993）的经典 20 残基基准，基态 $E = -9$；其他序列的已知最小值为 $-9$、$-8$ 和 $-14$。每一步，每个副本选一个残基并尝试拉动移动（Lesh、Mitzenmacher 和 Whitesides，2003：残基跳到一个空的角位，并沿链拖动其邻居，直到链重新连通；在末端这相当于转动最后一个残基，最简单的情形就是角翻转）或曲轴移动（一对 U 形残基翻转）。会断开键或使两个残基占据同一格点的提议会被拒绝；否则由 Metropolis 准则决定。高温让链自由探索，缓慢降温则让它们稳定成以 H 为核心、P 残基在表面的紧密折叠。能量 $E$ 用每个被接受移动的 $\Delta E$ 更新，并在测试中与完整重算核对。拉动移动并非严格对称的提议，因此这个模拟是优化器，而非精确的热力学采样器。试试 36 残基的序列：它需要更多步数或副本，而到达基态的副本比例显示其能量面有多崎岖。
meanings:
- 副本 $r$ 中残基 $i$ 的格点坐标 $k$；每个副本都从直棒出发
- H 为 1，P 为 0
- 重复的 $k$ ⇒ 求和：批量 Gram 矩阵；结合平方范数得到 $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$
- 格点上相邻但链上不相邻的残基
- 重复的 $i$ 和 $j$ ⇒ 求和：H–H 接触，每个计了两次，因此乘以 $\tfrac12$
- 键长为 1 且没有两个残基在同一格点，否则拒绝该移动
- 退火方案：$T$ 逐步按几何级数下降
- Metropolis 准则：下坡总是接受，上坡以概率 $e^{-\Delta E/T}$ 接受
labels:
  sequence: 序列
  replicas: 副本数 $R$
  steps: 蒙特卡罗步数
  T_start: 起始温度 $T_0$（单位 $\varepsilon/k_B$）
  T_end: 终止温度 $T_1$
