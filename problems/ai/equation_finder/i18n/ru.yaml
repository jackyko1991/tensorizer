source_hash: f8aa40a8b1bc
title: 'Поиск уравнений: тензорный ИИ, который записывает управляющее уравнение своих данных'
summary: Дайте ему полевые данные — получите закон в LaTeX. Библиотека членов-кандидатов ($1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$) строится конечными разностями, фильтрами Савицкого–Голея или в слабой форме, а гребневая регрессия с последовательным порогом (PDE-FIND) оставляет немногие члены, объясняющие $\partial_t u$. По смоделированным данным он восстанавливает систему Лоренца, уравнение теплопроводности, вязкое уравнение Бюргерса и уравнения Максвелла из расчёта Yee FDTD (с $c$ с точностью 0.2 %, 0.03 % в слабой форме) и находит скрытое в библиотеке $\nabla\cdot\mathbf B = 0$; исследование шума показывает, где ломается каждый оценщик производных.
notes: 'Идея. Это «автоматический поисковик физических уравнений» Jacky Ka Long Ko: небольшой тензорный ИИ, который смотрит на полевые данные и записывает в LaTeX уравнение, которое ими управляет (подход SINDy / PDE-FIND). Он продолжает поиск операторов на MNIST, завершившийся выводом «у рукописной цифры нет управляющего уравнения»; здесь данные порождены законами, так что есть что искать. Архитектура состоит из трёх модулей: (1) сглаживатель, подавляющий шум, (2) движок производных на einsum / конечных разностях, (3) разреженная регрессия операторов. Здесь (2) и (3) реализованы полностью, а (1) — сглаживатель Савицкого–Голея (нейронная сеть для этого не нужна). Метод. Каждый член-кандидат — производная монома от полей, $D^\alpha(\prod_g u_g^{p_g})$: 20 мономов до степени 3 для системы Лоренца, 13 членов $D^d(u^p)$ ($p, d \le 3$) для одномерных уравнений, 17 членов для Максвелла (поля, их производные по $x$ и $y$, их лапласианы, несколько произведений). Три способа построить линейную систему
  $\partial_t u = \Theta\xi$: центральные конечные разности (fd); Савицкий–Голей (sg: кубический сглаживатель по 7 отсчётам, затем аппроксимация производной полиномом четвёртой степени по 9), оба — одномерные свёртки ось за осью; и слабая форма (weak SINDy, Messenger и Bortz 2021), где уравнение интегрируется с пробными «шапочками» $(1-s^2)^{10}$, а интегрирование по частям переносит все производные на них, одна тензорная свёртка на ось. Затем STRidge (Rudy et al. 2017) работает на столбцах единичной нормы: гребневая регрессия, обнуление всех коэффициентов меньше $\tau$, повторная подгонка, повтор; перебор 41 порога для 3 значений силы регуляризации, и выбирается модель с наименьшим числом членов, ошибка валидации которой не более чем на 5 % (+ $10^{-3}$) хуже лучшей. Большая сила регуляризации важна для Максвелла: поскольку $\nabla\cdot\mathbf B = 0$, столбцы $\partial_x B_x$ и $\partial_y B_y$ почти противоположны, и при слабой регуляризации регрессия добавляла $2200\,\nabla\cdot\mathbf
  B$ к уравнению для $E_z$. Коэффициенты переподгоняются методом наименьших квадратов по оставшимся членам, с бутстрепом по строкам для ±; этот ± — только статистический и не включает смещение оценки производных, поэтому он часто намного меньше истинной ошибки. Альтернативная регрессия — релаксация в стиле DARTS из operator_search_mnist: $\xi = \sigma(\alpha/T)\,w$ со штрафом на вентили и температурой, отжигаемой от 1 до 0.01. Данные, все смоделированы здесь: 8 траекторий Лоренца (RK4); уравнение теплопроводности на периодическом стержне 10 cm, точно через моды Фурье ($D$ = 0.2 cm²/s); вязкое уравнение Бюргерса на $2\pi$ m, точно через преобразование Коула–Хопфа ($\nu$ = 0.1 m²/s); Максвелл в периодическом ящике 6.4 cm из расчёта Yee FDTD (TM-мода, ячейки 0.5 mm, число Куранта 0.5), дискретизированный так, как это сделало бы измерение (все поля интерполированы в одни и те же точки и моменты времени). Шум: гауссов, 0, 0.1, 1 и 5 % от стандартного отклонения каждого поля. Результаты. Тесты
  проверяют, что ядра и слабая форма точны там, где это утверждает анализ, что данные подчиняются своим законам (ядро теплопроводности, Коул–Хопф, схема Yee сохраняет $\nabla\cdot\mathbf B = 0$ до ошибки округления и сохраняет энергию с точностью 0.2 %), что STRidge точно восстанавливает заложенный разреженный вектор, что каждая цель восстанавливается по чистым данным и что записанный LaTeX, прочитанный обратно парсером, воспроизводит подогнанную модель. Прилагаемый запуск, чистые данные, конечные разности: Лоренц $\sigma$ = 9.9987, $\rho$ = 27.989, $\beta$ = 2.6662; теплопроводность $D$ = 0.20023 cm²/s; Бюргерс $u_t = -1.0007\,u u_x + 0.09996\,u_{xx}$; Максвелл $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$ с $c$ = 29.92 cm/ns (истинное 29.98) и $\partial_t \mathbf B = -\nabla\times\mathbf E$ с коэффициентами 0.996. Слабая форма гораздо точнее (ошибки порядка $10^{-8}$ на точных данных; 0.03 % на Максвелле — это собственная численная дисперсия схемы Yee, а не поисковика). Наименьший
  сингулярный вектор библиотеки Максвелла — $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$, с сингулярным числом в 220 раз меньше следующего: данные раскрывают $\nabla\cdot\mathbf B = 0$ как неявный закон. Шум (найдены ли правильные члены?): конечные разности ломаются начиная с 0.1 % шума для теплопроводности и Бюргерса и с 1 % для Лоренца и выдерживают 5 % только на Максвелле (с ошибкой коэффициентов 25 %); Савицкий–Голей выдерживает 0.1 % везде и 5 % только на Максвелле; слабая форма находит правильные члены на всех уровнях для теплопроводности, Бюргерса и Максвелла (при 5 % шума ошибки коэффициентов 7 %, 6 % и 0.1 %) и до 1 % для Лоренца (при 5 % она добавляет два крошечных ложных члена к $\dot y$). Отжигаемые вентили совпадают со слабым STRidge на Бюргерсе и Максвелле, но пропускают член $-y$ в $\dot y$ Лоренца на всех уровнях шума и при всех опробованных штрафах (от $10^{-6}$ до $10^{-3}$): его поглощает $25.5\,x - 0.95\,xz$ — локальный минимум, из которого релаксация не выходит; они
  также не справляются с теплопроводностью при 5 %. Повторное моделирование найденных уравнений из первого снимка воспроизводит данные теплопроводности и Бюргерса с точностью $3\times 10^{-4}$, а Максвелла — 3 %; Лоренц отклоняется на 3 % через 5 единиц времени, потому что хаос усиливает ошибку коэффициента в 0.01 %. results/noise_study.csv и results/equations.tex содержат все числа и уравнения; по одному GIF на цель (главный — Максвелл) и results/summary.png. Вывод. Поисковик восстанавливает известные формы уравнений по чистым, хорошо дискретизированным данным, а в слабой форме выдерживает реалистичный шум; первой ломается оценка производных, а не регрессия. Он находит только члены, которые есть в его библиотеке, ему нужны правильные измеренные переменные, а найденное уравнение — гипотеза: он не открывает новую физику (или физиологию) без независимой проверки. Он также не заменяет большие языковые модели; это другая задача (подогнать закон к данным, а не порождать текст). Связанные работы.
  SINDy (Brunton, Proctor и Kutz 2016), PDE-FIND и STRidge (Rudy et al. 2017), weak SINDy (Messenger и Bortz 2021); символьная регрессия генетическим программированием (Schmidt и Lipson 2009) и AI Feynman (Udrescu и Tegmark 2020); схема Yee (Yee 1966). Попробуйте. Меньше бутстреп-выборок для более быстрого запуска, больше шагов вентилей, чтобы проверить, выберется ли релаксация из своего минимума Лоренца (до 4000 не выбралась), или более грубую сетку Yee.'
meanings:
- 'библиотека: столбец $k$ — член-кандидат $D^\alpha(\prod_g u_g^{p_g})$ в каждой внутренней точке сетки $n$, напр. $u u_x = \tfrac12\partial_x(u^2)$, $\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$'
- 'движок производных: одномерная свёртка вдоль одной оси; центральные разности или Савицкий–Голей (полином наименьших квадратов степени $p$ по $2m+1$ отсчётам) после кубического сглаживателя'
- 'слабая форма: суммирование по $x$ и $t$; производные приходятся на гладкие «шапочки» $\phi(s) = (1-s^2)^{10}$, а не на зашумлённые данные'
- одно пакетное гребневое решение для каждого уравнения $f$ по его оставшимся членам; STRidge обнуляет $|\hat\xi_k| < \tau$ и переподгоняет
- 'перебор порогов: оставить модель с наименьшим числом членов, ошибка валидации которой не более чем на 5 % (+ $10^{-3}$) хуже лучшей'
- 'альтернатива в стиле DARTS: $\xi = \sigma(\alpha/T)\, w$ со штрафом на вентили, температура отжигается от 1 до 0.01'
- 'бутстреп: $B$ перевыборок строк в виде мультиномиальных весов, все подгонки в одном пакетном решении'
- 'записанный LaTeX, прочитанный обратно парсером: он воспроизводит подогнанную модель с напечатанной точностью'
labels:
  bootstrap: Бутстреп-выборки для ± каждого коэффициента
  gate_steps: Шаги Adam поиска с отжигаемыми вентилями
  maxwell_grid: Сетка Yee для моделирования Максвелла ($n \times n$ ячеек по 0.5 mm)
