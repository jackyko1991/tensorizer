source_hash: f7213dbb7c33
title: 原子核殼層模型
summary: 核子在 Woods–Saxon 位能井中獨立運動。把每個 $(l, j)$ 通道的徑向薛丁格方程式寫成一批有限差分 Hamiltonian 一起求解，再調高自旋–軌道力，魔數 2、8、20、28、50、82、126——特別穩定的原子核的核子數——便以能階圖中最大的能隙出現。
notes: 沒有自旋–軌道作用時，能階像三維諧振子那樣聚集，能隙出現在 2、8、20 與 40 個核子之後（Woods–Saxon 井的平坦底部也分出 58、92 與 138）。自旋–軌道項使 $j = l + \tfrac12$ 降低、$j = l - \tfrac12$ 升高，幅度隨 $l$ 增大，因此每個諧振子殼層中高 $j$ 的成員（1f7/2、1g9/2、1h11/2、1i13/2）落入下一個殼層——這是 Mayer 與 Jensen 在 1949 年對 28、50、82 與 126 的解釋。預設參數對應 ²⁰⁸Pb 中的中子：$V_0 = 51 - 33(N-Z)/A \approx 44$ MeV、$r_0 = 1.27$ fm、$a = 0.67$ fm。簡化：所有能階用同一個固定位能井（無自洽、無配對），沒有庫侖項（因此是中子能階），盒子大小 18 fm，所以只顯示束縛能階。
meanings:
- 內部格點；在 $r = 0$ 與盒邊緣處 $u = 0$
- 有限差分 $d^2/dr^2$
- 直到 $l = 8$ 的每個通道 $(l, j = l \pm \tfrac12)$
- $j = l+\tfrac12$ 時為 $+l/2$，$j = l-\tfrac12$ 時為 $-(l+1)/2$
- 位能井 + 自旋–軌道 + 離心項，以 einsum('k,i->ki') 計算
- 每個通道一個 Hamiltonian，疊在一起
- 沿 $k$ 批次計算；保留束縛能階 $E < 0$
- 填到每個排序後能階的核子數：魔數位於大能隙處
labels:
  v_so: 最終自旋–軌道強度 $V_{so}$
  v0: 位能井深度 $V_0$
  mass_number: 質量數 $A$（決定 $R = r_0 A^{1/3}$）
  diffuseness: 表面瀰散度 $a$
  n_grid: 格點數
