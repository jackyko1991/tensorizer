source_hash: bb811720bfea
title: 有空气阻力的抛体
summary: 受二次空气阻力的小球的牛顿第二定律。把几个抛射角叠成一个批量张量同时求解，一次 einsum 就处理所有轨迹。
notes: 批量指标 $b$ 不是物理量：它是让 PyTorch 一次求解 $B$ 个抛体的张量技巧。把阻力设为零就回到教科书中的抛物线，45° 时射程最大。
meanings:
- 小球 $b$ 的位置，分量 $i \in \{x, z\}$
- 小球 $b$ 的速度
- 重力矢量 $(0, -9.81)$
- 重复的 $j$ ⇒ 求和：每个小球的速率平方
- 常微分方程的右端项
labels:
  v0: 抛射速度
  drag: 阻力系数 $c/m$
  n_angles: 抛射角数
  t_max: 模拟时长
