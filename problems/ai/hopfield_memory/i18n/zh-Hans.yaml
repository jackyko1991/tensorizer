title: Hopfield 网络：经典与现代的联想记忆
summary: 一种能从损坏或被遮住一半的版本补全图像的记忆。经典 Hopfield 网络把二值图样存入 Hebb 权重 $W_{ij}$，并沿能量向下滑；它最多只能存约 $0.138\,N$ 个随机图样，相关的图样则少得多。Ramsauer 等人（2020）的现代连续 Hopfield 网络保留图样本身，并以 $\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$ 更新，这正是 transformer 的注意力机制：它一步就能取回卡通人脸，而经典网络却会把它们混在一起。
notes: 这些人脸并非任何人的图像：每一张都由代码根据几个随机数画出（头形、眼睛、眼镜、眉毛、鼻子、嘴巴弯度、头发、耳朵），因此没有使用任何受版权保护的角色或照片。每个查询会遮住人脸下方 40 % 的部分，并翻转其余像素的 5 %。对随机图样，经典网络的极限 $\alpha_c \approx 0.138$ 是 Amit、Gutfreund 与 Sompolinsky（1985）用自旋玻璃的方法计算出来的，而一步更新的比特错误率遵循高斯串扰定律 $\Phi(-1/\sqrt\alpha)$（两者都在测试中验证）。人脸之间高度相关（它们共用轮廓和大片空白纸面），因此经典网络在远低于 $0.138$ 的负载下就已经会混淆它们：它会落入多张人脸的混合态。现代网络的能量含有一个 log-sum-exp 项；Ramsauer 等人证明它在每次更新时都会下降、通常一次更新就足够，而且对分离良好的图样，容量随 $N$ 指数增长。它的更新正是以存储的图样作为键和值的 transformer 注意力。把 $\beta$ 调小，就会看到几张人脸的亚稳态平均，而不是单张人脸。这个想法取自该论文附带的博客文章，只是用程序生成的人脸取代了其中的卡通图片。
meanings:
- 图样 $\mu$：程序绘制的卡通人脸，墨迹为 $+1$，纸面为 $-1$，$N = 32 \times 32$ 像素
- Hebb 规则，重复的 $\mu$ ⇒ 求和；每个存储人脸数对应一个网络 $f$，对角线设为 0
- 重复的 $j$ ⇒ 求和：每个网络与查询中神经元 $i$ 所受的场；$s_i$ 取其符号
- 能量；在每次只更新一个神经元时永不上升
- 重复的 $n$ ⇒ 求和：查询与每个存储图样的相似度，由 $\beta$ 锐化
- 重复的 $\mu$ ⇒ 求和：新状态是各图样的加权平均，$\beta$ 很大时只剩一个图样
- 回忆质量：人脸被完全还原时为 1
labels:
  n_faces: 最多存储的人脸数 $P$
  beta: 逆温度 $\beta$
  mask: 每张人脸被遮住的比例
  noise: 翻转的像素
  sweeps: 经典更新扫描次数
  n_random: 容量曲线的神经元数 $N$
