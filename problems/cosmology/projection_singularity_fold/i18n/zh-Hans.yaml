title: 奇点作为投影的折叠
summary: 这是一个推测性的假说，并非已确立的物理：弯曲时空是平直高维空间中一个曲面的影子，而奇点是这个影子折叠之处。首先检验已知的几何。Flamm 抛物面，以及 Fronsdal 在 1959 年把整个 Schwarzschild 时空嵌入六维平直空间的做法，都能精确还原度规（autograd），而 Kretschmann 标量 $12r_s^2/r^6$ 也由同一套自动微分得出。投影后的片层以普适的密度指数折叠：折叠为 $-1/2$，尖点为 $-2/3$。折叠形状的内部使外部保持精确的 Schwarzschild 解，因此它隐藏在视界之后。这里的任何东西都无法直接观测。
notes: 投影假说的第 4 步（见系列说明），这是作者的推测性假说，并非已确立的物理。第 1 步（cosmology/projection_postulate）提出公设 P4：弯曲时空是平直高维嵌入投影后的形状，而奇点是投影折叠之处（其 Jacobian 降秩）。第 3 步（cosmology/projection_dimension_budget）计算维度，第 5 步（cosmology/projection_bell_test）检验测量公设，第 6 步（cosmology/projection_telescope_tests）探讨望远镜能检验什么。平直维度的数目 $D$ 保持开放：它在这里是一个参数，从不进入任何结果。先看已知的几何。(a) Flamm（1916）：将 Schwarzschild 的赤道切片 $t = $ const、$\theta = \pi/2$ 画在平直的 $\mathbb R^3$ 中，就是抛物面 $z = 2\sqrt{r_s(r-r_s)}$，其诱导度规 $dr^2/(1-r_s/r) + r^2d\phi^2$ 吻合到 $10^{-16}$。(b) Fronsdal（Phys. Rev. 116, 778, 1959）把整个 Schwarzschild 时空，包括视界内部，嵌入平直的 $\mathbb R^{1,5}$。诱导度规 $\eta_{AB}\partial_iz^A\partial_jz^B$（Jacobian 由 autograd 求得）在外部和内部，以及在跨越视界的 Kruskal 坐标中，都与 Schwarzschild 吻合到 $10^{-13}$。弯曲的四维几何确实可以看作平直空间中的曲面；这是 P4 的依据。有两个事实对 P4 很重要。嵌入在视界处是满秩的：在 $(t, r)$ 坐标中看到的降秩在 Kruskal 坐标中消失了。在 $r\to0$ 处它也不折叠；它跑向无穷远，$z^2\approx-2r_s^{3/2} r^{-1/2}$。由同一套自动微分（Christoffel 符号、Riemann 张量、einsum 缩并）计算的曲率给出 $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$，精确到 $10^{-15}$。静态潮汐本征值为 $+r_s/r^3$（径向拉伸）与 $-r_s/2r^3$（侧向挤压），全部在
  $r = 0$ 处发散。把 P4 的主张具体化：平直 $\mathbb R^D$ 中的一个光滑片层，通过投影观看时，其影子的密度在折叠焦散处发散。突变理论（Thom、Arnold）指出这个指数是普适的。映射 $x = s^n$ 给出 $\rho\propto|x|^{1/n-1}$，测得 $-0.500$（折叠）、$-0.667$（尖点）与 $-0.750$（$n = 4$）。球面 $S^k$ 投影到 $\mathbb R^3$ 上时，具有边缘密度 $u^{(k-3-1)/2}$，测得 $-0.51$、$0.00$、$+0.45$（分别对应 $k = 3, 4, 5$），对任何 $D$ 皆然。因此，密度尖峰需要一个维度恰好与屏幕相同的片层；更厚的片层给出光滑的影子。动画将一个波浪状片层逐渐倾斜，直到它在 $a\tan\alpha > 1$ 时折叠。与广义相对论比较：让质量 $M = r_s/2$ 具有三维球面影子的密度 $\rho\propto(1-r^2/R^2)^{-1/2}$，这是一个弱场的粗略模型，不是爱因斯坦方程的解。在 $R$ 之外，场恰好是 $r_s/r^3$（Birkhoff 定理、壳层定理），而中心保持有限。发散移到折叠壳层上，并在密度与潮汐场中软化为 $(R-r)^{-1/2}$，曲率代理量 $8\sum E^2$ 则软化为 $(R-r)^{-1}$，而不是广义相对论的 $r^{-3}$ 与 $r^{-6}$。片层本身保持有限的曲率 $1/R^2$。坦白的结论。P4 可以让经过严格检验的外部 Schwarzschild 几何保持不变，只改变内部，但正是这一点使它无法检验：当 $R < r_s$ 时，折叠位于视界之后，任何来自它的信号都无法到达我们。普适指数只在描述上是新的，因为视界之外没有任何东西依赖于它们。位于视界之外的折叠（$R > r_s$）将是一个没有视界的致密天体，具有不同的光子环与回波；这正是第 6 步用黑洞阴影所检验的。背景：fluids/blowup_profile_search 展示了奇异剖面及其指数在实际中是如何研究的（自相似假设、指数搜索）。维基百科：Schwarzschild 度规、突变理论。
meanings:
- 以自动微分求得的嵌入 Jacobian，每个采样点 $b$ 一个
- 诱导度规：重复的嵌入指标 $A, C$ 与平直度规 $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ 一起求和
- 额外的嵌入坐标，是对 $q$ 的 64 节点 Gauss–Legendre 求和（在 $\ell = \ln s$ 中进行），对 $r$ 可微；它趋向 $-\infty$，行为如 $r^{-1/2}$
- 最小奇异值：映射的折叠就是它降到 0、Jacobian 降秩之处
- 由度规的 autograd 导数得到的 Christoffel 符号；对 $d$ 求和
- 由第二次前向模式导数与两次 einsum 乘积得到的 Riemann 张量（对 $e$ 求和）
- Kretschmann 标量，对全部四个指标求和；在视界内外都等于 $12r_s^2/r^6$
- 均匀片层在 $x = s^n$ 下的影子密度（折叠 $n = 2$，尖点 $n = 3$），以对数分箱的直方图表示
- 以半径 $R$ 的三维球面影子方式分布的质量的牛顿潮汐张量（弱场粗略模型）
labels:
  fold_radius: 折叠壳层的半径 $R$
  sheet_amplitude: 波浪状片层的振幅 $a$
  D: 容纳球面片层的平直维度 $D$（开放）
  samples: 每个片层上的采样点数
