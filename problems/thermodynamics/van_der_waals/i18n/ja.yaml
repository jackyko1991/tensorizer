source_hash: db1c9922ad65
title: ファン・デル・ワールス気体とマクスウェルの等面積則
summary: ファン・デル・ワールスの状態方程式は理想気体に分子間引力と分子の大きさを加えたもので、それだけで気液相転移が現れる。等温線の族全体は1回の $(T, V)$ ブロードキャストで得られる。臨界温度より下では非物理的なループがマクスウェルの等面積線で置き換えられ、その圧力は温度のバッチについて一度に二分法で求められる。
notes: $a$ は分子間の引力（圧力を下げる）を、$b$ は1モルの分子が占める体積を表す（$V$ は $nb$ を下回れない）。$T_c$ より下では、等温線に気体を圧縮すると圧力が下がる区間がある——力学的に不安定である。実際には気体は一定の圧力 $p^*$、すなわち蒸気圧で凝縮する：モル体積 $V_l$ の液体と体積 $V_g$ の気体が共存する。マクスウェルの規則は、線の上と下の面積が等しいこと（同値的に、2相のギブズエネルギーが等しいこと）を要請して $p^*$ を決める。破線のドームはすべての $(V_l, p^*)$ と $(V_g, p^*)$ を結んだもので、その頂点が臨界点であり、そこで液体と気体は区別できなくなる。軸は臨界値で規格化しており、そこではどのファン・デル・ワールス気体も同じに見える（対応状態の原理）。体積軸は線形なので、陰影の面積を目で比較できる。ファン・デル・ワールス模型は実在流体に対して定性的にすぎない：たとえばその $V_c = 3nb$ は実際の臨界体積を過大評価する。
meanings:
- 列ベクトルとしての温度の掃引
- 行ベクトルとしての体積格子
- ブロードキャストによりすべての等温線を一度に
- 温度のバッチに対する3次方程式 $p(V) = p^*$ の根
- 曲線と直線の間の符号付き面積：答えで0になる
- 二分法：torch.where がすべての区間を一度に動かす
labels:
  gas: 気体
  n: 物質量
  T_high: 開始温度
  T_low: 終了温度
  n_temps: 温度の数（フレーム数）
