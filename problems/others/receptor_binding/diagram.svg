<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Receptor-ligand binding: a free Y-shaped receptor R on a cell membrane and a ligand L combine into a bound complex C, with forward rate k_on and backward rate k_off">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- cell membrane -->
    <line x1="14" y1="128" x2="226" y2="128" stroke="#374151" stroke-width="2"/>
    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="22" y1="128" x2="14" y2="136"/><line x1="36" y1="128" x2="28" y2="136"/><line x1="50" y1="128" x2="42" y2="136"/>
      <line x1="64" y1="128" x2="56" y2="136"/><line x1="78" y1="128" x2="70" y2="136"/><line x1="92" y1="128" x2="84" y2="136"/>
      <line x1="106" y1="128" x2="98" y2="136"/><line x1="120" y1="128" x2="112" y2="136"/><line x1="134" y1="128" x2="126" y2="136"/>
      <line x1="148" y1="128" x2="140" y2="136"/><line x1="162" y1="128" x2="154" y2="136"/><line x1="176" y1="128" x2="168" y2="136"/>
      <line x1="190" y1="128" x2="182" y2="136"/><line x1="204" y1="128" x2="196" y2="136"/><line x1="218" y1="128" x2="210" y2="136"/>
    </g>
    <text x="120" y="153" font-size="11" fill="#6b7280" text-anchor="middle">immune-cell membrane</text>
    <!-- free receptor R and an approaching ligand L -->
    <path d="M52,128 V106 M52,106 L40,90 M52,106 L64,90" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="26" y="118" font-style="italic" fill="#1e40af">R</text>
    <line x1="52" y1="62" x2="52" y2="86" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="52" cy="52" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="65" y="57" font-style="italic" fill="#b45309">L</text>
    <text x="160" y="30" font-size="13" text-anchor="middle" fill="#374151"><tspan font-style="italic">R</tspan> + <tspan font-style="italic">L</tspan> ⇌ <tspan font-style="italic">C</tspan></text>
    <!-- reversible reaction -->
    <line x1="96" y1="82" x2="146" y2="82" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="146" y1="94" x2="96" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="108" y="74" font-style="italic">k<tspan font-size="10" dy="3" font-style="normal">on</tspan></text>
    <text x="108" y="112" font-style="italic">k<tspan font-size="10" dy="3" font-style="normal">off</tspan></text>
    <!-- bound complex C -->
    <path d="M188,128 V106 M188,106 L176,90 M188,106 L200,90" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="188" cy="92" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="206" y="118" font-style="italic" fill="#1e40af">C</text>
  </g>
</svg>
