source_hash: 16a2fcec9827
title: Reconstruction de traces de particules par programmation en nombres entiers
summary: 'Des impacts réels issus d''une collision simulée du HL-LHC (challenge TrackML, CC BY 4.0) sont reliés en traces par un programme linéaire en nombres entiers : on choisit des triplets d''impacts de courbure et d''angle polaire cohérents, chaque impact étant utilisé au plus une fois. Notre PDLP tensoriel (gradient hybride primal–dual avec redémarrages, la méthode LP d''OR-Tools et de cuOpt) résout la relaxation LP en direct sur des tenseurs creux, puis l''arrondit et la répare. Il est comparé à une référence hongroise (Kuhn–Munkres) écrite à la main et à des exécutions hors ligne de HiGHS, Gurobi et scipy : écart à l''objectif, efficacité, taux de fausses traces, score officiel TrackML et loi d''échelle du temps de calcul $t \propto N^k$.'
notes: 'Statut : une comparaison d''outils, pas un problème ouvert. L''ILP est un problème d''empaquetage d''ensembles (NP-difficile en général) ; PDLP est une méthode LP du premier ordre, et l''arrondi donne une solution entière heuristique, pas un optimum certifié, si bien que l''écart à l''optimum exact est toujours indiqué. La borne duale de PDLP fournit une borne supérieure certifiée même sans solveur exact. Méthode. Les segments candidats relient des impacts de couches adjacentes qu''une trace de $p_T \ge p_{T,\min}$ issue de la ligne de faisceau pourrait connecter. Les triplets relient deux segments par un impact central commun et reçoivent le score $s_t = 1 - (\Delta\kappa/\sigma_\kappa)^2 - (\Delta\theta/\sigma_\theta)^2$ (seuls les $s_t > 0$ sont conservés). L''ILP choisit des triplets $x_t$ et des segments $y_e$ : chaque impact a au plus un segment choisi entrant et un sortant, de sorte que les traces sont des chaînes. Un segment choisi se prolonge dans au plus un triplet choisi
  de chaque côté, et chaque segment coûte $\lambda = 0.1$. Sa relaxation LP ($0 \le x, y \le 1$) est résolue par notre PDLP (Applegate et al. 2021) : PDHG avec mise à l''échelle de Ruiz, redémarrages vers la moyenne fondés sur les conditions KKT et mises à jour du poids primal, écrit avec torch.sparse pour tourner sur CPU ou CUDA. La référence hongroise résout une affectation linéaire exacte par paire de couches (la paire centrale d''abord, puis vers l''intérieur et l''extérieur, avec des coûts de triplets tenant compte de la chaîne déjà construite). C''est un couplage biparti résolu exactement en temps polynomial, mais il décide une paire de couches à la fois, alors que l''ILP pondère globalement des chaînes entières. C''est pourquoi ses traces diffèrent. Données. TrackML Particle Tracking Challenge (CERN / Kaggle 2018), événement d''entraînement 1000 (200 collisions d''empilement) : enregistrement Zenodo 4730167, doi:10.5281/zenodo.4730167, licence CC BY 4.0 (Salzburger, Innocente, Vlimant,
  Rousseau et al.). Il est restreint au tonneau à pixels (volume 8, 4 couches) avec $|\eta| < 1$ : 11 519 impacts, 2 452 particules et 6 % de bruit, plus les poids officiels par impact. Banc d''essai hors ligne (data/solver_benchmark.csv) sur un AMD Ryzen 5 5600G (1 thread) : HiGHS via scipy 1.18.1 (milp, linprog), Gurobi 13 via gurobipy avec sa licence limitée en taille (au plus 2000 variables et 2000 contraintes, donc seulement $\Delta\phi \le 30°$), linear_sum_assignment de scipy, et notre PDLP sur CPU et sur une NVIDIA GTX 1080 Ti. NVIDIA cuOpt 26.10 a été installé sous WSL mais n''a pas pu tourner : ses noyaux sont compilés pour la capacité de calcul 7.0 (Volta) et au-delà, et la 1080 Ti est en 6.1 (cudaErrorNoKernelImageForDevice) ; il est donc omis et n''a pas de chiffres. L''état de l''art cité se trouve dans data/trackml_sota.csv. Verdict. Sur les huit secteurs (de 5° à 360°, de 151 à 11 519 impacts), la relaxation LP était exacte : l''optimum LP de HiGHS égale l''optimum MILP à
  $10^{-13}$ près. Notre PDLP avec réparation a atteint le même optimum à chaque fois (écart inférieur à $10^{-9}$), avec exactement les triplets choisis par HiGHS et Gurobi (0 différence). C''est empirique, non garanti : l''empaquetage d''ensembles est NP-difficile, et ici la structure en chaînes à quatre couches maintient la relaxation LP exacte. Avec des scores continus, les égalités exactes sont improbables, donc les solveurs qui atteignent l''optimum concordent. En cours d''exécution, environ un tiers des valeurs PDLP sont fractionnaires, beaucoup proches de $\tfrac12$ là où des triplets rivaux sont presque à égalité (par exemple des doubles impacts dans des modules qui se chevauchent) ; elles se stabilisent à mesure que PDLP converge. Les chaînes hongroises sont de 0 à 2,2 % en dessous de l''optimum (de 5 à 651 triplets différents) et reproduisent exactement l''objectif d''affectation de scipy (une vérification de notre algorithme hongrois). Sous-ensemble complet du tonneau (360°)
  : efficacité de 93,1 % et taux de fausses traces de 13,0 % pour les solveurs ILP contre 90,9 % et 16,2 % pour l''algorithme hongrois, score TrackML de 0,495 contre 0,482. Un reconstructeur parfait des particules reconstructibles obtiendrait ici 0,618 ; l''état de l''art cité sur événement complet est de 0,88 à 0,94 (Mikado 0,944 en 0,56 s). Loi d''échelle pour $N \ge 1000$ impacts : HiGHS MILP $N^{1.14}$, HiGHS LP $N^{1.01}$, notre PDLP sur CPU $N^{0.92}$, sur GPU $N^{0.36}$ (le surcoût de lancement domine encore à 10 000 variables, donc la 1080 Ti n''est pas encore plus rapide), notre algorithme hongrois $N^{2.14}$ (pire cas $O(n^3)$ ; des coûts creux et filtrés gardent les chemins augmentants courts), scipy $N^{1.57}$. Gurobi ne tient dans sa limite de taille que jusqu''à 860 impacts ($N^{1.04}$ dans ce domaine). À ces tailles, HiGHS est aussi rapide que PDLP ; les méthodes du premier ordre deviennent rentables sur des LP bien plus grands. Sur les petits secteurs, l''algorithme hongrois
  trouve un peu plus de particules (97,4 % contre 94,8 % à 30°) : l''objectif de l''ILP est un indicateur indirect, pas la métrique physique. Mises en garde. Nos instances sont un secteur du tonneau à 4 couches, donc les traces ont au plus 4 impacts et il n''y a pas de bouchons : c''est plus facile et différent des événements complets du challenge. La comparaison des scores TrackML est indicative, pas à conditions égales : environ 40 % du poids de score du sous-ensemble porte sur des particules sous la coupure en $p_T$ ou ayant moins de 3 couches dans la coupure, et nos temps couvrent un dixième d''événement et excluent la lecture et la construction des candidats. Les vrais reconstructeurs (ACTS, et ceux des expériences elles-mêmes) utilisent des filtres de Kalman combinatoires, et les réseaux de neurones sur graphes (Exa.TrkX) sont la principale approche par apprentissage automatique ; personne ne lance un MILP par événement.'
meanings:
- 'impacts TrackML réels sur les 4 couches du tonneau à pixels, restreints à un secteur $\Delta\phi$ : la taille du problème'
- paires d'impacts sur des couches adjacentes avec $|\Delta\phi| \le \arcsin(r_b/2R) - \arcsin(r_a/2R)$ et $|z_0| \le 150$ mm, toutes les paires d'un coup
- courbure du cercle passant par la ligne de faisceau et les deux impacts
- les triplets partagent l'impact central ; une hélice a les mêmes $\kappa$ et $\theta$ sur ses deux moitiés, donc $s_t$ diminue avec l'écart
- lignes d'exclusivité des impacts (un segment entrant, un sortant) et lignes de continuité ; $v$ répété ⇒ sommé dans chaque produit
- PDHG sur le LP mis à l'échelle par Ruiz, avec moyennage, redémarrages et poids primal ; deux produits matrice-vecteur creux par itération
- classer les segments par valeur LP, accepter ceux sans conflit par tours parallèles, élaguer les extrémités de chaîne qui coûtent plus qu'elles ne rapportent
- 'Kuhn–Munkres avec potentiels : une affectation linéaire exacte par paire de couches, enchaînée en traces'
- 'score officiel TrackML : somme des poids des impacts sur les traces qui contiennent > 50 % d''une particule et sont constituées à > 50 % de cette particule'
labels:
  dphi: Largeur du secteur $\Delta\phi$ (taille du problème)
  pt_min: Impulsion transverse minimale $p_{T,\min}$
  max_iter: Nombre maximal d'itérations PDLP
  digits: Précision cible de PDLP $10^{-k}$, $k$ =
  check: Itérations entre deux tests de redémarrage (une image chacun)
