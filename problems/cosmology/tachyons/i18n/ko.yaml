source_hash: e3fd71733e91
title: 타키온과 반전화기(antitelephone)
summary: 입자가 허수 질량 $m^2 < 0$을 가진다면 어떻게 될까요? 복소 텐서를 쓰면 $E^2 = p^2 + m^2$는 여전히 실수 에너지를 주지만, 입자는 언제나 빛보다 빠르며 에너지를 잃을수록 더 빨라집니다. 초광속 세계선에 대한 배치 로런츠 변환은 신호가 보내지기 전에 도착하는 기준계를 찾아내고, 톨먼의 반전화기 고리를 닫습니다. 반면 장론에서 $m^2 < 0$은 힉스장처럼 응축하는 불안정한 진공을 뜻합니다. 이는 사변적인 내용입니다. 타키온은 지금까지 한 번도 관측된 적이 없으며, 2011년 OPERA의 ‘초광속 중성미자’는 헐거운 케이블 때문이었습니다.
notes: '사변적인 물리학: 타키온은 가설상의 입자입니다. 표준 모형의 어떤 것도 타키온 입자가 아니며, 어떤 실험도 타키온을 검출한 적이 없습니다. 특수 상대성 이론은 질량을 가진 물체를 $c$ 너머로 가속하는 것을 금지하지만, 그 자체로는 언제나 빛보다 빠른 입자를 금지하지 않습니다(Bilaniuk, Deshpande, Sudarshan 1962; 이 이름을 만든 Feinberg 1967). 대가는 인과율입니다. 속력 $u > c$인 신호로 이어진 두 사건은 공간꼴로 떨어져 있으므로 그 시간 순서는 관찰자에 따라 달라집니다. $c^2/u$보다 빠르게 움직이는 모든 기준계에서는 신호가 보내지기 전에 도착하며 음의 에너지를 운반합니다. Feinberg의 재해석은 이를 반대 방향으로 진행하는 양의 에너지 반타키온으로 읽는데, 이는 에너지의 양성은 지켜 주지만 ‘누가 보냈는가’는 여전히 기준계에 의존하게 남겨 둡니다. 두 기준계를 사용하면 톨먼의 반전화기(1917)가 됩니다. 앨리스가 $\beta$로 멀어지는 밥에게 신호를 보내고, 밥은 자신의 기준계에서 같은 속력으로 답신합니다. $\beta > 2u/(1+u^2)$이 되면 답신은 앨리스가 메시지를 보내기 전에 그녀에게 도달하며, 이로써 인과 고리가 닫힙니다. 양자장론에서 음의 $m^2$은 빠른 입자가 아니라 불안정성입니다. 장은 $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$의 언덕 꼭대기 $\phi = 0$에서 굴러 내려가 $\phi = \pm\sqrt{-m^2/\lambda}$에 이르며(‘타키온 응축’, 에너지를 $m^4/4\lambda$만큼 낮춤), 그곳에는 질량$^2 = 2|m^2|$인 보통 입자들이 존재합니다. 이것이 바로 힉스장이 하는 일이며, 패널은 이를 허블 마찰이 있는 격자 위에서 보여 줍니다. 실제 데이터: 2011년 OPERA는 뮤온 중성미자가 730 km 거리에서 $60.7 \pm 6.9 \pm 7.4$ ns 일찍 도착했다고 보고했습니다, $(v-c)/c
  = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$ (arXiv:1109.4897v1). 원인은 잘못 연결된 광섬유 케이블과 시계 드리프트로 밝혀졌습니다. 수정된 결과는 $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$ (v4, JHEP 10 (2012) 093)이며, ICARUS는 $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns를 측정했습니다(Phys. Lett. B 713 (2012) 17). 둘 다 $c$와 일치합니다. 2011년 값을 타키온으로 해석하면 $|m| \approx 120$ MeV가 필요하며, 그렇다면 초신성 SN1987A에서 온 10 MeV 중성미자는 168 000년을 날아온 뒤 빛과 몇 시간 이내로 도착하는 대신 빛을 약 12배 앞질렀을 것입니다($|v-c|/c \lesssim 2\times10^{-9}$, Longo 1987). 단위: $c = 1$, 신호 부채꼴에 대해 타키온 질량 $\mu = 1$.'
meanings:
- '복소 제곱근: $m$과 $\gamma$가 둘 다 허수인데도 $p > \mu$일 때 실수'
- 관찰자 기준계마다 로런츠 변환 하나 ($c = 1$)
- '반복된 $b$ ⇒ 합산: 모든 신호를 모든 기준계에서 한꺼번에 봄'
- 불변량 $m^2 = -\mu^2$, 모든 기준계에서 동일
- '빠르기(rapidity)는 뺄셈으로 합성됨: $c$ 아래에서는 $\tanh$, 위에서는 $\coth$'
- 답신이 앨리스에게 도달하는 시각; $< t_{\mathrm{send}}$이면 인과 고리가 닫힘
- 거짓 진공 $\phi = 0$에서 굴러 내려가는 격자 장 (torch.roll 라플라시안, 속도 Verlet)
labels:
  u: 타키온 신호 속력 $u$
  beta_max: 가장 빠른 관찰자 기준계 $\beta_\mathrm{max}$
  m2: 장의 타키온 질량$^2$ $m^2$
  lam: 자기 결합 상수 $\lambda$
  friction: 허블 마찰 $\gamma$
