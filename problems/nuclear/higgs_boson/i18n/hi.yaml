title: वास्तविक द्वि-फ़ोटॉन डेटा में हिग्स बोसॉन की खोज
summary: 'वास्तविक 13 TeV ATLAS टक्करों के 10 fb$^{-1}$ (ATLAS Open Data, CC0) से लगभग 95 000 फ़ोटॉन युग्मों को द्वि-फ़ोटॉन द्रव्यमान $m_{\gamma\gamma}$ में बिन किया जाता है और autograd से फ़िट किया जाता है: एक चिकनी घटती पृष्ठभूमि और एक संकरी हिग्स चोटी। प्रोफ़ाइल संभाव्यता अनुपात $m_H$, संकेत-प्रबलता $\mu$ और स्थानीय सार्थकता $Z = \sqrt{q_0}$ देता है, केवल-पृष्ठभूमि वाले टॉय प्रयोगों का एक बैच “कहीं और देखो” प्रभाव (look-elsewhere effect) दिखाता है, और मैक्सिकन-हैट विभव $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ मापे गए द्रव्यमान को हिग्स स्व-युग्मन $\lambda = m_H^2/2v^2$ में बदल देता है।'
notes: 'जुलाई 2012 में ATLAS और CMS ने 125 GeV के निकट एक नए बोसॉन की घोषणा की, जो मुख्य रूप से दो चैनलों में देखा गया: दो फ़ोटॉन और चार लेप्टॉन। भौतिकी का 2013 का नोबेल पुरस्कार Englert और Higgs को उस क्रियाविधि के लिए मिला जिसकी इसने पुष्टि की। यहाँ फ़ोटॉन चैनल को वास्तविक डेटा पर दोबारा किया गया है। हिग्स सीधे फ़ोटॉनों में क्षय नहीं हो सकता (वे द्रव्यमानहीन हैं), केवल W बोसॉनों और टॉप क्वार्कों के लूपों के माध्यम से, इसलिए यह सामान्य फ़ोटॉन युग्मों की विशाल चिकनी पृष्ठभूमि के ऊपर एक दुर्लभ क्षय ($\mathcal B \approx 0.23\%$) है। इस फ़ाइल के 10 fb$^{-1}$ से परिणाम है $m_H \approx 124.2 \pm 1.0$ GeV (PDG 2024: $125.20 \pm 0.11$), $\mu \approx 1.0 \pm 0.4$ (मानक मॉडल की दर) और लगभग $2.7\sigma$ की स्थानीय सार्थकता (अपेक्षित लगभग $3.4\sigma$)। यह एक आधिक्य है, खोज नहीं: 2012 की खोजों ने $5\sigma$ पार करने के लिए कई घटना-श्रेणियों, दोनों चैनलों और दोनों प्रयोगों का उपयोग किया था। स्कैन एक उपयोगी चेतावनी भी है: इस छोटे नमूने में 143 GeV के निकट एक पृष्ठभूमि उतार-चढ़ाव लगभग उतना ही बड़ा है ($2.6\sigma$
  स्थानीय) जितना 124 GeV पर वास्तविक हिग्स। यही “कहीं और देखो” प्रभाव है। किसी चौड़ी खिड़की में कहीं न कहीं उभार होना संभावित है, इसलिए टॉय प्रयोग अनुमान लगाते हैं कि अकेली पृष्ठभूमि कितनी बार ऐसा उभार पैदा करती है: केवल-पृष्ठभूमि वाले लगभग 13% स्कैन कहीं न कहीं 125 GeV के आधिक्य को पार कर जाते हैं, और Gross–Vitells अपक्रॉसिंग सूत्र लगभग 0.1 का वैश्विक p-मान देता है। निश्चित द्रव्यमान पर केवल-पृष्ठभूमि वाले टॉय $\tfrac12\delta(0) + \tfrac12\chi^2_1$ (Wilks/Chernoff) का अनुसरण करते हैं, इसीलिए $Z = \sqrt{q_0}$। मैक्सिकन हैट: म्यूऑन के जीवनकाल से प्राप्त $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV के साथ, मापा गया द्रव्यमान $\lambda = m_H^2/2v^2 \approx 0.13$ तय करता है; निर्वात वलय के चारों ओर त्रिज्य कंपन हिग्स बोसॉन है और वलय के अनुदिश सपाट दिशा अनुदैर्ध्य W और Z बन जाती है। डेटा: ATLAS Open Data 13 TeV, 2020 रिलीज़, GamGam नमूने (CERN Open Data Portal रिकॉर्ड 15006, doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS, लाइसेंस CC0; 2016 डेटा अवधियाँ A–D)। चयन ATLAS आउटरीच H → γγ नोटबुक के अनुसार: फ़ोटॉन ट्रिगर,
  $p_T > 40$ और 30 GeV वाले दो tight पृथक फ़ोटॉन, 1.37–1.52 के बाहर $|\eta| < 2.37$। sm_signal स्तंभ संगत ATLAS सिमुलेशन है (125 GeV पर ggF, VBF, WH, ZH, ttH) जिसे 10 fb$^{-1}$ पर भारित किया गया है, जो $N_{SM} \approx 406$ घटनाएँ और चोटी की चौड़ाई देता है। सरलीकरण: एक समावेशी श्रेणी, एक गाउसीय चोटी (वास्तविक चोटी में पूँछें होती हैं, इसीलिए फ़िट की गई लगभग 2.3 GeV की चौड़ाई कोर विभेदन से अधिक है), कोई व्यवस्थित अनिश्चितता नहीं, और एक घातांकी-बहुपद पृष्ठभूमि (मिथ्या-संकेत संवेदनशीलता देखने के लिए घात बदलकर देखें)।'
meanings:
- प्रति 0.5 GeV बिन वास्तविक द्वि-फ़ोटॉन गणनाएँ; m_low, m_high, events स्तंभों वाली कोई भी CSV काम करती है
- पैमाना-बद्ध द्रव्यमान $x \in [0, 1]$ की घातें; पृष्ठभूमि $\exp(X\theta)$ है
- हर बिन पर समाकलित गाउसीय चोटी (erf), चौड़ाई $\sigma$ ATLAS सिमुलेशन पर फ़िट की गई
- हर हिस्टोग्राम की पॉयसों संभाव्यता, autograd के माध्यम से Adam + L-BFGS द्वारा न्यूनतम की गई
- 'दोहराया गया $n$ ⇒ योग: Fisher स्कोरिंग हर टॉय × हर द्रव्यमान को एक साथ फ़िट करती है'
- प्रोफ़ाइल संभाव्यता अनुपात, फ़िट किया गया संकेत ऋणात्मक होने पर 0
- $-\ln L$ की वक्रता से $m_H$ और $\mu$ की त्रुटियाँ
- 'सम्मिश्र तल की तीन किरणों $\phi = r\,e^{i\alpha}$ के अनुदिश विभव: हर कला के लिए वही वक्र, $|\phi| = v/\sqrt2$ पर निर्वातों का एक वलय'
labels:
  m_min: फ़िट खिड़की का आरंभ
  m_max: फ़िट खिड़की का अंत
  degree: घातांक में पृष्ठभूमि बहुपद की घात
  m_start: फ़िट का प्रारंभिक द्रव्यमान
  scan_step: द्रव्यमान स्कैन चरण
  n_toys: केवल-पृष्ठभूमि वाले टॉय प्रयोग
