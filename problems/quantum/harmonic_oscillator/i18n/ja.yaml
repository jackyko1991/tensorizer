source_hash: 213c96e488f8
title: 量子調和振動子
summary: ハミルトニアン $H = -\tfrac12\,d^2/dx^2 + \tfrac12\omega^2x^2$ は格子上で行列となり、torch.linalg.eigh が等間隔のエネルギーのはしご $E_n = \omega(n + \tfrac12)$ を返す。ずらしたガウス関数（コヒーレント状態）を固有状態の和として書き、それぞれに位相 $e^{-iE_n t}$ を与えると、波束はばねにつながれた古典的な質点とまったく同じように往復する。
notes: 単位 $\hbar = m = 1$。格子は壁で $\psi = 0$ となる大きな箱で、壁が影響しないほど十分遠くまでとってある。薄い曲線は最低の定常状態 $\varphi_n(x)$ で、そのエネルギー $E_n$ の高さに描いている。はしごの間隔はちょうど $\omega$ である。初期状態は基底状態のガウス関数を $x_0$ にずらしたものである。その重み $\lvert c_n\rvert^2$ は平均 $\omega x_0^2/2$ のポアソン分布をなし、すべてのエネルギーが $\omega$ の整数倍ずつ異なるので、波束は周期 $2\pi/\omega$ ごとに広がることなく $x_0$ に戻る。$\langle x\rangle$ は古典的な運動 $x_0\cos\omega t$ に従う（2次ポテンシャルではエーレンフェストの定理が厳密に成り立つ）。
meanings:
- 各格子点でのばねのポテンシャル $\tfrac12\omega^2x^2$
- 運動エネルギー $-\tfrac12\,D2$ と対角成分のポテンシャル
- エネルギーと固有ベクトル（第 $n$ 列が状態 $n$）
- 繰り返される $x$ ⇒ 和をとる：初期状態と状態 $n$ の重なり
- 繰り返される $n$ ⇒ 和をとる：位相のついた成分から $\psi$ を再構成
- 位置の期待値、古典的な $x_0\cos\omega t$ と比較
labels:
  omega: 角振動数 $\omega$
  x0: 初期変位 $x_0$
  periods: シミュレーション時間
  n_grid: 格子点数
