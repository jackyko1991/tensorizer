title: 'पॉइंट क्लाउड रजिस्ट्रेशन: PCL पाइपलाइन (FPFH, RANSAC, ICP)'
summary: 'एक ही वस्तु के दो आंशिक 3D स्कैन, दो दृष्टिबिंदुओं से लिए गए और एक अज्ञात दृढ़ गति से खिसकाए गए, उसी तरह संरेखित किए जाते हैं जैसे Point Cloud Library (PCL) करती है, बैच वाले PyTorch में लिखा गया: वॉक्सेल-ग्रिड डाउनसैंपलिंग, सांख्यिकीय आउटलायर हटाना, पड़ोस के सहप्रसरण से नॉर्मल, FPFH डिस्क्रिप्टर, फ़ीचर मिलानों पर RANSAC (एक साथ हज़ारों Kabsch फ़िट) और कई शुरुआतों से ICP सुधार, पॉइंट-टू-पॉइंट और पॉइंट-टू-प्लेन। परिणाम की तुलना ज्ञात गति से की जाती है: घूर्णन त्रुटि (डिग्री), स्थानांतरण त्रुटि और RMSE।'
notes: 'डेमो वस्तु Keenan Crane की गाय "Spot" है (5856 त्रिभुज), जिसे लेखक ने सार्वजनिक डोमेन में दिया है (CC0 1.0; https://www.cs.cmu.edu/~kmcrane/Projects/ModelRepository/, data/spot_vertices.csv और data/spot_faces.csv के रूप में शामिल, data/SOURCES.md देखें; Crane, Pinkall और Schröder 2013, ACM TOG 32(4))। हमने स्टैनफ़र्ड बनी का उपयोग नहीं किया: Stanford 3D Scanning Repository शोध उपयोग और मुफ़्त पुनर्वितरण की अनुमति देती है, पर कहती है कि अनुमति के बिना मॉडल व्यावसायिक उद्देश्यों के लिए उपयोग नहीं किए जाने चाहिए या बिकने वाले उत्पाद में नहीं आने चाहिए, जो ऐसे खुले प्रोजेक्ट के लिए अस्पष्ट है जिसका आगे चलकर सशुल्क संस्करण हो सकता है। PCL की अपनी परीक्षण फ़ाइल bunny.pcd उसी स्टैनफ़र्ड स्कैन से बनी है और उस पर अलग डेटा लाइसेंस नहीं है (PCL का BSD लाइसेंस उसके कोड पर लागू होता है)। स्कैन कृत्रिम हैं: मेश सतह के घने यादृच्छिक नमूने, केवल वहाँ रखे गए जहाँ स्कैनर उन्हें देखता है (बैक-फ़ेस परीक्षण और z-बफ़र, यानी छिपे बिंदु हटाना), गाउसियन शोर $\sigma$, कुछ प्रतिशत समान रूप से बिखरे आउटलायर,
  और स्कैन B पर एक यादृच्छिक दृढ़ गति (30–60°, वस्तु के आकार का आधा)। वस्तु का आकार बाउंडिंग बॉक्स का विकर्ण है, जिसे 1 किया गया है। पाइपलाइन (कोष्ठक में PCL क्लास के नाम): VoxelGrid; StatisticalOutlierRemoval; NormalEstimation $k = 15$ पड़ोसियों के साथ, नॉर्मल को हर स्कैन के अपने दृष्टिबिंदु की ओर पलटा गया; FPFH $k = 25$ के साथ; डिस्क्रिप्टर स्थान में परस्पर निकटतम मिलान; 4000 परिकल्पनाओं वाला RANSAC, हर परिकल्पना 3 मिलानों की जिनके त्रिभुज की भुजाएँ 10 % के भीतर मेल खाती हैं (PCL के CorrespondenceRejectorPoly की तरह), Kabsch से फ़िट और इनलायर की संख्या से अंकित, फिर इनलायरों पर दोबारा फ़िट; RANSAC मुद्रा की 6 विचलित प्रतियों से ICP, आधे वॉक्सेल आकार पर डाउनसैंपल किए गए लक्ष्य के विरुद्ध, एक वॉक्सेल से दूर के जोड़ों को छोड़कर। सरलीकरण: FPFH त्रिज्या के बजाय $k$ पड़ोसियों का निश्चित पड़ोस उपयोग करता है, Darboux फ़्रेम का स्रोत हमेशा पूछे गए बिंदु को लेता है (PCL नॉर्मल के कोणों से जोड़े का क्रम चुनती है), और हर 11-बिन खंड को 100 पर सामान्यीकृत करता है; वॉक्सेल ग्रिड केवल स्थितियों का औसत
  लेता है। डिफ़ॉल्ट रन क्या दिखाता है: प्रति स्कैन लगभग 12000 दिखने वाले बिंदु दोनों फ़िल्टरों के बाद लगभग 1650 रह जाते हैं; 365 परस्पर FPFH मिलानों में से RANSAC 73 (लगभग 20 %) रखता है और 6.4° तथा 0.056 त्रुटि वाली मोटी मुद्रा देता है; फिर पॉइंट-टू-प्लेन ICP हर शुरुआत से लगभग 5 पुनरावृत्तियों में 0.37° और 0.0021 (वस्तु के आकार का 0.2 %, RMSE 0.007) तक पहुँचता है, जबकि पॉइंट-टू-पॉइंट 25 पुनरावृत्तियों के बाद भी सतह के साथ धीरे-धीरे खिसक रहा होता है (लगभग 2.1°, 0.018), क्योंकि आंशिक, पुनः नमूना ली गई सतह पर निकटतम पड़ोसी उसे बगल की ओर खींचते हैं। परीक्षण जाँचते हैं कि Kabsch सटीक है, किसी गति का उसके व्युत्क्रम के साथ संयोजन तत्समक है, समतल और गोले के नॉर्मल सही हैं, वॉक्सेल ग्रिड एक धीमे संदर्भ से मेल खाता है, दूर के आउटलायर हटते हैं, FPFH दृढ़ गति के अंतर्गत अपरिवर्तित रहता है, z-बफ़र दृश्यता गोले का पिछला भाग हटाती है, RANSAC 50 % गलत मिलान झेल लेता है, ICP अभिसरित होता है, चिकनी सतह पर पॉइंट-टू-प्लेन पॉइंट-टू-पॉइंट से तेज़ है, और पूरी पाइपलाइन 2° और वस्तु के आकार के 2 % से नीचे पहुँचती
  है। ये स्थापित विधियाँ हैं: ICP (Besl और McKay 1992; पॉइंट-टू-प्लेन: Chen और Medioni 1992), FPFH (Rusu, Blodow और Beetz 2009), PCL (Rusu और Cousins 2011, BSD लाइसेंस, https://pointclouds.org)। यहाँ का कोड शोधपत्रों से लिखा गया है, PCL से अनुवादित नहीं। बड़ा दृष्टि कोण आज़माएँ (कम ओवरलैप: RANSAC कम इनलायर पाता है और विफल हो सकता है), अधिक आउटलायर, या मोटा वॉक्सेल।'
meanings:
- हर बैच सदस्य $b$ (RANSAC परिकल्पना या ICP शुरुआत) के लिए एक दृढ़ गति, $j$ पर योग
- $k$ निकटतम पड़ोसी, दूरी मैट्रिक्स की पंक्तियों का एक खंड एक बार में
- 'VoxelGrid: एक ही वॉक्सेल कुंजी वाले बिंदुओं का scatter-औसत'
- 'StatisticalOutlierRemoval: पड़ोसियों की औसत दूरी की तुलना पूरे क्लाउड पर उसके माध्य और मानक विचलन से'
- पड़ोस का सहप्रसरण; सबसे छोटे आइगेनमान का आइगेनवेक्टर नॉर्मल है, दृष्टिबिंदु की ओर पलटा गया
- 'सतह परिवर्तन (PCL वक्रता): समतल पर 0'
- 'बिंदु-जोड़े के Darboux फ़्रेम कोण: $\alpha = \mathbf v\cdot\mathbf n_q$, $\phi = \mathbf u\cdot\hat{\mathbf d}$, $\theta = \operatorname{atan2}(\mathbf w\cdot\mathbf n_q, \mathbf u\cdot\mathbf n_q)$'
- 11 बिन के तीन हिस्टोग्राम; बिंदु का अपना हिस्टोग्राम और पड़ोसियों के हिस्टोग्राम का दूरी-भारित औसत
- Kabsch क्रॉस-सहप्रसरण, हर परिकल्पना के लिए एक; एक बैच SVD सारे घूर्णन देता है
- सभी परिकल्पनाओं का RANSAC स्कोर एक साथ
- पॉइंट-टू-प्लेन ICP चरण $\boldsymbol\xi = (\boldsymbol\omega, \delta\mathbf t)$, शुरुआतों पर बैच में
- ज्ञात वास्तविक मान के सापेक्ष घूर्णन त्रुटि
labels:
  n_points: प्रति स्कैन सतह नमूने
  view_angle: दोनों दृष्टिबिंदुओं के बीच का कोण
  noise: सेंसर शोर $\sigma$ (वस्तु का आकार 1)
  outliers: आउटलायर का अंश
  voxel: वॉक्सेल आकार $s$
  hypotheses: RANSAC परिकल्पनाएँ
  icp_iterations: ICP पुनरावृत्तियाँ
  starts: ICP शुरुआतें (बैच)
