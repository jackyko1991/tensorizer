<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Tidal stretching: a ring of particles at distance r from a black hole of mass M is stretched along the radial direction and squeezed across it">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- black hole and its horizon -->
    <circle cx="40" cy="80" r="22" fill="#111827"/>
    <circle cx="40" cy="80" r="30" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="32" y="125" font-style="italic">M</text>
    <!-- distance -->
    <line x1="40" y1="80" x2="170" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="100" y="74" font-style="italic">r</text>
    <!-- ring of test particles -->
    <circle cx="170" cy="80" r="22" fill="#93c5fd" fill-opacity="0.5" stroke="#1e40af" stroke-width="1.5"/>
    <g fill="#2563eb">
      <circle cx="192" cy="80" r="3.5"/><circle cx="148" cy="80" r="3.5"/><circle cx="170" cy="58" r="3.5"/><circle cx="170" cy="102" r="3.5"/>
      <circle cx="185.6" cy="64.4" r="3"/><circle cx="154.4" cy="64.4" r="3"/><circle cx="185.6" cy="95.6" r="3"/><circle cx="154.4" cy="95.6" r="3"/>
    </g>
    <!-- tidal forces: stretch along r, squeeze across -->
    <line x1="198" y1="80" x2="228" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="142" y1="80" x2="120" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="170" y1="28" x2="170" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="170" y1="132" x2="170" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="214" y="70" font-style="italic" fill="#b91c1c">ξ</text>
    <text x="178" y="146" font-style="italic" fill="#b91c1c">T<tspan font-size="10" dy="3">ij</tspan></text>
  </g>
</svg>
