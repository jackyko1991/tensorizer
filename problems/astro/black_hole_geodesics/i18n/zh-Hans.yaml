source_hash: 31a92e6ff86f
title: 广义相对论：黑洞周围的轨道与下落
summary: 施瓦西度规中的测地线：克里斯托费尔符号由 $g_{\mu\nu}(x)$ 经自动微分求得，再用 einsum 缩并。束缚轨道会进动而不闭合；有效势显示最内稳定圆轨道（ISCO）位于 $6GM/c^2$、光子球位于 $3GM/c^2$；径向下落在有限的固有时内到达视界，而远处的时钟却冻结不动。
notes: 单位：$G = c = M = 1$，因此长度以 $GM/c^2$ 为单位（每太阳质量 1.5 km），视界位于 $r_s = 2$。轨道从近心点出发，所用的能量 $E$ 和角动量 $L$ 是半通径 $p$、偏心率 $e$ 的施瓦西轨道的精确值。用 RK4 对固有时 $\tau$ 积分；具有相同 $p$ 和 $e$ 的灰色牛顿椭圆则会闭合。$p$ 较大时，近日点进动趋于 $6\pi GM/(c^2 p)$（水星每世纪 43″），靠近黑洞时则大得多。束缚轨道仅在 $p > 6 + 2e$ 时存在；在 ISCO（$r = 6$）以内圆轨道不稳定，而在 $r = 3$ 处连光都能绕行。在下落图（右下）中，下落的时钟大约在 $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$（有限）后到达视界，但按施瓦西时间 $t$ 看，下落逐渐变慢并冻结于 $r = 2$；模拟在 $r = 2.1$ 处停止，这里该坐标开始失效。
meanings:
- 每条测地线上的事件 $(t, r, \theta, \varphi)$，$G = c = M = 1$
- 四维速度 $dx^\mu/d\tau$
- 施瓦西度规，号差 $(-, +, +, +)$
- 逆度规
- 用 autograd 求度规导数，导数指标在最后
- 重复的 $\sigma$ ⇒ 求和（$z$ = 批次）
- 重复的 $\alpha, \beta$ ⇒ 求和
- 有质量粒子应 $= -1$，用于检验积分
labels:
  p: 半通径 $p$
  e: 偏心率 $e$
  n_orbits: 模拟圈数
  dt: 固有时步长 $\Delta\tau$
  r_infall: 下落起点（静止）
