title: न्यूटन का शीतलन नियम
summary: गर्म कॉफ़ी के कपों की एक पंक्ति कमरे के ताप की ओर ठंडी होती है। हर कप का अपना प्रारंभिक ताप और अपना शीतलन नियतांक है, फिर भी सब एक टेंसर में रहते हैं, इसलिए PyTorch की एक पंक्ति हर कप को एक साथ आगे बढ़ाती है — और परिणाम चरघातांकी हल से मेल खाता है।
notes: 'नियम कहता है कि शीतलन दर कमरे से ताप-अंतर के समानुपाती है। इसलिए अंतर समान समयों में समान गुणक से घटता है: यह हर $t_{1/2} = \ln 2/k$ में आधा हो जाता है, प्रारंभिक ताप चाहे जो हो। ODE को रूंगे–कुट्टा (RK4) से संख्यात्मक रूप से हल किया जाता है और धराशायी रेखाएँ तुलना के लिए सटीक चरघातांकी दिखाती हैं। असली कप संवहन, विकिरण और वाष्पन से एक साथ ठंडे होते हैं; $k$ इन सबको एक संख्या में समेटता है।'
meanings:
- कप $b$ का ताप (°C)
- 'कप $b$ का शीतलन नियतांक (1/min): बड़ा मान अर्थात तेज़ शीतलन'
- कमरे का ताप, हर कप पर broadcast
- 'अवयव-वार: किसी सूचकांक का योग नहीं, हर कप अपने आप ठंडा होता है'
- 'बाह्य गुणनफल: सटीक हल के लिए हर समय हर कप के साथ'
- ताप-अंतर के आधा होने का समय
labels:
  n_cups: कप
  T_env: कमरे का ताप
  k_min: सबसे धीमा शीतलन $k$
  k_max: सबसे तेज़ शीतलन $k$
  t_max: सिमुलेशन समय
