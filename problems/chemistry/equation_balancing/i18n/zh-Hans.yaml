source_hash: 94551bc4044d
title: 配平化学方程式（零空间）
summary: 配平方程式就是寻找使每种元素和电荷都守恒的系数 $\nu_s$。写成矩阵形式即 $M\nu = 0$：系数就是元素–物种矩阵的零空间。一次批量 SVD 同时求解七个反应，从甲烷燃烧到酸性高锰酸钾，并找出配平方式不唯一的那个。
notes: 每种元素给出一个关于未知系数的线性方程，所以 $S$ 个物种和 $E$ 种元素给出一个 $E\times S$ 方程组 $M\nu = 0$。通常 $M$ 的秩为 $S-1$，解构成一条直线：配平后的方程在相差一个公因子的意义下是唯一的。SVD 把这条直线找出来，即奇异值为 0 的右奇异向量（最后一个）；除以其最小分量并尝试乘数 $k = 1, 2, \dots$，就得到最小的整数，例如 $\mathrm{CH_4} + 2\,\mathrm{O_2} \rightarrow \mathrm{CO_2} + 2\,\mathrm{H_2O}$。对于离子，电荷只是多加一行：没有它，$\mathrm{MnO_4^-} + \mathrm{Fe^{2+}} + \mathrm{H^+}$ 会有二维零空间，加上它，熟悉的 $1{:}5{:}8 \rightarrow 1{:}5{:}4$ 氧化还原方程便自然得出。过氧化物示例 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O} + \mathrm{H_2O_2}$ 有两个零奇异值：它隐藏着两个独立的反应（$2\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\mathrm{H_2O}$ 和 $\mathrm{H_2} + \mathrm{O_2} \rightarrow \mathrm{H_2O_2}$），它们的任何正组合也都是配平的。单靠代数无法从中选出一个；实际比例由化学（动力学、反应条件）决定。代码展示了在二维零空间中令某个系数为零所得到的基反应。可以把你自己的反应加入 tensors.py 中的 `REACTIONS` 来试试；解析器能读取括号和电荷，例如 'Ca3(PO4)2' 或 'Fe^3+'。
meanings:
- 反应 $r$ 的物种 $s$ 中元素 $e$ 的原子数；q 行为电荷（来自小型化学式解析器）
- 反应物为 $+1$，产物为 $-1$
- 不对任何指标求和：每一列都带符号
- 所有反应填充到一个张量中；未用的列固定为 $\nu_s = 0$
- 批量 SVD；奇异值按降序排列
- 有多少个奇异值为零：1 → 配平唯一，2 → 两个独立反应
- 最后一个奇异向量，缩放使最小分量为 1，再乘以第一个能给出整数的 $k_r$
- 重复的 $s$ ⇒ 求和：生成的 $e$ 原子数；对每种元素和电荷都为零
labels:
  show: 以矩阵形式显示的反应
  max_scale: 尝试的最大乘数 $k$
