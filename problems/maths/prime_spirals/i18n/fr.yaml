title: Spirales de nombres premiers et conjectures de Hardy–Littlewood
summary: 'Cribler les nombres premiers dans un seul tenseur booléen et les dessiner sur les spirales d''Ulam et de Sacks, où ils s''alignent le long de lignes. Chaque ligne est un polynôme du second degré, comme celui d''Euler $k^2 + k + 41$, et les conjectures de Hardy–Littlewood prédisent combien de nombres premiers elle contient. Le même crible teste ensuite leurs prédictions pour les nombres premiers jumeaux et pour Goldbach, ainsi que le modèle aléatoire de Cramér pour les écarts entre nombres premiers. Ce sont des conjectures : le programme les vérifie numériquement, il ne les démontre pas.'
notes: 'Ulam (1963) a écrit les entiers sur une spirale carrée et remarqué que les nombres premiers s''alignent le long de diagonales ; la spirale de Sacks (1994) place $n$ au rayon $\sqrt n$ et à l''angle $2\pi\sqrt n$, et fait apparaître des courbes à la place. Chaque rayon diagonal de la spirale d''Ulam contient les valeurs d''un polynôme du second degré $4k^2 + bk + c$, et sur la spirale qui commence à 41, la diagonale principale est le polynôme d''Euler $k^2 + k + 41$, premier pour $k = 0, \dots, 39$ (démontré : Rabinowitsch a montré que $k^2 + k + p$ est premier pour tout $k < p - 1$ exactement lorsque $\mathbb Q(\sqrt{1 - 4p})$ a un nombre de classes égal à un, donc $p \in \{2, 3, 5, 11, 17, 41\}$, liste complétée par Heegner et Stark). Certains rayons sont denses et d''autres vides à cause des résidus : $f$ n''a pas de racine modulo de nombreux petits nombres premiers lorsque son discriminant n''est pas un résidu quadratique pour eux. Hardy et Littlewood (1923) en ont tiré la conjecture
  F, que la conjecture de Bateman–Horn (1962) reformule ainsi : $Q_f(K) \sim C(f)\sum_{k \le K} 1/\ln f(k)$. Le panneau en haut à droite la teste sur plusieurs centaines de polynômes du second degré à la fois : quand $K$ augmente, les constantes mesurées se rapprochent des $C(f)$ prédites (la droite diagonale). On ne sait même pas si un seul polynôme du second degré prend une infinité de valeurs premières : c''est le quatrième problème de Landau (1912) pour $n^2 + 1$, toujours ouvert. Pour le polynôme d''Euler, Hardy et Littlewood citent le produit sur les nombres premiers impairs $3.3197732$ ; la constante de Bateman–Horn inclut le facteur 2 venant de $p = 2$ (les valeurs sont toujours impaires), elle vaut donc $6.6395$. La conjecture des nombres premiers jumeaux, avec la constante $C_2 = 0.6601618\ldots$, et la conjecture de Goldbach, avec sa série singulière, reposent sur la même idée pour $p$ et $p + 2$, et pour $p$ et $N - p$. Le crible retrouve les valeurs connues $\pi_2(10^6) = 8169$
  et $\pi_2(10^7) = 58980$, et la comète de Goldbach se resserre sur la prédiction : les bandes de la comète correspondent à la série singulière (en vert : $3 \mid N$). Les deux conjectures sont ouvertes. Goldbach est vérifiée pour tous les nombres pairs jusqu''à $4 \cdot 10^{18}$ (Oliveira e Silva, Herzog et Pardi, 2014) ; Zhang (2014) puis les travaux de Polymath et de Maynard ont démontré qu''il existe une infinité d''écarts entre nombres premiers d''au plus 246, et Chen (1973) que tout nombre pair assez grand est la somme d''un nombre premier et d''un produit d''au plus deux nombres premiers. Le modèle de Cramér (1936) considère chaque $n$ comme premier avec probabilité $1/\ln n$ ; il prédit des écarts exponentiels de moyenne $\ln p$, proches de ce que l''on observe, et des écarts maximaux de taille environ $\ln^2 p$, mais il se trompe sur le nombre de jumeaux exactement d''un facteur $2C_2 \approx 1.32$ (ligne pointillée), car il ignore la divisibilité par 2, 3, 5, … Maier (1985) a
  montré qu''il échoue aussi d''autres façons, et Granville a suggéré des écarts maximaux allant jusqu''à $2e^{-\gamma}\ln^2 p \approx 1.12\ln^2 p$.'
meanings:
- 'crible d''Ératosthène : une tranche à pas fixe par nombre premier $p \le \sqrt{n_\text{max}}$'
- position sur la spirale d'Ulam de tous les nombres à la fois, à partir de leur anneau $k = \lceil(\sqrt m - 1)/2\rceil$ et de leur distance au coin $(2k+1)^2$
- 'spirale de Sacks : les carrés $k^2$ se trouvent sur le demi-axe positif des $x$'
- les valeurs de $F$ polynômes du second degré $4k^2 + bk + c$ (les rayons diagonaux de la spirale d'Ulam) pour chaque $k$
- chercher chaque valeur dans le crible ; la somme cumulée compte les nombres premiers sur chaque rayon
- racines de $f_i$ modulo $p$ par le critère d'Euler $(D/p) \equiv D^{(p-1)/2}$, avec $D = b^2 - 4ac$ ; testées directement pour $p < 50$
- '$p$ répété ⇒ sommé : le produit eulérien comme somme de logarithmes sur les nombres premiers $p < 10^5$'
- '$m$ répété ⇒ sommé : le nombre de décompositions de Goldbach comme autoconvolution, calculée par FFT'
- paires de jumeaux $(p, p+2)$ avec $p \le x$
- écarts normalisés, comparés à la loi $e^{-s}$ du modèle aléatoire de Cramér
labels:
  side: Côté de la spirale
  start: La spirale commence à
  log10_x: Jumeaux et écarts jusqu'à $10^n$
  goldbach_max: Goldbach jusqu'à $N$
  k_poly: Polynômes du second degré jusqu'à $k$
