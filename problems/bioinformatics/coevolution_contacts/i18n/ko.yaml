title: 공진화로 찾는 단백질 접촉(DCA)
summary: 접힌 단백질에서 서로 닿는 잔기는 진화 과정에서 함께 돌연변이한다. 장난감 단백질을 입방 격자 위에 접고, 그 접촉에 결합 $J_{ij}(a,b)$를 심은 뒤, 깁스 샘플링으로 포츠 모형에서 다중 서열 정렬을 샘플링하고, 정렬만으로 접촉을 복원한다. 원-핫 einsum으로 쌍 통계를, 평균장 DCA $J \approx -C^{-1}$(또는 autograd를 이용한 유사가능도)로 직접 결합을 구하고, APC 보정 프로베니우스 점수를 실제 접촉 지도와 비교한다.
notes: 왜 이것이 작동할까? 잔기 $i$의 크기나 전하가 바뀌면, 그것과 닿아 있는 잔기 $j$도 함께 바뀌어야 하는 경우가 많다. 그렇지 않으면 단백질이 잘못 접힌다. 관련된 많은 서열에 걸쳐 이는 정렬의 $i$열과 $j$열 사이의 상관으로 남는다. 그러나 상관은 전이적이다. $i$가 $j$와 닿고 $j$가 $k$와 닿으면, $i$와 $k$는 닿지 않아도 상관된다. 직접 결합 분석(DCA)은 전역 모형인 포츠 모형($q$-상태 이징 모형)을 피팅하는데, 그 결합 $J_{ij}$가 모든 상관을 한꺼번에 설명하므로 간접 상관은 설명되어 사라진다. 평균장 근사에서 결합은 단순히 공분산 행렬의 역행렬에 음수를 붙인 것이다(편상관과 비슷하다). 유사가능도 최대화는 대신 모든 열에 대해 $P(s_i\mid\text{rest})$를 피팅하며, 실제 단백질 계열에서는 보통 더 정확하다. 애니메이션은 정렬을 서열 20개에서 전체까지 늘린다. DCA(위 삼각형)는 깊이가 늘수록 좋아지지만, 단순 공분산(아래 삼각형)은 거짓 양성이 간접 쌍이기 때문에 정체된다. 여기서는 데이터가 실제로 접촉을 아는 포츠 모형에서 나오므로 정밀도가 정직한 점수다. 실제 정렬은 더 어렵다. 몇 개의 문자가 아미노산 20개와 갭을 대신하고, 서열들은 계통으로 연관되어 있으며(실제 DCA는 거의 중복된 서열의 가중치를 낮춘다), 일부 접촉만 신호를 남긴다. 공진화는 오늘날 구조 예측의 뿌리다. plmDCA류의 접촉이 초기 딥러닝 방법의 입력이 되었고, AlphaFold 2는 MSA를 주 입력으로 받아 어텐션으로 그것을 훨씬 풍부하게 활용하는 법을 스스로 학습한다. 이 장난감은 그 입력 뒤의 통계적 아이디어를 보여 줄 뿐, AlphaFold가 작동하는 방식을 보여 주지는 않는다. 더 약한 결합, 더 적은 서열, 또는 더 많은 문자 $q$를 시도해 보자.
meanings:
- $X\times Y\times Z$ 상자를 채우는 구불구불한 사슬. 접촉은 사슬을 따라 3 이상 떨어진 격자 이웃이다
- '"참" 모형: 무작위 장(field)과, $\mathcal C_{ij} = 1$인 곳에만 있는 무작위 $q\times q$ 결합 블록'
- '국소장: 서열 $n$의 다른 모든 열과 문자에 대해 $j, b$를 합한다'
- '체커보드 깁스: 접촉은 서로 다른 색을 잇기 때문에 모든 $N$개 사슬에서 자리의 절반을 한 번에 다시 샘플링한다'
- 원-핫 텐서로 나타낸 정렬
- '$n$에 대해 합: 단일 및 쌍 빈도. $f_{iajb}$를 $b$에 대해 합하면 $f_{ia}$가 된다'
- 균일 빈도의 의사 계수 $\lambda$를 섞은 뒤의 연결 상관
- '평균장 DCA: $L(q-1)$ 크기의 정사각 공분산 행렬을 역변환한다. 마지막 문자는 기준 상태다'
- '유사가능도 대안: $L_2$ 벌점을 두고 Adam으로 $h, J$에 대해 최대화'
- 쌍의 결합 세기, $a, b$에 대해 합, 영합 게이지 $J^z$에서
- '평균 곱 보정(APC): 열별 배경을 제거하여 행과 열의 평균이 0이 되게 한다'
labels:
  fold: 격자 접힘(상자 크기)
  q: 열당 문자 수 $q$
  coupling: 심은 결합 세기 $\sigma_J$
  n_seq: MSA의 서열 수 $N$
  sweeps: 서열당 깁스 스윕 수
  pseudocount: 의사 계수 $\lambda$
  method: '추론: 평균장 DCA 또는 유사가능도'
  plm_iters: 유사가능도 Adam 단계 수
