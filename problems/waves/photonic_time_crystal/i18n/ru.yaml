source_hash: 60f8bd39a854
title: Фотонный временной кристалл и временное отражение
summary: Свет в среде, диэлектрическая проницаемость $\varepsilon(t)$ которой меняется во времени, но не в пространстве. Внезапный скачок $\varepsilon$ расщепляет импульс на прямую и отражённую во времени обратную волну на новой частоте; периодическая модуляция открывает запрещённую зону по импульсу $k$, внутри которой волны растут экспоненциально. Каждая фурье-мода — независимая задача $2\times 2$, поэтому все $k$ решаются одним пакетом, а зоны Флоке получаются одним пакетным вызовом eigvals.
notes: 'Если поменять ролями пространство и время, знакомая оптика выворачивается наизнанку. На обычной границе в пространстве сохраняется частота и меняется волновое число; на временной границе, где вся среда разом переключается с $\varepsilon_1$ на $\varepsilon_2$, сохраняется волновое число $k$, а частота скачет, $\omega_2 = \omega_1 n_1/n_2$. Поскольку никаких зарядов и токов не появляется, непрерывными остаются $D$ и $B$ (а не $E$ и $H$), что даёт временные коэффициенты Френеля $D_f = \tfrac12(1 + n_2/n_1)$ и $D_b = \tfrac12(1 - n_2/n_1)$ (Morgenthaler, 1958): часть импульса разворачивается и бежит назад — временное отражение, — а энергия не сохраняется, потому что переключение среды совершает работу над полем. Временное отражение и широкополосный сдвиг частоты наблюдали на микроволнах в метаматериале на линии передачи, переключаемом во времени (Moussa et al., Nature Physics 2023). Периодическая модуляция $\varepsilon(t) = \varepsilon_0(1 + \alpha\cos\Omega t)$ делает каждую моду параметрическим
  осциллятором, $\ddot D_k + (k^2/\varepsilon)D_k = 0$ (уравнение типа Матьё). Вблизи $k/n_0 = \Omega/2$ прямая и обратная волны резонансно связаны: квазичастота захватывается на $\Omega/2$ и приобретает мнимую часть — запрещённую зону по импульсу (а не по частоте) с краями $k \approx \tfrac{n_0\Omega}{2}(1 \mp \alpha/4)$ и пиковой скоростью роста $\approx \alpha\Omega/8$ в первом порядке по $\alpha$. Вторая, гораздо более узкая щель при $k \approx n_0\Omega$ появляется в порядке $\alpha^2$. В анимации растёт только часть спектра импульса внутри щели. Это идея фотонных временных кристаллов (обзор: Galiffi et al., «Photonics of time-varying media», Advanced Photonics 2022); на оптических частотах необходимые глубину и скорость модуляции очень трудно достичь, поэтому эксперименты пока ведутся в основном на микроволновых и радиочастотах. Упрощения: среда без потерь и дисперсии в 1D, $\mu = 1$, мгновенный скачок и модуляция, навязанная извне (энергия для роста берётся из накачки).'
meanings:
- фурье-амплитуды; среда однородна по $x$, поэтому $k$ сохраняется и каждая мода эволюционирует сама по себе
- один генератор $2\times 2$ на волновое число
- повторяющийся $b$ ⇒ суммирование; та же строка эволюционирует матрицу монодромии $(K, 2, 2)$
- амплитуды прямой/обратной волны $\tfrac12(1 \pm n_2/n_1)$ из непрерывности $D$ и $B$
- пропагатор за один период, из RK4, применённого к единичной матрице
- мультипликаторы Флоке для всех $k$ одним пакетным вызовом; $\det M = 1$, поэтому $\lambda_+\lambda_- = 1$
- 'квазичастота: вещественная в зоне, $\operatorname{Im}\omega > 0$ (рост) в щели по импульсу'
labels:
  eps2: Проницаемость после скачка $\varepsilon_2$
  alpha: Глубина модуляции $\alpha$
  omega: Частота модуляции $\Omega$
  t_max: Моделируемое время
