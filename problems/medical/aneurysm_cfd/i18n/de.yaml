source_hash: 96c00309dd36
title: 'Aneurysma-CFD: der OpenFOAM- + VMTK-Arbeitsablauf, mit Tensoren nachgebaut'
summary: Pulsierende Blutströmung durch ein echtes intrakranielles Aneurysma, segmentiert aus einer offenen (CC0) TOF-MRA-Aufnahme, nach dem üblichen Forschungsablauf (VMTK-Mittellinien und Strömungsverlängerungen, ein inkompressibler Löser nach OpenFOAM-Art, dann Wandschubspannung, TAWSS und OSI), wobei jeder Schritt als Tensoroperation geschrieben ist. Der Löser wird an Poiseuille- und Womersley-Strömung sowie an OpenFOAM-Rechnungen für ein Rohr und für dasselbe Aneurysma-Gitter geprüft, die Mittellinien an VMTK. Nur zu Lehrzwecken, nicht für den klinischen Einsatz.
notes: 'Arbeitsablauf. Eine typische Aneurysmastudie segmentiert das Lumen, bereinigt es mit VMTK (Antiga et al. 2008), löst die Strömung mit OpenFOAM (Weller et al. 1998) und wertet die Wandschubspannung aus. Hier ist jeder Schritt unser eigener, mit Tensoren geschrieben; aus keinem der beiden GPL-Projekte wird Code kopiert. VMTK-Schritte und ihr Ersatz: vmtksurfacesmoothing, vmtksurfaceremeshing und vmtkflowextensions (-adaptivelength 1 -extensionratio 5) liefen einmal offline, um die STL-Dateien zu erzeugen; aus vmtkcenterlines -seedselector profileidlist (Voronoi-Diagramm, Fast Marching auf $|\nabla T| = 1/R$, Rückverfolgung entlang des steilsten Abstiegs) wird solve.centrelines: der Inkugelradius $R$ ist der Wandabstand jedes Voxels, die Eikonalgleichung wird durch wiederholte Min-Plus-Durchläufe über einen 26-Nachbarn-Graphen gelöst (ein tensorfreundlicher Ersatz für Fast Marching, mit Geschwindigkeit $R^2$, weil der Graph das ganze Lumen ist statt des bereits medialen Voronoi-Diagramms),
  und alle Auslässe verfolgen die Vorgänger gleichzeitig zurück. OpenFOAMs icoFoam/pimpleFoam und unser Code: lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh'']; phi → u; fvc::div(phi) → divergence; fvm::laplacian(p) und sein PCG-Löser → pressure_matrix und pcg; die PISO-Druckkorrektur → project (eine Chorin-Projektion pro Schritt); fvm::laplacian(nu, U) → face_laplacian; div(phi,U) → semi-Lagrangesches advect; das Funktionsobjekt wallShearStress → wss_at. Gitter: kubische Voxel des STL mit einem Immersed-Boundary-Geisterwert an der Wand. Geometrie: standardmäßig ein Aneurysma aus der Lausanne TOF-MRA Aneurysm Cohort (Di Noto et al. 2022; OpenNeuro ds003949, CC0), Proband 074: ein 28-mm-Ausschnitt um das markierte Aneurysma, mit Schwellenwert segmentiert, mit Marching Cubes vernetzt, geglättet und verlängert (data/SOURCES.md); ein Einlass und drei Auslässe. Die Wahl „synthetic“ ist unser eigenes Bifurkationsaneurysma (CC0). Weitere geprüfte Datensätze: AneuriskWeb (CC BY-NC)
  und AneuX (CC BY-NC 4.0) sind nichtkommerziell; IntrA und AnXplore nennen keine Lizenz; das Vascular Model Repository hat eine eigene Forschungslizenz; die Kieler Phantom-STLs (CC BY 4.0) sind Wandschalen mit sehr dünnen Ästen. Einstrom: eine analytische ICA-ähnliche Kurve (Mittel 4,58 ml/s, Spitze/Mittel 1,66, Ford et al. 2005, Periode 1 s), nach Murrays Gesetz auf den Einlassradius skaliert, Womersley-Profil; Auslässe bei Druck null. Blut: newtonsch, $\nu = 3.5\times10^{-6}$ m²/s, $\rho = 1060$ kg/m³; starre Wände. Residuen (Standardlauf): Rohr gegen OpenFOAM v1912 pimpleFoam, Achsengeschwindigkeit L2 1,2 %, Phase −10 mrad, WSS L2 2,5 %; Rohr gegen Womersleys exakte Lösung L2 0,4 %; Mittellinien gegen VMTK 1.5.0, mittlerer Abstand 0,20 mm (0,5 Voxel), maximal 0,5 mm, Radiusdifferenz im Mittel 0,12 mm; Aneurysma gegen pimpleFoam auf unserem eigenen, als polyMesh exportierten Voxelgitter (gleicher Einstrom, gleiche Auslässe), |u| auf dem Schnitt L2 35 %, WSS in der Systolenspitze L2 38
  %, TAWSS L2 32 %. Diese letzte Lücke ist groß: ein Lauf mit viermal kleinerem Zeitschritt ergab dasselbe, sie stammt also von der unterschiedlichen Wandbehandlung (unsere Geisterwerte auf einer glatten Fläche gegen OpenFOAMs Treppenstufen-Flächen), der Lage der Auslässe und den Advektionsverfahren auf einem groben Gitter, auf dem keiner der beiden Codes konvergiert ist. Die Aneurysma-Ergebnisse sind daher qualitativ zu lesen. Die Auslässe mit Druck null schicken zudem zu viel Strom in den kleinsten Ast und ergeben einen unrealistischen Druckabfall. Ausgabe: neben dem GIF ist results/aneurysm.pvd eine ParaView-Zeitreihe der Wand (WSS, TAWSS, OSI), der Stromlinien und der Tracer. Vorbehalte: eine grobe Lehrsimulation einer Schwellenwert-Segmentierung, nicht für den klinischen Einsatz. Niedrige WSS und hoher OSI im Sack werden in der Literatur mit Wachstum und Ruptur von Aneurysmen in Verbindung gebracht, die Befunde sind aber widersprüchlich und umstritten (Meng et al. 2014). Die OpenFOAM-
  und VMTK-Referenzen wurden einmal offline erzeugt und werden weder vom Problem noch von seinen Tests ausgeführt.'
meanings:
- Besitzer- und Nachbarzelle jeder Voxelfläche, wie in OpenFOAMs owner/neighbour-Listen
- flächennormale Geschwindigkeit (OpenFOAMs Fluss $\phi_f = u_f h^2$)
- 'zwei index_add-Aufrufe über die Flächen: fvc::div(phi)'
- $-\nabla^2$ aus den Flächen assembliert (fvm::laplacian); Wände und Einlass Neumann, Auslässe $p = 0$
- konjugierte Gradienten, Jacobi plus eine Korrektur auf groben Aggregaten
- sechs Nachbarn derselben Richtung; Geisterwerte setzen $u = 0$ exakt auf die Wand
- 'semi-Lagrangesch: jede Fläche entlang der Strömung zurückverfolgen und interpolieren (grid_sample)'
- Womersley-Profil je Harmonischer von $Q(t)$, Bessel $J_0, J_1$ mit komplexem Argument
- Parabel durch $u = 0$ an der Wand und Abtastwerte bei $h$, $2h$ entlang der Innennormale
- Mittel über den aufgezeichneten Zyklus, tau der Form (T, V, 3)
- Wandabstand = Radius der größten einbeschriebenen Kugel
- RK4-Stromlinien im Batch durch die trilinear interpolierte Geschwindigkeit, am Einlass gestartet
- Min-Plus-Durchlauf (Bellman–Ford) der Eikonalgleichung auf dem 26-Nachbarn-Voxelgraphen
labels:
  geometry: 'Geometrie: real (Lausanner TOF-MRA, CC0) oder synthetisch'
  voxel: Voxelgröße $h$
  cycles: Simulierte Herzzyklen (der letzte wird aufgezeichnet)
  dt_ms: Zeitschritt $\Delta t$
  frames: Animationsbilder pro Zyklus
