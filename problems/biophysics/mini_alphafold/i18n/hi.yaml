title: 'लघु रूप में AlphaFold: दूरी मानचित्र से 3D वलन तक'
summary: एक संरचना पूर्वानुमानक के दो हिस्सों का खिलौना संस्करण, स्वयं AlphaFold नहीं। एक पूर्वानुमानित डिस्टोग्राम (distogram; अंतरालों में बँटी अनिश्चितता के साथ युग्मीय Cα दूरियाँ) को वैकल्पिक रूप से एक स्व-ध्यान (self-attention) ब्लॉक से साफ़ किया जाता है, फिर एक "संरचना मॉड्यूल" ऐसे 3D निर्देशांक $x_{ia}$ खोजता है जो उससे मेल खाएँ, कई प्रारंभ बिंदुओं के बैच से प्रतिबल (stress) पर प्रवणता अवरोहण द्वारा और क्लासिकल MDS द्वारा। परिणाम को Kabsch SVD से लक्ष्य पर अध्यारोपित किया जाता है और RMSD तथा TM-जैसे स्कोर से आँका जाता है।
notes: 'यह केवल भावना में AlphaFold है। वास्तविक AlphaFold 2 अमीनो-अम्ल अनुक्रम और संबंधित प्रोटीनों का बहु-अनुक्रम संरेखण (MSA) पढ़ता है, जिसकी सह-विकसित स्थितियाँ संकेत देती हैं कि कौन से अवशेष एक-दूसरे को छूते हैं; इसका Evoformer (MSA पर और अवशेष युग्मों पर ध्यान के 48 ब्लॉक, त्रिभुज अद्यतनों के साथ) युग्म चित्र बनाता है; और इसका संरचना मॉड्यूल प्रति अवशेष एक पूर्ण बैकबोन फ़्रेम (invariant point attention) और पार्श्व श्रृंखलाएँ रखता है, जिन्हें कई पुनर्चक्रणों (recycles) में परिष्कृत किया जाता है। इसे Protein Data Bank की ~170,000 संरचनाओं पर प्रशिक्षित किया गया था और यह एक विश्वसनीयता (pLDDT) देता है। यहाँ "नेटवर्क" नकली है: डिस्टोग्राम सही दूरियाँ और दूरी के साथ बढ़ने वाला रव ($\sigma_{ij} \propto d_{ij}$) है, और अंतिम अंतराल से आगे के युग्मों के बारे में केवल इतना ज्ञात है कि वे दूर हैं। ध्यान ब्लॉक इसी एक मानचित्र पर कुछ सौ चरणों तक प्रशिक्षित होता है, इसलिए यह पूर्वानुमान करने के बजाय याद करता है; यह दिखाता है कि अवशेष युग्मों पर ध्यान कैसा दिखता है, और क्योंकि इसका आउटपुट हर अवशेष
  को 6-आयामी समष्टि के एक बिंदु पर रखता है, यह स्वतंत्र रव को फिट नहीं कर सकता, इसलिए उसे चिकना करता है। संरचना मॉड्यूल ईमानदार दूरी ज्यामिति है। दूरियाँ किसी संरचना को उसके दर्पण प्रतिबिंब से अलग नहीं कर सकतीं: MDS और प्रवणता अवरोहण किसी भी प्रतिबिंब-समावयवी (enantiomer) को लौटाते हैं, इसलिए सही हस्तता Cα छद्म-द्वितल कोणों के चिह्न से चुनी जाती है (L-अमीनो अम्लों के दक्षिणावर्ती α-हेलिक्स में लगभग $+50^\circ$) और दोनों RMSD छापे जाते हैं। कई यादृच्छिक प्रारंभ एक साथ वलित किए जाते हैं क्योंकि कुछ हर हस्तता के एक-एक हेलिक्स के साथ फँस जाते हैं; न्यूनतम प्रतिबल वाला जीतता है। रव तब तक बढ़ाएँ जब तक वलन टूट न जाए, या परिष्करण बंद करके देखें।'
meanings:
- अवशेष $i$ की Cα स्थिति, अक्ष $a$; लक्ष्य हेलिक्स ज्यामिति से बनी एक कृत्रिम हेलिक्स–मोड़–हेलिक्स संरचना है
- प्रायिकता कि अवशेष $i, j$ दूरी अंतराल $k$ में हैं (64 अंतराल, 2–22 Å); प्रशिक्षित नेटवर्क का स्थान लेता है
- अपेक्षित दूरी, $k$ पर योग; व्युत्क्रम प्रसरण विश्वसनीयता भार $w_{ij}$ देता है
- 'ध्यान लॉजिट: अवशेष $i$ पूछता है, अवशेष $j$ उत्तर देता है; $e$ पर योग'
- हर अवशेष दूसरों का भारित मिश्रण एकत्र करता है, $j$ पर योग; $b_{ij}$ $\hat d_{ij}$ से एक युग्म पूर्वाग्रह है
- $B$ प्रारंभों के बैच के लिए मॉडल दूरियाँ, $a$ पर योग
- भारित असंगति, "दूर" युग्म केवल अलग धकेले जाते हैं, आबंध 3.8 Å पर रखे जाते हैं; autograd के माध्यम से Adam से न्यूनतम किया जाता है
- द्वि-केंद्रित वर्ग दूरियाँ = ग्राम आव्यूह $x_{ia}x_{ja}$; इसके शीर्ष 3 आइगेनसदिश प्रारंभिक अनुमान देते हैं
- दो केंद्रित संरचनाओं का सहप्रसरण, $i$ पर योग; इसका SVD सर्वोत्तम उचित घूर्णन देता है
- अध्यारोपण के बाद त्रुटि; TM-जैसा स्कोर $\frac1N\sum_i 1/(1+(d_i/d_0)^2)$, 1 = समान
labels:
  helix_length: प्रति हेलिक्स अवशेष
  noise: डिस्टोग्राम रव (10 Å पर σ)
  refine: ध्यान परिष्करण
  starts: यादृच्छिक प्रारंभ $B$
  steps: प्रवणता चरण
