source_hash: 15137dcd8bb9
title: 聚合動力學與分子量分布
summary: 為什麼逐步聚合的聚合物（聚酯、尼龍）分散度如此大，而活性聚合卻能產生近乎均一的鏈？對鏈長的族群平衡，以單一 $(S, L)$ 張量涵蓋兩種機制，重現了 Carothers 的 $X_n = 1/(1-p)$ 與 Flory 的最可能分布 $w(x) = x(1-p)^2p^{x-1}$（分散度 $Đ \to 2$），並與 100 000 個單體的動力學蒙地卡羅模擬比對，同時給出活性鏈的 Poisson 分布，$Đ \approx 1 + 1/X_n$。
notes: 逐步聚合：每個分子都帶有反應性端基（這裡是一個 A 與一個 B，如羥基酸），而任意兩條鏈都能連接，單體與單體、二聚體與 50 聚體皆可。Flory 的等反應性假設（速率與鏈長無關）把族群平衡化為具常數核的 Smoluchowski 凝聚方程式，其精確解就是最可能分布：端基中有比例 $p$ 已反應，因此長度 $x$ 的鏈是 $x - 1$ 個已反應鍵接上一個未反應端的序列，機率為 $(1-p)p^{x-1}$。其平均值為 Carothers 的 $X_n = 1/(1-p)$ 與 $X_w = (1+p)/(1-p)$，故 $Đ = 1 + p \to 2$。實際的教訓很嚴苛：98 % 的轉化率只給出 $X_n = 50$，長鏈需要 $p > 0.99$ 以及反應基團完美的 1:1 比例。活性鏈增長（陰離子聚合，或近似它的 ATRP、RAFT 等可控自由基方法）恰好相反：所有鏈同時起始，每次增加一個單體且不終止，因此每條鏈加成 $\nu$ 次後，長度呈 Poisson 分布，$Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ 逐漸趨近 1。張量形式把兩種機制放在同一個 $(S, L)$ 張量中，以 RK4 推進。逐步聚合的摺積 $\sum_y P_y P_{x-y}$ 是與一個從 $P$ 收集而來的 Toeplitz 矩陣做 einsum（FFT 能以 $O(L\log L)$ 達到相同效果）。由於兩列使用的時鐘滿足 $X_n = 1 + s$，每一幀都在相同 $X_n$ 下比較兩種機制，橫軸為 $x / X_n$，Flory 形狀在此固定不變，而 Poisson 峰則變窄。動力學蒙地卡羅隨機連接成對的鏈；它與族群平衡在取樣雜訊內一致，雜訊在接近尾聲時增大，因為只剩 $N_0(1-p)$ 條鏈（$p = 0.98$ 時為 2000 條）。簡化：無成環、無副反應、A–B 化學計量完美平衡、鏈長截斷於 $L$（省略的尾部低於 $10^{-6}$），活性聚合則為瞬間起始且無終止或轉移。具終止反應的傳統自由基聚合介於兩者之間（$Đ \approx 1.5$–2）。
meanings:
- 機制 $s$ 中長度為 $x$（$x = 1 … L$）的鏈：0 = 逐步聚合（每單體），1 = 活性聚合（每起始劑）
- 兩列共用一個時鐘：逐步聚合為 $\tau = kN_0t$，活性聚合為 $\nu = \int k_p[M]\,dt$
- 從族群收集而來的 Toeplitz 矩陣；$x - y < 1$ 處為零
- 重複的 $y$ ⇒ 求和：把 $y$ 聚體與 $(x-y)$ 聚體連接的所有方式
- 一條鏈可經由其兩端中的任一端與 $N$ 條鏈中的任一條反應
- 活性鏈只加成單體，一次一個單元，且永不終止
- 對 $x$ 求和：$k = 0, 1, 2$ 階矩給出 $X_n = \mu_1/\mu_0$、$X_w = \mu_2/\mu_1$
- 逐步聚合的精確解：轉化率 $p = \tau/(1+\tau)$ 時每個初始單體對應的鏈數
- 活性聚合的精確解，以 lgamma 計算階乘
- 每次隨機連接兩條鏈的一個鍵：獨立的隨機檢驗
labels:
  p_max: 最終轉化率 $p$（逐步聚合）
  n_monomers: 蒙地卡羅中的單體數 $N_0$
