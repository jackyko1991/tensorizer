source_hash: 9231afd9bb4a
title: क्रमचय टेंसरों से एनिग्मा को तोड़ना
summary: 'भौतिकी नहीं, बस मज़े के लिए: 3-रोटर Enigma I का हर कुंजी-दबाव आठ $26\times26$ क्रमचय आव्यूहों का गुणनफल है, जहाँ हर रोटर अपनी स्थिति के लिए एक चक्रीय विस्थापन से संयुग्मित होता है। एक अंग्रेज़ी संदेश को गुप्त रोटर क्रम और प्रारंभिक स्थिति से कूटबद्ध करें, फिर हर रोटर क्रम के लिए सभी $26^3 = 17\,576$ प्रारंभिक स्थितियों से एक बैच टेंसर के रूप में एक साथ विकूटन करके उसे तोड़ें, और वह पाठ रखें जिसके अक्षर आँकड़े अंग्रेज़ी से सबसे अधिक मिलते हैं।'
notes: 'परावर्तक $U$ बिना स्थिर बिंदुओं वाला एक सममित क्रमचय है, इसलिए $Q = R_3R_2R_1S$ के साथ $E = Q^{-1}UQ$ भी वैसा ही है: $E^2 = I$ (वही सेटिंग विकूटन करती है) और $E_{ii} = 0$ (कोई अक्षर कभी स्वयं में कूटबद्ध नहीं होता, एक कमज़ोरी जिसका कूट-भंजकों ने उपयोग किया)। हर कुंजी-दबाव से पहले दायाँ रोटर एक कदम चलता है; जब वह अपने खाँचे (notch) पर होता है तो बीच वाले रोटर को भी धकेलता है, और जब बीच वाला रोटर अपने खाँचे पर होता है तो वह बाएँ रोटर के साथ कदम चलता है (दोहरा-कदम विसंगति)। परीक्षण सदिश: रोटर I-II-III, परावर्तक B, रिंग AAA, प्रारंभ AAA, AAAAA को BDZGO में बदलता है। इतिहास: मैरियन रेजेव्स्की ने 1932 में क्रमचय समूह सिद्धांत से एनिग्मा को तोड़ा, और ट्यूरिंग और वेल्चमैन की बॉम्ब (1940) ने आँकड़ों से नहीं बल्कि क्रिब्स, यानी मौसम रिपोर्ट जैसे अनुमानित सादे पाठ, का उपयोग करके रोटर क्रम और स्थितियाँ खोजीं। यहाँ का विशुद्ध सांख्यिकीय आक्रमण, विकूटनों को संयोग सूचकांक (index of coincidence) से क्रमबद्ध करना, वही है जिसे जेम्स गिलोगली ने 1995 में (Cryptologia) प्रकाशित किया था, जिसने बाद के
  चरणों में रिंग सेटिंग्स और प्लग भी पुनः प्राप्त किए। सरलीकरण: रिंग सेटिंग्स AAA हैं और आक्रमणकारी को ज्ञात हैं, और प्लगबोर्ड खाली है, इसलिए कुंजी समष्टि केवल $60 \times 26^3 \approx 10^6$ सेटिंग्स है और सही वाली स्पष्ट रूप से अलग दिखती है। 10 केबलों वाला वास्तविक युद्धकालीन प्लगबोर्ड लगभग $1.5 \times 10^{14}$ विकल्प जोड़ता है, रोटरों के दोनों ओर 26 में से 20 अक्षरों की अदला-बदली करता है, और अक्षर आँकड़ों को इतना उलझा देता है कि सही रोटर सेटिंग गलत वालों से बमुश्किल आगे रहती है; तब गिलोगली के आक्रमण को प्लगों पर हिल-क्लाइंब खोज की आवश्यकता होती है, और छोटे संदेशों पर यह विफल हो जाता है। कम अक्षर (लगभग 60 से 100) या दूसरा स्कोर आज़माकर देखें कि आँकड़े कब विश्वसनीय नहीं रहते; केवल रोटर I–III खोजने से IV या V का उपयोग करने वाली कुंजी नहीं मिल सकती।'
meanings:
- एक अक्षर एक one-hot सदिश $e_x$ या केवल उसका सूचकांक $x \in \{0, \dots, 25\}$ है (A = 0)
- 'रोटर I–V की ऐतिहासिक वायरिंग: $W_{ab} = 1$ जब संपर्क $b$ संपर्क $a$ से जुड़ा हो'
- चक्रीय विस्थापन $x \to x + o$; $o_k$ = कुंजी-दबाव $t$ पर रोटर $k$ का खिड़की अक्षर − रिंग सेटिंग
- 'दोहराए गए $a, b$ ⇒ योग: घुमाया गया रोटर; सूचकांकों के रूप में $x \to (w[(x + o) \bmod 26] - o) \bmod 26$'
- 'एक कुंजी-दबाव: प्लगबोर्ड $S$, दाएँ $R^{(1)}$ से बाएँ $R^{(3)}$ तक रोटर, परावर्तक $U$ और वापस; $(R^{-1})_{ab} = R_{ba}$'
- सभी 26 ऑफ़सेट पर रोटर एक लुक-अप तालिका के रूप में, ताकि $R\,e_x$ लाखों अक्षरों के लिए एक साथ F[o, x] बन जाए
- हर प्रारंभिक स्थिति $b$ से विकूटित कूटपाठ ($B = 26^3$); विकूटन = कूटन क्योंकि $E^2 = I$
- उम्मीदवार $b$ में अक्षर $k$ कितनी बार आता है
- 'दोहराया गया $k$ ⇒ योग: दो अक्षरों के मेल खाने की संभावना, अंग्रेज़ी के लिए लगभग 0.066 और यादृच्छिक पाठ के लिए $1/26 \approx 0.038$'
- 'वैकल्पिक स्कोर: औसत अंग्रेज़ी यूनिग्राम लॉग-संभाविता $c_{bk}\log p_k / N$'
