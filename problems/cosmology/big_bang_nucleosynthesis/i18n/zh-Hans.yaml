source_hash: fcafdb67dc0d
title: 大爆炸核合成
summary: 把最初三分钟写成一个刚性反应网络：中子与质子脱离弱相互作用平衡而冻结，氘瓶颈在 $T \approx 80$ keV 附近打开，几乎所有中子最后都进入 $^4$He。十二个反应连接 n、p、d、t、$^3$He、$^4$He、$^7$Li 与 $^7$Be；一整批重子光子比 $\eta$ 用隐式 BDF2 方法一次积分，得到 Schramm 图。在 Planck 值 $\eta \approx 6.1\times10^{-10}$ 时，氦与氘符合观测，而锂却高出约 3 倍：宇宙学锂问题，至今未解。
notes: 现状：标准大爆炸核合成是已确立的物理。它对 $^4$He 与 D 的预测，在由宇宙微波背景独立测得的重子密度下与观测相符，是热大爆炸模型的支柱之一（Alpher、Bethe 与 Gamow 1948；Wagoner、Fowler 与 Hoyle 1967）。宇宙学锂问题仍未解决：预测的 $^7$Li/H 约为老年晕族恒星 Spite 平台的 3 倍（$(1.6\pm0.3)\times10^{-10}$），核物理、恒星损耗或新粒子都尚未能解释。观测值（引用的常数）：$Y_p = 0.245\pm0.003$（PDG 的 BBN 综述），D/H $= (2.527\pm0.030)\times10^{-5}$（Cooke、Pettini 与 Steidel 2018）。模型：Smith、Kawano 与 Malaney（1993）的 12 个反应，热核反应率取自 JINA REACLIB 数据库（Cyburt 等 2010；数据组 an06、de04、gi17、go17、cd08、db18），逆反应率由细致平衡求得。明示的近似：弱反应率用 Born 近似（不含辐射、有限质量与有限温度修正），中微子瞬间退耦（$N_\mathrm{eff} = N_\nu$ 而非 3.044），$^7$Be 计为 $^7$Li、t 计为 $^3$He（之后会衰变），T9 拟合在 $T_9 = 10$ 以上保持不变。因此 $Y_p$ 比 PRIMAT 或 PArthENoPE 等精密程序（$0.2470$）低约 2%；D/H 相差仅几个百分点。试试 $N_\nu = 4$：膨胀较快，冻结更多中子，使 $Y_p$ 增加约 0.013，BBN 就是这样计算中微子种类数的。
meanings:
- 反应 $r$ 消耗与产生多少个核素 $i$（12 个反应、8 种核）
- 净变化；对每个 $r$ 都有 $\sum_i A_i S_{ri} = 0$（重子数）
- REACLIB 拟合：重复的 $k$（$T_9$ 的 7 个基函数）⇒ 求和，再把同一反应的各数据组相加
- 每个 $\eta_b$ 的正向（$\propto n_b \propto \eta$）与逆向（细致平衡）反应率
- $\prod_j Y_j^{R_{rj}}$，例如 d + d 为 $Y_d^2$
- 重复的 $r$ ⇒ 对所有反应求和
- 牛顿法用的精确雅可比矩阵
- 整批 $\eta$ 的隐式 BDF2 步骤的一次牛顿更新
- Born 近似的弱反应率，以中子寿命 $\tau_n$ 归一化
labels:
  n_eta: 批次中 $\eta$ 值的数量
  eta10: 标示的 $\eta \times 10^{10}$（左图）
  tau_n: 中子寿命 $\tau_n$
  n_nu: 中微子种类 $N_\nu$
  n_steps: 以 $\ln T$ 计的 BDF2 步数
