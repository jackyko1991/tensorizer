source_hash: 66c98bbdd023
title: Закон охлаждения Ньютона
summary: Ряд чашек горячего кофе остывает до комнатной температуры. У каждой чашки своя начальная температура и своя постоянная охлаждения, но все они хранятся в одном тензоре, так что одна строка PyTorch продвигает все чашки сразу — и результат совпадает с экспоненциальным решением.
notes: 'Закон утверждает, что скорость остывания пропорциональна разности температур с комнатой. Поэтому разность уменьшается в одно и то же число раз за равные промежутки времени: она уменьшается вдвое каждые $t_{1/2} = \ln 2/k$, какой бы ни была начальная температура. ОДУ решается численно методом Рунге–Кутты (RK4), а штриховые линии показывают точную экспоненту для сравнения. Реальные чашки остывают одновременно за счёт конвекции, излучения и испарения; $k$ объединяет их все в одно число.'
meanings:
- температура чашки $b$ (°C)
- 'постоянная охлаждения чашки $b$ (1/мин): чем больше, тем быстрее остывание'
- комнатная температура, broadcast на все чашки
- 'поэлементно: суммирования нет, каждая чашка остывает сама по себе'
- 'внешнее произведение: каждое время с каждой чашкой, для точного решения'
- время, за которое разность температур уменьшается вдвое
labels:
  n_cups: Чашки
  T_env: Комнатная температура
  k_min: Самое медленное охлаждение $k$
  k_max: Самое быстрое охлаждение $k$
  t_max: Время моделирования
