source_hash: e3a181f70abb
title: 페이저의 합으로 보는 회절 격자
summary: $N$개 슬릿의 원거리장은 슬릿마다 하나씩, 각각 추가 경로 $d\sin\theta$만큼 지연된 $N$개 복소 페이저의 합입니다. 복소 텐서를 쓰면 무늬 전체가 einsum 하나입니다. $N$이 2에서 20으로 커지면 주 극대는 제자리에 있지만 더 날카로워지고, 그 사이에 희미한 부 극대 $N-2$개가 나타납니다.
notes: 오른쪽 패널은 한 각도에서 $N$개의 페이저를 머리와 꼬리를 이어 그립니다. 주 극대($d\sin\theta = m\lambda$)에서는 모두 같은 방향을 향해 길이 $N$으로 더해집니다. 극대에서 벗어나면 사슬이 말려 들어가다가 $N\phi = 2\pi$일 때 다각형으로 닫힙니다. 이것이 첫 번째 영점이며, 그 각도는 $1/N$처럼 줄어듭니다. 세기는 중앙 봉우리에서 1이 되도록 정규화했고, 점선은 $d\sin\theta = m\lambda$를 표시합니다. 슬릿 너비 $a$에는 단일 슬릿 포락선만 의존합니다.
meanings:
- 슬릿 번호; 슬릿 $n$은 슬릿 0에서 $nd$만큼 떨어져 있음
- 관측 방향, 촘촘한 격자에서 표본화
- 각도 $t$에서 본 슬릿 $n$의 위상 인자
- '반복된 $n$ ⇒ 합: 모든 슬릿의 파동을 더함'
- 단일 슬릿 회절 포락선 $\operatorname{sinc}^2(a\sin\theta/\lambda)$
- 세기 = 복소 진폭 크기의 제곱
- 같은 합을 손으로 계산(등비급수), $\phi = kd\sin\theta$
labels:
  wavelength: 파장 $\lambda$
  d: 슬릿 간격 $d$
  a: 슬릿 너비 $a$
  n_max: 최대 슬릿 수 $N$
