title: Кинетическая теория идеального газа
summary: Сотни твёрдых дисков носятся по ящику. Все диски стартуют с одинаковой скоростью, но упругие столкновения перемешивают энергию, пока скорости не подчинятся распределению Максвелла–Больцмана, а импульс, передаваемый дисками стенкам, воспроизводит уравнение состояния идеального газа $PA = NkT$.
notes: 'Приведённые единицы: сторона ящика 1, масса 1, постоянная Больцмана 1. Парные тензоры имеют размер $N\times N$, что приемлемо для нескольких сотен дисков (реальные коды используют списки ячеек). Диск, касающийся двух других на одном шаге, ждёт один шаг, так что каждое столкновение — чистый двухчастичный обмен, и энергия сохраняется с точностью до округления. Давление — импульс $2m\lvert v_\perp\rvert$, передаваемый при каждом отскоке, просуммированный за всё время и делённый на время × длину стенки. Оно получается на несколько процентов выше $NkT/A$, потому что сами диски занимают площадь — первая поправка к идеальному газу, примерно $(1 + \eta^2/8)/(1 - \eta)^2$ для доли площади $\eta$.'
meanings:
- положение диска $a$, компонента $i \in \{x, y\}$
- скорость диска $a$
- все попарные смещения сразу, через broadcasting
- 'повторяющийся $i$ ⇒ суммирование: квадрат расстояния для каждой пары'
- относительная скорость, спроецированная на нормаль столкновения, для $P$ сталкивающихся пар
- полная кинетическая энергия, равная $NkT$ в 2D
- двумерное распределение скоростей $(mv/kT)\exp(-mv^2/2kT)$
labels:
  n_particles: Частицы
  radius: Радиус диска
  speed: Начальная скорость
  t_max: Время моделирования
