source_hash: 16ad9ff3967d
title: Случайное блуждание и диффузия
summary: Тысячи броуновских частиц получают случайные толчки. Блуждание, хранящееся как один тензор (время, частица, 2), — это один cumsum, а среднеквадратичное смещение $\langle x_i x_i\rangle$ — один einsum — растёт линейно со временем как $2dDt$, тогда как облако частиц расплывается по гауссиане.
notes: Каждый шаг — гауссов толчок с дисперсией $2D\Delta t$ по каждой компоненте, поэтому через время $t$ дисперсия каждой координаты равна $2Dt$, а средний квадрат расстояния от старта равен $2dDt$ в $d$ измерениях (здесь $d = 2$). Суммирование по индексу частицы $n$ превращает случайное облако в гладкий предсказуемый закон — это и есть диффузия. Из-за конечного числа частиц измеренное СКС колеблется примерно на $\sqrt{2/N}$ относительных; зерно фиксировано, так что картина воспроизводима. Единицы произвольные (скажем, мкм и с).
meanings:
- независимый стандартный нормальный толчок для шага $s$, частицы $n$, компоненты $i$
- 'положение частицы $n$ в момент $t$: накопленная сумма её толчков'
- 'повторяющиеся $n$ и $i$ ⇒ суммирование: среднеквадратичное смещение в каждый момент'
- наклон СКС от $t$ по методу наименьших квадратов через начало координат, делённый на $2d$
- решение уравнения диффузии $\partial_t\rho = D\,\partial_i\partial_i\rho$ от точечного источника
labels:
  n_walkers: Частицы
  D: Коэффициент диффузии $D$
  t_max: Время моделирования
  n_steps: Шаги по времени
