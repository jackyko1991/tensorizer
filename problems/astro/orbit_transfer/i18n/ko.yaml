source_hash: c0b25ec18fe5
title: 호만 전이와 쌍타원 궤도 전이
summary: 우주선을 한 원궤도에서 다른 원궤도로 옮기려면 $\Delta v$가 얼마나 필요할까? 활력 방정식(vis-viva) $v^2 = \mu(2/r - 1/a)$로 두 번 분사하는 호만 전이와 세 번 분사하는 쌍타원 전이의 비용을 계산하고, 원지점·근지점에서 순간 분사를 넣은 배치 RK4 적분 한 번으로 각 우주선이 실제로 목표 궤도에 도달하는지 확인한다.
notes: 호만 전이는 두 원에 모두 접하는 타원 $a = (r_1 + r_2)/2$의 절반을 비행한다. 근지점에서 진행 방향으로 $\Delta v_1$을 분사하고, $t_H = \pi\sqrt{a^3/\mu}$ 뒤 원지점에서 두 번째 분사 $\Delta v_2$로 원궤도화한다. 쌍타원 전이는 먼저 먼 반지름 $r_b$까지 올라가는데, 그곳에서는 우주선이 느려서 작은 분사만으로 궤도 반대편을 $r_2$까지 올릴 수 있고, 도착하면 감속한다. 시간은 훨씬 오래 걸리지만 $r_2/r_1 \gtrsim 11.94$이면 충분히 먼 $r_b$에서 더 저렴해지고(극한 $r_b \to \infty$의 비용은 $(\sqrt2 - 1)(v_{c1} + v_{c2})$), $r_2/r_1 \approx 15.58$ 이상에서는 모든 $r_b > r_2$가 더 저렴하다. 두 교차점은 이분법으로 수치적으로 구하며, 두 번째 교차점에는 autograd 도함수를 쓴다. 기본값은 저궤도(고도 약 320 km)에서 정지궤도로의 전이로, 호만 전이로 약 3.9 km/s, 5.3 h가 든다. 중심 천체를 태양으로, $r_1 = 1$ AU, $r_2 = 1.524$ AU로 고르면 지구 → 화성이 되어 태양 중심 기준 총 약 5.6 km/s, 약 259일이 걸린다(이 경우는 실행 때마다 항상 출력된다). 실제 임무는 지구 중력 우물에서도 벗어나야 하고 알맞은 행성 배치를 기다려야 한다. 여기서 궤도는 원형이고 같은 평면에 있으며 분사는 순간적이다. 각 분사가 정확히 원·근지점에서 일어나도록 RK4 적분을 분사마다 나눈다.
meanings:
- 중심 천체의 중심에 대한 우주선 $b$의 위치(km)
- 우주선 $b$의 속도(km/s)
- '반복된 $j$ ⇒ 합: 거리의 제곱 $r_b^2$'
- 중심을 향하는 역제곱 인력, $\mu = GM$
- 긴반지름 $a$인 궤도의 반지름 $r$에서의 속력. 모든 $\Delta v$는 이 값 두 개의 차이다
- 우주선 $b$의 분사 $k$의 시각과 부호 있는 크기($\Delta v < 0$이면 감속)
- 두 RK4 구간 사이에 속도 방향으로 가하는 순간 분사
- 분사 사이에는 보존되며, 분사할 때마다 다음 궤도의 $-\mu/2a$로 뛴다
- $r_b = r_2$에서의 기울기. $r_2/r_1 \approx 15.58$ 이상에서 음수가 된다
labels:
  body: 중심 천체
  r1: 출발 반지름 $r_1$
  r2: 목표 반지름 $r_2$
  transfer: 전이 방식
  rb_ratio: 쌍타원 중간 반지름 $r_b / r_2$
