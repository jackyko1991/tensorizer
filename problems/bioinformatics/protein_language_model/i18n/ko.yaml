source_hash: 2038e43e9d92
title: 작은 단백질 언어 모형이 접촉을 학습한다
summary: einsum 어텐션 $A_{nhij} = \mathrm{softmax}_j(Q_{nhik}K_{nhjk}/\sqrt{d_k})$을 쓰는 2층 트랜스포머를, 격자 접힘 위에 결합을 심은 포츠 모형의 서열에서 마스킹된 글자를 채우는 것만으로 학습시킨다. 아무도 구조를 알려 주지 않지만, 대칭화하고 APC 보정한 어텐션 지도는 심어 둔 접촉을 가리킨다. 이것이 단백질 언어 모형의 접촉 헤드 뒤에 있는 아이디어다.
notes: 어텐션은 왜 접촉을 찾을까? 포츠 모형에서 자리 $i$의 글자는 다른 모든 글자가 주어지면 그것과 결합된 자리(마르코프 담요)에만 의존한다. 따라서 마스킹된 글자를 추측하는 가장 좋은 방법은 접촉 상대를 보는 것이고, 어텐션은 바로 그것을 배운다. Rao et al., "Transformer protein language models are unsupervised structure learners"(ICLR 2021)는 수백만 개의 자연 서열로 학습한 대형 단백질 언어 모형의 어텐션 지도가 접촉을 담고 있음을 보였으며, 소수의 단백질로 피팅한 로지스틱 회귀로 APC 보정·대칭화된 지도에서 접촉을 읽어 냈다. 이후 ESM-2(2022–2023) 같은 모형은 그런 표현에서 3D 구조까지 예측했다. 여기서 판독은 완전히 비지도이고(헤드에 대한 단순 평균), 단백질 계열은 합성이며, 테스트 손실은 문맥 없는 두 기준선, 즉 유니그램(하나의 글자 분포)과 자리별 프로필과 비교한다. 프로필을 이긴다는 것은 모형이 문맥, 즉 결합을 사용한다는 뜻이다. 구불구불한 접힘은 β-시트의 가닥처럼 접촉을 반대각선 위에 놓는다. 무작위 쌍은 약 5 %만 맞을 것이다. APC는 모두가 주목하는 위치의 배경을 제거한다. 더 약한 결합, 더 적은 서열, 또는 헤드 하나를 시도해 보자.
meanings:
- 격자 접힘에서 닿는 잔기 사이에만 있는 무작위 결합 블록. 깁스 샘플링이 이를 서열 계열로 바꾼다
- 글자 $s_{ni}$의 토큰 임베딩과 위치 임베딩의 합(마스킹된 글자는 [MASK] 토큰을 쓴다)
- '반복된 $c$ ⇒ 합: 모든 헤드의 쿼리(키와 값도 마찬가지)'
- 반복된 $k$ ⇒ 합. 각 행은 주목받는 위치 $j$에 대한 확률 분포다
- '반복된 $j$, 그다음 $h, k$ ⇒ 합: 각 위치가 다른 위치들로부터 모으는 것'
- 마스킹된 15 % 위치에서 참 글자의 교차 엔트로피, Adam으로 최소화
- 테스트 서열에 대해 평균한 어텐션을 헤드별로 대칭화·APC 보정한 뒤 층 $l$과 헤드 $h$에 대해 평균
