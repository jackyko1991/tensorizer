source_hash: 099100757a12
title: Snake, gespielt von einem CNN und einer Mischung von Experten-Controllern
summary: 'Ein spielender Agent aus zwei Teilen: ein kleines CNN, das das Spielfeld betrachtet, und ein Steuerungsnetz, das den Zug wählt, hier eine Mixture of Experts, deren Router jedes Spiel an eines von $K$ kleinen Expertennetzen schickt. Das Spiel ist Snake auf einem $10 \times 10$-Gitter, vollständig in Tensoren geschrieben, sodass ein Batch von Spielen in einem Schritt voranschreitet. Die Controller lernen, indem sie einen planenden Lehrer nachahmen (Breitensuche und Flood Fill, ebenfalls Tensoroperationen). Vier Controller mit demselben Gewichtsbudget werden verglichen: eine dichte Mischung, ein Switch-Top-1-Router, ein dicht trainierter Router, der Top-1 eingesetzt wird, und ein einfaches MLP; anschließend wird das Routing gegen den Spielzustand gemessen, um zu sehen, wofür jeder Experte überhaupt genutzt wird. Alle vier fressen etwa 20 Futterstücke pro Spiel, wo eine Zufallsstrategie 0.2 frisst, zwei Drittel der Punktzahl des Lehrers; bei dieser Größe schneidet das einfache MLP
  so gut ab wie jede Mischung.'
notes: 'Idee. Jacky Ka Long Ko schlug einen spielenden Agenten aus einem CNN für die Wahrnehmung und einem Steuerungsnetz mit Mixture-of-Experts-Routing vor und bat vor allem um den Teil des Tensor-Routings. Dieses Problem baut einen kleinen solchen Agenten für Snake, ein generisches Gitterspiel, das hier von Grund auf geschrieben ist (eigene Pixeloptik, keine externen Assets). Spiel. $B$ Spiele auf einem $N \times N$-Feld ($N = 10$) bilden einen einzigen Satz von Tensoren. Das Feld speichert das Alter jeder Körperzelle (Züge, bis sie wieder frei ist: der Kopf hat Alter = Länge, der Schwanz 1), sodass ein Zug aller Spiele aus einer Handvoll Tensoroperationen besteht: der Kopf rückt auf $\mathbf x + \Delta_{d''}$ mit der neuen Richtung $d'' = (d + a - 1) \bmod 4$ für die relative Aktion $a$ (links, geradeaus, rechts); eine Wand oder eine Zelle mit Alter $> 1$ beendet das Spiel (die Schwanzzelle wird gerade verlassen, ist also frei); ohne Futter sinkt jedes Alter um 1, mit Futter behält die
  Schlange ihren Schwanz und wächst um eins; das neue Futter ist die leere Zelle mit der größten von $N^2$ geseedeten gleichverteilten Zufallszahlen, sodass es nie auf dem Körper landet. Ein Spiel endet außerdem nach $N^2$ Zügen ohne Futter oder wenn die Schlange das Feld ausfüllt. Tests: Kollision mit der Wand und mit sich selbst, die freie Schwanzzelle, Wachstum um eins, Futter nie auf dem Körper, die Alter stets genau $\ell, \ell - 1, \dots, 1$, und der Batch-Schritt gleich einer einfachen Python-Schleife pro Spiel bei denselben Zufallszahlen. Agent. Die Wahrnehmung ist ein CNN (3×3-Faltung mit 8 Kanälen, eine 3×3-Faltung mit Schrittweite 2 und 16 Kanälen, eine lineare Schicht auf $F = 64$ Merkmale; 84 472 Gewichte) auf einer kopfzentrierten Ansicht mit der Bewegungsrichtung nach oben, mit vier Ebenen: Wand, Körper, Alter/Länge (welche Zellen zuerst frei werden) und Futter. In diesem Bezugssystem sind die drei relativen Züge immer dieselben drei Nachbarn des Zentrums (ein Test prüft,
  dass ein Zug genau dann tödlich ist, wenn dieser Nachbar eine Wand oder eine bleibende Körperzelle ist). Die Steuerung ist eine Mischung von $K = 4$ Experten, jeder ein MLP $64 \to 32 \to 3$, das Aktionslogits liefert, hinter einem Softmax-Router $p = \mathrm{softmax}(W^G \mathbf h + b^G)$: 8976 Gewichte. Die geroutete Schicht ist die aus moe_dag_pipeline, von dort importiert: ein Dispatch-Tensor legt jedes Spiel in den Puffer seines Experten (kumulative Ränge, wie in GShard und Switch), alle Experten laufen in einem einzigen gebatchten einsum, und ein Combine-einsum führt die Logits zurück. Exakte Prüfungen: mit einem festen One-Hot-Router entspricht die Schicht dem alleinigen Ausführen des Experten jedes Spiels (bis auf $10^{-6}$), ein gleichförmiger dichter Router ergibt den Mittelwert der Experten, Router-Zeilen summieren sich zu 1, und der Load-Balancing-Verlust auf bekannten Fällen (1 bei Balance, $K$ bei Kollaps, 1.1 in einem von Hand berechneten Beispiel). Vier Controller, gleiches
  Budget: (a) eine dichte Mischung $z = \sum_k p_k f_k$ (jeder Experte auf jedem Spiel); (b) Switch Top-1, nur der wahrscheinlichste Experte läuft und seine Logits werden mit $p_k$ skaliert; (c) das dicht trainierte Modell aus (a) mit Top-1-Routing ausgeführt, ohne weiteres Training; (d) ein MLP $64 \to 132 \to 3$ (8979 Gewichte, so viele wie die Mischung). (a) und (b) fügen beide den Switch-Load-Balancing-Verlust mit $\alpha = 0.01$ hinzu. Jede Variante hat zwei Seeds; Seed $s$ startet in jeder Variante von denselben CNN- und Expertengewichten, und alle sechs trainierten Modelle teilen sich eine Modellachse (die gruppierte Faltung des CNN), jedes mit eigenen Minibatches. Lehrer und Training. Der Lehrer ist ein Planer, geschrieben mit denselben Tensoren: Breitensuche als wiederholte Relaxation über die freien Zellen ($\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$) und in derselben Schleife ein Flood Fill, der jede freie Region mit ihrem kleinsten Zellindex
  markiert. Er macht nie einen tödlichen Zug, bevorzugt einen Zug, dessen freie Region die Schlange aufnehmen kann, dann den kürzesten Weg zum Futter, dann die größere Region; sein Distanzfeld stimmt in einem Test mit einer lehrbuchmäßigen, warteschlangenbasierten BFS überein. Das Training ist Behaviour Cloning (Pomerleau 1989): Kreuzentropie auf den Zügen des Lehrers, aus 54 040 Zuständen von 192 Lehrerspielen, 600 AdamW-Schritte mit 128 Zuständen pro Modell, mit einer DAgger-Runde (Ross et al. 2011) nach 360 Schritten: die Schüler spielen je 48 Spiele, der Lehrer beschriftet die 38 267 Zustände, die sie erreichen, und das Training läuft auf beiden weiter. Es gibt kein Feintuning mit Reinforcement Learning; Deep Q-Learning (Mnih et al. 2015) ist der klassische Weg, solche Spiele allein aus der Belohnung zu lernen, was auf einer CPU weit länger dauern würde. Ergebnisse (Standardlauf, 128 Evaluationsspiele, die alle Strategien gemeinsam nutzen: gleiche Starts und gleiche Futterfolge, höchstens
  300 Züge). Gefressenes Futter pro Spiel, Mittel über die Spiele, mit den beiden Seeds: Zufall 0.16 (stirbt nach 15 Zügen); (a) dicht 20.7 (20.9, 20.4); (b) Switch 20.4 (21.1, 19.6); (c) dicht→Top-1 18.1 (18.4, 17.8); (d) monolithisch 21.7 (21.8, 21.6); Lehrer 31.0 (im Mittel 287 von 300 Zügen überlebt, gegenüber 147–179 bei den Schülern). Die Schüler stimmen auf 95–96 % der Trainingszustände mit dem Lehrer überein, erzielen aber ein Drittel weniger: kleine Fehler summieren sich über ein Spiel, die übliche Schwäche des Behaviour Cloning. Ein langsamer Test prüft, dass eine trainierte Strategie den Zufall deutlich schlägt. Routing, gezeigt auch dort, wo es keine Spezialisierung ist. Die dichten Router nutzen alle vier Experten (Auslastungen 0.16–0.38). Am besten folgen sie dem Zug selbst: die Transinformation zwischen dem gerouteten Experten und dem Zug des Controllers beträgt 0.51 und 0.56 bit (2 bit ist das Maximum bei vier Experten); bei Seed 1 übernimmt ein Experte fast jede Links- und
  Rechtskurve und fast jeden Zustand ohne freie Zelle voraus, während sich die anderen drei die Geradeaus-Züge teilen. Freie Zellen voraus tragen 0.20–0.28 bit, die Distanz zum Futter 0.08–0.12 und die Körperlänge 0.02–0.13 (eine Verschiebung von kurzen zu langen Schlangen nur bei Seed 1). Die Experten teilen sich also danach auf, was zu tun ist (abbiegen oder weiterfahren), nicht nach einer Strategie wie Futterjagd gegenüber Schwanzvermeidung; da die Ausgabe eines Experten den Zug bestimmt, ist diese Aufteilung teilweise eingebaut. Die Switch-Router kollabierten trotz des Balancing-Verlusts: Seed 1 schickt 85 % der Zustände an einen Experten und 15 % an einen zweiten, Seed 2 73 % und 26 %, jeweils zwei Experten ungenutzt; die in moe_dag_pipeline beobachtete Schwierigkeit beim Symmetriebrechen zeigt sich hier als Kollaps. Das kostet keine Punkte, denn ein Experte mit dem gemeinsamen CNN (das die meisten Gewichte enthält) spielt bereits so gut wie vier. Den dicht trainierten Router Top-1
  auszuführen (c) erhält das dichte Routing (0.60 und 0.67 bit mit dem Zug), kostet aber 2.6 Futter pro Spiel: das dichte Modell vermischt seine Experten und ist nicht ganz separierbar. Was gilt und was nicht. Exakt: das gebatchte Spiel entspricht der Referenzschleife, die geroutete Schicht mit festem Router entspricht Expertenaufrufen pro Spiel, und die dichte Mischung mit gleichförmigem Router ist der Expertenmittelwert. Gemessen auf einer Feldgröße mit zwei Seeds: Imitation bringt jeden Controller auf etwa zwei Drittel des Lehrers, und keine Mischung schlägt das einfache MLP mit denselben Gewichten (das MLP liegt bei beiden Seeds etwa 1 Futter pro Spiel vorn, ein kleiner Abstand bei zwei Seeds). Mixtures of Experts zahlen sich aus, wenn viele Experten weit mehr Gewichte enthalten, als eine einzelne Eingabe nutzen kann; ein Controller mit vier Experten hinter einem CNN, das den Großteil der Arbeit leistet, demonstriert das Routing, nicht seinen Vorteil. Verwandte Arbeiten. Adaptive Mischungen
  lokaler Experten (Jacobs, Jordan, Nowlan und Hinton 1991) führten ein Gate ein, das jeden Fall einem von mehreren konkurrierenden Experten zuweist; die dünn besetzte, gegatete MoE-Schicht (Shazeer et al. 2017) und der Switch Transformer (Fedus et al. 2021, Top-1-Routing und der hier verwendete Load-Balancing-Verlust) skalierten das hoch. Deep Q-Networks (Mnih et al. 2015) lernten Atari-Spiele aus Pixeln mit einem CNN und allein aus der Belohnung; ALVINN (Pomerleau 1989) lenkte ein Fahrzeug, indem es einen menschlichen Fahrer nachahmte, der Ursprung des Behaviour Cloning, und DAgger (Ross, Gordon und Bagnell 2011) behebt dessen sich aufsummierende Fehler, indem es die Zustände beschriftet, die der Lernende selbst besucht. Hardware und Grenzen. Standardmäßig CPU: etwa 80 s für Lehrer, Training und Evaluation auf einer ausgelasteten 6-Kern-Maschine (6.6 s Lehrerspiele, 6.0 s DAgger, 53 s Training, 16 s Evaluation) plus etwa 30 s für das GIF; eine GPU (pixi run -e cuda) beschleunigt das CNN,
  aber nicht die vielen kleinen Suchen des Lehrers. Das GIF zeigt (c), dessen Router alle Experten nutzt und genau einen pro Spiel ausführt; routing.png zeigt alle drei gerouteten Varianten, routing.csv und scores.csv enthalten die Zahlen.'
meanings:
- 'das Feld von Spiel $b$: 0 = leer, sonst die Züge, bis diese Körperzelle wieder frei ist (Kopf = Länge $\ell_b$, Schwanz = 1)'
- alle $B$ Spiele ziehen gleichzeitig; $d'_b = (d_b + a_b - 1) \bmod 4$ für die relative Aktion $a_b$ (links, geradeaus, rechts); eine Wand oder eine Zelle mit Alter $> 1$ beendet das Spiel (die Schwanzzelle, Alter 1, wird gerade verlassen)
- 'nach dem Fressen die leere Zelle mit der größten der geseedeten gleichverteilten Zahlen $u_{brc}$: nie auf dem Körper'
- 'was das CNN sieht: Wand, Körper, Alter/Länge und Futter, zentriert auf den Kopf mit der Bewegungsrichtung nach oben, sodass die drei Züge immer dieselben drei Nachbarn sind'
- CNN-Merkmale; die Modellachse $m$ (Variante × Seed) wird zu den Gruppen einer gruppierten Faltung pro Schicht
- 'Router: Softmax über die $K$ Experten, Zeilen summieren sich zu 1'
- Spiel $b$ auf Slot $s$ von Experte $k$ (sein Rang unter den dorthin gerouteten Spielen), importiert aus moe_dag_pipeline
- 'alle Experten in einem gebatchten Produkt, jeder auf seinem eigenen Puffer von Spielen: drei Aktionslogits'
- 'Kombination; dicht: $z = p_{mbk} y_{mkba}$ mit jedem Experten auf jedem Spiel'
- 'Switch-Load-Balancing, $K \sum_k f_k P_k$: 1 bei Balance, $K$ bei Kollaps'
- 'der Lehrer: kein tödlicher Zug, dann ein Zug, dessen freie Region (Flood Fill) die Schlange aufnimmt, dann der kürzeste Weg zum Futter (Breitensuche als wiederholte Tensor-Relaxation)'
labels:
  grid: Feldgröße $N$ (Zellen)
  seeds: Seeds pro Variante
  experts: Experten $K$
  steps: Trainingsschritte
  balance_weight: Load-Balancing-Gewicht $\alpha$
  dagger: DAgger-Runde (1 = an)
  eval_games: Evaluationsspiele
