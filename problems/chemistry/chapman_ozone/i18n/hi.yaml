title: चैपमैन क्रियाविधि और ओज़ोन परत
summary: 'सूर्य के प्रकाश से संचालित O, O₂ और O₃ के बीच चार अभिक्रियाएँ एक ओज़ोन परत बनाती हैं। $3\times4$ रससमीकरणमिति आव्यूह के साथ अभिक्रिया जाल $\dot c = S\,r(c)$ के रूप में लिखा गया यह दृढ़ तंत्र हर ऊँचाई पर एक साथ, न्यूटन चरणों के साथ पश्च ऑयलर (backward Euler) से समाकलित होता है, सूर्योदय से सदियों बाद तक: O और O₃ सेकंडों में स्थान बदलते हैं, विषम ऑक्सीजन को स्थिर होने में दिनों से सदियों तक लगते हैं, और स्थायी अवस्था लगभग 30 km पर शिखर पर होती है।'
notes: 'Sydney Chapman (1930) ने चार अभिक्रियाओं से ओज़ोन परत को समझाया। 242 nm से कम तरंगदैर्ध्य का पराबैंगनी प्रकाश $\mathrm{O_2}$ को तोड़ता है (1); हर O परमाणु जल्दी ही एक तीसरे पिंड $\mathrm M$ के साथ, जो ऊर्जा ले जाता है, किसी $\mathrm{O_2}$ से जुड़ जाता है (2); ओज़ोन पराबैंगनी और दृश्य प्रकाश अवशोषित करके फिर टूट जाती है (3), इसी तरह वह धरातल की रक्षा करती है, पर इससे “विषम ऑक्सीजन” $\mathrm O_x = \mathrm O + \mathrm{O_3}$ नष्ट नहीं होती; केवल $\mathrm O + \mathrm{O_3} \to 2\,\mathrm{O_2}$ (4) ऐसा करती है। अभिक्रियाएँ (2) और (3) O और $\mathrm{O_3}$ को मिलीसेकंड से मिनटों में चक्रित करती हैं, जबकि (1) और (4) कुल मात्रा को ऊपरी समतापमंडल में दिनों में और नीचे दशकों या उससे अधिक में तय करती हैं: $10^{14}$ गुना अलग समय-पैमानों वाला दृढ़ तंत्र, इसलिए एक स्पष्ट (explicit) योजना को अरबों चरण चाहिए, जबकि पश्च ऑयलर (किसी भी $\Delta t$ के लिए स्थिर) $\log t$ में समान दूरी पर 300 चरण लेता है। $S$ का हर स्तंभ ऑक्सीजन परमाणुओं को संरक्षित करता है, और पश्च ऑयलर ऐसे रैखिक निश्चरों को ठीक-ठीक बनाए
  रखता है। दोनों युग्मों को संतुलित करने पर $[\mathrm{O_3}] \approx [\mathrm{O_2}]\sqrt{j_1 k_2[\mathrm M]/(j_3 k_4)}$ मिलता है: नीचे जाने पर हवा (और उसके साथ $[\mathrm{O_2}]^{3/2}$) चरघातांकी रूप से सघन होती है जबकि $\mathrm{O_2}$-तोड़ने वाला प्रकाश ख़र्च हो जाता है, और गुणनफल वहाँ शिखर पर होता है जहाँ तिरछी $\mathrm{O_2}$ प्रकाशिक गहराई लगभग 3 है। दर स्थिरांक $k_2$, $k_4$ JPL मूल्यांकन के मान (अनुमानित) हैं; प्रकाशअपघटन दरें प्रति अणु एक प्रभावी बैंड और उदाहरणात्मक प्राचलों का उपयोग करती हैं, जो सौर स्पेक्ट्रम पर समाकलन का स्थानापन्न है, और सूर्य हर समय चमकता है। लगभग 18 km से नीचे विषम ऑक्सीजन का जीवनकाल सबसे लंबे रन से भी अधिक है, इसलिए वे स्तर कभी स्थिर नहीं होते; वास्तविक वायुमंडल में हवाएँ ओज़ोन को वहाँ ले जाती हैं। केवल चैपमैन रसायन बहुत अधिक ओज़ोन देता है (यहाँ लगभग $8\times10^{12}$ cm$^{-3}$ का शिखर और 15 km से ऊपर लगभग 380 DU, जबकि प्रेक्षित लगभग 20–25 km पर $5\times10^{12}$ cm$^{-3}$ और 300 DU)। अनुपस्थित निकासी उत्प्रेरकी चक्र हैं, $\mathrm X + \mathrm{O_3} \to \mathrm{XO} +
  \mathrm{O_2}$, $\mathrm{XO} + \mathrm O \to \mathrm X + \mathrm{O_2}$, जो प्रति उत्प्रेरक अभिक्रिया (4) को कई बार करते हैं: NOₓ (Crutzen, 1970), और CFC से क्लोरीन (Molina और Rowland, 1974), जो ओज़ोन छिद्र और मॉन्ट्रियल प्रोटोकॉल के पीछे का रसायन है (नोबेल पुरस्कार 1995)।'
meanings:
- ऊँचाई $a$ पर $\mathrm O$, $\mathrm{O_2}$, $\mathrm{O_3}$ के संख्या घनत्व, cm$^{-3}$ में
- अभिक्रिया $r$ द्वारा बने स्पीशीज़ $s$ के शुद्ध अणु; स्तंभ 1, $\mathrm{O_2} \to 2\,\mathrm O$ के लिए $(2, -1, 0)$ है
- 'दोहराया गया $s$ ⇒ योग: हर अभिक्रिया द्वारा बने ऑक्सीजन परमाणु, सभी शून्य'
- चारों अभिक्रियाओं की द्रव्यमान-अनुपाती दरें
- 'दोहराया गया $r$ ⇒ योग: $dc/dt$'
- जाल का जैकोबियन, दोहराए गए $r$ पर योग
- पश्च-ऑयलर चरण का एक न्यूटन अद्यतन, प्रति ऊँचाई एक $3\times3$ हल
- $6.0\times10^{-34}(T/300)^{-2.4}$ cm$^6$ s$^{-1}$ और $8.0\times10^{-12}e^{-2060/T}$ cm$^3$ s$^{-1}$ (JPL, अनुमानित)
- ऊपर के $\mathrm{O_2}$ और $\mathrm{O_3}$ स्तंभों द्वारा क्षीण प्रकाशअपघटन दरें (उदाहरणात्मक एक-बैंड मॉडल)
- $[\mathrm O]$ में द्विघात से सटीक चैपमैन स्थायी अवस्था
