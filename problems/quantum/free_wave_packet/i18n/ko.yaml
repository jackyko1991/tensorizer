source_hash: 1bc9d739c88e
title: 자유 파동묶음
summary: 자유 입자는 시간 적분이 전혀 필요 없습니다. 운동량 공간에서 슈뢰딩거 방정식은 각 푸리에 성분에 고유한 위상 $e^{-ik^2t/2}$를 곱하는 것으로 풀립니다. FFT 한 번, 곱셈 한 번, 역 FFT 한 번으로 임의의 시각, 아니 모든 시각의 $\psi$를 $(T, N)$ 텐서로 한꺼번에 얻습니다. 파동묶음은 군속도 $k_0$로 이동하며, 서로 다른 운동량 성분이 서로 다른 속력으로 진행하므로 퍼집니다.
notes: 단위 $\hbar = m = 1$. $\sigma$는 $\lvert\psi\rvert^2$의 표준편차입니다(따라서 $\psi \propto \exp(-(x - x_0)^2/(4\sigma_0^2) + ik_0x)$). 정확한 결과는 $\langle x\rangle = x_0 + k_0 t$(군속도 $v_g = dE/dk = k$)와 $\sigma(t) = \sigma_0\sqrt{1 + (t/(2\sigma_0^2))^2}$입니다. 좁은 파동묶음은 운동량이 넓게 퍼져 있으므로 빨리 퍼집니다. 점선은 이 공식으로 구한 $\langle x\rangle \pm \sigma(t)$를 표시합니다. $\operatorname{Re}\psi$의 물결은 위상 속도 $k/2$, 즉 포락선 속력의 절반으로 움직입니다. 격자는 주기적이므로 한쪽으로 빠져나간 파동묶음은 반대쪽에서 다시 들어옵니다.
meanings:
- 운동량 $k_0$로 움직이는 폭 $\sigma_0$의 가우스 함수
- '반복된 $x$ ⇒ 합: 평면파 $e^{ikx}$로의 기저 변환'
- '모든 시각 $t$에서 모든 모드 $k$의 자유 입자 위상 (합하는 지표 없음: 외적)'
- $x$ 공간으로 되돌림, $T$개의 스냅숏을 한 번에
- 모든 시각에서 $\lvert\psi\rvert^2$의 중심과 퍼짐
labels:
  k0: 파동묶음 운동량 $k_0$
  sigma0: 처음 폭 $\sigma_0$
  t_max: 시뮬레이션 시간
