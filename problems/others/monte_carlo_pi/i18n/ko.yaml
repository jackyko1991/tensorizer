source_hash: a88c161966b6
title: '몬테카를로: 무작위 다트로 $\pi$ 추정하기'
summary: '단위 정사각형에 다트를 무작위로 던지고 사분원 안에 떨어진 개수를 셉니다: 그 비율은 $\pi/4$로 수렴합니다. 많은 독립 실험을 하나의 $(B, N)$ 텐서에서 나란히 실행하면, 몬테카를로의 핵심 법칙, 즉 오차가 $1/\sqrt N$로만 줄어든다는 사실이 드러납니다. 뷔퐁의 바늘은 18세기의 두 번째 추정을 제공합니다.'
notes: '모든 추정은 평균적으로는 옳지만 잡음이 있으며, 잡음은 $1/\sqrt N$로만 줄어듭니다: 정확한 자릿수 하나를 더 얻으려면 다트가 백 배 필요합니다. 이 수렴 속도는 차원에 의존하지 않기 때문에, 몬테카를로는 중성자 수송과 이징 모형부터 옵션 가격 결정, 의학 선량 측정에서의 광자 경로에 이르기까지 많은 변수에 대한 적분에서 선택되는 방법입니다. 회색 곡선은 개별 실험입니다: 각각 떠돌지만 모두 $\sigma_N$이 정하는 띠 안에 머뭅니다. 고정된 시드로 모든 실행을 재현할 수 있습니다. 실험 수를 늘려 퍼짐이 이론과 더 잘 맞는 것을 확인해 보세요.'
meanings:
- 실험 $b$의 다트 $n$, 좌표 $i$, $[0, 1)$에서 균등 분포
- '반복된 $i$ ⇒ 합산: 모서리로부터의 거리의 제곱; 다트가 사분원 안에 있으면 1'
- '누적합을 $n$으로 나눔: 각 실험에서 다트를 던질 때마다의 추정값'
- 실험 간 퍼짐; 이론값 $\sqrt{\pi(4-\pi)/n}$은 이항 분산에서 유도
- '뷔퐁의 바늘: 확률 $2\ell/(\pi d)$로 선과 교차하므로 $\hat\pi = 2\ell N/(d\,\text{crossings})$'
labels:
  n_darts: 실험당 다트 수 $N$
  n_experiments: 실험 수 $B$
  needle_length: 바늘 길이 $\ell/d$
