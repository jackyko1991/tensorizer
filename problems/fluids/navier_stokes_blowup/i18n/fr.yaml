source_hash: b740fafad36e
title: Régularité de Navier–Stokes et candidats à l'explosion
summary: Le problème du millénaire de l'Institut Clay demande si les écoulements incompressibles 3D réguliers le restent pour toujours. Un solveur pseudo-spectral sur le tore simule le tourbillon de Taylor–Green pour Euler ($\nu = 0$) et deux viscosités en un seul lot de FFT, en suivant la vorticité maximale, l'enstrophie et l'intégrale de Beale–Kato–Majda $\int\|\omega\|_\infty dt$, qui doit diverger en cas d'explosion. L'étirement des tourbillons fait croître la vorticité d'Euler jusqu'à ce que la grille ne puisse plus la résoudre ; la viscosité la plafonne. Il s'agit d'une illustration, pas d'une preuve.
notes: 'Le problème Clay (description officielle de Fefferman) demande l''un de quatre énoncés : solutions régulières globales sur $\mathbb R^3$ (A) ou sur le tore $\mathbb T^3$ (B), ou rupture sur $\mathbb R^3$ (C) ou sur $\mathbb T^3$ (D), pour $\nu > 0$. Le dépôt openai/NavierStokesAndEuler sur GitHub affirme contenir des preuves vérifiées par machine en Lean 4, accompagnées d''articles, de la rupture pour Navier–Stokes forcé sur $\mathbb R^3$ et $\mathbb T^3$ (alternatives C et D) et de l''explosion en temps fini pour l''équation d''Euler non forcée à partir de données régulières à support compact. Ce sont des affirmations récentes qui attendent encore l''évaluation de la communauté mathématique et de l''Institut Clay ; cette page ne considère pas le problème du prix comme résolu. Pour Euler, la singularité en temps fini de solutions régulières a été étayée par le calcul axisymétrique avec bord de Luo–Hou (2014), puis par des preuves assistées par ordinateur (Chen–Hou), et Elgindi (2021)
  a prouvé l''explosion pour des données $C^{1,\alpha}$. La simulation ici ne fait qu''illustrer les quantités que ces travaux contrôlent. Le tourbillon de Taylor–Green $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$ est le test classique (Brachet et al. 1983) : l''étirement des tourbillons le raidit en nappes fines, l''enstrophie augmente et le spectre d''énergie s''aplatit. La queue du spectre décroît comme $e^{-2\delta k}$ ; une explosion exigerait que la bande d''analyticité $\delta(t)$ atteigne zéro en temps fini, alors que Brachet l''a trouvée ne rétrécissant qu''exponentiellement. Dès que $\delta\,k_\max < 1$, la simulation d''Euler est sous-résolue (zone grisée) : le système tronqué conserve encore exactement l''énergie, mais la croissance ultérieure de $\|\omega\|_\infty$ est un artefact de grille, et non la preuve d''une singularité. Avec viscosité, l''énergie obéit à $dE/dt = -2\nu\Omega$ (vérifié à l''arrondi près) et l''enstrophie atteint un pic puis décroît. Le
  tourbillon de Taylor–Green 2D est une solution exacte $e^{-2\nu t}$ et le 3D a une accélération initiale connue à partir de $p_0 = \frac1{16}(\cos 2x + \cos 2y)(\cos 2z + 2)$ : les deux servent de tests. Essayez un $N$ plus grand pour repousser le temps résolu.'
meanings:
- coefficients de Fourier de la vitesse de chaque simulation $b$ (une viscosité chacune) sur le tore $[0, 2\pi)^3$
- rotationnel avec le tenseur de Levi-Civita ; $j, l$ répétés ⇒ sommés
- le terme non linéaire sous forme rotationnelle, évalué dans l'espace réel (pseudo-spectral)
- 'projection de Leray : supprime la partie gradient, de sorte que la pression n''est jamais calculée et $k_i\hat u_i = 0$'
- élimine les modes que le terme quadratique replierait (aliasing) ; $k_\max = N/3$
- énergie cinétique $\frac12\langle|\mathbf u|^2\rangle$ et enstrophie $\frac12\langle|\boldsymbol\omega|^2\rangle$
- 'critère de Beale–Kato–Majda : une solution régulière ne peut se rompre en $T^*$ que si cette quantité y diverge'
- ajustement $E(k) \propto k^{-3}e^{-2\delta k}$ ; une vraie singularité exige $\delta \to 0$, et la grille ne résout l'écoulement que tant que $\delta\,k_\max \gtrsim 1$
labels:
  n: Grille $N^3$
  nu: Viscosité $\nu$ (simulations $0$, $\nu$, $2\nu$)
  t_max: Temps simulé
