title: पतले लेंस द्वारा बना प्रतिबिंब
summary: पतले लेंस का समीकरण बताता है कि वस्तु का प्रतिबिंब कहाँ बनता है और कितना बड़ा है। हर वस्तु स्थिति के लिए तीन मुख्य किरणें एक साथ अनुरेखित की जाती हैं, जबकि वस्तु $2f$ से परे से फोकस दूरी के भीतर तक चलती है और वास्तविक, उलटा प्रतिबिंब आभासी, सीधे प्रतिबिंब में बदल जाता है।
notes: 'दूरियाँ लेंस से मापी जाती हैं: वस्तु $x = -s$ पर और वास्तविक प्रतिबिंब $x = +s''$ पर। तीन मुख्य किरणें हैं (1) अक्ष के समांतर, फिर दूर वाले फोकस से होकर; (2) केंद्र से सीधी; (3) पास वाले फोकस से होकर, फिर समांतर। ये सब एक ही नियम $\theta'' = \theta - y/f$ से निकलती हैं। $f$ के भीतर किरणें लेंस के बाद अपसरित होती हैं; धराशायी विस्तार आभासी प्रतिबिंब पर मिलते हैं। $s = f$ पर प्रतिबिंब अनंत पर चला जाता है।'
meanings:
- एनिमेशन फ्रेम $k$ में वस्तु दूरी
- प्रतिबिंब दूरी; ऋणात्मक ⇒ वस्तु की ओर आभासी प्रतिबिंब
- प्रतिबिंब ऊँचाई / वस्तु ऊँचाई; ऋणात्मक ⇒ उलटा
- लेंस से पहले मुख्य किरण $r \in \{\text{parallel, centre, focal}\}$ की ढाल
- जहाँ हर मुख्य किरण लेंस को काटती है
- 'लेंस के बाद ढाल: हर किरण $-y/f$ से मुड़ती है'
labels:
  f: फोकस दूरी $f$
