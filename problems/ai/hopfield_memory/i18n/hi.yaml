title: 'हॉपफ़ील्ड नेटवर्क: क्लासिक और आधुनिक साहचर्य स्मृति'
summary: 'एक स्मृति जो किसी विकृत या आधे छिपे संस्करण से चित्र को पूरा कर देती है। क्लासिक हॉपफ़ील्ड (Hopfield) नेटवर्क बाइनरी पैटर्नों को हेबियन भारों $W_{ij}$ में संग्रहीत करता है और एक ऊर्जा में ढलान पर नीचे फिसलता है; यह अधिकतम लगभग $0.138\,N$ यादृच्छिक पैटर्न रख सकता है, और सहसंबद्ध पैटर्न इससे बहुत कम। रामसाउअर (Ramsauer) आदि (2020) का आधुनिक सतत हॉपफ़ील्ड नेटवर्क पैटर्नों को स्वयं रखता है और $\xi \leftarrow X\,\mathrm{softmax}(\beta X^\top \xi)$ से अद्यतन करता है, जो ट्रांसफ़ॉर्मरों का अटेंशन है: यह कार्टून चेहरों को एक ही चरण में पुनः प्राप्त कर लेता है जहाँ क्लासिक नेटवर्क उन्हें आपस में मिला देता है।'
notes: 'ये चेहरे किसी व्यक्ति की छवियाँ नहीं हैं: हर चेहरा कोड द्वारा कुछ यादृच्छिक संख्याओं (सिर का आकार, आँखें, चश्मा, भौहें, नाक, मुँह की वक्रता, बाल, कान) से बनाया जाता है, इसलिए किसी कॉपीराइट वाले पात्र या तस्वीर का उपयोग नहीं होता। हर क्वेरी चेहरे के निचले 40 % भाग को छिपाती है और बाकी पिक्सेलों में से 5 % को पलट देती है। यादृच्छिक पैटर्नों के लिए क्लासिक नेटवर्क की सीमा $\alpha_c \approx 0.138$ की गणना अमित, गुटफ़्रॉइंड और सोम्पोलिंस्की (Amit, Gutfreund, Sompolinsky, 1985) ने स्पिन ग्लास की विधियों से की थी, और एक-चरण बिट त्रुटि दर गाउसीय क्रॉसटॉक नियम $\Phi(-1/\sqrt\alpha)$ का पालन करती है (दोनों परीक्षणों में जाँचे गए हैं)। चेहरे प्रबल रूप से सहसंबद्ध हैं (उनकी रूपरेखा और बहुत सारा खाली कागज़ साझा है), इसलिए क्लासिक नेटवर्क $0.138$ से बहुत कम भार पर ही उन्हें गड़बड़ा देता है: यह चेहरों के मिश्रण में गिर जाता है। आधुनिक नेटवर्क की ऊर्जा में एक log-sum-exp पद है; रामसाउअर आदि सिद्ध करते हैं कि यह हर अद्यतन पर घटती है, कि आमतौर पर एक अद्यतन पर्याप्त होता है, और कि अच्छी तरह अलग पैटर्नों
  के लिए क्षमता $N$ के साथ घातीय रूप से बढ़ती है। इसका अद्यतन ठीक ट्रांसफ़ॉर्मर अटेंशन है, जिसमें संग्रहीत पैटर्न कुंजियाँ (keys) और मान (values) हैं। एक चेहरे की जगह कई चेहरों के मितस्थायी औसत देखने के लिए $\beta$ को छोटा करें। यह विचार शोधपत्र के साथ आए ब्लॉग पोस्ट का अनुसरण करता है, उसकी कार्टून छवियों की जगह प्रक्रियात्मक चेहरों के साथ।'
meanings:
- 'पैटर्न $\mu$: प्रक्रियात्मक रूप से बनाया गया कार्टून चेहरा, स्याही $+1$, कागज़ $-1$, $N = 32 \times 32$ पिक्सेल'
- हेब का नियम, दोहराया गया $\mu$ ⇒ योग; संग्रहीत चेहरों की हर संख्या के लिए एक नेटवर्क $f$, विकर्ण 0 पर सेट
- 'दोहराया गया $j$ ⇒ योग: हर नेटवर्क और क्वेरी के लिए न्यूरॉन $i$ पर क्षेत्र; $s_i$ उसका चिह्न लेता है'
- ऊर्जा; एक-एक न्यूरॉन के अद्यतन में कभी नहीं बढ़ती
- 'दोहराया गया $n$ ⇒ योग: क्वेरी की हर संग्रहीत पैटर्न से समानता, $\beta$ द्वारा तीक्ष्ण की गई'
- 'दोहराया गया $\mu$ ⇒ योग: नई अवस्था पैटर्नों का भारित औसत है, $\beta$ बड़ा होने पर एक ही पैटर्न'
- 'स्मरण गुणवत्ता: जब चेहरा ठीक-ठीक पुनर्स्थापित हो तब 1'
