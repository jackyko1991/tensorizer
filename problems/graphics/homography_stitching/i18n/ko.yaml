source_hash: 7fc4a728d6a3
title: 호모그래피 추정과 파노라마 스티칭
summary: 평평한 포스터를 찍은 두 장의 사진은 $3\times3$ 호모그래피로 연결된다. 특징점 대응 하나마다 선형 방정식 두 개가 나온다. 정규화된 직접 선형 변환(DLT)은 이를 SVD로 풀고, RANSAC은 4개 대응으로 된 가설 수천 개를 하나의 배치 SVD로 맞춰 잘못된 대응을 걸러 낸다. 그런 다음 두 번째 시점을 변형하고 첫 번째 시점과 페더 블렌딩하여 파노라마를 만든다.
notes: 평면을 바라보는 카메라는 평면 위의 점을 $H = K\,[\mathbf r_1\ \mathbf r_2\ \mathbf t]$로 픽셀에 대응시키므로, 같은 평면의 두 시점은 $H_2 H_1^{-1}$로 연결된다. 스케일이 자유이므로 숫자는 8개다. 대응 하나가 그중 두 개를 정하므로, 일반 위치에 있는 대응 네 개가 $H$를 결정한다. 그보다 많은 대응은 DLT가 최소 제곱 의미로 결합한다. Hartley 정규화가 없으면 $A$의 성분이 1부터 $10^4$(픽셀 제곱)까지 걸쳐 SVD의 정확도가 떨어진다. 최소 제곱은 잘못된 대응에 망가진다. 이상치 몇 개만으로도 단순한 파노라마가 눈에 띄게 어긋난다. RANSAC(Fischler & Bolles, 1981)은 대신 무작위 최소 표본 여러 개에 $H$를 맞추고, 가장 많은 대응이 동의하는 것을 남긴다. 이상치 비율이 $\varepsilon$이면 4개 대응 표본이 깨끗할 확률은 $(1-\varepsilon)^4$이므로 이론적으로는 표본 수십 개면 충분하다. 여기서는 배치 SVD가 저렴하므로 수천 개를 한꺼번에 푼다. 인라이어에 남는 오차는 픽셀 잡음과 일치한다. 방법은 Hartley & Zisserman, Multiple View Geometry in Computer Vision을 따른다. 실제 파이프라인은 SIFT나 ORB 같은 특징 검출기에서 대응을 얻는다.
meanings:
- 시점 1과 시점 2에서 대응된 픽셀 위치(알려진 포스터 점 + 잡음, 일부는 무작위 잘못된 대응으로 대체)
- 반복된 $j$ ⇒ 합, 그다음 세 번째 성분(사영 스케일)으로 나눔
- 무게중심으로 옮기고 평균 거리가 $\sqrt 2$가 되도록 스케일 조정(Hartley 정규화)
- $\mathbf x' \times H\mathbf x = 0$에서 대응마다 두 행, 아홉 성분 $h_a$에 대해 선형
- 가장 작은 특이값의 오른쪽 특이 벡터; 그다음 $H = T'^{-1}\hat H\,T$
- 'RANSAC 가설: 무작위 4개 대응 표본 $B$개, 모양 $(B, 8, 9)$의 배치 SVD 한 번으로 모두 풂'
- 모든 가설 아래에서 모든 대응의 재투영 오차
- 합의 집합이 가장 큰 가설; 그 인라이어로 DLT를 다시 맞춤
- '역변형: 파노라마의 각 픽셀이 시점 2에서 어디에 놓이는지 찾음; 페더링 가중치로 블렌딩'
labels:
  matches: 특징점 대응 수
  outliers: 잘못된 대응의 비율
  noise: 픽셀 잡음 $\sigma$
  hypotheses: RANSAC 가설 수 $B$
  threshold: 인라이어 임계값 $\tau$
