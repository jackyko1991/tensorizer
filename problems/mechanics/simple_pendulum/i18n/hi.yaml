source_hash: a761e752552d
title: छोटे कोणों से आगे सरल लोलक
summary: कई प्रारंभिक आयामों के लिए एक साथ पूर्ण अरैखिक लोलक समीकरण। सभी लोलक एक बैच टेंसर में रहते हैं, और हर एक की तुलना स्कूल में सीखे छोटे-कोण वाले कोसाइन से की जाती है।
notes: 'छोटे दोलनों के लिए $\sin\theta \approx \theta$ और हर लोलक का आवर्तकाल समान $2\pi\sqrt{L/g}$ होता है। बड़े दोलनों में अधिक समय लगता है: सटीक आवर्तकाल $4\sqrt{L/g}\,K(\sin(\theta_0/2))$ है, जहाँ $K$ पूर्ण दीर्घवृत्तीय समाकल है; 90° पर यह लगभग 18% अधिक है। देखें कि बड़े आयाम वाला लोलक अपने धराशायी (dashed) छोटे-कोण साथी से पीछे छूटता जाता है।'
meanings:
- ऊर्ध्वाधर से लोलक $b$ का कोण
- लोलक $b$ का कोणीय वेग
- 'दायाँ पक्ष: सभी लोलकों के लिए एक साथ $-(g/L)\sin\theta$'
- 'छोटे-कोण हल: बाह्य गुणनफल (outer product), किसी सूचकांक का योग नहीं'
- प्रति इकाई द्रव्यमान ऊर्जा $\tfrac12L^2\omega^2 + gL(1 - \cos\theta)$, संरक्षित
labels:
  length: छड़ की लंबाई $L$
  g: गुरुत्व $g$
  n_pendulums: लोलक
  max_amplitude: अधिकतम आयाम
  t_max: सिमुलेशन समय
