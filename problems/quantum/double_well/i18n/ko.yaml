source_hash: dc1d9350a90f
title: 이중 우물 터널링
summary: 대칭적인 이중 우물 퍼텐셜 속의 입자. torch.linalg.eigh는 가장 낮은 두 상태가 아주 작은 터널링 에너지 $\Delta E$로 갈라진 짝수 상태와 홀수 상태의 가까운 쌍을 이룬다는 것을 보여 줍니다. 둘의 합은 왼쪽 우물에 있는 입자이며, 두 상대 위상이 어긋나면서 에너지가 장벽보다 낮은데도 주기 $2\pi/\Delta E$로 오른쪽 우물로 터널링했다가 돌아옵니다.
notes: 단위 $\hbar = m = 1$. 이중항 에너지는 장벽 꼭대기 $V_0$보다 낮으므로 고전적으로는 입자가 결코 넘어갈 수 없습니다. 두 상태만 관여하므로 (전체 위상을 제외하면) $\psi(t) \propto \varphi_0 + e^{-i\Delta E\,t}\varphi_1$입니다. $t = 0$에서는 왼쪽의 $(\varphi_0 + \varphi_1)$이고, $t = \pi/\Delta E$에서는 오른쪽의 $(\varphi_0 - \varphi_1)$입니다. $P_L(t) = \cos^2(\Delta E\,t/2)$는 각 상태가 "반대쪽" 우물과 겹치는 작은 부분을 제외하면 성립합니다. $\Delta E$는 장벽의 높이와 폭에 따라 대략 지수적으로 줄어들므로(WKB 인자 $e^{-\int\kappa\,dx}$) 장벽을 조금만 높여도 터널링이 엄청나게 느려집니다. 시뮬레이션 시간은 터널링 주기 $2\pi/\Delta E$ 단위로 재므로 애니메이션은 언제나 진동을 온전히 보여 줍니다.
meanings:
- '4차 퍼텐셜: $x = \pm a$에서 극소, $x = 0$에 장벽 $V_0$'
- 운동 에너지 $-\tfrac12\,D2$에 대각선의 $V$를 더함
- 에너지와 상태; $\varphi_0$는 짝수, $\varphi_1$은 홀수, $\Delta E = E_1 - E_0$
- '$(1, 1, 0, 0, \dots)/\sqrt2$: 이중항을 같은 비율로 섞은 상태, 왼쪽에 국소화'
- '반복된 $n$ ⇒ 합: 고유 기저에서의 정확한 시간 전개'
- 왼쪽 절반을 고르는 계단 함수; $P_L$은 $x$에 대해 합
labels:
  V0: 장벽 높이 $V_0$
  a: 우물 간격 $a$ ($\pm a$에서 극소)
  periods: 시뮬레이션 시간
  n_grid: 격자점 수
