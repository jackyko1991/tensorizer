source_hash: 9231afd9bb4a
title: 用置换张量破解恩尼格玛密码机
summary: 不是物理，只是好玩：3 转子 Enigma I 的每次按键都是八个 $26\times26$ 置换矩阵的乘积，每个转子按其位置用循环移位做共轭。用秘密的转子顺序和起始位置加密一段英文消息，然后对每种转子顺序，把全部 $26^3 = 17\,576$ 个起始位置作为一个批量张量同时解密，保留字母统计最像英文的文本，从而破解。
notes: 反射器 $U$ 是没有不动点的对称置换，因此 $E = Q^{-1}UQ$（其中 $Q = R_3R_2R_1S$）也是：$E^2 = I$（相同设置即可解密）且 $E_{ii} = 0$（没有字母会被加密成自己，这是破译者利用的弱点）。每次按键前右转子前进一格；当它处于缺口位置时也会带动中转子，而当中转子处于自己的缺口位置时，它会与左转子一起前进（双步进异常）。测试向量：转子 I-II-III、反射器 B、环设置 AAA、起始 AAA，会把 AAAAA 变成 BDZGO。历史：Marian Rejewski 于 1932 年用置换群论破解了恩尼格玛，而图灵和 Welchman 的炸弹机（bombe，1940）则利用明文片段（crib，即猜测的明文，例如天气报告）而不是统计来搜索转子顺序和位置。这里纯统计的攻击，用重合指数给解密结果排序，是 James Gillogly 于 1995 年（Cryptologia）发表的方法，他在后续阶段还恢复了环设置和插线。简化：环设置为 AAA 且攻击者已知，插线板为空，因此密钥空间只有 $60 \times 26^3 \approx 10^6$ 种设置，正确的设置明显突出。真正战时使用 10 根线的插线板会增加约 $1.5 \times 10^{14}$ 种选择，在转子两侧交换 26 个字母中的 20 个，并把字母统计打乱到正确的转子设置几乎胜不过错误的；这时 Gillogly 的攻击需要对插线做爬山搜索，而消息很短时就会失败。试着减少字母数（约 60 到 100）或换用另一种分数，看看统计何时变得不可靠；只搜索转子 I–III 时，找不到使用 IV 或 V 的密钥。
meanings:
- 字母是一个 one-hot 向量 $e_x$，或仅是其索引 $x \in \{0, \dots, 25\}$（A = 0）
- 转子 I–V 的历史接线：当触点 $b$ 接到触点 $a$ 时 $W_{ab} = 1$
- 循环移位 $x \to x + o$；$o_k$ = 按键 $t$ 时转子 $k$ 的窗口字母 − 环设置
- 重复的 $a, b$ ⇒ 求和：转动后的转子；用索引表示为 $x \to (w[(x + o) \bmod 26] - o) \bmod 26$
- 一次按键：插线板 $S$、从右 $R^{(1)}$ 到左 $R^{(3)}$ 的转子、反射器 $U$ 再返回；$(R^{-1})_{ab} = R_{ba}$
- 转子在全部 26 个偏移下的查找表，因此 $R\,e_x$ 变成 F[o, x]，可同时处理数百万个字母
- 用每个起始位置 $b$ 解密的密文（$B = 26^3$）；由于 $E^2 = I$，解密 = 加密
- 字母 $k$ 在候选 $b$ 中出现的次数
- 重复的 $k$ ⇒ 求和：两个字母相同的概率，英文约 0.066，随机文本为 $1/26 \approx 0.038$
- 另一种分数：平均英文单字母对数似然 $c_{bk}\log p_k / N$
labels:
  message: 明文
  rotor_order: 秘密转子顺序（左-中-右）
  start_left: 左转子的秘密起始位置
  start_middle: 中转子的秘密起始位置
  start_right: 右转子的秘密起始位置
  n_letters: 用于评分的字母数 $N$
  score: 分数：重合指数或单字母对数似然
  search_rotors: 搜索的转子（60 或 6 种顺序）
