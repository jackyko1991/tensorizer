source_hash: 8522595ab746
title: マルコフ的ムペンバ効果
summary: 熱い水はぬるい水より速く凍りうるのか？メトロポリス遷移率で格子ポテンシャル中をホッピングする粒子では、答えはイエスである。マスター方程式 $\dot p = W p$ を一度だけ対角化し、すべての初期温度を一つの einsum で最も遅いモードに射影すると、遅いモードの振幅 $a_2$ が消える高温の初期状態は、より低温の初期状態より指数関数的に速く緩和する。
notes: 単位：$k_B = 1$、試行率は 1。熱浴は $T_b$ にあり、系は温度 $T_0$ の平衡状態から出発する。ホッピングが詳細つり合い $W_{ij}\pi_j = W_{ji}\pi_i$ を満たすなら、$W$ は対称行列と相似なので固有値はすべて実数で $\le 0$ となり、定常状態はボルツマン分布 $\pi$ である。短い時間の後には最も遅いモードだけが残り、$p - \pi \approx a_2\, e^{\lambda_2 t}\, r_2$ となるので、温度にかかわらず $\lvert a_2\rvert$ の小さい初期状態のほうが平衡に近づく。$a_2(T_0)$ は単調である必要がないので、より熱い初期状態がよりぬるい初期状態を追い越しうる（マルコフ的ムペンバ効果）。$a_2 = 0$ となる特別な $T^*$ では遅いモードがまったく存在せず、緩和はより速い率 $\lambda_3$ で進む（強い効果）。このポテンシャルでは、その形は盆地間の競合から生じる。低い $T_0$ では深く狭い井戸が確率の大部分を保持する。中間の $T_0$ では広く浅い井戸がエントロピーによって勝つ。高い $T_0$ では持ち上がった台地が埋まるので、左の盆地の占有率が再び増加し、$T^*$ でその平衡値を超える。理論は Lu & Raz（PNAS, 2017）による。Kumar & Bechhoefer（Nature, 2020）は光学的に整形した二重井戸ポテンシャル中のコロイド粒子で、強い効果も含めてこの効果を観測した。続いて Kumar, Chétrite & Bechhoefer（PNAS, 2022）は逆効果（異常加熱）を観測した。量子版の類似現象も最近、イオントラップ実験で報告されている。この格子はそれらの系のトイ版である。$T_b$ を上げてみよう：約 $1.4$ を超えると交差は消える。
meanings:
- サイト $i$ の階段状エネルギー：台地、深く狭い井戸、障壁、広く浅い井戸
- 鎖上の最近接なら 1、それ以外は 0
- ジャンプ $j \to i$ の遷移率。対角成分により各列の和はゼロ
- 各初期温度 $T_{0,b}$ でのボルツマン状態。初期状態のバッチ
- $j$ の繰り返し ⇒ 和：すべての初期状態についてのマスター方程式を同時に
- 対称化した $\Pi^{-1/2} W \Pi^{1/2}$ の eigh。$\lambda_1 = 0$ が平衡、$\lambda_2$ が最も遅い減衰
- $i$ の繰り返し ⇒ 和：各初期状態と各モードの重なり
- $k$ の繰り返し ⇒ 和：すべての時刻での厳密解
- 平衡へのカルバック–ライブラー距離、$\sum_i p_i \ln(p_i/\pi_i)$
labels:
  T_bath: 熱浴温度 $T_b$
  barrier: 障壁の高さ $U_\text{bar}$
  T_hot: 高温の初期温度 $T_\text{hot}$
