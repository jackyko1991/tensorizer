title: रीमान ज़ीटा फलन और अभाज्य संख्याएँ
summary: 'क्रांतिक रेखा $\operatorname{Re} s = \frac12$ पर हज़ारों ऊँचाइयों के लिए एक साथ $\zeta(s)$ का मान निकालें, वास्तविक फलन $Z(t)$ के चिह्न परिवर्तनों के रूप में इसके पहले अतुच्छ शून्यक खोजें, और एक बूलियन टेंसर छलनी से अभाज्य गिनें। फिर रीमान का स्पष्ट सूत्र शून्यकों से सीढ़ी $\pi(x)$ का पुनर्निर्माण करता है: हर शून्यक एक तरंग जोड़ता है, और अधिक शून्यकों के साथ चिकना वक्र अभाज्यों पर सीढ़ियों में तीक्ष्ण होता है।'
notes: 'श्रेणी $\sum n^{-s}$ केवल $\operatorname{Re} s > 1$ के लिए अभिसरित होती है; ऑयलर–मैक्लॉरिन पूँछ को एक समाकल और बर्नूली सुधारों में बदलता है, जो $\zeta$ को $s = 1$ के ध्रुव को छोड़कर पूरे समतल पर विस्तारित करता है। क्रांतिक रेखा पर $Z(t) = e^{i\theta(t)}\zeta(\frac12 + it)$ वास्तविक है, इसलिए $Z$ का चिह्न परिवर्तन सिद्ध करता है कि बीच में एक शून्यक है। गणना किए गए शून्यक प्रकाशित मानों $14.134725\ldots$, $21.022040\ldots$, $25.010858\ldots$ से लगभग $10^{-9}$ तक मेल खाते हैं, और ऊँचाई $T$ से नीचे पाए गए शून्यकों की संख्या रीमान–फ़ॉन मैंगोल्ट गणना $N(T) \approx \theta(T)/\pi + 1$ से मेल खाती है, यह जाँच कि कोई छूटा नहीं। तुलना के लिए तेज़ रीमान–सीगल सूत्र (मुख्य योग और पहला सुधार) दिखाया गया है: पहले शून्यकों पर इसकी त्रुटि पहले से ही केवल $10^{-3}$ से $10^{-2}$ है और $t$ बढ़ने पर घटती है। अभाज्य संख्या प्रमेय कहता है $\pi(x) \sim x/\ln x$, पर $\operatorname{li}(x)$ कहीं अधिक निकट है, और रीमान का $R(x) = \sum_n \frac{\mu(n)}{n}\operatorname{li}(x^{1/n})$ और भी निकट (मध्य पैनल; ग्राम
  की श्रेणी से गणना)। Riemann (1859) ने दिखाया कि शेष त्रुटि पूरी तरह शून्यकों द्वारा वहन की जाती है: $J(x) = \sum_{p^m \le x} \frac1m$ बराबर है $\operatorname{li}(x) - \sum_\rho \operatorname{li}(x^\rho) - \ln 2 + \int_x^\infty \frac{dt}{t(t^2-1)\ln t}$ के (1895 में von Mangoldt द्वारा सिद्ध), और मोबियस व्युत्क्रमण $\pi(x)$ देता है। शून्यकों का हर युग्म $\rho = \frac12 \pm i\gamma$ लगभग $\sqrt{x}/(\gamma\ln x)$ आकार और $\ln x$ में आवृत्ति $\gamma$ की एक तरंग जोड़ता है; योग को काटने से हर सीढ़ी के पास गिब्स जैसी लहरें रह जाती हैं। रीमान परिकल्पना कहती है कि हर अतुच्छ शून्यक ($0 < \operatorname{Re} s < 1$ वाला हर शून्यक) का वास्तविक भाग ठीक $\frac12$ है। यह असिद्ध है। इसे कंप्यूटर द्वारा $10^{12}$ से अधिक शून्यकों के लिए सत्यापित किया गया है, और यह त्रुटि सीमा $\pi(x) = \operatorname{li}(x) + O(\sqrt{x}\ln x)$ (von Koch, 1901) के तुल्य है। यह प्रोग्राम केवल रेखा पर शून्यक खोजता है; यह उससे बाहर के शून्यकों को ख़ारिज नहीं कर सकता। आगे पढ़ें: H. M. Edwards, Riemann''s Zeta Function (1974)।'
meanings:
- क्रांतिक रेखा पर एक साथ कई ऊँचाइयाँ $t$
- 'दोहराया गया $n$ ⇒ योग: डिरिक्ले श्रेणी के पहले $N-1$ पद'
- बर्नूली संख्याओं के साथ ऑयलर–मैक्लॉरिन सुधार; $(s)_{2k-1} = s(s+1)\cdots(s+2k-2)$। हर $s \ne 1$ के लिए मान्य
- $\zeta(\frac12 + it)$ जैसे ही शून्यकों वाला एक वास्तविक फलन; $\theta(t)$ इसकी अनंतस्पर्शी श्रेणी से
- चरण 0.01 वाले ग्रिड पर $Z$ के चिह्न परिवर्तन, फिर सभी अंतरालों पर एक साथ 48 द्विभाजन चरण
- 'एराटोस्थनीज़ की छलनी: हर अभाज्य $p \le \sqrt{x}$ के लिए एक strided स्लाइस; $\pi(x)$ इसका संचयी योग है'
- हर $x$ पर हर शून्यक; संयुग्मी शून्यक मिलकर $2\,\mathrm{Re}$ देते हैं
- 'हर $K$ के लिए एक साथ सन्निकटन: प्रति पंक्ति एक फ़्रेम'
- मोबियस फलन; $n$ पर योग $x^{1/n} < 2$ पर रुकता है क्योंकि वहाँ $J(y) = 0$
labels:
  n_zeros: प्रयुक्त शून्यक $K$
  x_explicit: $x$ तक स्पष्ट सूत्र
  log10_x: $10^n$ तक छलनी
