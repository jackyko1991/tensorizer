source_hash: a7f6ff1f025f
title: 色散水波
summary: 深水上的波包，長波跑得比短波快：$\omega = \sqrt{g k}$。每個傅立葉模態只是轉動自身相位，因此任意時刻的波包就是一次 FFT、一次乘法與一次反 FFT，一次對所有時刻完成。波峰以包絡兩倍的速度穿過包絡。
notes: 線性深水重力波（深度遠大於波長、無表面張力、斜率小）。因為 $\omega \propto \sqrt k$，群速度 $d\omega/dk$ 恰為相速度 $\omega/k$ 的一半：觀察紅色波峰超越綠色包絡峰值，在前端消失，並被後端新生的波峰取代（紅點以整數個波長往回跳）。較長的波跑得較快，因此波包緩慢擴散，前端的波比後端長（啁啾）。FFT 使盒子成為週期性的。由於每個模態只轉動相位，$\sum|\hat a_k|^2$（由帕塞瓦定理即為波能量）嚴格守恆。
meanings:
- 複數波包：高斯包絡乘以 $e^{ik_0x}$
- 起始波包的傅立葉振幅
- 每個模態的深水色散關係
- 以廣播求每個模態在每個時刻的值（精確，無時間步進）
- 重複的 $k$ ⇒ 求和：對所有時刻轉回實空間
labels:
  wavelength: 載波波長 $2\pi/k_0$
  width: 波包寬度 $\sigma$
  t_max: 模擬時間
