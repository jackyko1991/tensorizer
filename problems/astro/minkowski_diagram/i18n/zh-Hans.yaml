source_hash: 8adb8e4369f3
title: 狭义相对论：闵可夫斯基图与洛伦兹变换
summary: 事件是二维矢量 $x^\mu = (t, x)$，惯性系的变换是一个矩阵 $\Lambda^\mu{}_\nu$，用 einsum 一次作用于所有事件。一对双生子中的一人飞往一颗恒星再返回：家园参考系和变换后参考系中的时空图显示了倾斜的同时线、不变的光锥，以及旅行者的钟走过 $\int\sqrt{1 - v^2}\,dt$——比留在家中的那位少。
notes: 单位：年和光年，因此 $c = 1$，光线为 45° 虚线。旅行者以速度 $v$ 飞往距离 $L$ 的恒星，瞬间掉头后飞回。琥珀色线是旅行者认为“此刻”的事件集合：去程时按 $v$ 倾斜，在掉头时扫过留守者的世界线，留守者“消失”的那些年就去了这里。佯谬并不对称，因为只有旅行者改变了惯性系。把右图的变换速度设为 $v$ 即处于旅行者的去程参考系，设为 $-v$ 则对应返程。光锥在每个参考系中形状不变。
meanings:
- 一个事件 $(t, x)$，$\mu \in \{0, 1\}$，$c = 1$
- 闵可夫斯基度规 $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- 重复的 $\nu$ ⇒ 求和：世界线或网格上的所有事件一次完成变换
- 间隔的平方，在每个参考系中相同
- 沿世界线对 $\sqrt{-\Delta s^2}$ 的累积和
- 等于 $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$
labels:
  v: 旅行者速度 $v/c$
  distance: 到恒星的距离 $L$
  beta_view: 右图的变换速度 $\beta$
