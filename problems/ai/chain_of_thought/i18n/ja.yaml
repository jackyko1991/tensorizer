source_hash: 71b446fca9cd
title: なぜ思考の連鎖はトランスフォーマーの助けになるのか
summary: '$n$ ビットのパリティは累積的な XOR であり、本質的に逐次的なタスクです。同一の小さなトランスフォーマー（手書きの einsum アテンション、全モデルを 1 つのモデル軸に積み重ねて 1 回の実行で学習）に、これを 2 つの形式で学習させます。即座に答える "$b_1 \dots b_n = p$" と、先に累積パリティを書き出す "$b_1 \dots b_n : s_1 \dots s_n = p$" です。同じ重み構成と同じステップ数で、スクラッチパッドを使うモデルは $n = 4$ から $10$ でテスト文字列の 98–100% に正答する一方、直接答えるモデルは $n = 4$ に適合するだけで、それより長いとチャンスレベルかそれ以下です。アテンションには 2 トークンの規則 $s_k = s_{k-1} \oplus b_k$ が現れます。これはメカニズムの玩具モデルであり、大規模言語モデルがどのように推論するかのモデルではありません。'
notes: '現状：ここで示す効果は確立されたものです。パリティは、即座に答えなければならない固定深さのトランスフォーマーにとって教科書的な難しい例です。Li, Liu, Zhou and Ma（ICLR 2024, arXiv 2402.12875）は、中間ステップを持たない定数深さのトランスフォーマーが浅い並列回路（彼らの精度に関する仮定のもとで $\mathrm{TC}^0$ 程度）に制限される一方、$T$ ステップの思考の連鎖があればサイズ $T$ の直列回路を模倣できることを証明しました。Nye et al.（2021, arXiv 2112.00114）はトランスフォーマーに中間結果の「スクラッチパッド」を書かせるよう学習させ、長い桁の加算やプログラムのトレースといった多段階のタスクを解けることを確認しました。Wei et al.（2022, arXiv 2201.11903）は大規模言語モデルに対する思考の連鎖（chain-of-thought）プロンプティングを命名しました。手法：$n$ ビットの文字列を、直接 "$b_1 \dots b_n = p$" と書くか、累積パリティを添えて "$b_1 \dots b_n : s_1 \dots s_n = p$" と書きます。すべてのモデルは同じ 2 層、$d = 64$、4 ヘッドのデコーダー（`tiny_transformer` のコードで、すべての einsum にモデル軸 $m$ を加えたもの）で、AdamW により同じステップ数、同じ文字列バッチで学習します。CoT モデルは 1 文字列あたり約 2 倍のトークンを読み、中間トークンでも学習されますが、これこそがスクラッチパッドが与える追加の手助けです。すべてのモデル（$n$ × 形式 × シード、および長さ汎化用のモデル）は 1 回の実行で学習されます。重みは先頭の軸に積み重ねられ、勾配クリッピングはモデルごとに行われるため、互いに影響し合うことはありません（テストで確認しています）。データ：$n \ge 8$ では $2^n$ 個の文字列の 4 分の 1（最大 1024 個）を取り分け、学習には一切使いません。$n = 4$ と $6$ では文字列が少なすぎて取り分けられないため、それらの正答率（プロットで星印付き）は汎化ではなく適合を測るものです。テスト時、CoT
  モデルは自分のスクラッチパッドをトークンごとに貪欲に書き出し、最終的な答えのみが採点されます。結論：既定の実行（シード 2 個、数値はターミナルに出力）では、(a) CoT モデルは $n = 4, 6, 8, 10$ でテスト文字列の 0.98 から 1.00 に正答します。直接モデルは $n = 4$ の 16 個の文字列には適合します（1.00）が、$n = 6, 8, 10$ では 0.53、0.27、0.53 にとどまります。$n = 8$ でのチャンス未満のスコアについて考えられる解釈（ここでは検証していません）は次のとおりです。取り分けた文字列は学習時の隣接文字列と 1 ビットだけ異なるためパリティが逆になり、隣接文字列の間を補間するモデルは誤答します。(b) 長さ汎化はどちらも失敗します。$1 \le n \le 8$ で学習したモデルは $n = 12$ と $16$ で 0.46 から 0.51 にとどまります。これは 19 番目より後の位置が一度も学習されておらず、またここで用いた CoT のレイアウトでは、ビット $b_k$ がそれを必要とするセルの $n + 1$ 個前にあり、そのオフセットが $n$ によって変わるためです。長さを混ぜて学習した CoT モデルは、ステップ予算内で $n = 4$ を習得します（1.00）が、$n = 8$ さえ習得できません（0.56）。(c) $k$ ステップ後にスクラッチパッドを消すと、すべての $k < n$ で答えはチャンスレベルに落ちます。答えは最後のセルからコピーされるので、計算はすべて書き出されたトークンの中にあります。(d) $n = 8$ の CoT モデルでは、どのステップ $k$ でも、$s_k$ を書くクエリのアテンションの 0.5 から 0.8 を $b_k$ に置くヘッドが存在します。一様なアテンションなら 0.08 です（1 つのヘッドだけでステップ平均 0.48 に達し、ヘッドどうしでステップを分担しています）。規則のもう一方の入力 $s_{k-1}$ はクエリトークン自身であり、残差ストリームを通じて出力に届くので、学習された規則は局所的、すなわち 1 ステップあたり 2 トークンです。限界：これはメカニズムを示す玩具モデルであり、大規模言語モデルがどのように推論するかを示すものではありません。大規模モデルが書き出すステップが、実際に答えを生み出す計算に忠実かどうかについては何も言えず、それは未解決の研究課題です。結果はシードやステップ予算によって変わるため、すべてのシードをプロットしています。ステップ数を増やす、$n$
  を 16 まで広げる、あるいは 1 層にする、などを試してみてください。'
meanings:
- すべての接頭辞の累積パリティ：スクラッチパッドの目標であり、$p = s_n$
- 直接形式または CoT 形式の文字列をトークン ID $0, 1, :, =, \_$ で表したもの。1 つの $n$ のすべてのモデルが 1 つのテンソルを共有できるよう空白でパディング
- トークン埋め込みと学習される位置埋め込みの和。各モデル $m$ が独自のテーブルを持つ
- 繰り返される $c$ ⇒ 和をとる。モデル添字 $m$ は和をとらないので、$M$ 個の独立したトランスフォーマーが 1 つの積で実行される
- 因果的アテンション：各行は位置 $j \le i$ 上の確率分布
- どの次トークンを学習するか：$p$ のみ（直接）、または $s_1 \dots s_n$、"=" と $p$（CoT）
- モデル $m$ の学習対象トークンの平均 $-\log p$（nats）。それらの和を最小化し、各項は自分の重みにのみ作用する
- テスト時、モデルは 1 回の順伝播ごとに 1 トークンずつ自分のスクラッチパッドを書き、その後に答える
labels:
  steps: 学習ステップ数
  lengths: 実験 (a) の文字列長 $n$
  seeds: モデルあたりのシード数
  d_model: モデル幅 $d$
  heads: アテンションヘッド数 $H$
  layers: トランスフォーマーブロック数
  batch: 1 ステップあたりの文字列数
  lr: 学習率
