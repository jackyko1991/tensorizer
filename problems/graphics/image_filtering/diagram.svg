<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Image filtering: a 3 by 3 window of the input image I is multiplied by the kernel K (a small Gaussian with weights 1 2 1, 2 4 2, 1 2 1 over 16) and summed to give one pixel of the output image O">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- input image I: 5x5 pixels of 18 px, a dark-to-bright edge -->
    <g stroke="#ffffff" stroke-width="1">
      <rect x="8" y="34" width="18" height="18" fill="#374151"/><rect x="26" y="34" width="18" height="18" fill="#374151"/>
      <rect x="44" y="34" width="18" height="18" fill="#9ca3af"/><rect x="62" y="34" width="18" height="18" fill="#e5e7eb"/>
      <rect x="80" y="34" width="18" height="18" fill="#e5e7eb"/>
      <rect x="8" y="52" width="18" height="18" fill="#374151"/><rect x="26" y="52" width="18" height="18" fill="#6b7280"/>
      <rect x="44" y="52" width="18" height="18" fill="#d1d5db"/><rect x="62" y="52" width="18" height="18" fill="#e5e7eb"/>
      <rect x="80" y="52" width="18" height="18" fill="#e5e7eb"/>
      <rect x="8" y="70" width="18" height="18" fill="#374151"/><rect x="26" y="70" width="18" height="18" fill="#9ca3af"/>
      <rect x="44" y="70" width="18" height="18" fill="#e5e7eb"/><rect x="62" y="70" width="18" height="18" fill="#e5e7eb"/>
      <rect x="80" y="70" width="18" height="18" fill="#d1d5db"/>
      <rect x="8" y="88" width="18" height="18" fill="#6b7280"/><rect x="26" y="88" width="18" height="18" fill="#d1d5db"/>
      <rect x="44" y="88" width="18" height="18" fill="#e5e7eb"/><rect x="62" y="88" width="18" height="18" fill="#d1d5db"/>
      <rect x="80" y="88" width="18" height="18" fill="#9ca3af"/>
      <rect x="8" y="106" width="18" height="18" fill="#9ca3af"/><rect x="26" y="106" width="18" height="18" fill="#e5e7eb"/>
      <rect x="44" y="106" width="18" height="18" fill="#d1d5db"/><rect x="62" y="106" width="18" height="18" fill="#9ca3af"/>
      <rect x="80" y="106" width="18" height="18" fill="#6b7280"/>
    </g>
    <!-- kernel window around one pixel -->
    <rect x="26" y="52" width="54" height="54" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="44" y="70" width="18" height="18" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="8" y="24" font-style="italic">I</text>
    <!-- kernel K -->
    <text x="114" y="40" font-style="italic">K</text>
    <rect x="112" y="50" width="54" height="54" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <g font-size="12" text-anchor="middle">
      <text x="121" y="66">1</text><text x="139" y="66">2</text><text x="157" y="66">1</text>
      <text x="121" y="84">2</text><text x="139" y="84">4</text><text x="157" y="84">2</text>
      <text x="121" y="102">1</text><text x="139" y="102">2</text><text x="157" y="102">1</text>
    </g>
    <text x="139" y="122" font-size="11" fill="#6b7280" text-anchor="middle">÷ 16</text>
    <path d="M84,79 L106,79" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <path d="M170,79 L190,79" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <!-- output O: one pixel computed -->
    <rect x="196" y="52" width="36" height="54" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <rect x="205" y="70" width="18" height="18" fill="#9ca3af" stroke="#2563eb" stroke-width="2"/>
    <text x="208" y="44" font-style="italic">O</text>
  </g>
</svg>
