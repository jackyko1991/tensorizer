title: 方程式ファインダー：データの支配方程式を書き出すテンソル AI
summary: 場のデータを与えると、その法則を LaTeX で返します。候補項のライブラリ（$1, u, u^2, u_x, u u_x, u_{xx}, \nabla^2 E_z, \partial_x B_y, \dots$）を有限差分、Savitzky–Golay フィルタ、または弱形式で構築し、逐次閾値付きリッジ回帰（PDE-FIND）が $\partial_t u$ を説明する少数の項だけを残します。シミュレーションデータから Lorenz 系、熱方程式、粘性 Burgers 方程式、そして Yee FDTD の計算結果から Maxwell 方程式を復元し（$c$ の誤差は 0.2 %、弱形式では 0.03 %）、ライブラリに隠れた $\nabla\cdot\mathbf B = 0$ も見つけます。ノイズ実験では、各微分推定法がどこで破綻するかを示します。
notes: アイデア。これは Jacky Ka Long Ko の「物理方程式の自動発見器」です。場のデータを見て、それを支配する方程式を LaTeX で書き出す小さなテンソル AI です（SINDy / PDE-FIND のアプローチ）。MNIST 上の演算子探索の続編で、そちらは「手書き数字には支配方程式がない」という結論で終わりました。ここではデータが法則から生まれているので、見つけるべきものがあります。アーキテクチャは 3 つのモジュールからなります：(1) ノイズ除去スムーザ、(2) einsum / 有限差分による微分エンジン、(3) スパース演算子回帰。ここでは (2) と (3) が完成しており、(1) は Savitzky–Golay スムーザです（ニューラルネットワークは不要です）。手法。すべての候補項は場の単項式の微分 $D^\alpha(\prod_g u_g^{p_g})$ です。Lorenz 系では 3 次までの単項式 20 個、1 次元方程式では 13 項 $D^d(u^p)$（$p, d \le 3$）、Maxwell では 17 項（場そのもの、その $x$ と $y$ 微分、ラプラシアン、いくつかの積）。線形系 $\partial_t u = \Theta\xi$ の構築法は 3 通り：中心有限差分（fd）、Savitzky–Golay（sg：7 サンプルでの 3 次スムーザの後、9 サンプルでの 4 次微分フィット）——どちらも軸ごとの 1 次元畳み込み——、そして弱形式（weak SINDy、Messenger and Bortz 2021）です。弱形式では方程式をバンプ関数 $(1-s^2)^{10}$ に対して積分し、部分積分によってすべての微分をバンプ側に移します。軸ごとに 1 回のテンソル縮約です。次に STRidge（Rudy et al. 2017）を単位ノルムの列に対して実行します：リッジ回帰、$\tau$ 未満の係数をすべてゼロにし、再フィット、これを繰り返します。3 つのリッジ強度について 41 個の閾値を掃引し、検証誤差が最良値の 5 %（+ $10^{-3}$）以内に収まるモデルのうち項数が最も少ないものを採用します。大きいリッジ強度は Maxwell で重要です：$\nabla\cdot\mathbf B
  = 0$ のため列 $\partial_x B_x$ と $\partial_y B_y$ はほぼ逆向きで、リッジが弱いと回帰は $E_z$ の方程式に $2200\,\nabla\cdot\mathbf B$ を加えてしまいました。係数は残った項に対して最小二乗法で再フィットし、± は行のブートストラップで求めます。この ± は統計的なものにすぎず、微分推定のバイアスを含まないため、真の誤差よりはるかに小さいことがよくあります。代替の回帰は operator_search_mnist の DARTS 型緩和です：$\xi = \sigma(\alpha/T)\,w$ にゲートペナルティを加え、温度を 1 から 0.01 へアニーリングします。データはすべてここでシミュレーションしたものです：Lorenz 軌道 8 本（RK4）、10 cm の周期的な棒の上の熱方程式（Fourier モードによる厳密解、$D$ = 0.2 cm²/s）、$2\pi$ m 上の粘性 Burgers 方程式（Cole–Hopf 変換による厳密解、$\nu$ = 0.1 m²/s）、周期的な 6.4 cm の箱の中の Maxwell 方程式（Yee FDTD、TM モード、0.5 mm セル、Courant 数 0.5）。測定と同じようにサンプリングしています（すべての場を同じ点・同じ時刻に補間）。ノイズ：ガウスノイズ、各場の標準偏差の 0、0.1、1、5 %。結果。テストでは次を確認します：カーネルと弱形式が微積分上厳密であるべきところで厳密であること、データがそれぞれの法則に従うこと（熱核、Cole–Hopf、Yee は $\nabla\cdot\mathbf B = 0$ を丸め誤差の範囲で保ち、エネルギーを 0.2 % 以内で保存する）、STRidge が埋め込んだスパースベクトルを厳密に復元すること、クリーンなデータからすべての対象が復元されること、そして書き出した LaTeX をパーサで読み戻すとフィットしたモデルが再現されること。同梱の実行結果（クリーンなデータ、有限差分）：Lorenz $\sigma$ = 9.9987、$\rho$ = 27.989、$\beta$ = 2.6662；熱 $D$ = 0.20023 cm²/s；Burgers $u_t = -1.0007\,u
  u_x + 0.09996\,u_{xx}$；Maxwell $\partial_t E_z = c^2(\partial_x B_y - \partial_y B_x)$、$c$ = 29.92 cm/ns（真値 29.98）、および係数 0.996 の $\partial_t \mathbf B = -\nabla\times\mathbf E$。弱形式ははるかに高精度です（厳密データで誤差 $10^{-8}$、Maxwell で 0.03 %。これは発見器ではなく Yee スキーム自体の数値分散です）。Maxwell ライブラリの最小特異ベクトルは $0.707\,\partial_x B_x + 0.707\,\partial_y B_y$ で、その特異値は次の値より 220 倍小さい：データは $\nabla\cdot\mathbf B = 0$ を陰的な法則として示しています。ノイズ（正しい項が見つかったか）：有限差分は熱と Burgers では 0.1 % のノイズから、Lorenz では 1 % から失敗し、5 % に耐えるのは Maxwell だけです（係数誤差 25 %）。Savitzky–Golay はすべてで 0.1 % に耐え、5 % に耐えるのは Maxwell だけです。弱形式は熱、Burgers、Maxwell ではすべてのノイズレベルで正しい項を見つけ（5 % ノイズで係数誤差はそれぞれ 7 %、6 %、0.1 %）、Lorenz では 1 % まで見つけます（5 % では $\dot y$ に微小な偽の項を 2 つ加えます）。アニーリングゲートは Burgers と Maxwell では弱形式の STRidge と一致しますが、Lorenz の $\dot y$ の $-y$ 項を、すべてのノイズレベル、試したすべてのペナルティ（$10^{-6}$ から $10^{-3}$）で取りこぼします：$25.5\,x - 0.95\,xz$ がそれを吸収してしまい、緩和法はこの局所最小から抜け出せません。また熱方程式の 5 % でも失敗します。最初のスナップショットから見つけた方程式で再シミュレーションすると、熱と Burgers のデータを $3\times 10^{-4}$、Maxwell を 3 % で再現します。Lorenz は
  5 時間単位後に 3 % ずれますが、これはカオスが 0.01 % の係数誤差を増幅するためです。results/noise_study.csv と results/equations.tex にすべての数値と方程式があり、対象ごとに GIF が 1 つ（Maxwell がメイン）と results/summary.png があります。結論。この発見器は、クリーンで十分にサンプリングされたデータから既知の方程式の形を復元し、弱形式を使えば現実的なノイズにも耐えます。最初に破綻するのは回帰ではなく微分推定です。ライブラリにある項しか見つけられず、正しい変数が測定されている必要があり、発見された方程式は仮説にすぎません：独立した検証なしに新しい物理学（や生理学）を発見するものではありません。また大規模言語モデルの代替でもありません。これは別のタスク（テキストを生成するのではなく、データに法則をフィットすること）です。関連研究。SINDy（Brunton, Proctor and Kutz 2016）、PDE-FIND と STRidge（Rudy et al. 2017）、weak SINDy（Messenger and Bortz 2021）、遺伝的プログラミングによる記号回帰（Schmidt and Lipson 2009）と AI Feynman（Udrescu and Tegmark 2020）、Yee スキーム（Yee 1966）。試してみよう。ブートストラップの再標本化回数を減らして高速に実行する、ゲートのステップ数を増やして緩和法が Lorenz の局所最小から抜け出せるか確かめる（4000 まででは抜け出せませんでした）、または Yee グリッドを粗くする。
meanings:
- ライブラリ：列 $k$ は内部格子点 $n$ ごとの候補項 $D^\alpha(\prod_g u_g^{p_g})$。例：$u u_x = \tfrac12\partial_x(u^2)$、$\nabla^2 E_z = \partial_{xx}E_z + \partial_{yy}E_z$
- 微分エンジン：1 つの軸に沿った 1 次元畳み込み。中心差分、または 3 次スムーザの後の Savitzky–Golay（$2m+1$ サンプル上の $p$ 次最小二乗多項式）
- 弱形式：$x$ と $t$ について和をとる。微分はノイズを含むデータではなく、常に滑らかなバンプ関数 $\phi(s) = (1-s^2)^{10}$ に掛かる
- 各方程式 $f$ について残った項に対するリッジ回帰を一括で解く。STRidge は $|\hat\xi_k| < \tau$ をゼロにして再フィットする
- 閾値の掃引：検証誤差が最良値の 5 %（+ $10^{-3}$）以内のモデルのうち、項数が最も少ないものを採用
- DARTS 型の代替：$\xi = \sigma(\alpha/T)\, w$ にゲートペナルティを加え、温度を 1 から 0.01 へアニーリング
- ブートストラップ：$B$ 回の行の再標本化を多項分布の重みとして表し、すべてのフィットを 1 回の一括求解で行う
- 書き出した LaTeX をパーサで読み戻す：表示精度の範囲でフィットしたモデルを再現する
labels:
  bootstrap: 各係数の ± を求めるブートストラップ再標本化の回数
  gate_steps: アニーリングゲート探索の Adam ステップ数
  maxwell_grid: Maxwell シミュレーションの Yee グリッド（0.5 mm セルが $n \times n$ 個）
