source_hash: 3af965e9bb1a
title: 'UMAP comme problème tensoriel : graphe kNN, ensembles flous et disposition par forces sur MNIST'
summary: 'UMAP, la méthode de réduction de dimension qui représente les chiffres MNIST de 784 pixels sous forme de carte 2D, écrite entièrement en opérations tensorielles : un graphe kNN exact à partir d''une seule matrice de distances et de topk, une dichotomie qui trouve la largeur de bande $\sigma_i$ de chaque point en une fois, l''union floue $P + P^\top - P\circ P^\top$, une initialisation spectrale à partir du laplacien du graphe, et des forces d''attraction et de répulsion appliquées à toute la liste d''arêtes à chaque époque (à la main, puis par autograd). Sur 2500 chiffres et un rouleau suisse, elle égale la bibliothèque umap-learn en fiabilité (trustworthiness), en rappel des voisins et en précision sur les chiffres, loin devant la PCA.'
notes: 'La question. « UMAP comme simple problème tensoriel » est la demande de Jacky Ka Long Ko : prendre UMAP (Uniform Manifold Approximation and Projection ; McInnes, Healy et Melville 2018), habituellement exécuté via la bibliothèque umap-learn et ses boucles numba, écrire chaque étape sous forme d''opérations tensorielles par lots, puis vérifier que le résultat est aussi bon. Méthode, en tenseurs (N points en D dimensions). 1. Graphe kNN : les distances au carré (N, N) $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$ (un einsum), calculées par blocs de lignes, puis topk donne les distances et indices (N, k) ; exact, comme umap-learn en dessous de 4096 points (au-delà, il passe à une descente approchée des plus proches voisins). 2. Ensemble simplicial flou : $\rho_i$ est la distance au point le plus proche (autre que lui-même) ; $\sigma_i$ résout $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$ par dichotomie, les N intervalles étant divisés par deux ensemble (64 fois, précédées
  d''une phase de doublement tant que la borne supérieure est inconnue) ; les appartenances sont dispersées dans une matrice dense (N, N) $P$ et symétrisées par l''union floue $W = P + P^\top - P\circ P^\top$ (le dense suffit pour quelques milliers de points ; un tenseur creux COO applique la même formule à grande échelle). 3. La similarité en basse dimension $q = 1/(1 + a d^{2b})$, avec $a$ et $b$ ajustés à min_dist par un ajustement aux moindres carrés de Gauss–Newton à 2 paramètres ; initialisation : les deux plus petits vecteurs propres non triviaux du laplacien normalisé $I - D^{-1/2} W D^{-1/2}$, obtenus par un torch.linalg.eigh dense (environ 4 s pour 2500 points sur un cœur ; umap-learn utilise un solveur creux ; si eigh échoue, le code se rabat sur une initialisation aléatoire). 4. Disposition : 500 époques ; une arête de poids $w_{ij}$ est active une fois toutes les $\max w / w_{ij}$ époques (le calendrier d''umap-learn, conservé sous forme d''un tenseur (E,) des prochaines époques
  d''échantillonnage) ; chaque arête active attire ses deux extrémités et tire 5 négatifs aléatoires qui repoussent sa tête ; toutes les forces de l''époque sont calculées en une fois et sommées par point avec index_add_ (une mise à jour synchrone, là où umap-learn déplace les points arête par arête). La même boucle avec autograd : le gradient de l''entropie croisée échantillonnée, écrêté après sommation. 5. Métriques, toutes en opérations tensorielles avec $k$ = 10 : fiabilité (trustworthiness) et continuité (Venna et Kaski 2001) à partir de matrices de rangs (un argsort d''un argsort), rappel kNN, et précision sur les chiffres en 10-NN avec exclusion d''un élément (leave-one-out) dans la disposition 2D ; la PCA par SVD comme référence linéaire. Données. MNIST (LeCun, Cortes et Burges), licence CC BY-SA 3.0 : data/mnist_subset.npz contient les 250 premières images d''entraînement de chaque chiffre (2500 images, uint8 ; la licence de partage à l''identique s''applique à ce sous-ensemble),
  voir data/SOURCES.md. Le rouleau suisse (1500 points, comme make_swiss_roll de scikit-learn, avec un peu de bruit) est généré dans le code, si bien que ses vraies coordonnées à plat (longueur d''arc, hauteur) sont connues. La référence umap-learn (umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42) a été calculée une fois hors ligne dans un environnement jetable par data/make_reference.py ; seules ses coordonnées 2D et ses métriques sont fournies. Résultats (exécution fournie, CPU, un thread). MNIST, 2500 chiffres : fiabilité / continuité / rappel 10-NN / précision 10-NN sur les chiffres = 0.957 / 0.963 / 0.39 / 0.887 avec les forces écrites à la main, 0.960 / 0.963 / 0.40 / 0.898 avec autograd, 0.963 / 0.963 / 0.40 / 0.896 pour umap-learn, et 0.740 / 0.913 / 0.07 / 0.414 pour la PCA. Rouleau suisse : fiabilité 0.999 (umap-learn 0.999, PCA 0.943), et par rapport aux vraies coordonnées à plat 0.999 avec 76 % des 10 vrais plus proches voisins conservés (umap-learn 77 %, PCA 28 %). Notre
  fiabilité égale aussi celle de scikit-learn à $2\times 10^{-4}$ près sur les dispositions umap-learn fournies (testé), et $a$, $b$ sont égaux à ceux d''umap-learn. Temps réel sur MNIST : 11 s avec les forces (0.5 s graphe, 4 s eigh, 7 s disposition), 15 s avec autograd, 14 s pour umap-learn (deuxième appel, un thread ; son premier appel, avec la compilation numba, a pris 28 s). Après la meilleure rotation, réflexion et mise à l''échelle (Procuste), notre disposition MNIST diffère de celle d''umap-learn d''une disparité de 0.05 (0 = même forme, 1 = sans rapport) ; les mêmes groupes de chiffres se trouvent aux mêmes endroits. Verdict et limites. UMAP est un problème tensoriel : construction du graphe, recherche de la largeur de bande, union floue, initialisation spectrale et disposition par forces sont toutes des opérations tensorielles par lots, et le résultat est aussi bon que la référence selon toutes les métriques utilisées ici. Ce qui diffère : les dispositions sont comparées par des
  métriques, jamais par des coordonnées, car les dispositions UMAP ne sont définies qu''à une rotation, une réflexion et l''aléa de l''échantillonnage négatif près (une autre graine déplace les groupes) ; au-delà de 4096 points, le kNN d''umap-learn devient approché tandis que le nôtre reste exact (et coûte $O(N^2)$) ; nos matrices denses $N\times N$ et eigh limitent cette version à environ $10^4$ points (des blocs, des tenseurs creux et un solveur de valeurs propres itératif lèveraient cette limite) ; la mise à jour synchrone fait ressembler les premières époques à un gaz chaud (le taux d''apprentissage est proche de 1 et chaque point reçoit toutes ses impulsions d''un coup) avant que la disposition ne refroidisse. Le rouleau suisse conserve chaque voisinage local mais n''est pas déroulé en une seule feuille propre : il se déchire en bandes, comme avec umap-learn, un trait connu d''UMAP et de t-SNE. La précision sur les chiffres mesure à quel point la carte sépare des classes qu''elle n''a
  jamais vues ; ce n''est pas un classifieur. Les résultats varient de quelques millièmes selon les builds BLAS et le nombre de threads. Travaux connexes. t-SNE (van der Maaten et Hinton 2008) a établi le principe consistant à faire correspondre des probabilités de voisinage au moyen d''un noyau à queue lourde en 2D ; UMAP remplace ses probabilités normalisées par des appartenances floues et sa répulsion complète par l''échantillonnage négatif (comme dans word2vec), d''où son passage à l''échelle. Les cartes propres laplaciennes (Laplacian eigenmaps ; Belkin et Niyogi 2003) fournissent l''initialisation spectrale. À essayer. Moins de voisins (5) donne des groupes plus nombreux et plus petits ; min_dist proche de 0.9 répartit les points de façon lâche ; moins d''époques montre une disposition inachevée ; une autre graine fait tourner et remanie la carte tandis que les métriques restent stables.'
meanings:
- distances aux $k$ points les plus proches (le point lui-même en premier), à partir de $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$ (indice $d$ répété ⇒ sommé) et de topk ; exact, les blocs de lignes maintiennent la mémoire en $O(BN)$
- $\rho_i$ = distance au point le plus proche (autre que lui-même) ; $\sigma_i$ par 64 divisions par deux d'un seul tenseur d'intervalles pour tous les points à la fois, de sorte que $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$
- 'appartenance orientée : 1 pour le plus proche voisin, décroissante avec la distance au-delà, 0 hors de la liste kNN'
- 'union floue (OU probabiliste) des deux directions : symétrique, dans $[0, 1]$ ; ses éléments non nuls forment la liste d''arêtes $(i_e, j_e)$, $E$ ≈ 50 000 pour 2500 chiffres'
- 'ajustement de Gauss–Newton de $1/(1 + a x^{2b})$ à 1 en dessous de min_dist et à $e^{-(x - \mathrm{min\_dist})}$ au-delà : $a$ = 1.577, $b$ = 0.895 pour min_dist = 0.1'
- 'initialisation spectrale : les deux plus petits vecteurs propres non triviaux du laplacien normalisé du graphe, mis à l''échelle dans $[0, 10]$'
- forces de toutes les arêtes échantillonnées $(i, j)$ et de 5 négatifs aléatoires $s$ par arête, sommées par point en un seul scatter-add ; chaque terme écrêté à $\pm 4$ ; taux d'apprentissage $\alpha = 1 - \mathrm{epoch}/n$
- 'le même pas obtenu par autograd sur la perte échantillonnée $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$ : égal aux forces écrites à la main (testé)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, rangs $r$ obtenus par un argsort d'un argsort ; la continuité échange $x$ et $y$
labels:
  n_neighbors: Voisins $k$ (point lui-même inclus)
  min_dist: Distance minimale dans la disposition
  n_epochs: Époques de disposition
  neg_rate: Échantillons négatifs par arête échantillonnée
  n_mnist: Images MNIST (équilibrées entre chiffres)
  seed: Graine aléatoire
