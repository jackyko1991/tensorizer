source_hash: aa144f7ad9f7
title: रासायनिक साम्य और ले शातेलिए
summary: अभिक्रिया कहाँ रुकती है? $\Delta G^\circ = -RT\ln K$ से एक गैस अभिक्रिया ($\mathrm{N_2O_4 \rightleftharpoons 2\,NO_2}$ या हेबर अभिक्रिया $\mathrm{N_2 + 3H_2 \rightleftharpoons 2NH_3}$) का साम्य विस्तार $\xi$ सैकड़ों तापमानों और दाबों के लिए एक साथ $Q(\xi) = K$ पर द्विभाजन से पाया जाता है, जो दाब, तापमान (वान्ट हॉफ़) और जोड़े गए उत्पाद के साथ ले शातेलिए विस्थापन दिखाता है।
notes: '$Q$ मापता है कि मिश्रण कहाँ है, $K$ कि वह कहाँ होना चाहता है: यदि $Q < K$ तो अभिक्रिया आगे चलती है, यदि $Q > K$ तो पीछे। चूँकि $\ln Q$ विस्तार $\xi$ के साथ निरंतर बढ़ता है (बिना उत्पादों के $-\infty$ से बिना अभिकारकों के $+\infty$ तक), साम्य $\ln Q(\xi) - \ln K$ का एकमात्र मूल है, और द्विभाजन इसे हर परिस्थिति के लिए एक साथ खोजता है। ले शातेलिए का सिद्धांत सूत्र से ही निकल आता है। दाब: आदर्श-गैस सक्रियताओं के साथ $Q = K_x\,(P/P^\circ)^{\Delta\nu}$ जहाँ $\Delta\nu = \sum_i \nu_i$, इसलिए $P$ बढ़ाना कम गैस अणुओं वाले पक्ष को अनुकूल करता है ($\mathrm{N_2O_4}$ कम वियोजित होता है, अधिक $\mathrm{NH_3}$ बनता है)। तापमान: $\ln K = -\Delta H^\circ/RT + \Delta S^\circ/R$, इसलिए ऊष्माशोषी अभिक्रिया के लिए $K$, $T$ के साथ बढ़ता है ($\mathrm{N_2O_4}$, गर्म करने पर भूरा $\mathrm{NO_2}$ रंग गहरा होता है) और ऊष्माक्षेपी के लिए घटता है (अमोनिया)। जोड़ा गया उत्पाद: $Q$, $K$ से ऊपर उछलता है और कुछ उत्पाद वापस अभिकारकों में बदलता है, पर पूरा नहीं। $\mathrm{N_2O_4}$ के लिए परिणाम हाथ से जाँचा जा सकता है:
  $K = 4\alpha^2 P/((1-\alpha^2)P^\circ)$ देता है $\alpha = \sqrt{K/(K + 4P/P^\circ)}$। ऊष्मागतिक आँकड़े 298 K पर अनुमानित पाठ्यपुस्तक मान हैं ($\mathrm{N_2O_4}$ के लिए $\Delta H^\circ \approx +57.2$ kJ/mol, $\Delta S^\circ \approx +176$ J/(mol K); अमोनिया के लिए $\approx -92.2$ kJ/mol और $\approx -199$ J/(mol K)), जिन्हें $T$ में स्थिर माना गया है, और गैसों को आदर्श; ये दोनों सरलीकरण 700 K और 100 bar पर अमोनिया लब्धि को कुछ अधिक आँकते हैं (मापित: लगभग 30 % के बजाय लगभग 20 % $\mathrm{NH_3}$)। हेबर अभिक्रिया कमरे के तापमान पर प्रबल रूप से अनुकूल है पर वहाँ बहुत धीमी है: संयंत्र लौह उत्प्रेरक के साथ लगभग 700–750 K और 150–300 bar पर चलते हैं, गति के लिए लब्धि का त्याग करते हुए। हेबर अभिक्रिया के साथ T = 700 K आज़माएँ।'
meanings:
- 'रससमीकरणमितीय संख्याएँ: $\mathrm{N_2O_4 \rightleftharpoons 2NO_2}$ के लिए $-1, 2$; अमोनिया के लिए $-1, -3, 2$'
- हर (तापमान, दाब) युग्म एक बैच सूचकांक $b$ में चपटा
- अनुमानित, तापमान-स्वतंत्र $\Delta H^\circ$, $\Delta S^\circ$ के साथ $-\Delta G^\circ/RT$
- हर स्पीशीज़ के मोल; एक बाह्य गुणनफल, किसी पर योग नहीं
- कुल मोल; $j$ पर योग
- '$\ln Q$: स्पीशीज़ सूचकांक $i$ पर योग'
- 'कोई मात्रा ऋणात्मक नहीं हो सकती: द्विभाजन का अंतराल'
- 'द्विभाजन, सभी परिस्थितियाँ एक साथ: वह आधा रखें जहाँ $\ln Q - \ln K$ चिह्न बदलता है'
- $1/T$ के विरुद्ध $\ln K$ का ढलान
labels:
  reaction: अभिक्रिया ($\mathrm{N_2O_4}$ या अमोनिया)
  T: तापमान $T$ (काला वक्र)
  P: जोड़े गए उत्पाद परीक्षण के लिए दाब $P$
  add_product: जोड़ा गया उत्पाद
