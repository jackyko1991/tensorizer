source_hash: 65c4646e64b8
title: 속도 법칙과 아레니우스 도시
summary: 반응은 얼마나 빠르고, 따뜻해지면 얼마나 더 빨라질까? 0차, 1차, 2차 속도 법칙을 $k(T) = A\,e^{-E_a/RT}$로 여섯 온도에서 하나의 $(O, T)$ 텐서로 동시에 적분한다. 그런 다음 잡음이 섞인 합성 실험에서 반응 차수($[A]$, $\ln[A]$, $1/[A]$ 중 어느 도시가 직선인가?)와 활성화 에너지($1/T$에 대한 $\ln k$의 최소 제곱 직선)를 알아낸다.
notes: 각 속도 법칙에는 알맞은 변수에서 직선이 되는 적분형이 있다. $[A] = [A]_0 - kt$(0차), $\ln[A] = \ln[A]_0 - kt$(1차), $1/[A] = 1/[A]_0 + kt$(2차). 그래서 화학자는 세 가지를 모두 그려 가장 곧은 것($R^2$가 1에 가장 가까운 것)을 고르며, 그 기울기가 $\mp k$이다. 두 번째 검사는 반감기를 쓴다. $t_{1/2} \propto [A]_0^{1-n}$이므로 $[A]_0/2$에서 $[A]_0/4$까지의 시간은 첫 반감기의 $2^{n-1}$배(더 짧음, 같음, 두 배)이고, 이로부터 $n = 1 + \log_2(t_{1/2}^{(2)}/t_{1/2}^{(1)})$을 얻는다. 여러 온도에서 실험을 반복하면 $k(T)$를 얻고, $1/T$에 대한 $\ln k$의 아레니우스 도시는 기울기 $-E_a/R$인 직선이다. $E_a = 75$ kJ/mol이면 290 K에서 300 K로 데울 때 반응이 약 2.8배 빨라진다. "10 K마다 두 배"라는 옛 경험칙은 실온 근처에서 $E_a \approx 50$ kJ/mol에 해당한다. 각 실험은 A의 90 %가 반응할 때까지 추적하므로 차가운 실험이 뜨거운 실험보다 훨씬 오래 걸린다(범례 참고). 왼쪽 도시는 여섯 실험이 한 축에 들어가도록 각 실험 시간의 분율을 쓰며, 이는 어느 도시가 직선인지를 바꾸지 않는다. 데이터는 합성한 것이다(가상의 반응, 고정 시드의 가우시안 잡음). $\ln$이나 $1/x$를 취하면 후반의 묽은 점들의 잡음이 커지므로($\sigma/[A]$와 $\sigma/[A]^2$), 각 점에 $(dg/d[A])^{-2}$, 즉 $1$, $[A]^2$, $[A]^4$의 가중치를 주고 $[A]_0$의 2 % 아래인 점은 뺀다. 잡음을 키워 $R^2$ 검사가 덜 결정적으로 되는 것을, 또는 온도 범위를 좁혀 $E_a$의 오차가 커지는 것을 보자.
meanings:
- $T_{min}$과 $T_{max}$ 사이의 여섯 온도(K)
- 반응 차수 $0, 1, 2$, 나란히 적분
- 아레니우스 속도 상수, 단위 $\mathrm{M}^{1-n}\,\mathrm{s^{-1}}$
- 모든 실험의 속도; 합산하는 첨자 없음, $k_t$는 차수에 대해 브로드캐스팅
- 각 실험은 자기 시계 $t = \tau\,t_{end}$로 전환율 90 %까지 추적
- RK4 궤적, 테스트에서 정확한 적분 법칙과 비교
- $t$에 대한 세 도시; 올바른 차수만 직선을 줌
- 직선 맞춤의 설계 행렬
- 정규 방정식 행렬; $s$(표본) 합산; 가중치 $w_s = (dg/d[A])^{-2}$, $w_s = 0$은 $[A]_0$의 2 % 아래인 점을 제외
- 모든 도시와 온도에 대한 절편과 기울기를 한꺼번에
- '아레니우스 직선: 기울기 $-E_a/R$, 절편 $\ln A$'
labels:
  Ea: 활성화 에너지 $E_a$
  log10_A: 앞지수 인자 $\log_{10} A$
  order: 측정한 반응의 차수
  T_min: 최저 온도 $T_{min}$
  T_max: 최고 온도 $T_{max}$
  noise: 측정 잡음 $\sigma$
