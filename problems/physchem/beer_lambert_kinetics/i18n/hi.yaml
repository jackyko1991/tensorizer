source_hash: 26b3bf83c6f6
title: A → B → C के बियर–लैम्बर्ट स्पेक्ट्रम
summary: एक स्पेक्ट्रोफ़ोटोमीटर क्रमागत अभिक्रिया $A \to B \to C$ का अनुसरण करता है। मिश्रण का स्पेक्ट्रम एक आव्यूह गुणनफल है, $D = l\,E\,c$ (तरंगदैर्ध्य × स्पीशीज़), इसलिए सांद्रता प्रोफ़ाइल रवयुक्त स्पेक्ट्रमों से छद्म-व्युत्क्रम $E^{+}$ के साथ न्यूनतम वर्ग द्वारा वापस मिलती हैं। समअवशोषी (isosbestic) बिंदु देखें, जहाँ एक चरण चलते समय स्पेक्ट्रम स्थिर रहते हैं।
notes: 'हर स्पीशीज़ अपनी सांद्रता और पथ लंबाई के अनुपात में प्रकाश अवशोषित करती है, $D = \varepsilon\,l\,c$, और मिश्रण के अवशोषण बस जुड़ जाते हैं। सभी तरंगदैर्ध्यों और समयों के लिए एक साथ लिखने पर यह आव्यूह गुणनफल $D_{tw} = l\,E_{ws}c_{ts}$ है, इसलिए स्पीशीज़ से अधिक तरंगदैर्ध्यों के साथ सांद्रताएँ एक अतिनिर्धारित रैखिक तंत्र से मिलती हैं, जिसे न्यूनतम वर्ग से हल किया जाता है: छद्म-व्युत्क्रम $E^{+} = (E^{\mathsf T}E)^{-1}E^{\mathsf T}$ के साथ $\hat c = E^{+}D/l$। यह केवल तभी काम करता है जब शुद्ध स्पेक्ट्रम स्पष्ट रूप से भिन्न हों; टर्मिनल में छपी $E$ की प्रतिबंध संख्या (condition number) बताती है कि रव कितना बढ़ता है। गतिकी $A \to B \to C$ एक रैखिक तंत्र $\dot{\mathbf c} = K\mathbf c$ है, जिसे आव्यूह चरघातांकी से ठीक-ठीक हल किया जाता है: $[A]$ क्षयित होता है, $[B]$ बढ़ता और घटता है (यह $t = \ln(k_1/k_2)/(k_1 - k_2)$ पर शिखर पर होता है) और $[C]$ बढ़ता है, जबकि $[A] + [B] + [C]$ स्थिर रहता है क्योंकि $K$ के हर स्तंभ का योग शून्य है। समअवशोषी बिंदु: यदि केवल $A \to B$ हो रहा है, तो $[A] +
  [B]$ स्थिर रहते हुए $D = l(\varepsilon_A[A] + \varepsilon_B[B])$, इसलिए जिस तरंगदैर्ध्य पर $\varepsilon_A = \varepsilon_B$ वहाँ अवशोषण नहीं बदल सकता। तीक्ष्ण समअवशोषी बिंदु एक स्वच्छ दो-स्पीशीज़ रूपांतरण का क्लासिक संकेत है; यहाँ प्रतिच्छेद $\varepsilon_A = \varepsilon_B$ (शुरू में) से $\varepsilon_B = \varepsilon_C$ (बाद में) तक खिसकता है, और बीच में धुँधला हो जाता है क्योंकि तीन स्पीशीज़ साथ रहती हैं। पूर्ण समअवशोषी बिंदु देखने के लिए $k_2 = 0$ रखें, या उसे लुप्त होते देखने के लिए $k_2 \approx k_1$। स्पेक्ट्रम विशिष्ट रंजक-जैसी अवशोषकताओं ($\sim 10^4$ L mol$^{-1}$ cm$^{-1}$) वाले कृत्रिम गाउसीय बैंड हैं, 1 cm क्यूवेट में।'
meanings:
- 300–700 nm, 2 nm के चरणों में
- हर स्पीशीज़ की मोलर अवशोषकता (कृत्रिम गाउसीय बैंड, L mol$^{-1}$ cm$^{-1}$)
- $A \to B \to C$ का दर आव्यूह; हर स्तंभ का योग 0 (द्रव्यमान संतुलन)
- हर प्रतिचयन समय पर सटीक सांद्रताएँ; $r$ पर योग
- 'मिश्रण के लिए बियर–लैम्बर्ट: अवशोषण जुड़ते हैं, स्पीशीज़ $s$ पर योग'
- शुद्ध स्पेक्ट्रमों का अतिव्यापन (Gram) आव्यूह; $w$ पर योग
- छद्म-व्युत्क्रम; स्पेक्ट्रम स्वतंत्र होने पर torch.linalg.pinv(E) के बराबर
- हर रवयुक्त स्पेक्ट्रम से न्यूनतम-वर्ग सांद्रताएँ; $w$ पर योग
- चरण $A \to B$ का समअवशोषी बिंदु (इसी तरह $B \to C$)
labels:
  k1: दर स्थिरांक $k_1$ ($A \to B$)
  k2: दर स्थिरांक $k_2$ ($B \to C$)
  t_end: रन समय
  c0: आरंभिक $[A]_0$
  noise: संसूचक रव $\sigma$ (अवशोषण)
