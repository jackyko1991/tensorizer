title: 구의 광선 추적
summary: 모든 픽셀의 광선이 $(H\cdot W, 3)$ 텐서의 한 행인 작은 Whitted 방식 광선 추적기. 모든 광선을 모든 구와 근의 공식으로 한꺼번에 검사해 (광선 $\times$ 구) 표를 얻고, 그 argmin이 보이는 표면이다. 빛이나 카메라가 장면을 도는 동안 램버트 및 블린–퐁 셰이딩, 두 번째 그림자 광선 배치로 만든 날카로운 그림자, 거울 반사, 체크무늬 바닥을 보여 준다.
notes: 픽셀의 색은 $I = (1-m)\,I_\text{local} + m\,I_\text{reflected}$이며, $m$은 표면의 거울 비율이다. 반사된 색은 반사 광선 배치를 다시 추적해서 얻는데, 이것이 Whitted(1980)의 재귀적 아이디어이다. 셰이딩 모형은 퐁(1975)의 것에 블린(1977)의 중간 벡터 $\hat{\mathbf h}$를 쓴 것이다. $\hat{\mathbf d}$는 단위 길이이므로 이차방정식의 최고차 계수가 1이 되어 $b$와 $q$만 필요하다. 2차 광선은 표면에서 아주 작은 거리 $\varepsilon$만큼 떨어진 곳에서 출발한다. 그러지 않으면 반올림 오차 때문에 자기 구에 부딪힌다(그림자 여드름). 반사 0회로 반사 없는 장면을, 높은 광택도로 작고 날카로운 하이라이트를, 넓은 시야각을 시도해 보자. 실제 렌더러는 부드러운 그림자, 굴절, 픽셀당 많은 표본(경로 추적)을 더하지만, 배치로 계산하는 광선 대 모든 물체 표는 그대로이다.
meanings:
- 픽셀 $p$를 지나는 광선의 원점과 단위 방향; $d$는 카메라 기저로 나타낸 화면 점 $(x, y, 1)$, 기저 첨자에 대한 einsum
- 구 $s$의 중심과 반지름
- '반복된 $i$ ⇒ 합산: 모든 광선과 모든 구를 한 번의 호출로'
- 이차방정식의 가까운 근; $b^2 < q$(광선이 빗나감)이거나 교점이 뒤에 있으면 $\infty$
- 보이는 표면; 바닥 평면 $y = 0$은 $t = -o_y/d_y$인 추가 열
- 난반사 및 정반사 인자, 반대쪽에서는 0으로 자름
- '빛을 향한 그림자 광선: 빛에 닿기 전에 구에 부딪히지 않으면 1, 아니면 0'
- '반복된 $j$ ⇒ 합산: 거울 반사 방향, 다음 광선 배치'
