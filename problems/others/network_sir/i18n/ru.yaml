title: Эпидемии на сети контактов
summary: 'Эпидемии SIR и SIS на реальной сети очных контактов: сотни стохастических вспышек запускаются одновременно как один пакетный тензор, а рядом — ОДУ среднего поля на уровне индивидов. Вспышка может разгореться только выше порога $\beta/\gamma > 1/\lambda_{\max}(A)$, задаваемого наибольшим собственным значением матрицы смежности, а на безмасштабной сети вакцинация хабов останавливает её гораздо меньшим числом доз, чем случайная вакцинация.'
notes: 'Каждый человек находится в состоянии S, I или R; на каждом шаге $\Delta t$ восприимчивый заражается от каждого инфицированного контакта с интенсивностью $\beta$, а инфицированный выздоравливает с интенсивностью $\gamma$ (в SIS он снова становится восприимчивым). Тесты проверяют, что люди только перемещаются между группами, что у $k$-регулярного графа $\lambda_{\max} = k$, что ниже порога вспышки угасают и что на полном графе (каждый встречается с каждым, $R_0 = \beta(N-1)/\gamma$) средний итоговый размер крупных вспышек согласуется с уравнением Кермака–Маккендрика (1927) $z = 1 - e^{-R_0 z}$ ($z \approx 0.80$ при $R_0 = 2$). Порог $1/\lambda_{\max}$ получается линеаризацией среднего поля на уровне индивидов; для этого ОДУ он точен, но ОДУ считает соседей независимыми и позволяет инфекции отражаться туда и обратно по одному и тому же ребру, поэтому на этой маленькой, плотной, кластеризованной сети оно завышает масштаб эпидемии. Инфекция SIR не может вернуться назад по ребру, по которому
  пришла: также показан порог передачи сообщений $T = \beta/(\beta + \gamma) = 1/\lambda_{NB}$, где $\lambda_{NB}$ — старшее собственное значение матрицы без возвратов (Karrer, Newman и Zdeborová, 2014). Смоделированная кривая — среднее по всем запускам, включая многие, которые случайно угасают после первого случая, поэтому она растёт постепенно. На безмасштабных сетях $\lambda_{\max}$ растёт вместе с самым крупным хабом, поэтому порог крошечный (Pastor-Satorras и Vespignani, 2001), а удаление хабов быстро снижает $\lambda_{\max}$: коллективный иммунитет при гораздо меньшем числе доз. У сети Эрдёша–Реньи с той же средней степенью нет крупных хабов, поэтому адресная вакцинация помогает гораздо меньше. Данные: SocioPatterns "Contacts in a workplace" (офисное здание во Франции, 2013; 92 человека, 755 пар, замеченных лицом к лицу в 20-секундных окнах, здесь агрегированы), M. Génois et al., Network Science 3, 326 (2015), опубликованы под Creative Commons Public Domain Dedication (CC0), www.sociopatterns.org.
  Сети BA и ER синтетические. Смоделированные люди и параметры служат иллюстрацией и не являются моделью какой-либо реальной болезни.'
meanings:
- 1, если люди $i$ и $j$ были замечены лицом к лицу, иначе 0 (симметричная, плотная)
- кто инфицирован в каждой из $B$ реализаций, запущенных вместе
- 'повторяющийся $j$ ⇒ суммирование: число инфицированных контактов каждого человека'
- вероятность того, что восприимчивый заразится за один шаг $\Delta t$; инфицированные выздоравливают с вероятностью $1 - e^{-\gamma \Delta t}$
- вероятности того, что человек $i$ восприимчив, инфицирован или выздоровел, проинтегрированные методом RK4
- 'наибольшее собственное значение: линеаризованное среднее поле $\dot x = (\beta A - \gamma)x$ растёт, только если $\beta \lambda_{\max} > \gamma$'
- итоговый размер при полном перемешивании, корень уравнения $z = 1 - e^{-R_0 z}$ (Кермак–Маккендрик)
labels:
  beta_x_lambda: $\beta/\gamma$ в единицах порога $1/\lambda_{\max}$
  n_runs: Стохастические реализации $B$
  n_synthetic: Число людей в синтетических сетях
  vacc_beta: $\beta/\gamma$ для сравнения стратегий вакцинации
