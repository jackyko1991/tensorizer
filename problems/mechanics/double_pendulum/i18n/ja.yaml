source_hash: 75e6d7e3dc93
title: 二重振り子とカオス
summary: 二重振り子のラグランジュ方程式を $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$ の形に書く。RK4 の各段で $2\times 2$ の質量行列テンソルを組み立てて torch.linalg.solve を呼ぶ。ほとんど同じ2つの初期状態が次第に離れていき、カオスを示す。
notes: バッチには $\theta_2$ が $\delta$ だけ異なる2つの振り子が入っている。両者の差はおおよそ指数関数的に増大し、やがて運動は無関係になる。ただし各振り子のエネルギーは高精度で一定に保たれる（float64 + 小さな刻みの RK4）。振れが小さいとき系は2つの基準振動をもつ。質量と長さが等しければ $\omega^2 = (2 \mp \sqrt2)\,g/L$ である。棒の質量は無視し、支点に摩擦はない。
meanings:
- 鉛直下向きから測った振り子 $b$ の角度 $(\theta_1, \theta_2)$
- 角速度
- 配置に依存する質量行列、非対角成分 $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 一般化力：遠心力による結合 + 重力
- バッチ全体の $M\ddot q = f$ を1回の呼び出しで解く
- $i$ と $j$ について和：運動エネルギーの2倍
labels:
  theta1: 初期 $\theta_1$
  theta2: 初期 $\theta_2$
  delta: $\theta_2$ の摂動 $\delta$
  m1: 上の質量 $m_1$
  m2: 下の質量 $m_2$
  L1: 上の棒 $L_1$
  L2: 下の棒 $L_2$
  t_max: シミュレーション時間
