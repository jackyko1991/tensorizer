source_hash: 099100757a12
title: Snake jugado por una CNN y una mezcla de controladores expertos
summary: 'Un agente de juego formado por dos partes: una pequeña CNN que mira el tablero y una red de control que elige la jugada, aquí una mezcla de expertos cuyo enrutador envía cada partida a una de $K$ pequeñas redes expertas. El juego es Snake en una cuadrícula de $10 \times 10$, escrito íntegramente con tensores para que un lote de partidas avance en un solo paso. Los controladores aprenden imitando a un maestro planificador (búsqueda en anchura y relleno por inundación, también operaciones tensoriales). Se comparan cuatro controladores con el mismo presupuesto de pesos: una mezcla densa, un enrutador Switch top-1, un enrutador entrenado en denso y usado en top-1, y un MLP simple; después se mide el enrutamiento frente al estado del juego, para ver para qué se usa cada experto, si es que se usa para algo. Los cuatro comen unas 20 piezas de comida por partida, donde una política aleatoria come 0.2, dos tercios de la puntuación del maestro; a este tamaño, el MLP simple rinde tan bien
  como cualquier mezcla.'
notes: 'Idea. Jacky Ka Long Ko propuso un agente de juego compuesto por una CNN para la percepción y una red de control con enrutamiento de mezcla de expertos, y pidió sobre todo la parte del enrutamiento tensorial. Este problema construye uno pequeño sobre Snake, un juego de cuadrícula genérico escrito aquí desde cero (estética de píxeles propia, sin recursos externos). Juego. $B$ partidas en un tablero de $N \times N$ ($N = 10$) son un único conjunto de tensores. El tablero guarda la edad de cada celda del cuerpo (jugadas hasta que vuelve a quedar libre: la cabeza tiene edad = longitud, la cola 1), de modo que una jugada de todas las partidas es un puñado de operaciones tensoriales: la cabeza avanza a $\mathbf x + \Delta_{d''}$ con la nueva dirección $d'' = (d + a - 1) \bmod 4$ para la acción relativa $a$ (izquierda, recto, derecha); una pared o una celda con edad $> 1$ termina la partida (la celda de la cola se está desocupando, así que está libre); sin comida cada edad baja en 1, con
  comida la serpiente conserva su cola y crece en uno; la nueva comida es la celda vacía con el mayor de $N^2$ números uniformes generados con semilla, así que nunca cae sobre el cuerpo. Una partida también termina tras $N^2$ jugadas sin comida o cuando la serpiente llena el tablero. Pruebas: colisión con la pared y consigo misma, la celda de la cola libre, crecimiento en uno, comida nunca sobre el cuerpo, las edades siempre exactamente $\ell, \ell - 1, \dots, 1$, y el paso por lotes igual a un bucle simple de Python por partida con los mismos números aleatorios. Agente. La percepción es una CNN (convolución 3×3 con 8 canales, una convolución 3×3 con paso 2 y 16 canales, una capa lineal a $F = 64$ características; 84 472 pesos) sobre una vista centrada en la cabeza con la dirección apuntando hacia arriba, con cuatro planos: pared, cuerpo, edad/longitud (qué celdas se liberan primero) y comida. En este marco, las tres jugadas relativas son siempre los mismos tres vecinos del centro (una prueba
  comprueba que una jugada es mortal exactamente cuando ese vecino es una pared o una celda del cuerpo que permanece). El control es una mezcla de $K = 4$ expertos, cada uno un MLP $64 \to 32 \to 3$ que da logits de acción, tras un enrutador softmax $p = \mathrm{softmax}(W^G \mathbf h + b^G)$: 8976 pesos. La capa enrutada es la de moe_dag_pipeline, importada de allí: un tensor de despacho coloca cada partida en el búfer de su experto (rangos acumulados, como en GShard y Switch), todos los expertos se ejecutan en un único einsum por lotes, y un einsum de combinación devuelve los logits. Comprobaciones exactas: con un enrutador one-hot fijo, la capa equivale a ejecutar por separado el experto de cada partida (hasta $10^{-6}$), un enrutador denso uniforme da la media de los expertos, las filas del enrutador suman 1, y la pérdida de balanceo de carga en casos conocidos (1 cuando está equilibrado, $K$ cuando colapsa, 1.1 en un ejemplo calculado a mano). Cuatro controladores, mismo presupuesto:
  (a) una mezcla densa $z = \sum_k p_k f_k$ (cada experto en cada partida); (b) Switch top-1, solo se ejecuta el experto más probable y sus logits se escalan por $p_k$; (c) el modelo entrenado en denso de (a) ejecutado con enrutamiento top-1, sin más entrenamiento; (d) un único MLP $64 \to 132 \to 3$ (8979 pesos, los mismos que la mezcla). (a) y (b) añaden ambos la pérdida de balanceo de carga de Switch con $\alpha = 0.01$. Cada variante tiene dos semillas; la semilla $s$ parte de los mismos pesos de CNN y de expertos en todas las variantes, y los seis modelos entrenados comparten un único eje de modelo (la convolución agrupada de la CNN), cada uno con sus propios minilotes. Maestro y entrenamiento. El maestro es un planificador escrito con los mismos tensores: búsqueda en anchura como relajación repetida sobre las celdas libres ($\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$) y, en el mismo bucle, un relleno por inundación que etiqueta cada región
  libre con su menor índice de celda. Nunca hace una jugada mortal, prefiere una jugada cuya región libre pueda contener a la serpiente, después el camino más corto a la comida, después la región más grande; en una prueba, su campo de distancias coincide con un BFS de manual basado en cola. El entrenamiento es clonación de comportamiento (Pomerleau 1989): entropía cruzada sobre las jugadas del maestro, a partir de 54 040 estados de 192 partidas del maestro, 600 pasos de AdamW de 128 estados por modelo, con una ronda de DAgger (Ross et al. 2011) tras 360 pasos: los estudiantes juegan 48 partidas cada uno, el maestro etiqueta los 38 267 estados que alcanzan, y el entrenamiento continúa con ambos. No se hace ningún ajuste fino por aprendizaje por refuerzo; el deep Q-learning (Mnih et al. 2015) es la forma clásica de aprender estos juegos solo a partir de la recompensa, lo que llevaría mucho más tiempo en una CPU. Resultados (ejecución por defecto, 128 partidas de evaluación compartidas por
  todas las políticas: mismos inicios y misma secuencia de comida, como máximo 300 jugadas). Comida por partida, media sobre las partidas, con las dos semillas: aleatoria 0.16 (muere tras 15 jugadas); (a) densa 20.7 (20.9, 20.4); (b) Switch 20.4 (21.1, 19.6); (c) densa→top-1 18.1 (18.4, 17.8); (d) monolítica 21.7 (21.8, 21.6); maestro 31.0 (287 de 300 jugadas sobrevividas en promedio, frente a 147–179 de los estudiantes). Los estudiantes coinciden con el maestro en el 95–96 % de los estados de entrenamiento, pero puntúan un tercio menos: los pequeños errores se acumulan a lo largo de una partida, la debilidad habitual de la clonación de comportamiento. Una prueba lenta comprueba que una política entrenada supera a la aleatoria por un margen claro. Enrutamiento, mostrado incluso donde no es una especialización. Los enrutadores densos usan los cuatro expertos (cargas 0.16–0.38). Lo que mejor siguen es la propia jugada: la información mutua entre el experto enrutado y la jugada del controlador
  es de 0.51 y 0.56 bit (2 bit es el máximo posible con cuatro expertos); en la semilla 1, un experto se encarga de casi todos los giros a izquierda y derecha y de casi todos los estados sin celda libre delante, mientras los otros tres se reparten las jugadas en línea recta. Las celdas libres delante aportan 0.20–0.28 bit, la distancia a la comida 0.08–0.12 y la longitud del cuerpo 0.02–0.13 (una deriva de serpientes cortas a largas solo en la semilla 1). Así pues, los expertos se dividen según qué hacer (girar o seguir), no según una estrategia como perseguir la comida frente a evitar la cola; como la salida de un experto decide la jugada, esta división viene en parte incorporada. Los enrutadores Switch colapsaron pese a la pérdida de balanceo: la semilla 1 envía el 85 % de los estados a un experto y el 15 % a un segundo, la semilla 2 el 73 % y el 26 %, con dos expertos sin usar en cada caso; la dificultad de ruptura de simetría vista en moe_dag_pipeline aparece aquí como colapso. No cuesta
  nada en puntuación, porque un experto con la CNN compartida (que contiene la mayoría de los pesos) ya juega tan bien como cuatro. Ejecutar el enrutador entrenado en denso en top-1 (c) conserva el enrutamiento denso (0.60 y 0.67 bit con la jugada) pero pierde 2.6 piezas de comida por partida: el modelo denso combina sus expertos y no es del todo separable. Qué se sostiene y qué no. Exacto: el juego por lotes es igual al bucle de referencia, la capa enrutada con un enrutador fijo es igual a las llamadas al experto por partida, y la mezcla densa con un enrutador uniforme es la media de los expertos. Medido en un solo tamaño de tablero con dos semillas: la imitación lleva a todos los controladores a unos dos tercios del maestro, y ninguna mezcla supera al MLP simple con los mismos pesos (el MLP va por delante en aproximadamente 1 pieza de comida por partida en ambas semillas, una diferencia pequeña con dos semillas). Las mezclas de expertos compensan cuando muchos expertos contienen muchos
  más pesos de los que una sola entrada puede usar; un controlador de cuatro expertos detrás de una CNN que hace la mayor parte del trabajo demuestra el enrutamiento, no su ventaja. Trabajo relacionado. Las mezclas adaptativas de expertos locales (Jacobs, Jordan, Nowlan y Hinton 1991) introdujeron una compuerta que asigna cada caso a uno de varios expertos en competencia; la capa MoE con compuerta dispersa (Shazeer et al. 2017) y el Switch Transformer (Fedus et al. 2021, enrutamiento top-1 y la pérdida de balanceo de carga usada aquí) la escalaron. Las deep Q-networks (Mnih et al. 2015) aprendieron juegos de Atari a partir de píxeles con una CNN y solo la recompensa; ALVINN (Pomerleau 1989) condujo un vehículo imitando a un conductor humano, el origen de la clonación de comportamiento, y DAgger (Ross, Gordon y Bagnell 2011) corrige sus errores acumulados etiquetando los estados que visita el propio aprendiz. Dispositivo y límites. CPU por defecto: unos 80 s de maestro, entrenamiento y evaluación
  en una máquina de 6 núcleos ocupada (6.6 s de partidas del maestro, 6.0 s de DAgger, 53 s de entrenamiento, 16 s de evaluación) más unos 30 s para el GIF; una GPU (pixi run -e cuda) acelera la CNN pero no las muchas búsquedas pequeñas del maestro. El GIF muestra (c), cuyo enrutador usa todos los expertos y ejecuta exactamente uno por partida; routing.png muestra las tres variantes enrutadas, routing.csv y scores.csv contienen las cifras.'
meanings:
- 'el tablero de la partida $b$: 0 = vacío, si no, las jugadas hasta que esa celda del cuerpo vuelve a quedar libre (cabeza = longitud $\ell_b$, cola = 1)'
- las $B$ partidas se mueven a la vez; $d'_b = (d_b + a_b - 1) \bmod 4$ para la acción relativa $a_b$ (izquierda, recto, derecha); una pared o una celda con edad $> 1$ termina la partida (la celda de la cola, edad 1, se está desocupando)
- 'tras comer, la celda vacía con el mayor de los números uniformes generados con semilla $u_{brc}$: nunca sobre el cuerpo'
- 'lo que ve la CNN: pared, cuerpo, edad/longitud y comida, centrado en la cabeza con la dirección apuntando hacia arriba, de modo que las tres jugadas son siempre los mismos tres vecinos'
- características de la CNN; el eje de modelo $m$ (variante × semilla) se convierte en los grupos de una convolución agrupada por capa
- 'enrutador: softmax sobre los $K$ expertos, las filas suman 1'
- partida $b$ a la posición $s$ del experto $k$ (su rango entre las partidas enrutadas allí), importado de moe_dag_pipeline
- 'todos los expertos en un único producto por lotes, cada uno sobre su propio búfer de partidas: tres logits de acción'
- 'combinación; denso: $z = p_{mbk} y_{mkba}$ con cada experto en cada partida'
- 'balanceo de carga de Switch, $K \sum_k f_k P_k$: 1 cuando está equilibrado, $K$ cuando colapsa'
- 'el maestro: ninguna jugada mortal, después una jugada cuya región libre (relleno por inundación) contiene a la serpiente, después el camino más corto a la comida (búsqueda en anchura como relajación tensorial repetida)'
labels:
  grid: Tamaño del tablero $N$ (celdas)
  seeds: Semillas por variante
  experts: Expertos $K$
  steps: Pasos de entrenamiento
  balance_weight: Peso del balanceo de carga $\alpha$
  dagger: Ronda de DAgger (1 = activada)
  eval_games: Partidas de evaluación
