source_hash: 615dd7755626
title: 巨大波（非線形シュレーディンガー方程式）
summary: 集束型の非線形シュレーディンガー方程式は、深水波群や光ファイバー中の光パルスの包絡線を記述する。一様な波列は不安定である：ごく小さなさざ波が、巨大波のように背景の約3倍にそびえるピークに成長する。スプリットステップ・フーリエ法で解く：分散は $k$ 空間で厳密に、非線形性は $x$ 空間で厳密に扱う。
notes: ストラング分割：分散の半ステップ、非線形の1ステップ、分散の半ステップ。2次精度で、$N$ を丸め誤差の範囲で保存する。変調不安定性：高さ 1 の背景上で、波数 $K < 2$ の摂動が成長し、$K = \sqrt2$ で成長率 1 と最も速い。**modulation** モードでは背景は $10^{-3}$ のランダムノイズから始まる（シード固定）：ピークは $t \approx 8$ 以降に現れ、形成と消滅を繰り返す。ペレグリン・ブリーザー $\psi = \bigl[1 - \frac{4(1+2it)}{1+4x^2+4t^2}\bigr]e^{it}$ は背景から一度だけ立ち上がり、ちょうど背景の $3\times$ の高さに達して消える。**peregrine** モードは $t = -5$ からこれを開始する。**soliton** モードは形を永遠に保つ明るいソリトン $\eta\,\mathrm{sech}(\eta x)\,e^{ivx}$ を送り出す。破線は $|\psi| = 3$ を示す。長さ 60 の周期的な箱。
meanings:
- 周期格子上の複素波の包絡線（complex128）
- 分散 $i\psi_t = -\tfrac12\psi_{xx}$ の半ステップ、各フーリエモードについて厳密
- 繰り返される $l$ ⇒ 和をとる：離散フーリエ変換
- 非線形性 $i\psi_t = -|\psi|^2\psi$ の1ステップ、$|\psi|$ が変化しないので厳密
- $\int|\psi|^2$ と $\int \tfrac12|\psi_x|^2 - \tfrac12|\psi|^4$、ともに保存量
labels:
  mode: 初期状態
  noise: ノイズ振幅（modulation）
  eta: ソリトンの高さ $\eta$
  t_max: シミュレーション時間
