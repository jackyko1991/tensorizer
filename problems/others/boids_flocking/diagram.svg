<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Flocking: birds as arrows in a periodic box; bird i aligns with the neighbours inside a radius R, with a random noise angle eta added to its heading">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="bird" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- periodic box -->
    <rect x="12" y="12" width="216" height="136" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="196" y="142" font-style="italic">L</text>
    <!-- neighbourhood of bird i -->
    <circle cx="112" cy="82" r="44" fill="#93c5fd" fill-opacity="0.25" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="112" y1="82" x2="150" y2="104" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="134" y="110" font-style="italic">R</text>
    <!-- neighbours: arrows pointing roughly up-right -->
    <g stroke="#1e40af" stroke-width="2">
      <line x1="88" y1="70" x2="104" y2="60" marker-end="url(#bird)"/>
      <line x1="120" y1="56" x2="137" y2="48" marker-end="url(#bird)"/>
      <line x1="90" y1="100" x2="107" y2="92" marker-end="url(#bird)"/>
      <line x1="128" y1="92" x2="145" y2="80" marker-end="url(#bird)"/>
    </g>
    <!-- birds outside the radius -->
    <g stroke="#9ca3af" stroke-width="2">
      <line x1="30" y1="40" x2="44" y2="52" marker-end="url(#bird)"/>
      <line x1="200" y1="40" x2="186" y2="30" marker-end="url(#bird)"/>
      <line x1="30" y1="132" x2="44" y2="124" marker-end="url(#bird)"/>
      <line x1="196" y1="126" x2="212" y2="120" marker-end="url(#bird)"/>
    </g>
    <!-- bird i: mean heading (red) and noisy new heading (amber) -->
    <circle cx="112" cy="82" r="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="112" y1="82" x2="140" y2="66" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="112" y1="82" x2="132" y2="56" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="134" y="42" font-style="italic" fill="#b45309">η</text>
    <text x="98" y="78" font-style="italic">i</text>
  </g>
</svg>
