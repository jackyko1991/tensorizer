title: विद्युतचुंबकीय बौछार (EM shower)
summary: 'सीसे के गुटके से टकराता एक उच्च-ऊर्जा इलेक्ट्रॉन एक प्रपात (cascade) शुरू करता है: इलेक्ट्रॉन फ़ोटॉन विकिरित करते हैं, फ़ोटॉन इलेक्ट्रॉन–पॉज़िट्रॉन युग्मों में बदलते हैं, और हर चरण पर ऊर्जा आधी होती जाती है जब तक वह क्रांतिक ऊर्जा तक न गिर जाए। हाइटलर मॉडल को टेंसरों पर एक शाखन प्रक्रिया के रूप में अनुकरित किया जाता है — हर कण एक पंक्ति, हर विभाजन दो नई पंक्तियाँ — और यह बौछार अधिकतम $N_{max} \approx E_0/E_c$ को गहराई $t_{max} \approx \ln(E_0/E_c)/\ln 2$ पर बताता है।'
notes: 'गहराई विकिरण लंबाइयों $X_0$ में है (सीसे में 0.56 cm) और $E_c$ क्रांतिक ऊर्जा है, सीसे में लगभग 7.4 MeV। दोगुना होना तब रुकता है जब संतति कण $E_c$ से नीचे गिरने वाले हों, अतः लगभग $E_0/E_c$ कणों का अधिकतम लगभग $\log_2(E_0/E_c)$ विकिरण लंबाइयों के बाद आता है: बौछार की गहराई ऊर्जा के साथ केवल लघुगणकीय रूप से बढ़ती है, इसीलिए कैलोरीमीटर सघन हो सकते हैं। निश्चित-लंबाई मोड में हर कण ठीक एक $X_0$ के बाद विभाजित होता है, इसलिए पूरी पीढ़ी साथ चलती है और गिनती सीढ़ी की तरह चढ़ती है। प्रसंभाव्य (stochastic) मोड (धराशायी वक्र तुलना के लिए दूसरा मोड दिखाता है) हर अन्योन्यक्रिया बिंदु को यादृच्छिक रूप से चुनता है (फ़ोटॉन औसतन $\tfrac97 X_0$ चलते हैं): पीढ़ियाँ गहराई में फैल जाती हैं, जिससे वास्तविक बौछारों की निचली, चौड़ी और लंबी प्रोफ़ाइल मिलती है, जबकि ऊर्जा का लेखा-जोखा सटीक रहता है। पार्श्व फैलाव केवल दृष्टांत के लिए है (कोण धक्का $\propto E_c/E$)। हाइटलर मॉडल के सरलीकरण: समान ऊर्जा बँटवारा, $E_c$ से ऊपर कोई आयनन ह्रास नहीं, देहली से नीचे का कण अपनी सारी ऊर्जा एक बार में जमा करता है, और कोई
  कॉम्पटन प्रकीर्णन या प्रकाश-विद्युत प्रभाव नहीं। यादृच्छिक बीज (seed) स्थिर है।'
meanings:
- उड़ान में हर कण की ऊर्जा (MeV) और प्रकार (1 = e±, 0 = γ); बौछार बढ़ने पर P बदलता है
- 'प्रसंभाव्य मोड: $1 - e^{-\Delta t/\lambda}$, $\lambda = X_0$ (e±) या $\tfrac97 X_0$ (γ)'
- 'बूलियन मास्क: कौन गुणित होता है, बाकी अपनी ऊर्जा जमा करते हैं'
- e → e + γ और γ → e + e, दो जोड़े गए आधे भागों के रूप में
- हर गहराई पर उड़ान में कण
- क्रांतिक ऊर्जा से नीचे के कणों द्वारा छोड़ी गई ऊर्जा
labels:
  e0: प्राथमिक ऊर्जा $E_0$
  e_crit: क्रांतिक ऊर्जा $E_c$
  mode: विभाजन लंबाई
