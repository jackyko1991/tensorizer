title: हॉज अनुमान
summary: 'गिनती करके हॉज डायमंड निकालिए: फ़र्मा अतिपृष्ठों $x_0^d + \dots + x_{n+1}^d = 0$ के लिए हॉज संख्याएँ एक बहुपद की घात के गुणांक होती हैं, और सम्मिश्र टोरस तथा गुणनफल-समष्टियों के लिए वे बाह्य गुणनफल और कनवल्यूशन होती हैं। फिर शिओदा की कैरेक्टर-गिनती परिमेय हॉज वर्ग देती है, यानी वे वर्ग जिनके बारे में हॉज अनुमान कहता है कि वे उपविविधताओं (सबवैरायटी) से आने चाहिए। पृष्ठों के लिए यह सिद्ध लेफ़्शेत्स $(1,1)$ प्रमेय है, और पृष्ठ पर स्थित रेखाएँ इसे दिखाती हैं। उच्चतर विमाओं में यह अनुमान अभी खुला है; यह पृष्ठ केवल वर्गों की गिनती करता है।'
notes: 'किसी संहत (कॉम्पैक्ट) केलर बहुरूपता पर हर कोहोमोलॉजी वर्ग $(p, q)$ प्रकार के टुकड़ों में बँट जाता है: $p$ होलोमॉर्फ़िक और $q$ ऐंटीहोलोमॉर्फ़िक दिशाएँ (हॉज, 1941)। संख्याएँ $h^{p,q}$ हॉज सममिति $h^{p,q} = h^{q,p}$ और सेर द्वैतता $h^{p,q} = h^{n-p,n-q}$ को संतुष्ट करती हैं, और बाईं ओर का हर डायमंड दोनों जाँचें पास करता है। इनका एकांतर योग ऑयलर अभिलक्षण है, जो घात-$d$ अतिपृष्ठ के लिए $((1-d)^{n+2} - 1)/d + n + 2$ के बराबर है। डायमंड इसे दोबारा प्राप्त करता है, साथ ही K3 क्वार्टिक के लिए $h^{1,1} = 20$, क्विंटिक त्रिविम बहुरूपता के लिए $h^{2,1} = 101$ और क्यूबिक चतुर्विम बहुरूपता के लिए $h^{3,1} = 1$ भी। सहविमा $p$ की एक उपविविधता $Z$ प्रकार $(p, p)$ का एक परिमेय वर्ग परिभाषित करती है। हॉज अनुमान (हॉज 1950; क्ले मिलेनियम प्राइज़ समस्याओं में से एक) कहता है कि हर परिमेय $(p, p)$ वर्ग ऐसे वर्गों का एक परिमेय संयोजन है। क्या सिद्ध है: $p = 1$ लेफ़्शेत्स $(1,1)$ प्रमेय (1924) से, और इसलिए $p = n-1$ हार्ड लेफ़्शेत्स प्रमेय से। यह अधिकतम 3 विमा वाली आबेली विविधताओं, यूनिरूल्ड चतुर्विम बहुरूपताओं
  और क्यूबिक चतुर्विम बहुरूपताओं (कोंते–मुर्रे, त्सुकर) के लिए भी सत्य है, तथा कई विशेष स्थितियों में भी, जिनमें अनेक घातों की फ़र्मा विविधताएँ शामिल हैं (शिओदा 1979, रान 1980)। पूर्णांक संस्करण असत्य है (अतिया–हिर्त्सेब्रुख़, 1962)। फ़र्मा विविधताओं के लिए शिओदा के कैरेक्टर परिमेय हॉज वर्गों को गिनने योग्य बना देते हैं, हर गैल्वा संयुग्मी के लिए एक शर्त के साथ। पृष्ठों के लिए यह गिनती पिकार संख्या है: $d = 3, 4, 5, 6$ के लिए $7, 20, 37, 86$, और जब $\gcd(d, 6) = 1$ हो तब $3(d-1)(d-2) + 1$। पृष्ठ पर स्थित $3d^2$ रेखाएँ स्पष्ट बीजीय वर्ग देती हैं, और उनका प्रतिच्छेदन आव्यूह (जिसकी रैंक और हॉज-सूचकांक चिह्नक $(1, \rho - 1)$ यहाँ गणना की जाती है) $\mathbb Q$ पर इन सभी को ठीक तब जनित करता है जब $d \le 4$ हो या $\gcd(d, 6) = 1$ हो। $d = 6, 8, 9, 10$ के लिए अन्य वक्रों की ज़रूरत होती है, जिनका अस्तित्व लेफ़्शेत्स से सिद्ध है। फ़र्मा चतुर्विम बहुरूपताओं के लिए प्रोग्राम हॉज वर्गों को गिनता है, लेकिन उनमें से हर एक बीजीय है या नहीं, यही तो स्वयं अनुमान है। स्थिति (नवंबर 2026): खुला। OpenAI द्वारा
  प्रकाशित AI-जनित पांडुलिपि-संग्रह (github.com/openai/math, फ़ैमिली 032) हर CM आबेली विविधता के लिए परिमेय हॉज अनुमान का दावा करता है और उस कथन के Lean औपचारिकीकरण की सूचना देता है। यह एक बिना समीक्षा (अनरेफ़री) वाला, मशीन द्वारा बनाया गया दावा है जो गणितीय समुदाय द्वारा सत्यापन की प्रतीक्षा में है, और यदि सही भी हो तो यह एक विशेष वर्ग को ही समेटता है, सामान्य अनुमान को नहीं।'
meanings:
- 'बहुपदों का गुणन गुणांक-सदिशों का कनवल्यूशन है, $n+2$ बार दोहराया गया: फ़र्मा बहुपद के जैकोबियन वलय का एकपदी आधार $x^b$, $0 \le b_i \le d-2$'
- 'ग्रिफ़िथ्स: आदिम मध्य हॉज संख्याएँ घात $(q+1)d - (n+2)$ में जैकोबियन वलय हैं'
- 'एक सम्मिश्र टोरस: $dz$ का $\wedge^p$ गुणा $d\bar z$ का $\wedge^q$'
- 'क्युनेथ: वर्गों का हर युग्म, सेल $(a + c, b + d)$ में जोड़ा गया'
- 'शिओदा के कैरेक्टर: $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$; हर एक आदिम कोहोमोलॉजी की एक रेखा $V(a)$ को चिह्नित करता है'
- 'दोहराया गया $i$ ⇒ योग: हर गैल्वा संयुग्मी $t\cdot a$ का हॉज प्रकार एक साथ'
- 'एक परिमेय हॉज वर्ग: हर संयुग्मी के लिए प्रकार $(\frac n2, \frac n2)$'
- दो रेखाएँ तभी और केवल तभी मिलती हैं जब $\mathbb C^4$ में उन्हें जनित करने वाले चार सदिश रैखिकतः आश्रित हों; संयोजन सूत्र (ऐडजंक्शन) से $L^2 = 2-d$
- 'रेखाओं द्वारा जनित जालक की रैंक, और उसका चिह्नक (हॉज सूचकांक प्रमेय: ठीक एक धनात्मक आइगेनमान)'
labels:
  d_max: सबसे बड़ी घात $d$
  n_max: विमा $n$ तक ऑयलर जाँच
  g_max: विमा $g$ तक टोरस
