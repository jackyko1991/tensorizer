title: 閾値以下での量子誤り訂正
summary: ビット反転繰り返し符号は、一つの論理ビットを $d$ 個のノイズのある量子ビットに分散させ、そのパリティを測定し続ける。何千ものモンテカルロショットを一つの $(S, R, d)$ テンソルとして実行し、厳密な最小重み復号器が時空間のシンドローム履歴を読み取る。$d = 3, 5, 7, 9$ の曲線は閾値で交差する：閾値以下では $d \to d + 2$ の各ステップで論理誤り率が因子 $\Lambda > 1$ で割られる。これが Google による 2024 年の閾値以下の表面符号メモリの背後にある量である。
notes: この符号は $\lvert 0_L\rangle = \lvert 00\ldots0\rangle$ と $\lvert 1_L\rangle = \lvert 11\ldots1\rangle$ を保存する。パリティ検査 $Z_jZ_{j+1}$ は、論理値を明かさずに隣どうしが食い違う場所を明らかにする。符号容量モデル（1 ラウンド、完全な検査）では最良の復号器は多数決であり、シミュレーションした $P_L$ は厳密な二項分布の裾（破線）に従い、閾値はちょうど $p = 1/2$ である。現象論的モデルでは検査も誤読するので、単一のシンドロームは信頼できない。復号器は $d$ ラウンドの履歴全体を説明する、データ反転と誤読の最少の組み合わせを探す。これは最小重み完全マッチングが解く問題であり、1 次元ではここで $2^d$ 個の誤りパターンについての動的計画法で厳密に解く（したがって $d \le 11$）。このモデルの閾値は $p \approx 10\%$ 付近（非常に大きな $d$ では約 10.3 %）であり、各符号を $d$ ラウンド実行すると小さな $d$ での交差はその近くに来る。閾値以下では大きな符号が勝ち、$\Lambda = \varepsilon_d/\varepsilon_{d+2}$ は $p$ が下がるにつれて（おおよそ $p_{th}/p$ のように）増加する。閾値以上では、量子ビットを増やしても失敗する箇所が増えるだけである。研究の背景：Google Quantum AI and Collaborators, Quantum error correction below the surface code threshold, Nature 638, 920（2025; arXiv:2408.13687, 2024）は Willow プロセッサ上で距離 3、5、7 の表面符号メモリを動作させ、$\Lambda \approx 2.1$、距離 7 の論理誤りがサイクルあたりおよそ 0.14 % であると報告した（概算値）。それ以前の段階として、繰り返し符号（Nature 595, 383, 2021）と、距離 5 の表面符号が距離 3 をわずかに上回った実験（Nature 614, 676, 2023）がある。繰り返し符号と表面符号の違い：繰り返し符号はビット反転（$X$
  誤り）だけを訂正する 1 次元の列であり、どの量子ビットの位相反転（$Z$）も論理誤りになるので、完全な量子メモリではない。表面符号は $Z$ 型と $X$ 型の両方の検査をもつ 2 次元格子で、両方を訂正する。その復号グラフは 3 次元（空間 2 次元と時間）で閾値はより低く、この現象論的ノイズでは約 3 %、現実的な回路ノイズではおよそ 1 % である（概算）。単純化：独立な誤り、完全な最終読み出し、リークや相関したバースト誤りなし。実際のデバイスではこれらが論理誤り率の下限を決める。
meanings:
- ショット $s$、ラウンド $t$ におけるデータ反転（確率 $p$）と検査の誤読（確率 $q$）
- ラウンド $t$ 後のデータ量子ビット $i$ の累積誤り
- 検査 $j$ は隣接する $i = j$ と $i = j + 1$ を比較（$Z_jZ_{j+1}$）
- $i$ の繰り返し ⇒ 和：各検査が報告すべきパリティ
- 変化したシンドロームビット：時空間における誤り連鎖の端
- 誤りパターン $x$ で終わる最安の履歴、$w = \ln\frac{1-p}{p}$。$y$ についての最小値は $d$ 個の 1 ビット反転
- 多数決：検査が誤読しないときの最適な復号器
- ラウンドあたりの誤り抑制、$1 - 2P_L = (1 - 2\varepsilon)^R$
labels:
  model: ノイズモデル（検査の誤読あり／なし）
  d_max: 最大距離 $d$（11 は遅い）
  shots: $(d, p)$ 点あたりのショット数
  n_p: 誤り率 $p$ の個数
  p_min: 最小の $p$
  p_max: 最大の $p$
  q_ratio: 誤読率 $q/p$
