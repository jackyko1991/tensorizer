source_hash: c27c115f2935
title: 奇點作為投影的摺疊
summary: 這是一個推測性的假說，並非已確立的物理：彎曲時空是平直高維空間中一個曲面的影子，而奇點是這個影子摺疊之處。首先檢驗已知的幾何。Flamm 拋物面，以及 Fronsdal 在 1959 年把整個 Schwarzschild 時空嵌入六維平直空間的做法，都能精確還原度規（autograd），而 Kretschmann 純量 $12r_s^2/r^6$ 也由同一套自動微分得出。投影後的片層以普適的密度指數摺疊：摺疊為 $-1/2$，尖點為 $-2/3$。摺疊形狀的內部使外部保持精確的 Schwarzschild 解，因此它隱藏在視界之後。這裡的任何東西都無法直接觀測。
notes: 投影假說的第 4 步（見系列說明），這是作者的推測性假說，並非已確立的物理。第 1 步（cosmology/projection_postulate）提出公設 P4：彎曲時空是平直高維嵌入投影後的形狀，而奇點是投影摺疊之處（其 Jacobian 降秩）。第 3 步（cosmology/projection_dimension_budget）計算維度，第 5 步（cosmology/projection_bell_test）檢驗測量公設，第 6 步（cosmology/projection_telescope_tests）探討望遠鏡能檢驗什麼。平直維度的數目 $D$ 保持開放：它在這裡是一個參數，從不進入任何結果。先看已知的幾何。(a) Flamm（1916）：將 Schwarzschild 的赤道切片 $t = $ const、$\theta = \pi/2$ 畫在平直的 $\mathbb R^3$ 中，就是拋物面 $z = 2\sqrt{r_s(r-r_s)}$，其誘導度規 $dr^2/(1-r_s/r) + r^2d\phi^2$ 吻合到 $10^{-16}$。(b) Fronsdal（Phys. Rev. 116, 778, 1959）把整個 Schwarzschild 時空，包括視界內部，嵌入平直的 $\mathbb R^{1,5}$。誘導度規 $\eta_{AB}\partial_iz^A\partial_jz^B$（Jacobian 由 autograd 求得）在外部和內部，以及在跨越視界的 Kruskal 座標中，都與 Schwarzschild 吻合到 $10^{-13}$。彎曲的四維幾何確實可以看作平直空間中的曲面；這是 P4 的依據。有兩個事實對 P4 很重要。嵌入在視界處是滿秩的：在 $(t, r)$ 座標中看到的降秩在 Kruskal 座標中消失了。在 $r\to0$ 處它也不摺疊；它跑向無窮遠，$z^2\approx-2r_s^{3/2} r^{-1/2}$。由同一套自動微分（Christoffel 符號、Riemann 張量、einsum 縮併）計算的曲率給出 $K = R_{abcd}R^{abcd} = 12r_s^2/r^6$，精確到 $10^{-15}$。靜態潮汐本徵值為 $+r_s/r^3$（徑向拉伸）與 $-r_s/2r^3$（側向擠壓），全部在
  $r = 0$ 處發散。把 P4 的主張具體化：平直 $\mathbb R^D$ 中的一個光滑片層，透過投影觀看時，其影子的密度在摺疊焦散處發散。突變理論（Thom、Arnold）指出這個指數是普適的。映射 $x = s^n$ 給出 $\rho\propto|x|^{1/n-1}$，測得 $-0.500$（摺疊）、$-0.667$（尖點）與 $-0.750$（$n = 4$）。球面 $S^k$ 投影到 $\mathbb R^3$ 上時，具有邊緣密度 $u^{(k-3-1)/2}$，測得 $-0.51$、$0.00$、$+0.45$（分別對應 $k = 3, 4, 5$），對任何 $D$ 皆然。因此，密度尖峰需要一個維度恰好與屏幕相同的片層；更厚的片層給出光滑的影子。動畫將一個波浪狀片層逐漸傾斜，直到它在 $a\tan\alpha > 1$ 時摺疊。與廣義相對論比較：讓質量 $M = r_s/2$ 具有三維球面影子的密度 $\rho\propto(1-r^2/R^2)^{-1/2}$，這是一個弱場的粗略模型，不是愛因斯坦方程的解。在 $R$ 之外，場恰好是 $r_s/r^3$（Birkhoff 定理、殼層定理），而中心保持有限。發散移到摺疊殼層上，並在密度與潮汐場中軟化為 $(R-r)^{-1/2}$，曲率代理量 $8\sum E^2$ 則軟化為 $(R-r)^{-1}$，而不是廣義相對論的 $r^{-3}$ 與 $r^{-6}$。片層本身保持有限的曲率 $1/R^2$。坦白的結論。P4 可以讓經過嚴格檢驗的外部 Schwarzschild 幾何保持不變，只改變內部，但正是這一點使它無法檢驗：當 $R < r_s$ 時，摺疊位於視界之後，任何來自它的訊號都無法到達我們。普適指數只在描述上是新的，因為視界之外沒有任何東西依賴於它們。位於視界之外的摺疊（$R > r_s$）將是一個沒有視界的緻密天體，具有不同的光子環與回波；這正是第 6 步用黑洞陰影所檢驗的。背景：fluids/blowup_profile_search 展示了奇異剖面及其指數在實際中是如何研究的（自相似假設、指數搜尋）。維基百科：Schwarzschild 度規、突變理論。
meanings:
- 以自動微分求得的嵌入 Jacobian，每個取樣點 $b$ 一個
- 誘導度規：重複的嵌入指標 $A, C$ 與平直度規 $\eta = $ diag$(-1, 1, 1, 1, 1, 1)$ 一起求和
- 額外的嵌入座標，是對 $q$ 的 64 節點 Gauss–Legendre 求和（在 $\ell = \ln s$ 中進行），對 $r$ 可微；它趨向 $-\infty$，行為如 $r^{-1/2}$
- 最小奇異值：映射的摺疊就是它降到 0、Jacobian 降秩之處
- 由度規的 autograd 導數得到的 Christoffel 符號；對 $d$ 求和
- 由第二次前向模式導數與兩次 einsum 乘積得到的 Riemann 張量（對 $e$ 求和）
- Kretschmann 純量，對全部四個指標求和；在視界內外都等於 $12r_s^2/r^6$
- 均勻片層在 $x = s^n$ 下的影子密度（摺疊 $n = 2$，尖點 $n = 3$），以對數分箱的直方圖表示
- 以半徑 $R$ 的三維球面影子方式分佈的質量的牛頓潮汐張量（弱場粗略模型）
labels:
  fold_radius: 摺疊殼層的半徑 $R$
  sheet_amplitude: 波浪狀片層的振幅 $a$
  D: 容納球面片層的平直維度 $D$（開放）
  samples: 每個片層上的取樣點數
