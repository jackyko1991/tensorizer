<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="UMAP: points in high dimension joined by a weighted k-nearest-neighbour graph are laid out in 2D, where graph edges attract and random pairs repel">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- high-dimensional data: a curved sheet with its kNN graph -->
    <path d="M10,110 C30,40 70,30 96,62" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g stroke="#374151">
      <line x1="16" y1="96" x2="24" y2="76" stroke-width="2.5"/>
      <line x1="24" y1="76" x2="36" y2="60" stroke-width="2.5"/>
      <line x1="36" y1="60" x2="52" y2="50" stroke-width="1.2"/>
      <line x1="52" y1="50" x2="68" y2="48" stroke-width="2.5"/>
      <line x1="68" y1="48" x2="84" y2="54" stroke-width="1.2"/>
      <line x1="24" y1="76" x2="40" y2="78" stroke-width="1.2"/>
      <line x1="40" y1="78" x2="36" y2="60" stroke-width="2"/>
      <line x1="52" y1="50" x2="56" y2="68" stroke-width="1.2"/>
      <line x1="56" y1="68" x2="68" y2="48" stroke-width="2"/>
    </g>
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <circle cx="16" cy="96" r="4"/><circle cx="24" cy="76" r="4"/><circle cx="36" cy="60" r="4"/>
      <circle cx="52" cy="50" r="4"/><circle cx="68" cy="48" r="4"/><circle cx="84" cy="54" r="4"/>
      <circle cx="40" cy="78" r="4"/><circle cx="56" cy="68" r="4"/>
    </g>
    <text x="40" y="32" font-style="italic">w<tspan font-size="10" dy="3">ij</tspan></text>
    <text x="10" y="132" font-size="12" fill="#374151">kNN graph in ℝ<tspan font-size="9" dy="-5">D</tspan></text>
    <!-- arrow to the layout -->
    <line x1="104" y1="74" x2="128" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 2D layout: attraction along an edge, repulsion from a random point -->
    <rect x="136" y="20" width="96" height="100" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <line x1="160" y1="80" x2="196" y2="64" stroke="#374151" stroke-width="2"/>
    <line x1="166" y1="77" x2="178" y2="72" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="190" y1="67" x2="182" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="160" y1="80" x2="214" y2="104" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="156" y1="82" x2="146" y2="90" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="160" cy="80" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <circle cx="196" cy="64" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <circle cx="214" cy="104" r="5" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
    <text x="152" y="70" font-style="italic">y<tspan font-size="10" dy="3">i</tspan></text>
    <text x="198" y="56" font-style="italic">y<tspan font-size="10" dy="3">j</tspan></text>
    <text x="196" y="40" font-style="italic">q<tspan font-size="10" dy="3">ij</tspan></text>
    <text x="146" y="138" font-size="12" fill="#374151">layout in ℝ<tspan font-size="9" dy="-5">2</tspan></text>
  </g>
</svg>
