source_hash: 28a44bb1dca2
title: 'Pesar Sgr A*: la órbita de la estrella S2'
summary: 'La estrella S2 da una vuelta al centro de la Vía Láctea cada 16 años y pasa a menos de 120 UA de una masa invisible. Se ajusta una órbita kepleriana, con la ecuación de Kepler resuelta mediante iteraciones de Newton vectorizadas, a 25 años de posiciones y velocidades radiales reales. Levenberg–Marquardt, con jacobianos obtenidos por autograd, parte de 64 puntos iniciales aleatorios a la vez y recupera un agujero negro de unas $4.3\times 10^6\,M_\odot$ a $R_0 \approx 8.3$ kpc. Después, el ajuste predice los dos efectos relativistas que GRAVITY detectó más tarde: unos 200 km/s de corrimiento al rojo en el pericentro y $12''$ de precesión por órbita.'
notes: 'Desde principios de los años noventa, dos equipos, dirigidos por Reinhard Genzel (MPE, telescopios de ESO) y Andrea Ghez (UCLA, Keck), siguen las estrellas del segundo de arco central de la Galaxia. S2 es la estrella más brillante con una órbita corta. Su elipse de 16 años fija la masa encerrada en un volumen demasiado pequeño para contener otra cosa que un agujero negro. Las posiciones dan el tamaño angular y el periodo de la órbita, y las velocidades radiales (desplazamientos Doppler de las líneas espectrales) su tamaño real en km. Juntas proporcionan la distancia $R_0$ y, mediante la tercera ley de Kepler, la masa. El modelo tiene 8 parámetros: seis elementos orbitales más $M$ y $R_0$ (el periodo se deduce de $P^2 = 4\pi^2(aR_0)^3/GM$). El ajuste usa Levenberg–Marquardt con jacobianos de autograd, lanzado a la vez desde muchas órbitas iniciales aleatorias. Muchas caen en mínimos locales, por eso hace falta un lote de puntos de partida, y se conserva el mejor $\chi^2$. La ecuación
  de Kepler se resuelve con iteraciones de Newton sobre tensores desacoplados (detached) y un último paso dentro del grafo de cálculo, de modo que autograd ve la derivada implícita exacta. Resultado con los valores por defecto: $M \approx 4.32 \pm 0.15 \times 10^6\,M_\odot$, $R_0 \approx 8.35 \pm 0.12$ kpc, $P \approx 16.03$ años, $e \approx 0.884$, con $\chi^2 \approx 336$ para 334 datos. Valores publicados: $4.28 \pm 0.10 \pm 0.21 \times 10^6\,M_\odot$ y $8.32 \pm 0.07 \pm 0.14$ kpc a partir de 17 estrellas (Gillessen et al. 2017). El ajuste predice después dos efectos relativistas que no incluye. En el pericentro (120 UA, 7700 km/s, 2.6 % de $c$), el corrimiento al rojo gravitacional más el efecto Doppler transversal añaden unos 200 km/s; GRAVITY midió $f = 0.90 \pm 0.09\,(\mathrm{stat}) \pm 0.15\,(\mathrm{sys})$ de ese valor de la RG tras el pericentro de mayo de 2018 (GRAVITY Collaboration 2018). La órbita además precesa $6\pi GM/(c^2a(1-e^2)) \approx 12''$ por revolución, medido como
  $f_{SP} = 1.10 \pm 0.19$ veces el valor de la RG (GRAVITY Collaboration 2020). Son detecciones citadas, no calculadas a partir de estos datos: la tabla de 2016 termina antes del pericentro de 2018. Simplificaciones: una órbita de Kepler pura, sin retardo de Rømer (tiempo de viaje de la luz a través de la órbita, unos 8 días), sin términos relativistas y sin deriva del sistema de referencia (el artículo ajusta 5 parámetros adicionales del sistema de referencia). Datos: Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), tabla 5 de datos de S2 del catálogo VizieR/CDS J/ApJ/837/30 (doi:10.26093/cds/vizier.18370030), usada con cita según las condiciones de uso del CDS. Premios: Premio Shaw de Astronomía 2008 (Genzel), Premio Crafoord de Astronomía 2012 (Genzel y Ghez) y Premio Nobel de Física 2020 (la mitad para Genzel y Ghez, por el descubrimiento de un objeto compacto supermasivo en el centro de nuestra galaxia).'
meanings:
- 'una órbita por punto de partida: $a$, $e$, $i$, $\Omega$, $\omega$, $t_p$, $M$, $R_0$'
- anomalía excéntrica por iteraciones de Newton, para todas las órbitas y épocas a la vez
- plano orbital → (norte, este, línea de visión), construido con einsum
- 'suma sobre $j$: posición de S2 en UA; dividida por $R_0$ da mas en el cielo'
- 'velocidad a lo largo de la línea de visión en km/s: es lo que fija $R_0$'
- (modelo − datos)/$\sigma$ para 145 RA, 145 Dec y 44 velocidades
- autograd en modo directo, vectorizado (vmap) sobre las 8 direcciones de parámetros
- un paso de Levenberg–Marquardt para todos los puntos de partida a la vez
- '$6\pi GM/(c^2a(1-e^2))$: precesión de Schwarzschild, $\approx 12''$ para S2'
labels:
  n_starts: Órbitas iniciales aleatorias
  n_iter: Pasos de Levenberg–Marquardt
  seed: Semilla aleatoria
