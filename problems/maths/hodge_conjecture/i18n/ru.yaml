title: Гипотеза Ходжа
summary: 'Вычисляем ромбы Ходжа подсчётом: для гиперповерхностей Ферма $x_0^d + \dots + x_{n+1}^d = 0$ числа Ходжа являются коэффициентами степени многочлена, а для комплексных торов и произведений — внешними произведениями и свёртками. Затем подсчёт характеров Сиоды даёт рациональные классы Ходжа — те классы, которые, согласно гипотезе Ходжа, должны происходить из подмногообразий. Для поверхностей это доказанная теорема Лефшеца о классах типа $(1,1)$, и прямые на поверхности это демонстрируют. В старших размерностях гипотеза открыта; эта страница лишь подсчитывает классы.'
notes: 'На компактном кэлеровом многообразии каждый класс когомологий распадается на части типа $(p, q)$: $p$ голоморфных и $q$ антиголоморфных направлений (Ходж, 1941). Числа $h^{p,q}$ удовлетворяют симметрии Ходжа $h^{p,q} = h^{q,p}$ и двойственности Серра $h^{p,q} = h^{n-p,n-q}$, и каждый ромб слева проходит обе проверки. Их знакопеременная сумма равна эйлеровой характеристике, которая для гиперповерхности степени $d$ равна $((1-d)^{n+2} - 1)/d + n + 2$. Ромб воспроизводит её, а также $h^{1,1} = 20$ для квартики K3, $h^{2,1} = 101$ для трёхмерной квинтики и $h^{3,1} = 1$ для кубического четырёхмерного многообразия. Подмногообразие $Z$ коразмерности $p$ задаёт рациональный класс типа $(p, p)$. Гипотеза Ходжа (Ходж, 1950; одна из задач тысячелетия Института Клэя) утверждает, что каждый рациональный класс типа $(p, p)$ является рациональной комбинацией таких классов. Что доказано: случай $p = 1$ — теоремой Лефшеца о классах типа $(1,1)$ (1924), а значит, и $p = n-1$ — по сильной теореме
  Лефшеца. Гипотеза верна также для абелевых многообразий размерности не выше 3, для унилинейчатых четырёхмерных многообразий и кубических четырёхмерных многообразий (Конте–Мурре, Цукер) и во многих частных случаях, включая многообразия Ферма многих степеней (Сиода 1979, Ран 1980). Целочисленная версия неверна (Атья–Хирцебрух, 1962). Для многообразий Ферма характеры Сиоды делают рациональные классы Ходжа перечислимыми: по одному условию на каждое сопряжение Галуа. Для поверхностей это число Пикара: $7, 20, 37, 86$ при $d = 3, 4, 5, 6$ и $3(d-1)(d-2) + 1$, когда $\gcd(d, 6) = 1$. $3d^2$ прямых на поверхности дают явные алгебраические классы, и их матрица пересечений (её ранг и сигнатура по теореме Ходжа об индексе $(1, \rho - 1)$ вычисляются здесь) порождает их все над $\mathbb Q$ ровно тогда, когда $d \le 4$ или $\gcd(d, 6) = 1$. При $d = 6, 8, 9, 10$ нужны другие кривые, которые существуют по Лефшецу. Для четырёхмерных многообразий Ферма программа подсчитывает классы Ходжа, но является
  ли каждый из них алгебраическим — это и есть сама гипотеза. Статус (ноябрь 2026): открыта. Собрание сгенерированных ИИ рукописей, опубликованное OpenAI (github.com/openai/math, семейство 032), заявляет доказательство рациональной гипотезы Ходжа для любого абелева многообразия с комплексным умножением (CM) и сообщает о формализации этого утверждения в Lean. Это не прошедшее рецензирование, созданное машиной утверждение, ожидающее проверки математическим сообществом, и даже если оно верно, оно охватывает частный класс, а не общую гипотезу.'
meanings:
- 'умножение многочленов — это свёртка векторов коэффициентов, повторённая $n+2$ раз: мономиальный базис $x^b$, $0 \le b_i \le d-2$, якобиева кольца многочлена Ферма'
- 'Гриффитс: примитивные средние числа Ходжа — это якобиево кольцо в степени $(q+1)d - (n+2)$'
- 'комплексный тор: $\wedge^p$ от $dz$, умноженное на $\wedge^q$ от $d\bar z$'
- 'Кюннет: каждая пара классов, просуммированная в клетку $(a + c, b + d)$'
- 'характеры Сиоды: $1 \le a_i \le d-1$, $\sum a_i \equiv 0 \bmod d$; каждый нумерует прямую $V(a)$ примитивных когомологий'
- 'повторяющийся $i$ ⇒ суммирование: тип Ходжа каждого сопряжённого по Галуа $t\cdot a$ сразу'
- 'рациональный класс Ходжа: тип $(\frac n2, \frac n2)$ для каждого сопряжённого'
- две прямые пересекаются тогда и только тогда, когда четыре порождающих их вектора в $\mathbb C^4$ линейно зависимы; $L^2 = 2-d$ по формуле присоединения
- 'ранг решётки, порождённой прямыми, и её сигнатура (теорема Ходжа об индексе: ровно одно положительное собственное значение)'
labels:
  d_max: Наибольшая степень $d$
  n_max: Проверка Эйлера до размерности $n$
  g_max: Торы до размерности $g$
