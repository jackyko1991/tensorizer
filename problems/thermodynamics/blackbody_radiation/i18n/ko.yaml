source_hash: 7be6ce46bf01
title: 흑체 복사
summary: 플랑크 법칙은 모든 파장에서 열복사의 에너지 밀도를 줍니다. 온도의 열과 파장의 행을 브로드캐스팅하면 $(T, \lambda)$ 스펙트럼 표 전체를 한 줄로 만들 수 있습니다. argmax로 빈의 봉우리를 찾고, torch.trapezoid로 스펙트럼을 적분해 슈테판–볼츠만 $T^4$ 법칙을 얻습니다.
notes: 파장 격자는 10 nm에서 100 µm까지 로그 간격이며, 빠진 꼬리가 적분을 $10^{-5}$ 미만으로만 바꿀 만큼 넓습니다. 정확도를 위해 float64와 expm1로 계산합니다. 빈 상수 $b \approx 2.898\times 10^{-3}$ m·K는 argmax에서 격자 해상도(약 0.2 %) 수준으로 나옵니다. 곡선의 색은 빨강, 초록, 파랑을 대표하는 세 파장에서 스펙트럼을 표본화한 것입니다. 실제 색 맞춤 계산을 대충 흉내 낸 것이지만, 빛이 주황색에서 흰색을 거쳐 옅은 파란색으로 바뀌는 것을 보여 줍니다. 그래프는 매 프레임 크기를 다시 맞춥니다. 봉우리 높이는 $T^5$처럼 커집니다. 음영 띠는 가시광선 영역 380–750 nm를 표시합니다.
meanings:
- 온도 배치, 열로
- 파장 격자, 행으로
- 열과 행을 브로드캐스팅하면 표 전체가 채워짐
- 모든 스펙트럼의 빈 봉우리를 한 번에
- '반복된 $b$ ⇒ 합: 전체 에너지 밀도, $\propto T_a^4$'
- '610, 550, 465 nm에서의 플랑크 값을 정규화: 대략적인 가시광 색'
labels:
  T_min: 처음 온도
  T_max: 최종 온도
  n_temps: 온도 수 (프레임)
