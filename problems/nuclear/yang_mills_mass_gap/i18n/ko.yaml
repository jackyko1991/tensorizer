source_hash: 1bffd0a0cc18
title: 격자 위의 양–밀스 이론과 질량 간극
summary: '클레이 밀레니엄 문제는 질량 간극 $\Delta > 0$을 갖는 4차원의 엄밀한 양자 양–밀스 이론을 요구하며, 이 문제는 미해결입니다. 윌슨(Wilson)의 격자 게이지 이론은 이 질문을 계산 가능하게 만듭니다: 단위 사원수로 저장된 링크 $U_\mu(x) \in SU(2)$(또는 $U(1)$)를 메트로폴리스(Metropolis) 알고리즘으로 결합 상수 $\beta$들의 배치 전체에 대해 한꺼번에 갱신합니다. 윌슨 고리는 가둠의 넓이 법칙을 보여 주고, 플라켓은 정확한 2차원 베셀 비율 및 강결합 급수와 일치하며, 글루볼 상관 함수는 격자 질량 추정값을 제공합니다.'
notes: '상태: 미해결. 클레이 문제(재프와 위튼의 공식 설명)는 임의의 콤팩트 단순 게이지 군에 대해 와이트먼 또는 오스터발더–슈라더 공리 같은 공리를 만족하는 $\mathbb R^4$ 위의 양자 양–밀스 이론을 구성하고, 그 스펙트럼이 진공 위에 간극 $\Delta > 0$을 가짐을 증명하라고 요구합니다. $SU(3)$의 격자 시뮬레이션은 약 $1.7$ GeV의 가장 가벼운 글루볼과 가둠(선형 퍼텐셜, 측정된 끈 장력)을 합리적인 의심의 여지 없이 보여 주지만, 유한한 격자 간격에서의 수치적 증거는 증명이 아닙니다. 이 페이지는 같은 틀에서 장난감 규모로 작동합니다. 2차원에서는 이론이 정확히 풀립니다: 모든 플라켓이 독립이며, $U(1)$에 대해 $\langle\frac12\mathrm{Tr}P\rangle = I_1(\beta)/I_0(\beta)$, $SU(2)$에 대해 $I_2(\beta)/I_1(\beta)$이고, $W(R,T) = u^{RT}$가 정확히 성립합니다(시험). 강결합(작은 $\beta$)에서는 지표 전개가 어떤 차원에서든 같은 선도 값과 끈 장력 $\sigma = -\ln u$를 갖는 넓이 법칙을 줍니다: 그 영역에서 가둠은 증명되었고(오스터발더–자일러 1978), 3차원 콤팩트 $U(1)$에 대해서는 모든 $\beta$에서 증명되었습니다(괴퍼트–마크 1982). 어려운 부분은 4차원에서 격자 간격이 0으로 가는 약결합 $\beta \to \infty$까지의 연속성이며, 점근적 자유성(그로스, 윌첵, 폴리처, 2004년 노벨상)은 바로 그곳에 연속체 극한이 있다고 말합니다. 크로이츠 비율 $\chi(R,R)$은 둘레 항이 상쇄되도록 고리들의 비율로부터 $\sigma$를 추정합니다. 글루볼 연산자는 한 시간 단면 위의 공간 플라켓들의 합이며, 그 연결 상관 함수는 $e^{-m\Delta}$처럼 감소합니다. 강결합에서 두 플라켓을 잇는 가장 작은 곡면은 $4\Delta$개의 면으로 된 관이어서 $a\,m \approx -4\ln u$를
  줍니다. 더 큰 $\beta$에서는 격자 단위의 질량이 작아져 더 큰 격자, 스미어링, 훨씬 많은 스윕이 필요합니다. 4차원 $U(1)$은 $\beta \approx 1.01$ 근처에서 가둠 해제 전이를 가지며 그 위에서는 질량 간극이 없기 때문에, 이 문제는 비가환 군에 대해 서술됩니다. 걸음 크기 $\propto 1/\sqrt{\beta}$의 메트로폴리스는 수락률을 약 절반으로 유지하며, 오차는 20개의 잭나이프 구간을 사용합니다.'
meanings:
- 배치 안의 각 결합 상수 $\beta_b$에 대해 링크마다 단위 사원수 하나; $U(1)$은 부분군 $(\cos\theta, 0, 0, \sin\theta)$
- 군 연산 법칙; 반복되는 $i, j$ ⇒ 합산(외적)
- '주기적 격자 위의 이웃: 모든 격자점의 모든 플라켓을 한꺼번에'
- 가장 작은 윌슨 고리; $\frac12\mathrm{Tr}(ab) = a_0b_0 - a_kb_k$
- '$2(D-1)$개 스테이플의 합: $U_\mu(x)$를 포함하는 $S$의 부분은 $-\beta\frac12\mathrm{Tr}(U_\mu A_\mu)$'
- 한 방향과 한 체커보드 홀짝성의 모든 링크에 대해 한꺼번에 메트로폴리스 수행(이들은 스테이플을 공유하지 않음)
- $R\times T$ 직사각형을 도는 링크 선들의 곱, 격자점·평면·방향에 대해 평균
- $I_1/I_0$은 $U(1)$에 대해, $I_2/I_1$은 $SU(2)$에 대해:2차원에서 정확한 $\langle\frac12\mathrm{Tr}P\rangle$, 임의의 $D$에서 선도 차수
- 공간 플라켓 연산자의 $\ln C(\Delta)/C(\Delta+1)$, 잭나이프 오차 포함
labels:
  group: 게이지 군
  dim: 차원 $D$
  size: 격자 크기 $L$ (한 변당 격자점 수)
  beta: 고리와 글루볼의 결합 상수 $\beta$
  sweeps: 몬테카를로 스윕 수
