source_hash: b20963373157
title: 얇은 렌즈가 만드는 상
summary: 얇은 렌즈 방정식은 물체의 상이 어디에 얼마나 크게 생기는지 알려 줍니다. 모든 물체 위치에 대해 세 주광선을 한꺼번에 추적하는 동안, 물체는 $2f$ 바깥에서 초점 거리 안쪽으로 이동하고 거꾸로 선 실상은 바로 선 허상으로 바뀝니다.
notes: 거리는 렌즈에서 잽니다. 물체는 $x = -s$에, 실상은 $x = +s'$에 있습니다. 세 주광선은 (1) 축에 평행하게 들어와 먼 쪽 초점을 지나는 광선, (2) 중심을 곧게 지나는 광선, (3) 가까운 쪽 초점을 지나 평행하게 나가는 광선입니다. 모두 규칙 하나 $\theta' = \theta - y/f$에서 나옵니다. $f$ 안쪽에서는 광선이 렌즈를 지난 뒤 퍼지며, 점선 연장선이 허상에서 만납니다. $s = f$에서 상은 무한대로 달아납니다.
meanings:
- 애니메이션 프레임 $k$에서의 물체 거리
- 상 거리; 음수 ⇒ 물체 쪽에 생기는 허상
- 상의 높이 / 물체 높이; 음수 ⇒ 거꾸로 선 상
- 렌즈 앞에서 주광선 $r \in \{\text{parallel, centre, focal}\}$의 기울기
- 각 주광선이 렌즈를 지나는 위치
- '렌즈 뒤의 기울기: 모든 광선이 $-y/f$만큼 꺾임'
labels:
