source_hash: c17ad8b19789
title: 'Телескопические проверки проекции: гравитационные волны, тени чёрных дыр и сверхновые'
summary: 'Спекулятивная гипотеза, а не установленная физика, сопоставленная с открытыми астрономическими данными. Если гравитация видит больше чем $3+1$ измерений, гравитационные волны ослабевают быстрее, чем $1/d$; если искривлённое пространство-время — тень сложенной проекции, то складка за пределами фотонной сферы увеличила бы тень чёрной дыры. GW170817 вместе с расстоянием до родительской галактики даёт $D = 4.00^{+0.07}_{-0.25}$, тени M87* и Sgr A* по данным EHT допускают складку лишь в пределах примерно $2.3$ шварцшильдовских радиусов, а сверхновые Pantheon+ не могут отличить «протекающую» (DGP) Вселенную от $\Lambda$CDM. Всё согласуется с общей теорией относительности в $3+1$: любые дополнительные измерения должны быть такими, которых гравитация на этих масштабах не чувствует.'
notes: 'Статус: спекулятивно. Это собственная гипотеза автора (см. описание серии), а не установленная физика. Шаг 6 гипотезы проекции — шаг наблюдений. Шаг 1 (cosmology/projection_postulate) сформулировал постулаты и показал, что правило Борна сохраняется лишь в случае, неотличимом от стандартной квантовой механики; шаги 2–5 (projection_one_particle, projection_dimension_budget, projection_singularity_fold, projection_bell_test) разрабатывают P3, P5, P4 и P1-P2. Этот шаг подгоняет к открытым данным свободные параметры P4 (геометрия как проекция, способная складываться) и P5 (гравитации нужно некоторое $d_G$, подогнанное, а не предполагаемое) и показывает вердикт, каким бы он ни оказался. Сначала известная физика. В общей теории относительности в $3+1$ измерениях амплитуда деформации (strain) гравитационной волны убывает как $1/d$; в $D$ пространственно-временных измерениях её энергия распределяется по $(D-2)$-сфере и $h\propto d^{-(D-2)/2}$. Детектор, предполагающий $1/d$, выводит $d_{GW}
  = d_*(d_{EM}/d_*)^{(D-2)/2}$ ($d_* = 1$ Мпк, как у Pardo, Fishbach, Holz и Spergel 2018) или, если утечка начинается лишь за масштабом экранирования $R_c$, $d_{GW} = d_{EM}[1 + (d_{EM}/R_c)^{n(D-4)/2}]^{1/n}$ (их экранированная форма, имеющая смысл при $D > 4$). Предсказание гипотезы: если на больших расстояниях гравитация растекается в дополнительные измерения, то $d_{GW} > d_{EM}$ и $D > 4$. Проверка (a): GW170817, слияние нейтронных звёзд с оптическим двойником в NGC 4993. Данные: 8078 апостериорных выборок светимостного расстояния по гравитационным волнам из релиза GWTC-1 (data/gw170817_distance.csv; LIGO Scientific and Virgo Collaborations, априорное распределение с малым спином, положение на небе свободно; GWOSC, лицензия CC BY 4.0; Abbott et al. 2019, PRX 9, 031040). Априорное распределение анализа $\propto d^2$, поэтому каждая выборка взвешивается с $d^{-2}$, а ядерная оценка плотности даёт функцию правдоподобия $d_{GW}$ (опубликованное значение $40^{+8}_{-14}$ Мпк, Abbott et al.
  2017). Электромагнитные расстояния (data/em_distances.csv, цитируемые числа): флуктуации поверхностной яркости $40.7\pm1.4\pm1.9$ Мпк (Cantiello et al. 2018, ApJL 854, L31, по умолчанию) и расстояния по хаббловскому потоку, использованные Pardo et al.: $v_H = 3017\pm250$ км/с, делённое на $H_0 = 73.24\pm1.74$ (SH0ES) или $67.74\pm0.46$ км/с/Мпк (Planck). Результат: $D = 4.00^{+0.07}_{-0.25}$ (68%, SBF; подгонка через autograd даёт $4.00\pm0.11$), $3.98^{+0.09}_{-0.24}$ (SH0ES) и $3.94^{+0.08}_{-0.24}$ (Planck). Pardo et al. получили $4.02^{+0.07}_{-0.10}$ (SH0ES) и $3.98^{+0.07}_{-0.09}$ (Planck); их нижняя ошибка меньше, потому что они фиксировали положение на небе по двойнику и использовали апостериорное распределение $H_0$ от LVC, тогда как приложенные здесь выборки имеют свободное положение на небе, и вырождение расстояние–наклонение оставляет более длинный хвост в сторону малых расстояний. Для экранированной утечки условие $-2\ln[\mathcal L(R_c)/\mathcal L_{GR}] > 2.71$ исключает
  $R_c$ меньше нескольких сотен Мпк при $D = 5$, $n = 1$ и меньше примерно 50-80 Мпк при значениях от $n = 2$ до 5; плавные переходы (малое $n(D-4)/2$) исключены вплоть до края сетки в $10^4$ Мпк. Pardo et al. приводят $R_c\gtrsim 20$ Мпк для любой крутизны, исходя из апостериорного распределения, а не из отношения правдоподобий. Вердикт (a): гравитация ведёт себя как $D = 4.0$ с точностью примерно $\pm0.1$ вплоть до 40 Мпк; любые дополнительные измерения, которые видит гравитация, компактны или экранированы за пределами этих расстояний. Проверка (b): тени чёрных дыр. В метрике Шварцшильда фотонная сфера находится при $r = 3GM/c^2$, а радиус тени равен $b_c = \sqrt{27}\,GM/c^2$; здесь он вычисляется и как $\min_r r/\sqrt{f}$, и трассировкой лучей $u'''' = -u + \tfrac32 u^2$ для пакета прицельных параметров. Вращение уменьшает эквивалентный по площади радиус тени не более чем на 7% (кривая Бардина; $2(1+\sqrt2)\,GM/c^2$ для экстремальной дыры, наблюдаемой с полюса). Складка — модельный выбор
  автора, уточнённый здесь: P4 утверждает, что сингулярность — это место, где проекция складывается; предположим, что спроецированная геометрия шварцшильдова вплоть до складки на радиусе $r_f$ и что свет, достигший складки, никогда не возвращается. Складка внутри фотонной сферы ($r_f\leq 1.5\,r_s$) оставляет тень неизменной; складка снаружи делает краем тени луч, который её касается, $b = r_f/\sqrt{1 - r_s/r_f}$, так что $\delta = b/b_c - 1 > 0$. Данные (data/eht_shadows.csv, цитируемые числа): кольцо M87* $42\pm3$ $\mu$as и $GM/(Dc^2) = 3.8\pm0.4$ $\mu$as (EHT 2019, Papers I и VI) против $3.64\pm0.22$ $\mu$as из звёздной динамики (Gebhardt et al. 2011, $6.6\pm0.4\times10^9\,M_\odot$ на расстоянии 17.9 Мпк), так что $\delta = +0.04\pm0.13$ (вычислено здесь, не опубликованное значение); кольцо Sgr A* $51.8\pm2.3$ $\mu$as (EHT 2022, Paper I) и $\delta = -0.04^{+0.09}_{-0.10}$ (априорное распределение Keck) и $-0.08\pm0.09$ (априорное распределение VLTI) из Paper VI, Table 2. Если взять $\delta
  + 2\sigma$ и позволить вращению скрыть до 7%, складка может увеличить тень не более чем на 0.37 (M87*), 0.21 (Keck) и 0.17 (VLTI), так что $r_f\leq 2.86$, $2.40$ и $2.28\,r_s$. Вердикт (b): тени соответствуют Шварцшильду/Керру; складка за пределами примерно $2.3\,r_s$ исключена, но складка внутри фотонной сферы, куда P4 естественно её поместила бы (на горизонте или в центральной сингулярности), невидима для изображений теней. Проверка (c, необязательная): сверхновые. В бран-мире DGP гравитация утекает в пятое измерение за пределами $r_c$, и расширение подчиняется $H^2 - H/r_c\propto\rho$; индекс $\alpha$ Dvali и Turner интерполирует ($E^2 = \Omega_m(1+z)^3 + (1-\Omega_m)E^\alpha$, $\alpha = 0$ — это $\Lambda$CDM, $\alpha = 1$ — DGP). Данные: таблица Pantheon+ из cosmology/cosmological_constant_fit, скопированная в data/pantheon_plus.csv (1466 сверхновых, $z > 0.01$, диагональные ошибки; Scolnic et al. 2022, Brout et al. 2022; у файлов данных Pantheon+ нет указанной лицензии, статьи — CC
  BY 4.0). Результат (равномерные априорные распределения, $-1\leq\alpha\leq 1.8$): $\alpha = 0.44\pm0.71$; $\chi^2 = 639.5$ для $\Lambda$CDM и $638.9$ для DGP (оба значительно меньше числа сверхновых, потому что диагональные ошибки включают диагональ ковариационной матрицы). Вердикт (c): одни лишь сверхновые не могут отличить «протекающую» Вселенную от $\Lambda$CDM; самоускоряющуюся ветвь DGP исключает именно комбинация с реликтовым излучением (CMB) и барионными акустическими осцилляциями (например, Fang et al. 2008, Phys. Rev. D 78, 103509), которая здесь заново не подгоняется. Общий вердикт для P4 и P5: каждая проверка согласуется с общей теорией относительности в $3+1$ измерениях. Гипотеза выживает, только если измерения сверх $3+1$ — такие, которых гравитация на этих масштабах не чувствует (компактные, экранированные или присутствующие лишь в квантовом секторе шагов 1 и 5), и если любая складка лежит внутри фотонной сферы. Это ограничение, а не подтверждение: пока что серия не нашла
  предсказания, которое отличалось бы от стандартной физики и согласовывалось бы с данными.'
meanings:
- 8078 выборок расстояния GW170817 (GWTC-1); $w_i = d_i^{-2}$ устраняет априорное распределение, равномерное по объёму
- 'повторяющийся $i$ (выборки) ⇒ суммируется: ядерная оценка плотности $d_{GW}$, нормированная функция правдоподобия'
- расстояние, которое выводит детектор, когда гравитация растекается в $D_a$ измерений, для каждого электромагнитного расстояния $d_j$
- апостериорное распределение $D$, маргинализированное по электромагнитному расстоянию ($j$ суммируется, метод трапеций)
- 'подгонка через autograd: шаги Ньютона по $\log p(D)$, ошибка из второй производной (Лаплас)'
- фотонные орбиты $u = r_s/r$ сразу для $B$ прицельных параметров и $F$ радиусов складки (RK4 по $\varphi$)
- относительное увеличение тени от складки при $r_f$ (ноль внутри фотонной сферы)
- уменьшение тени Керра (кривая Бардина, эквивалентный по площади радиус) для спинов $a$ и наклонений
- $\chi^2$ сверхновых для каждого индекса утечки $\alpha_a$ и $\Omega_{m}$, смещение ($H_0$, $M$) исключено; $i$ суммируется
labels:
  em_distance: Электромагнитное расстояние до NGC 4993, используемое для вердикта
  D_screen: Размерность $D$ за масштабом экранирования (экранированная утечка)
  n_screen: Крутизна $n$ перехода экранирования
  inc_max_sgra: Наибольшее наклонение Sgr A* для полосы спина
