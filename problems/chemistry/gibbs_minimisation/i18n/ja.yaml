source_hash: 955b219d37d6
title: ギブズエネルギー最小化による化学平衡
summary: メタン–空気の炎から何が出てくるか？$T$ と $P$ が一定のとき、生成物はすべての元素の保存 $A_{ij} n_j = b_i$ のもとでギブズエネルギー $G = \sum_j n_j \mu_j$ が最小になるところに落ち着く。バッチ化したニュートン法（RAND 法）で 10 種の化学種を広い温度範囲について一度に解き、気体が熱くなるにつれて CO₂ と H₂O が CO、H₂、OH、H、O に分解する様子を示し、断熱火炎温度を求める。
notes: なぜ $G$ を最小化するのか？$T$ と $P$ が一定なら、熱力学第二法則により閉じた系はギブズエネルギーを下げることしかできない。したがって平衡は、すべての原子を保ちながら $G$ が最も低くなる点、すなわち制約付き最小化である。ラグランジュ乗数 $\pi_i$（元素ごとに一つ）を用いると条件は $\mu_j/RT = \sum_i \pi_i A_{ij}$ となる：各化学種の化学ポテンシャルは、その原子の「元素ポテンシャル」の和である。これは平衡定数のリスト（反応ごとに一つ）を全化学種にわたる一つの最適化で置き換えるもので、NASA CEA、STANJAN、Cantera などのコードが炎、ロケット排気、大気を計算する方法である。ここでのソルバーは Gordon–McBride 形式（NASA RP-1311）の RAND 法である：$\ln n_j$ についてのニュートン法を、$\pi_i$ と $\Delta\ln n_{tot}$ についての小さな $(E{+}1)\times(E{+}1)$ 系に縮約し、主要化学種の変化が一ステップあたり最大 $e^2$ 倍になるよう刻みを制限する。対数で計算するので、モル分率 $10^{-30}$ の微量化学種も正かつ正確に保たれる。コンソールには二つの最適性チェック（元素収支と $\mu_j/RT = \pi_i A_{ij}$、いずれも機械精度程度）と自動微分チェックが表示される：torch で $G/RT$ を微分すると $\pi_i A_{ij}$ が返ってくる。注目点：約 1500 K 以下では生成物は CO₂、H₂O、N₂ だけ（希薄燃焼なら O₂ も）だが、2000 K を超えると解離する（CO₂ → CO + ½O₂、H₂O → OH + ½H₂、さらに原子へ）。エントロピー項 $-T\,S$ が結合エンタルピーに勝つからである。解離は熱を吸収するので、平衡火炎は生成物が解離しない場合より約 100 K 低温になり（右下）、最も熱い炎は化学量論比よりわずかに燃料過濃側で燃える。$P$ を上げるとルシャトリエの原理が見える：分子数の少ない側が有利になり、解離が抑えられる。データ：$\Delta_f H^\circ$(298 K) と $S^\circ$(298 K) は NIST-JANAF
  表の丸めた値である。熱容量は例示的な定数（298 K から 2000 K までのおおよその平均 $c_p$）で、$T$ の関数として表にしたものではないので、組成は半定量的である：このモデルでは 1 bar の化学量論メタン–空気で $T_{ad} \approx 2260$ K となるが、正確な熱化学データでは約 2225 K である。単純化：理想気体、凝縮相なし（すすも液体の水もない）、生成物に CH₄ などの炭化水素なし、そして平衡のみ：実際の炎では CO と NO は熱力学ではなく反応速度論によって凍結される。
meanings:
- 化学種 $j$（CO₂、H₂O、CO、H₂、O₂、N₂、OH、H、O、NO）に含まれる元素 $i$（C、H、O、N）の原子数
- CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂) によって供給される原子数、当量比 $\varphi$ ごとに一行
- バッチ：各温度は独立な最小化で、まとめて解く
- $\Delta_f H^\circ$、$S^\circ$ と一定の $c_p$ から求めた $[H_j(T) - T S_j(T)]/RT$
- $j$ の繰り返し ⇒ 和：各混合物のギブズエネルギー
- 存在する各元素の原子数；解では $b_i$ に等しい
- $j$ について和：ニュートン行列、各行で重み付きの $A\,\mathrm{diag}(n)\,A^{\mathsf T}$
- 温度ごとに小さな $(E{+}1)\times(E{+}1)$ 系を一つ、一回の呼び出しですべて解く
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$、$i$ について和；NASA CEA と同様に減衰させる
- 自動微分チェック：最小点では $\pi_{bi}A_{ij}$ に等しい（ラグランジュ条件）
- 生成物のエンタルピー；反応物のエンタルピーに等しくなるまで $T$ について二分法：$T_{ad}$
labels:
  phi: 当量比 $\varphi$（燃料 / 化学量論燃料）
  P_bar: 圧力 $P$
  T_max: 掃引の最高温度
