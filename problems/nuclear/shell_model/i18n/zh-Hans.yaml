source_hash: f7213dbb7c33
title: 原子核壳模型
summary: 核子在伍兹–萨克森势阱中独立运动。把每个 $(l, j)$ 道的径向薛定谔方程作为一批有限差分哈密顿量求解，并逐渐增大自旋–轨道力，幻数 2、8、20、28、50、82、126——特别稳定原子核的核子数——就作为能级图中最大的能隙出现。
notes: 没有自旋–轨道耦合时，能级像三维谐振子那样成簇，能隙出现在 2、8、20 和 40 个核子之后（伍兹–萨克森势阱的平底还分出 58、92 和 138）。自旋–轨道项使 $j = l + \tfrac12$ 降低、$j = l - \tfrac12$ 升高，幅度随 $l$ 增大，所以每个谐振子壳中高 $j$ 的成员（1f7/2、1g9/2、1h11/2、1i13/2）降入下一个壳——这就是迈耶和延森 1949 年对 28、50、82 和 126 的解释。默认参数对应 ²⁰⁸Pb 中的中子：$V_0 = 51 - 33(N-Z)/A \approx 44$ MeV，$r_0 = 1.27$ fm，$a = 0.67$ fm。简化：所有能级使用同一个固定势阱（无自洽、无对关联），没有库仑项（因此是中子能级），盒子大小为 18 fm，因此只显示束缚能级。
meanings:
- 内部格点；在 $r = 0$ 和盒子边界处 $u = 0$
- 有限差分 $d^2/dr^2$
- 直到 $l = 8$ 的每个道 $(l, j = l \pm \tfrac12)$
- $j = l+\tfrac12$ 时为 $+l/2$，$j = l-\tfrac12$ 时为 $-(l+1)/2$
- 势阱 + 自旋–轨道 + 离心势，用 einsum('k,i->ki') 计算
- 每个道一个哈密顿量，堆叠起来
- 对 $k$ 批量计算；保留束缚能级 $E < 0$
- 填充到每个排序能级的核子数：幻数位于大能隙处
labels:
  v_so: 最终自旋–轨道强度 $V_{so}$
  v0: 势阱深度 $V_0$
  mass_number: 质量数 $A$（决定 $R = r_0 A^{1/3}$）
  diffuseness: 表面弥散度 $a$
  n_grid: 格点数
