<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A CNN reads a digit image, a connector turns its features into soft prefix tokens that replace the first word of an LM prompt such as +two=, and the LM writes the answer; below, the training DAG: CNN and LM trained side by side, then the connector, then a global fine-tune">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- the image: a hand-drawn 7 -->
    <rect x="8" y="14" width="30" height="30" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <path d="M14,21 L32,21 L21,39" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <!-- CNN -->
    <path d="M46,14 L74,20 L74,38 L46,44 z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <text x="49" y="33" font-size="11">CNN</text>
    <!-- connector: the DAG edge -->
    <line x1="76" y1="29" x2="96" y2="29" stroke="#dc2626" stroke-width="2.5" marker-end="url(#red)"/>
    <text x="72" y="56" font-size="11" fill="#b91c1c">connector</text>
    <!-- LM input row: soft prefix tokens then text -->
    <g stroke="#b45309" stroke-width="1.5" fill="#f59e0b">
      <rect x="99" y="22" width="9" height="14" rx="2"/><rect x="110" y="22" width="9" height="14" rx="2"/>
    </g>
    <text x="124" y="34" font-size="12">+two=</text>
    <rect x="96" y="8" width="96" height="34" rx="4" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="134" y="20" font-size="11">LM</text>
    <line x1="194" y1="29" x2="206" y2="29" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="208" y="33" font-size="12" font-style="italic">nine</text>
    <!-- training DAG -->
    <line x1="8" y1="72" x2="232" y2="72" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g stroke="#1e40af" stroke-width="1.5" fill="#93c5fd">
      <rect x="10" y="84" width="46" height="20" rx="4"/><rect x="10" y="122" width="46" height="20" rx="4"/>
      <rect x="86" y="103" width="58" height="20" rx="4"/><rect x="170" y="103" width="60" height="20" rx="4"/>
    </g>
    <text x="17" y="98" font-size="12">CNN</text><text x="21" y="136" font-size="12">LM</text>
    <text x="90" y="117" font-size="11">connector</text><text x="174" y="117" font-size="11">fine-tune</text>
    <g stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="56" y1="94" x2="84" y2="108"/>
    </g>
    <g stroke="#dc2626" stroke-width="2" marker-end="url(#red)">
      <line x1="56" y1="132" x2="84" y2="118"/><line x1="144" y1="113" x2="168" y2="113"/>
    </g>
    <text x="10" y="157" font-size="11" fill="#6b7280">level 0</text>
    <text x="96" y="140" font-size="11" fill="#6b7280">level 1</text>
    <text x="180" y="140" font-size="11" fill="#6b7280">level 2</text>
  </g>
</svg>
