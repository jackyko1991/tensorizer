source_hash: 2cd1c41299f8
title: 都卜勒超音波：測量血流
summary: 超音波探頭聆聽紅血球的回波。每個移動的血球都會使回波頻率偏移 $f_D = 2 f_0 v \cos\theta / c$，跳動動脈中的數百個血球以一批相量（phasor）同時模擬。短時傅立葉轉換（STFT）把它們疊加的回波變成掃描儀上顯示的都卜勒頻譜圖：整個心動週期中血流速度的分布。
notes: 因子 2 的來源是頻移發生了兩次：移動的血球先接收到頻移後的波，再在移動中把它重新發射出去。只有沿聲束方向的速度分量才算數，所以在 $\theta = 90°$ 時完全沒有頻移；掃描儀需要操作者輸入角度，再計算 $v = f_D c / (2 f_0 \cos\theta)$，角度超過約 60° 時結果會非常不確定。使用預設值（$f_0 = 5$ MHz、$\theta = 60°$、峰值 1 m/s）時，收縮期頻移約為 3.2 kHz，正好落在可聽範圍內，這也是都卜勒儀器會把訊號播放成聲音的原因。層流的速度剖面是拋物線形：靠近管壁的血球幾乎不動，中心線上的最快。由於截面上相等的面積含有相等數目的血球，0 到 $v_{\max}$ 之間的每個速度出現的機會都相同，頻譜是一條平坦的帶（「填滿」的頻窗），平均頻率恰好是最大值的一半。紊流或狹窄處的血流則會使頻譜變寬。脈衝都卜勒每個脈衝只取樣一次回波，因此根據奈奎斯特定理，它只能測量 $|f_D| < \mathrm{PRF}/2$：降低 PRF（或提高流速），收縮期峰值就會繞到負頻率一側（混疊，aliasing）。實際的掃描儀測量高速射流需要高 PRF，但探測深部血管需要低 PRF，因為每個脈衝都必須在下一個發射前返回。簡化：取樣容積涵蓋整條血管、聲束均勻、IQ 訊號直接在基頻模擬，且沒有管壁濾波器或組織雜波。所有數值皆為近似值，僅供教學使用，不可用於臨床。
meanings:
- 兩次心跳中的中心線速度：收縮期峰值、短暫逆流、緩慢的舒張期血流
- 隨機紅血球：在血管中的半徑、回波相位與強度
- 拋物線（層流）剖面乘以波形：外積，沒有指標被求和
- 每個血球在每個脈衝時的都卜勒頻移 $2 f_0 v \cos\theta / c$
- 重複的 $n$ ⇒ 求和：接收到的回波，每個脈衝一個複數（IQ）樣本，間隔 $\Delta t = 1/\mathrm{PRF}$
- 頻譜圖：時間窗 $k$ 中頻率 $f$ 的功率
- 脈衝都卜勒只能看到折回 $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$ 內的 $f$
labels:
  f0: 發射頻率 $f_0$
  theta: 聲束與血流夾角 $\theta$
  v_peak: 收縮期峰值速度
  prf: 脈衝重複頻率 PRF
  heart_rate: 心率
  n_scatterers: 模擬的紅血球數
