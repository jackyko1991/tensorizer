source_hash: 0b5328cbe1c8
title: 水波槽干涉
summary: 两个振子在水面上同步上下振动，发出圆形水波。二维波动方程以拉普拉斯算子作为 $3\times3$ 卷积核（conv2d）推进，阻尼边界吸收外传的波，干涉图样稳定为静止的节线，那里的光程差为半波长的奇数倍。
notes: 单位：网格尺寸 $h = 1$，波速 $c = 1$。时间上采用蛙跳格式，阻尼项取中心形式，因此每一步是显式的。在节线上，一个波源的水波总比另一个晚半个周期到达，因而相互抵消；虚线是双曲线 $|r_1 - r_2| = (m + \tfrac12)\lambda$，在离波源足够远处与右图中的暗线吻合。两波源间距大于 $\lambda$ 时会出现更多节线。边界是粗糙的吸收层（摩擦层），而非完美匹配层，所以仍有少量反射。右图显示 $u^2$ 的滑动平均；最初几个周期是波充满水槽的瞬态。
meanings:
- 网格单元 $(a, b)$ 处的水面高度
- 五点拉普拉斯卷积核，偏移 $\alpha, \beta \in \{-1, 0, 1\}$
- 重复的 $\alpha, \beta$ ⇒ 求和：卷积核在网格上滑动
- 内部为零，在吸收边界中平滑上升
- 两个同相振荡的小高斯波源
- 库朗数超过 $1/\sqrt2$ 会被拒绝（格式会发散）
- $u^2$ 在约一个周期内的滑动平均：暗线即节点
labels:
  wavelength: 波长 $\lambda$
  separation: 波源间距 $d$
  courant: 库朗数 $c\,\Delta t/h$
  t_max: 模拟时长
