<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Self-similar blow-up: a wave profile steepens at x = 0 as t approaches T; every snapshot is the same profile U rescaled by tau to the power lambda in height and tau to the power 1 plus lambda in width">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes -->
    <line x1="20" y1="80" x2="226" y2="80" stroke="#374151" stroke-width="2"/>
    <line x1="120" y1="18" x2="120" y2="146" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="214" y="96" font-style="italic">x</text>
    <text x="126" y="28" font-style="italic">u</text>
    <!-- snapshots: early (light), later, near T (dark, steep) -->
    <path d="M24,44 C60,46 90,52 120,80 C150,108 180,114 216,116" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <path d="M24,52 C70,54 100,56 120,80 C140,104 170,106 216,108" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M24,60 C80,61 112,60 120,80 C128,100 160,99 216,100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- steepening slope at the origin -->
    <line x1="113" y1="56" x2="127" y2="104" stroke="#f59e0b" stroke-width="2"/>
    <text x="134" y="66" font-size="12" fill="#b45309">|u<tspan font-size="9" dy="3">x</tspan><tspan dy="-3">| ~ 1/τ</tspan></text>
    <!-- time arrow -->
    <line x1="48" y1="132" x2="96" y2="132" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="150" font-size="12" fill="#b91c1c">t → T,  τ = T − t</text>
    <!-- self-similar variable -->
    <text x="150" y="140" font-size="13" font-style="italic">y = x/τ<tspan font-size="9" dy="-6">1+λ</tspan></text>
    <text x="30" y="30" font-size="13" font-style="italic">u = τ<tspan font-size="9" dy="-6">λ</tspan><tspan dy="6"> U(y)</tspan></text>
  </g>
</svg>
