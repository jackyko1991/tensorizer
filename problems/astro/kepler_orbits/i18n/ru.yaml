title: Законы Кеплера
summary: 'Планеты с разными размерами и эксцентриситетами орбит обращаются вокруг звезды под действием ньютоновского притяжения по закону обратных квадратов. Одно пакетное интегрирование RK4 демонстрирует все три закона Кеплера: эллипсы со звездой в фокусе, равные площади за равные времена и $T^2 \propto a^3$.'
notes: 'Единицы — а. е., годы и массы Солнца, поэтому $GM_\odot = 4\pi^2$, а третий закон Кеплера записывается просто как $T^2 = a^3$. Каждая планета стартует из перигелия со скоростью из формулы vis-viva $v_p = \sqrt{(GM/a)(1+e)/(1-e)}$. Каждый закрашенный сектор самой вытянутой орбиты проходится за одно и то же время $T/12$: короткий и широкий вблизи звезды, длинный и узкий вдали, но всегда одной площади, поскольку $dA/dt = L/2$, а $L$ сохраняется. Период измеряется в модели как время поворота на $2\pi$. Звезда считается неподвижной (её масса намного больше массы планет), и планеты не притягивают друг друга.'
meanings:
- положение планеты $b$ относительно звезды, $i \in \{x, y\}$
- скорость планеты $b$
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния $r_b^2$'
- притяжение к звезде по закону обратных квадратов
- двумерный символ Леви-Чивиты, $\varepsilon_{xy} = 1 = -\varepsilon_{yx}$
- момент импульса на единицу массы; $dA/dt = L_b/2$ постоянна
- $\tfrac12 v^2 - GM/r$; даёт $a = -GM/2E$
labels:
  n_planets: Планеты
  e_max: Наибольший эксцентриситет $e$
