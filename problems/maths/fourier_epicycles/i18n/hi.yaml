source_hash: e9d43436470c
title: अधिचक्रों से चित्र बनाना
summary: सम्मिश्र संख्याओं $z_n = x_n + i\,y_n$ के रूप में नमूना लिए गए किसी बंद वक्र का एक असतत फूरिए रूपांतरण $c_k$ होता है, और हर पद $c_k e^{2\pi i k t}$ त्रिज्या $|c_k|$ का एक वृत्त है जो एक चक्कर में $k$ बार घूमता है। सबसे बड़े वृत्त से शुरू करके वृत्तों को सिरे से सिरा जोड़ दें, तो कलम वक्र को फिर से खींच देती है। देखिए कि जैसे-जैसे वृत्त जुड़ते हैं, Tensorizer लोगो की रूपरेखा उभरती है, और त्रुटि ठीक उतनी ही घटती है जितनी पारसेवल भविष्यवाणी करता है।
notes: 'DFT आव्यूह $W$ योग को पूरा लिखता है ($N^2$ गुणनफल); `torch.fft.fft` वही $c_k$ कूली–टूकी तीव्र फूरिए रूपांतरण से $O(N \log N)$ में देता है, और एक परीक्षण जाँचता है कि दोनों मेल खाते हैं। DFT व्युत्क्रमणीय है: सभी $N$ वृत्त $N$ नमूनों को ठीक-ठीक दोहराते हैं, और समय-विस्थापन $z_{n-s}$ केवल $c_k$ को कला $e^{-2\pi i k s/N}$ से गुणा करता है (त्रिज्याएँ नहीं बदलतीं, केवल आरंभ बिंदु बदलता है)। एक बार खींचे गए वृत्त के लिए एक ही पद ($k = 1$) चाहिए, और हृदय $x = 16\sin^3 s$, $y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$ एक त्रिकोणमितीय बहुपद है, इसलिए ठीक 8 वृत्त ($k = \pm1 \dots \pm4$) इसे पूर्णतः खींच देते हैं। बहुभुज अलग हैं: हर कोने पर वेग अचानक बदलता है, इसलिए $|c_k|$ केवल $1/k^2$ की तरह घटता है और $M$ वृत्तों के साथ त्रुटि $M^{-3}$ की तरह; कम वृत्तों पर कोने गोल हो जाते हैं और भुजाओं के साथ-साथ लहरदार दोलन चलते हैं। वक्र स्वयं संतत है, इसलिए (फूरिए श्रेणी वाली समस्या की वर्ग तरंग के विपरीत, जहाँ फलन उछलता है) ये दोलन घटकर शून्य हो जाते हैं; 9 % का गिब्स ओवरशूट वेग में रहता है, जो वास्तव
  में उछलता है। सबसे बड़े वृत्तों को पहले रखने से त्रुटि एकदिष्ट रूप से घटती है, क्योंकि पारसेवल के अनुसार त्रुटि ठीक-ठीक छोड़े गए वृत्तों पर $\sum|c_k|^2$ के बराबर है। इतिहास: टॉलेमी के खगोलशास्त्र (अल्मागेस्ट, दूसरी शताब्दी) में ग्रह एक वृत्त (अधिचक्र) पर चलते थे जिसका केंद्र दूसरे वृत्त (वाहक वृत्त) पर घूमता था; पर्याप्त अधिचक्रों से किसी भी आवर्ती बंद पथ को मिलाया जा सकता है, इसीलिए यह प्रणाली सही भौतिकी न होते हुए भी 1400 वर्षों तक प्रेक्षणों से इतनी अच्छी तरह मेल खाती रही। लोगो का पथ Tensorizer घन की षट्भुज रूपरेखा और उसके तीन भीतरी किनारे हैं, जिन पर जाकर वापस आया जाता है। कम वृत्तों के साथ तारा आज़माइए।'
meanings:
- समान समय-अंतरालों $t_n = n/N$ पर सम्मिश्र संख्याओं के रूप में वक्र; बहुभुजों का चाप-लंबाई के अनुसार पुनः नमूनाकरण किया जाता है
- DFT आव्यूह, आवृत्तियाँ $k = -N/2 \dots N/2 - 1$
- 'दोहराया गया $n$ ⇒ योग: वृत्त $k$ की त्रिज्या $|c_k|$ और आरंभिक कोण $\arg c_k$ है'
- 'त्रिज्या के अनुसार क्रमित वृत्त: शृंखला सबसे बड़े वृत्तों को पहले रखती है'
- 'दोहराया गया $k$ ⇒ योग: $M_m$ सबसे बड़े वृत्तों द्वारा खींचा गया वक्र, सभी $M$ के लिए एक साथ ($K_{mk} = [r_k < M_m]$, $E_{tk} = e^{2\pi i k t}$)'
- 'पदों का संचयी योग: शृंखला के हर वृत्त का केंद्र, अंतिम वाला कलम है'
- नमूनों पर माध्य वर्ग त्रुटि, जो छोड़े गए वृत्तों की ऊर्जा के बराबर है (पारसेवल)
labels:
  shape: वक्र
  n_points: नमूने $N$
  max_terms: वृत्तों की अधिकतम संख्या $M$
