source_hash: 07db7a3fd274
title: 箱中粒子與染料的顏色
summary: 為什麼較長的共軛分子吸收較紅的光？花青染料的 $\pi$ 電子沿著鏈自由移動，就像長度為 $L$ 的一維箱中的粒子。把能階 $E_n \propto n^2/L^2$ 兩兩填滿，得到 HOMO→LUMO 能隙 $\Delta E = h^2(N+1)/8m_eL^2$，並同時預測整個同系列的 $\lambda_{max}$；以 torch.linalg.eigh 對角化的批次有限差分 Hamiltonian 重現了解析能階。
notes: Kuhn 的自由電子模型（1948）把共軛鏈的 $\pi$ 電子視為箱中的獨立粒子。在花青染料 $\mathrm{R_2N{-}(CH{=}CH)_k{-}CH{=}N^+R_2}$ 中，正電荷由兩個氮共享，因此鏈上所有鍵長幾乎相等（約 $l = 0.139$ nm），平底箱是很好的圖像。有 $2k + 2$ 個鍵、$N = 2k + 4$ 個電子，且箱子在每個氮外再延伸一個鍵，則 $L = (2k + 4)l$，而 $\lambda_{max} = 8m_ec\,L^2/h(N + 1)$ 幾乎隨 $k$ 線性增長：模型預測每增加一個 CH=CH 單元約增加 125 nm，而紅色方塊（最簡單花青染料的四捨五入實測值）每次約上升 100 nm。這是經典的大學部實驗：記錄幾種鏈長遞增的花青染料的可見光譜，再用 $\lambda_{max}$ 擬合箱長或端點延伸。數值求解器給出相同的能階，誤差小於 $10^{-3}$（其誤差以 $(n\,\Delta x)^2$ 下降），而且它能做到公式做不到的事：加入位勢。多烯具有交替的雙鍵與單鍵；在單純的箱中，其預測的 $\lambda_{max}$ 會一路延伸到紅外區，而真實的多烯則趨於平緩（具有 11 個 C=C 的 β-胡蘿蔔素在 450 nm 附近吸收）。選擇多烯系列並把 $V_{alt}$ 提高到 1–2 eV：週期位勢打開一個對長鏈仍保持有限的能隙，這就是能帶隙的一維雛形。色塊顯示白光減去在各 $\lambda_{max}$ 處的高斯吸收帶；吸收黃光的染料看起來是藍色，只吸收紫外光的則看起來無色。
meanings:
- 系列中分子 $b$ 的 π 電子數與共軛鍵數
- 箱長：所有鍵再加上每個端點原子外的一個鍵長
- 解析能階；不對任何指標求和，為 $n^2$ 與 $1/L^2$ 的外積
- 從 HOMO $n = N/2$ 到 LUMO $n = N/2 + 1$，以及吸收波長
- 每個箱子的內部網格點；壁上 $\psi = 0$
- 每個分子一個有限差分 Hamiltonian，堆疊起來
- 重複的 $j$ ⇒ 求和；eigh 一次呼叫對角化整批
- 重複的 $w$ ⇒ 對可見光波長求和：吸收後剩下的顏色
labels:
  series: 同系列
  n_max: 最長鏈（增加的 CH=CH 單元數）
  bond: 鍵長 $l$
  end: 箱子在每個端點原子外的延伸（鍵數）
  V_alt: 鍵長交替位勢 $V_{alt}$
  n_points: 網格點數 $M$
