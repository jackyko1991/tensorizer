source_hash: ba1aea4b5f9d
title: リーマンゼータ関数と素数
summary: 臨界線 $\operatorname{Re} s = \frac12$ 上で数千の高さについて $\zeta(s)$ を一度に評価し、実関数 $Z(t)$ の符号変化として最初の非自明な零点を見つけ、ブール型テンソルのふるいで素数を数える。そしてリーマンの明示公式が零点から階段関数 $\pi(x)$ を再構成する：各零点は一つの波を加え、零点が増えるにつれて滑らかな曲線は素数での段差へと鋭くなっていく。
notes: 級数 $\sum n^{-s}$ は $\operatorname{Re} s > 1$ でしか収束しない。オイラー–マクローリンの公式は裾を積分とベルヌーイ補正に変え、$\zeta$ を $s = 1$ の極を除く平面全体に接続する。臨界線上では $Z(t) = e^{i\theta(t)}\zeta(\frac12 + it)$ は実数なので、$Z$ の符号変化はその間に零点があることを証明する。計算した零点は公表値 $14.134725\ldots$、$21.022040\ldots$、$25.010858\ldots$ と約 $10^{-9}$ の精度で一致し、高さ $T$ 以下で見つかった個数はリーマン–フォン・マンゴルトの個数 $N(T) \approx \theta(T)/\pi + 1$ と一致する。これは取りこぼしがないことのチェックである。より速いリーマン–ジーゲル公式（主和と第一補正）も比較のために示す：その誤差は最初の零点ですでに $10^{-3}$ から $10^{-2}$ にすぎず、$t$ が大きくなるにつれて縮む。素数定理は $\pi(x) \sim x/\ln x$ と述べるが、$\operatorname{li}(x)$ のほうがずっと近く、リーマンの $R(x) = \sum_n \frac{\mu(n)}{n}\operatorname{li}(x^{1/n})$ はさらに近い（中央のパネル；グラムの級数で計算）。Riemann（1859）は、残りの誤差がすべて零点によって担われることを示した：$J(x) = \sum_{p^m \le x} \frac1m$ は $\operatorname{li}(x) - \sum_\rho \operatorname{li}(x^\rho) - \ln 2 + \int_x^\infty \frac{dt}{t(t^2-1)\ln t}$ に等しく（1895 年に von Mangoldt が証明）、メビウスの反転公式で $\pi(x)$ が得られる。各零点の対 $\rho = \frac12 \pm i\gamma$ は、大きさ約 $\sqrt{x}/(\gamma\ln x)$、$\ln x$ についての周波数 $\gamma$ の波を加える。和を打ち切ると、各段差の近くにギブズ現象のような波紋が残る。リーマン予想は、すべての非自明な零点（$0
  < \operatorname{Re} s < 1$ のすべての零点）の実部がちょうど $\frac12$ であると主張する。これは未証明である。コンピュータで $10^{12}$ 個を超える零点について検証されており、誤差評価 $\pi(x) = \operatorname{li}(x) + O(\sqrt{x}\ln x)$ と同値である（von Koch、1901）。このプログラムは臨界線上の零点を見つけるだけで、線から外れた零点がないことは示せない。参考文献：H. M. Edwards, Riemann's Zeta Function (1974)。
meanings:
- 臨界線上の多数の高さ $t$ を一度に
- $n$ の繰り返し ⇒ 和：ディリクレ級数の最初の $N-1$ 項
- ベルヌーイ数によるオイラー–マクローリン補正；$(s)_{2k-1} = s(s+1)\cdots(s+2k-2)$。すべての $s \ne 1$ で有効
- $\zeta(\frac12 + it)$ と同じ零点をもつ実関数；$\theta(t)$ は漸近級数から
- 刻み 0.01 の格子上での $Z$ の符号変化、次にすべての区間で一度に 48 回の二分法
- エラトステネスのふるい：素数 $p \le \sqrt{x}$ ごとに一回のストライドスライス；$\pi(x)$ はその累積和
- すべての $x$ でのすべての零点；共役な零点を合わせると $2\,\mathrm{Re}$
- すべての $K$ についての近似を一度に：行ごとに一フレーム
- メビウス関数；$J(y) = 0$ となるので、$n$ についての和は $x^{1/n} < 2$ で止まる
labels:
  n_zeros: 使用する零点数 $K$
  x_explicit: 明示公式の範囲 $x$
  log10_x: ふるいの範囲 $10^n$
