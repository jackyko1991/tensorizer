source_hash: a175ef505737
title: 수천 개의 영점으로 보는 리만 가설
summary: 텐서 형태의 리만–지겔 공식으로 임계선 위에 있는 $\zeta$ 의 비자명 영점 수천 개를 찾고, 그 개수를 리만–폰 망골트 법칙 $N(T) = \theta(T)/\pi + 1 + S(T)$ 및 그램 법칙과 비교하며, 영점 간격과 쌍상관을 무작위 에르미트 행렬(GUE)과 비교하고, 영점들로부터 소수 거듭제곱 계단 함수 $\psi(x)$ 를 재구성합니다. 모든 비자명 영점의 실수부가 $\frac12$ 라는 가설 자체는 여전히 미해결입니다.
notes: '이 페이지는 “리만 제타 함수와 소수” 문제(maths/zeta_primes)를 보완합니다. 그 문제에서는 오일러–매클로린 공식으로 $\zeta$ 를 처음부터 만들고, 첫 영점들을 찾고, $\pi(x)$ 를 재구성합니다. 기초는 그것을 먼저 읽어 보세요. 여기서는 더 빠른 리만–지겔 공식과 그 보정항 $C_0, C_1, C_2$ (체비쇼프 급수로 구한 $\Psi$ 의 도함수)를 사용하여 25만 개의 높이에서 $Z(t)$ 를 계산하고 $T$ 아래 임계선 위의 모든 영점을 찾습니다. $t \ge 100$ 에서는 고정밀 계산(mpmath)과 $10^{-5}$ 보다 좋은 정확도로 일치합니다. $t = 1000$ 아래에서 649번, 5000 아래에서 4520번의 부호 변화를 찾는데, 이는 그 높이까지 띠 안에 있는 영점의 총 개수(mpmath로 독립적으로 계산)와 정확히 같으므로 그 영점들은 모두 임계선 위에 있습니다. 개수 함수는 평균이 0인 작은 요동 $S(t)$ 를 가지고 $\theta(T)/\pi + 1$ 을 따릅니다. 그램 법칙은 대부분의 그램 점에서 성립하며 $g_{126} \approx 282.45$ 에서 처음으로 깨집니다. 평균 간격 1로 정규화하면 영점들은 큰 무작위 에르미트 행렬(GUE)의 고윳값과 똑같이 서로 밀어냅니다. 몽고메리(1973)는 쌍상관 $1 - (\sin \pi u / \pi u)^2$ 를 추측했고, 리만 가설을 가정하여 푸리에 지지집합이 $(-1, 1)$ 안에 있는 시험 함수에 대해 이를 증명했으며, $10^{20}$ 번째 영점 근처에서의 오들리즈코의 계산은 이를 극적으로 확인합니다. 여기서 다루는 낮은 높이에서도 이미 일치가 꽤 좋습니다. 명시적 공식(폰 망골트 1895, 증명됨)은 영점을 소수로 바꿉니다. 각 쌍 $\frac12 \pm i\gamma$ 는 파동 $x^{1/2}\cos(\gamma\ln x)$ 를 더하며, 영점이 수천 개이면 $\psi(x)$ 는 선명한 계단이 됩니다. 모든 비자명 영점의 실수부가 $\frac12$
  라는 리만 가설은 클레이 밀레니엄 상 문제 중 하나이며 미해결입니다. 높이 $3\times10^{12}$ 까지의 모든 영점에 대해서는 검증되었습니다(플랫과 트러지언 2021). 띠 안에 표시된 증명된 결과: $\operatorname{Re} s = 1$ 위에는 영점이 없다는 것(아다마르, 드 라 발레 푸생 1896, 소수 정리와 동치)과 영점 없는 영역 $\sigma > 1 - 1/(5.558691\ln t)$ (모싱호프와 트러지언 2015)이며, 함수 방정식에 의해 대칭으로 반사됩니다. 주장되었으나 확립되지 않은 것: 2026년 10월 OpenAI는 AI가 생성한 원고를 모아 둔 공개 저장소 openai/math에 $\zeta$ 와 모든 디리클레 $L$-함수에 대해 영점 없는 반평면 $\operatorname{Re} s > 7/8$ 을 주장하는 원고와, $\operatorname{Re} s > 11/12$ 에 대한 보조 논증을 게시했습니다(보도에 따른 것이며, 우리는 원고를 확인하지 않았습니다). 이 프리프린트들은 심사를 거치지 않았고 독립적으로 검증되지 않았습니다. 만약 옳다면 고정된 폭의 영점 없는 띠는 중대한 진전이겠지만, 여전히 임계선 $\frac12$ 와는 거리가 멉니다. 어떤 계산도 이 가설을 증명할 수 없습니다. 유한한 탐색으로는 임계선 위의 영점이나 반례를 찾을 수 있을 뿐입니다.'
meanings:
- '반복된 $n$ ⇒ 합산: 250 000개 높이에 대한 주합을 한꺼번에, $n \le N_t = \lfloor\sqrt{t/2\pi}\rfloor$ 로 마스킹'
- $\Psi$ 는 정함수이지만 몫이 $p = \frac14, \frac34$ 에서 $0/0$ 꼴; 체비쇼프 근사가 이를 제거
- '리만–지겔 보정항: 체비쇼프 급수는 항별로 미분됨, $c''_{k-1} = c''_{k+1} + 2k\,c_k$'
- 간격 0.02인 격자에서 $Z$ 의 부호 변화를 찾은 뒤, 모든 구간에서 한꺼번에 이분법 32단계
- 영점 개수에서 매끄러운 부분을 뺀 것; 작게 유지되며 평균은 0
- 뉴턴 방법으로 모든 그램 점을 한꺼번에; 그램 법칙은 $(-1)^n Z(g_n) > 0$ 이라는 것
- 쌍상관을 위해, 정규화된 영점 $x = \theta(\gamma)/\pi + 1$ 과 다음 $J = 10$ 개 이웃 사이의 차
- '모든 $x$ 에서 모든 영점을 영점에 걸쳐 누적: 높이 $T$ 마다 한 행'
labels:
  t_max: 높이 $T$
  x_max: $x$ 까지의 명시적 공식
