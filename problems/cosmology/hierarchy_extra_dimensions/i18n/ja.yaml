source_hash: 41a426132182
title: 階層性問題と余剰次元へ漏れ出す重力
summary: なぜ重力は弱い力より約 $10^{33}$ 倍も弱いのか（$G_F M_{Pl}^2$）。推測的な答えの一つ：重力は $n$ 個の隠れたコンパクト次元に広がっている。$\mathbb R^3\times T^n$ 上でポテンシャルを二通りに和をとる：質量の鏡像についての和と、Kaluza–Klein タワーについての和で、どちらも格子の殻についての一つのテンソルとして書く。内側では $1/r^{1+n}$、外側では $1/r$ のように減衰し、湯川型の裾 $\alpha = 2n$、$\lambda = R$ を持つ。$n = 1..6$ の ADD 半径をねじれ秤と LHC の実際の制限と比べ、Randall–Sundrum のワープ因子 $e^{-\pi k r_c}$ は $M_{Pl}$ を TeV に変える。余剰次元はまだ一つも観測されていない。
notes: 位置づけ：推測的。階層性問題は、電弱スケール（$v \approx 246$ GeV）がなぜプランクスケール（$M_{Pl} \approx 1.22\times10^{19}$ GeV）よりはるかに低いのかを問う。ここで $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$。Arkani-Hamed、Dimopoulos、Dvali（ADD, 1998）は、重力だけがミリメートルからフェムトメートルの大きさの $n$ 個のコンパクト次元に広がり、重力の真のスケール $M_*$ は TeV 程度でありうると提案した。Randall と Sundrum（1999）は代わりに一つの歪んだ次元を提案した。余剰次元は見つかっていない。他に提案された答えには超対称性、複合性、relaxion、人間原理による選択があるが、どれも確立していない。計算するもの：$\mathbb R^3\times T^n$ 上の点質量（半径 $R$ の円、単位 $R = G_D M = 1$）。鏡像和と Kaluza–Klein 和はポアソン和公式により等しい。どちらも殻 $m = |\mathbf k|^2$ ごとに個数 $r_n(m)$ でまとめる。図では内側に鏡像和（$r < R$、遠い鏡像は積分で置き換え）、外側に KK 和を使う。$3+n$ 次元空間のガウスの法則が $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$ を決める。最も軽い KK 準位には質量 $1/R$ のモードが $2n$ 個あるので、コンパクト空間のすぐ外では重力は $\alpha = 2n$、$\lambda = R$ の湯川補正のように見える（トーラスの場合；他の形では $\alpha$ が変わる）。ADD 半径は $M_{Pl}^2 = M_*^{n+2}R^n$ を用いる。論文によって $(2\pi)^n$ や $8\pi$ のような因子が異なるので、$R$ は桁の目安と考えること。データ（data/*.csv に引用値として収録）：Eöt-Wash のねじれ秤は $\lambda = 56\,\mu$m より上で $|\alpha| = 1$ を排除し（Kapner ら, PRL 98, 021101, 2007, arXiv:hep-ph/0611184；余剰次元一つなら
  $R \le 44\,\mu$m）、$38.6\,\mu$m より上でも排除する（Lee ら, PRL 124, 101101, 2020, arXiv:2002.11761）。排除曲線そのものは同梱していない。曲線は $\lambda$ とともに下がるので、$\alpha \ge 1$ かつ $\lambda > 38.6\,\mu$m の点はすべて排除される。これは保守的な判定である。ATLAS の 13 TeV モノジェット探索（139 fb$^{-1}$; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0）は $n = 2..6$ に対し 11.2、8.5、7.1、6.4、5.9 TeV 未満の $M_D$ を排除する（Giudice–Rattazzi–Wells の規約。ここでは $M_*$ と直接比較）。$n = 1$ は太陽系ほどの大きさの次元を必要とし、惑星軌道により排除されている。Randall–Sundrum：$k r_c \approx 11$–$12$ で $\bar M_{Pl}e^{-\pi k r_c}$ が TeV になる。LHC はその Kaluza–Klein 重力子を見ていない。
meanings:
- Kaluza–Klein モードベクトル（円を回る運動量 $\mathbf k/R$）；殻の個数の検算に使う
- $|\mathbf k|^2 = m$ を満たす $\mathbf k$ の個数：テータ級数の $n$ 乗を FFT 畳み込みで
- 繰り返される殻の添字 $m$ ⇒ 和：質量とその鏡像；遠い鏡像は連続体の裾で
- 同じポテンシャルを質量 $\sqrt m/R$ の湯川項のタワーとして（ポアソン和）
- autograd による場；$S^{2+n}$（近く）または $S^2\times T^n$（遠く）の面積を掛けるとガウスの流束
- コンパクト空間のすぐ外で $\ln(\phi/\phi_N - 1)$ に最小二乗；期待値は $2n$ と $R$
- すべての $n$ と基本スケール $M_*$ の ADD 半径を一度に（ブロードキャスト）
- プランクブレーンと TeV ブレーンの間の Randall–Sundrum ワープ因子
labels:
  M_star: 表示する表の基本スケール $M_*$
  krc: Randall–Sundrum の $k r_c$
  m_max: 和をとる格子の殻、$|\mathbf k|^2 \le m_{max}$
