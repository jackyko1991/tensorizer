source_hash: 31fa57e56a24
title: 最小作用の原理：勾配降下法で経路を求める
summary: 経路を両端固定の点 $q_n$ に分割し、作用 $S = \sum_n L\,\Delta t$ を1つのテンソル式として書く。自動微分と最適化器が、間違った推測のバッチを $\partial S/\partial q_n = 0$ になるまで坂を下らせる。推測は投げたボールの放物線や振動子の正弦曲線に落ち着く。
notes: ここでは自然は一歩ずつ前に積分していくのではない：始点と終点がわかったうえで、経路全体が一度に調整される。$\partial S/\partial q_n = 0$ とおくと $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 = -V'(q_n)$、すなわち離散オイラー–ラグランジュ方程式が得られ、これはまさに Verlet 法である。一様重力では放物線を丸め誤差の範囲で再現し、振動子では $O(\Delta t^2)$ の精度で再現する。この原理は実際には停留作用の原理である：振動子ではヘッセ行列の最小固有値が約 $m\Delta t\,(\pi^2/T^2 - \omega^2)$ なので、$T$ が半周期 $\pi/\omega$ を超えると真の経路は $S$ の鞍点となり、勾配降下法は暴走する。そこでコードはニュートン法のステップ $x \leftarrow x - \alpha H^{-1}\nabla S$ に切り替え、任意の停留点を見つける。なめらかで長い揺らぎほどゆっくり緩和し（ヘッセ行列の最小固有値に対応）、短い揺らぎは数回の反復で消える。
meanings:
- 時刻 $t_n = n\,\Delta t$ における試行経路 $b$。$q_{b0}$ と $q_{bN}$ は固定
- 対角に $-1$、そのすぐ右に $+1$：$(Dq)_n = q_{n+1} - q_n$
- 繰り返される $k$ ⇒ 和をとる：各経路の各ステップの速度
- 運動エネルギー引くポテンシャルエネルギーをステップについて和をとる。$V$ は各ステップの左端で評価
- 内部の自由な点に対する勾配。経路どうしは独立なので、1回の逆伝播ですべてまかなえる
- モーメンタム付き勾配降下法、$\eta = 0.8\,\Delta t/m$
- ヘッセ行列：三重対角で、対角は $2m/\Delta t - V''\Delta t$、その両隣は $-m/\Delta t$
- 離散オイラー–ラグランジュ方程式 $m(q_{n+1} - 2q_n + q_{n-1})/\Delta t^2 + V'(q_n)$、すなわち Verlet 法。$\partial S/\partial q_n = -\Delta t\,r_n$
labels:
  system: 系
  method: 手法
  T: 全時間 $T$
  omega: 振動子の角振動数 $\omega$
  q_start: 始点 $q_0$
  q_end: 終点 $q_N$
  n_steps: 時間ステップ数 $N$
  n_paths: 試行経路の数
  wiggle: 試行経路の揺らぎ
  n_iter: 反復回数
