title: हाल्डेन जालक पर टोपोलॉजिकल फ़ोटोनिकी
summary: युग्मित प्रकाशीय अनुनादकों का एक मधुकोश (honeycomb) सरणी जिसमें अगले-निकटतम-पड़ोसी युग्मन सम्मिश्र हैं, यानी फ़ोटोनिक हाल्डेन मॉडल। पूरे $k$-ग्रिड पर $2\times 2$ ब्लॉख हैमिल्टनी फ़ुकुई–हात्सुगाई–सुज़ुकी लिंक विधि (लिंक चरों पर einsum) से चर्न संख्या देता है। एक ज़िगज़ैग रिबन अंतराल को पार करती किनारा अवस्थाएँ दिखाता है, और एक परिमित फ़्लेक के किनारे पर छोड़ा गया प्रकाश एक खाँचे के चारों ओर एक ही दिशा में बहता है, जबकि तुच्छ (trivial) जालक में वह आगे नहीं निकल पाता।
notes: 'इकाइयाँ: युग्मन $t_1 = 1$ और अनुनादकों के बीच दूरी 1। $E$ मूल अनुनाद आवृत्ति से विचलन (detuning) है, और तरंगपथक सरणी में समय $t$ संचरण दूरी बन जाता है। कला $\phi = \pi/2$ पर स्थिर है। जालक टोपोलॉजिकल है, $C = \pm1$ के साथ, जब $\lvert M\rvert < 3\sqrt3\,t_2\lvert\sin\phi\rvert$; तुलना वाला जालक उसका दुगुना द्रव्यमान लेता है और $C = 0$ रखता है। फ़ुकुई–हात्सुगाई–सुज़ुकी विधि (J. Phys. Soc. Jpn., 2005) मोटे ग्रिड पर भी सटीक पूर्णांक देती है। तब बल्क-सीमा संगति (bulk-boundary correspondence) $\lvert C\rvert$ एकदिशीय किनारा चैनलों का वादा करती है। इनपुट प्रकाश निचले किनारे के पास एक धब्बा है, जिसे बल्क अंतराल के भीतर की आवृत्तियों तक छाना गया है। यह खाँचे के चारों ओर चलता है, क्योंकि उसके प्रकीर्णित होने के लिए कोई पीछे चलने वाली अवस्था नहीं है। तुच्छ जालक में वही प्रकाश बस बल्क में फैल जाता है। मॉडल Haldane का है (PRL, 1988)। Haldane & Raghu (PRL, 2008) ने इसका फ़ोटोनिक संस्करण प्रस्तावित किया, और Wang, Chong, Joannopoulos & Soljačić (Nature, 2009) ने एक मैग्नेटो-ऑप्टिकल फ़ोटोनिक क्रिस्टल
  में एकदिशीय माइक्रोवेव किनारा अवस्थाएँ देखीं। Rechtsman et al. (Nature, 2013) ने कुंडलित तरंगपथकों से एक फ़्लोके संस्करण बनाया। इसके बाद टोपोलॉजिकल विद्युतरोधी लेज़र आए (Bandres et al., Science, 2018), और Ozawa et al. (Rev. Mod. Phys., 2019) ने इस क्षेत्र की समीक्षा की। अधिक हाल के कार्य, जिनमें चुंबकीय क्षेत्र की आवश्यकता न रखने वाले वैली-हॉल फ़ोटोनिक क्रिस्टल शामिल हैं, इस विचार को ऑन-चिप दूरसंचार और टेराहर्ट्ज़ तरंगपथकों तक ले जाते हैं। $M$ को क्रांतिक मान से आगे बढ़ाकर देखें: $C$ गिरकर 0 हो जाता है, किनारा अवस्थाएँ बैंडों से अलग हो जाती हैं, और प्रकाश अब खाँचे के चारों ओर नहीं निकल पाता।'
meanings:
- फ़्लेक के अनुनादक $i$ में सम्मिश्र क्षेत्र आयाम
- युग्मन $t_1$, $t_2 e^{-i\nu_{ij}\phi}$ और विचलन $\pm M$ तथा अव्यवस्था
- $k\cdot\delta_n$ ग्रिड पर हर $k$ के लिए निर्देशांक $i$ पर einsum है; $\delta_n$, $b_n$ बंध सदिश हैं
- 'दोहराया गया $\mu$ ⇒ योग: हर $k$ पर ब्लॉख हैमिल्टनी'
- निचले बैंड का आइगेनसदिश (उसकी कला मनमानी है)
- 'दोहराया गया $a$ ⇒ योग: पड़ोसी $k$ बिंदुओं के बीच लिंक चर'
- 'चार लिंकों के लूप की कला: बेरी फ़्लक्स, गेज-निश्चर'
- 'दोहराए गए $a, b, c$ ⇒ योग: सतत बेरी वक्रता, autograd से अवकलज'
- प्रति जालक (टोपोलॉजिकल और तुच्छ) एक eigh से $e^{-iHt}\psi_0$
