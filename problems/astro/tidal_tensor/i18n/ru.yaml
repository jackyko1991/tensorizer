title: Спагеттификация у чёрной дыры
summary: 'Кольцо частиц падает на чёрную дыру звёздной массы. Разность гравитации поперёк кольца — приливный тензор $T_{ij} = -\partial_i\partial_j\Phi$, вычисляемый по формуле и как гессиан через autograd. Он растягивает кольцо в радиальном направлении ($+2GM/r^3$) и сжимает поперёк ($-GM/r^3$ дважды): спагеттификация, которая разрывает реальные тела внутри приливного радиуса.'
notes: 'Единицы: $G = c = 1$, длины в $GM/c^2$, поэтому горизонт находится при $r_s = 2$ (30 км для чёрной дыры в 10 масс Солнца). Частицы кольца не притягивают друг друга: синие точки следуют точной ньютоновской гравитации, красная кривая — линейному закону $\ddot\xi_i = T_{ij}\xi_j$, и они совпадают, пока кольцо мало по сравнению с $r$. Оранжевая окружность отмечает, где тело размером с кольцо и массой $m$, удерживаемое собственной гравитацией, было бы разорвано. Для чёрной дыры звёздной массы этот радиус лежит далеко за горизонтом, так что падающая звезда (или астронавт) разрывается до его пересечения; для сверхмассивной чёрной дыры он может лежать внутри горизонта. Гравитация здесь ньютоновская; примечательно, что приливный тензор радиально падающего наблюдателя в общей теории относительности имеет ровно те же собственные значения $(2, -1, -1)\,GM/r^3$. Счёт останавливается до горизонта.'
meanings:
- положение центра кольца (чёрная дыра в начале координат)
- смещение частицы кольца $b$ от центра
- внешнее произведение, суммирования нет
- приливный тензор по формуле
- тот же тензор как гессиан через autograd
- 'повторяющийся $j$ ⇒ суммирование: линейное приливное ускорение'
- $= -\nabla^2\Phi = 0$ в вакууме
- приливный радиус (предел Роша) самогравитирующего тела
