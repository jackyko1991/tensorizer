source_hash: 32bf873c8175
title: ネルンストの式とデバイ–ヒュッケル遮蔽
summary: ダニエル電池 Zn | Zn²⁺ ‖ Cu²⁺ | Cu の電圧はネルンストの式に従い、ここでは温度と濃度比の一つの $(T, Q)$ 格子として計算する。実際のイオンは濃度から想像されるより活量が低い：各イオンは厚さ $\kappa^{-1}$ の反対電荷の雲をまとっている。イオンのまわりの線形化ポアソン–ボルツマン方程式を動径格子上でバッチ化した線形系として解くと、解析的な湯川ポテンシャルと一致し、起電力をずらすデバイ–ヒュッケルの活量係数が再現される。
notes: ダニエル電池では亜鉛が酸化され銅イオンが還元される。$\mathrm{Zn + Cu^{2+} \to Zn^{2+} + Cu}$、電子数 $n = 2$、$E^\circ \approx 1.10$ V（それ自体の温度変化は小さいので、ここでは固定）。$Q$ が 10 倍変わるごとに起電力は $\ln 10\,RT/nF$ だけ変わり、これは 25 °C で 29.6 mV で、傾きは $T$ に比例して大きくなる。ネルンストの式は質量モル濃度ではなく活量 $a = \gamma m$ を使う。Debye と Hückel は、他のイオンが中心イオンのポテンシャル $\varphi$ の中でボルツマン重みに従って配置するとして、それを線形化することで $\gamma$ を計算した：$\nabla^2\varphi = \kappa^2\varphi$。その解は遮蔽クーロン（湯川）ポテンシャルで、25 °C の水中ではデバイ長 $\kappa^{-1} \approx 0.304\,\mathrm{nm}/\sqrt{I}$ にわたって減衰する。数値ソルバーは $u = r\varphi$ についての動径方程式を三重対角系として書き、イオン表面でガウスの法則、デバイ長の 12 倍外側で $\varphi = 0$ とし、解析形と約 $10^{-4}$ の精度で一致する。自分の雲のポテンシャル中でのイオンのエネルギーは $kT\ln\gamma$ であり、これはちょうど拡張則を与える。$I \to 0$ では極限則 $\log_{10}\gamma = -Az^2\sqrt I$（$A \approx 0.51$）になる。各半電池は別々の 2:2 硫酸塩溶液（$I = 4m$）なので、$m(\mathrm{Zn^{2+}})$ を変えると $\gamma_{Zn}$ は変わるが $\gamma_{Cu}$ は変わらず、起電力は理想的なネルンストの値から数ミリボルトずれる。単一イオンの活量係数はそれだけでは測定できず（測れるのは平均 $\gamma_\pm$ だけ）、$I \approx 0.01$ を超えると 2:2 硫酸塩ではイオン対形成と特異的相互作用のため、拡張則でさえ定性的なものになる。イオンの大きさ $a \approx 0.5$ nm は典型的な水和イオンの値である。
meanings:
- 電池温度と反応商のバッチ
- どの添字についても和をとらない：すべての傾きがすべての反応商と組み合わさる
- 掃引する ZnSO₄ 半電池のイオン強度 $I = mz^2$ とデバイ長の逆数
- 拡張則；$a \to 0$ で極限則 $-Az^2\sqrt I$ になる
- イオン表面 $a$ から $a + 12\,\kappa_c^{-1}$ までの格子、濃度ごとに一つ
- $u = r\varphi$ として $u^{\prime\prime} - \kappa^2u = 0$；行 0 は $r = a$ でのガウスの法則
- $j$ の繰り返し ⇒ 和；濃度ごとに一回の密行列求解、バッチ化
- 自分の雲の中でのイオンのエネルギー：拡張デバイ–ヒュッケル則を再現する
labels:
  T_C: 活量と遮蔽の温度
  m_Cu: Cu²⁺ 半電池の質量モル濃度
  E0: 標準起電力 $E^\circ$
  a_ion: イオンの大きさ $a$
  n_points: 動径格子点数 $M$
