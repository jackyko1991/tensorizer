title: माइकेलिस–मेंटेन एंज़ाइम गतिकी
summary: 'एक एंज़ाइम अपने अधःस्तर (substrate) से बंधता है, एक संकुल बनाता है और उत्पाद मुक्त करता है: $E + S \rightleftharpoons ES \to E + P$। पूर्ण द्रव्यमान-अनुपाती (mass-action) समीकरण तीन एंज़ाइमों और पूरे अधःस्तर अनुमापन के लिए एक साथ, एक $(4, B, C)$ टेंसर में हल किए जाते हैं, और अर्ध-स्थिर-अवस्था दर नियम $v = V_{max} S/(K_m + S)$ तथा लाइनवीवर–बर्क फिट से तुलना की जाती है।'
notes: 'केवल द्रव्यमान-अनुपाती क्रिया चार युग्मित ODE देती है। माइकेलिस और मेंटेन (1913) ने, ब्रिग्स और हाल्डेन (1925) के रूप में, देखा कि संकुल $ES$ एक सेकंड के अंश में बन जाता है और फिर केवल धीरे-धीरे बदलता है, इसलिए $d[ES]/dt \approx 0$ रखा जा सकता है। $E + ES = E_0$ के साथ यह $[ES] = E_0 S/(K_m + S)$ और दर नियम $v = k_2 [ES] = V_{max} S/(K_m + S)$ देता है, जहाँ $K_m = (k_{-1} + k_2)/k_1$ और $V_{max} = k_2 E_0$। बीच के पैनल के बिंदु हर परखनली का वर्तमान $(S, k_2 [ES])$ दिखाते हैं: प्रारंभिक उछाल के बाद वे धराशायी वक्र पर बैठ जाते हैं और अधःस्तर के खपने के साथ उस पर नीचे खिसकते हैं, यही अर्ध-स्थिर-अवस्था सन्निकटन (QSSA) का काम है। घटा हुआ मॉडल $dS/dt = -V_{max} S/(K_m + S)$ (नारंगी धराशायी) का एक सटीक हल भी है, $S_0 - S + K_m \ln(S_0/S) = V_{max} t$। सन्निकटन तब मान्य है जब $E_0 \ll S_0 + K_m$; $E_0$ को 2 µM तक बढ़ाएँ और देखें कि पूर्ण गतिकी QSSA से पीछे रह जाती है क्योंकि संकुल में बंद अधःस्तर अब नगण्य नहीं है। जैव-रसायनज्ञ कई $S_0$ पर प्रारंभिक वेग $v_0$ मापते हैं और $1/v_0 = (K_m/V_{max})(1/S_0)
  + 1/V_{max}$ को एक सीधी रेखा के रूप में फिट करते हैं (लाइनवीवर–बर्क, 1934): $y$-अंतःखंड $1/V_{max}$ है और $x$-अंतःखंड $-1/K_m$ है। द्वि-व्युत्क्रम आलेख कम $S_0$ पर त्रुटियों को बढ़ाता है, इसलिए रवयुक्त आँकड़ों के लिए सीधा अरैखिक फिट बेहतर है। एंज़ाइम A, B और C बंधन और गति के बीच समझौता करते हैं: A का $K_m$ छोटा है, C का $k_{cat}$ सबसे बड़ा; उत्प्रेरक दक्षता $k_{cat}/K_m$ तय करती है कि कम अधःस्तर पर कौन जीतता है। सरलीकरण: एक सक्रिय स्थल, अनुत्क्रमणीय उत्पाद मुक्ति, कोई निरोध नहीं और भली-भाँति मिश्रित आयतन।'
meanings:
- एंज़ाइम $b$ के बंधन, वियोजन और उत्प्रेरक दर स्थिरांक ($k_2 = k_{cat}$)
- अनुमापन की प्रारंभिक अधःस्तर सांद्रता $c$ (µM)
- हर परखनली में मुक्त एंज़ाइम, अधःस्तर, संकुल $X = ES$ और उत्पाद
- 'किसी सूचकांक पर योग नहीं: $k_b$ हर सांद्रता $c$ पर प्रसारित (broadcast) होता है'
- RK4 के लिए दायाँ पक्ष; $E + X = E_0$ और $S + X + P = S_0$ स्थिर रहते हैं
- माइकेलिस स्थिरांक (अर्ध-गति अधःस्तर स्तर) और अधिकतम दर
- छोटे उछाल के बाद मापा गया प्रारंभिक (स्थिर-अवस्था) वेग
- लाइनवीवर–बर्क सामान्य समीकरण, $A_{ck} = [1/S_c,\ 1]$; दोहराया गया $c$ ⇒ योग
- हर एंज़ाइम के लिए ढाल $K_m/V_{max}$ और अंतःखंड $1/V_{max}$
labels:
  E0: एंज़ाइम $E_0$
  t_end: अनुकारित समय
  enzyme: प्रगति वक्रों के लिए एंज़ाइम
