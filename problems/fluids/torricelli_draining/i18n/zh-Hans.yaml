source_hash: f68c4a9fe179
title: 水箱排水（托里拆利定律）
summary: 水以托里拆利速度 $\sqrt{2gh}$ 从小孔流出，因此水位起初下降很快，后来越来越慢。孔径不同的水箱作为一个批量张量一起积分，并与精确解 $h(t) = (\sqrt{h_0} - \tfrac aA\sqrt{g/2}\,t)^2$ 比较。
notes: 托里拆利定律由自由液面（因 $A \gg a$ 而近似静止）与射流之间的伯努利方程得到，两处都处于大气压。实际小孔会把射流收缩到孔面积的约 60 %（缩流断面），所以实际水箱排得更慢：将 $a$ 乘以流量系数 $C_d \approx 0.6$。孔径加倍，排空时间变为四分之一；初始高度加倍，排空时间只乘以 $\sqrt2$。下落的射流在加速时变细——这又是连续性方程。
meanings:
- 水箱 $b$ 的水位随时间变化
- 水箱 $b$ 的孔面积——批量指标
- 每个水箱的横截面积
- 托里拆利出流速度
- 用 RK4 积分的右端项
- 没有重复指标 ⇒ 外积：每个时刻与每个孔
labels:
  n_tanks: 水箱数
  d_min: 最小孔径
  d_max: 最大孔径
  tank_diameter: 水箱直径 $D$
  h0: 初始水位 $h_0$
