source_hash: a99f4b65ce2b
title: バンドル調整：Levenberg–Marquardt 法による Structure from Motion
summary: 複数のカメラが同じ 3D 点群を撮影し、画素にはノイズが乗っています。大まかな姿勢（軸角回転 $\boldsymbol\omega_c$、並進 $\mathbf t_c$）と大まかな点 $\mathbf X_p$ から出発し、バンドル調整は総再投影誤差 $\tfrac12\sum_{c,p}\lVert\pi(R_c\mathbf X_p + \mathbf t_c) - \tilde{\mathbf u}_{cp}\rVert^2$ を Levenberg–Marquardt 法で最小化します。ヤコビアンは自動微分で求め、正規方程式 $J^{\mathsf T}J\,\Delta = -J^{\mathsf T}\mathbf r$ はシューア補行列で解き、7 つのゲージ自由度を固定することで解が一意に定まります。
notes: 'データは合成です。点は半径 1 の球内にあり、カメラは 5 単位離れた円弧上に並び（焦点距離 1000 px、$640\times 640$ の画像）、すべての点がすべてのカメラから見え、画素にはガウスノイズ $\sigma$ が加わります。初期値では各回転を数度、各並進と各点をシーンの大きさの数割だけずらすので、最初の再投影誤差は数十画素になります。ゲージ自由度：シーン全体をすべてのカメラごと平行移動・回転・拡大縮小しても画像は変わらないため、$E$ には等しい最小値が並ぶ 7 次元の谷があり、$J^{\mathsf T}J$ は 7 個のゼロ固有値を持ちます（コンソールに表示され、最大固有値の約 $10^{-16}$ 倍です）。カメラ 0（6 個の数）とカメラ 1 の $x$ 方向の並進（スケール）を固定すると零空間が消え、$J^{\mathsf T}J$ はフルランクになってステップが一意に決まります。ここでは真値に固定するので、結果を真値と直接比較できます。各反復では残差を $\mathbf r(\boldsymbol\theta + \Delta) \approx \mathbf r + J\Delta$ と線形化し、減衰付き正規方程式を解きます。ヤコビアンは torch.func.jacrev、つまり全残差についてベクトル化した自動微分で組み立てるので、間違えやすい手計算の微分が不要になります。シューア補行列は疎性（矢印形の $J^{\mathsf T}J$ パネル）を利用します。先に点を消去すると、カメラの数だけの大きさの系が残ります。実際のバンドル調整が数百万点を扱えるのはこのためです。ここでは密な解法とシューア解法が約 $10^{-12}$ の精度で同じステップを与えます。最適解では RMS 再投影誤差がノイズの下限 $\sigma\sqrt{1 - n/m}$ に一致し（推定した未知数がそれぞれノイズを少しずつ吸収するため）、残差のヒストグラムはノイズ分布と一致します。説明すべきものはもう残っていません。残る点とカメラの誤差はノイズと幾何配置で決まり、最適化手法によるものではありません。参考文献：B. Triggs, P. McLauchlan, R. Hartley and A. Fitzgibbon, "Bundle Adjustment
  — A Modern Synthesis" (Vision Algorithms: Theory and Practice, 1999)。簡略化：外れ値なし（実際のシステムはロバスト損失を使う）、レンズ歪みなし、すべての点がすべてのカメラから可視、ヤコビアンは密に保持。初期の摂動を大きくしたり（LM はより強い減衰が必要になるか、誤った極小に落ちる）、ノイズを増やしたり、カメラを 2 台だけにしたりしてみてください。'
meanings:
- カメラ姿勢：軸角回転（向き = 回転軸、長さ = 角度）と並進で、$x_{\rm cam} = R\mathbf X + \mathbf t$
- Rodrigues の公式 $I + \sin\theta\,K + (1-\cos\theta)K^2$。回転 1 つにつき 3 個の数で、課すべき制約はない
- 各カメラ座標系でのすべての点。$j$ について和をとる
- 画素単位の再投影誤差。$r_m$、$m = (c, p, a)$ に平坦化する
- 自由な未知数：すべての姿勢と点から 7 個のゲージ変数（カメラ 0 とカメラ 1 の $t_x$）を除いたもの
- 逆モード自動微分によるヤコビアン。各行につきベクトル化した逆伝播 1 回
- ガウス–ニュートン行列 $H = J^{\mathsf T}J$ と勾配 $J^{\mathsf T}\mathbf r$。$m$ について和をとる
- カメラ | 点のブロック。1 つの残差は 1 台のカメラと 1 つの点にしか関わらないので、$V$ はブロック対角
- シューア補行列（縮約カメラ系）：$P$ 個の小さな $3\times 3$ 逆行列のあと、小さな連立方程式を 1 回解く
- 後退代入：各点はそれぞれ独立に更新される
- Levenberg–Marquardt の減衰：ステップ成功後は 3 で割り、失敗後は 4 を掛ける
labels:
  n_cameras: カメラ数 $C$
  n_points: 点の数 $P$
  noise: 画素ノイズ $\sigma$
  init_rot: 初期の回転誤差
  init_noise: 初期の並進と点の誤差
  iterations: LM 反復回数
  solver: 正規方程式の解法
