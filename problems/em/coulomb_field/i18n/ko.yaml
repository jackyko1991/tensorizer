source_hash: 1470d7e1b6a9
title: 점전하의 전기장
summary: 격자 위에서의 쿨롱 법칙과 중첩 원리. 브로드캐스팅으로 모든 전하에서 모든 격자점까지의 변위 벡터를 한 번에 만들고, 전하 지표에 대한 einsum 하나로 전기장을 모두 더합니다. 전하 하나가 원을 따라 움직이는 동안 전기력선이 따라갑니다.
notes: $k = 1$인 단위계. 전하는 3차원의 점전하이므로 각 전기장은 $1/r^2$로 감소하며, 우리는 전하들이 놓인 평면만 봅니다. 화살표는 양전하(빨강)에서 멀어지고 음전하(파랑)를 향합니다. 두 전하의 부호가 같으면 그 사이에 전기장이 0인 중성점이 나타납니다.
meanings:
- 격자점 $g$, 성분 $i \in \{x, y\}$
- 전하 $q$의 위치
- 각 전하의 크기
- '브로드캐스팅: 모든 전하에서 모든 격자점까지의 벡터'
- '반복된 $j$ ⇒ 합: 거리'
- '반복된 $q$ ⇒ 합: 모든 전하의 중첩'
labels:
  q_fixed: 고정 전하
  q_moving: 움직이는 전하
  n_grid: 한 변의 화살표 수
