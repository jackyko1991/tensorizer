source_hash: 1e3affbcf0e4
title: 平面上的線性映射
summary: 一個 $2\times 2$ 矩陣移動平面上的每一點，而一次 einsum 就能在每個動畫幀同時移動整個網格、單位圓與單位正方形。觀察平面從單位矩陣變形到 $A$：本徵向量停留在各自的直線上，$|\det A|$ 縮放面積，負的行列式把平面翻面，而圓變成橢圓，其半軸就是奇異值。
notes: $A$ 的各行就是基底向量 $\mathbf e_1$（紅色箭頭）與 $\mathbf e_2$（綠色箭頭）的落點，其他每一點都依線性跟隨，因此網格直線保持筆直且平行。沿著路徑 $M(t) = (1-t)I + tA$，$A$ 的本徵向量 $\mathbf v$ 也是 $M(t)$ 的本徵向量，本徵值為 $1 - t + t\lambda$，所以橙色點沿著各自的虛線滑動，其他一切則在旋轉。單位正方形（黃色）變成面積為 $|\det A|$ 的平行四邊形；當 $\det < 0$ 時它變為紅色，此時 $\mathbf e_1 \to \mathbf e_2$ 為順時針，平面成為鏡像。反射在途中必須經過 $\det = 0$，此時平面被壓扁到一條直線上。旋轉與反射保持長度，因此 $\sigma_1 = \sigma_2 = 1$；剪切保持面積（$\det = 1$）但不保持形狀。一般而言，圓變成半軸為 $\sigma_1 \ge \sigma_2$（即奇異值）的橢圓，且 $|\det A| = \sigma_1\sigma_2$。乘積的行列式相乘：$\det(AB) = \det A\,\det B$。
meanings:
- 要展示的矩陣：伸縮、剪切、旋轉、反射與翻轉，或你自己的矩陣
- 平面上的點：網格線、單位圓、單位正方形
- 從單位矩陣 $\delta_{ij}$ 到 $A$ 的直線路徑，每幀一個矩陣
- 重複的 $j$ ⇒ 求和：每一點同時被每一幀的矩陣移動
- $\varepsilon_{12} = 1$、$\varepsilon_{21} = -1$：二維 Levi-Civita 符號
- 重複的 $i, j$ ⇒ 求和：單位正方形之像的有號面積
- 圓的像是半軸為 $\sigma_1 \mathbf u_1$ 與 $\sigma_2 \mathbf u_2$ 的橢圓
- 本徵值與本徵向量；旋轉的本徵值為複數，因此沒有直線保持不動
labels:
  matrix: 矩陣
  a11: 自訂 $A_{11}$
  a12: 自訂 $A_{12}$
  a21: 自訂 $A_{21}$
  a22: 自訂 $A_{22}$
  grid_lines: 每個方向的網格線數
