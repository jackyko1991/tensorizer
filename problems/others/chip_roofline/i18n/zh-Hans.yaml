source_hash: 3c8cc50504ae
title: 测量你的芯片屋顶线（roofline）
summary: 运行这段程序的机器有多快？为一次大型内存复制计时，得到带宽 $\beta$；再以 FP64、FP32、TF32、BF16 和 FP16 为 $n\times n$ 矩阵乘积 $C_{ij} = A_{ik}B_{kj}$ 计时，得到每种精度的速率 $\pi$。接着，屋顶线 $P(I) = \min(\pi, \beta I)$ 会告诉你哪些内核（kernel）能在你的芯片上全速运行，哪些要等待内存。编程技巧 ▸ 加速芯片组 会把你的结果放在其他芯片的规格表旁边。
notes: 规格表给出的是峰值；实际测量给出的是 PyTorch 在你的机器上真正达到的速度，对大型矩阵乘积来说通常是峰值的 50–90%。GPU 的计算是异步的，所以每次计时都会等待设备完成（synchronize），并在预热之后取多次运行的中位数。在 NVIDIA GPU 上，FP32 乘积会测量两次：一次用真正的 FP32，一次用 TF32 张量核心（torch.set_float32_matmul_precision("high")），这个设置会悄悄牺牲尾数位来换取速度。Apple 的 GPU 后端（MPS）没有 float64，所以在那里会跳过 FP64；消费级 GPU 运行 FP64 的速率只有 FP32 的一小部分，这对物理计算很重要。试试更大的矩阵尺寸：速率会持续上升，直到乘积受算力限制为止，而内存复制则保持在带宽附近。
meanings:
- 大型复制（读取 + 写入）测得的内存带宽，GB/s
- 精度 $p$ 下实际达到的矩阵乘积速率，TFLOP/s
- 重复的 $k$ ⇒ 求和：$n^3$ 次乘加
- 每搬运一个字节的 FLOP 数：元素为 $b$ 字节时是 $2n/(3b)$
- 强度为 $I$ 的内核最多能达到的速率
labels:
  matrix_size: 矩阵尺寸 $n$
  copy_mb: 复制大小
  repeats: 计时重复次数
