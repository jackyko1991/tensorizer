source_hash: c92568d7c613
title: ハミルトン力学：位相空間とシンプレクティック積分
summary: 振り子のハミルトニアン $H(q, p)$ を一度だけ書き、torch.autograd にハミルトン方程式 $\dot z_a = J_{ab}\,\partial H/\partial z_b$ を求めさせる。軌道の束とリウヴィルの点群が1つのテンソルとして一緒に動き、シンプレクティックなリープフロッグ法を陽的オイラー法や RK4 と多数の周期にわたって比べる。
notes: セパラトリクス $H = mgL$、すなわち $p = \pm 2mL\sqrt{gL}\cos(q/2)$ は、秤動（閉じたループ）と回転（右端から出て左端から戻ってくる波線）を分ける。その近くでは周期が際限なく長くなるので、点群の内側の縁が外側の縁を周回遅れにする：点群は細いらせんに引き伸ばされるが、面積は変わらない（リウヴィルの定理）。リープフロッグ法は2次精度にすぎないが、近くの「影の」ハミルトニアンを厳密に保存するため、エネルギー誤差はいつまでも有界である。RK4 は1ステップあたりはるかに正確だが、誤差は着実に増えていく。陽的オイラー法は1ステップごとに位相空間の面積を約 $1 + \omega^2\Delta t^2$ 倍にするので、エネルギーが発散する。より大きな $\Delta t$ や、点群が剛体的に回転するだけの調和振動子系を試してみよう。
meanings:
- 位相空間の点 $b$：角度 $q$ と角運動量 $p$。各軌道と点群の各点が1行ずつ
- ハミルトニアン。手で入力する物理はこれだけ
- 和の勾配をとると、独立な各点がそれぞれ自分の勾配を得る
- シンプレクティック行列 $[[0, I], [-I, 0]]$：勾配を 90° 回す
- 繰り返される $c$ ⇒ 和をとる：すべての点のハミルトン方程式を一度に
- キック–ドリフト–キック（Störmer–Verlet）：各サブステップはせん断変換なので、面積が厳密に保たれる
- 比較用の陽的オイラー法：毎ステップ位相空間を引き伸ばす
- 点群の多角形の面積。リウヴィルの定理によれば一定に保たれる
labels:
  system: 系
  m: 質量 $m$
  length: 長さ $L$
  amplitude: テスト軌道の振幅 $q_0$
  n_orbits: 相図の軌道数
  dt: 時間刻み $\Delta t$
  t_max: シミュレーション時間
