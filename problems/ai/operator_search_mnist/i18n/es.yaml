source_hash: efa79cfa67ef
title: 'Búsqueda de operadores en MNIST: un DAG tensorial escribe su propia ecuación de clasificación'
summary: ¿Pueden unos pocos operadores tensoriales legibles, conectados como un DAG, competir con una CNN cuando solo hay un puñado de imágenes de entrenamiento? Cada arista de un pequeño DAG contiene una mezcla ponderada por softmax de 23 operadores candidatos (Sobel, laplaciano, Gabor, un filtro 3×3 aprendido, ReLU, $x^2$, pooling, sumas de filas, módulo de la FFT, plantillas de clase, PCA, momentos, lecturas lineales y por prototipos); una búsqueda DARTS con 1 a 100 imágenes por dígito elige un operador por arista, y el DAG se imprime como una ecuación LaTeX que reproduce exactamente sus predicciones. Después, datos y cómputo frente a una CNN de tipo LeNet y dos referencias en forma cerrada, con cada semilla mostrada.
notes: 'La pregunta. Este problema de juguete es de Jacky Ka Long Ko: un intento de entrenamiento de IA con lotes pequeños y escritura de ecuaciones de caja blanca. CNN frente a un método tensorial en MNIST; enumerar los operadores tensoriales candidatos; dejar que un tensor que codifica el DAG encuentre los mejores operadores y su conexión; entrenar con lotes pequeños y comparar los datos y el cómputo que cada uno necesita para la misma precisión; y escribir la ecuación de clasificación del DAG encontrado. Método. Las imágenes son de 14×14 (MNIST promediado sobre bloques de 2×2, de modo que 30 ejecuciones caben en aproximadamente un minuto de CPU). La superred es una celda DARTS (Liu, Simonyan y Yang 2019) con tres nodos $z_1, z_2, z_3$ alimentados por todos los nodos anteriores a través de 6 aristas, cada una una mezcla de 12 operadores de celda (cero, identidad, $x^2$, $|x|$, ReLU, tanh, umbral suave $S_\lambda$, filtro $3\times 3$ aprendido, Sobel-$x$, Sobel-$y$, laplaciano, Gabor),
  seguida de una arista de pooling (media o máximo $2\times 2$), una arista de reducción (vec, sumas de filas, sumas de columnas, módulo de baja frecuencia de la FFT, correlaciones con plantillas de clase, proyección PCA, momentos de imagen) y una arista de cabeza (lectura lineal o 10 prototipos). La arquitectura es el tensor $\alpha$ (9 aristas × 23 operadores) con una máscara para la regla de tipado. Búsqueda: DARTS de primer orden, alternando un paso en $\theta$ sobre un minilote de la mitad de entrenamiento y un paso en $\alpha$ sobre la mitad de validación, con la temperatura del softmax recocida de 1 a 0.001; el DAG conserva el operador argmax de cada arista (cero elimina la arista), hereda el $\theta$ entrenado y se ajusta brevemente, conservando el mejor paso de validación. Desviaciones respecto de DARTS, indicadas porque importan: el recocido (como en SNAS y GDAS) y la regla del argmax cierran una brecha de discretización que en una primera prueba costaba hasta 25 puntos de precisión;
  la imagen se conserva como cuarto canal de la salida de la celda; las cabezas empiezan en la media de clase más cercana en su espacio de características. La CNN (8 y 16 canales de $3\times 3$, max pooling, una capa lineal: 2698 pesos) se entrena con Adam sobre las mismas imágenes con la misma parada temprana. Las referencias no tienen ningún parámetro aprendido: media de clase más cercana en píxeles, y PCA seguida de LDA con contracción. Resultados. Las pruebas comprueban que cada operador es igual a su fórmula sobre una entrada pequeña, que una mezcla one-hot es el operador único y la superred one-hot el DAG discreto, que la discretización elige el argmax, que la ecuación escrita, releída solo a partir de su LaTeX, da exactamente las predicciones del DAG, y que las referencias son sus formas cerradas. Ejecución incluida (CPU, un hilo, 3 semillas), precisión media de prueba para $n$ = 1, 5, 10, 50, 100 imágenes por dígito: CNN 0.35, 0.53, 0.64, 0.81, 0.85; DAG encontrado 0.38, 0.48, 0.52,
  0.69, 0.82; PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76; media de clase más cercana 0.41, 0.56, 0.64, 0.68, 0.69. Imágenes por dígito para alcanzar el 70 %: CNN 18, DAG 52, PCA + LDA 20; para alcanzar el 80 %: CNN 45, DAG 91. Tiempo de entrenamiento por ejecución: CNN de 0.4 a 1 s, búsqueda más ajuste de 2 a 4 s. Así que, con honestidad: la CNN necesita menos datos y menos cómputo para la misma precisión a partir de unas 10 imágenes por dígito; por debajo de eso, las referencias en forma cerrada son las mejores y ningún modelo aprendido las supera; el modelo estructurado no ganó con $n$ muy pequeño (con $n$ = 1 empata con las medias de clase). Por qué: la búsqueda se ejecuta sobre una partición de validación que es a su vez diminuta, así que su elección es ruidosa, y su pérdida de validación a menudo prefiere las sumas de filas (28 características, 290 números aprendidos, una pérdida más tranquila), que clasifican peor que todos los píxeles (unos 2000 números aprendidos); 7 de los 15 DAG eligieron
  sumas de filas. Como se ha descrito para DARTS, la búsqueda favorece los operadores sin parámetros: los filtros de Sobel ocupan la mayoría de las aristas y un filtro aprendido aparece en 3 de los 15 DAG. Fuera de la ejecución incluida, búsquedas más cortas (20 o 40 pasos) eligieron todos los píxeles y alcanzaron de 0.74 a 0.79 con $n$ = 50, un indicio de que la búsqueda más larga se compromete en exceso; esto se vio en el conjunto de prueba, así que es una observación, no un ajuste calibrado. La GPU (una GTX 1080 Ti) no aportó ninguna aceleración: miles de núcleos diminutos, no la aritmética, determinan el tiempo. results/stages.csv contiene todos los números, results/equation.tex todas las ecuaciones encontradas. Trabajos relacionados. La búsqueda de arquitecturas neuronales (Zoph y Le 2017) y su forma diferenciable DARTS; la regresión simbólica, que busca fórmulas en lugar de redes (AI Feynman, Udrescu y Tegmark 2020; PySR, Cranmer 2023; programación genética, Koza 1992); LeNet (LeCun
  et al. 1998) para la CNN. Datos: MNIST (LeCun, Cortes y Burges), licencia CC BY-SA 3.0; data/mnist_subset.npz contiene 1000 imágenes del conjunto de entrenamiento y 2000 imágenes de prueba (la licencia de compartir igual se aplica a este subconjunto), véase data/SOURCES.md. Pruébalo. Cambia show_n para ver el DAG encontrado con 1 o 100 imágenes por dígito, aumenta los pasos de búsqueda o usa una sola semilla para una ejecución rápida.'
meanings:
- 'la regla de tipado: el operador $o$ solo puede situarse en la arista $e$ si transforma la forma de entrada de esa arista en su forma de salida (celda mapa → mapa, pooling, reducción mapa → vector, cabeza vector → logits)'
- softmax enmascarado del tensor de arquitectura $\alpha$ (aristas × operadores); la temperatura $T$ baja de 1 a 0.001, de modo que la mezcla acaba siendo one-hot
- 'todos los operadores que alimenta un nodo, calculados una sola vez para todas sus aristas salientes: una sola convolución da Sobel-$x$, Sobel-$y$, el laplaciano, Gabor y los filtros $3\times 3$ aprendidos $K_e$'
- '$o$ repetido ⇒ sumado: cada nodo es la suma de sus aristas entrantes mezcladas; la salida de la celda es la pila $(x, z_1, z_2, z_3)$'
- características de la reducción $r$ (vec, sumas de filas/columnas, $|\mathcal F|$, plantillas $\langle z, \mu_k\rangle$, PCA $U^\top \mathrm{vec}$, momentos), estandarizadas con las imágenes de entrenamiento
- todas las reducciones × cabezas mezcladas a nivel de logits (sus longitudes de características difieren); lineal $W\hat f + b$ o prototipos $-e^\tau\lVert \hat f - p_k\rVert^2/D$, ambas iniciadas en la media de clase más cercana
- 'DARTS de primer orden: pasos en $\theta$ sobre un minilote de entrenamiento y después pasos en $\alpha$ sobre un minilote de validación'
- 'el DAG discreto escrito en LaTeX, releído por un pequeño analizador y evaluado: exactamente las mismas predicciones que el DAG'
labels:
  search_steps: Pasos de búsqueda DARTS (cada uno una actualización de $\theta$ y de $\alpha$)
  retrain_steps: Pasos de ajuste fino del DAG discreto
  cnn_steps: Pasos de entrenamiento de la CNN
  seeds: Semillas por tamaño del conjunto de entrenamiento
  batch: Tamaño del minilote (equilibrado entre dígitos)
  show_n: Imágenes de entrenamiento por dígito del DAG mostrado
