source_hash: 9c89c68f4f20
title: 方形導波管のモード
summary: 中空の金属管の中を伝わることのできる場のパターンはどれか？各モードは断面上の2次元ヘルムホルツ方程式 $(\partial_i\partial_i + k_c^2)\psi = 0$ を解く——TM ではディリクレ境界、TE ではノイマン境界。離散ラプラシアンを torch.kron で組み立て、torch.linalg.eigh がすべてのモードと遮断周波数を一度に返す。
notes: 既定の寸法は標準的な WR-90 Xバンド導波管（2.286 cm × 1.016 cm）で、その $\text{TE}_{10}$ モードの遮断周波数は 6.56 GHz である。モードは遮断周波数より上でのみ伝搬し、$\beta = \sqrt{(\omega/c)^2 - k_c^2}$ である。同じ $(m, n \ge 1)$ の TE モードと TM モードは遮断周波数が等しい。定数の TE 解（$k_c = 0$）は波を運ばないので除外する。2次精度の差分により、既定の解像度で $k_c$ は厳密値の約1パーセント以内に収まる。
meanings:
- 格子点 $(x_a, y_b)$ における $E_z$（TM）または $H_z$（TE）
- 同じ値を平坦化したもの：$m = a\cdot N_y + b$
- 壁の境界条件を隅の要素に組み込んだ1次元の $\partial^2$
- 2次元ラプラシアン $\partial_i\partial_i$（$i$ は $x, y$ について和）
- 固有値と正規直交固有ベクトル：遮断波数とモード形状
- $\pi\sqrt{(m/a)^2 + (n/b)^2}$、数値の検証用
labels:
  a: 幅 $a$
  b: 高さ $b$
  n_modes: モード数
  n_grid: $b$ 方向の格子点数
