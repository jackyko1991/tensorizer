title: Первичный нуклеосинтез
summary: 'Первые три минуты как жёсткая сеть реакций: нейтроны и протоны выходят из слабого равновесия, дейтериевое «бутылочное горлышко» открывается около $T \approx 80$ кэВ, и почти все нейтроны оказываются в $^4$He. Двенадцать реакций связывают n, p, d, t, $^3$He, $^4$He, $^7$Li и $^7$Be; целый пакет отношений барионов к фотонам $\eta$ интегрируется разом неявной схемой BDF2, что даёт диаграмму Шрамма. При значении Planck $\eta \approx 6.1\times10^{-10}$ гелий и дейтерий согласуются с наблюдениями, а лития получается примерно в 3× больше: космологическая проблема лития, до сих пор не решённая.'
notes: 'Статус: стандартный первичный нуклеосинтез — установленная физика. Его предсказания для $^4$He и D согласуются с наблюдениями при плотности барионов, независимо измеренной по реликтовому излучению; это одна из опор модели горячего Большого взрыва (Альфер, Бете и Гамов 1948; Вагонер, Фаулер и Хойл 1967). Космологическая проблема лития открыта: предсказанное $^7$Li/H примерно в 3 раза выше плато Спит старых звёзд гало ($(1.6\pm0.3)\times10^{-10}$), и ни ядерная физика, ни звёздное выгорание, ни новые частицы пока его не объяснили. Наблюдаемые значения (цитируемые константы): $Y_p = 0.245\pm0.003$ (обзор BBN в PDG), D/H $= (2.527\pm0.030)\times10^{-5}$ (Cooke, Pettini, Steidel 2018). Модель: 12 реакций Smith, Kawano и Malaney (1993) с термоядерными скоростями из базы JINA REACLIB (Cyburt et al. 2010; наборы an06, de04, gi17, go17, cd08, db18) и обратными скоростями из детального равновесия. Указанные приближения: слабые скорости в борновском приближении (без радиационных поправок, поправок
  на конечную массу и температуру), мгновенное отщепление нейтрино ($N_\mathrm{eff} = N_\nu$ вместо 3,044), $^7$Be учитывается как $^7$Li, а t как $^3$He (последующие распады), аппроксимации по T9 замораживаются выше $T_9 = 10$. Из-за этого $Y_p$ примерно на 2 % ниже, чем в прецизионных кодах PRIMAT или PArthENoPE ($0.2470$); D/H совпадает с точностью до нескольких процентов. Попробуйте $N_\nu = 4$: более быстрое расширение замораживает больше нейтронов и повышает $Y_p$ примерно на 0,013 — так BBN считает число сортов нейтрино.'
meanings:
- сколько ядер $i$ расходует и производит реакция $r$ (12 реакций, 8 видов)
- чистое изменение; $\sum_i A_i S_{ri} = 0$ для каждого $r$ (барионное число)
- 'аппроксимации REACLIB: повторный $k$ (7 базисных функций от $T_9$) ⇒ суммируется, затем наборы одной реакции складываются'
- прямые ($\propto n_b \propto \eta$) и обратные (детальное равновесие) скорости для каждого $\eta_b$
- $\prod_j Y_j^{R_{rj}}$, например $Y_d^2$ для d + d
- повторный $r$ ⇒ сумма по реакциям
- точный якобиан для метода Ньютона
- одно ньютоновское обновление неявного шага BDF2 для всего пакета $\eta$
- слабые скорости в борновском приближении, нормированные на время жизни нейтрона $\tau_n$
labels:
  n_eta: Число значений $\eta$ в пакете
  eta10: Выделенное $\eta \times 10^{10}$ (левая панель)
  tau_n: Время жизни нейтрона $\tau_n$
  n_nu: Число сортов нейтрино $N_\nu$
  n_steps: Шаги BDF2 по $\ln T$
