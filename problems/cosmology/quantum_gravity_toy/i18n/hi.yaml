title: 'क्वांटम ब्रह्मांडिकी: लूप बाउंस'
summary: 'क्वांटम गुरुत्व का एक खिलौना मॉडल: द्रव्यमानहीन अदिश क्षेत्र से भरे समतल ब्रह्मांड की लूप क्वांटम ब्रह्मांडिकी (LQC)। संबंध (connection) $b$ को प्लांक-आकार क्षेत्रफल वाले लूप की होलोनॉमी $\sin(\lambda b)/\lambda$ से बदलने पर फ्रीडमैन समीकरण $H^2 = \frac{8\pi G}{3}\rho(1-\rho/\rho_c)$ बन जाता है। ब्रह्मांडों के एक बैच पर RK4 दिखाता है कि बिग बैंग की जगह $\rho = \rho_c \approx 0.41\,\rho_\mathrm{P}$ पर एक बाउंस आता है, जबकि उसी मॉडल का व्हीलर–डेविट (Wheeler–DeWitt) तरंग-पैकेट शास्त्रीय संकुचन का अनुसरण करते हुए विलक्षणता में चला जाता है। क्वांटम गुरुत्व एक खुली शोध समस्या है; यह केवल एक सरलीकृत दृष्टिकोण है।'
notes: 'प्लांक इकाइयाँ $G = \hbar = c = 1$; बार्बेरो–इम्मिर्ज़ी (Barbero–Immirzi) प्राचल $\gamma = 0.2375$। कौन-सा दृष्टिकोण: उन्नत ($\bar\mu$) गतिकी वाली लूप क्वांटम ब्रह्मांडिकी के प्रभावी समीकरण (Ashtekar, Pawlowski और Singh 2006; Taveras 2008), एक स्थानिक रूप से समतल FRW ब्रह्मांड के लिए जिसमें द्रव्यमानहीन अदिश क्षेत्र घड़ी का काम भी करता है। स्थिति: क्वांटम गुरुत्व का कोई स्वीकृत सिद्धांत नहीं है। LQC लूप क्वांटम गुरुत्व से प्रेरित, सममिति द्वारा घटाया गया क्वांटीकरण है; पूर्ण LQG से इसका संबंध स्थापित नहीं है, और प्रभावी समीकरण एक सन्निकटन हैं जो इस मॉडल में तीव्र रूप से केंद्रित क्वांटम अवस्थाओं के संख्यात्मक विकास से मेल खाते हैं। किसी भी प्रेक्षण ने बाउंस का परीक्षण नहीं किया है। जो दिखाया गया है वह मॉडल के लिए सटीक है: बाध्यता संरक्षित रहती है, प्रभावी फ्रीडमैन समीकरण लागू होता है, बाउंस घनत्व $\rho_c$ हर $p_\varphi$ के लिए समान है, और आयतन $V(t) = \sqrt{V_B^2 + 12\pi G p_\varphi^2 t^2}$ का पालन करता है। $\rho_c$ से दूर (या $\lambda \to 0$ पर) शास्त्रीय सामान्य आपेक्षिकता लौट
  आती है: $H^2 = 8\pi G\rho/3$ और आयतन सीमित समय में रैखिक रूप से $V = 0$ तक गिरता है (लाल डैश: विलक्षणता)। धूसर पट्टी उसी मॉडल (लूप के बिना क्वांटीकृत, $x = \ln V$) का सटीक व्हीलर–डेविट हल है: यह एक मुक्त तरंग-पैकेट है जो शास्त्रीय संकुचन रेखा के साथ $V \to 0$ की ओर फिसलता है, जैसा APS ने पाया। हल्के वक्र छोटे लूप ($\lambda/2$, $\lambda/4$) का उपयोग करते हैं: बाउंस बाद में, अधिक घनत्व पर होता है। फ़्रेम बाउंस के आसपास घने रखे गए हैं।'
meanings:
- बैच में प्रत्येक ब्रह्मांड $b$ का आयतन, संबंध और अदिश क्षेत्र, बाध्यता सतह $C = 0$ पर
- 'लूप आकार: $\lambda^2 = 4\sqrt3\pi\gamma\,\ell_P^2$ LQG क्षेत्रफल अंतराल है; छोटा $\lambda$ ⇒ बड़ा $\rho_c$'
- प्रभावी बाध्यता के हैमिल्टन समीकरण, सभी ब्रह्मांडों के लिए एक साथ
- उचित समय में RK4 प्रक्षेपवक्र
- हैमिल्टनी बाध्यता, $0$ ही रहनी चाहिए (इसका RK4 विचलन टर्मिनल में छपता है)
- '$3/(8\pi G\gamma^2\lambda^2)$: बाउंस घनत्व'
- 'दोहराया गया $k$ ⇒ योग: घड़ी $\varphi_p$ और $x = \ln V$ के ग्रिड पर व्हीलर–डेविट पैकेट'
labels:
  p_phi: अदिश क्षेत्र संवेग $p_\varphi$ ($\hbar$)
  gap_scale: LQG क्षेत्रफल अंतराल के सापेक्ष लूप आकार $\lambda$
  log10_rho_start: प्रारंभिक घनत्व $\log_{10}(\rho/\rho_c)$
  dt: RK4 समय चरण $\Delta t$
  spread: व्हीलर–डेविट पैकेट की चौड़ाई $\Delta k/k_0$
