<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Periodic box with two counter-rotating Taylor–Green vortex cells, velocity u, vorticity omega stretched along a tube, viscosity nu">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- periodic box (cube in perspective) -->
    <rect x="30" y="40" width="110" height="100" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M30,40 L60,16 L170,16 L140,40 M170,16 L170,116 L140,140" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="85" y1="40" x2="85" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- two counter-rotating cells -->
    <ellipse cx="57" cy="90" rx="19" ry="30" fill="#93c5fd" fill-opacity="0.45" stroke="#2563eb" stroke-width="2"/>
    <ellipse cx="113" cy="90" rx="19" ry="30" fill="#93c5fd" fill-opacity="0.45" stroke="#2563eb" stroke-width="2"/>
    <path d="M57,60 A19,30 0 0 1 76,88" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowb)"/>
    <path d="M113,60 A19,30 0 0 0 94,88" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#arrowb)"/>
    <text x="78" y="66" font-style="italic" fill="#1e40af">u</text>
    <!-- vortex stretching: a thinning tube -->
    <path d="M186,40 C196,70 206,90 212,140" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <path d="M186,40 C196,70 206,90 212,140" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="192" y1="102" x2="206" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="212" y="78" font-style="italic" fill="#b91c1c">ω</text>
    <text x="40" y="34" font-size="13" fill="#374151">T³</text>
    <text x="150" y="152" font-size="13" font-style="italic" fill="#374151">ν ∇²u</text>
  </g>
</svg>
