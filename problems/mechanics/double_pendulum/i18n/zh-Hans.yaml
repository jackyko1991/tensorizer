source_hash: 75e6d7e3dc93
title: 双摆与混沌
summary: 双摆的拉格朗日方程写成 $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$。RK4 的每一级都构造 $2\times 2$ 质量矩阵张量并调用 torch.linalg.solve；两个几乎相同的初态逐渐分离，展示混沌。
notes: 批量中包含两个双摆，它们的 $\theta_2$ 相差 $\delta$。两者之差大致按指数增长，直到运动毫不相关，而各自的能量仍以很高精度保持不变（float64 + 小步长 RK4）。小幅摆动时系统有两个简正模；质量和长度相等时 $\omega^2 = (2 \mp \sqrt2)\,g/L$。摆杆无质量，支点无摩擦。
meanings:
- 双摆 $b$ 相对竖直向下方向的角度 $(\theta_1, \theta_2)$
- 角速度
- 随位形变化的质量矩阵，非对角元 $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 广义力：离心耦合 + 重力
- 一次调用对整个批量求解 $M\ddot q = f$
- 对 $i$ 和 $j$ 求和：动能的两倍
labels:
  theta1: 初始 $\theta_1$
  theta2: 初始 $\theta_2$
  delta: $\theta_2$ 的扰动 $\delta$
  m1: 上摆质量 $m_1$
  m2: 下摆质量 $m_2$
  L1: 上摆杆长 $L_1$
  L2: 下摆杆长 $L_2$
  t_max: 模拟时长
