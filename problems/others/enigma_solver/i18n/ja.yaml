source_hash: 9231afd9bb4a
title: 置換テンソルでエニグマ暗号機を解読する
summary: 物理ではなく、ただのお楽しみ：3 ローターの Enigma I のキー入力 1 回は、八つの $26\times26$ 置換行列の積であり、各ローターはその位置に応じた巡回シフトで共役をとられる。英文のメッセージを秘密のローター順序と開始位置で暗号化し、各ローター順序について $26^3 = 17\,576$ 通りの開始位置すべてを一つのバッチテンソルとして同時に復号し、文字統計が最も英語らしいテキストを残すことで解読する。
notes: 反転ローター $U$ は固定点のない対称な置換なので、$Q = R_3R_2R_1S$ として $E = Q^{-1}UQ$ もそうである：$E^2 = I$（同じ設定で復号できる）かつ $E_{ii} = 0$（どの文字も自分自身には暗号化されない。暗号解読者が利用した弱点）。各キー入力の前に右ローターが一つ進む。それがノッチの位置にあると中央ローターも送り、中央ローターが自身のノッチにあると左ローターと一緒に進む（ダブルステップ現象）。テストベクトル：ローター I-II-III、反転ローター B、リング AAA、開始 AAA で AAAAA は BDZGO になる。歴史：Marian Rejewski は 1932 年に置換群論でエニグマを解読し、チューリングと Welchman のボンブ（1940）は統計ではなく、クリブ（天気予報のような推測された平文）を使ってローター順序と位置を探索した。ここでの純粋に統計的な攻撃、すなわち一致指数で復号結果を順位付けする方法は、James Gillogly が 1995 年に（Cryptologia で）発表したもので、後の段階ではリング設定とプラグも復元した。単純化：リング設定は AAA で攻撃者に既知、プラグボードは空なので、鍵空間はわずか $60 \times 26^3 \approx 10^6$ 通りで、正しい設定ははっきりと際立つ。実際の戦時中のケーブル 10 本のプラグボードは約 $1.5 \times 10^{14}$ 通りの選択肢を加え、ローターの両側で 26 文字中 20 文字を入れ替え、文字統計を大きくかき乱すので、正しいローター設定は誤った設定をかろうじて上回る程度になる。そのとき Gillogly の攻撃にはプラグに対する山登り法が必要で、短いメッセージでは失敗する。文字数を減らしたり（約 60 から 100）、もう一方のスコアを使ったりして、統計がいつ信頼できなくなるか見てみよう。ローター I–III だけを探索すると、IV や V を使う鍵は見つからない。
meanings:
- 文字はワンホットベクトル $e_x$、または単にそのインデックス $x \in \{0, \dots, 25\}$（A = 0）
- ローター I–V の歴史的な配線：接点 $b$ が接点 $a$ に配線されているとき $W_{ab} = 1$
- 巡回シフト $x \to x + o$；$o_k$ = キー入力 $t$ におけるローター $k$ の窓の文字 − リング設定
- 繰り返される $a, b$ ⇒ 和：回転したローター；インデックスでは $x \to (w[(x + o) \bmod 26] - o) \bmod 26$
- キー入力 1 回：プラグボード $S$、右 $R^{(1)}$ から左 $R^{(3)}$ へのローター、反転ローター $U$ を経て戻る；$(R^{-1})_{ab} = R_{ba}$
- 26 通りすべてのオフセットでのローターを参照表にしたもの。これで $R\,e_x$ は F[o, x] となり、数百万文字を一度に処理できる
- すべての開始位置 $b$ で復号した暗号文（$B = 26^3$）；$E^2 = I$ なので復号 = 暗号化
- 候補 $b$ に文字 $k$ が現れる回数
- 繰り返される $k$ ⇒ 和：二つの文字が一致する確率、英語で約 0.066、ランダムなテキストで $1/26 \approx 0.038$
- もう一つのスコア：英語の単一文字対数尤度の平均 $c_{bk}\log p_k / N$
labels:
  message: 平文
  rotor_order: 秘密のローター順序（左-中-右）
  start_left: 左ローターの秘密の開始位置
  start_middle: 中央ローターの秘密の開始位置
  start_right: 右ローターの秘密の開始位置
  n_letters: スコアに使う文字数 $N$
  score: スコア：一致指数または単一文字対数尤度
  search_rotors: 探索するローター（60 通りまたは 6 通りの順序）
