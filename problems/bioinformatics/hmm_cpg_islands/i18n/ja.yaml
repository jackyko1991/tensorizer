source_hash: 5165c35a9a08
title: 隠れマルコフモデルによる CpG アイランドの検出
summary: DNA 配列は、通常の背景と GC に富む CpG アイランドの間を見えないまま切り替わる。2 状態の隠れマルコフモデルがそれらを見つける：前向き–後ろ向きアルゴリズムは各位置でアイランドにいる確率を与え、ビタビアルゴリズムは単一の最良の分割を与え、バウム–ウェルチアルゴリズムは配列だけからモデルを学習する。配列に沿った各ステップは状態についてのバッチ化された行列積であり、対数空間で保持する。事後確率が植え込んだアイランドに固定されていく様子を見よう。
notes: データは合成である：各配列にはランダムな位置に 100–300 文字のアイランドが植え込まれ、その内部では C と G が多い。1 文字だけでは状態についてほとんど何もわからないが、連鎖 $A$ によって状態が持続するので、前向き・後ろ向きの計算は区間全体の証拠を集約する。バウム–ウェルチは期待値最大化法（EM）である：現在のモデルの下で $\gamma$ と $\xi$ を計算し、$E_{k\alpha}$ を各状態での文字の期待頻度に、$A_{ij}$ を切り替えの期待頻度に設定する。尤度は決して減少しない。あいまいな初期推定から始めて、真のモデル（緑の線）に近いところに到達する。実際の CpG アイランドは単に C と G に富むのではなく、ジヌクレオチド CG に富む。Durbin et al. はこれを 8 状態（A+、C+、G+、T+、A−、…）でモデル化し、その遷移はジヌクレオチド頻度になる。アイランドの GC 含量を下げると問題は難しくなる。
meanings:
- 配列 $b$ の位置 $t$ の文字。A、C、G、T についての one-hot
- 初期確率、遷移確率、出力確率。状態 0 が背景、状態 1 がアイランド
- $\alpha$ の繰り返し ⇒ 和：各状態が観測された文字を出力する尤もらしさ
- $i$ の繰り返し ⇒ 和。最大要素をくくり出した $\log\alpha$（log-sum-exp）として保持し、アンダーフローを防ぐ
- $j$ の繰り返し ⇒ 和：状態 $i$ を与えたときの残りの配列の確率
- 事後確率 $P(z_t = k \mid x)$。$\gamma_{bt1}$ が青い曲線
- ビタビ：和の代わりに最大値をとる同じ漸化式と、最良経路のためのバックポインタ
- $b, t$ の繰り返し ⇒ 和：$i \to j$ の切り替えの期待回数。バウム–ウェルチは $A_{ij} \propto \xi_{ij}$ とする
labels:
  n_seq: 配列数 $B$
  length: 長さ $T$
  n_islands: 配列あたりに植え込むアイランド数
  gc_island: アイランドの GC 含量
  iterations: バウム–ウェルチの反復回数
