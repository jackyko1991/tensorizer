source_hash: 5a26364d7c17
title: 'Матричная механика: осциллятор Гейзенберга из лестничных операторов'
summary: 'Ни волновых функций, ни сетки: в базисе чисел заполнения $|0\rangle, \dots, |N-1\rangle$ понижающий оператор — это матрица $a_{mn} = \sqrt n\,\delta_{m,n-1}$, а $X$, $P$ и $H = \tfrac12(P^2 + X^2)$ получаются произведениями матриц. Её собственные значения равны $n + \tfrac12$, и $[X, P] = i$. С помощью torch.linalg.matrix_exp движется оператор $X(t) = U^\dagger X U$ (картина Гейзенберга) или состояние $U|\alpha\rangle$ (картина Шрёдингера); обе дают одно и то же $\langle X\rangle(t)$, а когерентное состояние обходит фазовое пространство по кругу, как классическая масса на пружине.'
notes: 'Единицы $\hbar = m = \omega = 1$. Именно так квантовую механику впервые записали Гейзенберг, Борн и Йордан в 1925 году: наблюдаемые — это матрицы, и их произведения не коммутируют. Обрезание до $N$ состояний — единственное приближение. Оно нарушает $[X, P] = i$ в последнем диагональном элементе, который должен равняться $i(1 - N)$, поскольку след коммутатора конечных матриц равен 0, и даёт последнему базисному состоянию энергию $(N-1)/2$ вместо $N - \tfrac12$; состояния намного ниже $N$ точны. В картине Гейзенберга каждый элемент $X(t)_{mn} = X_{mn}e^{i(E_m - E_n)t}$ вращается с боровской частотой, так что для осциллятора $X(t) = X\cos t + P\sin t$ — классическое решение, записанное для матриц. Когерентное состояние $|\alpha\rangle$ имеет $\langle X\rangle(t) = \sqrt2\,\mathrm{Re}(\alpha e^{-it})$ и обходит фазовое пространство по кругу радиуса $\sqrt2\,\alpha$. Расчёт на сетке в задаче Квантовый гармонический осциллятор даёт ту же лестницу и те же колебания в совершенно другом представлении.
  Попробуйте $\lambda > 0$: уровни перестают быть эквидистантными, боровские частоты расходятся, и круг закручивается внутрь по мере дефазировки пакета. При малом $\lambda$ энергии совпадают с теорией возмущений первого порядка, $\lambda\langle n|X^4|n\rangle = \lambda\,\tfrac34(2n^2 + 2n + 1)$.'
meanings:
- '$\sqrt1, \sqrt2, \dots$ на наддиагонали: $a|n\rangle = \sqrt n\,|n-1\rangle$'
- $(a + a^\dagger)/\sqrt2$ и $i(a^\dagger - a)/\sqrt2$, обе эрмитовы
- 'повторяющийся $k$ ⇒ суммирование: произведения матриц; равно $a^\dagger a + \tfrac12$, кроме последнего элемента'
- '$i\,\delta_{mn}$, но $i(1 - N)$ в углу: у конечной матрицы не может быть $[X, P] = i$ (её след равен 0)'
- $n + \tfrac12$; с $\lambda X^4$ сдвигаются на $\approx \lambda\,\tfrac34(2n^2 + 2n + 1)$
- оператор эволюции $e^{-iHt}$ сразу для всех моментов времени
- 'повторяющиеся $k, l$ ⇒ суммирование: картина Гейзенберга, движется оператор'
- '$e^{-|\alpha|^2/2}\alpha^n/\sqrt{n!}$: смещённое основное состояние'
- 'картина Шрёдингера с $c(t) = Uc$: те же числа, что и в картине Гейзенберга'
labels:
  alpha: Амплитуда когерентного состояния $\alpha$
  lam: Ангармонизм $\lambda$ (добавляет $\lambda X^4$)
  periods: Время моделирования
  n_states: Размер базиса $N$
