source_hash: 85a6136cffba
title: Закон Снеллиуса в слоистых средах
summary: Веер световых лучей пересекает три слоя с разными показателями преломления. Векторная форма закона Снеллиуса преломляет все лучи сразу одним einsum и переключается на зеркальное отражение там, где наступает полное внутреннее отражение.
notes: 'Лучи распространяются со скоростью $c/n$, поэтому штриховая линия через концы лучей — волновой фронт: в плотных слоях он отстаёт. По умолчанию нижний слой — воздух ($n = 1$); лучи круче критического угла $\arcsin(n_3/n_2)$ на этой границе испытывают полное внутреннее отражение и уходят обратно вверх. Сделайте два показателя равными, и граница исчезнет.'
meanings:
- единичный вектор направления луча $r$, компонента $i \in \{x, y\}$
- единичная нормаль к поверхности, обращённая к падающему лучу
- отношение показателей $n_1/n_2$ на границе, куда попадает луч
- 'повторяющийся $j$ ⇒ суммирование: $\cos\theta_i$ каждого луча'
- направление преломлённого луча (по-прежнему единичный вектор)
- зеркальное направление, используется там, где $1 - \eta^2(1 - c^2) < 0$ (ПВО)
labels:
  n1: Показатель верхнего слоя $n_1$
  n2: Показатель среднего слоя $n_2$
  n3: Показатель нижнего слоя $n_3$
  n_rays: Лучей в веере
  max_angle: Наибольший угол луча
  t_max: Время моделирования
