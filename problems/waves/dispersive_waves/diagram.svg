<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Wave packet on deep water: crests move at the phase velocity, the envelope at half that speed, the group velocity">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- deep water -->
    <path d="M16,71.8 L20,71.8 L24,72.0 L28,72.4 L32,72.7 L36,72.6 L40,71.8 L44,70.4 L48,69.4 L52,70.1 L56,72.8 L60,76.6 L64,78.6 L68,76.3 L72,69.5 L76,61.9 L80,59.2 L84,64.9 L88,77.2 L92,88.5 L96,90.6 L100,80.7 L104,64.2 L108,51.8 L112,51.8 L116,64.2 L120,80.7 L124,90.6 L128,88.5 L132,77.2 L136,64.9 L140,59.2 L144,61.9 L148,69.5 L152,76.3 L156,78.6 L160,76.6 L164,72.8 L168,70.1 L172,69.4 L176,70.4 L180,71.8 L184,72.6 L188,72.7 L192,72.4 L196,72.0 L200,71.8 L204,71.8 L208,71.9 L212,72.0 L216,72.0 L220,72.0 L224,72.0 L224,150 L16,150 Z" fill="#93c5fd" fill-opacity="0.35" stroke="none"/>
    <!-- envelope -->
    <path d="M16,71.8 L24,71.6 L32,71.3 L40,70.6 L48,69.4 L56,67.6 L64,65.2 L72,62.1 L80,58.7 L88,55.2 L96,52.3 L104,50.4 L112,50.0 L120,51.2 L128,53.6 L136,56.9 L144,60.4 L152,63.7 L160,66.5 L168,68.6 L176,70.0 L184,70.9 L192,71.5 L200,71.8 L208,71.9 L216,72.0 L224,72.0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- surface -->
    <path d="M16,71.8 L20,71.8 L24,72.0 L28,72.4 L32,72.7 L36,72.6 L40,71.8 L44,70.4 L48,69.4 L52,70.1 L56,72.8 L60,76.6 L64,78.6 L68,76.3 L72,69.5 L76,61.9 L80,59.2 L84,64.9 L88,77.2 L92,88.5 L96,90.6 L100,80.7 L104,64.2 L108,51.8 L112,51.8 L116,64.2 L120,80.7 L124,90.6 L128,88.5 L132,77.2 L136,64.9 L140,59.2 L144,61.9 L148,69.5 L152,76.3 L156,78.6 L160,76.6 L164,72.8 L168,70.1 L172,69.4 L176,70.4 L180,71.8 L184,72.6 L188,72.7 L192,72.4 L196,72.0 L200,71.8 L204,71.8 L208,71.9 L212,72.0 L216,72.0 L220,72.0 L224,72.0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- velocities: crest (phase) and envelope (group) -->
    <line x1="110" y1="18" x2="170" y2="18" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="176" y="23" font-style="italic" fill="#b91c1c">v</text>
    <text x="184" y="27" font-size="11" font-style="italic" fill="#b91c1c">p</text>
    <line x1="110" y1="36" x2="140" y2="36" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
    <text x="146" y="41" font-style="italic" fill="#b45309">v</text>
    <text x="154" y="45" font-size="11" font-style="italic" fill="#b45309">g</text>
    <line x1="110" y1="12" x2="110" y2="48" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- gravity and depth -->
    <line x1="200" y1="96" x2="200" y2="128" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="207" y="122" font-style="italic" fill="#b91c1c">g</text>
    <text x="30" y="132" font-size="13" fill="#1e40af">deep water</text>
  </g>
</svg>
