title: संख्यात्मक समाकलन और अभिसरण कोटि
summary: समलंब नियम, सिम्पसन नियम और गाउस–लेजांद्र क्षेत्रकलन (quadrature) सभी एक भारित योग $\sum_k w_k f(x_k)$ हैं, कई समाकल्यों पर एक साथ एक einsum। गाउस नोड और भार एक आइगेनमान समस्या (Golub–Welsch) से आते हैं। log–log अक्षों पर त्रुटियाँ ढलान 2 और 4 के साथ, या चरघातांकी रूप से, घटती हैं, जब तक कोई मोड़ या विचित्रता उच्च कोटि को छीन न ले।
notes: 'चिकने समाकल्य के लिए समलंब त्रुटि $h^2 \propto N^{-2}$ की तरह और सिम्पसन की $N^{-4}$ की तरह घटती है: $N$ दोगुना करने से वे 4 और 16 से भाग होती हैं। $N$ नोड वाला गाउस–लेजांद्र $2N - 1$ घात तक के हर बहुपद को ठीक-ठीक समाकलित करता है, इसलिए विश्लेषिक फलन के लिए इसकी त्रुटि चरघातांकी रूप से गिरती है जब तक $10^{-16}$ के पास float64 पूर्णांकन तक न पहुँचे। ये कोटियाँ टेलर प्रसार से आती हैं, इसलिए इन्हें अवकलज चाहिए। एक मोड़ $|x - a|$ के साथ द्वितीय अवकलज एक नुकीला उभार है: मोड़ के आर-पार फैला हर नियम वहाँ $O(h^2)$ त्रुटि करता है, इसलिए सिम्पसन और गाउस कोटि 2 पर लौट आते हैं (वक्र दाँतेदार है क्योंकि मोड़ अपने पैनल में कहाँ पड़ता है यह $N$ के साथ बदलता है)। $(1+x)^{\alpha}$ के साथ अवकलज अंत्यबिंदु पर अनंत हो जाते हैं: समलंब और सिम्पसन नियम कोटि $1 + \alpha$ पर गिरते हैं और गाउस, जिसके नोड सिरों की ओर सघन होते हैं, लगभग $2 + 2\alpha$ पर। उपाय है अंतराल को मोड़ पर विभाजित करना या चर बदलना ताकि समाकल्य चिकना हो जाए। पूर्ण संख्या $\alpha$ (एक बहुपद) आज़माएँ और गाउस को सटीक होते देखें, या मोड़
  को ग्रिड नोड पर रखें ($a = 0.3$ एक नोड है जब भी $N$, 20 का गुणज हो): तब समलंब नियम दो सीधे टुकड़ों के लिए सटीक है और पूर्णांकन त्रुटि तक गिर जाता है।'
meanings:
- समान दूरी वाले नोड; भार $h(\tfrac12, 1, \dots, 1, \tfrac12)$ और $\tfrac h3(1, 4, 2, \dots, 4, 1)$
- लेजांद्र पुनरावृत्ति संबंध का त्रिविकर्णी आव्यूह, विकर्ण के बगल में $\beta_k = k/\sqrt{4k^2 - 1}$
- आइगेनमान गाउस–लेजांद्र नोड हैं, आइगेनसदिश स्तंभों में
- हर आइगेनसदिश के पहले घटक से गाउस भार; उनका योग $\int_{-1}^{1} dx = 2$ है
- हर नोड पर चिकना, मोड़ वाला और अंत्यबिंदु वाला समाकल्य
- 'दोहराया गया $k$ ⇒ योग: तीनों समाकल एक साथ'
labels:
  n_max: सबसे बड़ा $N$
  kink: मोड़ की स्थिति $a$
  alpha: अंत्यबिंदु घात $\alpha$
