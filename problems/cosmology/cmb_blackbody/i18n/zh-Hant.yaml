source_hash: 79a2f1fd310e
title: 宇宙微波背景：完美的黑體（COBE FIRAS）
summary: COBE 的 FIRAS 儀器在 43 個頻率上量測宇宙微波背景，發現了迄今所見最完美的黑體。一批四個模型（僅普朗克定律、加上玻色–愛因斯坦化學勢 $\mu$、加上康普頓 $y$ 畸變、兩者皆加）在單一張量中擬合真實的 FIRAS 數據表，雅可比矩陣由自動微分求得。擬合給出 $T \approx 2.725$ K，42 個自由度下 $\chi^2 \approx 45$，殘差低於峰值的 $10^{-4}$，畸變與零相符（$|\mu| \lesssim 10^{-4}$、$|y| \lesssim 10^{-5}$），並由 $T$ 推得每 cm³ 約 411 個光子。
notes: 1990 年，FIRAS（NASA COBE 衛星上的遠紅外絕對分光光度計）將天空與外部黑體校準源比較，未發現任何差異；最終光譜（Fixsen et al. 1996）與普朗克曲線的偏差小於峰值的百萬分之 50。John Mather 與 George Smoot 共同獲得 2006 年諾貝爾物理學獎，「表彰他們發現宇宙微波背景輻射的黑體形式及其各向異性」。如此完美的黑體意味著早期宇宙炙熱、緻密且處於熱平衡：在紅移 $z \sim 2\times10^6$ 之後釋放的能量會留下化學勢 $\mu$（玻色–愛因斯坦光譜，$z \gtrsim 2\times10^5$）或康普頓 $y$ 畸變（熱電子把光子能量提升，$z \lesssim 5\times10^4$；形狀與蘇尼亞耶夫–澤爾多維奇效應相同，零點在 $x = 3.83$ 即 217 GHz，且保持光子數守恆）。我們的擬合只用對角誤差，得到 95 % 上限約為 $|\mu| < 7\times10^{-5}$ 與 $|y| < 6\times10^{-6}$；FIRAS 發表的上限 $|\mu| < 9\times10^{-5}$ 與 $|y| < 1.5\times10^{-5}$ 較寬，因為它們使用完整的相關共變異數矩陣，並計入系統（校準與銀河系）不確定度。解讀溫度時要小心：擬合在統計上把 $T$ 確定到約 $10^{-5}$ K，但絕對尺度來自校準源的測溫，而且 LAMBDA 數據表將光譜寫成 2.725 K 黑體加上已發表的殘差，所以 $T = 2.725$ K 是內建的；目前最佳的絕對值為 $2.72548 \pm 0.00057$ K（Fixsen 2009）。由 $T$ 可得 $n_\gamma \approx 411$ cm$^{-3}$ 與 $u_\gamma = aT^4 \approx 0.26$ eV cm$^{-3}$。動畫中，左圖顯示擬合從初始猜測收斂的過程（誤差棒放大 400 倍，如同那張著名的圖，否則根本看不見）；右圖接著放大殘差，以峰值的 $10^{-4}$ 為單位，並畫出處於我們 95 % 上限的 $\mu$ 或 $y$ 在重新擬合 $T$ 後會留下的形狀。數據：D. J. Fixsen et al., ApJ 473, 576 (1996) 的表 4，取自 NASA
  的 LAMBDA 資料庫（https://lambda.gsfc.nasa.gov/data/cobe/firas/monopole_spec/firas_monopole_spec_v1.txt），屬公有領域，隨附為 data/firas_monopole.csv。
meanings:
- 43 個 FIRAS 波數（cm$^{-1}$）、強度與 $1\sigma$ 誤差（MJy/sr）
- 批次中每個模型 $b$ 一列 $(T, \mu, y)$
- $h\nu/kT$，由 $(B,1)$ 對 $(F,)$ 廣播得到
- 玻色–愛因斯坦佔據數加上 Kompaneets $y$ 項，乘以 $2hc\tilde\nu^3$
- 對 $\sum_b I_{bf}$ 自動微分：各列彼此獨立，一次呼叫即得每個模型的雅可比矩陣
- 重複的 $f$ ⇒ 求和：費雪矩陣；其逆矩陣即共變異數矩陣
- 所有模型同時進行一步 Levenberg–Marquardt 迭代
- 每個模型的擬合優度
labels:
  T_init: $T$ 的初始猜測
  steps: Levenberg–Marquardt 步數
