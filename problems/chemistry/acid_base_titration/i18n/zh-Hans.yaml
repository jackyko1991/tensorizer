source_hash: e3d9a69287ac
title: 酸碱滴定曲线
summary: 向强酸、弱酸和磷酸中逐滴加入氢氧化钠。不必为每个区域各用一套教科书近似公式，而是用二分法对一个电荷平衡方程求解 $[\mathrm{H^+}]$，在一个 $(A, N)$ 张量中同时处理每种酸和每个体积。曲线给出等当点（$d\mathrm{pH}/dV$ 的峰）、缓冲区以及物种分数 $\alpha_j(\mathrm{pH})$。
notes: 电荷平衡在整条曲线上处处成立，因此它取代了起点、缓冲区、等当点和碱过量各自的计算方法。每一项都是 pH 的单调函数，这使二分法很安全：它总能把区间减半，不会漏掉根。强酸（以 pKa $\approx -6$ 建模）给出陡峭的突跃，等当点处 pH 为 7，此时只剩 $\mathrm{Na^+}$、$\mathrm{Cl^-}$ 和水。弱酸起点较高，在缓冲区内平缓上升，等当点高于 7，因为其共轭碱 $\mathrm{A^-}$ 本身就是弱碱。到达等当点一半时 $[\mathrm{HA}] = [\mathrm{A^-}]$，所以由 Henderson–Hasselbalch 方程 $\mathrm{pH} = \mathrm{p}K_a + \log_{10}([\mathrm{A^-}]/[\mathrm{HA}])$ 得到 $\mathrm{pH} = \mathrm{p}K_a$：pKa 值正是通过滴定测得的。磷酸（pKa ≈ 2.15、7.20 和 12.35，25 °C 下的近似值）显示两个突跃；第三个质子酸性太弱，0.1 M NaOH 无法明显地将其夺走，它的突跃淹没在过量的碱中。物种面板说明了原因：每个 $\alpha_j$ 在两个 pKa 值之间达到峰值，相邻两者恰好在 $\mathrm{pH} = \mathrm{p}K$ 处相等。简化：用浓度代替活度，25 °C，不考虑空气中的 CO₂。
meanings:
- 酸 $a$、质子 $i$；缺少的质子以 $+\infty$ 填充（$K = 0$）
- 累积常数：pKa 值累加和的 $-$，$\beta_{a0} = 1$
- 将 $V_0$ 的酸与 $V_n$ 的碱混合后的酸和钠
- 物种分数；分母中对 $k$ 的求和就是 softmax 归一化
- 重复的 $j$ ⇒ 求和：每个酸分子释放的质子数 $\bar n$
- 对 $\mathrm{pH} = -\log_{10}h$ 用二分法，所有酸和体积都在一个张量中
- 斜率；其峰值（用最大池化找到）就是等当点
labels:
  c_acid: 酸浓度 $c_a$
  V0: 酸体积 $V_0$
  c_base: NaOH 浓度 $c_b$
  V_max: NaOH 最大体积
  pKa_weak: 弱酸的 pKa（乙酸 ≈ 4.76）
