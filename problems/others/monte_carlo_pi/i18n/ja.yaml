source_hash: a88c161966b6
title: モンテカルロ法：ランダムなダーツで $\pi$ を推定する
summary: 単位正方形にランダムにダーツを投げ、四分円の内側に入った数を数える：その割合は $\pi/4$ に近づく。多数の独立な実験を一つの $(B, N)$ テンソルで並べて実行すると、モンテカルロ法を特徴づける法則、すなわち誤差が $1/\sqrt N$ でしか縮まないことがわかる。ビュフォンの針は、18 世紀に遡るもう一つの推定を与える。
notes: どの推定値も平均としては正しいがノイズを含み、そのノイズは $1/\sqrt N$ でしか減らない：正しい桁を一つ増やすには 100 倍のダーツが要る。この収束の速さは次元に依存しないため、モンテカルロ法は多変数の積分に最適な手法であり、中性子輸送やイジング模型からオプション価格評価、医学的線量測定における光子の経路まで使われている。灰色の曲線は個々の実験で、それぞれふらつくが、すべて $\sigma_N$ が定める帯の中にとどまる。乱数シードを固定しているので、どの実行も再現できる。実験数を増やすと、ばらつきが理論とよりよく一致する様子がわかる。
meanings:
- 実験 $b$ のダーツ $n$、座標 $i$、$[0, 1)$ 上の一様分布
- 繰り返される $i$ ⇒ 和をとる：角からの距離の 2 乗。ダーツが四分円の内側なら 1
- 累積和を $n$ で割る：各実験について、ダーツを投げるごとの推定値
- 実験間のばらつき。理論値 $\sqrt{\pi(4-\pi)/n}$ は二項分布の分散から
- ビュフォンの針：確率 $2\ell/(\pi d)$ で線と交わるので $\hat\pi = 2\ell N/(d\,\text{crossings})$
labels:
  n_darts: 1 実験あたりのダーツ数 $N$
  n_experiments: 実験数 $B$
  needle_length: 針の長さ $\ell/d$
