source_hash: 160447300c99
title: 'MRI: T1·T2 이완과 영상 대조도'
summary: 고주파 펄스 뒤에 각 조직의 자화는 시간 상수 $T_1$로 자기장 방향을 따라 회복되고, 가로 성분은 $T_2$로 감쇠합니다. 스핀 에코 신호를 (조직, $TR$, $TE$)에 대한 하나의 텐서로 계산하고 만화 같은 뇌의 조직 레이블 지도와 축약하면, $TR$과 $TE$의 선택에 따라 영상이 T1, PD, T2 강조 영상이 되는 과정을 볼 수 있습니다.
notes: 짧은 $TR$과 짧은 $TE$는 T1 강조를 줍니다. 지방과 백질은 밝고, 뇌척수액은 $T_1$이 길어 회복할 시간이 없었으므로 어둡습니다. 긴 $TR$에 짧은 $TE$를 쓰면 $T_1$ 인자가 사라져 양성자 밀도(PD) 강조가 남습니다. 긴 $TR$과 긴 $TE$는 T2 강조를 줍니다. $T_2$가 매우 긴 뇌척수액이 가장 밝은 조직이 됩니다. 이 간단한 식은 재집속 펄스가 $M_z$에 주는 영향을 무시하고 $TR \gg TE$를 가정합니다. 스캐너 화면처럼 각 영상은 자기 영상의 가장 밝은 픽셀에 맞춰 창 설정됩니다. 조직 값은 1.5 T에서의 대략적인 교과서 수치이며 교육용일 뿐 임상용이 아닙니다. 짧은/긴 $TR$·$TE$를 바꿔 가며 회색질과 백질의 대조가 뒤집히는 것을 지켜보세요.
meanings:
- $S = 5$개 조직의 이완 시간과 양성자 밀도(1.5 T에서의 근삿값)
- 세로 회복, 조직 $s$와 시간 $t$에 대해 브로드캐스트
- 각 조직의 가로 감쇠
- 모든 조직, 반복 시간 $TR_a$, 에코 시간 $TE_b$에 대한 스핀 에코 신호(합하는 지표 없음)
- '원-핫 레이블 지도: 픽셀 $(x, y)$를 채우는 조직'
- '반복된 $s$ ⇒ 합: 각 $(TR, TE)$에 대한 영상'
- $M_0(1 - 2e^{-t/T_1})$이 0을 지나는 반전 시간. 지방(STIR)이나 뇌척수액(FLAIR) 신호를 억제하는 데 사용
labels:
  tr_short: 짧은 반복 시간 $TR$
  tr_long: 긴 반복 시간 $TR$
  te_short: 짧은 에코 시간 $TE$
  te_long: 긴 에코 시간 $TE$
  size: 팬텀 크기
  n_frames: 애니메이션 프레임 수
