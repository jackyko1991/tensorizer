source_hash: b05c63a03eb9
title: DT हॉट स्पॉट का जड़त्वीय-संलयन प्रज्वलन
summary: 'एक अंतःस्फोटित (imploded) ड्यूटेरियम–ट्रिटियम कैप्सूल के केंद्र में हॉट स्पॉट का 0D मॉडल। $\mathrm{D + T \to {}^4He + n}$ से निकले अल्फ़ा कण इसे गर्म करते हैं, ब्रेम्सस्ट्रालुंग और प्रसार इसे ठंडा करते हैं, और ठंडे खोल में निकलती ऊष्मा दहन को पोषित करती है। प्रारंभिक तापमानों और क्षेत्रीय घनत्वों $(T_0, \rho R_0)$ का पूरा ग्रिड एक बैच के रूप में समाकलित होता है: लॉसन-प्रकार की सीमा के ऊपर हॉट स्पॉट अनियंत्रित होकर जलता है, उसके नीचे बुझ जाता है।'
notes: 'जड़त्वीय परिरोधन कुछ सौ माइक्रोग्राम DT को इतनी तेज़ी से दबाता है कि वह बिखरने से पहले जल जाता है। हॉट स्पॉट तब प्रज्वलित होता है जब उसके द्वारा बनाए गए अल्फ़ा कण उसे ठंडा होने से तेज़ गर्म करते हैं। दो संख्याएँ यह तय करती हैं: तापमान, क्योंकि $\langle\sigma v\rangle$ दसियों keV तक तेज़ी से चढ़ता है, और क्षेत्रीय घनत्व $\rho R$, क्योंकि मोटा हॉट स्पॉट अपने अल्फ़ा कणों को रोकता है (10 keV के पास अल्फ़ा परास लगभग 0.3 g/cm²) और प्रसार के विरुद्ध अधिक देर टिका रहता है। केवल ब्रेम्सस्ट्रालुंग आदर्श प्रज्वलन तापमान तय करता है, लगभग 4.3 keV, जहाँ $\tfrac14\langle\sigma v\rangle E_\alpha = C_B\sqrt T$। धराशायी वक्र तात्क्षणिक संतुलन है, लॉसन मानदंड का ICF रूप; छायांकित क्षेत्र वह है जो पूर्ण समाकलन पाता है, जो ठंडे खोल में दहन प्रसार को भी गिनता है। हानि गुणक $L$ बढ़ाएँ और सीमा बड़े $\rho R$ और ऊँचे $T$ की ओर खिसकती है। शोध संदर्भ: 5 दिसंबर 2022 को National Ignition Facility ने 1 से अधिक लक्ष्य लाभ (target gain) वाला पहला प्रयोगशाला संलयन प्रयोग बताया, लक्ष्य पर 2.05 MJ लेज़र प्रकाश से लगभग
  3.15 MJ संलयन ऊर्जा (अनुमानित; Indirect Drive ICF Collaboration, Phys. Rev. Lett. 132, 065102, 2024), इससे पहले एक जलता प्लाज़्मा प्राप्त हुआ था (Zylstra et al., Nature 601, 542, 2022) और अगस्त 2021 में एक 1.3 MJ शॉट ने प्रज्वलन के लिए लॉसन मानदंड को पार किया था (Phys. Rev. Lett. 129, 075001, 2022)। लक्ष्य लाभ केवल लक्ष्य तक पहुँचने वाली लेज़र ऊर्जा को गिनता है; लेज़रों को चलाने में प्रयुक्त बिजली कहीं अधिक है। सरलीकरण: स्थिर घनत्व पर एकसमान 0D हॉट स्पॉट (इसलिए दहन अंश अधिक आँका गया है — PdV हानि पद के अलावा कुछ भी इसे बिखेरता नहीं), एक उदाहरणात्मक अल्फ़ा-निक्षेपण सूत्र, सन्निकट स्पिट्ज़र चालकता ($\ln\Lambda \approx 10$), कोई विकिरण फँसाव नहीं, एब्लेटर पदार्थ का कोई मिश्रण नहीं और आयन तथा इलेक्ट्रॉन तापमान बराबर।'
meanings:
- हर ग्रिड बिंदु $b = i\,n_r + j$ एक हॉट स्पॉट है; अवस्था $(\ln T, \ln\rho R, \varphi)$ है
- बॉश–हेल DT अभिक्रियाशीलता, 10 keV पर $\approx 1.14\times10^{-22}$ m³/s, 65 keV के पास शिखर $\approx 9\times10^{-22}$
- 3.5 MeV अल्फ़ा ऊर्जा का वह भाग जो हॉट स्पॉट के अंदर रुकता है
- ब्रेम्सस्ट्रालुंग, $C_B = 5.34\times10^{-37}$ W m³ keV$^{-1/2}$
- ध्वनि की चाल से फैलते हॉट स्पॉट का PdV कार्य
- खोल में स्पिट्ज़र चालन; नए गर्म द्रव्यमान के रूप में पुनर्चक्रित (दहन प्रसार)
- सभी हॉट स्पॉट के लिए एक साथ दायाँ पक्ष, RK4 से आगे बढ़ाया गया
- लॉसन-प्रकार वक्र जहाँ स्व-तापन हानियों के बराबर है, बैच द्विभाजन से
labels:
  density: हॉट-स्पॉट घनत्व $\rho$
  loss: हानि गुणक $L$ (ब्रेम्सस्ट्रालुंग + PdV)
  rho_r_max: उपलब्ध कुल ईंधन $\rho R$
  t_end: अनुकारित समय
  n_grid: प्रति अक्ष ग्रिड बिंदु
  t_min: न्यूनतम $T_0$
  t_max_init: अधिकतम $T_0$
