<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Richmond's construction of the regular 17-gon: unit circle with centre O, point J a quarter of the way up the vertical radius, point E on the diameter, the circle about E through K cutting the diameter at the feet of the perpendiculars to the vertices P3 and P5">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#111827">
    <!-- the circle and the two diameters -->
    <circle cx="82" cy="84" r="62" fill="none" stroke="#374151" stroke-width="2"/>
    <line x1="14" y1="84" x2="152" y2="84" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="82" y1="150" x2="82" y2="16" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- the 17-gon -->
    <polygon points="144,84 139.8,61.6 127.8,42.2 109.6,28.5 87.7,22.3 65,24.4 44.6,34.5 29.3,51.4 21.1,72.6 21.1,95.4 29.3,116.6 44.6,133.5 65,143.6 87.7,145.7 109.6,139.5 127.8,125.8 139.8,106.4" fill="#93c5fd" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.5"/>
    <!-- lines from J to E and F -->
    <line x1="82" y1="68.5" x2="87.3" y2="84" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="82" y1="68.5" x2="74.4" y2="84" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- circle about E through K -->
    <circle cx="87.3" cy="84" r="22.3" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <!-- perpendiculars to P3 and P5 -->
    <line x1="109.6" y1="84" x2="109.6" y2="28.5" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="65" y1="84" x2="65" y2="24.4" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="82" cy="84" r="2.5" fill="#374151"/>
    <circle cx="82" cy="68.5" r="2.5" fill="#f59e0b"/>
    <circle cx="87.3" cy="84" r="2.5" fill="#f59e0b"/>
    <circle cx="82" cy="62.3" r="2.5" fill="#2563eb"/>
    <circle cx="144" cy="84" r="3.5" fill="#2563eb" stroke="#1e40af"/>
    <circle cx="109.6" cy="28.5" r="3.5" fill="#2563eb" stroke="#1e40af"/>
    <circle cx="65" cy="24.4" r="3.5" fill="#2563eb" stroke="#1e40af"/>
    <text x="70" y="98" font-style="italic">O</text>
    <text x="66" y="66" font-style="italic" fill="#b45309">J</text>
    <text x="90" y="98" font-style="italic" fill="#b45309">E</text>
    <text x="148" y="80" font-style="italic">P₀</text>
    <text x="112" y="22" font-style="italic">P₃</text>
    <text x="50" y="18" font-style="italic">P₅</text>
    <!-- legend: the formula -->
    <text x="160" y="52" font-size="13" font-style="italic">n = 17</text>
    <text x="160" y="76" font-size="12">ruler and</text>
    <text x="160" y="92" font-size="12">compass only</text>
    <text x="160" y="122" font-size="12" font-style="italic" fill="#2563eb">cos 2π/17</text>
  </g>
</svg>
