title: 庞加莱猜想与 Ricci 流
summary: 已证明：每个闭的单连通三维流形都是三维球面（Perelman 2002–03，完成了 Hamilton 的 Ricci 流计划）。Ricci 流 $\partial_t g = -2\,\mathrm{Ric}$ 会把度量抹平，就像热传导抹平温度一样。这里它把一批凹凸不平的二维球面变圆（Gauss–Bonnet $\int K\,dA = 4\pi$ 精确成立至舍入误差），并让哑铃形三维球面的颈部在有限时间内夹断：这正是 Perelman 的手术所切除的奇点，之后每一块都会变圆。
notes: 状态：已证明。庞加莱在 1904 年问：如果一个闭三维流形上每条回路都能收缩成一点，它是否必定是三维球面？Hamilton 于 1982 年引入 Ricci 流，并证明 Ricci 曲率为正的三维流形会流向圆的度量；在二维中，球面上的每个度量都会变圆（Hamilton 1988、Chow 1991），凹凸球面正好展示这一点：$K$ 的离散程度衰减到零，而 $\int K\,dA = 4\pi$ 与面积保持不变。$l = 1$ 的球谐函数是圆球面的共形运动，不会衰减，但它们不改变形状。在三维中，流可能产生奇点。对颈部足够细的旋转对称哑铃，Angenent 与 Knopf（2004）证明了颈部夹断：颈部像圆柱 $S^2 \times \mathbb R$ 一样收缩，$\psi_\mathrm{neck}^2 \approx 2(T - t)$，而两端的球体仍保持很大。Perelman 的论文（arXiv 2002–03）控制了三维中的所有奇点（无局部塌缩、典范邻域），定义了带手术的 Ricci 流——切断颈部并加上帽盖——并证明对单连通流形，流会在有限时间内消亡，每一块在消失前都是圆球面，因此该流形就是三维球面。这个证明由 Kleiner–Lott、Morgan–Tian 与 Cao–Zhu 详细验证；Perelman 拒绝了 2006 年的菲尔兹奖和 2010 年的克雷千禧年大奖。数值方面：曲面在极角上使用有限体积网格，因此离散 Gauss–Bonnet 是精确的。三维球面写成共形形式，它在两极是正则的（弧长形式在那里要除以 $\psi \to 0$，并不稳定），网格单元向两极加密，因为颈部变细时两端的球体会在那里被挤压；当颈部半径降到 $0.05$ 时流停止，此时两端的球体仍可解析。这里的手术只是 Perelman 构造的示意图。试试粗的颈部（$\varepsilon \gtrsim 0.5$）：它不会夹断，整个球面都会变圆。
meanings:
- 每个凹凸球面 $b$ 在单元 $i$ 处的共形因子，度量为 $e^{2u}(dx^2 + \sin^2x\,d\theta^2)$
- 重复的 $j$ ⇒ 求和：圆球面的通量形式拉普拉斯算子；其通量在两极为零
- 共形度量的高斯曲率；曲面上的 Ricci 流为 $\partial_t g = -2Kg$
- 总曲率：对每个度量都恰为 $4\pi$（离散 Gauss–Bonnet），每一步都作检验
- 归一化流的平均曲率目标；它使每个面积保持不变
- 三维球面 $g = e^{2u}(dx^2 + \sin^2x\,g_{S^2})$ 的截面曲率 $-\psi_{ss}/\psi$ 与 $(1-\psi_s^2)/\psi^2$，其中 $\psi = e^u\sin x$
- 微分同胚（规范）项，使度量保持共形形式；它改变的是坐标，而不是几何
- 最小 $S^2$ 截面的半径；$\psi_\mathrm{neck}^2$ 大约以圆柱的速率 $2$ 下降，直到夹断
- 切掉高曲率的颈部，粘上一个与剖面相切的圆帽（Perelman 手术的示意）
labels:
  neck: 哑铃的初始颈部半径 $\varepsilon$
  t_surface: 曲面的流动时间
  cells: 网格单元数 $N$
