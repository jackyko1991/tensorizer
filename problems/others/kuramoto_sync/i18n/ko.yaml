source_hash: ab1a099d3cd6
title: '구라모토 모형: 자발적 동기화'
summary: 함께 깜빡이는 반딧불이, 하나의 판 위에 놓인 메트로놈들, 심장 박동 조율 세포처럼, 서로 다른 고유 진동수 $\omega_i$를 가지고 서로를 끌어당기는 진동자들은 결합 세기 $K$가 문턱을 넘으면 갑자기 동기화됩니다. 복소 평균장 $r e^{i\psi} = \frac1N \sum_j e^{i\theta_j}$는 모두-대-모두 합을 $O(N)$ 계산으로 바꾸고, 여러 결합 세기를 한 배치로 동시에 실행하며, 질서 변수 $r$는 $K_c = 2/(\pi g(0))$에서 급격히 증가하여 로렌츠 진동수 분포에 대한 정확한 오트–안톤센 곡선 $r = \sqrt{1 - K_c/K}$를 따릅니다.
notes: 구라모토(1975)는 모형을 자기무모순적으로 풀어 대칭이고 단봉인 진동수 밀도 $g$에 대해 $K_c = 2/(\pi g(0))$을 얻었습니다. 스트로가츠(2000)가 그 이야기를 들려줍니다. 오트와 안톤센(2008)은 로렌츠 분포 $g(\omega) = (\gamma/\pi)/(\omega^2 + \gamma^2)$에 대해 $N$이 무한대일 때의 동역학이 하나의 방정식 $\dot r = -\gamma r + \tfrac K2 r(1 - r^2)$로 축약되며, 그 안정 상태가 $r = \sqrt{1 - 2\gamma/K}$임을 증명했습니다. 시뮬레이션은 $N = 1200$에서 약 $0.01$ 이내로 이와 일치합니다. $K_c$ 아래에서 $r$은 크기 $1/\sqrt N$ 정도의 유한 크기 잡음일 뿐입니다. 가우스 진동수는 더 작은 문턱 $K_c = 2\sigma\sqrt{2\pi}/\pi \approx 1.6\,\sigma$를 가집니다(초록). 느린 증가(빨강)는 $K$가 커짐에 따라 곡선을 따라가며, 원은 평균장 기준틀에서 본 진동자들을 $\omega_i$에 따라 색칠해 보여 줍니다. $|\omega_i|$가 작은 진동자가 먼저 동기화되고, 빠른 진동자는 계속 표류합니다. 세 번째 패널은 짧은 덧붙임입니다. 비국소 결합과 위상 지연 $\alpha = \pi/2 - 0.18$을 가진 고리 위의 동일한 진동자들이 동기화된 영역과 비결맞음 영역으로 나뉘는데, 이것이 구라모토와 바토그토흐(2002)가 발견하고 에이브럼스와 스트로가츠(2004)가 이름 붙인 키메라 상태입니다. $\sin(\theta_j - \theta_i)$가 반대칭이므로 평균 위상은 정확히 평균 진동수로 표류합니다.
meanings:
- 고유 진동수, 로렌츠(또는 가우스) 밀도를 확률이 같은 $N$개 구간으로 나누어 각 구간에서 무작위로 하나씩 뽑음
- '배치 원소마다 결합 세기 하나: 모든 집단이 병렬로 진화'
- 복소 평균장, 반복되는 $j$ ⇒ 평균; $r = 0$은 비결맞음, $r = 1$은 완전 동기화
- '각 진동자는 평균장만 느낌: $O(N^2)$ 대신 $O(N)$'
- 느린 쌍별 합, 기준값으로 유지; 테스트로 평균장 형태와 같은지 확인
- 로렌츠 진동수에 대한 $N \to \infty$의 정확한 질서 변수, $K_c = 2\gamma$ 위에서 $\sqrt{1 - 2\gamma/K}$
- 키메라 상태를 위한 고리 위의 비국소 결합 $(1 + A\cos x)/2\pi$
labels:
  n_oscillators: 진동자 수 $N$
  width: 진동수 폭 $\gamma$ (로렌츠) 또는 $\sigma$ (가우스)
  k_max: 가장 큰 결합 세기 $K$
  n_couplings: 배치 내 결합 세기의 수
  t_relax: 결합 세기당 이완 시간
  ramp_time: $K$를 천천히 증가시키는 시간
  distribution: 증가 과정에 표시할 진동수 밀도
  seed: 난수 시드
