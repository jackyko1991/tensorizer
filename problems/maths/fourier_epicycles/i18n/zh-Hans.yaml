source_hash: e9d43436470c
title: 用本轮作画
summary: 把一条闭合曲线采样为复数 $z_n = x_n + i\,y_n$，它有离散傅里叶变换 $c_k$，而每一项 $c_k e^{2\pi i k t}$ 都是一个半径为 $|c_k|$、每走一圈转 $k$ 次的圆。把这些圆首尾相接、由大到小串起来，笔尖就会重新描出这条曲线。随着圆一个个加入，可以看到 Tensorizer 标志的轮廓逐渐浮现，而误差正如 Parseval 定理所预测的那样下降。
notes: DFT 矩阵 $W$ 把求和完整写出来（$N^2$ 次乘法）；`torch.fft.fft` 则用 Cooley–Tukey 快速傅里叶变换在 $O(N \log N)$ 内得到同样的 $c_k$，并有测试检查两者一致。DFT 是可逆的：全部 $N$ 个圆能精确重现 $N$ 个采样点，而时间平移 $z_{n-s}$ 只会让 $c_k$ 乘上相位 $e^{-2\pi i k s/N}$（半径不变，只有起点改变）。只绕一次的圆只需一项（$k = 1$），而心形 $x = 16\sin^3 s$、$y = 13\cos s - 5\cos 2s - 2\cos 3s - \cos 4s$ 是三角多项式，所以恰好 8 个圆（$k = \pm1 \dots \pm4$）就能完美画出它。多边形则不同：每个角上速度都会跳变，因此 $|c_k|$ 只像 $1/k^2$ 那样衰减，用 $M$ 个圆时的误差则像 $M^{-3}$；圆太少时，角会被磨圆，边上还会出现振铃般的小波动。曲线本身是连续的，所以（不同于傅里叶级数问题中函数本身会跳变的方波）这些波动会缩小到消失；9 % 的 Gibbs 过冲出现在会跳变的速度上。先保留最大的圆会让误差单调下降，因为根据 Parseval 定理，误差恰好等于被舍弃的圆的 $\sum|c_k|^2$。历史：Ptolemy 的天文学（《天文学大成》，2 世纪）让行星在一个圆（本轮）上运动，而本轮的圆心又沿着另一个圆（均轮）移动；只要本轮足够多，任何周期性的闭合路径都能被拟合，这正是该体系虽然物理上并不正确，却能在 1400 年间与观测吻合得这么好的原因。标志路径是 Tensorizer 立方体的六边形轮廓加上三条内边，走过去再走回来。试试用很少的圆画星形。
meanings:
- 曲线在等间隔时间 $t_n = n/N$ 上的复数值；多边形按弧长重新采样
- DFT 矩阵，频率 $k = -N/2 \dots N/2 - 1$
- 重复的 $n$ ⇒ 求和：第 $k$ 个圆的半径为 $|c_k|$，起始角为 $\arg c_k$
- 按半径排序的圆：圆链先保留最大的
- 重复的 $k$ ⇒ 求和：由最大的 $M_m$ 个圆画出的曲线，一次算出所有 $M$（$K_{mk} = [r_k < M_m]$，$E_{tk} = e^{2\pi i k t}$）
- 各项的累加和：链中每个圆的圆心，最后一个就是笔尖
- 采样点上的均方误差，等于被舍弃的圆的能量（Parseval）
labels:
  shape: 曲线
  n_points: 采样数 $N$
  max_terms: 最多的圆数 $M$
