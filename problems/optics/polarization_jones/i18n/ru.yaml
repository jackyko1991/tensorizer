source_hash: 3434371fc2c6
title: Поляризация и матрицы Джонса
summary: 'Поляризация света — комплексный 2-вектор $(E_x, E_y)$, а любой поляризатор или фазовая пластинка — комплексная матрица $2\times 2$. Свет проходит фазовую пластинку, а затем вращающийся поляризатор: эллипс поля $\mathbf E$ и прошедшая интенсивность получаются через einsum, воспроизводя закон Малюса и превращая линейную поляризацию в круговую.'
notes: Свет вначале линейно поляризован под входным углом с интенсивностью $I_0 = 1$. Серая штриховая кривая справа — закон Малюса $I_0\cos^2\theta$ (без пластинки); синяя кривая — то, что проходит после пластинки. Четвертьволновая пластинка под 45° к входной поляризации даёт свет с круговой поляризацией (равные $\lvert E_x\rvert$ и $\lvert E_y\rvert$, сдвиг фаз 90°), поэтому при любом угле поляризатора проходит $I_0/2$. Полуволновая пластинка под углом $\alpha$ поворачивает линейную поляризацию на $2\alpha$. Отдельный вектор Джонса всегда описывает полностью поляризованный свет; неполяризованный свет учитывается усреднением интенсивностей для двух ортогональных входных поляризаций (так сделана проверка с тремя поляризаторами, которую выводит main.py).
meanings:
- 'вектор Джонса: комплексные амплитуды $E_x$ и $E_y$ (разность фаз задаёт форму)'
- поворачивает лабораторную систему к собственным осям элемента
- оставляет только поле вдоль оси пропускания под углом $\theta$
- 'задерживает медленную ось на $\Gamma$: $\Gamma = \pi/2$ четвертьволновая, $\Gamma = \pi$ полуволновая'
- цепочка элементов (повторяющийся $j$ суммируется); первый встреченный светом элемент — справа
- пропускание света через оптику
- 'повторяющийся $i$ ⇒ суммирование: интенсивность'
- 'вещественное поле за один период: описывает эллипс поляризации'
labels:
  plate: Фазовая пластинка
  plate_angle: Быстрая ось пластинки $\alpha$
  input_angle: Угол входной поляризации
