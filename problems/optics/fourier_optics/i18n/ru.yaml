source_hash: e1ad81688a05
title: Дифракция Фраунгофера и 2D-Фурье
summary: В дальней зоне дифракционная картина апертуры — двумерное преобразование Фурье её функции пропускания. Один вызов torch.fft.fft2 превращает квадрат, круглое отверстие, двойную щель и решётку в их картины в дальней зоне, и кольца Эйри сжимаются по мере роста отверстия.
notes: 'Длины в плоскости апертуры измеряются в пикселях размера $\Delta x$; частотный пиксель $(k, l)$ преобразования соответствует направлению $\sin\theta = \lambda k/(N\Delta x)$. Поэтому первое тёмное кольцо круглого отверстия при $\sin\theta = 1.22\,\lambda/D$ находится в $1.22\,N/D$ частотных пикселях от центра (штриховая окружность). Большие апертуры дают маленькие картины: преобразование широкой функции узкое. Форма через einsum — то же преобразование, что fft2, только за $O(N^3)$ вместо $O(N^2\log N)$.'
meanings:
- 'пропускание маски: 1 = открыто, 0 = непрозрачно; строка $a = y$, столбец $b = x$'
- матрица дискретного преобразования Фурье
- 'повторяющиеся $a$ и $b$ ⇒ суммирование: одномерное преобразование вдоль $y$ и одно вдоль $x$'
- то же преобразование через быстрое преобразование Фурье, нулевая частота сдвинута в центр
- интенсивность в дальней зоне, показана как $\log_{10}(I/I_{\max})$
- первое тёмное кольцо круглого отверстия диаметра $D$, в частотных пикселях
labels:
  size_min: Начальный размер апертуры $D$
  size_max: Конечный размер апертуры $D$
  frames_per_aperture: Кадров на форму апертуры
