source_hash: bd0f5adb6f78
title: autograd द्वारा लाग्रांजियन से गति के समीकरण
summary: 'केवल लाग्रांजियन $L = T - V$ लिखें और torch.autograd को ऑयलर–लाग्रांज समीकरण निकालने दें: हेसियन $\partial^2L/\partial\dot q_i\partial\dot q_j$ द्रव्यमान आव्यूह है और एक रैखिक हल $\ddot q$ देता है। इसे स्प्रिंग (प्रत्यास्थ) लोलक पर लागू किया गया है।'
notes: 'स्प्रिंग लोलक के समीकरणों में से कुछ भी हाथ से नहीं लिखा गया: लाग्रांजियन बदलें और गतिकी अपने आप बदल जाती है। यहाँ $H = \operatorname{diag}(m, mr^2)$ $r$ पर निर्भर करता है, और $C$ में कोरिऑलिस-जैसा युग्मन $2mr\dot\theta$ है। डिफ़ॉल्ट $k \approx 3mg/\ell_0$ पर स्प्रिंग आवृत्ति दोलन आवृत्ति की लगभग दोगुनी है (2:1 अनुनाद), इसलिए ऊर्जा उछलने और झूलने के बीच आती-जाती रहती है। यही कोड किसी भी संख्या के निर्देशांकों के लिए चलता है; कीमत बस प्रति चरण कुछ अतिरिक्त backward pass है।'
meanings:
- 'व्यापकीकृत निर्देशांक $(r, \theta)$: स्प्रिंग की लंबाई और कोण'
- व्यापकीकृत वेग
- हाथ से लिखी गई एकमात्र भौतिकी
- प्रथम अवकलज; $p_i = \partial L/\partial\dot q_i$ विहित संवेग है
- द्रव्यमान आव्यूह और मिश्रित द्वितीय अवकलजों की पंक्ति $i$
- दोहराया गया $k$ ⇒ योग
- त्वरणों के लिए हल किए गए ऑयलर–लाग्रांज समीकरण
- ऊर्जा फलन, यह भी autograd से; संरक्षित
labels:
  m: द्रव्यमान $m$
  k: स्प्रिंग नियतांक $k$
  rest_length: प्राकृतिक लंबाई $\ell_0$
  r0: प्रारंभिक लंबाई $r_0$
  theta0: प्रारंभिक कोण $\theta_0$
  t_max: सिमुलेशन समय
