source_hash: aac1f92f727e
title: 牛頓碎形
summary: 在複數平面的每個像素上同時執行牛頓法 $z \leftarrow z - p(z)/p'(z)$，整體是一個複數張量。依每個像素收斂到的根上色，便畫出吸引盆，其邊界是碎形，而在根附近誤差每步平方縮小。
notes: 在單根 $r$ 附近展開 $p$ 得 $e_{k+1} \approx \frac{p''(r)}{2p'(r)}\,e_k^2$：正確位數每步加倍，右側面板在對數尺度上顯示為一條拋物線（對 $z^3 - 1$，常數恰為 1）。遠離根時牛頓法是混沌的。在臨界點附近，即 $p'(z) = 0$ 處，$z$ 的微小變動會把下一個迭代值送到平面上任何地方，因此整幅圖的副本出現在每個尺度上。具有三個以上根的多項式，其吸引盆共享同一條邊界，即牛頓映射的朱利亞集合：任一吸引盆的每個邊界點都是所有吸引盆的邊界點（Wada 性質）。終端統計在完整視圖與放大後，有多少邊界像素在其 $3\times3$ 鄰域中具有所有顏色。這個比例在每個尺度上大致相同。試試 $z^3 - 2z + 2$，在 0 附近出發的點會落入吸引循環 $0 \to 1 \to 0$，永遠到不了根（灰色區域）。整個網格是單一複數張量，因此一次 einsum 就更新所有像素。
meanings:
- 每個像素 $p = (h, w)$ 一個起點：$z = x_w + i\,y_h$
- 多項式係數，從常數項開始，例如 $z^3 - 1 \to (-1, 0, 0, 1)$
- 每個像素的冪次 $1, z, z^2, \dots$，以累乘建立
- 重複的 $k$ ⇒ 求和：每個像素上的 $p(z)$
- $p'(z)$ 的係數：微分使冪次下移
- 根，即伴隨矩陣的本徵值
- 每個像素到每個根的距離；對 $j$ 取最小值即得吸引盆標籤
- 以雙精度計算的一個起點：比值趨於 $|p''(r)/2p'(r)|$
labels:
  polynomial: 多項式 $p(z)$
  pixels: 每邊像素數
  extent: 視圖半寬
  iterations: 牛頓步數
  zoom: 放大倍率
  tol: 收斂容差 $|z - r|$
