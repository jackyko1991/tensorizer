source_hash: 41a426132182
title: Das Hierarchieproblem und Gravitation, die in Extradimensionen entweicht
summary: 'Warum ist die Gravitation etwa $10^{33}$-mal schwächer als die schwache Kraft ($G_F M_{Pl}^2$)? Eine spekulative Antwort: Die Gravitation breitet sich in $n$ verborgene kompakte Dimensionen aus. Auf $\mathbb R^3\times T^n$ wird das Potential auf zwei Arten summiert, über Spiegelbilder der Masse und über den Kaluza-Klein-Turm, als ein Tensor über Gitterschalen. Es fällt innen wie $1/r^{1+n}$ und außen wie $1/r$ ab, mit einem Yukawa-Ausläufer $\alpha = 2n$, $\lambda = R$. ADD-Radien für $n = 1..6$ werden mit echten Grenzen aus Torsionswaagen und vom LHC verglichen, und der Randall-Sundrum-Warpfaktor $e^{-\pi k r_c}$ macht aus $M_{Pl}$ TeV. Keine Extradimension wurde beobachtet.'
notes: 'Status: spekulativ. Das Hierarchieproblem fragt, warum die elektroschwache Skala ($v \approx 246$ GeV) so weit unter der Planck-Skala ($M_{Pl} \approx 1.22\times10^{19}$ GeV) liegt, mit $G_F/G_N = G_F M_{Pl}^2 \approx 1.7\times10^{33}$. Arkani-Hamed, Dimopoulos und Dvali (ADD, 1998) schlugen vor, dass sich allein die Gravitation in $n$ kompakte Dimensionen zwischen Millimeter und Femtometer ausbreitet, sodass die wahre Skala der Gravitation $M_*$ bei einem TeV liegen könnte. Randall und Sundrum (1999) schlugen stattdessen eine einzige gekrümmte Dimension vor. Keine Extradimension wurde gefunden. Andere vorgeschlagene Antworten sind Supersymmetrie, Kompositheit, das Relaxion und anthropische Auswahl. Keine ist gesichert. Was berechnet wird: eine Punktmasse auf $\mathbb R^3\times T^n$ (Kreise mit Radius $R$, Einheiten $R = G_D M = 1$). Die Spiegelbildsumme und die Kaluza-Klein-Summe sind nach der Poissonschen Summenformel gleich; beide werden nach Schalen $m = |\mathbf k|^2$ mit Anzahlen
  $r_n(m)$ gruppiert. Der Plot nutzt innen die Spiegelbildsumme ($r < R$, ferne Bilder durch ein Integral ersetzt) und außen die KK-Summe. Das Gaußsche Gesetz in $3+n$ Raumdimensionen legt $G_4 = (n+1)|S^{n+2}|G_D/4\pi(2\pi R)^n$ fest. Die leichteste KK-Stufe hat $2n$ Moden der Masse $1/R$, daher sieht die Gravitation knapp außerhalb des kompakten Raums wie eine Yukawa-Korrektur mit $\alpha = 2n$, $\lambda = R$ aus (Torus; andere Formen ändern $\alpha$). ADD-Radien verwenden $M_{Pl}^2 = M_*^{n+2}R^n$; Arbeiten unterscheiden sich um Faktoren wie $(2\pi)^n$ und $8\pi$, $R$ ist also eine Größenordnung. Daten, als zitierte Zahlen in data/*.csv: Die Eöt-Wash-Torsionswaagen schließen $|\alpha| = 1$ oberhalb von $\lambda = 56\,\mu$m aus (Kapner et al., PRL 98, 021101, 2007, arXiv:hep-ph/0611184; eine Extradimension $R \le 44\,\mu$m) und oberhalb von $38.6\,\mu$m (Lee et al., PRL 124, 101101, 2020, arXiv:2002.11761). Die Ausschlusskurve selbst ist nicht beigefügt. Da sie mit $\lambda$ fällt, ist
  jeder Punkt mit $\alpha \ge 1$ und $\lambda > 38.6\,\mu$m ausgeschlossen, ein konservativer Test. Die ATLAS-Monojet-Suche bei 13 TeV (139 fb$^{-1}$; Phys. Rev. D 103, 112006, 2021, arXiv:2102.10874, CC-BY 4.0) schließt $M_D$ unterhalb von 11,2, 8,5, 7,1, 6,4 und 5,9 TeV für $n = 2..6$ aus (Giudice-Rattazzi-Wells-Konvention, hier direkt mit $M_*$ verglichen). $n = 1$ bräuchte eine Dimension von der Größe des Sonnensystems und ist durch Planetenbahnen ausgeschlossen. Randall-Sundrum: $k r_c \approx 11$–$12$ macht $\bar M_{Pl}e^{-\pi k r_c}$ zu einem TeV; der LHC hat seine Kaluza-Klein-Gravitonen nicht gesehen.'
meanings:
- Kaluza-Klein-Modenvektoren (Impulse $\mathbf k/R$ um die Kreise); zur Kontrolle der Schalenanzahlen
- 'wie viele $\mathbf k$ erfüllen $|\mathbf k|^2 = m$: die Thetareihe hoch $n$, per FFT-Faltung'
- 'wiederholter Schalenindex $m$ ⇒ summiert: die Masse und ihre Spiegelbilder; ferne Bilder als Kontinuumsrest'
- dasselbe Potential als Turm von Yukawa-Termen der Masse $\sqrt m/R$ (Poisson-Summation)
- Feld per Autograd; mal die Fläche von $S^{2+n}$ (nah) oder $S^2\times T^n$ (fern) ergibt den Gaußschen Fluss
- kleinste Quadrate für $\ln(\phi/\phi_N - 1)$ knapp außerhalb des kompakten Raums; erwartet $2n$ und $R$
- ADD-Radius für jedes $n$ und jede fundamentale Skala $M_*$ zugleich (Broadcast)
- Randall-Sundrum-Warpfaktor zwischen Planck-Brane und TeV-Brane
labels:
  M_star: Fundamentale Skala $M_*$ für die ausgegebene Tabelle
  krc: Randall-Sundrum $k r_c$
  m_max: Summierte Gitterschalen, $|\mathbf k|^2 \le m_{max}$
