source_hash: 6cf1e64854dc
title: 電容器充電（RC 電路）
summary: 經由電阻充電的電容器滿足 $dV/dt = (V_s - V)/(RC)$。數個電阻不同的電路疊成一個電壓張量，因此一次 Runge–Kutta 步就能推進全部電路。把電源切換成方波，可觀察電容器的充電與放電。
notes: 單位：$R$ 以 kΩ、$C$ 以 mF 計，因此 $\tau = RC$ 的單位為秒，$I$ 為 mA。經過一個時間常數，電容器達到電源電壓的 63 %；經過 $5\tau$ 則幾乎充滿。由電池充電時，電源提供 $CV_s^2$ 的能量：恰好一半存入電容器，另一半在 $R$ 中轉為熱——不論 $R$ 的值為何。
meanings:
- 電容器 $b$ 兩端的電壓（每個電路一項）
- 電路 $b$ 的電阻
- 電容，各電路相同
- 電源電壓，所有電路共用（沿 $b$ 廣播）
- 逐元素運算：指標 $b$ 在兩邊各出現一次，不求和
- 通過各電阻的電流
- 各電容器儲存的能量
labels:
  V_s: 電源電壓
  C: 電容
  R_min: 最小電阻
  R_max: 最大電阻
  n_circuits: 電路數
  source: 電源
  period: 方波週期
  t_max: 模擬時間
