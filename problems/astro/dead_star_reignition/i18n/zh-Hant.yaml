source_hash: d29dc3e384c1
title: 重新點燃死亡恆星：棕矮星、新星、X 射線爆發與黑洞
summary: 當恆星殘骸獲得新鮮氣體時會發生什麼？棕矮星的質量被推過約 $0.075\,M_\odot$ 後可以燃燒氫而成為恆星；白矮星會點燃其吸積的氫殼層，形成經典新星；中子星每隔幾小時就會讓吸積的氫/氦發生閃燃，形成 I 型 X 射線爆發；黑洞沒有表面，因此什麼都不會被點燃，它只會發光，最高可達愛丁頓（Eddington）極限。一個批次化的張量模型（Lane–Emden 多方球、簡併狀態方程式以及藉助自動微分的單區殼層點火）可同時給出每種殘骸、每種質量的臨界吸積質量。
notes: 精確結果：Lane–Emden 常數、錢德拉塞卡（Chandrasekhar）質量（$\mu_e = 2$ 時為 $1.456\,M_\odot$）、愛丁頓（Eddington）光度（每 $M_\odot$ 為 $1.26\times10^{38}$ erg/s）以及 ISCO 效率（$5.7\%$ 至 $42\%$）。其餘部分均為數量級模型：(1) 棕矮星：收縮中的 $n = 3/2$ 多方球所能達到的最高溫度 $T_{\max} \propto M^{4/3}$，分別與 $3\times10^5$ K（在 Gyr 時間尺度上緩慢燃燒氘）和 $3\times10^6$ K（氫）比較；模型給出約 $14\,M_J$ 和 $0.074\,M_\odot$，接近演化模型給出的極限，約 $13\,M_J$（Spiegel et al. 2011）和 $0.07$–$0.08\,M_\odot$（Burrows et al. 2001）。這只是必要條件：一顆年老、冰冷的棕矮星被推過極限後，還必須被吸積（壓縮）加熱才能點火。(2) 新星：點火質量從 $10^{-7}$ 到 $10^{-3}\,M_\odot$，白矮星越重、吸積越快則越小，與 Yaron et al. (2005) 的新星網格趨勢一致，但僅精確到幾倍以內（忽略了熱傳導、混合與屏蔽效應）。新星拋出的物質可能至少與吸積的一樣多，因此白矮星能否增長到 $M_{\rm Ch}$ 並爆發為 Ia 型超新星（單簡併通道）仍有爭議。(3) X 射線爆發：點火柱密度接近 $10^8$ g/cm²，復發時間為數小時，與觀測一致（Galloway and Keek 2021）；每克的重力能約為核能的 40 倍（$\alpha$）。觸發爆發的同一吸積過程也會使中子星自轉加快：約 $0.04\,M_\odot$ 即可將一顆老年脈衝星「回收」為毫秒脈衝星。(4) 黑洞：沒有表面，就沒有閃燃。
meanings:
- 每個條目對應一個吸積殘骸：白矮星（質量 $\times$ 吸積率）和中子星（燃料 $\times$ 吸積率）
- 吸積層的柱密度，g/cm²；壓力 $P = g y$
- 以批次二分法反解理想離子 + 部分簡併電子的狀態方程式
- 輻射底部溫度，不動點迭代（$\kappa$、$\rho$ 依賴於 $T$）
- 薄殼不穩定性：加熱隨 $T$ 增長得比冷卻更快 ⇒ 熱失控
- 臨界吸積質量：新星或 X 射線爆發
- $n = 3/2$ 多方球收縮經過每一個半徑；對 $r$ 取最大值 ⇒ 棕矮星極限
- 同時求解 $n = 1, 3/2, 3$ 的 Lane–Emden 方程式：常數 $\omega_3$、$\rho_c/\bar\rho$、$P_c$
- 黑洞：只有吸積發光，$\eta = 1 - E_{\rm ISCO}$
