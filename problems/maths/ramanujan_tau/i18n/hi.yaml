title: रामानुजन का $\tau(n)$ और सातो–टेट नियम
summary: विविक्तकर मॉड्यूलर रूप $\Delta(q) = q\prod_n (1-q^n)^{24}$ को टेंसर घात श्रेणी के रूप में फैलाकर रामानुजन का $\tau(n)$ प्राप्त कीजिए, अभाज्य संख्याओं के एक समूह के मॉड्यूलो शेषफलों के ज़रिए $n \sim 10^5$–$10^6$ तक बिल्कुल सटीक। जाँचिए कि $\tau$ गुणात्मक है और हेके पुनरावर्तन का पालन करता है, कि $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$, कि $|\tau(p)| \le 2p^{11/2}$ (डेलिन्य का प्रमेय, 1974), और देखिए कि सामान्यीकृत मान $\tau(p)/2p^{11/2}$ सातो–टेट अर्धवृत्त को कैसे भरते हैं ($\Delta$ के लिए यह 2011 से एक प्रमेय है)। प्रोग्राम इन प्रमेयों को संख्यात्मक रूप से जाँचता है।
notes: 'रामानुजन (1916) ने $\Delta(q) = q\prod(1-q^n)^{24}$ के गुणांकों $\tau(n)$ का अध्ययन किया, जो भार 12 का एकमात्र सामान्यीकृत कस्प रूप है, और तीन अनुमान रखे: $\tau$ गुणात्मक है, यह $\tau(p^{k+1}) = \tau(p)\tau(p^k) - p^{11}\tau(p^{k-1})$ को संतुष्ट करता है, और $|\tau(p)| \le 2p^{11/2}$। मॉर्डेल ने पहले दो को 1917 में सिद्ध किया, जो आगे चलकर हेके सिद्धांत बनने वाली चीज़ का एक आरंभिक उदाहरण था। यह सीमा $\Delta$ के लिए रामानुजन अनुमान है (सामान्य रूप में रामानुजन–पीटरसन अनुमान): डेलिन्य ने 1974 में वेल अनुमानों के अपने प्रमाण के परिणाम के रूप में इसे सिद्ध किया, इसलिए यह एक प्रमेय है। रामानुजन ने सर्वांगसमता $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$ भी सिद्ध की, जो इस तथ्य से आती है कि $691$ बर्नूली संख्या $B_{12}$ के अंश को विभाजित करता है। $\tau(p) = 2p^{11/2}\cos\theta_p$ लिखने पर, सातो–टेट अनुमान कहता है कि कोण $\theta_p$ वितरण $\frac{2}{\pi}\sin^2\theta\,d\theta$ का पालन करते हैं, यानी $x_p = \cos\theta_p$ अर्धवृत्त $\frac{2}{\pi}\sqrt{1-x^2}$ का पालन करता है, जिसके आघूर्ण $1/4$,
  $1/8$, $5/64$ हैं (कैटलन संख्याएँ बटा 4 की घातें)। $\Delta$ के लिए इसे बार्नेट-लैम्ब, गेराटी, हैरिस और टेलर (2011) ने सिद्ध किया। हिस्टोग्राम धीरे-धीरे अभिसरित होता है, स्वतंत्र प्रतिदर्शों की तरह। लेमर का अनुमान कि $\tau(n)$ कभी शून्य नहीं होता, अब भी खुला है; इसे इस परास से बहुत आगे तक सत्यापित किया जा चुका है, और प्रोग्राम को भी कोई शून्य नहीं मिलता। संख्यात्मक पहलू: $\tau(n)$ लगभग $n^{11/2}$ की तरह बढ़ता है, इसलिए पूरी श्रेणी के float64 FFT में सबसे बड़े गुणांक के लगभग $10^{-16}$ गुना की निरपेक्ष त्रुटि होती है, जो $\tau(2) = -24$ को पूरी तरह दबा देती है (एक परीक्षण यह दिखाता है)। इसके बजाय श्रेणी को एक साथ लगभग दस अभाज्य संख्याओं के मॉड्यूलो सटीक रूप से गणना किया जाता है, हर एक के लिए टेंसर की एक पंक्ति, और चीनी शेषफल प्रमेय से फिर से बनाया जाता है। मज़ेदार बात: रामानुजन ने गौर किया कि… (Ramanujan noticed that…) $\tau(n) \equiv \sigma_{11}(n) \pmod{691}$; कि $1729 = 1^3 + 12^3 = 9^3 + 10^3$; और, केवल नियमितीकृत अर्थ में, कि $1 + 2 + 3 + \dots$ "$= -1/12$": यह श्रेणी अपसारी है, और
  $-1/12$ विश्लेषिक रूप से विस्तारित ज़ीटा फलन का मान $\zeta(-1)$ है।'
meanings:
- 'जैकोबी सर्वसमिका $\prod(1-q^n)^3 = \sum_k (-1)^k (2k+1) q^{k(k+1)/2}$: केवल $O(\sqrt N)$ शून्येतर गुणांक'
- 'दोहराया गया $j$ ⇒ योग: एक छोटी की गई श्रेणी का गुणनफल, टोप्लित्ज़ आव्यूह गुणा सदिश के रूप में, छोटे $N$ के लिए int64 में सटीक'
- तीन बार वर्ग करने से 24वीं घात मिलती है
- वही गुणनफल FFT से एक साथ $M$ अभाज्य मॉड्यूलों के लिए, सटीक शेषफलों तक पूर्णांकित (हर एक में $m^2 N \le 2^{42}$)
- संतुलित अंकों वाला चीनी शेषफल प्रमेय, ताकि ऋणात्मक मान ऋणात्मक ही निकलें
- $mn \le 600$ वाले सभी सहअभाज्य युग्म $1 < m < n$ एक साथ
- $dj \le N$ वाला हर भाजक युग्म $(d, j)$ $n = dj$ में $d^{11}$ जोड़ता है
- अभाज्य संख्याओं पर सामान्यीकृत मान, डेलिन्य के प्रमेय से $[-1, 1]$ में
labels:
  n_max: अभाज्य संख्याएँ और $\tau(n)$, $N$ तक
