source_hash: bc7b5c9d23fa
title: 수소 원자 오비탈
summary: $\psi = (u(r)/r)\,Y_{lm}(\theta, \phi)$로 쓰면 3차원 수소 문제가 원심 항 $l(l+1)/2r^2$이 추가된 1차원 지름 방향 방정식이 됩니다. 각운동량 $l$마다 유한 차분 해밀토니안 하나를 $(L, N, N)$ 텐서로 쌓으면, 배치 torch.linalg.eigh 한 번으로 모든 오비탈을 한꺼번에 얻습니다. 애니메이션은 1s, 2s, 2p, 3s, …를 차례로 보여 주며 지름 방향 확률과 $\lvert\psi_{nl0}\rvert^2$의 단면을 그립니다.
notes: '원자 단위계($\hbar = m_e = e = 4\pi\varepsilon_0 = 1$): 길이는 보어 반지름, 에너지는 하트리 단위입니다. 정확한 에너지 $E_n = -1/(2n^2)$는 $n$에만 의존하므로, 2s와 2p(또는 3s, 3p, 3d)는 서로 다른 행렬의 고윳값인데도 축퇴되어 나옵니다. $1/r$ 퍼텐셜의 숨은 대칭입니다. $(n, l)$의 지름 함수에는 마디가 $n - l - 1$개 있습니다. 격자가 $r_{\max}$에서 끝나므로 크기($\approx 2n^2$)가 $r_{\max}$에 가까운 상태는 눌려서 에너지가 올라갑니다. 유한 차분은 $1/r$ 특이점 근처에서 1s를 약간 덜 속박하기도 합니다. 단면은 $xz$ 평면($z$가 위쪽)에서의 $m = 0$ 오비탈 $Y_{l0} \propto P_l(\cos\theta)$를 보여 줍니다. 희미한 바깥 로브도 보이도록 색은 압축된 거듭제곱 척도 $(\lvert\psi\rvert^2)^{0.3}$을 씁니다.'
meanings:
- 내부 점 $r = dr \dots r_{\max} - dr$ (양 끝에서 $u = 0$)
- 쿨롱 인력에 원심 장벽을 더함, $l$마다 한 행
- 각운동량마다 하나씩, $L$개 해밀토니안의 묶음
- '$l$에 대해 배치: 에너지와 지름 함수; 주양자수 $n = l + 1 + \text{column}$'
- 단위 반지름당 확률, $r^2\lvert R\rvert^2 = u^2$
- $z$축을 지나는 단면 위의 $\lvert R(r)\,Y_{l0}(\theta)\rvert^2$
labels:
  n_max: 최고 껍질 $n$
  r_max: 격자 반지름 $r_{\max}$
  n_grid: 격자점 수
