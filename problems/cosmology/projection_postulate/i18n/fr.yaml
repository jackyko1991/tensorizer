source_hash: 296b0fae0936
title: 'Le postulat de projection : un état de grande dimension, de nombreuses ombres'
summary: 'Une hypothèse spéculative, pas de la physique établie : l''univers est un seul état $\Psi$ dans un espace d''un très grand nombre de dimensions $D$, et ce qu''un observateur mesure est sa projection sur quelques-unes. Cette étape énonce les postulats et vérifie leurs mathématiques. La fraction visible $\|P\Psi\|^2$ suit une loi Beta$(d, D-d)$, et une mesure est modélisée comme une course entre blocs cachés. Une dimension complexe cachée par issue donne exactement la règle de Born ; davantage donne un écart que les expériences à trois fentes excluent. Pour l''instant, l''idée reproduit la mécanique quantique plutôt que d''aller au-delà.'
notes: 'Statut : spéculatif. C''est l''hypothèse personnelle de l''auteur (voir la description de la série), pas de la physique établie, et aucune expérience ne la favorise par rapport à la mécanique quantique standard. Cette première étape écrit précisément les postulats et vérifie les mathématiques sur lesquelles ils reposent. Les postulats. P0 (une seule réalité) : l''univers est un unique état $\Psi$ dans un espace de dimension $D$, éventuellement $D\to\infty$. P1 (projection) : un observateur ne voit qu''une projection $P:\mathbb C^D\to\mathbb C^d$ sur un sous-espace de dimension $d$ ; l''état quantique mesuré est $\psi = P\Psi/\|P\Psi\|$, donc la fonction d''onde est une projection de $\Psi$, pas $\Psi$ lui-même. P2 (événement) : une mesure est une projection sur une tranche de temps définie qui choisit une issue $k$ ; les poids des issues viennent de $\|P_k\Psi\|^2$, et la règle de Born doit être testée, pas supposée. P3 (une seule particule) : toutes les particules sont des projections
  du même objet. P4 (géométrie) : l''espace-temps courbe est la forme projetée d''un plongement plat de dimension supérieure, et une singularité est l''endroit où la projection se replie (son jacobien perd du rang). P5 (dimension ouverte) : les effets quantiques demandent une dimension minimale $d_Q$ et la gravité une dimension $d_G$ à l''intérieur de $D$ ; elles sont estimées ou ajustées, jamais fixées à $3+1$ à la main. Ce qui est calculé. (1) Concentration de la mesure : pour $\Psi$ uniforme sur la sphère de $\mathbb C^D$, $\|P\Psi\|^2\sim$ Beta$(d, D-d)$ de moyenne $d/D$, vérifié par la moyenne, la variance et un test de Kolmogorov–Smirnov pour $D$ de 4 à $D_{max}$ ; le $\psi$ normalisé est uniforme sur la petite sphère quelle que soit $D$. Un observateur typique voit une fraction $d/D$ de la norme, qui tend vers zéro quand $D\to\infty$. (2) P2 rendu concret comme une course de projection (le modèle de l''auteur, formalisé ici) : chaque issue $k$ est couplée à son propre bloc de $m$
  dimensions complexes cachées d''énergie $E_k = \|h_k\|^2$, et l''issue de plus grand $|c_k|^2/E_k$ se produit. Pour $m = 1$, $E_k\sim$ Exp(1) et la course exponentielle donne exactement $P(k) = |c_k|^2$ : la règle de Born. Pour $m > 1$, $E_k\sim$ Gamma$(m)$ et l''issue la plus probable gagne trop souvent ; pour deux issues $P_1 = I_{|c_1|^2}(m, m)$, et l''écart croît avec $m$. Des dimensions cachées réelles donnent Gamma$(m/2)$ : une dimension réelle donne la loi de l''arc sinus $\tfrac2\pi\arcsin|c_1|$, deux donnent Born. (3) Décompte des dimensions (P5) : la course demande $D\geq d + K$ pour $K$ issues ; $N$ systèmes à deux niveaux intriqués demandent $D\geq 2^N$, soit environ $10^{3\times10^{79}}$ pour les $\sim10^{80}$ particules de l''univers observable, en accord avec le $D\to\infty$ de P0. Honnêteté : la mécanique quantique standard utilise déjà exactement cet espace de Hilbert, et prendre des traces partielles et des projections est standard. Pour l''instant, l''hypothèse est une
  réinterprétation ; toute nouveauté testable doit venir des cas où la course avec $m > 1$, ou une étape ultérieure, prédit autre chose. Le théorème de Gleason (1957) montre déjà que pour $d\geq 3$ toute attribution de probabilités non contextuelle sur un espace de Hilbert est la règle de Born. (4) Données : dans un dispositif à trois fentes (41 cases d''écran plus une issue « bloquée », chacune avec son propre bloc caché), la course donne un paramètre de Sorkin $\kappa\approx s\,(a-1)$, avec $s$ entre 0,56 et 0,74 sur 9 découpages, où la forme cachée est $a = m$ (complexe) ou $m/2$ (réel). Valeurs mesurées (data/born_rule_tests.csv, valeurs citées) : Sinha et al. (Science 329, 418, 2010) bornent $|\kappa|$ sous $10^{-2}$ ; Park et al. (RMN, New J. Phys. 14, 113025, 2012) $\kappa = 0.001\pm0.003$ ; Kauten et al. (New J. Phys. 19, 033017, 2017, accès libre, CC-BY 3.0) $0.0\pm1.6\times10^{-3}$ avec des photons uniques annoncés, $(1.3\pm1.8)\times10^{-4}$ avec un laser atténué et $0.0\pm3.1\times10^{-5}$
  avec de la lumière classique. Avec $|\kappa|\leq|\kappa_{meas}| + 2\sigma$ et la plus petite pente, les données à photons uniques permettent $|a-1|\leq 6\times10^{-3}$, et les données en lumière classique, si chaque détection de photon est une course, $|a-1|\leq 1.1\times10^{-4}$. La course avec $m = 2$ donne $\kappa\approx 1$ et une dimension cachée réelle $\kappa\approx 0.1$, toutes deux exclues ; seule une dimension cachée complexe (deux réelles) par issue survit. C''est une contrainte sur le modèle, pas un soutien : $m = 1$ est exactement le cas qu''on ne peut pas distinguer de la mécanique quantique standard. La correspondance avec $\kappa$ dépend du découpage des issues, c''est pourquoi la pente la plus prudente est utilisée. Étapes suivantes de la série (non construites ici) : P3 (toutes les particules comme projections d''un seul objet), P4 (l''espace-temps courbe comme ombre d''un plongement plat : une métrique analytique 4D se plonge localement dans 10 dimensions plates par le
  théorème de Janet–Cartan, et Schwarzschild dans 6), l''ajustement de $d_G$ pour la gravité, et la recherche d''une prédiction qui diffère de la physique standard.'
meanings:
- fraction de la norme de $\Psi$ que voit l'observateur, pour toutes les $D$ à la fois (états emboîtés)
- l'état observé, uniforme sur la sphère unité de $\mathbb C^d$ pour toute $D$
- distance de Kolmogorov–Smirnov à Beta$(d, D-d)$ (bêta incomplète par quadrature)
- 'énergie du bloc caché $k$ à $m = 1..M$ dimensions : Gamma$(m)$ (complexe) ou $2\,$Gamma$(m/2)$ (réel)'
- 'la course de projection : l''issue de plus grand $|c_k|^2/E_k$ se produit'
- forme fermée de la course ; la somme sur $j$ (moins $j = k$) est le produit sur les autres issues
- 'indice de fente $s$ répété ⇒ sommé : l''amplitude pour chaque ensemble $S$ de fentes ouvertes'
- paramètre de Sorkin à trois chemins du modèle de course ; $0$ pour la règle de Born
labels:
  D_max: Plus grande dimension totale $D$ (exemple ; le calcul utilise une échelle jusqu'à elle)
  d: Dimension du sous-espace de l'observateur $d$ (exemple)
  m_max: Plus grand nombre de dimensions cachées par issue $m$
  outcomes: Nombre d'issues $K$
  trials: États aléatoires et événements par cas
