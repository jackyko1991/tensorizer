source_hash: 2b849cfef0cb
title: Теплопроводность в пластине
summary: Закон Фурье превращает градиент температуры в тепловой поток, а сохранение энергии превращает дивергенцию этого потока в изменение температуры. На сетке обе производные — крошечные ядра свёртки, так что один шаг по времени — всего два вызова conv2d по всей пластине.
notes: 'Разности вперёд, а затем назад складываются в привычный пятиточечный лапласиан, так что $\partial_i\partial_i T$ отдельно не программируется: он получается композицией ядер градиента и дивергенции. Явная схема устойчива только при $\alpha\,dt/dx^2 \le 1/4$ («число устойчивости» ниже). При граничных условиях Дирихле края — термостат при 20 °C, и тепло уходит; при условиях Неймана (теплоизолированные края) поток через границу отсутствует, и полное количество теплоты сохраняется, пока температура выравнивается. Синусоидальная мода $\sin(\pi x/L)\sin(\pi y/L)$ затухает как $\exp(-2\pi^2\alpha t/L^2)$.'
meanings:
- температура каждой ячейки сетки (размерности пакета и канала для conv2d)
- шаблоны разностей вперёд, по одному выходному каналу на направление $i \in \{x, y\}$
- 'закон Фурье: тепловой поток, канал $i$ — компонента'
- 'повторяющийся $i$ ⇒ суммирование: conv2d складывает 2 входных канала — дивергенция'
- температуропроводность (м²/с)
- 'правая часть; явный метод Эйлера: $T \leftarrow T + dt\,\partial_t T$'
labels:
  alpha: Температуропроводность $\alpha$
  t_max: Время моделирования
  n_spots: Горячие пятна
  n_grid: Ячеек сетки на сторону
  r: Число устойчивости $\alpha\,dt/dx^2$
  boundary: Края
