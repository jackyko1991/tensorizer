source_hash: 72ebeb1bb100
title: 由 DNA 距離建構系統發生樹
summary: DNA 序列沿一棵隱藏的隨機樹演化，每條分支是與 Jukes–Cantor 轉移矩陣的一次矩陣乘積。僅從葉節點出發，我們以對 one-hot 字母的一次 einsum 計數差異，校正被隱藏的多重取代，再以 UPGMA 與鄰接法重建樹。看看兩棵樹如何隨使用的位點增多而變化，並以 Robinson–Foulds 距離對照真實樹評分。
notes: 真實樹是一棵隨機溯祖樹；在寬鬆分子時鐘下，每條分支還有各自的速率，所以葉節點與根的距離各不相同。原始的相異位點比例 $p$ 在 $3/4$ 飽和，並低估長路徑（對角線下方的灰點）；Jukes–Cantor 距離 $d$ 無偏（對角線上的藍點）但雜訊較大，其雜訊以 $1/\sqrt L$ 縮小。UPGMA 假設所有葉節點與根等距，所以在寬鬆時鐘下，無論看到多少位點，它都可能把兩條並非鄰居的短分支接在一起（紅色分支）。鄰接法只需要距離沿樹可加，並收斂到真實的無根形狀；它以其最長路徑的中點為根繪出，因為僅憑距離無法定出根的位置。切換到嚴格時鐘，UPGMA 也會變得一致。
meanings:
- 經過長度 $t$（每位點預期取代數）的分支後，字母 $\alpha$ 變為 $\beta$ 的機率
- 重複的 $\alpha$ ⇒ 求和：子代每個位點的字母機率；以反 CDF 取樣
- 觀測到的葉節點序列，對 A、C、G、T 做 one-hot 編碼
- 重複的 $l, \alpha$ ⇒ 求和：$i$ 與 $j$ 相異的位點比例
- 校正距離 $-\tfrac34\ln(1 - \tfrac43 p)$：計入同一位點重複命中所隱藏的取代
- 鄰接法合併 $Q$ 最小（而非 $d$ 最小）的一對；$r_i = d_{ik}\mathbf 1_k$
- 真實路徑長度；當分支 $v$ 位於葉 $i$ 與根之間時 $M_{iv} = 1$，$b_v$ 為其長度
- 只出現在兩棵樹之一的葉節點二分劃數（每條內部分支一個）
labels:
  n_taxa: 分類單元數 $n$
  n_sites: 位點數 $L$
  tree_depth: 根到葉深度（每位點取代數）
  clock: 分子時鐘
