title: 코넬 박스의 몬테카를로 경로 추적
summary: 사실적인 렌더링은 렌더링 방정식을 몬테카를로 방법으로 푼다. 모든 표본의 모든 카메라 광선을 평면과 구로 이루어진 상자 안에서 하나의 배치로 추적한다. 코사인 가중 반사, 충돌 지점마다 면광원으로 보내는 그림자 광선, 그리고 경로를 끝내는 러시안 룰렛을 쓴다. 잡음이 $1/\sqrt{N}$로 줄어드는 것과, 전역 조명만이 포착하는 효과인 빨간 벽과 초록 벽의 색이 흰 벽으로 번지는 모습을 지켜보자.
notes: 확산(램버트) 표면에 대한 렌더링 방정식은, 한 점에서 나가는 빛이 그 점의 방출광에 들어오는 모든 빛의 반사 비율 $\rho$를 더한 것이라고 말한다. 들어오는 빛은 다시 다른 표면에서 나가는 빛이므로 적분이 재귀적으로 이어진다. 경로 추적기는 이를 무작위 경로로 대체한다. 코사인 가중 샘플링($p = \cos\theta/\pi$)은 BRDF와 코사인을 상쇄하므로, 처리량은 반사마다 인수 $\rho$만 곱해진다. 충돌할 때마다 광원 위 무작위 점으로 보내는 그림자 광선이 직접광을 더한다(다음 사건 추정, next-event estimation). 이는 반사된 광선이 우연히 작은 광원에 맞기를 기다리는 것보다 잡음이 훨씬 적다. 첫 번째 충돌에서 온 빛만 쓰면 직접광만의 이미지가 된다. 그 이후의 반사마다 간접광이 더해진다. 그림자 속의 부드러운 채움광, 더 밝은 천장, 그리고 빨강과 초록의 색 번짐이다. 테스트 모음의 퍼니스 테스트(furnace test)가 추정량을 검사한다. 모든 벽이 $L_e$를 방출하고 $\rho$를 반사하는 닫힌 상자는 어디서나 복사휘도가 $L_e/(1-\rho)$여야 한다. 코사인 샘플링을 쓰면 이 값이 분산 0으로 나온다. 각 픽셀이 독립 표본 $N$개의 평균이므로 오차는 $1/\sqrt N$로 줄어든다. 잡음을 절반으로 줄이려면 표본이 네 배 필요하며, 그래서 실무용 렌더러는 디노이저를 쓴다.
meanings:
- '광선 $r = (s, p)$의 원점과 방향: $P$개 픽셀 각각에 대해 지터링된 표본 $N$개, 배치 하나'
- 평면 $p$는 $n_{pi} x_i = d_p$이며 경계 상자로 잘림; 광원은 작은 평면
- 모든 광선에서 모든 평면까지의 거리; 반복된 $i$, $j$ ⇒ 합
- 모든 광선과 구에 대한 $\lvert o + t\omega - c\rvert^2 = r^2$의 근
- '각 광선을 따른 가장 가까운 충돌: 어떤 기본 도형인지, 어디인지, 그 법선'
- '다음 방향: 원판 위의 균일한 점을 반구로 들어 올림; $f\cos\theta/p = \rho$'
- '경로 처리량: $k$번째 반사에서 찾은 빛 중 카메라에 도달하는 비율'
- '다음 사건 추정: 면광원 위 무작위 점 $y$로 보내는 그림자 광선'
- '러시안 룰렛: 어두운 경로를 무작위로 끝내되 살아남은 경로에 가중치를 다시 주어 평균이 변하지 않게 함'
- '픽셀 색: 표본 인덱스 $s$에 대한 평균'
labels:
  resolution: 이미지 크기
  spp: 픽셀당 표본 수 $N$
  reference_spp: 기준 이미지의 픽셀당 표본 수
  bounces: 반사 횟수(룰렛 이전)
  termination: 경로 종료 방식
  light_power: 광원 복사휘도 $L_e$
