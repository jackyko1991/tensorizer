<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="The complex s-plane: the critical strip 0 &lt; Re s &lt; 1 shaded, the critical line Re s = 1/2 dashed with the nontrivial zeros on it at heights ±14.13, ±21.02, ±25.01, the pole at s = 1 and the trivial zero at s = -2">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- origin (120, 80); 40 px per unit horizontally, 2.6 px per unit vertically -->
    <rect x="120" y="6" width="40" height="148" fill="#93c5fd" fill-opacity="0.45"/>
    <line x1="12" y1="80" x2="232" y2="80" stroke="#374151" stroke-width="1.5"/>
    <line x1="120" y1="156" x2="120" y2="4" stroke="#374151" stroke-width="2"/>
    <line x1="160" y1="156" x2="160" y2="4" stroke="#374151" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="140" y1="156" x2="140" y2="4" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- nontrivial zeros 1/2 ± i·14.13, 21.02, 25.01 -->
    <g fill="#2563eb" stroke="#1e40af" stroke-width="1">
      <circle cx="140" cy="43.3" r="3.5"/><circle cx="140" cy="25.3" r="3.5"/><circle cx="140" cy="15" r="3.5"/>
      <circle cx="140" cy="116.7" r="3.5"/><circle cx="140" cy="134.7" r="3.5"/><circle cx="140" cy="145" r="3.5"/>
    </g>
    <text x="146" y="47" font-size="12" fill="#1e40af">14.13</text>
    <text x="146" y="29" font-size="12" fill="#1e40af">21.02</text>
    <!-- pole at s = 1 -->
    <g stroke="#dc2626" stroke-width="2">
      <line x1="155" y1="75" x2="165" y2="85"/><line x1="165" y1="75" x2="155" y2="85"/>
    </g>
    <text x="167" y="96" font-size="12" fill="#b91c1c">pole</text>
    <!-- trivial zero at s = -2 -->
    <circle cx="40" cy="80" r="3.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <text x="30" y="98" font-size="12" fill="#b45309">−2</text>
    <!-- labels -->
    <text x="182" y="20" font-size="13" font-style="italic">s</text>
    <text x="126" y="100" font-size="12" fill="#374151">½</text>
    <text x="12" y="20" font-size="12" fill="#374151">Re <tspan font-style="italic">s</tspan> = ½</text>
    <line x1="74" y1="18" x2="136" y2="30" stroke="#9ca3af" stroke-width="1"/>
  </g>
</svg>
