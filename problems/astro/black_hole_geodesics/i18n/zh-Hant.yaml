source_hash: 31a92e6ff86f
title: 廣義相對論：黑洞周圍的軌道與墜落
summary: 史瓦西度規中的測地線：克里斯多福符號由 $g_{\mu\nu}(x)$ 經自動微分求得，再以 einsum 縮併。束縛軌道會進動而不閉合；有效位能顯示最內穩定圓軌道（ISCO）位於 $6GM/c^2$、光子球位於 $3GM/c^2$；徑向墜落在有限的固有時內抵達視界，而遠方的時鐘卻凍結不動。
notes: 單位：$G = c = M = 1$，故長度以 $GM/c^2$ 為單位（每太陽質量 1.5 km），視界位於 $r_s = 2$。軌道從近拱點出發，所用的能量 $E$ 與角動量 $L$ 是半通徑 $p$、離心率 $e$ 之史瓦西軌道的精確值。以 RK4 對固有時 $\tau$ 積分；具相同 $p$ 與 $e$ 的灰色牛頓橢圓則會閉合。對大的 $p$，近日點進動趨近 $6\pi GM/(c^2 p)$（水星每世紀 43″），靠近黑洞時則大得多。束縛軌道只在 $p > 6 + 2e$ 時存在；在 ISCO（$r = 6$）以內圓軌道不穩定，而在 $r = 3$ 連光都能繞行。在墜落圖（右下）中，下落的時鐘約在 $\tau = \tfrac{\pi}{2}\sqrt{r_0^3/2}$（有限）後抵達視界，但以史瓦西時間 $t$ 來看，墜落逐漸變慢並凍結於 $r = 2$；模擬在 $r = 2.1$ 停止，此處這組座標開始失效。
meanings:
- 每條測地線上的事件 $(t, r, \theta, \varphi)$，$G = c = M = 1$
- 四維速度 $dx^\mu/d\tau$
- 史瓦西度規，號差 $(-, +, +, +)$
- 逆度規
- 以 autograd 求度規導數，導數指標在最後
- 重複的 $\sigma$ ⇒ 求和（$z$ = 批次）
- 重複的 $\alpha, \beta$ ⇒ 求和
- 有質量粒子應 $= -1$，用以檢查積分
labels:
  p: 半通徑 $p$
  e: 離心率 $e$
  n_orbits: 模擬圈數
  dt: 固有時步長 $\Delta\tau$
  r_infall: 墜落起點（靜止）
