title: दृढ़ पिंड का मुक्त घूर्णन (टेनिस-रैकेट प्रभाव)
summary: बल-आघूर्ण रहित बॉक्स के लिए ऑयलर के समीकरण, जड़त्व टेंसर $I_{ij}$ और लेवी-सिविटा टेंसर $\varepsilon_{ijk}$ से लिखे गए। सबसे लंबे या सबसे छोटे अक्ष के परितः घूर्णन स्थायी है; मध्यवर्ती अक्ष के परितः घूर्णन बार-बार पलटता है (ज़ानीबेकोव प्रभाव)।
notes: बल-आघूर्ण न होने पर ऊर्जा $\tfrac12\boldsymbol\omega\cdot I\boldsymbol\omega$ और $\mathbf L = I\boldsymbol\omega$ का परिमाण दोनों संरक्षित रहते हैं, इसलिए $\boldsymbol\omega$ को ($\mathbf L$-समष्टि में) स्थिर ऊर्जा वाले दीर्घवृत्तज और स्थिर $\lvert\mathbf L\rvert$ वाले गोले के प्रतिच्छेदन पर चलना पड़ता है। दीर्घ और लघु अक्षों के पास ये वक्र छोटे लूप हैं — स्थायी; मध्यवर्ती अक्ष के पास ये एक काठी बिंदु (saddle) से गुज़रते हैं, इसलिए छोटी-सी डगमगाहट बढ़ती है और बॉक्स पलट जाता है, फिर वापस पलटता है। विश्व-फ्रेम कोणीय संवेग $RI\boldsymbol\omega$ (स्थिर तीर के रूप में दिखाया गया) कभी नहीं हिलता। प्राचल $a, b, c$ इस तरह क्रमित हैं कि $a \ge b \ge c$।
meanings:
- ठोस बॉक्स का जड़त्व टेंसर, $(M/12)\operatorname{diag}(b^2+c^2,\ a^2+c^2,\ a^2+b^2)$
- पिंड-फ्रेम घटकों में कोणीय वेग
- 'लेवी-सिविटा टेंसर: टेंसर के रूप में सदिश गुणनफल'
- '$j, k, l$ का योग: $\boldsymbol\omega\times(I\boldsymbol\omega)$'
- $I_{ij}\dot\omega_j = -\varepsilon_{ijk}\omega_j I_{kl}\omega_l$ हल करें
- 'अभिविन्यास: पिंड → विश्व घूर्णन आव्यूह'
- घूर्णी गतिज ऊर्जा, संरक्षित
labels:
  spin_axis: मुख्यतः किस अक्ष के परितः घूर्णन
  spin: घूर्णन दर
  perturbation: डगमगाहट (घूर्णन का अंश)
  a: बॉक्स की भुजा $a$
  b: बॉक्स की भुजा $b$
  c: बॉक्स की भुजा $c$
  t_max: सिमुलेशन समय
