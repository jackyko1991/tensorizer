source_hash: 4d0cdb4cbe20
title: 電流迴圈的磁場（必歐–沙伐）
summary: 必歐–沙伐定律把導線化為許多短線段之和。外積 $d\mathbf l\times\mathbf r$ 就是 Levi-Civita 張量 $\varepsilon_{ijk}$ 與兩個向量的縮並，因此對（$i, j, k$、線段）作一次 einsum，便得到整個線圈在每個格點的磁場。迴圈半徑脹縮時，$x$–$z$ 平面與軸上的磁場隨之變化。
notes: SI 單位（$\mu_0 = 4\pi\times 10^{-7}$ T·m/A），磁場以 μT 顯示。迴圈位於水平面上，因此 $x$–$z$ 平面與每個迴圈交於兩點（⊙ 電流穿出紙面，⊗ 穿入紙面）。亥姆霍茲線圈（間距 $R$、電流相等）在兩者之間產生近乎均勻的磁場；反亥姆霍茲線圈（電流相反）的磁場在中心為零並線性增大——這正是冷原子所用的阱。靠近導線的格點使用小的軟化長度，使磁場保持有限。
meanings:
- 平面 $y = 0$ 上的場點 $g$
- 導線線段 $s$ 的中點與方向向量
- 從每個線段指向每個場點（廣播）
- Levi-Civita 符號：以張量表示外積
- 重複的 $j, k$ ⇒ 外積；重複的 $s$ ⇒ 沿導線求和
- 每個迴圈的精確值 $\mu_0 I R^2/(2(R^2 + z^2)^{3/2})$，用來檢驗求和
labels:
  layout: 線圈
