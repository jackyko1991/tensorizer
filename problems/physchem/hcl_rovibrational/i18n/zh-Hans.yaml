source_hash: dda111a1c11f
title: HCl 振转光谱
summary: HCl 的红外谱带是一排梳状谱线：分子在振动（非谐振子）和转动（旋转时会伸长的转子），每条谱线都是一次 $v = 0 \to 1$、$\Delta J = \pm 1$ 的跃迁。两种氯同位素的 P 支和 R 支作为一个批量 $(I, J)$ 网格得出，强度按升温过程中的玻尔兹曼分布计算；随后用组合差最小二乘拟合从谱线中恢复 $B_e$、$\alpha_e$ 和 $\nu_0$。
notes: '这些常数是 H³⁵Cl 的近似文献值：$\omega_e \approx 2991$、$\omega_ex_e \approx 52.8$、$B_e \approx 10.59$、$\alpha_e \approx 0.31$ 和 $D_e \approx 5\times10^{-4}$ cm⁻¹。谱带原点 $\nu_0 = \omega_e - 2\omega_ex_e \approx 2885$ cm⁻¹ 处没有谱线，因为像 HCl 这样的 $\Sigma$ 态没有 $\Delta J = 0$（Q）支：R(0) 与 P(1) 之间的间隙约为 $4B$。由于 $B_1 < B_0$（振动中的键平均更长），R 支谱线向高 $J$ 聚拢，而 P 支谱线逐渐散开。每条谱线都是双重线，H³⁷Cl 位于低约 2 cm⁻¹ 处，强度为三分之一（天然丰度 76 : 24）；该位移随 $|\nu - \nu_0|$ 增大，因为每个常数都按约化质量的某个幂次标度。气体升温时，玻尔兹曼因子 $(2J+1)e^{-hcF(J)/kT}$ 的极大值移向更高的 $J$，两支随之展开（每一帧按其最强谱线归一化）。组合差是光谱学家分离两个态的技巧：R(J−1) 和 P(J+1) 终止于同一上能级，所以它们的差只取决于 $v = 0$；R(J) 和 P(J) 始于同一下能级，所以它们的差只取决于 $v = 1$。对 $\Delta_2F/(4J+2)$ 与 $J^2 + J + 1$ 做直线拟合得到 $B_v$（截距）和 $D$（斜率），然后 $\alpha_e = B_0 - B_1$，$B_e = B_0 + \alpha_e/2$。加入测量噪声，看这些常数能保留多好。等效的 Morse 势阱深度为 $\omega_e^2/4\omega_ex_e$。简化：不含 Herman–Wallis 强度修正，所有谱线用同一个洛伦兹线宽，吸收不按 $\tilde\nu$ 加权。'
meanings:
- H³⁵Cl 的近似常数，用 $\rho = \sqrt{\mu_{35}/\mu_{37}}$ 换算到 H³⁷Cl
- 能级 $v$ 的转动项；不对任何指标求和，外积
- 两种同位素分子的每条谱线都在一个网格中；$J$ 为下能级
- 升温过程中每个温度下能级 $J$ 的玻尔兹曼布居
- 丰度 × 布居 × Hönl–London 因子；P(0) 恰好为零
- 重复的 $\ell$ ⇒ 对所有谱线求和：展宽后的光谱
- 下态（$s=0$）和上态（$s=1$）的 $\Delta_2F/(4J+2) = B_v - 2D(J^2+J+1)$
- 重复的 $n$ ⇒ 求和：每种同位素分子和每个态的最小二乘 $B_v$ 和 $D$
labels:
  T: 最终温度 $T$
  J_max: 最高下能级 $J_{max}$
  fwhm: 谱线宽度（FWHM）
  noise: 测量谱线的噪声
