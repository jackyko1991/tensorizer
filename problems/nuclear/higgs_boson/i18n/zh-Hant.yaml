source_hash: 2633dfd2d254
title: 在真實雙光子數據中尋找希格斯玻色子
summary: 來自 10 fb$^{-1}$ 真實 13 TeV ATLAS 碰撞（ATLAS Open Data，CC0）的約 95 000 對光子，按雙光子質量 $m_{\gamma\gamma}$ 分箱，並以 autograd 擬合：平滑下降的背景加上一個窄的希格斯峰。剖面似然比給出 $m_H$、訊號強度 $\mu$ 與局部顯著性 $Z = \sqrt{q_0}$；一批僅含背景的模擬實驗展示了「別處效應」（look-elsewhere effect）；墨西哥帽位勢 $V = -\mu^2|\phi|^2 + \lambda|\phi|^4$ 則把測得的質量轉換為希格斯自耦合 $\lambda = m_H^2/2v^2$。
notes: 2012 年 7 月，ATLAS 與 CMS 宣布在 125 GeV 附近發現一個新的玻色子，主要見於兩個通道：雙光子與四輕子。2013 年諾貝爾物理學獎頒給了 Englert 與 Higgs，表彰這一發現所證實的機制。這裡用真實數據重做光子通道。希格斯粒子無法直接衰變為光子（光子無質量），只能透過 W 玻色子與頂夸克的迴圈，因此這是一種稀有衰變（$\mathcal B \approx 0.23\%$），疊加在由普通光子對構成的巨大平滑背景之上。以本檔案中的 10 fb$^{-1}$，結果為 $m_H \approx 124.2 \pm 1.0$ GeV（PDG 2024：$125.20 \pm 0.11$）、$\mu \approx 1.0 \pm 0.4$（標準模型的產生率），局部顯著性約 $2.7\sigma$（預期約 $3.4\sigma$）。這是一個超出，而非發現：2012 年的發現動用了多個事例類別、兩個通道與兩個實驗，才超過 $5\sigma$。這次掃描也是一個有用的警示：在這個小樣本中，143 GeV 附近的一個背景漲落幾乎一樣大（局部 $2.6\sigma$），與 124 GeV 處真正的希格斯粒子相當。這就是別處效應。在寬廣的窗口中某處出現一個凸起是很可能的，因此模擬實驗估計僅靠背景產生凸起的頻率：約 13% 的純背景掃描會在某處超過 125 GeV 的超出，而 Gross–Vitells 上穿公式給出接近 0.1 的全域 p 值。在固定質量下，純背景模擬實驗服從 $\tfrac12\delta(0) + \tfrac12\chi^2_1$（Wilks/Chernoff），這就是 $Z = \sqrt{q_0}$ 的原因。墨西哥帽：由 μ 子壽命得到 $v = (\sqrt2 G_F)^{-1/2} = 246.2$ GeV，測得的質量便確定 $\lambda = m_H^2/2v^2 \approx 0.13$；圍繞真空環的徑向擺動就是希格斯玻色子，而沿環的平坦方向則成為縱向的 W 與 Z。數據：ATLAS Open Data 13 TeV，2020 年發布，GamGam 樣本（CERN Open Data Portal 紀錄 15006，doi:10.7483/OPENDATA.ATLAS.B5BJ.3SGS，授權 CC0；2016
  年數據時段 A–D）。篩選方式與 ATLAS 推廣用 H → γγ 筆記本相同：光子觸發，兩個緊（tight）且孤立的光子，$p_T > 40$ 與 30 GeV，$|\eta| < 2.37$ 且不在 1.37–1.52 範圍內。sm_signal 欄是對應的 ATLAS 模擬（ggF、VBF、WH、ZH、ttH，125 GeV），加權至 10 fb$^{-1}$，給出 $N_{SM} \approx 406$ 個事例及峰寬。簡化之處：單一包含性類別、高斯峰（真實的峰有尾部，這就是擬合寬度約 2.3 GeV 大於核心解析度的原因）、不含系統不確定度，以及指數多項式背景（可嘗試改變次數，以觀察偽訊號敏感度）。
meanings:
- 每個 0.5 GeV 分箱的真實雙光子計數；任何含 m_low、m_high、events 欄的 CSV 都可使用
- 縮放質量 $x \in [0, 1]$ 的冪次；背景為 $\exp(X\theta)$
- 在每個分箱上積分的高斯峰（erf），寬度 $\sigma$ 由 ATLAS 模擬擬合
- 每個直方圖的泊松似然，透過 autograd 以 Adam + L-BFGS 最小化
- 重複的 $n$ ⇒ 求和：Fisher scoring 同時擬合每個模擬實驗 × 每個質量
- 剖面似然比，當擬合訊號為負時為 0
- $m_H$ 與 $\mu$ 的誤差，由 $-\ln L$ 的曲率得出
- 沿複平面上三條射線 $\phi = r\,e^{i\alpha}$ 的位勢：每個相位都是同一條曲線，在 $|\phi| = v/\sqrt2$ 處形成真空環
labels:
  m_min: 擬合窗口起點
  m_max: 擬合窗口終點
  degree: 指數中背景多項式的次數
  m_start: 擬合的起始質量
  scan_step: 質量掃描步長
  n_toys: 純背景模擬實驗
