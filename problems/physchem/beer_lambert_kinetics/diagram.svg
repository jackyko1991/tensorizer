<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Spectrophotometer: white light from a lamp passes a grating that selects wavelength lambda, crosses a cuvette of path length l holding the reacting solution of concentration c, and the transmitted intensity I is measured by a detector">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- lamp -->
    <circle cx="20" cy="70" r="10" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <path d="M15,70 q2.5,-6 5,0 t5,0" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- white beam to the grating -->
    <line x1="31" y1="70" x2="54" y2="70" stroke="#f59e0b" stroke-width="3"/>
    <!-- grating (monochromator) -->
    <rect x="54" y="52" width="8" height="36" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
    <g stroke="#1e40af" stroke-width="1"><line x1="56" y1="56" x2="60" y2="56"/><line x1="56" y1="62" x2="60" y2="62"/><line x1="56" y1="68" x2="60" y2="68"/><line x1="56" y1="74" x2="60" y2="74"/><line x1="56" y1="80" x2="60" y2="80"/></g>
    <!-- dispersed colours, one selected -->
    <line x1="62" y1="70" x2="76" y2="60" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="62" y1="70" x2="76" y2="80" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="66" y="44" font-style="italic">λ</text>
    <!-- monochromatic beam I0 into the cuvette -->
    <line x1="62" y1="70" x2="104" y2="70" stroke="#16a34a" stroke-width="3"/>
    <text x="84" y="92" font-style="italic">I<tspan font-size="10" dy="3" font-style="normal">0</tspan></text>
    <!-- cuvette with the reacting solution -->
    <rect x="106" y="40" width="40" height="70" fill="none" stroke="#374151" stroke-width="2"/>
    <rect x="108" y="56" width="36" height="52" fill="#93c5fd"/>
    <circle cx="116" cy="66" r="3" fill="#2563eb"/><circle cx="132" cy="90" r="3" fill="#2563eb"/>
    <circle cx="126" cy="74" r="3" fill="#16a34a"/><circle cx="114" cy="98" r="3" fill="#16a34a"/>
    <circle cx="138" cy="64" r="3" fill="#dc2626"/>
    <line x1="106" y1="70" x2="146" y2="70" stroke="#16a34a" stroke-width="2" stroke-opacity="0.7"/>
    <text x="114" y="34" font-size="12" fill="#1e40af">A→B→C</text>
    <!-- path length -->
    <line x1="108" y1="122" x2="144" y2="122" stroke="#374151" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="122" y="140" font-style="italic">l</text>
    <!-- transmitted beam I to detector -->
    <line x1="146" y1="70" x2="186" y2="70" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="158" y="60" font-style="italic">I</text>
    <rect x="190" y="54" width="22" height="32" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="164" y="112" font-size="12" fill="#374151"><tspan font-style="italic">D</tspan> = log(<tspan font-style="italic">I</tspan><tspan font-size="9" dy="3">0</tspan><tspan dy="-3">/</tspan><tspan font-style="italic">I</tspan>)</text>
  </g>
</svg>
