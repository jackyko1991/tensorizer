source_hash: 045c5b4ab526
title: 4元運動量と2体崩壊
summary: 運動する粒子が2つに崩壊する。静止系では生成物は一定の運動量 $p^*$ で背中合わせに飛ぶ。ローレンツブースト $\Lambda^\mu{}_\nu$（1回の einsum）がすべての崩壊角を一度に実験室系へ移し、そこで運動量は前方へ寄せられる。ミンコフスキー計量 $\eta_{\mu\nu}$ により生成物の4元運動量から親粒子の質量が復元される——新粒子の発見に使われる不変質量の手法である。
notes: 静止系の運動量は半径 $p^*$ の球面上にある。ブーストによりそれは親粒子の運動量だけ前方にずれた楕円（描かれた曲線）に引き伸ばされるので、速い親粒子は両方の生成物を狭い前方の円錐内に放出する。エネルギーと実験室系での角度は $\theta^*$ とともに変わるが、各生成物の $p_\mu p^\mu = m^2$ と $(p_1+p_2)_\mu(p_1+p_2)^\mu = M^2$ は決して変わらない——2つの運動量を測定する検出器は常に $M$ を再構成できる。$\pi^0 \to \gamma\gamma$ では光子は質量がなく（$p_\mu p^\mu = 0$）、最小開き角は $2\arcsin(1/\gamma)$ である。3つの崩壊はすべて実在する：$K^0_S \to \pi^+\pi^-$、$\pi^0 \to \gamma\gamma$、$\Lambda \to p\,\pi^-$。運動学だけをモデル化している：崩壊角はサンプリングせず等間隔に掃引し、スピンと偏極は無視する。
meanings:
- diag(1, −1, −1, −1)、$c = 1$ の単位系
- 静止系における B 個の崩壊角 $\theta^*$ に対する娘粒子の4元運動量
- 親粒子の速度 $\boldsymbol\beta = \mathbf P/E$ に対する $\gamma$、$\gamma\beta_i$、$\delta_{ij} + (\gamma-1)\beta_i\beta_j/\beta^2$
- 繰り返される $\nu$ ⇒ 和をとる：すべての崩壊を一度にブースト
- ミンコフスキー内積：どの系でも同じ
- 各配置で再構成した親粒子の質量
labels:
  decay: 崩壊
