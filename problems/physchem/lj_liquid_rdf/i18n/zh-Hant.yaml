source_hash: cb188a4168d9
title: Lennard-Jones 流體：分子動力學與徑向分布函數
summary: 五百個原子在週期性盒子中以 Lennard-Jones 位能交互作用，以速度 Verlet 法積分。所有原子對向量都放在一個以最小映像約定廣播的張量中，三個狀態點（氣體、三相點附近的液體與壓縮的固體）以一個批次執行。Berendsen 恆溫器設定溫度，接著進行能量守恆的 NVE 模擬，原子對距離的直方圖給出 $g(r)$：氣體平坦、液體為衰減的殼層、固體為尖銳的晶格峰。維里則給出壓力。
notes: 約化單位：長度以 $\sigma$、能量以 $\varepsilon$ 為單位，質量為 1，$T^* = k_BT/\varepsilon$，時間 $\tau = \sigma\sqrt{m/\varepsilon}$；對氬而言 $\sigma = 3.4$ Å、$\varepsilon/k_B = 120$ K，因此液態狀態點約為 86 K。這就是 Rahman 在 1964 年對液態氬所做的模擬（Phys. Rev. 136, A405），搭配 Verlet 在 1967 年提出的積分器與 $g(r)$ 分析（Phys. Rev. 159, 98）。位能在 $r_c = 2.5\sigma$ 處截斷並平移至零，使能量連續；壓力加上標準尾端修正 $\tfrac{16}{3}\pi\rho^2[\tfrac23 r_c^{-9} - r_c^{-3}]$，它假設截斷距離之外 $g = 1$。Berendsen 恆溫器把速度朝目標溫度重新縮放；它不會產生精確的正則系綜漲落，因此只用於平衡化，量測則來自普通的 NVE 模擬，其平坦的能量軌跡驗證了積分器。氣體與液體從高溫開始，讓晶格熔化。液體 $g(r)$ 的第一個峰位於位能極小值 $2^{1/6}\sigma$ 附近，後續殼層逐漸衰減，約在 $3\sigma$ 處 $g \to 1$；固體保留 fcc 峰。對氣體，壓力會與理想氣體以及第二維里修正 $P = \rho T(1 + B_2\rho)$ 比較，$B_2$ 以數值積分求得。模擬很短（數個 $\tau$），因此平均值帶有百分之幾的統計雜訊。完整的原子對張量每步耗費 $O(N^2)$；實際生產用的程式使用格子或鄰居列表來處理數百萬個原子。
meanings:
- 約化單位下的氣體 $(0.05, 1.5)$、液體 $(0.84, 0.72)$、固體 $(1.10, 0.60)$
- 從 fcc 晶格開始，$N = 4n^3$ 個原子，盒子 $L_s = (N/\rho_s)^{1/3}$
- 以廣播同時得到每個原子對向量，再折回最近的映像
- 重複的 $a$ ⇒ 求和
- $-u^{\prime}(r)/r$，在對角線上及 $r_c = 2.5\sigma$ 之外為零
- 重複的 $j$ ⇒ 求和；$d_{saji} = -d_{saij}$ 自動滿足牛頓第三定律
- 半步踢、漂移（折回盒內）、新的力、半步踢：時間可逆且能量守恆
- 僅在平衡化期間使用 Berendsen 恆溫器
- $\rho T + W/3V$ 加上 $r_c$ 之外原子對的尾端修正
- 每個殼層的原子對數除以理想氣體的計數 $\tfrac12 N\rho\,4\pi r^2\Delta r$
labels:
  rho_liquid: 液體密度 $\rho^*$
  T_liquid: 液體溫度 $T^*$
  n_cells: 每邊 fcc 晶胞數（$N = 4n^3$）
  dt: 時間步長 $\Delta t$
  equilibration_steps: 平衡化步數
  production_steps: 量測步數
