source_hash: d134f88d426a
title: Marcus 電子轉移理論與反轉區
summary: 只有當周圍溶劑恰好漲落到兩個狀態能量相同的組態時，電子才會從予體跳到受體：即兩條拋物線的交點。這給出 Marcus 速率 $k \propto \exp[-(\Delta G^\circ + \lambda)^2/4\lambda k_BT]$，這裡在由重組能、溫度與驅動力構成的一個廣播網格上計算。當 $-\Delta G^\circ = \lambda$ 時速率最快，而違反直覺的是，對更下坡的反應速率反而再度變慢。對溶劑座標的 Langevin 模擬，加上交點處的 Landau–Zener 躍遷，重現了這條曲線。
notes: 單位：eV、K 與 ps。溶劑座標 $x$ 是被轉移電荷所感受到的集體極化，經縮放使反應物位阱位於 0、產物位阱位於 1；$\lambda$ 是在電荷仍位於予體上時，把溶劑極化成產物狀態所需的能量。Marcus 於 1956 年推導出二次能障（J. Chem. Phys. 24, 966）並預言了反轉區，直到 1980 年代才得到實驗證實。在反轉區（$-\Delta G^\circ > \lambda$），產物拋物線在反應物拋物線的遠側與之相交，因此更大的驅動力把交點推得更高。速率公式是費米黃金定則（非絕熱、小 $H_{AB}$）搭配古典溶劑；真實反轉區的速率下降得較慢，因為高頻分子振動開啟了量子通道（Marcus–Levich–Jortner 延伸）。模擬刻意採用簡單的圖像：一個頻率為 $\omega$、摩擦為 $\gamma$ 的古典溶劑座標，一次只在一條非絕熱拋物線上運動，並在交點以 Landau–Zener 機率 $1 - e^{-2\pi H_{AB}^2/\hbar|\dot x|\,|\Delta F|}$ 切換，這假設通過是筆直且快速的。對熱通量下的多次通過求和，在 $P_{\mathrm{LZ}} \ll 1$ 時便得回黃金定則速率，這就是數據點落在曲線上的原因；對大的 $H_{AB}$，躍遷趨於飽和（絕熱轉移），摩擦開始變得重要。躍遷後的軌跡在產物面上繼續運動，也可能跳回去。試試降低 $T$（曲線變窄）、提高 $H_{AB}$（模擬結果偏到公式之下），或改變 $\lambda$。
meanings:
- 速率網格的三個軸
- 廣播同時建立所有組合；不對任何指標求和
- 拋物線的交點；$x^* < 0$ 表示反轉區
- 交點相對於反應物極小值的高度
- 在模擬驅動力 $d$ 下的軌跡 $n$，以 Boltzmann 統計從反應物位阱出發
- 在反應物面上為 0，在產物面上為 1；它決定溶劑被拉向的極小值
- 對所有軌跡一起執行半步踢、半步漂移、摩擦 + 雜訊、半步漂移、半步踢
- 每當一步越過 $x^*$ 時，以此機率切換位能面
- 在反應物面上每單位停留時間的正向躍遷數；誤差棒為 $\sqrt{\text{hops}}/t$
labels:
  lam: 重組能 $\lambda$
  T: 溫度 $T$
  H_ab: 電子耦合 $H_{AB}$
  omega: 溶劑頻率 $\omega$
  friction: 溶劑摩擦 $\gamma$
  steps: 時間步數
