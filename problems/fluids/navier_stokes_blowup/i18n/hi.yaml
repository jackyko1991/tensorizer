title: नेवियर–स्टोक्स नियमितता और ब्लोअप के संभावित उदाहरण
summary: क्ले मिलेनियम प्रॉब्लम यह पूछता है कि क्या चिकने (smooth) त्रिविमीय असंपीड्य प्रवाह हमेशा चिकने बने रहते हैं। टोरस पर एक स्यूडो-स्पेक्ट्रल सॉल्वर ऑयलर समीकरण ($\nu = 0$) और दो श्यानताओं के लिए टेलर–ग्रीन (Taylor–Green) भँवर को FFT के एक ही बैच में चलाता है, और अधिकतम भ्रमिलता (vorticity), एन्स्ट्रॉफी तथा बील–काटो–माजदा समाकल $\int\|\omega\|_\infty dt$ पर नज़र रखता है, जिसे किसी भी ब्लोअप पर अपसारी होना ही चाहिए। भँवर-खिंचाव (vortex stretching) के कारण ऑयलर भ्रमिलता तब तक बढ़ती है जब तक ग्रिड उसे विभेदित (resolve) नहीं कर पाता; श्यानता उसे सीमित रखती है। यह एक उदाहरण है, प्रमाण नहीं।
notes: 'क्ले प्रॉब्लम (फ़ेफ़रमैन का आधिकारिक विवरण) $\nu > 0$ के लिए चार में से किसी एक कथन की माँग करता है: $\mathbb R^3$ पर (A) या टोरस $\mathbb T^3$ पर (B) वैश्विक चिकने हल, अथवा $\mathbb R^3$ पर (C) या $\mathbb T^3$ पर (D) हल का टूटना (breakdown)। GitHub पर openai/NavierStokesAndEuler रिपॉज़िटरी का कहना है कि इसमें, साथ के शोधपत्रों सहित, Lean 4 में मशीन द्वारा जाँचे गए प्रमाण हैं: बाह्य बल वाले नेवियर–स्टोक्स समीकरण के $\mathbb R^3$ और $\mathbb T^3$ पर टूटने के (विकल्प C और D), तथा चिकने, कॉम्पैक्ट आधार वाले प्रारंभिक आँकड़ों से बिना बाह्य बल वाले ऑयलर समीकरण के परिमित समय में ब्लोअप के। ये हाल के दावे हैं जिनका गणितीय समुदाय और क्ले इंस्टीट्यूट द्वारा मूल्यांकन अभी बाकी है; यह पृष्ठ पुरस्कार-समस्या को हल हुआ नहीं मानता। ऑयलर समीकरण के लिए, चिकने हलों की परिमित-समय विलक्षणता (singularity) को सीमा सहित लुओ–हौ (2014) की अक्षसममित गणना से और बाद में कंप्यूटर-सहायित प्रमाणों (चेन–हौ) से समर्थन मिला, और एल्गिंडी (2021) ने $C^{1,\alpha}$ आँकड़ों के लिए ब्लोअप सिद्ध किया। यहाँ का सिमुलेशन
  केवल उन राशियों को दर्शाता है जिन्हें ये शोधकार्य नियंत्रित करते हैं। टेलर–ग्रीन भँवर $\mathbf u_0 = (\sin x\cos y\cos z, -\cos x\sin y\cos z, 0)$ एक क्लासिक परीक्षण है (Brachet और अन्य, 1983): भँवर-खिंचाव इसे पतली परतों में तीखा कर देता है, एन्स्ट्रॉफी बढ़ती है, और ऊर्जा स्पेक्ट्रम सपाट होता जाता है। स्पेक्ट्रम की पूँछ $e^{-2\delta k}$ की तरह घटती है; ब्लोअप के लिए विश्लेषिकता पट्टी $\delta(t)$ को परिमित समय में शून्य तक पहुँचना होगा, जबकि Brachet ने पाया कि यह केवल घातांकी रूप से सिकुड़ती है। जैसे ही $\delta\,k_\max < 1$ होता है, ऑयलर रन अपर्याप्त रूप से विभेदित हो जाता है (छायांकित): काटा गया (truncated) तंत्र तब भी ऊर्जा को ठीक-ठीक संरक्षित रखता है, पर इसके बाद $\|\omega\|_\infty$ की वृद्धि ग्रिड की कृत्रिमता है, विलक्षणता का प्रमाण नहीं। श्यानता के साथ ऊर्जा $dE/dt = -2\nu\Omega$ का पालन करती है (राउंड-ऑफ़ त्रुटि तक जाँचा गया) और एन्स्ट्रॉफी शिखर पर पहुँचकर घटती है। द्विविमीय टेलर–ग्रीन भँवर एक यथार्थ हल $e^{-2\nu t}$ है और त्रिविमीय का प्रारंभिक त्वरण $p_0 = \frac1{16}(\cos 2x +
  \cos 2y)(\cos 2z + 2)$ से ज्ञात है: दोनों परीक्षण हैं। विभेदित समय को और आगे ले जाने के लिए बड़ा $N$ आज़माएँ।'
meanings:
- टोरस $[0, 2\pi)^3$ पर हर रन $b$ (प्रत्येक की अपनी श्यानता) के वेग के फ़ूरिए गुणांक
- लेवी-चिविटा टेंसर से कर्ल; दोहराए गए $j, l$ ⇒ योग
- घूर्णी रूप में अरैखिक पद, वास्तविक समष्टि में परिकलित (स्यूडो-स्पेक्ट्रल)
- 'लेरे प्रक्षेपण: प्रवणता वाला भाग हटा देता है, इसलिए दाब कभी परिकलित नहीं होता और $k_i\hat u_i = 0$'
- उन मोड को हटाता है जिन्हें द्विघाती पद एलियास कर देता; $k_\max = N/3$
- गतिज ऊर्जा $\frac12\langle|\mathbf u|^2\rangle$ और एन्स्ट्रॉफी $\frac12\langle|\boldsymbol\omega|^2\rangle$
- 'बील–काटो–माजदा कसौटी: चिकना हल $T^*$ पर तभी टूट सकता है जब यह समाकल वहाँ अपसारी हो'
- $E(k) \propto k^{-3}e^{-2\delta k}$ का फ़िट; वास्तविक विलक्षणता के लिए $\delta \to 0$ चाहिए, और ग्रिड प्रवाह को तभी तक विभेदित करता है जब तक $\delta\,k_\max \gtrsim 1$
labels:
  n: ग्रिड $N^3$
  nu: श्यानता $\nu$ (रन $0$, $\nu$, $2\nu$)
  t_max: सिमुलेशन समय
