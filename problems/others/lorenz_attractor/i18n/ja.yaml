source_hash: 8944aa9bc162
title: ローレンツ・アトラクターとバタフライ効果
summary: 対流モデルから得られる 3 つの連立方程式は、決して落ち着かず、決して繰り返しません。線形部分 $A_{ij}x_j$ と 3 階テンソルによる 2 次部分 $Q_{ijk}x_j x_k$ の和として書くと、互いに $10^{-6}$ 以内から出発した軌道の束全体を 1 つの einsum で進められます。軌道は最大リャプノフ指数 $\lambda \approx 0.9$ で決まる速さで指数関数的に離れ、やがて蝶全体に広がります。
notes: ローレンツ（1963）は、下から加熱される流体のモデルを 3 つの数に縮約しました。$x$ は対流ロールの強さ、$y$ と $z$ は温度分布を表します。$\sigma = 10$、$\rho = 28$、$\beta = 8/3$ のとき、運動は 2 つの固定点 $C_\pm = (\pm\sqrt{\beta(\rho-1)}, \pm\sqrt{\beta(\rho-1)}, \rho-1)$ の一方の周りを回り、予測できないタイミングでもう一方の翼へ跳び移ります。近い軌道は $e^{\lambda t}$（$\lambda \approx 0.906$）のように離れていきます。$10^{-6}$ の誤差は約 $15$ 時間単位でアトラクターの大きさに達するため、予報には限界があります（バタフライ効果）。同時に、状態の体積はすべて $e^{-(\sigma+1+\beta)t}$ のように縮むので、軌道は薄いフラクタル集合、すなわちストレンジ・アトラクターに集まります。テンソル形式は構造を明確にします：$A$ はすべての線形結合を持ち、非線形性は $Q$ の 2 つの成分だけです。計算の前に、$(1, 1, 1)$ から出発した 1 本の軌道を $10$ 時間単位積分し、球がアトラクター上から出発するようにします。ここでは固定ステップ $0.005$ の RK4 で十分な精度があります。$\rho < 1$ を試してください：原点が安定になり、すべての軌道がそこへ減衰します。$1 < \rho < 24.74$ では $C_+$ または $C_-$ にらせんを描いて落ち込み、$\rho = 28$ 付近以上でカオスが戻ります。
meanings:
- 軌道 $b$ の状態 $(x, y, z)$
- 線形部分：行 $(-\sigma, \sigma, 0)$、$(\rho, -1, 0)$、$(0, 0, -\beta)$
- 2 次部分。非ゼロ成分が 2 つの 3 階テンソル：$\dot y$ の $-xz$ と $\dot z$ の $+xy$
- $j$ の繰り返し ⇒ 和
- $j$ と $k$ の繰り返し ⇒ 和：カオスを生む非線形性
- ヤコビ行列のトレース：状態の体積は一定の割合 $\sigma + 1 + \beta$ で縮む
- 軌道の平均からの二乗平均平方根距離
- 広がりが $10\,s(0)$ から $1$ に増える間の $\ln s$ 対 $t$ の傾き
labels:
  sigma: プラントル数 $\sigma$
  rho: レイリー数 $\rho$
  beta: 幾何学因子 $\beta$
  t_max: シミュレーション時間
  log10_radius: 初期球の半径 $\log_{10} r$
  n_traj: 軌道の数
