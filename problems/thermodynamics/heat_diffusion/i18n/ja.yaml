source_hash: 2b849cfef0cb
title: 平板上の熱拡散
summary: フーリエの法則は温度勾配を熱流束に変え、エネルギー保存則はその流束の発散を温度変化に変える。格子上ではどちらの微分も小さな畳み込みカーネルなので、1回の時間ステップは平板全体にわたる2回の conv2d 呼び出しにすぎない。
notes: 前進差分と後退差分を組み合わせるとおなじみの5点ラプラシアンになるので、$\partial_i\partial_i T$ を別にコーディングすることはない：勾配と発散のカーネルを合成すれば自然に出てくる。陽解法は $\alpha\,dt/dx^2 \le 1/4$（下記の「安定数」）のときにのみ安定である。ディリクレ境界では縁が 20 °C の熱浴となり熱が逃げていく。ノイマン（断熱）境界では境界を通る流束はなく、温度が均一化する間も全熱量は保存される。正弦モード $\sin(\pi x/L)\sin(\pi y/L)$ は $\exp(-2\pi^2\alpha t/L^2)$ のように減衰する。
meanings:
- 各格子セルの温度（conv2d のためのバッチ次元とチャネル次元つき）
- 前進差分ステンシル、方向 $i \in \{x, y\}$ ごとに1出力チャネル
- フーリエの法則：熱流束、チャネル $i$ が成分
- 繰り返される $i$ ⇒ 和をとる：conv2d が2つの入力チャネルを足し合わせる——発散
- 温度伝導率（m²/s）
- 右辺；前進オイラー法：$T \leftarrow T + dt\,\partial_t T$
labels:
  alpha: 温度伝導率 $\alpha$
  t_max: シミュレーション時間
  n_spots: 高温スポット数
  n_grid: 一辺あたりの格子セル数
  r: 安定数 $\alpha\,dt/dx^2$
  boundary: 境界
