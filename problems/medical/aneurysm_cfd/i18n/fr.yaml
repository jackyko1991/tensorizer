source_hash: 96c00309dd36
title: 'CFD d''anévrisme : la chaîne OpenFOAM + VMTK, reconstruite avec des tenseurs'
summary: Écoulement sanguin pulsé dans un vrai anévrisme intracrânien, segmenté à partir d'une angio-IRM TOF ouverte (CC0), selon la chaîne de recherche standard (lignes centrales et extensions d'écoulement VMTK, solveur incompressible de type OpenFOAM, puis contrainte de cisaillement pariétal, TAWSS et OSI), chaque étape étant écrite en opérations tensorielles. Le solveur est vérifié par les écoulements de Poiseuille et de Womersley et par des calculs OpenFOAM sur un tube et sur le même maillage d'anévrisme, les lignes centrales par VMTK. À but pédagogique uniquement, pas pour un usage clinique.
notes: 'Chaîne de travail. Une étude d''anévrisme typique segmente la lumière, la nettoie avec VMTK (Antiga et al. 2008), résout l''écoulement avec OpenFOAM (Weller et al. 1998) puis post-traite la contrainte pariétale. Ici chaque étape est la nôtre, écrite avec des tenseurs ; aucun code n''est copié de ces deux projets GPL. Étapes VMTK et leurs remplaçants : vmtksurfacesmoothing, vmtksurfaceremeshing et vmtkflowextensions (-adaptivelength 1 -extensionratio 5) ont été exécutés une fois hors ligne pour produire les fichiers STL ; vmtkcenterlines -seedselector profileidlist (diagramme de Voronoï, fast marching sur $|\nabla T| = 1/R$, remontée par plus grande pente) devient solve.centrelines : le rayon inscrit $R$ est la distance à la paroi de chaque voxel, l''équation eikonale est résolue par balayages min-plus répétés sur un graphe à 26 voisins (substitut tensoriel du fast marching, de vitesse $R^2$ car le graphe est toute la lumière et non le diagramme de Voronoï déjà médian), et toutes
  les sorties remontent les prédécesseurs en même temps. icoFoam/pimpleFoam d''OpenFOAM et notre code : lduAddressing owner/neighbour → mesh[''owner''], mesh[''neigh''] ; phi → u ; fvc::div(phi) → divergence ; fvm::laplacian(p) et sa résolution PCG → pressure_matrix et pcg ; la correction de pression PISO → project (une projection de Chorin par pas) ; fvm::laplacian(nu, U) → face_laplacian ; div(phi,U) → advect semi-lagrangien ; l''objet de fonction wallShearStress → wss_at. Maillage : voxels cubiques du STL, avec une valeur fantôme de frontière immergée à la paroi. Géométrie : par défaut un anévrisme de la Lausanne TOF-MRA Aneurysm Cohort (Di Noto et al. 2022 ; OpenNeuro ds003949, CC0), sujet 074 : un recadrage de 28 mm autour de l''anévrisme annoté, seuillé, maillé par marching cubes, lissé et prolongé (data/SOURCES.md) ; une entrée et trois sorties. Le choix « synthetic » est notre propre anévrisme de bifurcation (CC0). Autres jeux de données examinés : AneuriskWeb (CC BY-NC) et AneuX
  (CC BY-NC 4.0) sont non commerciaux ; IntrA et AnXplore n''indiquent aucune licence ; le Vascular Model Repository a sa propre licence de recherche ; les STL de fantômes de Kiel (CC BY 4.0) sont des coques de paroi aux branches très fines. Entrée : une forme d''onde analytique de type ACI (moyenne 4,58 ml/s, pic/moyenne 1,66, Ford et al. 2005, période 1 s) mise à l''échelle par la loi de Murray au rayon d''entrée, profil de Womersley ; sorties à pression nulle. Sang : newtonien, $\nu = 3.5\times10^{-6}$ m²/s, $\rho = 1060$ kg/m³ ; parois rigides. Résidus (calcul par défaut) : tube contre OpenFOAM v1912 pimpleFoam, vitesse sur l''axe L2 1,2 %, phase −10 mrad, WSS L2 2,5 % ; tube contre la solution exacte de Womersley, L2 0,4 % ; lignes centrales contre VMTK 1.5.0, distance moyenne 0,20 mm (0,5 voxel), maximum 0,5 mm, écart de rayon 0,12 mm en moyenne ; anévrisme contre pimpleFoam sur notre propre maillage de voxels exporté en polyMesh (même entrée et mêmes sorties), |u| sur la coupe L2
  35 %, WSS au pic systolique L2 38 %, TAWSS L2 32 %. Ce dernier écart est grand : un calcul avec un pas de temps quatre fois plus petit donne le même, il vient donc du traitement de paroi différent (nos valeurs fantômes sur une surface lisse contre les faces en escalier d''OpenFOAM), de la position des sorties et des schémas d''advection sur un maillage grossier où aucun des deux codes n''est convergé. Lisez les résultats sur l''anévrisme comme qualitatifs. Les sorties à pression nulle envoient aussi trop de débit dans la plus petite branche et donnent une perte de charge irréaliste. Sorties : en plus du GIF, results/aneurysm.pvd est une série temporelle ParaView de la paroi (WSS, TAWSS, OSI), des lignes de courant et des traceurs. Mises en garde : simulation grossière et pédagogique d''une segmentation par seuil, pas pour un usage clinique. Une WSS faible et un OSI élevé dans le sac sont associés dans la littérature à la croissance et à la rupture des anévrismes, mais les résultats sont
  contradictoires et débattus (Meng et al. 2014). Les références OpenFOAM et VMTK ont été produites une fois, hors ligne, et ne sont jamais exécutées par le problème ni par ses tests.'
meanings:
- cellule propriétaire et voisine de chaque face de voxel, comme dans les listes owner/neighbour d'OpenFOAM
- vitesse normale à la face (le flux d'OpenFOAM $\phi_f = u_f h^2$)
- 'deux appels index_add sur les faces : fvc::div(phi)'
- $-\nabla^2$ assemblé à partir des faces (fvm::laplacian) ; parois et entrée en Neumann, sorties $p = 0$
- gradients conjugués, Jacobi plus une correction sur agrégats grossiers
- six voisins de même direction ; les valeurs fantômes imposent $u = 0$ exactement sur la paroi
- 'semi-lagrangien : remonter chaque face le long de l''écoulement et interpoler (grid_sample)'
- profil de Womersley par harmonique de $Q(t)$, Bessel $J_0, J_1$ d'argument complexe
- parabole passant par $u = 0$ à la paroi et des échantillons à $h$, $2h$ le long de la normale intérieure
- moyennes sur le cycle enregistré, tau de forme (T, V, 3)
- distance à la paroi = rayon de la plus grande sphère inscrite
- lignes de courant RK4 en lot dans la vitesse interpolée trilinéairement, ensemencées à l'entrée
- balayage min-plus (Bellman–Ford) de l'équation eikonale sur le graphe de voxels à 26 voisins
labels:
  geometry: 'Géométrie : réelle (angio-IRM TOF de Lausanne, CC0) ou synthétique'
  voxel: Taille de voxel $h$
  cycles: Cycles cardiaques simulés (le dernier est enregistré)
  dt_ms: Pas de temps $\Delta t$
  frames: Images d'animation par cycle
