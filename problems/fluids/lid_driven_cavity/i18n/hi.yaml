title: ढक्कन-चालित कोटर (नेवियर–स्टोक्स)
summary: 'अभिकलनात्मक तरल गतिकी (CFD) का क्लासिक बेंचमार्क: तरल का एक वर्गाकार डिब्बा जिसका ढक्कन दाईं ओर सरकता है। धारा फलन–भ्रमिलता (streamfunction–vorticity) रूप में 2D नेवियर–स्टोक्स समीकरणों को समय में आगे बढ़ाया जाता है, और $\psi$ के पॉयसन समीकरण को eigh से लाप्लासियन का विकर्णीकरण करके हल किया जाता है। एक प्राथमिक भँवर घूमने लगता है और उसके केंद्र-रेखा वेग की तुलना Ghia et al. (1982) से की जाती है।'
notes: 'मात्रक: कोटर आकार 1 और ढक्कन चाल 1, अतः $\mathrm{Re} = 1/\nu$। धारा फलन प्रवाह को रचना से ही अपसरण-मुक्त बनाता है, और नेवियर–स्टोक्स का कर्ल लेने से दाब लुप्त हो जाता है। हर चरण: थॉम सूत्र से दीवारों पर भ्रमिलता (no slip), $\omega$ के लिए अग्र ऑयलर चरण, फिर पॉयसन हल। $\nabla^2\psi = T\psi + \psi T^\mathsf T$, $T$ के आइगेन-आधार में विकर्ण बन जाता है — fast sine transform जैसा ही विचार। Re = 100 पर भँवर केंद्र (0.62, 0.74) के निकट, केंद्र से ऊपर और दाईं ओर है; कम Re पर यह (0.5, 0.76) की ओर, अधिक Re पर मध्य की ओर खिसकता है, और निचले कोनों में छोटे विपरीत-घूर्णी भँवर दिखते हैं। अधिक Re के लिए महीन ग्रिड चाहिए।'
meanings:
- ग्रिड पर भ्रमिलता और धारा फलन, [x, y] सूचकांक, दीवारें सम्मिलित
- केंद्रीय अंतरों से $(\partial_y\psi, -\partial_x\psi)$
- 'दोहराया गया $j$ ⇒ योग: भ्रमिलता का अभिवहन'
- पाँच-बिंदु स्टेंसिल
- $\psi = 0$ दीवारों वाला 1D लाप्लासियन, एक बार विकर्णीकृत
- रूपांतरण; फिर $\hat\psi_{ab} = \hat f_{ab}/(\Lambda_a + \Lambda_b)$ और वापस
- 'थॉम: $-2\psi_\text{next}/h^2$, ढक्कन के नीचे $2U/h$ घटाकर'
labels:
  re: रेनॉल्ड्स संख्या $UL/\nu$
  n: प्रति भुजा ग्रिड बिंदु
  t_max: अनुकरण समय
