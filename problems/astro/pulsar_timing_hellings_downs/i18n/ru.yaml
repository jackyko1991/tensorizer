title: Пульсарная временная решётка и кривая Хеллингса–Даунса
summary: Море наногерцовых гравитационных волн слегка растягивает пути между Землёй и множеством миллисекундных пульсаров. Изотропный фон, построенный из тысячи случайных плоских волн, сдвигает тики каждого пульсара через диаграмму направленности $F^A = \tfrac12 \hat p^i \hat p^j e^A_{ij}/(1 + \hat\Omega\cdot\hat p)$ — один einsum по тензорам поляризации. Корреляция всех пар остатков хронометрирования с группировкой по углу восстанавливает кривую Хеллингса–Даунса — квадрупольный отпечаток, свидетельства которого пульсарные временные решётки сообщили в 2023 году.
notes: 'Гравитационная волна меняет время распространения света между пульсаром и Землёй, поэтому времена прихода импульсов дрейфуют на десятки–сотни наносекунд за годы. Для одной волны эффект зависит от геометрии через $F^{+}$ и $F^{\times}$; для изотропного фона усреднение по направлениям оставляет корреляцию, зависящую только от угла между двумя пульсарами. Хеллингс и Даунс (Hellings and Downs, ApJL 265, L39, 1983) вычислили её: близкие на небе пульсары коррелируют с коэффициентом $\tfrac12$ (вторая половина мощности каждого пульсара — его собственный некоррелированный пульсарный член), пары на расстоянии около $82.5^\circ$ слегка антикоррелированы, а противоположные пульсары снова положительно коррелированы с коэффициентом $\tfrac14$. Квадрупольная форма — признак поперечной волны со спином 2: ошибка часов дала бы монополь ($\Gamma = 1$), а ошибка эфемерид Солнечной системы — диполь ($\Gamma = \cos\zeta$); для сравнения подгоняются обе. Страница проверяет нормировку двумя способами:
  формулу против интеграла по небу методом Монте-Карло $\tfrac{3}{8\pi}\oint \sum_A F^A_aF^A_b\,d\Omega$ и среднее диаграммы направленности $\langle\sum_A (F^A)^2\rangle = 1/3$. Одно небо заметно разбросано вокруг кривой: при небольшом числе доминирующих частот эта «космическая дисперсия» реальна и затрагивает и реальные решётки; усреднение по многим смоделированным небам показывает сходимость. Подогнанная амплитуда уменьшается ниже 1 из-за белого шума. Научный контекст: в июне 2023 года коллаборация NANOGrav (15-летний набор данных, Agazie et al., ApJL 951, L8, 2023) сообщила о свидетельствах наногерцового гравитационно-волнового фона с корреляциями Хеллингса–Даунса (примерно 3σ для корреляций, приблизительно), наряду с европейской и индийской PTA (EPTA + InPTA, A&A 2023), Parkes PTA (Reardon et al., ApJL 951, L6, 2023) и китайской PTA. Вероятный источник — популяция двойных сверхмассивных чёрных дыр, что даёт используемый здесь спектр $h_c \propto f^{-2/3}$. Упрощения: остатки не подгоняются
  на замедление вращения каждого пульсара (вычитается только среднее), только белый шум, без индивидуального красного шума пульсаров, и простая нормированная взаимная корреляция вместо оптимальной статистики или полного байесовского анализа.'
meanings:
- единичный вектор на пульсар $a$, равномерно распределённый по небу
- направление распространения и угол поляризации волны $m$
- тензоры $+$ и $\times$, построенные из поперечного базиса $m, n \perp \hat\Omega$
- 'суммирование по $i$ и $j$: растяжение линии Земля–пульсар'
- диаграмма направленности; среднее по небу от $\sum_A (F^A)^2$ равно ровно $1/3$
- фазовая задержка пульсарного члена, $\omega L_a(1 + \hat\Omega\cdot\hat p_a)/c$
- 'суммирование по $m$ и $A$: остаток хронометрирования пульсара $a$ в эпоху $t$'
- 'суммирование по $t$: корреляция каждой пары, нормированная на среднюю автомощность'
- ожидаемая корреляция, $\Gamma(0^+) = \tfrac12$, минимум $\approx -0.152$ при $\zeta \approx 82.5^\circ$
