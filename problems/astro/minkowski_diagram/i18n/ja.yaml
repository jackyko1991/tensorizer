source_hash: 8adb8e4369f3
title: 特殊相対論：ミンコフスキー図とローレンツブースト
summary: 事象は2元ベクトル $x^\mu = (t, x)$ であり、慣性系の変換は1つの行列 $\Lambda^\mu{}_\nu$ を einsum ですべての事象に作用させることで表される。双子の一方が星まで往復する。地上系とブーストした系での図には、傾いた同時刻線、不変な光円錐、そして旅行者の時計が刻む $\int\sqrt{1 - v^2}\,dt$ が示される——これは地球に残った双子より短い。
notes: 単位：年と光年なので $c = 1$ で、光線は破線の 45° 線である。旅行者は速さ $v$ で距離 $L$ の星まで飛び、瞬時に折り返して戻る。琥珀色の線は旅行者が「今」と呼ぶ事象の集合である。往路では $v$ だけ傾いており、折り返し点で地球の双子の世界線を横切って振れる。地球の双子の「失われた」年月はここに行く。パラドックスが対称でないのは、慣性系を乗り換えるのが旅行者だけだからである。右パネルのブーストを $v$ にすれば旅行者の往路の系に、$-v$ にすれば復路の系に乗ることになる。光円錐はどの系でも形を保つ。
meanings:
- 事象 $(t, x)$、$\mu \in \{0, 1\}$、$c = 1$
- ミンコフスキー計量 $\operatorname{diag}(-1, +1)$
- $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$
- 繰り返される $\nu$ ⇒ 和をとる：世界線や格子のすべての事象を一度にブースト
- 世界間隔の2乗、どの系でも同じ
- 世界線に沿った $\sqrt{-\Delta s^2}$ の累積和
- $\Lambda\big((\beta_1 + \beta_2)/(1 + \beta_1\beta_2)\big)$ に等しい
labels:
  v: 旅行者の速さ $v/c$
  distance: 星までの距離 $L$
  beta_view: 右パネルのブースト $\beta$
