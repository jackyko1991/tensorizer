source_hash: efa79cfa67ef
title: 'MNIST पर ऑपरेटर खोज: एक टेन्सर DAG अपना वर्गीकरण समीकरण स्वयं लिखता है'
summary: जब प्रशिक्षण के लिए केवल मुट्ठी भर छवियाँ हों, तो क्या DAG के रूप में जोड़े गए कुछ पठनीय टेन्सर ऑपरेटर किसी CNN से मुकाबला कर सकते हैं? एक छोटे DAG का हर किनारा 23 उम्मीदवार ऑपरेटरों (Sobel, लाप्लासियन, Gabor, एक सीखा गया 3×3 फ़िल्टर, ReLU, $x^2$, पूलिंग, पंक्ति योग, FFT परिमाण, वर्ग टेम्पलेट, PCA, मोमेंट, रैखिक और प्रोटोटाइप रीड-आउट) का softmax-भारित मिश्रण रखता है; प्रति अंक 1 से 100 छवियों पर DARTS खोज हर किनारे के लिए एक ऑपरेटर चुनती है, और DAG को एक LaTeX समीकरण के रूप में छापा जाता है जो उसकी भविष्यवाणियों को ठीक-ठीक दोहराता है। फिर LeNet-शैली के CNN और दो बंद-रूप आधार-रेखाओं के मुकाबले डेटा और गणना की तुलना, हर सीड दिखाते हुए।
notes: 'प्रश्न। यह खिलौना समस्या Jacky Ka Long Ko की है: व्हाइट-बॉक्स समीकरण लेखन के साथ छोटे-बैच AI प्रशिक्षण का एक प्रयास। MNIST पर CNN बनाम एक टेन्सर विधि; उम्मीदवार टेन्सर ऑपरेटरों की सूची बनाना; DAG को एन्कोड करने वाले टेन्सर को सर्वश्रेष्ठ ऑपरेटर और उनकी वायरिंग खोजने देना; छोटे बैचों पर प्रशिक्षित करना और समान सटीकता के लिए प्रत्येक को चाहिए डेटा और गणना की तुलना करना; और पाए गए DAG का वर्गीकरण समीकरण लिखना। विधि। छवियाँ 14×14 हैं (MNIST को 2×2 ब्लॉकों पर औसत किया गया, ताकि 30 रन लगभग एक मिनट के CPU समय में समा जाएँ)। सुपरनेट एक DARTS सेल है (Liu, Simonyan और Yang 2019), जिसमें तीन नोड $z_1, z_2, z_3$ हैं, जिन्हें हर पिछला नोड 6 किनारों के माध्यम से इनपुट देता है; प्रत्येक किनारा 12 सेल ऑपरेटरों (शून्य, सर्वसमिका, $x^2$, $|x|$, ReLU, tanh, सॉफ़्ट थ्रेशोल्ड $S_\lambda$, सीखा गया $3\times 3$ फ़िल्टर, Sobel-$x$, Sobel-$y$, लाप्लासियन, Gabor) का मिश्रण है; उसके बाद एक पूलिंग किनारा (औसत या अधिकतम $2\times 2$), एक रिडक्शन किनारा (vec, पंक्ति योग, स्तंभ योग, निम्न-आवृत्ति FFT परिमाण, वर्ग-टेम्पलेट
  सहसंबंध, PCA प्रक्षेपण, छवि मोमेंट) और एक हेड किनारा (रैखिक रीड-आउट या 10 प्रोटोटाइप)। आर्किटेक्चर टेन्सर $\alpha$ है (9 किनारे × 23 ऑपरेटर), टाइपिंग नियम के लिए एक मास्क के साथ। खोज: प्रथम-कोटि DARTS, जो प्रशिक्षण आधे के एक मिनी-बैच पर $\theta$ चरण और सत्यापन आधे पर $\alpha$ चरण को बारी-बारी से करता है, softmax तापमान को 1 से 0.001 तक एनील करते हुए; DAG हर किनारे का argmax ऑपरेटर रखता है (शून्य किनारे को हटा देता है), प्रशिक्षित $\theta$ को विरासत में लेता है और संक्षेप में फ़ाइन-ट्यून किया जाता है, सर्वश्रेष्ठ सत्यापन चरण रखा जाता है। DARTS से विचलन, बताए गए क्योंकि वे मायने रखते हैं: एनीलिंग (जैसे SNAS और GDAS में) और argmax नियम उस विविक्तीकरण अंतर को पाटते हैं जिसकी कीमत पहले परीक्षण में सटीकता के 25 अंक तक थी; छवि को सेल आउटपुट के चौथे चैनल के रूप में रखा जाता है; हेड अपने फ़ीचर स्पेस में निकटतम वर्ग माध्य से शुरू होते हैं। CNN ($3\times 3$ के 8 और 16 चैनल, अधिकतम पूलिंग, एक रैखिक परत: 2698 भार) को उन्हीं छवियों पर उसी अर्ली स्टॉपिंग के साथ Adam से प्रशिक्षित किया जाता है। आधार-रेखाओं
  में कोई सीखा गया पैरामीटर नहीं है: पिक्सेल में निकटतम वर्ग माध्य, और PCA के बाद श्रिंक्ड LDA। परिणाम। परीक्षण जाँचते हैं कि हर ऑपरेटर एक छोटे इनपुट पर अपने सूत्र के बराबर है, कि one-hot मिश्रण एकल ऑपरेटर है और one-hot सुपरनेट विविक्त DAG, कि विविक्तीकरण argmax चुनता है, कि लिखा गया समीकरण, केवल अपने LaTeX से वापस पढ़े जाने पर, ठीक-ठीक DAG की भविष्यवाणियाँ देता है, और कि आधार-रेखाएँ अपने बंद रूप हैं। साथ दिया गया रन (CPU, एक थ्रेड, 3 सीड), प्रति अंक $n$ = 1, 5, 10, 50, 100 छवियों के लिए औसत परीक्षण सटीकता: CNN 0.35, 0.53, 0.64, 0.81, 0.85; खोजा गया DAG 0.38, 0.48, 0.52, 0.69, 0.82; PCA + LDA 0.41, 0.58, 0.66, 0.75, 0.76; निकटतम वर्ग माध्य 0.41, 0.56, 0.64, 0.68, 0.69। 70 % तक पहुँचने के लिए प्रति अंक छवियाँ: CNN 18, DAG 52, PCA + LDA 20; 80 % तक पहुँचने के लिए: CNN 45, DAG 91। प्रति रन प्रशिक्षण समय: CNN 0.4 से 1 s, खोज और फ़ाइन-ट्यून 2 से 4 s। तो, ईमानदारी से: प्रति अंक लगभग 10 छवियों से आगे, समान सटीकता के लिए CNN को कम डेटा और कम गणना चाहिए; उससे नीचे बंद-रूप आधार-रेखाएँ सर्वश्रेष्ठ
  हैं और कोई भी सीखने वाला उन्हें नहीं हराता; संरचित मॉडल बहुत छोटे $n$ पर नहीं जीता ($n$ = 1 पर यह वर्ग माध्यों के बराबर है)। क्यों: खोज एक ऐसे सत्यापन विभाजन पर चलती है जो स्वयं बहुत छोटा है, इसलिए उसका चुनाव शोरयुक्त है, और उसका सत्यापन लॉस अक्सर पंक्ति योगों को पसंद करता है (28 फ़ीचर, 290 सीखी गई संख्याएँ, एक शांत लॉस), जो सभी पिक्सेलों (लगभग 2000 सीखी गई संख्याएँ) से बदतर वर्गीकरण करते हैं; 15 में से 7 DAG ने पंक्ति योग चुने। जैसा DARTS के लिए बताया गया है, खोज पैरामीटर-रहित ऑपरेटरों को तरजीह देती है: Sobel फ़िल्टर अधिकांश किनारों को भरते हैं और सीखा गया फ़िल्टर 15 में से 3 DAG में दिखता है। साथ दिए गए रन के बाहर, छोटी खोजों (20 या 40 चरण) ने सभी पिक्सेल चुने और $n$ = 50 पर 0.74 से 0.79 तक पहुँचीं, जो संकेत है कि लंबी खोज ज़रूरत से ज़्यादा प्रतिबद्ध हो जाती है; यह परीक्षण सेट पर देखा गया, इसलिए यह एक अवलोकन है, ट्यून की गई सेटिंग नहीं। GPU (एक GTX 1080 Ti) ने कोई गति-वृद्धि नहीं दी: समय अंकगणित नहीं, बल्कि हज़ारों छोटे कर्नेल तय करते हैं। results/stages.csv में हर संख्या है, results/equation.tex
  में पाया गया हर समीकरण। संबंधित कार्य। न्यूरल आर्किटेक्चर खोज (Zoph और Le 2017) और उसका अवकलनीय रूप DARTS; प्रतीकात्मक प्रतिगमन, जो नेटवर्क के बजाय सूत्र खोजता है (AI Feynman, Udrescu और Tegmark 2020; PySR, Cranmer 2023; आनुवंशिक प्रोग्रामिंग, Koza 1992); CNN के लिए LeNet (LeCun et al. 1998)। डेटा: MNIST (LeCun, Cortes और Burges), लाइसेंस CC BY-SA 3.0; data/mnist_subset.npz में 1000 प्रशिक्षण-पूल और 2000 परीक्षण छवियाँ हैं (शेयर-अलाइक लाइसेंस इस उपसमुच्चय पर लागू होता है), देखें data/SOURCES.md। आज़माएँ। प्रति अंक 1 या 100 छवियों से पाया गया DAG देखने के लिए show_n बदलें, खोज चरण बढ़ाएँ, या त्वरित रन के लिए एक सीड रखें।'
meanings:
- 'टाइपिंग नियम: ऑपरेटर $o$ किनारे $e$ पर तभी बैठ सकता है जब वह उस किनारे के इनपुट आकार को उसके आउटपुट आकार में मैप करे (सेल: मैप → मैप, पूल, रिडक्शन: मैप → वेक्टर, हेड: वेक्टर → लॉजिट)'
- आर्किटेक्चर टेन्सर $\alpha$ (किनारे × ऑपरेटर) का मास्क्ड softmax; तापमान $T$ 1 से 0.001 तक गिरता है ताकि मिश्रण अंत में one-hot हो जाए
- 'कोई नोड जिन ऑपरेटरों को इनपुट देता है, वे सभी उसके सभी बाहर जाने वाले किनारों के लिए एक बार गणना किए जाते हैं: एक कन्वोल्यूशन Sobel-$x$, Sobel-$y$, लाप्लासियन, Gabor और सीखे गए $3\times 3$ फ़िल्टर $K_e$ देता है'
- 'दोहराया गया $o$ ⇒ योग: हर नोड अपने मिश्रित आने वाले किनारों का योग है; सेल आउटपुट स्टैक $(x, z_1, z_2, z_3)$ है'
- रिडक्शन $r$ के फ़ीचर (vec, पंक्ति/स्तंभ योग, $|\mathcal F|$, टेम्पलेट $\langle z, \mu_k\rangle$, PCA $U^\top \mathrm{vec}$, मोमेंट), प्रशिक्षण छवियों से मानकीकृत
- सभी रिडक्शन × हेड लॉजिट स्तर पर मिश्रित (उनकी फ़ीचर लंबाइयाँ अलग हैं); रैखिक $W\hat f + b$ या प्रोटोटाइप $-e^\tau\lVert \hat f - p_k\rVert^2/D$, दोनों निकटतम वर्ग माध्य से शुरू
- 'प्रथम-कोटि DARTS: प्रशिक्षण मिनी-बैच पर $\theta$ चरण, फिर सत्यापन मिनी-बैच पर $\alpha$ चरण'
- 'LaTeX में लिखा गया विविक्त DAG, एक छोटे पार्सर द्वारा वापस पढ़ा और मूल्यांकित: ठीक-ठीक DAG जैसी ही भविष्यवाणियाँ'
labels:
  search_steps: DARTS खोज चरण (प्रत्येक में एक $\theta$ और एक $\alpha$ अद्यतन)
  retrain_steps: विविक्त DAG के फ़ाइन-ट्यून चरण
  cnn_steps: CNN प्रशिक्षण चरण
  seeds: प्रति प्रशिक्षण-सेट आकार सीड
  batch: मिनी-बैच आकार (अंकों में संतुलित)
  show_n: दिखाए गए DAG की प्रति अंक प्रशिक्षण छवियाँ
