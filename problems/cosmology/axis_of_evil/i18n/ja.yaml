source_hash: 9e147d6c0987
title: マイクロ波の空の「悪の枢軸」
summary: 宇宙マイクロ波背景放射の実際の WMAP 全天図で最も大きな二つのパターン、四重極（$\ell = 2$）と八重極（$\ell = 3$）が同じ向きを指しているように見えます。係数 $a_{\ell m}$ は一度の最小二乗フィットで求め、各多重極の軸は $3\times 3$ の角運動量分散 $M_{ij} = \mathrm{Re}\,a^*L_iL_ja$ の最大固有ベクトルです。さらに $10^5$ 個の等方的なランダムな空をまとめて生成し、二つの軸のなす角を $p$ 値に変えます。実在するが議論の続く異常で、偶然か、前景の残りか、新しい物理かは決着していません。
notes: 統計的に等方な宇宙（インフレーションの標準的な予言）では、異なる多重極の向きは互いに独立なので、四重極と八重極の軸のなす角はランダムなはずです：$|\cos|$ は $[0, 1]$ 上で一様。Tegmark、de Oliveira-Costa、Hamilton（2003）と de Oliveira-Costa ら（2004）は初期の WMAP 全天図で両者がともに $(l, b) \approx (-110^\circ, 60^\circ)$ を指すことを見つけ、Land と Magueijo（2005）がこれを「悪の枢軸」と名づけました。Copi、Huterer、Schwarz、Starkman は多重極ベクトルで調べ、黄道との関連も見いだしています。同梱の WMAP 9 年 ILC マップでは軸は $(l, b) \approx (240^\circ, 60^\circ)$ と $(238^\circ, 63^\circ)$ にあり、わずか $3^\circ$ しか離れておらず、これより揃う等方的な空は 1000 個に 2 個未満です（$p \approx 0.0015$。この統計量では厳密に $p = 1 - |\cos|$ で、モンテカルロでも確認できます）。右のパネルはシミュレーションの検証で、$x$ 以上に揃ったランダムな空の割合は直線 $P = x$ に乗ります。現状：この整列はデータに実在します（Planck 2013、2015、2018 の等方性論文はすべてのマップでこれを確認）が、その有意性は議論が続いています。統計量はパターンに気づいた後で選ばれたもの（事後的な選択、ルック・エルスウェア効果：多くの可能な異常の中にはまれに見えるものが必ずある）で、四重極パワーの低さ、ILC に残る銀河前景、運動学的ドップラー四重極（ここでは除去していない）、マップの選び方によって $p$ は数倍変わります。受け入れられた物理的説明はなく、非自明なトポロジー、非等方膨張、局所的な前景などが提案されていますが、多くの宇宙論研究者は統計的なゆらぎとみなしています。このページは一つの統計量に対する $p$ を示すだけで、検出を主張するものではありません。データ：WMAP 9 年 ILC マップ（Bennett et al. 2013, ApJS 208,
  20）、NASA の LAMBDA アーカイブの wmap_ilc_9yr_v5.fits（lambda.gsfc.nasa.gov、NASA のデータでパブリックドメイン）を、ここでは HEALPix $N_\mathrm{side} = 512$ から 16 に粗くしたもの（列 glon_deg、glat_deg、T_uK）。同じ lon/lat/T の CSV 形式なら、どのマップ（たとえば Planck のマップ）でも置き換えられます。フィットはマスクなしの全天で $\ell_\mathrm{fit}$ までのすべての多重極を使い、等方的な空は分散 1 のガウス実係数で作ります（パワー $C_\ell$ は軸には効きません）。
meanings:
- ピクセルの方向、温度、立体角。任意の lon/lat/T CSV から読める
- 各ピクセルでの実球面調和関数。$a$ はすべての $(\ell, m)$ を走る
- 重み付き最小二乗：全多重極を一度に解き、互いのエイリアシングがない
- 複素係数、$a_{\ell,-m} = (-1)^m a^*_{\ell m}$ を満たす
- スピン $\ell$ 行列、$[L_x, L_y] = iL_z$、$L_iL_i = \ell(\ell+1)$
- $m, n, k$ について和：$z \parallel \hat n$ の座標系で $\hat n_iM_{ij}\hat n_j = \sum_m m^2|a_{\ell m}|^2$
- バッチ eigh：多重極が最も平面的になる軸
- $i$ について和：空 $s$ での二つの軸の揃い具合（軸に向きはない）
- 等方的なガウスの空に対するモンテカルロ $p$ 値
labels:
  n_skies: 等方的なランダムな空の数 $K$
  lmax_fit: 同時にフィットする多重極 $\ell_\mathrm{fit}$
  seed: 乱数シード
