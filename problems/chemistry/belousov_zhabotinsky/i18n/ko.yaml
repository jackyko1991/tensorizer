title: 벨로우소프–자보틴스키 진동자 (오레고네이터)
summary: 브로민산염, 말론산, 세륨 촉매를 넣고 저은 비커가 시계처럼 색을 바꾼다. 스케일링한 2변수 오레고네이터는 강성(stiff) 상미분방정식이다. 양수성을 보존하는 생성–소멸(Patankar) 단계로 여러 화학량론 인자 $f$를 한꺼번에 적분하고, 야코비 행렬의 대각합으로 진동 구간의 경계인 두 호프 분기를 찾으며, 같은 반응 속도론에 확산을 더하면 끊어진 파동이 회전하는 나선으로 바뀐다.
notes: 벨로우소프–자보틴스키 반응(1950년대 Belousov가 발견, 1972년 Field, Kőrös, Noyes가 설명)은 브로민산염으로 말론산을 산화한다. 브로민화 이온은 $\mathrm{HBrO_2}$의 자가촉매 생성을 억제한다. 브로민화 이온이 있는 동안 반응은 느리게 진행되지만, 그것이 다 소모되면 $\mathrm{HBrO_2}$가 폭발적으로 늘어 촉매를 산화하고(색 변화), 산화된 촉매가 새 브로민화 이온을 만들어 폭발을 멈춘다. 오레고네이터는 이를 몇 단계로 압축하고, 스케일링과 빠른 브로민화 이온의 소거를 거쳐 두 개의 방정식으로 만든다. 상수 $\varepsilon \approx 0.04$와 $q \approx 8\times10^{-4}$는 Field–Kőrös–Noyes 속도 상수 맞춤에서 얻은 근삿값이며, 조성에 따라 다르고 문헌값도 다르다. $\varepsilon$와 $q$가 작으므로 $x$ 방정식은 강성이다. $x$는 $\varepsilon$ 정도의 시간에 약 천 배 뛰어오른 뒤 널클라인의 한 가지를 따라 천천히 기어간다. 일반 RK4는 안정하려면 약 $5\times10^{-4}$의 시간 간격이 필요하다. $\varepsilon\dot x$를 생성 빼기 소멸로 쓰고 소멸을 음적으로 처리하면 어떤 간격에서도 $x$가 양수로 유지되며, $\Delta t = 2\times10^{-3}$로 주기를 1 %보다 정확하게 얻는다. 정상 상태(두 널클라인의 교점)는 N자 모양 $\dot x = 0$ 곡선의 바깥 가지에 있을 때 안정하고 가운데 가지에 있을 때 불안정하며, 이때 리밋 사이클이 그것을 둘러싼다. $J$의 대각합은 두 호프 점에서 부호가 바뀌며, 작은 $q$에서는 $f = 0.5$와 $f = 2.4$ 근처이다. 더 큰 $\varepsilon$를 시도해 보자. 진동 구간이 줄어들다가 결국 닫힌다. 젓지 않은 얇은 층에서는 촉매가 제자리에 있고 $\mathrm{HBrO_2}$가 확산하므로 산화의 파동이 접시를 가로질러 퍼진다. 끊어진 파면은
  자유로운 끝에서 말려 유명한 회전 나선이 되며, 그 회전 주기가 전체 진동보다 짧아서 결국 매질 전체를 지배한다.
meanings:
- 반응 $b$의 화학량론 인자(환원된 촉매당 생성되는 브로민화 이온), $0.3$에서 $3$까지
- 모든 반응의 스케일링된 $[\mathrm{HBrO_2}]$(자가촉매)와 $[\mathrm{Ce^{4+}}]$(산화된 촉매)
- $\varepsilon\dot x = P - Lx$가 되는 음이 아닌 생성 및 소멸 속도
- 'Patankar–오일러: 소멸은 음적, 생성은 양적이므로 아무리 강성이어도 $x$가 양수로 유지'
- $x^2 + (f + q - 1)x - q(1 + f) = 0$의 양의 근
- 정상 상태에서 선형화한 반응 속도론 $\partial \dot y_\alpha / \partial y_\beta$
- '반복된 $\alpha$ ⇒ 합산: 대각합; 그 부호 변화가 호프 분기를 나타냄'
- 위상 초상의 N자 모양 $\dot x = 0$ 곡선
- 무유속 경계의 5점 스텐실; 2D 매질에서는 $x$만 확산
labels:
  f: 위상 초상과 나선의 화학량론 인자 $f$
  eps: 시간 척도 비 $\varepsilon$ (근삿값)
  t_max: 시뮬레이션 시간
  spiral: 2D 나선파
  grid: 격자 크기 $n$
