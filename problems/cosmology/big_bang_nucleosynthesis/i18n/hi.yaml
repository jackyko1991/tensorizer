source_hash: fcafdb67dc0d
title: बिग बैंग न्यूक्लियोसिंथेसिस
summary: 'पहले तीन मिनट एक कठोर (stiff) अभिक्रिया जाल के रूप में: न्यूट्रॉन और प्रोटॉन दुर्बल साम्य से बाहर जम जाते हैं, ड्यूटेरियम की अड़चन लगभग $T \approx 80$ keV पर खुलती है और लगभग हर न्यूट्रॉन $^4$He में पहुँच जाता है। बारह अभिक्रियाएँ n, p, d, t, $^3$He, $^4$He, $^7$Li और $^7$Be को जोड़ती हैं; बैरियॉन-फ़ोटॉन अनुपात $\eta$ के पूरे बैच को एक साथ अंतर्निहित (implicit) BDF2 विधि से समाकलित किया जाता है, जिससे श्राम आलेख मिलता है। Planck मान $\eta \approx 6.1\times10^{-10}$ पर हीलियम और ड्यूटेरियम प्रेक्षणों से मेल खाते हैं, जबकि लिथियम लगभग 3× अधिक आता है: ब्रह्मांडीय लिथियम समस्या, जो अब तक अनसुलझी है।'
notes: 'स्थिति: मानक बिग बैंग न्यूक्लियोसिंथेसिस स्थापित भौतिकी है। $^4$He और D के लिए इसकी भविष्यवाणियाँ ब्रह्मांडीय सूक्ष्मतरंग पृष्ठभूमि से स्वतंत्र रूप से मापे गए बैरियॉन घनत्व पर प्रेक्षणों से मेल खाती हैं, जो गर्म बिग बैंग मॉडल के स्तंभों में से एक है (Alpher, Bethe और Gamow 1948; Wagoner, Fowler और Hoyle 1967)। ब्रह्मांडीय लिथियम समस्या खुली है: अनुमानित $^7$Li/H पुराने हेलो तारों के Spite पठार ($(1.6\pm0.3)\times10^{-10}$) का लगभग 3 गुना है, और न नाभिकीय भौतिकी, न तारकीय क्षय, न नए कण अब तक इसे समझा पाए हैं। प्रेक्षित मान (उद्धृत स्थिरांक): $Y_p = 0.245\pm0.003$ (PDG की BBN समीक्षा), D/H $= (2.527\pm0.030)\times10^{-5}$ (Cooke, Pettini और Steidel 2018)। मॉडल: Smith, Kawano और Malaney (1993) की 12 अभिक्रियाएँ, ताप-नाभिकीय दरें JINA REACLIB डेटाबेस से (Cyburt et al. 2010; सेट an06, de04, gi17, go17, cd08, db18) और विपरीत दरें विस्तृत संतुलन से। बताए गए सन्निकटन: Born सन्निकटन में दुर्बल दरें (विकिरण, परिमित द्रव्यमान और परिमित ताप सुधार के बिना), न्यूट्रिनो का तात्कालिक वियोजन (3.044
  के स्थान पर $N_\mathrm{eff} = N_\nu$), $^7$Be को $^7$Li और t को $^3$He गिना गया (बाद के क्षय), और T9 फ़िट $T_9 = 10$ से ऊपर स्थिर रखे गए। इसलिए $Y_p$ PRIMAT या PArthENoPE जैसे परिशुद्ध कोड ($0.2470$) से लगभग 2% कम है; D/H कुछ प्रतिशत तक मेल खाता है। $N_\nu = 4$ आज़माइए: तेज़ प्रसार अधिक न्यूट्रॉन जमा देता है और $Y_p$ को लगभग 0.013 बढ़ा देता है; इसी तरह BBN न्यूट्रिनो की प्रजातियाँ गिनता है।'
meanings:
- अभिक्रिया $r$ कितने नाभिक $i$ खर्च करती और बनाती है (12 अभिक्रियाएँ, 8 प्रजातियाँ)
- शुद्ध परिवर्तन; हर $r$ के लिए $\sum_i A_i S_{ri} = 0$ (बैरियॉन संख्या)
- 'REACLIB फ़िट: दोहराया $k$ ($T_9$ के 7 आधार फलन) ⇒ योग, फिर एक अभिक्रिया के सेट जोड़े जाते हैं'
- हर $\eta_b$ के लिए अग्र ($\propto n_b \propto \eta$) और विपरीत (विस्तृत संतुलन) दरें
- $\prod_j Y_j^{R_{rj}}$, जैसे d + d के लिए $Y_d^2$
- दोहराया $r$ ⇒ अभिक्रियाओं पर योग
- न्यूटन विधि के लिए सटीक जैकोबियन
- पूरे $\eta$ बैच के लिए अंतर्निहित BDF2 चरण का एक न्यूटन अद्यतन
- Born सन्निकटन की दुर्बल दरें, न्यूट्रॉन आयु $\tau_n$ से सामान्यीकृत
labels:
  n_eta: बैच में $\eta$ मानों की संख्या
  eta10: चिह्नित $\eta \times 10^{10}$ (बायाँ पैनल)
  tau_n: न्यूट्रॉन आयु $\tau_n$
  n_nu: न्यूट्रिनो प्रजातियाँ $N_\nu$
  n_steps: $\ln T$ में BDF2 चरण
