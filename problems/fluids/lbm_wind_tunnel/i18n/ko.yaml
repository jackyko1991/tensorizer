source_hash: 7dfc00ae0203
title: '디지털 풍동: STL 비행기 주위의 3D 격자 볼츠만 방법'
summary: OpenLB 라이브러리 방식의 작은 3D 풍동입니다. 모형 비행기의 STL 파일을 삼각형 텐서로 읽고, 모든 격자점에서 한 번에 광선 투사로 복셀화하고, 받음각만큼 기울여 TRT 또는 MRT 충돌, 선택적 Smagorinsky LES, 물체에서의 바운스백을 갖춘 D3Q19 격자 볼츠만 흐름에 놓습니다. 항력과 양력은 운동량 교환으로 구하며, 유선(일괄 RK4)과 추적 입자가 흐름을 보여 줍니다. 구 사례로 OpenLB 자체의 사전 계산과 비교해 검증하고 잔차를 표시합니다.
notes: '격자 단위: 격자 간격과 시간 간격 1, 자유류 $U = 0.08$(마하 0.14), 점성 $\nu = UL/\mathrm{Re}$($L$은 격자점 단위의 물체 길이), $\tau = 3\nu + \tfrac12$. 비행기는 $80\times 36\times 26$ 격자에서 $L = 32$(동체 길이, 날개폭 28 격자점), 선택 사항인 NACA 0012 날개는 $72\times 24\times 24$(시위 20)입니다. 두 STL 파일은 이 문제를 위해 생성했습니다(data/SOURCES.md 참조): 뭉툭한 모형 비행기(회전체 동체, 후퇴익 NACA 0018 주날개, 수평·수직 꼬리날개)로 부품이 접합부에서 겹치므로, 복셀화는 단순한 광선 홀짝이 아니라 감김수(부호 있는 교차)를 셉니다. 또 하나는 주기 폭 전체에 걸친 날개로 무한 날개입니다($C_L$을 $2\pi\alpha$와 비교해 보세요). 계수는 평면 면적(위에서 본 물체)을 씁니다. 경계: 흐름에 수직한 방향은 주기(비행기의 격자), 복셀화된 물체에서 중간점 바운스백. solve.simulate는 움직이는 바닥과 미끄럼 천장도 제공합니다. 입구와 출구 대신 마지막 16 격자점이 fringe 영역이 되어 흐름이 $x = 0$으로 다시 들어오기 전에 자유류로 되돌리며, 속도는 300 스텝에 걸쳐 올립니다(초기 $C_D$의 혹은 공기를 가속하는 압력 구배). 애니메이션은 그 뒤부터 시작합니다. TRT는 ''마법'' $\Lambda = 3/16$, MRT는 d''Humières 외 (2002)의 D3Q19 완화율, Smagorinsky 상수는 $C_s = 0.17$입니다. 기본값 Re = 1000($\tau \approx 0.508$)에서는 이 거친 격자에서 순수 TRT가 발산하고 LES가 안정하게 유지합니다: LES를 꺼 보세요. 8°에서의 결과: 비행기 $C_D \approx 0.39$, $C_L \approx 0.12$; 날개 $C_L \approx 0.31$($2\pi\alpha = 0.88$
  대비). 양력이 작은 이유는 날개 두께가 1–3 셀뿐이고, Re가 층류이며, 위아래의 주기 영상이 복엽기 더미처럼 작용하기 때문입니다: 방법의 예시일 뿐 예측이 아닙니다. 검증(물체 sphere_openlb): Re = 20의 구($D = 10$, $80\times 40\times 40$, BGK, 평형 입구)를 같은 격자에서 오프라인으로 한 번 계산한 OpenLB 1.7(data/openlb_reference_*.csv)과 비교: $C_D$ 3.360 대 3.378(−0.5 %), 중앙 단면 $u_x$: 상대 L2 0.8 %, L∞ 1.1 %, 최대 $|\Delta u|/U$ 1.3 %. 남은 차이는 경계 기법(OpenLB는 보간형 속도·압력 경계를 쓰고 음파로 계속 울려 $C_D$가 ±5 % 흔들림)과 전체 대 중간점 바운스백의 차이에서 오며, 충돌 연산자(BGK)와 해상도는 같습니다. 둘 다 Schiller–Naumann 값 2.61보다 큰 것은 이 구가 자유롭지 않기 때문입니다: OpenLB로 $160\times 60\times 60$ 상자에서는 3.04, 같은 비율로 $D = 20$이면 3.21입니다. OpenLB는 미리 계산한 기준으로만 사용했으며, 그 (GPL) 코드는 여기서 전혀 쓰지 않습니다. 검증은 같은 실행에서 비행기 다음에 실시간으로 계산되며(매개변수 validate, 기본값 켜짐, 2000 스텝) 잔차 패널을 채웁니다.'
meanings:
- '분포 함수: 격자점 $(x, y, z)$에서 격자 속도 $i$로 움직이는 유체'
- D3Q19 속도(정지, 6 면, 12 모서리), 가중치와 반대 방향
- 'STL 삼각형: 삼각형 $t$, 꼭짓점 $v$, 좌표 $a$'
- $+x$ 방향 광선의 부호 있는 교차(감김수)가 양수이면 내부; 모든 광선 × 모든 삼각형, 그다음 searchsorted
- '반복된 $a$ ⇒ 합: 각 격자 방향을 따른 속도'
- '반복된 $i$ ⇒ 합: 운동량 밀도'
- 'MRT: 비평형 모멘트, 각각 고유한 완화율 $s_k$로 완화'
- 비평형 운동량 플럭스; 그 크기가 Smagorinsky 와점성 $\nu_t$를 정함
- '스트리밍: 각 분포 함수를 한 링크 이동'
- 분포 함수가 유체 점에서 물체 쪽으로 나가는 곳에서 1(바운스백은 마스크된 교환)
- '운동량 교환: 물체에 작용하는 힘, 경계 링크에 대해 합'
labels:
  body: 물체(data/의 STL; sphere_openlb = OpenLB 검증 사례)
  re: 레이놀즈 수 $UL/\nu$(물체 길이 $L$)
  collision: 충돌 연산자
  les: Smagorinsky LES
  pitch: 받음각(비행기와 날개)
  steps: 격자 시간 스텝 수
  validate: OpenLB 구 검증도 실행(잔차 패널)
