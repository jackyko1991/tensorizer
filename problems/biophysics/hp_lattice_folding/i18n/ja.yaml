source_hash: a25b37200a6c
title: HP 格子タンパク質フォールディング
summary: それでも折りたたまれる最も単純なタンパク質モデル：正方格子上の疎水性（H）と極性（P）残基の鎖で、鎖上で隣り合わない残基間の H–H コンタクトごとにエネルギーが 1 下がる。20 残基のベンチマーク配列の多数のレプリカを、温度を下げながら、プルムーブとクランクシャフトムーブを用いたメトロポリス・モンテカルロ法で同時に折りたたむ。コンタクトマップは形状 $(R, N, N)$ の一つのペア距離テンソルから得られる。
notes: タンパク質が折りたたまれるのは、主に疎水性側鎖がコンパクトなコアに隠れて水を避けるためである。HP モデル（Dill、1985）はそれだけを残す：H–H コンタクトは $-\varepsilon$ の価値があり、ほかは何も数えず、鎖は格子上の自己回避ウォークである。それでも最低エネルギーを見つけるのは NP 困難で、コンフォメーション数は $2.64^N$ のように増える。デフォルトの配列 HPHPPHHPHPPHPHHPPHPH は Unger と Moult（1993）の古典的な 20 残基ベンチマークで、基底状態は $E = -9$。ほかの配列の既知の最小値は $-9$、$-8$、$-14$ である。各ステップで、各レプリカは残基を一つ選び、プルムーブ（Lesh、Mitzenmacher、Whitesides、2003：残基が空いた角に跳び、鎖が再びつながるまで隣の残基を鎖に沿って引きずる。末端では最後の残基を回転させることになり、最も単純な場合は角の反転）かクランクシャフトムーブ（U 字型の 2 残基が裏返る）を試す。結合を切る提案や二つの残基を同じ格子点に置く提案は棄却され、それ以外はメトロポリス則が決める。高温では鎖が自由に探索し、ゆっくり冷やすと H のコアと表面の P 残基をもつコンパクトな構造に落ち着く。エネルギー $E$ は受理された各ムーブの $\Delta E$ で更新され、テストでは全再計算と照合される。プルムーブは厳密には対称な提案ではないので、この計算は厳密な熱平衡サンプラーではなく最適化手法である。36 残基の配列を試してみよう：より多くのステップかレプリカが必要で、基底状態に到達するレプリカの割合がエネルギー地形の険しさを示す。
meanings:
- レプリカ $r$ の残基 $i$ の格子座標 $k$；どのレプリカもまっすぐな棒から始まる
- H なら 1、P なら 0
- 繰り返される $k$ ⇒ 和：バッチ化されたグラム行列；二乗ノルムと合わせて $d_{rij} = \lVert \mathbf r_i - \mathbf r_j\rVert^2$ を与える
- 格子上で隣接するが鎖上では隣接しない残基
- 繰り返される $i$ と $j$ ⇒ 和：H–H コンタクト、各々 2 回数えるので $\tfrac12$ を掛ける
- 結合長は 1 で、二つの残基が同じ格子点にないこと。さもなければムーブは棄却
- アニーリングスケジュール：$T$ はステップごとに等比的に下がる
- メトロポリス則：下り坂は常に、上り坂は確率 $e^{-\Delta E/T}$ で受理
labels:
  sequence: 配列
  replicas: レプリカ数 $R$
  steps: モンテカルロステップ数
  T_start: 初期温度 $T_0$（単位 $\varepsilon/k_B$）
  T_end: 最終温度 $T_1$
