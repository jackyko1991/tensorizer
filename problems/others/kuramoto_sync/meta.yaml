params:
  n_oscillators: {default: 1200, min: 200, max: 5000, step: 100, type: int, label: 'Oscillators $N$'}
  width: {default: 0.5, min: 0.1, max: 2.0, step: 0.05, label: 'Frequency spread $\gamma$ (Lorentzian) or $\sigma$ (Gaussian)'}
  k_max: {default: 3.0, min: 0.5, max: 8.0, step: 0.1, label: 'Largest coupling $K$'}
  n_couplings: {default: 24, min: 4, max: 64, step: 1, type: int, label: 'Couplings in the batch'}
  t_relax: {default: 60.0, min: 10, max: 300, step: 10, label: 'Relaxation time per coupling'}
  ramp_time: {default: 200.0, min: 50, max: 1000, step: 10, label: 'Duration of the slow ramp of $K$'}
  distribution: {default: lorentzian, type: choice, options: [lorentzian, gaussian], label: Frequency density shown in the ramp}
  seed: {default: 0, min: 0, max: 1000, step: 1, type: int, label: Random seed}
