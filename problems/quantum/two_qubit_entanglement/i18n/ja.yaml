source_hash: e0abd4c769f3
title: 2量子ビットのエンタングルメント
summary: 2つの量子ビットを $(2, 2)$ テンソル $\psi_{ab}$ として保持する。ゲートは1回の einsum で作用させる4階テンソルである：量子ビット1へのアダマールゲートに続く CNOT が $\lvert 00\rangle$ をベル状態に変える。$\psi_{ab}$ の特異値分解はシュミット分解であり、エンタングルメント・エントロピーを直接与える。その後、対はイジング・ハミルトニアンのもとで時間発展する。部分トレースにより各量子ビットの縮約密度行列が得られ、量子ビットがエンタングルしているときはそのブロッホベクトルが球の内側に縮む。
notes: 単位 $\hbar = 1$。1量子ビット演算子のテンソル積 $A\otimes B$ は4階テンソル $A_{ac}B_{bd}$ である（torch.kron は行添字 $2a + b$ の $4\times 4$ 行列として同じ数値を与える）。$\psi_{ab}$ は行列なので、その SVD は状態を $\sum_k s_k\lvert u_k\rangle\lvert v_k\rangle$ と書く：シュミット分解である。エンタングルメント・エントロピー $S = -\sum s_k^2\ln s_k^2$ は積状態で 0、ベル状態で $\ln 2$ であり、ベル状態の縮約状態は最大混合状態（$\rho = I/2$、ブロッホベクトルは中心）である。コンカレンス $C = 2\lvert\det\psi\rvert$ は 0（積状態）から 1（最大エンタングル）までをとる。イジング・ハミルトニアンのもとで、結合 $J$ はエンタングルメントを生成・消滅させ、横磁場 $h$ は個々の量子ビットを回転させる。$h = 0$ ではベル状態は固有状態であり、何も動かない。
meanings:
- 量子ビット1が $\lvert a\rangle$、量子ビット2が $\lvert b\rangle$ にある振幅
- 4階テンソルとしての2量子ビットゲート：出力添字 $a\,b$、入力添字 $c\,d$
- $c$ と $d$ について和：ゲートを作用させる
- シュミット係数；非零の値が1つ ⇔ 積状態
- 量子ビット2についての部分トレース（$b$ について和）
- テンソル積から組み立てたイジング・ハミルトニアン、eigh のために (4, 4) に変形
- 1つの量子ビットのブロッホベクトル $\operatorname{Tr}(\rho\,\sigma_k)$；$\lvert\mathbf r\rvert < 1$ は混合状態を意味する
labels:
  initial: 初期状態（回路によるベル状態または $\lvert 00\rangle$）
  J: イジング結合 $J$
  h: 横磁場 $h$
  t_max: シミュレーション時間
