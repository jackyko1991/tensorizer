title: 'Une particule vue de nombreuses fois : découper une seule ligne d''univers'
summary: 'Une hypothèse spéculative, pas de la physique établie : chaque électron est le même objet, une seule ligne d''univers qui zigzague en avant et en arrière dans le temps (l''univers à un électron de Wheeler, 1940). Une tranche de temps la coupe de nombreuses fois : les traversées vers l''avant ressemblent à des électrons, celles vers l''arrière à des positrons. Cette étape découpe des lots de lignes d''univers aléatoires. Tous les électrons sortent exactement identiques, et des paires sont créées et annihilées aux points de rebroussement. Mais une ligne d''univers fermée traverse chaque tranche autant de fois vers l''arrière que vers l''avant, et une ligne ouverte ajoute au plus une particule nette, alors que l''univers contient environ $10^{80}$ baryons et presque pas d''antimatière. Dans sa forme la plus simple, l''idée est exclue.'
notes: 'Statut : spéculatif ; exclue dans sa forme la plus simple. Étape 2 de l''hypothèse de projection (l''idée spéculative personnelle de l''auteur, voir la description de la série ; pas de la physique établie), pour le postulat P3 : toutes les particules sont des projections d''un seul objet. L''étape 1 (cosmology/projection_postulate) a énoncé les postulats ; l''étape 3 (cosmology/projection_dimension_budget) compte les dimensions dont ils ont besoin. D''abord la physique connue. Lors d''un appel téléphonique en 1940, John Wheeler suggéra à Richard Feynman que tous les électrons sont identiques parce qu''ils sont un seul électron, dont la ligne d''univers va vers l''avant et vers l''arrière dans le temps ; un tronçon vers l''arrière est un positron. Feynman raconta l''histoire dans sa conférence Nobel de 1965, avec sa propre objection : il n''y a pas autant de positrons que d''électrons. Wheeler suggéra qu''ils pourraient être cachés dans les protons. L''idée qu''un positron est un
  électron remontant le temps a survécu comme l''image de Feynman–Stueckelberg des antiparticules (Feynman, Phys. Rev. 76, 749, 1949), mais l''univers à un électron n''a pas survécu : en théorie quantique des champs, tous les électrons sont identiques parce qu''ils sont des excitations d''un seul champ. Ici, la ligne d''univers vit dans un espace à $D$ dimensions ($D$ est un paramètre, jamais fixé à 4) ; seule sa coordonnée temporelle compte pour les tranches, comme le dit P2. La prédiction de l''hypothèse : une tranche de temps (P2) coupe la ligne d''univers en $N_+$ traversées vers l''avant et $N_-$ vers l''arrière. Ce qui est calculé : des lots de lignes d''univers lisses (Fourier aléatoire, $K$ harmoniques, amplitudes $\propto k^{-\beta}$) et rugueuses (browniennes), fermées ou ouvertes, coupées par $L$ tranches. Les traversées sont comptées par une dispersion (scatter) dans un tableau de différences et vérifiées contre une table par force brute. Pour une boucle fermée, $N_+ = N_-$ sur
  chaque tranche ; pour une ligne ouverte, $Q = N_+ - N_-$ vaut $[t_{end}\geq u] - [t_{start}\geq u]$, donc $|Q|\leq 1$ et $N\equiv Q$ (mod 2). Incliner la tranche (un observateur en mouvement) ne change pas $Q$. Le décompte total est égal à $2(\#\text{minima} - \#\text{maxima})$ sous la tranche, donc les paires naissent aux minima de $t(s)$ et meurent aux maxima. Le décompte moyen de boucles lisses aléatoires suit la formule de Rice. Ce qu''elle obtient gratuitement : chaque traversée lit la masse et la charge de la même ligne d''univers, donc tous les électrons sont exactement semblables, et les positrons ont exactement la charge opposée et la même masse (PDG 2024 : $|m_{e^+} - m_{e^-}|/m < 8\times10^{-9}$, $|q_{e^+} + q_{e^-}|/e < 4\times10^{-8}$). Le test face aux données (data/*.csv, nombres cités) : AMS-02 a mesuré la fraction de positrons du rayonnement cosmique $e^+/(e^+ + e^-)$ de 0.5 GeV à 1 TeV (Aguilar et al., PRL 110, 141102, 2013 ; PRL 122, 101101, 2019, CC-BY 4.0, 74 intervalles
  via la base de données CRDB) : 0.13 à 0.6 GeV, un minimum de 0.053 près de 8 GeV et 0.15 à 0.16 au-dessus de 200 GeV. L''asymétrie $1 - 2f$ est donc comprise entre 0.67 et 0.89, contre $0$ pour une boucle fermée. Aux échelles cosmiques, la densité baryonique de Planck 2018 $\Omega_b h^2 = 0.0224$ donne $\eta = n_B/n_\gamma = 6.1\times10^{-10}$ (voir cosmology/baryon_asymmetry). Avec 411 photons par cm$^3$ dans une sphère de rayon 46.5 milliards d''années-lumière, cela fait $N_B\approx 9\times10^{79}$ baryons, et l''antimatière est absente (BESS-Polar : antihélium/hélium inférieur à $6.9\times10^{-8}$ ; Cohen, De Rújula et Glashow 1998 : aucun domaine d''antimatière dans l''univers visible). Une seule ligne d''univers donne au plus $|Q|/N = 1/N$, soit $7\times10^{-90}$ quand $N\approx 1.5\times10^{89}$, contre $\eta = 6\times10^{-10}$ ; la charge nette est trop faible d''un facteur d''environ $10^{80}$. Un balayage des paramètres libres (lisse ou brownienne, fermée ou ouverte, 2 à 32 harmoniques,
  trois rugosités, environ $3\times10^5$ tranches avec $N\geq 2$) ne trouve aucune configuration atteignant l''asymétrie d''AMS-02, et la borne montre qu''aucune ne le peut : avec $N\geq 2$ traversées, la plus grande asymétrie possible est $1/3$ (à $N = 3$). Verdict : exclue dans sa forme la plus simple. Extensions, chacune une hypothèse supplémentaire et signalée comme telle : (A) une ligne d''univers ouverte ajoute une particule nette, pas plus. (B) Une projection biaisée, dans laquelle les observateurs voient les antiparticules avec une efficacité $r$, demande $r = f/(1-f)$ entre 0.056 et 0.195, variant avec l''énergie, d''après AMS-02, mais $r < 7\times10^{-8}$ d''après l''antihélium. L''antimatière cachée pèserait alors autant que les baryons visibles, environ 0.19 de la matière noire. C''est le « caché dans les protons » de Wheeler sous une forme moderne ; cela demande un mécanisme, et aucun n''est donné. (C) Si le temps était un cercle, une boucle s''enroulant $w$ fois porterait une
  charge nette $Q = w$ sur chaque tranche (vérifié), mais $w\approx 10^{80}$ devrait être introduit à la main, et un temps compact implique des courbes de genre temps fermées. Aucune de ces extensions n''est une prédiction. Ce qui relancerait l''idée est un mécanisme qui rend asymétrique le décompte par tranche d''un seul objet, et c''est la question ouverte que cette étape laisse à la série. Échappatoire : la version simple est exclue, mais une ligne d''univers équilibrée globalement, avec l''antimatière au-delà de notre horizon ou dans un anti-univers miroir CPT, ne l''est pas. L''étape 7 (cosmology/projection_antimatter_universe) énumère les critères qu''un tel univers d''antimatière doit remplir et confronte chacun aux données.'
meanings:
- '$k$ (harmonique) et $c$ (cos, sin) répétés ⇒ sommés : $B$ lignes d''univers aléatoires en $D$ dimensions ; la coordonnée 0 est le temps'
- traversées vers l'avant (particule) et vers l'arrière (antiparticule) de chaque tranche ; la somme sur les segments $s$ est une dispersion dans un tableau de différences suivie d'une somme cumulée
- charge nette sur la tranche ; égale au nombre de traversées des deux extrémités, $0$ pour une boucle fermée
- 'le même décompte à partir des seuls points de rebroussement : les minima créent des paires, les maxima les annihilent'
- formule de Rice avec les moments spectraux $\lambda_0 = \sum_k\sigma_k^2$, $\lambda_2 = \sum_k k^2\sigma_k^2$
- asymétrie de charge des $e^\pm$ du rayonnement cosmique d'après la fraction de positrons $f_E$ d'AMS-02 à l'énergie $E$
- nombre baryonique net qu'une seule ligne d'univers devrait porter ($\eta$ d'après Planck 2018)
labels:
  worldlines: Lignes d'univers dans le lot $B$
  samples: Échantillons le long de chaque ligne d'univers $S$
  modes: Harmoniques par coordonnée $K$ (à quelle fréquence elle peut zigzaguer)
  roughness: 'Rugosité $\beta$ : l''harmonique $k$ a une amplitude $\propto k^{-\beta}$'
  dims: Dimensions $D$ de l'espace où vit la ligne d'univers (libre)
  slices: Tranches de temps $L$
