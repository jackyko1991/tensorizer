source_hash: a69998e36eef
title: 掛谷猜想
summary: 一根針可以在面積任意小的集合內轉過所有方向。本題構造這樣的集合（Perron 樹：$2^k$ 個細三角形，橫向平移），並逐行精確計算其面積。接著用 $\delta$ 立方體覆蓋 $\mathbb R^2$、$\mathbb R^3$ 與 $\mathbb R^4$ 中 $\delta$ 管的聯集，以估計其維數。掛谷猜想斷言這樣的集合仍具有完整維數 $n$。這在 $n = 2$ 時已證明，自 2025 年起 $n = 3$ 也已證明；對 $n \ge 4$，目前僅有的證明都是未經驗證、由 AI 生成的聲稱。
notes: 掛谷在 1917 年問：要讓單位長的針轉一圈，最少需要多大的面積？Besicovitch（1919、1928）發現，在每個方向都含有一條單位線段的集合，其測度可以為零；Perron（1928）把構造簡化成這裡畫出的樹。把一個三角形切成 $2^k$ 條細片並橫向滑動。每條細片保有它的方向，而每做一輪 Perron 步驟，重疊就變大。面積滿足 $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$（已檢驗），而最佳的 $\alpha$（同時嘗試 24 個值求得）使面積以 $\ln k / k$ 的速度下降。Córdoba（1977）證明平面上掛谷集的 $\delta$ 鄰域面積至少為 $c / \log(1/\delta)$，所以這種緩慢的衰減無法避免；Davies（1971）證明每個平面掛谷集的豪斯多夫維數與閔可夫斯基維數都是 2。三棵相差 60° 的樹在每個方向都含有一根單位針（紅色的針掃過 180°）；用 Pál 的技巧把各個位置連接起來，就能讓針真的在面積任意小的集合內旋轉。在 $\mathbb R^n$ 中，掛谷集猜想斷言每個這樣的集合都有維數 $n$：方向彼此 $\delta$ 分離、半徑為 $\delta$ 的管不能重疊太多，所以它們的聯集體積 $\gtrsim_\varepsilon \delta^{\varepsilon}$。右側面板針對兩種排列（所有管都通過原點，以及隨機中心）計數 $\delta$ 立方體。在每種情形下，$\log N$ 對 $\log(1/\delta)$ 的斜率都趨近 $n$，若猜想為真就必然如此。電腦只能檢驗特定的排列，永遠無法檢驗所有排列。現狀（2026 年 11 月）：$n = 2$ 已證明（Davies 1971）。$n = 3$ 由王虹與 Joshua Zahl 證明（2025 年預印本），在此之前有 Wolff 的界 $(n+2)/2$（1995）以及 Katz–Łaba–Tao 的工作。對 $n \ge 4$，在同儕審查的文獻中這個問題仍未解決。OpenAI 發布的 AI 生成手稿集（github.com/openai/math，第 074 與 079 族）聲稱證明了四維情形，並透過 Sogge 的局部光滑化猜想聲稱證明了所有維數。該儲存庫表示其中部分命題已在
  Lean 中形式化，但這些都是未經同儕審查、由機器產生的聲稱，仍待數學界檢驗，因此本頁將它們視為聲稱，而非已證明。這個猜想的重要性遠超出幾何：它可由調和分析中的傅立葉限制猜想與 Bochner–Riesz 猜想推出。
meanings:
- $N = 2^k$ 個細三角形，頂點為 $(0, 1)$，底邊 $[b_i, b_i + w_0]$ 分割 $[-1/\sqrt3, 1/\sqrt3]$：一個 60° 的方向錐，每條邊 $\ge 1$
- 經過 $k$ 輪 Perron 步驟後的橫向平移，同時對 $A$ 個 $\alpha$ 值計算；每一輪讓相鄰的心部相接，並把右邊那個向左推 $(1-\alpha)(c - a)$
- 三角形 $i$ 與高度 $y$ 的水平線相交之處
- 把每一行的區間依左端點排序；右端點的累積最大值給出已被覆蓋的部分
- 重複的 $i$ 與 $y$ ⇒ 求和：每一行聯集的精確長度，再對各行取平均（中點法則）
- 立方體 $[-1,1]^n$ 各面上的 $\delta$ 網格，投射到球面上：大約 $\delta$ 分離的直線方向
- 每根管經過的邊長為 $\delta$ 的立方體，沿管每隔 $\delta/2$ 取樣
- 重複的 $i$ ⇒ 求和：每個立方體一個整數鍵，因此計數不同的立方體只需一次排序
- 重複的 $j$ ⇒ 求和：樹轉 0°、60°、120° 的三個副本覆蓋所有方向
labels:
  k_max: Perron 輪數 $k$（$2^k$ 個三角形）
  n_max: 管至維數 $n$
