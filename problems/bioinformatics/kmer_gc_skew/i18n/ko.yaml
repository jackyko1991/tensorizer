source_hash: 48f29505ec48
title: k-mer, GC 함량과 GC 비대칭
summary: DNA 서열을 원-핫 $(L, 4)$ 텐서로 만든다. 길이 $k$인 모든 단어를 세는 것은 펼친 창에 대한 einsum 하나(1-D 합성곱)이고, GC 함량과 GC 비대칭(skew)은 창 합이며, 누적 비대칭의 최솟값은 복제 원점과 종결점을 심어 둔 합성 원형 염색체에서 복제가 시작되는 곳을 가리킨다.
notes: 대부분의 세균 염색체는 원형이고 하나의 복제 원점에서 복제되며, 두 복제 분기점이 반대 방향으로 진행하다 종결점에서 만난다. 두 절반은 다르게 복제되며(한 가닥은 선도 가닥으로 연속적으로, 다른 가닥은 조각조각), 진화의 시간에 걸쳐 선도 가닥은 C보다 G를 약간 더 많이 모으는 경향이 있다. 여기서는 그 편향을 심어 둔다. 원점에서 종결점까지는 G가 인자 $(1+\text{skew})/(1-\text{skew})$만큼 선호되고, 나머지 절반에서는 C가 선호된다. 창 하나의 비대칭은 잡음이 크지만, 누적 합 $S_n$은 원점까지 계속 내려가고 종결점까지 계속 올라가므로, 편향이 몇 퍼센트에 불과해도 최솟값과 최댓값이 두드러진다. 실제 유전체도 같은 V자 모양을 보이지만 덜 깨끗한데, 유전자, 반복 서열, 재배열이 각자의 조성을 더하기 때문이다. 안쪽 고리의 GC가 낮은 두 구간은 유전체 섬, 즉 다른 곳에서 얻어 와 다른 염기 조성을 유지하는 경우가 많은 DNA를 흉내 낸다. $k$-mer 스펙트럼은 유전체 조립과 많은 정렬 없는 비교의 출발점이다. 이 무작위 유전체에서는 색이 단순히 GC 함량을 따른다. 더 작은 비대칭, 더 작은 유전체, 또는 더 큰 $k$(단어는 더 많고 각 단어의 수는 더 적다)를 시도해 보자.
meanings:
- '위치 $n$, 글자 $a$ ∈ (A, C, G, T): 염기가 $a$인 곳에서 1'
- 길이 $k$인 모든 창, 메모리 복사 없이
- '$a \cdot 4^{k-1-j}$: 단어를 4진수로 읽은 수(AAA = 0, …, TTT = $4^k-1$)'
- '반복된 $j$와 $a$ ⇒ 합: $n$에서 시작하는 $k$-mer의 인덱스'
- $k$-mer 스펙트럼. 개수의 합은 $L-k+1$
- '반복된 $i$ ⇒ 합: 길이 $\ell$인 창 $w$의 염기 수, 창은 $\Delta = \ell/2$마다 하나'
- $(n_G + n_C)/\ell$와 $(n_G - n_C)/(n_G + n_C)$
- '$c = (0, -1, +1, 0)$: G 빼기 C의 누적 개수. argmin = 원점, argmax = 종결점'
labels:
  length_kb: 유전체 길이 $L$
  k: 단어 길이 $k$
  window: 창 $\ell$
  origin: 심은 원점(유전체 내 비율)
  skew: 가닥 편향(skew)
  gc: GC 함량
  seed: 난수 시드
