title: 物理信息神经网络（PINN）：阻尼振子
summary: 一个小型神经网络 $\hat x(t; w)$ 仅凭区间前 40% 内的十个带噪声测量值，学习弹簧上阻尼质量的运动。把运动方程 $m\ddot x + \mu\dot x + kx = 0$ 加进损失函数，并用自动微分在配点（collocation points）上求值，就能让网络在普通神经网络失败的地方正确外推；在反问题模式下，它还能推断出未知的阻尼 $\mu$。
notes: 普通的神经网络是灵活的曲线拟合器：只用测量值训练时，它能穿过这些点，但在最后一个数据点之后，没有任何东西告诉它该怎么做，所以它的预测（虚线）会逐渐偏离。物理信息神经网络（PINN）加入第二个损失项：在覆盖整个区间（包括没有数据的地方）的配点 $t_c$ 上，残差 $r_c = m\hat x'' + \mu\hat x' + k\hat x$ 的均方值。这些导数是网络对其输入的精确导数，由 torch.autograd.grad 配合 create_graph=True 计算，使损失能通过它们反向传播到权重。驱使 $r_c \to 0$ 会迫使 $\hat x$ 在各处都是运动方程的解；数据与初始条件 $x(0) = 1$、$\dot x(0) = 0$ 再从中挑出唯一相符的解，因此网络能正确外推。物理在这里起到正则化的作用，弥补缺失的数据。在反问题中，阻尼 $\mu$ 是未知的：它成为一个可训练参数，优化器会找到让数据与物理一致的值（注意它先超调、再稳定下来）。精确解为 $x = e^{-\delta t}(\cos\omega t + \tfrac{\delta}{\omega}\sin\omega t)$，其中 $\delta = \mu/2m$、$\omega = \sqrt{k/m - \delta^2}$。实用要点：残差的量级约为 $k$ 乘以误差，因此用权重 $\lambda \approx 10^{-4}$ 让它与数据项取得平衡（太大时网络会停在平凡解 $\hat x = 0$，它的残差同样为零）；较高的频率（较大的 $k$）需要更多迭代，因为神经网络会先学会低频。这里求解正问题只是为了演示方法：ODE 求解器会快得多。PINN 真正划算的场合是反问题、稀疏且带噪声的数据，以及形状不规则区域上的偏微分方程。简化：固定质量 $m = 1$、固定随机种子，以及使用余弦衰减学习率的 Adam（没有 L-BFGS 精修）。
meanings:
- 一批输入时间：配点、测量时间和 $t = 0$
- 第 $l$ 层的可训练权重 $w$：各层大小 $1 \to 32 \to 32 \to 32 \to 1$
- 重复的 $j$ ⇒ 对前一层的神经元求和
- 隐藏层激活值；使用平滑的激活函数，使 $\hat x$ 具有二阶导数
- 给出 $\dot{\hat x}$；对它再调用一次即得 $\ddot{\hat x}$（网络的精确导数，不用有限差分）
- 配点上的 ODE 残差：当 $\hat x$ 满足物理定律时为零
- 数据误差、$r_c^2$ 的平均值，以及初始条件 $(\hat x(0) - 1)^2 + (\dot{\hat x}(0)/\omega_0)^2$
- 反问题模式：阻尼成为多出来的一个可训练参数，与权重一起由 Adam 更新
labels:
  mode: 模式：学习 $\mu$（反问题）或已知（正问题）
  k: 弹簧常数 $k$
  mu: 真实阻尼 $\mu$
  mu_guess: $\mu$ 的初始猜测（反问题模式）
  n_data: 测量点数量
  data_fraction: 测量覆盖区间的比例
  noise: 测量噪声
  n_colloc: 配点 $t_c$
  log10_lambda: 物理权重 $\log_{10}\lambda$
  n_iter: 训练迭代次数
  lr: Adam 学习率
  compare: 同时训练一个不含物理的网络
