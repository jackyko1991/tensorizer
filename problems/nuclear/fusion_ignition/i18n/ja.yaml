source_hash: b05c63a03eb9
title: DT ホットスポットの慣性核融合点火
summary: 爆縮した重水素–三重水素カプセルの中心にあるホットスポットの 0 次元モデル。$\mathrm{D + T \to {}^4He + n}$ からのアルファ粒子がそれを加熱し、制動放射と膨張が冷却し、冷たいシェルへ逃げる熱が燃焼を助ける。初期温度と面密度 $(T_0, \rho R_0)$ のグリッド全体を一つのバッチとして積分する：ローソン型の境界より上ではホットスポットが暴走して燃焼し、下では消える。
notes: 慣性閉じ込めは数百マイクログラムの DT を非常に速く圧縮し、飛び散る前に燃焼させる。ホットスポットは、自ら生成するアルファ粒子による加熱が冷却より速いときに点火する。これを決めるのは二つの数である：温度（$\langle\sigma v\rangle$ は数十 keV まで急激に増加するため）と面密度 $\rho R$（厚いホットスポットほど自身のアルファ粒子を止め（アルファ粒子の飛程は 10 keV 付近でおよそ 0.3 g/cm²）、膨張に対してより長くまとまっているため）。制動放射だけで理想点火温度が決まり、約 4.3 keV で $\tfrac14\langle\sigma v\rangle E_\alpha = C_B\sqrt T$ となる。破線の曲線は瞬間的なつり合い、すなわちローソン条件の ICF 版である。陰影部は完全な積分で得られる領域で、冷たいシェルへの燃焼伝播も考慮している。損失倍率 $L$ を上げると、境界はより大きな $\rho R$ とより高い $T$ へ移動する。研究の背景：2022 年 12 月 5 日、国立点火施設（NIF）は、ターゲット利得が 1 を超える初の実験室核融合実験を報告した。ターゲットに照射された 2.05 MJ のレーザー光から約 3.15 MJ の核融合エネルギーが得られた（概算。Indirect Drive ICF Collaboration, Phys. Rev. Lett. 132, 065102, 2024）。それに先立ち、燃焼プラズマの達成（Zylstra et al., Nature 601, 542, 2022）と、2021 年 8 月の点火に関するローソン条件を超えた 1.3 MJ のショット（Phys. Rev. Lett. 129, 075001, 2022）があった。ターゲット利得はターゲットに届いたレーザーエネルギーだけを数えるもので、レーザーの運転に使われる電力ははるかに大きい。単純化：密度一定の一様な 0 次元ホットスポット（そのため燃焼率は過大評価される——PdV 損失項以外に分解させるものはない）、例示的なアルファ粒子付与の式、近似的なスピッツァー熱伝導率（$\ln\Lambda \approx 10$）、放射の閉じ込めなし、アブレーター物質の混合なし、イオンと電子の温度は等しい。
meanings:
- 各グリッド点 $b = i\,n_r + j$ が一つのホットスポット。状態は $(\ln T, \ln\rho R, \varphi)$
- Bosch–Hale の DT 反応率。10 keV で $\approx 1.14\times10^{-22}$ m³/s、65 keV 付近でピーク $\approx 9\times10^{-22}$
- 3.5 MeV のアルファ粒子エネルギーのうちホットスポット内で止まる割合
- 制動放射、$C_B = 5.34\times10^{-37}$ W m³ keV$^{-1/2}$
- 音速で膨張するホットスポットの PdV 仕事
- シェルへのスピッツァー熱伝導。新たな高温質量として再利用（燃焼伝播）
- すべてのホットスポットについての右辺を同時に計算し、RK4 で進める
- 自己加熱と損失が等しくなるローソン型曲線。バッチ化した二分法による
labels:
  density: ホットスポット密度 $\rho$
  loss: 損失倍率 $L$（制動放射 + PdV）
  rho_r_max: 利用可能な燃料の総 $\rho R$
  t_end: シミュレーション時間
  n_grid: 軸あたりのグリッド点数
  t_min: 最低の $T_0$
  t_max_init: 最高の $T_0$
