source_hash: 2cd1c41299f8
title: ドプラ超音波：血流を測る
summary: 超音波プローブは赤血球からのエコーを聴きます。動いている血球はそれぞれエコーの周波数を $f_D = 2 f_0 v \cos\theta / c$ だけずらし、拍動する動脈内の数百個の血球を一つのフェーザのバッチとして一度に計算します。短時間フーリエ変換（STFT）で合計エコーを、装置に表示されるドプラスペクトログラム（心周期にわたる血流速度の分布）に変換します。
notes: 係数 2 は周波数偏移が 2 回起こるためです。動いている血球はまず偏移した波を受け取り、さらに動きながらそれを再放射します。効くのはビーム方向の速度成分だけなので、$\theta = 90°$ では偏移はまったく生じません。装置は検者に角度を入力させて $v = f_D c / (2 f_0 \cos\theta)$ を計算しますが、約 60° を超えると非常に不確かになります。既定値（$f_0 = 5$ MHz、$\theta = 60°$、ピーク 1 m/s）では収縮期の偏移は約 3.2 kHz で可聴域にあり、ドプラ装置が信号を音としても再生するのはこのためです。層流では速度分布は放物線状で、壁際の血球はほとんど動かず、中心軸が最も速く流れます。断面の等しい面積には等しい数の血球が含まれるので、0 から $v_{\max}$ までのどの速度も同じ頻度で現れ、スペクトルは平らな帯（「埋まった」窓）になり、平均周波数はちょうど最大値の半分になります。乱流や狭窄部の流れではスペクトルが広がります。パルスドプラはパルスごとに 1 回エコーをサンプリングするので、ナイキストの定理により $|f_D| < \mathrm{PRF}/2$ しか測れません。PRF を下げる（または流速を上げる）と、収縮期ピークが負側に折り返されます（エイリアシング）。実際の装置では、高速ジェットには高い PRF が、深部の血管には低い PRF が必要です。次のパルスを送る前に各パルスが戻ってこなければならないからです。簡略化：サンプルボリュームは血管全体を覆い、ビームは一様、IQ 信号はベースバンドで直接計算し、ウォールフィルタや組織クラッタはありません。すべての数値は近似であり教育用です。臨床には使用しないでください。
meanings:
- 2 拍分の中心軸速度：収縮期ピーク、短い逆流、ゆっくりした拡張期の流れ
- ランダムな赤血球：血管内の半径、エコーの位相と強さ
- 放物線（層流）分布と波形の積：外積で、和をとる添字はない
- 各パルスでの各血球のドプラ偏移 $2 f_0 v \cos\theta / c$
- 繰り返される $n$ ⇒ 和：受信エコー。パルスごとに 1 つの複素（IQ）サンプル、間隔 $\Delta t = 1/\mathrm{PRF}$
- スペクトログラム：時間窓 $k$ における周波数 $f$ のパワー
- パルスドプラでは $f$ は $[-\mathrm{PRF}/2, \mathrm{PRF}/2)$ に折り返されて見える
labels:
  f0: 送信周波数 $f_0$
  theta: ビームと血流のなす角 $\theta$
  v_peak: 収縮期最高流速
  prf: パルス繰り返し周波数 PRF
  heart_rate: 心拍数
  n_scatterers: 計算する赤血球の数
