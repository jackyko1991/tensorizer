source_hash: 75e6d7e3dc93
title: 雙擺與混沌
summary: 雙擺的拉格朗日方程式寫成 $M_{ij}(q)\,\ddot q_j = f_i(q, \dot q)$。每個 RK4 階段都建立 $2\times 2$ 質量矩陣張量並呼叫 torch.linalg.solve；兩個幾乎相同的初始狀態逐漸分離，展現混沌。
notes: 批次中有兩個雙擺，其 $\theta_2$ 相差 $\delta$。兩者的差距大致呈指數增長，直到運動完全無關，但各自的能量仍以高精度保持不變（float64 + 小步長 RK4）。小擺幅時系統有兩個簡正模態；質量與長度相等時 $\omega^2 = (2 \mp \sqrt2)\,g/L$。擺桿無質量，支點無摩擦。
meanings:
- 雙擺 $b$ 相對鉛直向下的角度 $(\theta_1, \theta_2)$
- 角速度
- 隨位形變化的質量矩陣，非對角元素為 $m_2L_1L_2\cos(\theta_1-\theta_2)$
- 廣義力：離心耦合 + 重力
- 一次呼叫對整個批次求解 $M\ddot q = f$
- $i$ 與 $j$ 求和：動能的兩倍
labels:
  theta1: 初始 $\theta_1$
  theta2: 初始 $\theta_2$
  delta: $\theta_2$ 的擾動 $\delta$
  m1: 上方質量 $m_1$
  m2: 下方質量 $m_2$
  L1: 上擺桿 $L_1$
  L2: 下擺桿 $L_2$
  t_max: 模擬時間
