source_hash: 0b86e0abca1f
title: 拉塞福散射
summary: 一束 α 粒子射向金原子核。每個 α 粒子都在一個批次張量中以 RK4 穿越排斥性庫侖場積分，其散射角直方圖重現了拉塞福的 $1/\sin^4(\theta/2)$ 定律——這正是原子的正電荷集中在微小原子核中的證據。
notes: 單位：fm、MeV，時間以 fm/$c$ 計。沿每條路徑能量與角動量守恆，因此單憑 $E$ 與撞擊參數 $b$ 就決定偏折角 $\theta = 2\arctan(k/2Eb)$；正面撞擊的 α 粒子在 $d = k/E$ 處折返（5 MeV 射向金核約 45 fm，仍遠在 7 fm 的原子核之外，因此純庫侖定律成立）。粒子束均勻分佈在半徑 $b_{\max}$ 的圓盤上（隨機但種子固定），因此散射到某立體角內的數目為（每單位面積的 α 粒子數）× $d\sigma/d\Omega$。每幾百個 α 粒子中只有一個反彈超過 90°——這是 Geiger 與 Marsden 在 1909 年的驚人發現。簡化：原子核是固定的點電荷（無反衝、無核力），運動為非相對論性（$v \approx 0.05c$）。每個 α 粒子從 30 $d$ 遠處出發，具有恰如從無窮遠而來的能量與角動量；力剩餘的 $1/r^2$ 尾巴使角度偏移遠小於一度。
meanings:
- $Z_\alpha Z e^2/4\pi\varepsilon_0 = 2Z \cdot 1.44$ MeV fm
- α 粒子 $b$ 的位置（fm）與速度（以 $c$ 為單位）
- 重複的 $j$ ⇒ 求和：距離平方 $r_b^2$
- 一次對整束粒子計算庫侖排斥力
- 二維外積：單位質量角動量
- 出射速度與束軸的夾角
- 拉塞福預測，與直方圖比較
labels:
  energy: α 粒子能量 $E$
  z_target: 靶核電荷 $Z$
  b_max: 粒子束半徑 $b_{\max}$
  n_beam: 束中 α 粒子數
  n_steps: RK4 步數
