source_hash: 5c7383dc415a
title: 量子トンネル効果
summary: ガウス波束が矩形障壁に当たる。時間依存シュレーディンガー方程式をスプリットステップ・フーリエ法で解く：ポテンシャルは $x$ 空間で対角な演算子、運動エネルギーは $k$ 空間で対角な演算子なので、時間ステップの各半分は要素ごとのテンソル積にすぎず、torch.fft が2つの基底を行き来する。
notes: 単位 $\hbar = m = 1$、波束のエネルギー $E \approx k_0^2/2$。$\psi$ に作用する対角演算子 $D_{xy} = d_x\,\delta_{xy}$ は $D_{xy}\psi_y = d_x\psi_x$ である——行列は不要で、要素ごとの掛け算だけでよい。ストラング分割 $P\cdot K\cdot P$ は $\Delta t$ について2次精度で厳密にユニタリなので、ノルムは丸め誤差の範囲で 1 に保たれる。シミュレーション時間は自動的に（$45/k_0$）選ばれ、波束の中心が $x = -25$ から約 $x = +20$ まで進む。$E < V_0$ では古典的な粒子は必ず跳ね返される。右側に透過した塊がトンネル効果である。比較のために表示する平面波の透過係数 $T(k_0)$ は、波束の運動量の広がりを無視している（また障壁幅は格子上に置かれたときの値を用いる）。幅の広い波束（大きな $\sigma_0$）は運動量がより鋭く、よりよく一致する。
meanings:
- 周期的な格子 $x$ 上の波動関数
- 半ステップのポテンシャル演算子：$x$ で対角、psi * P として作用
- 1ステップの運動エネルギー演算子：$k$ で対角、psi_k * K として作用
- 基底変換 $x \to k$（高速な行列積で、陽に組み立てることはない）
- 透過：障壁の右側に見いだされる確率
labels:
  k0: 波束の運動量 $k_0$
  V0: 障壁の高さ $V_0$
  width: 障壁の幅 $a$
  sigma: 波束の幅 $\sigma_0$
