title: आपेक्षिकीय आवेशित कण
summary: 'सहपरिवर्ती (covariant) रूप में लॉरेंज़ बल, $dU^\mu/d\tau = (q/m)\,F^\mu{}_\nu U^\nu$: क्षेत्र टेंसर का दूसरा सूचकांक मिंकोव्स्की मेट्रिक से नीचे किया जाता है और एक einsum में चार-वेग के साथ संकुचित होता है। उचित समय (proper time) में समाकलन दिखाता है कि तेज़ कण न्यूटन की भविष्यवाणी से धीमे घूमते हैं, और एक स्थिर विद्युत क्षेत्र कण को प्रकाश के वेग के और निकट धकेलता है — पर कभी उससे आगे नहीं।'
notes: 'मात्रक जिनमें $c = 1$। समीकरणों को हर कण के उचित समय $\tau$ में RK4 से समाकलित किया जाता है और फिर एनिमेशन के लिए प्रयोगशाला समय $t = X^0$ पर पुनः नमूनित किया जाता है। साइक्लोट्रॉन: चुंबकीय बल कोई कार्य नहीं करता, इसलिए $\gamma$ स्थिर रहता है, पर कक्षा न्यूटनी वृत्त से $\gamma$ गुना बड़ी और $\gamma$ गुना धीमी होती है ($\omega = qB/(\gamma m)$)। त्वरण: एकसमान $E$ में विराम से गति अतिपरवलयिक होती है, $x = (\sqrt{1 + (at)^2} - 1)/a$ जहाँ $a = qE/m$, इसलिए $v \to 1$, जबकि न्यूटन का $\tfrac12 at^2$ समय $t = 2/a$ के बाद प्रकाश से आगे निकल जाता।'
meanings:
- कण $p$ की चार-स्थिति $(t, x, y, z)$ और चार-वेग $\gamma(1, \mathbf v)$
- मिंकोव्स्की मेट्रिक $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$
- $F^{0i} = -E_i$, $F^{ij} = -\varepsilon_{ijk}B_k$
- 'दोहराया गया $\alpha$ ⇒ योग: दूसरा सूचकांक नीचे किया गया'
- 'दोहराया गया $\nu$ ⇒ योग: हर कण पर चार-बल'
- $U$ की मिंकोव्स्की लंबाई, जो 1 रहनी चाहिए
labels:
  config: परिदृश्य
  strength: क्षेत्र की प्रबलता ($B$ या $E$)
  v_max: सबसे तेज़ प्रारंभिक वेग (साइक्लोट्रॉन)
  n_particles: कण
  t_max: प्रयोगशाला समय
