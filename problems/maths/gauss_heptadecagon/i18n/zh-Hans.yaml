source_hash: 107eff242684
title: 高斯的尺规正十七边形
summary: 1796 年，在 19 岁生日前一个月，高斯发现正十七边形可以用尺规作出：这是自古希腊以来第一个新的可作正多边形。17 次单位根分组成高斯周期后，依次解一串二次方程。这串方程只用平方根写出 $\cos(2\pi/17)$。随后，Richmond 1893 年的作图法一步步画出多边形，直线与圆的交点都写成张量运算。一张网格显示哪些正 $n$ 边形可作（高斯–旺策尔定理）。这里的一切都是已证明的经典数学。
notes: 高斯在 1796 年 3 月 30 日、19 岁生日前不久发现了正十七边形，据说正是这件事让他选择了数学而不是语文学。他在《算术研究》（Disquisitiones Arithmeticae，1801）的最后一节发表了这一理论。思路是：因为 3 是原根，16 个非平凡根 $\zeta^k$ 在 $k \mapsto 3k \bmod 17$ 下被循环置换。按这个循环顺序每隔一个根求和，得到两个 8 项周期，满足 $\eta_0 + \eta_1 = -1$ 和 $\eta_0\eta_1 = -4$，所以 $\eta_{0,1} = (-1 \pm \sqrt{17})/2$。再对半分，得到 4 项、2 项和 1 项的周期。每一对都是一个二次方程的两根，方程系数是上一层的周期，因为子群的阶是 $16 \to 8 \to 4 \to 2 \to 1$，全是 2 的幂。2 项周期就是 $\zeta^k + \zeta^{-k} = 2\cos(2\pi k/17)$，所以四次开平方就给出高斯公式。程序用精确的整数系数检查每个二次关系，只用平方根重建每个周期，并把闭式公式与 `torch.cos` 比较（安装了 sympy 时还做 60 位精度检查）。任何原根（3、5、6、7、10、11、12、14）都给出同一棵树，只是顺序不同。平方根是尺规运算，所以多边形可作。H. W. Richmond（1893）在单位圆上给出一个简短的作法。在竖直半径上取 $OJ = OB/4$。在直径上取 $E$ 使 $\angle OJE = \tfrac14\angle OJP_0$（两次平分角），再取 $F$ 使 $\angle EJF = 45°$。以 $FP_0$ 为直径的圆交 $OB$ 于 $K$。以 $E$ 为圆心、过 $K$ 的圆交直径于 $N_3 = \cos(6\pi/17)$ 和 $N_5 = \cos(10\pi/17)$，在这两点作垂线得到 $P_3$ 和 $P_5$。这里每一步都真的画一条过两点的直线，或一个以某点为圆心、过另一点的圆。每个新点都是直线–直线、直线–圆或圆–圆的交点，其余顶点用圆依次截取：以 $P_k$ 为圆心过 $P_{k-1}$，以及以 $P_0$ 为圆心过 $P_k$ 得到镜像点。55 步在 float64 下把全部 17 个顶点放在离
  $e^{2\pi i k/17}$ 约 $10^{-15}$ 的位置；换成 float32 可以看到舍入误差增大到约 $10^{-6}$。高斯指出，当 $n = 2^k p_1 \cdots p_r$ 且 $p_i = 2^{2^j} + 1$ 为互不相同的费马素数时，正 $n$ 边形可作。旺策尔（1837）证明了其他 $n$ 都不行，这也解决了三等分角和倍立方问题。这等价于欧拉函数 $\varphi(n)$ 是 2 的幂，网格把两种判别都检查到 $n$。已知的费马素数只有 3、5、17、257 和 65537。Richelot 在 1832 年发表了正 257 边形，J. G. Hermes 花了约十年完成正 65537 边形，于 1894 年完成，手稿保存在哥廷根。据说高斯希望在墓碑上刻一个正十七边形，石匠据说拒绝了，因为它看起来会像一个圆。不伦瑞克的高斯纪念碑上刻的是一颗十七角星。
meanings:
- 17 次单位根，即复平面上正十七边形的顶点
- 按原根幂次排列的指数，$g = 3$：1, 3, 9, 10, 13, …
- 循环顺序中哪些位置组成第 $m$ 层的周期 $i$：每隔 $2^m$ 个取一个
- 重复的 $j$ ⇒ 求和：一次算出全部五层（长度 16, 8, 4, 2, 1）的高斯周期
- 两个兄弟周期的乘积是 $\zeta^{a+b}$ 之和；统计指数得到在父层周期上取常值的整数
- 重复的 $k$ ⇒ 求和：由上一层得到每个二次方程的常数项
- 每层一次开平方：$16 \to 8 \to 4 \to 2 \to 1$；第 3 层就是 $2\cos(2\pi k/17)$
- 三种尺规操作写成张量公式：用叉积解 $2\times 2$ 方程组、关于 $t$ 的二次方程，以及两圆的根轴
- 用筛法求欧拉函数；当且仅当 $\varphi(n)$ 是 2 的幂时可作，用 $x \,\&\, (x-1) = 0$ 检验
- 奇数部分必须整除 $3\cdot5\cdot17\cdot257\cdot65537 = 2^{32}-1$：即互不相同的费马素数之积
labels:
  generator: 循环顺序所用的原根 $g$
  precision: 作图精度
  n_max: 可作性网格上限 $n$
