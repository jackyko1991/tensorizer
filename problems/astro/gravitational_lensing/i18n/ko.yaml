source_hash: e3dd0dc823a1
title: 블랙홀에 의한 중력 렌즈
summary: 블랙홀 옆을 지나는 광선은 널 측지선이며, 여러 충돌 변수를 가진 광선 다발을 한꺼번에 추적한다. 멀리 지나는 광선은 $4GM/(c^2 b)$만큼 휘고, $\sqrt{27}\,GM/c^2$ 안쪽의 광선은 빨려 들어간다. 하늘에서는 렌즈 방정식이 단 한 번의 텐서 연산으로 모든 픽셀을 광원 평면으로 되돌려 보내므로, 블랙홀 뒤를 지나는 별은 두 개의 호, 아인슈타인 고리, 그리고 증광 스파이크가 된다.
notes: '광선 패널: 단위 $G = c = M = 1$. 점선 원은 광자구($r = 3M$)이며, $b < \sqrt{27}\,M \approx 5.2\,M$인 광선은 블랙홀로 떨어진다. 그래서 블랙홀은 지평선 반지름의 2.6배인 그림자를 드리운다. 바로 바깥의 광선은 한 바퀴 돈 뒤에 탈출하기도 한다. 하늘 패널: 아인슈타인 반지름 단위의 얇은 렌즈 점질량(우리 은하의 항성 블랙홀이라면 약 1밀리각초이므로, 미세 중력 렌즈는 분해된 상이 아니라 밝기 증가로 관측된다). 중력 렌즈는 표면 밝기를 보존하므로, 상은 단순히 $\beta(\theta)$에서 계산한 광원이다. 추가된 빛은 상이 늘어난 데서 온다. 완벽한 정렬 근처에서 점광원이라면 $\mu \to \infty$가 되겠지만, 유한한 광원 크기가 증광률을 제한한다.'
meanings:
- 광선 $b$를 따른 $1/r$, 0(무한대)에서 $du/d\varphi = 1/b$로 출발
- 널 측지선 궤도 방정식, 모든 광선에 대해 $\varphi$로 RK4
- 출사각에서 $\pi$를 뺀 값; 포획되면 NaN
- 픽셀 $p$의 하늘 각도, $\theta_E$ 단위
- 반복되는 $j$ ⇒ 합산
- 각 픽셀이 광원 평면에서 바라보는 위치
- 브로드캐스팅으로 구한 각 프레임 $f$의 렌즈 상
- '증광률: 전체 플럭스의 비'
labels:
  b_min: 최소 충돌 변수 $b$
  b_max: 최대 충돌 변수 $b$
  n_rays: 광선 수
  impact: 렌즈로부터 광원의 오프셋 $u$
  source_radius: 광원 반지름
  n_pixels: 한 변당 하늘 픽셀 수
