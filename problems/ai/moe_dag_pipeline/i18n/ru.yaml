title: DAG рабочего процесса — это смесь экспертов с фиксированным маршрутизатором
summary: 'Цифра MNIST $d$ и текст из трёх слов, например "now plus three", дают ответ $y = (d \circ k) \bmod 10$; ни одной модальности по отдельности недостаточно. Записанный как рабочий процесс в стиле Snakemake (encode_image, encode_text, по одному правилу fuse на каждую операцию, выбираемую входной функцией, classify) и исполняемый тензорным DAG-движком из задачи о виллизиевом круге, этот конвейер вычисляет ровно то же, что слой смеси экспертов с top-1 маршрутизацией, если его матрица маршрутизации $G$ зафиксирована выбором правила. Далее — четыре этапа, которые допускает одна тензорная программа: обучаемый маршрутизатор, эксперты, обученные по отдельности и соединённые в цепочку, один обратный проход через весь DAG и дистилляция в одну небольшую плотную сеть, хранимую в int8. Это взгляд, связывающий известные результаты, а не новая теорема.'
notes: 'Идея. Этот взгляд принадлежит Jacky Ka Long Ko: построение рабочего процесса для виллизиева круга (medical/cow_workflow_dag) показало, что DAG Snakemake может быть одной тензорной программой, а такая программа похожа на мультимодальную смесь экспертов. Точная формулировка: DAG рабочего процесса — это MoE с фиксированным маршрутизатором; MoE — это DAG, рёбра которого выбираются для каждого входа. Это взгляд, связывающий известные результаты, а не новая теорема, и в этой задаче строится один небольшой его пример. Эквивалентность. В data/Snakefile есть правила encode_image, encode_text, fuse (одно задание на каждый образец и каждую операцию, подстановочный параметр $op$), classify и collect; classify читает свой вход через входную функцию `routed`, которая указывает на выход fuse для операции из текста образца. Движок разбирает файл парсером из cow_workflow_dag и строит матрицу смежности заданий из её кронекеровых блоков; блок условного ребра равен $(I_N \otimes \mathbb 1_E^\top) \odot
  \mathbb 1_N \operatorname{vec}(G)^\top$, так что матрица маршрутизации $G$ находится внутри матрицы смежности, и из $N E$ заданий fuse нужны лишь $N$ выбранных (булев обратный проход — так Snakemake отсекает ненужные задания). При исполнении уровень за уровнем, одним пакетным вызовом на правило, он даёт те же логиты, что и слой в стиле Switch (тензор диспетчеризации $D$ по накопленным рангам, все эксперты в одном пакетном einsum, объединение), у которого $G$ зафиксирована выбором правила, а значения гейта равны 1: побитово идентично во float32 и с точностью до $4 \times 10^{-15}$ во float64 на всех 1000 тестовых образцах × 2 сида (сложенное и погрупповое произведения суммируются в разном порядке), предсказание везде одинаковое. Это тождество двух способов записать одно вычисление, а не эмпирический результат. Обучаемый маршрутизатор. Softmax-гейт на текстовых признаках с top-1 маршрутизацией и функцией потерь балансировки нагрузки Switch ($\alpha = 0.01$), энкодеры заморожены, два варианта
  рядом. Перед собственными экспертами fuse рабочего процесса один лишь гейт заново открывает правило: после 800 шагов по умолчанию операция $e$ направляется к эксперту $e$ для 0.85 ± 0.03 тестовых образцов (точность 0.82 против 0.92 с фиксированным маршрутизатором), и эта доля ещё растёт (0.95 и 0.90 после 1500 шагов в пробном запуске). При совместном обучении со свежими экспертами этого не происходит: маршрутизация совпадает с операциями не лучше случайной (0.35 при наилучшей перестановке экспертов; 1/3 означает отсутствие связи), эксперты остаются смешанными, а точность остаётся на уровне 0.40. Эксперты fuse не видят текста, поэтому маршрутизация, игнорирующая операцию, ставит перед каждым экспертом невыполнимую задачу; но в начале ни один эксперт не лучше других ни в одной операции, так что top-1 гейт не получает сигнала, способного нарушить симметрию. Шум в гейте, в 100× большая инициализация гейта, плотный (мягкий) разогрев в 500 шагов и $\alpha = 0.1$ не изменили этого в пробных запусках
  (они не входят в запуск по умолчанию). Более крупные MoE успешно обучают свои маршрутизаторы с нуля; этот игрушечный пример говорит лишь о том, что здесь фиксированное правило не открывается заново само собой. Этапы. (2) Раздельное обучение: каждый эксперт на своей подзадаче — эксперт изображений (MLP) на метках цифр (точность на тесте 0.916), текстовый эксперт (один слой внимания на einsum) на числительном (1.000), эксперты fuse на таблице из 300 записей по one-hot входам (1.000); соединённый в цепочку через DAG без совместного обучения конвейер правильно отвечает на 0.924 тестовых пар (выше точности по цифрам, поскольку умножение на 0 или на 5 прощает некоторые неверно распознанные цифры). (3) Сквозное дообучение, один обратный проход через все этапы: 0.924, без прироста; узкое место — эксперт изображений, а совместная функция потерь не приносит новой информации о цифрах (те же 3000 изображений). (4) Плотный студент (784 + 45 → 64 → 64 → 10, 57 930 весов, 0.53 от 108 766 у конвейера),
  дистиллированный при $T = 4$ (функция потерь $0.9\,\mathcal L_{\mathrm{KD}}$ + 0.1 перекрёстной энтропии): 0.85–0.86, совпадает с учителем на 0.85–0.87 образцов и всё ещё улучшается в конце своих 3000 шагов; int8 по каналам: 0.85–0.86, 58.9 kB вместо 232 kB (435 kB у конвейера). Время на 1000 тестовых пар на одном потоке CPU: DAG-движок 90 ms, тот же DAG в виде одного слоя MoE 19 ms (движок ещё и строит свои блоки заданий), студент 3.4 ms, int8-студент 3.5 ms (вычисляется на деквантованных числах с плавающей точкой, поэтому он меньше, но здесь не быстрее по-настоящему), и по одному вызову на задание, как запускал бы их планировщик без затрат на запуск процессов, 900–1000 ms. Что не следует. Без копирования объединяются и пропускают градиент только этапы, являющиеся тензорными программами в одном пространстве памяти: файловые инструменты (OpenFOAM, VMTK, большая часть анализа биоизображений) таковыми не являются, и DAG Snakemake из них остаётся DAG процессов. Ускорение в задаче о виллизиевом
  круге получено в основном за счёт того, что для каждого задания не запускается процесс и нет файлового ввода-вывода, а не за счёт пакетной обработки. И сквозное обучение помогает лишь тогда, когда этап может выучить то, чего не дало раздельное обучение; здесь этого не произошло. Связанные работы. Neural Module Networks (Andreas et al. 2016) собирают сеть для каждого вопроса из модулей, выбранных парсером, — это DAG, выбираемый для каждого входа; разреженно-гейтированная MoE (Shazeer et al. 2017) и Switch Transformer (Fedus et al. 2021, top-1 маршрутизация и функция потерь балансировки нагрузки, используемые здесь); эксперты по модальностям в LIMoE (Mustafa et al. 2022) и Uni-MoE (Li et al. 2024); сшивание моделей (Lenc & Vedaldi 2015; Bansal et al. 2021) соединяет раздельно обученные сети через обучаемый интерфейс, как это делает этап 2 через векторы вероятностей; дистилляция знаний (Hinton et al. 2015); DSPy (Khattab et al. 2023) сквозным образом оптимизирует целые конвейеры вызовов языковых
  моделей. Pathways от Google (запись в блоге и концепция 2021 года) описывает одну модель, которая направляет каждую задачу через нужные ей части. Данные. MNIST (LeCun, Cortes & Burges; LeCun et al. 1998), лицензия CC BY-SA 3.0: 3000 обучающих изображений (300 на цифру) и 1000 тестовых изображений (100 на цифру), первые для каждой цифры в порядке следования в файле, упакованные как uint8 (0.7 MB, data/mnist_train.npz, data/mnist_test.npz, распространяется под той же лицензией; в data/SOURCES.md указаны источник, контрольные суммы и обработка). Тексты генерируются: одно слово операции (plus, minus, times), одно числительное (от zero до nine) и одно слово-заполнитель (now, then) в случайном порядке; тестовые тексты используют фиксированный сид. Устройство и ограничения. Прилагаемые числа получены в запуске по умолчанию на CPU (в окружении проекта здесь нет сборки PyTorch с CUDA; при примерно $10^5$ весах GPU не помог бы): около 75–150 s обучения и измерений плюс GIF на загруженной 6-ядерной
  машине. Все сиды обучаются вместе по оси моделей, каждый на своих мини-батчах, и на графиках показан каждый сид. Игрушечный пример с одной цифрой и тремя операциями: он показывает структуру, а не поведение больших мультимодальных MoE.'
meanings:
- граф правил, разобранный из data/Snakefile парсером из medical/cow_workflow_dag, плюс входная функция `routed` (условное ребро classify ← fuse)
- 'блок на уровне заданий: кронекерово произведение из cow_workflow_dag ($I$, $\mathbb 1$, $\mathbb 1^\top$ для каждой оси подстановки sample, op); для условного ребра он маскируется маршрутизатором, так что задание $n$ правила classify читает задание $(n, e)$ правила fuse тогда и только тогда, когда $G_{ne} = 1$'
- 'маршрутизатор рабочего процесса: one-hot слова операции, найденный правилом (входной функцией), а не выученный'
- 'задания, от которых зависит цель, $\mathrm{need}_r = \bigvee_s M^{sr\top}\mathrm{need}_s$: лишь $N$ из $N E$ заданий fuse'
- 'движок: правила уровень за уровнем, каждое — ОДИН пакетный вызов по нужным ему заданиям (fuse: один вызов на каждое значение подстановки $op$)'
- образец $n$ в слот $c$ эксперта $e$ (его ранг среди образцов, направленных туда), как в GShard/Switch; ёмкость $C$ = наибольшая группа
- все эксперты в одном пакетном произведении; $m$ — ось моделей (сидов), по ней никогда не суммируется
- 'объединение: по $e$ и $c$ суммируется, на образец приходится одно ненулевое слагаемое, поэтому при $g = G$ результат равен выходу DAG'
- 'обучаемый маршрутизатор: softmax линейного гейта на текстовых признаках; top-1 маршрутизация, выход масштабируется на $p$'
- 'балансировка нагрузки Switch: $f_e$ = доля, направленная к $e$, $P_e$ = средняя вероятность гейта; 1 при сбалансированном и равномерном распределении, $E$ при коллапсе'
- дистилляция по Hinton при температуре $T$; функция потерь студента — $0.9\,\mathcal L_{\mathrm{KD}} + 0.1$ перекрёстной энтропии по истинному ответу
- симметричный int8 по выходным каналам, $s_o = \max_i |W_{io}|/127$; хранится как int8 + один масштаб float32 на канал
labels:
  seeds: Сиды (модели на оси моделей)
  split_steps: Шаги этапа 2 (каждый эксперт на своей подзадаче)
  router_steps: Шаги этапа 1b (обучаемый маршрутизатор)
  global_steps: Шаги этапа 3 (сквозное дообучение)
  student_steps: Шаги этапа 4 (дистилляция)
  student_hidden: Ширина студента $H$
  temperature: Температура дистилляции $T$
  balance_weight: Вес балансировки нагрузки $\alpha$
