source_hash: b7086dad7034
title: Брусок на наклонной плоскости с трением
summary: Сила тяжести, сила нормальной реакции и трение, действующие на брусок, разложены по единичным векторам вдоль склона и по нормали для каждой плоскости с помощью проекций einsum. Набор углов наклона показывает порог трения покоя $\tan\theta = \mu_s$.
notes: 'Сила трения покоя принимает любое нужное значение вплоть до $\mu_s N$, поэтому брусок, отпущенный из состояния покоя, остаётся на месте, пока $\tan\theta \le \mu_s$. Как только он начинает скользить, действует трение скольжения $\mu_k N$ (при $\mu_k \le \mu_s$), ускорение постоянно, и пройденный путь растёт как $\tfrac12 at^2$, пока брусок не достигнет низа. Брусок считается точкой: не опрокидывается и не катится.'
meanings:
- единичный вектор вниз по склону плоскости $b$, $(\cos\theta, -\sin\theta)$
- единичная нормаль плоскости $b$, $(\sin\theta, \cos\theta)$
- вектор силы тяжести $(0, -g)$
- 'повторяющийся индекс ⇒ суммирование: составляющая силы тяжести, направленная в плоскость'
- сила реакции на единицу массы, компенсирует составляющую силы тяжести в плоскость
- трение покоя, если оно может удержать брусок, иначе трение скольжения $\mu_k N$
- 'ускорение вдоль склона: $g(\sin\theta - \mu_k\cos\theta)$ или 0'
labels:
  mu_static: Коэффициент трения покоя $\mu_s$
  mu_kinetic: Коэффициент трения скольжения $\mu_k$ ($\le \mu_s$)
  n_ramps: Плоскости
  min_angle: Наименьший угол
  max_angle: Наибольший угол
  ramp_length: Длина плоскости
  g: Ускорение свободного падения $g$
  t_max: Время моделирования
