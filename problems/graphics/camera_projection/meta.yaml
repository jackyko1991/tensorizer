  fov: {default: 50.0, min: 15, max: 110, step: 5, label: 'Field of view', unit: °}
  distance: {default: 6.5, min: 4.5, max: 15, step: 0.5, label: Camera distance}
  height_cam: {default: 2.5, min: 0.5, max: 6, step: 0.25, label: Camera height}
  width: {default: 320, min: 160, max: 640, step: 16, type: int, label: Image width, unit: px}
  height: {default: 240, min: 120, max: 480, step: 16, type: int, label: Image height, unit: px}
  frames: {default: 72, min: 12, max: 120, step: 6, type: int, label: Frames per orbit}
