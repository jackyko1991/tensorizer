<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Rule 30 as a lookup table: the eight three-cell neighbourhoods from 111 to 000 with the new centre cell below each, 0 0 0 1 1 1 1 0; below, a row of cells where the neighbourhood of cell i, with code k, gives the new cell in the next row">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <text x="120" y="14" text-anchor="middle" font-size="12" fill="#374151">rule <tspan font-style="italic">r</tspan> = 30 = 00011110₂</text>
    <!-- 8 neighbourhoods, 7 px cells, groups every 28 px from x = 10 -->
    <g stroke="#374151" stroke-width="1">
      <!-- 111 -->
      <rect x="10" y="24" width="7" height="7" fill="#2563eb"/><rect x="17" y="24" width="7" height="7" fill="#2563eb"/><rect x="24" y="24" width="7" height="7" fill="#2563eb"/>
      <rect x="17" y="33" width="7" height="7" fill="#ffffff"/>
      <!-- 110 -->
      <rect x="38" y="24" width="7" height="7" fill="#2563eb"/><rect x="45" y="24" width="7" height="7" fill="#2563eb"/><rect x="52" y="24" width="7" height="7" fill="#ffffff"/>
      <rect x="45" y="33" width="7" height="7" fill="#ffffff"/>
      <!-- 101 -->
      <rect x="66" y="24" width="7" height="7" fill="#2563eb"/><rect x="73" y="24" width="7" height="7" fill="#ffffff"/><rect x="80" y="24" width="7" height="7" fill="#2563eb"/>
      <rect x="73" y="33" width="7" height="7" fill="#ffffff"/>
      <!-- 100 -->
      <rect x="94" y="24" width="7" height="7" fill="#2563eb"/><rect x="101" y="24" width="7" height="7" fill="#ffffff"/><rect x="108" y="24" width="7" height="7" fill="#ffffff"/>
      <rect x="101" y="33" width="7" height="7" fill="#2563eb"/>
      <!-- 011 -->
      <rect x="122" y="24" width="7" height="7" fill="#ffffff"/><rect x="129" y="24" width="7" height="7" fill="#2563eb"/><rect x="136" y="24" width="7" height="7" fill="#2563eb"/>
      <rect x="129" y="33" width="7" height="7" fill="#2563eb"/>
      <!-- 010 -->
      <rect x="150" y="24" width="7" height="7" fill="#ffffff"/><rect x="157" y="24" width="7" height="7" fill="#2563eb"/><rect x="164" y="24" width="7" height="7" fill="#ffffff"/>
      <rect x="157" y="33" width="7" height="7" fill="#2563eb"/>
      <!-- 001 -->
      <rect x="178" y="24" width="7" height="7" fill="#ffffff"/><rect x="185" y="24" width="7" height="7" fill="#ffffff"/><rect x="192" y="24" width="7" height="7" fill="#2563eb"/>
      <rect x="185" y="33" width="7" height="7" fill="#2563eb"/>
      <!-- 000 -->
      <rect x="206" y="24" width="7" height="7" fill="#ffffff"/><rect x="213" y="24" width="7" height="7" fill="#ffffff"/><rect x="220" y="24" width="7" height="7" fill="#ffffff"/>
      <rect x="213" y="33" width="7" height="7" fill="#ffffff"/>
    </g>
    <g font-size="10" fill="#6b7280" text-anchor="middle">
      <text x="20" y="52">7</text><text x="48" y="52">6</text><text x="76" y="52">5</text><text x="104" y="52">4</text>
      <text x="132" y="52">3</text><text x="160" y="52">2</text><text x="188" y="52">1</text><text x="216" y="52">0</text>
    </g>
    <!-- highlight code k = 4 (100) -->
    <rect x="91" y="21" width="27" height="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <!-- a line of cells, 14 px, from x = 36 -->
    <g stroke="#374151" stroke-width="1.2">
      <rect x="16" y="86" width="14" height="14" fill="#ffffff"/><rect x="30" y="86" width="14" height="14" fill="#2563eb"/>
      <rect x="44" y="86" width="14" height="14" fill="#2563eb"/><rect x="58" y="86" width="14" height="14" fill="#ffffff"/>
      <rect x="72" y="86" width="14" height="14" fill="#ffffff"/><rect x="86" y="86" width="14" height="14" fill="#2563eb"/>
      <rect x="100" y="86" width="14" height="14" fill="#ffffff"/>
      <rect x="58" y="114" width="14" height="14" fill="#2563eb"/>
    </g>
    <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <rect x="16" y="114" width="98" height="14"/>
    </g>
    <rect x="42" y="83" width="46" height="20" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M65,104 L65,112" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow)"/>
    <path d="M88,80 C112,72 126,60 121,44" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#flow)"/>
    <text x="130" y="98" font-size="13"><tspan font-style="italic">k</tspan> = 100₂ = 4</text>
    <text x="130" y="126" font-size="13"><tspan font-style="italic">x′<tspan baseline-shift="sub" font-size="10">i</tspan></tspan> = <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">30, 4</tspan> = 1</text>
    <text x="65" y="150" text-anchor="middle" font-size="11" fill="#6b7280">next generation</text>
  </g>
</svg>
