source_hash: 955b219d37d6
title: Химическое равновесие минимизацией энергии Гиббса
summary: Что получается в метано-воздушном пламени? При фиксированных $T$ и $P$ продукты устанавливаются там, где энергия Гиббса $G = \sum_j n_j \mu_j$ минимальна при условии сохранения каждого элемента, $A_{ij} n_j = b_i$. Пакетный метод Ньютона (метод RAND) решает задачу для 10 веществ сразу при целом диапазоне температур, показывает, как CO₂ и H₂O распадаются на CO, H₂, OH, H и O по мере нагрева газа, и находит адиабатическую температуру пламени.
notes: 'Почему минимизировать $G$? При постоянных $T$ и $P$ второй закон гласит, что закрытая система может только понижать свою энергию Гиббса, поэтому равновесие — это наименьшее значение $G$, сохраняющее каждый атом: условная минимизация. С множителями Лагранжа $\pi_i$ (по одному на элемент) условие имеет вид $\mu_j/RT = \sum_i \pi_i A_{ij}$: химический потенциал каждого вещества равен сумме «элементных потенциалов» его атомов. Это заменяет список констант равновесия (по одной на реакцию) одной оптимизацией по всем веществам — так программы вроде NASA CEA, STANJAN и Cantera рассчитывают пламена, выхлоп ракет и атмосферы. Решатель здесь — метод RAND в форме Гордона–Макбрайда (NASA RP-1311): метод Ньютона по $\ln n_j$, сведённый к малой системе $(E{+}1)\times(E{+}1)$ для $\pi_i$ и $\Delta\ln n_{tot}$, с ограничением шага, так что основные вещества меняются не более чем в $e^2$ раз за шаг. Работа с логарифмами сохраняет следовые вещества с мольной долей $10^{-30}$ положительными и точными.
  Консоль выводит две проверки оптимальности (баланс элементов и $\mu_j/RT = \pi_i A_{ij}$, обе около машинной точности) и проверку через autograd: дифференцирование $G/RT$ в torch возвращает $\pi_i A_{ij}$. На что смотреть: ниже примерно 1500 K продукты — только CO₂, H₂O и N₂ (плюс O₂ в бедной смеси); выше 2000 K они диссоциируют (CO₂ → CO + ½O₂, H₂O → OH + ½H₂, затем на атомы), потому что энтропийный член $-T\,S$ побеждает энтальпию связей. Диссоциация поглощает теплоту, поэтому равновесное пламя примерно на 100 K холоднее пламени, продукты которого остались бы целыми (справа внизу), а самое горячее пламя горит в слегка богатой смеси относительно стехиометрии. Повысьте $P$, чтобы увидеть принцип Ле Шателье: выгодно меньшее число молекул, поэтому диссоциация подавляется. Данные: $\Delta_f H^\circ$(298 K) и $S^\circ$(298 K) — округлённые значения из таблиц NIST-JANAF. Теплоёмкости — иллюстративные константы (примерно средняя $c_p$ от 298 до 2000 K), а не табулированные функции $T$, поэтому
  составы полуколичественные: эта модель даёт $T_{ad} \approx 2260$ K для стехиометрической метано-воздушной смеси при 1 бар, тогда как точная термохимия даёт около 2225 K. Упрощения: идеальные газы, без конденсированных фаз (без сажи, без жидкой воды), без CH₄ и других углеводородов среди продуктов, и только равновесие: в реальных пламенах CO и NO «замораживаются» кинетикой, а не термодинамикой.'
meanings:
- атомы элемента $i$ (C, H, O, N) в веществе $j$ (CO₂, H₂O, CO, H₂, O₂, N₂, OH, H, O, NO)
- атомы, подаваемые с CH₄ + $(2/\varphi)$(O₂ + 3.76 N₂), по одной строке на коэффициент эквивалентности $\varphi$
- 'пакет: каждая температура — независимая минимизация, решаемая вместе с остальными'
- $[H_j(T) - T S_j(T)]/RT$ из $\Delta_f H^\circ$, $S^\circ$ и постоянной $c_p$
- 'повторяющийся $j$ ⇒ суммирование: энергия Гиббса каждой смеси'
- наличное число атомов каждого элемента; в решении равно $b_i$
- 'суммирование по $j$: матрица Ньютона, взвешенная $A\,\mathrm{diag}(n)\,A^{\mathsf T}$ для каждой строки'
- одна малая система $(E{+}1)\times(E{+}1)$ на температуру, все решаются одним вызовом
- $-\mu_{bj}/RT + \pi_{bi}A_{ij} + \Delta\ln n_{\mathrm{tot}}$, суммирование по $i$; с демпфированием как в NASA CEA
- 'проверка autograd: в минимуме равно $\pi_{bi}A_{ij}$ (условие Лагранжа)'
- 'энтальпия продуктов; бисекция по $T$, пока она не сравняется с энтальпией реагентов: $T_{ad}$'
labels:
  phi: Коэффициент эквивалентности $\varphi$ (топливо / стехиометрическое топливо)
  P_bar: Давление $P$
  T_max: Наибольшая температура диапазона
