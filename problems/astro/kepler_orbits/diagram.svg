<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Kepler orbit: a planet on an ellipse with semi-major axis a around a star at one focus, sweeping a shaded area in a time interval">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- area swept in a time interval, near perihelion -->
    <path d="M183.5,80 L200,80 A90,52 0 0 0 155,35.1 Z" fill="#93c5fd"/>
    <!-- orbit: ellipse centred at (110,80), a = 90, b = 52, so the focus is 73.5 from the centre -->
    <ellipse cx="110" cy="80" rx="90" ry="52" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- semi-major axis -->
    <line x1="20" y1="80" x2="200" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="20" y1="94" x2="110" y2="94" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="20" y1="89" x2="20" y2="99" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="110" y1="89" x2="110" y2="99" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="60" y="112" font-style="italic">a</text>
    <!-- radius vector -->
    <line x1="183.5" y1="80" x2="79.2" y2="31.1" stroke="#374151" stroke-width="1.5"/>
    <text x="128" y="46" font-style="italic">r</text>
    <!-- star at a focus -->
    <circle cx="183.5" cy="80" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="177" y="108" font-style="italic">M</text>
    <!-- planet and its velocity (tangent to the ellipse) -->
    <circle cx="79.2" cy="31.1" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="71" y1="32.8" x2="42" y2="38.9" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="30" font-style="italic" fill="#b91c1c">v</text>
    <text x="205" y="64" font-size="13" fill="#1e40af" font-style="italic">ΔA</text>
  </g>
</svg>
