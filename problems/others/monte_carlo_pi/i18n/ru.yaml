source_hash: a88c161966b6
title: 'Монте-Карло: оценка $\pi$ случайными дротиками'
summary: 'Бросайте случайные дротики в единичный квадрат и считайте, сколько попало внутрь четверти круга: доля стремится к $\pi/4$. Множество независимых экспериментов идут бок о бок в одном тензоре $(B, N)$, что показывает определяющий закон метода Монте-Карло: ошибка убывает лишь как $1/\sqrt N$. Игла Бюффона даёт вторую оценку, из XVIII века.'
notes: 'Каждая оценка верна в среднем, но зашумлена, а шум убывает лишь как $1/\sqrt N$: в сто раз больше дротиков ради одной лишней верной цифры. Эта скорость не зависит от размерности, поэтому метод Монте-Карло — метод выбора для интегралов по многим переменным, от переноса нейтронов и модели Изинга до оценки опционов и траекторий фотонов в медицинской дозиметрии. Серые кривые — отдельные эксперименты: каждая блуждает, но все остаются в полосе, заданной $\sigma_N$. Фиксированные зёрна делают каждый запуск воспроизводимым; попробуйте больше экспериментов, чтобы увидеть, как разброс точнее совпадает с теорией.'
meanings:
- дротик $n$ эксперимента $b$, координата $i$, равномерно в $[0, 1)$
- 'повторяющийся $i$ ⇒ суммирование: квадрат расстояния от угла; 1, если дротик внутри четверти круга'
- 'кумулятивная сумма, делённая на $n$: оценка после каждого дротика для каждого эксперимента'
- разброс по экспериментам; теория $\sqrt{\pi(4-\pi)/n}$ из биномиальной дисперсии
- 'игла Бюффона: пересекает линию с вероятностью $2\ell/(\pi d)$, поэтому $\hat\pi = 2\ell N/(d\,\text{crossings})$'
labels:
  n_darts: Дротиков на эксперимент $N$
  n_experiments: Экспериментов $B$
  needle_length: Длина иглы $\ell/d$
