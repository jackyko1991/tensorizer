title: अणुओं के लिए ग्राफ़ न्यूरल नेटवर्क (संदेश प्रेषण)
summary: 'अणु एक ग्राफ़ है, और संदेश-प्रेषण (message-passing) न्यूरल नेटवर्क उसके संलग्नता आव्यूह पर कुछ einsum हैं: हर परमाणु बार-बार अपने पड़ोसियों की अवस्थाओं का योग करता है, $s_{mic} = A_{mij}h_{mjc}$, और अणु का पूर्वानुमान परमाणुओं पर एक योग है। यादृच्छिक संयुग्मित हाइड्रोकार्बनों की ह्यूकेल π-इलेक्ट्रॉन ऊर्जा का पूर्वानुमान करने के लिए प्रशिक्षित, यह परमाणुओं की संख्यांकन चाहे जैसी हो एक ही उत्तर देता है, और प्रशिक्षण में देखे गए किसी भी अणु से बड़े अणुओं पर भी काम करता है, जहाँ संलग्नता आव्यूह पर एक साधारण MLP विफल होता है।'
notes: 'आँकड़े जानबूझकर कृत्रिम हैं, ताकि सही उत्तर ठीक-ठीक ज्ञात हो। हर “अणु” एक यादृच्छिक हाइड्रोजन-रहित कार्बन ढाँचा है (प्रति कार्बन अधिकतम तीन पड़ोसियों वाला एक वृक्ष, कुछ 5- और 6-सदस्यीय वलयों में बंद): ग्राफ़-सैद्धांतिक खिलौने, वास्तविक यौगिकों का चुना हुआ समुच्चय नहीं। इसका लेबल ह्यूकेल π-इलेक्ट्रॉन ऊर्जा है: $H = \alpha + \beta A$ और प्रति कार्बन एक π इलेक्ट्रॉन के साथ, जो $A$ के उच्चतम आइगेनमान $\lambda_k$ वाले कक्षकों को भरते हैं, $E_\pi = N\alpha + \beta\,\sum_k o_k\lambda_k$, और नेटवर्क केवल ग्राफ़ से $y = \sum_k o_k\lambda_k$ सीखता है। यह कभी कोई आइगेनमान नहीं देखता। टेंसर पाठ यह है कि ग्राफ़ न्यूरल नेटवर्क को केवल एक नई संक्रिया चाहिए, संलग्नता पर einsum $A_{mij}h_{mjc}$, जो हर अणु के हर परमाणु के पड़ोसियों की अवस्थाओं का एक साथ योग करता है। सभी भार एक समय में एक परमाणु पर कार्य करते हैं, और परमाणु केवल $A$ और अंतिम योग के माध्यम से जुड़ते हैं, इसलिए मॉडल रचना से ही क्रमचय-निश्चर (permutation invariant) है और वही भार किसी भी आकार के अणु पर लागू होते हैं। कंसोल दोनों गुण दिखाता
  है: परमाणुओं को पुनः लेबल करने से GNN आउटपुट लगभग $10^{-6}$ (float32 पूर्णांकन) बदलता है और MLP आउटपुट $|\beta|$ की पूरी इकाइयों से; 11–16 कार्बन वाले अणुओं पर, जो प्रशिक्षण के किसी भी अणु से बड़े हैं, MLP ने अपने इनपुट की अतिरिक्त पंक्तियों में कभी कुछ नहीं देखा और विफल होता है, जबकि GNN की त्रुटि मुश्किल से बढ़ती है। “बंध गणना” आधार रेखा $aN + bN_{bonds} + c$ से तुलना करें: π ऊर्जा लगभग योगात्मक है (प्रति कार्बन लगभग $1.2|\beta|$), और GNN का असली काम शाखन, वलयों और विषम इलेक्ट्रॉनों से आने वाले सुधार हैं, जहाँ यह त्रुटि को लगभग आधा करता है। संदेशों के चार चक्र केवल चार बंधों तक पहुँचते हैं, इसलिए पूरे संयुग्मित तंत्र पर निर्भर प्रभाव (ऐरोमैटिकता, 4n-वलय) केवल लगभग सीखे जाते हैं। यह Gilmer et al. (ICML 2017) का message-passing neural network (MPNN) ढाँचा है, जिन्होंने दिखाया कि कई पुराने आण्विक ग्राफ़ नेटवर्क इस पैटर्न में आते हैं और उन्हें QM9 अणुओं के DFT गुणों पर प्रशिक्षित किया। इस परिवार के मॉडल (SchNet, DimeNet, NequIP या MACE जैसे समतुल्य (equivariant) नेटवर्क जो 3D ज्यामिति भी
  उपयोग करते हैं) आज आण्विक गुणों के पूर्वानुमान और अंतरापरमाण्विक विभवों के फ़िट के लिए व्यापक रूप से उपयोग होते हैं, पर वे अपने प्रशिक्षण आँकड़ों जितने ही अच्छे हैं और उनसे भिन्न रसायन पर विफल हो सकते हैं। 1 परत (केवल निकटतम पड़ोसी), कम प्रशिक्षण अणु, या संकरा नेटवर्क आज़माएँ।'
meanings:
- अणु $m$ के कार्बन ढाँचे की संलग्नता, $N = 16$ परमाणुओं तक शून्यों से भरी
- 'परमाणु विशेषताएँ: कार्बन पड़ोसियों की संख्या (1, 2 या 3) का one-hot'
- 'लक्ष्य: $A$ के भरे ह्यूकेल आइगेनमान (eigvalsh), $|\beta|$ की इकाइयों में π ऊर्जा'
- '$f$ पर योग: हर परमाणु को $C$ चैनलों में अंतःस्थापित करना'
- 'दोहराया गया $j$ ⇒ परमाणु $i$ के पड़ोसियों पर योग: संदेश'
- '$c$ पर योग: हर अणु के हर परमाणु के लिए वही भार'
- प्रति परमाणु एक सीखी गई ऊर्जा (अणु पर रंग)
- '$i$ वास्तविक परमाणुओं पर योग: आकार-विस्तारी (size-extensive) और परमाणु क्रम से स्वतंत्र'
- 'परमाणुओं को पुनः लेबल करना: GNN आउटपुट float परिशुद्धता तक वही रहता है'
- 'आधार रेखा: 256 चपटी संलग्नता प्रविष्टियों पर एक निश्चित-आकार नेटवर्क'
