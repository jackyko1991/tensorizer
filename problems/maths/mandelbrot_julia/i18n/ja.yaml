source_hash: 88e5f57d0eb4
title: マンデルブロ集合とジュリア集合
summary: 複素ピクセルの格子全体に対して $z \mapsto z^2 + c$ を一度に反復する。軌道が有界にとどまる点は、マンデルブロ集合 $M$（$c$ を変え、$z_0 = 0$ から始める）または充填ジュリア集合 $K_c$（$c$ を固定し、ピクセルから始める）をなす。滑らかな脱出回数と導関数による距離推定により、タツノオトシゴの谷へのズームの奥深くまで画像が鮮明に保たれ、$c$ が主カージオイドのまわりを回るにつれてジュリア集合は形を変える。
notes: なぜ $|z| > 2$ で脱出とするのか：$|z| > \max(2, |c|)$ なら $|z^2 + c| \ge |z|^2 - |c| > |z|$ となり、軌道は限りなく大きくなる。よって $|c| > 2$ のすべての $c$ は最初のステップで脱出し、$M$ は円板 $|c| \le 2$ の内側にある。ここではより大きな脱出半径 $R = 1000$ を使う。滑らかな回数 $\nu = n + 1 - \log_2 \ln|z_n|$ が正確になるからである：無限遠の近くでは $z \mapsto z^2$ は各ステップで $\ln|z|$ を二倍にし、$\log_2$ がちょうどそれを打ち消す。主カージオイドは $z^* = z^{*2} + c$ が吸引的不動点となる、すなわち $|2z^*| < 1$ となる $c$ の集合である。$2z^* = w$ と書けば $|w| \le 1$ で $c = w/2 - w^2/4$ となる。周期 2 の球は 2 周期軌道が吸引的となるところ、$|4(1+c)| < 1$ である。この二つの部分が $M$ の全面積 $\approx 1.5066$ のうち約 1.37 を占め、その内部のピクセルは決して脱出しない。距離推定 $d = |z_n|\ln|z_n|/|z'_n|$ はポテンシャル $G(c) = \lim 2^{-n}\ln|z_n|$ から $G/|\nabla G|$ として得られる。集合の近くでは真の距離はこの値のおよそ 2 倍の範囲内にある（ケーベの 1/4 定理の帰結）。ジュリアのパネルは $c$ をカージオイドの縁、不動点が中立となるところに置く：$c \in M$ なのでそこでは $K_c$ は常に連結だが、その形は角度ごとにまったく変わる。各ジュリア集合はその $c$ の近くの $M$ に似ており、だから $M$ へのズームには小さなジュリア集合が現れる。約 $10^{-13}$ より深いズームには complex128 の 16 桁では足りない。
meanings:
- ピクセル $p$ ごとに一つの複素数；どの添字についても和をとらず、各ピクセルは独立に動く
- まだ反復中のすべてのピクセルについて二次写像を一ステップ
- 連鎖律：$M$ では $c' = 1$（$c$ についての導関数）、ジュリア集合では $c' = 0$ かつ $z'_0 = 1$（$z_0$ についての導関数）
- $|z_p| > R$ となる最初のステップ；脱出したピクセルはテンソルから除かれるので、計算量は減っていく
- 滑らかな（連続的な）脱出回数：帯の間に色の段差がない
- 距離推定：$d_p$ が 1/4 ピクセル未満のピクセルを暗く描き、細いフィラメントを浮かび上がらせる
- 主カージオイドの厳密判定（周期 2 の球には $|c+1| \le \frac14$）、$q = (x-\frac14)^2 + y^2$
labels:
  target: ズームの目標
  zoom_decades: ズームの深さ（10 のべき）
  resolution: 一辺のピクセル数
  max_iter: 初期の反復回数（10 倍ごとに +150）
  frames: フレーム数
