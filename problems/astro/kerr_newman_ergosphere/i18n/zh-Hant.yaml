source_hash: e53e4d6ab9fa
title: Kerr–Newman 黑洞：視界、動圈與裸奇異點
summary: 廣義相對論結合電磁學後最一般的黑洞，具有質量 $M$、自旋 $a$ 和電荷 $Q$。對整個批次化的 $(M, a, Q)$ 網格，程式計算視界 $r_\pm$、動圈（ergosphere）、參考系拖曳以及赤道面上的 ISCO 和光子軌道（度規導數由自動微分求得）。動畫將自旋和電荷一路掃到並越過極端條件 $a^2 + Q^2 = M^2$：此時視界消失，環狀奇異點將會暴露，而宇宙審查猜想（尚未證明）認為自然界禁止這種情況。
notes: 單位 $G = c = 1$：長度以 $GM/c^2$ 為單位，自旋 $a = J/(Mc)$，電荷採用幾何化單位。已確立的結論（古典廣義相對論）：Kerr–Newman 度規（Newman et al. 1965）是 Einstein–Maxwell 方程式的解，其視界是 $\Delta$ 的根；動圈是任何觀測者都無法保持靜止的區域，位於 $r_+$ 與 $r_E(\theta)$ 之間，並在兩極與視界相接。在動圈內，參考系拖曳迫使一切物體共轉：綠色曲線以零角動量落入，卻仍被帶著繞轉。順行軌道緊貼黑洞：對於 Kerr 黑洞，ISCO 從 $a = 0$ 時的 $6M$ 變為 $a = M$ 時的 $M$（順行）和 $9M$（逆行），與 Bardeen、Press 和 Teukolsky (1972) 一致；極端 Reissner–Nordström 黑洞的 ISCO 為 $4M$。當 $a^2 + Q^2 > M^2$ 時，公式仍給出一個度規，但沒有視界，並在 $r = 0$、$\theta = \pi/2$ 處存在裸露的環狀奇異點（以紅色繪出）。Penrose 的弱宇宙審查猜想認為重力塌縮永遠不會產生裸奇異點；它在一般情況下尚未得到證明（已知反例需要精細調節的初始資料或額外維度），而藉由投入粒子使極端黑洞超自旋或超電荷的嘗試，在計入二階微擾效應後似乎都會失敗（Sorce and Wald 2017）。真實黑洞的 $Q \approx 0$（電荷會很快被中和），而測得的自旋（最高約 $0.95$–$0.99\,M$）都低於極端值。赤道面板以 Boyer–Lindquist 座標 $r$ 作為半徑；在此圖中，落入的綠色曲線的 $\varphi$ 在 $r_+$ 處無界地纏繞，這是一種座標效應。
meanings:
- 將質量、自旋和電荷的每種組合作為一個批次，$G = c = 1$
- $\Delta = 0$ 的根；當 $a^2 + Q^2 > M^2$（裸奇異點）時為 NaN
- 靜止極限 $g_{tt} = 0$，在影格 $\times$ 極角上廣播
- Boyer–Lindquist 度規中旋轉的 $(t, \varphi)$ 分塊
- 零角動量觀測者的角速度；視界處 $\Omega_H = a/(r_+^2 + a^2)$
- 藉由自動微分在半徑網格上求度規導數
- 圓軌道的角速度與能量；ISCO 位於 $E$ 的最小值處，光子軌道位於軌道需要速度 $c$ 之處
- 表面重力，$T_H = \kappa/2\pi$；極端黑洞為零
labels:
  angle: 混合角 $\psi$（$0°$ 為純自旋，$90°$ 為純電荷）
  chi_max: 掃描上限 $\sqrt{a^2 + Q^2}/M$
  frames: 影格數
  grid: 批次 $(a, Q)$ 掃描中每個軸的網格點數
