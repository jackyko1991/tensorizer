source_hash: 6bb6cb4a204f
title: 質點–彈簧布料
summary: 以結構彈簧、剪切彈簧與彎曲彈簧相連的方形質點網格，固定兩個角後在重力下釋放。關聯矩陣 $D_{ea}$ 把網格化為張量：一次 einsum 求出每條彈簧向量，另一次加總每個節點所受的力。
notes: 沿對角線的剪切彈簧防止方格塌成菱形，跳過一個節點的彈簧則賦予布料一些抗彎剛度。兩個固定角的加速度直接設為零。空氣阻尼 $\gamma$ 是唯一的損耗，因此總能量只會減少（$dE/dt = -m\gamma\lvert\mathbf v\rvert^2$），$\gamma = 0$ 時則守恆。彈簧很硬，所以時間步長受 $\sqrt{m/k}$ 限制。忽略自身碰撞。每個節點質量 10 g，網格間距 10 cm。
meanings:
- 節點 $a$ 的位置；共 $N = n^2$ 個質點
- 關聯矩陣：彈簧 $e$ 兩端分別為 $-1$ / $+1$
- 重複的 $a$ ⇒ 求和：沿每條彈簧的向量
- 目前的彈簧長度；$\ell^0_e$ 為原長
- 重複的 $e$ ⇒ 求和：節點 $a$ 所受的彈簧淨力
- 同一個和，改以對邊列表 scatter 計算
- 動能 + 彈性位能 + 重力位能
labels:
  n_side: 每邊質點數
  k: 彈簧常數 $k$
  damping: 空氣阻尼 $\gamma$
  t_max: 模擬時間
