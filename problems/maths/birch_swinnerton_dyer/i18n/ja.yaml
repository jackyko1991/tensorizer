title: Birch と Swinnerton-Dyer：mod p で点を数える
summary: 階数 0 から 4 の 5 本の楕円曲線について、$X$ 以下のすべての素数に対する $\mathbb F_p$ 上の点の個数を一度に数え、Birch と Swinnerton-Dyer が最初に観察したとおり積 $\prod_{p\le X} N_p/p$ が $(\log X)^r$ のように増大する様子を見て、$s = 1$ での $L(E, s)$ を計算する。そこでの零点の位数は階数に等しい。これが常に成り立つという予想は未解決であり、証明されているのは解析的階数が 0 と 1 の場合だけである。
notes: '$\mathbb Q$ 上の楕円曲線 $E: y^2 + a_1xy + a_3y = x^3 + a_2x^2 + a_4x + a_6$ の有理点群は有限生成である：$E(\mathbb Q) \cong \mathbb Z^r \oplus T$（Mordell 1922）。階数 $r$ の計算は難しい。1960 年代初頭、Birch と Swinnerton-Dyer は EDSAC コンピュータで素数を法とする点の個数を数え、$\prod_{p \le X} N_p/p$ が $(\log X)^r$ のように増大することに気づいた。有理点が多ければ、mod $p$ の点も多くならざるをえない。彼らは、$a_p$ から作られる $L(E, s)$ が $s = 1$ でちょうど位数 $r$ の零点をもち、その主係数が $\frac{L^{(r)}(E,1)}{r!} = \frac{\Omega\, R\, \#\text{Ш}\, \prod_p c_p}{\#T^2}$ であると予想した。これはクレイ数学研究所のミレニアム懸賞問題の一つであり、未解決である。証明されていること：解析的階数が 0 または 1 ならば、階数はそれに等しく Ш は有限である（Gross と Zagier 1986、Kolyvagin 1989）。その証明にはモジュラー性（Wiles、Taylor–Wiles 1995、Breuil–Conrad–Diamond–Taylor 2001）が使われ、そもそも $L(E, s)$ を $s = 1$ まで接続できるのはモジュラー性のおかげである。解析的階数 $\ge 2$ については一般的なことは何も知られていない。5 本の曲線は、階数 0 から 4 のそれぞれで導手が最小の曲線である（Cremona の表の 11a1、37a1、389a1、5077a1、234446a1）。ここで確かめること：トレースは Hasse の評価 $|a_p| \le 2\sqrt p$ を満たす。11a1 ではそれらはモジュラー形式 $\eta(q)^2\eta(q^{11})^2$ の係数に一致する（テスト済み）。根数は $\varepsilon = (-1)^r$ である。$s = 1$ で最初に消えない導関数はどの曲線でも $r$ 階であり、$L(E,1)
  = 0.2538418608\ldots$、$L''(E,1) = 0.3059997738\ldots$、$L''''(E,1)/2 = 0.7593165\ldots$、$L''''''(E,1)/6 = 1.7318499\ldots$ は LMFDB と一致する。11a1 では完全な公式も確かめられる：$L(E,1)/\Omega = 1/5 = \#\text{Ш}\cdot c_{11}/\#T^2 = 1 \cdot 5 / 5^2$。導関数が数値的に 0 になることは証拠であって、それが消えることの証明ではない。部分積は元々のヒューリスティックである：Goldfeld（1982）は、もしそれが本当に $C(\log X)^r$ のように振る舞うならば、$r$ は解析的階数であり $L(E, s)$ に対してリーマン予想が成り立つことを示した。したがってその収束自体が予想的であり、しかも遅い。傾きは $X = 2\times 10^4$ までに階数 0 から 3 を正しく並べるが、階数 4 の曲線は $X = 3\times 10^4$ でもまだその階数に届かない。$a_p/2\sqrt p$ の佐藤–Tate 分布、すなわち半円分布 $\frac{2}{\pi}\sqrt{1-x^2}$ は、虚数乗法をもたない曲線に対しては定理である（Taylor らによる、2008–2011）。'
meanings:
- すべての曲線、ブロック内のすべての素数、すべての $x \in \mathbb F_p$ を一度に（Horner 法、各ステップで mod $p$ で簡約）
- 平方の表 $y^2 \bmod p$ から得る Legendre 記号。$v = 0$ では $\chi = 0$
- Frobenius トレース。Hasse：$|a_p| \le 2\sqrt p$
- すべての $X$ に対する部分積を一度に（良い素数のみ）
- $\sqrt{X} \le p \le X$ での傾き。収束は非常に遅い
- 乗法性による Dirichlet 係数。素数冪 $q = p^k$ ごとにストライド付きスライスを一つ
- 繰り返された $n$ ⇒ 和：Gauss–Legendre 節点 $t = e^{u_m}$ での $F(t)$
- $s = 1$ でのすべての導関数を一度に。最初に 0 でないものが解析的階数を与える
labels:
  x_max: 素数の上限 $X$
