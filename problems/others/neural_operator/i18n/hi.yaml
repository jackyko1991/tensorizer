title: 'फूरिये न्यूरल ऑपरेटर: बर्गर्स समीकरण का हल-ऑपरेटर सीखना'
summary: 'एक समीकरण हल करने के बजाय, फूरिये न्यूरल ऑपरेटर (FNO) एक स्पेक्ट्रल सॉल्वर से बने जोड़ों से श्यान बर्गर्स समीकरण $u_t + u\,u_x = \nu\,u_{xx}$ का पूरा प्रतिचित्रण $u_0(x) \mapsto u(x, T)$ सीखता है। इसकी मुख्य परत स्पेक्ट्रल कनवल्शन है: फूरिये रूपांतरण, जटिल भारों $R_{iok}$ से हर मोड के लिए अलग-अलग चैनल मिलाना, केवल सबसे निचले $m$ मोड रखना, और वापस रूपांतरण। क्योंकि भार फूरिये मोड पर परिभाषित हैं, प्रशिक्षित मॉडल प्रशिक्षण वाले ग्रिड से अधिक बारीक ग्रिड पर भी चलता है।'
notes: 'प्रशिक्षण डेटा जोड़े $(u_0, u(\cdot, T))$ हैं: यादृच्छिक चिकनी प्रारंभिक स्थितियाँ (फूरिये मोड $k \le 5$ का योग, जिनका आयाम $1/k$ की तरह घटता है) और उनके हल, जिन्हें छद्म-स्पेक्ट्रल सॉल्वर से 256 बिंदुओं पर निकाला गया और प्रशिक्षण के लिए 64 बिंदुओं पर उप-नमूनित किया गया। नेटवर्क कभी समीकरण नहीं देखता, केवल सॉल्वर का डेटा देखता है। टेंसर का पाठ स्पेक्ट्रल कनवल्शन है: rfft के बाद हर नमूने $b$ का हर चैनल $i$ फूरिये गुणांक $\hat v_{bik}$ बन जाता है, और einsum(''bik,iok->bok'') इनपुट चैनल $i$ पर योग करता है लेकिन तरंग-संख्या $k$ को मुक्त सूचकांक रखता है, इसलिए हर मोड को अपना $C\times C$ जटिल आव्यूह $R_{\cdot\cdot k}$ मिलता है। यह एक वैश्विक, सीखे गए कर्नेल के साथ कनवल्शन है, जिसे फूरिये स्थान में गुणनफल के रूप में गणना किया जाता है। ऊँचे मोड $k \ge m$ काट दिए जाते हैं; स्थानीय पथ $W_{oi}v_{bix}$ और अरैखिकता $\sigma$ बारीक विवरण वापस लाते हैं। $R_{iok}$, $W_{oi}$, $P$ या $Q$ में से कुछ भी ग्रिड बिंदुओं की संख्या पर निर्भर नहीं है, इसलिए प्रशिक्षित ऑपरेटर $2m$ से अधिक बिंदुओं वाले किसी
  भी ग्रिड पर चलता है: नीचे-दाएँ पैनल में वही भार 256 बिंदुओं पर लगाए गए हैं (ज़ीरो-शॉट सुपर-रिज़ॉल्यूशन), सबसे खड़े अग्रभाग वाले परीक्षण उदाहरण के लिए। 64 बिंदुओं वाले पूर्वानुमान (बिंदु) 256 बिंदुओं वाले वक्र पर पड़ते हैं: यह विविक्तीकरण निश्चरता अनुमानित है, क्योंकि $\sigma$ ऐसे हार्मोनिक बनाती है जो अलग-अलग ग्रिड पर अलग तरह से एलियास होते हैं, फिर भी 256 बिंदुओं पर त्रुटि 64 बिंदुओं वाली त्रुटि के बराबर है। सटीकता को ग्रिड नहीं, मॉडल सीमित करता है: लगभग-शॉक वाले हलों को $m$ से ऊपर के मोड चाहिए और वे सबसे कठिन उदाहरण हैं। इस विषय के PINN से तुलना करें: PINN समीकरण को लॉस फ़ंक्शन में डालकर एक ही समस्या हल करता है, और हर नई प्रारंभिक स्थिति के लिए फिर से प्रशिक्षित करना पड़ता है; न्यूरल ऑपरेटर सॉल्वर डेटा से समस्याओं का पूरा परिवार सीखता है, जिसके बाद हर नया पूर्वानुमान केवल एक फ़ॉरवर्ड पास है। कंसोल इस फ़ॉरवर्ड पास का समय सॉल्वर के सामने छापता है: यहाँ दसियों गुना तेज़, लेकिन 1D बर्गर्स के लिए सॉल्वर पहले से सस्ता है, और डेटा बनाना तथा प्रशिक्षण कहीं अधिक महँगा है। न्यूरल ऑपरेटर वहाँ लाभदायक
  हैं जहाँ एक सिमुलेशन में घंटों लगते हैं (मौसम, विक्षोभ, सरंध्र माध्यम में प्रवाह) और बहुत सारे प्रश्न पूछने होते हैं, और केवल उसी वितरण के भीतर जिस पर उन्हें प्रशिक्षित किया गया। कम मोड $m$, छोटा प्रशिक्षण सेट, या बड़ा $\nu$ (चिकने हल, सीखना आसान) आज़माएँ। सरलीकरण: केवल एक आउटपुट समय $T$, स्थिर सीड, ग्रिड स्थिति एक साधारण इनपुट चैनल के रूप में, और कोई पैडिंग नहीं (डोमेन वैसे भी आवर्ती है)।'
meanings:
- 'इनपुट फ़ंक्शन: नमूने $b$ के $N$ ग्रिड बिंदुओं में से हर एक पर $u_0$ और स्थिति'
- 'लिफ़्ट: $f$ पर योग, हर बिंदु पर 2 विशेषताएँ $C$ चैनल बन जाती हैं'
- हर चैनल $i$, तरंग-संख्या $k$ के जटिल फूरिये गुणांक
- 'जटिल भार, रखे गए हर मोड $k < m$ के लिए एक $C\times C$ आव्यूह: ये $N$ पर निर्भर नहीं करते'
- 'दोहराया गया $i$ ⇒ योग; $k$ पर योग नहीं: हर मोड अलग से मिलाया जाता है'
- 'काट-छाँट: केवल सबसे निचले $m$ फूरिये मोड स्पेक्ट्रल कनवल्शन से गुज़रते हैं'
- 'किसी भी संख्या $N$ के ग्रिड बिंदुओं पर वापस: रिज़ॉल्यूशन यहीं चुना जाता है'
- स्थानीय पथ, हर बिंदु पर वही $C\times C$ आव्यूह; $\sigma$ = GELU
- बिंदुवार दो-परत प्रक्षेपण, $C$ चैनलों से पूर्वानुमानित $u(x, T)$ तक
- 'हर नमूने की सापेक्ष $L^2$ त्रुटि, बैच पर औसत: Adam द्वारा न्यूनतम किया गया लॉस'
- 'डेटा: छद्म-स्पेक्ट्रल सॉल्वर, इंटीग्रेटिंग-फ़ैक्टर RK4 और 2/3 डीएलियासिंग नियम के साथ, सभी नमूने एक साथ'
labels:
  nu: श्यानता $\nu$
  t_final: आउटपुट समय $T$
  n_train: प्रशिक्षण नमूने (प्रारंभिक स्थितियाँ)
  modes: रखे गए फूरिये मोड $m$
  width: चैनल $C$
  epochs: प्रशिक्षण इपॉक
  lr: Adam लर्निंग रेट
