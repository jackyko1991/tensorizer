title: Reading a QR code from a photo
category: graphics
level: advanced
order: 4
summary: >
  Build a version 1–3 QR code from scratch (finder, timing and alignment patterns, BCH format bits, penalty-chosen
  mask, Reed–Solomon over GF(256)), photograph it with a random homography, blur, noise, uneven light and a thumb
  over it, and read it back as a tensor pipeline: adaptive threshold, matched filters for the 1:1:3:1:1 finders,
  DLT homography and grid_sample, BCH and Reed–Solomon decoding with $\mathrm{GF}(2^8)$ arithmetic as table gathers.
animated: true
vector_form: '\bar I = \tfrac{1}{k^2}\,\mathbf 1_{k\times k} \ast I,\ \ D = [\,I < \bar I - c\,] \qquad \mathbf x_{\text{img}} \simeq H\,\mathbf x_{\text{code}},\ \ \hat{\mathbf h} = \arg\min_{\lVert\mathbf h\rVert=1}\lVert A\mathbf h\rVert \qquad c(x) = d(x)\,x^{T} + \big(d(x)\,x^{T} \bmod g(x)\big),\ \ g(x) = \prod_{j=0}^{T-1}(x - \alpha^j)'
index_form: 'R_{bxy} = \min\!\Big(\max_s \sum_t K^{s}_t D^{\pm}_{b,x,y+t},\ \max_s \sum_t K^{s}_t D^{\pm}_{b,x+t,y}\Big) \qquad m_{bij} = D_b\big(H_{b}\,(j{+}\tfrac12,\ i{+}\tfrac12,\ 1)\big) \qquad S_{bj} = \bigoplus_i c_{bi} \otimes \alpha^{j(N-1-i)} \qquad e_{bj} = \bigoplus_i d_{bi} \otimes G_{ij} \qquad a \otimes b = \exp[\log a + \log b]'
translation:
  - {symbol: 'a \otimes b', code: 'gf_mul(a, b) = EXP[LOG[a] + LOG[b]]', shape: 'broadcast', meaning: 'GF(256) product as two table gathers; $\alpha = 2$ generates all 255 non-zero bytes modulo $x^8+x^4+x^3+x^2+1$ (0x11D); $\oplus$ is XOR'}
  - {symbol: '\bigoplus_i', code: 'gf_sum(x, dim)', shape: '(..., N) → (...)', meaning: 'XOR over the summed index $i$: add each of the 8 bit planes modulo 2'}
  - {symbol: 'e_{bj} = \bigoplus_i d_{bi} \otimes G_{ij}', code: 'rs_encode(data, n_ec)', shape: '(B, k) → (B, T)', meaning: 'systematic Reed–Solomon: row $i$ of $G$ is $x^{T+k-1-i} \bmod g(x)$, so the ECC bytes are linear in the data'}
  - {symbol: 'S_{bj}', code: 'syndromes(c, n_ec)', shape: '(B, T)', meaning: 'block polynomial evaluated at $\alpha^j$; all zero exactly for codewords'}
  - {symbol: '\Lambda(x),\ \Omega(x)', code: 'berlekamp_massey(S), rs_decode(...)', shape: '(B, T+1)', meaning: 'error locator by Berlekamp–Massey (batched with torch.where), roots by Chien search over all positions, magnitudes $e = X\,\Omega(X^{-1})/\Lambda''(X^{-1})$ (Forney)'}
  - {symbol: 'f_{15}', code: 'format_code(ecl, mask), format_decode(bits)', shape: '(B, 15)', meaning: 'BCH(15,5) with generator 0x537, XOR 0x5412; nearest of the 32 codewords fixes up to 3 bit errors'}
  - {symbol: 'D_{bxy}', code: 'binarise(img)', shape: '(B, H, W)', meaning: 'dark where the pixel is below its $31\times31$ box mean (conv2d) minus $c$: follows uneven lighting'}
  - {symbol: 'R_{bxy}', code: 'finder_response(dark)', shape: '(B, H, W)', meaning: 'matched filter $K^s$ for the 1:1:3:1:1 profile along rows and columns at 11 scales $s$; peaks are the finder centres (also checked along the diagonals)'}
  - {symbol: 'H_b', code: 'dlt(code_points, img_points)', shape: '(B, 3, 3)', meaning: 'DLT/SVD from 3 finder centres + the alignment pattern (version 1: parallelogram corner), then refined by gradient ascent on the fit to all known modules'}
  - {symbol: 'm_{bij}', code: 'grid_sample(dark, H x)', shape: '(B, n, n)', meaning: 'module $(i, j)$ read at $3\times3$ points inside it; then unmask (XOR, an involution) and read the zig-zag order'}
notes: >
  Real readers such as ZXing follow the same outline: binarise with a local threshold, scan rows for the
  1:1:3:1:1 run pattern of a finder and confirm it across columns and diagonals, pick three finders that form a
  right angle, estimate the module size and version from their spacing, look for an alignment pattern near where
  an affine guess puts it, fit a perspective transform, sample the grid, then decode the format and Reed–Solomon
  layers. Here the homography is also polished by maximising the correlation of the known modules (finders,
  timing, alignment, quiet zone) with the image through grid_sample, and the version is the one whose template
  fits best. The four error-correction levels L, M, Q, H restore roughly 7, 15, 25 and 30 % of the codewords:
  with $T$ ECC bytes a block corrects $\lfloor T/2 \rfloor$ unknown byte errors (twice as many if their positions
  were known, as erasures). A blob covering a share $f$ of the symbol hits more than $f$ of the codewords, because
  every byte is a $2\times4$ block of modules, so the success curves drop below those percentages. Masks only
  touch data modules and $M \oplus M = 0$, so unmasking is the same XOR; the encoder tries all 8 masks as one
  batch and keeps the lowest penalty (runs, $2\times2$ blocks, finder look-alikes, dark balance). Verification:
  the Reed–Solomon encoder reproduces the ECC bytes of the worked example in ISO/IEC 18004 ('01234567' as
  version 1-M) and the format words match the standard table; the rest is checked by round trips and zero
  syndromes. Simplifications: byte mode only, versions 1–3 (one alignment pattern, no version information
  blocks), no mirrored symbols, no erasure decoding. Version 1 has no alignment pattern, so strong perspective
  hurts it most. References: ISO/IEC 18004 (QR code symbology); I. S. Reed and G. Solomon, Polynomial codes over
  certain finite fields, J. SIAM 8 (1960) 300–304.
params:
  message: {default: Reed-Solomon 1960, type: choice, options: [Reed-Solomon 1960, 'Hello, tensors!', QR via PyTorch, x^8+x^4+x^3+x^2+1], label: Message}
  version: {default: 3, min: 1, max: 3, step: 1, type: int, label: 'Smallest version (raised if the message does not fit)'}
  ecc: {default: M, type: choice, options: [L, M, Q, H], label: 'Error-correction level'}
  perspective: {default: 0.1, min: 0.0, max: 0.2, step: 0.02, label: 'Perspective strength (corner shift / side)'}
  occlusion: {default: 0.08, min: 0.0, max: 0.4, step: 0.02, label: 'Occluded share of the symbol'}
  noise: {default: 0.05, min: 0.0, max: 0.2, step: 0.01, label: 'Pixel noise $\sigma$'}
