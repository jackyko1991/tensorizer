title: CNN और विशेषज्ञ नियंत्रकों के मिश्रण द्वारा खेला गया स्नेक
summary: 'दो हिस्सों से बना एक गेम खेलने वाला एजेंट: एक छोटा CNN जो बोर्ड को देखता है और एक नियंत्रण नेटवर्क जो चाल चुनता है; यहाँ यह विशेषज्ञों का मिश्रण (mixture of experts) है, जिसका राउटर हर गेम को $K$ छोटे विशेषज्ञ नेटवर्कों में से एक के पास भेजता है। गेम $10 \times 10$ ग्रिड पर स्नेक है, जो पूरी तरह टेंसरों में लिखा गया है ताकि गेमों का एक बैच एक ही चरण में आगे बढ़े। नियंत्रक एक योजनाकार शिक्षक (चौड़ाई-प्रथम खोज और फ़्लड फ़िल, ये भी टेंसर संक्रियाएँ) की नकल करके सीखते हैं। समान भार बजट वाले चार नियंत्रकों की तुलना की जाती है: एक सघन मिश्रण, एक Switch top-1 राउटर, सघन रूप से प्रशिक्षित राउटर जिसे top-1 के रूप में उपयोग किया जाता है, और एक सादा MLP; फिर रूटिंग को गेम की स्थिति के सापेक्ष मापा जाता है, यह देखने के लिए कि प्रत्येक विशेषज्ञ किस काम आता है, यदि किसी काम आता है तो। चारों प्रति गेम लगभग 20 भोजन खाते हैं जबकि यादृच्छिक नीति 0.2 खाती है, जो शिक्षक के स्कोर का दो-तिहाई है; इस आकार पर सादा MLP किसी भी मिश्रण जितना ही अच्छा करता है।'
notes: 'विचार। Jacky Ka Long Ko ने एक गेम खेलने वाले एजेंट का सुझाव दिया, जो बोध के लिए एक CNN और विशेषज्ञ-मिश्रण रूटिंग वाले नियंत्रण नेटवर्क से बना हो, और सबसे बढ़कर टेंसर रूटिंग वाला हिस्सा माँगा। यह समस्या स्नेक पर ऐसा एक छोटा एजेंट बनाती है, जो यहाँ शुरू से लिखा गया एक सामान्य ग्रिड गेम है (अपना पिक्सेल रूप, कोई बाहरी एसेट नहीं)। गेम। $N \times N$ बोर्ड ($N = 10$) पर $B$ गेम टेंसरों का एक ही समूह हैं। बोर्ड शरीर के हर खाने की आयु संग्रहीत करता है (वह खाना फिर से खाली होने तक की चालें: सिर की आयु = लंबाई, पूँछ की 1), इसलिए हर गेम की एक चाल कुछ ही टेंसर संक्रियाएँ है: सापेक्ष क्रिया $a$ (बाएँ, सीधे, दाएँ) के लिए नई दिशा $d'' = (d + a - 1) \bmod 4$ के साथ सिर $\mathbf x + \Delta_{d''}$ पर जाता है; दीवार या $> 1$ आयु वाला खाना गेम समाप्त कर देता है (पूँछ का खाना छूट रहा होता है, इसलिए वह खाली है); भोजन के बिना हर आयु 1 घटती है, भोजन मिलने पर साँप अपनी पूँछ रखता है और एक बढ़ता है; नया भोजन उस खाली खाने पर आता है जिसमें $N^2$ सीडेड समरूप संख्याओं में सबसे बड़ी हो, इसलिए वह कभी शरीर पर नहीं
  पड़ता। भोजन के बिना $N^2$ चालों के बाद या जब साँप बोर्ड भर देता है, तब भी गेम समाप्त होता है। परीक्षण: दीवार और स्वयं से टक्कर, खाली पूँछ वाला खाना, एक से वृद्धि, भोजन कभी शरीर पर नहीं, आयु हमेशा ठीक $\ell, \ell - 1, \dots, 1$, और समान यादृच्छिक संख्याएँ देने पर बैच चरण प्रति-गेम सादे Python लूप के बराबर। एजेंट। बोध एक CNN है (8 चैनलों वाला 3×3 कन्वोल्यूशन, 16 चैनलों वाला stride-2 3×3 कन्वोल्यूशन, $F = 64$ विशेषताओं तक एक रैखिक परत; 84 472 भार), जो सिर पर केंद्रित और ऊपर की ओर दिशा वाले दृश्य पर चलता है, चार तलों के साथ: दीवार, शरीर, आयु/लंबाई (कौन से खाने पहले खाली होंगे) और भोजन। इस फ़्रेम में तीन सापेक्ष चालें हमेशा केंद्र के वही तीन पड़ोसी होती हैं (एक परीक्षण जाँचता है कि चाल ठीक तभी घातक है जब वह पड़ोसी दीवार हो या शरीर का ऐसा खाना जो बना रहेगा)। नियंत्रण $K = 4$ विशेषज्ञों का मिश्रण है, प्रत्येक एक MLP $64 \to 32 \to 3$ जो क्रिया लॉजिट देता है, एक softmax राउटर $p = \mathrm{softmax}(W^G \mathbf h + b^G)$ के पीछे: 8976 भार। रूटेड परत वही है जो moe_dag_pipeline में है, और वहीं से
  आयात की गई है: एक डिस्पैच टेंसर हर गेम को उसके विशेषज्ञ के बफ़र में रखता है (संचयी रैंक, जैसे GShard और Switch में), सभी विशेषज्ञ एक बैच einsum में चलते हैं, और एक संयोजन einsum लॉजिट वापस लाता है। सटीक जाँचें: स्थिर one-hot राउटर के साथ परत हर गेम के विशेषज्ञ को अकेले चलाने के बराबर है ($10^{-6}$ तक), समरूप सघन राउटर विशेषज्ञों का माध्य देता है, राउटर की पंक्तियों का योग 1 है, और ज्ञात मामलों पर लोड-संतुलन हानि (संतुलित होने पर 1, ढहने पर $K$, हाथ से गणना किए गए उदाहरण पर 1.1)। चार नियंत्रक, समान बजट: (a) सघन मिश्रण $z = \sum_k p_k f_k$ (हर विशेषज्ञ हर गेम पर); (b) Switch top-1, केवल सबसे संभावित विशेषज्ञ चलता है और उसके लॉजिट $p_k$ से स्केल किए जाते हैं; (c) (a) का सघन-प्रशिक्षित मॉडल top-1 रूटिंग के साथ चलाया गया, बिना आगे प्रशिक्षण के; (d) एक MLP $64 \to 132 \to 3$ (8979 भार, मिश्रण के बराबर)। (a) और (b) दोनों $\alpha = 0.01$ के साथ Switch लोड-संतुलन हानि जोड़ते हैं। हर प्रकार के दो सीड हैं; सीड $s$ हर प्रकार में समान CNN और विशेषज्ञ भारों से शुरू होता है, और सभी छह प्रशिक्षित मॉडल
  एक मॉडल अक्ष (CNN का समूहित कन्वोल्यूशन) साझा करते हैं, प्रत्येक अपने मिनीबैच के साथ। शिक्षक और प्रशिक्षण। शिक्षक उन्हीं टेंसरों से लिखा गया एक योजनाकार है: खाली खानों पर बार-बार शिथिलन (relaxation) के रूप में चौड़ाई-प्रथम खोज ($\mathrm{dist} \leftarrow \min(\mathrm{dist}, 1 + \min_{\mathrm{nbr}} \mathrm{dist})$) और, उसी लूप में, एक फ़्लड फ़िल जो हर खाली क्षेत्र को उसके सबसे छोटे खाना-सूचकांक से लेबल करता है। यह कभी घातक चाल नहीं चलता, उस चाल को प्राथमिकता देता है जिसका खाली क्षेत्र साँप को समा सके, फिर भोजन तक सबसे छोटा पथ, फिर बड़ा क्षेत्र; एक परीक्षण में इसका दूरी क्षेत्र पाठ्यपुस्तक वाले कतार-आधारित BFS के बराबर है। प्रशिक्षण व्यवहार क्लोनिंग (behaviour cloning, Pomerleau 1989) है: शिक्षक के 192 गेमों की 54 040 अवस्थाओं से शिक्षक की चालों पर क्रॉस-एन्ट्रॉपी, प्रति मॉडल 128 अवस्थाओं के 600 AdamW चरण, 360 चरणों के बाद एक DAgger दौर (Ross et al. 2011) के साथ: छात्र प्रत्येक 48 गेम खेलते हैं, शिक्षक उनकी पहुँची 38 267 अवस्थाओं को लेबल करता है, और प्रशिक्षण दोनों पर जारी रहता है। कोई सुदृढीकरण-अधिगम
  फ़ाइन-ट्यून नहीं किया जाता; डीप Q-लर्निंग (Mnih et al. 2015) केवल पुरस्कार से ऐसे गेम सीखने का क्लासिक तरीका है, जिसमें CPU पर कहीं अधिक समय लगेगा। परिणाम (डिफ़ॉल्ट रन, हर नीति द्वारा साझा 128 मूल्यांकन गेम: समान शुरुआत और समान भोजन क्रम, अधिकतम 300 चालें)। प्रति गेम खाया गया भोजन, गेमों पर माध्य, दोनों सीड के साथ: यादृच्छिक 0.16 (15 चालों के बाद मरता है); (a) सघन 20.7 (20.9, 20.4); (b) Switch 20.4 (21.1, 19.6); (c) सघन→top-1 18.1 (18.4, 17.8); (d) एकल मॉडल 21.7 (21.8, 21.6); शिक्षक 31.0 (औसतन 300 में से 287 चालें जीवित, छात्रों के 147–179 की तुलना में)। छात्र 95–96 % प्रशिक्षण अवस्थाओं पर शिक्षक से सहमत होते हैं, फिर भी एक-तिहाई कम स्कोर करते हैं: छोटी त्रुटियाँ गेम के दौरान जमा होती जाती हैं, जो व्यवहार क्लोनिंग की आम कमज़ोरी है। एक धीमा परीक्षण जाँचता है कि प्रशिक्षित नीति यादृच्छिक को स्पष्ट अंतर से हराती है। रूटिंग, वहाँ भी दिखाई गई जहाँ यह विशेषज्ञता नहीं है। सघन राउटर चारों विशेषज्ञों का उपयोग करते हैं (लोड 0.16–0.38)। वे सबसे अच्छी तरह स्वयं चाल को ट्रैक करते हैं: रूट किए गए विशेषज्ञ
  और नियंत्रक की चाल के बीच पारस्परिक सूचना 0.51 और 0.56 बिट है (चार विशेषज्ञों के साथ अधिकतम 2 बिट संभव है); सीड 1 में एक विशेषज्ञ लगभग हर बाएँ और दाएँ मोड़ तथा आगे कोई खाली खाना न होने वाली लगभग हर अवस्था को लेता है, जबकि बाकी तीन सीधी चालें बाँटते हैं। आगे के खाली खाने 0.20–0.28 बिट रखते हैं, भोजन तक की दूरी 0.08–0.12 और शरीर की लंबाई 0.02–0.13 (छोटे से लंबे साँपों की ओर झुकाव केवल सीड 1 में)। अतः विशेषज्ञ इस आधार पर बँटते हैं कि क्या करना है (मुड़ना या चलते रहना), न कि भोजन का पीछा बनाम पूँछ से बचाव जैसी किसी रणनीति के आधार पर; चूँकि विशेषज्ञ का आउटपुट चाल तय करता है, यह विभाजन आंशिक रूप से संरचना में ही निहित है। Switch राउटर संतुलन हानि के बावजूद ढह गए: सीड 1 85 % अवस्थाएँ एक विशेषज्ञ को और 15 % दूसरे को भेजता है, सीड 2 73 % और 26 %, प्रत्येक में दो विशेषज्ञ अप्रयुक्त; moe_dag_pipeline में देखी गई सममिति-भंग की कठिनाई यहाँ ढहने के रूप में प्रकट होती है। स्कोर में इसकी कोई कीमत नहीं चुकानी पड़ती, क्योंकि साझा CNN (जिसमें अधिकांश भार हैं) के साथ एक विशेषज्ञ ही चार जितना अच्छा खेलता है।
  सघन-प्रशिक्षित राउटर को top-1 चलाने पर (c) सघन रूटिंग बनी रहती है (चाल के साथ 0.60 और 0.67 बिट) पर प्रति गेम 2.6 भोजन का नुकसान होता है: सघन मॉडल अपने विशेषज्ञों को मिलाता है और पूरी तरह पृथक्करणीय नहीं है। क्या टिकता है और क्या नहीं। सटीक: बैच गेम संदर्भ लूप के बराबर है, स्थिर राउटर वाली रूटेड परत प्रति-गेम विशेषज्ञ कॉल के बराबर है, और समरूप राउटर वाला सघन मिश्रण विशेषज्ञ माध्य है। एक बोर्ड आकार पर दो सीड के साथ मापा गया: नकल हर नियंत्रक को शिक्षक के लगभग दो-तिहाई तक ले आती है, और कोई भी मिश्रण समान भारों वाले सादे MLP को नहीं हराता (MLP दोनों सीड में प्रति गेम लगभग 1 भोजन आगे है, दो सीड पर यह छोटा अंतर है)। विशेषज्ञों के मिश्रण तब फ़ायदेमंद होते हैं जब कई विशेषज्ञों के पास उतने से कहीं अधिक भार हों जितने एक इनपुट उपयोग कर सकता है; अधिकांश काम करने वाले CNN के पीछे चार-विशेषज्ञ नियंत्रक रूटिंग को प्रदर्शित करता है, उसके लाभ को नहीं। संबंधित कार्य। स्थानीय विशेषज्ञों के अनुकूली मिश्रण (Jacobs, Jordan, Nowlan और Hinton 1991) ने एक गेट प्रस्तुत किया जो हर मामले को कई प्रतिस्पर्धी विशेषज्ञों
  में से एक को सौंपता है; विरल रूप से गेटेड MoE परत (Shazeer et al. 2017) और Switch Transformer (Fedus et al. 2021, यहाँ प्रयुक्त top-1 रूटिंग और लोड-संतुलन हानि) ने इसे बड़े पैमाने तक बढ़ाया। डीप Q-नेटवर्क (Mnih et al. 2015) ने CNN और केवल पुरस्कार से पिक्सेलों से Atari गेम सीखे; ALVINN (Pomerleau 1989) ने मानव चालक की नकल करके वाहन चलाया, जो व्यवहार क्लोनिंग का उद्गम है, और DAgger (Ross, Gordon और Bagnell 2011) सीखने वाले द्वारा स्वयं देखी गई अवस्थाओं को लेबल करके इसकी जमा होती त्रुटियों को ठीक करता है। उपकरण और सीमाएँ। डिफ़ॉल्ट रूप से CPU: एक व्यस्त 6-कोर मशीन पर शिक्षक, प्रशिक्षण और मूल्यांकन में लगभग 80 s (शिक्षक गेम 6.6 s, DAgger 6.0 s, प्रशिक्षण 53 s, मूल्यांकन 16 s) और GIF के लिए लगभग 30 s; GPU (pixi run -e cuda) CNN को तेज़ करता है पर शिक्षक की कई छोटी खोजों को नहीं। GIF (c) को दिखाता है, जिसका राउटर सभी विशेषज्ञों का उपयोग करता है और प्रति गेम ठीक एक चलाता है; routing.png तीनों रूटेड प्रकार दिखाता है, routing.csv और scores.csv में संख्याएँ हैं।'
meanings:
