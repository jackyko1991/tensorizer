source_hash: c4a4275e3bd7
title: क्षेत्र टेंसर का लॉरेंज़ बूस्ट
summary: आपेक्षिकता में $\mathbf E$ और $\mathbf B$ अलग सदिश नहीं, बल्कि एक प्रतिसममित $4\times 4$ टेंसर $F^{\mu\nu}$ के छह घटक हैं। लॉरेंज़ बूस्ट इसे हर सूचकांक पर एक $\Lambda$ से रूपांतरित करता है, $F' = \Lambda F\Lambda^{\mathsf T}$, जिसे एक einsum में लिखा जाता है। बूस्ट वेग बदलने पर विद्युत और चुंबकीय क्षेत्र आपस में घुलते-मिलते दिखते हैं, जबकि $F_{\mu\nu}F^{\mu\nu}$ और $\mathbf E\cdot\mathbf B$ स्थिर रहते हैं।
notes: मात्रक जिनमें $c = 1$, मेट्रिक चिह्न $(+, -, -, -)$। बूस्ट $x$ के अनुदिश है, इसलिए $E_x$ और $B_x$ कभी नहीं बदलते; केवल अनुप्रस्थ घटक मिश्रित होते हैं। शुद्ध विद्युत क्षेत्र ($\mathbf B = 0$) के लिए गतिशील प्रेक्षक को चुंबकीय क्षेत्र $\mathbf B' = -\gamma\,\boldsymbol\beta\times\mathbf E$ दिखता है। दोनों लॉरेंज़ निश्चर पूरे स्वीप में स्थिर रहते हैं।
meanings:
- प्रतिसममित क्षेत्र टेंसर, $\mu, \nu \in \{t, x, y, z\}$
- मिंकोव्स्की मेट्रिक $\operatorname{diag}(+1, -1, -1, -1)$, $c = 1$
- $S$ वेगों $\beta$ में से हर एक के लिए $x$ के अनुदिश बूस्ट
- 'दोहराए गए $\alpha$ और $\beta$ ⇒ योग: $F$ के हर सूचकांक पर एक $\Lambda$'
- मेट्रिक से सूचकांक नीचे किए गए
- निश्चर $2(B^2 - E^2)$
- निश्चर $-4\,\mathbf E\cdot\mathbf B$, द्वैत टेंसर $\tfrac12\varepsilon^{\mu\nu\rho\sigma}F_{\rho\sigma}$ का उपयोग करके
labels:
  Ex: $E_x$
  Ey: $E_y$
  Ez: $E_z$
  Bx: $B_x$
  By: $B_y$
  Bz: $B_z$
  beta_max: अंतिम बूस्ट वेग $\beta = v/c$
