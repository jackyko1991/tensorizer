source_hash: b20963373157
title: 薄透镜成像
summary: 薄透镜公式给出物体的像在何处、有多大。对每个物体位置同时追迹三条特殊光线；物体从 $2f$ 之外移到焦距以内，倒立实像变为正立虚像。
notes: 距离从透镜量起：物体位于 $x = -s$，实像位于 $x = +s'$。三条特殊光线是：(1) 平行于光轴入射，然后通过另一侧焦点；(2) 直接通过光心；(3) 通过同侧焦点，然后平行出射。它们都由同一条规则 $\theta' = \theta - y/f$ 得出。物体在 $f$ 以内时，光线经透镜后发散；虚线延长线交于虚像。$s = f$ 时像在无穷远。
meanings:
- 第 $k$ 帧动画中的物距
- 像距；为负 ⇒ 虚像位于物体一侧
- 像高 / 物高；为负 ⇒ 倒立
- 特殊光线 $r \in \{\text{parallel, centre, focal}\}$ 在透镜前的斜率
- 每条特殊光线与透镜的交点
- 透镜后的斜率：每条光线都被偏折 $-y/f$
labels:
  f: 焦距 $f$
  h: 物高 $h$
  s_start: 起始物距
  s_end: 最终物距
