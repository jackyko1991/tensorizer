source_hash: ea8025a41e84
title: Связанные осцилляторы и нормальные моды
summary: $N$ одинаковых масс, соединённых пружинами между двумя неподвижными стенками. Пружины образуют один тензор жёсткости $K_{ij}$, его собственные векторы — нормальные моды, а движение — суперпозиция мод, суммируемая одним einsum.
notes: 'Поскольку $K_{ij}$ симметричен, eigh даёт вещественные частоты и ортонормированные моды, так что любое движение — сумма независимых косинусов, и шагать по времени не нужно. Начните с одной моды, и цепочка навсегда сохранит эту форму; оттяните одну массу, и энергия будет перетекать вдоль цепочки. Аналитические частоты: $\omega_n = 2\sqrt{k/m}\,\sin\tfrac{n\pi}{2(N+1)}$.'
meanings:
- смещение массы $i$ из положения равновесия
- 'тензор жёсткости: $2k$ на диагонали, $-k$ рядом с ней'
- 'повторяющийся $j$ ⇒ суммирование: результирующая сила пружин на массу $i$'
- собственные значения и собственные векторы (столбец $n$) = нормальные моды
- 'повторяющийся $i$ ⇒ суммирование: проекция начального состояния на каждую моду'
- 'повторяющийся $n$ ⇒ суммирование: суперпозиция мод'
labels:
  n_masses: Число масс
  k: Жёсткость пружины
  m: Масса
  start: Начальное смещение
  amplitude: Начальная амплитуда
  t_max: Время моделирования
