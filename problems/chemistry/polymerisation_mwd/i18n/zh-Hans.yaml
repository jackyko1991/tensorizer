source_hash: 15137dcd8bb9
title: 聚合动力学与分子量分布
summary: 为什么逐步聚合的聚合物（聚酯、尼龙）分散度如此之高，而活性聚合却能得到几乎均一的链？对链长做布居平衡，两种机理共用一个 $(S, L)$ 张量，重现了 Carothers 的 $X_n = 1/(1-p)$ 和 Flory 最可几分布 $w(x) = x(1-p)^2p^{x-1}$（分散度 $Đ \to 2$），并用 100 000 个单体的动力学蒙特卡罗进行验证，同时给出活性链的泊松分布，$Đ \approx 1 + 1/X_n$。
notes: 逐步聚合：每个分子都带有反应性端基（这里是一个 A 和一个 B，就像羟基酸），任意两条链都能连接，单体与单体、二聚体与 50 聚体皆可。Flory 的等反应性假设（速率与链长无关）把布居平衡变成具有常数核的 Smoluchowski 凝并方程，其精确解就是最可几分布：端基中有比例 $p$ 已反应，因此长度为 $x$ 的链是 $x - 1$ 个已反应键组成的序列，以一个未反应的键结尾，概率为 $(1-p)p^{x-1}$。其平均值是 Carothers 的 $X_n = 1/(1-p)$ 和 $X_w = (1+p)/(1-p)$，所以 $Đ = 1 + p \to 2$。实际的教训很严酷：98 % 的转化率只能得到 $X_n = 50$，长链需要 $p > 0.99$ 以及反应基团完美的 1:1 配比。活性链增长（阴离子聚合，或近似于它的可控自由基方法如 ATRP 或 RAFT）恰恰相反：所有链同时引发，每次增加一个单体，没有终止，所以每条链经过 $\nu$ 次加成后链长服从泊松分布，$Đ = 1 + \nu/(1+\nu)^2 \approx 1 + 1/X_n$ 趋向 1。张量形式把两种机理放在同一个 $(S, L)$ 张量中，用 RK4 推进。逐步聚合的卷积 $\sum_y P_y P_{x-y}$ 是与一个从 $P$ 收集而来的 Toeplitz 矩阵做的 einsum（FFT 能以 $O(L\log L)$ 完成同样的事）。由于两行使用的时钟满足 $X_n = 1 + s$，每一帧都在相同的 $X_n$ 下比较两种机理，横轴为 $x / X_n$，在此轴上 Flory 形状固定不变，而泊松峰变窄。动力学蒙特卡罗随机连接成对的链；它与布居平衡在采样噪声范围内一致，而噪声在接近末尾时增大，因为只剩下 $N_0(1-p)$ 条链（$p = 0.98$ 时为 2000 条）。简化：不成环，无副反应，A–B 化学计量完美平衡，链长截断于 $L$（被略去的尾部低于 $10^{-6}$），活性聚合情形下瞬时引发且无终止或链转移。常规的自由基聚合有终止反应，介于两者之间（$Đ \approx 1.5$–2）。
meanings:
- 机理 $s$ 下长度为 $x$（$x = 1 … L$）的链：0 = 逐步聚合（每单体），1 = 活性聚合（每引发剂）
- 两行共用一个时钟：逐步聚合为 $\tau = kN_0t$，活性增长为 $\nu = \int k_p[M]\,dt$
- 从布居收集而来的 Toeplitz 矩阵；$x - y < 1$ 处为零
- 重复的 $y$ ⇒ 求和：把一个 $y$ 聚体与一个 $(x-y)$ 聚体连接的所有方式
- 一条链通过其两个端基中的任一个与 $N$ 条链中的任一条反应
- 活性链只加成单体，每次一个单元，从不终止
- 对 $x$ 求和：矩 $k = 0, 1, 2$ 给出 $X_n = \mu_1/\mu_0$、$X_w = \mu_2/\mu_1$
- 逐步聚合的精确解：转化率 $p = \tau/(1+\tau)$ 时每个初始单体对应的链数
- 活性增长的精确解，用 lgamma 计算阶乘
- 每次一个键地连接两条随机链：独立的随机检验
labels:
  p_max: 最终转化率 $p$（逐步聚合）
  n_monomers: 蒙特卡罗中的单体数 $N_0$
