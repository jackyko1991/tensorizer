source_hash: 8d871084eacb
title: ラドン変換と CT 再構成
summary: CT スキャナーは減弱マップの線積分 $p(\theta, s)$ をあらゆる角度から記録する。Shepp–Logan 頭部ファントムをテンソルの回転と和で投影し、フィルタ補正逆投影で再構成する：フーリエ空間でランプフィルタ $|\nu|$ をかけ、角度について1回 einsum をとる。
notes: どの角度でも、各投影は全質量を保存する：$\int p\,ds = \iint f\,dA$。生の投影をそのまま塗り戻す（単純逆投影）と1点が $1/r$ のハローになるので、画像は $f$ をぼかしたものになる。ランプフィルタ $|\nu|$ はこのぼけを厳密に打ち消す（中心断面定理）。角度が少なすぎると筋状のアーチファクトが出る。誤差は角度数とともに減り、やがて画素格子で頭打ちになる。Shepp–Logan 窓は高周波でランプを和らげ、わずかな鮮鋭さと引き換えにノイズを減らす——ノイズをオンにして試してみよう。簡略化：平行ビーム幾何、単色の線、双線形補間、光子統計の代わりにガウス型の検出器ノイズ。教育用モデルであり、臨床には使用できない。
meanings:
- 減弱マップ（改変 Shepp–Logan：10 個の楕円の和）
- 距離 $s$、位置 $t$、角度 $\theta$ の線に沿ってサンプリングした画像
- 繰り返される $t$ ⇒ 和をとる：サイノグラム
- ランプ $|\nu|$（Ram-Lak）、必要に応じて $\mathrm{sinc}(\nu\,\Delta s)$ を掛ける（Shepp–Logan）、ゼロ埋めした検出器上で
- フィルタ処理した投影
- 各投影をその線に沿って塗り戻す：$q_\theta(x\cos\theta + y\sin\theta)$
- 繰り返される $\theta$ ⇒ 和をとる：逆投影
labels:
  n_pixels: 画像サイズ $N$
  n_angles: 投影角度の数
  filter: ランプフィルタの窓
  noise: 検出器ノイズ（最大値に対する割合）
