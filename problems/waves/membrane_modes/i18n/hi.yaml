title: कंपित ढोल की विधाएँ
summary: वर्गाकार या वृत्ताकार ढोल की झिल्ली की प्रसामान्य विधाएँ। ग्रिड पर 2D लाप्लासियन 1D वाले से क्रोनेकर गुणनफलों द्वारा बनता है, $\Delta = D\otimes I + I\otimes D$, और एक सममित आइगेन-हलकर्ता (eigh) हर विधा की आकृति और आवृत्ति एक साथ लौटाता है।
notes: 'हर पैनल एक विधा $\phi_m(x, y)\cos(\omega_m t)$ दिखाता है; अंदर की सफ़ेद रेखाएँ निस्पंद रेखाएँ हैं जो कभी नहीं हिलतीं। भुजा $L$ वाले वर्ग के लिए सटीक आवृत्तियाँ $\omega_{mn} = \frac{c\pi}{L}\sqrt{m^2 + n^2}$ हैं, इसलिए मूल आवृत्ति से अनुपात $\sqrt{(m^2+n^2)/2}$ = 1, 1.58, 1.58, 2, 2.24 … हैं: पूर्ण संख्याएँ नहीं, इसीलिए ढोल डोरी जैसा नहीं बजता। $(1,2)$ और $(2,1)$ जैसे युग्मों की आवृत्ति एक ही है, और eigh उनका कोई मिश्रण लौटाता है। वृत्त के लिए सटीक अनुपात बेसल फलनों के शून्यों से आते हैं (1, 1.59, 2.14, 2.30 …); ग्रिड का सीढ़ीनुमा किनारा उन्हें कुछ प्रतिशत खिसका देता है। मात्रक: $c = 1$, वर्ग की भुजा या वृत्त का व्यास $L = 1$; समय मूल आवर्तकालों में दिखाया गया है।'
meanings:
- किनारे जकड़े हुए 1D द्वितीय अवकलज (बाहर $u = 0$)
- 'युग्म सूचकांक $p = (a, b)$ ग्रिड बिंदुओं को क्रमांकित करता है: 2D लाप्लासियन'
- केवल ढोल के अंदर के बिंदु रखें (वृत्त मास्क); किनारा जकड़ा है
- आइगेनमान $\omega^2/c^2$ और स्तंभों में प्रसामान्य लांबिक विधा आकृतियाँ
- 'दोहराया गया $p$ ⇒ योग: तत्समक आव्यूह'
