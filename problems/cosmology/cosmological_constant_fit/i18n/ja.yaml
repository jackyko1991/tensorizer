source_hash: 73d953345169
title: 超新星で宇宙定数をフィットする
summary: 公開された Pantheon+ カタログの実在する Ia 型超新星 1466 個を、物質 $\Omega_m$、宇宙定数 $\Omega_\Lambda$、曲率をもつフリードマン宇宙でフィットします。一つのバッチ $\chi^2$ が数千の宇宙をすべての超新星で同時に評価して $\Omega_m$–$\Omega_\Lambda$ の信頼領域を描き、Adam と自動微分が物質だけの宇宙から最良フィットまで進みます。遠方の超新星は減速する宇宙で予想されるより暗く、$q_0 < 0$、つまり膨張は加速しています。
notes: 1998 年、超新星宇宙論プロジェクト（Perlmutter ら）と高赤方偏移超新星探索チーム（Riess ら、Schmidt）の二つのチームが、標準化可能な光源である遠方の Ia 型超新星が、減速する宇宙で許されるより暗く見えることを発見しました：膨張は加速しており、一般相対論ではそのために宇宙定数 $\Lambda$（暗黒エネルギー）のようなものが必要です。この発見は 2011 年のノーベル物理学賞を受けました。ここでは同じテストを現在のデータで行います。左のパネルは各距離指数から、空っぽで等速膨張する宇宙（$\Omega_m = \Omega_\Lambda = 0$）の値を引いたものです。物質だけの宇宙（赤）なら遠方の超新星はより明るく（ゼロより下）なるはずですが、データはその上にあります。右のパネルはバッチ格子から得た 1、2、3$\sigma$ 領域（$\Delta\chi^2 = 2.30, 6.18, 11.83$）で、平坦な宇宙の線、加速と減速を分ける線 $q_0 = 0$、データの範囲内で $E^2$ が負になる「ビッグバンなし」の隅も描いています。これらの対角誤差でフィットすると $\Omega_m \approx 0.30 \pm 0.07$、$\Omega_\Lambda \approx 0.57 \pm 0.10$（平坦なら $\Omega_m \approx 0.35 \pm 0.02$）となり、$\Omega_\Lambda \le 0$ は約 $5.5\sigma$ で棄却されます（$\sigma = \sqrt{\Delta\chi^2}$、棄却される側の最良モデルとの比較）。$H_0$ は超新星の絶対等級と縮退しており、表示される値（$\approx 73$ km/s/Mpc）はこれらの $\mu$ に組み込まれた SH0ES のセファイド較正によるもので、独立な測定ではありません（CMB の値 $\approx 67$ との「ハッブル・テンション」は未解決の問題です）。データ：Pantheon+ の距離指数（Scolnic et al. 2022, ApJ 938, 113; Brout et al. 2022, ApJ 938, 110）、github.com/PantheonPlusSH0ES/DataRelease
  より（ファイル Pantheon+SH0ES.dat。研究用にライセンス表記なしで公開、論文は CC BY 4.0 のオープンアクセス。引用してください）。$z > 0.01$ の zHD、MU_SH0ES、MU_SH0ES_ERR_DIAG を残し、較正用セファイドの母銀河を除き、超新星 1 個につき 1 行としました。自分の表も使えます：z、mu、sigma_mu の列をもつ任意の CSV（load_distance_moduli を参照）。簡略化：対角誤差だけを使い、Pantheon+ の統計 + 系統の完全な共分散は使っていません（$\chi^2/\mathrm{dof} \approx 0.44$ はこれらの誤差が保守的であることを示し、相関した系統誤差を無視すると信頼領域はやや楽観的になります）。暗黒エネルギーは純粋な定数（$w = -1$）、放射は無視しています。
meanings:
- 超新星 $i$ の赤方偏移、距離指数、誤差。これらの列をもつ任意の CSV から読む
- 候補の宇宙。$(A,1,1)$ と $(1,B,1)$ としてブロードキャスト
- すべての宇宙について各節点 $z_k$ での膨張率を一度に計算
- 最後の軸に沿った $1/E$ の累積台形則
- 超新星の赤方偏移への 3 次エルミート補間（傾き $1/E$ が既知）
- 開いた、平坦、閉じた空間に対して $\sinh$、恒等写像、$\sin$
- $i$ について和：各宇宙の最良の $H_0$ は解析的な重み付き平均
- 重み $w_i = 1/\sigma_i^2$ で $i$ について和
- 積分を通した自動微分。Adam と L-BFGS が使う
- $\chi^2$ の曲率から得るフィットパラメータの共分散
labels:
  geometry: Adam フィットの幾何
  start_Om: Adam の初期値 $\Omega_m$
  start_OL: Adam の初期値 $\Omega_\Lambda$
  steps: Adam の反復回数
  lr: Adam の学習率
  grid: 軸あたりの格子点数（$\chi^2$ 等高線）
  z_min: 最小赤方偏移 $z_\mathrm{min}$
