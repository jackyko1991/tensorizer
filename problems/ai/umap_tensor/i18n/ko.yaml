source_hash: 3af965e9bb1a
title: '텐서 문제로서의 UMAP: MNIST에서 kNN 그래프, 퍼지 집합, 힘 기반 레이아웃'
summary: '784픽셀 MNIST 숫자를 2D 지도로 그려 내는 차원 축소 방법 UMAP을 전부 텐서 연산으로 작성한다: 거리 행렬 하나와 topk로 만드는 정확한 kNN 그래프, 모든 점의 대역폭 $\sigma_i$를 한꺼번에 찾는 이분법, 퍼지 합집합 $P + P^\top - P\circ P^\top$, 그래프 라플라시안에서 얻는 스펙트럴 초기화, 그리고 에폭마다 전체 간선 목록에 한 번에 적용되는 인력과 척력(손으로 한 번, autograd로 다시 한 번). 2500개 숫자와 스위스 롤에서 신뢰도(trustworthiness), 이웃 재현율, 숫자 정확도 모두 umap-learn 라이브러리와 대등하며 PCA를 크게 앞선다.'
notes: '질문. \"UMAP을 그냥 텐서 문제로\"는 Jacky Ka Long Ko의 요청이다: 보통 umap-learn 라이브러리와 그 numba 루프로 실행하는 UMAP(Uniform Manifold Approximation and Projection, 균일 매니폴드 근사 및 투영; McInnes, Healy, Melville 2018)을 가져와 모든 단계를 배치 텐서 연산으로 작성하고, 결과가 똑같이 좋은지 확인한다. 방법, 텐서로(D차원의 점 N개). 1. kNN 그래프: (N, N) 제곱 거리 $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2 x_i\cdot x_j$(einsum 하나)를 행 블록 단위로 계산한 뒤 topk로 (N, k) 거리와 인덱스를 얻는다; 4096개 점 미만에서의 umap-learn과 마찬가지로 정확하다(그 이상에서는 근사 최근접 이웃 하강법으로 전환한다). 2. 퍼지 단체 집합: $\rho_i$는 가장 가까운 다른 점까지의 거리이고, $\sigma_i$는 이분법으로 $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$를 푼다. N개 구간 모두를 함께 반으로 줄이며(64회, 상한을 모르는 동안에는 먼저 두 배로 늘리는 단계), 소속도는 밀집 (N, N) 행렬 $P$에 흩뿌려진 뒤 퍼지 합집합 $W = P + P^\top - P\circ P^\top$으로 대칭화된다(점이 수천 개일 때는 밀집 행렬로 충분하며, 대규모에서는 희소 COO 텐서로 같은 공식을 쓴다). 3. 저차원 유사도 $q = 1/(1 + a d^{2b})$, 여기서 $a$와 $b$는 2-매개변수 Gauss–Newton 최소제곱 적합으로 min_dist에 맞춘다; 초기화: 밀집 torch.linalg.eigh로 구한 정규화 라플라시안 $I - D^{-1/2} W D^{-1/2}$의 가장 작은 비자명 고유벡터 두 개(2500개 점에 단일 코어로 약 4 s; umap-learn은 희소 솔버를 사용하며,
  eigh가 실패하면 코드는 무작위 초기화로 대체한다). 4. 레이아웃: 500 에폭; 가중치 $w_{ij}$인 간선은 $\max w / w_{ij}$ 에폭마다 한 번 활성화된다(umap-learn의 스케줄로, 다음 샘플링 에폭을 담은 (E,) 텐서로 유지). 활성화된 각 간선은 양 끝을 끌어당기고, 머리 쪽을 밀어내는 무작위 음성 샘플 5개를 뽑는다. 한 에폭의 모든 힘을 한 번에 계산해 index_add_로 점마다 합산한다(동기식 업데이트이며, umap-learn은 간선 하나씩 점을 옮긴다). autograd를 쓰는 같은 루프: 샘플링된 교차 엔트로피의 그래디언트를 합산 후 클리핑한다. 5. 평가 지표, 모두 텐서 연산이며 $k$ = 10: 순위 행렬(argsort의 argsort)로 계산하는 신뢰도와 연속성(Venna와 Kaski 2001), kNN 재현율, 그리고 2D 레이아웃에서의 leave-one-out 10-NN 숫자 정확도; 선형 기준선으로 SVD 기반 PCA. 데이터. MNIST(LeCun, Cortes, Burges), 라이선스 CC BY-SA 3.0: data/mnist_subset.npz에는 각 숫자의 첫 250개 학습 이미지가 들어 있다(2500개 이미지, uint8; 동일조건변경허락 라이선스가 이 부분집합에 적용됨). data/SOURCES.md 참조. 스위스 롤(1500개 점, scikit-learn의 make_swiss_roll과 같으며 약간의 잡음 포함)은 코드에서 생성되므로 실제 평면 좌표(호 길이, 높이)를 알고 있다. umap-learn 참조 결과(umap-learn 0.5.12, scikit-learn 1.9.1, random_state 42)는 data/make_reference.py가 일회용 환경에서 오프라인으로 한 번 계산했으며, 그 2D 좌표와 지표만 함께 제공된다. 결과(제공된 실행, CPU, 단일 스레드). MNIST, 2500개 숫자: 신뢰도 / 연속성 / 10-NN 재현율 / 10-NN 숫자 정확도 = 손으로
  작성한 힘 0.957 / 0.963 / 0.39 / 0.887, autograd 0.960 / 0.963 / 0.40 / 0.898, umap-learn 0.963 / 0.963 / 0.40 / 0.896, PCA 0.740 / 0.913 / 0.07 / 0.414. 스위스 롤: 신뢰도 0.999(umap-learn 0.999, PCA 0.943), 실제 평면 좌표 기준으로는 0.999이며 실제 10개 최근접 이웃의 76 %를 유지한다(umap-learn 77 %, PCA 28 %). 제공된 umap-learn 레이아웃에서 우리의 신뢰도는 scikit-learn의 값과 $2\times 10^{-4}$ 이내로 일치하며(테스트됨), $a$, $b$도 umap-learn의 값과 같다. MNIST에서의 실행 시간: 힘 버전 11 s(그래프 0.5 s, eigh 4 s, 레이아웃 7 s), autograd 15 s, umap-learn 14 s(두 번째 호출, 단일 스레드; numba 컴파일이 포함된 첫 호출은 28 s). 최적의 회전, 반사, 스케일 조정(Procrustes) 후 우리의 MNIST 레이아웃은 umap-learn의 것과 불일치도 0.05만큼 다르다(0 = 같은 모양, 1 = 무관); 같은 숫자 군집이 같은 자리에 놓인다. 결론과 한계. UMAP은 텐서 문제이다: 그래프 구성, 대역폭 탐색, 퍼지 합집합, 스펙트럴 초기화, 힘 기반 레이아웃이 모두 배치 텐서 연산이며, 결과는 여기의 모든 지표에서 참조 구현만큼 좋다. 다른 점: 레이아웃은 좌표가 아니라 항상 지표로 비교한다. UMAP 레이아웃은 회전, 반사, 그리고 음성 샘플링의 무작위성을 제외하고서만 정의되기 때문이다(다른 시드를 쓰면 군집이 이리저리 옮겨진다). 4096개 점을 넘으면 umap-learn의 kNN은 근사가 되지만 우리의 것은 정확하게 유지된다(대신 $O(N^2)$의 비용이 든다). 밀집 $N\times N$ 행렬과 eigh 때문에 이 버전은 약 $10^4$개 점으로 제한된다(블록, 희소
  텐서, 반복적 고유값 솔버로 이 한계를 넘을 수 있다). 동기식 업데이트 때문에 초기 에폭은 레이아웃이 식기 전까지 뜨거운 기체처럼 보인다(학습률이 1에 가깝고 모든 점이 모든 힘을 한꺼번에 받는다). 스위스 롤은 모든 국소 이웃을 유지하지만 하나의 깨끗한 면으로 펼쳐지지는 않는다: umap-learn과 마찬가지로 띠 모양으로 찢어지며, 이는 UMAP과 t-SNE의 알려진 특성이다. 숫자 정확도는 지도가 한 번도 보지 못한 클래스를 얼마나 잘 분리하는지를 재는 척도이지 분류기가 아니다. 결과는 BLAS 빌드와 스레드 수에 따라 천분의 몇 정도 달라진다. 관련 연구. t-SNE(van der Maaten과 Hinton 2008)는 2D에서 두꺼운 꼬리 커널로 이웃 확률을 맞추는 방식을 확립했다. UMAP은 정규화된 확률을 퍼지 소속도로, 전체 척력을 (word2vec에서처럼) 음성 샘플링으로 바꾸었으며, 이것이 UMAP이 대규모로 확장되는 이유이다. 라플라시안 고유맵(Belkin과 Niyogi 2003)이 스펙트럴 초기화를 제공한다. 직접 해 보기. 이웃 수를 줄이면(5) 더 많고 작은 군집이 생기고, min_dist를 0.9 가까이로 하면 점들이 느슨하게 배치되며, 에폭을 줄이면 미완성 레이아웃이 보이고, 다른 시드는 지도를 회전시키고 재배치하지만 지표는 그대로이다.'
meanings:
- $k$개 최근접 점까지의 거리(점 자신이 첫 번째), $\lVert x_i\rVert^2 + \lVert x_j\rVert^2 - 2\,x_{id}x_{jd}$(반복된 $d$ ⇒ 합산)와 topk로 계산; 정확하며, 행 블록으로 메모리를 $O(BN)$으로 유지
- $\rho_i$ = 가장 가까운 다른 점까지의 거리; $\sigma_i$는 모든 점에 대한 하나의 구간 텐서를 한꺼번에 64번 반으로 줄여 $\sum_j e^{-(d_{ij}-\rho_i)/\sigma_i} = \log_2 k$가 되도록 구함
- '방향성 소속도: 최근접 이웃은 1, 그 너머로는 거리에 따라 감소, kNN 목록 밖은 0'
- '두 방향의 퍼지 합집합(확률적 OR): 대칭이며 $[0, 1]$ 범위; 0이 아닌 항목이 간선 목록 $(i_e, j_e)$이며, 2500개 숫자에서 $E$ ≈ 50 000'
- 'min_dist 미만에서 1, 그 이상에서 $e^{-(x - \mathrm{min\_dist})}$인 곡선에 $1/(1 + a x^{2b})$를 Gauss–Newton으로 적합: min_dist = 0.1일 때 $a$ = 1.577, $b$ = 0.895'
- '스펙트럴 초기화: 정규화 그래프 라플라시안의 가장 작은 비자명 고유벡터 두 개를 $[0, 10]$으로 스케일 조정'
- 샘플링된 모든 간선 $(i, j)$와 간선당 무작위 음성 샘플 5개 $s$의 힘을 한 번의 scatter-add로 점마다 합산; 각 항은 $\pm 4$로 클리핑; 학습률 $\alpha = 1 - \mathrm{epoch}/n$
- '샘플링된 손실 $\sum_e -\log q_{ij} + \sum_s -\log(1-q_{is})$에 대한 autograd로 얻은 같은 스텝: 손으로 작성한 힘과 같음(테스트됨)'
- $1 - \frac{2}{Nk(2N-3k-1)}\sum_i\sum_{j\in U_k(i)}(r_{ij}-k)$, 순위 $r$은 argsort의 argsort에서 얻음; 연속성은 $x$와 $y$를 바꿈
labels:
  n_neighbors: 이웃 수 $k$ (점 자신 포함)
  min_dist: 레이아웃의 최소 거리
  n_epochs: 레이아웃 에폭 수
  neg_rate: 간선 샘플당 음성 샘플 수
  n_mnist: MNIST 이미지 수 (숫자별 균등)
  seed: 난수 시드
