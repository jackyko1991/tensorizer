title: सीमांत अभिकर्मक और प्रतिशत लब्धि
summary: 'ऐलुमिनियम को आयोडीन (या नाइट्रोजन को हाइड्रोजन) के साथ किसी भी अनुपात में मिलाएँ: कौन-सा अभिकारक पहले ख़त्म होता है, कितना उत्पाद बन सकता है, और दूसरा कितना बचता है? हर मात्रा एक ही अभिक्रिया विस्तार $\xi$ के साथ बदलती है, सीमांत अभिकर्मक $n_s/|\nu_s|$ पर एक न्यूनतम है, और प्रयोगों का पूरा बैच तथा आरंभिक द्रव्यमानों का 2D मानचित्र उसी टेंसर संक्रिया से संभाला जाता है।'
notes: 'ग्राम नहीं, मोल निश्चित अनुपात में अभिक्रिया करते हैं: पहले हर द्रव्यमान को उसके मोलर द्रव्यमान से भाग दें। फिर एक संख्या, विस्तार $\xi$, बताती है कि अभिक्रिया कितनी आगे बढ़ी है: $2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$ में $2\xi$ mol ऐलुमिनियम और $3\xi$ mol आयोडीन लगता है और $2\xi$ mol ऐलुमिनियम आयोडाइड बनता है। हर अभिकारक अधिकतम $n^0_s/|\nu_s|$ इकाई अभिक्रिया की अनुमति देता है, और इनमें सबसे छोटी संख्या जीतती है: वह अभिकारक सीमांत अभिकर्मक है, और उसकी पट्टी ही शून्य तक पहुँचती है। 1.20 g Al (44.5 mmol) और 2.40 g I₂ (9.46 mmol) के साथ आयोडीन सीमांत है: $\xi^{\max} = 3.15$ mmol, अधिकतम 2.57 g AlI₃, और 1.03 g ऐलुमिनियम बचा रहता है। मानचित्र पर धराशायी रससमीकरणमितीय रेखा के हर ओर उत्पाद केवल एक अभिकारक पर निर्भर करता है; रेखा के अनुदिश दोनों एक साथ ख़त्म होते हैं और कुछ व्यर्थ नहीं जाता। वास्तविक लब्धियाँ सैद्धांतिक से कम होती हैं (हानियाँ, पार्श्व अभिक्रियाएँ, ऐसा साम्य जो पूर्णता तक नहीं जाता: हेबर रिऐक्टर से एक बार गुज़रने पर केवल लगभग 15 % रूपांतरण होता
  है), और 100 % से अधिक लब्धि का अर्थ है कि उत्पाद गीला या अशुद्ध है। द्रव्यमान, तौला गया उत्पाद या अभिक्रिया बदलें।'
meanings:
- 'चिह्नित रससमीकरणमितीय संख्याएँ: 2 Al + 3 I₂ → 2 AlI₃ के लिए $-2, -3, +2$'
- 'दोहराया गया $e$ ⇒ योग: हर स्पीशीज़ के परमाणुओं से मोलर द्रव्यमान'
- हर प्रयोग $b$ के लिए आरंभिक मोल (अंतिम आपका रन है)
- किसी अभिकारक के शून्य होने से पहले का सबसे बड़ा विस्तार; argmin सीमांत अभिकर्मक है
- 0 से $\xi^{\max}$ तक $K$ विस्तारों पर मात्राएँ (पट्टियाँ)
- g में उत्पाद की सैद्धांतिक लब्धि
- प्रतिशत लब्धि
- आरंभिक द्रव्यमानों का ग्रिड बस एक बड़ा बैच है
labels:
  reaction: अभिक्रिया
  mass_1: अभिकारक 1 का द्रव्यमान (Al या N₂)
  mass_2: अभिकारक 2 का द्रव्यमान (I₂ या H₂)
  measured: तौला गया उत्पाद
