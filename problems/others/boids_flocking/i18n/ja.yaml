source_hash: ee1c00fce805
title: 群れ：Vicsek モデルと boids
summary: ムクドリ、魚の群れ、イナゴはリーダーなしで一緒に動きます。Vicsek モデルでは、各鳥は一定の速さで飛び、近くの仲間の平均の向きをまねし、そこに最大 $\eta$ のランダムな角度が加わります。Reynolds の boids では、分離・整列・結合の三つのルールで進路を決めます。周期境界の箱の中の $N^2$ 個すべての鳥どうしの距離を一つのテンソルにまとめ、ノイズの強さのバッチ全体を一度に走らせて、極秩序 $\varphi$ の秩序–無秩序転移を示します。
notes: Vicsek ら（1995）は、集団運動の最も単純な物理として、整列とノイズだけからなるこのモデルを導入しました。ノイズが小さいと鳥たちは一つの方向にそろい（$\varphi \to 1$）、$\eta = 2\pi$ では向きはランダムで、$\varphi$ は大きさ $1/\sqrt N$ 程度の有限サイズのゆらぎにすぎません。これは二次元では驚くべきことです。Mermin–Wagner の定理は、連続対称性をもつ平衡系での長距離秩序を禁じているからです。動く鳥たちは、近傍が絶えず入れ替わるためにこの制約を逃れます（Toner と Tu 1995）。大きな系では転移は不連続で、進行する帯が現れることがわかっています（Grégoire と Chaté 2004）。ここでの小さな $N$ では滑らかに見えます。Reynolds（1987）は boids をコンピュータアニメーションのために作りました。ここでは彼の三つのルールを $i \leftrightarrow j$ について反対称なペア力として書いているので、速さの正規化がなければ群れの全運動量は厳密に保存されます（テストで確認しています）。一定の速さ $v_0$ への正規化によって、群れは向きを選べるようになります。結合が強すぎると群れは回転する球へと潰れてしまうので、弱めにしてあります。箱を小さく（密度を高く）したり半径を大きくしたりすると、秩序が生じやすくなります。
meanings:
- 箱 $[0, L)^2$ 内の $N$ 羽の鳥の位置。ノイズの強さ $b$ ごとに一つの群れ
- 鳥 $i$ から鳥 $j$ の最も近い周期的コピーへの変位。$i \leftrightarrow j$ について反対称
- 近傍行列。繰り返される $k$ ⇒ 和をとる。鳥 $i$ は自分自身も数える
- 繰り返される $j$ ⇒ 和をとる：近傍の平均の向き
- ノイズの角度。$[-\eta/2, \eta/2]$ で一様分布。$\eta = 2\pi$ で向きは完全にランダムになる
- boids：分離 $-\sum_j S_{ij} \mathbf d_{ij}/|\mathbf d_{ij}|^2$、整列 $\sum_j A_{ij}(\mathbf v_j - \mathbf v_i)$、結合 $\sum_j A_{ij}\mathbf d_{ij}$
- 極秩序：群れがそろって動くとき 1、向きがランダムなとき約 $1/\sqrt N$
labels:
  n_birds: 鳥の数 $N$
  box: 箱の一辺 $L$（近傍半径 $R = 1$）
  speed: 速さ $v_0$
  eta: 表示する群れのノイズ $\eta$
  n_noise: バッチ内のノイズの強さの個数
  steps: 時間ステップ数
  seed: 乱数シード
