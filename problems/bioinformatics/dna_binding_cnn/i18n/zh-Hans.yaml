source_hash: e272fe98f3be
title: 微型 CNN 找出 DNA 结合基序
summary: 一组随机 DNA 序列中，有一半带有一个转录因子结合位点的简并拷贝。一个单层一维卷积网络 $z_{nfp} = W_{fkb}\,x_{n,p+k,b}$ 加最大池化，借助自动微分与 Adam 学会区分它们；以序列标识图读出时，其最重要的滤波器会变成植入的基序。
notes: 转录因子在找到一个短而略有变化的词（即其基序）的地方结合 DNA，基序通常用位置权重矩阵（PWM）概括。用 PWM 扫描序列，恰好就是独热序列与 $w \times 4$ 滤波器的一维卷积，这正是卷积网络适合基因组学的原因：第一层滤波器就是基序检测器，最大池化使答案与位点所在位置无关。这里没有任何东西告诉网络基序是什么：它只看到标签，梯度下降把它最有用的滤波器塑造成植入的词（看标识图如何从噪声中变得清晰）。虚线是一个确实知道基序的参考：用真实 PWM 扫描。由于植入的位点是简并的，而随机 DNA 有时看起来也像位点，即使这样也无法达到 100%，训练后的网络最终接近它。这里只使用正链，背景是均匀的；真实模型还会扫描反向互补链，并且必须应对 GC 含量、重复序列和带噪声的实验标签。这是 DeepBind（2015）背后的思想，它从蛋白质结合实验中学习基序；Basset、Basenji 和 Enformer 等模型堆叠了多得多的层（以及注意力），从 100 kb 的序列预测染色质与表达。这个玩具只重现第一层的思想。试试更弱的基序、短基序（E-box，CACGTG，更常偶然出现）或更少的滤波器。
meanings:
- 植入的位置权重矩阵：共有碱基的概率为“强度”，其余三种平分剩余部分
- 序列 $n$ 在位置 $l$ 的碱基为 $b \in$ {A, C, G, T}；若植入了位点则标签 $y_n = 1$
- 每个 $w$ 个碱基的窗口（视图，不复制），$P = \ell - w + 1$
- 可训练滤波器：每个碱基与位置一个分数，形状与 PWM 相同
- 卷积：对 $k, b$ 求和，滤波器 $f$ 在每个位置 $p$ 打分
- 全局最大池化：任意位置的最佳匹配，因此位点可以位于任何位置
- logit，对 $f$ 求和；用二元交叉熵、自动微分和 Adam 训练（小批量 100）
- 还原为基序，如 DeepBind 所做：对每条正序列中分数超过最高分一半（$\kappa_{nf} = 1$）的最佳窗口 $p^*_{nf}$ 取平均，对 $n$ 求和
- 以比特计的信息量：位置 $k$ 处标识图堆叠的高度
- 学习矩阵与植入矩阵在最佳平移下的相关；1 = 完全相同
labels:
  motif: 植入基序：NF-κB、AP-1 或 E-box
  strength: 共有碱基的概率
  n_seq: 序列数（80% 训练 / 20% 测试）
  length: 序列长度 $\ell$
  n_filters: 滤波器数 $F$
  width: 滤波器宽度 $w$
  epochs: 训练轮数
  lr: Adam 学习率
