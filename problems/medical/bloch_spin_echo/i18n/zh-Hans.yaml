source_hash: 2ee80d9bf824
title: 布洛赫方程与自旋回波
summary: 布洛赫方程是一个叉积 $\varepsilon_{ijk} M_j \Omega_k$ 加上弛豫项。数百个失谐频率 $\Delta\omega_n$ 略有不同的等色自旋群（isochromat）在一次批量 RK4 更新中一起推进：90° 脉冲后它们呈扇形散开，信号以 $T_2^*$ 消失；接着在 $TE/2$ 施加 180° 脉冲，使它们在 $TE$ 重新聚焦成回波，而回波高度只随真正的 $T_2$ 衰减。
notes: 时间单位为 ms，频率单位为 rad/ms。单个等色自旋群除了弛豫之外保持 $\lvert\mathbf M\rvert$ 不变，但整体平均会失去相位相干：对洛伦兹分布而言，自由感应衰减遵循 $e^{-t/T_2^*}$，其中 $1/T_2^* = 1/T_2 + 1/T_2^{\prime}$。180° 脉冲把每个相位镜像翻转，原本跑在前面的自旋变成落后，于是在 $TE$ 全部重新对齐；这抵消了静态的不均匀性，却无法挽回随机的 $T_2$ 损失，所以回波高度描出 $e^{-TE/T_2}$。多个重聚焦脉冲（CPMG 序列，绕 $y$ 的 180°）产生一串回波，可用来测量 $T_2$。脉冲是短的矩形“硬”脉冲，用同一个布洛赫方程计算；远离共振的自旋重聚焦得并不完美。数值仅为示意，仅供教学，不可用于临床。试试高斯分布、更长的 $T_2^{\prime}$ 或只有一个回波。
meanings:
- 等色自旋群 $n$ 的磁化矢量，分量 $i \in \{x, y, z\}$，在旋转坐标系中
- Levi-Civita 符号：就是叉积，与洛伦兹力中的完全相同
- 旋转坐标系中的 $\gamma\mathbf B$：脉冲期间在 $xy$ 平面内的射频场 $\omega_1$，沿 $z$ 的失谐 $\Delta\omega_n$
- 重复的 $j, k$ ⇒ 求和：每个等色自旋群的进动 $\mathbf M\times\boldsymbol\Omega$
- $\mathrm{diag}(1/T_2, 1/T_2, 1/T_1)$；与 $M_{nj} - M^0_j$ 在 $j$ 上缩并
- 磁场不均匀造成的进动频率分布，宽度 $1/T_2^{\prime}$
- 接收线圈看到的量：平均横向磁化，对 $n$ 求和
labels:
  T1: 纵向弛豫 $T_1$
  T2: 横向弛豫 $T_2$
  t2_prime: 不均匀时间 $T_2^{\prime}$
  TE: 回波时间 $TE$
  n_echoes: 回波数（180° 脉冲数）
  n_spins: 等色自旋群数
  spread: 失谐线型
