source_hash: 835586f4adf3
title: 限量試劑與產率
summary: 將鋁與碘（或氮與氫）以任意比例混合：哪種反應物先用完？最多能生成多少產物？另一種剩下多少？所有量都隨單一反應進度 $\xi$ 變化，限量試劑是 $n_s/|\nu_s|$ 的最小值，而整批實驗以及起始質量的二維圖都由同一個張量運算處理。
notes: 以固定比例反應的是莫耳數，而非公克數：先把每個質量除以其莫耳質量。接著只需一個數，即反應進度 $\xi$，描述反應進行了多少：$2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$ 消耗 $2\xi$ mol 鋁與 $3\xi$ mol 碘，生成 $2\xi$ mol 碘化鋁。每種反應物最多允許 $n^0_s/|\nu_s|$ 單位的反應，其中最小者勝出：該反應物就是限量試劑，其長條會降到零。以 1.20 g Al（44.5 mmol）與 2.40 g I₂（9.46 mmol）為例，碘為限量試劑：$\xi^{\max} = 3.15$ mmol，最多 2.57 g AlI₃，並剩下 1.03 g 鋁。在圖上，虛線化學計量線的兩側，產物都只取決於一種反應物；沿著該線兩者同時用完，毫無浪費。實際產率低於理論產率（損失、副反應、無法進行到底的平衡：Haber 反應器單次通過只轉化約 15 %），而產率超過 100 % 表示產物潮濕或不純。試著改變質量、秤得的產物或反應。
meanings:
- 帶符號的化學計量數：2 Al + 3 I₂ → 2 AlI₃ 為 $-2, -3, +2$
- 重複的 $e$ ⇒ 求和：由各物種所含原子得到的莫耳質量
- 每個實驗 $b$ 起始的莫耳數（最後一個是你的實驗）
- 某反應物歸零之前的最大進度；argmin 即限量試劑
- 從 0 到 $\xi^{\max}$ 的 $K$ 個進度下的量（長條）
- 產物的理論產量，單位 g
- 產率百分比
- 起始質量網格只是更大的一批
labels:
  reaction: 反應
  mass_1: 反應物 1 的質量（Al 或 N₂）
  mass_2: 反應物 2 的質量（I₂ 或 H₂）
  measured: 秤得的產物
