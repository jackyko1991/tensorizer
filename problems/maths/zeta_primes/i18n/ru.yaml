source_hash: ba1aea4b5f9d
title: Дзета-функция Римана и простые числа
summary: 'Вычислите $\zeta(s)$ на критической прямой $\operatorname{Re} s = \frac12$ сразу для тысяч высот, найдите её первые нетривиальные нули как смены знака вещественной функции $Z(t)$ и подсчитайте простые числа булевым тензорным решетом. Затем явная формула Римана восстанавливает ступенчатую функцию $\pi(x)$ по нулям: каждый нуль добавляет одну волну, и с большим числом нулей гладкая кривая заостряется в ступеньки на простых числах.'
notes: 'Ряд $\sum n^{-s}$ сходится только при $\operatorname{Re} s > 1$; формула Эйлера–Маклорена превращает хвост в интеграл плюс поправки с числами Бернулли, что продолжает $\zeta$ на всю плоскость, кроме полюса в $s = 1$. На критической прямой $Z(t) = e^{i\theta(t)}\zeta(\frac12 + it)$ вещественна, поэтому смена знака $Z$ доказывает, что между точками лежит нуль. Вычисленные нули совпадают с опубликованными значениями $14.134725\ldots$, $21.022040\ldots$, $25.010858\ldots$ примерно до $10^{-9}$, а число найденных ниже высоты $T$ совпадает с подсчётом Римана–фон Мангольдта $N(T) \approx \theta(T)/\pi + 1$ — проверка того, что ни один не пропущен. Для сравнения показана более быстрая формула Римана–Зигеля (главная сумма плюс первая поправка): её ошибка уже на первых нулях составляет лишь от $10^{-3}$ до $10^{-2}$ и уменьшается с ростом $t$. Теорема о распределении простых чисел утверждает, что $\pi(x) \sim x/\ln x$, но $\operatorname{li}(x)$ гораздо ближе, а $R(x) = \sum_n \frac{\mu(n)}{n}\operatorname{li}(x^{1/n})$
  Римана ещё ближе (средняя панель; вычислено рядом Грама). Риман (1859) показал, что оставшаяся ошибка целиком переносится нулями: $J(x) = \sum_{p^m \le x} \frac1m$ равна $\operatorname{li}(x) - \sum_\rho \operatorname{li}(x^\rho) - \ln 2 + \int_x^\infty \frac{dt}{t(t^2-1)\ln t}$ (доказано фон Мангольдтом в 1895 году), а обращение Мёбиуса даёт $\pi(x)$. Каждая пара нулей $\rho = \frac12 \pm i\gamma$ добавляет волну амплитудой около $\sqrt{x}/(\gamma\ln x)$ с частотой $\gamma$ по $\ln x$; обрезание суммы оставляет похожую на явление Гиббса рябь около каждой ступеньки. Гипотеза Римана утверждает, что каждый нетривиальный нуль (каждый нуль с $0 < \operatorname{Re} s < 1$) имеет вещественную часть ровно $\frac12$. Она не доказана. Она проверена на компьютере для более чем $10^{12}$ нулей и эквивалентна оценке ошибки $\pi(x) = \operatorname{li}(x) + O(\sqrt{x}\ln x)$ (фон Кох, 1901). Эта программа лишь находит нули на прямой; она не может исключить нули вне её. Дополнительное чтение: H. M. Edwards,
  Riemann''s Zeta Function (1974).'
meanings:
- много высот $t$ на критической прямой сразу
- 'повторяющийся $n$ ⇒ суммирование: первые $N-1$ членов ряда Дирихле'
- поправки Эйлера–Маклорена с числами Бернулли; $(s)_{2k-1} = s(s+1)\cdots(s+2k-2)$. Справедливо для всех $s \ne 1$
- вещественная функция с теми же нулями, что и $\zeta(\frac12 + it)$; $\theta(t)$ из её асимптотического ряда
- смены знака $Z$ на сетке с шагом 0.01, затем 48 шагов бисекции сразу на всех интервалах
- 'решето Эратосфена: один срез с шагом на каждое простое $p \le \sqrt{x}$; $\pi(x)$ — его накопленная сумма'
- каждый нуль в каждой точке $x$; сопряжённые нули вместе дают $2\,\mathrm{Re}$
- 'приближение для всех $K$ сразу: по одному кадру на строку'
- функция Мёбиуса; сумма по $n$ обрывается при $x^{1/n} < 2$, потому что там $J(y) = 0$
labels:
  n_zeros: Используемые нули $K$
  x_explicit: Явная формула до $x$
  log10_x: Решето до $10^n$
