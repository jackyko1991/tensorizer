source_hash: e3fd71733e91
title: 快子与反电话
summary: 如果一个粒子的质量是虚数，$m^2 < 0$，会怎样？使用复数张量，$E^2 = p^2 + m^2$ 仍给出实数能量，但这个粒子永远比光快，而且失去能量时反而加速。对超光速世界线做批量洛伦兹变换，可以找到信号在发出之前就已到达的参考系，并闭合托尔曼的反电话回路。在场论中，$m^2 < 0$ 则意味着一个不稳定、会发生凝聚的真空，正如希格斯场那样。属推测性内容：从未观测到任何快子，而 2011 年 OPERA 的“超光速中微子”其实是一根松动的电缆。
notes: 推测性物理：快子是假想粒子。标准模型中没有任何快子型粒子，也从未有实验探测到快子。狭义相对论禁止把有质量的物体加速穿越 $c$，但它本身并不禁止永远比光快的粒子（Bilaniuk、Deshpande 与 Sudarshan 1962；Feinberg 1967，“快子”一名即由他提出）。代价是因果律。由速度 $u > c$ 的信号连接的两个事件是类空间隔的，因此它们的时间先后取决于观察者：在任何运动速度超过 $c^2/u$ 的参考系中，信号在发出前就已到达，并携带负能量。Feinberg 的重新诠释把它解读为一个沿反方向传播的正能量反快子，这保住了能量的正定性，却使“谁发出了信号”依赖于参考系。利用两个参考系就得到托尔曼的反电话（1917）：Alice 向以 $\beta$ 远离的 Bob 发送信号，Bob 在他自己的参考系中以相同速度回复。一旦 $\beta > 2u/(1+u^2)$，回复就会在 Alice 发出消息之前到达她手中，从而闭合一个因果回路。在量子场论中，负的 $m^2$ 不是快速粒子，而是一种不稳定性。场从 $V = \tfrac12 m^2\phi^2 + \tfrac14\lambda\phi^4$ 的山顶 $\phi = 0$ 滚落到 $\phi = \pm\sqrt{-m^2/\lambda}$（“快子凝聚”，能量降低 $m^4/4\lambda$），那里存在质量$^2 = 2|m^2|$ 的普通粒子。这正是希格斯场所做的事，面板在带有类哈勃摩擦的格点上展示了这一过程。真实数据：2011 年 OPERA 报告 μ 中微子在 730 km 的路程上提前 $60.7 \pm 6.9 \pm 7.4$ ns 到达，$(v-c)/c = (2.48 \pm 0.28 \pm 0.30)\times10^{-5}$（arXiv:1109.4897v1）。后来发现原因是一根连接不良的光纤电缆加上时钟漂移。修正后的结果为 $(2.7 \pm 3.1\,^{+3.4}_{-3.3})\times 10^{-6}$（v4，JHEP 10 (2012) 093），而 ICARUS 测得 $\delta t = 0.3 \pm 4.9 \pm 9.0$ ns（Phys. Lett. B 713 (2012) 17）：两者都与 $c$ 一致。若把 2011
  年的数值解读为快子，将需要 $|m| \approx 120$ MeV，那么超新星 SN1987A 的 10 MeV 中微子就会以约 12 倍的差距跑赢光，而不是在 168 000 年后与光相差仅数小时内到达（$|v-c|/c \lesssim 2\times10^{-9}$，Longo 1987）。单位：$c = 1$；信号扇形图中快子质量 $\mu = 1$。
meanings:
- 复数平方根：当 $p > \mu$ 时为实数，尽管 $m$ 与 $\gamma$ 都是虚数
- 每个观察者参考系一个洛伦兹变换（$c = 1$）
- 重复的 $b$ ⇒ 求和：同时从每个参考系观察每个信号
- 不变量 $m^2 = -\mu^2$，在每个参考系中都相同
- 快度相减：低于 $c$ 时用 $\tanh$，高于时用 $\coth$
- 回复到达 Alice 的时刻；$< t_{\mathrm{send}}$ 即闭合因果回路
- 格点场从伪真空 $\phi = 0$ 滚落（torch.roll 拉普拉斯算子，速度 Verlet 法）
labels:
  u: 快子信号速度 $u$
  beta_max: 最快观察者参考系 $\beta_\mathrm{max}$
  m2: 场的快子质量$^2$ $m^2$
  lam: 自耦合 $\lambda$
  friction: 哈勃摩擦 $\gamma$
