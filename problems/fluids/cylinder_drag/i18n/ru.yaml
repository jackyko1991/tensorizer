source_hash: fdbefecc20a0
title: 'Обтекание цилиндра: сопротивление и вихри'
summary: 'Моделирование обтекания цилиндра решёточным методом Больцмана (D2Q9). Населённости $f_{xyi}$ релаксируют к равновесию, построенному через einsum, и переносятся через torch.roll; сила на цилиндр определяется импульсом, передаваемым каждой отражающейся от него населённостью. Выше Re ≈ 47 след превращается в вихревую дорожку Кармана: сопротивление пульсирует, а подъёмная сила качается из стороны в сторону.'
notes: 'Решёточные единицы: шаг узлов и шаг по времени 1, диаметр цилиндра $D = 10$, скорость набегающего потока $U = 0.12$; вязкость $\nu = UD/\mathrm{Re}$ задаёт время релаксации $\tau = 3\nu + \tfrac12$. Модель воспроизводит уравнения Навье–Стокса, когда $U$ намного меньше решёточной скорости звука $1/\sqrt3$. На входе — фиксированное равновесие, на выходе копируется соседний узел, верх и низ периодические (ряд цилиндров с шагом $H$), а на цилиндре — полное отражение (full-way bounce-back), ступенчатое приближение окружности. Сила по обмену импульсом учитывает каждую населённость, попадающую в цилиндр: она разворачивается и потому передаёт $2 f_i\mathbf e_i$. Поскольку канал узкий ($D/H \approx 0.18$), сопротивление выше, чем в свободном потоке ($C_D \approx 1.4$ при Re = 100), а срыв вихрей немного быстрее ($St \approx 0.16$–$0.2$). Первые несколько сотен шагов — акустический переходный процесс; средние значения берите со второй половины. Небольшой боковой толчок в начале ускоряет срыв
  вихрей.'
meanings:
- 'населённости: жидкость в узле $(x, y)$, движущаяся с решёточной скоростью $i$'
- скорости D2Q9 (покой, 4 оси, 4 диагонали) и веса
- 'плотность: сумма по $i$'
- 'повторяющийся $i$ ⇒ суммирование: плотность импульса'
- скорость, спроецированная на каждое направление решётки
- 'перенос: сдвиг каждой населённости на одно звено'
- 1 там, где населённость перешла из жидкости в цилиндр
- 'обмен импульсом: сила на цилиндр (отражение разворачивает каждое попадание)'
labels:
  re: Число Рейнольдса $UD/\nu$
  steps: Шаги решёточного времени
