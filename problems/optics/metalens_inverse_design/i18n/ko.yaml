source_hash: 7c33ee10a4e7
title: 메타렌즈의 역설계
summary: 파장보다 작은 메타원자로 이루어진 평평한 메타표면이 빛에 위상 $\varphi(x)$를 새긴다. 빛은 각스펙트럼 방법(FFT 한 번)으로 전파되고, autograd와 Adam이 평평한 출발점에서 시작해 모든 메타원자를 조정하여 초점에 가능한 한 많은 파워를 모은다. 결과를 해석적 쌍곡선 렌즈와 비교하며, 두 파장을 동시에(배치로) 설계하면 색수차의 절충이 드러난다.
notes: '해석적 메타렌즈는 렌즈에서 초점까지의 모든 경로를 같은 위상으로 맞추며, $\varphi(x) = -k(\sqrt{x^2 + f^2} - f)$를 $[0, 2\pi)$로 감싼다. 메타원자는 빛을 최대 한 파장까지만 지연시킬 수 있기 때문이다(이런 종류의 가시광 메타렌즈는 Khorasaninejad et al., Science 2016이 시연했다). 여기서는 최적화기에 아무 공식도 주지 않는다. 평평한 표면에서 시작하여 FFT 기반 전파기로 초점 파워 $\eta$를 계산하고, 역전파 한 번으로 모든 메타원자 위상에 대한 기울기를 얻는다. 이는 광자 역설계에서 수반(adjoint) 방법이 주는 것과 같은 정보다. 단일 파장, 단일 초점의 경우 최적 위상은 쌍곡선 위상에 가깝고, 최적화기는 이를 재발견한다($\eta$에서는 약간 더 나을 수도 있는데, 초점이 유한한 폭을 갖고 스칼라 전파기가 광선 그림과 정확히 같지 않기 때문이다). 흥미로운 경우는 두 파장이다. 장난감 모형에서 각 메타원자는 한 파장 안으로 감싼 고정된 광경로를 더하므로, $\lambda_1 \neq \lambda_0$에서는 위상이 $\lambda_0/\lambda_1$배가 되고 감싼 경계가 더 이상 맞지 않는다. 그러면 쌍곡선 렌즈는 빨간 빛을 다른 거리에 모은다(회절 색수차). ''dual'' 설계에서는 두 파장이 손실을 나누고 최적화기가 절충점을 찾는다. $\lambda_1$에서는 나아지고 $\lambda_0$에서는 나빠진다. 단순화: 스칼라 1D 빛, 얇은 소자 위상 마스크(각 메타원자는 이웃과의 결합이 없는 이상적 위상 변환기), 완전 투과, 장난감 분산 모형, 주기 경계. 실제 역설계는 메타원자에 대해 맥스웰 방정식을 푼다. 메타표면 카메라 전체의 미분 가능한 모형은 Tseng et al.("Neural nano-optics", Nature Communications 2021)이 종단 간으로 학습했고, Li et al.이 역설계 메타표면을 개관한다(ACS Photonics 2022).
  평평한 렌즈가 한 번에 초점을 맞출 수 있는 대역폭에는 근본적인 한계가 있다(Presutti & Monticone, Optica 2020).'
meanings:
- 격자점 2048개($\Delta x = 0.05$ μm)와 그 FFT 파수
- '설계 변수: $\lambda_0$에서 파장 단위로 나타낸 각 메타원자의 위상 지연, 0.25 μm 원자당 값 하나'
- 파장 $\lambda_l$에서의 위상. $l$은 두 파장의 배치
- '복소수: 소산파 성분 $|k_x| > k$에서는 허수(감쇠)'
- 반복된 $x$ ⇒ 합, FFT로 $O(X\log X)$에 계산
- 전달 함수를 브로드캐스팅하여 모든 파장과 거리에서의 장을 한꺼번에
- '반복된 $x$ ⇒ 합: 초점 $|x| < \lambda_l f / D$ 안의 파워'
- 'FFT를 통과하는 autograd: 공짜로 얻는 수반 방법'
labels:
  design: 두 파장(dual) 또는 $\lambda_0$만을 위한 설계
  wavelength: 설계 파장 $\lambda_0$
  wavelength2: 두 번째 파장 $\lambda_1$
  focal_length: 초점 거리 $f$
  diameter: 렌즈 지름 $D$
  n_iter: Adam 반복 횟수
  lr: Adam 학습률(단계당 파장)
