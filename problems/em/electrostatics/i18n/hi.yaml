source_hash: 6a76aa67658c
title: स्थिरवैद्युत विभव (पॉयसन समीकरण)
summary: एक भूसंपर्कित (grounded) बॉक्स के अंदर कुछ रेखीय आवेशों के विभव के लिए पॉयसन समीकरण हल करें। ग्रिड पर लाप्लासियन $\partial_i\partial_i$ एक आव्यूह बन जाता है, जो 1D द्वितीय-अंतर आव्यूह से क्रोनेकर गुणनफल द्वारा बनता है, इसलिए पूरा PDE एक रैखिक निकाय $L\phi = -\rho/\varepsilon_0$ बन जाता है जिसे torch.linalg.solve एक ही कॉल में हल करता है।
notes: 'बॉक्स इकाई वर्ग है जिसकी दीवारों पर $\phi = 0$ (भूसंपर्कित)। समस्या 2D है, इसलिए हर "बिंदु" आवेश वास्तव में एक अनंत रेखीय आवेश $\lambda$ (प्रति इकाई लंबाई) है और गाउस का नियम $\oint \mathbf E\cdot\mathbf n\,dl = \lambda/\varepsilon_0$ बन जाता है। मात्रक: $\varepsilon_0 = 1$। $L$ में अधिकतर शून्य हैं — असली कोड इसे sparse आव्यूह के रूप में रखेगा; यहाँ $N^2\times N^2$ dense आव्यूह भी सीधे हल करने लायक छोटा है।'
meanings:
- ग्रिड पंक्ति $a$ ($y$) और स्तंभ $b$ ($x$) पर विभव
- 'वही मान चपटे (flatten) करके: $m = a\cdot N + b$'
- '1D $\partial^2$: $(\phi_{a-1} - 2\phi_a + \phi_{a+1})/h^2$, त्रिविकर्णी (tridiagonal)'
- '2D लाप्लासियन $\partial_y^2 + \partial_x^2$: बैंडेड, प्रति पंक्ति पाँच शून्येतर'
- ग्रिड पर आवेश घनत्व
- 'दोहराया गया $m$ ⇒ योग: $\phi$ का विविक्त लाप्लासियन'
- केंद्रीय अंतरों से $E_i = -\partial_i\phi$, $i \in \{x, y\}$
labels:
  config: आवेश विन्यास
  n_grid: प्रति भुजा ग्रिड बिंदु
  charge: प्रति रेखा आवेश
