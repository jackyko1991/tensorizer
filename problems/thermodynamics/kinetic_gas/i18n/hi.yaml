source_hash: 673b0fc9f634
title: आदर्श गैस का अणुगति सिद्धांत
summary: सैकड़ों कठोर डिस्क एक बॉक्स में उछलती हैं। हर डिस्क एक ही चाल से शुरू होती है, फिर भी प्रत्यास्थ टक्करें ऊर्जा को तब तक फेंटती हैं जब तक चालें मैक्सवेल–बोल्ट्ज़मान वितरण का पालन न करने लगें, और डिस्कों द्वारा दीवारों को दिया गया संवेग आदर्श गैस नियम $PA = NkT$ दोहराता है।
notes: 'समानीत मात्रक: बॉक्स की भुजा 1, द्रव्यमान 1, बोल्ट्ज़मान नियतांक 1। युग्म टेंसर $N\times N$ हैं, जो कुछ सौ डिस्कों के लिए ठीक है (असली कोड cell lists का उपयोग करते हैं)। एक ही चरण में दो अन्य डिस्कों को छूने वाली डिस्क एक चरण प्रतीक्षा करती है, इसलिए हर टक्कर साफ़ द्वि-पिंड विनिमय है और ऊर्जा round-off तक संरक्षित रहती है। दाब प्रति उछाल दिया गया संवेग $2m\lvert v_\perp\rvert$ है, पूरे रन पर जोड़कर समय × दीवार की लंबाई से भाग दिया गया। यह $NkT/A$ से कुछ प्रतिशत अधिक आता है क्योंकि डिस्कें स्वयं क्षेत्रफल घेरती हैं — आदर्श गैस में पहला संशोधन, क्षेत्रफल अंश $\eta$ के लिए लगभग $(1 + \eta^2/8)/(1 - \eta)^2$।'
meanings:
- डिस्क $a$ की स्थिति, घटक $i \in \{x, y\}$
- डिस्क $a$ का वेग
- broadcasting से हर युग्म का विस्थापन एक साथ
- 'दोहराया गया $i$ ⇒ योग: हर युग्म की दूरी का वर्ग'
- $P$ टकराते युग्मों के लिए टक्कर अभिलंब पर प्रक्षेपित आपेक्षिक वेग
- कुल गतिज ऊर्जा, 2D में $NkT$ के बराबर
- 2D चाल वितरण $(mv/kT)\exp(-mv^2/2kT)$
