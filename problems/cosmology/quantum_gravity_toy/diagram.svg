<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Volume of the universe against time: classical general relativity collapses to zero volume, loop quantum cosmology bounces at a minimum volume">
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- axes -->
    <line x1="30" y1="140" x2="226" y2="140" stroke="#374151" stroke-width="2"/>
    <line x1="30" y1="140" x2="30" y2="14" stroke="#374151" stroke-width="2"/>
    <text x="214" y="156" font-style="italic">t</text>
    <text x="12" y="24" font-style="italic">V</text>
    <!-- classical collapse into the singularity (V = 0) -->
    <path d="M40,22 L128,140" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="128" cy="140" r="4" fill="#dc2626"/>
    <text x="134" y="132" font-size="12" fill="#b91c1c">singularity</text>
    <!-- LQC bounce: V = sqrt(V_B^2 + c t^2) -->
    <path d="M40,22 C80,74 104,104 128,104 C152,104 176,74 216,22" fill="none" stroke="#2563eb" stroke-width="3"/>
    <line x1="128" y1="104" x2="128" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="134" y="100" font-style="italic" fill="#1e40af">V</text>
    <text x="144" y="104" font-size="10" fill="#1e40af">B</text>
    <!-- densities -->
    <text x="98" y="64" font-size="12" fill="#b45309" font-style="italic">ρ → ρ</text>
    <text x="133" y="68" font-size="9" fill="#b45309">c</text>
    <circle cx="128" cy="104" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  </g>
</svg>
