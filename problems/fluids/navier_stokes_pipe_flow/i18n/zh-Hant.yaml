source_hash: db9343501d33
title: Navier–Stokes 圓管流
summary: 完整的不可壓縮 Navier–Stokes 方程式，應用於圓管中突然受壓力梯度推動的水。對軸向流而言非線性項恰好消失，只剩徑向擴散方程式：動量從無滑移管壁向內擴散，速度剖面在數倍 $R^2/\nu$ 的時間內長成 Hagen–Poiseuille 拋物線。
notes: 這是 Navier–Stokes 少數的精確解之一：由於流動是平行的，$(\mathbf u\cdot\nabla)\mathbf u = 0$，只剩壓力梯度與黏滯性。穩態 Hagen–Poiseuille 流有 $u_z = G(R^2 - r^2)/4\mu$、流量 $Q = \pi G R^4/8\mu$（著名的 $R^4$ 定律）與管壁剪應力 $\tau_w = GR/2$——即每單位長度的力平衡 $G\,\pi R^2 = \tau_w\,2\pi R$。啟動過程以 $e^{-\lambda_1^2\nu t/R^2}$ 趨近穩態，$\lambda_1 = 2.405$（$J_0$ 的第一個零點），因此到 $t \approx 0.6\,R^2/\nu$ 時剖面與拋物線相差僅數個百分點。初期核心像柱塞般整體移動，只有靠近管壁的流體感受到阻力——請觀察染色線。此解為層流；雷諾數超過約 2000 時，真實管流會變成紊流。
meanings:
- 只有 $u_z \ne 0$ 且 $\partial_z u_z = 0$，因此平流項恰為零
- 連續方程式自動成立：$u_z$ 沿管不變
- 從軸心（$i = 0$）到管壁（$i = N$）的徑向點
- 軸向速度 $u_z(r_i)$；管壁處 $u_N = 0$（無滑移）
- $\tfrac1r\partial_r(r\partial_r\,\cdot)$ 寫成矩陣，軸上取 $r \to 0$ 極限 $2\partial_r^2$
- 重複的 $j$ ⇒ 求和：黏滯項 $\nu\nabla^2 u_z$
- 驅動壓力梯度，單位 Pa/m
- 體積流量；穩態值 $\pi G R^4/8\mu$
- 管壁上每單位面積的阻力；穩態值 $GR/2$
labels:
  G: 壓力梯度 $G$
  R: 管半徑 $R$
  nu: 運動黏滯係數 $\nu$
  t_max: 模擬時間（以 $R^2/\nu$ 為單位）
