title: 傅里叶神经算子：学习伯格斯方程的解算子
summary: 傅里叶神经算子（FNO）不是只求解一个方程，而是从谱求解器生成的数据对中，学习粘性伯格斯方程 $u_t + u\,u_x = \nu\,u_{xx}$ 的整个映射 $u_0(x) \mapsto u(x, T)$。它的核心层是谱卷积：做傅里叶变换，用复数权重 $R_{iok}$ 逐个模态地混合通道，只保留最低的 $m$ 个模态，再变换回来。由于权重定义在傅里叶模态上，训练好的模型也能在比训练时更细的网格上运行。
notes: 训练数据是数据对 $(u_0, u(\cdot, T))$：随机的光滑初始条件（傅里叶模态 $k \le 5$ 之和，振幅按 $1/k$ 递减）及其解，由伪谱求解器在 256 个点上计算，再降采样到 64 个点用于训练。网络从未见过方程，只见过求解器的数据。张量的要点是谱卷积：rfft 之后，每个样本 $b$ 的每个通道 $i$ 变成傅里叶系数 $\hat v_{bik}$，而 einsum('bik,iok->bok') 对输入通道 $i$ 求和，但把波数 $k$ 保留为自由指标，因此每个模态都有自己的 $C\times C$ 复数矩阵 $R_{\cdot\cdot k}$。这是一个用全局、可学习核进行的卷积，在傅里叶空间中以乘积计算。较高的模态 $k \ge m$ 被截断；局部通路 $W_{oi}v_{bix}$ 和非线性函数 $\sigma$ 再把细节补回来。$R_{iok}$、$W_{oi}$、$P$ 和 $Q$ 都与网格点数无关，所以训练好的算子可以在任何多于 $2m$ 个点的网格上运行：右下方的面板把“同一组”权重用到 256 个点上（零样本超分辨率），对象是波前最陡的测试样例。64 点的预测（圆点）落在 256 点的曲线上：这种离散化不变性只是近似的，因为 $\sigma$ 会产生谐波，在不同网格上的混叠不同，但 256 点上的误差与 64 点上的误差相同。限制精度的是模型而不是网格：接近激波的解需要高于 $m$ 的模态，是最难的样例。与本主题中的 PINN 比较：PINN 把方程放进损失函数来求解“一个”问题，每换一个初始条件都必须重新训练；神经算子则从求解器数据中学习一整族问题，之后每个新预测只需一次前向传播。终端会打印这次前向传播与求解器的用时对比：这里快了几十倍，但对一维伯格斯方程来说，求解器本来就很便宜，生成数据和训练的成本要高得多。神经算子的价值在于单次模拟就要数小时（天气、湍流、多孔介质流动）且需要大量查询的场合，而且只在其训练数据的分布范围内有效。试试更少的模态 $m$、更小的训练集，或更大的 $\nu$（解更光滑，更容易学）。简化之处：只有一个输出时间 $T$、固定的随机种子、把网格位置当作普通的输入通道，且不做填充（反正定义域是周期性的）。
meanings:
- 输入函数：样本 $b$ 在 $N$ 个网格点上的 $u_0$ 和位置
- 提升：对 $f$ 求和，在每个点上把 2 个特征变成 $C$ 个通道
- 每个通道 $i$、波数 $k$ 的复数傅里叶系数
- 复数权重，每个保留的模态 $k < m$ 各有一个 $C\times C$ 矩阵：与 $N$ 无关
- 重复的 $i$ ⇒ 求和；$k$ 不求和：每个模态分别混合
- 截断：只有最低的 $m$ 个傅里叶模态通过谱卷积
- 回到任意 $N$ 个网格点：分辨率就是在这里决定的
- 局部通路，每个点都用同一个 $C\times C$ 矩阵；$\sigma$ = GELU
- 逐点的两层投影，从 $C$ 个通道得到预测的 $u(x, T)$
- 每个样本的相对 $L^2$ 误差，对批次取平均：Adam 最小化的损失函数
- 数据：伪谱求解器，积分因子 RK4 加 2/3 去混叠规则，所有样本一次计算
labels:
  nu: 粘度 $\nu$
  t_final: 输出时间 $T$
  n_train: 训练样本数（初始条件）
  modes: 保留的傅里叶模态数 $m$
  width: 通道数 $C$
  epochs: 训练轮数
  lr: Adam 学习率
