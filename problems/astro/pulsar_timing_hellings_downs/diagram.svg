<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Pulsar timing array: Earth and two distant pulsars separated by angle zeta on the sky, with a gravitational wave travelling along direction Omega across the lines of sight">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- lines of sight -->
    <line x1="120" y1="132" x2="40" y2="30" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="120" y1="132" x2="204" y2="38" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- gravitational wave fronts and propagation direction -->
    <g fill="none" stroke="#f59e0b" stroke-width="1.5">
      <path d="M14,92 q8,-6 16,0 t16,0 t16,0"/>
      <path d="M14,106 q8,-6 16,0 t16,0 t16,0"/>
      <path d="M14,120 q8,-6 16,0 t16,0 t16,0"/>
    </g>
    <line x1="64" y1="132" x2="64" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="94" font-style="italic" fill="#b91c1c">Ω̂</text>
    <!-- angle between the pulsars -->
    <path d="M106.5,114.7 A22,22 0 0 1 134.6,115.6" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="114" y="106" font-style="italic" fill="#b45309">ζ</text>
    <!-- pulsars with beams -->
    <g stroke="#1e40af" stroke-width="1.5">
      <line x1="30" y1="20" x2="50" y2="40"/><line x1="194" y1="48" x2="214" y2="28"/>
    </g>
    <circle cx="40" cy="30" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="204" cy="38" r="7" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="52" y="26" font-style="italic">p̂<tspan font-size="10" dy="3">a</tspan></text>
    <text x="178" y="24" font-style="italic">p̂<tspan font-size="10" dy="3">b</tspan></text>
    <!-- Earth -->
    <circle cx="120" cy="138" r="9" fill="#93c5fd" stroke="#374151" stroke-width="2"/>
    <text x="134" y="152" font-size="13">Earth</text>
  </g>
</svg>
