source_hash: d014ac5184c9
title: 'Хаос трёх тел: пифагорова задача'
summary: 'Задача Буррау: массы 3, 4 и 5 покоятся в вершинах треугольника 3-4-5 и хаотически танцуют, пока одна из них не будет выброшена. Двойник, стартующий на расстоянии $\delta = 10^{-6}$, интегрируется в том же тензоре (индекс прогона $k$); расстояние между ними растёт экспоненциально, $|\Delta| \propto e^{\lambda t}$, и их судьбы расходятся.'
notes: 'Самое трудное — тесные сближения: два тела пролетают друг мимо друга на расстоянии около $0.01$, где сила в $10^4$ раз больше обычной. Постоянный шаг либо взорвался бы там, либо полз бы везде остальное время, поэтому решатель использует адаптивный метод Дормана–Принса 5(4): на каждом шаге сравниваются ответы 5-го и 4-го порядка, и dt автоматически уменьшается при тесном пролёте и снова растёт после него. Сглаживание не используется, так что это точная ньютоновская гравитация с $G = 1$. Оба прогона делают общий шаг, поэтому сравниваются в одни и те же моменты. Поскольку движение хаотическое, допуск важен: при значении по умолчанию $10^{-11}$ эталон воспроизводит классический итог (Шебехей и Петерс, 1967): самое лёгкое тело ($m = 3$) выбрасывается около $t \approx 60$, а массы 4 и 5 уходят тесной двойной в противоположную сторону. Двойник, сдвинутый всего на $\delta$, полностью расходится к $t \approx 45$ и проживает другую историю. Кривая $|\Delta|$ скачет: при каждом тесном сближении
  она даёт пик, потому что двойник пролетает на мгновение раньше или позже на большой скорости, и растёт рывками. Подогнанное $\lambda$ — это средний тренд от $t = 0$ до момента, когда $|\Delta|$ навсегда остаётся выше $0.1$. Попробуйте более грубый допуск: тогда меняется судьба самого эталона — напоминание о том, что численная ошибка тоже возмущение.'
meanings:
- положение тела $a$ в прогоне $k$ ($k = 0$ эталон, $k = 1$ двойник), компонента $i$ в плоскости
- массы 3, 4, 5
- вектор от $a$ к $b$, все пары обоих прогонов через broadcasting
- 'повторяющийся $j$ ⇒ суммирование: квадрат расстояния каждой пары'
- 'повторяющийся $b$ ⇒ суммирование: полное притяжение тела $a$; по $k$ не суммируется, прогоны независимы'
- 7 наклонов стадий адаптивного шага Дормана–Принса; их комбинация «5-й минус 4-й порядок» даёт оценку ошибки
- расстояние между двойником и эталоном по координатам и скоростям
- 'наклон $\ln|\Delta|$ от $t$ до окончательного расхождения прогонов: показатель Ляпунова'
labels:
  t_max: Время моделирования
  log10_delta: Сдвиг двойника $\log_{10}\delta$
  log10_tol: Допуск ошибки $\log_{10}\mathrm{tol}$
