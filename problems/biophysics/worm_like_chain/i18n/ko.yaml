source_hash: 230765b6cfcc
title: 'DNA 늘이기: 벌레 사슬 모형'
summary: 광학 집게로 DNA 분자를 당기면 완전한 길이 근처에서 급격히 뻣뻣해지는 엔트로피 용수철처럼 저항한다. 마르코–시기아 벌레 사슬(worm-like chain) 법칙을 자유 연결 사슬과 비교하고, 굽힘 강성을 가진 단위 접선 벡터의 이산 사슬을 여러 힘 묶음에 대해 하나의 $(B, M, N, 3)$ 텐서로 한꺼번에 몬테카를로 시뮬레이션한다. 지속 길이 $P \approx 50$ nm는 접선 상관과 힘–신장 곡선 맞춤 양쪽에서 다시 얻어진다.
notes: 이중 가닥 DNA 분자는 짧은 규모에서는 뻣뻣하지만 긴 규모에서는 유연하다. 골격의 방향은 지속 길이 $P \approx 50$ nm(약 150 염기쌍)에 걸쳐 기억되었다가 잊힌다. 따라서 DNA를 곧게 펴는 데에는 결합 에너지가 아니라 엔트로피가 든다. 작은 힘에서 반응은 선형이며 $z/L \approx 2 P F / 3 k_B T$로, 쿤 길이 $b = 2P$인 어떤 고분자에서도 같다. 큰 힘에서 벌레 사슬은 모든 파장의 굽힘 모드를 펴야 하므로 $1 - z/L \approx \tfrac12 \sqrt{k_B T / F P}$로 천천히만 완전한 길이에 접근하는 반면, 단단한 마디로 된 자유 연결 사슬은 $1 - z/L \approx k_B T / F b$로 훨씬 빨리 펴진다. λ 파지 DNA 실험(Smith, Finzi, Bustamante 1992; Bustamante, Marko, Siggia, Smith 1994)은 이중 나선이 탄성적으로 늘어나기 시작하는 약 10 pN까지 벌레 사슬을 따르고, 약 65 pN 근처에서 과신장된다. 이 모형에는 둘 다 없다. 마르코–시기아 공식은 두 극한 사이의 보간식으로, 중간 신장에서 정확한 WLC와 힘이 최대 약 10 % 다르다. 시뮬레이션은 $a = 2.5$ nm 분절을 사용하므로 강성은 $K \approx 20.5$이다. 각 몬테카를로 스윕은 모든 접선을 조금씩 돌리고(국소장에서의 메트로폴리스), 이어서 각 사슬의 꼬리를 무작위 축 주위로 회전시킨다(피벗). 스윕의 전반부는 평형화이고 후반부를 평균한다. 가장 작은 힘에서는 신장이 사슬마다 크게 요동치고 천천히 이완하므로 그 점들은 흩어진다. 맞춤에는 0.5–4 pN을 사용한다. 각 점에서 마르코–시기아 식을 $P$에 대해 풀고 로그 공간에서 평균한다($\log F$에서의 최소제곱). $F \sim K k_B T / a$ 이상에서는 사슬의 이산성이 연속 법칙보다 약간 큰 신장으로 나타난다. 실험 데이터는 포함되어 있지 않다.
meanings:
- 힘 $b$로 당겨지는 사슬 $m$의 분절 $i$의 단위 접선; 사슬은 힘이 없는 WLC로 시작한다
- $F_0 = 0$과 0.02에서 10 pN까지의 힘 12개; $f_b$는 $k_B T$ 단위의 일 $F a$
- $\coth K - 1/K = e^{-a/P}$가 되도록 고른 굽힘 강성 $\kappa / k_B T$, 즉 $K \approx P/a + \tfrac12$
- 이웃한 두 접선의 당김과 $z$ 방향의 힘
- '반복된 $k$ ⇒ 합산: 접선 하나를 돌릴 때의 에너지 변화; 짝수와 홀수 분절이 번갈아 움직인다'
- '반복된 $i, k$ ⇒ 합산: 전체 굽힘 에너지, 꼬리 전체를 돌리는 피벗 이동에 사용'
- 힘 방향의 신장을 윤곽 길이로 나눈 값
- 자유 사슬의 접선 상관; 그 감쇠 길이가 $P$
labels:
  persistence: 지속 길이 $P$
  contour_length: 윤곽 길이 $L$
  chains: 힘당 사슬 수 $M$
  sweeps: 몬테카를로 스윕
