title: La conjecture de Kakeya
summary: On peut faire tourner une aiguille dans toutes les directions à l'intérieur d'un ensemble d'aire arbitrairement petite. Ce problème construit un tel ensemble (l'arbre de Perron, formé de $2^k$ triangles fins décalés latéralement) et mesure son aire exactement, ligne par ligne. Il recouvre ensuite des unions de $\delta$-tubes dans $\mathbb R^2$, $\mathbb R^3$ et $\mathbb R^4$ par des $\delta$-cubes pour estimer leur dimension. La conjecture de Kakeya affirme que de tels ensembles ont malgré tout la dimension pleine $n$. C'est démontré pour $n = 2$ et, depuis 2025, pour $n = 3$ ; pour $n \ge 4$, les seules preuves à ce jour sont des affirmations non vérifiées, générées par IA.
notes: 'En 1917, Kakeya a demandé quelle est la plus petite aire dans laquelle on peut retourner une aiguille de longueur unité. Besicovitch (1919, 1928) a découvert qu''un ensemble contenant un segment unité dans chaque direction peut être de mesure nulle, et Perron (1928) a simplifié la construction pour obtenir l''arbre dessiné ici. On découpe un triangle en $2^k$ éclats et on les fait glisser latéralement. Chaque éclat conserve ses directions, et à chaque étape de Perron le recouvrement augmente. L''aire vérifie $|\bigcup T_i| \le (\alpha^{2k} + 2(1-\alpha))|T|$ (vérifié), et le meilleur $\alpha$, trouvé en essayant 24 valeurs à la fois, la fait décroître comme $\ln k / k$. Córdoba (1977) a démontré que le $\delta$-voisinage d''un ensemble de Kakeya du plan a une aire au moins égale à $c / \log(1/\delta)$, donc cette décroissance lente est inévitable, et Davies (1971) a démontré que tout ensemble de Kakeya plan a une dimension de Hausdorff et de Minkowski égale à 2. Trois arbres tournés
  de 60° contiennent une aiguille unité dans chaque direction (l''aiguille rouge balaie 180°) ; en reliant les positions grâce à l''astuce de Pál, l''aiguille peut réellement tourner à l''intérieur d''un ensemble d''aire aussi petite qu''on veut. Dans $\mathbb R^n$, la conjecture des ensembles de Kakeya affirme que tout ensemble de ce type est de dimension $n$ : des tubes de rayon $\delta$ dans des directions $\delta$-séparées ne peuvent pas trop se chevaucher, donc leur union a un volume $\gtrsim_\varepsilon \delta^{\varepsilon}$. Les panneaux de droite comptent les $\delta$-cubes pour deux configurations (tous les tubes passant par l''origine, et des centres aléatoires). La pente de $\log N$ en fonction de $\log(1/\delta)$ tend vers $n$ dans chaque cas, comme elle le doit si la conjecture est vraie. Un ordinateur ne peut tester que des configurations particulières, jamais toutes. État (novembre 2026) : $n = 2$ démontré (Davies 1971). $n = 3$ démontré par Hong Wang et Joshua Zahl (prépublication
  2025), après la borne $(n+2)/2$ de Wolff (1995) et Katz–Łaba–Tao. Pour $n \ge 4$, le problème est ouvert dans la littérature relue par les pairs. La collection de manuscrits générés par IA publiée par OpenAI (github.com/openai/math, familles 074 et 079) affirme démontrer le cas de dimension quatre et, via la conjecture de lissage local de Sogge, toutes les dimensions. Le dépôt indique que certains de ses énoncés ont été formalisés en Lean, mais il s''agit d''affirmations produites par machine, non relues par des pairs et toujours en attente de vérification par la communauté mathématique ; cette page les traite donc comme des affirmations, et non comme des résultats démontrés. La conjecture compte bien au-delà de la géométrie : elle découle des conjectures de restriction de Fourier et de Bochner–Riesz en analyse harmonique.'
meanings:
- 'les $N = 2^k$ triangles fins de sommet $(0, 1)$ et de bases $[b_i, b_i + w_0]$ découpant $[-1/\sqrt3, 1/\sqrt3]$ : un cône de directions de 60°, chaque côté $\ge 1$'
- décalages horizontaux après $k$ étapes de Perron, pour $A$ valeurs de $\alpha$ à la fois ; chaque étape fait se toucher les cœurs voisins et pousse celui de droite vers la gauche de $(1-\alpha)(c - a)$
- l'endroit où le triangle $i$ coupe la droite horizontale à la hauteur $y$
- trier les intervalles de chaque ligne selon leur extrémité gauche ; le maximum courant des extrémités droites donne ce qui est déjà couvert
- '$i$ et $y$ répétés ⇒ sommés : la longueur exacte de l''union pour chaque ligne, moyennée sur les lignes (méthode du point milieu)'
- 'une $\delta$-grille sur les faces du cube $[-1,1]^n$, projetée sur la sphère : des directions de droites environ $\delta$-séparées'
- les cubes de côté $\delta$ rencontrés par chaque tube, échantillonnés tous les $\delta/2$ le long de celui-ci
- '$i$ répété ⇒ sommé : une clé entière par cube, si bien que compter les cubes distincts se fait en un seul tri'
- '$j$ répété ⇒ sommé : trois copies de l''arbre tournées de 0°, 60° et 120° couvrent toutes les directions'
labels:
  k_max: Étapes de Perron $k$ ($2^k$ triangles)
  n_max: Tubes jusqu'à la dimension $n$
