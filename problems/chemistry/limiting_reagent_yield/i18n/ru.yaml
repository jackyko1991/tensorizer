source_hash: 835586f4adf3
title: Лимитирующий реагент и выход в процентах
summary: 'Смешайте алюминий с йодом (или азот с водородом) в любой пропорции: какой реагент закончится первым, сколько продукта может образоваться и сколько второго реагента останется? Все количества меняются вместе с одной химической переменной (степенью протекания) $\xi$, лимитирующий реагент — минимум по $n_s/|\nu_s|$, а целый пакет опытов и двумерная карта исходных масс обрабатываются одной и той же тензорной операцией.'
notes: 'В фиксированных соотношениях реагируют моли, а не граммы: сначала разделите каждую массу на молярную массу. Затем одно число, степень протекания $\xi$, описывает, насколько продвинулась реакция: $2\,\mathrm{Al} + 3\,\mathrm{I_2} \rightarrow 2\,\mathrm{AlI_3}$ расходует $2\xi$ моль алюминия и $3\xi$ моль йода и даёт $2\xi$ моль иодида алюминия. Каждый реагент допускает не более $n^0_s/|\nu_s|$ единиц реакции, и побеждает наименьшее из этих чисел: этот реагент — лимитирующий, и именно его столбик доходит до нуля. При 1.20 g Al (44.5 mmol) и 2.40 g I₂ (9.46 mmol) лимитирует йод: $\xi^{\max} = 3.15$ mmol, не более 2.57 g AlI₃, и 1.03 g алюминия остаётся. На карте продукт зависит только от одного реагента по каждую сторону от штриховой стехиометрической линии; вдоль линии оба заканчиваются одновременно и ничего не теряется. Реальные выходы ниже теоретических (потери, побочные реакции, равновесие, не идущее до конца: один проход через реактор Габера превращает лишь около 15 %), а выход
  выше 100 % означает, что продукт влажный или загрязнённый. Измените массы, взвешенный продукт или реакцию.'
meanings:
- 'стехиометрические числа со знаком: $-2, -3, +2$ для 2 Al + 3 I₂ → 2 AlI₃'
- 'повторяющийся $e$ ⇒ суммирование: молярные массы из атомов в каждом веществе'
- исходные моли для каждого опыта $b$ (последний — ваш)
- наибольшая степень протекания до того, как какой-то реагент дойдёт до нуля; argmin — лимитирующий реагент
- количества при $K$ степенях протекания от 0 до $\xi^{\max}$ (столбики)
- теоретический выход продукта в g
- выход в процентах
- сетка исходных масс — просто пакет побольше
labels:
  reaction: Реакция
  mass_1: Масса реагента 1 (Al или N₂)
  mass_2: Масса реагента 2 (I₂ или H₂)
  measured: Взвешенный продукт
