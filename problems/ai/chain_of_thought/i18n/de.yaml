source_hash: 71b446fca9cd
title: Warum eine Gedankenkette einem Transformer hilft
summary: 'Die Parität von $n$ Bits ist ein laufendes XOR, eine von Natur aus serielle Aufgabe. Identische winzige Transformer (von Hand geschriebene einsum-Attention, alle Modelle auf einer Modellachse gestapelt und in einem Lauf trainiert) lernen sie in zwei Formaten: sofort antworten, "$b_1 \dots b_n = p$", oder zuerst die laufenden Paritäten schreiben, "$b_1 \dots b_n : s_1 \dots s_n = p$". Bei gleichen Gewichten und Schritten beantworten die Scratchpad-Modelle 98–100 % der Testfolgen bei $n = 4$ bis $10$ richtig, während die direkten Modelle nur $n = 4$ fitten und darüber auf oder unter Zufallsniveau liegen; die Attention zeigt die Zwei-Token-Regel $s_k = s_{k-1} \oplus b_k$. Ein Spielzeugmodell des Mechanismus, nicht dafür, wie große Sprachmodelle schlussfolgern.'
notes: 'Status: Der gezeigte Effekt ist gesichert. Parität ist der Lehrbuchfall einer schweren Aufgabe für einen Transformer fester Tiefe, der sofort antworten muss. Li, Liu, Zhou und Ma (ICLR 2024, arXiv 2402.12875) beweisen, dass Transformer konstanter Tiefe ohne Zwischenschritte auf flache parallele Schaltkreise beschränkt sind ($\mathrm{TC}^0$-artig, unter ihren Präzisionsannahmen), während $T$ Schritte Gedankenkette es ihnen erlauben, einen seriellen Schaltkreis der Größe $T$ zu simulieren. Nye et al. (2021, arXiv 2112.00114) trainierten Transformer darauf, ein "Scratchpad" mit Zwischenergebnissen zu schreiben, und sahen sie mehrstufige Aufgaben wie schriftliche Addition und das Nachverfolgen von Programmen lösen; Wei et al. (2022, arXiv 2201.11903) prägten den Begriff Chain-of-Thought-Prompting für große Sprachmodelle. Methode: Eine Folge von $n$ Bits wird entweder direkt geschrieben, "$b_1 \dots b_n = p$", oder mit ihren laufenden Paritäten, "$b_1 \dots b_n : s_1 \dots s_n = p$".
  Jedes Modell ist derselbe Decoder mit 2 Schichten, $d = 64$ und 4 Köpfen (der Code von `tiny_transformer`, mit einer Modellachse $m$ in jedem einsum), trainiert mit AdamW für dieselbe Zahl von Schritten und auf demselben Batch von Folgen; die CoT-Modelle lesen etwa doppelt so viele Token pro Folge und werden auf ihren Zwischentoken trainiert, was genau die zusätzliche Hilfe ist, die ein Scratchpad bietet. Alle Modelle, $n$ mal Format mal Seed, dazu die Modelle zur Längengeneralisierung, trainieren in einem Lauf: Ihre Gewichte sind auf der ersten Achse gestapelt und das Gradient Clipping erfolgt pro Modell, sodass sie sich nie gegenseitig beeinflussen (ein Test prüft das). Daten: Für $n \ge 8$ wird ein Viertel der $2^n$ Folgen (höchstens 1024) zurückgehalten und nie zum Training verwendet; für $n = 4$ und $6$ gibt es zu wenige Folgen, um welche zurückzuhalten, daher messen diese Genauigkeiten (im Plot mit Stern markiert) das Fitten, nicht die Generalisierung. Beim Test schreibt ein CoT-Modell
  sein Scratchpad selbst, greedy, Token für Token, und nur seine Endantwort wird bewertet. Urteil, mit dem Standardlauf (2 Seeds, Zahlen im Terminal ausgegeben): (a) Die CoT-Modelle beantworten 0.98 bis 1.00 der Testfolgen richtig bei $n = 4, 6, 8, 10$; die direkten Modelle fitten die 16 Folgen von $n = 4$ (1.00), erreichen aber 0.53, 0.27 und 0.53 bei $n = 6, 8, 10$. Eine plausible Deutung des Werts unter Zufallsniveau bei $n = 8$ (hier nicht getestet): Eine zurückgehaltene Folge unterscheidet sich von ihren Trainingsnachbarn in einem Bit und hat daher die entgegengesetzte Parität, und ein Modell, das zwischen Nachbarn interpoliert, liegt falsch. (b) Die Längengeneralisierung scheitert bei beiden: Modelle, die auf $1 \le n \le 8$ trainiert wurden, erreichen 0.46 bis 0.51 bei $n = 12$ und $16$, weil Positionen jenseits von 19 nie trainiert wurden und beim hier verwendeten CoT-Layout das Bit $b_k$ $n + 1$ Stellen vor der Zelle steht, die es braucht, ein Abstand, der sich mit $n$ ändert; die
  CoT-Modelle mit gemischten Längen meistern $n = 4$ (1.00), aber nicht einmal $n = 8$ (0.56) im Schrittbudget. (c) Wird das Scratchpad nach $k$ Schritten ausgeblendet, fällt die Antwort für jedes $k < n$ auf Zufallsniveau: Die Antwort wird aus der letzten Zelle kopiert, also steckt die gesamte Berechnung in den geschriebenen Token. (d) Im CoT-Modell bei $n = 8$ legt bei jedem Schritt $k$ irgendein Kopf 0.5 bis 0.8 der Attention der Query, die $s_k$ schreibt, auf $b_k$, gegenüber 0.08 bei uniformer Attention (ein einzelner Kopf erreicht im Mittel über die Schritte 0.48; die Köpfe teilen sich die Schritte). Der andere Eingang der Regel, $s_{k-1}$, ist das Query-Token selbst und erreicht die Ausgabe über den Residualstrom, also ist die gelernte Regel lokal: zwei Token pro Schritt. Grenzen: Dies ist ein Spielzeugmodell, das den Mechanismus zeigt, nicht, wie große Sprachmodelle schlussfolgern. Es sagt nichts darüber aus, ob die geschriebenen Schritte eines großen Modells der Berechnung treu
  sind, die seine Antwort tatsächlich erzeugt; das ist eine offene Forschungsfrage. Die Ergebnisse variieren zwischen Seeds und mit dem Schrittbudget, weshalb jeder Seed geplottet wird. Probiere mehr Schritte, $n$ bis 16 oder eine einzelne Schicht.'
meanings:
- 'laufende Parität jedes Präfixes: die Scratchpad-Ziele, und $p = s_n$'
- Folgen im direkten oder im CoT-Format als Token-IDs $0, 1, :, =, \_$; mit Leerzeichen aufgefüllt, damit alle Modelle eines $n$ einen Tensor teilen
- Token- plus gelerntes Positions-Embedding, jedes Modell $m$ mit eigenen Tabellen
- wiederholtes $c$ ⇒ summiert; der Modellindex $m$ wird nicht summiert, sodass $M$ unabhängige Transformer in einem Produkt laufen
- 'kausale Attention: Jede Zeile ist eine Wahrscheinlichkeitsverteilung über die Positionen $j \le i$'
- 'welche nächsten Token trainiert werden: $p$ allein (direkt) oder $s_1 \dots s_n$, "=" und $p$ (CoT)'
- Mittelwert von $-\log p$ über die trainierten Token von Modell $m$ (nats); ihre Summe wird minimiert, und jeder Term erreicht nur seine eigenen Gewichte
- beim Test schreibt das Modell sein Scratchpad selbst, ein Token pro Vorwärtsdurchlauf, und antwortet danach
