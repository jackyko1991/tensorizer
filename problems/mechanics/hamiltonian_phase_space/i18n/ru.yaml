title: 'Гамильтонова механика: фазовое пространство и симплектическое интегрирование'
summary: Запишите гамильтониан маятника $H(q, p)$ один раз, и torch.autograd выдаст уравнения Гамильтона $\dot z_a = J_{ab}\,\partial H/\partial z_b$. Целый веер орбит и «капля» Лиувилля движутся как один тензор, а симплектический метод leapfrog соревнуется с явным методом Эйлера и RK4 на протяжении многих периодов.
notes: 'Сепаратриса $H = mgL$, то есть $p = \pm 2mL\sqrt{gL}\cos(q/2)$, отделяет либрации (замкнутые петли) от вращений (волнистых линий, уходящих вправо и возвращающихся слева). Вблизи неё период неограниченно растёт, поэтому внутренний край капли обгоняет внешний: она вытягивается в тонкую спираль, но её площадь остаётся прежней (теорема Лиувилля). Leapfrog имеет лишь второй порядок, однако его ошибка энергии остаётся ограниченной сколь угодно долго, потому что он точно сохраняет близкий «теневой» гамильтониан; RK4 гораздо точнее на шаге, но его ошибка неуклонно растёт, а явный метод Эйлера умножает площадь в фазовом пространстве примерно на $1 + \omega^2\Delta t^2$ за шаг, и энергия взрывается. Попробуйте больший $\Delta t$ или гармоническую систему, где капля просто вращается как твёрдое тело.'
meanings:
- 'точка фазового пространства $b$: угол $q$ и угловой момент $p$; каждая точка орбиты и капли — одна строка'
- гамильтониан — единственная физика, введённая вручную
- градиент суммы даёт каждой независимой точке её собственный градиент
- 'симплектическая матрица $[[0, I], [-I, 0]]$: поворачивает градиент на 90°'
- 'повторяющийся $c$ ⇒ суммирование: уравнения Гамильтона сразу для всех точек'
- 'толчок–дрейф–толчок (Штёрмер–Верле): каждый подшаг — сдвиг, поэтому площадь сохраняется точно'
- 'явный метод Эйлера для сравнения: растягивает фазовое пространство на каждом шаге'
- площадь многоугольника капли; по Лиувиллю она постоянна
