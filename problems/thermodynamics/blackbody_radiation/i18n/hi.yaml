title: कृष्णिका विकिरण
summary: प्लांक का नियम हर तरंगदैर्ध्य पर ऊष्मीय विकिरण का ऊर्जा घनत्व देता है। तापों के एक स्तंभ को तरंगदैर्ध्यों की एक पंक्ति के विरुद्ध broadcast करने पर पूरी $(T, \lambda)$ स्पेक्ट्रम तालिका एक पंक्ति में बन जाती है; argmax वीन का शिखर ढूँढता है और torch.trapezoid स्पेक्ट्रम को समाकलित करके स्टेफ़न–बोल्ट्ज़मान $T^4$ नियम देता है।
notes: 'तरंगदैर्ध्य ग्रिड 10 nm से 100 µm तक लघुगणकीय है, इतना चौड़ा कि छूटे हुए सिरे समाकल को $10^{-5}$ से कम बदलते हैं, और सटीकता के लिए गणना float64 में expm1 के साथ होती है। वीन नियतांक $b \approx 2.898\times 10^{-3}$ m·K argmax से ग्रिड विभेदन (लगभग 0.2 %) तक सही निकलता है। वक्र का रंग स्पेक्ट्रम को लाल, हरे और नीले के प्रतिनिधि तीन तरंगदैर्ध्यों पर नमूनित करता है — असली रंग-मिलान गणना का मोटा विकल्प, पर यह चमक को नारंगी से सफ़ेद होते हुए हल्के नीले तक जाते दिखाता है। हर फ्रेम में प्लॉट का पैमाना बदला जाता है: शिखर की ऊँचाई $T^5$ की तरह बढ़ती है। छायांकित पट्टी दृश्य परास 380–750 nm दर्शाती है।'
meanings:
- तापों का बैच, स्तंभ के रूप में
- तरंगदैर्ध्य ग्रिड, पंक्ति के रूप में
- स्तंभ को पंक्ति के विरुद्ध broadcast करने से पूरी तालिका भर जाती है
- हर स्पेक्ट्रम का वीन शिखर एक साथ
- 'दोहराया गया $b$ ⇒ योग: कुल ऊर्जा घनत्व, $\propto T_a^4$'
- '610, 550 और 465 nm पर प्लांक, प्रसामान्यीकृत: एक मोटा दृश्य रंग'
labels:
  T_min: प्रारंभिक ताप
  T_max: अंतिम ताप
  n_temps: ताप (फ्रेम)
