source_hash: 5c7383dc415a
title: Quantentunneln
summary: 'Ein Gaußsches Wellenpaket trifft auf eine Rechteckbarriere. Die zeitabhängige Schrödinger-Gleichung wird mit der Split-Step-Fourier-Methode gelöst: Das Potential ist ein diagonaler Operator im $x$-Raum und die kinetische Energie ein diagonaler Operator im $k$-Raum, sodass jede Hälfte eines Zeitschritts nur eine elementweise Tensormultiplikation ist, wobei torch.fft zwischen den beiden Basen wechselt.'
notes: Einheiten $\hbar = m = 1$, Paketenergie $E \approx k_0^2/2$. Ein diagonaler Operator $D_{xy} = d_x\,\delta_{xy}$, angewendet auf $\psi$, ist $D_{xy}\psi_y = d_x\psi_x$ — keine Matrix nötig, nur eine elementweise Multiplikation. Die Strang-Zerlegung $P\cdot K\cdot P$ ist von zweiter Ordnung in $\Delta t$ und exakt unitär, sodass die Norm bis auf Rundungsfehler 1 bleibt. Die simulierte Zeit wird automatisch gewählt ($45/k_0$), sodass der Paketschwerpunkt von $x = -25$ bis etwa $x = +20$ läuft. Für $E < V_0$ würde ein klassisches Teilchen immer zurückprallen; der transmittierte Anteil rechts ist Tunneln. Der zum Vergleich ausgegebene Transmissionskoeffizient $T(k_0)$ für ebene Wellen ignoriert die Impulsbreite des Pakets (und verwendet die Barrierenbreite, wie sie auf dem Gitter landet); ein breiteres Paket (größeres $\sigma_0$) hat einen schärferen Impuls und stimmt besser damit überein.
meanings:
- Wellenfunktion auf dem periodischen Gitter $x$
- 'Potentialoperator für einen halben Schritt: diagonal in $x$, angewendet als psi * P'
- 'kinetischer Operator für einen ganzen Schritt: diagonal in $k$, angewendet als psi_k * K'
- Basiswechsel $x \to k$ (ein schnelles Matrixprodukt, nie explizit aufgebaut)
- 'Transmission: Wahrscheinlichkeit rechts der Barriere'
labels:
  k0: Impuls des Pakets $k_0$
  V0: Barrierenhöhe $V_0$
  width: Barrierenbreite $a$
  sigma: Paketbreite $\sigma_0$
