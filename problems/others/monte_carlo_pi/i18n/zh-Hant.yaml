source_hash: a88c161966b6
title: 蒙地卡羅：用隨機飛鏢估計 $\pi$
summary: 向單位正方形隨機投擲飛鏢，數一數有多少落在四分之一圓內：這個比例會趨近 $\pi/4$。許多獨立實驗在一個 $(B, N)$ 張量中並排進行，展現蒙地卡羅的根本定律：誤差只以 $1/\sqrt N$ 的速度縮小。布豐投針則提供第二種、來自 18 世紀的估計。
notes: 每個估計平均而言都正確但帶有雜訊，而雜訊只以 $1/\sqrt N$ 下降：多一位正確數字需要一百倍的飛鏢。這個速率與維度無關，因此蒙地卡羅是多變數積分的首選方法，從中子傳輸、伊辛模型到選擇權定價與醫學劑量學中的光子路徑皆然。灰色曲線是單次實驗：每條都在遊走，但都停留在 $\sigma_N$ 所定的帶狀範圍內。固定的亂數種子讓每次執行都可重現；試著增加實驗次數，看看離散程度如何更貼近理論。
meanings:
- 實驗 $b$ 的第 $n$ 支飛鏢、座標 $i$，在 $[0, 1)$ 上均勻分布
- 重複的 $i$ ⇒ 求和：到角落的距離平方；飛鏢落在四分之一圓內時為 1
- 累積和除以 $n$：每支飛鏢之後、每個實驗的估計值
- 各實驗間的離散程度；理論值 $\sqrt{\pi(4-\pi)/n}$ 來自二項分布變異數
- 布豐投針：以機率 $2\ell/(\pi d)$ 與直線相交，故 $\hat\pi = 2\ell N/(d\,\text{crossings})$
labels:
  n_darts: 每次實驗的飛鏢數 $N$
  n_experiments: 實驗次數 $B$
  needle_length: 針長 $\ell/d$
