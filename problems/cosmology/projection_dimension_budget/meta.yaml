title: 'How many dimensions? The budget of the projection hypothesis'
category: cosmology
level: advanced
order: 15
tags: [series:projection-hypothesis:3, role:theory, speculative]
summary: >
  A speculative hypothesis, not established physics: how many hidden dimensions does the projection idea need, and
  how many do experiments allow? The quantum side, from step 1, needs one hidden complex dimension per outcome and
  $2^N$ for $N$ entangled particles, but these live in Hilbert space and need not be directions in space. On the
  gravity side, $n$ compact dimensions of radius $R$ change Newton's law below $R$. Torsion balances, the LHC and
  supernova and neutron-star bounds fill an $(n, R)$ map bound by bound. Every $n$ survives, but only if $R$ is
  small: below 38.6 μm for $n = 1$ and $2\times10^{-10}$ m for $n = 2$. Constrained, not ruled out.
animated: true
vector_form: '\nabla\cdot\mathbf g = -|S^{n+2}|\,G_D\,\rho\ \Rightarrow\ \oint_{S^{n+2}}\nabla\phi\cdot d\mathbf A = |S^{n+2}|\,G_D M,\qquad g(r) = \sum_{\mathbf k\in\mathbb Z^n}\frac{G_D M\,r}{(r^2 + |2\pi R\mathbf k|^2)^{(n+3)/2}} \to \begin{cases} G_D M/r^{n+2} & r\ll R\\ G_4 M/r^2 & r\gg R\end{cases},\qquad G_4 = \frac{|S^{n+2}|\,G_D}{4\pi(2\pi R)^n},\qquad M_{Pl}^2 = 8\pi R^n M_D^{n+2},\qquad V = -\frac{G M m}{r}\big(1 + \tfrac{8n}{3}e^{-r/R}\big),\qquad \text{allowed} \iff R < R_{max}(n) = \min_b R_b(n),\qquad D_Q \geq 2^N'
index_form: 'F_r = |S^{n+2}|\,r^{n+2}\,\langle \partial_i\phi\,u_{pi}\rangle_p,\qquad g_r = \sum_I \frac{r}{(r^2 + \rho_I^2)^{(n+3)/2}},\qquad \mathrm{excl}^{(b)}_{nR} = \big[R > R_b(n)\big],\qquad R_b(n) = \Big(\frac{M_{Pl}^2}{8\pi M_{b}^{n+2}}\Big)^{1/n},\qquad \mathrm{excl}_{nR} = \bigvee_b \mathrm{excl}^{(b)}_{nR},\qquad R_{max}(n) = \min_b R_b(n)'
