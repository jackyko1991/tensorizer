title: P vs NP and the 3-SAT phase transition
category: maths
level: advanced
order: 4
tags: [millennium, smale:3, status:open]
summary: >
  Is every problem whose solutions are easy to check also easy to solve? That is the P vs NP question, open since
  1971. Random 3-SAT makes the asymmetry concrete: checking a proposed assignment is one gather and two reductions,
  while exhaustive search evaluates all $2^n$ assignments at once as one packed bit tensor, whose size doubles with
  every variable. Sweeping the clause/variable ratio $\alpha$ shows the satisfiability phase transition near
  $\alpha_c \approx 4.27$ and the search cost peaking inside the transition window.
animated: true
vector_form: 'F(\mathbf x) = \bigwedge_{m=1}^{M} \big(\ell_{m1} \lor \ell_{m2} \lor \ell_{m3}\big),\quad \ell_{mk} = x_{v_{mk}} \oplus s_{mk},\qquad \mathbb E\,\#\{\mathbf x : F(\mathbf x) = 1\} = 2^n \left(\tfrac78\right)^{M}'
index_form: '\ell_{bmk} = x_{b\,v_{bmk}} \oplus s_{bmk},\quad F_b = \bigwedge_m \bigvee_k \ell_{bmk}\qquad T^{F}_{ba} = \bigwedge_m \bigvee_k \big(T_{v_{bmk}\,a} \oplus s_{bmk}\big),\quad a = 0,\dots,2^n-1'
