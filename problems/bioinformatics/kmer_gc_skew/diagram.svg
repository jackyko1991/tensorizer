<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A circular bacterial chromosome with the replication origin at the top and the terminus at the bottom; two replication forks run in opposite directions. On the right a DNA sequence with a highlighted window of k letters.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#111827">
    <!-- double-stranded circular chromosome -->
    <circle cx="62" cy="82" r="46" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="62" cy="82" r="40" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- replication forks leaving the origin in both directions -->
    <path d="M76.5,27.9 A56,56 0 0 1 116.1,67.5" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M47.5,27.9 A56,56 0 0 0 7.9,67.5" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- origin and terminus -->
    <circle cx="62" cy="36" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="62" y="18" text-anchor="middle" fill="#b45309">ori</text>
    <circle cx="62" cy="128" r="5" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <text x="62" y="150" text-anchor="middle" fill="#374151">ter</text>
    <line x1="62" y1="41" x2="62" y2="123" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- a stretch of sequence and a window of k letters -->
    <g font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">
      <rect x="132" y="70" width="96" height="20" fill="none" stroke="#374151" stroke-width="2"/>
      <rect x="146" y="70" width="42" height="20" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <text x="139" y="84">A</text><text x="153" y="84">G</text><text x="167" y="84">C</text>
      <text x="181" y="84">G</text><text x="195" y="84">G</text><text x="209" y="84">T</text><text x="223" y="84">A</text>
    </g>
    <line x1="146" y1="62" x2="188" y2="62" stroke="#f59e0b" stroke-width="2"/>
    <line x1="146" y1="58" x2="146" y2="66" stroke="#f59e0b" stroke-width="2"/>
    <line x1="188" y1="58" x2="188" y2="66" stroke="#f59e0b" stroke-width="2"/>
    <text x="167" y="54" text-anchor="middle" font-style="italic" fill="#b45309">k</text>
  </g>
</svg>
