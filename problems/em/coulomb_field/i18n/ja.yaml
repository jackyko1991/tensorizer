source_hash: 1470d7e1b6a9
title: 点電荷の電場
summary: 格子上でのクーロンの法則と重ね合わせ。ブロードキャストにより、各電荷から各格子点への変位ベクトルを一度に作り、電荷の添字にわたる1回の einsum でそれらの電場を足し合わせる。1つの電荷が円周上を動き、電気力線がそれに追従する。
notes: $k = 1$ とする単位系。電荷は3次元の点電荷なので、各電場は $1/r^2$ で減衰する。ここでは電荷を含む平面だけを見る。矢印は正電荷（赤）から外向き、負電荷（青）へ向かう。同符号の電荷が2つあると、その間に電場が0となる中性点が現れる。
meanings:
- 格子点 $g$、成分 $i \in \{x, y\}$
- 電荷 $q$ の位置
- 各電荷の値
- ブロードキャスト：各電荷から各格子点へのベクトル
- 繰り返される $j$ ⇒ 和をとる：距離
- 繰り返される $q$ ⇒ 和をとる：全電荷の重ね合わせ
labels:
  q_fixed: 固定電荷
  q_moving: 移動電荷
  n_grid: 一辺あたりの矢印数
