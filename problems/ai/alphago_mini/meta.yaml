title: 'AlphaGo in miniature: tree search on a $5\times5$ Go board'
category: ai
level: advanced
order: 2
tags: [turing:2024, series:ai-milestones:2]
summary: >
  One self-play game of Go on a tiny board, chosen by the same search AlphaGo used: Monte Carlo tree search with the
  PUCT rule. The Go rules themselves are tensor operations: captures and the area score are flood fills, one einsum
  with the board's adjacency matrix per step. Each new position is judged by a whole batch of random games played at
  once. Watch the visit counts concentrate on the move the search believes in.
animated: true
vector_form: 'a^* = \arg\max_a \Big[Q(s,a) + c\,P(s,a)\,\frac{\sqrt{\sum_b N(s,b)}}{1 + N(s,a)}\Big],\qquad \pi(a\,|\,s) = \frac{N(s,a)}{\sum_b N(s,b)}'
index_form: 'r_{bp} \leftarrow r_{bp} \lor \big(s_{bp} \land [A_{pq}\,r_{bq} > 0]\big),\qquad U_a = Q_a + c\,P_a\,\frac{\sqrt{N_b \mathbf 1_b}}{1 + N_a},\qquad v = \frac1R\sum_{r=1}^{R}\operatorname{sign}\big(\text{score}_r - k\big)'
translation:
  - {symbol: 'X_p', code: 'empty_board(n)', shape: '(n²,)', meaning: 'point $p$ of the board: $+1$ black, $-1$ white, 0 empty'}
  - {symbol: 'A_{pq}', code: 'adjacency(n)', shape: '(n², n²)', meaning: 'the board as a graph: 1 when $p$ and $q$ are horizontal or vertical neighbours'}
  - {symbol: 'r \leftarrow r \lor (s \land A r)', code: "reach(seed, allowed, A)  # einsum('pq,bq->bp', A, r)", shape: '(B, n²)', meaning: 'flood fill: from the empty points through a colour finds the groups with a liberty; the rest is captured'}
  - {symbol: '\text{score}_b', code: 'score(board, A, komi)', shape: '(B,)', meaning: 'area scoring: stones plus empty points only that colour can reach, black minus white minus komi $k$'}
  - {symbol: 'v', code: 'playouts(board, player, A, R, depth, komi)', shape: '()', meaning: '$R$ random games played as one $(R, n^2)$ tensor; mean result for black; never filling one''s own eye'}
  - {symbol: 'U_a', code: 'puct(q, prior, visits, c)', shape: '(moves,)', meaning: 'PUCT: value $Q_a$ plus an exploration bonus that shrinks as move $a$ is visited; uniform prior $P_a$'}
  - {symbol: '\pi_a = N_a / \sum_b N_b', code: 'search(root, A, sims, ...)', shape: '(n²+1,)', meaning: 'visit counts after all simulations (last entry: pass); the most visited move is played'}
notes: >
  Each simulation walks down the tree choosing the PUCT maximum, adds one new position, scores it with the batch of
  random playouts and adds that result to every move on the path. Good moves collect visits, so the search
  concentrates where it matters without looking at every line. AlphaGo used the same loop but replaced the uniform
  prior $P_a$ with a policy network and the random playouts with a value network, both trained on games; AlphaGo
  Zero learned both purely from self-play. On $5\times5$ the centre opening is strong for black, and with few
  simulations the search makes visible mistakes; raise the simulations and the game gets sharper but slower.
  Rules: Tromp–Taylor (suicide removes one's own group, area scoring) with a simple ko check.
params:
  board_size: {default: 5, min: 4, max: 7, step: 1, type: int, label: 'Board size $n$'}
  simulations: {default: 48, min: 8, max: 400, step: 8, type: int, label: Simulations per move}
  rollouts: {default: 32, min: 4, max: 256, step: 4, type: int, label: 'Random playouts per leaf $R$'}
  c_puct: {default: 1.5, min: 0.1, max: 5.0, step: 0.1, label: 'Exploration $c$'}
  komi: {default: 2.5, min: 0.5, max: 9.5, step: 1.0, label: 'Komi $k$'}
