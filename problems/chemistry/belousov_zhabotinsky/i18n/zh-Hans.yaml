source_hash: 8b3f5bebfbdf
title: Belousov–Zhabotinsky 振荡器（Oregonator 模型）
summary: 一杯搅拌中的溴酸盐、丙二酸和铈催化剂溶液像时钟一样在颜色之间来回翻转。无量纲化的双变量 Oregonator 是一个刚性常微分方程；正值的生成–消耗（Patankar）步进一次积分整批化学计量因子 $f$，雅可比矩阵的迹定出界定振荡范围的两个 Hopf 分岔，而同样的动力学加上扩散，则把一道断裂的波变成旋转的螺旋波。
notes: Belousov–Zhabotinsky 反应（Belousov 于 1950 年代发现，Field、Kőrös 和 Noyes 于 1972 年给出解释）用溴酸盐氧化丙二酸。溴离子抑制 $\mathrm{HBrO_2}$ 的自催化生成；只要有溴离子存在，反应就缓慢进行，一旦溴离子耗尽，$\mathrm{HBrO_2}$ 便爆发式增长并氧化催化剂（颜色变化），而被氧化的催化剂又会生成新的溴离子，从而终止这次爆发。Oregonator 把这一过程浓缩为几个步骤，经过无量纲化并消去快速变化的溴离子后，只剩两个方程。常数 $\varepsilon \approx 0.04$ 和 $q \approx 8\times10^{-4}$ 是根据 Field–Kőrös–Noyes 速率常数拟合得到的近似值；配方不同，文献值也各不相同。由于 $\varepsilon$ 和 $q$ 很小，$x$ 方程是刚性的：$x$ 在 $\varepsilon$ 量级的时间内跃变约一千倍，然后沿其零斜率线的一支缓慢爬行。普通 RK4 需要约 $5\times10^{-4}$ 的步长才能保持稳定；把 $\varepsilon\dot x$ 写成生成减去消耗并隐式处理消耗项，可在任意步长下保持 $x$ 为正，而 $\Delta t = 2\times10^{-3}$ 就能使周期误差小于 1 %。当稳态（两条零斜率线的交点）位于 N 形 $\dot x = 0$ 曲线的外侧分支上时它是稳定的，位于中间分支上时则不稳定，被一个极限环包围；$J$ 的迹在两个 Hopf 点处变号，对小 $q$ 而言约在 $f = 0.5$ 和 $f = 2.4$ 附近。试试更大的 $\varepsilon$：振荡窗口缩小并最终关闭。在不搅拌的薄层中，催化剂固定不动而 $\mathrm{HBrO_2}$ 扩散，于是一道氧化波扫过培养皿；断裂的波前在自由端卷曲成著名的旋转螺旋波，其旋转周期比整体振荡更短，因此它会占据整个介质。
meanings:
- 反应 $b$ 的化学计量因子（每还原一个催化剂生成的溴离子数），从 $0.3$ 到 $3$
- 每个反应的无量纲 $[\mathrm{HBrO_2}]$（自催化剂）和 $[\mathrm{Ce^{4+}}]$（氧化态催化剂）
- 非负的生成与消耗速率，$\varepsilon\dot x = P - Lx$
- Patankar–Euler：消耗隐式、生成显式，因此无论多刚性 $x$ 都保持为正
- $x^2 + (f + q - 1)x - q(1 + f) = 0$ 的正根
- 稳态处的线性化动力学 $\partial \dot y_\alpha / \partial y_\beta$
- 重复的 $\alpha$ ⇒ 求和：迹；其变号标志着 Hopf 分岔
- 相图中 N 形的 $\dot x = 0$ 曲线
- 无通量边界的五点模板；在二维介质中只有 $x$ 扩散
labels:
  f: 相图与螺旋波的化学计量因子 $f$
  eps: 时间尺度比 $\varepsilon$（近似）
  t_max: 模拟时长
  spiral: 二维螺旋波
  grid: 网格尺寸 $n$
